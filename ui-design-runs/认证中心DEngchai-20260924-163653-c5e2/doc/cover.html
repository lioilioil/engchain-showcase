<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程信任通行证 · 封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:grid;place-items:center;min-height:100vh}
.cover{
  --ink:#0E171D;
  --paper:#F2EEE4;
  --acc:#C6A05B;
  --gold-hi:#E3C885;
  --mono:'Barlow','PingFang SC',sans-serif;
  position:relative;width:1600px;height:900px;overflow:hidden;
  background:var(--ink);color:var(--paper);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  isolation:isolate;
}
.cover::before{content:"";position:absolute;inset:0;z-index:0;opacity:.08;
  background:repeating-linear-gradient(90deg,var(--paper) 0 1px,transparent 1px
    calc(100% / 12))}
.cover::after{content:"";position:absolute;z-index:0;width:820px;height:820px;
  right:-260px;top:-300px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--acc) 0%,transparent 62%);opacity:.20}
.folio{position:absolute;z-index:1;right:-1vw;bottom:-9vh;line-height:.78;
  font:800 clamp(250px,29vw,480px)/1 var(--mono);color:var(--paper);opacity:.05;
  letter-spacing:-.04em;pointer-events:none}
.art{position:absolute;inset:0;z-index:0;background:var(--art) 64% center/cover no-repeat}
.scrim{position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg,rgba(10,18,23,.55) 0%,rgba(10,18,23,0) 34%,rgba(10,18,23,.92) 100%),
    linear-gradient(90deg,rgba(10,18,23,.94) 0%,rgba(10,18,23,.6) 40%,rgba(10,18,23,.18) 66%,rgba(10,18,23,.5) 100%)}
.body{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  justify-content:space-between;padding:76px 84px}
.meta{display:flex;justify-content:space-between;gap:24px;
  font:600 13px/1.6 var(--mono);letter-spacing:.28em;color:var(--gold-hi);opacity:.92}
.subject{font-size:clamp(56px,5.8vw,92px);font-weight:800;line-height:1.04;
  letter-spacing:-.02em;max-width:16em}
.thesis{margin-top:24px;font-size:21px;line-height:1.65;max-width:30em;
  color:rgba(242,238,228,.84)}
.rule{height:2px;background:var(--acc);margin:0 0 30px;width:128px}
.cover.cinematic-field .subject{max-width:18em}
</style>
</head>
<body>
<div class="cover cinematic-field" data-doc-cover-root
     style="--art:url(hero-medal.jpg)">
  <div class="art"></div>
  <div class="scrim"></div>
  <div class="folio">01</div>

  <div class="body">
    <div class="meta"><span>ENGCHAIN · AUTH CENTER</span><span>产品界面深度重设计</span></div>
    <div>
      <div class="rule"></div>
      <div class="subject">工程信任通行证</div>
      <div class="thesis">把认证中心，从一张待办清单，重做成一张会成长、可展示的信任资产。</div>
    </div>
    <div class="meta"><span>2026 · 09 · 24</span><span>5 项身份 · 5 种状态 · 一套勋章语言</span></div>
  </div>
</div>
</body>
</html>
