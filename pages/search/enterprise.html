<title>企业查询 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
/* ═══════════════════════════════════════════════════════════
   企业信息搜索查看 V1.0
   双模式：平台认证企业（本系统） + 工商信息查询（企查查 API Mock）
   ═══════════════════════════════════════════════════════════ */
body { background: var(--bg); }

/* 顶部搜索栏 */
.ep-header {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 16px 0;
}
.ep-search-box {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-full);
  padding: 10px 14px;
  transition: border-color .2s;
}
.ep-search-box.focus { border-color: var(--primary); }
.ep-search-box svg { width: 15px; height: 15px; color: var(--text-3); flex: none; }
.ep-search-box input {
  flex: 1; min-width: 0; border: none; outline: none;
  background: transparent; font-size: 14px; color: var(--text-1);
}
.ep-search-box input::placeholder { color: var(--text-3); }
.ep-clear {
  width: 18px; height: 18px;
  display: none; align-items: center; justify-content: center;
  border: none; background: var(--text-3); border-radius: 50%;
  cursor: pointer; color: #fff; flex: none; padding: 0;
  font-size: 11px; line-height: 1;
}
.ep-clear.show { display: flex; }
.ep-search-btn {
  padding: 9px 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: var(--text-inv); border: none; border-radius: var(--r-full);
  font-size: 12.5px; font-weight: 600; cursor: pointer; flex: none;
}
.ep-search-btn:active { opacity: .85; }

/* 内容区（滚动容器：.phone 为 overflow:hidden，内部滚动必须在此层） */
.ep-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  padding: 0 0 100px;
}

/* 双模式 Tab */
.ep-tabs {
  display: flex; gap: 0;
  margin: 12px 16px 0;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: 3px;
}
.ep-tab {
  flex: 1; padding: 9px 0;
  text-align: center;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-2);
  border-radius: calc(var(--r-m) - 2px);
  cursor: pointer;
  transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.ep-tab svg { width: 14px; height: 14px; }
.ep-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: var(--text-inv);
  box-shadow: 0 3px 10px -3px var(--primary-dim);
}
.ep-tab .ep-tab-badge {
  font-size: 10px; font-weight: 700;
  background: rgba(255,255,255,.25);
  padding: 1px 5px; border-radius: 999px;
  font-family: var(--font-num);
}
.ep-tab:not(.active) .ep-tab-badge {
  background: var(--bg-card-2); color: var(--text-3);
}

/* 数据来源提示条 */
.ep-source-tip {
  margin: 10px 16px 0;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px dashed var(--line);
  border-radius: var(--r-m);
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; color: var(--text-3);
  line-height: 1.5;
}
.ep-source-tip svg { width: 13px; height: 13px; flex: none; color: var(--text-3); }
.ep-source-tip b { color: var(--text-2); font-weight: 600; }

/* 区块标题 */
.ep-section { margin: 16px 16px 0; }
.ep-section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.ep-section-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
.ep-section-clear {
  font-size: 11.5px; color: var(--text-3);
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 3px;
}
.ep-section-clear:active { color: var(--text-2); }
.ep-section-clear svg { width: 12px; height: 12px; }

/* 历史标签 */
.ep-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.ep-tag {
  padding: 6px 12px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-full);
  font-size: 12px; color: var(--text-2);
  cursor: pointer; transition: all .15s;
}
.ep-tag:active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dim); }

/* 热门搜索 */
.ep-hot-list { display: flex; flex-direction: column; gap: 0; }
.ep-hot-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .15s;
}
.ep-hot-item:last-child { border-bottom: none; }
.ep-hot-item:active { background: var(--bg-card); }
.ep-hot-rank {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; font-family: var(--font-num);
  flex: none;
}
.ep-hot-rank.top1 { color: var(--error); }
.ep-hot-rank.top2 { color: var(--warning); }
.ep-hot-rank.top3 { color: var(--primary-dim); }
.ep-hot-rank.normal { color: var(--text-3); }
.ep-hot-text {
  flex: 1; min-width: 0;
  font-size: 13px; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 结果计数 */
.ep-result-count {
  margin: 14px 16px 10px;
  font-size: 12px; color: var(--text-3);
}
.ep-result-count b { color: var(--primary-dim); font-weight: 600; }

/* ═══ 平台认证企业卡片 ═══ */
.ep-cert-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 14px 16px;
  margin: 0 16px 10px;
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  transition: transform var(--d-fast), border-color var(--d-fast);
  display: block; text-decoration: none; color: inherit;
}
.ep-cert-card:active { transform: scale(.985); }
.epcc-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.epcc-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: var(--r-full);
}
.epcc-badge.verified { background: var(--success-soft); color: var(--success); }
.epcc-badge.verified svg { width: 10px; height: 10px; }
.epcc-badge.level { background: var(--primary-soft); color: var(--primary-dim); }
.epcc-badge.cat { background: var(--bg-card-2); color: var(--text-2); }
.epcc-match { margin-left: auto; font-family: var(--font-num); font-size: 11px; font-weight: 700; color: var(--primary-dim); background: var(--primary-soft); padding: 2px 8px; border-radius: var(--r-full); }
.epcc-name {
  font-size: 14.5px; font-weight: 700; color: var(--text-1);
  line-height: 1.35; margin-bottom: 6px;
}
.epcc-meta {
  display: flex; align-items: center; gap: 12px;
  font-size: 11.5px; color: var(--text-3);
  flex-wrap: wrap; margin-bottom: 10px;
}
.epcc-meta span { display: flex; align-items: center; gap: 3px; }
.epcc-meta svg { width: 11px; height: 11px; }
.epcc-quals { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.epcc-qual {
  font-size: 11px; color: var(--primary-dim);
  background: var(--primary-soft);
  padding: 3px 8px; border-radius: var(--r-full);
  font-weight: 500;
}
.epcc-qual.more { background: var(--bg-card-2); color: var(--text-3); }
.epcc-stats {
  display: flex;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.epcc-stats .es-item { flex: 1; text-align: center; }
.epcc-stats .es-item + .es-item { border-left: 1px solid var(--line); }
.epcc-stats .es-num { font-family: var(--font-num); font-size: 16px; font-weight: 700; color: var(--primary-dim); }
.epcc-stats .es-label { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.epcc-bottom { display: flex; align-items: center; justify-content: space-between; }
.epcc-verified-note {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; color: var(--success);
}
.epcc-verified-note svg { width: 12px; height: 12px; }
.epcc-go {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 12px; font-weight: 600; color: var(--primary-dim);
}
.epcc-go svg { width: 12px; height: 12px; }

/* ═══ 工商信息卡片（企查查） ═══ */
.ep-qcc-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  margin: 0 16px 10px;
  box-shadow: var(--shadow-xs);
  overflow: hidden;
}
.epq-head {
  padding: 14px 16px 10px;
  cursor: pointer;
}
.epq-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.epq-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: var(--r-full);
}
.epq-badge.qcc { background: rgba(217,119,6,.1); color: var(--accent); }
.epq-badge.qcc svg { width: 10px; height: 10px; }
.epq-badge.status { background: var(--success-soft); color: var(--success); }
.epq-name {
  font-size: 14.5px; font-weight: 700; color: var(--text-1);
  line-height: 1.35; margin-bottom: 6px;
}
.epq-sub { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.epq-chevron {
  float: right; color: var(--text-3);
  transition: transform .25s;
  margin-top: 2px;
}
.epq-chevron svg { width: 16px; height: 16px; }
.ep-qcc-card.open .epq-chevron { transform: rotate(180deg); }

.epq-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 4px 16px 14px;
}
.ep-qcc-card.open .epq-body { display: block; }

.epq-section-title {
  font-size: 12px; font-weight: 700; color: var(--text-1);
  margin: 12px 0 8px;
  display: flex; align-items: center; gap: 5px;
}
.epq-section-title svg { width: 13px; height: 13px; color: var(--primary-dim); }
.epq-row {
  display: flex; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-hairline);
  font-size: 12px; line-height: 1.5;
}
.epq-row:last-child { border-bottom: none; }
.epq-row .k { flex: none; width: 90px; color: var(--text-3); }
.epq-row .v { flex: 1; color: var(--text-1); word-break: break-all; }
.epq-row .v .hl { color: var(--primary-dim); font-weight: 600; }

.epq-risk-strip {
  display: flex; gap: 8px; margin-top: 10px;
}
.epq-risk-item {
  flex: 1; text-align: center;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: 8px 4px;
}
.epq-risk-item .rn { font-family: var(--font-num); font-size: 16px; font-weight: 700; }
.epq-risk-item .rn.ok { color: var(--success); }
.epq-risk-item .rn.warn { color: var(--accent); }
.epq-risk-item .rn.bad { color: var(--error); }
.epq-risk-item .rl { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.epq-actions {
  display: flex; gap: 8px; margin-top: 12px;
}
.epq-btn {
  flex: 1; height: 38px;
  border-radius: var(--r-full);
  font-size: 12.5px; font-weight: 600;
  cursor: pointer; border: none;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.epq-btn svg { width: 13px; height: 13px; }
.epq-btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: var(--text-inv);
  box-shadow: 0 3px 10px -3px var(--primary-dim);
}
.epq-btn-ghost {
  background: var(--bg-card-2);
  color: var(--text-2);
}

/* 空状态 */
.ep-empty {
  display: flex; flex-direction: column; align-items: center;
  padding: 50px 20px; text-align: center;
}
.ep-empty-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); margin-bottom: 14px;
}
.ep-empty-icon svg { width: 28px; height: 28px; }
.ep-empty-title { font-size: 14px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
.ep-empty-desc { font-size: 12px; color: var(--text-3); line-height: 1.6; max-width: 260px; }
.ep-empty-cta {
  margin-top: 16px;
  padding: 9px 20px;
  border-radius: var(--r-full);
  background: var(--primary-soft);
  color: var(--primary-dim);
  font-size: 12.5px; font-weight: 600;
  border: none; cursor: pointer;
}

/* ═══ 付费深度锁定（企查查式）与工商报告 ═══ */
.epq-lock { position: relative; margin-top: 2px; }
.epq-lock .epq-blur { filter: blur(5px); opacity: .4; pointer-events: none; user-select: none; }
.epq-lock-mask {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, rgba(255,255,255,.15), var(--bg-card) 78%);
  border-radius: var(--r-m);
}
.epq-lock-ic {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg-card); box-shadow: var(--shadow-sm);
  display: flex; align-items: center; justify-content: center; color: var(--primary-dim);
}
.epq-lock-ic svg { width: 15px; height: 15px; }
.epq-lock-tip { font-size: 11px; color: var(--text-3); }
.epq-lock-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 16px; border: none; border-radius: var(--r-full);
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: var(--text-inv); font-size: 12.5px; font-weight: 700; cursor: pointer;
  box-shadow: 0 3px 10px -3px var(--primary-dim);
}
.epq-lock-btn:active { opacity: .85; }
.epq-lock-btn svg { width: 12px; height: 12px; }
.epq-report {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  width: 100%; height: 40px; margin-top: 12px;
  border: 1px solid var(--primary); border-radius: var(--r-full);
  background: var(--primary-soft); color: var(--primary-dim);
  font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.epq-report svg { width: 14px; height: 14px; }
.epq-report:active { opacity: .8; }
.epq-report .price { font-family: var(--font-num); font-weight: 700; }

/* 加载态 */
.ep-loading {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 30px;
  font-size: 12.5px; color: var(--text-3);
}
.ep-loading .dot {
  width: 14px; height: 14px;
  border: 2px solid var(--line);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: epspin .7s linear infinite;
}
@keyframes epspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="phone">
  <!-- 顶部搜索栏 -->
  <div class="navbar">

<script>
(function () {
  window.__ROOT__ = '../../';

  /* ===== 当前模式 ===== */
  var currentMode = 'certified'; // certified | qcc

  /* ===== DOM ===== */
  var searchInput = document.getElementById('searchInput');
  var searchBox = document.getElementById('searchBox');
  var searchClear = document.getElementById('searchClear');
  var searchBtn = document.getElementById('searchBtn');
  var backBtn = document.getElementById('ep-back');
  var beforeSearch = document.getElementById('beforeSearch');
  var afterSearch = document.getElementById('afterSearch');
  var historySection = document.getElementById('historySection');
  var historyTags = document.getElementById('historyTags');
  var hotList = document.getElementById('hotList');
  var resultCount = document.getElementById('resultCount');
  var resultList = document.getElementById('resultList');
  var clearHistoryBtn = document.getElementById('clearHistory');
  var qccSourceTip = document.getElementById('qccSourceTip');
  var badgeCertified = document.getElementById('badgeCertified');
  var badgeQcc = document.getElementById('badgeQcc');

  /* ===== 搜索历史 ===== */
  var HISTORY_KEY = 'engchain_enterprise_search_history';
  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveHistory(kw) {
    var list = getHistory().filter(function (k) { return k !== kw; });
    list.unshift(kw);
    if (list.length > 10) list = list.slice(0, 10);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function clearHistory() {

      (MOCK.franchises || []).forEach(function (f) {
        if (f.type === 'qualification' && f.name) {
          list.push({
            id: f.id,
            source: 'franchise',
            name: f.name,
            verified: !!f.verified,
            qualType: f.qualType || '',
            qualLevel: f.qualLevel || '',
            qualCategory: f.qualCategory || '',
            location: f.location || f.city || '',
            city: f.city || '',
            founded: f.founded || '',
            years: f.years || 0,
            capital: f.capital || '',
            annualProjects: f.annualProjects || 0,
            branchCount: f.branchCount || 0,
            qualPack: f.qualPack || [],
            match: f.match || 70,
            desc: f.desc || ''
          });
        }
      });
      /* 建企买卖企业 */
      (MOCK.trades || []).forEach(function (t) {
        if (t.maskedName || t.name) {
          list.push({
            id: t.id,
            source: 'trade',
            name: t.maskedName || t.name,
            verified: !!t.verified,
            qualLevel: t.level || '',
            qualType: (t.qualPack && t.qualPack[0]) ? (typeof t.qualPack[0] === 'object' ? (t.qualPack[0].name || '') : t.qualPack[0]) : '',
            location: t.location || '',
            city: t.location || '',
            years: 0,
            capital: '',
            annualProjects: 0,
            branchCount: 0,
            qualPack: (t.qualPack || []).map(function (q) { return typeof q === 'object' ? (q.name + (q.level ? q.level : '')) : q; }),
            match: t.match || 80,
            desc: ''
          });
        }
      });
    } catch (e) {}
    return list;
  }

  function searchCertified(kw) {
    if (!kw) return certifiedList;
    var lower = kw.toLowerCase();
    return certifiedList.filter(function (x) {

        x.name, x.qualType, x.qualLevel, x.qualCategory,
        x.location, x.city, x.founded, x.capital
      ].join(' ').toLowerCase();
      return text.indexOf(lower) >= 0;
    });
  }

  /* ===== 渲染：企查查工商卡片（免费基础 + 付费深度分层） ===== */
  var QCC_PAY = { unlock: 2.00 }; /* 深度信息单次解锁（元）；PDF 报告生成免费 */
  var QCC_BUY_KEY = 'engchain_qcc_purchases';
  function qccPurchases() {
    try { return JSON.parse(localStorage.getItem(QCC_BUY_KEY) || '{}'); } catch (e) { return {}; }
  }
  function qccSavePurchases(p) { try { localStorage.setItem(QCC_BUY_KEY, JSON.stringify(p)); } catch (e) {} }
  var QCC_DEEP_TTL = 24 * 3600 * 1000; /* 深度解锁有效期：付费后 24 小时 */
  function qccUnlocked(keyNo) {
    var p = qccPurchases(); var rec = p[keyNo];
    if (!rec || !rec.unlockAt) return false;
    return (Date.now() - rec.unlockAt) < QCC_DEEP_TTL;
  }
  function qccMarkUnlocked(keyNo) {
    var p = qccPurchases(); p[keyNo] = p[keyNo] || {};
    p[keyNo].unlockAt = Date.now(); qccSavePurchases(p);
  }
  function qccBalance() {
    try { return window.BalanceStore ? BalanceStore.available() : 0; } catch (e) { return 0; }
  }
  /* 付费确认与扣款（复用钱包账本，余额不足引导充值） */
  function qccPay(amount, title, desc, onPaid) {
    var av = qccBalance();
    if (av + 1e-9 < amount) {
      UI.dialog({
        title: '余额不足', ok: '去充值', cancel: '取消',
        text: '当前可用余额 <b>¥' + av.toFixed(2) + '</b>，本次需要 <b>¥' + amount.toFixed(2) + '</b>。<br><span style="font-size:11px;color:var(--text-3);">充值后返回即可继续。</span>',
        onOk: function () { location.href = '../wallet/index.html'; }
      });
      return;
    }
    UI.dialog({
      title: title, ok: '确认支付 ¥' + amount.toFixed(2), cancel: '取消',
      text: desc,
      onOk: function () {
        var s = BalanceStore.consume(amount, 'qcc', { remark: title });
        if (!s) { UI.toast('扣费失败，请重试', 'warn'); return; }
        onPaid();
      }
    });
  }
  /* 解锁深度信息（企查查式单家解锁） */

  /* ═══════════ 工商报告 PDF 生成器（纯前端 canvas→JPEG→PDF，无外部依赖） ═══════════ */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  var QCC_PDF = { W: 992, H: 1403, M: 56, FONT: '"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif' };
  function pdfText(ctx, text, x, y, size, color, weight) {
    ctx.font = (weight || '400') + ' ' + size + 'px ' + QCC_PDF.FONT;
    ctx.fillStyle = color;
    ctx.textBaseline = 'top';
    ctx.fillText(text, x, y);
  }
  function pdfWrap(text, perLine) {
    var lines = []; var i;
    for (i = 0; i < text.length; i += perLine) lines.push(text.slice(i, i + perLine));
    return lines.length ? lines : [''];
  }
  /* 手写 PDF：嵌入 JPEG 图像（DCTDecode），A4 版面 */
  function jpegsToPdf(pages) {
    var enc = new TextEncoder(); var parts = []; var offset = 0; var offsets = [0];
    function es(sv) { var u = enc.encode(sv); parts.push(u); offset += u.length; }
    function eb(u8) { parts.push(u8); offset += u8.length; }
    es('%PDF-1.4\n');
    var kids = []; var perPage = 3;
    var total = 2 + pages.length * perPage;
    var bodies = [];
    bodies.push({ text: '<< /Type /Catalog /Pages 2 0 R >>' });
    bodies.push({ text: '' });
    pages.forEach(function (p, i) {
      var pageN = 3 + i * perPage, contentN = 4 + i * perPage, imgN = 5 + i * perPage;
      kids.push(pageN + ' 0 R');
      bodies.push({ text: '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ' + imgN + ' 0 R >> >> /Contents ' + contentN + ' 0 R >>' });
      var st = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
      bodies.push({ text: '<< /Length ' + st.length + ' >>\nstream\n' + st + '\nendstream' });
      var b64 = p.url.split(',')[1];
      var bin = atob(b64); var u8 = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
      bodies.push({ text: '<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + u8.length + ' >>\nstream\n', bin: u8, tail: '\nendstream' });
    });
    bodies[1].text = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>';
    for (var k = 0; k < bodies.length; k++) {
      offsets.push(offset);
      var b = bodies[k];
      es((k + 1) + ' 0 obj\n' + b.text);
      if (b.bin) eb(b.bin);
      if (b.tail) es(b.tail);
      es('\nendobj\n');
    }
    var xrefStart = offset;
    var x = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
    for (var oi = 1; oi < offsets.length; oi++) {
      x += (('0000000000' + offsets[oi]).slice(-10) + ' 00000 n \n');
    }
    es(x);
    es('trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF');
    return new Blob(parts, { type: 'application/pdf' });
  }
  /* 生成完整报告 PDF 并触发下载（成功返回 true） */
  function buildQccReportPdf(db, mode) {
    try {
      var full = (mode !== 'basic');
      var now = new Date();
      var ts = now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate()) + pad2(now.getHours()) + pad2(now.getMinutes());
      var dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      var reportNo = 'QCC-' + ts;
      var W = QCC_PDF.W, H = QCC_PDF.H, M = QCC_PDF.M;
      var availW = W - M * 2;
      var risk = db.risk || { law: 0, court: 0, execute: 0, dishonest: 0 };
      var scLines = pdfWrap(db.businessScope || '—', 70).length;
      var brLines = pdfWrap((db.branches || []).join('　　'), 34).length;
      var h = 0;
      h += 168; h += 46 + 12 * 32; h += 46 + scLines * 20 + 8;
      if (full) {
        h += 46 + (db.shareholders || []).length * 46;
        h += 46 + (db.keyPeople || []).length * 32;
        h += 46 + (db.investments || []).length * 46;
        h += 46 + brLines * 26 + 8;
        h += 46 + (db.changes || []).length * 32;
        h += 46 + 128;
      }
      h += 46 + 4 * 2 * 20 + 30; /* 注意事项区 */
      h += 20;
      var pages = []; var canvas; var ctx; var y; var pageIdx;
      function finishPage() { pages[pageIdx] = { url: canvas.toDataURL('image/jpeg', 0.9), w: W, h: H }; }
      function ensure(hh) { if (y + hh > H - 66) { finishPage(); newPage(); } }
      function newPage() {
        canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
        ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.globalAlpha = .05; ctx.translate(W / 2, H / 2); ctx.rotate(-Math.PI / 6);
        ctx.fillStyle = '#B89968'; ctx.font = '700 76px ' + QCC_PDF.FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('工程链 · 仅供决策参考', 0, 0); ctx.restore();
        pageIdx = pages.length; pages.push(null); y = M;
        if (pageIdx > 0) {
          pdfText(ctx, db.entName + ' · 工商信息报告（续）', M, 18, 10, '#9A8050', '600');
          ctx.fillStyle = '#B89968'; ctx.fillRect(M, 38, availW, 2); y = 56;
        }
      }
      function section(title) {
        ensure(34);
        ctx.fillStyle = '#B89968'; ctx.fillRect(M, y + 2, 4, 14);
        pdfText(ctx, title, M + 12, y, 13, '#6B4F26', '700');
        y += 28;
      }
      function note(text) {
        pdfWrap(text, 80).forEach(function (ln) {
          ensure(22); pdfText(ctx, ln, M, y, 11, '#4A4A4A'); y += 20;
        });
        y += 6;
      }
      newPage();
      /* 报告头 */
      ctx.fillStyle = '#2B2723'; ctx.fillRect(M, y, availW, 118);
      ctx.fillStyle = '#B89968'; ctx.fillRect(M, y, 6, 118);
      pdfText(ctx, 'ENGCHAIN · 工程链', M + 20, y + 14, 12, '#D4C09A', '700');
      pdfText(ctx, db.entName, M + 20, y + 36, 23, '#FFFFFF', '700');
      pdfText(ctx, '企业工商信息报告' + (full ? '（完整版）' : '（基础版）'), M + 20, y + 74, 13, '#D4C09A', '600');
      pdfText(ctx, '报告编号 ' + reportNo, W - M - 210, y + 16, 10, '#9A8050', '600');
      pdfText(ctx, '生成时间 ' + now.toLocaleString('zh-CN'), W - M - 210, y + 32, 10, '#9A8050');
      y += 140;
      pdfText(ctx, '数据来源：企查查 API（模拟数据，仅作产品演示） · 数据更新至最新工商登记', M, y, 10, '#9A8050');
      y += 28;
      /* 一、基础工商信息 */
      section('一、基础工商信息');
      var rows = [
        ['法定代表人', db.operName], ['统一社会信用代码', db.keyNo],
        ['注册资本', db.regCap], ['实缴资本', db.actualCap || '—'],
        ['成立日期', db.estiblishTime], ['企业状态', db.regStatus],
        ['企业类型', db.companyType], ['所属行业', db.industry],
        ['登记机关', db.regInstitute], ['注册地址', db.regLocation],
        ['营业期限', db.startDate + ' 至 ' + db.endDate], ['参保人数', db.staffNum || '—']
      ];
      rows.forEach(function (r) {
        ensure(30);
        pdfText(ctx, r[0], M, y, 11.5, '#9A8050', '600');
        pdfText(ctx, r[1], M + 170, y, 12, '#2A2A2A', '400');
        ctx.strokeStyle = 'rgba(0,0,0,.07)';
        ctx.beginPath(); ctx.moveTo(M, y + 25); ctx.lineTo(W - M, y + 25); ctx.stroke();
        y += 32;
      });
      y += 6;
      /* 二、经营范围 */
      section('二、经营范围');
      pdfWrap(db.businessScope || '—', 70).forEach(function (ln) {
        ensure(22); pdfText(ctx, ln, M, y, 12, '#4A4A4A'); y += 20;
      });
      y += 8;
      if (full) {
        /* 三、股东信息 */
        section('三、股东信息');
        (db.shareholders || []).forEach(function (sd) {
          ensure(44);
          pdfText(ctx, sd.name, M, y, 12, '#2A2A2A', '600');
          pdfText(ctx, sd.type + ' · 认缴 ' + sd.amount + ' · 持股 ' + sd.ratio, M, y + 21, 10.5, '#9A8050');
          y += 46;
        });
        y += 4;
        /* 四、主要人员 */
        section('四、主要人员');
        (db.keyPeople || []).forEach(function (p) {
          ensure(30);
          pdfText(ctx, p.position, M, y, 11.5, '#9A8050', '600');
          pdfText(ctx, p.name, M + 170, y, 12, '#2A2A2A');
          y += 32;
        });
        y += 4;
        /* 五、对外投资 */
        if ((db.investments || []).length) {
          section('五、对外投资');
          (db.investments || []).forEach(function (iv) {
            ensure(44);
            pdfText(ctx, iv.name, M, y, 12, '#2A2A2A', '600');
            pdfText(ctx, '认缴 ' + iv.amount + ' · 持股 ' + iv.ratio, M, y + 21, 10.5, '#9A8050');
            y += 46;
          });
          y += 4;
        }
        /* 六、分支机构 */
        section('六、分支机构（' + (db.branches || []).length + '）');
        pdfWrap((db.branches || []).join('　　'), 34).forEach(function (ln) {
          ensure(28); pdfText(ctx, ln, M, y, 11, '#4A4A4A'); y += 26;
        });
        y += 8;
        /* 七、变更记录 */
        if ((db.changes || []).length) {
          section('七、变更记录');
          (db.changes || []).forEach(function (c) {
            ensure(30);
            pdfText(ctx, c.date, M, y, 11.5, '#9A8050', '600');
            pdfText(ctx, c.item + '：' + c.content, M + 120, y, 11.5, '#2A2A2A');
            y += 32;
          });
          y += 4;
        }
        /* 八、司法风险 */
        section('八、司法风险');
        ensure(128);
        var items = [
          ['法律诉讼', risk.law, risk.law ? '#E4572E' : '#2E7D32'],
          ['法院公告', risk.court, risk.court ? '#E4572E' : '#2E7D32'],
          ['被执行', risk.execute, risk.execute ? '#DC2626' : '#2E7D32'],
          ['失信信息', risk.dishonest, risk.dishonest ? '#DC2626' : '#2E7D32']
        ];
        var cellW = (availW - 12) / 2, cellH = 52;
        items.forEach(function (it, idx) {
          var cx = M + (idx % 2) * (cellW + 12);
          var cy = y + Math.floor(idx / 2) * (cellH + 10);
          ctx.fillStyle = '#FAF7F0';
          ctx.fillRect(cx, cy, cellW, cellH);
          ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.strokeRect(cx, cy, cellW, cellH);
          pdfText(ctx, it[1] + '', cx + 14, cy + 10, 18, it[2], '700');
          pdfText(ctx, it[0], cx + 60, cy + 15, 11, '#9A8050');
        });
        y += 2 * (cellH + 10) + 6;
      }
      /* 注意事项（文件永久有效；数据时点/来源/免责） */
      section('注意事项');
      note('1. 数据时点：本报告生成于 ' + dateStr + '，所展示的工商信息以该时点的登记数据为准。');
      note('2. 数据来源：企查查 API（本系统为产品演示，接入模拟数据），数据更新至最新工商登记。');
      note('3. 免责声明：本报告仅供决策参考，不对数据的准确性、完整性、及时性作出保证，不构成任何法律、投资或交易建议。');
      note('4. 本报告文件由您自行留存，永久有效；如企业数据发生变更，请以官方最新登记信息为准。');
      y += 12;
      finishPage();
      /* 每页页脚 */
      for (var pi = 0; pi < pages.length; pi++) {
        (function (pi) {
          var img = new Image();
          img.onload = function () {
            var c = document.createElement('canvas'); c.width = W; c.height = H;
            var cx = c.getContext('2d');
            cx.drawImage(img, 0, 0);
            cx.strokeStyle = 'rgba(0,0,0,.1)';
            cx.beginPath(); cx.moveTo(M, H - 70); cx.lineTo(W - M, H - 70); cx.stroke();
            pdfText(cx, '免责声明：本报告由工程链平台基于模拟工商数据自动生成，仅供决策参考，不构成任何法律或投资建议。', M, H - 62, 9.5, '#9A8050');
            pdfText(cx, '第 ' + (pi + 1) + ' 页 / 共 ' + pages.length + ' 页', W - M - 130, H - 40, 9.5, '#9A8050');
            pages[pi].url = c.toDataURL('image/jpeg', 0.9);
            pages[pi]._done = true;
          };
          img.src = pages[pi].url;
        })(pi);
      }
      /* 等待页脚异步绘制完成后下载 */
      return new Promise(function (resolve) {
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          if (pages.every(function (p) { return p._done; }) || tries > 100) {
            clearInterval(timer);
            try {
              var blob = jpegsToPdf(pages);
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = '工商报告-' + (full ? '完整版' : '基础版') + '-' + db.entName + '-' + ts + '.pdf';
              document.body.appendChild(a); a.click();
              setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
              resolve(true);
              /* [历史文件] 工商报告 PDF 生成/下载 → 写入历史文件（来源：工商信息查询） */
              try {
                if (window.FileStore) FileStore.add({
                  name: '工商报告-' + (full ? '完整版' : '基础版') + '-' + db.entName + '-' + ts + '.pdf',
                  size: Math.round(blob.size / 1024) + 'KB',
                  source: '工商信息查询',
                  sourceKey: 'qcc',
                  href: 'enterprise.html',
                  note: db.entName,
                  timeText: dateStr
                });
              } catch (e) {}
            } catch (e) { resolve(false); }
          }
        }, 60);
      });
    } catch (e) {
      return Promise.resolve(false);
    }
  }

        '<div class="epq-lock-mask">' +
          '<div class="epq-lock-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>' +
          '<div class="epq-lock-tip">股东 · 主要人员 · 对外投资 · 分支机构 · 变更记录 · 司法风险</div>' +
          '<button class="epq-lock-btn" onclick="unlockQccDeep(\'' + d.keyNo + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>解锁深度信息 ¥' + QCC_PAY.unlock.toFixed(2) + '</button>' +
        '</div></div>';

    return '<div class="ep-qcc-card">' +
      '<div class="epq-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
        '<div class="epq-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>' +
        '<div class="epq-top">' +
          '<span class="epq-badge qcc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>企查查</span>' +
          '<span class="epq-badge status">' + (d.regStatus.indexOf('存续') >= 0 ? '存续' : d.regStatus) + '</span>' +
        '</div>' +
        '<div class="epq-name">' + d.entName + '</div>' +
        '<div class="epq-sub">法定代表人：' + d.operName + ' · 注册资本：' + d.regCap + ' · 成立于 ' + d.estiblishTime + '</div>' +
      '</div>' +
      '<div class="epq-body">' +
        '<div class="epq-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>工商信息</div>' +
        rowsHtml +
        '<div class="epq-section-title" style="margin-top:14px;">经营范围</div>' +
        '<div style="font-size:11.5px;color:var(--text-2);line-height:1.6;">' + d.businessScope + '</div>' +
        deepHtml +
        '<div class="epq-actions">' +
          '<button class="epq-btn epq-btn-primary" onclick="location.href=\'../franchise/index.html\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>查看合作机会</button>' +
          '<button class="epq-btn epq-btn-ghost" onclick="location.href=\'../trade/index.html\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>建企买卖</button>' +
        '</div>' +
        '<button class="epq-report" onclick="genQccReport(\'' + d.keyNo + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' + (qccUnlocked(d.keyNo) ? '生成完整报告 PDF（免费）' : '生成基础报告 PDF（免费）') + '</button>' +
      '</div>' +
    '</div>';
  }

  /* ===== 空状态 ===== */
  function renderEmpty(kw, mode) {
    var title, desc;
    if (mode === 'certified') {
      title = '平台暂无该认证企业';
      desc = '未在平台认证库中找到「' + kw + '」，可切换到「工商信息查询」通过企查查 API 查询。';
    } else {
      title = '未查询到工商信息';
      desc = '企查查 API 未返回「' + kw + '」的工商数据，请检查企业名称是否正确。';
    }
    return '<div class="ep-empty">' +
      '<div class="ep-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>' +
      '<div class="ep-empty-title">' + title + '</div>' +
      '<div class="ep-empty-desc">' + desc + '</div>' +
      (mode === 'certified'
        ? '<button class="ep-empty-cta" onclick="switchMode(\'qcc\')">去工商查询</button>'
        : '<button class="ep-empty-cta" onclick="switchMode(\'certified\')">查平台认证</button>') +
    '</div>';
  }

  /* ===== 模式切换 ===== */
  window.switchMode = function (mode) {
    currentMode = mode;
    document.querySelectorAll('.ep-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.mode === mode);
    });
    qccSourceTip.style.display = mode === 'qcc' ? '' : 'none';
    /* 如果已有搜索词，重新渲染 */
    var kw = searchInput.value.trim();
    if (kw) doSearch(kw);
  };

  /* ===== 搜索动作 ===== */
  function doSearch(kw) {
    kw = (kw || searchInput.value || '').trim();
    if (!kw) { searchInput.focus(); return; }
    searchInput.value = kw;
    saveHistory(kw);

    beforeSearch.style.display = 'none';
    afterSearch.style.display = '';
    document.querySelector('.ep-body').scrollTop = 0;

    if (currentMode === 'certified') {
      var results = searchCertified(kw);
      resultCount.innerHTML = '在平台认证库中找到 <b>' + results.length + '</b> 家与「' + kw + '」相关的企业';
      resultList.innerHTML = results.length
        ? results.map(renderCertifiedCard).join('')
        : renderEmpty(kw, 'certified');
    } else {
      /* 工商查询：显示 loading，模拟 API 请求 */
      resultCount.innerHTML = '正在通过企查查 API 查询「' + kw + '」...';
      resultList.innerHTML = '<div class="ep-loading"><div class="dot"></div>查询中...</div>';
      mockQccSearch(kw).then(function (results) {
        resultCount.innerHTML = '企查查 API 返回 <b>' + results.length + '</b> 条与「' + kw + '」相关的工商记录';
        resultList.innerHTML = results.length
          ? results.map(renderQccCard).join('')
          : renderEmpty(kw, 'qcc');
      });
    }
  }

  function backToHome() {
    if (afterSearch.style.display !== 'none') {
      afterSearch.style.display = 'none';
      beforeSearch.style.display = '';
      searchInput.value = '';
      searchClear.classList.remove('show');
      renderHistory();
    } else {
      if (window.history.length > 1) window.history.back();
      else location.href = '../index.html';
    }
  }

  /* ===== 事件绑定 ===== */
  backBtn.addEventListener('click', backToHome);
  searchInput.addEventListener('focus', function () { searchBox.classList.add('focus'); });
  searchInput.addEventListener('blur', function () { searchBox.classList.remove('focus'); });
  searchInput.addEventListener('input', function () {
    searchClear.classList.toggle('show', !!this.value);
  });
  searchInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    searchClear.classList.remove('show');
    searchInput.focus();
  });
  searchBtn.addEventListener('click', function () { doSearch(); });
  clearHistoryBtn.addEventListener('click', function () {
    if (confirm('确定清空搜索历史吗？')) clearHistory();
  });
  document.querySelectorAll('.ep-tab').forEach(function (t) {
    t.addEventListener('click', function () { switchMode(t.dataset.mode); });
  });

  /* ===== 初始化 ===== */
  renderHistory();
  renderHot();

  /* URL 带 ?kw= 自动搜索 */
  var initKw = new URLSearchParams(location.search).get('kw');
  if (initKw) setTimeout(function () { doSearch(initKw); }, 100);
})();
</script>
</body>
</html>
