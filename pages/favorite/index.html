<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/favorite/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的收藏 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M8%201.2%2013.2%203.3v4.1c0%203.1-2.2%205.5-5.2%206.4-3-.9-5.2-3.3-5.2-6.4V3.3L8%201.2Z%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.3%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%226.55%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3Cellipse%20cx%3D%229.45%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="../../css/state.css">
<style>
/* 右上角「编辑」默认隐藏，仅当当前分类下有收藏时由 render 显示；视觉走统一 .nav-text-btn */
#manage-btn { display: none; }
/* 空态主引导 CTA：墨色主操作面（非金） */
.es-cta { background: linear-gradient(180deg, var(--action), var(--action-deep)); color: var(--on-action); box-shadow: var(--btn-lift); }
.es-cta:active { transform: scale(.98); }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">我的收藏</div>
    <div class="nav-right"><button type="button" class="nav-text-btn" id="manage-btn" onclick="edit()">编辑</button></div>
  </div>

  <div class="seg" style="margin:10px 14px;">
    <span class="seg-item is-on">全部</span>
    <span class="seg-item">需求</span>
    <span class="seg-item">供应</span>
  </div>

  <div class="scroll" style="padding-top:4px;">
    <div id="fav-list"></div>
    <div class="empty-state" id="fav-empty" style="margin-top:10px;display:none;">
      <div class="e-icon"><svg class="ic" style="width:44px;height:44px;stroke-width:1.2;color:var(--text-3);"><use href="#i-star"/></svg></div>
      <div class="e-title">暂无收藏</div>
      <div class="e-desc">把感兴趣的供需信息收藏起来，随时查看对接</div>
      <div class="es-actions"><a href="../supply/list.html" class="btn es-cta es-action">去供需大厅发现</a></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function(){
  window.__ROOT__='../../';
  var currentFilter = 'all';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtTime(ts){
    if(!ts) return '';
    var d=new Date(ts); if(isNaN(d)) return '';
    return (d.getMonth()+1)+'月'+d.getDate()+'日';
  }
  function dirLabel(dir){ return dir==='demand'?'需求':(dir==='supply'?'供应':'信息'); }
  function dirBadge(dir){ return dir==='demand'?'badge b-demand':(dir==='supply'?'badge b-supply':'badge b-brief'); }

  function render(){
    var list = (window.FavoriteStore && FavoriteStore.list) ? FavoriteStore.list() : [];
    var filtered = list.filter(function(it){
      if(currentFilter==='all') return true;
      return it.dir === currentFilter;
    });
    var box = document.getElementById('fav-list');
    var empty = document.getElementById('fav-empty');
    var manageBtn = document.getElementById('manage-btn');
    if(!filtered.length){
      box.innerHTML = '';
      empty.style.display = '';
      if(manageBtn) manageBtn.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    if(manageBtn) manageBtn.style.display = 'flex';
    /* [分片N P1-08] 用 DataBus.getRecord 反查回填缺失字段；无记录则不展示缺字段 */
    function backfill(it){
      var rec = null;
      try { if (window.DataBus && DataBus.getRecord) rec = DataBus.getRecord(it.id); } catch (e) {}
      return {
        title: (rec && rec.title) || it.title || '收藏条目',
        location: (rec && (rec.location || rec.city)) || it.location || '',
        amount: (rec && (rec.price || rec.budget)) || it.amount || '',
        typeKey: (rec && rec.typeKey) || it.typeKey || ''
      };
    }
    box.innerHTML = filtered.map(function(it){
      var bf = backfill(it);
      var href = '../supply/detail.html?id=' + encodeURIComponent(it.id) + (bf.typeKey ? '&typeKey=' + encodeURIComponent(bf.typeKey) : '');
      return '<a class="supply-card fav-card-link" href="'+href+'" data-id="'+esc(it.id)+'" style="position:relative;display:block;text-decoration:none;">' +
        '<div class="sc-top"><span class="'+dirBadge(it.dir)+'">'+dirLabel(it.dir)+'</span>' +
        (it.type?'<span class="badge b-brief">'+esc(it.type)+'</span>':'') +
        '<span style="margin-left:auto;" class="text-3 fs-11">'+fmtTime(it.ts)+'</span></div>' +
        '<div class="sc-title">'+esc(bf.title)+'</div>' +
        (bf.location?'<div class="sc-meta"><span class="sc-loc"><svg class="ic" style="width:12px;height:12px;vertical-align:-1px;margin-right:2px;"><use href="#i-pin"/></svg>'+esc(bf.location)+'</span></div>':'') +
        '<div class="sc-foot">' +
        (bf.amount?'<span class="sc-price">'+esc(bf.amount)+'</span>':'<span></span>') +
        '<button type="button" class="btn btn-ghost btn-sm" data-fav-remove="'+esc(it.id)+'" style="padding:4px 10px;font-size:11px;">取消收藏</button>' +
        '</div></a>';
    }).join('');
  }

  /* 取消收藏：事件委托 + 真实调用 FavoriteStore.remove + 即时 DOM 移除 + 跨 tab 同步 */
  document.getElementById('fav-list').addEventListener('click', function(e){
    var btn = e.target.closest('[data-fav-remove]');
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var id = btn.getAttribute('data-fav-remove');
    if(window.FavoriteStore && FavoriteStore.remove){
      var removed = FavoriteStore.remove(id);
      /* 即时从 DOM 移除该卡片（不等待 re-render） */
      var card = btn.closest('.supply-card');
      if(card) card.remove();
      UI.toast('已取消收藏','ok');
      /* 触发跨 tab 同步事件（makeStore.write 已派发，此处兜底确保同 tab 其他监听者收到） */
      try { window.dispatchEvent(new CustomEvent('engchain:favorite', { detail: { action: 'remove', id: id } })); } catch(err) {}
      /* 重渲染以更新空状态/分类筛选 */
      render();
    } else {
      UI.toast('收藏功能暂不可用','err');
    }
  });

  /* 分类切换 */
  document.querySelectorAll('.seg-item').forEach(function(el){
    el.onclick=function(){
      document.querySelectorAll('.seg-item').forEach(function(x){x.classList.remove('is-on')});
      el.classList.add('is-on');
      var t = el.textContent.trim();
      currentFilter = (t==='需求')?'demand':((t==='供应')?'supply':'all');
      render();
    };
  });

  window.edit=function(){
    var list = (window.FavoriteStore && FavoriteStore.list) ? FavoriteStore.list() : [];
    var filtered = list.filter(function(it){
      if(currentFilter==='all') return true;
      return it.dir === currentFilter;
    });
    if(!filtered.length){ return; }
    UI.toast('批量管理功能即将上线','ok');
  };

  render();
  window.addEventListener('engchain:favorite', render);
  window.addEventListener('storage', function(e){ if(e.key==='engchain-favorites') render(); });
})();
</script>
</body>
</html>
