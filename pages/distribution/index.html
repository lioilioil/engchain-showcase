<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/distribution/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分销中心 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/guest-gate.css">
<link rel="stylesheet" href="../../css/iphone-frame.css">
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">分销中心</div>
    <div class="nav-right"><button class="icon-btn" onclick="location.href='rules.html'" aria-label="分销规则说明">?</button></div>
  </div>

  <div class="scroll dist-scroll">
    <div class="dist-intro">
      <span class="fw-700 fs-17">好友互助 · 共赢分成</span>
      <span class="text-3 fs-12" id="dist-intro-sub">邀请好友消费，享一级推广返佣</span>
    </div>
    <!-- 收益 Hero：深色高级卡（对齐钱包账户卡语言） -->
    <div class="dist-hero">
      <span class="dh-glow" aria-hidden="true"></span>
      <span class="dh-sheen" aria-hidden="true"></span>
      <span class="dh-line-top" aria-hidden="true"></span>
      <div class="dh-head">
        <span class="dh-label">累计返佣（元）</span>
        <span class="dh-tier is-identity" id="dh-tier"></span>
      </div>
      <div class="dh-role-row" id="dh-subject" style="display:none;">
        <span class="dh-role-name" id="dh-role-name"></span>
      </div>
      <div class="dh-amount mono" id="dh-total">¥0.00</div>
      <div class="dh-foot">
        <div class="dh-f">
          <span class="dh-f-label">今日返佣</span>
          <b class="dh-f-val green" id="dh-today">+¥0</b>
        </div>
        <span class="dh-sep"></span>
        <div class="dh-f">
          <span class="dh-f-label">待结算</span>
          <b class="dh-f-val" id="dh-frozen">¥0</b>
        </div>
        <span class="dh-sep"></span>
        <div class="dh-f">
          <span class="dh-f-label">可提现</span>
          <b class="dh-f-val" id="dh-avail">¥0</b>
        </div>
      </div>
    </div>

    <!-- 快捷入口：图标瓷砖 + 按压反馈 -->
    <div class="dist-quick">
      <div class="dq-item" onclick="location.href='earnings.html'">
        <span class="dq-icon dq-gold"><svg class="ic"><use href="#i-wallet"/></svg></span>
        <span class="dq-t1">收益明细</span>
        <span class="dq-t2">全部入账</span>
      </div>
      <div class="dq-item" id="dq-team-item" onclick="location.href='team.html'">
        <span class="dq-icon dq-green"><svg class="ic"><use href="#i-user"/></svg></span>
        <span class="dq-t1">我的团队</span>
        <span class="dq-t2" id="dq-team">0 位伙伴</span>
      </div>
      <div class="dq-item" onclick="location.href='poster.html'">
        <span class="dq-icon dq-blue"><svg class="ic"><use href="#i-share"/></svg></span>
        <span class="dq-t1">推广海报</span>
        <span class="dq-t2">专属邀请码</span>
      </div>
      <div class="dq-item" onclick="withdraw()">
        <span class="dq-icon dq-purple"><svg class="ic"><use href="#i-card"/></svg></span>
        <span class="dq-t1">提现</span>
        <span class="dq-t2">余额转出</span>
      </div>
    </div>

    <!-- 我的档位：进度条 + 双费率 + 提升提示 -->
    <div class="section-title"><div class="st-left">我的档位</div><span class="tag tag-gold" style="margin-right:4px;" id="lv-tag">—</span><span class="tag tag-gold" id="ind-badge" style="display:none;"></span></div>
    <div class="lv-card">
      <div class="lv-head">
        <span class="lv-ic"><svg class="ic"><use href="#i-shield"/></svg></span>
        <div class="lv-meta">
          <div class="lv-name" id="lv-name">—</div>
          <div class="lv-sub" id="d-active">—</div>
        </div>
      </div>
      <div class="lv-bar-sec">
        <div class="lv-bar-top"><span id="lv-active-label">有效伙伴</span><b class="mono" id="lv-active-txt">—</b></div>
        <div class="wp-bar"><div class="wp-fill" id="prg-active" style="width:0%"></div></div>
      </div>
      <div class="lv-bar-sec">
        <div class="lv-bar-top"><span id="lv-consume-label">累计贡献</span><b class="mono" id="lv-consume-txt">—</b></div>
        <div class="wp-bar"><div class="wp-fill wp-fill-dim" id="prg-consume" style="width:0%"></div></div>
      </div>
      <div class="lv-rate">
        <div class="lv-rate-i"><span>一级分销佣金</span><b class="mono" id="d-t1">—</b></div>
        <span class="lv-rate-sep"></span>
        <div class="lv-rate-i"><span>二级分销佣金</span><b class="mono" id="d-t2">—</b></div>
      </div>
      <div class="lv-foot" id="d-upgrade">—</div>
    </div>

    <!-- 规则说明：结构化要点 -->
    <div class="section-title" style="margin-top:22px;"><div class="st-left">规则说明</div></div>
    <div class="card rule-card">
      <div class="rule-kv"><span>结算周期</span><b id="rule-settle">—</b></div>
      <div class="rule-kv"><span>提现门槛</span><b class="mono" id="rule-min-withdraw">满 ¥100 可提现</b></div>
      <div class="rule-kv"><span>层级上限</span><b id="rule-max-level">合规二级 · 平台可追溯</b></div>
      <div class="rule-txt text-3 fs-12" id="dist-rule">—</div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script><script src="../../js/orgs.js"></script><script src="../../js/guest-gate.js"></script>
<script src="../../js/agent-access.js"></script>
<script>
(function(){window.__ROOT__='../../';
function money(n){return '¥'+(Number(n||0)).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
var acc=window.entryAccess?entryAccess():{isResident:false,statusId:'registered',distTier:'base',types:[],isIndividualPartner:false};
var st=acc.statusId;
var resident=acc.isResident;
var isInd=!!acc.isIndividualPartner;
var isProxy=!!(acc.agent && acc.agent.active); /* 新代理（总代/二级），旧团队树入口对其隐藏 */
var hasTeam=!!acc.hasTeam;

/* M3-7 新代理身份（总代/二级，且未叠加个人合伙人）：关闭旧邀请返佣中心，
   走代理台账通道；叠加个人合伙人保留其返佣入口（并集，不互关）。 */
if (acc.agent && acc.agent.active && !isInd && !resident) {
  /* P0-1：按身份分流——总代→T1 工作台，二级→T2 本人视角，消灭二级落「未开通」死空态（只改跳转，不改门控规则） */
  var agentHref = (acc.agent.isSubAgent && !acc.agent.isProvinceAgent)
    ? '../province-agent/sub.html' : '../province-agent/index.html';
  GuestGate.open({
    mode:'replace', icon:'share', badge:'代理通道',
    title:'新代理身份不走旧返佣中心',
    note:'您的代理测算佣金在省级代理台账内查看，不可提现、不进入旧邀请返佣；旧返佣入口已关闭。',
    btnText:'前往代理工作台', btnHref:agentHref
  });
  return;
}

/* 非入驻且非个人合伙人：整页"专享"引导（与 profile 宫格门控同源 entryAccess） */
if(!resident && !isInd){
  var isGuest=(st==='guest');
  if (window.GuestGate) GuestGate.open({
    mode:'replace', icon:'share', badge:'游客模式',
    title:'登录后查看分销中心',
    note:'分销返佣、团队与推广物料仅对登录用户可见。',
    btnText: isGuest?'去登录':'去入驻',
    btnHref: isGuest?'../auth/login.html':'../profile/entry.html'
  });
  return;
}

/* [M4-4] 旧企业合伙人分销演示种子（RF001-004/RB001-007/充值返佣/full 档位/engchain-dist-seeded-v1）已彻底删除；旧企业合伙人定点下线，个人合伙人(u9)返佣提现与 base/limited 旧返佣不依赖此种子。 */

/* 单一来源：档位取 entryAccess().distTier，费率全部走 RULE()（后台可配，不写死） */
var tier=acc.distTier;
var tr=RULE('distribution.tiers.'+tier,{t1:0,t2:0});
var me=DataBus.current(); var uid=me?me.id:'';
var stat=window.Rebate?Rebate.stat(uid):{total:0,today:0,frozen:0,available:0};
var lv=window.Domain?Domain.distLevel(uid):{level:1,name:'见习推广员',active:0,consume:0,total:0,next:null};
var dist=RULE('distribution',{minWithdraw:100,settleNote:'T+1'});

/* 个人合伙人：使用 individualPartner 专属分润参数（一级8%/二级2%/最低提现50元） */
if(isInd){
  var ipCfg=RULE('distribution.individualPartner',{tier1:8,tier2:2,minWithdraw:50,settleNote:'工作日 T+1 到账'});
  tr={t1:ipCfg.tier1,t2:ipCfg.tier2};
  dist.minWithdraw=ipCfg.minWithdraw;
  if(ipCfg.settleNote) dist.settleNote=ipCfg.settleNote;
  /* 个人合伙人隐藏团队管理入口（新代理团队走代理体系，另在 applyTiles 统一隐藏） */
  var teamItem=document.getElementById('dq-team-item');
  if(teamItem){teamItem.style.display='none';}
  /* 显示个人合伙人专属标识（升级为系统 IdBadge 徽章槽，保留现有 display 分支） */
  var indBadge=document.getElementById('ind-badge');
  if(indBadge){
    indBadge.style.display='inline-flex';
    indBadge.classList.add('is-badge-slot');
    if(window.IdBadge) indBadge.innerHTML=IdBadge.render('individual','md');
  }
}

/* [M4-3] 二级开放语义：旧 full 档位摘除后，仅个人合伙人(isInd)开放二级；禁止用 tr.t2 数值判定 */
var hasSecond=isInd;

/* 角色感知文案（init 与 renderDist 共用，身份静态、数值动态） */
function teamCountText(n){ return n+(hasTeam?' 位伙伴':(resident?' 位好友':'')); }
function activeText(a,c){ return isInd?('有效好友 '+a+' 位 / 好友累计消费 '+money(c)):(a+' 位 / '+money(c)); }
function upgradeText(nx,a,c){
  if(!nx) return '已达最高档位';
  var needA=Math.max(0,nx.minActive-a), needC=Math.max(0,nx.minConsume-c);
  return isInd
    ?('提升还需：有效好友 '+needA+' 位 · 好友累计消费 ¥'+needC.toLocaleString('zh-CN'))
    :('提升还需：有效伙伴 '+needA+' 位 · 贡献 ¥'+needC.toLocaleString('zh-CN'));
}

/* Hero 角色修饰类：企业 dh-ent / 个人 dh-ind */
(function applyHeroVariant(){
  var heroEl=document.querySelector('.dist-hero');
  if(heroEl) heroEl.classList.add(isInd?'dh-ind':'dh-ent');
})();

/* Hero 身份徽章：distBadge 四值复用系统 IdBadge（静态，仅首次渲染） */
(function renderHeroBadge(){
  var slot=document.getElementById('dh-tier');
  if(!slot) return;
  if(!window.IdBadge){ slot.textContent=acc.distBadge||''; return; }
  var html='';
  if(acc.distBadge==='个人合伙人') html=IdBadge.render('individual','md');
  else if(acc.distBadge==='蓝V') html=IdBadge.render('construction','md');
  else if(acc.distBadge==='受限') html=IdBadge.html('restricted','受限','vshield','md').replace('id-badge-restricted','id-badge-restricted on-dark');
  slot.innerHTML=html||acc.distBadge||'';
})();

/* 企业署名行：OrgsStore.displaySubject()(kind=org) → me.company → me.auth.enterprise.co → shortName；全空隐藏 */
(function renderSubject(){
  var row=document.getElementById('dh-subject');
  var nameEl=document.getElementById('dh-role-name');
  if(!row||!nameEl) return;
  var name='';
  if(!isInd && resident){
    var sub=null;
    try{ if(window.OrgsStore && typeof OrgsStore.displaySubject==='function') sub=OrgsStore.displaySubject(); }catch(e){}
    if(sub && sub.kind==='org' && sub.name) name=sub.name;
    if(!name && me) name=me.company||'';
    if(!name && me && me.auth && me.auth.enterprise) name=me.auth.enterprise.co||me.auth.enterprise.shortName||'';
  }
  if(name){ nameEl.textContent=name; row.style.display='flex'; }
  else row.style.display='none';
})();

/* 快捷入口瓦片：个人隐藏团队并回流 3 列；非团队企业改「我的推荐 / N 位好友」 */
(function applyTiles(){
  var quick=document.querySelector('.dist-quick');
  var teamItem=document.getElementById('dq-team-item');
  /* [M4 收口] 旧团队树仅 legacy base/limited 可见；个人合伙人、新代理（总代/二级）一律隐藏 */
  if(isInd || isProxy){
    if(teamItem) teamItem.style.display='none';
    if(quick) quick.classList.add('is-3');
  }else{
    if(teamItem) teamItem.style.display='';
    if(quick) quick.classList.remove('is-3');
    if(!hasTeam && resident && teamItem){
      var t1=teamItem.querySelector('.dq-t1');
      if(t1) t1.textContent='我的推荐';
    }
  }
})();

/* 顶部引导语：二级开放 vs 仅一级 */
(function applyIntro(){
  var el=document.getElementById('dist-intro-sub');
  if(el) el.textContent=hasSecond?'邀请好友消费，享合规二级返佣':'邀请好友消费，享一级推广返佣';
})();

/* 档位卡称谓（个人：有效好友 / 好友累计消费） */
(function applyLevelLabels(){
  var aL=document.getElementById('lv-active-label'), cL=document.getElementById('lv-consume-label');
  if(isInd){
    if(aL) aL.textContent='有效好友（已消费）';
    if(cL) cL.textContent='好友累计消费';
  }
})();

/* 未开放费率格降级态（tr.t2<=0 且非个人） */
(function applyRateOff(){
  var t2El=document.getElementById('d-t2');
  var box=t2El?t2El.closest('.lv-rate-i'):null;
  if(!box) return;
  if(tr.t2<=0 && !isInd) box.classList.add('is-off');
  else box.classList.remove('is-off');
})();

document.getElementById('dh-total').textContent=money(stat.total);
document.getElementById('dh-today').textContent='+'+money(stat.today);
document.getElementById('dh-frozen').textContent=money(stat.frozen+stat.settled);
/* 可提现佣金口径（与「佣金提现」页同源）：累计已发放佣金 − 已申请占用（pending/first_ok/paid） */
var _occ=0;
try{
  _occ=(DataBus.withdrawals()||[]).filter(function(x){return x.uid===uid&&(x.type||'')==='commission'&&['pending','first_ok','paid'].indexOf(x.status)>=0;})
    .reduce(function(s,x){return s+(Number(x.amount)||0);},0);
}catch(e){}
var _availAmt=Math.max(0,Math.round((Number(stat.available)-_occ)*100)/100);
document.getElementById('dh-avail').textContent=money(_availAmt);
document.getElementById('dq-team').textContent=teamCountText(lv.total);
/* 零团队 / 零好友引导卡：按角色三分支（团队版 / 推荐版 / 好友版） */
(function insertZeroTeamGuide(){
  if(lv.total>0) return;
  var scroll=document.querySelector('.dist-scroll');
  if(!scroll) return;
  if(scroll.querySelector('#zero-team-guide')) return;
  var title, body;
  if(hasTeam){
    title='还没有团队伙伴';
    body='生成专属海报，邀请首位伙伴加入，消费后自动返佣';
  }else if(resident){
    title='还没有推荐好友';
    body='生成专属海报，邀请好友注册消费，自动获得一级返佣';
  }else{
    title='还没有邀请好友';
    body='生成专属海报，邀请好友加入，消费后自动返佣（一级 '+tr.t1+'% / 二级 '+tr.t2+'%）';
  }
  var card=document.createElement('div');
  card.id='zero-team-guide';
  card.style.cssText='margin:4px 2px 16px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(176, 138, 60, .10),rgba(176, 138, 60, .03));border:1px solid rgba(176, 138, 60, .3);display:flex;align-items:center;gap:12px;';
  card.innerHTML=
    '<div style="width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);display:flex;align-items:center;justify-content:center;flex:none;">'+
      '<svg class="ic" style="width:22px;height:22px;"><use href="#i-share"/></svg></div>'+
    '<div style="flex:1;min-width:0;">'+
      '<div style="font-size:13.5px;font-weight:700;color:var(--text-1);">'+title+'</div>'+
      '<div style="font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.5;">'+body+'</div>'+
    '</div>'+
    '<a href="poster.html" class="zero-cta" style="flex:none;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:12px;font-weight:700;text-decoration:none;">去生成海报</a>';
  var quick=document.querySelector('.dist-quick');
  if(quick && quick.nextSibling){ quick.parentNode.insertBefore(card, quick.nextSibling); }
  else { scroll.insertBefore(card, scroll.firstChild); }
})();
document.getElementById('d-t1').textContent=tr.t1+'%';
document.getElementById('d-t2').textContent=(tr.t2>0)?tr.t2+'%':'暂未开放';
document.getElementById('d-active').textContent=activeText(lv.active,lv.consume);
document.getElementById('lv-tag').textContent=lv.name;
document.getElementById('lv-name').textContent=lv.name;
document.getElementById('d-upgrade').textContent=upgradeText(lv.next,lv.active,lv.consume);

/* 档位进度条（两维：有效伙伴 + 累计贡献） */
var next=lv.next;
var actTxt=document.getElementById('lv-active-txt');
var conTxt=document.getElementById('lv-consume-txt');
if(next){
  var actPct=Math.min(100,Math.round(lv.active/next.minActive*100));
  var conPct=Math.min(100,Math.round(lv.consume/next.minConsume*100));
  actTxt.textContent=lv.active+' / '+next.minActive+' 位';
  conTxt.textContent=money(lv.consume)+' / '+money(next.minConsume);
}else{
  actTxt.textContent=lv.active+' 位';
  conTxt.textContent=money(lv.consume);
  actPct=100;conPct=100;
}
var prgA=document.getElementById('prg-active'),prgC=document.getElementById('prg-consume');
if(prgA)prgA.style.width=actPct+'%';
if(prgC)prgC.style.width=conPct+'%';

/* 提现门槛动态显示 */
var mwEl=document.getElementById('rule-min-withdraw');
if(mwEl) mwEl.textContent='满 ¥'+dist.minWithdraw+' 可提现';
/* 结算周期：动态取 dist.settleNote（删除硬编码 T+1） */
var settleEl=document.getElementById('rule-settle');
if(settleEl) settleEl.textContent=dist.settleNote||'—';
/* 层级上限：按 distTier/角色判定（full/isInd 二级；limited 仅一级并标注暂未开放；base 仅一级） */
var maxEl=document.getElementById('rule-max-level');
if(maxEl){
  maxEl.textContent=hasSecond
    ?'合规二级 · 平台可追溯'
    :(tier==='limited'?'仅一级 · 平台可追溯（二级暂未开放）':'仅一级 · 平台可追溯');
}
var rule=document.getElementById('dist-rule');
/* [M4-3/M4-6] full 分支摘除；个人合伙人(8%/2%)独立文案；充值不计入返佣基数 */
rule.textContent=isInd
  ?'个人合伙人二级分销：好友成交订单/入驻获一级 '+tr.t1+'%、二级 '+tr.t2+'% 推广返佣（充值不计入）；返佣先冻结，售后无退款后 '+dist.settleNote+' 结算，满 ¥'+dist.minWithdraw+' 可提现。'
  :(tier==='limited'
  ?'受限分销：中介服务企业专注服务经营，仅享一级 '+tr.t1+'% 推广返佣（二级暂未开放，充值不计入）；返佣冻结后 '+dist.settleNote+' 结算，满 ¥'+dist.minWithdraw+' 可提现。'
  :'基础分销：邀请好友成交订单/入驻获一级 '+tr.t1+'% 推广返佣（二级暂未开放，充值不计入）；返佣冻结后 '+dist.settleNote+' 结算，满 ¥'+dist.minWithdraw+' 可提现。');

/* 数字滚动：累计返佣从 0 滚动到目标值 */
(function(){
  var el=document.getElementById('dh-total');
  var target=Number(stat.total)||0;
  if(!el||target<=0||!window.requestAnimationFrame)return;
  var t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/950), e=1-Math.pow(1-p,3);
    el.textContent='¥'+(target*e).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  /* 兜底：后台标签 rAF 可能被节流，1.2s 后强制落定最终值 */
  setTimeout(function(){if(el)el.textContent='¥'+target.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});},1200);
})();

/* 提现：跳转佣金提现页（与钱包「余额提现」流程同构，佣金/余额分开体现） */
window.withdraw=function(){
  if(window.BalanceStore){
    var _av=(function(){try{return BalanceStore.available();}catch(e){return 0;}})();
    if(_av<dist.minWithdraw){UI.toast('满 ¥'+dist.minWithdraw+' 才可提现，当前 '+money(_av),'warn');return;}
  }
  location.href='withdraw.html';
};
/* 恢复联网时自动重放离线写队列（原型 runner 直接成功，真实后端替换为接口幂等提交） */
window.addEventListener('online',function(){if(window.Outbox&&Outbox.pending()){var r=Outbox.flush(function(){return{ok:true};});if(r.done)UI.toast('已补传 '+r.done+' 条离线操作','ok');}});
/* 跨 tab 自动重渲染：返佣/资金变动后刷新数据（禁止 location.reload） */
  function renderDist() {
    try {
      var me2 = DataBus.current(); var uid2 = me2 ? me2.id : '';
      var stat2 = window.Rebate ? Rebate.stat(uid2) : {total:0,today:0,frozen:0,available:0};
      var lv2 = window.Domain ? Domain.distLevel(uid2) : {level:1,name:'见习推广员',active:0,consume:0,total:0,next:null};
      document.getElementById('dh-total').textContent = money(stat2.total);
      document.getElementById('dh-today').textContent = '+' + money(stat2.today);
      document.getElementById('dh-frozen').textContent = money(stat2.frozen + (stat2.settled||0));
      var _occ2 = 0;
      try {
        _occ2 = (DataBus.withdrawals() || []).filter(function (x) { return x.uid === uid2 && (x.type || '') === 'commission' && ['pending', 'first_ok', 'paid'].indexOf(x.status) >= 0; })
          .reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
      } catch (e) {}
      document.getElementById('dh-avail').textContent = money(Math.max(0, Math.round((Number(stat2.available) - _occ2) * 100) / 100));
      document.getElementById('dq-team').textContent = teamCountText(lv2.total);
      document.getElementById('d-active').textContent = activeText(lv2.active, lv2.consume);
      document.getElementById('lv-tag').textContent = lv2.name;
      document.getElementById('lv-name').textContent = lv2.name;
      var next2 = lv2.next;
      if (next2) {
        document.getElementById('lv-active-txt').textContent = lv2.active + ' / ' + next2.minActive + ' 位';
        document.getElementById('lv-consume-txt').textContent = money(lv2.consume) + ' / ' + money(next2.minConsume);
        var prgA2 = document.getElementById('prg-active'), prgC2 = document.getElementById('prg-consume');
        if (prgA2) prgA2.style.width = Math.min(100, Math.round(lv2.active/next2.minActive*100)) + '%';
        if (prgC2) prgC2.style.width = Math.min(100, Math.round(lv2.consume/next2.minConsume*100)) + '%';
      }
      document.getElementById('d-upgrade').textContent = upgradeText(next2, lv2.active, lv2.consume);
    } catch (e) { console.warn('renderDist failed:', e); }
  }
  var _distRerender = null;
  function _distRefresh() { if (_distRerender) clearTimeout(_distRerender); _distRerender = setTimeout(renderDist, 100); }
  window.addEventListener('storage', function (e) { if (e.key === 'engchain-balance' || e.key === 'engchain-state' || e.key === 'engchain-auth') _distRefresh(); });
  window.addEventListener('engchain:balance', _distRefresh);
  window.addEventListener('engchain:state', _distRefresh);
  window.addEventListener('engchain:auth', _distRefresh);
  window.addEventListener('engchain:store-change', _distRefresh);
  window.addEventListener('engchain:rebate', _distRefresh);
  /* E2-08：完成企业入驻后档位文案/门槛需整体重建，刷新页面以重算 distTier */
  window.addEventListener('engchain:entry', function(){ location.reload(); });
})();
</script>
<style>
/* ===== 分销中心 · 深色收益卡（对齐钱包账户卡） ===== */
.dist-scroll{padding-top:12px;padding-bottom:24px;}
.dist-intro{display:flex;flex-direction:column;gap:2px;padding:2px 2px 12px;animation:dh-in .4s var(--e-out) both;}
.dist-hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 20px 16px;margin-bottom:14px;
  background:radial-gradient(130% 120% at 86% -12%, rgba(238,214,151,.20) 0%, transparent 55%),
  linear-gradient(150deg,#252C35 0%,#151A22 46%,#0B0E13 100%);
  box-shadow:0 1px 2px rgba(22,22,22,.06), 0 10px 28px rgba(22,22,22,.14);
  animation:dh-in .5s var(--e-out) both;}
.dh-glow{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(130% 100% at 86% -12%, rgba(238,214,151,.20) 0%, transparent 52%), radial-gradient(100% 80% at 6% 116%, rgba(200,169,97,.14) 0%, transparent 56%);}
.dh-sheen{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(72deg, transparent 44%, rgba(255,244,220,.10) 50%, transparent 56%);animation:dh-sheen 7.6s cubic-bezier(.4,0,.2,1) infinite;}
.dh-line-top{position:absolute;left:10px;right:10px;top:0;height:1px;pointer-events:none;background:linear-gradient(90deg, transparent, rgba(244,231,200,.55), transparent);}
.dh-head{display:flex;align-items:center;justify-content:space-between;position:relative;}
.dh-label{font-size:12px;color:rgba(244,242,238,.66);letter-spacing:.04em;}
.dh-tier{font-size:10px;font-weight:700;letter-spacing:.06em;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#B08A3C);border-radius:6px;padding:3px 9px;box-shadow:0 2px 8px -3px rgba(176, 138, 60, .7);border:1px solid rgba(255,255,255,.4);}
/* 身份徽章槽：接管原金徽槽位，清除金徽底色让系统 IdBadge 自带样式生效 */
.dh-tier.is-identity{background:none;border:0;box-shadow:none;padding:0;}
/* 企业版：右上聚光提至 .24（机构权威） */
.dh-ent .dh-glow{background:radial-gradient(130% 100% at 86% -12%, rgba(238,214,151,.24) 0%, transparent 52%), radial-gradient(100% 80% at 6% 116%, rgba(200,169,97,.14) 0%, transparent 56%);}
/* 个人版：聚光移右下并收敛，顶线居中短线，扫光降 .06 */
.dh-ind .dh-glow{background:radial-gradient(120% 100% at 78% -8%, rgba(238,214,151,.16) 0%, transparent 52%), radial-gradient(100% 80% at 92% 118%, rgba(200,169,97,.12) 0%, transparent 56%);}
.dh-ind .dh-line-top{left:29%;right:29%;}
.dh-ind .dh-sheen{background:linear-gradient(72deg, transparent 44%, rgba(255,244,220,.06) 50%, transparent 56%);}
/* 企业署名行（仅企业，无值整行隐藏） */
.dh-role-row{display:none;align-items:center;gap:8px;margin-top:10px;position:relative;animation:dh-in .4s var(--e-out) both;animation-delay:.08s;}
.dh-role-name{font-size:12.5px;font-weight:600;color:rgba(244,242,238,.82);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%;}
/* 受限徽章（复用 warning token）；on-dark 变体落在深色 hero 上 */
.id-badge-restricted{background:var(--warning-soft);color:var(--warning-ink);border:1px solid var(--warning-soft);box-shadow:none;}
[data-theme="dark"] .id-badge-restricted{background:var(--warning-soft);color:var(--warning-ink);border-color:var(--warning-soft);}
.id-badge-restricted.on-dark{background:transparent;color:rgba(244,242,238,.78);border:1px solid rgba(244,231,200,.35);box-shadow:none;}
/* #ind-badge 升级为系统徽章槽（清除 tag-gold 外观） */
#ind-badge.is-badge-slot{background:none;border:0;box-shadow:none;padding:0;margin-right:4px;}
.dh-amount{position:relative;font-family:var(--font-display);font-size:36px;font-weight:800;margin-top:8px;letter-spacing:-.5px;color:#F7F5F1;font-variant-numeric:tabular-nums;}
.dh-foot{position:relative;display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.10);}
.dh-f{display:flex;flex-direction:column;gap:3px;min-width:0;}
.dh-f-label{font-size:10.5px;color:rgba(244,242,238,.52);}
.dh-f-val{font-size:14px;font-weight:700;color:#F2F0EC;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;}
.dh-f-val.green{color:#E3C88E;}
.dh-sep{width:1px;height:22px;background:rgba(255,255,255,.12);flex:none;}
@keyframes dh-in{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
@keyframes dh-sheen{0%,100%{transform:translateX(-18%);}55%,85%{transform:translateX(18%);}}

/* ===== 快捷入口 ===== */
.dist-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
.dq-item{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:15px 6px 13px;text-align:center;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform var(--d-fast),box-shadow var(--d-fast),border-color var(--d-fast);animation:dq-in .45s var(--e-out) both;}
.dq-item:nth-child(2){animation-delay:.05s;}.dq-item:nth-child(3){animation-delay:.1s;}.dq-item:nth-child(4){animation-delay:.15s;}
.dq-item:active{transform:scale(.95);box-shadow:var(--shadow-xs);border-color:var(--accent-line);}
.dq-item:hover{border-color:var(--accent-line);box-shadow:var(--shadow-sm);}
.dq-item:focus-visible{outline:none;box-shadow:var(--shadow-card),var(--shadow-focus);}
.dq-item.is-disabled{opacity:.45;pointer-events:none;cursor:default;}
.dq-item.is-disabled:active{transform:none;}
/* 个人版隐藏团队瓦片后回流 3 列 */
.dist-quick.is-3{grid-template-columns:repeat(3,1fr);}
.dq-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.dq-icon svg{width:20px;height:20px;stroke-width:1.7;}
.dq-gold{background:var(--primary-soft);color:var(--primary-dim);}
.dq-green{background:rgba(43,107,79,.10);color:var(--success);}
.dq-blue{background:rgba(37,99,235,.10);color:var(--blue);}
.dq-purple{background:rgba(124,91,189,.10);color:var(--purple);}
.dq-t1{font-size:12.5px;font-weight:600;color:var(--text-1);}
.dq-t2{font-size:10px;color:var(--text-3);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@keyframes dq-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== 档位卡 ===== */
.lv-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow-card);animation:dh-in .5s var(--e-out) .1s both;}
.lv-head{display:flex;align-items:center;gap:12px;}

.lv-ic svg{width:20px;height:20px;stroke-width:1.7;}
.lv-meta{flex:1;min-width:0;}
.lv-name{font-size:15px;font-weight:700;color:var(--text-1);}

.lv-bar-sec{margin-top:14px;}

/* 未开放费率格降级态（受限/基础企业第二格）：中性灰，不被金色夸大 */
.lv-rate-i.is-off span{color:var(--text-3);}

.zero-cta{transition:filter var(--d-fast),box-shadow var(--d-fast);}
.zero-cta:hover{filter:brightness(1.06);}

@media (prefers-reduced-motion: reduce){
  .dist-hero,.dq-item,.lv-card,.dh-role-row{animation:none;}

}
