<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/distribution/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分销中心 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/iphone-frame.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">分销中心</div>
    <div class="nav-right"><button class="icon-btn" onclick="UI.toast('二级分销 · 合规上限两级','ok')" aria-label="分销规则说明">?</button></div>
  </div>

  <div class="scroll dist-scroll">
    <div class="dist-intro">
      <span class="fw-700 fs-17">好友互助 · 共赢分成</span>
      <span class="text-3 fs-12">邀请伙伴消费，享合规二级返佣</span>
    </div>
    <!-- 收益 Hero：深色高级卡（对齐钱包账户卡语言） -->
    <div class="dist-hero">
      <span class="dh-glow" aria-hidden="true"></span>
      <span class="dh-sheen" aria-hidden="true"></span>
      <span class="dh-line-top" aria-hidden="true"></span>
      <div class="dh-head">
        <span class="dh-label">累计返佣（元）</span>
        <span class="dh-tier" id="dh-tier">Lv.1</span>
      </div>
      <div class="dh-amount mono" id="dh-total">¥0.00</div>
      <div class="dh-foot">
        <div class="dh-f">
          <span class="dh-f-label">今日返佣</span>
          <b class="dh-f-val green" id="dh-today">+¥0</b>
        </div>
        <span class="dh-sep"></span>
        <div class="dh-f">
          <span class="dh-f-label">待结算</span>
          <b class="dh-f-val" id="dh-frozen">¥0</b>
        </div>
        <span class="dh-sep"></span>
        <div class="dh-f dh-f-avail">
          <span class="dh-f-label">可提现</span>
          <b class="dh-f-val" id="dh-avail">¥0</b>
        </div>
        <button class="dh-btn" onclick="withdraw()">提现<svg class="ic" viewBox="0 0 24 24"><use href="#i-chev-r"/></svg></button>
      </div>
    </div>

    <!-- 快捷入口：图标瓷砖 + 按压反馈 -->
    <div class="dist-quick">
      <div class="dq-item" onclick="location.href='earnings.html'">
        <span class="dq-icon dq-gold"><svg class="ic"><use href="#i-wallet"/></svg></span>
        <span class="dq-t1">收益明细</span>
        <span class="dq-t2">全部入账</span>
      </div>
      <div class="dq-item" id="dq-team-item" onclick="location.href='team.html'">
        <span class="dq-icon dq-green"><svg class="ic"><use href="#i-user"/></svg></span>
        <span class="dq-t1">我的团队</span>
        <span class="dq-t2" id="dq-team">0 位伙伴</span>
      </div>
      <div class="dq-item" onclick="location.href='poster.html'">
        <span class="dq-icon dq-blue"><svg class="ic"><use href="#i-share"/></svg></span>
        <span class="dq-t1">推广海报</span>
        <span class="dq-t2">专属邀请码</span>
      </div>
      <div class="dq-item" onclick="withdraw()">
        <span class="dq-icon dq-purple"><svg class="ic"><use href="#i-card"/></svg></span>
        <span class="dq-t1">提现</span>
        <span class="dq-t2">余额转出</span>
      </div>
    </div>

    <!-- 我的等级：进度条 + 双费率 + 升级提示 -->
    <div class="section-title"><div class="st-left">我的等级</div><span class="tag tag-gold" style="margin-right:4px;" id="lv-tag">—</span><span class="tag tag-gold" id="ind-badge" style="display:none;">个人合伙人专属</span></div>
    <div class="lv-card">
      <div class="lv-head">
        <span class="lv-ic"><svg class="ic"><use href="#i-shield"/></svg></span>
        <div class="lv-meta">
          <div class="lv-name" id="lv-name">—</div>
          <div class="lv-sub" id="d-active">—</div>
        </div>
      </div>
      <div class="lv-bar-sec">
        <div class="lv-bar-top"><span>有效伙伴</span><b class="mono" id="lv-active-txt">—</b></div>
        <div class="wp-bar"><div class="wp-fill" id="prg-active" style="width:0%"></div></div>
      </div>
      <div class="lv-bar-sec">
        <div class="lv-bar-top"><span>累计贡献</span><b class="mono" id="lv-consume-txt">—</b></div>
        <div class="wp-bar"><div class="wp-fill wp-fill-dim" id="prg-consume" style="width:0%"></div></div>
      </div>
      <div class="lv-rate">
        <div class="lv-rate-i"><span>一级分销佣金</span><b class="mono" id="d-t1">—</b></div>
        <span class="lv-rate-sep"></span>
        <div class="lv-rate-i"><span>二级分销佣金</span><b class="mono" id="d-t2">—</b></div>
      </div>
      <div class="lv-foot" id="d-upgrade">—</div>
    </div>

    <!-- 规则说明：结构化要点 -->
    <div class="section-title" style="margin-top:22px;"><div class="st-left">规则说明</div></div>
    <div class="card rule-card">
      <div class="rule-kv"><span>结算周期</span><b>T+1 · 售后无退款后发放</b></div>
      <div class="rule-kv"><span>提现门槛</span><b class="mono" id="rule-min-withdraw">满 ¥100 可提现</b></div>
      <div class="rule-kv"><span>层级上限</span><b>合规二级 · 平台可追溯</b></div>
      <div class="rule-txt text-3 fs-12" id="dist-rule">—</div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script>
(function(){window.__ROOT__='../../';
function money(n){return '¥'+(Number(n||0)).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
var acc=window.entryAccess?entryAccess():{isResident:false,statusId:'registered',distTier:'base',types:[],isIndividualPartner:false};
var st=acc.statusId;
var resident=acc.isResident;
var isInd=!!acc.isIndividualPartner;

/* 非入驻且非个人合伙人：整页"专享"引导（与 profile 宫格门控同源 entryAccess） */
if(!resident && !isInd){
  var body=document.querySelector('.phone .scroll');
  if(body){
    var gBtn=st==='guest'?'../auth/login.html':'../profile/entry.html';
    var gLabel=st==='guest'?'去登录':'去入驻';
    body.innerHTML='<div style="padding:52px 28px;text-align:center;">'+
      '<div class="dq-icon" style="color:var(--primary);margin-bottom:14px;"><svg class="ic" style="width:42px;height:42px;"><use href="#i-share"/></svg></div>'+
      '<div class="fw-700 fs-17" style="margin-bottom:8px;">分销中心 · 入驻企业 / 个人合伙人专享</div>'+
      '<div class="text-3 fs-13" style="line-height:1.9;margin-bottom:26px;">完成企业入驻或申请个人合伙人后开通分销返佣：<br>建筑企业 · 基础一级 8%<br>中介服务企业 · 受限一级 6%<br>合伙人企业 · 完整二级 12% / 3%<br>个人合伙人 · 完整二级 8% / 2%</div>'+
      '<button class="btn btn-primary btn-block" onclick="location.href=\''+gBtn+'\'">'+gLabel+'</button>'+
      '</div>';
  }
  window.withdraw=function(){UI.toast('分销为入驻企业 / 个人合伙人专享','warn');};
  return;
}

/* 单一来源：档位取 entryAccess().distTier，费率全部走 RULE()（后台可配，不写死） */
var tier=acc.distTier;
var tr=RULE('distribution.tiers.'+tier,{t1:0,t2:0});
var me=DataBus.current(); var uid=me?me.id:'';
var stat=window.Rebate?Rebate.stat(uid):{total:0,today:0,frozen:0,available:0};
var lv=window.Domain?Domain.distLevel(uid):{level:1,name:'见习推广员',active:0,consume:0,total:0,next:null};
var dist=RULE('distribution',{minWithdraw:100,settleNote:'T+1'});

/* 个人合伙人：使用 individualPartner 专属分润参数（一级8%/二级2%/最低提现50元） */
if(isInd){
  var ipCfg=RULE('distribution.individualPartner',{tier1:8,tier2:2,minWithdraw:50,settleNote:'工作日 T+1 到账'});
  tr={t1:ipCfg.tier1,t2:ipCfg.tier2};
  dist.minWithdraw=ipCfg.minWithdraw;
  if(ipCfg.settleNote) dist.settleNote=ipCfg.settleNote;
  /* 个人合伙人隐藏团队管理入口 */
  var teamItem=document.getElementById('dq-team-item');
  if(teamItem){teamItem.style.display='none';}
  /* 显示个人合伙人专属标识 */
  var indBadge=document.getElementById('ind-badge');
  if(indBadge)indBadge.style.display='inline-flex';
}

document.getElementById('dh-total').textContent=money(stat.total);
document.getElementById('dh-today').textContent='+'+money(stat.today);
document.getElementById('dh-frozen').textContent=money(stat.frozen+stat.settled);
/* L5：可提现金额统一口径 = BalanceStore.available()（与提现校验同源），不再用 Rebate.stat.available */
var _availAmt = (window.BalanceStore ? BalanceStore.available() : stat.available);
document.getElementById('dh-avail').textContent=money(_availAmt);
document.getElementById('dq-team').textContent=lv.total+' 位伙伴';
document.getElementById('d-t1').textContent=tr.t1+'%';
document.getElementById('d-t2').textContent=(tr.t2>0)?tr.t2+'%':'暂未开放';
document.getElementById('d-active').textContent=lv.active+' 位 / '+money(lv.consume);
document.getElementById('lv-tag').textContent='Lv.'+lv.level+' '+lv.name;
document.getElementById('lv-name').textContent=lv.name;
document.getElementById('dh-tier').textContent='Lv.'+lv.level;
document.getElementById('d-upgrade').textContent=lv.next?('升级还需：有效伙伴 '+Math.max(0,lv.next.minActive-lv.active)+' 位 · 贡献 ¥'+Math.max(0,lv.next.minConsume-lv.consume).toLocaleString('zh-CN')):'已达最高等级';

/* 等级进度条（两维：有效伙伴 + 累计贡献） */
var next=lv.next;
var actTxt=document.getElementById('lv-active-txt');
var conTxt=document.getElementById('lv-consume-txt');
if(next){
  var actPct=Math.min(100,Math.round(lv.active/next.minActive*100));
  var conPct=Math.min(100,Math.round(lv.consume/next.minConsume*100));
  actTxt.textContent=lv.active+' / '+next.minActive+' 位';
  conTxt.textContent=money(lv.consume)+' / '+money(next.minConsume);
}else{
  actTxt.textContent=lv.active+' 位';
  conTxt.textContent=money(lv.consume);
  actPct=100;conPct=100;
}
var prgA=document.getElementById('prg-active'),prgC=document.getElementById('prg-consume');
if(prgA)prgA.style.width=actPct+'%';
if(prgC)prgC.style.width=conPct+'%';

var tierName={base:'基础一级（建筑企业）',limited:'受限一级（中介企业）',full:'完整二级（合伙人企业）'}[tier];
if(isInd) tierName='完整二级（个人合伙人）';
/* 提现门槛动态显示 */
var mwEl=document.getElementById('rule-min-withdraw');
if(mwEl) mwEl.textContent='满 ¥'+dist.minWithdraw+' 可提现';
var rule=document.getElementById('dist-rule');
rule.textContent=(tier==='full')
  ?(isInd?'个人合伙人二级分销':'完整二级分销')+'：邀请好友消费（充值/订单/入驻），获一级 '+tr.t1+'%、二级 '+tr.t2+'% 推广返佣；返佣先冻结，售后无退款后 '+dist.settleNote+' 结算发放。收益满 ¥'+dist.minWithdraw+' 可提现。'
  :(tier==='limited'
  ?'受限分销：中介服务企业专注服务经营，仅享一级 '+tr.t1+'% 推广返佣（二级暂未开放）；返佣冻结后 '+dist.settleNote+' 结算，满 ¥'+dist.minWithdraw+' 可提现。'
  :'基础分销：邀请好友消费（充值/订单/入驻），获一级 '+tr.t1+'% 推广返佣（二级暂未开放）；返佣冻结后 '+dist.settleNote+' 结算，满 ¥'+dist.minWithdraw+' 可提现。');

/* 数字滚动：累计返佣从 0 滚动到目标值 */
(function(){
  var el=document.getElementById('dh-total');
  var target=Number(stat.total)||0;
  if(!el||target<=0||!window.requestAnimationFrame)return;
  var t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/950), e=1-Math.pow(1-p,3);
    el.textContent='¥'+(target*e).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  /* 兜底：后台标签 rAF 可能被节流，1.2s 后强制落定最终值 */
  setTimeout(function(){if(el)el.textContent='¥'+target.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});},1200);
})();

/* 提现：校验门槛/可用额 → DataBus 两级审批冻结流（不再是假弹窗） */
window.withdraw=function(){
  var avail=(window.BalanceStore?BalanceStore.available():stat.available);
  if(avail<dist.minWithdraw){UI.toast('满 ¥'+dist.minWithdraw+' 才可提现，当前 '+money(avail),'warn');return;}
  UI.sheet().html(
    '<div style="padding:6px 2px 14px;">'+
    '<div class="fw-700 fs-16" style="margin-bottom:12px;">提现到账方式</div>'+
    '<div class="text-3 fs-12" style="margin-bottom:12px;">可提现 <b style="color:var(--primary)">'+money(avail)+'</b>，最低 ¥'+dist.minWithdraw+'，'+dist.settleNote+'。</div>'+
    '<button class="btn btn-outline btn-block" style="margin-bottom:10px;" onclick="doWithdraw(\'bank\')">提现到银行卡</button>'+
    '<button class="btn btn-outline btn-block" onclick="doWithdraw(\'alipay\')">提现到支付宝</button>'+
    '</div>').show();
};
window.doWithdraw=function(method){
  UI.closeSheet&&UI.closeSheet();
  var avail=BalanceStore.available();
  var w=DataBus.withdrawalApply(uid,avail,method,{bank:method==='bank'?'银行卡 · 尾号 ****':'支付宝 · 本人'});
  if(!w||w.error){UI.toast((w&&w.error)||'提现失败','warn');return;}
  /* S5 离线写队列：本地已落审批流，同时入 Outbox，联网后由服务端幂等补传（idemKey 防重） */
  if(window.Outbox){Outbox.enqueue('withdrawal.apply',{uid:uid,amount:w.amount,method:method,idemKey:'wd_'+(w.id||(Date.now()))});
    if(navigator.onLine===false)UI.toast('当前离线，提现已暂存，联网后自动提交','warn');}
  UI.dialog({title:'提现已提交',text:'申请金额 <b>'+money(w.amount)+'</b>，已冻结，进入两级审批，'+RULE('distribution.settleNote','T+1')+'到账。可在「钱包-提现记录」查看进度。',ok:'我知道了',onOk:function(){location.href='earnings.html';}});
};
/* 恢复联网时自动重放离线写队列（原型 runner 直接成功，真实后端替换为接口幂等提交） */
window.addEventListener('online',function(){if(window.Outbox&&Outbox.pending()){var r=Outbox.flush(function(){return{ok:true};});if(r.done)UI.toast('已补传 '+r.done+' 条离线操作','ok');}});
/* 跨 tab 自动重渲染：返佣/资金变动后刷新数据（禁止 location.reload） */
  function renderDist() {
    try {
      var me2 = DataBus.current(); var uid2 = me2 ? me2.id : '';
      var stat2 = window.Rebate ? Rebate.stat(uid2) : {total:0,today:0,frozen:0,available:0};
      var lv2 = window.Domain ? Domain.distLevel(uid2) : {level:1,name:'见习推广员',active:0,consume:0,total:0,next:null};
      document.getElementById('dh-total').textContent = money(stat2.total);
      document.getElementById('dh-today').textContent = '+' + money(stat2.today);
      document.getElementById('dh-frozen').textContent = money(stat2.frozen + (stat2.settled||0));
      document.getElementById('dh-avail').textContent = money(window.BalanceStore ? BalanceStore.available() : stat2.available);
      document.getElementById('dq-team').textContent = lv2.total + ' 位伙伴';
      document.getElementById('d-active').textContent = lv2.active + ' 位 / ' + money(lv2.consume);
      document.getElementById('lv-tag').textContent = 'Lv.' + lv2.level + ' ' + lv2.name;
      document.getElementById('lv-name').textContent = lv2.name;
      document.getElementById('dh-tier').textContent = 'Lv.' + lv2.level;
      var next2 = lv2.next;
      if (next2) {
        document.getElementById('lv-active-txt').textContent = lv2.active + ' / ' + next2.minActive + ' 位';
        document.getElementById('lv-consume-txt').textContent = money(lv2.consume) + ' / ' + money(next2.minConsume);
        var prgA2 = document.getElementById('prg-active'), prgC2 = document.getElementById('prg-consume');
        if (prgA2) prgA2.style.width = Math.min(100, Math.round(lv2.active/next2.minActive*100)) + '%';
        if (prgC2) prgC2.style.width = Math.min(100, Math.round(lv2.consume/next2.minConsume*100)) + '%';
      }
      document.getElementById('d-upgrade').textContent = next2 ? ('升级还需：有效伙伴 ' + Math.max(0,next2.minActive-lv2.active) + ' 位 · 贡献 ¥' + Math.max(0,next2.minConsume-lv2.consume).toLocaleString('zh-CN')) : '已达最高等级';
    } catch (e) { console.warn('renderDist failed:', e); }
  }
  var _distRerender = null;
  function _distRefresh() { if (_distRerender) clearTimeout(_distRerender); _distRerender = setTimeout(renderDist, 100); }
  window.addEventListener('storage', function (e) { if (e.key === 'engchain-balance' || e.key === 'engchain-state' || e.key === 'engchain-auth') _distRefresh(); });
  window.addEventListener('engchain:balance', _distRefresh);
  window.addEventListener('engchain:state', _distRefresh);
  window.addEventListener('engchain:auth', _distRefresh);
  window.addEventListener('engchain:store-change', _distRefresh);
  window.addEventListener('engchain:rebate', _distRefresh);
})();
</script>
<style>
/* ===== 分销中心 · 深色收益卡（对齐钱包账户卡） ===== */
.dist-scroll{padding-top:12px;padding-bottom:24px;}
.dist-intro{display:flex;flex-direction:column;gap:2px;padding:2px 2px 12px;animation:dh-in .4s var(--e-out) both;}
.dist-hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 20px 16px;margin-bottom:14px;
  background:radial-gradient(130% 120% at 86% -12%, rgba(238,214,151,.20) 0%, transparent 55%),
  linear-gradient(150deg,#252C35 0%,#151A22 46%,#0B0E13 100%);
  box-shadow:0 1px 2px rgba(22,22,22,.06), 0 10px 28px rgba(22,22,22,.14);
  animation:dh-in .5s var(--e-out) both;}
.dh-glow{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(130% 100% at 86% -12%, rgba(238,214,151,.20) 0%, transparent 52%), radial-gradient(100% 80% at 6% 116%, rgba(200,169,97,.14) 0%, transparent 56%);}
.dh-sheen{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(72deg, transparent 44%, rgba(255,244,220,.10) 50%, transparent 56%);animation:dh-sheen 7.6s cubic-bezier(.4,0,.2,1) infinite;}
.dh-line-top{position:absolute;left:10px;right:10px;top:0;height:1px;pointer-events:none;background:linear-gradient(90deg, transparent, rgba(244,231,200,.55), transparent);}
.dh-head{display:flex;align-items:center;justify-content:space-between;position:relative;}
.dh-label{font-size:12px;color:rgba(244,242,238,.66);letter-spacing:.04em;}
.dh-tier{font-size:10px;font-weight:700;letter-spacing:.06em;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#C9A961);border-radius:6px;padding:3px 9px;box-shadow:0 2px 8px -3px rgba(201,169,97,.7);border:1px solid rgba(255,255,255,.4);}
.dh-amount{position:relative;font-family:var(--font-display);font-size:36px;font-weight:800;margin-top:8px;letter-spacing:-.5px;color:#F7F5F1;font-variant-numeric:tabular-nums;}
.dh-foot{position:relative;display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.10);}
.dh-f{display:flex;flex-direction:column;gap:3px;min-width:0;}
.dh-f-label{font-size:10.5px;color:rgba(244,242,238,.52);}
.dh-f-val{font-size:14px;font-weight:700;color:#F2F0EC;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;}
.dh-f-val.green{color:#E8D5A3;}
.dh-sep{width:1px;height:22px;background:rgba(255,255,255,.12);flex:none;}
.dh-f-avail{flex:1;}
.dh-btn{flex:none;display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#C9A961);box-shadow:0 4px 12px -4px rgba(201,169,97,.8);transition:transform var(--d-fast),filter var(--d-fast);}
.dh-btn svg{width:12px;height:12px;}
.dh-btn:active{transform:scale(.94);filter:brightness(.95);}
@keyframes dh-in{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
@keyframes dh-sheen{0%,100%{transform:translateX(-18%);}55%,85%{transform:translateX(18%);}}

/* ===== 快捷入口 ===== */
.dist-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
.dq-item{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:15px 6px 13px;text-align:center;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform var(--d-fast),box-shadow var(--d-fast),border-color var(--d-fast);animation:dq-in .45s var(--e-out) both;}
.dq-item:nth-child(2){animation-delay:.05s;}.dq-item:nth-child(3){animation-delay:.1s;}.dq-item:nth-child(4){animation-delay:.15s;}
.dq-item:active{transform:scale(.95);box-shadow:var(--shadow-xs);border-color:var(--accent-line);}
.dq-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.dq-icon svg{width:20px;height:20px;stroke-width:1.7;}
.dq-gold{background:var(--primary-soft);color:var(--primary-dim);}
.dq-green{background:rgba(43,107,79,.10);color:var(--success);}
.dq-blue{background:rgba(37,99,235,.10);color:var(--blue);}
.dq-purple{background:rgba(124,91,189,.10);color:var(--purple);}
.dq-t1{font-size:12.5px;font-weight:600;color:var(--text-1);}
.dq-t2{font-size:10px;color:var(--text-3);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@keyframes dq-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== 等级卡 ===== */
.lv-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow-card);animation:dh-in .5s var(--e-out) .1s both;}
.lv-head{display:flex;align-items:center;gap:12px;}
.lv-ic{width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);box-shadow:0 6px 16px rgba(201,169,97,.3);}
.lv-ic svg{width:20px;height:20px;stroke-width:1.7;}
.lv-meta{flex:1;min-width:0;}
.lv-name{font-size:15px;font-weight:700;color:var(--text-1);}
.lv-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.lv-bar-sec{margin-top:14px;}
.lv-bar-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:7px;}
.lv-bar-top b{color:var(--text-1);font-weight:700;font-size:12px;}
.wp-bar{height:7px;border-radius:99px;background:var(--bg-card-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.04);}
.wp-fill{height:100%;background:linear-gradient(90deg,#C9A961,#E8D5A3);border-radius:99px;transition:width .8s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;}
.wp-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);animation:wc-shimmer 2.4s linear infinite;transform:translateX(-100%);}
.wp-fill-dim{background:linear-gradient(90deg,var(--primary-dim),var(--primary));}
@keyframes wc-shimmer{to{transform:translateX(100%);}}
.lv-rate{display:flex;align-items:center;margin-top:16px;background:var(--bg-alp);border:1px solid var(--line);border-radius:12px;padding:12px 0;}
.lv-rate-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.lv-rate-i span{font-size:11px;color:var(--text-3);}
.lv-rate-i b{font-size:19px;font-weight:800;color:var(--primary-dim);font-family:var(--font-num);}
.lv-rate-sep{width:1px;height:26px;background:var(--line);}
.lv-foot{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--accent-line);font-size:11.5px;color:var(--primary-dim);font-weight:600;text-align:center;}

/* ===== 规则卡 ===== */
.rule-card{padding:6px 16px 14px;}
.rule-kv{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);}
.rule-kv span{font-size:12px;color:var(--text-3);}
.rule-kv b{font-size:12.5px;font-weight:600;color:var(--text-1);}
.rule-kv b.mono{font-family:var(--font-num);color:var(--primary-dim);}
.rule-txt{line-height:1.8;padding-top:10px;}

@media (prefers-reduced-motion: reduce){
  .dist-hero,.dq-item,.lv-card{animation:none;}
  .dh-sheen,.wp-fill::after{animation:none;}
}
</style>
</body>
</html>
