  .fs-reset:active { transform: scale(.97); }
  .fs-confirm { flex: 1; padding: 12px 0; border-radius: var(--r-full); border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dim)); color: var(--text-inv); font-size: 14px; font-weight: 600; cursor: pointer; transition: all var(--d-fast); box-shadow: 0 4px 14px -4px var(--primary-dim); }
  .fs-confirm:active { transform: scale(.98); }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">资质招商</div>
    <div class="nav-right">
      <button class="icon-btn" onclick="location.href='../search/index.html'" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></button>
    </div>
  </div>

  <!-- 委托需求居中弹窗 -->
  <div class="delegate-mask" id="delegateMask"></div>
  <div class="delegate-modal" id="delegateDropdown">

    <div class="dm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
    <div class="dm-title">提交委托需求</div>
    <div class="dm-text">找不到合适的资质企业？<br>提交您的需求，平台专属顾问将在 <b>2小时内</b> 为您精准匹配。</div>

  <!-- 提交专享委托确认弹窗 -->
  <div class="exclusive-mask" id="exclusiveMask"></div>
  <div class="exclusive-modal" id="exclusiveModal">
    <div class="em-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
    <div class="em-title">提交专享委托</div>
    <div class="em-desc">确认提交专享委托？平台专属顾问将在2小时内与您联系，为您提供1对1精准匹配服务。</div>
    <div class="em-buttons">
      <button class="em-btn em-btn-cancel" id="exclusiveCancel">取消</button>
      <button class="em-btn em-btn-confirm" id="exclusiveOk">确认提交</button>
    </div>
  </div>

  <div class="scroll no-pad" style="padding-bottom:24px;">
    <!-- 首屏 hero：价值主张 + 平台信任数据 -->
    <div class="fz-hero">
      <div class="fz-hero-tag">资质招商 · 分公司加盟</div>
      <div class="fz-hero-title">有资质建企<br>全国开放分公司合作</div>
      <div class="fz-hero-sub">一级/二级总包 · 专业承包 · 设计监理 · 市政等，平台核验真实建企。</div>
      <div class="fz-hero-stats" id="heroStats"></div>
      <div class="fz-hero-cta">
        <button type="button" class="btn btn-primary" id="heroFind">立即找资质</button>
        <button type="button" class="btn btn-ghost" id="heroDelegate">提交委托</button>
      </div>

    <!-- 资质分类 icon 栏 -->
    <div class="cat-bar" id="catBar"></div>

    <!-- 信任背书条 -->
    <div class="trust-row">
      <div class="ti"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-shield"/></svg>实时核验</b><span>资质·备案·安许</span></div>
      <div class="ti"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-bank"/></svg>资金托管</b><span>建行托管更安心</span></div>
      <div class="ti"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-card"/></svg>7天退款</b><span>未对接可申请</span></div>
      <div class="ti"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-headset"/></svg>顾问直连</b><span>1对1匹配</span></div>
    </div>

    <!-- 热门招商企业 -->
    <div class="section-head pad-x">
      <div class="sh-title"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-fire"/></svg></span>热门招商企业</div>
      <div class="sh-more" id="viewAll">查看全部 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
    </div>
    <div class="hot-scroll" id="hotList"></div>

    <!-- 全部招商企业：吸顶筛选栏 + 统计 + 列表 + 加载更多 -->
    <div class="sticky-filter-bar" id="stickyFilterBar">
      <div class="section-head pad-x" style="margin-top:18px;">
        <div class="sh-title"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-company"/></svg></span>全部招商企业</div>
        <button type="button" class="filter-btn" id="filterBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span class="fb-label">筛选</span><span class="fb-count" style="display:none">0</span></button>
      </div>
      <div class="sort-tabs" id="sortTabs"></div>
    </div>
    <div class="result-stats" id="resultStats"></div>
    <div id="fullList"></div>
    <button type="button" class="load-more" id="loadMore">加载更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg></button>

    <!-- 空白占位：筛选结果较少时填充，确保 sticky-filter-bar 始终可吸顶 -->
    <div id="listSpacer"></div>

    <!-- 筛选底部面板 -->
    <div class="filter-mask" id="filterMask"></div>
    <div class="filter-sheet" id="filterSheet">
      <div class="fs-head">
        <span class="fs-title">筛选条件</span>
        <button type="button" class="fs-close" id="filterClose">✕</button>
      </div>
      <div class="fs-body" id="filterBody"></div>
      <div class="fs-foot">
        <button type="button" class="fs-reset" id="filterReset">重置</button>
        <button type="button" class="fs-confirm" id="filterConfirm">确定（查看 <span id="filterCount">0</span> 家）</button>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';

  /* ---- 工具 ---- */
  function ic(name) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-' + name + '"/></svg>'; }
  function iconName(name) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-' + name + '"/></svg>'; }

  /* ---- 分类定义（key 与筛选弹窗 qualType 选项一致，label 用于显示） ---- */
  var CATS = [
    { key: '施工总承包', label: '施工总承包', icon: 'buil',     lv: '总包' },
    { key: '专业承包',   label: '专业承包', icon: 'tool',     lv: '专包' },
    { key: '工程设计',   label: '工程设计', icon: 'edit',     lv: '设计' },
    { key: '监理造价',   label: '监理/造价', icon: 'form',    lv: '监造' },
    { key: '电力机电',   label: '电力/机电', icon: 'bolt',    lv: '电力' },
    { key: '水利公路',   label: '水利/公路', icon: 'pin',     lv: '路桥' },
    { key: '市政公用',   label: '市政公用', icon: 'company',  lv: '市政' }
  ];

  /* ---- 数据源：仅资质招商（type === qualification） ---- */
  var all = (MOCK.franchises || []).filter(function (f) { return f.type === 'qualification'; });

  function filtered() { return all; }

  /* ---- 筛选维度定义 ---- */
  var FILTER_DIMS = [
    { key: 'qualLevel', label: '资质等级', options: ['一级','二级','三级','甲级'] },
    { key: 'qualType',  label: '资质类型', options: ['施工总承包','专业承包','工程设计','监理造价','电力机电','水利公路','市政公用'] },
    { key: 'verified',  label: '认证状态', options: ['已认证','认证中'] },
    { key: 'region',    label: '区域名额', options: ['有空缺','名额紧张'] },
    { key: 'mode',      label: '合作模式', options: ['分公司加盟','资质联营','居间介绍','项目合作'] }
  ];
  var activeFilters = {};
  var tempFilters = {};

  /* 资质类型关键词匹配（数据中 qualType 含斜杠，如"电力/机电"） */
  function matchQualType(f, kw) {
    var t = f.qualType || '';
    if (t.indexOf(kw) > -1) return true;
    if (kw === '监理造价' && (t.indexOf('监理') > -1 || t.indexOf('造价') > -1)) return true;
    if (kw === '电力机电' && (t.indexOf('电力') > -1 || t.indexOf('机电') > -1)) return true;
    if (kw === '水利公路' && (t.indexOf('水利') > -1 || t.indexOf('公路') > -1)) return true;
    return false;
  }
  /* 合作模式匹配（数据中 mode 如"分公司独立核算""分公司/办事处"） */
  function matchMode(f, kw) {
    var m = f.mode || '';
    if (kw === '分公司加盟') return m.indexOf('分公司') > -1;
    return m.indexOf(kw) > -1;
  }
  /* 在分类过滤结果上叠加筛选条件 */
  function applyFilters(list) {
    return list.filter(function (f) {
      if (activeFilters.qualLevel && f.qualLevel !== activeFilters.qualLevel) return false;
      if (activeFilters.qualType && !matchQualType(f, activeFilters.qualType)) return false;
      if (activeFilters.verified) {
        if (activeFilters.verified === '已认证' && !f.verified) return false;
        if (activeFilters.verified === '认证中' && f.verified) return false;
      }
      if (activeFilters.region) {
        var regs = f.regions || [];
        if (activeFilters.region === '有空缺' && !regs.some(function (r) { return r.status === 'vacant'; })) return false;
        if (activeFilters.region === '名额紧张' && !regs.some(function (r) { return r.status === 'limited'; })) return false;
      }
      if (activeFilters.mode && !matchMode(f, activeFilters.mode)) return false;
      return true;
    });
  }

  /* ---- 渲染分类 icon 栏（与筛选弹窗 qualType 维度联动） ---- */
  function renderCatBar() {
    var catBar = document.getElementById('catBar');
    if (!catBar) return;
    catBar.innerHTML = '';
    CATS.forEach(function (c) {
      var n = all.filter(function (f) { return matchQualType(f, c.key); }).length;
      var active = activeFilters.qualType === c.key;
      var el = document.createElement('div');
      el.className = 'cat-item' + (active ? ' active' : '');
      el.dataset.cat = c.key;
      el.innerHTML = '<div class="cat-icon">' + iconName(c.icon) + '</div><span class="cat-label">' + c.label + '</span><span class="cat-cnt">' + n + ' 家</span>';
      el.addEventListener('click', function () {
        if (activeFilters.qualType === c.key) {
          delete activeFilters.qualType;
        } else {
          activeFilters.qualType = c.key;
        }
        currentSort = 'default';
        renderCatBar();
        renderSortTabs();
        updateFilterBtnState();
        renderList();
        scrollToSticky();
      });
      catBar.appendChild(el);
    });
    var moreEl = document.createElement('div');
    moreEl.className = 'cat-item more';
    moreEl.innerHTML = '<div class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div><span class="cat-label">全部资质</span>';
    moreEl.addEventListener('click', function () {
      delete activeFilters.qualType;
      currentSort = 'default';
      renderCatBar();
      renderSortTabs();
      updateFilterBtnState();
      renderList();
      scrollToSticky();
    });
    catBar.appendChild(moreEl);
  }
  renderCatBar();

  /* ---- 首屏 hero 平台数据 ---- */
  (function () {
    var st = (MOCK.business && MOCK.business.compliance && MOCK.business.compliance.stats) || [];
    document.getElementById('heroStats').innerHTML = st.map(function (s) {
      return '<div class="hs-item"><div class="hs-num">' + s.v.replace('+', '<i>+</i>') + '</div><div class="hs-label">' + s.k + '</div></div>';
    }).join('');
  })();

  /* ---- 区域名额标签 ---- */
  function regionTag(rg) {
    var cls = rg.status === 'full' ? 'full' : (rg.status === 'limited' ? 'limited' : 'vacant');
    var dot = rg.status === 'full' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg>'
             : (rg.status === 'limited' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v6M12 17.5v.01"/><circle cx="12" cy="12" r="9"/></svg>'
             : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>');
    var label = rg.status === 'full' ? rg.city + '·已满' : (rg.status === 'limited' ? rg.city + '·仅剩' + (rg.seats || 1) + '席' : rg.city + '·空缺');
    return '<span class="fc-region ' + cls + '">' + dot + label + '</span>';
  }

  /* ---- 招商企业卡 ---- */
  function verifiedTag(f) {
    return f.verified
      ? '<span class="tag tag-gold" style="display:inline-flex;align-items:center;gap:3px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:10px;height:10px;stroke-width:2.5;"><path d="M20 6 9 17l-5-5"/></svg>已认证</span>'
      : '<span class="tag tag-gray" style="display:inline-flex;align-items:center;gap:3px;">认证中</span>';
  }
  function levelTag(f) { return '<span class="tag tag-primary">' + (f.qualLevel || '') + (f.qualType || '') + '</span>'; }
  function urgentTag(f) {
    if (f.publishTime === '今天') return '<span class="tag tag-red">今日新上</span>';
    if ((f.regions || []).some(function (r) { return r.status === 'limited'; })) return '<span class="tag" style="background:rgba(217,119,6,.1);color:var(--accent);">名额紧张</span>';
    return '';
  }

  function franchiseCard(f) {
    var regionsHtml = (f.regions || []).slice(0, 4).map(regionTag).join('');
    var hotCls = f.hot ? ' hot' : '';
    return '<a href="../supply/detail.html?id=' + f.id + '" class="franchise-card' + hotCls + '">' +
      '<div class="fc-top">' + verifiedTag(f) + levelTag(f) + urgentTag(f) +
        '<span class="match-pill match-high" style="margin-left:auto;">' + f.match + '%</span></div>' +
      '<div class="fc-name">' + f.name + ' · ' + (f.qualCategory || f.qualType || '') + '</div>' +
      '<div class="fc-meta">' +
        '<span>' + iconName('pin') + (f.region || f.location) + '</span>' +
        '<span>' + iconName('tool') + (f.mode || '') + '</span>' +
        '<span>' + iconName('wallet') + (f.fee || '') + '</span>' +
      '</div>' +
      '<div class="fc-stats">' +
        '<div class="fs-item"><div class="fs-num">' + (f.branchCount || 0) + '</div><div class="fs-label">已加盟分公司</div></div>' +
        '<div class="fs-item"><div class="fs-num">' + (f.annualProjects || 0) + '</div><div class="fs-label">年中标项目</div></div>' +
        '<div class="fs-item"><div class="fs-num" style="color:var(--accent);">' + ((f.regions || []).filter(function (r) { return r.status !== 'full'; }).length) + '</div><div class="fs-label">区域空缺</div></div>' +
      '</div>' +
      (regionsHtml ? '<div class="fc-regions">' + regionsHtml + '</div>' : '') +
      '<div class="fc-bottom">' +
        '<div class="fc-price"><span class="p">¥' + (f.unlockPrice || 98) + '</span>' +
          (f.originalPrice ? '<span class="o">¥' + f.originalPrice + '</span>' : '') +
          '<span class="u">/ 联系方式</span></div>' +
        '<span class="fc-view">查看详情 ' + iconName('chev-r') + '</span>' +
      '</div>' +
    '</a>';
  }

  /* ---- 热门 横向卡 ---- */
  function hotCard(f) {
    var regs = (f.regions || []).filter(function (r) { return r.status !== 'full'; }).slice(0, 2)
      .map(function (r) { return '<span class="fc-region ' + (r.status === 'limited' ? 'limited' : 'vacant') + '">' + (r.status === 'limited' ? r.city + '·仅剩' + (r.seats || 1) + '席' : r.city + '·空缺') + '</span>'; }).join('');
    /* 热门卡片空间有限：紧急标签只显示一个（今日新上优先于名额紧张） */
    var urgent = f.publishTime === '今天'
      ? '<span class="tag tag-red">今日新上</span>'
      : ((f.regions || []).some(function (r) { return r.status === 'limited'; })
        ? '<span class="tag" style="background:rgba(217,119,6,.1);color:var(--accent);">名额紧张</span>'
        : '');
    /* 资质等级与名称拆分为两个标签，下移到公司名称下方 */
    var levelTagHtml = f.qualLevel ? '<span class="tag tag-primary">' + f.qualLevel + '</span>' : '';
    var typeTagHtml = f.qualType ? '<span class="tag tag-gray">' + f.qualType + '</span>' : '';
    return '<a href="../supply/detail.html?id=' + f.id + '" class="hcard">' +
      '<div class="hc-top">' + urgent + '<span class="match-pill match-high" style="margin-left:auto;">' + f.match + '%</span></div>' +
      '<div class="hc-name">' + f.name + '</div>' +
      '<div class="hc-tags">' + levelTagHtml + typeTagHtml + '</div>' +
      '<div class="hc-region">' + regs + '</div>' +
      '<div class="hc-bottom"><span class="hc-go">查看详情 ' + iconName('chev-r') + '</span></div>' +
    '</a>';
  }

  /* ---- 热门列表（全局热点，不受分类过滤） ---- */
  (function () {
    var hot = all.filter(function (f) { return f.hot; });
    var el = document.getElementById('hotList');
    el.innerHTML = hot.length ? hot.map(hotCard).join('') : '<div style="width:100%;text-align:center;">暂无热门企业</div>';
  })();

  /* ---- 查看全部 — 滚动到全部招商企业列表 ---- */
  document.getElementById('viewAll').addEventListener('click', function () {
    document.getElementById('stickyFilterBar').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ---- 排序 tabs ---- */
  var SORTS = [ { k: 'default', label: '综合' }, { k: 'newest', label: '最新' }, { k: 'match', label: '匹配度' }, { k: 'fee', label: '费用' } ];
  var currentSort = 'default';
  var pageSize = 6, shownCount = 0, fullListEl = document.getElementById('fullList');

  function publishOrder(v) { return { '今天': 0, '近3天': 1, '近一周': 2, '近一月': 3 }[v] == null ? 4 : { '今天': 0, '近3天': 1, '近一周': 2, '近一月': 3 }[v]; }
  function sortArr(list) {
    var a = list.slice();
    if (currentSort === 'newest') a.sort(function (x, y) { return publishOrder(x.publishTime) - publishOrder(y.publishTime) || (y.views - x.views); });
    else if (currentSort === 'match') a.sort(function (x, y) { return y.match - x.match; });
    else if (currentSort === 'fee') a.sort(function (x, y) { return (x.unlockPrice || 99) - (y.unlockPrice || 99); });
    return a;
  }

  function renderSortTabs() {
    document.getElementById('sortTabs').innerHTML = SORTS.map(function (s) {
      return '<span class="st-item' + (s.k === currentSort ? ' active' : '') + '" data-sort="' + s.k + '">' + s.label + '</span>';
    }).join('');
    document.getElementById('sortTabs').querySelectorAll('.st-item').forEach(function (el) {
      el.addEventListener('click', function () { currentSort = el.dataset.sort; renderSortTabs(); renderList(); scrollToSticky(); });
    });
  }

  /* ---- 统计 ---- */
  function renderStats(list) {
    var certified = list.filter(function (f) { return f.verified; }).length;
    var vacant = list.reduce(function (s, f) { return s + (f.regions || []).filter(function (r) { return r.status !== 'full'; }).length; }, 0);
    document.getElementById('resultStats').innerHTML =
      '当前筛选出 <b class="rs-c1">' + list.length + '</b> 家招商企业，其中已认证 <b class="rs-c2">' + certified + '</b> 家，区域空缺 <b class="rs-c3">' + vacant + '</b> 处';
  }

  /* ---- 全部列表：分页（加载更多） ---- */
  function renderList() {
    var sorted = sortArr(applyFilters(filtered()));
    renderStats(sorted);
    var lm = document.getElementById('loadMore');
    if (!sorted.length) {
      lm.style.display = 'none';
      var hasFilter = Object.keys(activeFilters).filter(function (k) { return activeFilters[k]; }).length > 0;
      fullListEl.innerHTML = '<div class="empty-state">' +
        '<div class="es-illustration">' +
          '<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<circle cx="60" cy="60" r="50" fill="var(--primary-soft)" opacity="0.5"/>' +
            '<circle cx="60" cy="60" r="36" fill="var(--bg-card)"/>' +
            '<path d="M45 52 L55 62 L78 40" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>' +
            '<circle cx="60" cy="60" r="22" stroke="var(--primary)" stroke-width="2" stroke-dasharray="4 3" opacity="0.4"/>' +
            '<path d="M52 58 L58 64 L70 52" stroke="var(--primary-dim)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>' +
        '</div>' +
        '<div class="es-title">' + (hasFilter ? '没有找到匹配的招商需求' : '暂无招商需求数据') + '</div>' +
        '<div class="es-desc">' + (hasFilter ? '当前筛选条件下暂无结果，试试调整筛选条件' : '平台正在持续拓展招商需求，敬请期待') + '</div>' +
        (hasFilter ? '<button class="es-btn es-btn-primary" id="emptyReset">重置筛选条件</button>' : '') +
        '<button class="es-btn es-btn-outline" id="emptyDelegate">发布招商需求</button>' +
        '<button class="es-btn es-btn-outline" id="emptyExclusive">提交专享委托</button>' +
      '</div>';
      if (hasFilter) {
        document.getElementById('emptyReset').addEventListener('click', function () {
          activeFilters = {};
          currentSort = 'default';
          shownCount = 0;
          renderCatBar();
          renderSortTabs();
          renderList();
          UI.toast('已重置筛选条件', 'ok');
        });
      }
      document.getElementById('emptyDelegate').addEventListener('click', openDelegatePanel);
      document.getElementById('emptyExclusive').addEventListener('click', openExclusiveConfirm);
    } else {
      shownCount = Math.min(pageSize, sorted.length);
      fullListEl.innerHTML = sorted.slice(0, shownCount).map(franchiseCard).join('');
      if (sorted.length <= shownCount) {
        lm.style.display = 'none';
        var lfIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>';
        fullListEl.innerHTML += window.ListFooter.render({
          icon: lfIcon,
          title: '已显示全部公开招商需求',
          desc: '没有更多招商或存在私信招商信息，委托顾问或提交专享委托获取精准匹配',
          buttons: [
            { text: '发布招商需求', style: 'outline', onClick: openDelegatePanel },
            { text: '提交专享委托', style: 'outline', onClick: openExclusiveConfirm }
          ]
        });
      } else {
        lm.style.display = 'flex';
        lm.innerHTML = '加载更多（' + (sorted.length - shownCount) + '） <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>';
      }
    }
    ensureMinScrollHeight();
  }

  /* ---- 最小滚动高度保障：筛选结果较少时填充空白，确保 sticky-filter-bar 始终可吸顶 ---- */
  function ensureMinScrollHeight() {
    var scroll = document.querySelector('.scroll');
    var bar = document.getElementById('stickyFilterBar');
    var spacer = document.getElementById('listSpacer');
    if (!scroll || !bar || !spacer) return;
    // 先保存 bar 位置（重置 spacer 后 sticky 元素 offsetTop 可能临时异常）
    var barTop = bar.offsetTop;
    var barH = bar.offsetHeight;
    spacer.style.minHeight = '0';
    // 所需最小内容高度 = stickyBar 在文档流中的位置 + 自身高度 + 一屏可视高度
    // 这样确保 stickyBar 吸顶后，下方至少还有一屏的滚动空间，不会到达容器底部而"掉下来"
    var needed = barTop + barH + scroll.clientHeight;
    var current = scroll.scrollHeight;
    if (current < needed) {
      spacer.style.minHeight = (needed - current) + 'px';
    } else {
      spacer.style.minHeight = '0';
    }
  }
  document.getElementById('loadMore').addEventListener('click', function () {
    var sorted = sortArr(applyFilters(filtered()));
    shownCount = Math.min(shownCount + pageSize, sorted.length);
    fullListEl.innerHTML = sorted.slice(0, shownCount).map(franchiseCard).join('');
    if (sorted.length <= shownCount) {
      this.style.display = 'none';
      var lfIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>';
      fullListEl.innerHTML += window.ListFooter.render({
        icon: lfIcon,
        title: '已显示全部公开招商需求',
        desc: '没有更多招商或存在私信招商信息，委托顾问或提交专享委托获取精准匹配',
        buttons: [
          { text: '发布招商需求', style: 'outline', onClick: openDelegatePanel },
          { text: '提交专享委托', style: 'outline', onClick: openExclusiveConfirm }
        ]
      });
    } else {
      this.innerHTML = '加载更多（' + (sorted.length - shownCount) + '） <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>';
    }
    ensureMinScrollHeight();
  });

  /* ---- hero CTA ---- */
  document.getElementById('heroFind').addEventListener('click', function () {
    document.getElementById('fullList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('heroDelegate').addEventListener('click', function () { UIDialog(); });

  /* ---- 提交委托需求（确认弹窗） ---- */
  function UIDialog() {
    UI.dialog({
      title: '提交委托需求',
      text: '平台将根据您的需求，为您匹配符合要求的资质企业。<br>提交后专属顾问将在 <b>2小时内</b> 与您联系。',
      ok: '确认提交',
      cancel: '再看看',
      onOk: function () { UI.toast('委托需求已提交，顾问将尽快联系您', 'ok'); }
    });
  }

  /* ---- 提交专享委托确认弹窗 ---- */
  function openExclusiveConfirm() {
    document.getElementById('exclusiveMask').classList.add('show');
    document.getElementById('exclusiveModal').classList.add('show');
  }
  function closeExclusiveConfirm() {
    document.getElementById('exclusiveMask').classList.remove('show');
    document.getElementById('exclusiveModal').classList.remove('show');
  }
  document.getElementById('exclusiveMask').addEventListener('click', closeExclusiveConfirm);
  document.getElementById('exclusiveCancel').addEventListener('click', closeExclusiveConfirm);
  document.getElementById('exclusiveOk').addEventListener('click', function () {
    closeExclusiveConfirm();
    UI.toast('已提交专享委托，顾问将在2小时内联系您', 'ok');
  });

  /* ---- 委托需求居中弹窗：点击底部卡片触发 / 关闭按钮或遮罩关闭 ---- */
  var ddEl = document.getElementById('delegateDropdown');
  var ddMask = document.getElementById('delegateMask');
  var dmClose = document.getElementById('dmClose');

  function openDelegatePanel() {
    ddMask.classList.add('show');
    ddEl.classList.add('show');
  }
  function closeDelegatePanel() {
    ddMask.classList.remove('show');
    ddEl.classList.remove('show');
  }

  /* 关闭按钮 & 遮罩点击关闭 */
  dmClose.addEventListener('click', closeDelegatePanel);
  ddMask.addEventListener('click', closeDelegatePanel);

  /* 弹窗内的提交按钮：关闭弹窗 + 弹出确认窗 */
  document.getElementById('ddSubmitBtn').addEventListener('click', function () {
    closeDelegatePanel();
    UIDialog();
  });

  /* ---- 筛选面板交互 ---- */
  var filterBtn = document.getElementById('filterBtn');
  var filterMask = document.getElementById('filterMask');
  var filterSheet = document.getElementById('filterSheet');
  var filterBody = document.getElementById('filterBody');
  var filterClose = document.getElementById('filterClose');
  var filterReset = document.getElementById('filterReset');
  var filterConfirm = document.getElementById('filterConfirm');
  var filterCountEl = document.getElementById('filterCount');

  function filterObjCount(f) { return Object.keys(f).length; }

  function renderFilterBody() {
    filterBody.innerHTML = FILTER_DIMS.map(function (dim) {
      var tags = dim.options.map(function (opt) {
        var active = tempFilters[dim.key] === opt;
        return '<span class="fs-tag' + (active ? ' active' : '') + '" data-dim="' + dim.key + '" data-val="' + opt + '">' + opt + '</span>';
      }).join('');
      return '<div class="fs-group"><div class="fs-group-title">' + dim.label + '</div><div class="fs-tags">' + tags + '</div></div>';
    }).join('');
    filterBody.querySelectorAll('.fs-tag').forEach(function (tag) {
      tag.addEventListener('click', function () {
        var dim = tag.dataset.dim;
        var val = tag.dataset.val;
        if (tempFilters[dim] === val) delete tempFilters[dim];
        else tempFilters[dim] = val;
        renderFilterBody();
        updateTempCount();
      });
    });
  }

  function updateTempCount() {
    var n = filterObjCount(tempFilters);
    filterCountEl.textContent = n;
  }

  function updateFilterBtnState() {
    var n = filterObjCount(activeFilters);
    var cnt = filterBtn.querySelector('.fb-count');
    if (n > 0) {
      cnt.style.display = 'inline-flex';
      cnt.textContent = n;
      filterBtn.classList.add('active');
    } else {
      cnt.style.display = 'none';
      filterBtn.classList.remove('active');
    }
  }

  function openFilterSheet() {
    tempFilters = {};
    for (var k in activeFilters) tempFilters[k] = activeFilters[k];
    renderFilterBody();
    updateTempCount();
    filterMask.classList.add('show');
    filterSheet.classList.add('show');
  }
  function closeFilterSheet() {
    filterMask.classList.remove('show');
    filterSheet.classList.remove('show');
  }

  filterBtn.addEventListener('click', openFilterSheet);
  filterMask.addEventListener('click', closeFilterSheet);
  filterClose.addEventListener('click', closeFilterSheet);
  filterReset.addEventListener('click', function () {
    tempFilters = {};
    renderFilterBody();
    updateTempCount();
  });
  filterConfirm.addEventListener('click', function () {
    activeFilters = {};
    for (var k in tempFilters) activeFilters[k] = tempFilters[k];
    closeFilterSheet();
    updateFilterBtnState();
    shownCount = 0;
    renderCatBar();
    renderList();
    scrollToSticky();
  });

  /* ---- 吸顶检测：滚动时给 sticky-filter-bar 添加 is-stuck 类 ---- */
  var stickyBar = document.getElementById('stickyFilterBar');
  var scrollContainer = document.querySelector('.scroll');
  function checkSticky() {
    if (!stickyBar || !scrollContainer) return;
    var barRect = stickyBar.getBoundingClientRect();
    var scrollRect = scrollContainer.getBoundingClientRect();
    if (barRect.top <= scrollRect.top + 4) stickyBar.classList.add('is-stuck');
    else stickyBar.classList.remove('is-stuck');
  }
  if (scrollContainer) {
    scrollContainer.addEventListener('scroll', checkSticky);
    window.addEventListener('resize', checkSticky);
  }
  setInterval(checkSticky, 150);
  setTimeout(checkSticky, 100);

  /* ---- 统一滚动到吸顶栏 ---- */
  function scrollToSticky() {
    if (scrollContainer && stickyBar) {
      var barRect = stickyBar.getBoundingClientRect();
      var scrollRect = scrollContainer.getBoundingClientRect();
      scrollContainer.scrollBy({ top: barRect.top - scrollRect.top, behavior: 'smooth' });
      setTimeout(checkSticky, 300);
    }
  }

  /* ---- 初始化 ---- */
  renderSortTabs();
  renderList();
})();
</script>
</body>
</html>
