<script>
(function(){
  window.__ROOT__ = '../../';

  /* 主题同步 */
  try {
    var t = localStorage.getItem('engchain-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}

  window.go = function(url) { location.href = url; };

  /* 动态权限解锁：根据用户身份解锁对应功能 */
  (function() {
    try {
      var idy = window.deriveIdentity ? deriveIdentity() : { primary: 'guest' };
      var primary = idy.primary;
      /* 分销中心：入驻企业 / 个人合伙人专享 */
      var distUnlocked = primary === 'partner' || primary === 'resident';
      /* 简历投递：pro及以上解锁 */
      var resumeUnlocked = primary === 'pro' || primary === 'partner' || primary === 'enterprise' || primary === 'resident';

      function unlockItem(gridSelector, href) {
        var item = document.querySelector(gridSelector + ' .af-item');
        if (!item) return;
        item.classList.remove('locked');
        item.onclick = function() { location.href = href; };
        var lockIcon = item.querySelector('.af-lock');
        if (lockIcon) lockIcon.style.display = 'none';
      }

      if (distUnlocked) unlockItem('.af-grid[data-group="partner"]', '../distribution/index.html');
      if (resumeUnlocked) unlockItem('.af-grid[data-group="talent"]', '../personnel/index.html');
    } catch(e) {}
  })();

  window.showLocked = function(name) {
    if (window.UI && UI.dialog) {
      UI.dialog({
        title: name + ' · 未开通',
        text: '该功能需完成对应认证后开通。\n请前往「认证中心」查看开通条件。',
        ok: '去认证',
        cancel: '取消',
        onOk: function() { location.href = 'auth-prep.html?type=center'; }
      });
    } else {
      alert(name + '暂未开通，请前往认证中心查看开通条件。');
    }
  };

  /* 搜索过滤 */
  window.filterFunctions = function() {
    var kw = document.getElementById('af-search-input').value.trim().toLowerCase();
    var items = document.querySelectorAll('.af-item');
    var groups = document.querySelectorAll('.af-group-title');
    var grids = document.querySelectorAll('.af-grid');

    items.forEach(function(item) {
      var label = item.querySelector('.af-label').textContent.toLowerCase();
      var match = !kw || label.indexOf(kw) >= 0;
      item.style.display = match ? '' : 'none';
    });

    /* 隐藏空分组 */
    for (var i = 0; i < grids.length; i++) {
      var visible = grids[i].querySelectorAll('.af-item:not([style*="display: none"])').length;
      if (groups[i]) groups[i].style.display = visible > 0 ? '' : 'none';
    }
  };
})();
</script>
