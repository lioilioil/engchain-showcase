<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>资料准备 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/liquid-cta.css?v=20260928183624">
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title" id="ap-nav-title">资料准备</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll ap-scroll">
    <!-- 顶部说明 -->
    <div class="ap-intro">
      <div class="ap-intro-ic"><svg class="ic" style="width:22px;height:22px;"><use href="#i-doc"/></svg></div>
      <div class="ap-intro-text">
        <div class="fw-700 fs-15" id="ap-intro-title">资料准备</div>
        <div class="text-3 fs-12" id="ap-intro-sub" style="margin-top:3px;line-height:1.6;">提前准备好以下资料，填写更顺畅</div>
      </div>
    </div>

    <!-- 实名认证权益提示（认证决策点）：仅个人实名认证类型显示，绿色系呼应"解锁"语义 -->
    <div class="ap-perk" id="ap-perk" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px;flex:none;color:var(--success,#5B9A6F);margin-top:1px;"><path d="M20 6L9 17l-5-5"/></svg>
      <div class="ap-perk-tx">
        <div class="ap-perk-t">实名认证免费解锁 5 条供需</div>
        <div class="ap-perk-s">认证通过后即可发布供需、联系洽谈，解锁 5 条免费查看额度</div>
      </div>
    </div>

    <!-- 资料清单卡片 -->
    <div class="card ap-doc-card">
      <div class="ap-card-head">
        <div class="fw-700 fs-14">需准备的资料</div>
        <span class="ap-doc-count" id="ap-doc-count">共 0 项</span>
      </div>
      <div class="ap-doc-list" id="ap-doc-list"></div>
    </div>

    <!-- 温馨提示 -->
    <div class="ap-tip">
      <svg class="ic" style="width:14px;height:14px;color:var(--primary);flex:none;margin-top:1px;"><use href="#i-shield"/></svg>
      <span>所有资料仅用于平台审核，加密存储不对外泄露。准备好后点击下方按钮开始填写。</span>
    </div>
  </div>

  <!-- 底部固定按钮 -->
  <div class="ap-bottom-bar" data-lg-cta="bar">
    <button class="btn btn-primary btn-block btn-lg" onclick="goFill()">我已准备好，开始填写</button>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function(){window.__ROOT__='../../';

/* ===== 5种认证类型配置 ===== */
var TYPES={
  realname:{
    title:'个人认证',navTitle:'个人认证 · 资料准备',
    sub:'实名认证与人脸核验，全程免费，约 3 分钟完成',
    redirect:'auth-personal.html',
    docs:[
      {icon:'form',name:'身份证人像面',desc:'清晰免冠、四角完整、无反光无遮挡',eg:'示例：本人手持身份证正面照片'},
      {icon:'folder',name:'身份证国徽面',desc:'清晰完整、在有效期内、信息可辨',eg:'示例：身份证背面（国徽面）照片'},
      {icon:'doc',name:'本人手机号',desc:'实名登记手机号，用于接收核验结果通知',eg:'示例：138****8888'}
    ],
  },
  qualification:{
    title:'个人入驻',navTitle:'个人入驻 · 资料准备',
    sub:'上传专业资质并完善简历，解锁人才展示与岗位匹配',
    redirect:'auth-qualification.html',
    docs:[
      {icon:'shield',name:'专业资质证书',desc:'建造师、造价师等，清晰可辨编号与有效期',eg:'示例：一级建造师注册证书照片'},
      {icon:'doc',name:'个人简历',desc:'完整工作经历与项目经验，必填项',eg:'示例：含近5年工作经历的PDF简历'},
      {icon:'user',name:'个人照片',desc:'近期免冠正面照，用于人才主页展示',eg:'示例：白底或蓝底证件照'}
    ],
  },
  partner:{
    title:'个人合伙人',navTitle:'个人合伙人 · 资料准备',
    sub:'登记推广渠道与分销意向，享有二级分销权益与专属支持',
    redirect:'auth-partner.html',
    docs:[
      {icon:'sparkle',name:'推广渠道说明',desc:'描述主要推广渠道、方式与预期推广规模',eg:'示例：微信群推广、朋友圈、行业论坛等'},
      {icon:'briefcase',name:'行业经验介绍',desc:'相关行业经验、人脉资源与合作意向',eg:'示例：5年建筑行业经验，拥有施工方资源'}
    ],
  },
  enterprise:{
    title:'企业认证',navTitle:'企业认证 · 资料准备',
    sub:'提交工商信息完成企业核验，年费 ¥999，人工审核 1-3 个工作日',
    redirect:'auth-enterprise.html',
    docs:[
      {icon:'form',name:'营业执照',desc:'四角完整、在有效期内、统一社会信用代码清晰可辨',eg:'示例：营业执照正本或副本扫描件'},
      {icon:'user',name:'法人身份证',desc:'企业法人本人身份证正反面，信息清晰',eg:'示例：法人身份证人像面+国徽面'},
      {icon:'shield',name:'企业公章（可选）',desc:'加盖公章的授权委托书，非必填但可加快审核',eg:'示例：加盖企业公章的认证授权书'}
    ],
  },
  entry:{
    title:'企业入驻',navTitle:'企业入驻 · 资料准备',
    sub:'选择企业类型并提交资料，缴费后进入审核，解锁经营权益',
    redirect:'entry.html',
    docs:[
      {icon:'shield',name:'企业资质证书',desc:'建筑业企业资质、中介服务资质等相关证书',eg:'示例：建筑工程施工总承包资质证书'},
      {icon:'doc',name:'企业介绍资料',desc:'公司简介、业务范围、核心优势等说明文档',eg:'示例：含公司简介和业务范围的PDF文档'},
      {icon:'folder',name:'案例图片',desc:'过往项目案例照片，最多 9 张，展示企业实力',eg:'示例：项目现场照片、完工案例图等'},
      {icon:'bank',name:'对公账户信息',desc:'企业对公银行账户，用于平台结算与缴费',eg:'示例：开户行名称+对公账号'}
    ],
  }
};

/* ===== 解析 type 参数 ===== */
function getType(){
  var m=/[?&]type=([^&]+)/.exec(location.search);
  var t=m?decodeURIComponent(m[1]):'';
  return TYPES[t]?t:'realname';
}

var curType=getType();
var cfg=TYPES[curType];

/* 实名认证权益提示：仅 realname 类型显示（其余类型对应不同权益，避免错配文案） */
if(curType==='realname'){
  var perkEl=document.getElementById('ap-perk');
  if(perkEl)perkEl.style.display='flex';
}

/* ===== 渲染页面 ===== */
document.getElementById('ap-nav-title').textContent=cfg.navTitle;
document.getElementById('ap-intro-title').textContent=cfg.title;
document.getElementById('ap-intro-sub').textContent=cfg.sub;
document.title=cfg.navTitle+' · 工程链';

/* 资料清单 */
var docHtml=cfg.docs.map(function(d,i){
  return '<div class="ap-doc-item">'+
    '<span class="ap-doc-ic"><svg class="ic" style="width:17px;height:17px;"><use href="#i-'+d.icon+'"/></svg></span>'+
    '<div class="ap-doc-info">'+
      '<div class="ap-doc-name"><span class="ap-doc-idx">'+(i+1)+'</span>'+d.name+'</div>'+
      '<div class="ap-doc-desc">'+d.desc+'</div>'+
      '<div class="ap-doc-eg">'+d.eg+'</div>'+
    '</div>'+
  '</div>';
}).join('');
document.getElementById('ap-doc-list').innerHTML=docHtml;
document.getElementById('ap-doc-count').textContent='共 '+cfg.docs.length+' 项';

/* ===== 跳转 ===== */
window.goFill=function(){
  UI.dialog({
    title: '确认协议',
    text: '请确认您已阅读并同意<a href="../agreement/user.html#auth">《认证与授权服务协议》</a>',
    ok: '确认并继续',
    cancel: '返回',
    onOk: function(){ location.href=cfg.redirect; }
  });
};

/* ===== 入场动效 ===== */
document.querySelectorAll('.ap-intro,.ap-doc-card,.ap-tip').forEach(function(el,i){
  el.style.opacity='0';el.style.transform='translateY(10px)';
  setTimeout(function(){el.style.transition='all .4s var(--e-out)';el.style.opacity='1';el.style.transform='none';},80*i);
});
})();
</script>
<style>
.ap-scroll{padding-top:14px;padding-bottom:100px;}

/* ========== 顶部说明 ========== */
.ap-intro{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:14px;
  border-radius:16px;background:linear-gradient(135deg,rgba(176, 138, 60, .08),var(--bg-card));
  border:1px solid rgba(176, 138, 60, .2);}
.ap-intro-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary);flex:none;}
.ap-intro-text{flex:1;min-width:0;}

/* ========== 卡片通用 ========== */
.ap-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ap-doc-card{padding:16px;margin-bottom:14px;}
.ap-doc-count{font-size:11px;color:var(--text-3);background:var(--bg-card-2);padding:3px 10px;border-radius:999px;}

/* ========== 实名认证权益提示 ========== */
.ap-perk{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;margin:0 0 14px;border-radius:12px;background:var(--success-soft,rgba(91,154,111,.10));border:1px solid rgba(91,154,111,.24);}
.ap-perk-tx{flex:1;min-width:0;}
.ap-perk-t{font-size:13px;font-weight:700;color:var(--text-1);}
.ap-perk-s{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.6;}

/* ========== 资料清单 ========== */
.ap-doc-list{display:flex;flex-direction:column;gap:12px;}
.ap-doc-item{display:flex;gap:11px;padding:12px;border-radius:11px;background:var(--bg-card-2);
  border:1px solid var(--line-hairline);transition:all .2s ease;}
.ap-doc-item:active{transform:scale(.99);background:rgba(176, 138, 60, .04);}
.ap-doc-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary);flex:none;}
.ap-doc-info{flex:1;min-width:0;}
.ap-doc-name{font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:7px;}
.ap-doc-idx{width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--text-inv);font-size:10px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-num);}
.ap-doc-desc{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.6;}
.ap-doc-eg{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.5;
  padding-left:8px;border-left:2px solid var(--line);}

/* ========== 温馨提示 ========== */
.ap-tip{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;font-size:12px;color:var(--text-3);line-height:1.7;
  background:var(--bg-card-2);border-radius:12px;margin:0 2px;}

/* ========== 底部固定按钮 ========== */
.ap-bottom-bar{position:fixed;left:0;right:0;bottom:0;padding:12px var(--page-pad) calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 30%);z-index:50;}
.ap-bottom-bar .btn{box-shadow:0 6px 20px rgba(176, 138, 60, .3);}

/* ========== 375px 适配 ========== */
@media(max-width:375px){
  .ap-doc-item{padding:10px;gap:9px;}
  .ap-doc-ic{width:32px;height:32px;}
  .ap-doc-name{font-size:12px;}
  .ap-doc-desc{font-size:11px;}
  .ap-doc-eg{font-size:10px;}
  .ap-intro{padding:14px;gap:10px;}
  .ap-intro-ic{width:38px;height:38px;}
}
</style>
<script src="../../js/liquid-glass.iife.js?v=2026100310"></script>
<script src="../../js/liquid-cta.js?v=20260928184535"></script>
