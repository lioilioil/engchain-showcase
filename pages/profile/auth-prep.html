/* ===== 解析 type 参数 ===== */
function getType(){
  var m=/[?&]type=([^&]+)/.exec(location.search);
  var t=m?decodeURIComponent(m[1]):'';
  return TYPES[t]?t:'realname';
}

var curType=getType();
var cfg=TYPES[curType];

/* ===== 渲染页面 ===== */
document.getElementById('ap-nav-title').textContent=cfg.navTitle;
document.getElementById('ap-intro-title').textContent=cfg.title;
document.getElementById('ap-intro-sub').textContent=cfg.sub;
document.title=cfg.navTitle+' · 工程链';

/* 资料清单 */
var docHtml=cfg.docs.map(function(d,i){
  return '<div class="ap-doc-item">'+
    '<span class="ap-doc-ic"><svg class="ic" style="width:17px;height:17px;"><use href="#i-'+d.icon+'"/></svg></span>'+
    '<div class="ap-doc-info">'+

      '<div class="ap-doc-eg">'+d.eg+'</div>'+
    '</div>'+
  '</div>';
}).join('');

document.getElementById('ap-doc-count').textContent='共 '+cfg.docs.length+' 项';

/* 字幕文本 */
document.getElementById('ap-subtitle-text').textContent=cfg.subtitle;

/* ===== 跳转 ===== */
window.goFill=function(){
  location.href=cfg.redirect;
};

/* ===== AI 语音指引 ===== */
var audio=document.getElementById('ap-audio');
var playing=false;

function toggleVoice(){
  if(!audio){return;}
  if(playing){
    audio.pause();
    playing=false;
    updateVoiceUI(false);
  }else{
    audio.play().then(function(){
      playing=true;
      updateVoiceUI(true);
    }).catch(function(){
      /* 播放失败（自动播放策略/文件缺失）：不伪装播放中，显示字幕并提示 */
      playing=false;
      updateVoiceUI(false);
      showSubtitleOnly();
      try{UI.toast('音频播放受限，已显示文字字幕','warn');}catch(e){}
    });
  }
}

function replayVoice(){
  if(!audio){return;}
  audio.currentTime=0;
  audio.play().then(function(){
    playing=true;
    updateVoiceUI(true);
  }).catch(function(){
    playing=false;
    updateVoiceUI(false);
    showSubtitleOnly();
  });
}

function updateVoiceUI(isPlaying){
  var status=document.getElementById('ap-voice-status');
  var hint=document.getElementById('ap-voice-hint');
  var subtitle=document.getElementById('ap-subtitle');
  var ctrlPlay=document.getElementById('ap-ctrl-play');
  var voiceLabel=document.getElementById('ap-voice-label');
  if(!status||!hint||!subtitle||!ctrlPlay||!voiceLabel){return;}
  if(isPlaying){
    status.style.display='flex';
    hint.style.display='none';
    subtitle.style.display='block';
    ctrlPlay.textContent='暂停';
    voiceLabel.textContent='播放中';
  }else{
    status.style.display='none';
    hint.style.display='block';
    hint.textContent='点击播放';
    ctrlPlay.textContent='播放';
    voiceLabel.textContent='已暂停';
  }
}

/* 播放失败时仅展示字幕，不显示播放中状态 */
function showSubtitleOnly(){
  var subtitle=document.getElementById('ap-subtitle');
  var hint=document.getElementById('ap-voice-hint');
  if(subtitle){subtitle.style.display='block';}
  if(hint){hint.style.display='block';hint.textContent='点击播放';}
}

if(audio){
  audio.addEventListener('ended',function(){
    playing=false;
    updateVoiceUI(false);
    var voiceLabel=document.getElementById('ap-voice-label');
    if(voiceLabel){voiceLabel.textContent='播放完成';}
    var hint=document.getElementById('ap-voice-hint');
    if(hint){hint.style.display='block';hint.textContent='重新播放';}
  });
}

/* ===== AI 文字自动填充 ===== */
var filling=false;
function aiFill(){
  if(filling){return;}
  filling=true;
  var thinking=document.getElementById('ap-fill-thinking');
  if(!thinking){filling=false;return;}
  thinking.style.display='flex';
  setTimeout(function(){
    thinking.style.display='none';
    filling=false;
    try{
      UI.toast('AI已为您准备示例信息，进入表单后可一键填充','ok');
    }catch(e){
      /* 兜底：toast不可用时不阻塞 */
    }
  },1200);
}

/* ===== 事件绑定（addEventListener，避免内联onclick作用域问题）===== */
var voiceBtn=document.getElementById('ai-voice-btn');
if(voiceBtn){voiceBtn.addEventListener('click',toggleVoice);}
var fillBtn=document.getElementById('ai-fill-btn');
if(fillBtn){fillBtn.addEventListener('click',aiFill);}
var ctrlPlay=document.getElementById('ap-ctrl-play');
if(ctrlPlay){ctrlPlay.addEventListener('click',function(e){e.stopPropagation();toggleVoice();});}
var ctrlReplay=document.getElementById('ap-ctrl-replay');
if(ctrlReplay){ctrlReplay.addEventListener('click',function(e){e.stopPropagation();replayVoice();});}

/* 初始化UI状态 */
updateVoiceUI(false);

/* ===== 入场动效 ===== */
document.querySelectorAll('.ap-intro,.ap-doc-card,.ap-ai-card,.ap-tip').forEach(function(el,i){
  el.style.opacity='0';el.style.transform='translateY(10px)';
  setTimeout(function(){el.style.transition='all .4s var(--e-out)';el.style.opacity='1';el.style.transform='none';},80*i);
});
})();
</script>

.ap-doc-info{flex:1;min-width:0;}
.ap-doc-name{font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:7px;}

.ap-ai-card{padding:16px;margin-bottom:14px;}

.ap-ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ap-ai-option{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:16px 10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--bg-card);
  cursor:pointer;transition:all .2s ease;min-height:130px;}
.ap-ai-option:active{transform:scale(.97);border-color:rgba(201,169,97,.4);background:rgba(201,169,97,.03);}
.ap-ai-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
.ap-ai-ic-voice{background:rgba(91,141,184,.12);color:#5B8DB8;}
.ap-ai-ic-fill{background:var(--primary-soft);color:var(--primary);}
.ap-ai-name{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:4px;}
.ap-ai-desc{font-size:11px;color:var(--text-3);line-height:1.5;}

/* 语音播放状态 */
.ap-voice-hint{font-size:11px;color:var(--text-3);margin-top:10px;display:flex;align-items:center;gap:4px;}
.ap-voice-hint::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:.5;}
.ap-voice-status{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px;width:100%;}
.ap-wave{display:flex;align-items:flex-end;gap:2px;height:18px;}
.ap-wave span{width:3px;border-radius:2px;background:var(--primary);animation:ap-wave 1s ease-in-out infinite;}
.ap-wave span:nth-child(1){height:6px;animation-delay:0s;}
.ap-wave span:nth-child(2){height:12px;animation-delay:.15s;}
.ap-wave span:nth-child(3){height:16px;animation-delay:.3s;}
.ap-wave span:nth-child(4){height:10px;animation-delay:.45s;}
.ap-wave span:nth-child(5){height:7px;animation-delay:.6s;}
