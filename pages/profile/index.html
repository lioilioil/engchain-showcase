<script>
(function () {
  window.__ROOT__ = '../../';

  /* ---------- 主题切换 ---------- */
  function getTheme() {
    try { return localStorage.getItem('engchain-theme') || 'light'; } catch (e) { return 'light'; }
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var btn = document.getElementById('pf-theme-btn');
    if (btn) {
      btn.innerHTML = theme === 'dark'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    }
  }
  function toggleTheme() {
    var t = getTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('engchain-theme', t); } catch (e) {}
    applyTheme(t);
  }
  window.toggleTheme = toggleTheme;
  applyTheme(getTheme());

  /* ---------- 身份配置 ---------- */
  var ID_CFG = {
    guest: { level:0, label:'游客', titleIcon:'i-user', nextText:'登录后解锁全部功能',
      benefits:[{name:'浏览供需列表',icon:'i-eye',owned:true},{name:'收藏与关注',icon:'i-star',owned:false},{name:'发布供需信息',icon:'i-form',owned:false}] },
    registered: { level:1, label:'注册会员', titleIcon:'i-user', nextText:'完成个人认证，解锁发布供需与联系洽谈权益',
      benefits:[{name:'浏览供需列表',icon:'i-eye',owned:true},{name:'收藏与关注',icon:'i-star',owned:true},{name:'发布供需信息',icon:'i-form',owned:false}] },
    realname: { level:2, label:'个人认证', titleIcon:'i-shield', nextText:'您已完成实名认证，下一步开通个人入驻，解锁人才展示与简历投递',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:false}] },
    pro: { level:3, label:'专业工程师', titleIcon:'i-award', nextText:'已解锁全部个人权益，可申请企业入驻拓展业务',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] },
    partner: { level:3, label:'合作伙伴', titleIcon:'i-briefcase', nextText:'合作伙伴权益已全部开通',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] },
    enterprise: { level:4, label:'企业认证', titleIcon:'i-company', nextText:'企业权益已全部开通',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] },
    resident: { level:5, label:'入驻企业', titleIcon:'i-buil', nextText:'入驻企业全部权益已开通',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] }
  };

  function currentIdentity() {
    try {
      if (window.deriveIdentity) return deriveIdentity();
    } catch (e) {}
    return { primary:'guest', enterprise:'', identities:[] };
  }

  /* ---------- 渲染：用户头部 ---------- */
  function renderHeader() {
    var st = {};
    try { st = UI.state.get(); } catch (e) {}
    var idy = currentIdentity();
    var isReal = idy.primary === 'realname' || idy.primary === 'pro' || idy.primary === 'partner' || idy.primary === 'enterprise' || idy.primary === 'resident';

    var name = st.user || (st.loggedIn ? '工程用户' : '游客');
    var nameEl = document.getElementById('pf-username');
    if (nameEl) nameEl.textContent = name;
    var avatarEl = document.getElementById('pf-avatar');
    if (avatarEl) avatarEl.textContent = name.charAt(0) || '游';

    /* E3-17 封禁状态：通过副标题显示 */
    var isBanned = false;
    try { var me = (window.DataBus && DataBus.current) ? DataBus.current() : null; isBanned = !!(me && me.banned); } catch (e) {}

    var sub = document.getElementById('pf-usersub');
    if (sub) {
      if (isBanned) sub.textContent = '账号已被封禁，功能受限';
      else if (!st.loggedIn) sub.textContent = '登录后解锁全部功能';
      else if (isReal) sub.textContent = '';
      else sub.textContent = '注册用户 · 完成认证解锁更多权益';
    }
  }

  /* ---------- 入驻类型 → 标签 / 徽标（E1-15 单一来源） ---------- */
  var ENTRY_TYPE_MAP = {
    construction: { label: '建筑入驻', badge: '蓝V', cls: 'blueV' },
    agency:       { label: '中介入驻', badge: '金V', cls: 'goldV' },
    partner:      { label: '合伙人入驻', badge: '专属', cls: 'exclusive' }
  };
  function entryBadgeHtml(type) {
    return window.IdBadge ? IdBadge.render(type, 'md') : '';
  }
  function entryLabelText(type) {
    var m = ENTRY_TYPE_MAP[type];
    return m ? (m.label + ' · ' + m.badge) : '入驻企业';
  }

  /* ---------- 渲染：身份卡（环形进度） ---------- */
  function renderIdentity() {
    var idy = currentIdentity(), cfg = ID_CFG[idy.primary] || ID_CFG.registered;
    var eStatus = {};
    try { if (window.EntryStore) eStatus = EntryStore.read() || {}; } catch (e) {}
    var isReview = (eStatus.status === 'pending' || eStatus.status === 'review' || eStatus.status === 'first_ok');
    var types = idy.entryTypes || [];

    /* E1-15 入驻类型化标题 */
    var titleText = cfg.label;
    if (idy.enterprise === 'resident' && types.length) {
      titleText = entryLabelText(types[0]);
    } else if (idy.partner && idy.identities.indexOf('partner') >= 0) {
      titleText = '个人合伙人';
    }

    /* 身份徽章渲染到 pf-badges 容器 */
    var badgeBox = document.getElementById('pf-badges');
    if (badgeBox) {
      var badgeHtml = '';
      /* 入驻类型徽章 */
      if (idy.enterprise === 'resident' && types.length && window.IdBadge) {
        badgeHtml += IdBadge.render(types[0], 'sm');
      } else if (idy.partner && idy.identities.indexOf('partner') >= 0 && window.IdBadge) {
        badgeHtml += IdBadge.render('individual', 'sm');
      }
      /* 等级标签 */
      badgeHtml += '<span style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(201,169,97,.15);color:#a98a47;border:1px solid rgba(201,169,97,.3);">Lv.' + cfg.level + '</span>';
      badgeBox.innerHTML = badgeHtml;
    }

    /* E1-19 审核中引导文字渲染到 pf-usersub */
    var guideText;
    if (isReview) {
      guideText = '入驻审核中 · 预计 3-5 个工作日完成，结果将短信通知';
    } else {
      guideText = cfg.nextText;
    }
    var subEl = document.getElementById('pf-usersub');
    if (subEl && !isReview) {
      /* 非审核中状态，renderHeader 已设置副标题，这里不覆盖 */
    } else if (subEl && isReview) {
      subEl.textContent = guideText;
    }

    /* 权益 pills 渲染到双线身份区域下方 */
    var dualBox = document.getElementById('pf-dualline-wrap');
    if (dualBox && cfg.benefits && cfg.benefits.length) {
      var pillsHtml = '<div style="display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 0;">';
      for (var i = 0; i < cfg.benefits.length; i++) {
        var b = cfg.benefits[i];
        var iconSvg = b.owned
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px;"><path d="M20 6L9 17l-5-5"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
        pillsHtml += '<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600;background:rgba(255,255,255,.06);color:rgba(245,240,230,.7);border:1px solid rgba(201,169,97,.15);' + (b.owned ? '' : 'opacity:.5;') + '">' + iconSvg + b.name + '</span>';
      }
      pillsHtml += '</div>';
      /* 检查是否已添加pills，避免重复 */
      if (!dualBox.querySelector('.id-pills-row')) {
        var pillsWrap = document.createElement('div');
        pillsWrap.className = 'id-pills-row';
        pillsWrap.innerHTML = pillsHtml;
        dualBox.appendChild(pillsWrap);
      }
    }
  }

  /* ---------- E1-12 双线身份区：个人线 + 企业线 + 入驻类型徽标 ---------- */
  var PERSONAL_LABEL = {
    none: '未认证', verified: '个人实名', professional: '个人入驻(资质)',
    partner: '个人合伙人', full: '个人入驻 + 个人合伙人'
  };
  var ENTERPRISE_LABEL = {
    none: '未认证', verified: '企业认证', resident: '企业入驻'
  };
  function renderDualLine() {
    var box = document.getElementById('pf-dualline-wrap');
    if (!box) return;
    var idy = currentIdentity();
    var st = {}; try { st = UI.state.get(); } catch (e) {}
    if (!st.loggedIn) { box.innerHTML = ''; return; }

    var personalVal = PERSONAL_LABEL[idy.personal] || '未认证';
    var enterpriseVal = ENTERPRISE_LABEL[idy.enterprise] || '未认证';

    /* 入驻类型徽标（蓝V/金V/专属） */
    var badges = '';
    (idy.entryTypes || []).forEach(function (t) { badges += entryBadgeHtml(t); });
    /* 个人合伙人徽章 */
    if (idy.partner && idy.identities.indexOf('partner') >= 0) {
      badges += (window.IdBadge ? IdBadge.render('individual', 'md') : '<span class="entry-badge exclusive">个人合伙人</span>');
    }
    /* 系统自动判定的入驻等级（非用户选择） */
    var tierBadge = '';
    var tierProgress = '';
    if (idy.enterprise === 'resident' && window.EntryTier) {
      var _ttype = (idy.entryTypes && idy.entryTypes[0]) || 'construction';
      if (idy.partner && idy.identities.indexOf('partner') >= 0) _ttype = 'partner';
      var _tlevel = EntryTier.evaluate(_ttype);
      tierBadge = EntryTier.render(_ttype, _tlevel);
      tierProgress = EntryTier.renderProgress(_ttype, _tlevel);
    }

    /* E1-17 resident 权益卡片（折扣/佣金率/分销权限） */
    var extra = '';
    if (idy.enterprise === 'resident') {
      var discount = '';
      try { if (window.creditDiscount) discount = Math.round(creditDiscount() * 100) + '%'; } catch (e) {}
      var acc = window.entryAccess ? entryAccess() : {};
      extra = '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--me-border);display:flex;gap:8px;">' +
        '<div style="flex:1;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--me-gold-deep);">' + (discount || '80%') + '</div><div style="font-size:10px;color:var(--me-text-3);">积分折扣</div></div>' +
        '<div style="flex:1;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--me-gold-deep);">' + (acc.distTier === 'full' ? '二级' : '一级') + '</div><div style="font-size:10px;color:var(--me-text-3);">分销权限</div></div>' +
        '<div style="flex:1;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--me-gold-deep);">专属</div><div style="font-size:10px;color:var(--me-text-3);">入驻服务</div></div>' +
      '</div>';
    }

    box.innerHTML =
      '<div class="me-hero-id-row"><span class="me-hero-id-label">个人线</span><span class="me-hero-id-value">' + personalVal + badges + '</span></div>' +
      '<div class="me-hero-id-row"><span class="me-hero-id-label">企业线</span><span class="me-hero-id-value">' + enterpriseVal + tierBadge + '</span></div>' +
      (tierProgress ? '<div style="padding:0 12px;margin-top:4px;">' + tierProgress + '</div>' : '');
  }

  /* ---------- E1-19 入驻审核中横幅 ---------- */
  function renderEntryBanner() {
    var box = document.getElementById('pf-entry-banner');
    if (!box) return;
    var st = {}; try { st = UI.state.get(); } catch (e) {}
    if (!st.loggedIn) { box.innerHTML = ''; return; }
    var e = {}; try { if (window.EntryStore) e = EntryStore.read() || {}; } catch (ex) {}
    if (e.status === 'pending' || e.status === 'review' || e.status === 'first_ok') {
      box.innerHTML =
        '<div class="pf-banner review">' +
          '<span style="flex:none;width:34px;height:34px;border-radius:50%;background:rgba(212,148,90,.18);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;color:#B58040;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>' +
          '<div class="pb-body"><div class="pb-title">入驻审核中 · 预计 3-5 个工作日</div><div class="pb-sub">资料已提交，平台审核通过后自动开通全部入驻权益</div></div>' +
          '<span class="pb-cta" style="font-size:11.5px;font-weight:700;color:#B58040;cursor:pointer;" onclick="location.href=\'entry.html\'">进度 ›</span>' +
        '</div>';
    } else {
      box.innerHTML = '';
    }
  }

  /* ---------- E2 破冰期建筑入驻限时横幅 ---------- */
  function renderBreakinBanner() {
    var box = document.getElementById('pf-breakin-banner');
    if (!box) return;
    var on = !!(window.ModeStore && ModeStore.isBreakIn());
    var idy = currentIdentity();
    if (on && idy.enterprise !== 'resident') {
      box.innerHTML =
        '<div class="pf-banner breakin" onclick="location.href=\'entry.html\'">' +
          '<div class="pb-body"><div class="pb-title">建筑入驻限时 0 元</div><div class="pb-sub">破冰期专享 · 中介入驻 5 折 · 名额有限</div></div>' +
          '<span class="pb-cta" style="font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;">立即入驻 ›</span>' +
        '</div>';
    } else {
      box.innerHTML = '';
    }
  }

  /* ---------- E3-17 封禁用户横幅 + 入口置灰 ---------- */
  function renderBannedBanner() {
    var box = document.getElementById('pf-banned-banner');
    if (!box) return;
    var isBanned = false;
    try { var me = (window.DataBus && DataBus.current) ? DataBus.current() : null; isBanned = !!(me && me.banned); } catch (e) {}
    if (isBanned) {
      box.innerHTML =
        '<div class="pf-banner" style="background:rgba(212,101,90,.1);border:1px solid rgba(212,101,90,.35);margin-bottom:12px;">' +
          '<div class="pb-body"><div class="pb-title" style="color:var(--me-red);">账号已封禁</div><div class="pb-sub" style="color:var(--me-text-2);">交易与发布功能已暂停，如需申诉请查看详情</div></div>' +
          '<span class="pb-cta" style="font-size:12px;font-weight:700;color:var(--me-red);cursor:pointer;" onclick="location.href=\'../auth/banned.html\'">封禁详情 ›</span>' +
        '</div>';
      /* 功能入口置灰 */
      var quick = document.getElementById('pf-quick-scroll');
      if (quick) quick.classList.add('is-banned-dim');
    } else {
      box.innerHTML = '';
    }
  }

  /* ---------- E2 诚信分游客/未认证隐藏，替换为引导 ---------- */
  function renderCreditGuide() {
    /* Hero区中的诚信分卡片 */
    var creditCard = document.querySelector('.me-hero-credit');
    var guide = document.getElementById('pf-credit-guide');
    var idy = currentIdentity();
    var locked = idy.isGuest || idy.primary === 'guest' || idy.primary === 'registered';
    if (creditCard) creditCard.style.display = locked ? 'none' : '';
    if (guide) {
      if (locked) {
        guide.innerHTML =
          '<div class="glass guide" style="padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:12px;" onclick="location.href=\'auth-prep.html?type=center\'">' +
            '<span style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--me-text);">诚信分</div><div style="font-size:11px;color:var(--me-text-3);margin-top:2px;">完成实名认证解锁诚信分，分数影响发布/提现权限</div></span>' +
            '<span style="flex:none;font-size:11.5px;font-weight:700;color:var(--me-gold-deep);">去认证 ›</span>' +
          '</div>';
      } else {
        guide.innerHTML = '';
      }
    }
  }

  /* ---------- 渲染：KPI 数字 ---------- */
  function renderKPI() {
    var fav = 0, pub = 0, deal = 0, follow = 0;
    try {
      /* E2：收藏数从 FavoriteStore 真实读取（不再硬编码 0） */
      if (window.FavoriteStore) fav = (FavoriteStore.list() || []).length;
      if (window.DataBus) {
        if (DataBus.published) pub = DataBus.published().length;
        else if (window.SupplyStore) pub = (SupplyStore.listActive() || []).length;
        if (DataBus.orders) {
          var ord = DataBus.orders();
          deal = ord.filter(function (o) { return o.status === 'settled' || o.status === '已成交'; }).length;
        }
        /* 关注数：分销团队成员作为"我的团队/关注"近似真实计数 */
        if (DataBus.distTeam) { try { follow = (DataBus.distTeam() || []).length; } catch (e) {} }
      }
    } catch (e) {}
    animateNum('pf-kpi-fav', fav);
    animateNum('pf-kpi-pub', pub);
    animateNum('pf-kpi-deal', deal);
    animateNum('pf-kpi-follow', follow);
  }

  function animateNum(id, target) {
    var el = document.getElementById(id);
    if (!el) return;
    var start = 0, dur = 600, t0 = null;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(start + (target - start) * eased);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 渲染：钱包 ---------- */
  function renderWallet() {
    var bal = 0;
    try {
      var wal = (window.DataBus && DataBus.wallet) ? DataBus.wallet() : JSON.parse(localStorage.getItem('engchain-wallet') || '{}');
      bal = wal.balance != null ? wal.balance : 0;
    } catch (e) {}
    var txt = Number(bal).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    var b1 = document.getElementById('pf-wallet-balance');
    if (b1) b1.textContent = txt;
  }

  /* ---------- 渲染：订单状态 ---------- */
  function renderOrderStates() {
    var states = [
      { key:'all', label:'全部', icon:'i-box' },
      { key:'normal', label:'普通订单', icon:'i-card' },
      { key:'mediation', label:'中介服务', icon:'i-shield' }
    ];
    var counts = { all:0, normal:0, mediation:0 };
    /* E1-03 游客态：订单数清零，显示"登录后查看"，不展示硬编码/模拟订单数 */
    var st0 = {}; try { st0 = UI.state.get(); } catch (e) {}
    var guest = !st0.loggedIn;
    if (!guest) {
      try {
        /* 普通订单 */
        var ord = (window.DataBus && DataBus.orders) ? DataBus.orders() : JSON.parse(localStorage.getItem('engchain-orders') || '[]');
        counts.normal = ord.length;
        counts.all += ord.length;
        /* 中介托管订单 */
        if (window.Mediation) {
          try {
            var me = (window.DataBus && DataBus.current) ? DataBus.current() : null;
            var uid = me ? me.id : '';
            var med = Mediation.list({ uid: uid });
            counts.mediation = med.length;
            counts.all += med.length;
          } catch (e2) {}
        }
      } catch (e) {}
    }

    var html = states.map(function (st) {
      var iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#' + st.icon + '"/></svg>';
      return '<div class="order-item" onclick="event.stopPropagation();location.href=\'../order/index.html?tab=' + st.key + '\'">' +
        '<div class="order-icon" style="position:relative;">' + iconSvg +
          (counts[st.key] > 0 ? '<span class="order-badge">' + counts[st.key] + '</span>' : '') +
        '</div>' +
        '<span class="order-label">' + st.label + '</span>' +
      '</div>';
    }).join('');

    var el1 = document.getElementById('pf-order-states');
    if (el1) el1.innerHTML = html;
  }

  /* ---------- 渲染：常用功能横滚 ---------- */
  function renderQuick() {
    var q = document.getElementById('pf-quick-scroll'); if (!q) return;
    var st; try { st = UI.state.get(); } catch (e) { st = {}; }
    var guest = !st.loggedIn;

    var orderCount = 0;
    try {
      var ord = (window.DataBus && DataBus.orders) ? DataBus.orders() : JSON.parse(localStorage.getItem('engchain-orders') || '[]');
      orderCount = ord.filter(function (x) { return x.status !== 'settled' && x.status !== '已成交' && x.status !== 'cancelled'; }).length;
    } catch (e) {}

    var delegateCount = 0;
    try { if (window.Delegates) delegateCount = Delegates.counts().all; } catch (e) {}

    var items = [
      { href:'../order/index.html', ic:'i-box', cls:'ic-gold', title:'我的订单', badge:orderCount > 0 ? String(orderCount) : '' },
      { href:'../wallet/index.html', ic:'i-wallet', cls:'ic-green', title:'我的钱包' },
      { href:'../distribution/index.html', ic:'i-share', cls:'ic-gold', title:'分销中心', lock:true, unlockKey:'dist' },
      { href:'../agency/seller-board.html', ic:'i-briefcase', cls:'ic-purple', title:'服务经营', lock:true, unlockKey:'agency' },
      { href:'../publish/records.html', ic:'i-form', cls:'ic-blue', title:'发布管理' },
      { href:'delegates.html', ic:'i-doc', cls:'ic-blue', title:'我的委托', badge:delegateCount > 0 ? String(delegateCount) : '' },
      { href:'../favorite/index.html', ic:'i-fav', cls:'ic-red', title:'我的收藏' },
      { href:'../wallet/invoice.html', ic:'i-doc', cls:'ic-orange', title:'发票管理' },
      { href:'../refund/index.html', ic:'i-rotate', cls:'ic-purple', title:'退款售后' },
      { href:'../message/index.html', ic:'i-chat', cls:'ic-gold', title:'我的消息' },
      { href:'auth-prep.html?type=center', ic:'i-shield', cls:'ic-blue', title:'认证中心' },
      { href:'../personnel/index.html', ic:'i-file', cls:'ic-blue', title:'简历投递', lock:true, unlockKey:'resume' },
      { href:'my-applies.html', ic:'i-briefcase', cls:'ic-green', title:'我的投递' },
      { href:'../personnel/index.html', ic:'i-user', cls:'ic-green', title:'人才市场' }
    ];

    /* 权限解锁条件（单一来源 entryAccess：分销=入驻/个人合伙人；服务经营=中介入驻） */
    var acc = window.entryAccess ? entryAccess() : { dist: false, agency: false };
    var idy = currentIdentity();
    /* 简历投递：pro及以上解锁 */
    var resumeUnlocked = idy.primary === 'pro' || idy.primary === 'partner' || idy.primary === 'enterprise' || idy.primary === 'resident';
    var distUnlocked = acc.dist;
    var agencyUnlocked = acc.agency;

    q.innerHTML = items.map(function (it) {
      var unlocked = it.unlockKey === 'dist' ? distUnlocked : (it.unlockKey === 'agency' ? agencyUnlocked : resumeUnlocked);
      var isLocked = it.lock && !unlocked;
      /* E1-02 游客点击任意受限功能 → 登录引导 sheet（原无反应） */
      var click = guest
        ? 'onclick="requireLoginSheet(\'登录后解锁「' + it.title + '」\')"'
        : (isLocked ? 'onclick="quickLocked(\'' + it.unlockKey + '\')"' : 'onclick="location.href=\'' + it.href + '\'"');
      var iconSvg = it.ic === 'i-rotate'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l2.5 2.5"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#' + it.ic + '"/></svg>';
      var iconColor = it.cls === 'ic-gold' ? 'c1' : (it.cls === 'ic-green' ? 'c2' : (it.cls === 'ic-blue' ? 'c3' : (it.cls === 'ic-red' ? 'c4' : (it.cls === 'ic-orange' ? 'c5' : 'c1'))));
      var lockStyle = isLocked ? 'opacity:.5;filter:grayscale(.5);' : '';
      return '<div class="tool-item" ' + click + ' style="' + lockStyle + '">' +
        '<div class="tool-icon" style="position:relative;">' + iconSvg +
          (it.badge ? '<span class="tool-badge">' + it.badge + '</span>' : '') +
        '</div>' +
        '<span class="tool-label">' + it.title + '</span>' +
      '</div>';
    }).join('');
  }

  /* ---------- E1-02 游客点击受限功能 → 登录引导 sheet（而非无反应/toast） ---------- */
  function isGuestNow() {
    try { return !UI.state.get().loggedIn; } catch (e) { return true; }
  }
  window.isGuestNow = isGuestNow;
  window.requireLoginSheet = function (tip) {
    var txt = tip || '登录后解锁全部功能';
    if (!window.UI || !UI.sheet) { location.href = '../auth/login.html'; return; }
    var sh = UI.sheet();
    sh.setText('登录/注册');
    sh.html(
      '<div style="padding:6px 4px 4px;text-align:center;">' +
        '<div style="font-size:34px;margin-bottom:10px;">🔐</div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--text-1);margin-bottom:6px;">登录后解锁全部功能</div>' +
        '<div style="font-size:12.5px;color:var(--text-3);line-height:1.6;margin-bottom:18px;">' + txt + '</div>' +
        '<button type="button" id="pf-login-cta" style="width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:#fff;font-size:15px;font-weight:700;cursor:pointer;">立即登录</button>' +
      '</div>'
    );
    sh.show();
    var cta = document.getElementById('pf-login-cta');
    if (cta) cta.addEventListener('click', function () { location.href = '../auth/login.html'; });
  };
  /* E1-02 钱包充值/提现：游客 → 登录引导；已登录 → 钱包页 */
  window.pfWalletAction = function (action) {
    if (isGuestNow()) { window.requireLoginSheet('充值、提现、解锁入驻等资金与交易功能均需先登录账号'); return; }
    if (action === 'view') location.href = '../wallet/index.html';
    else location.href = '../wallet/index.html?action=' + action;
  };

  /* ---------- 锁定入口点击引导（分销/服务经营/简历投递） ---------- */
  window.quickLocked = function (key) {
    var cfg = {
      dist: { title: '分销中心 · 未开通', text: '完成<b>企业入驻</b>（建筑/中介/合伙人三选一）或申请<b>个人合伙人</b>后开通分销返佣。', href: 'auth-prep.html?type=center' },
      agency: { title: '服务经营 · 未开通', text: '完成「<b>中介服务企业</b>」入驻后开通服务经营工作台：<br>服务橱窗、在线接单、托管结算、履约保证金。', href: 'entry.html' },
      resume: { title: '简历投递 · 未开通', text: '完成<b>个人入驻</b>（专业资质认证）后开通简历投递与人才展示。', href: 'auth-prep.html?type=center' }
    };
    var c = cfg[key] || { title: '功能未开通', text: '前往认证中心查看开通条件', href: 'auth-prep.html?type=center' };
    if (window.UI && UI.dialog) UI.dialog({ title: c.title, text: c.text, ok: '去开通', cancel: '取消', onOk: function () { location.href = c.href; } });
    else location.href = c.href;
  };

  /* ---------- 渲染：最近浏览 ---------- */
  function renderHistory() {
    /* 从 ViewHistory 读取最近4条真实浏览记录（仅1个月内） */
    var items = [];
    try { items = window.ViewHistory ? ViewHistory.recent(4) : []; } catch (e) { items = []; }

    var el1 = document.getElementById('pf-history');
    if (!el1) return;

    if (items.length === 0) {
      el1.innerHTML =
        '<div style="padding:20px 12px;text-align:center;color:var(--me-text-3);font-size:12.5px;">' +
          '暂无浏览记录，<span onclick="location.href=\'../supply/list.html\'" style="color:var(--me-gold-deep);cursor:pointer;font-weight:600;">去发现</span>' +
        '</div>';
      return;
    }

    /* 分类图标映射 */
    var ICONS = {
      cooperation: 'i-box', material: 'i-box', equipment: 'i-tool',
      labor: 'i-scaffold', agency: 'i-doc'
    };

    var html = items.map(function (it) {
      var icon = ICONS[it.bizKey] || 'i-doc';
      var price = it.price || '面议';
      return '<div class="history-card" onclick="location.href=\'../supply/detail.html?id=' + encodeURIComponent(it.id) + '\'">' +
        '<div class="history-img">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#' + icon + '"/></svg>' +
        '</div>' +
        '<div class="history-body">' +
          '<div class="history-name">' + (it.title || '未命名条目') + '</div>' +
          '<div class="history-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + (it.city || '未知地区') + '</div>' +
          '<div class="history-price">' + price + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el1.innerHTML = html;
  }

  /* ---------- KPI 跳转 ---------- */
  function pfKpiJump(type) {
    var map = { fav:'../favorite/index.html', pub:'../publish/records.html', deal:'../order/index.html', follow:'../personnel/index.html' };
    if (map[type]) location.href = map[type];
  }
  window.pfKpiJump = pfKpiJump;

  function openMember() {
    var st; try { st = UI.state.get(); } catch (e) { st = {}; }
    if (!st.loggedIn) {
      /* 游客：跳转登录页 */
      location.href = '../auth/login.html';
    } else {
      /* 已登录未认证：跳转认证引导页 */
      location.href = 'auth-prep.html?type=center';
    }
  }
  window.openMember = openMember;


  /* [FEAT 9.2-2] 渲染诚信分 */
  /* ---------- 渲染：等级进度条 ---------- */
  function renderLevelProgress() {
    try {
      var idy = currentIdentity();
      var cfg = ID_CFG[idy.primary] || ID_CFG.registered;
      var level = cfg.level || 1;
      var nextLevel = Math.min(level + 1, 5);
      var pct = (level / 5) * 100;
      var elNum = document.getElementById('pf-level-num');
      var elFill = document.getElementById('pf-level-fill');
      var elNext = document.getElementById('pf-level-next');
      if (elNum) elNum.textContent = level;
      if (elFill) elFill.style.width = pct + '%';
      if (elNext) elNext.textContent = nextLevel;
    } catch (e) {}
  }

  function renderCreditScore() {
    try {
      var me = DataBus.current(); var uid = me ? me.id : '';
      var info = window.svcCreditOf ? svcCreditOf(uid) : { score: 80, level: '新入驻' };
      var score = info.score || 80;
      var csCfg = (MOCK.business.creditScore) || { thresholds: {}, levels: [] };
      var levelLabel = '观察', levelColor = 'gray';
      (csCfg.levels || []).forEach(function (lv) {
        if (score >= lv.min) { levelLabel = lv.label; levelColor = lv.color; }
      });
      var elScore = document.getElementById('cs-score');
      var elLevel = document.getElementById('cs-level');
      var elBar = document.getElementById('cs-bar');
      if (elScore) elScore.textContent = score;
      if (elLevel) { elLevel.textContent = levelLabel; elLevel.style.color = levelColor === 'gold' ? '#C9A961' : levelColor === 'silver' ? '#8A8A8A' : levelColor === 'bronze' ? '#B87333' : '#9A9185'; }
      if (elBar) elBar.style.width = Math.min(100, score) + '%';
    } catch (e) {}
  }
  /* [FEAT 9.2-2] 入驻年度订阅到期提醒 */
  function renderEntryRenew() {
    try {
      if (window.EntryStore && EntryStore.needRenew && EntryStore.needRenew()) {
        var banner = document.getElementById('entry-renew-banner');
        if (banner) {
          var s = EntryStore.read();
          var daysLeft = Math.ceil((s.expireAt - Date.now()) / 864e5);
          var desc = document.getElementById('entry-renew-desc');
          if (desc) desc.textContent = '剩余 ' + daysLeft + ' 天到期，续费后可继续享受全部权益';
          banner.style.display = '';
        }
      }
    } catch(e) {}
  }
  window.__renewEntry = function() {
    try {
      var s = EntryStore.read();
      var t = MOCK.entryTypeById(s.type);
      var price = (t && t.yearly) ? t.yearly.price : 0;
      var r = EntryStore.renew(price);
      if (r && r.error) { UI.toast(r.error, 'warn'); return; }
      UI.toast('续费成功，入驻有效期延长一年', 'ok');
      setTimeout(function(){ location.reload(); }, 1000);
    } catch(e) { UI.toast('续费失败: ' + e.message, 'warn'); }
  };

  /* ---------- 初始化 ---------- */
  var _pfInited = false;
  function init() {
    renderHeader();
    renderIdentity();
    renderDualLine();        /* E1-12 双线身份 + 入驻徽标 */
    renderEntryBanner();     /* E1-19 入驻审核中横幅 */
    renderBreakinBanner();   /* E2 破冰期建筑入驻横幅 */
    renderBannedBanner();    /* E3-17 封禁横幅 */
    renderCreditGuide();     /* E2 诚信分游客引导 */
    renderKPI();
    renderWallet();
    renderOrderStates();
    renderQuick();
    renderHistory();
    renderCreditScore();
    renderLevelProgress();
    renderEntryRenew(); /* [FEAT 9.2-2] */
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* E1-11 身份/入驻/存储变化后重新渲染整个页面（认证/入驻返回自动刷新） */
  window.addEventListener('engchain:auth', init);
  window.addEventListener('engchain:entry', init);
  window.addEventListener('engchain:store-change', init);
  window.addEventListener('engchain:state', init);
  window.addEventListener('storage', function (e) {
    if (e.key && e.key.indexOf('engchain-') === 0) init();
  });
})();
</script>
</body>
</html>
