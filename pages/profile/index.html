<title>我的 · 工程链</title>

<style>
/* ═══════════════════════════════════════════════════════════════
   我的 · 个人工作台 V10.0
   Bento Grid × Liquid Glass 2.0 × Spatial Depth
   设计参考：Apple visionOS / Linear / Stripe / Vercel
   视觉核心：暖米白 + 古铜金 + 液态玻璃 + 空间层次
   ═══════════════════════════════════════════════════════════════ */

/* ---------- 设计令牌 ---------- */
:root {
  --me-radius-lg: 22px;
  --me-radius-md: 16px;
  --me-radius-sm: 12px;
  --me-gap: 12px;
  --me-pad: 18px;

  --me-gold: #C9A961;
  --me-gold-deep: #A98A47;
  --me-gold-light: #E8D9B5;
  --me-gold-pale: #F5EDD8;

  --me-text: #2A2722;
  --me-text-2: #6B6358;
  --me-text-3: #9A9185;
  --me-text-4: #C4BCB0;

  --me-bg: #F2EFE8;
  --me-bg-2: #EDE9E0;
  --me-card: rgba(255,255,255,0.72);
  --me-card-solid: #FFFFFF;
  --me-border: rgba(201,169,97,0.18);
  --me-border-strong: rgba(201,169,97,0.35);

  --me-shadow-1: 0 1px 2px rgba(42,39,34,0.04), 0 2px 8px rgba(42,39,34,0.03);
  --me-shadow-2: 0 2px 4px rgba(42,39,34,0.04), 0 8px 24px rgba(42,39,34,0.06);
  --me-shadow-3: 0 4px 12px rgba(42,39,34,0.06), 0 16px 40px rgba(42,39,34,0.08);

  --me-green: #5B9A6F;
  --me-red: #D4655A;
  --me-blue: #5B8AB5;
  --me-orange: #D4945A;
  --me-purple: #8B7BB5;

  --me-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --me-text: #F0EBE0;
  --me-text-2: #B0A898;
  --me-text-3: #7A7265;
  --me-text-4: #524C42;

  --me-bg: #0E0D0B;
  --me-bg-2: #161411;
  --me-card: rgba(32,30,27,0.7);
  --me-card-solid: #1E1C19;
  --me-border: rgba(201,169,97,0.12);
  --me-border-strong: rgba(201,169,97,0.28);

  --me-gold: #D4B876;
  --me-gold-deep: #B89A5A;
  --me-gold-light: #8A7548;
  --me-gold-pale: #3A3325;

  --me-shadow-1: 0 1px 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.15);
  --me-shadow-2: 0 2px 4px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.2);
  --me-shadow-3: 0 4px 12px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.25);
}

/* ---------- 页面基底 ---------- */
html, body { margin: 0; padding: 0; background: var(--me-bg); }
.phone { background: var(--me-bg); }
.profile-page {
  min-height: 100%;
  background: var(--me-bg);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 100px;
}

/* 背景氛围光 */
.profile-page::before {
  content: '';
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  height: 320px;
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
[data-theme="dark"] .profile-page::before {
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.12) 0%, transparent 70%);
}

.profile-content {
  position: relative;
  z-index: 1;
  padding: 0 16px;
}

/* ---------- 沉浸式头部 ---------- */
.me-header {
  position: relative;
  padding: 10px 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.me-avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.me-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--me-gold-light), var(--me-gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 16px rgba(201,169,97,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
}
.me-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 50%);
}

.me-avatar-edit {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--me-card-solid);
  border: 1.5px solid var(--me-border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--me-shadow-1);
  cursor: pointer;
}
.me-avatar-edit svg { width: 10px; height: 10px; color: var(--me-gold-deep); }

.me-user-info {
  flex: 1;
  min-width: 0;
}

.me-user-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.me-user-name {
  font-size: 19px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.me-verified-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(201,169,97,0.15), rgba(201,169,97,0.08));
  border: 1px solid var(--me-border);
  font-size: 10px;
  font-weight: 600;
  color: var(--me-gold-deep);
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
.me-verified-badge svg { width: 10px; height: 10px; }

.me-user-sub {
  font-size: 12px;
  color: var(--me-text-3);
  display: flex;
  align-items: center;
  gap: 6px;
}

.me-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.me-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--me-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--me-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s var(--me-ease);
  box-shadow: var(--me-shadow-1);
  color: var(--me-text-2);
}
.me-icon-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--me-shadow-2);
  border-color: var(--me-border-strong);
}
.me-icon-btn:active { transform: translateY(0) scale(0.96); }
.me-icon-btn svg { width: 17px; height: 17px; }

/* ---------- Tab 导航（玻璃胶囊） ---------- */
.me-tabs {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 8px 0 14px;
  margin: 0 -16px;
  padding-left: 16px;
  padding-right: 16px;
  background: linear-gradient(to bottom, var(--me-bg) 0%, var(--me-bg) 70%, transparent 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.me-tabs-inner {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--me-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 14px;
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-1);
  position: relative;
}

.me-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px 4px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--me-text-3);
  cursor: pointer;
  transition: all 0.3s var(--me-ease);
  position: relative;
  white-space: nowrap;
}
.me-tab svg { width: 15px; height: 15px; }
.me-tab.active {
  color: #fff;
  font-weight: 600;
  background: linear-gradient(135deg, var(--me-gold), var(--me-gold-deep));
  box-shadow: 0 2px 8px rgba(201,169,97,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.me-tab:not(.active):hover { color: var(--me-text-2); background: rgba(201,169,97,0.06); }

.me-tab-dot {
  position: absolute;
  top: 6px;
  right: calc(50% - 22px);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--me-red);
  box-shadow: 0 0 0 2px var(--me-card);
}

/* ---------- Panel 切换 ---------- */
.me-panel {
  display: none;
  animation: panelIn 0.4s var(--me-ease);
}
.me-panel.active { display: block; }

@keyframes panelIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Liquid Glass 卡片基础 ---------- */
.glass {
  position: relative;
  background: var(--me-card);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-radius: var(--me-radius-lg);
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-2);
  overflow: hidden;
  transition: transform 0.3s var(--me-ease), box-shadow 0.3s var(--me-ease);
}
.glass:hover {
  box-shadow: var(--me-shadow-3);
}
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 40%, transparent 60%, rgba(201,169,97,0.1) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
[data-theme="dark"] .glass::before {
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 40%, transparent 60%, rgba(201,169,97,0.08) 100%);
}

/* 噪点纹理叠加 */
.glass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0.03;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ---------- Bento Grid ---------- */
.bento {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--me-gap);
}

.bento-item { position: relative; }
.bento-full { grid-column: 1 / -1; }

/* ---------- 身份认证门票（上下三部分：身份凭证 / 注册会员 / 引导操作） ---------- */
.id-ticket {
  position: relative;
  border-radius: var(--me-radius-lg);
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.68) 55%, rgba(245,237,216,0.8) 100%);
  box-shadow: var(--me-shadow-2);
}
[data-theme="dark"] .id-ticket {
  background: linear-gradient(135deg, rgba(32,30,27,0.92) 0%, rgba(32,30,27,0.72) 55%, rgba(58,51,37,0.85) 100%);
}

/* 通用分区：三部分之间用虚线分隔 */
.tk-sec {
  position: relative;
  padding: 12px 18px;
}
.tk-sec + .tk-sec::before {
  content: '';
  position: absolute;
  top: 0; left: 18px; right: 18px;
  border-top: 1.5px dashed var(--me-border-strong);
}

/* 第一部分：身份凭证（顶部条） */
.tk-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 11px;
  padding-bottom: 10px;
  background: linear-gradient(180deg, rgba(255,255,255,0.55), transparent);
}
.tk-sec-title {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.6px;
  color: var(--me-gold-deep);
}
.tk-sec-title svg { width: 13px; height: 13px; }
.tk-sec-code {
  font-size: 9px;
  letter-spacing: 1.6px;
  color: var(--me-text-4);
  font-family: var(--font-mono, monospace);
}

/* 第二部分：注册会员（中部主区） */
.tk-sec-member { padding-top: 13px; padding-bottom: 15px; }
.tk-sec-label {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 1.8px;
  color: var(--me-gold-deep);
  opacity: 0.75;
  margin-bottom: 10px;
}
.tk-member-body {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* 第三部分：引导操作（底部条，可点击） */
.tk-sec-guide {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-top: 11px;
  padding-bottom: 11px;
  cursor: pointer;
  background: linear-gradient(180deg, rgba(201,169,97,0.09), rgba(201,169,97,0.02));
  transition: background 0.25s var(--me-ease);
}
.tk-sec-guide:active { background: rgba(201,169,97,0.16); }
.tk-sec-guide > svg { width: 16px; height: 16px; color: var(--me-gold-deep); flex: none; }
.tk-guide-text {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  color: var(--me-text-2);
  line-height: 1.45;
  font-weight: 500;
}
.tk-guide-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--me-card);
  border: 1px solid var(--me-border);
  color: var(--me-gold-deep);
  flex: none;
}
.tk-guide-arrow svg { width: 12px; height: 12px; }

/* 门票内身份信息紧凑适配 */
.id-ticket .id-ring-wrap { width: 64px; height: 64px; flex-shrink: 0; }
.id-ticket .id-ring-center { inset: 7px; }
.id-ticket .id-ring-level { font-size: 14px; }
.id-ticket .id-status { font-size: 15px; }
.id-ticket .id-desc { font-size: 10.5px; margin-bottom: 8px; }
.id-ticket .id-pill { padding: 2.5px 7px; font-size: 9.5px; }
.id-ticket .id-pill svg { width: 8px; height: 8px; }

.id-ring-wrap {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
}

.id-ring-bg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--me-border);
}

.id-ring-fg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--me-gold);
  border-right-color: var(--me-gold);
  transform: rotate(-90deg);
  transition: transform 0.8s var(--me-ease);
}

.id-ring-center {
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--me-gold-pale), var(--me-gold-light));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.5);
}
[data-theme="dark"] .id-ring-center {
  background: linear-gradient(135deg, rgba(201,169,97,0.15), rgba(201,169,97,0.05));
}

.id-ring-level {
  font-size: 16px;
  font-weight: 800;
  color: var(--me-gold-deep);
  line-height: 1;
}
.id-ring-label {
  font-size: 8px;
  color: var(--me-text-3);
  margin-top: 2px;
  font-weight: 500;
}

.id-info { flex: 1; min-width: 0; }

.id-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.id-status {
  font-size: 16px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.2px;
}

.id-level-tag {
  padding: 2px 8px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--me-gold), var(--me-gold-deep));
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 6px rgba(201,169,97,0.3);
}

.id-desc {
  font-size: 11.5px;
  color: var(--me-text-3);
  margin-bottom: 10px;
  line-height: 1.4;
}

.id-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.id-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  background: rgba(91,154,111,0.1);
  color: var(--me-green);
  border: 1px solid rgba(91,154,111,0.2);
}
.id-pill.locked {
  background: rgba(154,145,133,0.08);
  color: var(--me-text-3);
  border-color: var(--me-border);
}
.id-pill svg { width: 9px; height: 9px; }

/* ---------- 钱包卡 ---------- */
.wallet-card {
  padding: 16px;
  cursor: pointer;
  background: linear-gradient(135deg, rgba(201,169,97,0.16), rgba(201,169,97,0.06)) !important;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  min-height: 148px;
  display: flex;
  flex-direction: column;
}
.wallet-card:hover { transform: translateY(-2px); }

.wallet-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--me-text-3);
  margin-bottom: 8px;
  font-weight: 500;
}
.wallet-label svg { width: 13px; height: 13px; color: var(--me-gold-deep); }

.wallet-balance {
  font-size: 24px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 10px;
}
.wallet-balance .cur {
  font-size: 14px;
  font-weight: 600;
  color: var(--me-text-2);
  margin-right: 2px;
}

.wallet-actions {
  display: flex;
  gap: 6px;
}

.wallet-btn {
  flex: 1;
  padding: 6px 0;
  border-radius: 8px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s var(--me-ease);
  background: var(--me-gold);
  color: #fff;
  border: none;
}
.wallet-btn:hover { background: var(--me-gold-deep); }
.wallet-btn.ghost {
  background: transparent;
  color: var(--me-gold-deep);
  border: 1px solid var(--me-border-strong);
}
.wallet-btn.ghost:hover { background: rgba(201,169,97,0.1); }

/* ---------- 订单卡 ---------- */
.order-card {
  padding: 16px;
  cursor: pointer;
  min-height: 148px;
  display: flex;
  flex-direction: column;
}
.order-card:hover { transform: translateY(-2px); }

.order-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.order-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--me-text);
  display: flex;
  align-items: center;
  gap: 5px;
}
.order-card-title svg { width: 14px; height: 14px; color: var(--me-gold-deep); }

.order-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--me-red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(212,101,90,0.35);
}

.order-states {
  display: flex;
  justify-content: space-between;
  flex: 1;
  align-items: center;
}

.order-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.2s var(--me-ease);
  flex: 1;
}
.order-state:hover { transform: translateY(-1px); }

.order-state-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: rgba(201,169,97,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--me-gold-deep);
}
.order-state-icon svg { width: 15px; height: 15px; }

.order-state-num {

}

.order-state-label {

}

/* ---------- KPI 数据条 ---------- */
.kpi-strip {
  padding: 16px 8px;

  justify-content: space-around;
}

.kpi-item {

  flex-direction: column;
  align-items: center;

  transition: transform 0.2s var(--me-ease);

}
.kpi-item:hover { transform: translateY(-1px); background: rgba(201,169,97,0.05); }

.kpi-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.kpi-label {
  font-size: 11px;
  color: var(--me-text-3);
  font-weight: 500;
}

.kpi-divider {
  width: 1px;
  height: 28px;
  background: var(--me-border);
  align-self: center;
}

/* ---------- 常用功能横滚 ---------- */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px 6px;
  padding: 6px 2px 10px;
}

.quick-item {

  align-items: center;

  transition: transform 0.2s var(--me-ease);
}
.quick-item:hover { transform: translateY(-2px); }

.quick-item.is-locked .quick-label { color: var(--me-text-3); }

.quick-lock {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--me-card-solid);
  border: 1.5px solid var(--me-border);

  align-items: center;
  justify-content: center;
  color: var(--me-text-3);
  box-shadow: var(--me-shadow-1);
}
.quick-lock svg { width: 9px; height: 9px; }

.quick-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;

}
.quick-item:hover .quick-icon { box-shadow: var(--me-shadow-2); }
.quick-icon svg { width: 20px; height: 20px; }

.quick-icon.ic-gold { background: linear-gradient(135deg, #F5EDD8, #E8D9B5); color: #A98A47; }
.quick-icon.ic-green { background: linear-gradient(135deg, #E0EDE4, #C8DFD0); color: #4A8A5E; }
.quick-icon.ic-blue { background: linear-gradient(135deg, #DCE5F0, #C2D4E8); color: #4A7AA5; }
.quick-icon.ic-red { background: linear-gradient(135deg, #F0DCD8, #E8C8C2); color: #B5554A; }
.quick-icon.ic-orange { background: linear-gradient(135deg, #F0E4D0, #E8D4B0); color: #B58040; }
.quick-icon.ic-purple { background: linear-gradient(135deg, #E4E0F0, #D0C8E8); color: #6A5AA5; }

[data-theme="dark"] .quick-icon.ic-gold { background: linear-gradient(135deg, rgba(201,169,97,0.2), rgba(201,169,97,0.1)); color: #D4B876; }
[data-theme="dark"] .quick-icon.ic-green { background: linear-gradient(135deg, rgba(91,154,111,0.2), rgba(91,154,111,0.1)); color: #7ABA8E; }
[data-theme="dark"] .quick-icon.ic-blue { background: linear-gradient(135deg, rgba(91,138,181,0.2), rgba(91,138,181,0.1)); color: #7AAAD5; }
[data-theme="dark"] .quick-icon.ic-red { background: linear-gradient(135deg, rgba(212,101,90,0.2), rgba(212,101,90,0.1)); color: #E08075; }
[data-theme="dark"] .quick-icon.ic-orange { background: linear-gradient(135deg, rgba(212,148,90,0.2), rgba(212,148,90,0.1)); color: #E0A870; }
[data-theme="dark"] .quick-icon.ic-purple { background: linear-gradient(135deg, rgba(139,123,181,0.2), rgba(139,123,181,0.1)); color: #A898D5; }

.quick-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--me-red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--me-bg);
  box-shadow: 0 1px 4px rgba(212,101,90,0.4);
}

.quick-label {
  font-size: 10.5px;
  color: var(--me-text-2);
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
}

/* ---------- 区块标题 ---------- */
.section-title {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 20px 2px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: 0.2px;
}
.section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  border-radius: 2px;
  background: linear-gradient(to bottom, var(--me-gold), var(--me-gold-deep));
}
.section-title .more {
  margin-left: auto;
  font-size: 11px;
  font-weight: 500;
  color: var(--me-text-3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 2px;
}
.section-title .more svg { width: 11px; height: 11px; }
.section-title .more:hover { color: var(--me-gold-deep); }

/* ---------- 最近浏览 ---------- */
.history-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.history-scroll::-webkit-scrollbar { display: none; }

.history-card {
  flex-shrink: 0;
  width: 148px;
  border-radius: var(--me-radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s var(--me-ease);
  background: var(--me-card-solid);
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-1);
}
.history-card:hover { transform: translateY(-2px); box-shadow: var(--me-shadow-2); }

.history-img {
  height: 80px;
  background: linear-gradient(135deg, var(--me-gold-pale), var(--me-bg-2));
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--me-gold-deep);
}
.history-img svg { width: 32px; height: 32px; opacity: 0.5; }

.history-tag {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.history-tag.hot { background: rgba(212,101,90,0.15); color: var(--me-red); }
.history-tag.new { background: rgba(91,154,111,0.15); color: var(--me-green); }

.history-body { padding: 10px 12px; }

.history-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--me-text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-loc {
  font-size: 10.5px;
  color: var(--me-text-3);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}
.history-loc svg { width: 10px; height: 10px; }

.history-price {
  font-size: 14px;
  font-weight: 700;
  color: var(--me-gold-deep);
}
.history-price .unit { font-size: 10px; font-weight: 500; color: var(--me-text-3); }

/* ---------- 简洁列表 ---------- */
.flat-list {
  border-radius: var(--me-radius-lg);
  overflow: hidden;
  background: var(--me-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-2);
}

.flat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: background 0.2s var(--me-ease);
  border-bottom: 1px solid var(--me-border);
  position: relative;
}
.flat-item:last-child { border-bottom: none; }
.flat-item:hover { background: rgba(201,169,97,0.04); }
.flat-item:active { background: rgba(201,169,97,0.08); }

.flat-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.flat-icon svg { width: 16px; height: 16px; }
.flat-icon.ic-gold { background: rgba(201,169,97,0.12); color: var(--me-gold-deep); }
.flat-icon.ic-green { background: rgba(91,154,111,0.12); color: var(--me-green); }
.flat-icon.ic-blue { background: rgba(91,138,181,0.12); color: var(--me-blue); }
.flat-icon.ic-red { background: rgba(212,101,90,0.12); color: var(--me-red); }
.flat-icon.ic-orange { background: rgba(212,148,90,0.12); color: var(--me-orange); }
.flat-icon.ic-purple { background: rgba(139,123,181,0.12); color: var(--me-purple); }
.flat-icon.ic-muted { background: rgba(154,145,133,0.1); color: var(--me-text-3); }

.flat-body { flex: 1; min-width: 0; }
.flat-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--me-text);
  margin-bottom: 2px;
}
.flat-sub {
  font-size: 11px;
  color: var(--me-text-3);
}

.flat-value {
  font-size: 11px;
  font-weight: 600;
  color: var(--me-gold-deep);
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(201,169,97,0.1);
}

.flat-unread {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--me-red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flat-arrow { color: var(--me-text-4); flex-shrink: 0; }
.flat-arrow svg { width: 14px; height: 14px; }

/* ---------- 认证 Hero ---------- */
.auth-hero {
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: transform 0.25s var(--me-ease);
  background: linear-gradient(135deg, rgba(201,169,97,0.1), rgba(201,169,97,0.02)) !important;
}
.auth-hero:hover { transform: translateY(-1px); }

.auth-hero-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--me-gold), var(--me-gold-deep));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(201,169,97,0.35);
  flex-shrink: 0;
}
.auth-hero-icon svg { width: 22px; height: 22px; }

.auth-hero-body { flex: 1; }
.auth-hero-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--me-text);
  margin-bottom: 3px;
}
.auth-hero-sub {
  font-size: 11.5px;
  color: var(--me-text-3);
  line-height: 1.4;
}

/* ---------- 内容 Metric 卡 ---------- */
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--me-gap);
}

.metric-card {
  padding: 16px;
  cursor: pointer;
  transition: transform 0.25s var(--me-ease);
  position: relative;
  overflow: hidden;
}
.metric-card:hover { transform: translateY(-2px); }

.metric-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
.metric-icon svg { width: 17px; height: 17px; }
.metric-icon.ic-gold { background: rgba(201,169,97,0.12); color: var(--me-gold-deep); }
.metric-icon.ic-red { background: rgba(212,101,90,0.12); color: var(--me-red); }
.metric-icon.ic-blue { background: rgba(91,138,181,0.12); color: var(--me-blue); }
.metric-icon.ic-green { background: rgba(91,154,111,0.12); color: var(--me-green); }

.metric-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--me-text);
  margin-bottom: 3px;
}
.metric-desc {
  font-size: 10.5px;
  color: var(--me-text-3);
  margin-bottom: 8px;
}
.metric-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--me-gold-deep);
  letter-spacing: -0.5px;
  line-height: 1;
}

.metric-lock {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.03);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
}
[data-theme="dark"] .metric-lock { background: rgba(0,0,0,0.15); }
.metric-lock svg { width: 28px; height: 28px; color: var(--me-text-3); opacity: 0.6; }

/* ---------- 入场动画 ---------- */
.anim-in {
  opacity: 0;
  transform: translateY(12px);
  animation: animIn 0.5s var(--me-ease) forwards;
}
.anim-in.d1 { animation-delay: 0.05s; }
.anim-in.d2 { animation-delay: 0.1s; }
.anim-in.d3 { animation-delay: 0.15s; }
.anim-in.d4 { animation-delay: 0.2s; }
.anim-in.d5 { animation-delay: 0.25s; }

@keyframes animIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 双线身份 / 入驻徽标 / 横幅（E1-12/E1-15/E1-17/E1-19/E2） ---------- */
.dualline-card { padding: 14px 16px; }
.dualline-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.dualline-row + .dualline-row { border-top: 1px dashed var(--me-border); }
.dualline-label {
  flex: none; width: 44px; font-size: 10px; font-weight: 800; letter-spacing: 1px;
  color: var(--me-text-3);
}
.dualline-val { flex: 1; font-size: 12.5px; font-weight: 600; color: var(--me-text); }
.dualline-val .muted { color: var(--me-text-3); font-weight: 500; }

.entry-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .3px; margin-left: 6px;
}
.entry-badge.blueV { background: rgba(91,138,181,.14); color: #3E6A9C; border: 1px solid rgba(91,138,181,.3); }
.entry-badge.goldV { background: linear-gradient(135deg, rgba(201,169,97,.22), rgba(201,169,97,.1)); color: var(--me-gold-deep); border: 1px solid var(--me-border-strong); box-shadow: 0 0 0 1px rgba(201,169,97,.12); }
.entry-badge.exclusive { background: linear-gradient(135deg, #F5EDD8, #E8D9B5); color: #8A6A2E; border: 1px solid var(--me-gold-light); }
.entry-badge.banned { background: rgba(212,101,90,.14); color: var(--me-red); border: 1px solid rgba(212,101,90,.35); }
[data-theme="dark"] .entry-badge.blueV { color: #7AAAD5; }

.resident-ring .id-ring-fg { border-top-color: var(--me-gold-deep); border-right-color: var(--me-gold-deep); }
.resident-frame { border: 1.5px solid var(--me-gold-light) !important; }

.pf-banner { border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pf-banner .pb-body { flex: 1; min-width: 0; }
.pf-banner .pb-title { font-size: 13px; font-weight: 700; }
.pf-banner .pb-sub { font-size: 11px; margin-top: 2px; line-height: 1.45; }
.pf-banner .pb-cta { flex: none; }
.pf-banner.review { background: linear-gradient(135deg, rgba(212,148,90,.14), rgba(212,148,90,.04)); border: 1px solid rgba(212,148,90,.3); }
.pf-banner.review .pb-title { color: #B58040; }
.pf-banner.review .pb-sub { color: var(--me-text-2); }
.pf-banner.breakin { background: linear-gradient(135deg, #8A6A2E 0%, #C9A961 60%, #E8D9B5 100%); color: #fff; border: none; box-shadow: 0 4px 14px rgba(201,169,97,.3); cursor: pointer; }
.pf-banner.breakin .pb-sub { color: rgba(255,255,255,.85); }
.pf-banner.guide { background: var(--me-card); border: 1px dashed var(--me-border-strong); }

/* ---------- 页脚 ---------- */
.me-footer {
  text-align: center;
  padding: 28px 16px 8px;
  color: var(--me-text-4);
  font-size: 10.5px;
  line-height: 1.8;
}

/* ═══════════════════════════════════════════════════════════════
   V11.0 创新视觉重构 — 数字身份通行证
   设计概念：沉浸式Hero × 不对称Bento × 分层功能网格
   色彩体系：暖米白 + 古铜金 + 液态玻璃（保留原色系）
   ═══════════════════════════════════════════════════════════════ */

/* ---------- 页面基底优化 ---------- */
.profile-page { padding-bottom: 120px; }
.profile-content { padding: 0 14px; }

/* ---------- 沉浸式身份Hero区 ---------- */
.me-hero {
  position: relative;
  margin: 0 -14px 16px;
  padding: 24px 20px 20px;
  background: linear-gradient(155deg, #1a1f2e 0%, #0f1320 45%, #161a28 100%);
  border-radius: 0 0 28px 28px;
  overflow: hidden;
}
/* 金色网格纹理 */
.me-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,169,97,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,97,.06) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}
/* 右上角金色光晕 */
.me-hero::after {
  content: '';
  position: absolute;
  top: -60px;
  right: -40px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(201,169,97,.22) 0%, transparent 70%);
  pointer-events: none;
}
/* 左侧金色身份竖条 */
.me-hero-glow {
  position: absolute;
  left: 0;
  top: 20px;
  bottom: 20px;
  width: 3px;
  background: linear-gradient(180deg, #c9a961, #a98a47, #c9a961);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 12px rgba(201,169,97,.5);
}

/* Hero顶部：头像+用户信息 */
.me-hero-top {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 2;
  margin-bottom: 18px;
}
.me-hero-avatar {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c9a961, #8a7240);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 800;
  color: #1a1f2e;
  flex: none;
  position: relative;
  box-shadow: 0 0 0 2px rgba(201,169,97,.4), 0 4px 16px rgba(0,0,0,.3);
}
.me-hero-avatar::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid rgba(201,169,97,.25);
}
.me-hero-info { flex: 1; min-width: 0; }
.me-hero-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.me-hero-name {
  font-size: 19px;
  font-weight: 800;
  color: #f5f0e6;
  letter-spacing: .3px;
}
.me-hero-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.me-hero-sub {
  font-size: 11.5px;
  color: rgba(245,240,230,.55);
  margin-top: 2px;
}
.me-hero-settings {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(201,169,97,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(245,240,230,.7);
  flex: none;
  cursor: pointer;
  transition: all .15s;
}
.me-hero-settings:active { transform: scale(.92); background: rgba(201,169,97,.15); }
.me-hero-settings svg { width: 18px; height: 18px; }

/* Hero中部：诚信分展示 */
.me-hero-credit {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(201,169,97,.18);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 14px;
  backdrop-filter: blur(10px);
}
.me-hero-credit-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.me-hero-credit-label {
  font-size: 12px;
  font-weight: 600;
  color: rgba(245,240,230,.7);
  display: flex;
  align-items: center;
  gap: 5px;
}
.me-hero-credit-level {
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(201,169,97,.25), rgba(201,169,97,.1));
  color: #e8d9b5;
  border: 1px solid rgba(201,169,97,.3);
}
.me-hero-credit-score {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-bottom: 8px;
}
.me-hero-credit-num {
  font-size: 30px;
  font-weight: 800;
  color: #c9a961;
  font-family: var(--font-num);
  text-shadow: 0 0 20px rgba(201,169,97,.4);
}
.me-hero-credit-unit { font-size: 11px; color: rgba(245,240,230,.45); }
.me-hero-credit-bar {
  height: 5px;
  border-radius: 3px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
}
.me-hero-credit-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #c9a961, #e8d9b5);
  box-shadow: 0 0 8px rgba(201,169,97,.5);
  transition: width .8s cubic-bezier(.22,1,.36,1);
}

/* Hero底部：双线身份状态 */
.me-hero-identity {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.me-hero-id-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255,255,255,.04);
  border-radius: 10px;
  border: 1px solid rgba(201,169,97,.12);
}
.me-hero-id-label {
  font-size: 10.5px;
  font-weight: 600;
  color: rgba(245,240,230,.5);
  width: 44px;
  flex: none;
}
.me-hero-id-value {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: rgba(245,240,230,.85);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}


/* ---------- 数据驾驶舱：不对称Bento 2.0 ---------- */
.me-data-section { margin-bottom: 16px; }
.me-data-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.me-data-card {
  background: var(--me-card);
  border: 1px solid var(--me-border);
  border-radius: var(--me-radius-md);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(20px);
  box-shadow: var(--me-shadow-1);
  transition: transform .15s, box-shadow .15s;
}
.me-data-card:active { transform: scale(.97); box-shadow: var(--me-shadow-2); }
/* 卡片底部金色装饰线 */
.me-data-card::after {
  content: '';
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(201,169,97,.4), transparent);
}
.me-data-card.wide { grid-column: 1 / -1; }

/* 钱包卡 */
.me-wallet-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--me-text-2);
  margin-bottom: 8px;
}
.me-wallet-label svg { width: 15px; height: 15px; color: var(--me-gold-deep); }
.me-wallet-balance {
  display: flex;
  align-items: baseline;
  gap: 3px;
  margin-bottom: 12px;
}
.me-wallet-cur { font-size: 13px; font-weight: 700; color: var(--me-gold-deep); }
.me-wallet-num {
  font-size: 24px;
  font-weight: 800;
  color: var(--me-text);
  font-family: var(--font-num);
  letter-spacing: -.5px;
}
.me-wallet-actions { display: flex; gap: 8px; }
.me-wallet-btn {
  flex: 1;
  height: 32px;
  border-radius: 8px;
  border: none;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.me-wallet-btn.primary {
  background: linear-gradient(135deg, var(--me-gold), var(--me-gold-deep));
  color: #fff;
  box-shadow: 0 2px 8px rgba(201,169,97,.3);
}
.me-wallet-btn.primary:active { transform: scale(.95); }
.me-wallet-btn.ghost {
  background: var(--me-gold-pale);
  color: var(--me-gold-deep);
  border: 1px solid var(--me-border-strong);
}
.me-wallet-btn.ghost:active { transform: scale(.95); }

/* 订单快捷卡 */
.me-order-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--me-text-2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.me-order-label svg { width: 15px; height: 15px; color: var(--me-gold-deep); }
.me-order-states {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.me-order-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 2px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.me-order-state:active { background: var(--me-gold-pale); }
.me-order-state-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--me-gold-pale);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--me-gold-deep);
  position: relative;
}
.me-order-state-icon svg { width: 14px; height: 14px; }
.me-order-state-badge {
  position: absolute;
  top: -2px;
  right: -2px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 7px;
  background: var(--me-red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.me-order-state-text { font-size: 10px; color: var(--me-text-2); font-weight: 500; }

/* KPI数据条 */
.me-kpi-strip {
  display: flex;
  align-items: center;
  padding: 14px 8px;
  background: var(--me-card);
  border: 1px solid var(--me-border);
  border-radius: var(--me-radius-md);
  backdrop-filter: blur(20px);
  box-shadow: var(--me-shadow-1);
  position: relative;
  overflow: hidden;
}
.me-kpi-strip::after {
  content: '';
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(201,169,97,.4), transparent);
}
.me-kpi-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 0;
  border-radius: 8px;
  transition: background .15s;
}
.me-kpi-item:active { background: var(--me-gold-pale); }
.me-kpi-num {
  font-size: 18px;
  font-weight: 800;
  color: var(--me-text);
  font-family: var(--font-num);
}
.me-kpi-label { font-size: 10.5px; color: var(--me-text-3); font-weight: 500; }
.me-kpi-divider {
  width: 1px;
  height: 28px;
  background: linear-gradient(180deg, transparent, var(--me-border), transparent);
  flex: none;
}

/* ---------- 分层功能网格 ---------- */
.me-func-section { margin-bottom: 16px; }
.me-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 0 2px;
}
.me-section-title-text {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--me-text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.me-section-title-text::before {
  content: '';
  width: 3px;
  height: 14px;
  background: linear-gradient(180deg, var(--me-gold), var(--me-gold-deep));
  border-radius: 2px;
}
.me-section-more { font-size: 11px; color: var(--me-text-3); cursor: pointer; }

.me-func-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.me-func-grid.secondary { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.me-func-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 12px 4px;
  border-radius: 12px;
  cursor: pointer;
  transition: all .15s;
  background: var(--me-card);
  border: 1px solid var(--me-border);
}
.me-func-item:active { transform: scale(.93); background: var(--me-gold-pale); }
.me-func-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.me-func-icon svg { width: 18px; height: 18px; }
.me-func-icon.c1 { background: linear-gradient(135deg, #e8d9b5, #d4c49a); color: #8a7240; }
.me-func-icon.c2 { background: linear-gradient(135deg, #d4e5d9, #b8d4c0); color: #4a7a5f; }
.me-func-icon.c3 { background: linear-gradient(135deg, #d4d9e5, #b8c0d4); color: #4a5a7a; }
.me-func-icon.c4 { background: linear-gradient(135deg, #e5d4d4, #d4b8b8); color: #7a4a4a; }
.me-func-icon.c5 { background: linear-gradient(135deg, #e5dfd4, #d4c9b8); color: #7a6a4a; }
.me-func-text { font-size: 11px; color: var(--me-text-2); font-weight: 500; text-align: center; line-height: 1.2; }
.me-func-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 7px;
  background: var(--me-red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

/* 次级功能（更小） */
.me-func-grid.secondary .me-func-item { padding: 10px 2px; gap: 5px; }
.me-func-grid.secondary .me-func-icon { width: 28px; height: 28px; border-radius: 8px; }
.me-func-grid.secondary .me-func-icon svg { width: 15px; height: 15px; }
.me-func-grid.secondary .me-func-text { font-size: 10px; }

/* 设置行 */
.me-settings-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 16px;
  padding: 10px 4px 0;
  border-top: 1px solid var(--me-border);
  margin-top: 4px;
}
.me-settings-link {
  font-size: 11px;
  color: var(--me-text-3);
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.me-settings-link svg { width: 13px; height: 13px; }

/* ---------- 创新动画 ---------- */
@keyframes meFadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.me-anim { animation: meFadeUp .5s cubic-bezier(.22,1,.36,1) both; }
.me-anim.d1 { animation-delay: .05s; }
.me-anim.d2 { animation-delay: .12s; }
.me-anim.d3 { animation-delay: .19s; }
.me-anim.d4 { animation-delay: .26s; }
.me-anim.d5 { animation-delay: .33s; }

/* 数字计数动画 */
@keyframes meCountUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.me-count-anim { animation: meCountUp .6s cubic-bezier(.22,1,.36,1) both; }

/* 暗色主题适配已在:root中定义 */

/* ══════════ V12.0 浅色卡片化布局 · 专业视觉优化版 ══════════ */

/* ── CSS变量：古铜金5级色阶 ── */
:root {
  --v12-gold-50: #FAF6EE;
  --v12-gold-100: #F0E6D2;
  --v12-gold-200: #E8D9B5;
  --v12-gold-300: #D4B87A;
  --v12-gold-400: #C9A961;
  --v12-gold-500: #A98A47;
  --v12-gold-600: #8A6E35;
  --v12-text-1: #3A3226;
  --v12-text-2: #5A4E3A;
  --v12-text-3: #8A7E6A;
  --v12-text-4: #A99880;
  --v12-border: #EDE5D5;
  --v12-bg: #F5F1E8;
  --v12-shadow-1: 0 1px 3px rgba(180,160,120,.06), 0 1px 2px rgba(180,160,120,.04);
  --v12-shadow-2: 0 4px 12px rgba(180,160,120,.08), 0 2px 4px rgba(180,160,120,.06);
  --v12-shadow-3: 0 8px 24px rgba(180,160,120,.12), 0 4px 8px rgba(180,160,120,.08);
  --v12-gold-glow: 0 0 20px rgba(201,169,97,.25);
}

/* 页面背景 */
.profile-page { background: var(--v12-bg); }
.profile-content { padding: 0 12px 20px; }

/* ── 头区：暖米白→浅金渐变 + 网格纹理 + 多层光晕 ── */
.v12-header {
  background:
    linear-gradient(160deg, #FAF6EE 0%, #F0E6D2 55%, #E8D9B5 100%);
  margin: 0 -12px 12px;
  padding: 22px 16px 20px;
  position: relative;
  overflow: hidden;
}
/* 网格纹理底层 */
.v12-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,169,97,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,97,.06) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  opacity: .6;
}
/* 右上角金色光晕 */
.v12-header::after {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(201,169,97,.22) 0%, rgba(201,169,97,.08) 40%, transparent 70%);
  pointer-events: none;
}
/* 左下角装饰光晕 */
.v12-header-inner { position: relative; z-index: 1; }
.v12-header-inner::before {
  content: '';
  position: absolute;
  bottom: -40px; left: -30px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(212,184,122,.15) 0%, transparent 65%);
  pointer-events: none;
}

/* 顶部行：头像+信息+设置 */
.v12-header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
/* 头像：渐变边框 + 发光效果 */
.v12-avatar {
  flex: none;
  width: 58px; height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #E8D9B5, #C9A961);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 2px 12px rgba(201,169,97,.35),
    0 0 0 2px rgba(255,255,255,.7),
    0 0 0 4px rgba(201,169,97,.15);
  position: relative;
}
.v12-avatar::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,.4), transparent 50%);
  pointer-events: none;
}
.v12-user-info { flex: 1; min-width: 0; }
.v12-username-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.v12-username {
  font-size: 18px;
  font-weight: 800;
  color: var(--v12-text-1);
  letter-spacing: .2px;
  line-height: 1.2;
}
.v12-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.v12-usersub {
  font-size: 11.5px;
  color: var(--v12-text-3);
  margin-top: 4px;
  line-height: 1.5;
  font-weight: 500;
}
/* 设置按钮：毛玻璃 + hover旋转 */
.v12-settings-btn {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--v12-text-3);
  cursor: pointer;
  transition: all .3s cubic-bezier(.22,1,.36,1);
  border: 1px solid rgba(255,255,255,.6);
}
.v12-settings-btn:hover {
  background: rgba(255,255,255,.85);
  transform: rotate(30deg);
  box-shadow: var(--v12-gold-glow);
}
.v12-settings-btn svg { width: 16px; height: 16px; }

/* 等级进度条 */
.v12-level-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.v12-level-label, .v12-level-next {
  flex: none;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--v12-gold-500);
  letter-spacing: .5px;
}
.v12-level-bar {
  flex: 1;
  height: 6px;
  background: rgba(201,169,97,.15);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.v12-level-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--v12-gold-300), var(--v12-gold-400));
  border-radius: 999px;
  transition: width .8s cubic-bezier(.22,1,.36,1);
  position: relative;
}
.v12-level-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  animation: v12Shimmer 2s infinite;
}
@keyframes v12Shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* 诚信分行：毛玻璃卡片 + 渐变边框 */
.v12-credit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(255,255,255,.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,.6);
  position: relative;
  overflow: hidden;
}
.v12-credit-row::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(201,169,97,.3), transparent 50%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.v12-credit-left { display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
.v12-credit-label {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
  color: var(--v12-text-3);
}
.v12-credit-score {
  font-size: 16px;
  font-weight: 800;
  color: var(--v12-gold-500);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.v12-credit-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 140px;
  position: relative;
  z-index: 1;
}
.v12-credit-level {
  flex: none;
  font-size: 10px;
  font-weight: 800;
  color: var(--v12-gold-500);
  padding: 3px 8px;
  background: linear-gradient(135deg, rgba(201,169,97,.15), rgba(201,169,97,.08));
  border-radius: 6px;
  border: 1px solid rgba(201,169,97,.2);
}
.v12-credit-bar {
  flex: 1;
  height: 4px;
  background: rgba(201,169,97,.15);
  border-radius: 999px;
  overflow: hidden;
}
.v12-credit-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--v12-gold-300), var(--v12-gold-400));
  border-radius: 999px;
  transition: width .8s cubic-bezier(.22,1,.36,1);
}

/* 双线身份 */
.v12-dualline {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.v12-dualline .me-hero-id-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.v12-dualline .me-hero-id-label {
  flex: none;
  width: 42px;
  font-size: 10px;
  font-weight: 800;
  color: var(--v12-text-4);
  letter-spacing: .8px;
  text-transform: uppercase;
}
.v12-dualline .me-hero-id-value {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--v12-text-2);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* 通用白色卡片：3级阴影 + hover上浮 */
.v12-card {
  background: #fff;
  border-radius: 16px;
  padding: 16px 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--v12-shadow-2);
  transition: all .3s cubic-bezier(.22,1,.36,1);
  position: relative;
  overflow: hidden;
}
.v12-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,169,97,.2), transparent);
}
.v12-card:hover {
  box-shadow: var(--v12-shadow-3);
  transform: translateY(-1px);
}
.v12-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.v12-card-title {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--v12-text-1);
  letter-spacing: .2px;
  display: flex;
  align-items: center;

/* KPI行 */
.v12-kpi-row {

.v12-kpi-item {

  content: '';

  background: linear-gradient(180deg, transparent, var(--v12-border), transparent);
}

  font-weight: 800;

}
.v12-kpi-label {
  font-size: 10.5px;
  color: var(--v12-text-3);
  font-weight: 600;
}

/* 双入口网格 */
.v12-dual-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--v12-border);
  border-radius: 12px;
  overflow: hidden;
}

  padding: 14px 14px;

  align-items: center;
  justify-content: space-between;

.v12-dual-item:active { background: var(--v12-gold-100); }
.v12-dual-text {

  font-weight: 700;
  color: var(--v12-text-1);
}
.v12-dual-arrow {

  transition: all .2s;
}
.v12-dual-item:hover .v12-dual-arrow {

  transform: translateX(3px);
}

/* 工具网格：图标渐变背景容器 + 5色循环 */

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 8px;
}
.v12-tool-grid .tool-item {

  flex-direction: column;
  align-items: center;
  gap: 7px;

  position: relative;
  padding: 4px 0;
  border-radius: 12px;
  transition: all .2s;
}
.v12-tool-grid .tool-item:hover {

  transform: translateY(-1px);
}
.v12-tool-grid .tool-icon {

  align-items: center;
  justify-content: center;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}
.v12-tool-grid .tool-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.3), transparent 50%);
  pointer-events: none;
}
.v12-tool-grid .tool-icon svg { width: 20px; height: 20px; position: relative; z-index: 1; }

.v12-tool-grid .tool-item:nth-child(5n+2) .tool-icon { background: linear-gradient(135deg, rgba(76,175,120,.16), rgba(76,175,120,.06)); color: #3D8B5E; }
.v12-tool-grid .tool-item:nth-child(5n+3) .tool-icon { background: linear-gradient(135deg, rgba(66,133,244,.16), rgba(66,133,244,.06)); color: #3B6FD4; }
.v12-tool-grid .tool-item:nth-child(5n+4) .tool-icon { background: linear-gradient(135deg, rgba(212,85,74,.14), rgba(212,85,74,.06)); color: #C04A3E; }

  line-height: 1.3;

.v12-history-scroll {

  scrollbar-width: none;
}

  align-items: center;
  justify-content: center;
  position: relative;
}
.v12-history-scroll .history-thumb svg {

}
.v12-history-scroll .history-title {

  font-weight: 600;
  line-height: 1.4;

  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 入场动画：精致交错 */
@keyframes v12FadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }

.v12-anim {

}
.v12-anim.d1 { animation-delay: .04s; }
.v12-anim.d2 { animation-delay: .09s; }
.v12-anim.d3 { animation-delay: .14s; }
.v12-anim.d4 { animation-delay: .19s; }
.v12-anim.d5 { animation-delay: .24s; }
.v12-anim.d6 { animation-delay: .29s; }
