<title>我的 · 工程链</title>

<style>
/* ═══════════════════════════════════════════════════════════════
   我的 · 个人工作台 V10.0
   Bento Grid × Liquid Glass 2.0 × Spatial Depth
   设计参考：Apple visionOS / Linear / Stripe / Vercel
   视觉核心：暖米白 + 古铜金 + 液态玻璃 + 空间层次
   ═══════════════════════════════════════════════════════════════ */

/* ---------- 设计令牌 ---------- */
:root {
  --me-radius-lg: 22px;
  --me-radius-md: 16px;
  --me-radius-sm: 12px;
  --me-gap: 12px;
  --me-pad: 18px;

  --me-gold: #C9A961;
  --me-gold-deep: #A98A47;
  --me-gold-light: #E8D9B5;
  --me-gold-pale: #F5EDD8;

  --me-text: #2A2722;
  --me-text-2: #6B6358;
  --me-text-3: #9A9185;
  --me-text-4: #C4BCB0;

  --me-bg: #F2EFE8;
  --me-bg-2: #EDE9E0;
  --me-card: rgba(255,255,255,0.72);
  --me-card-solid: #FFFFFF;
  --me-border: rgba(201,169,97,0.18);
  --me-border-strong: rgba(201,169,97,0.35);

  --me-shadow-1: 0 1px 2px rgba(42,39,34,0.04), 0 2px 8px rgba(42,39,34,0.03);
  --me-shadow-2: 0 2px 4px rgba(42,39,34,0.04), 0 8px 24px rgba(42,39,34,0.06);
  --me-shadow-3: 0 4px 12px rgba(42,39,34,0.06), 0 16px 40px rgba(42,39,34,0.08);

  --me-green: #5B9A6F;
  --me-red: #D4655A;
  --me-blue: #5B8AB5;
  --me-orange: #D4945A;
  --me-purple: #8B7BB5;

  --me-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --me-text: #F0EBE0;
  --me-text-2: #B0A898;
  --me-text-3: #7A7265;
  --me-text-4: #524C42;

  --me-bg: #0E0D0B;
  --me-bg-2: #161411;
  --me-card: rgba(32,30,27,0.7);
  --me-card-solid: #1E1C19;
  --me-border: rgba(201,169,97,0.12);
  --me-border-strong: rgba(201,169,97,0.28);

  --me-gold: #D4B876;
  --me-gold-deep: #B89A5A;
  --me-gold-light: #8A7548;
  --me-gold-pale: #3A3325;

  --me-shadow-1: 0 1px 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.15);
  --me-shadow-2: 0 2px 4px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.2);
  --me-shadow-3: 0 4px 12px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.25);
}

/* ---------- 页面基底 ---------- */
html, body { margin: 0; padding: 0; background: var(--me-bg); }
.phone { background: var(--me-bg); }
.profile-page {
  min-height: 100%;
  background: var(--me-bg);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 100px;
}

/* 背景氛围光 */
.profile-page::before {
  content: '';
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  height: 320px;
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
[data-theme="dark"] .profile-page::before {
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.12) 0%, transparent 70%);
}

.profile-content {
  position: relative;
  z-index: 1;
  padding: 0 16px;
}

/* ---------- 沉浸式头部 ---------- */
.me-header {
  position: relative;
  padding: 10px 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.me-avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.me-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--me-gold-light), var(--me-gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 16px rgba(201,169,97,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
}
.me-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 50%);
}

.me-avatar-edit {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--me-card-solid);
  border: 1.5px solid var(--me-border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--me-shadow-1);
  cursor: pointer;
}
.me-avatar-edit svg { width: 10px; height: 10px; color: var(--me-gold-deep); }

.me-user-info {
  flex: 1;
  min-width: 0;
}

.me-user-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.me-user-name {
  font-size: 19px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.me-verified-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(201,169,97,0.15), rgba(201,169,97,0.08));
  border: 1px solid var(--me-border);
  font-size: 10px;
  font-weight: 600;
  color: var(--me-gold-deep);
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
.me-verified-badge svg { width: 10px; height: 10px; }

.me-user-sub {
  font-size: 12px;
  color: var(--me-text-3);
  display: flex;
  align-items: center;
  gap: 6px;
}

.me-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.me-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--me-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--me-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s var(--me-ease);
  box-shadow: var(--me-shadow-1);
  color: var(--me-text-2);
}
.me-icon-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--me-shadow-2);
  border-color: var(--me-border-strong);
}
.me-icon-btn:active { transform: translateY(0) scale(0.96); }
.me-icon-btn svg { width: 17px; height: 17px; }

/* ---------- Tab 导航（玻璃胶囊） ---------- */
.me-tabs {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 8px 0 14px;
  margin: 0 -16px;
  padding-left: 16px;
  padding-right: 16px;
  background: linear-gradient(to bottom, var(--me-bg) 0%, var(--me-bg) 70%, transparent 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.me-tabs-inner {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--me-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 14px;
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-1);
  position: relative;
}

.me-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px 4px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--me-text-3);
  cursor: pointer;
  transition: all 0.3s var(--me-ease);
  position: relative;
  white-space: nowrap;
}
.me-tab svg { width: 15px; height: 15px; }
.me-tab.active {
  color: #fff;
  font-weight: 600;
  background: linear-gradient(135deg, var(--me-gold), var(--me-gold-deep));
  box-shadow: 0 2px 8px rgba(201,169,97,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.me-tab:not(.active):hover { color: var(--me-text-2); background: rgba(201,169,97,0.06); }

.me-tab-dot {
  position: absolute;
  top: 6px;
  right: calc(50% - 22px);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--me-red);
  box-shadow: 0 0 0 2px var(--me-card);
}

/* ---------- Panel 切换 ---------- */
.me-panel {
  display: none;
  animation: panelIn 0.4s var(--me-ease);
}
.me-panel.active { display: block; }

@keyframes panelIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Liquid Glass 卡片基础 ---------- */
.glass {
  position: relative;
  background: var(--me-card);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-radius: var(--me-radius-lg);
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-2);
  overflow: hidden;
  transition: transform 0.3s var(--me-ease), box-shadow 0.3s var(--me-ease);
}
.glass:hover {
  box-shadow: var(--me-shadow-3);
}
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 40%, transparent 60%, rgba(201,169,97,0.1) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
[data-theme="dark"] .glass::before {
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 40%, transparent 60%, rgba(201,169,97,0.08) 100%);
}

/* 噪点纹理叠加 */
.glass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0.03;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ---------- Bento Grid ---------- */
.bento {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--me-gap);
}

.bento-item { position: relative; }
.bento-full { grid-column: 1 / -1; }

/* ---------- 身份认证大卡 ---------- */
.id-card {
  padding: 20px;
  display: flex;
  gap: 18px;
  align-items: center;
}

.id-ring-wrap {
  position: relative;
  width: 76px;
  height: 76px;
  flex-shrink: 0;
}

.id-ring-bg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--me-border);
}

.id-ring-fg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--me-gold);
  border-right-color: var(--me-gold);
  transform: rotate(-90deg);
  transition: transform 0.8s var(--me-ease);
}

.id-ring-center {
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--me-gold-pale), var(--me-gold-light));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.5);
}
[data-theme="dark"] .id-ring-center {
  background: linear-gradient(135deg, rgba(201,169,97,0.15), rgba(201,169,97,0.05));
}

.id-ring-level {
  font-size: 16px;
  font-weight: 800;
  color: var(--me-gold-deep);
  line-height: 1;
}
.id-ring-label {
  font-size: 8px;
  color: var(--me-text-3);
  margin-top: 2px;
  font-weight: 500;
}

.id-info { flex: 1; min-width: 0; }

.id-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.id-status {
  font-size: 16px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.2px;
}

.id-level-tag {
  padding: 2px 8px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--me-gold), var(--me-gold-deep));
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 6px rgba(201,169,97,0.3);
}

.id-desc {
  font-size: 11.5px;
  color: var(--me-text-3);
  margin-bottom: 10px;
  line-height: 1.4;
}

.id-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.id-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  background: rgba(91,154,111,0.1);
  color: var(--me-green);
  border: 1px solid rgba(91,154,111,0.2);
}
.id-pill.locked {
  background: rgba(154,145,133,0.08);
  color: var(--me-text-3);
  border-color: var(--me-border);
}
.id-pill svg { width: 9px; height: 9px; }

.id-guide {
  grid-column: 1 / -1;
  margin-top: 2px;
  padding: 10px 14px;
  border-radius: var(--me-radius-md);
  background: linear-gradient(135deg, rgba(201,169,97,0.08), rgba(201,169,97,0.03));
  border: 1px solid var(--me-border);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.25s var(--me-ease);
}
.id-guide:hover {
  background: linear-gradient(135deg, rgba(201,169,97,0.12), rgba(201,169,97,0.05));
  border-color: var(--me-border-strong);
}
.id-guide svg { width: 14px; height: 14px; color: var(--me-gold-deep); flex-shrink: 0; }
.id-guide-text {
  font-size: 11.5px;
  color: var(--me-text-2);
  line-height: 1.4;
  flex: 1;
}

/* ---------- 钱包卡 ---------- */
.wallet-card {
  padding: 16px;
  cursor: pointer;
  background: linear-gradient(135deg, rgba(201,169,97,0.16), rgba(201,169,97,0.06)) !important;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.wallet-card:hover { transform: translateY(-2px); }

.wallet-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--me-text-3);
  margin-bottom: 8px;
  font-weight: 500;
}
.wallet-label svg { width: 13px; height: 13px; color: var(--me-gold-deep); }

.wallet-balance {
  font-size: 24px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 10px;
}
.wallet-balance .cur {
  font-size: 14px;
  font-weight: 600;
  color: var(--me-text-2);
  margin-right: 2px;
}

.wallet-actions {
  display: flex;
  gap: 6px;
}

.wallet-btn {
  flex: 1;
  padding: 6px 0;
  border-radius: 8px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s var(--me-ease);
  background: var(--me-gold);
  color: #fff;
  border: none;
}
.wallet-btn:hover { background: var(--me-gold-deep); }
.wallet-btn.ghost {
  background: transparent;
  color: var(--me-gold-deep);
  border: 1px solid var(--me-border-strong);
}
.wallet-btn.ghost:hover { background: rgba(201,169,97,0.1); }

/* ---------- 订单卡 ---------- */
.order-card {
  padding: 16px;
  cursor: pointer;
}
.order-card:hover { transform: translateY(-2px); }

.order-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.order-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--me-text);
  display: flex;
  align-items: center;
  gap: 5px;
}
.order-card-title svg { width: 14px; height: 14px; color: var(--me-gold-deep); }

.order-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--me-red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(212,101,90,0.35);
}

.order-states {
  display: flex;
  justify-content: space-between;
}

.order-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: transform 0.2s var(--me-ease);
}
.order-state:hover { transform: translateY(-1px); }

.order-state-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(201,169,97,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--me-gold-deep);
}
.order-state-icon svg { width: 15px; height: 15px; }

.order-state-num {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 7px;
  background: var(--me-red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.order-state-label {
  font-size: 10px;
  color: var(--me-text-3);
  font-weight: 500;
}

/* ---------- KPI 数据条 ---------- */
.kpi-strip {
  padding: 16px 8px;
  display: flex;
  justify-content: space-around;
}

.kpi-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: transform 0.2s var(--me-ease);
  padding: 4px 8px;
  border-radius: 10px;
}
.kpi-item:hover { transform: translateY(-1px); background: rgba(201,169,97,0.05); }

.kpi-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--me-text);
  letter-spacing: -0.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.kpi-label {
  font-size: 11px;
  color: var(--me-text-3);
  font-weight: 500;
}

.kpi-divider {
  width: 1px;
  height: 28px;
  background: var(--me-border);
  align-self: center;
}

/* ---------- 常用功能横滚 ---------- */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px 6px;
  padding: 6px 2px 10px;
}

.quick-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  transition: transform 0.2s var(--me-ease);
}
.quick-item:hover { transform: translateY(-2px); }
.quick-item:active { transform: scale(0.95); }
.quick-item.is-locked { opacity: 0.55; }
.quick-item.is-locked .quick-label { color: var(--me-text-3); }

.quick-lock {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--me-card-solid);
  border: 1.5px solid var(--me-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--me-text-3);
  box-shadow: var(--me-shadow-1);
}
.quick-lock svg { width: 9px; height: 9px; }

.quick-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: var(--me-shadow-1);
  transition: box-shadow 0.2s var(--me-ease);
}
.quick-item:hover .quick-icon { box-shadow: var(--me-shadow-2); }
.quick-icon svg { width: 20px; height: 20px; }

    registered: { level:1, label:'注册会员', titleIcon:'i-user', nextText:'完成个人认证，解锁发布供需与联系洽谈权益',
      benefits:[{name:'浏览供需列表',icon:'i-eye',owned:true},{name:'收藏与关注',icon:'i-star',owned:true},{name:'发布供需信息',icon:'i-form',owned:false}] },
    realname: { level:2, label:'个人认证', titleIcon:'i-shield', nextText:'您已完成实名认证，下一步开通个人入驻，解锁人才展示与简历投递',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:false}] },
    pro: { level:3, label:'专业工程师', titleIcon:'i-award', nextText:'已解锁全部个人权益，可申请企业入驻拓展业务',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] },
    partner: { level:3, label:'合作伙伴', titleIcon:'i-briefcase', nextText:'合作伙伴权益已全部开通',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] },
    enterprise: { level:4, label:'企业认证', titleIcon:'i-company', nextText:'企业权益已全部开通',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] },
    resident: { level:5, label:'入驻企业', titleIcon:'i-buil', nextText:'入驻企业全部权益已开通',
      benefits:[{name:'发布供需信息',icon:'i-form',owned:true},{name:'联系洽谈解锁',icon:'i-chat',owned:true},{name:'投递简历应聘',icon:'i-file',owned:true}] }
  };

  function currentIdentity() {
    try {
      if (window.deriveIdentity) return deriveIdentity();
    } catch (e) {}
    return { primary:'guest', enterprise:'', identities:[] };
  }

  /* ---------- 渲染：用户头部 ---------- */
  function renderHeader() {
    var st = {};
    try { st = UI.state.get(); } catch (e) {}
    var idy = currentIdentity();
    var isReal = idy.primary === 'realname' || idy.primary === 'pro' || idy.primary === 'partner' || idy.primary === 'enterprise' || idy.primary === 'resident';

    var name = st.user || (st.loggedIn ? '工程用户' : '游客');
    document.getElementById('pf-username').textContent = name;
    document.getElementById('pf-avatar').textContent = name.charAt(0) || '游';

    var verified = document.getElementById('pf-verified');
    if (verified) verified.style.display = isReal ? 'inline-flex' : 'none';

    var sub = document.getElementById('pf-usersub');
    if (sub) {
      if (!st.loggedIn) sub.textContent = '登录后解锁全部功能';
      else if (isReal) sub.textContent = '';
      else sub.textContent = '注册用户 · 完成认证解锁更多权益';
    }
  }

  /* ---------- 渲染：身份卡（环形进度） ---------- */
  function renderIdentity() {
    var idy = currentIdentity(), cfg = ID_CFG[idy.primary] || ID_CFG.registered;

    document.getElementById('pf-ring-level').textContent = 'Lv.' + cfg.level;
    document.getElementById('pf-id-leveltag').textContent = 'Lv.' + cfg.level;
    document.getElementById('pf-id-status').textContent = cfg.label;
    document.getElementById('pf-guide-text').textContent = cfg.nextText;

    /* 环形进度：按等级旋转 */
    var pct = cfg.level / 5;
    var deg = -90 + pct * 360;
    var ring = document.getElementById('pf-ring-fg');
    if (ring) {
      ring.style.transform = 'rotate(-90deg)';
      void ring.offsetWidth;
      ring.style.transform = 'rotate(' + deg + 'deg)';
      /* 超过50%时需要两段颜色 */
      if (pct > 0.5) {
        ring.style.borderBottomColor = 'var(--me-gold)';
      } else {
        ring.style.borderBottomColor = 'transparent';
      }
    }

    /* 能力 pill */
    var pillBox = document.getElementById('pf-id-pills');
    if (pillBox) {
      var html = '';
      for (var i = 0; i < cfg.benefits.length; i++) {
        var b = cfg.benefits[i];
        var iconSvg = b.owned
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
        html += '<span class="id-pill' + (b.owned ? '' : ' locked') + '">' + iconSvg + b.name + '</span>';
      }
      pillBox.innerHTML = html;
    }
  }

  /* ---------- 渲染：KPI 数字 ---------- */
  function renderKPI() {
    var fav = 0, pub = 0, deal = 0, follow = 0;
    try {
      if (window.DataBus) {
        if (DataBus.favorites) fav = DataBus.favorites().length;
        if (DataBus.published) pub = DataBus.published().length;
        if (DataBus.orders) {
          var ord = DataBus.orders();
          deal = ord.filter(function (o) { return o.status === 'settled' || o.status === '已成交'; }).length;
        }
      }
    } catch (e) {}
    animateNum('pf-kpi-fav', fav);
    animateNum('pf-kpi-pub', pub);
    animateNum('pf-kpi-deal', deal);
    animateNum('pf-kpi-follow', follow);
  }

  function animateNum(id, target) {
    var el = document.getElementById(id);
    if (!el) return;
    var start = 0, dur = 600, t0 = null;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(start + (target - start) * eased);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 渲染：钱包 ---------- */
  function renderWallet() {
    var bal = 0;
    try {
      var wal = (window.DataBus && DataBus.wallet) ? DataBus.wallet() : JSON.parse(localStorage.getItem('engchain-wallet') || '{}');
      bal = wal.balance != null ? wal.balance : 0;
    } catch (e) {}
    var txt = Number(bal).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    var b1 = document.getElementById('pf-wallet-balance');
    if (b1) b1.textContent = txt;
  }

  /* ---------- 渲染：订单状态 ---------- */
  function renderOrderStates() {
    var states = [
      { key:'pending', label:'待支付', icon:'i-card' },
      { key:'serving', label:'服务中', icon:'i-tool' },
      { key:'accepting', label:'待验收', icon:'i-shield' },
      { key:'done', label:'已完成', icon:'i-check' },
      { key:'refund', label:'退款', icon:'i-rotate' }
    ];
    var counts = { pending:0, serving:0, accepting:0, done:0, refund:0 };
    var totalPending = 0;
    try {
      var ord = (window.DataBus && DataBus.orders) ? DataBus.orders() : JSON.parse(localStorage.getItem('engchain-orders') || '[]');
      ord.forEach(function (o) {
        var s = o.status || '';
        if (s === 'pending' || s === '待支付' || s === '待付款') { counts.pending++; totalPending++; }
        else if (s === 'serving' || s === 'escrowed' || s === '服务中' || s === '已托管') { counts.serving++; totalPending++; }
        else if (s === 'await_accept' || s === 'await_confirm' || s === '待验收') { counts.accepting++; totalPending++; }
        else if (s === 'settled' || s === '已成交' || s === '已完成') counts.done++;
        else if (s === 'refunded' || s === 'partial_refund' || s === 'cancelled' || s === 'disputed' || s === '退款' || s === '已取消') counts.refund++;
      });
    } catch (e) {}

    var rotateSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l2.5 2.5"/></svg>';

    var html = states.map(function (st) {
      var iconSvg = st.icon === 'i-rotate' ? rotateSvg
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#' + st.icon + '"/></svg>';
      return '<div class="order-state" onclick="event.stopPropagation();location.href=\'../order/index.html?status=' + st.key + '\'">' +
        '<div class="order-state-icon">' + iconSvg +
          (counts[st.key] > 0 ? '<span class="order-state-num">' + counts[st.key] + '</span>' : '') +
        '</div>' +
        '<span class="order-state-label">' + st.label + '</span>' +
      '</div>';
    }).join('');

    var el1 = document.getElementById('pf-order-states');
    if (el1) el1.innerHTML = html;

    var badge = document.getElementById('pf-order-badge');
    if (badge) {
      badge.textContent = totalPending;
      badge.style.display = totalPending > 0 ? 'flex' : 'none';
    }
  }

  /* ---------- 渲染：常用功能横滚 ---------- */
  function renderQuick() {
    var q = document.getElementById('pf-quick-scroll'); if (!q) return;
    var st; try { st = UI.state.get(); } catch (e) { st = {}; }
    var guest = !st.loggedIn;

    var orderCount = 0;
    try {
      var ord = (window.DataBus && DataBus.orders) ? DataBus.orders() : JSON.parse(localStorage.getItem('engchain-orders') || '[]');
      orderCount = ord.filter(function (x) { return x.status !== 'settled' && x.status !== '已成交' && x.status !== 'cancelled'; }).length;
    } catch (e) {}

    var items = [
      { href:'../order/index.html', ic:'i-box', cls:'ic-gold', title:'我的订单', badge:orderCount > 0 ? String(orderCount) : '' },
      { href:'../wallet/index.html', ic:'i-wallet', cls:'ic-green', title:'我的钱包' },
      { href:'../publish/records.html', ic:'i-form', cls:'ic-blue', title:'发布管理' },
      { href:'../favorite/index.html', ic:'i-fav', cls:'ic-red', title:'我的收藏' },
      { href:'../wallet/invoice.html', ic:'i-doc', cls:'ic-orange', title:'发票管理' },
      { href:'../refund/index.html', ic:'i-rotate', cls:'ic-purple', title:'退款售后' },
      { href:'../message/index.html', ic:'i-chat', cls:'ic-gold', title:'我的消息' },
      { href:'auth-prep.html?type=center', ic:'i-shield', cls:'ic-blue', title:'认证中心' },
      { href:'../personnel/index.html', ic:'i-file', cls:'ic-blue', title:'简历投递', lock:true },
      { href:'../personnel/index.html', ic:'i-user', cls:'ic-green', title:'人才市场' }
    ];

    /* 简历投递：pro及以上解锁 */
    var idy = currentIdentity();
    var resumeUnlocked = idy.primary === 'pro' || idy.primary === 'partner' || idy.primary === 'enterprise' || idy.primary === 'resident';

    q.innerHTML = items.map(function (it) {
      var isLocked = it.lock && !resumeUnlocked;
      var click = (guest || isLocked) ? '' : 'onclick="location.href=\'' + it.href + '\'"';
      var iconSvg = it.ic === 'i-rotate'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l2.5 2.5"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#' + it.ic + '"/></svg>';
      var lockOverlay = isLocked ? '<span class="quick-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>' : '';
      return '<div class="quick-item' + (isLocked ? ' is-locked' : '') + '" ' + click + '>' +
        '<div class="quick-icon ' + it.cls + '">' + iconSvg + lockOverlay +
          (it.badge ? '<span class="quick-badge">' + it.badge + '</span>' : '') +
        '</div>' +
        '<span class="quick-label">' + it.title + '</span>' +
      '</div>';
    }).join('');
  }

  /* ---------- 渲染：最近浏览 ---------- */
  function renderHistory() {
    /* 从 ViewHistory 读取最近4条真实浏览记录（仅1个月内） */
    var items = [];
    try { items = window.ViewHistory ? ViewHistory.recent(4) : []; } catch (e) { items = []; }

    var el1 = document.getElementById('pf-history');
    if (!el1) return;

    if (items.length === 0) {
      el1.innerHTML =
        '<div style="padding:20px 12px;text-align:center;color:var(--me-text-3);font-size:12.5px;">' +
          '暂无浏览记录，<span onclick="location.href=\'../supply/list.html\'" style="color:var(--me-gold-deep);cursor:pointer;font-weight:600;">去发现</span>' +
        '</div>';
      return;
    }

    /* 分类图标映射 */
    var ICONS = {
      cooperation: 'i-box', material: 'i-box', equipment: 'i-tool',
      labor: 'i-scaffold', agency: 'i-doc'
    };

    var html = items.map(function (it) {
      var icon = ICONS[it.bizKey] || 'i-doc';
      var price = it.price || '面议';
      return '<div class="history-card" onclick="location.href=\'../supply/detail.html?id=' + encodeURIComponent(it.id) + '\'">' +
        '<div class="history-img">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#' + icon + '"/></svg>' +
        '</div>' +
        '<div class="history-body">' +
          '<div class="history-name">' + (it.title || '未命名条目') + '</div>' +
          '<div class="history-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + (it.city || '未知地区') + '</div>' +
          '<div class="history-price">' + price + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el1.innerHTML = html;
  }

  /* ---------- KPI 跳转 ---------- */
  function pfKpiJump(type) {
    var map = { fav:'../favorite/index.html', pub:'../publish/records.html', deal:'../order/index.html', follow:'../personnel/index.html' };
    if (map[type]) location.href = map[type];
  }
  window.pfKpiJump = pfKpiJump;

  function openMember() {
    var st; try { st = UI.state.get(); } catch (e) { st = {}; }
    if (!st.loggedIn) {
      /* 游客：跳转登录页 */
      location.href = '../auth/login.html';
    } else {
      /* 已登录未认证：跳转认证引导页 */
      location.href = 'auth-prep.html?type=center';
    }
  }
  window.openMember = openMember;

  /* ---------- 初始化 ---------- */
  function init() {
    renderHeader();
    renderIdentity();
    renderKPI();
    renderWallet();
    renderOrderStates();
    renderQuick();
    renderHistory();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
