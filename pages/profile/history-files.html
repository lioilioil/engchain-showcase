<title>历史文件 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   历史文件 V2.3
   全站文件统一档案：按生成/上传/发送/收到时间倒序，来源标签标记；
   · 点击卡片 → 弹窗（下载 / 转发）
   · 卡片右侧预览icon → 自下而上弹窗展示文件内容（按类型模拟预览）
   · 长按卡片 → 批量管理态（全选 / 多选 / 底部悬浮 删除·下载·转发）
   · 首次进入弹出操作提示气泡
   · 右上角“操作记录”：自下而上弹窗，按时间倒序展示每次文件操作（生成/下载/转发/删除/撤销）
   转发出口：邮箱客户端（mailto）/ 指定会话消息窗口（逐条文件消息）。
   ═══════════════════════════════════════════════════════════════ */
:root {
  --hf-gold: #B08A3C;
  --hf-gold-deep: #8A6A28;
  --hf-bg: #F2EFE8;
  --hf-card: rgba(255,255,255,0.82);
  --hf-border: rgba(176, 138, 60, 0.16);
  --hf-text: #2A2722;
  --hf-text-2: #6B6358;
  --hf-text-3: #9A9185;
  --hf-shadow: 0 1px 2px rgba(42,39,34,0.04), 0 2px 8px rgba(42,39,34,0.03);
}
[data-theme="dark"] {
  --hf-gold: #E0C083;
  --hf-gold-deep: #B89A5A;
  --hf-bg: #0E0D0B;
  --hf-card: rgba(32,30,27,0.74);
  --hf-border: rgba(201, 164, 92, 0.12);
  --hf-text: #F0EBE0;
  --hf-text-2: #B0A898;
  --hf-text-3: #7A7265;
  --hf-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.15);
}

body, .phone { background: var(--hf-bg); }
.phone::before {
  content: '';
  position: absolute;
  top: -80px;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  height: 240px;
  background: radial-gradient(ellipse at center, rgba(176, 138, 60, 0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* 导航栏 */
.hf-navbar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 50px;
  padding: 0 16px 0 4px;
  flex: 0 0 auto;
}
.hf-nav-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  font-size: 22px;
  color: var(--hf-text);
  cursor: pointer;
  border-radius: 50%;
  transition: background 0.2s;
}
.hf-nav-back:active { background: rgba(176, 138, 60, 0.12); }
.hf-nav-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--hf-text);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  transition: font-size .2s;
}
/* 「操作记录」按钮已统一为共享 .nav-text-btn（保留 id=hf-oplog 供 JS 禁用态） */
/* 批量管理态：左上“返回” / 右上“全选” 链接 */
.hf-nav-link {
  font-size: 14px;
  font-weight: 600;
  color: var(--hf-text);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 10px;
  border-radius: 8px;
  transition: background 0.2s;
}
.hf-nav-link:active { background: rgba(176, 138, 60, 0.12); }
.hf-nav-link.accent { color: var(--hf-gold-deep); }
/* 管理态“返回”文字链接：覆盖返回图标的固定宽高，避免“返回”二字换行 */
.hf-nav-back.hf-nav-link {
  width: auto;
  height: auto;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 8px;
  white-space: nowrap;
}

/* 内容区 */
.hf-content {
  position: relative;
  z-index: 1;
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 40px;
  -webkit-overflow-scrolling: touch;
}
.hf-content.hf-manage { padding-bottom: 104px; }

/* 日期分组标题 */
.hf-date-group {
  font-size: 12px;
  color: var(--hf-text-3);
  font-weight: 600;
  margin: 16px 0 8px;
  padding-left: 2px;
  letter-spacing: 0.3px;
}
.hf-date-group:first-child { margin-top: 8px; }

/* 文件卡片 */
.hf-row { position: relative; margin-bottom: 8px; }
.hf-card {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 14px;
  background: var(--hf-card);
  border: 1px solid var(--hf-border);
  box-shadow: var(--hf-shadow);
  transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s, background 0.22s;
  cursor: pointer;
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.hf-card:active { transform: scale(0.985); }
.hf-card.selected {
  border-color: var(--hf-gold);
  background: rgba(176, 138, 60, 0.10);
}
/* 批量管理态 · 左侧多选圆 */
.hf-check {
  flex-shrink: 0;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  border: 1.5px solid rgba(176, 138, 60, 0.75);
  background: rgba(255,255,255,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}
[data-theme="dark"] .hf-check { background: rgba(255,255,255,0.08); }
.hf-check svg { width: 12px; height: 12px; }
.hf-check.on {
  background: linear-gradient(135deg, var(--hf-gold), var(--hf-gold-deep));
  border-color: transparent;
  color: #fff;
}
.hf-file-ic {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 11px;
  color: #fff;
  letter-spacing: .02em;
}
.hf-file-ic.pdf { background: var(--error-soft); color: var(--error); }
.hf-file-ic.doc { background: rgba(37,99,235,.12); color: var(--blue); }
.hf-file-ic.img { background: var(--success-soft); color: var(--success); }
.hf-file-ic.zip { background: rgba(124,91,189,.12); color: var(--purple); }
[data-theme="dark"] .hf-file-ic.doc { background: rgba(96,165,250,.16); }
[data-theme="dark"] .hf-file-ic.zip { background: rgba(167,139,250,.16); }
.hf-file-ic.oth { background: var(--hf-border); color: var(--hf-text-2); }
.hf-body { flex: 1; min-width: 0; }
.hf-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--hf-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.hf-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.hf-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .02em;
}
.hf-tag.src-qcc { background: rgba(176, 138, 60, 0.16); color: var(--hf-gold-deep); }
.hf-tag.src-edit { background: rgba(37,99,235,.12); color: var(--blue); }
.hf-tag.src-view { background: rgba(37,99,235,.12); color: var(--blue); }
.hf-tag.src-chat { background: rgba(124,91,189,.12); color: var(--purple); }
.hf-tag.src-fwd { background: var(--hf-border); color: var(--hf-text-3); }
.hf-tag.src-other { background: var(--hf-border); color: var(--hf-text-3); }
.hf-tag.src-geo { background: rgba(176, 138, 60, 0.16); color: #8a6d3b; }
[data-theme="dark"] .hf-tag.src-geo { color: #D4B876; }
[data-theme="dark"] .hf-tag.src-qcc { color: #D4B876; }
[data-theme="dark"] .hf-tag.src-edit { background: rgba(96,165,250,.16); }
[data-theme="dark"] .hf-tag.src-view { background: rgba(96,165,250,.16); }
[data-theme="dark"] .hf-tag.src-chat { background: rgba(167,139,250,.16); }
.hf-time {
  font-size: 10.5px;
  color: var(--hf-text-3);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.hf-note {
  font-size: 11px;
  color: var(--hf-text-2);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hf-note .fwd-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 9.5px;
  font-weight: 700;
  color: var(--hf-text-3);
  background: var(--hf-border);
}

/* 文件卡片 · 右侧预览入口 */
.hf-preview {
  flex: none;
  width: 32px;
  height: 32px;
  margin-right: -2px;
  border: none;
  background: none;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--hf-text-3);
  cursor: pointer;
  transition: background 0.18s, color 0.18s, transform 0.15s;
}
.hf-preview svg { width: 18px; height: 18px; }
.hf-preview:active { transform: scale(0.88); background: rgba(176, 138, 60, 0.14); color: var(--hf-gold-deep); }
/* 按压预览icon时不触发整卡缩放反馈 */
.hf-card:has(.hf-preview:active) { transform: none; }

/* 文件内容预览弹窗（自下而上） */
.hf-pv-head { display: flex; align-items: center; gap: 12px; padding: 2px 2px 14px; }
.hf-pv-head .hf-file-ic { width: 46px; height: 46px; border-radius: 13px; font-size: 12px; }
.hf-pv-name { font-size: 15px; font-weight: 700; color: var(--text-1); line-height: 1.35; word-break: break-all; }
.hf-pv-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-3); }
.hf-pv-tag { padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; background: var(--hf-border); color: var(--hf-text-2); }
/* 模拟纸张 */
.hf-pv-page {
  background: var(--bg-card-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 20px 18px;
  margin-bottom: 4px;
  box-shadow: var(--hf-shadow);
}
.hf-pv-p-title { font-size: 16px; font-weight: 800; color: var(--text-1); text-align: center; letter-spacing: .02em; }
.hf-pv-p-sub { font-size: 11px; color: var(--text-3); text-align: center; margin-top: 6px; }
.hf-pv-p-rule { height: 1px; background: var(--line); margin: 14px 0; position: relative; }
.hf-pv-p-rule::after { content: ''; position: absolute; left: 0; top: -1px; width: 56px; height: 2px; background: linear-gradient(90deg, var(--hf-gold), transparent); }
.hf-pv-sec { margin-bottom: 14px; }
.hf-pv-sec-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; }
.hf-pv-sec-title::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: linear-gradient(180deg, var(--hf-gold), var(--hf-gold-deep)); }
.hf-pv-p { font-size: 12px; color: var(--text-2); line-height: 1.85; margin: 0 0 6px; }
.hf-pv-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.hf-pv-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); color: var(--text-2); }
.hf-pv-table td.k { width: 88px; color: var(--text-3); font-weight: 600; }
.hf-pv-table tr:last-child td { border-bottom: none; }
.hf-pv-p-foot { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3); margin-top: 12px; }
.hf-pv-stamp {
  flex: none;
  width: 74px;
  height: 74px;
  margin: 4px auto 0;
  border-radius: 50%;
  border: 2px dashed var(--hf-gold);
  opacity: .5;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--hf-gold-deep);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  transform: rotate(-12deg);
}
/* 图片预览 */
.hf-pv-img { border-radius: 14px; border: 1px solid var(--line); overflow: hidden; background: linear-gradient(135deg, rgba(176, 138, 60, 0.14), rgba(176, 138, 60, 0.04)); }
.hf-pv-img-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 240px; padding: 28px 20px; color: var(--text-3); text-align: center; }
.hf-pv-img-ic { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.6); box-shadow: var(--hf-shadow); }
.hf-pv-img-ic svg { width: 26px; height: 26px; color: var(--success); }
[data-theme="dark"] .hf-pv-img-ic { background: rgba(255, 255, 255, 0.08); }
.hf-pv-img-name { font-size: 12.5px; font-weight: 600; color: var(--text-1); word-break: break-all; }
.hf-pv-img-size { font-size: 11px; color: var(--text-3); }
/* 压缩包预览 */
.hf-pv-zip { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.hf-pv-zip-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.hf-pv-zip-row:last-child { border-bottom: none; }
.hf-pv-zip-row .zf { flex: none; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; color: #fff; }
.hf-pv-zip-name { flex: 1; min-width: 0; color: var(--text-1); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hf-pv-zip-size { flex: none; color: var(--text-3); font-size: 10.5px; }
/* 文本预览 */
.hf-pv-txt { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 11.5px; line-height: 1.9; color: var(--text-2); background: var(--bg-card-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; white-space: pre-wrap; word-break: break-all; }

/* 批量管理态 · 底部悬浮操作栏（按钮行无背景） */
.hf-mbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  background: none;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.hf-mbar.hide { opacity: 0; transform: translateY(16px); }
.hf-mbtn {
  pointer-events: auto;
  border: none;
  border-radius: 999px;
  min-width: 96px;
  height: 44px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
  box-shadow: 0 6px 16px rgba(42,39,34,0.16);
}
.hf-mbtn:active { transform: scale(0.96); }
.hf-mbtn:disabled { opacity: 0.4; box-shadow: none; cursor: default; }
.hf-mbtn svg { width: 16px; height: 16px; }
.hf-mbtn.del { background: var(--error-soft); color: var(--error); }
.hf-mbtn.dl  { background: linear-gradient(180deg, var(--hf-gold), var(--hf-gold-deep)); color: #fff; }
.hf-mbtn.fwd {
  background: rgba(255,255,255,0.92);
  color: var(--hf-gold-deep);
  border: 1px solid var(--hf-border);
}
[data-theme="dark"] .hf-mbtn.fwd { background: rgba(32,30,27,0.92); }

/* 撤销提示（防误删兜底） */
.hf-undo {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: calc(84px + env(safe-area-inset-bottom));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(42,39,34,0.92);
  color: #fff;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  animation: hf-undo-in 0.25s ease-out;
}
.hf-undo button {
  margin-left: auto;
  border: none;
  background: none;
  color: var(--hf-gold);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 4px 6px;
}
@keyframes hf-undo-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 首次进入操作提示气泡 */
.hf-hint {
  position: absolute;
  top: calc(48px + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px 11px 18px;
  border-radius: 999px;
  background: rgba(42,39,34,0.94);
  color: #fff;
  font-size: 12.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  cursor: pointer;
  white-space: nowrap;
  animation: hf-hint-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
.hf-hint::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  margin-left: -6px;
  border: 6px solid transparent;
  border-top-color: rgba(42,39,34,0.94);
}
.hf-hint-txt { line-height: 1; }
.hf-hint-btn {
  border: none;
  background: none;
  color: var(--hf-gold);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  padding: 4px 6px;
  white-space: nowrap;
}
.hf-hint.out {
  opacity: 0;
  transform: translateX(-50%) translateY(-8px);
  transition: opacity 0.25s, transform 0.25s;
}
@keyframes hf-hint-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 弹窗选项（点击卡片 / 转发目标选择） */
.hf-sheet-opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 14px;
  border-radius: 14px;
  background: var(--bg-card-2);
  border: 1px solid var(--line);
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text-1);
  transition: opacity 0.15s;
}
.hf-sheet-opt:active { opacity: 0.75; }
.hf-sheet-opt svg { width: 20px; height: 20px; color: var(--primary-dim); flex: none; }
.hf-sheet-opt em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--text-3); font-weight: 500; }

/* 操作记录弹窗（自下而上，按时间倒序，超 N 条局部展示 + 展开） */
.op-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
}
.op-row:last-child { border-bottom: none; }
.op-ic {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 8px;
  color: #fff;
  letter-spacing: .02em;
}
.op-ic.pdf { background: var(--error-soft); color: var(--error); }
.op-ic.doc { background: rgba(37,99,235,.12); color: var(--blue); }
.op-ic.img { background: var(--success-soft); color: var(--success); }
.op-ic.zip { background: rgba(124,91,189,.12); color: var(--purple); }
[data-theme="dark"] .op-ic.doc { background: rgba(96,165,250,.16); }
[data-theme="dark"] .op-ic.zip { background: rgba(167,139,250,.16); }
.op-ic.oth { background: var(--hf-border); color: var(--hf-text-2); }
.op-main { flex: 1; min-width: 0; }
.op-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.op-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; min-width: 0; }
.op-pill {
  display: inline-flex;
  align-items: center;
  flex: none;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
}
.op-pill.op-created { background: rgba(176, 138, 60, 0.16); color: var(--hf-gold-deep); }
.op-pill.op-download { background: rgba(37,99,235,.12); color: var(--blue); }
.op-pill.op-forward { background: var(--hf-border); color: var(--hf-text-3); }
.op-pill.op-delete { background: var(--error-soft); color: var(--error); }
.op-pill.op-undo { background: var(--hf-border); color: var(--hf-text-3); }
[data-theme="dark"] .op-pill.op-created { color: #D4B876; }
[data-theme="dark"] .op-pill.op-download { background: rgba(96,165,250,.16); }
[data-theme="dark"] .op-pill.op-undo { color: #8a8378; }
.op-detail {
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.op-time { flex: none; font-size: 10.5px; color: var(--text-3); }
.op-more-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 22px;
  border-radius: 999px;
  border: 1px solid var(--hf-border);
  background: var(--hf-card);
  color: var(--hf-gold-deep);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.op-more-btn:active { opacity: 0.7; }

/* 空状态 */
.hf-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
}
.hf-empty-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(176, 138, 60, 0.12), rgba(176, 138, 60, 0.04));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--hf-gold-deep);
  margin-bottom: 16px;
}
.hf-empty-icon svg { width: 32px; height: 32px; opacity: 0.6; }
.hf-empty-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--hf-text);
  margin-bottom: 6px;
}
.hf-empty-desc {
  font-size: 12.5px;
  color: var(--hf-text-3);
  line-height: 1.6;
  margin-bottom: 24px;
}
.hf-empty-btn {
  padding: 11px 36px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--action), var(--action-deep));
  color: var(--on-action);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: inset 0 1px 0 rgba(176, 138, 60, 0.45), 0 4px 12px rgba(38, 32, 26, 0.18);
}
.hf-empty-btn:active { transform: scale(0.97); }
.hf-empty-tip { font-size: 11px; color: var(--hf-text-3); margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="phone">
  <!-- 导航栏 -->
  <div class="hf-navbar">
    <button class="hf-nav-back" id="hf-back">‹</button>
    <div class="hf-nav-title" id="hf-nav-title">历史文件</div>
    <button type="button" class="nav-text-btn" id="hf-oplog">操作记录</button>
  </div>

  <!-- 内容区 -->
  <div class="hf-content" id="hf-content"></div>

  <!-- 批量管理态 · 底部悬浮操作栏（无背景） -->
  <div class="hf-mbar hide" id="hf-mbar">
    <button class="hf-mbtn del" id="m-del" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>
    <button class="hf-mbtn dl" id="m-dl" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</button>
    <button class="hf-mbtn fwd" id="m-fwd" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>转发</button>
  </div>
</div>

<script>window.__ENGCHAIN_SILENT_FILE_RECORD = true;</script>
<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/file-download.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';

  var content = document.getElementById('hf-content');
  var backBtn = document.getElementById('hf-back');
  var oplogBtn = document.getElementById('hf-oplog');
  var navTitle = document.getElementById('hf-nav-title');
  var mbar = document.getElementById('hf-mbar');
  var mDel = document.getElementById('m-del');
  var mDl = document.getElementById('m-dl');
  var mFwd = document.getElementById('m-fwd');

  var MODE = 'normal';      // normal | manage
  var selected = {};        // 批量管理选中 id -> true
  var undoRecords = [];     // 已删除记录（可撤销）
  var undoTimer = null;

  /* 图标 */
  var IC_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  var IC_FWD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>';
  var IC_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>';
  var IC_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  var IC_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var IC_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var IC_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

  /* 来源标签配色（sourceKey → class） */
  function srcCls(key) {
    return { qcc: 'src-qcc', edit: 'src-edit', view: 'src-view', detail: 'src-view', chat: 'src-chat', fwd: 'src-fwd', geo: 'src-geo', other: 'src-other' }[key] || 'src-other';
  }
  /* 事件动词：生成/上传/发送/收到/转发 */
  function verbFor(it) {
    if (it.event === '转发到会话' || (it.source || '') === '转发到会话') return '转发于';
    if (it.sourceKey === 'qcc') return '生成于';
    if (it.sourceKey === 'edit') return '上传于';
    if (it.sourceKey === 'detail') return '下载于';
    if (it.sourceKey === 'view') return '浏览于';
    if (it.sourceKey === 'geo') return '生成于';
    if ((it.source || '').indexOf('收到') > -1) return '收到于';
    if ((it.source || '').indexOf('发送') > -1) return '发送于';
    return '生成于';
  }
  /* 文件类型图标块 */
  function fileIc(name) {
    var ext = (name.split('.').pop() || '').toLowerCase();
    var cls = 'oth', label = 'F';
    if (ext === 'pdf') { cls = 'pdf'; label = 'PDF'; }
    else if (ext === 'doc' || ext === 'docx') { cls = 'doc'; label = 'DOC'; }
    else if (ext === 'jpg' || ext === 'jpeg' || ext === 'png' || ext === 'webp' || ext === 'gif') { cls = 'img'; label = 'IMG'; }
    else if (ext === 'zip' || ext === 'rar' || ext === '7z') { cls = 'zip'; label = 'ZIP'; }
    else if (ext) { label = ext.slice(0, 3).toUpperCase(); }
    return '<div class="hf-file-ic ' + cls + '">' + label + '</div>';
  }
  /* 日期分组 */
  function dateGroup(ts) {
    var d = new Date(ts), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = Math.floor((today - day) / 864e5);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff <= 7) return diff + '天前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function fmtTime(ts) {
    var d = new Date(ts), now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var hh = (d.getHours() < 10 ? '0' : '') + d.getHours();
    var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    return sameDay ? hh + ':' + mm : ((d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm);
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }

  /* 查找文件记录 */
  function findFile(id) {
    var r = null;
    try { FileStore.list().forEach(function (f) { if (f.id === id) r = f; }); } catch (e) {}
    return r;
  }
  function listFiles() { try { return FileStore.list(); } catch (e) { return []; } }
  function selCount() { var n = 0; for (var k in selected) if (selected[k]) n++; return n; }
  function allSelected() {
    var items = listFiles();
    return items.length > 0 && items.every(function (it) { return !!selected[it.id]; });
  }

  /* ── 批量管理态 ── */
  function syncNavbar() {
    var n = selCount();
    if (MODE === 'manage') {
      backBtn.textContent = '返回';
      backBtn.classList.add('hf-nav-link');
      oplogBtn.textContent = allSelected() ? '取消全选' : '全选';
      oplogBtn.classList.add('hf-nav-link', 'accent');
      oplogBtn.disabled = false;
      navTitle.textContent = n ? '已选 ' + n + ' 项' : '选择文件';
      mbar.classList.remove('hide');
      content.classList.add('hf-manage');
    } else {
      backBtn.textContent = '‹';
      backBtn.classList.remove('hf-nav-link');
      oplogBtn.textContent = '操作记录';
      oplogBtn.classList.remove('hf-nav-link', 'accent');
      oplogBtn.disabled = false;
      navTitle.textContent = '历史文件';
      mbar.classList.add('hide');
      content.classList.remove('hf-manage');
    }
    mDel.disabled = mDl.disabled = mFwd.disabled = (MODE !== 'manage' || n === 0);
  }
  function enterManage(id) {
    if (MODE === 'manage') return;
    MODE = 'manage';
    selected = {};
    if (id) selected[id] = true;
    render();
  }
  function exitManage() {
    if (MODE !== 'manage') return;
    MODE = 'normal';
    selected = {};
    render();
  }
  function toggleSel(id, on) {
    if (on === undefined) on = !selected[id];
    if (on) selected[id] = true; else delete selected[id];
    var card = content.querySelector('.hf-card[data-id="' + id + '"]');
    if (card) {
      card.classList.toggle('selected', !!selected[id]);
      var ck = card.querySelector('.hf-check');
      if (ck) ck.classList.toggle('on', !!selected[id]);
    }
    syncNavbar();
  }

  /* ── 渲染列表 ── */
  function render() {
    var items = listFiles();
    if (!items.length && MODE === 'manage') { MODE = 'normal'; selected = {}; }
    syncNavbar();

    if (!items.length) {
      content.innerHTML =
        '<div class="hf-empty">' +
          '<div class="hf-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>' +
          '<div class="hf-empty-title">暂无历史文件</div>' +
          '<div class="hf-empty-desc">企业信息查询生成的工商报告、详情页附件、<br>会话中发送或收到的文件都会收录在这里</div>' +
          '<button class="hf-empty-btn" id="hf-go-qcc">去企业信息查询</button>' +
          '<div class="hf-empty-tip">文件按生成 / 上传 / 发送 / 收到时间倒序排列，<br>点击查看操作，长按批量管理，右上角查看操作记录。</div>' +
        '</div>';
      var go = document.getElementById('hf-go-qcc');
      if (go) go.addEventListener('click', function () { location.href = '../search/index.html?v=enterprise'; });
      return;
    }

    /* 按日期分组（FileStore.list 已按 time 倒序） */
    var groups = {};
    items.forEach(function (it) {
      var g = dateGroup(it.time || it.createdAt || Date.now());
      if (!groups[g]) groups[g] = [];
      groups[g].push(it);
    });

    var html = '';
    Object.keys(groups).forEach(function (g) {
      html += '<div class="hf-date-group">' + g + '</div>';
      groups[g].forEach(function (it) {
        var fwdN = it.forwarded || 0;
        var isSel = !!selected[it.id];
        html +=
          '<div class="hf-row">' +
            '<div class="hf-card' + (isSel ? ' selected' : '') + '" data-id="' + esc(it.id) + '">' +
              (MODE === 'manage' ? '<div class="hf-check' + (isSel ? ' on' : '') + '">' + IC_CHECK + '</div>' : '') +
              fileIc(it.name) +
              '<div class="hf-body">' +
                '<div class="hf-name">' + esc(it.name) + '</div>' +
                '<div class="hf-meta">' +
                  '<span class="hf-tag ' + srcCls(it.sourceKey) + '">' + esc(it.source || '其他') + '</span>' +
                  '<span class="hf-time">' + verbFor(it) + ' ' + esc(it.timeText || fmtTime(it.time || it.createdAt)) + '</span>' +
                '</div>' +
                (it.note ? '<div class="hf-note">' + esc(it.note) +
                  (fwdN ? '<span class="fwd-badge">已转发 ' + fwdN + ' 次</span>' : '') +
                  '</div>' : '') +
              '</div>' +
              '<button type="button" class="hf-preview" data-preview-id="' + esc(it.id) + '" aria-label="预览文件" title="预览文件">' + IC_EYE + '</button>' +
            '</div>' +
          '</div>';
      });
    });
    content.innerHTML = html;
    maybeShowHint();
  }

  /* ── 首次进入操作提示气泡 ── */
  function maybeShowHint() {
    try { if (localStorage.getItem('engchain-hf-hint')) return; } catch (e) {}
    if (MODE !== 'normal' || !listFiles().length) return;
    if (document.querySelector('.hf-hint')) return;
    var el = document.createElement('div');
    el.className = 'hf-hint';
    el.innerHTML = '<span class="hf-hint-txt">长按文件可操作转发、下载</span><button class="hf-hint-btn">知道了</button>';
    document.querySelector('.phone').appendChild(el);
    var done = false;
    function dismiss() {
      if (done) return;
      done = true;
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 260);
      try { localStorage.setItem('engchain-hf-hint', '1'); } catch (e) {}
    }
    el.addEventListener('click', dismiss);
    setTimeout(dismiss, 6000);
  }

  /* ── 撤销删除 ── */
  function showUndo() {
    hideUndo();
    var el = document.createElement('div');
    el.className = 'hf-undo';
    var label = undoRecords.length > 1 ? '已删除 ' + undoRecords.length + ' 个文件' : '已删除「' + esc(undoRecords[0].rec.name) + '」';
    el.innerHTML = '<span>' + label + '</span><button id="hf-undo-btn">撤销</button>';
    document.querySelector('.phone').appendChild(el);
    el.querySelector('#hf-undo-btn').addEventListener('click', undoDelete);
    undoTimer = setTimeout(hideUndo, 5000);
  }
  function hideUndo() {
    if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
    var el = document.querySelector('.hf-undo');
    if (el) el.remove();
  }
  function undoDelete() {
    var st = FileStore.read();
    var items = st.items || [];
    undoRecords.slice().reverse().forEach(function (u) {
      var idx = Math.min(u.idx, items.length);
      items.splice(idx, 0, u.rec);
      opPush({ fid: u.rec.id, name: u.rec.name, type: 'undo', label: '撤销删除' });
    });
    FileStore.write(st);
    undoRecords = [];
    hideUndo();
    render();
  }
  /* 删除（统一入口：批量栏；带撤销） */
  function doDelete(id) {
    var st = FileStore.read();
    var items = st.items || [];
    var idx = -1, rec = null;
    items.forEach(function (it, i) { if (it.id === id) { rec = it; idx = i; } });
    if (!rec) return;
    try { FileStore.remove(id); } catch (e) {}
    delete selected[id];
    opPush({ fid: id, name: rec.name, type: 'delete', label: '删除' });
    undoRecords.push({ rec: rec, idx: idx });
    render();
    showUndo();
  }

  /* ── 下载 ── */
  function kbSize(size) {
    if (typeof size === 'number') return size;
    var s = String(size == null ? '' : size).trim().toUpperCase();
    var m = /^([\d.]+)\s*(KB|MB|GB)?$/.exec(s);
    if (!m) return 2048;
    var n = parseFloat(m[1]), u = m[2] || 'KB';
    if (u === 'MB') n *= 1024; else if (u === 'GB') n *= 1024 * 1024;
    return Math.max(1, Math.round(n));
  }
  function downloadFiles(ids) {
    var files = ids.map(findFile).filter(Boolean);
    if (!files.length) return;
    files.forEach(function (f) { opPush({ fid: f.id, name: f.name, type: 'download', label: '下载' }); });
    if (window.FileDownload) {
      var pending = {};
      files.forEach(function (f) { pending[f.id] = true; FileDownload.start(f.id, f.name, kbSize(f.size)); });
      UI.toast('开始下载 ' + files.length + ' 个文件', 'ok');
      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        var done = true;
        files.forEach(function (f) {
          var r = FileDownload.get(f.id);
          if (!r || (r.status !== 'completed' && r.status !== 'failed')) done = false;
        });
        if (done || tries > 40) {
          clearInterval(iv);
          UI.toast(files.length > 1 ? '文件下载完成' : '「' + files[0].name + '」下载完成', 'ok');
        }
      }, 600);
    } else {
      files.forEach(function (f) {
        if (f.href) {
          var a = document.createElement('a');
          a.href = f.href; a.download = f.name;
          document.body.appendChild(a); a.click(); a.remove();
        }
      });
      UI.toast('开始下载 ' + files.length + ' 个文件', 'ok');
    }
  }

  /* ── 转发 ── */
  /* 点击卡片弹窗：下载 / 转发 */
  function openFileSheet(id) {
    var file = findFile(id);
    if (!file) { UI.toast('文件不存在或已删除', 'warn'); return; }
    var sh = UI.sheet();
    sh.setText(file.name);
    sh.html(
      '<div style="font-size:11.5px;color:var(--text-3);padding:2px 2px 12px;line-height:1.6;">选择要执行的操作</div>' +
      '<div class="hf-sheet-opt" onclick="UI.closeSheet();hfAct(\'dl\',\'' + file.id + '\')">' + IC_DL + '<span>下载</span></div>' +
      '<div class="hf-sheet-opt" onclick="UI.closeSheet();hfAct(\'fwd\',\'' + file.id + '\')">' + IC_FWD + '<span>转发</span></div>'
    );
    sh.show();
  }
  window.hfAct = function (act, id) {
    if (act === 'dl') downloadFiles([id]);
    else if (act === 'fwd') openForward(id);
  };

  /* 转发：选择出口（邮箱客户端 / 指定消息会话窗口） */
  function openForward(ids) {
    ids = (Array.isArray(ids) ? ids.slice() : [ids]).filter(Boolean);
    if (!ids.length) return;
    var files = ids.map(findFile).filter(Boolean);
    if (!files.length) { UI.toast('文件不存在或已删除', 'warn'); return; }
    var sh = UI.sheet();
    sh.setText(files.length > 1 ? '转发 ' + files.length + ' 个文件' : '转发文件');
    sh.html(
      '<div style="font-size:11.5px;color:var(--text-3);padding:2px 2px 12px;line-height:1.6;">选择转发方式</div>' +
      '<div class="hf-sheet-opt" onclick="UI.closeSheet();hfForwardMail(\'' + ids.join(',') + '\')">' + IC_MAIL + '<span>邮箱</span><em>载入邮件客户端</em></div>' +
      '<div class="hf-sheet-opt" onclick="UI.closeSheet();hfForwardConv(\'' + ids.join(',') + '\')">' + IC_CHAT + '<span>消息会话</span><em>发送到指定会话窗口</em></div>'
    );
    sh.show();
  }

  /* 出口①：邮箱客户端（mailto，浏览器不附带真实附件，携带文件信息） */
  window.hfForwardMail = function (idsStr) {
    var files = String(idsStr || '').split(',').map(findFile).filter(Boolean);
    if (!files.length) return;
    var subject = files.length > 1 ? '转发文件（' + files.length + ' 个）' : '转发文件：' + files[0].name;
    var body = '你好，\n\n向你转发以下文件：\n' +
      files.map(function (f) { return '· ' + f.name + (f.size ? '（' + f.size + '）' : ''); }).join('\n') +
      '\n\n—— 来自工程链';
    window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    files.forEach(function (f) { opPush({ fid: f.id, name: f.name, type: 'forward', label: '转发', detail: '邮箱' }); });
    UI.toast('已调起邮箱客户端', 'ok');
  };

  /* 出口②：消息会话窗口（逐条文件消息发送，fwd 参数逗号分隔多文件） */
  window.hfForwardConv = function (idsStr) {
    var ids = String(idsStr || '').split(',').filter(Boolean);
    var files = ids.map(findFile).filter(Boolean);
    if (!files.length) { UI.toast('文件不存在或已删除', 'warn'); return; }
    var sh = UI.sheet();
    sh.setText('选择接收会话');
    sh.html(
      '<div style="font-size:11.5px;color:var(--text-3);padding:0 2px 10px;line-height:1.6;">' + (files.length > 1 ? '所选 ' + files.length + ' 个文件将逐条发送到对方会话窗口。' : '文件将以消息形式发送到对方会话窗口。') + '</div>' +
      (MOCK.conversations || []).map(function (c) {
        return '<div style="display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;" ' +
          'onclick="UI.closeSheet();location.href=\'../message/chat.html?id=' + encodeURIComponent(c.id) + '&fwd=' + encodeURIComponent(ids.join(',')) + '\'">' +
          '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary-soft),var(--bg-card-2));color:var(--primary-dim);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none;">' + esc(c.avatar || (c.name || '?').slice(0, 1)) + '</div>' +
          '<div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:600;color:var(--text-1);">' + esc(c.name) + '</div><div style="font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(c.role || '') + '</div></div>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;color:var(--text-3);flex:none;"><path d="M9 18l6-6-6-6"/></svg>' +
        '</div>';
      }).join('') +
      '<div style="font-size:10.5px;color:var(--text-3);padding:10px 2px 2px;line-height:1.6;">文件支持转发至平台会话消息窗口，或载入邮箱客户端。</div>'
    );
    sh.show();
  };

  /* ── 操作记录（OpLog）：右上角入口，自下而上弹窗 ── */
  function oplog() {
    try {
      if (!window.OpLog) return [];
      if (OpLog.invalidateCache) OpLog.invalidateCache();   /* 每次打开读最新持久化流水 */
      return OpLog.list();
    } catch (e) { return []; }
  }
  function opPush(rec) {
    try { if (window.OpLog && OpLog.push) OpLog.push(rec); } catch (e) {}
  }
  /* 兼容历史数据：为 OpLog 上线前已存在的文件补齐建档/转发流水（幂等） */
  function backfillOpLog() {
    try {
      if (!window.OpLog || !OpLog.push || !OpLog.read) return;
      var items = listFiles();
      var logs = OpLog.read().items || [];
      var created = {}, fwdN = {};
      logs.forEach(function (l) {
        if (l.type === 'created' && l.fid) created[l.fid] = true;
        if (l.type === 'forward' && l.fid) fwdN[l.fid] = (fwdN[l.fid] || 0) + 1;
      });
      items.forEach(function (it) {
        if (!created[it.id]) opPush({ fid: it.id, name: it.name, ts: it.time || it.createdAt || Date.now(), type: 'created', label: verbFor(it).replace('于', ''), detail: it.source || '' });
        var f = it.forwarded || 0, c = fwdN[it.id] || 0;
        for (var i = c; i < f; i++) opPush({ fid: it.id, name: it.name, ts: it.time || Date.now(), type: 'forward', label: '转发', detail: '会话' });
      });
    } catch (e) {}
  }
  function opIc(name) {
    var ext = (name.split('.').pop() || '').toLowerCase();
    var cls = 'oth', label = 'F';
    if (ext === 'pdf') { cls = 'pdf'; label = 'PDF'; }
    else if (ext === 'doc' || ext === 'docx') { cls = 'doc'; label = 'DOC'; }
    else if (ext === 'jpg' || ext === 'jpeg' || ext === 'png' || ext === 'webp' || ext === 'gif') { cls = 'img'; label = 'IMG'; }
    else if (ext === 'zip' || ext === 'rar' || ext === '7z') { cls = 'zip'; label = 'ZIP'; }
    else if (ext) { label = ext.slice(0, 3).toUpperCase(); }
    return '<div class="op-ic ' + cls + '">' + label + '</div>';
  }
  function opRows(items) {
    return items.map(function (l) {
      var pill = 'op-created';
      if (l.type === 'download') pill = 'op-download';
      else if (l.type === 'forward') pill = 'op-forward';
      else if (l.type === 'delete') pill = 'op-delete';
      else if (l.type === 'undo') pill = 'op-undo';
      var label = l.label || (l.type === 'created' ? '生成' : (l.type === 'forward' ? '转发' : l.type));
      return '<div class="op-row">' + opIc(l.name) +
        '<div class="op-main">' +
          '<div class="op-name">' + esc(l.name) + '</div>' +
          '<div class="op-sub"><span class="op-pill ' + pill + '">' + esc(label) + '</span>' +
          (l.detail ? '<span class="op-detail">' + esc(l.detail) + '</span>' : '') + '</div>' +
        '</div>' +
        '<div class="op-time">' + fmtTime(l.ts) + '</div>' +
      '</div>';
    }).join('');
  }
  function openOpLog() {
    var items = oplog();
    var sh = UI.sheet();
    sh.setText('操作记录');
    if (!items.length) {
      sh.html('<div style="padding:44px 16px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.9;">暂无操作记录<br><span style="font-size:11px;color:var(--text-3);">对文件的生成、下载、转发、删除等操作会记录在这里</span></div>');
      sh.show();
      return;
    }
    var cap = 5;
    sh.html(
      '<div style="padding:2px 2px 10px;font-size:11.5px;color:var(--text-3);">共 ' + items.length + ' 条 · 按时间倒序' + (items.length > cap ? ' · 先展示最近 ' + cap + ' 条' : '') + '</div>' +
      '<div id="hf-oplog-list" style="max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;">' + opRows(items.slice(0, cap)) + '</div>'
    );
    if (items.length > cap) {
      var foot = document.createElement('div');
      foot.style.cssText = 'text-align:center;padding:12px 0 4px;';
      var more = document.createElement('button');
      more.className = 'op-more-btn';
      more.textContent = '展开全部 ' + items.length + ' 条记录';
      foot.appendChild(more);
      sh.body().appendChild(foot);
      more.addEventListener('click', function () {
        var list = document.getElementById('hf-oplog-list');
        if (list) list.innerHTML = opRows(items);
        foot.remove();
      });
    }
    sh.show();
  }

  /* ── 文件预览：卡片右侧预览icon → 自下而上弹窗展示文件内容 ── */
  function pvTitle(name) {
    var s = String(name || '文件').replace(/\.(pdf|docx?|jpe?g|png|webp|gif|zip|rar|7z|txt|md)$/i, '');
    return s || '文件内容';
  }
  /* 文档类（PDF / DOC / DOCX）模拟纸张预览 */
  function pvDocContent(file) {
    var title = pvTitle(file.name);
    var company = file.note || '示例企业';
    var isQcc = file.sourceKey === 'qcc' || /工商/.test(file.name);
    var ts = esc(file.timeText || fmtTime(file.time || file.createdAt));
    var page =
      '<div class="hf-pv-page">' +
        '<div class="hf-pv-p-title">' + (isQcc ? '工商信息报告' : esc(title)) + '</div>' +
        '<div class="hf-pv-p-sub">' + esc(company) + ' · 工程链生成 · ' + ts + '</div>' +
        '<div class="hf-pv-p-rule"></div>';
    if (isQcc) {
      page +=
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">企业基本信息</div>' +
          '<table class="hf-pv-table">' +
            '<tr><td class="k">法定代表人</td><td>王××</td></tr>' +
            '<tr><td class="k">统一社会信用代码</td><td>91510100MA6×××××</td></tr>' +
            '<tr><td class="k">注册资本</td><td>5000 万元人民币</td></tr>' +
            '<tr><td class="k">成立日期</td><td>2015-06-12</td></tr>' +
            '<tr><td class="k">企业状态</td><td>存续</td></tr>' +
            '<tr><td class="k">所属行业</td><td>房屋建筑业</td></tr>' +
            '<tr><td class="k">注册地址</td><td>成都市××区××路 ××号</td></tr>' +
          '</table></div>' +
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">股东信息</div>' +
          '<table class="hf-pv-table">' +
            '<tr><td class="k">股东一</td><td>王×× · 认缴 3000 万元 · 持股 60%</td></tr>' +
            '<tr><td class="k">股东二</td><td>李×× · 认缴 2000 万元 · 持股 40%</td></tr>' +
          '</table></div>' +
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">主要人员</div>' +
          '<table class="hf-pv-table">' +
            '<tr><td class="k">执行董事</td><td>王××</td></tr>' +
            '<tr><td class="k">监事</td><td>李××</td></tr>' +
          '</table></div>' +
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">风险概览</div>' +
          '<p class="hf-pv-p">法律诉讼 0 条 · 法院公告 0 条 · 被执行 0 条 · 失信信息 0 条</p></div>' +
        '<div class="hf-pv-stamp">工程链</div>';
    } else {
      page +=
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">文件说明</div>' +
          '<p class="hf-pv-p">本文件为工程链平台收录的项目文件，共 3 页，以下为文档关键内容预览，完整内容请下载后查看。</p>' +
          '<p class="hf-pv-p">文档包含项目背景、技术要求、商务条款与签署页等内容，关键条款以红字标注。</p>' +
        '</div>' +
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">关键信息</div>' +
          '<table class="hf-pv-table">' +
            '<tr><td class="k">文件名称</td><td>' + esc(file.name) + '</td></tr>' +
            '<tr><td class="k">文件大小</td><td>' + esc(file.size || '—') + '</td></tr>' +
            '<tr><td class="k">收录来源</td><td>' + esc(file.source || '其他') + '</td></tr>' +
            '<tr><td class="k">收录时间</td><td>' + ts + '</td></tr>' +
          '</table></div>' +
        '<div class="hf-pv-sec"><div class="hf-pv-sec-title">内容摘要</div>' +
          '<p class="hf-pv-p">一、项目概况：本项目位于四川省成都市，建设内容包含土建、安装及装饰装修工程。</p>' +
          '<p class="hf-pv-p">二、工期要求：计划开工后 180 个日历天内完成全部施工内容并具备验收条件。</p>' +
          '<p class="hf-pv-p">三、质量标准：符合国家现行施工验收规范，一次验收合格率 100%。</p>' +
        '</div>';
    }
    page +=
        '<div class="hf-pv-p-foot"><span>工程链 · 文件预览</span><span>第 1 页 / 共 3 页</span></div>' +
      '</div>';
    return page;
  }
  /* 图片类模拟预览 */
  function pvImgContent(file) {
    var extTxt = esc(String(file.name.split('.').pop() || '图片').toUpperCase());
    return '<div class="hf-pv-img">' +
      '<div class="hf-pv-img-inner">' +
        '<div class="hf-pv-img-ic">' + IC_IMG + '</div>' +
        '<div class="hf-pv-img-name">' + esc(pvTitle(file.name)) + '</div>' +
        '<div class="hf-pv-img-size">' + esc(file.size || '') + (file.size ? ' · ' : '') + extTxt + ' 图片（模拟预览）</div>' +
      '</div>' +
    '</div>';
  }
  /* 压缩包类模拟预览 */
  function pvZipContent(file) {
    var base = pvTitle(file.name);
    var rows = [
      [base + '·明细清单.xlsx', '86 KB', '#1E9E5A', 'XLS'],
      ['检测报告.pdf', '1.8 MB', '#D9534F', 'PDF'],
      ['盖章确认单.pdf', '642 KB', '#D9534F', 'PDF'],
      ['合同扫描件.docx', '2.1 MB', '#3478F6', 'DOC'],
      ['说明.txt', '4 KB', '#7F8C8D', 'TXT']
    ];
    var html = '<div class="hf-pv-zip">';
    rows.forEach(function (r) {
      html += '<div class="hf-pv-zip-row">' +
        '<div class="zf" style="background:' + r[3] + ';">' + r[3] + '</div>' +
        '<div class="hf-pv-zip-name">' + esc(r[0]) + '</div>' +
        '<div class="hf-pv-zip-size">' + r[1] + '</div>' +
      '</div>';
    });
    return html + '</div>';
  }
  /* 文本类模拟预览 */
  function pvTxtContent(file) {
    var lines = [
      '【' + pvTitle(file.name) + '】',
      '',
      '文件收录时间：' + (file.timeText || fmtTime(file.time || file.createdAt)),
      '收录来源：' + (file.source || '其他'),
      '',
      '—— 以下为文件内容预览（模拟文本） ——',
      '',
      '本文件为工程链平台生成/收录的文本文件。',
      '预览仅展示前若干行内容，完整内容请下载后查看。'
    ];
    return '<div class="hf-pv-txt">' + lines.map(esc).join('\n') + '</div>';
  }
  /* 其他类型：文件信息卡 */
  function pvOtherContent(file) {
    return '<div class="hf-pv-page">' +
      '<div class="hf-pv-sec"><div class="hf-pv-sec-title">文件信息</div>' +
        '<table class="hf-pv-table">' +
          '<tr><td class="k">文件名称</td><td>' + esc(file.name) + '</td></tr>' +
          '<tr><td class="k">文件类型</td><td>' + esc(file.ext || String(file.name.split('.').pop() || '文件').toUpperCase()) + '</td></tr>' +
          '<tr><td class="k">文件大小</td><td>' + esc(file.size || '—') + '</td></tr>' +
          '<tr><td class="k">收录来源</td><td>' + esc(file.source || '其他') + '</td></tr>' +
          '<tr><td class="k">收录时间</td><td>' + esc(file.timeText || fmtTime(file.time || file.createdAt)) + '</td></tr>' +
        '</table></div>' +
      '<div class="hf-pv-sec"><div class="hf-pv-sec-title">预览说明</div>' +
        '<p class="hf-pv-p">该文件类型暂不支持在线预览，可下载到本地后使用对应应用打开查看。</p></div>' +
    '</div>';
  }
  function previewContent(file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var head =
      '<div class="hf-pv-head">' + fileIc(file.name) +
        '<div style="flex:1;min-width:0;">' +
          '<div class="hf-pv-name">' + esc(file.name) + '</div>' +
          '<div class="hf-pv-meta">' +
            '<span class="hf-pv-tag">' + esc(file.ext || (ext ? ext.toUpperCase() : 'FILE')) + '</span>' +
            '<span>' + esc(file.size || '—') + '</span>' +
            '<span>·</span>' +
            '<span>' + verbFor(file) + ' ' + esc(file.timeText || fmtTime(file.time || file.createdAt)) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    var body;
    if (ext === 'pdf' || ext === 'doc' || ext === 'docx') body = pvDocContent(file);
    else if (ext === 'jpg' || ext === 'jpeg' || ext === 'png' || ext === 'webp' || ext === 'gif') body = pvImgContent(file);
    else if (ext === 'zip' || ext === 'rar' || ext === '7z') body = pvZipContent(file);
    else if (ext === 'txt' || ext === 'md') body = pvTxtContent(file);
    else body = pvOtherContent(file);
    return head + body;
  }
  function openPreview(id) {
    var file = findFile(id);
    if (!file) { UI.toast('文件不存在或已删除', 'warn'); return; }
    var sh = UI.sheet();
    sh.setText('文件预览');
    sh.html(
      previewContent(file) +
      '<button type="button" class="btn btn-primary btn-block" id="hf-pv-dl" style="margin-top:16px;">下载文件</button>'
    );
    var dl = sh.body().querySelector('#hf-pv-dl');
    if (dl) dl.addEventListener('click', function () { UI.closeSheet(); downloadFiles([file.id]); });
    sh.show();
  }

  /* ── 手势：点击弹窗 / 长按批量（互斥） ── */
  var gs = null;
  function cancelGesture() {
    if (!gs) return;
    if (gs.timer) clearTimeout(gs.timer);
    gs = null;
  }

  content.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.hf-preview')) return;                    /* 预览icon：独立于卡片点按/长按手势 */
    var card = e.target.closest('.hf-card');
    if (!card || !e.isPrimary) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (MODE === 'manage') return;                                  /* 管理态：点按切换勾选 */
    gs = {
      id: e.pointerId,
      fid: card.getAttribute('data-id'),
      x0: e.clientX, y0: e.clientY, t0: Date.now(),
      dx: 0, dy: 0, long: false, moved: false, timer: null
    };
    gs.timer = setTimeout(function () {
      if (!gs || gs.moved) return;
      var fid = gs.fid;
      gs.long = true;
      gs = null;
      /* 抑制长按松手后紧随的 click，避免把刚选中的项再切掉 */
      window.__hfSuppressClick = Date.now() + 400;
      enterManage(fid);
    }, 550);
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  });

  content.addEventListener('pointermove', function (e) {
    if (!gs || e.pointerId !== gs.id) return;
    gs.dx = e.clientX - gs.x0;
    gs.dy = e.clientY - gs.y0;
    if (Math.abs(gs.dy) > 10 && Math.abs(gs.dy) > Math.abs(gs.dx)) { cancelGesture(); return; }  /* 纵向滚动让位浏览器 */
    if (Math.abs(gs.dx) > 10 || Math.abs(gs.dy) > 10) gs.moved = true;                            /* 发生位移即取消长按 */
  });

  function onPointerEnd(e) {
    if (!gs || e.pointerId !== gs.id) return;
    clearTimeout(gs.timer);
    if (gs.long) { gs = null; return; }
    /* 点击：短按无位移 → 弹窗 */
    var dt = Date.now() - gs.t0;
    var moved = Math.max(Math.abs(gs.dx), Math.abs(gs.dy)) > 10;
    if (!moved && dt < 350 && gs.fid) openFileSheet(gs.fid);
    gs = null;
  }
  content.addEventListener('pointerup', onPointerEnd);
  content.addEventListener('pointercancel', function (e) { if (gs && e.pointerId === gs.id) cancelGesture(); });

  /* 事件委托：预览入口 + 管理态勾选切换 */
  content.addEventListener('click', function (e) {
    var pv = e.target.closest('.hf-preview');
    if (pv) {
      if (window.__hfSuppressClick && Date.now() < window.__hfSuppressClick) return;
      openPreview(pv.getAttribute('data-preview-id'));
      return;
    }
    if (window.__hfSuppressClick && Date.now() < window.__hfSuppressClick) return;
    if (MODE === 'manage') {
      var card = e.target.closest('.hf-card');
      if (card) toggleSel(card.getAttribute('data-id'));
    }
  });

  /* ── 导航栏 ── */
  backBtn.addEventListener('click', function () {
    if (MODE === 'manage') { exitManage(); return; }
    if (document.referrer && document.referrer.indexOf(location.hostname) !== -1) window.history.back();
    else location.href = 'index.html';
  });
  /* 正常态=操作记录；管理态=全选/取消全选 */
  oplogBtn.addEventListener('click', function () {
    if (MODE === 'manage') {
      var items = listFiles();
      if (allSelected()) selected = {}; else items.forEach(function (it) { selected[it.id] = true; });
      render();
      return;
    }
    openOpLog();
  });

  /* 批量操作栏 */
  mDel.addEventListener('click', function () { if (MODE === 'manage' && selCount()) Object.keys(selected).forEach(doDelete); });
  mDl.addEventListener('click', function () { if (MODE === 'manage' && selCount()) downloadFiles(Object.keys(selected)); });
  mFwd.addEventListener('click', function () { if (MODE === 'manage' && selCount()) openForward(Object.keys(selected)); });

  /* 跨页同步 */
  window.addEventListener('engchain:files', render);
  window.addEventListener('storage', function (e) { if (e.key === 'engchain-history-files') render(); });

  backfillOpLog();
  render();
})();
</script>
