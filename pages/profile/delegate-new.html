<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>新增委托 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/delegates.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" id="navBack" aria-label="返回">‹</button>
    <div class="nav-title">新增委托</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll no-pad" style="padding-bottom:110px;">
    <div class="dn-info">
      平台专属顾问将根据您的委托需求进行<b> 1 对 1 精准匹配</b>，提交后 <b>2 小时内</b> 与您联系，全程免费、信息严格保密。
    </div>
    <div class="dn-form">
      <div class="dn-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>填写委托信息</div>
      <div id="dnFormRoot" class="df-form"></div>
    </div>
    <div class="dfm-notes" style="margin:12px 16px 0;">
      <div class="dfm-notes-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>提交注意事项</div>
      <ul>
        <li>提交后专属顾问将在 <b>2小时内</b> 与您联系，请保持电话畅通；</li>
        <li>本服务免费，平台不会以委托名义向您收取任何费用；</li>
        <li>您的需求信息仅用于精准匹配，平台将严格保密；</li>
        <li>委托提交后可随时查看进度，<b>已承接后不可更改详情</b>。</li>
      </ul>
    </div>
  </div>

  <div class="dn-save-bar">
    <button type="button" id="dnSubmitBtn">提交委托</button>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/delegates.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';

  document.getElementById('navBack').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.href = 'delegates.html';
  });

  var root = document.getElementById('dnFormRoot');
  root.innerHTML = Delegates.formHtml({ mode: 'general' });
  Delegates.bindForm(root);
  Delegates.prefillAuth(root);

  document.getElementById('dnSubmitBtn').addEventListener('click', function () {
    var data = Delegates.collectForm(root);
    if (!data) return;
    var isFranchise = data.type === '资质招商';
    var rec = {
      biz: isFranchise ? 'franchise' : 'general',
      bizLabel: isFranchise ? '资质招商' : data.type,
      source: 'profile',
      type: data.type, qualLevel: '', mode: data.mode, budget: data.budget,
      region: data.region, contact: data.contact, phone: data.phone,
      backup: data.backup, note: data.note,
      status: '等待承接'
    };
    var saved = Delegates.add(rec);
    UI.toast('委托已提交，顾问将在2小时内联系您', 'ok');
    setTimeout(function () {
      location.href = 'delegate-detail.html?id=' + encodeURIComponent(saved.id);
    }, 700);
  });
})();
</script>
</body>
</html>
