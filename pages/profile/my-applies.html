<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}

.apply-item { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; background:var(--bg-card); border-radius:12px; margin-bottom:10px; cursor:pointer; transition:background .15s; }
.apply-item:active { background:var(--bg-card-2); }
.apply-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--primary-soft),var(--primary)); display:flex; align-items:center; justify-content:center; flex:none; }
.apply-icon svg { width:20px; height:20px; color:#fff; }
.apply-body { flex:1; min-width:0; }
.apply-title { font-size:14px; font-weight:600; color:var(--text-1); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.apply-company { font-size:12px; color:var(--text-2); margin-bottom:6px; }
.apply-meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-3); }
.apply-status { padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; }
.status-pending { background:rgba(201,169,97,.12); color:var(--primary-dim); }
.status-viewed { background:rgba(43,107,79,.1); color:var(--success); }
.status-interested { background:rgba(43,107,79,.15); color:var(--success); font-weight:700; }
.status-rejected { background:rgba(200,60,60,.1); color:var(--error); }
.apply-empty { text-align:center; padding:60px 20px; }
.apply-empty-icon { width:64px; height:64px; border-radius:50%; background:var(--bg-card-2); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.apply-empty-icon svg { width:28px; height:28px; color:var(--text-3); }

/* 简历管理卡片 */
.resume-manage-card { background: linear-gradient(135deg, rgba(201,169,97,0.12), rgba(201,169,97,0.04)); border: 1px solid rgba(201,169,97,0.2); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
.rmc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rmc-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #C9A961, #A98A47); display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 2px 8px rgba(169,138,71,0.3); }
.rmc-icon svg { width: 18px; height: 18px; color: #fff; }
.rmc-info { flex: 1; min-width: 0; }
.rmc-title { font-size: 14px; font-weight: 700; color: var(--text-1); margin-bottom: 2px; }
.rmc-desc { font-size: 11px; color: var(--text-3); }
.rmc-edit-btn { flex: none; padding: 7px 14px; border-radius: 20px; background: linear-gradient(135deg, #C9A961, #A98A47); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(169,138,71,0.3); }
.rmc-edit-btn:active { transform: scale(0.96); }
.rmc-edit-btn svg { width: 13px; height: 13px; }
.rmc-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(201,169,97,0.15); }
.rmc-progress-label { font-size: 11px; color: var(--text-3); flex: none; }
.rmc-progress-track { flex: 1; height: 5px; background: rgba(201,169,97,0.15); border-radius: 3px; overflow: hidden; }
.rmc-progress-fill { height: 100%; background: linear-gradient(90deg, #C9A961, #A98A47); border-radius: 3px; transition: width 0.3s; }
.rmc-progress-pct { font-size: 12px; font-weight: 700; color: var(--primary-dim); font-family: var(--font-num); flex: none; }

/* 快捷入口 */
.quick-entries { display: flex; gap: 10px; margin-bottom: 14px; }
.quick-entry { flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: all 0.15s; }
.quick-entry:active { background: var(--bg-card-2); }
.quick-entry-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; }
.quick-entry-icon.privacy { background: rgba(43,107,79,0.1); color: var(--success); }
.quick-entry-icon.setting { background: rgba(201,169,97,0.1); color: var(--primary-dim); }
.quick-entry-icon svg { width: 15px; height: 15px; }
.quick-entry-text { flex: 1; min-width: 0; }
.quick-entry-title { font-size: 12px; font-weight: 600; color: var(--text-1); margin-bottom: 1px; }
.quick-entry-desc { font-size: 10px; color: var(--text-3); }
.quick-entry-arrow { color: var(--text-4); flex: none; }
.quick-entry-arrow svg { width: 14px; height: 14px; }
</style>
</head>
<body>

  <div class="scroll" style="padding:12px 16px 100px;">

<script src="../../js/common.js"></script>

<script src="../../js/databus.js"></script>
<script>
(function(){
  function statusLabel(s){
    return { pending:'待回复', viewed:'企业已查看', interested:'企业感兴趣', rejected:'不合适' }[s] || '待回复';
  }
  function statusCls(s){ return 'status-' + (s || 'pending'); }
  function fmtTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var diff = now - d;
    if(diff < 60000) return '刚刚';
    if(diff < 3600000) return Math.floor(diff/60000) + '分钟前';
    if(diff < 86400000) return Math.floor(diff/3600000) + '小时前';
    if(diff < 604800000) return Math.floor(diff/86400000) + '天前';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function calcResumeProgress(){
    try {
      var auth = AuthStore.read();
      var profile = (auth.personalEntry && auth.personalEntry.profile) || {};
      var basic = profile.basic || {};
      var ji = profile.jobIntent || {};
      var total = 11, filled = 0;
      if (basic.name) filled++;
      if (basic.email) filled++;
      if (basic.location) filled++;
      if (ji.position) filled++;
      if (ji.salary) filled++;
      if ((profile.education || []).length) filled++;
      if ((profile.work || []).length) filled++;
      if ((profile.project || []).length) filled++;
      if ((profile.skills || []).length) filled++;
      if (profile.intro) filled++;
      if (profile.resumeFile) filled++;
      return Math.round(filled / total * 100);
    } catch(e) { return 0; }
  }
  function render(){
    var list = (window.ApplyStore ? ApplyStore.list() : []) || [];
    document.getElementById('apply-count').textContent = '共 ' + list.length + ' 条投递记录';

    /* 计算简历完成度 */
    var resumePct = calcResumeProgress();
    document.getElementById('rmc-pct').textContent = resumePct + '%';
    document.getElementById('rmc-fill').style.width = resumePct + '%';
    var rmcDesc = '';
    if (resumePct < 30) rmcDesc = '完善简历可提升投递成功率';
    else if (resumePct < 60) rmcDesc = '继续完善，简历更有竞争力';
    else if (resumePct < 90) rmcDesc = '简历已较完整，快去投递吧';
    else rmcDesc = '简历非常完整，投递成功率高';
    document.getElementById('rmc-desc').textContent = rmcDesc;

    var box = document.getElementById('apply-list');
    if(!list.length){
      box.innerHTML = '<div class="apply-empty">' +
        '<div class="apply-empty-icon"><svg class="ic"><use href="#i-file"/></svg></div>' +
        '<div class="fw-600 fs-15" style="color:var(--text-1);margin-bottom:6px;">暂无投递记录</div>' +
        '<div class="text-3 fs-12" style="margin-bottom:20px;">完成个人入驻后即可向心仪岗位投递简历</div>' +
        '<button class="btn btn-primary" style="display:inline-block;" onclick="location.href=\'../personnel/index.html\'">去找岗位</button>' +
      '</div>';
      return;
    }
    box.innerHTML = list.map(function(item){
      return '<div class="apply-item" onclick="location.href=\'../supply/detail.html?id=' + encodeURIComponent(item.jobId) + '\'">' +
        '<div class="apply-icon"><svg class="ic"><use href="#i-briefcase"/></svg></div>' +
        '<div class="apply-body">' +
          '<div class="apply-title">' + (item.jobTitle || '未知岗位') + '</div>' +
          '<div class="apply-company">' + (item.company || '未知企业') + '</div>' +
          '<div class="apply-meta">' +
            '<span>' + fmtTime(item.ts) + '</span>' +
            '<span class="apply-status ' + statusCls(item.status) + '">' + statusLabel(item.status) + '</span>' +
          '</div>' +
        '</div>' +
        '<svg class="ic" style="width:16px;height:16px;color:var(--text-3);flex:none;margin-top:12px;"><use href="#i-chev-r"/></svg>' +
      '</div>';
    }).join('');
  }
  render();
  window.addEventListener('engchain:apply', render);
  window.addEventListener('storage', function(e){ if(e.key === 'engchain-applies') render(); });
})();
</script>
