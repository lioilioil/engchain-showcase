<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>浏览历史 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M8%201.2%2013.2%203.3v4.1c0%203.1-2.2%205.5-5.2%206.4-3-.9-5.2-3.3-5.2-6.4V3.3L8%201.2Z%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.3%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%226.55%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3Cellipse%20cx%3D%229.45%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="../../css/state.css">
<style>
/* 浏览历史：对齐全站 A2 令牌（暖米白 + 墨主操作 + 金仅点缀） */
body, .phone { background: var(--bg); }

/* 导航栏 */
.vh-navbar {
  position: relative; z-index: 2; display: flex; align-items: center;
  justify-content: space-between; height: 50px; padding: 0 16px 0 4px; flex: 0 0 auto;
}
.vh-nav-back {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border: none; background: none; font-size: 22px; color: var(--text-1);
  cursor: pointer; border-radius: 50%; transition: background .2s;
}
.vh-nav-back:active { background: var(--primary-soft); }
.vh-nav-title {
  font-size: 16px; font-weight: 700; color: var(--text-1);
  position: absolute; left: 50%; transform: translateX(-50%);
}

/* 内容区 */
.vh-content {
  position: relative; z-index: 1; flex: 1; overflow-y: auto;
  padding: 4px 16px 40px; -webkit-overflow-scrolling: touch;
}

/* 日期分组标题 */
.vh-date-group {
  font-size: 12px; color: var(--text-3); font-weight: 600;
  margin: 16px 0 8px; padding-left: 2px; letter-spacing: .3px;
}
.vh-date-group:first-child { margin-top: 8px; }

/* 历史记录卡片 */
.vh-card {
  display: flex; align-items: center; gap: 12px; padding: 16px;
  border-radius: 14px; background: var(--bg-card); border: 1px solid var(--line);
  box-shadow: var(--shadow-card); margin-bottom: 8px; cursor: pointer;
  transition: transform .2s, box-shadow .2s; text-decoration: none;
}
.vh-card:active { transform: scale(.98); }
.vh-card-icon {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
  background: var(--primary-soft); display: flex; align-items: center; justify-content: center;
  color: var(--primary-dim);
}
.vh-card-icon svg { width: 22px; height: 22px; }
.vh-card-body { flex: 1; min-width: 0; }
.vh-card-title {
  font-size: 13.5px; font-weight: 600; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px;
}
.vh-card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); }
.vh-card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.vh-card-price { flex-shrink: 0; font-size: 14px; font-weight: 700; color: var(--primary-dim); }

/* 确认弹窗 */
.vh-confirm-overlay {
  position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.vh-confirm-overlay.show { opacity: 1; pointer-events: auto; }
.vh-confirm-box {
  width: 280px; border-radius: 16px; padding: 24px 20px 16px; text-align: center;
  background: var(--bg-card); border: 1px solid var(--line); box-shadow: var(--shadow-float);
  transform: scale(.9); transition: transform .2s;
}
.vh-confirm-overlay.show .vh-confirm-box { transform: scale(1); }
.vh-confirm-title { font-size: 16px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; }
.vh-confirm-desc { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 20px; }
.vh-confirm-btns { display: flex; gap: 10px; }
.vh-confirm-btn {
  flex: 1; height: 44px; border-radius: 11px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; transition: opacity .2s;
}
.vh-confirm-btn:active { opacity: .8; }
.vh-confirm-cancel { background: var(--bg-card-2); color: var(--text-2); border: 1px solid var(--line); }
.vh-confirm-ok { background: linear-gradient(180deg, var(--action), var(--action-deep)); color: var(--on-action); }
</style>
</head>
<body>
<div class="phone">
  <!-- 导航栏 -->
  <div class="vh-navbar">
    <button class="vh-nav-back" id="vh-back">‹</button>
    <div class="vh-nav-title">浏览历史</div>
    <button type="button" class="nav-text-btn" id="clear-btn">清除历史</button>
  </div>

  <!-- 内容区 -->
  <div class="vh-content" id="vh-content"></div>
</div>

<!-- 确认清除弹窗 -->
<div class="vh-confirm-overlay" id="confirm-overlay">
  <div class="vh-confirm-box">
    <div class="vh-confirm-title">清除浏览历史</div>
    <div class="vh-confirm-desc">确定要清除全部浏览历史吗？<br>此操作不可撤销。</div>
    <div class="vh-confirm-btns">
      <button class="vh-confirm-btn vh-confirm-cancel" id="confirm-cancel">取消</button>
      <button class="vh-confirm-btn vh-confirm-ok" id="confirm-ok">确定清除</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';

  var content = document.getElementById('vh-content');
  var clearBtn = document.getElementById('clear-btn');
  var backBtn = document.getElementById('vh-back');
  var confirmOverlay = document.getElementById('confirm-overlay');
  var confirmCancel = document.getElementById('confirm-cancel');
  var confirmOk = document.getElementById('confirm-ok');

  /* 分类图标映射 */
  var CAT_ICONS = {
    material: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    equipment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    labor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
    agency: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    franchise: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>',
    trade: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>',
    personnel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
  };

  /* 格式化时间为分组标签 */
  function formatDateGroup(ts) {
    var d = new Date(ts);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var itemDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diffDays = Math.floor((today - itemDay) / (24 * 60 * 60 * 1000));
    if (diffDays === 0) return '今天';
    if (diffDays === 1) return '昨天';
    if (diffDays <= 7) return diffDays + '天前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /* 格式化具体时间 */
  function formatTime(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var m = d.getMinutes();
    return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
  }

  /* 渲染历史列表 */
  function render() {
    var items = [];
    try { items = window.ViewHistory ? ViewHistory.list() : []; } catch (e) { items = []; }

    /* 清除按钮状态 */
    clearBtn.disabled = items.length === 0;

    if (items.length === 0) {
      content.innerHTML =
        '<div class="empty-state">' +
          '<div class="e-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>' +
          '<div class="e-title">暂无浏览记录</div>' +
          '<div class="e-desc">去发现页看看，找到你需要的建筑供需信息</div>' +
          '<div class="es-actions"><button class="btn" id="go-discover" style="background:linear-gradient(180deg,var(--action),var(--action-deep));color:var(--on-action);height:46px;padding:0 28px;border:none;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;">去发现</button></div>' +
        '</div>';
      var goBtn = document.getElementById('go-discover');
      if (goBtn) goBtn.addEventListener('click', function () {
        location.href = '../supply/list.html';
      });
      return;
    }

    /* 按日期分组 */
    var groups = {};
    items.forEach(function (it) {
      var g = formatDateGroup(it.viewedAt);
      if (!groups[g]) groups[g] = [];
      groups[g].push(it);
    });

    var html = '';
    Object.keys(groups).forEach(function (g) {
      html += '<div class="vh-date-group">' + g + '</div>';
      groups[g].forEach(function (it) {
        var icon = CAT_ICONS[it.bizKey] || CAT_ICONS.default;
        var price = it.price ? it.price : '面议';
        var metaParts = [];
        if (it.city) metaParts.push(it.city);
        if (it.cat) metaParts.push(it.cat);
        metaParts.push(formatTime(it.viewedAt));
        var meta = metaParts.join(' <span class="dot"></span> ');
        html +=
          '<a class="vh-card" href="../supply/detail.html?id=' + encodeURIComponent(it.id) + '">' +
            '<div class="vh-card-icon">' + icon + '</div>' +
            '<div class="vh-card-body">' +
              '<div class="vh-card-title">' + (it.title || '未命名条目') + '</div>' +
              '<div class="vh-card-meta">' + meta + '</div>' +
            '</div>' +
            '<div class="vh-card-price">' + price + '</div>' +
          '</a>';
      });
    });

    content.innerHTML = html;
  }

  /* 返回按钮 */
  backBtn.addEventListener('click', function () {
    /* P3-6：history.length>1 不可靠，改为同源 referrer 判断，无来源时兜底回个人中心 */
    if (document.referrer && document.referrer.indexOf(location.hostname) !== -1) {
      window.history.back();
    } else {
      location.href = 'index.html';
    }
  });

  /* 清除历史 - 确认弹窗 */
  clearBtn.addEventListener('click', function () {
    if (clearBtn.disabled) return;
    confirmOverlay.classList.add('show');
  });
  confirmCancel.addEventListener('click', function () {
    confirmOverlay.classList.remove('show');
  });
  confirmOk.addEventListener('click', function () {
    try { if (window.ViewHistory) ViewHistory.clear(); } catch (e) {}
    confirmOverlay.classList.remove('show');
    render();
  });
  confirmOverlay.addEventListener('click', function (e) {
    if (e.target === confirmOverlay) confirmOverlay.classList.remove('show');
  });

  /* 监听跨标签页历史变更 */
  window.addEventListener('engchain:view-history', function () { render(); });
  window.addEventListener('engchain:view-history-clear', function () { render(); });
  window.addEventListener('storage', function (e) {
    if (e.key === 'engchain-view-history') render();
  });

  render();
})();
</script>
</body>
</html>
