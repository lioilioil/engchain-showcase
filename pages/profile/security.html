<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>账号与安全 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">账号与安全</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:8px;">
    <div class="group-label">账号设置</div>
    <div class="group">
      <a class="row" href="edit-profile.html"><span class="label">头像与昵称</span><span class="value text-2">点击修改</span><span class="arrow">›</span></a>
      <div class="row"><span class="label">登录手机号</span><span class="value mono" id="sec-mobile">未绑定</span></div>
      <div class="row"><span class="label">登录密码</span><span class="value text-2">已设置</span></div>
      <div class="row"><span class="label">绑定微信</span><span class="value text-2">已绑定</span></div>
    </div>

    <div class="group-label">安全设置</div>
    <div class="group">
      <div class="row"><span class="label">支付密码</span><span class="value text-2">已设置</span></div>
      <div class="row"><span class="label">人脸识别</span><span class="value text-2">已开启</span></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="fw-600 fs-14" style="margin-bottom:6px;">账号保护</div>
      <div class="text-3 fs-12" style="line-height:1.7;">异地登录、密码修改、大额操作均会触发风控验证。更多安全建议，请拨打客服热线 400-888-6688。</div>
    </div>

    <div style="margin-top:16px;">
      <a href="../auth/login.html" class="btn btn-ghost" style="width:100%;color:var(--primary-dim);border-color:rgba(184,153,104,.38);background:rgba(184,153,104,.07);font-weight:600;">切换账号</a>
      <button type="button" class="btn btn-ghost" style="width:100%;margin-top:10px;color:var(--text-3);border-color:var(--line);background:transparent;font-weight:500;font-size:13px;" onclick="logout()">退出登录</button>
    </div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
/* [Auth 连通] 登录手机号从 realname.mobile 脱敏展示 */
(function(){
  try{
    if(!window.AuthStore||!AuthStore.read) return;
    var rn=(AuthStore.read()||{}).realname||{};
    var m=rn.mobile||'';
    var el=document.getElementById('sec-mobile');
    if(el) el.textContent = (m && m.length>=7) ? (m.slice(0,3)+'****'+m.slice(-4)) : '未绑定';
  }catch(e){}
})();
</script>
<script>window.__ROOT__='../../';window.logout=function(){if(!window.UI||!UI.dialog){location.href='../auth/login.html';return;}UI.dialog({title:'退出登录',text:'确定要退出当前账号？退出后需重新登录。',ok:'退出',cancel:'取消',danger:true,onOk:function(){try{if(window.DataBus&&DataBus.logout)DataBus.logout();else UI.state.set({loggedIn:false});}catch(e){}location.href='../auth/login.html';}});};</script>
</body>
</html>
