<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人资料 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">个人资料</div>
    <div class="nav-right"><button onclick="save()" style="color:var(--primary);font-size:14px;font-weight:600;">保存</button></div>
  </div>

  <div class="scroll" style="padding-top:8px;">
    <div style="display:flex;justify-content:center;padding:10px 0 20px;">
      <div style="width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--text-inv);" id="ed-avatar">陈</div>
    </div>

    <div class="field"><label class="field-label">昵称</label><input class="input" id="ed-name" value="陈建国"></div>
    <div class="field"><label class="field-label">真实姓名</label><input class="input" value="陈建国" readonly style="opacity:.6;"></div>
    <div class="field"><label class="field-label">公司/机构</label><input class="input" id="ed-company" value="四川省××建设有限公司"></div>
    <div class="field"><label class="field-label">所在地区</label><input class="input" id="ed-region" value="四川省 · 成都市 · 天府新区"></div>
    <div class="field"><label class="field-label">个人简介</label><textarea class="textarea" id="ed-bio">深耕建筑行业 12 年，专注房建与市政工程物资采购与劳务对接。</textarea></div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script>
(function(){
  window.__ROOT__ = '../../';
  /* 从 localStorage 预填资料；保存时写回 engchain-state，与个人中心头部（头像/昵称/公司）联动 */
  var st; try { st = UI.state.get(); } catch (e) { st = {}; }
  var user = st.user || '陈建国';
  document.getElementById('ed-avatar').textContent = user.charAt(0);
  document.getElementById('ed-name').value = user;
  if (st.company) document.getElementById('ed-company').value = st.company;
  if (st.region) document.getElementById('ed-region').value = st.region;
  if (st.bio) document.getElementById('ed-bio').value = st.bio;

  window.save = function () {
    var name = document.getElementById('ed-name').value.trim() || '陈建国';
    var company = document.getElementById('ed-company').value.trim();
    var region = document.getElementById('ed-region').value.trim();
    var bio = document.getElementById('ed-bio').value.trim();
    document.getElementById('ed-avatar').textContent = name.charAt(0);
    try { UI.state.set({ user: name, company: company, region: region, bio: bio }); } catch (e) {}
    UI.toast('已保存', 'ok');
    setTimeout(function () { history.back(); }, 700);
  };
})();
</script>
</body>
</html>
