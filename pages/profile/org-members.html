<title>企业成员管理 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
/* ===== 企业成员管理 ===== */
.om-comp { background:var(--bg-card); border:1px solid var(--line); border-radius:16px; margin:14px; padding:16px; }
.om-comp-name { font-size:16px; font-weight:800; color:var(--text-1); display:flex; align-items:center; gap:6px; }
.om-verified { flex:none; font-size:9px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-dim)); padding:2px 7px; border-radius:999px; letter-spacing:.5px; }
.om-comp-meta { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:11px; color:var(--text-3); }
.om-comp-meta b { color:var(--text-2); font-weight:600; }
.om-cap { margin-top:12px; padding-top:11px; border-top:1px dashed var(--line); display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-3); }
.om-cap-bar { flex:1; height:5px; border-radius:999px; background:var(--bg-card-2); overflow:hidden; }
.om-cap-fill { height:100%; background:linear-gradient(90deg,var(--primary-strong),var(--primary)); }

.om-sec { display:flex; align-items:center; gap:6px; margin:18px 16px 10px; }
.om-sec svg { width:14px; height:14px; color:var(--primary); flex:none; }
.om-sec b { font-size:13px; color:var(--text-1); }
.om-sec span { font-size:11px; color:var(--text-3); margin-left:auto; }
.om-sec .om-badge { min-width:16px; height:16px; padding:0 5px; border-radius:999px; background:var(--error); color:#fff; font-size:9.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }

.pending-card { background:var(--bg-card); border:1px solid rgba(201,169,97,.3); border-radius:14px; margin:0 14px 10px; padding:13px 14px; }
.pc-top { display:flex; align-items:center; gap:10px; }
.pc-ava { flex:none; width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#E8D9B5,#C9A961); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
.pc-info { flex:1; min-width:0; }
.pc-name { font-size:13.5px; font-weight:700; color:var(--text-1); }
.pc-note { font-size:11px; color:var(--text-3); margin-top:2px; line-height:1.45; }
.pc-acts { display:flex; gap:8px; margin-top:11px; }
.pc-btn { flex:1; padding:8px 0; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; border:none; }
.pc-btn.ok { background:linear-gradient(135deg,var(--primary),var(--primary-dim)); color:var(--text-inv); }
.pc-btn.no { background:var(--bg-card-2); color:var(--text-2); border:1px solid var(--line); }

.member-card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; margin:0 14px 10px; padding:13px 14px; display:flex; align-items:center; gap:11px; }
.mc-ava { flex:none; width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#E8D9B5,#C9A961); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:16px; }
.mc-info { flex:1; min-width:0; }
.mc-name { font-size:14px; font-weight:700; color:var(--text-1); display:flex; align-items:center; gap:6px; }
.mc-time { font-size:10.5px; color:var(--text-3); margin-top:2px; }
.role-tag { flex:none; font-size:9.5px; font-weight:700; padding:2.5px 8px; border-radius:999px; }
.role-owner { background:rgba(184,153,104,.15); color:var(--primary-dim); border:1px solid rgba(184,153,104,.35); }
.role-admin { background:rgba(37,99,235,.1); color:var(--blue); }
.role-member { background:var(--bg-card-2); color:var(--text-3); border:1px solid var(--line); }
.mc-remove { flex:none; font-size:11.5px; font-weight:600; color:var(--error); padding:6px 12px; border-radius:999px; border:1px solid rgba(200,60,60,.3); cursor:pointer; background:transparent; }
.mc-remove:active { transform:scale(.95); }
.mc-self { flex:none; font-size:10.5px; color:var(--text-3); }

.om-empty { text-align:center; color:var(--text-3); font-size:12px; padding:26px 20px; background:var(--bg-card); border:1px dashed var(--line); border-radius:14px; margin:0 14px 10px; line-height:1.6; }

/* 邀请 sheet 候选人 */
.cand { display:flex; align-items:center; gap:11px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
.cand:last-child { border-bottom:none; }
.cand:active { background:var(--bg-card-2); }
.cand-ava { flex:none; width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#E8D9B5,#C9A961); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
.cand-info { flex:1; min-width:0; }
.cand-name { font-size:14px; font-weight:700; color:var(--text-1); }
.cand-sub { font-size:10.5px; color:var(--text-3); margin-top:2px; }
.cand-check { flex:none; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; }
.cand.sel .cand-check { background:var(--primary); border-color:var(--primary); }
.cand.sel .cand-check svg { display:block; }
.cand-check svg { display:none; width:13px; height:13px; color:#fff; }
.role-pick { display:flex; gap:8px; margin:14px 4px 6px; }
.role-opt { flex:1; text-align:center; padding:9px 0; border-radius:12px; border:1px solid var(--line); background:var(--bg-card-2); font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; }
.role-opt.sel { border-color:var(--primary); background:rgba(184,153,104,.1); color:var(--primary-dim); }

/* ===== 新增：手机号邀请 / 移交 / 退出 / 企业主验证 ===== */
.inv-tabs { display:flex; gap:6px; margin:2px 0 12px; background:var(--bg-card-2); border-radius:12px; padding:4px; }
.inv-tab { flex:1; text-align:center; padding:8px 0; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--text-3); cursor:pointer; }
.inv-tab.on { background:var(--bg-card); color:var(--primary-dim); box-shadow:var(--shadow-xs); }
.mob-row { display:flex; align-items:center; gap:8px; }
.mob-input { flex:1; height:42px; border:1.5px solid var(--line-strong); border-radius:12px; padding:0 12px; font-size:14px; outline:none; letter-spacing:.03em; background:var(--bg-card); color:var(--text-1); }
.mob-input:focus { border-color:var(--primary); }
.mob-tip { font-size:10.5px; color:var(--text-3); line-height:1.65; margin:8px 2px 10px; }
.mob-tip b { color:var(--primary-dim); }

.tr-card { background:var(--bg-card); border:1px solid rgba(184,153,104,.4); border-radius:14px; margin:0 14px 10px; padding:13px 14px; }
.tr-card.blue { border-color:rgba(37,99,235,.35); }
.tr-head { display:flex; align-items:center; gap:9px; }
.tr-ic { flex:none; width:34px; height:34px; border-radius:10px; background:rgba(184,153,104,.14); color:var(--primary-dim); display:flex; align-items:center; justify-content:center; }
.tr-ic.blue { background:rgba(37,99,235,.1); color:var(--blue); }
.tr-ic svg { width:16px; height:16px; }
.tr-info { flex:1; min-width:0; }
.tr-title { font-size:13px; font-weight:700; color:var(--text-1); }
.tr-sub { font-size:11px; color:var(--text-3); margin-top:2px; line-height:1.5; }
.tr-acts { display:flex; gap:8px; margin-top:11px; }
.tr-btn { flex:1; padding:9px 0; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; border:none; }
.tr-btn.ok { background:linear-gradient(135deg,var(--primary),var(--primary-dim)); color:var(--text-inv); }
.tr-btn.no { background:var(--bg-card-2); color:var(--text-2); border:1px solid var(--line); }
.tr-btn.ghost { background:transparent; color:var(--primary-dim); border:1px solid var(--accent-line); }

.mc-leave { flex:none; font-size:11.5px; font-weight:600; color:var(--text-2); padding:6px 12px; border-radius:999px; border:1px solid var(--line); cursor:pointer; background:transparent; }
.mc-transfer { flex:none; font-size:11.5px; font-weight:600; color:var(--primary-dim); padding:6px 12px; border-radius:999px; border:1px solid var(--accent-line); cursor:pointer; background:rgba(184,153,104,.08); }

.vf-opt { display:flex; align-items:center; gap:8px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; background:var(--bg-card-2); }
.vf-opt.sel { border-color:var(--primary); background:rgba(184,153,104,.08); }
.vf-opt-dot { flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; }
.vf-opt.sel .vf-opt-dot { border-color:var(--primary); }
.vf-opt.sel .vf-opt-dot::after { content:""; width:8px; height:8px; border-radius:50%; background:var(--primary); }
.vf-opt-meta { flex:1; min-width:0; }
.vf-opt-t { font-size:12.5px; font-weight:700; color:var(--text-1); }
.vf-opt-s { font-size:10.5px; color:var(--text-3); margin-top:1px; }
.vf-field { margin:10px 2px; }
.vf-field label { display:block; font-size:11px; color:var(--text-3); margin-bottom:5px; }
.vf-field input { width:100%; height:42px; border:1.5px solid var(--line-strong); border-radius:12px; padding:0 12px; font-size:14px; outline:none; background:var(--bg-card); color:var(--text-1); }
.vf-field input:focus { border-color:var(--primary); }
.vf-check { display:flex; align-items:center; gap:8px; padding:4px 2px; font-size:11.5px; color:var(--text-2); }
.vf-check input { width:16px; height:16px; accent-color:var(--primary); }

/* ===== 新增：成员搜索 / 首字母索引 / 企业主栏目 / 邀请卡片 ===== */
.om-search { display:flex; align-items:center; gap:8px; margin:0 14px 10px; padding:0 12px; height:40px; border:1.5px solid var(--line); border-radius:999px; background:var(--bg-card); }
.om-search svg { width:15px; height:15px; color:var(--text-3); flex:none; }
.om-search input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:13px; color:var(--text-1); }
.om-search input::placeholder { color:var(--text-3); }

.om-member-wrap { display:flex; gap:2px; padding:0 14px 0 4px; }
.om-groups { flex:1; min-width:0; }
.om-groups .om-empty { margin:0 0 10px; }
.om-azbar { flex:none; width:20px; display:flex; flex-direction:column; align-items:center; gap:2px; position:sticky; top:64px; height:calc(100dvh - 150px); min-height:120px; justify-content:center; }
.om-az { width:18px; height:18px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--text-3); cursor:pointer; }
.om-az.on { background:var(--primary); color:var(--text-inv); }
.om-az:active { transform:scale(.92); }
.om-letter-head { display:flex; align-items:center; gap:6px; margin:2px 14px 6px; font-size:11px; font-weight:800; color:var(--primary-dim); letter-spacing:.06em; scroll-margin-top:110px; }
.om-letter-head::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

.om-owner-card { margin:0 14px 10px; border-radius:14px; border:1.5px solid rgba(184,153,104,.45); background:linear-gradient(180deg,rgba(184,153,104,.08),transparent); overflow:hidden; }
.om-owner-inner { display:flex; align-items:center; gap:11px; padding:13px 14px; }
.om-owner-empty { text-align:center; padding:20px 16px; }
.oe-t { font-size:13px; font-weight:700; color:var(--text-2); }
.oe-s { font-size:11px; color:var(--text-3); margin:4px 0 12px; line-height:1.6; }
.om-owner-inv { display:flex; align-items:center; gap:11px; padding:13px 14px; }
.oi-info { flex:1; min-width:0; }
.oi-name { font-size:14px; font-weight:700; color:var(--text-1); display:flex; align-items:center; gap:6px; }
.oi-sub { font-size:10.5px; color:var(--text-3); margin-top:3px; line-height:1.5; }
.oi-acts { display:flex; gap:7px; flex:none; }
.oi-btn { font-size:11px; font-weight:700; padding:6px 11px; border-radius:999px; border:1px solid var(--accent-line); color:var(--primary-dim); background:rgba(184,153,104,.08); cursor:pointer; }
.oi-btn:active { transform:scale(.95); }
.oi-btn.off { color:var(--text-3); background:var(--bg-card-2); border-color:var(--line); cursor:default; }
.oi-btn.ghost { color:var(--text-2); background:var(--bg-card-2); border-color:var(--line); }
.inv-tag { flex:none; font-size:9.5px; font-weight:700; color:var(--primary-dim); background:rgba(184,153,104,.12); border:1px solid rgba(184,153,104,.35); padding:2.5px 8px; border-radius:999px; }

.om-detect { margin:8px 2px 0; font-size:11px; line-height:1.5; }
.om-detect.ok { color:#2E9E5B; }
.om-detect.warn { color:#B7791F; }
.om-users-head { display:flex; align-items:center; gap:8px; margin:2px 2px 6px; }
.om-users-head span:first-child { font-size:11px; color:var(--text-3); flex:1; }
.om-sel-count { font-size:11px; font-weight:700; color:var(--primary-dim); }
.role-opt.disabled { opacity:.45; cursor:not-allowed; }
</style>
</head>

<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>

    <div class="nav-right">
      <button class="icon-btn" id="om-invite-btn" aria-label="邀请成员"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
  </div>
  <div class="scroll no-pad" style="padding-bottom:120px;">
    <div id="om-root"></div>
  </div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/orgs.js"></script>
<script>
(function () {
  var root = document.getElementById('om-root');
  var ROLE_LABEL = { owner: '企业主', admin: '管理员', member: '成员' };

  function me() { try { return window.DataBus && DataBus.current(); } catch (e) { return null; } }
  function qs(name) { var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

  /* 确定当前企业：URL 指定 > 当前代表企业 > 第一个成员身份的企业。
     普通成员也可进入（自助退出 / 接收移交验证）；管理操作仍按角色校验。 */
  function resolveOrg() {
    var u = me(); if (!u || !window.OrgsStore) return null;
    var byUrl = qs('orgId');
    if (byUrl) {
      var m = OrgsStore.membershipOf(u.id, byUrl);
      if (m) return m.org;
    }
    var cur = OrgsStore.currentMembership();
    if (cur) return cur.org;
    var list = OrgsStore.orgsOf(u.id);
    if (list.length) return list[0].org;
    return null;
  }

  function esc(s) { return window.UI && UI.esc ? UI.esc(s) : String(s); }
  function fmtDate(ts) { if (!ts) return ''; var d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日加入'; }
  function fmtTime(ts) { if (!ts) return ''; var d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function renderGate(text) {
    root.innerHTML =
      '<div class="om-empty" style="margin-top:60px;">' +
        (text || '你当前不是任何企业的管理员。<br>企业主/管理员可邀请员工、管理成员与审批加入申请。') +
      '</div>';
  }

  function render() {
    var org = resolveOrg();
    var u = me();
    if (!u) { renderGate('请先登录'); return; }
    if (!org) { renderGate(); document.getElementById('om-invite-btn').style.display = 'none'; return; }
    document.getElementById('om-invite-btn').style.display = '';

    var myRole = OrgsStore.myRole(org.orgId);
    var isOwner = myRole === 'owner';
    var isManager = isOwner || myRole === 'admin';
    document.getElementById('om-invite-btn').style.display = isManager ? '' : 'none';
    var members = OrgsStore.members(org.orgId);
    var cap = org.memberLimit || OrgsStore.MEMBER_LIMIT;
    var used = OrgsStore.memberCount(org);
    var joins = OrgsStore.pendingJoins(org.orgId);
    var confirms = OrgsStore.ownerConfirmingTransfers(org.orgId);
    var myTransfer = OrgsStore.pendingTransferForUser(org, u.id);
    var typeLabel = (org.entryTypes && org.entryTypes[0] === 'construction') ? '建筑入驻' : (org.entStatus === 'resident' ? '企业入驻' : '企业认证');

    var html = '';

    /* 企业信息卡 */
    html +=
      '<div class="om-comp">' +
        '<div class="om-comp-name">' + esc(org.shortName || org.co) + ' <span class="om-verified">已认证</span></div>' +
        '<div class="om-comp-meta">' +
          '<span>统一社会信用代码 <b>' + esc(org.code || '—') + '</b></span>' +
          '<span>法定代表人 <b>' + esc(org.legal || '—') + '</b></span>' +
          '<span>类型 <b>' + typeLabel + '</b></span>' +
        '</div>' +
        '<div class="om-cap">' +
          '<span>成员 ' + used + '/' + cap + '</span>' +
          '<div class="om-cap-bar"><div class="om-cap-fill" style="width:' + Math.min(100, used / cap * 100) + '%;"></div></div>' +
        '</div>' +
      '</div>';

    /* 待审批加入申请（仅企业主/管理员可见） */
    if (joins.length && isManager) {
      html += '<div class="om-sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg><b>待审批申请</b><span class="om-badge">' + joins.length + '</span></div>';
      joins.forEach(function (j) {
        html +=
          '<div class="pending-card">' +
            '<div class="pc-top">' +
              '<div class="pc-ava">' + esc((j.name || '?').charAt(0)) + '</div>' +
              '<div class="pc-info"><div class="pc-name">' + esc(j.name) + '</div>' +
              '<div class="pc-note">' + (j.note ? esc(j.note) : '申请加入本企业号') + '</div></div>' +
            '</div>' +
            '<div class="pc-acts">' +
              '<button class="pc-btn ok" onclick="omApprove(\'' + j.joinId + '\')">通过</button>' +
              '<button class="pc-btn no" onclick="omReject(\'' + j.joinId + '\')">驳回</button>' +
            '</div>' +
          '</div>';
      });
    }

    /* 移交：企业主待确认（管理员发起的移交） */
    confirms.forEach(function (t) {
      var fromU = (window.DataBus && DataBus.byId) ? DataBus.byId(t.fromUid) : null;
      var toU = (window.DataBus && DataBus.byId) ? DataBus.byId(t.toUid) : null;
      html +=
        '<div class="tr-card blue">' +
          '<div class="tr-head">' +
            '<div class="tr-ic blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>' +
            '<div class="tr-info"><div class="tr-title">企业主移交待确认</div>' +
            '<div class="tr-sub">' + esc(fromU ? fromU.name : t.fromUid) + ' 申请将企业主身份移交给 ' + esc(toU ? toU.name : t.toUid) + '，确认后对方需完成法人认证或实际控制人验证，并由后台审核。</div></div>' +
          '</div>' +
          '<div class="tr-acts">' +
            '<button class="tr-btn ok" onclick="omConfirmTransfer(\'' + t.id + '\')">确认移交</button>' +
            '<button class="tr-btn no" onclick="omRejectTransfer(\'' + t.id + '\')">驳回</button>' +
          '</div>' +
        '</div>';
    });

    /* 移交：当前用户为接收人 */

    /* 企业主栏目：企业主成员 / 邀请入驻 / 空缺空态 */

  /* ============ 邀请：手机号邀请（姓名+三身份+注册识别）+ 已认证用户多选 ============ */
  var lastSheetRef = null;
  var omSearchKw = '';

  /* ---- 中文姓名 → 拼音首字母（锚字二分 + 常用字表兜底，未知归 #） ---- */
  var PY_MAP = { '陈':'C','李':'L','王':'W','张':'Z','赵':'Z','刘':'L','周':'Z','吴':'W','郑':'Z','川':'C','诚':'C','成':'C','建':'J','国':'G','强':'Q','敏':'M','磊':'L','洋':'Y','航':'H','雅':'Y','罗':'L','军':'J','科':'K','技':'J','设':'S','有':'Y','限':'X','公':'G','司':'S','家':'J','安':'A','智':'Z','慧':'H','宏':'H','达':'D','鑫':'X','源':'Y','宇':'Y','晨':'C','曦':'X','涛':'T','波':'B','鹏':'P','飞':'F','云':'Y','松':'S','梅':'M','兰':'L','竹':'Z','菊':'J','杰':'J','俊':'J','峰':'F','伟':'W','芳':'F','艳':'Y','静':'J','丽':'L','娟':'J','秀':'X','明':'M','亮':'L','刚':'G','勇':'Y','志':'Z','荣':'R','华':'H','富':'F','贵':'G','金':'J','银':'Y','德':'D','福':'F','春':'C','夏':'X','秋':'Q','冬':'D','新':'X','中':'Z','大':'D','小':'X','永':'Y','光':'G','辉':'H','玉':'Y','珍':'Z','红':'H','平':'P','文':'W','武':'W','超':'C','龙':'L','虎':'H','马':'M','牛':'N','杨':'Y','黄':'H','徐':'X','朱':'Z','孙':'S','胡':'H','郭':'G','何':'H','高':'G','林':'L','郑':'Z','程':'C','范':'F','石':'S','姚':'Y','谭':'T','廖':'L','邹':'Z','熊':'X','金':'J','陆':'L','郝':'H','孔':'K','白':'B','崔':'C','康':'K','毛':'M','邱':'Q','秦':'Q','江':'J','史':'S','顾':'G','侯':'H','邵':'S','孟':'M','龙':'L','万':'W','段':'D','雷':'L','钱':'Q','汤':'T','尹':'Y','黎':'L','易':'Y','常':'C','武':'W','乔':'Q','贺':'H','赖':'L','龚':'G','文':'W' };
  var PY_ANCHORS = ['啊','芭','擦','搭','蛾','发','噶','哈','击','喀','垃','妈','拿','哦','啪','期','然','撒','塌','挖','昔','压','匝'];
  var PY_LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','Q','R','S','T','W','X','Y','Z'];
  function pyInitial(name) {
    var ch = String(name || '').trim().charAt(0);
    if (!ch) return '#';
    var c = ch.charCodeAt(0);
    if (c >= 65 && c <= 90) return ch;
    if (c >= 97 && c <= 122) return ch.toUpperCase();
    if (c < 0x4E00 || c > 0x9FFF) return '#';
    if (PY_MAP[ch]) return PY_MAP[ch];
    var idx = -1;
    for (var i = 0; i < PY_ANCHORS.length; i++) {
      try { if (ch.localeCompare(PY_ANCHORS[i], 'zh-CN') >= 0) idx = i; else break; } catch (e) { break; }
    }
    return idx >= 0 ? PY_LETTERS[idx] : '#';
  }
  function maskMobile(m) { return String(m || '').replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2'); }
  function roleOptHtml(role, label) {
    return '<div class="role-opt" data-role="' + role + '" onclick="omPickRole(this)">' + label + '</div>';
  }

  window.openInvite = openInvite;
  function openInvite(fromOwnerEmpty) {
    var org = resolveOrg(); if (!org) return;
    if (OrgsStore.memberCount(org) >= (org.memberLimit || OrgsStore.MEMBER_LIMIT)) { UI.toast.warn('成员数已达上限，如需扩容请联系平台'); return; }
    var sh = UI.sheet();
    lastSheetRef = sh;
    sh.setText('邀请成员加入「' + (org.shortName || org.co) + '」');
    sh._selRole = fromOwnerEmpty ? 'owner' : 'member';
    sh._selUids = []; sh._detected = null; sh._tab = 'mobile';
    sh._invName = ''; sh._invMobile = '';
    sh.html(invShellHtml());
    sh.show();
    bindInvEvents();
    setInvRole(sh._selRole);
  }

  function invShellHtml() {
    var org = resolveOrg(); if (!org) return '';
    var hasOwn = OrgsStore.hasOwner(org.orgId);
    var ownerOpt = hasOwn
      ? '<div class="role-opt disabled" data-role="owner" onclick="UI.toast.warn(\'该企业已有企业主\')">企业主</div>'
      : roleOptHtml('owner', '企业主');
    return '' +
      '<div class="inv-tabs">' +
        '<div class="inv-tab on" data-tab="mobile" onclick="omInvTab(this)">手机号邀请</div>' +
        '<div class="inv-tab" data-tab="users" onclick="omInvTab(this)">从已认证用户选择</div>' +
      '</div>' +
      '<div id="inv-pane-mobile">' +
        '<div class="vf-field"><label>被邀请人姓名</label><input id="om-name" class="mob-input" placeholder="请输入姓名（必填）"></div>' +
        '<div class="mob-row"><input class="mob-input" id="om-mobile" type="tel" inputmode="numeric" maxlength="11" placeholder="输入 11 位手机号"></div>' +
        '<div id="om-detect" class="om-detect"></div>' +
        '<div class="mob-tip">输入手机号后自动识别注册状态：<b>已注册</b> → 弹出确认邀请；<b>未注册</b> → 直接发送注册邀请短信。<br>短信邀请 1 天 1 次。</div>' +
      '</div>' +
      '<div id="inv-pane-users" style="display:none;">' +
        '<div class="om-users-head"><span>从平台已实名认证用户中选择邀请对象（可多选）</span><span class="om-sel-count" id="om-sel-count">已选 0 人</span></div>' +
        '<div id="inv-user-list" style="max-height:34vh;overflow-y:auto;padding:2px;"></div>' +
      '</div>' +
      '<div class="role-pick" id="om-inv-rolepick">' +
        '<div class="role-opt" data-role="member" onclick="omPickRole(this)">成员</div>' +
        '<div class="role-opt" data-role="admin" onclick="omPickRole(this)">管理员</div>' +
        ownerOpt +
      '</div>' +
      '<button type="button" id="om-send" class="btn btn-primary" style="width:100%;height:48px;border-radius:999px;margin-top:6px;">发送邀请</button>';
  }

  function setInvRole(role) {
    var pick = document.getElementById('om-inv-rolepick');
    if (pick) pick.querySelectorAll('.role-opt').forEach(function (r) {
      r.classList.toggle('sel', r.getAttribute('data-role') === role && !r.classList.contains('disabled'));
    });
    var sh = lastSheetRef; if (sh) sh._selRole = role;
    omRefreshSelCount();
  }

  function bindInvEvents() {
    var org = resolveOrg(); if (!org) return;
    var sh = lastSheetRef;
    var nameEl = document.getElementById('om-name');
    var mobEl = document.getElementById('om-mobile');
    if (nameEl) nameEl.value = (sh && sh._invName) || '';
    if (mobEl) {
      mobEl.value = (sh && sh._invMobile) || '';
      mobEl.addEventListener('input', omDetectMobile);
      mobEl.addEventListener('blur', omDetectMobile);
      mobEl.addEventListener('change', omDetectMobile);
    }

    /* 已认证用户候选：多选 + 脱敏手机号 */
    var all = (window.DataBus && DataBus.users) ? DataBus.users() : [];
    var cands = [];
    all.forEach(function (c) {
      if (!c) return;
      var real = c.auth && c.auth.realname && c.auth.realname.ok;
      if (!real) return;
      if (OrgsStore.membershipOf(c.id, org.orgId)) return;
      var hasInv = (org.invites || []).some(function (iv) { return iv.targetUid === c.id && iv.status === 'pending'; });
      if (hasInv) return;
      cands.push(c);
    });
    var listEl = document.getElementById('inv-user-list');
    if (listEl) {
      listEl.innerHTML = cands.length ? cands.map(function (c) {
        var selCls = (sh && sh._selUids && sh._selUids.indexOf(c.id) > -1) ? ' sel' : '';
        return '<div class="cand' + selCls + '" data-uid="' + c.id + '" onclick="omPickCand(this)">' +
          '<div class="cand-ava">' + esc((c.avatar || c.name || '?').charAt(0)) + '</div>' +
          '<div class="cand-info"><div class="cand-name">' + esc(c.name) + ' <span class="role-tag role-member" style="font-size:9px;">已实名</span></div>' +
          '<div class="cand-sub">' + esc(maskMobile(c.mobile || '')) + (c.tag ? ' · ' + esc(c.tag) : '') + '</div></div>' +
          '<div class="cand-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>' +
        '</div>';
      }).join('') : '<div class="om-empty" style="margin:6px 0;">暂无可邀请的实名用户。<br>员工需先完成实名认证，再由企业邀请。</div>';
    }
    var sendBtn = document.getElementById('om-send');
    if (sendBtn) sendBtn.onclick = function () {
      var cur = lastSheetRef;
      if (cur && cur._tab === 'users') omSubmitUsers(); else omSubmitMobile();
    };
    omRefreshSelCount();
  }

  function omRefreshSelCount() {
    var sh = lastSheetRef;
    var el = document.getElementById('om-sel-count');
    if (el) el.textContent = '已选 ' + ((sh && sh._selUids) ? sh._selUids.length : 0) + ' 人';
  }

  /* 手机号输入即识别注册状态 */
  function omDetectMobile() {
    var sh = lastSheetRef; if (!sh) return;
    var inp = document.getElementById('om-mobile');
    var box = document.getElementById('om-detect');
    var v = inp ? inp.value.replace(/\s+/g, '') : '';
    if (!/^1\d{10}$/.test(v)) { if (box) box.innerHTML = ''; sh._detected = null; return; }
    var t = (window.DataBus && DataBus.byMobile) ? DataBus.byMobile(v) : null;
    sh._detected = t || null;
    if (box) {
      if (t) {
        var real = !!(t.auth && t.auth.realname && t.auth.realname.ok);
        box.innerHTML = '<span class="om-detect ok">已注册：' + esc(t.name) + '（' + esc(maskMobile(t.mobile || '')) + '）' + (real ? ' · 已实名认证' : ' · 未实名') + '</span>';
      } else {
        box.innerHTML = '<span class="om-detect warn">该手机号未注册，将发送注册邀请短信</span>';
      }
    }
  }

  /* 手机号邀请提交：已注册 → 确认邀请弹窗；未注册 → 直接发短信 */
  function omSubmitMobile() {
    var sh = lastSheetRef; var org = resolveOrg(); if (!sh || !org) return;
    var nameEl = document.getElementById('om-name');
    var inp = document.getElementById('om-mobile');
    var name = nameEl ? nameEl.value.trim() : '';
    var mobile = inp ? inp.value.replace(/\s+/g, '') : '';
    var role = sh._selRole || 'member';
    if (!name) { UI.toast.warn('请填写被邀请人姓名'); return; }
    if (!/^1\d{10}$/.test(mobile)) { UI.toast.warn('请输入正确的 11 位手机号'); return; }
    var orgName = org.shortName || org.co;
    var doSend = function () {
      var r = OrgsStore.inviteByMobile(org.orgId, mobile, role, name);
      if (r && r.error) { UI.toast.err(r.error); return; }
      UI.closeSheet();
      if (r.case === 'verified') UI.toast.ok('已发送邀请：短信+站内消息已提醒 ' + r.name + '（' + r.sms + '）');
      else if (r.case === 'unverified') UI.toast.warn('该手机号已注册未实名，已发送短信邀请引导认证');
      else UI.toast.ok('该手机号未注册，已发送注册邀请短信');
      render();
    };
    if (sh._detected) {
      UI.dialog({
        title: '确认邀请',
        text: '已注册用户 <b>' + esc(sh._detected.name) + '</b>（' + esc(maskMobile(sh._detected.mobile || '')) + '）将收到邀请短信，邀请其加入「' + esc(orgName) + '」担任<b>' + (ROLE_LABEL[role] || '成员') + '</b>。确认发送？',
        ok: '确认发送', cancel: '再想想',
        onOk: doSend
      });
    } else {
      doSend();
    }
  }

  /* 已认证用户多选提交 */
  function omSubmitUsers() {
    var sh = lastSheetRef; var org = resolveOrg(); if (!sh || !org) return;
    var role = sh._selRole || 'member';
    var uids = sh._selUids || [];
    if (!uids.length) { UI.toast.warn('请先选择要邀请的用户'); return; }
    var okN = 0, errs = [];
    uids.forEach(function (uid) {
      var r = OrgsStore.invite(org.orgId, uid, role);
      if (r && r.error) errs.push(r.error); else okN++;
    });
    UI.closeSheet();
    if (okN) UI.toast.ok('已发送 ' + okN + ' 条邀请' + (errs.length ? '，' + errs.length + ' 条未成功' : ''));
    if (errs.length && !okN) UI.toast.err(errs[0]);
    render();
  }

  /* 企业主邀请卡：补发短信（1 天 1 次，超限置灰） */
  window.omSendInviteSms = function (inviteId) {
    var org = resolveOrg(); if (!org) return;
    var r = OrgsStore.sendInviteSms(org.orgId, inviteId);
    if (r && r.error) { UI.toast.err(r.error); return; }
    UI.toast.ok('邀请短信已发送（' + r.sms + '）');
    render();
  };

  /* 企业主邀请卡：修改邀请（姓名 / 手机号 / 身份） */
  window.omOpenEditInvite = function (inviteId) {
    var org = resolveOrg(); if (!org) return;
    var inv = null;
    (org.invites || []).forEach(function (iv) { if (iv.inviteId === inviteId) inv = iv; });
    if (!inv) { UI.toast.warn('邀请不存在'); return; }
    var sh = UI.sheet();
    lastSheetRef = sh;
    sh.setText('修改邀请 · ' + (org.shortName || org.co));
    var hasOwn = OrgsStore.hasOwner(org.orgId);
    var ownerOpt = hasOwn
      ? '<div class="role-opt disabled" data-role="owner" onclick="UI.toast.warn(\'该企业已有企业主\')">企业主</div>'
      : roleOptHtml('owner', '企业主');
    sh.html(
      '<div style="padding:2px 2px 4px;">' +
        '<div class="vf-field"><label>被邀请人姓名</label><input id="ed-name" class="mob-input" placeholder="请输入姓名"></div>' +
        '<div class="vf-field"><label>手机号</label><input id="ed-mobile" class="mob-input" type="tel" inputmode="numeric" maxlength="11" placeholder="输入 11 位手机号"></div>' +
        '<div class="role-pick" id="om-edit-rolepick">' +
          roleOptHtml('member', '成员') + roleOptHtml('admin', '管理员') + ownerOpt +
        '</div>' +
        '<button type="button" id="ed-save" class="btn btn-primary" style="width:100%;height:48px;border-radius:999px;margin-top:10px;">保存修改</button>' +
      '</div>'
    );
    sh.show();
    sh._selRole = inv.role || 'member';
    document.getElementById('ed-name').value = inv.name || '';
    document.getElementById('ed-mobile').value = inv.mobileRaw || '';
    var pick = document.getElementById('om-edit-rolepick');
    if (pick) pick.querySelectorAll('.role-opt').forEach(function (r) {
      r.classList.toggle('sel', r.getAttribute('data-role') === sh._selRole && !r.classList.contains('disabled'));
    });
    document.getElementById('ed-save').onclick = function () {
      var name = document.getElementById('ed-name').value.trim();
      var mobile = document.getElementById('ed-mobile').value.replace(/\s+/g, '');
      var role = sh._selRole || inv.role;
      if (!name) { UI.toast.warn('请填写姓名'); return; }
      if (!/^1\d{10}$/.test(mobile)) { UI.toast.warn('请输入正确的 11 位手机号'); return; }
      var r = OrgsStore.updateInvite(org.orgId, inviteId, { name: name, mobile: mobile, role: role });
      if (r && r.error) { UI.toast.err(r.error); return; }
      UI.closeSheet();
      UI.toast.ok('已保存修改');
      render();
    };
  };

  /* 字母索引跳转 + 滚动高亮 */
  window.omAzJump = function (L) {
    var el = document.querySelector('.om-letter-head[data-letter="' + L + '"]');
    if (!el) el = document.querySelector('.member-card[data-letter="' + L + '"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var bar = document.getElementById('om-azbar');
    if (bar) bar.querySelectorAll('.om-az').forEach(function (z) { z.classList.toggle('on', z.getAttribute('data-letter') === L); });
  };
  function omOnScroll() {
    var bar = document.getElementById('om-azbar');
    if (!bar) return;
    var cur = '';
    document.querySelectorAll('.om-letter-head').forEach(function (h) {
      if (h.getBoundingClientRect().top <= 110) cur = h.getAttribute('data-letter');
    });
    bar.querySelectorAll('.om-az').forEach(function (z) { z.classList.toggle('on', z.getAttribute('data-letter') === cur); });
  }
  function bindMemberScroll() {
    var sc = document.querySelector('.phone .scroll');
    if (!sc) return;
    sc.removeEventListener('scroll', omOnScroll);
    sc.addEventListener('scroll', omOnScroll, { passive: true });
  }

  /* 成员列表分组渲染（搜索时仅刷新分组，保持输入焦点） */
  function renderMemberList() {
    var org = resolveOrg(); var u = me();
    var azEl = document.getElementById('om-azbar');
    var gEl = document.getElementById('om-groups');
    if (!gEl || !org) return;
    var members = OrgsStore.members(org.orgId);
    var myRole = OrgsStore.myRole(org.orgId);
    var isOwner = myRole === 'owner';
    var isManager = isOwner || myRole === 'admin';
    var sortList = members.filter(function (m) { return m.role !== 'owner'; }); /* 企业主已在顶部栏目 */
    var kw = (omSearchKw || '').toLowerCase();
    if (kw) {
      sortList = sortList.filter(function (m) {
        return (m.name || '').toLowerCase().indexOf(kw) > -1 || (m.mobile || '').indexOf(kw) > -1;
      });
    }
    sortList.sort(function (a, b) {
      var la = pyInitial(a.name), lb = pyInitial(b.name);
      if (la === lb) return (a.name < b.name ? -1 : (a.name > b.name ? 1 : 0));
      if (la === '#') return 1; if (lb === '#') return -1;
      return la < lb ? -1 : 1;
    });
    var groups = '', letterSet = [], currentLetter = '';
    sortList.forEach(function (m) {
      var L = pyInitial(m.name);
      if (L !== currentLetter) {
        currentLetter = L; letterSet.push(L);
        groups += '<div class="om-letter-head" data-letter="' + L + '">' + (L === '#' ? '#' : L) + '</div>';
      }
      var isSelf = m.uid === (u && u.id);
      var actBtns = '';
      if (m.uid === (u && u.id)) {
        if (m.role !== 'owner') actBtns += '<button class="mc-leave" onclick="omLeave(\'' + org.orgId + '\')">退出</button>';
      } else if (isManager && m.role !== 'owner') {
        actBtns += '<button class="mc-transfer" onclick="omRequestTransfer(\'' + org.orgId + '\',\'' + m.uid + '\')">移交</button>';
        if (isOwner) actBtns += '<button class="mc-remove" onclick="omRemove(\'' + m.uid + '\')">移除</button>';
      }
      groups +=
        '<div class="member-card" data-letter="' + L + '">' +
          '<div class="mc-ava">' + esc(m.avatar || (m.name || '?').charAt(0)) + '</div>' +
          '<div class="mc-info"><div class="mc-name">' + esc(m.name) + (isSelf ? '<span class="mc-self">（我）</span>' : '') + ' <span class="role-tag role-' + m.role + '">' + (ROLE_LABEL[m.role] || '成员') + '</span></div>' +
          '<div class="mc-time">' + fmtDate(m.joinedAt) + (m.mobile ? ' · ' + esc(m.mobile) : '') + '</div></div>' +
          actBtns +
        '</div>';
    });
    if (!sortList.length) {
      groups += '<div class="om-empty">' + (kw ? '没有匹配的成员' : '暂无其他成员') + '</div>';
    }
    gEl.innerHTML = groups;
    if (azEl) {
      azEl.innerHTML = kw ? '' : letterSet.map(function (L) {
        return '<div class="om-az" data-letter="' + L + '" onclick="omAzJump(\'' + L + '\')">' + (L === '#' ? '#' : L) + '</div>';
      }).join('');
    }
  }

  window.omInvTab = function (el) {
    var tab = el.getAttribute('data-tab');
    document.querySelectorAll('.inv-tab').forEach(function (t) { t.classList.toggle('on', t === el); });
    var m = document.getElementById('inv-pane-mobile');
    var u = document.getElementById('inv-pane-users');
    if (m) m.style.display = tab === 'mobile' ? '' : 'none';
    if (u) u.style.display = tab === 'users' ? '' : 'none';
    var sh = lastSheetRef; if (sh) sh._tab = tab;
  };
  window.omPickCand = function (el) {
    var sh = lastSheetRef; if (!sh) return;
    var uid = el.getAttribute('data-uid');
    var uids = sh._selUids || (sh._selUids = []);
    var i = uids.indexOf(uid);
    if (i > -1) {
      uids.splice(i, 1); el.classList.remove('sel');
    } else {
      if (sh._selRole === 'owner' && uids.length >= 1) { UI.toast.warn('企业主邀请仅可选择 1 人'); return; }
      uids.push(uid); el.classList.add('sel');
    }
    omRefreshSelCount();
  };
  window.omPickRole = function (el) {
    if (el.classList.contains('disabled')) { UI.toast.warn('该企业已有企业主'); return; }
    var pick = el.closest ? el.closest('.role-pick') : null;
    (pick ? pick.querySelectorAll('.role-opt') : document.querySelectorAll('.role-opt')).forEach(function (r) { r.classList.remove('sel'); });
    el.classList.add('sel');
    var sh = lastSheetRef; if (sh) sh._selRole = el.getAttribute('data-role');
  };


  window.omApprove = function (joinId) {
    var r = OrgsStore.approveJoin(joinId);
    if (r && r.error) { UI.toast.warn(r.error); return; }
    UI.toast.ok('已通过，成员已加入企业'); render();
  };
  window.omReject = function (joinId) {
    UI.dialog({ title: '驳回申请', text: '确定驳回该成员的加入申请吗？', ok: '驳回', cancel: '再想想', danger: true, onOk: function () {
      OrgsStore.rejectJoin(joinId); UI.toast('已驳回'); render();
    }});
  };
  window.omRemove = function (uid) {
    var org = resolveOrg();
    UI.dialog({ title: '移除成员', text: '移除后该成员将失去本企业身份与发布/招聘权限。', ok: '移除', cancel: '取消', danger: true, onOk: function () {
      var r = OrgsStore.removeMember(org.orgId, uid);
      if (r && r.error) { UI.toast.warn(r.error); return; }
      UI.toast.ok('已移除'); render();
    }});
  };

  /* ============ 退出企业 ============ */
  window.omLeave = function (orgId) {
    UI.dialog({ title: '退出本企业', text: '退出后将失去本企业身份与发布/招聘权限，如需重新加入需由管理员邀请或重新申请。', ok: '退出', cancel: '取消', danger: true, onOk: function () {
      var r = OrgsStore.leave(orgId);
      if (r && r.error) { UI.toast.warn(r.error); return; }
      UI.toast.ok('已退出企业'); render();
    }});
  };

  /* ============ 企业主移交 ============ */
  window.omRequestTransfer = function (orgId, uid) {
    var u = me(); var toU = (window.DataBus && DataBus.byId) ? DataBus.byId(uid) : null;
    var fromName = u ? u.name : '';
    var toName = toU ? toU.name : uid;
    UI.dialog({ title: '申请移交企业主身份', text: fromName + ' 申请将企业主身份移交给 <b>' + toName + '</b>。接收人需完成<b>法人认证</b>或<b>实际控制人验证</b>，提交后由平台后台审核，通过后正式生效。', ok: '发起申请', cancel: '取消', onOk: function () {
      var r = OrgsStore.requestTransfer(orgId, uid);
      if (r && r.error) { UI.toast.err(r.error); return; }
      UI.toast.ok('已发起移交申请，已通知接收人完成验证');
      render();
    }});
  };
  window.omConfirmTransfer = function (transferId) {
    UI.dialog({ title: '确认移交', text: '确认将企业主身份移交给该成员吗？确认后对方需完成法人认证或实际控制人验证，并经后台审核。', ok: '确认移交', cancel: '取消', onOk: function () {
      var r = OrgsStore.confirmTransfer(transferId);
      if (r && r.error) { UI.toast.err(r.error); return; }
      UI.toast.ok('已确认，对方完成验证后经后台审核生效'); render();
    }});
  };
  window.omRejectTransfer = function (transferId) {
    OrgsStore.rejectTransfer(transferId);
    UI.toast('已驳回该移交申请'); render();
  };

  /* ============ 企业主身份验证（法人认证 / 实际控制人验证） ============ */
  var verifyMode = 'legal';
  window.omOpenVerify = function (orgId) {
    var org = OrgsStore.get(orgId); if (!org) return;
    var sh = UI.sheet();
    sh.setText('企业主身份验证 · ' + (org.shortName || org.co));
    sh.html(
      '<div style="padding:2px 2px 4px;">' +
        '<div class="vf-opt sel" data-mode="legal" onclick="omPickVerifyMode(this)">' +
          '<div class="vf-opt-dot"></div><div class="vf-opt-meta"><div class="vf-opt-t">法人认证</div>' +
          '<div class="vf-opt-s">姓名须与营业执照法定代表人「' + esc(org.legal || '—') + '」一致</div></div>' +
        '</div>' +
        '<div class="vf-opt" data-mode="controller" onclick="omPickVerifyMode(this)">' +
          '<div class="vf-opt-dot"></div><div class="vf-opt-meta"><div class="vf-opt-t">实际控制人验证</div>' +
          '<div class="vf-opt-s">本人为该企业实际控制人，承诺材料真实</div></div>' +
        '</div>' +
        '<div class="vf-field"><label>姓名</label><input id="vf-name" placeholder="请输入真实姓名"></div>' +
        '<div class="vf-field"><label>身份证号</label><input id="vf-idno" maxlength="18" placeholder="18 位身份证号"></div>' +
        '<div class="vf-field" id="vf-decl-wrap" style="display:none;">' +
          '<label class="vf-check"><input type="checkbox" id="vf-decl"><span>本人为该企业实际控制人，以上信息真实有效，自愿接受平台核验</span></label>' +
        '</div>' +
        '<button type="button" id="vf-submit" class="btn btn-primary" style="width:100%;height:48px;border-radius:999px;margin-top:10px;">提交，等待后台审核</button>' +
      '</div>'
    );
    sh.show();
    verifyMode = 'legal';
    document.getElementById('vf-submit').onclick = function () {
      var name = document.getElementById('vf-name').value;
      var idNo = document.getElementById('vf-idno').value;
      var declaration = document.getElementById('vf-decl') ? document.getElementById('vf-decl').checked : true;
      var r = OrgsStore.submitOwnerVerify(orgId, verifyMode, { name: name, idNo: idNo, declaration: declaration });
      if (r && r.error) { UI.toast.err(r.error); return; }
      UI.closeSheet();
      UI.toast.ok('已提交，等待后台审核');
      render();
    };
    var declWrap = document.getElementById('vf-decl-wrap');
    if (declWrap) {
      declWrap.style.display = verifyMode === 'controller' ? '' : 'none';
    }
  };
  window.omPickVerifyMode = function (el) {
    document.querySelectorAll('.vf-opt').forEach(function (o) { o.classList.remove('sel'); });
    el.classList.add('sel');
    verifyMode = el.getAttribute('data-mode');
    var w = document.getElementById('vf-decl-wrap');
    if (w) w.style.display = verifyMode === 'controller' ? '' : 'none';
  };

  document.getElementById('om-invite-btn').addEventListener('click', function () { openInvite(false); });

  render();
  window.addEventListener('engchain:org', render);
  window.addEventListener('engchain:apply', render);
  window.addEventListener('engchain:auth', render);
  window.addEventListener('storage', function (e) {
    if (e.key === 'engchain-orgs' || e.key === 'engchain-users') render();
  });
})();
</script>
</body>
</html>
