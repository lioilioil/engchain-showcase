<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);

<script>
(function(){window.__ROOT__='../../';

/* 五身份状态：todo 未开始 / review 审核中 / done 已通过 / reject 已驳回 / locked 锁定 */
function prep(type){return 'auth-prep.html?type='+type;}

/* 状态文字与样式 */
function stateText(st){
  return {todo:'未开通',review:'审核中',done:'已通过',reject:'已驳回',locked:'未解锁'}[st]||'未开通';
}
function stateColor(st){
  return {todo:'var(--text-3)',review:'var(--warning)',done:'var(--primary)',reject:'var(--error)',locked:'var(--text-4)'}[st]||'var(--text-3)';
}

/* 身份数据定义 */
var IDENTITY_DEFS=[
  {key:'realname',name:'个人认证',tag:'基石',icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-user"/></svg>',
    desc:'实名认证 · 人脸核验 · 免费',benefit:'解锁全部身份的基础',
    applyHref:prep('realname'),detailHref:'auth-personal.html',
    color:'var(--primary)',bg:'var(--primary-soft)'},
  {key:'personal-entry',name:'个人入驻',tag:'人才',icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-form"/></svg>',
    desc:'专业资质 · 完整简历 · 免费',benefit:'解锁人才展示与岗位匹配',
    applyHref:prep('qualification'),detailHref:'entry-personal-result.html',
    color:'#5B8DB8',bg:'rgba(91,141,184,.12)'},
  {key:'partner',name:'个人合伙人',tag:'分销',icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-star"/></svg>',
    desc:'分销意向 · 推广渠道 · 免费',benefit:'解锁二级分销与推广权益',
    applyHref:prep('partner'),detailHref:'auth-partner.html?mode=detail',
    color:'#B8860B',bg:'rgba(184,134,11,.1)'},
  {key:'enterprise',name:'企业工商认证',tag:'企业',icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-company"/></svg>',
    desc:'工商核验 · ¥999/年',benefit:'解锁企业经营与发布权限',
    applyHref:prep('enterprise'),detailHref:'auth-enterprise.html',
    color:'var(--primary-dim)',bg:'var(--primary-soft)'},
  {key:'entry',name:'企业入驻',tag:'经营',icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-shield"/></svg>',
    desc:'入驻费 · 缴费审核',benefit:'解锁发布供需与经营权益',
    applyHref:prep('entry'),detailHref:'entry-result.html',
    color:'var(--primary)',bg:'var(--primary-soft)'}
];

/* 计算当前优先级最高的待处理项（驳回 > 审核中） */
function findPriorityItem(states){
  for(var i=0;i<IDENTITY_DEFS.length;i++){
    if(states[IDENTITY_DEFS[i].key]==='reject'){
      return {type:'reject',item:IDENTITY_DEFS[i]};
    }
  }
  for(var i=0;i<IDENTITY_DEFS.length;i++){
    if(states[IDENTITY_DEFS[i].key]==='review'){
      return {type:'review',item:IDENTITY_DEFS[i]};
    }
  }
  return null;
}

/* 渲染：主行动区（根据场景动态变化） */
function renderHeroAction(states, priority){
  var el=document.getElementById('au-hero-action');
  if(!el)return;

  var rejectItem=priority&&priority.type==='reject'?priority.item:null;
  var reviewItem=priority&&priority.type==='review'?priority.item:null;

  /* 场景3：未完成实名认证 → 第一步 */
  if(!rejectItem&&!reviewItem&&states.realname!=='done'){
    var def=IDENTITY_DEFS[0];
    el.innerHTML=
      '<div class="hero-card hero-gold">'+
        '<div class="hero-glow"></div>'+
        '<div class="hero-badge">第一步</div>'+
        '<div class="hero-title">完成实名认证，开启全部权益</div>'+
        '<div class="hero-desc">这是开通其他所有身份的基础，完成人脸核验仅需 1 分钟，全程免费。</div>'+
        '<div class="hero-benefits">'+
          '<div class="hb-item"><svg class="ic" style="width:13px;height:13px;color:var(--success);"><use href="#i-check"/></svg>解锁个人入驻 · 人才匹配</div>'+
          '<div class="hb-item"><svg class="ic" style="width:13px;height:13px;color:var(--success);"><use href="#i-check"/></svg>解锁企业认证 · 经营权限</div>'+
          '<div class="hb-item"><svg class="ic" style="width:13px;height:13px;color:var(--success);"><use href="#i-check"/></svg>解锁全部发布与沟通功能</div>'+
        '</div>'+
        '<button class="hero-btn" onclick="go(\''+def.applyHref+'\')">立即实名认证</button>'+
      '</div>';
    return;
  }

  /* 场景4：已完成实名认证，其他都没做 → 选择发展方向 */
  if(!rejectItem&&!reviewItem&&states.realname==='done'){
    var notDone=IDENTITY_DEFS.filter(function(d){return d.key!=='realname'&&states[d.key]==='todo';});
    if(notDone.length>=2){
      el.innerHTML=
        '<div class="hero-card hero-light">'+
          '<div class="hero-badge hero-badge-blue">下一步</div>'+
          '<div class="hero-title">选择你的发展方向</div>'+
          '<div class="hero-desc">实名认证已完成！你可以根据自己的需求，选择以下方向继续开通：</div>'+
          '<div class="hero-choices">'+
            notDone.slice(0,3).map(function(d){
              return '<div class="hc-item" onclick="go(\''+d.applyHref+'\')">'+
                '<div class="hc-ic" style="background:'+d.bg+';color:'+d.color+';">'+d.icon+'</div>'+
                '<div class="hc-body">'+
                  '<div class="hc-name">'+d.name+'</div>'+
                  '<div class="hc-desc">'+d.benefit+'</div>'+
                '</div>'+
                '<svg class="ic" style="width:16px;height:16px;color:var(--text-3);flex:none;"><use href="#i-chev-r"/></svg>'+
              '</div>';
            }).join('')+
          '</div>'+
        '</div>';
      return;
    }
  }

  /* 场景5：有被驳回的 → 重新提交 */
  if(rejectItem){
    el.innerHTML=
      '<div class="hero-card hero-warn">'+
        '<div class="hero-badge hero-badge-red">待处理</div>'+
        '<div class="hero-title">「'+rejectItem.name+'」申请未通过</div>'+
        '<div class="hero-desc">上次提交的资料存在问题，请根据驳回原因补充修改后重新提交。</div>'+
        '<button class="hero-btn hero-btn-red" onclick="go(\''+rejectItem.applyHref+'\')">重新提交申请</button>'+
      '</div>';
    return;
  }

  /* 场景6：有审核中的 → 查看进度 */
  if(reviewItem){
    el.innerHTML=
      '<div class="hero-card hero-info">'+
        '<div class="hero-badge hero-badge-orange">审核中</div>'+
        '<div class="hero-title">「'+reviewItem.name+'」正在审核</div>'+
        '<div class="hero-desc">平台正在核验你的资料，预计 1-3 个工作日完成，结果将实时同步。</div>'+
        '<button class="hero-btn hero-btn-orange" onclick="go(\''+reviewItem.detailHref+'\')">查看审核进度</button>'+
      '</div>';
    return;
  }

  /* 场景7：全部完成 */
  el.innerHTML=
    '<div class="hero-card hero-success">'+
      '<div class="hero-check">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:28px;height:28px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'+
      '</div>'+
      '<div class="hero-title">全部认证已完成！</div>'+
      '<div class="hero-desc">你已解锁平台全部权益，可以正常使用所有功能了。</div>'+
    '</div>';
}

/* 渲染：可选进阶方向 */
function renderNextGrid(states){
  var el=document.getElementById('au-next-grid');
  var section=document.getElementById('au-next-section');
  if(!el||!section)return;

  var candidates=IDENTITY_DEFS.filter(function(d){
    return states[d.key]==='todo'||states[d.key]==='locked';
  });

  if(candidates.length===0){
    section.style.display='none';
    return;
  }

  section.style.display='block';
  el.innerHTML=candidates.map(function(d){
    var st=states[d.key];
    var locked=st==='locked';
    return '<div class="next-card'+(locked?' locked':'')+'" onclick="go(\''+(locked?prep('realname'):d.applyHref)+'\')">'+
      '<div class="nc-ic" style="background:'+d.bg+';color:'+d.color+';">'+
        (locked
          ?'<svg class="ic" style="width:16px;height:16px;"><use href="#i-lock"/></svg>'
          :d.icon)
        +'</div>'+
      '<div class="nc-name">'+d.name+'</div>'+
      '<div class="nc-desc">'+(locked?'需先完成实名认证':d.benefit)+'</div>'+
      '<div class="nc-state" style="color:'+stateColor(st)+'">'+stateText(st)+'</div>'+
    '</div>';
  }).join('');
}

/* 渲染：全部身份列表 */
function renderAllList(states){
  var el=document.getElementById('au-all-list');
  if(!el)return;

  el.innerHTML=IDENTITY_DEFS.map(function(d){
    var st=states[d.key];
    var done=st==='done';
    var locked=st==='locked';
    var clickHref=done?d.detailHref:(locked?prep('realname'):d.applyHref);

    /* 状态图标 */
    var statusIcon='';
    if(done){
      statusIcon='<span class="al-status al-done"><svg class="ic" style="width:12px;height:12px;"><use href="#i-check"/></svg>已通过</span>';
    }else if(locked){
      statusIcon='<span class="al-status al-locked"><svg class="ic" style="width:11px;height:11px;"><use href="#i-lock"/></svg>未解锁</span>';
    }else if(st==='review'){
      statusIcon='<span class="al-status al-review"><i></i>审核中</span>';
    }else if(st==='reject'){
      statusIcon='<span class="al-status al-reject">已驳回</span>';
    }else{
      statusIcon='<span class="al-status al-todo">去开通</span>';
    }

    return '<div class="al-item" onclick="go(\''+clickHref+'\')">'+
      '<div class="al-ic" style="background:'+d.bg+';color:'+d.color+';">'+
        (locked?'<svg class="ic" style="width:15px;height:15px;"><use href="#i-lock"/></svg>':d.icon)+
      '</div>'+
      '<div class="al-body">'+
        '<div class="al-name">'+d.name+'<span class="al-tag">'+d.tag+'</span></div>'+
        '<div class="al-desc">'+d.desc+'</div>'+
      '</div>'+
      statusIcon+
      '<svg class="ic al-arrow" style="width:15px;height:15px;color:var(--text-3);flex:none;"><use href="#i-chev-r"/></svg>'+
    '</div>';
  }).join('');
}

/* 主渲染函数 */
function render(){
  var a=AuthStore.read(), e=EntryStore.read(), idy=deriveIdentity();
  var now=Date.now();

  /* ---- 五身份状态计算 ---- */
  var rnDone=!!(a.realname&&a.realname.ok);
  var rnState=rnDone?'done':((a.realname&&a.realname.status==='pending')?'review':'todo');

  var pe=a.personalEntry||a.personalQual||a.qual||{ok:false,list:[],status:'',note:''};
  var peDone=!!(pe.ok&&pe.list&&pe.list.length);
  var peState=!rnDone?'locked':(peDone?'done':(pe.status==='pending'?'review':(!pe.ok&&pe.note?'reject':'todo')));

  var pt=a.partner||{ok:false,status:'',note:''};
  var ptDone=!!pt.ok;
  var ptState=!rnDone?'locked':(ptDone?'done':(pt.status==='pending'?'review':(!pt.ok&&pt.note?'reject':'todo')));

  var ent=a.enterprise||{ok:false,expireAt:0,status:'',note:''};
  var entDone=!!(ent.ok&&ent.expireAt>now);
  var entState=!rnDone?'locked':(entDone?'done':(ent.status==='pending'?'review':(!ent.ok&&ent.note?'reject':'todo')));

  var types=(e.types&&e.types.length)?e.types:(e.type?[e.type]:[]);
  var entrDone=!!(types.length&&e.active&&e.status==='active');
  var entrReview=['pending','first_ok'].indexOf(e.status)>=0;
  var entrState=!rnDone?'locked':(entrDone?'done':(entrReview?'review':(!e.active&&e.status==='rejected'?'reject':'todo')));

  var states={
    'realname':rnState,
    'personal-entry':peState,
    'partner':ptState,
    'enterprise':entState,
    'entry':entrState
  };

  /* ---- 计算优先级待处理项 ---- */
  var priority=findPriorityItem(states);

  /* ---- 顶部概览 ---- */
  var doneN=[rnState,peState,ptState,entState,entrState].filter(function(s){return s==='done';}).length;
  document.getElementById('ov-done').textContent=doneN;
  document.getElementById('ov-p-fill').style.width=(doneN/5*100)+'%';

  /* 当前身份名称 */
  var primaryLabels={
    guest:'未认证用户',
    registered:'已注册',
    realname:'个人认证 · 已实名',
    pro:'个人入驻 · 专业人才',
    partner:'个人合伙人',
    enterprise:'企业认证 · 已核验',
    resident:'企业入驻 · 经营中'
  };
  document.getElementById('ov-name').textContent=primaryLabels[idy.primary]||'已注册用户';

  /* 副标题根据状态变化 */
  var subText='';
  if(rnState!=='done')subText='完成实名认证解锁平台全部权益';
  else if(priority&&priority.type==='reject')subText='有申请待处理，请尽快完成';
  else if(priority&&priority.type==='review')subText='有申请正在审核中';
  else if(doneN===5)subText='全部认证已完成，解锁全部权益';
  else subText='完成更多认证解锁更多权益';
  document.getElementById('ov-sub').textContent=subText;

  /* 头像样式根据当前身份 */
  var avatarEl=document.getElementById('ov-avatar');
  if(idy.primary==='resident'||idy.primary==='enterprise'){
    avatarEl.style.background='var(--primary-soft)';
    avatarEl.style.color='var(--primary-dim)';
    avatarEl.innerHTML='<svg class="ic" style="width:22px;height:22px;"><use href="#i-company"/></svg>';
  }else if(idy.primary==='pro'||idy.primary==='realname'){
    avatarEl.style.background='var(--primary-soft)';
    avatarEl.style.color='var(--primary-dim)';
    avatarEl.innerHTML='<svg class="ic" style="width:22px;height:22px;"><use href="#i-user"/></svg>';
  }else{
    avatarEl.style.background='var(--bg-card-2)';
    avatarEl.style.color='var(--text-3)';
    avatarEl.innerHTML='<svg class="ic" style="width:22px;height:22px;"><use href="#i-user"/></svg>';
  }

  /* ---- 三个区域渲染 ---- */
  renderHeroAction(states, priority);
  renderNextGrid(states);
  renderAllList(states);

  /* 全部数量 */
  document.getElementById('all-count').textContent=doneN+'/5 已完成';
}

window.go=function(u){location.href=u;};
render();

/* 后台在另一标签页审批后实时刷新 */
window.addEventListener('storage',function(ev){
  if(['engchain-users','engchain-auth','engchain-entry'].indexOf(ev.key)>=0)render();
});
window.addEventListener('engchain:auth',render);
window.addEventListener('engchain:entry',render);
window.addEventListener('engchain:store-change',render);

/* 入场动效 */
document.querySelectorAll('.au-overview,#au-hero-action,.au-section,.au-safe').forEach(function(el,i){
  if(!el)return;
  el.style.opacity='0';el.style.transform='translateY(10px)';
  setTimeout(function(){el.style.transition='all .45s var(--e-out)';el.style.opacity='1';el.style.transform='none';},70*i);
});
})();
</script>
<style>
.au-scroll{padding:12px var(--page-pad) 32px;}

/* ========== ① 顶部状态总览条 ========== */

  background:var(--bg-card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;
  box-shadow:var(--shadow-xs);}
.ov-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.ov-avatar{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;}
.ov-info{flex:1;min-width:0;}
.ov-name{font-size:15px;font-weight:700;color:var(--text-1);line-height:1.3;}
.ov-sub{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.4;}
.ov-progress{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;}
.ov-p-num{font-size:16px;font-weight:800;color:var(--text-1);font-family:var(--font-num);line-height:1;}
.ov-p-num b{font-size:18px;color:var(--primary);}
.ov-p-num span{font-size:12px;color:var(--text-3);font-weight:500;}
.ov-p-bar{width:100%;height:6px;background:var(--bg-card-2);border-radius:99px;overflow:hidden;}
.ov-p-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dim));border-radius:99px;transition:width .8s var(--e-out);}
.ov-p-label{font-size:10px;color:var(--text-3);white-space:nowrap;}

/* ========== ② 主行动推荐卡片 ========== */
#au-hero-action{margin-bottom:20px;}
.hero-card{position:relative;overflow:hidden;border-radius:18px;padding:20px 18px;box-shadow:var(--shadow-card);}
.hero-glow{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,97,.2),transparent 70%);pointer-events:none;}

/* 金色主题：第一步认证 */
.hero-gold{background:linear-gradient(145deg,#2A313C,#161B23 60%,#0F1319);border:1px solid rgba(201,169,97,.25);}
.hero-gold .hero-badge{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);}
.hero-gold .hero-title{color:#fff;}
.hero-gold .hero-desc{color:rgba(255,255,255,.65);}
.hero-gold .hb-item{color:rgba(255,255,255,.75);}

/* 浅色主题：选择方向 */
.hero-light{background:var(--bg-card);border:1px solid var(--line);}
.hero-light .hero-badge{background:var(--primary-soft);color:var(--primary-dim);}
.hero-light .hero-title{color:var(--text-1);}
.hero-light .hero-desc{color:var(--text-3);}

/* 警告主题：待处理/驳回 */
