<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();

        <div class="au-rel-duo">

<script>
(function(){window.__ROOT__='../../';
/* 五身份状态：todo 未开始 / review 审核中 / done 已通过 / reject 已驳回 / locked 锁定 */

/* 过渡页跳转统一入口 */
function prep(type){return 'auth-prep.html?type='+type;}

function pill(st, todoTxt){
  var map={
    todo:'<span class="au-pill au-pill-todo">'+(todoTxt||'去开通')+'</span>',
    review:'<span class="au-pill au-pill-review"><i></i>审核中</span>',
    done:'<span class="au-pill au-pill-done">✓ 已通过</span>',
    reject:'<span class="au-pill au-pill-reject">已驳回</span>',
    locked:'<span class="au-pill au-pill-locked"><svg class="ic" style="width:10px;height:10px;"><use href="#i-lock"/></svg>需先认证</span>'
  };
  return map[st]||map.todo;
}

/* 状态文字（用于关系图节点和卡片引导） */
function stateText(st){
  return {todo:'未开通',review:'审核中',done:'已通过',reject:'已驳回',locked:'锁定'}[st]||'未开通';
}
function stateClass(st){
  return {todo:'st-todo',review:'st-review',done:'st-done',reject:'st-reject',locked:'st-locked'}[st]||'st-todo';
}

/* 徽章组单项 */
function badge(opts){
  var done=opts.state==='done';
  var locked=opts.state==='locked';
  var cls='au-badge'+(done?' au-badge-done':'')+(locked?' au-badge-locked':'');
  var ic=done
    ?'<span class="au-badge-ic au-badge-ic-done">✓</span>'
    :locked
      ?'<span class="au-badge-ic au-badge-ic-lock"><svg class="ic" style="width:14px;height:14px;"><use href="#i-lock"/></svg></span>'
      :'<span class="au-badge-ic">'+opts.icon+'</span>';
  var cta=done?'':(locked?'<span class="au-badge-cta">锁定</span>':'<span class="au-badge-cta">去开通</span>');
  var click=locked?'onclick="go(\''+prep('realname')+'\')"':(opts.href?'onclick="go(\''+opts.href+'\')"':'');
  return '<div class="'+cls+'" '+click+'>'+ic+'<span class="au-badge-name">'+opts.name+'</span>'+cta+'</div>';
}

/* 关系图节点 */
function relNode(opts){
  var st=opts.state;
  var done=st==='done',locked=st==='locked';
  var cls='au-rel-node-inner '+stateClass(st)+(opts.small?' au-rel-sm-inner':'');
  var statusDot=done
    ?'<span class="au-rel-dot au-rel-dot-done">✓</span>'
    :locked
      ?'<span class="au-rel-dot au-rel-dot-lock"><svg class="ic" style="width:9px;height:9px;"><use href="#i-lock"/></svg></span>'
      :st==='review'
        ?'<span class="au-rel-dot au-rel-dot-review"><i></i></span>'
        :st==='reject'
          ?'<span class="au-rel-dot au-rel-dot-reject">!</span>'
          :'<span class="au-rel-dot au-rel-dot-todo"></span>';
  var tag=opts.tag?'<span class="au-rel-node-tag">'+opts.tag+'</span>':'';
  return '<div class="'+cls+'">'+
    '<span class="au-rel-node-ic" style="background:'+opts.iconBg+';color:'+opts.iconColor+';">'+opts.iconSvg+'</span>'+
    '<div class="au-rel-node-info">'+
      '<div class="au-rel-node-name">'+opts.name+tag+'</div>'+
      '<div class="au-rel-node-state">'+stateText(st)+'</div>'+
    '</div>'+statusDot+
  '</div>';
}

/* 身份卡片（基石区 / 个人身份区 / 企业身份区共用） */
function idCard(opts){
  var st=opts.state;
  var done=st==='done';
  var locked=st==='locked';
  /* 下一步行动按钮 */
  var actionBtn='';
  var nextLabel='';
  if(done){
    actionBtn='<button class="btn btn-sm btn-ghost au-detail-btn" onclick="go(\''+opts.detailHref+'\')">查看详情</button>';
    nextLabel='查看认证详情';
  }else if(locked){
    actionBtn='<button class="btn btn-sm btn-ghost au-detail-btn" onclick="go(\''+prep('realname')+'\')"><svg class="ic" style="width:13px;height:13px;"><use href="#i-lock"/></svg>去认证</button>';
    nextLabel='先完成个人认证';
  }else if(st==='review'){
    actionBtn='<button class="btn btn-sm btn-ghost au-detail-btn" onclick="go(\''+opts.applyHref+'\')">查看进度</button>';
    nextLabel='查看审核进度';
  }else if(st==='reject'){
    actionBtn='<button class="btn btn-sm btn-danger au-detail-btn" onclick="go(\''+opts.applyHref+'\')">重新提交</button>';
    nextLabel='补充资料重新提交';
  }else{
    actionBtn='<button class="btn btn-sm btn-primary au-detail-btn" onclick="go(\''+opts.applyHref+'\')">'+(opts.ctaText||'去开通')+'</button>';
    nextLabel='点击开始办理';
  }
  var lockOverlay=locked?'<div class="au-lock-overlay"></div>':'';
  return lockOverlay+
    '<div class="au-id-head">'+
      '<span class="row-icon" style="background:'+opts.iconBg+';color:'+opts.iconColor+';flex:0 0 auto;">'+opts.iconSvg+'</span>'+
      '<div class="au-id-info">'+
        '<div class="au-id-title">'+opts.title+(opts.tag?'<span class="au-id-tag">'+opts.tag+'</span>':'')+'</div>'+
        '<div class="au-id-sub">'+opts.sub+'</div>'+
      '</div>'+
      '<div class="au-id-state">'+pill(st,opts.ctaText||'去开通')+'</div>'+
    '</div>'+
    (opts.desc?'<div class="au-id-desc">'+opts.desc+'</div>':'')+
    '<div class="au-id-guide">'+
      '<div class="au-id-guide-row">'+
        '<span class="au-id-guide-label">当前状态</span>'+
        '<span class="au-id-guide-val au-guide-'+st+'">'+stateText(st)+'</span>'+
      '</div>'+
      '<div class="au-id-guide-row">'+
        '<span class="au-id-guide-label">下一步</span>'+
        '<span class="au-id-guide-val">'+nextLabel+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="au-id-foot">'+actionBtn+'</div>';
}

function render(){
  var a=AuthStore.read(), e=EntryStore.read(), idy=deriveIdentity();
  var now=Date.now();

  /* ---- 五身份状态计算 ---- */
  /* 1. 个人认证 */
  var rnDone=!!(a.realname&&a.realname.ok);
  var rnState=rnDone?'done':((a.realname&&a.realname.status==='pending')?'review':'todo');

  /* 2. 个人入驻（personalEntry 优先，回退 personalQual/qual） */
  var pe=a.personalEntry||a.personalQual||a.qual||{ok:false,list:[],status:'',note:''};
  var peDone=!!(pe.ok&&pe.list&&pe.list.length);
  var peState=!rnDone?'locked':(peDone?'done':(pe.status==='pending'?'review':(!pe.ok&&pe.note?'reject':'todo')));

  /* 3. 个人合伙人 */
  var pt=a.partner||{ok:false,status:'',note:''};
  var ptDone=!!pt.ok;
  var ptState=!rnDone?'locked':(ptDone?'done':(pt.status==='pending'?'review':(!pt.ok&&pt.note?'reject':'todo')));

  /* 4. 企业认证 */
  var ent=a.enterprise||{ok:false,expireAt:0,status:'',note:''};
  var entDone=!!(ent.ok&&ent.expireAt>now);
  var entState=!rnDone?'locked':(entDone?'done':(ent.status==='pending'?'review':(!ent.ok&&ent.note?'reject':'todo')));

  /* 5. 企业入驻 */
  var types=(e.types&&e.types.length)?e.types:(e.type?[e.type]:[]);
  var entrDone=!!(types.length&&e.active&&e.status==='active');
  var entrReview=['pending','first_ok'].indexOf(e.status)>=0;
  var entrState=!rnDone?'locked':(entrDone?'done':(entrReview?'review':(!e.active&&e.status==='rejected'?'reject':'todo')));

  /* ---- 完成度环（5项） ---- */
  var doneN=[rnState,peState,ptState,entState,entrState].filter(function(s){return s==='done';}).length;
  document.getElementById('au-done-n').textContent=doneN;
  document.getElementById('au-done-n2').textContent=doneN;
  var C=2*Math.PI*27;var fg=document.getElementById('au-ring-fg');
  fg.style.strokeDasharray=C;fg.style.strokeDashoffset=C*(1-doneN/5);

  /* ---- 徽章组 ---- */
  document.getElementById('au-badges').innerHTML=[
    {name:'个人认证',state:rnState,icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-user"/></svg>',href:prep('realname')},
    {name:'个人入驻',state:peState,icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-form"/></svg>',href:prep('qualification')},
    {name:'个人合伙人',state:ptState,icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-star"/></svg>',href:prep('partner')},
    {name:'企业认证',state:entState,icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-company"/></svg>',href:prep('enterprise')},
    {name:'企业入驻',state:entrState,icon:'<svg class="ic" style="width:16px;height:16px;"><use href="#i-shield"/></svg>',href:prep('entry')}
  ].map(badge).join('');

  /* ---- 身份关系图节点 ---- */
  var icUser='<svg class="ic" style="width:16px;height:16px;"><use href="#i-user"/></svg>';
  var icForm='<svg class="ic" style="width:15px;height:15px;"><use href="#i-form"/></svg>';
  var icStar='<svg class="ic" style="width:15px;height:15px;"><use href="#i-star"/></svg>';
  var icCompany='<svg class="ic" style="width:15px;height:15px;"><use href="#i-company"/></svg>';
  var icShield='<svg class="ic" style="width:15px;height:15px;"><use href="#i-shield"/></svg>';
  var goldBg='rgba(201,169,97,.14)',goldC='var(--primary)';
  var softBg='rgba(201,169,97,.10)',softC='var(--primary-dim)';

  document.getElementById('rel-realname').innerHTML=relNode({
    state:rnState,name:'个人认证',tag:'基石',iconSvg:icUser,iconBg:goldBg,iconColor:goldC
  });
  document.getElementById('rel-personal-entry').innerHTML=relNode({
    state:peState,name:'个人入驻',iconSvg:icForm,iconBg:softBg,iconColor:softC,small:true
  });
  document.getElementById('rel-partner').innerHTML=relNode({
    state:ptState,name:'个人合伙人',iconSvg:icStar,iconBg:softBg,iconColor:softC,small:true
  });
  document.getElementById('rel-enterprise').innerHTML=relNode({
    state:entState,name:'企业认证',iconSvg:icCompany,iconBg:softBg,iconColor:softC,small:true
  });
  document.getElementById('rel-entry').innerHTML=relNode({
    state:entrState,name:'企业入驻',iconSvg:icShield,iconBg:softBg,iconColor:softC,small:true
  });

  /* ---- ① 基石区：个人认证（大卡片） ---- */
  var rnDesc=rnDone
    ?'已完成实名认证，是开通其他所有身份的基石。可继续办理个人入驻、个人合伙人或企业认证。'
    :'完成实名认证与人脸核验，建立平台可信身份。这是开通其他所有身份的前置条件，全程免费。';
  document.getElementById('card-realname').innerHTML=idCard({
    state:rnState,
    title:'个人认证',
    tag:'基石',
    sub:'实名认证 · 人脸核验 · 免费',
    desc:rnDesc,
    iconSvg:icUser,
    iconBg:goldBg,iconColor:goldC,
    applyHref:prep('realname'),
    detailHref:'auth-personal.html',
    ctaText:'去认证'
  });

  /* ---- ② 个人身份区 ---- */
  /* 个人入驻 */
  var peDesc='上传建造师等专业资质并完善简历，解锁人才展示与岗位匹配。';
  if(peState==='done') peDesc='专业资质与简历已通过审核，人才身份生效中。';
  else if(peState==='review') peDesc='资料已提交，平台正在审核专业资质与简历，预计 24 小时内完成。';
  else if(peState==='reject') peDesc='上次提交未通过：'+(pe.note||'资料不齐')+'，可补充后重新提交。';
  document.getElementById('card-personal-entry').innerHTML=idCard({
    state:peState,
    title:'个人入驻',
    sub:'专业资质 · 完整简历 · 免费',
    desc:peDesc,
    iconSvg:icForm,
    iconBg:softBg,iconColor:softC,
    applyHref:prep('qualification'),
    detailHref:'entry-personal-result.html',
    ctaText:'去入驻'
  });

  /* 个人合伙人 */
  var ptDesc='登记推广渠道与分销意向，享有二级分销权益与专属推广支持。';
  if(ptState==='done') ptDesc='个人合伙人身份已生效，二级分销权益与推广支持已开通。';
  else if(ptState==='review') ptDesc='合伙人申请已提交，平台正在评估推广渠道与意向。';
  else if(ptState==='reject') ptDesc='上次申请未通过：'+(pt.note||'信息不完整')+'，可补充后重新提交。';
  document.getElementById('card-partner').innerHTML=idCard({
    state:ptState,
    title:'个人合伙人',
    sub:'分销意向 · 推广渠道 · 免费',
    desc:ptDesc,
    iconSvg:icStar,
    iconBg:softBg,iconColor:softC,
    applyHref:prep('partner'),
    detailHref:'auth-partner.html?mode=detail',
    ctaText:'去申请'
  });

  /* ---- ③ 企业身份区 ---- */
  /* 企业认证 */
  var entDesc='提交工商信息完成企业核验，认证年费 ¥999（不含入驻费），人工审核 1-3 个工作日。';
  if(entState==='done'){
    var exp=new Date(ent.expireAt);
    entDesc='企业「'+(ent.shortName||ent.co||'已认证企业')+'」工商认证已生效，有效期至 '+exp.getFullYear()+'-'+String(exp.getMonth()+1).padStart(2,'0')+'-'+String(exp.getDate()).padStart(2,'0')+'。';
  }
  else if(entState==='review') entDesc='工商资料已提交，平台正在核验企业信息，预计 1-3 个工作日完成。';
  else if(entState==='reject') entDesc='上次认证未通过：'+(ent.note||'工商信息不符')+'，可修正后重新提交。';
  document.getElementById('card-enterprise').innerHTML=idCard({
    state:entState,
    title:'企业工商认证',
    sub:'工商核验 · 认证年费 ¥999/年（不含入驻费）',
    desc:entState==='done'||entState==='review'||entState==='reject'?entDesc:'',
    iconSvg:icCompany,
    iconBg:softBg,iconColor:softC,
    applyHref:prep('enterprise'),
    detailHref:'auth-enterprise.html',
    ctaText:'去认证'
  });
  /* 企业认证年费与入驻费关系说明 */
  document.getElementById('card-enterprise').insertAdjacentHTML('beforeend',
    '<div class="au-fee-link">企业入驻需额外支付入驻费，<a onclick="go(\'entry.html\')">查看入驻费 ›</a></div>');

  /* 企业入驻 */
  var entrDesc='选择企业类型（建筑/中介/合伙人）并提交资料，缴费后进入审核，解锁发布供需与经营权益。';
  if(entrState==='done'){
    var labels={construction:'建筑企业 · 蓝V',agency:'中介服务企业 · 金V',partner:'合伙人企业 · 专属'};
    entrDesc='已入驻：'+types.map(function(t){return labels[t]||t;}).join('、')+'，专属标识与经营权益生效中。';
  }
  else if(entrState==='review'){
    var stage=e.status==='first_ok'?'初审已通过 · 等待终审':'资料已提交 · 等待平台初审';
    entrDesc=stage+'，预计 24 小时内完成，审核结果将在此实时同步。';
  }
  else if(entrState==='reject'){
    entrDesc='上次入驻申请未通过：'+(e.note||'资料不齐')+'，可补充资料后重新提交。';
  }
  document.getElementById('card-entry').innerHTML=idCard({
    state:entrState,
    title:'企业入驻',
    sub:'入驻费（已含企业认证年费）· 缴费 · 人工审核',
    desc:entrState==='done'||entrState==='review'||entrState==='reject'?entrDesc:'',
    iconSvg:icShield,
    iconBg:softBg,iconColor:softC,
    applyHref:prep('entry'),
    detailHref:'entry-result.html',
    ctaText:'去入驻'
  });

  /* ---- 当前主身份高亮（deriveIdentity().primary） ---- */
  var primaryMap={realname:'card-realname',pro:'card-personal-entry',partner:'card-partner',enterprise:'card-enterprise',resident:'card-entry'};
  var allCardIds=['card-realname','card-personal-entry','card-partner','card-enterprise','card-entry'];
  allCardIds.forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    el.classList.remove('is-primary');
    var old=el.querySelector('.au-primary-badge');
    if(old&&old.parentNode)old.parentNode.removeChild(old);
  });
  var primaryId=primaryMap[idy.primary];
  if(primaryId){
    var pEl=document.getElementById(primaryId);
    if(pEl){
      pEl.classList.add('is-primary');
      pEl.insertAdjacentHTML('afterbegin','<span class="au-primary-badge">当前</span>');
    }
  }
}

window.go=function(u){location.href=u;};
render();

/* 后台在另一标签页审批后，用户表/快照变更 → 跨端实时刷新本页 */
window.addEventListener('storage',function(ev){
  if(['engchain-users','engchain-auth','engchain-entry'].indexOf(ev.key)>=0)render();
});
window.addEventListener('engchain:auth',render);
window.addEventListener('engchain:entry',render);
window.addEventListener('engchain:store-change',render);

/* 入场动效 */
document.querySelectorAll('.au-hero,.au-relmap,.au-foundation,.au-personal-grid,.au-ent-steps,.au-safe').forEach(function(el,i){
  el.style.opacity='0';el.style.transform='translateY(10px)';
  setTimeout(function(){el.style.transition='all .45s var(--e-out)';el.style.opacity='1';el.style.transform='none';},70*i);
});
})();
</script>
<style>
.au-scroll{padding-top:12px;padding-bottom:32px;}

/* ========== 深色概览 ========== */
.au-hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 18px 18px;margin-bottom:16px;
  background:radial-gradient(130% 120% at 88% -12%,rgba(238,214,151,.2),transparent 55%),linear-gradient(150deg,#252C35,#151A22 48%,#0B0E13);
  box-shadow:0 10px 28px rgba(22,22,22,.14);}
.au-glow{position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,97,.28),transparent 70%);pointer-events:none;}
.au-hero-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.au-hero-left{flex:1;min-width:0;}
.au-hero-label{font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.55);margin-bottom:12px;}

/* 徽章组 */
.au-badges{display:flex;flex-wrap:wrap;gap:8px;}
.au-badge{position:relative;flex:1 1 62px;min-width:62px;max-width:80px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 6px 8px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;transition:all .2s ease;min-height:76px;justify-content:center;}
.au-badge:active{transform:scale(.96);background:rgba(255,255,255,.1);}
.au-badge-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:14px;}
.au-badge-ic-done{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);
  box-shadow:0 2px 8px rgba(201,169,97,.4);font-weight:700;}
.au-badge-ic-lock{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);}
.au-badge-name{font-size:11px;color:rgba(255,255,255,.75);font-weight:500;text-align:center;line-height:1.3;}
.au-badge-cta{font-size:10px;color:var(--primary);font-weight:600;letter-spacing:.02em;}
.au-badge-done{border-color:rgba(201,169,97,.35);background:rgba(201,169,97,.08);}
.au-badge-done .au-badge-name{color:rgba(255,255,255,.9);}
.au-badge-done .au-badge-cta{display:none;}
.au-badge-locked{opacity:.55;cursor:pointer;}
.au-badge-locked .au-badge-cta{color:rgba(255,255,255,.35);}

/* 完成度环 */
.au-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;}
.au-ring{position:relative;width:64px;height:64px;}
.au-ring svg{width:64px;height:64px;}
.au-ring .r-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:5;}
.au-ring .r-fg{fill:none;stroke:#C9A961;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .9s var(--e-out);}
.au-ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;color:#fff;}
.au-ring-txt b{font-size:17px;font-family:var(--font-num);}
.au-ring-txt span{font-size:10px;color:rgba(255,255,255,.6);}
.au-ring-label{font-size:11px;color:rgba(255,255,255,.7);text-align:center;white-space:nowrap;}
.au-ring-label b{color:var(--primary);font-family:var(--font-num);font-size:13px;}
.au-ring-hint{font-size:10px;color:rgba(255,255,255,.4);text-align:center;line-height:1.4;max-width:90px;}

/* ========== 身份关系图 ========== */
.au-relmap{padding:16px;margin-bottom:20px;background:linear-gradient(180deg,var(--bg-card),rgba(201,169,97,.02));}
.au-relmap-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.au-rel-node{width:100%;}
.au-rel-node-inner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg-card);position:relative;transition:all .2s ease;}
.au-rel-foundation .au-rel-node-inner{border-color:rgba(201,169,97,.35);background:linear-gradient(135deg,rgba(201,169,97,.06),var(--bg-card));padding:14px 16px;}
.au-rel-sm-inner{padding:10px 12px;}
.au-rel-node-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.au-rel-sm-inner .au-rel-node-ic{width:28px;height:28px;border-radius:8px;}
.au-rel-node-ic .ic{width:16px;height:16px;}
.au-rel-sm-inner .au-rel-node-ic .ic{width:14px;height:14px;}
.au-rel-node-info{flex:1;min-width:0;}
.au-rel-node-name{font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:6px;}
.au-rel-sm-inner .au-rel-node-name{font-size:12px;}
.au-rel-node-tag{font-size:9px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:1px 6px;border-radius:999px;letter-spacing:.03em;}
.au-rel-node-state{font-size:11px;color:var(--text-3);margin-top:1px;}
.au-rel-sm-inner .au-rel-node-state{font-size:10px;}
.au-rel-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:700;}
.au-rel-dot-done{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);box-shadow:0 2px 6px rgba(201,169,97,.35);}
.au-rel-dot-todo{background:var(--bg-card-2);border:1.5px dashed var(--line);}
.au-rel-dot-review{background:rgba(214,158,46,.12);border:1px solid rgba(214,158,46,.4);}
.au-rel-dot-review i{width:7px;height:7px;border-radius:50%;background:var(--warning);animation:au-pulse 1.3s infinite;}
.au-rel-dot-reject{background:rgba(179,38,30,.1);color:var(--error);border:1px solid rgba(179,38,30,.3);}
.au-rel-dot-lock{background:rgba(22,22,22,.05);color:var(--text-3);}
.au-rel-dot-lock .ic{width:10px;height:10px;}
/* 关系图节点状态着色 */
.au-rel-node-inner.st-done{border-color:rgba(201,169,97,.3);}
.au-rel-node-inner.st-review{border-color:rgba(214,158,46,.35);}
.au-rel-node-inner.st-reject{border-color:rgba(179,38,30,.25);}
.au-rel-node-inner.st-locked{opacity:.6;}

/* 分叉连接线 */
.au-rel-split{display:flex;justify-content:center;padding:4px 0;}
.au-rel-split-line{width:2px;height:18px;background:linear-gradient(180deg,rgba(201,169,97,.4),var(--line));border-radius:2px;position:relative;}
.au-rel-split-line::before,.au-rel-split-line::after{content:'';position:absolute;top:50%;width:calc(50vw - 60px);max-width:130px;height:2px;background:var(--line);}
.au-rel-split-line::before{right:2px;}
.au-rel-split-line::after{left:2px;}

/* 分支容器 */
.au-rel-branch{margin-top:12px;}
.au-rel-branch:first-of-type{margin-top:0;}
.au-rel-branch-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:8px;padding-left:2px;}
.au-rel-branch-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.au-rel-dot-blue{background:#5B8DB8;}
.au-rel-dot-bronze{background:var(--primary-dim);}
.au-rel-branch-tag{margin-left:auto;font-size:10px;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:999px;font-weight:400;}

/* 个人身份双列 */
.au-rel-duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* 企业线链式 */
.au-rel-chain{display:flex;align-items:center;gap:6px;}
.au-rel-chain .au-rel-node{flex:1;min-width:0;}
.au-rel-chain-arrow{flex:none;color:var(--primary);display:flex;align-items:center;}

/* ========== 区块标识条 ========== */
.au-section-bar{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px;}
.au-section-bar-left{display:flex;align-items:center;gap:7px;}
.au-section-bar-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.au-section-bar-title{font-size:14px;font-weight:700;color:var(--text-1);}
.au-section-bar-note{font-size:11px;color:var(--text-3);}
.au-bar-gold .au-section-bar-ic{background:var(--primary-soft);color:var(--primary);}
.au-bar-gold .au-section-bar-title{color:var(--primary-dim);}
.au-bar-blue .au-section-bar-ic{background:rgba(91,141,184,.12);color:#5B8DB8;}
.au-bar-blue .au-section-bar-title{color:#4A7A9E;}
.au-bar-bronze .au-section-bar-ic{background:rgba(169,138,71,.12);color:var(--primary-dim);}
.au-bar-bronze .au-section-bar-title{color:var(--primary-dim);}

/* ========== 基石区大卡片 ========== */
.au-foundation{position:relative;padding:16px;margin-bottom:22px;
  border:1px solid rgba(201,169,97,.3);
  background:linear-gradient(135deg,var(--bg-card),rgba(201,169,97,.05));
  box-shadow:0 4px 16px rgba(201,169,97,.08);}
.au-foundation .au-id-head{align-items:flex-start;}
.au-foundation .row-icon{width:42px;height:42px;border-radius:11px;}
.au-foundation .row-icon .ic{width:20px;height:20px;}
.au-foundation .au-id-title{font-size:16px;}

/* ========== 个人身份区双列 ========== */
.au-personal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.au-id-card{position:relative;padding:14px 13px;display:flex;flex-direction:column;}

/* ========== 当前主身份高亮 ========== */
.au-id-card.is-primary,.au-foundation.is-primary{border:2px solid var(--primary);box-shadow:0 4px 18px rgba(201,169,97,.18);}
.au-primary-badge{position:absolute;top:-1px;right:-1px;z-index:5;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);
  font-size:10px;font-weight:600;padding:3px 10px;border-radius:0 12px 0 10px;letter-spacing:.05em;box-shadow:0 2px 6px rgba(201,169,97,.3);}
/* 企业认证年费/入驻费关系说明 */
.au-fee-link{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-hairline);font-size:11px;color:var(--text-3);line-height:1.6;}
.au-fee-link a{color:var(--primary);font-weight:600;cursor:pointer;}

/* ========== 企业身份区两步流程 ========== */
.au-ent-steps{display:flex;flex-direction:column;margin-bottom:22px;}
.au-ent-step{margin-bottom:0;}
.au-ent-connector{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0;position:relative;}
.au-ent-connector::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(180deg,var(--line),var(--primary-dim),var(--line));transform:translateX(-50%);}
.au-ent-connector-arrow{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative;z-index:1;box-shadow:0 2px 8px rgba(201,169,97,.35);}
.au-ent-connector-text{font-size:10px;color:var(--text-3);position:relative;z-index:1;background:var(--bg);padding:0 10px;letter-spacing:.02em;}

/* ========== 身份卡片通用 ========== */
.au-id-head{display:flex;align-items:flex-start;gap:10px;}
.au-id-head .row-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.au-id-info{flex:1;min-width:0;}
.au-id-title{font-size:13.5px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35;}
.au-id-tag{font-size:9.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);
  padding:2px 7px;border-radius:999px;letter-spacing:.03em;}
.au-id-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.45;}
.au-id-state{flex:none;max-width:44%;text-align:right;}
.au-id-desc{font-size:11.5px;color:var(--text-2);line-height:1.7;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line-hairline);}

/* 状态+下一步引导 */
.au-id-guide{margin-top:10px;padding:9px 11px;background:var(--bg-card-2);border-radius:9px;display:flex;flex-direction:column;gap:5px;}
.au-id-guide-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.au-id-guide-label{font-size:10.5px;color:var(--text-3);flex:none;}
.au-id-guide-val{font-size:10.5px;font-weight:500;color:var(--text-2);text-align:right;line-height:1.4;}
.au-guide-done{color:var(--primary);font-weight:600;}
.au-guide-review{color:var(--warning);font-weight:600;}
.au-guide-reject{color:var(--error);font-weight:600;}
.au-guide-locked{color:var(--text-3);}
.au-guide-todo{color:var(--text-3);}

.au-id-foot{margin-top:auto;padding-top:10px;display:flex;position:relative;z-index:3;}
.au-detail-btn{flex:1;height:38px;padding:0 14px;font-size:12px;border-radius:9px;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;}

/* ========== 状态胶囊 ========== */
.au-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.au-pill-todo{color:var(--text-3);font-weight:400;}
.au-pill-review{color:var(--warning);background:rgba(214,158,46,.1);}
.au-pill-review i{width:6px;height:6px;border-radius:50%;background:var(--warning);animation:au-pulse 1.3s infinite;}
.au-pill-done{color:var(--primary);background:var(--primary-soft);}
.au-pill-reject{color:var(--error);background:rgba(179,38,30,.08);}
.au-pill-locked{color:var(--text-3);background:rgba(22,22,22,.05);font-weight:400;font-size:10px;}
.au-pill-locked .ic{width:10px;height:10px;}
@keyframes au-pulse{0%{box-shadow:0 0 0 0 rgba(214,158,46,.45);}70%{box-shadow:0 0 0 7px rgba(214,158,46,0);}100%{box-shadow:0 0 0 0 rgba(214,158,46,0);}}

/* ========== 锁定态遮罩 ========== */
.au-lock-overlay{position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.4);
  backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);z-index:2;pointer-events:none;}

/* ========== 安全提示 ========== */
.au-safe{display:flex;gap:8px;align-items:flex-start;padding:13px 15px;font-size:12px;color:var(--text-2);line-height:1.7;margin-top:4px;}

/* ========== 375px 适配 ========== */
@media(max-width:375px){
  .au-badge{flex:1 1 56px;min-width:56px;min-height:72px;padding:8px 4px 6px;}
  .au-badge-name{font-size:10px;}
  .au-ring-wrap{gap:4px;}
  .au-ring-hint{display:none;}
  .au-personal-grid{gap:8px;}
  .au-id-card{padding:12px 11px;}
  .au-id-title{font-size:13px;}
  .au-id-sub{font-size:10px;}
  .au-rel-duo{gap:6px;}
  .au-rel-sm-inner{padding:9px 8px;}
  .au-rel-sm-inner .au-rel-node-name{font-size:11px;}
  .au-rel-chain{gap:4px;}
  .au-section-bar-note{font-size:10px;}
  .au-id-guide{padding:8px 9px;}
  .au-id-guide-label,.au-id-guide-val{font-size:10px;}
}
</style>
</body>
</html>
