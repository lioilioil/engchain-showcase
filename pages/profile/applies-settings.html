<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/profile/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>设置 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/guest-gate.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M8%201.2%2013.2%203.3v4.1c0%203.1-2.2%205.5-5.2%206.4-3-.9-5.2-3.3-5.2-6.4V3.3L8%201.2Z%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.3%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%226.55%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3Cellipse%20cx%3D%229.45%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E" />
<style>
/* 本页只做「求职档案」专用设置，样式全部复用 app.css 的 .group-label / .group / .row / .switch */
.settings-note { padding: 12px 20px 4px; font-size: 11.5px; color: var(--text-3); line-height: 1.7; }
.danger-row { justify-content: center; }
.danger-row .label { flex: none; color: var(--error); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">设置</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:8px;">
    <div class="group-label">投递偏好</div>
    <div class="group">
      <div class="row"><div class="row-icon accent"><svg class="ic"><use href="#i-eye"/></svg></div><span class="label">企业查看我的简历时通知我</span>
        <label class="switch sm"><input type="checkbox" id="sw-view"><span class="slider"></span></label></div>
      <div class="row"><div class="row-icon accent"><svg class="ic"><use href="#i-bell"/></svg></div><span class="label">收到面试邀请时通知我</span>
        <label class="switch sm"><input type="checkbox" id="sw-interview"><span class="slider"></span></label></div>
      <div class="row"><div class="row-icon accent"><svg class="ic"><use href="#i-clip"/></svg></div><span class="label">投递时默认附上简历附件</span>
        <label class="switch sm"><input type="checkbox" id="sw-attach"><span class="slider"></span></label></div>
    </div>

    <div class="group-label">简历</div>
    <div class="group">
      <div class="row" onclick="location.href='resume-edit.html'">
        <div class="row-icon accent"><svg class="ic"><use href="#i-doc"/></svg></div>
        <span class="label">我的简历</span>
        <span class="value text-3" id="resume-pct">完整度 0%</span>
        <span class="arrow">›</span></div>
      <div class="row"><div class="row-icon success"><svg class="ic"><use href="#i-eye"/></svg></div>
        <span class="label">简历公开<span class="settings-note" style="padding:0;display:block;">关闭后从「持证人才」下架</span></span>
        <label class="switch sm"><input type="checkbox" id="sw-public"><span class="slider"></span></label></div>
      <div class="row" onclick="location.href='resume-edit.html'">
        <div class="row-icon accent"><svg class="ic"><use href="#i-briefcase"/></svg></div>
        <span class="label">求职状态</span>
        <span class="value text-3" id="job-status">在职 · 考虑机会</span>
        <span class="arrow">›</span></div>
    </div>

    <div class="group-label">隐私</div>
    <div class="group">
      <div class="row" onclick="location.href='privacy.html'">
        <div class="row-icon warning"><svg class="ic"><use href="#i-shield"/></svg></div>
        <span class="label">屏蔽企业</span>
        <span class="value text-3" id="block-count">未设置</span>
        <span class="arrow">›</span></div>
      <div class="row" onclick="openScopeSheet()">
        <div class="row-icon success"><svg class="ic"><use href="#i-lock"/></svg></div>
        <span class="label">谁可以看我的简历</span>
        <span class="value text-3" id="resume-scope">全部企业</span>
        <span class="arrow">›</span></div>
    </div>

    <div class="group-label">数据</div>
    <div class="group">
      <div class="row danger-row" onclick="clearApplies()">
        <span class="label">清空投递记录</span>
      </div>
    </div>

    <div class="settings-note">以上设置仅作用于你的个人入驻档案（持证人才 / 简历投递），不影响你在平台的其他身份与业务数据。</div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/guest-gate.js"></script>
<script src="../../js/privacy-guard.js"></script>
<script>
(function(){
  window.__ROOT__ = '../../';

  var SCOPE_LABEL = { all: '全部企业', verified: '仅认证企业' };

  function pg() { return window.PrivacyGuard || null; }
  function prefs() { var g = pg(); return g ? g.prefs() : { resumePublic: true, resumeScope: 'all', notifyView: true, notifyInterview: true, attachResume: true }; }

  /* ---- 简历完整度：与「我的投递」同一口径（11 项字段） ---- */
  function calcResumeProgress() {
    try {
      var auth = AuthStore.read();
      var profile = (auth.personalEntry && auth.personalEntry.profile) || {};
      var basic = profile.basic || {};
      var ji = profile.jobIntent || {};
      var total = 11, filled = 0;
      if (basic.name) filled++;
      if (basic.email) filled++;
      if (basic.location) filled++;
      if (ji.position) filled++;
      if (ji.salary) filled++;
      if ((profile.education || []).length) filled++;
      if ((profile.work || []).length) filled++;
      if ((profile.project || []).length) filled++;
      if ((profile.skills || []).length) filled++;
      if (profile.intro) filled++;
      if (profile.resumeFile) filled++;
      return Math.round(filled / total * 100);
    } catch (e) { return 0; }
  }
  function jobStatusText() {
    try {
      var profile = (AuthStore.read().personalEntry || {}).profile || {};
      return ((profile.basic || {}).jobStatus) || '在职 · 考虑机会';
    } catch (e) { return '在职 · 考虑机会'; }
  }

  function reflect() {
    var p = prefs();
    document.getElementById('sw-view').checked = p.notifyView !== false;
    document.getElementById('sw-interview').checked = p.notifyInterview !== false;
    document.getElementById('sw-attach').checked = p.attachResume !== false;
    document.getElementById('sw-public').checked = p.resumePublic !== false;
    document.getElementById('resume-scope').textContent = SCOPE_LABEL[p.resumeScope] || SCOPE_LABEL.all;
    document.getElementById('resume-pct').textContent = '完整度 ' + calcResumeProgress() + '%';
    document.getElementById('job-status').textContent = jobStatusText();

    var g = pg();
    var n = g && g.ownerKey() ? g.list().length : 0;
    document.getElementById('block-count').textContent = n ? (n + ' 家') : '未设置';
  }

  function bindSwitch(id, key, okMsg) {
    var el = document.getElementById(id);
    el.addEventListener('change', function () {
      var g = pg();
      if (!g || !g.ownerKey()) {
        el.checked = !el.checked;
        UI.toast && UI.toast('请先登录后再设置', 'warn');
        return;
      }
      var patch = {};
      patch[key] = el.checked;
      g.setPrefs(patch);
      UI.toast && UI.toast(okMsg, 'ok');
      reflect();
    });
  }

  /* ---- 谁可以看我的简历 ---- */
  window.openScopeSheet = function () {
    var g = pg();
    if (!g) return;
    var sh = UI.sheet();
    sh.setText('谁可以看我的简历');
    var body = sh.body();
    var cur = prefs().resumeScope || 'all';
    body.innerHTML = '<div class="group" style="margin:0 0 12px;">' +
      ['all', 'verified'].map(function (k) {
        return '<div class="row" data-scope="' + k + '">' +
          '<span class="label">' + SCOPE_LABEL[k] + '</span>' +
          (cur === k ? '<svg class="ic" style="width:18px;height:18px;color:var(--primary)"><use href="#i-check"/></svg>' : '') +
        '</div>';
      }).join('') + '</div>' +
      '<div style="font-size:11.5px;color:var(--text-3);line-height:1.7;padding:0 4px 8px;">' +
      '「仅认证企业」指已通过企业工商认证并可访问「持证人才」的账号；未认证账号看不到你的简历。</div>';
    body.querySelectorAll('[data-scope]').forEach(function (row) {
      row.addEventListener('click', function () {
        var k = row.getAttribute('data-scope');
        if (!g.ownerKey()) { UI.closeSheet(); UI.toast && UI.toast('请先登录后再设置', 'warn'); return; }
        g.setPref('resumeScope', k);
        UI.closeSheet();
        UI.toast && UI.toast('已更新可见范围', 'ok');
        reflect();
      });
    });
    sh.show();
  };

  /* ---- 清空投递记录 ---- */
  window.clearApplies = function () {
    var n = 0;
    try { n = (window.ApplyStore ? ApplyStore.list() : []).length; } catch (e) { n = 0; }
    UI.dialog({
      title: '清空投递记录',
      text: n ? ('将删除全部 ' + n + ' 条投递记录，企业侧已收到的简历不受影响。此操作不可撤销。')
              : '当前没有投递记录。',
      ok: '清空',
      cancel: '取消',
      danger: true,
      onOk: function () {
        if (!n) return;
        try { ApplyStore.write({ items: [] }); } catch (e) {}
        try { window.dispatchEvent(new CustomEvent('engchain:apply')); } catch (e) {}
        UI.toast && UI.toast('已清空投递记录', 'ok');
      }
    });
  };

  /* ---- 游客：与本页其他入口保持同一门禁口径 ---- */
  (function gate() {
    var g = pg();
    if (g && g.ownerKey()) return;
    window.GuestGate && GuestGate.open({
      mode: 'overlay', icon: 'lock', badge: '游客模式',
      title: '登录后管理投递设置',
      note: '投递偏好、简历公开与隐私屏蔽仅对登录且已完成个人入驻的用户开放。',
      btnText: '去登录', btnHref: '../auth/login.html'
    });
  })();

  bindSwitch('sw-view', 'notifyView', '已保存通知偏好');
  bindSwitch('sw-interview', 'notifyInterview', '已保存通知偏好');
  bindSwitch('sw-attach', 'attachResume', '已保存投递偏好');
  bindSwitch('sw-public', 'resumePublic', '简历公开状态已更新');

  window.addEventListener('engchain:privacy-changed', reflect);
  window.addEventListener('storage', function (e) {
    if (e.key === 'engchain-blocked-companies' || e.key === 'engchain-apply-prefs') reflect();
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) reflect(); });

  reflect();
})();
</script>
</body>
</html>
