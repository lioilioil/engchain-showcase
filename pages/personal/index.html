  /* ---- Markdown 渲染样式 ---- */

  .rv-chip { display: inline-block; padding: 3px 10px; border-radius: var(--r-full); background: var(--bg-card-2); color: var(--text-2); font-size: 10.5px; font-weight: 500; margin: 0 6px 6px 0; }

  /* 身份头 */
  .pf-hero{display:flex;align-items:center;gap:14px;margin:14px 16px 6px;padding:16px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-xs);}

<script>
(function () {
  window.__ROOT__ = '../../';
  var id = new URLSearchParams(location.search).get('id') || 'p-jzs1';
  var UNLOCK_KEY = 'engchain-personal-unlocks';

  /* ---- 数据解析：兼容两种模式 ----
     basic 不投简历（person 结构：个人介绍/项目案例/资质业绩）
     resume 投简历  （talent 结构：完整简历，含求职意向/证书包/履历/项目经验/教育） */
  var isResume = false;
  var p = MOCK.personById(id);
  if (!p || p.id !== id) {
    var tl = (MOCK.talents || []).filter(function (x) { return x.id === id; })[0];
    if (tl) { p = tl; isResume = true; }
  }
  if (!p) p = MOCK.personById(id);
  var displayId = p.id || id;
  document.getElementById('nav-title').textContent = '个人主页';
  /* 身份头：个人姓名按权益脱敏（本人/已解锁/会员态全名，其余中间*号） */
  function maskName(nm){ if(!nm||nm.length<=2) return nm||''; return nm.charAt(0)+'*'.repeat(Math.max(1,nm.length-2))+(nm.length>2?nm.charAt(nm.length-1):''); }
  var _headNm = p.name || '个人主页';
  var _headOpen = (typeof isUnlocked==='function' && isUnlocked()) || UI.isOwner(displayId);
  document.getElementById('pf-avatar').textContent = (_headNm||'人').charAt(0);
  document.getElementById('pf-name').textContent = _headOpen ? _headNm : maskName(_headNm);
  var _headSub = (p.title || p.expectedPosition || p.certLevel || '个人主页');
  if (p.location) _headSub += ' · ' + p.location;
  document.getElementById('pf-sub').textContent = _headSub;
  var resumeBadge = isResume
    ? '<span class="rv-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>投简历模式 · 完整简历</span>'
    : '<span class="rv-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>不投简历 · 资质展示</span>';

  /* ---- 解锁状态检测 ---- */
  function isUnlocked() {
    if (UI.isOwner(displayId)) return true;
    if (new URLSearchParams(location.search).get('unlock') === '1') return true;
    try {
      var list = JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]');
      if (list.indexOf(displayId) !== -1) return true;
    } catch (e) {}
    try {
      /* [S5] 统一游客判断口径（DataBus.isGuest 优先，回退 localStorage） */
      if (window.DataBus && DataBus.isGuest && DataBus.isGuest()) return false;
      var st = JSON.parse(localStorage.getItem('engchain-state') || '{}');
      if (st.loggedIn === false) return false;
      if (st.member || (st.status && ['pro','enterprise','resident'].indexOf(st.status) !== -1)) return true;
    } catch (e) {}
    return false;
  }
  function saveUnlock() {
    try {
      var list = JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]');
      if (list.indexOf(displayId) === -1) list.push(displayId);
      localStorage.setItem(UNLOCK_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  });
  /* 联系卡操作：拨打 / 复制 */
  document.getElementById('core-content').addEventListener('click', function (e) {
    var act = e.target.closest && e.target.closest('[data-cc-action]');
    if (!act) return;
    var val = act.dataset.ccValue;
    if (!val) { UI.toast('解锁后可查看完整联系方式', 'warn'); return; }
    if (act.dataset.ccAction === 'phone') { window.location.href = 'tel:' + val; return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).then(function () { UI.toast('已复制：' + val, 'ok'); });
    } else { UI.toast('复制失败', 'warn'); }
  });

  /* ---- 初始渲染 ---- */
  renderCore(isUnlocked());
  window.addEventListener('engchain:mode', function () { renderCore(isUnlocked()); });
  window.addEventListener('engchain:credits', function () { renderCore(isUnlocked()); });
  window.addEventListener('engchain:store-change', function () { renderCore(isUnlocked()); });
  if (new URLSearchParams(location.search).get('scroll') === 'bio') {
    setTimeout(function () {
      var sc = document.querySelector('.scroll');
      var card = document.querySelector('.bio-card');
      if (sc && card) { sc.scrollTop = card.offsetTop - 20; }
    }, 200);
  }
})();
</script>
</body>
</html>
