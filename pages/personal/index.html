<style>
  /* ---- 核心信息付费墙 ---- */
  .core-section { position: relative; }
  .core-section.locked .core-content { filter: blur(5px); -webkit-filter: blur(5px); pointer-events: none; user-select: none; -webkit-user-select: none; }
  .core-lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 10%, transparent), color-mix(in srgb, var(--bg) 55%, transparent)); z-index: 5; border-radius: var(--r-l); }
  .core-lock-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dim); display: flex; align-items: center; justify-content: center; }
  .core-lock-icon svg { width: 22px; height: 22px; stroke-width: 1.8; }
  .core-lock-text { font-size: 13px; color: var(--text-2); text-align: center; line-height: 1.6; max-width: 240px; }
  .core-lock-text b { color: var(--text-1); font-weight: 600; }
  .core-unlock-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border-radius: var(--r-full); background: linear-gradient(135deg, var(--primary), var(--primary-dim)); color: var(--text-inv); font-size: 13px; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 4px 14px -4px var(--primary-dim); transition: transform var(--d-fast), box-shadow var(--d-fast); }
  .core-unlock-btn:active { transform: scale(.96); }
  .core-unlock-btn svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .unlocked-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: var(--r-full); background: var(--success-soft); color: var(--success); font-size: 11px; font-weight: 600; }
  .unlocked-badge svg { width: 12px; height: 12px; stroke-width: 2.4; }

  .unlock-note { font-size: 11px; color: var(--text-3); text-align: center; margin-top: 10px; line-height: 1.6; }

  /* ---- 项目案例卡 ---- */
  .proj-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; margin-bottom: 10px; }
  .proj-card .pc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .proj-card .pc-name { font-size: 14px; font-weight: 600; color: var(--text-1); line-height: 1.35; }
  .proj-card .pc-role { flex: none; font-size: 11px; font-weight: 600; color: var(--primary-dim); background: var(--primary-soft); padding: 3px 10px; border-radius: var(--r-full); white-space: nowrap; }

  .proj-card .pc-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.65; margin-top: 9px; }

  /* ---- 简介文件卡 ---- */
  .file-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); cursor: pointer; transition: border-color var(--d-fast); }
  .file-card:active { border-color: var(--primary); }
  .file-card .fc-icon { flex: none; width: 42px; height: 42px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }

  .file-card .fc-arrow { flex: none; color: var(--text-3); }
  .file-card .fc-arrow svg { width: 16px; height: 16px; }

  /* ---- 联系方式行 ---- */
  .contact-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); }
  .contact-row .cr-icon { flex: none; width: 36px; height: 36px; border-radius: var(--r-s); background: var(--success-soft); color: var(--success); display: flex; align-items: center; justify-content: center; }
  .contact-row .cr-icon svg { width: 17px; height: 17px; stroke-width: 1.8; }
  .contact-row .cr-body { flex: 1; min-width: 0; }

  .bio-text { font-size: 13px; color: var(--text-2); line-height: 1.8; }

  /* ---- Markdown 渲染样式 ---- */
  .md-content { font-size: 13px; color: var(--text-2); line-height: 1.85; word-break: break-word; }
  .md-content h2 { font-size: 14.5px; font-weight: 700; color: var(--text-1); margin: 20px 0 10px; padding: 3px 0 3px 11px; border-left: 3px solid var(--primary); line-height: 1.4; }
  .md-content h2:first-child { margin-top: 0; }
  .md-content h3 { font-size: 13.5px; font-weight: 600; color: var(--text-1); margin: 16px 0 8px; line-height: 1.4; }
  .md-content h4 { font-size: 13px; font-weight: 600; color: var(--text-1); margin: 12px 0 6px; }
  .md-content p { margin: 8px 0; }
  .md-content strong { color: var(--text-1); font-weight: 600; }
  .md-content em { color: var(--text-2); font-style: italic; }
  .md-content ul, .md-content ol { margin: 8px 0; padding-left: 0; list-style: none; }
  .md-content li { position: relative; padding: 3px 0 3px 20px; line-height: 1.7; font-size: 12.5px; }
  .md-content ul li::before { content: ''; position: absolute; left: 4px; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
  .md-content ol { counter-reset: md-ol; }
  .md-content ol li::before { counter-increment: md-ol; content: counter(md-ol); position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dim); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); }
  .md-content ol li { padding-left: 24px; }
  .md-content blockquote { margin: 12px 0; padding: 12px 14px 12px 16px; background: linear-gradient(135deg, var(--primary-soft), color-mix(in srgb, var(--primary-soft) 50%, transparent)); border-left: 3px solid var(--primary); border-radius: 0 var(--r-m) var(--r-m) 0; font-size: 12.5px; color: var(--primary-dim); line-height: 1.75; font-weight: 500; }
  .md-content blockquote p { margin: 0; }
  .md-content hr { border: none; border-top: 1px dashed var(--line); margin: 16px 0; }
  .md-content code { background: var(--bg-subtle); padding: 1px 6px; border-radius: 4px; font-size: 11.5px; font-family: var(--font-num), monospace; color: var(--accent); }
  .md-content a { color: var(--primary); text-decoration: none; border-bottom: 1px solid var(--primary-soft); padding-bottom: 1px; }
  .bio-card { padding: 16px 16px 18px; }
  .bio-card .bio-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .bio-card .bio-head .bio-title { font-size: 13px; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 6px; }
  .bio-card .bio-head .bio-title svg { width: 14px; height: 14px; color: var(--primary); }
  .bio-card .bio-head .md-badge { font-size: 9.5px; font-weight: 700; color: var(--primary-dim); background: var(--primary-soft); padding: 2px 7px; border-radius: var(--r-full); letter-spacing: .04em; font-family: var(--font-num); }
  .cert-card { margin-left:0; margin-right:0; margin-top:6px; }
  .group .row .value { color: var(--text-1); font-size: 13px; }
</style>

<script>
(function () {
  window.__ROOT__ = '../../';
  var id = new URLSearchParams(location.search).get('id') || 'p-jzs1';
  var p = MOCK.personById(id);
  var UNLOCK_KEY = 'engchain-personal-unlocks';

  /* ---- 解锁状态检测 ---- */
  function isUnlocked() {
    /* 调试参数 ?unlock=1 可直接预览解锁态 */
    if (new URLSearchParams(location.search).get('unlock') === '1') return true;
    try {
      var list = JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]');
      if (list.indexOf(id) !== -1) return true;
    } catch (e) {}
    /* 个人专业入驻及以上自动解锁 */
    try {
      var st = JSON.parse(localStorage.getItem('engchain-state') || '{}');
      if (st.loggedIn === false) return false; /* 已退出登录 → 不再自动解锁 */
      if (st.member || (st.status && ['pro','enterprise','resident'].indexOf(st.status) !== -1)) return true;
    } catch (e) {}
    return false;
  }
  function saveUnlock() {
    try {
      var list = JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]');
      if (list.indexOf(id) === -1) list.push(id);
      localStorage.setItem(UNLOCK_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  /* ---- 头图 ---- */
  function chip(txt, cls) { return '<span class="tag ' + (cls || 'tag-gold') + '">' + txt + '</span>'; }
  document.getElementById('head').innerHTML =
    '<div class="card" style="margin-top:2px;padding:18px 16px;">' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
        '<div style="width:58px;height:58px;border-radius:16px;flex:none;background:linear-gradient(135deg,var(--primary),var(--primary-dim));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--text-inv);">' + (p.avatar || '个') + '</div>' +
        '<div style="flex:1;min-width:0;"><div class="fs-title fw-700 elip" style="color:var(--text-1);">' + p.name + '</div>' +
          '<div class="text-2 fs-12" style="margin-top:3px;">' + (p.title || p.industry) + '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' + chip('✓ 实名认证', 'tag-gold') + chip(p.industry, 'tag-gray') + chip('在职 · ' + (p.experience || ''), 'tag-primary') + '</div></div>' +
      '</div>' +
      '<div class="fb-between" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">' +
        '<span class="text-2 fs-13"><svg class="ic" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;"><use href="#i-pin"/></svg>' + p.location + '</span>' +
        '<span class="text-2 fs-13"><svg class="ic" style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;"><use href="#i-card"/></svg>' + (p.mainBusiness || p.industry) + '</span>' +
      '</div>' +
    '</div>';

  /* ---- 个人认证卡片 ---- */
  function dimIcon(k) {
    var map = { '资质': 'shield', '从业': 'clock', '信用': 'check', '服务': 'star' };
    for (var key in map) { if ((k || '').indexOf(key) > -1) return map[key]; }
    return 'check';
  }
  function personalCert(p) {
    var dims = p.dims || [];
    var certs = p.certs || [];
    var tags = p.tags || [];
    var basic = [
      { k: '姓名', v: p.name || '' },
      { k: '性别', v: p.gender || '' },
      { k: '年龄', v: (p.age ? p.age + ' 岁' : '') },
      { k: '学历', v: p.education || '' },
      { k: '从业年限', v: p.experience || '' },
      { k: '在职状态', v: '在职', ok: true }
    ];
    var gw = dims.length ? (100 / dims.length) : 25;
    var formula = dims.map(function (d) { return d.k + '(' + Math.round(gw) + '%)×' + d.v; }).join(' + ');
    var avg = dims.length ? (dims.reduce(function (a, d) { return a + parseFloat(d.v); }, 0) / dims.length) : 0;
    return '<div class="cert-card">' +
      '<div class="cert-header">' +
        '<div class="cert-badge-wrap"><div class="cert-seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg></div>' +
          '<div class="cert-badge-text"><div class="cert-badge-title">' + (p.name || '平台认证用户') +
            '<svg class="verified-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div>' +
          '<div class="cert-badge-sub">ENGCHAIN 官方认证 · 信息已核验</div>' +
          '<div class="cert-badge-meta">' + (p.industry || '工程服务') + ' · 实名存续 · 平台年度核验</div></div></div>' +
        '<div class="cert-score"><div class="cert-score-row"><span class="cert-score-num">' + (p.score && p.score.value) + '</span><span class="cert-score-max">/10</span></div>' +
          '<div class="cert-score-label">GEO 综合评分</div>' +
          '<div class="cert-score-grade">✦ ' + ((p.score && p.score.grade) || '—') + '</div></div>' +
      '</div>' +
      '<div class="cert-tags">' + tags.map(function (t) {
        return '<span class="cert-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-' + (t.ic || 'check') + '"/></svg>' + t.t + '</span>';
      }).join('') +
        (p.reviewCount ? '<span class="cert-tag review">' + p.reviewCount + '条个人评价</span>' : '') + '</div>' +
      '<div class="cert-mid"><div class="cert-divider"></div><div class="cert-dimensions">' +
        dims.map(function (d) {
          return '<div class="cert-dim"><div class="cert-dim-top"><span class="cert-dim-name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#i-' + dimIcon(d.k) + '"/></svg>' + d.k + '</span><span class="cert-dim-val">' + d.v + '</span></div>' +
            '<div class="cert-dim-bar"><div class="cert-dim-fill" style="width:' + (d.s || 0) + '%"></div></div></div>';
        }).join('') + '</div></div>' +
      '<div class="cert-detail"><div class="cert-detail-inner">' +
        '<div class="cert-detail-section"><div class="cert-detail-title">个人基本信息</div><div class="cert-detail-grid">' +
          basic.map(function (b) {
            return '<div class="cert-detail-item"><span class="cdi-label">' + b.k + '</span><span class="cdi-value' + (b.ok ? ' cdi-success' : '') + '">' + b.v + '</span></div>';
          }).join('') + '</div></div>' +
        '<div class="cert-detail-section"><div class="cert-detail-title">认证项目清单</div><div class="cert-cert-list">' +
          certs.map(function (ct) {
            return '<div class="cert-cert-item"><span class="cci-icon">✓</span><span class="cci-name">' + ct.name + '</span><span class="cci-date">' + ct.date + '</span></div>';
          }).join('') + '</div></div>' +
        '<div class="cert-detail-section"><div class="cert-detail-title">GEO 评分计算说明</div><div class="cert-score-formula">' +
          '<p>综合评分 = ' + formula + '</p><p class="cert-score-result">≈ <strong>' + avg.toFixed(1) + '</strong>' + ((p.score && p.score.grade) ? '（' + p.score.grade + '）' : '') + '</p>' +
          '<p class="cert-score-note">数据来源：全国建筑市场监管公共服务平台、个人实名核验系统、平台交易数据，每日更新</p></div></div>' +
      '</div></div>' +
      '<div class="cert-footer">' +
        '<div class="cert-verify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>区块链存证 · 可在线验证</div>' +
        '<div class="cert-id">' + (p.certId || '') + '</div>' +
      '</div>' +
      '<div class="cert-toggle"><span>查看资质评分</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>' +
    '</div>';
  }
  document.getElementById('cert').innerHTML = personalCert(p);

  /* ---- 个人数据 ---- */
  var pub = (p.published || []).length;
  var stats = [
    { n: pub, l: '发布供需' },
    { n: (pub * 2), l: '成交订单' },
    { n: p.reviewCount, l: '个人评价' },
    { n: 12, l: '在促合作' }
  ];
  document.getElementById('stats').innerHTML = '<div style="display:flex;">' + stats.map(function (s, i) {
    return '<div style="flex:1;text-align:center;' + (i ? 'border-left:1px solid var(--line);' : '') + '"><div class="mono fw-700" style="font-size:19px;color:var(--primary);">' + s.n + '</div><div class="fs-11 text-2" style="margin-top:2px;">' + s.l + '</div></div>';
  }).join('') + '</div>';

  /* ---- 轻量 Markdown 渲染器（离线内联，支持标题/粗体/斜体/列表/引用/链接/代码/分割线） ---- */
  function renderMarkdown(text) {
    if (!text) return '';
    var lines = text.split('\n');
    var html = '';
    var i = 0;
    function inline(str) {
      str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      str = str.replace(/`([^`]+)`/g, '<code>$1</code>');
      str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      str = str.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      str = str.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return str;
    }
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (/^---+$/.test(line.trim())) { html += '<hr>'; i++; continue; }
      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { var lv = h[1].length; html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'; i++; continue; }
      if (/^>\s?/.test(line)) {
        var q = '';
        while (i < lines.length && /^>\s?/.test(lines[i])) { q += (q ? ' ' : '') + lines[i].replace(/^>\s?/, ''); i++; }
        html += '<blockquote>' + inline(q) + '</blockquote>'; continue;
      }
      if (/^[-*]\s+/.test(line)) {
        html += '<ul>';
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^[-*]\s+/, '')) + '</li>'; i++; }
        html += '</ul>'; continue;
      }
      if (/^\d+\.\s+/.test(line)) {
        html += '<ol>';
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\d+\.\s+/, '')) + '</li>'; i++; }
        html += '</ol>'; continue;
      }
      var para = '';
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|>\s?|[-*]\s|\d+\.\s|---+$)/.test(lines[i])) { para += (para ? ' ' : '') + lines[i]; i++; }
      html += '<p>' + inline(para) + '</p>';
    }
    return html;
  }

  /* ---- 核心信息渲染 ---- */
  function maskPhone(full) {
    if (!full || full.length < 7) return full || '';
    return full.slice(0, 3) + '****' + full.slice(-4);
  }
  function renderCore(unlocked) {
    var section = document.getElementById('core-section');
    var overlay = document.getElementById('lock-overlay');
    var statusEl = document.getElementById('unlock-status');
    if (unlocked) {
      section.classList.remove('locked');
      overlay.style.display = 'none';
      statusEl.innerHTML = '<span class="unlocked-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>已解锁</span>';
      document.getElementById('phone-value').textContent = p.phone || '';
    } else {
      section.classList.add('locked');
      overlay.style.display = 'flex';
      statusEl.innerHTML = '';
      document.getElementById('phone-value').textContent = maskPhone(p.phone);
    }
    document.getElementById('bio-text').innerHTML = renderMarkdown(p.bio || '');
    document.getElementById('projects-list').innerHTML = (p.projects || []).map(function (pr) {
      return '<div class="proj-card">' +
        '<div class="pc-top"><div class="pc-name">' + pr.name + '</div><span class="pc-role">' + pr.role + '</span></div>' +
        '<div class="pc-meta"><span>' + pr.scale + '</span><span>' + pr.year + '</span></div>' +
        '<div class="pc-desc">' + pr.desc + '</div>' +
      '</div>';
    }).join('');
    if (p.profileFile) {
      document.getElementById('file-name').textContent = p.profileFile.name || '';
      document.getElementById('file-size').textContent = p.profileFile.size || '';
    }
  }

  /* ---- 资质与业绩 ---- */
  var info = [
    { k: '注册专业', v: p.title || '' },
    { k: '注册证书编号', v: p.registerNo || '', mono: 1 },
    { k: '职称', v: '工程师（建筑工程）' },
    { k: '从业年限', v: p.experience || '' },
    { k: '学历', v: p.education || '' },
    { k: '所在地', v: p.location || '' }
  ];
  document.getElementById('info').innerHTML = info.map(function (r) {
    return '<div class="row"><span class="label">' + r.k + '</span><span class="value ' + (r.mono ? 'mono' : '') + '" style="text-align:right;margin-left:auto;max-width:60%;">' + r.v + '</span></div>';
  }).join('');

  /* ---- 该用户发布的供需 ---- */
  var list = (p.published || []).map(function (idStr) { return MOCK.listingById(idStr); }).filter(Boolean);
  document.getElementById('published').innerHTML = list.map(function (s) {
    var cls = s.dir === 'demand' ? 'tag-blue' : s.dir === 'supply' ? 'tag-primary' : 'tag-gold';
    var lbl = s.dir === 'demand' ? '需求' : s.dir === 'supply' ? '供应' : '机会';
    return '<a href="../supply/detail.html?id=' + s.id + '" class="supply-card"><div class="sc-top"><span class="tag ' + cls + '">' + lbl + '</span>' +
      '<span class="match-pill match-high" style="margin-left:auto;">' + s.match + '%</span></div>' +
      '<div class="sc-title elip">' + s.title + '</div>' +
      '<div class="sc-foot"><span class="sc-price" style="font-size:14px;">' + (s.dir === 'demand' ? s.budget : (s.price || s.budget)) + '</span>' +
      '<span class="sc-loc"><svg class="ic" style="width:12px;height:12px;vertical-align:-1px;margin-right:2px;"><use href="#i-pin"/></svg>' + s.location + '</span></div></a>';
  }).join('');

  /* ---- 解锁流程 (M3: 统一积分体系，取代旧 ¥ 条目包/专业版会员) ---- */
  function freeQuotaInfoP() {
    var st = window.deriveStatus ? deriveStatus() : 'registered';
    var allow = (st === 'realname' || st === 'pro' || st === 'enterprise' || st === 'resident');
    var monthly = (window.RULE ? RULE('credits.freeQuota.monthly', 5) : ((MOCK.business.credits && MOCK.business.credits.freeQuota) ? MOCK.business.credits.freeQuota.monthly : 5));
    if (window.ModeStore && ModeStore.isBreakIn()) monthly += ((MOCK.business.breakin || {}).registerBonus) || 0;
    var used = window.CreditStore ? CreditStore.freeUsed() : 0;
    return { allow: allow, remain: allow ? Math.max(monthly - used, 0) : 0 };
  }
  function openUnlockSheet() {
    var sh = UI.sheet();
    sh.setText('解锁查看全部核心信息');
    var cost = (MOCK.business.credits && MOCK.business.credits.consume && MOCK.business.credits.consume.material) || 98;
    var disc = window.creditDiscount ? creditDiscount() : 1;
    var costP = Math.round(cost * disc);
    var fq = freeQuotaInfoP();
    var bal = window.CreditStore ? CreditStore.read().balance : 0;
    var freeBtn = (fq.allow && fq.remain > 0);
    var btnText = freeBtn ? '免费解锁（本月剩 ' + fq.remain + ' 条）' : (bal >= costP ? '扣 ' + costP + ' 积分解锁（余额 ' + bal + '）' : '积分不足 · 去充值');
    var priceHtml = freeBtn
      ? '<div class="fw-600" style="font-size:16px;color:var(--success);margin-top:6px;">本月免费额度可用</div>'
      : '<div class="mono fw-700" style="font-size:22px;color:var(--primary);margin-top:6px;">' + costP + ' 积分' + (disc < 1 ? ' <span style="font-size:11px;color:var(--text-3);">会员' + Math.round(disc * 10) + '折</span>' : '') + '</div>';
    sh.html(
      '<div style="padding:4px 4px 16px;">' +
        '<div style="font-size:12.5px;color:var(--text-2);line-height:1.65;margin-bottom:14px;">解锁后可查看该用户的<b style="color:var(--text-1);">完整联系方式、个人介绍、项目案例及个人简介文件</b>，解锁即获沟通权，平台不售卖联系方式。</div>' +
        '<div style="text-align:center;">' + priceHtml +
          '<div style="font-size:11px;color:var(--text-3);margin-top:8px;">账户余额 ' + bal + ' 积分 · 实名用户每月免费额度 ' + (function(){var m=(window.RULE?RULE('credits.freeQuota.monthly',5):((MOCK.business.credits&&MOCK.business.credits.freeQuota)?MOCK.business.credits.freeQuota.monthly:5));if(window.ModeStore&&ModeStore.isBreakIn())m+=((MOCK.business.breakin||{}).registerBonus)||0;return m;})() + ' 条</div>' +
        '</div>' +
        '<div class="unlock-note">积分用于解锁供需详情，可在「钱包 · 积分」充值<br>' + (window.RULE ? RULE('refund.days', 7) : 7) + '天无理由退款保障 · 客服 400-000-0000</div>' +
        '<button class="btn btn-primary btn-block btn-lg" id="confirm-unlock" style="margin-top:14px;">' + btnText + '</button>' +
      '</div>'
    );
    sh.show();
    sh.body().querySelector('#confirm-unlock').addEventListener('click', function () {
      sh.close();
      if (freeBtn) { CreditStore.freeSpend(1); saveUnlock(); renderCore(true); UI.toast('已使用免费解锁额度 1 条', 'ok'); return; }
      if (bal >= costP) { CreditStore.consume(costP, '解锁' + (p.name || '')); saveUnlock(); renderCore(true); UI.toast('已扣 ' + costP + ' 积分解锁', 'ok'); return; }
      UI.toast('积分不足，请先充值', 'warn');
      setTimeout(function () { location.href = '../../pages/wallet/credits.html'; }, 700);
    });
  }

  /* ---- 事件绑定 ---- */
  document.getElementById('unlock-btn').addEventListener('click', openUnlockSheet);
  document.getElementById('profile-file').addEventListener('click', function () {
    if (!isUnlocked()) { openUnlockSheet(); return; }
    UI.toast('正在打开简介文件...', 'ok');
  });
  document.getElementById('contact-btn').addEventListener('click', function () {
    if (!isUnlocked()) {
      UI.dialog({
        title: '需要解锁',
        text: '联系该用户需要先解锁核心信息（含完整联系方式）。是否前往解锁？',
        ok: '前往解锁',
        cancel: '取消',
        onOk: openUnlockSheet
      });
      return;
    }
    UI.toast('已发起联系，等待对方确认', 'ok');
  });

  /* ---- 初始渲染 ---- */
  renderCore(isUnlocked());
  /* 跨 tab 自动重渲染：周期切换/积分变动后免费额度自动刷新 */
  window.addEventListener('engchain:mode', function () { renderCore(isUnlocked()); });
  window.addEventListener('engchain:credits', function () { renderCore(isUnlocked()); });
  window.addEventListener('engchain:store-change', function () { renderCore(isUnlocked()); });
  /* 调试参数 ?scroll=bio 自动滚动到个人介绍区域 */
  if (new URLSearchParams(location.search).get('scroll') === 'bio') {
    setTimeout(function () {
      var sc = document.querySelector('.scroll');
      var card = document.querySelector('.bio-card');
      if (sc && card) { sc.scrollTop = card.offsetTop - 20; }
    }, 200);
  }
})();
</script>
</body>
</html>
