<script>
(function () {
  window.__ROOT__ = '../../';
  var id = new URLSearchParams(location.search).get('id') || '1001';
  /* from=market：服务广场来源 → CTA 变为「在线下单」（金额从报价带入） */
  window.__AGENCY_MARKET__ = new URLSearchParams(location.search).get('from') === 'market';
  var rec = MOCK.listingById(id);

  /* P1.5：id 不在 catalog 但存在于 SupplyStore（用户发布/后台审核已上架条目）
     -> 归一化记录结构后直接渲染；SupplyStore 与 PublishStore 是两个独立 store，
       列表页 mergedList() 会混入 SupplyStore.listActive()，详情页必须同步支持 */
  if (!rec && window.SupplyStore) {
    var _BIZ_MAP = { '材料':'material','设备':'equipment','劳务':'labor','项目合作':'cooperation','合作':'cooperation','中介服务':'agency','中介':'agency','资质招商':'franchise','建企买卖':'trade','招聘':'personnel','求职':'talent' };
    var sup = SupplyStore.byId(id);
    if (sup) {
      var _isUser = (sup.source === 'user_publish' || sup.source === 'migrated_publish');
      /* 重组件渲染器不兼容的四类用户条目 → 通用发布渲染器；其余保持原业务渲染器（行为不变） */
      var _bk0 = sup.bizKey || _BIZ_MAP[sup.cat] || 'material';
      /* 动态字段映射层：判断用户发布条目是否包含编辑器提交的业务结构化数据 */
      var _hasRich = !!(sup.mat || sup.equip || sup.labor || sup.fc || sup.tradeDetail || sup.agencyDetail || sup.personnelDetail || sup.talentDetail || sup.coop);
      /* 含结构化数据的用户条目走专业渲染器；无结构化数据的四类+缺serveType的中介仍降级为通用渲染器 */
      var _bk = ((_isUser && (_bk0 === 'trade' || _bk0 === 'franchise' || _bk0 === 'personnel' || _bk0 === 'talent') && !_hasRich) || (_bk0 === 'agency' && !sup.serveType && !_hasRich)) ? 'publish' : _bk0;
      rec = Object.assign({}, sup, {
        bizKey: _bk,
        dir: sup.dir || sup.type || 'demand',
        title: sup.title || '',
        cat: sup.cat || sup.category || '',
        category: sup.category || sup.cat || '',
        sub: sup.sub || sup.subType || '',
        subType: sup.subType || sup.sub || '',
        city: sup.city || sup.location || '',
        location: sup.location || sup.city || '',
        price: sup.price || sup.budget || '',
        budget: sup.budget || sup.price || '',
        amount: sup.amount || (sup.price ? (sup.price + (sup.unit ? ' ' + sup.unit : '')) : ''),
        unit: sup.unit || '',
        qty: sup.qty || '',
        tags: sup.tags || [],
        company: sup.company || '',
        desc: sup.desc || sup.description || '',
        description: sup.description || sup.desc || '',
        verified: sup.verified !== undefined ? sup.verified : !_isUser,
        match: typeof sup.match === 'number' ? sup.match : (_isUser ? 55 : 70),

        contact: (sup.contact && typeof sup.contact === 'object') ? (sup.contact.name || '') : (sup.contact || ''),
        phone: (sup.contact && typeof sup.contact === 'object') ? (sup.contact.phone || '') : (sup.phone || ''),
        wechat: (sup.contact && typeof sup.contact === 'object') ? (sup.contact.wechat || '') : (sup.wechat || ''),
        address: sup.address || '',
        spec: sup.spec || '',
        delivery: sup.delivery || '',
        qualification: sup.qualification || '',
        requirement: sup.requirement || '',
        publisher: sup.publisher || '',
        source: sup.source || '',
        /* ===== 动态业务字段映射层 ===== */
        /* 嵌套对象透传：material/equipment/labor/franchise 专业渲染器读取嵌套对象 */

        equip: sup.equip || null,
        labor: sup.labor || null,
        fc: sup.fc || null,
        /* 嵌套对象展开为扁平字段：cooperation/trade/agency/personnel/talent 专业渲染器读取扁平字段 */
        coopModes: (sup.coop && sup.coop.coopModes) || sup.coopModes || [],

        fundStatus: (sup.coop && sup.coop.fundStatus) || sup.fundStatus || '',
        fundAmount: (sup.coop && sup.coop.fundAmount) || sup.fundAmount || '',
        payment: (sup.coop && sup.coop.payment) || sup.payment || [],

        coopProcess: (sup.coop && sup.coop.coopProcess) || sup.coopProcess || [],
        coopTimeline: (sup.coop && sup.coop.coopTimeline) || sup.coopTimeline || [],
        projectInfo: (sup.coop && sup.coop.projectInfo) || (sup.personnelDetail && sup.personnelDetail.projectInfo) || sup.projectInfo || [],
        /* trade 展开 */
        staffConfig: (sup.tradeDetail && sup.tradeDetail.staffConfig) || (sup.fc && sup.fc.staffConfig) || sup.staffConfig || [],
        qualPack: (sup.tradeDetail && sup.tradeDetail.qualPack) || (sup.fc && sup.fc.qualPack) || sup.qualPack || [],

        litigation: (sup.tradeDetail && sup.tradeDetail.litigation) || sup.litigation || '',
        hiddenDebtCommitment: (sup.tradeDetail && sup.tradeDetail.commitment) || sup.hiddenDebtCommitment || '',
        companyProfile: (sup.tradeDetail && sup.tradeDetail.companyProfile) || sup.companyProfile || [],
        /* agency 展开 */
        serveType: (sup.agencyDetail && sup.agencyDetail.serveType) || sup.serveType || [],
        quote: (sup.agencyDetail && sup.agencyDetail.quote) || sup.quote || null,
        serveProcess: (sup.agencyDetail && sup.agencyDetail.serveProcess) || sup.serveProcess || [],
        requiredMaterials: (sup.agencyDetail && sup.agencyDetail.requiredMaterials) || sup.requiredMaterials || [],
        staffPolicy: (sup.agencyDetail && sup.agencyDetail.staffPolicy) || sup.staffPolicy || [],

        /* personnel 展开 */
        jobDesc: (sup.personnelDetail && sup.personnelDetail.jobDesc) || sup.jobDesc || '',
        salaryStructure: (sup.personnelDetail && sup.personnelDetail.salaryStructure) || sup.salaryStructure || [],
        requirements: (sup.personnelDetail && sup.personnelDetail.requirements) || sup.requirements || [],

        intent: (sup.talentDetail && sup.talentDetail.intent) || sup.intent || [],
        certPack: (sup.talentDetail && sup.talentDetail.certPack) || sup.certPack || [],

        regStatus: (sup.talentDetail && sup.talentDetail.regStatus) || sup.regStatus || [],

        companyInfo: (sup.fc && sup.fc.companyInfo) || sup.companyInfo || [],

        /* 动态字段原始数据保留（用于调试和后续扩展） */
        dynamic: sup.dynamic || null
      });

  }

  if (!rec && window.PublishStore) {
    /* P2：id 不在目录但存在于发布信息存储 → 解析发布项；若其 sourceId 指向真实目录条目则优先展示目录丰富详情 */
    var stored = PublishStore.getRecordById(id);

      var src = stored.sourceId != null ? stored.sourceId : stored.id;
      var cat = MOCK.listingById(src);
      if (cat && String(src) !== String(stored.id)) rec = cat;
      else rec = Object.assign({}, stored, { bizKey: 'publish' });
    }
  }
  if (!rec) {
    /* P0：id 失效/不存在 → 正式空状态页（不再错误回退到其他类别详情） */
    var nt = document.getElementById('nav-title'); if (nt) nt.textContent = '内容不存在';

  /* ===== 页面级后处理（不改共享 detail.js） ===== */
  /* UX-031：Hero 数据条单位重复（"10年年 工作年限"），统一折叠为单个"年" */
