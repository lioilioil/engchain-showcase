(function () {

      '运输': ['面议','1万以下','1-5万'],

      '建企买卖': ['20-100万','100万以上'],
      '招聘': ['面议','1万以下','1-5万'],
      '求职': ['面议','1万以下','1-5万']
    }
  };
  /* 一级 tab 的二级分类（资源/供需/服务；供需方向在筛选弹窗中选择） */
  var SUBTABS = {
    resource: [{ key: 'all', label: '全部' }, { key: 'franchise', label: '资质招商' }, { key: 'trade', label: '建企买卖' }, { key: 'personnel', label: '企业招聘' }, { key: 'talent', label: '人才求职' }],
    biz: [{ key: 'all', label: '全部' }, { key: 'material', label: '材料' }, { key: 'equipment', label: '设备' }, { key: 'labor', label: '劳务' }, { key: 'transport', label: '运输' }],
    service: [{ key: 'all', label: '全部' }, { key: '资质代办', label: '资质代办' }, { key: '工程担保', label: '工程担保' }, { key: '造价咨询', label: '造价咨询' }, { key: '企业服务', label: '企业服务' }]
  };
  /* 服务子类关键词匹配 */
  var SERVICE_KEYS = {
    '资质代办': ['资质', '代办', '升级', '安许', '新办', '延期', '分立'],
    '工程担保': ['担保', '保函', '履约', '投标'],
    '造价咨询': ['造价', '咨询', '结算', '审核', '审计'],
    '企业服务': ['工商', '注册', '劳务', '招标', '代理', '服务']
  };
  function matchService(item, key) {
    if (key === 'all') return true;
    var hay = (item.sub || '') + ' ' + (item.title || '') + ' ' + (item.serveType || '');
    var keys = SERVICE_KEYS[key] || [key];
    for (var i = 0; i < keys.length; i++) if (hay.indexOf(keys[i]) >= 0) return true;
    return false;
  }

  /* 确定性匹配度：按 id 哈希在 62-96 间取值，避免所有卡片统一显示 70% 失去区分度 */
  function varyMatch(x) {
    if (typeof x.match === 'number' && x.match > 0) return x.match;
    var h = 0, s = String(x.id || x.title || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return 62 + (h % 35);
  }
  /* [分片C P0-02] 分组键：优先 DataBus.resolveType(s).bizKey，回退记录自带 bizKey / 中文品类映射；
     仅用于列表 tab/筛选分组，不参与卡片分发（分发在 common.js Cards 内完成），不臆造类型。 */
  function bizOf(s) {
    if (window.DataBus && DataBus.resolveType) {
      var m = DataBus.resolveType(s);
      if (m && m.bizKey) return m.bizKey;
    }
    return s.bizKey || BIZ_MAP[s.cat] || '';
  }
  /* 角色（供/需）：resolveType → role → dir/type */
  function roleOf(s) {
    if (window.DataBus && DataBus.resolveType) {
      var m = DataBus.resolveType(s);
      if (m && m.role) return m.role;
    }
    return s.role || s.dir || s.type || '';
  }
  function normSupplyItem(x) {
    var isUser = (x.source === 'user_publish' || x.source === 'migrated_publish');
    var meta = (window.DataBus && DataBus.resolveType) ? DataBus.resolveType(x) : null;
    /* [V2 回修 V-P1-01] 记录自带的 role/detailLevel/typeKey 优先，仅在缺失时才用
       resolveType(TYPE_MAP) 回填，避免把已是 detail 的记录反查覆盖成 brief。 */
    return Object.assign({}, x, {
      id: x.id,
      role: x.role || x.dir || x.type || (meta ? meta.role : ''),
      detailLevel: x.detailLevel || (meta ? meta.detailLevel : ''),
      typeKey: x.typeKey || x.pubType || (meta ? meta.typeKey : '') || '',
      match: typeof x.match === 'number' ? x.match : (isUser ? 55 : varyMatch(x)),
      verified: x.verified !== undefined ? x.verified : !isUser,
      hot: x.hot || false
    });
  }
  /* [V2 回修 V-P1-05] 解析当前登录身份。发布记录 publisher 写的是用户表 id（如 u1），
     而 engchain-state.account 是登录账号串（邮箱/手机），两者口径不同；直接拿 account 比
     publisher 必然不等，导致本人待审被当他人丢弃。统一经 DataBus.current() 同时取
     id/account/name/mobile 做比对。 */
  function currentSelf() {
    try {
      if (window.DataBus && DataBus.current) {
        var u = DataBus.current();
        if (u) return { id: u.id || '', account: u.account || '', name: u.name || '', mobile: u.mobile || u.phone || '' };
      }
      var st = JSON.parse(localStorage.getItem('engchain-state') || '{}');
      return { id: '', account: st.account || '', name: st.user || st.name || '', mobile: st.mobile || '' };
    } catch (e) { return { id: '', account: '', name: '', mobile: '' }; }
  }
  function isSelfPending(x, me) {
    if (x.status !== 'pending_review' || !me) return false;
    var cand = [x.publisher, x.publisherId, x.owner].map(String);
    var selfVals = [me.id, me.account, me.name, me.mobile].filter(Boolean).map(String);
    return cand.some(function (c) { return c && selfVals.indexOf(c) >= 0; });
  }
  /* [分片C P0-01/P0-05][V2] 统一走 DataBus.getListing({scope:'mine', includePending:true})；
     不传 ownerId（数据层 listMinePending 只认 publisher id，account 口径不匹配会先被过滤），

  function mergedList() {

        catch (e) { console.warn('mergedList: skip bad supply item', e, x); }

        m[c.name] = { grade: c.grade || (c.score && c.score.grade), riskFlag: c.riskFlag || '' };
      });
    } catch (e) {}
    return m;
  }
  function buildUserMap() {
    var m = {};
    try {
      var users = DataBus.users() || [];
      var orders = DataBus.orders() || [];
      /* 每个用户的成交记录（settled 订单） */
      var dealt = {};
      orders.forEach(function (o) {
        if (o.status === 'settled') { dealt[o.owner] = true; if (o.counterpartyId) dealt[o.counterpartyId] = true; }
      });
      users.forEach(function (u) {
        /* 演示：u6（刘洋，30天未活跃注册会员）标记为处罚中+观察档，用于演示负向降权 */
        var punished = (u.id === 'u6');
        var creditLevel = punished ? '观察' : (u.id === 'u1' ? '金' : (u.id === 'u2' ? '银' : ''));
        m[u.id] = {
          entryTypes: (u.entry && u.entry.types) || [],
          authLevel: (u.auth && u.auth.enterprise && u.auth.enterprise.ok) ? 'full' : ((u.auth && u.auth.realname && u.auth.realname.ok) ? 'basic' : ''),
          status: u.status,
          hasAnnual: false,
          hasDeal: !!dealt[u.id],
          punished: punished,
          creditLevel: creditLevel
        };
      });
    } catch (e) {}
    return m;
  }
  function buildPrefs() {
    try {
      if (window.MatchStore) return MatchStore.read().preferences || {};
    } catch (e) {}
    return {};
  }

  /* ---- 一级分类切换 + 二级分类栏 ---- */
  var segs = document.querySelectorAll('.discover-seg .seg-item');
  var subBar = document.getElementById('discover-sub');
  var sub = params.get('cat') || 'all';
  function setSeg() {
    segs.forEach(function (el) { el.classList.toggle('active', el.dataset.t === type); });
  }
  function renderSubs() {
    var defs = SUBTABS[type];
    if (!defs) { subBar.style.display = 'none'; return; } /* type=all 时保留 cat 参数（16 类快捷入口） */
    subBar.style.display = '';
    subBar.innerHTML = defs.map(function (d) {
      return '<span class="sub-chip' + (sub === d.key ? ' on' : '') + '" data-k="' + d.key + '">' + d.label + '</span>';
    }).join('');
  }
  subBar.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.sub-chip') : null;
    if (!chip) return;
    sub = chip.getAttribute('data-k');
    renderSubs();
    filterState = getDefaultFilter();
    filterDraft = getDefaultFilter();
    updateFilterBadge();
    render();
  });
  segs.forEach(function (el) {
    el.addEventListener('click', function () {
      // 行业咨询直接跳转
      if (el.dataset.t === 'industry') {
        location.href = '../industry/index.html';
        return;
      }
      type = el.dataset.t;
      sub = 'all';
      setSeg();
      renderSubs();
      /* 切换分类时重置筛选 */
      filterState = getDefaultFilter();
      filterDraft = getDefaultFilter();
      updateFilterBadge();
      render();
      history.replaceState({}, '', '?type=' + type);
    });
  });

  /* ---- 排序：气泡弹窗 ---- */
  var sortBy = 'smart';
  var sortBtn = document.getElementById('sort-btn');
  var sortPopover = document.getElementById('sort-popover');
  sortBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = sortPopover.style.display !== 'none';
    sortPopover.style.display = isOpen ? 'none' : 'block';
  });
  document.addEventListener('click', function (e) {
    if (!sortPopover.contains(e.target) && e.target !== sortBtn) {
      sortPopover.style.display = 'none';
    }
  });
  document.querySelectorAll('.sort-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      sortBy = opt.dataset.sort;
      document.querySelectorAll('.sort-opt').forEach(function (o) { o.classList.toggle('active', o === opt); });
      sortPopover.style.display = 'none';
      render();
    });
  });

  /* ---- 筛选面板：根据当前分类动态生成 ---- */
  function getDefaultFilter() {
    return { dir: '全部', category: '全部', city: '全部', budget: '全部', verified: '全部' };
  }
  var filterState = getDefaultFilter();
  var filterDraft = getDefaultFilter();

  function getFilterConfig() {
    if (type === 'resource' && sub !== 'all' && RESOURCE_FILTERS[sub]) return RESOURCE_FILTERS[sub];
    if (type === 'service') return MATCH_FILTERS;
    return MATCH_FILTERS;
  }
  function renderFilterGroups() {
    var cfg = getFilterConfig();
    var linkKey = (type === 'resource' && sub !== 'all' && RESOURCE_FILTERS[sub]) ? sub : 'match';
    var link = BUDGET_LINK[linkKey] || null;
    var groups = [
      { key: 'dir', label: '方向', options: ['全部', '供应（我提供）', '需求（我需要）'] },
      { key: 'category', label: '分类', options: cfg.category },
      { key: 'city', label: '地区', options: cfg.city },
      { key: 'budget', label: sub === 'talent' ? '薪资' : '预算', options: cfg.budget },
      { key: 'verified', label: '认证', options: cfg.verified }
    ];
    var html = groups.map(function (g) {
      var opts = g.options.map(function (o) {
        var active = filterDraft[g.key] === o;
        var disabled = '';
        if (g.key === 'budget' && o !== '全部' && link && filterDraft.category !== '全部' && link[filterDraft.category] && link[filterDraft.category].indexOf(o) === -1) disabled = ' disabled';
        return '<span class="fs-tag' + (active ? ' selected' : '') + disabled + '" data-g="' + g.key + '" data-v="' + o + '">' + o + '</span>';
      }).join('');
      return '<div class="filter-group"><div class="filter-group-label">' + g.label + '</div><div>' + opts + '</div></div>';
    }).join('');
    document.getElementById('filter-groups').innerHTML = html;
    document.querySelectorAll('.fs-tag').forEach(function (el) {
      el.addEventListener('click', function () {
        if (el.classList.contains('disabled')) return;
        filterDraft[el.dataset.g] = el.dataset.v;
        /* 切换分类时自动清理不适用该分类的预算/薪资筛选 */
        if (el.dataset.g === 'category' && link && filterDraft.category !== '全部' && link[filterDraft.category] && link[filterDraft.category].indexOf(filterDraft.budget) === -1) filterDraft.budget = '全部';
        renderFilterGroups();
      });
    });
  }

  window.openFilter = function () {
    filterDraft = { dir: filterState.dir, category: filterState.category, city: filterState.city, budget: filterState.budget, verified: filterState.verified };
    /* 打开弹窗时清理不适用当前分类的预算/薪资筛选 */
    var cfg0 = getFilterConfig();
    var linkKey0 = (type === 'resource' && sub !== 'all' && RESOURCE_FILTERS[sub]) ? sub : 'match';
    var link0 = BUDGET_LINK[linkKey0] || null;
    if (link0 && filterDraft.category !== '全部' && link0[filterDraft.category] && link0[filterDraft.category].indexOf(filterDraft.budget) === -1) filterDraft.budget = '全部';
    renderFilterGroups();
    var ov = document.getElementById('filter-overlay');
    ov.style.display = 'block';
    requestAnimationFrame(function () { document.getElementById('filter-sheet').style.transform = 'translateY(0)'; });
  };
  window.closeFilter = function () {
    document.getElementById('filter-sheet').style.transform = 'translateY(100%)';
    setTimeout(function () { document.getElementById('filter-overlay').style.display = 'none'; }, 300);
  };
  window.resetFilter = function () {
    filterDraft = getDefaultFilter();
    renderFilterGroups();
  };
  /* E2-08：空态"重置筛选"——直接重置已生效筛选并刷新列表 */
  window.resetEmptyFilter = function () {
    filterState = getDefaultFilter();
    filterDraft = getDefaultFilter();
    renderFilterGroups();
    updateFilterBadge();
    render();
  };
  window.applyFilter = function () {
    filterState = { dir: filterDraft.dir, category: filterDraft.category, city: filterDraft.city, budget: filterDraft.budget, verified: filterDraft.verified };
    updateFilterBadge();
    render();
    closeFilter();
  };
  function updateFilterBadge() {
    var cnt = 0;
    if (filterState.dir !== '全部') cnt++;
    if (filterState.category !== '全部') cnt++;
    if (filterState.city !== '全部') cnt++;
    if (filterState.budget !== '全部') cnt++;
    if (filterState.verified !== '全部') cnt++;
    var badge = document.getElementById('filter-cnt');
    if (cnt > 0) { badge.style.display = 'inline-block'; badge.textContent = cnt; }
    else badge.style.display = 'none';
  }
  document.getElementById('filter-btn').addEventListener('click', openFilter);

  /* ---- 预算/薪资范围匹配 ---- */
  function matchBudget(item, budget) {
    if (budget === '全部') return true;
    /* P1-2：新记录优先用持久化的 priceNum 数值口径（面议=0）；历史记录回退字符串解析 */
    var val = (typeof item.priceNum === 'number') ? item.priceNum : parseFloat((item.price || item.budget || '').toString().replace(/[^0-9.]/g, ''));
    if (budget === '面议') return !val || val === 0;
    if (isNaN(val) || val === 0) return false;
    /* 通用万级区间 */
    var ranges = {
      '1万以下': [0, 1], '1-5万': [1, 5], '5-20万': [5, 20], '20-100万': [20, 100], '100万以上': [100, Infinity],
      '10万以下': [0, 10], '10-50万': [10, 50], '50万以上': [50, Infinity],
      '50万以下': [0, 50], '50-200万': [50, 200], '200-500万': [200, 500], '500万以上': [500, Infinity],
      '5千以下': [0, 0.5], '5千-1万': [0.5, 1], '1-2万': [1, 2], '2万以上': [2, Infinity]
    };
    var r = ranges[budget];
    if (!r) return true;
    return val >= r[0] && val < r[1];
  }

  /* ---- 主渲染 ---- */
  function render() {
    try {
    var list = mergedList();

    /* 按一级分类 + 二级分类筛选（分组键走 resolveType 兜底，不臆造类型） */
    if (type === 'resource') {
      var RES_KEYS = ['franchise', 'trade', 'personnel', 'talent'];
      list = list.filter(function (s) { return RES_KEYS.indexOf(bizOf(s)) >= 0; });
      if (sub !== 'all') list = list.filter(function (s) { return bizOf(s) === sub; });
    } else if (type === 'biz') {
      /* 供需聚合 tab：材料/设备/劳务/运输 供+需混合，方向由筛选弹窗单选 */
      var BIZ_KEYS = ['material', 'labor', 'equipment', 'transport'];
      list = list.filter(function (s) { return BIZ_KEYS.indexOf(bizOf(s)) >= 0; });
      if (sub !== 'all') list = list.filter(function (s) { return bizOf(s) === sub; });
    } else if (type === 'service') {
      list = list.filter(function (s) { return bizOf(s) === 'agency'; });
      list = list.filter(function (s) { return matchService(s, sub); });
    }
    /* type === 'all'：无一级品类过滤，但支持 cat 参数直达子类（cat 为中文品类名，需映射 bizKey） */
    if (type === 'all' && sub !== 'all') {
      var catBiz = BIZ_MAP[sub] || sub;
      list = list.filter(function (s) { return bizOf(s) === catBiz; });
    }

    /* 筛选条件（方向走 role 兜底 dir） */
    if (filterState.dir === '供应（我提供）') list = list.filter(function (s) { return roleOf(s) === 'supply'; });
    if (filterState.dir === '需求（我需要）') list = list.filter(function (s) { return roleOf(s) === 'demand'; });
    if (filterState.category !== '全部') {
      var bizKey = BIZ_MAP[filterState.category] || filterState.category;
      list = list.filter(function (s) { return bizOf(s) === bizKey; });
    }
    if (filterState.city !== '全部') list = list.filter(function (s) { return (s.city || s.location || '') === filterState.city || (s.city || s.location || '').indexOf(filterState.city) >= 0; });
    if (filterState.budget !== '全部') list = list.filter(function (s) { return matchBudget(s, filterState.budget); });
    if (filterState.verified === '已认证') list = list.filter(function (s) { return s.verified; });
    if (filterState.verified === '未认证') list = list.filter(function (s) { return !s.verified; });

    /* [V2 回修 V-P1-05] 本人待审卡从送排序的列表中拆出：Ranking.hardFilter 会无条件跳过
       pending_review（ranking.js:72），直接送排序会被丢弃；审核中卡单独保留并在排序后置顶，
       既绕过硬过滤，又不影响 active 结果的排序。他人 pending 已在 mergedList 门控剔除。 */
    var _me = currentSelf();
    var pendingSelf = list.filter(function (s) { return s.status === 'pending_review' && isSelfPending(s, _me); });
    list = list.filter(function (s) { return !(s.status === 'pending_review' && isSelfPending(s, _me)); });

    /* 排序 */
    var rankingOpts = {
      companyMap: buildCompanyMap(),
      userMap: buildUserMap(),
      prefs: buildPrefs(),
      bizKey: (sub !== 'all') ? sub : '',
      viewerDir: ''
    };
    /* D4: 假 distance 字符串 → 同城/省内/跨省标签 */
    try {
      var _pm = (window.Ranking && Ranking.cfg().provinceMap) || {};
      var _vc = rankingOpts.prefs.location || '成都';
      list.forEach(function (it) {
        var _c = (it.city || '').toString().split('·')[0].trim();
        if (!_c) { it.distance = ''; return; }
        if (_c === _vc) it.distance = '同城';
        else if (_pm[_c] && _pm[_vc] && _pm[_c] === _pm[_vc]) it.distance = '省内';
        else it.distance = '跨省';
      });
    } catch (e) {}
    if (sortBy === 'smart' && window.Ranking) {
      list = Ranking.sort(list, rankingOpts);
    } else {
      if (sortBy === 'newest') {
        list.sort(function (a, b) { return (b.ts || b.time || 0) - (a.ts || a.time || 0); });
      } else if (sortBy === 'near') {
        /* 同城优先：viewerCity 命中排前 */
        var vCity = rankingOpts.prefs.location || '成都';
        list.sort(function (a, b) {
          var aSame = (a.city === vCity) ? 1 : 0, bSame = (b.city === vCity) ? 1 : 0;
          if (aSame !== bSame) return bSame - aSame;
          return (b.ts || 0) - (a.ts || 0);
        });
      } else if (sortBy === 'trust') {
        list.sort(function (a, b) {
          var ta = (a.verified ? 1 : 0) + ((a._badge === '平台认证') ? 1 : 0);
          var tb = (b.verified ? 1 : 0) + ((b._badge === '平台认证') ? 1 : 0);
          if (ta !== tb) return tb - ta;
          return (b.match || 0) - (a.match || 0);
        });
      } else {
        list.sort(function (a, b) { return (b.match || 0) - (a.match || 0); });
      }
      /* 非智能模式下，置顶仍排最前（简单稳定排序） */
      try {
        if (window.UpgradeStore) {
          list.sort(function (a, b) {
            var ta = UpgradeStore.isActive('topListing', a.id) ? 1 : 0;
            var tb = UpgradeStore.isActive('topListing', b.id) ? 1 : 0;
            return tb - ta;
          });
        }
      } catch (e) {}
    }

    /* 本人审核中卡置顶（绕过 Ranking hardFilter 的 pending_review 丢弃） */
    list = pendingSelf.concat(list);

    document.getElementById('count').textContent = '共 ' + list.length + ' 条';
    var html = list.length
      ? window.Cards.render(list, 'detail.html?id=')
      : '<div class="empty-state"><div class="e-icon"><svg class="ic"><use href="#i-folder"/></svg></div><div class="e-title">暂无匹配</div><div class="e-desc">换个筛选条件试试吧</div>' +
        '<div style="margin-top:18px;display:flex;justify-content:center;"><button class="btn btn-primary" onclick="window.resetEmptyFilter()">重置筛选</button></div></div>';
    document.getElementById('list').innerHTML = html;

    /* 角标（方向/详细简要/认证/急热/审核中）已由 Cards.head 统一渲染；此处仅做置顶标签注入 */
    var cards = document.querySelectorAll('#list .job-card');
    /* [FEAT 9.2-1] 置顶标签注入 */
    try {
      if (window.UpgradeStore) {
        list.forEach(function (item, idx) {
          if (UpgradeStore.isActive('topListing', item.id) && cards[idx]) {
            var topTag = document.createElement('span');
            topTag.className = 'tag tag-gold';
            topTag.style.cssText = 'margin-left:6px;font-size:10px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:#fff;';
            topTag.textContent = '置顶';
            var tagsRow2 = cards[idx].querySelector('.jc-tags');
            if (tagsRow2) tagsRow2.insertBefore(topTag, tagsRow2.firstChild);
          }
        });
      }
    } catch (e) {}
    } catch (e) {
      console.error('render() error:', e);
      var listEl = document.getElementById('list');
      if (listEl) listEl.innerHTML = '<div class="empty-state"><div class="e-title">加载失败</div><div class="e-desc">请刷新页面重试</div></div>';
    }
  }

  setSeg();
  renderSubs();
  render();
  window.addEventListener('engchain:supply', function () { render(); });
  window.addEventListener('storage', function (e) { if (e.key === 'engchain-supply') render(); });
  /* [FEAT 9.2-4] 每日免费浏览摘要额度横幅 */
  (function(){
    function render(){
      if (!window.FreeQuotaStore) return;
      var el = document.getElementById("dq-remain");
      if (el) el.textContent = FreeQuotaStore.remaining();
    }
    render();
    window.addEventListener("engchain:free-quota", render);
  })();
  /* 手势优先级：在列表区左右滑 → 先滚一级分类条 → 再滚二级分类条 → 到头才切主页面 */
  window.__SWIPE_ZONES__ = window.__SWIPE_ZONES__ || [];
  window.__SWIPE_ZONES__.push({
    trigger: '.scroll.no-pad',
    consumers: [
      { type: 'scroll', el: '#discover-seg' },
      { type: 'scroll', el: '.discover-sub' }
    ]
  });
})();
</script>
