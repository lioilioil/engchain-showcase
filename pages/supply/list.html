<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/supply/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}

<style>
/* 发现页一级分类：横向滚动 seg */
.discover-seg { display: flex; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; gap: 0; padding: 0 16px; }
.discover-seg::-webkit-scrollbar { display: none; }
.discover-seg .seg-item { flex: 0 0 auto; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-2); border-bottom: 2px solid transparent; cursor: pointer; transition: color .2s, border-color .2s; white-space: nowrap; }
.discover-seg .seg-item.active { color: var(--primary-dim); border-bottom-color: var(--primary); font-weight: 600; }

/* 二级分类栏：横向滚动 chips */
.discover-sub { display: flex; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; gap: 6px; padding: 0 16px 10px; }
.discover-sub::-webkit-scrollbar { display: none; }
.sub-chip { flex: 0 0 auto; padding: 5px 13px; font-size: 11.5px; font-weight: 500; color: var(--text-2); background: var(--bg-card); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: all .15s; white-space: nowrap; }
.sub-chip.on { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-dim)); border-color: transparent; font-weight: 600; }

/* 排序气泡弹窗 */
.sort-popover { position: absolute; top: calc(100% + 6px); right: 0; background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 100; overflow: hidden; min-width: 100px; animation: sort-pop-in .18s ease; }
@keyframes sort-pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.sort-popover .sort-opt { display: block; width: 100%; padding: 10px 16px; font-size: 13px; color: var(--text-2); background: none; border: none; cursor: pointer; text-align: left; transition: background .15s; }
.sort-popover .sort-opt:hover { background: var(--bg-card-2); }
.sort-popover .sort-opt.active { color: var(--primary-dim); font-weight: 600; }
.sort-popover .sort-opt.active::after { content: '✓'; float: right; }

/* 筛选弹窗：顶部底部固定，内容滚动，最大80% */
.filter-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.4); }
.filter-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg); border-radius: 16px 16px 0 0; max-height: 80vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s ease; }
.filter-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.filter-header-title { font-size: 16px; font-weight: 700; color: var(--text-1); }
.filter-header-close { background: none; border: none; font-size: 22px; color: var(--text-3); cursor: pointer; line-height: 1; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.filter-header-close:active { background: var(--bg-card-2); }
.filter-body { flex: 1 1 auto; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.filter-footer { flex: 0 0 auto; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.filter-footer .btn-reset { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-card); color: var(--text-2); font-size: 14px; cursor: pointer; }
.filter-footer .btn-apply { flex: 2; height: 44px; border-radius: 12px; border: none; background: linear-gradient(135deg,var(--primary),var(--primary-dim)); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }

/* 筛选选项 */
.filter-group { margin-bottom: 18px; }
.filter-group-label { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 10px; }
.filter-opt { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; margin: 0 8px 8px 0; border: 1px solid var(--line); color: var(--text-2); background: var(--bg-card); transition: all .15s; }
.filter-opt.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
</style>
</head>

<div class="phone">
  <div class="page-header" style="padding-top:10px;">

        <div style="position:relative;">
          <button id="sort-btn" style="color:var(--text-2);font-size:12px;display:flex;align-items:center;gap:3px;background:none;border:none;cursor:pointer;">排序 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:11px;height:11px;"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="sort-popover" id="sort-popover" style="display:none;">

<!-- 筛选弹窗：顶部固定 + 内容滚动 + 底部固定 -->
<div class="filter-overlay" id="filter-overlay" onclick="if(event.target===this)closeFilter()">
  <div class="filter-sheet" id="filter-sheet">
    <div class="filter-header">
      <span class="filter-header-title">筛选</span>
      <button class="filter-header-close" onclick="closeFilter()">×</button>

    <div class="filter-body" id="filter-groups"></div>

<script>
(function () {
  window.__ROOT__ = '../../';
  var params = new URLSearchParams(location.search);
  var type = params.get('type') || 'all';

  /* ---- 供需方向 + 资源分类 统一映射 ---- */
  var BIZ_MAP = { '材料':'material','设备':'equipment','劳务':'labor','项目合作':'cooperation','合作':'cooperation','中介服务':'agency','中介':'agency','资质招商':'franchise','建企买卖':'trade','招聘':'personnel','求职':'talent' };

  /* 资源类分类对应的 bizKey */
  var RESOURCE_BIZ = { franchise: 'franchise', trade: 'trade', talent: 'talent' };
  /* 资源类筛选条件 */
  var RESOURCE_FILTERS = {
    franchise: { category: ['全部', '施工总承包', '专业承包', '劳务分包', '设计资质', '监理资质', '造价咨询'], city: ['全部', '成都', '北京', '上海', '广州', '深圳', '重庆', '昆明', '贵阳'], budget: ['全部', '面议', '10万以下', '10-50万', '50万以上'], verified: ['全部', '已认证', '未认证'] },
    trade: { category: ['全部', '建筑公司', '装饰公司', '劳务公司', '设计公司', '监理公司', '其他'], city: ['全部', '成都', '北京', '上海', '广州', '深圳', '重庆', '昆明', '贵阳'], budget: ['全部', '面议', '50万以下', '50-200万', '200-500万', '500万以上'], verified: ['全部', '已认证', '未认证'] },
    talent: { category: ['全部', '一级建造师', '二级建造师', '注册工程师', '技术工人', '项目经理', '其他'], city: ['全部', '成都', '北京', '上海', '广州', '深圳', '重庆', '昆明', '贵阳'], budget: ['全部', '面议', '5千以下', '5千-1万', '1-2万', '2万以上'], verified: ['全部', '已认证', '未认证'] }
  };
  /* 供需类通用筛选 */
  var MATCH_FILTERS = { category: ['全部'].concat(Object.keys(BIZ_MAP)), city: ['全部', '成都', '北京', '上海', '广州', '深圳', '重庆', '昆明', '贵阳'], budget: ['全部', '面议', '1万以下', '1-5万', '5-20万', '20-100万', '100万以上'], verified: ['全部', '已认证', '未认证'] };
  /* 一级 tab 的二级分类（资源/供应/需求/服务） */
  var SUBTABS = {
    resource: [{ key: 'all', label: '全部' }, { key: 'franchise', label: '资质招商' }, { key: 'trade', label: '建企买卖' }, { key: 'personnel', label: '企业招聘' }, { key: 'talent', label: '人才求职' }],
    supply: [{ key: 'all', label: '全部' }, { key: 'material', label: '材料' }, { key: 'equipment', label: '设备' }, { key: 'labor', label: '劳务' }, { key: 'cooperation', label: '项目合作' }, { key: 'agency', label: '中介服务' }],
    demand: [{ key: 'all', label: '全部' }, { key: 'material', label: '材料' }, { key: 'equipment', label: '设备' }, { key: 'labor', label: '劳务' }, { key: 'cooperation', label: '项目合作' }, { key: 'agency', label: '中介服务' }],
    service: [{ key: 'all', label: '全部' }, { key: '资质代办', label: '资质代办' }, { key: '工程担保', label: '工程担保' }, { key: '造价咨询', label: '造价咨询' }, { key: '企业服务', label: '企业服务' }]
  };
  /* 服务子类关键词匹配 */
  var SERVICE_KEYS = {
    '资质代办': ['资质', '代办', '升级', '安许', '新办', '延期', '分立'],
    '工程担保': ['担保', '保函', '履约', '投标'],
    '造价咨询': ['造价', '咨询', '结算', '审核', '审计'],
    '企业服务': ['工商', '注册', '劳务', '招标', '代理', '服务']
  };
  function matchService(item, key) {
    if (key === 'all') return true;
    var hay = (item.sub || '') + ' ' + (item.title || '') + ' ' + (item.serveType || '');
    var keys = SERVICE_KEYS[key] || [key];
    for (var i = 0; i < keys.length; i++) if (hay.indexOf(keys[i]) >= 0) return true;
    return false;
  }

  function normSupplyItem(x) {
    var isUser = (x.source === 'user_publish' || x.source === 'migrated_publish');
    return Object.assign({}, x, {
      id: x.id, bizKey: x.bizKey || BIZ_MAP[x.cat] || 'material',
      dir: x.dir || x.type || 'demand', title: x.title || '', cat: x.cat || x.category || '',
      sub: x.sub || x.subType || '', city: x.city || x.location || '',
      price: x.price || x.budget || '', budget: x.budget || x.price || '', unit: x.unit || '',
      tags: x.tags || [], company: x.company || '',
      match: typeof x.match === 'number' ? x.match : (isUser ? 55 : 70),
      verified: x.verified !== undefined ? x.verified : !isUser, hot: x.hot || false,
      _badge: isUser ? '用户发布' : '平台认证'
    });
  }
  function readActiveSupplies() {
    try { return (window.SupplyStore ? SupplyStore.listActive() : []) || []; } catch (e) { return []; }
  }
  function mergedList() {
    var mock = (window.MOCK && MOCK.byFlow) ? MOCK.byFlow('match').slice() : [];
    var active = readActiveSupplies().map(normSupplyItem);
    var seen = {}, out = [];
    active.forEach(function (x) { if (!seen[x.id]) { seen[x.id] = true; out.push(x); } });
    mock.forEach(function (x) { if (!seen[x.id]) { seen[x.id] = true; out.push(x); } });
    return out;
  }

  /* ---- 一级分类切换 + 二级分类栏 ---- */
  var segs = document.querySelectorAll('.discover-seg .seg-item');
  var subBar = document.getElementById('discover-sub');
  var sub = 'all';
  function setSeg() {
    segs.forEach(function (el) { el.classList.toggle('active', el.dataset.t === type); });
  }
  function renderSubs() {
    var defs = SUBTABS[type];
    if (!defs) { subBar.style.display = 'none'; sub = 'all'; return; }
    subBar.style.display = '';
    subBar.innerHTML = defs.map(function (d) {
      return '<span class="sub-chip' + (sub === d.key ? ' on' : '') + '" data-k="' + d.key + '">' + d.label + '</span>';
    }).join('');
  }
  subBar.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.sub-chip') : null;
    if (!chip) return;
    sub = chip.getAttribute('data-k');
    renderSubs();
    filterState = getDefaultFilter();
    filterDraft = getDefaultFilter();
    updateFilterBadge();
    render();
  });
  segs.forEach(function (el) {
    el.addEventListener('click', function () {
      type = el.dataset.t;
      sub = 'all';
      setSeg();
      renderSubs();
      /* 切换分类时重置筛选 */
      filterState = getDefaultFilter();
      filterDraft = getDefaultFilter();
      updateFilterBadge();
      render();
      history.replaceState({}, '', '?type=' + type);
    });
  });

  /* ---- 排序：气泡弹窗 ---- */
  var sortBy = 'newest';
  var sortBtn = document.getElementById('sort-btn');
  var sortPopover = document.getElementById('sort-popover');
  sortBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = sortPopover.style.display !== 'none';
    sortPopover.style.display = isOpen ? 'none' : 'block';
  });
  document.addEventListener('click', function (e) {
    if (!sortPopover.contains(e.target) && e.target !== sortBtn) {
      sortPopover.style.display = 'none';
    }
  });
  document.querySelectorAll('.sort-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      sortBy = opt.dataset.sort;
      document.querySelectorAll('.sort-opt').forEach(function (o) { o.classList.toggle('active', o === opt); });
      sortPopover.style.display = 'none';
      render();
    });
  });

  /* ---- 筛选面板：根据当前分类动态生成 ---- */
  function getDefaultFilter() {
    return { category: '全部', city: '全部', budget: '全部', verified: '全部' };
  }
  var filterState = getDefaultFilter();
  var filterDraft = getDefaultFilter();

  function getFilterConfig() {
    if (type === 'resource' && sub !== 'all' && RESOURCE_FILTERS[sub]) return RESOURCE_FILTERS[sub];
    if (type === 'service') return MATCH_FILTERS;
    return MATCH_FILTERS;
  }
  function renderFilterGroups() {
    var cfg = getFilterConfig();
    var groups = [
      { key: 'category', label: '分类', options: cfg.category },
      { key: 'city', label: '地区', options: cfg.city },
      { key: 'budget', label: type === 'talent' ? '薪资' : '预算', options: cfg.budget },
      { key: 'verified', label: '认证', options: cfg.verified }
    ];
    var html = groups.map(function (g) {
      var opts = g.options.map(function (o) {
        var active = filterDraft[g.key] === o;
        return '<span class="filter-opt' + (active ? ' active' : '') + '" data-g="' + g.key + '" data-v="' + o + '">' + o + '</span>';
      }).join('');
      return '<div class="filter-group"><div class="filter-group-label">' + g.label + '</div><div>' + opts + '</div></div>';
    }).join('');
    document.getElementById('filter-groups').innerHTML = html;
    document.querySelectorAll('.filter-opt').forEach(function (el) {
      el.addEventListener('click', function () {
        filterDraft[el.dataset.g] = el.dataset.v;
        renderFilterGroups();
      });
    });
  }

  window.openFilter = function () {
    filterDraft = { category: filterState.category, city: filterState.city, budget: filterState.budget, verified: filterState.verified };
    renderFilterGroups();
    var ov = document.getElementById('filter-overlay');
    ov.style.display = 'block';
    requestAnimationFrame(function () { document.getElementById('filter-sheet').style.transform = 'translateY(0)'; });
  };
  window.closeFilter = function () {
    document.getElementById('filter-sheet').style.transform = 'translateY(100%)';
    setTimeout(function () { document.getElementById('filter-overlay').style.display = 'none'; }, 300);
  };
  window.resetFilter = function () {
    filterDraft = getDefaultFilter();
    renderFilterGroups();
  };
  window.applyFilter = function () {
    filterState = { category: filterDraft.category, city: filterDraft.city, budget: filterDraft.budget, verified: filterDraft.verified };
    updateFilterBadge();
    render();
    closeFilter();
  };
  function updateFilterBadge() {
    var cnt = 0;
    if (filterState.category !== '全部') cnt++;
    if (filterState.city !== '全部') cnt++;
    if (filterState.budget !== '全部') cnt++;
    if (filterState.verified !== '全部') cnt++;
    var badge = document.getElementById('filter-cnt');
    if (cnt > 0) { badge.style.display = 'inline-block'; badge.textContent = cnt; }
    else badge.style.display = 'none';
  }
  document.getElementById('filter-btn').addEventListener('click', openFilter);

  /* ---- 预算/薪资范围匹配 ---- */
  function matchBudget(item, budget) {
    if (budget === '全部') return true;
    var val = parseFloat((item.price || item.budget || '').toString().replace(/[^0-9.]/g, ''));
    if (budget === '面议') return !val || val === 0;
    if (isNaN(val) || val === 0) return false;
    /* 通用万级区间 */
    var ranges = {
      '1万以下': [0, 1], '1-5万': [1, 5], '5-20万': [5, 20], '20-100万': [20, 100], '100万以上': [100, Infinity],
      '10万以下': [0, 10], '10-50万': [10, 50], '50万以上': [50, Infinity],
      '50万以下': [0, 50], '50-200万': [50, 200], '200-500万': [200, 500], '500万以上': [500, Infinity],
      '5千以下': [0, 0.5], '5千-1万': [0.5, 1], '1-2万': [1, 2], '2万以上': [2, Infinity]
    };
    var r = ranges[budget];
    if (!r) return true;
    return val >= r[0] && val < r[1];
  }

  /* ---- 主渲染 ---- */
  function render() {
    var list = mergedList();

    /* 按一级分类 + 二级分类筛选 */
    if (type === 'resource') {
      var RES_KEYS = ['franchise', 'trade', 'personnel', 'talent'];
      list = list.filter(function (s) { return RES_KEYS.indexOf(s.bizKey) >= 0; });
      if (sub !== 'all') list = list.filter(function (s) { return s.bizKey === sub; });
    } else if (type === 'supply' || type === 'demand') {
      list = list.filter(function (s) { return s.dir === type; });
      if (sub !== 'all') list = list.filter(function (s) { return s.bizKey === sub; });
    } else if (type === 'service') {
      list = list.filter(function (s) { return s.bizKey === 'agency'; });
      list = list.filter(function (s) { return matchService(s, sub); });
    }
    /* type === 'all' 不筛选 */

    /* 筛选条件 */
    if (filterState.category !== '全部') {
      var bizKey = BIZ_MAP[filterState.category] || filterState.category;
      list = list.filter(function (s) { return s.bizKey === bizKey; });
    }
    if (filterState.city !== '全部') list = list.filter(function (s) { return (s.city || s.location || '') === filterState.city || (s.city || s.location || '').indexOf(filterState.city) >= 0; });
    if (filterState.budget !== '全部') list = list.filter(function (s) { return matchBudget(s, filterState.budget); });
    if (filterState.verified === '已认证') list = list.filter(function (s) { return s.verified; });
    if (filterState.verified === '未认证') list = list.filter(function (s) { return !s.verified; });

    /* 排序 */
    if (sortBy === 'match') list.sort(function (a, b) { return (b.match || 0) - (a.match || 0); });
    else list.sort(function (a, b) { return (b.ts || b.time || 0) - (a.ts || a.time || 0); });

    document.getElementById('count').textContent = '共 ' + list.length + ' 条';
    var html = list.length
      ? window.Cards.render(list, 'detail.html?id=')
      : '<div class="empty-state"><div class="e-icon"><svg class="ic"><use href="#i-folder"/></svg></div><div class="e-title">暂无匹配</div><div class="e-desc">换个筛选条件试试吧</div></div>';
    document.getElementById('list').innerHTML = html;

    /* 为用户发布条目注入角标 */
    var cards = document.querySelectorAll('#list .job-card');
    list.forEach(function (item, idx) {
      if (item._badge && cards[idx]) {
        var tag = document.createElement('span');
        tag.className = 'tag ' + (item._badge === '用户发布' ? 'tag-supply' : 'tag-gold');
        tag.style.cssText = 'margin-left:6px;font-size:10px;';
        tag.textContent = item._badge;
        var tagsRow = cards[idx].querySelector('.jc-tags');
        if (tagsRow) tagsRow.appendChild(tag);
      }
    });
  }

  setSeg();
  renderSubs();
  render();
  window.addEventListener('engchain:supply', function () { render(); });
  window.addEventListener('storage', function (e) { if (e.key === 'engchain-supply') render(); });
})();
</script>
</body>
</html>
