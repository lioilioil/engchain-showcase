<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

<title>破冰期引导 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
/* ===== 破冰期引导页 V3.3 暖米白+古铜金 ===== */
.guide-scroll{padding:0 0 140px;}

/* --- Hero 区 --- */
.guide-hero{position:relative;height:230px;overflow:hidden;}
.guide-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.guide-hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,5,.35) 0%,rgba(20,15,5,.55) 55%,var(--bg) 100%);}
.guide-hero-inner{position:relative;z-index:2;padding:48px 24px 0;color:#fff;}
.guide-hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;color:rgba(232,213,163,.9);text-transform:uppercase;}
.guide-hero-title{margin-top:8px;font-size:24px;font-weight:800;line-height:1.3;letter-spacing:.01em;}
.guide-hero-sub{margin-top:6px;font-size:13px;color:rgba(255,255,255,.82);}

/* --- 身份切换标签 --- */
.guide-role-toggle{position:relative;z-index:3;margin:-28px 20px 0;display:flex;background:var(--bg-card);border-radius:14px;padding:5px;box-shadow:var(--shadow-sm);gap:4px;}
.guide-role-btn{flex:1;height:42px;border:none;border-radius:10px;background:transparent;color:var(--text-3);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .25s ease;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px;}
.guide-role-btn svg{width:16px;height:16px;}
.guide-role-btn.active{background:linear-gradient(135deg,#D4B876,#C9A961,#A98A47);color:var(--text-inv);box-shadow:0 3px 10px rgba(201,169,97,.35);}

/* --- 通用区块 --- */
.guide-section{padding:24px 20px 0;}
.guide-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.guide-section-title{font-size:17px;font-weight:800;color:var(--text-1);display:flex;align-items:center;gap:8px;}
.guide-section-title::before{content:"";width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,#D4B876,#A98A47);}
.guide-section-sub{font-size:12px;color:var(--text-3);}

/* --- 成长路径时间线 --- */
.guide-timeline{position:relative;padding-left:8px;}
.guide-timeline::before{content:"";position:absolute;left:21px;top:12px;bottom:12px;width:2px;background:linear-gradient(180deg,rgba(201,169,97,.3),rgba(201,169,97,.1));border-radius:1px;}
.gt-step{position:relative;display:flex;gap:14px;padding:12px 0;align-items:flex-start;}
.gt-node{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg-card);border:2px solid var(--primary);color:var(--primary);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:0 0 0 3px var(--bg);transition:all .3s;}
.gt-step.done .gt-node{background:var(--success);border-color:var(--success);color:#fff;}
.gt-step.done .gt-node svg{width:14px;height:14px;}
.gt-body{flex:1;min-width:0;background:var(--bg-card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-xs);border:1px solid var(--line);transition:all .2s;}
.gt-step.done .gt-body{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 22%,transparent);}
.gt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.gt-title{font-size:14.5px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:6px;}
.gt-title svg{width:15px;height:15px;color:var(--primary);}
.gt-step.done .gt-title{color:var(--success);}
.gt-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--success-soft);color:var(--success);flex:none;}
.gt-desc{margin-top:5px;font-size:12px;color:var(--text-3);line-height:1.5;}
.gt-action{margin-top:10px;display:flex;align-items:center;}
.gt-btn{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 14px;border:none;border-radius:9px;background:var(--primary-soft);color:var(--primary-dim);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.gt-btn svg{width:13px;height:13px;}
.gt-btn:active{transform:scale(.96);background:var(--primary-soft-2);}
.gt-done-label{font-size:12px;color:var(--success);font-weight:600;display:flex;align-items:center;gap:4px;}
.gt-done-label svg{width:13px;height:13px;}

/* --- 弹窗预览区 --- */
.guide-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.guide-preview-card{position:relative;height:100px;border-radius:14px;overflow:hidden;cursor:pointer;border:none;padding:0;-webkit-tap-highlight-color:transparent;transition:transform .15s;}
.guide-preview-card:active{transform:scale(.97);}
.guide-preview-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.guide-preview-mask{position:absolute;inset:0;}
.guide-preview-card.visitor .guide-preview-mask{background:linear-gradient(135deg,rgba(30,20,8,.7),rgba(30,20,8,.45));}
.guide-preview-card.user .guide-preview-mask{background:linear-gradient(135deg,rgba(20,16,40,.7),rgba(40,30,10,.5));}
.guide-preview-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 14px;color:#fff;text-align:left;}
.guide-preview-label{font-size:11px;font-weight:600;opacity:.8;letter-spacing:.04em;}
.guide-preview-name{font-size:14px;font-weight:700;margin-top:3px;}
.guide-preview-hint{font-size:10px;margin-top:4px;opacity:.65;}
.guide-preview-note{margin-top:10px;font-size:11.5px;color:var(--text-3);text-align:center;line-height:1.5;}

/* --- 新手福利汇总卡 --- */
.guide-welfare{margin:24px 20px 0;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--bg-elev) 0%,var(--bg-alp) 100%);border:1px solid var(--accent-line);box-shadow:var(--shadow-sm);}
.gw-head{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
.gw-title{font-size:15px;font-weight:800;color:var(--text-1);display:flex;align-items:center;gap:7px;}
.gw-title svg{width:17px;height:17px;color:var(--primary);}
.gw-total{font-size:12px;font-weight:700;color:var(--primary-dim);background:var(--primary-soft);padding:4px 10px;border-radius:10px;}
.gw-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--primary-soft);}
.gw-item{background:var(--bg-card);padding:12px 14px;display:flex;align-items:center;gap:10px;}
.gw-item-icon{flex:none;width:34px;height:34px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:inset 0 0 0 1px var(--accent-line);}
.gw-item-icon svg{width:17px;height:17px;}
.gw-item-info{flex:1;min-width:0;}
.gw-item-name{font-size:12px;font-weight:600;color:var(--text-1);line-height:1.3;}
.gw-item-amount{font-size:13px;font-weight:800;color:var(--primary);margin-top:1px;}
.gw-foot{padding:14px 18px 16px;}
.gw-cta{width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#D4B876 0%,#C9A961 50%,#A98A47 100%);color:var(--text-inv);font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(201,169,97,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s;-webkit-tap-highlight-color:transparent;}
.gw-cta:active{transform:scale(.97);}

/* --- 底部固定操作区 --- */
.guide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 0%,transparent) 0%,color-mix(in srgb,var(--bg) 92%,transparent) 30%,var(--bg) 100%);box-sizing:border-box;}
.guide-bottom .btn{height:50px;font-size:15px;font-weight:700;border-radius:13px;}
.guide-bottom .btn-ghost{height:44px;font-size:13.5px;font-weight:600;margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--text-3);box-shadow:none;}
.guide-auth-btn{width:100%;height:50px;border:none;border-radius:13px;background:var(--success-soft);color:var(--success);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s;-webkit-tap-highlight-color:transparent;border:1px solid color-mix(in srgb,var(--success) 20%,transparent);}
.guide-auth-btn:active{transform:scale(.98);}
.guide-auth-btn svg{width:16px;height:16px;}

/* 入场动画 */
.guide-hero-inner{opacity:0;transform:translateY(16px);animation:guideFadeUp .6s ease .1s forwards;}
.guide-role-toggle{opacity:0;transform:translateY(12px);animation:guideFadeUp .5s ease .25s forwards;}
.guide-section,.guide-welfare{opacity:0;transform:translateY(14px);animation:guideFadeUp .5s ease forwards;}
.guide-section:nth-of-type(1){animation-delay:.35s;}
.guide-section:nth-of-type(2){animation-delay:.45s;}
.guide-welfare{animation-delay:.55s;}
@keyframes guideFadeUp{to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll guide-scroll">
    <!-- ===== Hero 区 ===== -->
    <div class="guide-hero">
      <div class="guide-hero-bg" style="background-image:url('../../assets/guide/growth-staircase.jpg')"></div>

<script>window.__ROOT__='../../';</script>
<script src="popup.js"></script>
<script>
(function () {
  var root = window.__ROOT__ || '../../';

  /* ---- 5 步成长路径数据 ---- */
  var STEPS = [
    {
      icon: 'user', title: '注册账号',
      desc: '手机号一键注册，一个账号同时做需方与供方',
      href: root + 'pages/profile/index.html',
      check: function (role) { return role === 'user'; }
    },
    {
      icon: 'shield', title: '实名认证',
      desc: '完成个人实名，解锁信息发布与联系能力',
      href: root + 'pages/profile/auth.html',
      check: function () {
        try { var a = JSON.parse(localStorage.getItem('engchain-auth') || '{}'); return !!(a.realname && a.realname.ok); } catch (e) { return false; }
      }
    },
    {
      icon: 'doc', title: '发布供需',
      desc: '一句话发布，AI智能补全，让需求被看见',
      href: root + 'pages/publish/index.html',
      check: function () { return localStorage.getItem('engchain-published') === '1'; }
    },
    {
      icon: 'sparkle', title: '对接成交',
      desc: 'AI匹配推荐，付费解锁联系，洽谈成交',
      href: root + 'pages/supply/list.html',
      check: function () { return localStorage.getItem('engchain-deal') === '1'; }
    },
    {
      icon: 'share', title: '分销推广',
      desc: '邀请好友赚佣金，成为合伙人享受更多权益',
      href: root + 'pages/distribution/index.html',
      check: function () { return localStorage.getItem('engchain-partner') === '1'; }
    },
  ];

  var currentRole = 'visitor';
  var timeline = document.getElementById('guideTimeline');
  var progressEl = document.getElementById('gtProgress');
  var authCta = document.getElementById('authCta');

  function svgIcon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-' + name + '"/></svg>';
  }

  function renderTimeline() {
    var doneCount = 0;
    var html = STEPS.map(function (s, i) {
      var done = s.check(currentRole);
      if (done) doneCount++;
      return '<div class="gt-step' + (done ? ' done' : '') + '" data-idx="' + i + '">' +
        '<div class="gt-node">' + (done ? svgIcon('check') : (i + 1)) + '</div>' +
        '<div class="gt-body">' +
          '<div class="gt-top">' +
            '<div class="gt-title">' + svgIcon(s.icon) + s.title + '</div>' +
            (done ? '<span class="gt-badge">已完成</span>' : '') +
          '</div>' +
          '<div class="gt-desc">' + s.desc + '</div>' +
          '<div class="gt-action">' +
            (done
              ? '<span class="gt-done-label">' + svgIcon('check') + '已解锁</span>'
              : '<button type="button" class="gt-btn" data-href="' + s.href + '">去完成' + svgIcon('chev-r') + '</button>') +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    timeline.innerHTML = html;
    progressEl.textContent = doneCount + '/5 已完成';

    // 绑定跳转
    timeline.querySelectorAll('.gt-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var href = btn.dataset.href;
        if (href) location.href = href;
      });
    });
  }

  /* ---- 身份切换 ---- */
  var roleBtns = document.querySelectorAll('.guide-role-btn');
  roleBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      currentRole = btn.dataset.role;
      roleBtns.forEach(function (b) {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
      });
      authCta.style.display = currentRole === 'user' ? 'flex' : 'none';
      renderTimeline();
    });
  });

  /* ---- 初始身份检测 ---- */
  function detectRole() {
    try {
      var raw = localStorage.getItem('engchain-state');
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.user) return 'user';
      }
    } catch (e) {}
    return 'visitor';
  }
  var initRole = detectRole();
  if (initRole === 'user') {
    var userBtn = document.querySelector('.guide-role-btn[data-role="user"]');
    if (userBtn) userBtn.click();
  } else {
    renderTimeline();
  }

  /* ---- 弹窗预览按钮 ---- */
  document.getElementById('previewVisitor').addEventListener('click', function () {
    if (window.GuidePopup) GuidePopup.showVisitor();
  });
  document.getElementById('previewUser').addEventListener('click', function () {
    if (window.GuidePopup) GuidePopup.showUser();
  });
  document.getElementById('welfareCta').addEventListener('click', function () {
    if (window.GuidePopup) {
      if (currentRole === 'user') GuidePopup.showUser();
      else GuidePopup.showVisitor();
    }
  });

  /* ---- 跳过引导 ---- */
  document.getElementById('skipBtn').addEventListener('click', function () {
    if (window.UI && UI.toast) UI.toast('已跳过引导', 'ok');
    setTimeout(function () { location.href = root + 'index.html'; }, 300);
  });
})();
</script>
</body>
</html>
