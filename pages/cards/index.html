<style>

  .cat-block { margin-bottom: 40px; }
  .cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .cat-head .ch-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
  .cat-head .ch-flow { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; padding: 2px 8px; border-radius: 4px; }
  .cat-head .ch-flow.res { background: rgba(201,169,97,.14); color: #8a6a2e; }
  .cat-head .ch-flow.mat { background: rgba(74,124,180,.14); color: #3a6a9e; }
  .cat-head .ch-count { font-size: 12px; color: var(--text-3); font-family: var(--font-num); }
  .cat-head .ch-src { margin-left: auto; font-size: 11px; color: var(--text-3); font-family: var(--font-num); }
  .cat-head .ch-src code { background: var(--bg-card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; font-size: 10.5px; }

  .cat-body { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .card-col { flex: 0 0 342px; }
  .card-col .job-card { margin: 0 0 14px; }
  .card-col .job-card:last-child { margin-bottom: 0; }

  .anno-col { flex: 1 1 320px; min-width: 300px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px 18px 14px; box-shadow: var(--shadow-sm); }
  .anno-col h4 { font-size: 12px; font-weight: 700; color: var(--text-2); letter-spacing: .04em; margin: 0 0 8px; text-transform: uppercase; }
  .anno-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .anno-meta .pill { font-size: 10.5px; font-family: var(--font-num); padding: 2px 8px; border-radius: 4px; background: var(--bg-card-2); color: var(--text-2); border: 1px solid var(--line); }
  .anno-meta .pill b { color: var(--text-1); font-weight: 600; }

  .anno-rows { border-top: 1px dashed var(--line); padding-top: 4px; }
  .anno-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12px; line-height: 1.55; }
  .anno-row:last-child { border-bottom: none; }
  .anno-row .ak { flex: 0 0 96px; color: var(--text-2); font-weight: 600; font-size: 11.5px; padding-top: 1px; }
  .anno-row .av { flex: 1; color: var(--text-1); }
  .anno-row .av code { background: var(--bg-card-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 3px; font-size: 10.5px; font-family: var(--font-num); color: #8a6a2e; white-space: nowrap; }
  .anno-row .av .dot-sep { color: var(--text-3); margin: 0 3px; }

  .anno-pages { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .anno-pages .ap-label { font-size: 11px; color: var(--text-3); font-weight: 600; margin-bottom: 5px; letter-spacing: .03em; }
  .anno-pages ul { margin: 0; padding: 0; list-style: none; }
  .anno-pages li { font-size: 11.5px; color: var(--text-2); padding: 2px 0; padding-left: 14px; position: relative; }
  .anno-pages li::before { content: "›"; position: absolute; left: 0; color: var(--primary-dim); font-weight: 700; }
  .anno-pages li code { background: var(--bg-card-2); border: 1px solid var(--line); padding: 0 4px; border-radius: 3px; font-size: 10px; font-family: var(--font-num); color: var(--text-2); }

  @media (max-width: 760px) {
    .card-col { flex: 1 1 100%; }
    .anno-col { flex: 1 1 100%; min-width: 0; }
  }
</style>
</head>
<body>
<div class="showcase">
  <h1>9 类卡片 · 样式总览</h1>
  <p class="lead">
    左侧为真实卡片效果（342px，与首页/发现页一致），右侧为<strong>元素/组件名称</strong>与<strong>应用页面/效果来源</strong>追溯。
    所有卡片均由 <code>window.Cards.render()</code>（<code>js/common.js</code>）统一渲染，外壳 CSS 为 <code>.job-card</code>（<code>css/app.css</code>），数据来自 <code>js/data.js</code> 的 <code>catalog</code>。
    修改意见可直接引用右侧元素名（如 <code>.jc-title</code>）或来源页面。
  </p>
  <div id="blocks"></div>
</div>

<script src="../../js/data.js"></script>

<script>
