<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>服务广场 · 工程链</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   ZINE EDITORIAL v2 — 服务广场设计副本
   风格定位：高端建筑行业杂志内页
   ============================================ */

:root {
  --paper: #F2EDE3;
  --paper-warm: #EDE7D9;
  --ink: #1A1A1A;
  --ink-soft: #3D3D3D;
  --ink-mute: #6B6660;
  --line: #C8C0B0;
  --accent: #C8391E;
  --accent-deep: #9E2A15;
  --gold: #B8860B;
  --card: #FAF7F0;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: #1a1a1a;
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  color: var(--ink);
  overflow: hidden;
}

.phone {
  width: 100%;
  max-width: 420px;
  height: 100%;
  max-height: 100vh;
  margin: 0 auto;
  background: var(--paper);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,.5);
}

/* 纸张纹理叠加 */
.phone::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: multiply;
}

/* ============================================
   顶部导航
   ============================================ */
.navbar {
  padding: 14px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1.5px solid var(--ink);
  position: relative;
  z-index: 10;
  background: var(--paper);
}

.nav-back {
  width: 32px; height: 32px;
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
}
.nav-back svg { width: 20px; height: 20px; }

.nav-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.35em;
}

.nav-right { display: flex; gap: 4px; }
.icon-btn {
  width: 32px; height: 32px;
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
}
.icon-btn svg { width: 18px; height: 18px; }

/* ============================================
   滚动区域
   ============================================ */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  z-index: 2;
  padding-bottom: 100px;
}

/* ============================================
   刊头区 — 图文混排杂志封面感
   ============================================ */
.hero-masthead {
  position: relative;
  padding: 28px 24px 24px;
  border-bottom: 2px solid var(--ink);
  overflow: hidden;
}

.hero-image-wrap {
  position: absolute;
  right: -20px;
  top: 20px;
  width: 140px;
  height: 200px;
  overflow: hidden;
  opacity: 0.9;
  transform: rotate(2deg);
}

.hero-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(0.3) contrast(0.9) brightness(0.95);
}

.hero-image-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 50%, var(--paper) 100%);
}

.hero-issue {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-mute);
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  max-width: 200px;
}

.hero-title {
  font-size: 40px;
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  max-width: 220px;
}

.hero-title em {
  font-style: normal;
  color: var(--accent);
}

.hero-sub {
  font-size: 12px;
  line-height: 1.8;
  color: var(--ink-soft);
  max-width: 200px;
  position: relative;
  padding-left: 12px;
  border-left: 2px solid var(--accent);
}

/* ============================================
   信任背书
   ============================================ */
.trust-bar {
  margin: 16px 24px 0;
  padding: 10px 14px;
  border: 1px solid var(--line);
  background: var(--card);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--ink-soft);
}

.trust-bar svg { width: 14px; height: 14px; color: var(--accent); flex: none; }

.trust-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  padding: 3px 8px;
  background: var(--ink);
  color: var(--paper);
  letter-spacing: 0.1em;
}

/* ============================================
   分类目录 — 带装饰图形
   ============================================ */
.catalog-section {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--line);
  position: relative;
}

.catalog-deco {
  position: absolute;
  right: 24px;
  top: 20px;
  width: 50px;
  height: 50px;
  opacity: 0.15;
}

.catalog-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--ink-mute);
  margin-bottom: 14px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.catalog-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

.catalog-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
}

.cat-item {
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  background: none;
  transition: all 0.2s;
  font-family: 'Noto Serif SC', serif;
}

.cat-item.active {
  background: var(--ink);
  color: var(--paper);
}

.cat-item:not(.active):hover {
  background: rgba(26,26,26,0.05);
}

.cat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 400;
  margin-right: 4px;
  opacity: 0.5;
}

/* ============================================
   服务列表 — 图文卡片
   ============================================ */
.articles-section {
  padding: 0;
}

.article-item {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  animation: fadeUp 0.5s ease both;
  display: flex;
  gap: 16px;
}

.article-item:active {
  background: rgba(26,26,26,0.03);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 服务卡片缩略图 */
.article-thumb {
  width: 70px;
  height: 90px;
  flex: none;
  overflow: hidden;
  position: relative;
  background: var(--paper-warm);
}

.article-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(0.4) contrast(0.85) brightness(0.95);
}

.article-thumb .thumb-tag {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  padding: 3px 6px;
  letter-spacing: 0.1em;
  text-align: center;
}

.article-content {
  flex: 1;
  min-width: 0;
}

.article-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-mute);
}

.article-number {
  font-weight: 700;
  color: var(--accent);
}

.article-rating {
  display: flex;
  align-items: center;
  gap: 4px;
}

.article-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.article-publisher {
  font-size: 11px;
  color: var(--ink-mute);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.publisher-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  font-weight: 700;
  padding: 2px 6px;
  background: var(--gold);
  color: var(--paper);
  letter-spacing: 0.1em;
}

.article-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.article-price {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}

.article-price small {
  font-size: 10px;
  font-weight: 400;
  color: var(--ink-mute);
  margin-left: 2px;
}

.article-cta {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
}

/* ============================================
   图文穿插分隔区
   ============================================ */
.feature-break {
  margin: 24px;
  border: 1px solid var(--line);
  background: var(--card);
  overflow: hidden;
}

.feature-image {
  width: 100%;
  height: 120px;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}

.feature-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(0.3) contrast(0.9);
}

.feature-text {
  padding: 14px 16px;
}

.feature-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 6px;
}

.feature-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.feature-desc {
  font-size: 11px;
  color: var(--ink-mute);
  line-height: 1.6;
}

/* ============================================
   交叉导流
   ============================================ */
.sidebar-section {
  padding: 0 24px 24px;
  border-bottom: 2px solid var(--ink);
}

.sidebar-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--ink-mute);
  margin-bottom: 14px;
  padding-top: 20px;
}

.sidebar-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.sidebar-card {
  padding: 12px 10px;
  background: var(--card);
  border: 1px solid var(--line);
  text-decoration: none;
  color: var(--ink);
  display: block;
  transition: all 0.2s;
}

.sidebar-card:active {
  background: var(--paper-warm);
}

.sidebar-icon {
  width: 26px; height: 26px;
  margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--ink);
  color: var(--paper);
}

.sidebar-icon svg { width: 13px; height: 13px; }

.sidebar-name {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 2px;
}

.sidebar-desc {
  font-size: 9px;
  color: var(--ink-mute);
}

/* ============================================
   工具箱
   ============================================ */
.tools-section {
  padding: 20px 24px 24px;
}

.tools-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--ink-mute);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tools-title svg { width: 14px; height: 14px; }

.tool-row {
  display: flex;
  flex-direction: column;
}

.tool-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px dashed var(--line);
  cursor: pointer;
  background: none;
  border-left: none; border-right: none; border-top: none;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--ink);
  text-align: left;
}

.tool-item:last-child { border-bottom: none; }

.tool-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  margin-right: 12px;
  width: 24px;
}

.tool-name {
  flex: 1;
  font-weight: 600;
}

.tool-arrow {
  font-size: 14px;
  color: var(--ink-mute);
}

/* ============================================
   底部悬浮CTA
   ============================================ */
.float-cta {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  z-index: 20;
  display: flex;
  background: var(--ink);
  box-shadow: 0 8px 32px rgba(26,26,26,0.3);
}

.cta-btn {
  flex: 1;
  padding: 14px 12px;
  border: none;
  background: none;
  color: var(--paper);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Noto Serif SC', serif;
  transition: background 0.2s;
}

.cta-btn:active { background: rgba(255,255,255,0.08); }

.cta-btn.primary {
  background: var(--accent);
}

.cta-btn.primary:active { background: var(--accent-deep); }

.cta-btn svg { width: 18px; height: 18px; }

.cta-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
}

.cta-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  opacity: 0.6;
  letter-spacing: 0.15em;
}

/* ============================================
   空态
   ============================================ */
.empty-state {
  padding: 60px 24px;
  text-align: center;
}

.empty-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}

.empty-desc {
  font-size: 12px;
  color: var(--ink-mute);
  line-height: 1.7;
}

/* 滚动条 */
.scroll::-webkit-scrollbar { width: 3px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); }
</style>
</head>

<div class="phone">
  <!-- 导航栏 -->
  <div class="navbar">
    <button class="nav-back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <div class="nav-title">服务广场</div>
    <div class="nav-right">
      <button class="icon-btn" onclick="location.href='../search/index.html?v=agency'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

  <!-- 滚动内容区 -->
  <div class="scroll">

    <div class="trust-bar">

    <!-- 分类目录 + 装饰图形 -->

    <!-- 专栏推荐 -->
    <div class="sidebar-section">
      <div class="sidebar-title">专栏推荐 / More</div>
      <div class="sidebar-grid">
        <a class="sidebar-card" href="../franchise/index.html">
          <div class="sidebar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>

    <!-- 工具箱 -->
    <div class="tools-section">

          <span class="tool-num">T.02</span>

          <span class="tool-arrow">›</span>
        </button>
        <button class="tool-item" onclick="alert('政策速查工具')">
          <span class="tool-num">T.03</span>
          <span class="tool-name">政策速查</span>
          <span class="tool-arrow">›</span>

      </div>

  </div>

  <!-- 底部悬浮CTA -->
  <div class="float-cta">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
      <span class="cta-label">发布需求</span>
      <span class="cta-sub">POST A NEED</span>
    </button>

});
