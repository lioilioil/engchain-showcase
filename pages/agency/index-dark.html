<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>服务广场 · 工程链</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0C0C0D;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --gold: #C9A962;
  --gold-bright: #E8C97A;
  --gold-dim: rgba(201,169,98,0.3);
  --text-primary: #F0EDE6;
  --text-secondary: #9E9A90;
  --text-muted: #6B6860;
  --border: rgba(255,255,255,0.08);
  --border-gold: rgba(201,169,98,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #000; font-family: 'Manrope', 'Noto Sans SC', sans-serif; color: var(--text-primary); overflow: hidden; }
.phone { width: 100%; max-width: 420px; height: 100%; max-height: 100vh; margin: 0 auto; background: var(--bg-deep); position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 100px rgba(201,169,98,0.1); }
.phone::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,169,98,0.08) 0%, transparent 60%), radial-gradient(ellipse 50% 30% at 100% 100%, rgba(201,169,98,0.04) 0%, transparent 50%); pointer-events: none; z-index: 1; }
.phone::after { content: ''; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 1; }

.navbar { padding: 16px 20px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: relative; z-index: 10; background: rgba(12,12,13,0.8); backdrop-filter: blur(20px); }
.nav-back { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 50%; background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
.nav-back svg { width: 18px; height: 18px; }
.nav-title { font-size: 14px; font-weight: 600; letter-spacing: 0.15em; }
.nav-right { display: flex; gap: 8px; }
.icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 50%; background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
.icon-btn svg { width: 16px; height: 16px; }

.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 2; padding-bottom: 110px; }

.hero { padding: 36px 24px 28px; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; padding: 6px 12px; border: 1px solid var(--border-gold); border-radius: 100px; background: rgba(201,169,98,0.05); }
.hero-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.hero-title { font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; margin-bottom: 14px; }
.hero-title .gold { background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 50%, #A8884A 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-size: 13px; line-height: 1.7; color: var(--text-secondary); max-width: 280px; }
.gold-divider { height: 1px; background: linear-gradient(90deg, var(--gold) 0%, transparent 100%); margin: 0 24px; }

.trust-bar { margin: 20px 24px; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); }
.trust-bar svg { width: 16px; height: 16px; color: var(--gold); flex: none; }
.trust-badge { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #0C0C0D; border-radius: 100px; }

.stats-row { margin: 24px; padding: 20px; background: linear-gradient(135deg, rgba(201,169,98,0.08) 0%, rgba(201,169,98,0.02) 100%); border: 1px solid var(--border-gold); border-radius: 16px; display: flex; justify-content: space-around; }
.stat-item { text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; color: var(--gold-bright); margin-bottom: 4px; }
.stat-label { font-size: 10px; color: var(--text-muted); }
.stat-divider { width: 1px; background: var(--border-gold); }

.cats-section { padding: 8px 24px 20px; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
.cats-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.cats-row::-webkit-scrollbar { display: none; }
.cat-chip { flex: none; padding: 8px 16px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); border-radius: 100px; background: var(--bg-card); color: var(--text-secondary); cursor: pointer; transition: all 0.25s; font-family: inherit; }
.cat-chip.active { background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #0C0C0D; border-color: var(--gold); font-weight: 600; box-shadow: 0 2px 16px rgba(201,169,98,0.3); }

.services-list { padding: 0 24px; display: flex; flex-direction: column; gap: 12px; }
.service-card { padding: 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; transition: all 0.3s; animation: fadeUp 0.5s ease both; position: relative; overflow: hidden; }
.service-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: linear-gradient(180deg, var(--gold-bright), transparent); opacity: 0; transition: opacity 0.3s; }
.service-card:active { background: var(--bg-card-hover); transform: scale(0.99); }
.service-card:active::before { opacity: 1; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.card-title { font-size: 16px; font-weight: 600; line-height: 1.4; flex: 1; padding-right: 12px; }
.card-rating { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--gold); flex: none; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 11px; color: var(--text-muted); }
.verify-tag { font-size: 9px; font-weight: 700; padding: 2px 8px; background: rgba(201,169,98,0.15); color: var(--gold); border-radius: 4px; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); }
.card-price { font-size: 18px; font-weight: 700; }
.card-price small { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 2px; }
.card-cta { font-size: 12px; font-weight: 600; color: var(--gold); }

.sidebar-section { padding: 0 24px 24px; margin-top: 24px; }
.sidebar-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.sidebar-card { padding: 16px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text-primary); display: flex; flex-direction: column; gap: 8px; }
.sidebar-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(201,169,98,0.1); display: flex; align-items: center; justify-content: center; color: var(--gold); }
.sidebar-icon svg { width: 16px; height: 16px; }
.sidebar-name { font-size: 13px; font-weight: 600; }
.sidebar-desc { font-size: 10px; color: var(--text-muted); }

.tools-section { padding: 0 24px 24px; }
.tool-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; font-size: 14px; color: var(--text-primary); text-align: left; width: 100%; }
.tool-item:last-child { border-bottom: none; }
.tool-num { font-size: 10px; font-weight: 700; color: var(--gold); margin-right: 14px; width: 24px; }
.tool-name { flex: 1; font-weight: 500; }
.tool-arrow { font-size: 16px; color: var(--text-muted); }

.float-cta { position: absolute; bottom: 24px; left: 24px; right: 24px; z-index: 20; display: flex; gap: 12px; }
.cta-btn { flex: 1; padding: 16px; border: none; border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; transition: all 0.2s; }
.cta-btn.primary { background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%); color: #0C0C0D; box-shadow: 0 4px 24px rgba(201,169,98,0.3); }
.cta-btn.primary:active { transform: scale(0.98); }
.cta-btn.secondary { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); backdrop-filter: blur(20px); }
.cta-btn svg { width: 18px; height: 18px; }
.cta-label { font-size: 13px; font-weight: 600; }
.cta-sub { font-size: 9px; opacity: 0.6; letter-spacing: 0.1em; text-transform: uppercase; }

.empty-state { padding: 60px 24px; text-align: center; }
.empty-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.empty-desc { font-size: 12px; color: var(--text-muted); line-height: 1.7; }
.scroll::-webkit-scrollbar { width: 3px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="nav-title">服务广场</div>
    <div class="nav-right">
      <button class="icon-btn" onclick="location.href='../search/index.html?v=agency'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="hero-eyebrow">Verified Partners</div>
      <h1 class="hero-title">专业建筑服务<br><span class="gold">精准匹配值得信赖</span></h1>
      <p class="hero-sub">已核验机构 · 认证分层 · 解锁后联系，让每一次委托都有迹可循。</p>
    </div>

    <div class="gold-divider"></div>

    <div class="trust-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>已核验机构 · 认证分层</span>
      <span class="trust-badge">金V认证</span>
    </div>

    <div class="stats-row">
      <div class="stat-item"><div class="stat-num">200+</div><div class="stat-label">入驻机构</div></div>
      <div class="stat-divider"></div>
      <div class="stat-item"><div class="stat-num">5000+</div><div class="stat-label">成功案例</div></div>
      <div class="stat-divider"></div>
      <div class="stat-item"><div class="stat-num">98%</div><div class="stat-label">好评率</div></div>
    </div>

    <div class="cats-section">
      <div class="section-label">服务分类</div>
      <div class="cats-row" id="catsRow">
        <button class="cat-chip active" data-cat="all">全部</button>
        <button class="cat-chip" data-cat="qual">资质代办</button>
        <button class="cat-chip" data-cat="guarantee">工程担保</button>
        <button class="cat-chip" data-cat="cost">造价咨询</button>
        <button class="cat-chip" data-cat="labor">劳务派遣</button>
        <button class="cat-chip" data-cat="corp">企业服务</button>
      </div>
    </div>

    <div class="services-list" id="servicesList"></div>

    <div class="sidebar-section">
      <div class="section-label">更多服务</div>
      <div class="sidebar-grid">
        <a class="sidebar-card" href="../franchise/index.html">
          <div class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg></div>
          <div class="sidebar-name">资质招商</div>
          <div class="sidebar-desc">找分公司合作</div>
        </a>
        <a class="sidebar-card" href="../trade/index.html">
          <div class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="sidebar-name">建企买卖</div>
          <div class="sidebar-desc">收购/转让建企</div>
        </a>
        <a class="sidebar-card" href="../personnel/index.html">
          <div class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7h-3V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg></div>
          <div class="sidebar-name">人员招聘</div>
          <div class="sidebar-desc">找持证人才</div>
        </a>
      </div>
    </div>

    <div class="tools-section">
      <div class="section-label">实用工具</div>
      <button class="tool-item" onclick="alert('材料核验')"><span class="tool-num">01</span><span class="tool-name">材料核验</span><span class="tool-arrow">›</span></button>
      <button class="tool-item" onclick="alert('年检提醒')"><span class="tool-num">02</span><span class="tool-name">年检提醒</span><span class="tool-arrow">›</span></button>
      <button class="tool-item" onclick="alert('政策速查')"><span class="tool-num">03</span><span class="tool-name">政策速查</span><span class="tool-arrow">›</span></button>
    </div>
  </div>

  <div class="float-cta">
    <button class="cta-btn primary" onclick="alert('发布需求')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
      <span class="cta-label">发布需求</span>
      <span class="cta-sub">Post</span>
    </button>
    <button class="cta-btn secondary" onclick="document.querySelector('.scroll').scrollTo({top:0,behavior:'smooth'})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span class="cta-label">浏览市场</span>
      <span class="cta-sub">Browse</span>
    </button>
  </div>
</div>

<script>
var SERVICES = [
  { id: 1, title: '建筑资质三级升级二级', company: '中建信合咨询', rating: 4.9, price: '¥35,000', unit: '/项', isOrg: true, cat: 'qual' },
  { id: 2, title: '工程履约保函代办', company: '中铁担保集团', rating: 4.8, price: '¥5,000', unit: '/笔', isOrg: true, cat: 'guarantee' },
  { id: 3, title: '全过程造价咨询服务', company: '正衡工程咨询', rating: 4.7, price: '面议', unit: '', isOrg: true, cat: 'cost' },
  { id: 4, title: '劳务派遣资质新办', company: '华瑞人力服务', rating: 4.6, price: '¥12,000', unit: '/项', isOrg: true, cat: 'labor' },
  { id: 5, title: '安全生产许可证代办', company: '安捷安全咨询', rating: 4.9, price: '¥8,000', unit: '/项', isOrg: true, cat: 'corp' },
  { id: 6, title: '建筑工程资质分立重组', company: '中企建筑咨询', rating: 4.8, price: '¥80,000', unit: '/项', isOrg: true, cat: 'qual' },
  { id: 7, title: '投标保函快速办理', company: '建信担保', rating: 4.5, price: '¥2,000', unit: '/笔', isOrg: true, cat: 'guarantee' },
  { id: 8, title: '工程结算审核服务', company: '天成造价事务所', rating: 4.7, price: '按工程造价', unit: '', isOrg: true, cat: 'cost' },
  { id: 9, title: '工商注册代理记账', company: '优企财税', rating: 4.8, price: '¥3,000', unit: '/年', isOrg: true, cat: 'corp' },
  { id: 10, title: '建筑劳务分包合作', company: '宏远劳务', rating: 4.4, price: '按需报价', unit: '', isOrg: false, cat: 'labor' },
];
var currentCat = 'all';
function renderList() {
  var list = SERVICES.filter(function(s) { return currentCat === 'all' || s.cat === currentCat; });
  var html = list.map(function(s, i) {
    return '<div class="service-card" style="animation-delay:' + (i * 50) + 'ms" onclick="location.href=\'../supply/detail.html?id=' + s.id + '\'">' +
      '<div class="card-top"><div class="card-title">' + s.title + '</div><div class="card-rating">★ ' + s.rating + '</div></div>' +
      '<div class="card-meta">' + (s.isOrg ? '<span class="verify-tag">金V</span>' : '') + '<span>' + s.company + '</span></div>' +
      '<div class="card-bottom"><div class="card-price">' + s.price + (s.unit ? '<small>' + s.unit + '</small>' : '') + '</div><div class="card-cta">查看 ›</div></div>' +
    '</div>';
  }).join('');
  if (!list.length) html = '<div class="empty-state"><div class="empty-title">暂无相关服务</div><div class="empty-desc">试试其他分类</div></div>';
  document.getElementById('servicesList').innerHTML = html;
}
document.querySelectorAll('.cat-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    document.querySelectorAll('.cat-chip').forEach(function(c) { c.classList.remove('active'); });
    this.classList.add('active');
    currentCat = this.dataset.cat;
    renderList();
  });
});
renderList();
</script>
</body>
</html>
