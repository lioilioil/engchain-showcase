<script>
(function(){window.__ROOT__='../../';
function money(n){return '¥'+(Number(n||0)).toLocaleString('zh-CN');}

/* ---- 数据源：MOCK 机构服务（完整详情）+ 中介企业发布的供应（SupplyStore 同源） ---- */
var _BIZ_MAP={'材料':'material','设备':'equipment','劳务':'labor','项目合作':'cooperation','合作':'cooperation','中介服务':'agency','中介':'agency','资质招商':'franchise','建企买卖':'trade','招聘':'personnel','求职':'talent'};
/* 机构名：按 companyId 查 companies 表（MOCK 机构服务归属已核验企业） */
function companyOf(cid){
  if(!cid)return'';
  try{var c=(window.MOCK&&MOCK.companyById)?MOCK.companyById(cid):null;return (c&&(c.short||c.name))||'';}catch(e){}
  return'';
}
function cycleOf(h){
  if(!h)return'';
  var m=/[（(]?约?\s*(\d+(?:\.\d+)?)\s*[–\-~]?\s*(\d+(?:\.\d+)?)?\s*个月/.exec(String(h));
  return m?('约'+(m[2]?m[1]+'-'+m[2]:m[1])+'个月'):'';
}
function normAgency(s){
  var cid=s.companyId||'';
  return {
    id: s.id,
    title: s.title || s.name || '中介服务',
    sub: s.sub || s.subType || s.category || s.cat || '',
    rating: (typeof s.rating==='number')?s.rating:(s.score||0),
    orders: s.orders || 0,
    successRate: (typeof s.successRate==='number')?s.successRate:null,
    budget: s.budget || s.price || '',
    unit: s.unit || '',
    cats: s.cats || [s.subType || s.sub || s.category || '中介服务'],
    sellerId: s.sellerId || 'u2',
    isOrg: !!s.serveType,
    company: companyOf(cid) || s.company || '',
    cycle: cycleOf(s.handleCycle),
    caseCount: (s.cases&&s.cases.length)?s.cases.length:0,
    keyword: [s.title||'', s.sub||'', s.subType||'', s.category||'', s.cat||'', s.company||'', s.desc||'', s.serveType||'', s.targetQualLevel||'', (s.tags||[]).join(' ')].join(' ')
  };
}
function agencySource(){
  var out=[];
  var mocks=(window.MOCK&&MOCK.byBizType)?(MOCK.byBizType('agency')||[]):[];
  mocks.forEach(function(s){out.push(normAgency(s));});
  if(window.SupplyStore){
    SupplyStore.listActive().forEach(function(s){
      var bk=s.bizKey||_BIZ_MAP[s.cat]||'';
      if(bk==='agency'&&(s.dir||s.type)!=='demand'){out.push(normAgency(s));}
    });
  }
  var seen={},uniq=[];
  out.forEach(function(s){if(!seen[s.id]){seen[s.id]=1;uniq.push(s);}});
  return uniq;
}
window.SVCS=agencySource();

/* ---- 分类 chips ---- */
var CATS=[
  {id:'all',label:'全部',test:function(){return true;}},
  {id:'qual',label:'资质代办',test:function(s){return /资质|升级|增项|分立|合并|重组|延续|年检|换证/.test(s.keyword);}},
  {id:'guarantee',label:'工程担保',test:function(s){return /担保|保函/.test(s.keyword);}},
  {id:'cost',label:'造价咨询',test:function(s){return /造价|审核|咨询|审计/.test(s.keyword);}},
  {id:'labor',label:'劳务派遣',test:function(s){return /劳务|派遣|人力/.test(s.keyword);}},
  {id:'corp',label:'企业服务',test:function(s){return /工商|注册|安许|税务|记账|报税|招投标|标书|企业服务/.test(s.keyword);}}
];
var curCat='all',curQ='';
function renderCats(){
  document.getElementById('mkt-cats').innerHTML=CATS.map(function(c){
    return '<span class="chip'+(c.id===curCat?' on':'')+'" data-cat="'+c.id+'" onclick="window.pickCat(\''+c.id+'\')">'+c.label+'</span>';
  }).join('');
}
window.pickCat=function(id){curCat=id;renderCats();renderList();};

/* ---- 需求先行：场景卡 + 澄清表单 + AI 匹配（先明确服务需求，再选合作单位） ---- */
var NEED_SCENES=[
  {label:'办资质',goal:'资质升级'},{label:'新办企业',goal:'资质新办'},
  {label:'担保保函',goal:'工程担保'},{label:'造价咨询',goal:'造价咨询'},{label:'劳务派遣',goal:'劳务派遣'}
];
var MATCH_KEY={'资质升级':'资质|升级','资质新办':'资质|新办|首次','资质增项':'资质|增项','资质分立/合并':'资质|分立|合并|重组','资质延续/年检':'资质|延续|年检|换证','安许代办':'安许|安全|许可','工程担保':'担保|保函','造价咨询':'造价|审核|咨询|审计','工商注册':'工商|注册','劳务派遣':'劳务|派遣','税务/记账报税':'税务|记账|报税','招投标代办':'招投标|标书|投标','企业服务':'工商|注册|安许|税务|企业服务|法律|咨询'};
/* 目标事项动态可选项：每项目标对应「当前状态 / 期望时限 / 预算（万元）」真实可选项；均支持下拉选择或直接输入自定义 */
var GOAL_CFG={
  '资质升级':{states:['暂无资质，计划从低等级起办','已有三级总承包/专业承包资质','已有二级及以上资质','资质刚过期，需重新核定','不确定，需顾问评估'],times:['1 个月内','1-3 个月','3-6 个月','6 个月以上'],budgets:['5','10','20','50','100']},
  '资质新办':{states:['企业尚未注册','企业已注册，未办资质','首次申请资质（未取得过）','收购了企业，需办首次资质'],times:['1 个月内','1-3 个月','3-6 个月','6 个月以上'],budgets:['3','5','10','20','50']},
  '资质增项':{states:['已有资质，需新增专业类别','已有资质，需升级部分类别','不确定哪些类别可增项'],times:['1 个月内','1-3 个月','3-6 个月'],budgets:['5','10','20','50']},
  '资质分立/合并':{states:['已确定分立方案','母子公司已设立','需吸收合并/重组整合','需跨省迁出迁入','仅咨询了解'],times:['1 个月内','1-3 个月','3-6 个月'],budgets:['10','30','50','100','200']},
  '资质延续/年检':{states:['资质即将到期，需延续','资质已过期，需重新核定','需配合年检/动态核查'],times:['1 个月内','1-3 个月'],budgets:['2','5','10','20']},
  '安许代办':{states:['已有资质，未办安全生产许可证','安许到期需延期','新设企业需新办安许','安许变更（法人/地址等）'],times:['1 个月内','1-3 个月','3 个月以上'],budgets:['1','2','3','5']},
  '工程担保':{states:['已中标，需履约保函','投标阶段，需投标保函','需预付款/质量担保','需常年合作担保额度'],times:['1 周内','2 周内','1 个月内','时间灵活'],budgets:['5','10','20','50','100']},

function qtMaterialRender(){

  var done=items.filter(function(i){return saved[i];}).length;
  var miss=items.filter(function(i){return !saved[i];});
  var h='<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">按目标勾选已准备的材料，系统自动计算缺口</div>';

    return '<label class="qt-row-line"><input type="checkbox" '+checked+' onchange="toggleMaterial(\''+item+'\')"><span'+(saved[item]?' class="qt-done"':'')+'>'+item+'</span></label>';
  }).join('');
  if(miss.length){
    h+='<div class="qt-miss">还缺 <b>'+miss.length+'</b> 项：'+miss.slice(0,3).join('、')+(miss.length>3?' 等':'')+'</div>';

  var list=[];try{var raw=JSON.parse(localStorage.getItem('engchain-qt-remind')||'[]');list=Array.isArray(raw)?raw:(typeof raw==='string'&&raw?[{name:'建筑资质年检',date:raw}]:[]);}catch(e){}
  var h='<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">维护资质 / 证照到期日，到期前 30 天自动提醒</div>';
  h+='<div class="qt-add"><select id="qt-remind-name" class="qt-select" style="flex:1.1;">'+QT_REMIND_TYPES.map(function(n){return '<option>'+n+'</option>';}).join('')+'</select>'+
     '<input type="date" id="qt-remind-date" class="qt-date"><button class="btn btn-primary btn-sm" onclick="addRemind()">添加</button></div>';
  if(!list.length){
    h+='<div class="qt-none">暂无到期提醒事项，选择类型并添加</div>';
  }else{
    var sorted=list.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    h+=sorted.map(function(r){
      var days=Math.ceil((new Date(r.date)-new Date())/86400000);
      var st,c;
      if(days<0){st='已过期 '+Math.abs(days)+' 天';c='var(--error)';}
      else if(days<=30){st='即将到期 · 剩 '+days+' 天';c='#B86B00';}
      else{st='还有 '+days+' 天';c='var(--success)';}
      var key=encodeURIComponent(r.name+'|'+r.date);
      return '<div class="qt-rline"><div class="qt-rmeta"><div class="qt-rname">'+r.name+'</div><div class="qt-rdate">到期日 '+r.date+'</div></div>'+
        '<span class="qt-rstate mono" style="color:'+c+';">'+st+'</span>'+
        '<button class="qt-rdel" onclick="delRemind(\''+key+'\')">✕</button></div>';
    }).join('');
    h+='<button class="btn btn-ghost btn-block qt-btn" onclick="renewRemind()">去服务广场办续期 / 年检 ›</button>';
  }
  return h;
}

  {id:'2000-5000',label:'¥2000-5000'},

];
var tempFilterSeller='all',tempFilterPrice='all';
function renderFilterBody(){
  var body=document.getElementById('filterBody');
  if(!body)return;
  var catHtml='<div class="filter-group"><div class="filter-group-label">服务分类</div><div class="filter-options">'+
    CATS.map(function(c){return '<span class="filter-opt'+(c.id===curCat?' active':'')+'" data-fcat="'+c.id+'">'+c.label+'</span>';}).join('')+
  '</div></div>';

    FILTER_SELLER.map(function(s){return '<span class="filter-opt'+(s.id===tempFilterSeller?' active':'')+'" data-fseller="'+s.id+'">'+s.label+'</span>';}).join('')+
  '</div></div>';
  var priceHtml='<div class="filter-group"><div class="filter-group-label">价格区间</div><div class="filter-options">'+
    FILTER_PRICE.map(function(p){return '<span class="filter-opt'+(p.id===tempFilterPrice?' active':'')+'" data-fprice="'+p.id+'">'+p.label+'</span>';}).join('')+
  '</div></div>';

.sub-chip .chip{flex:none;padding:9px 14px;border-radius:99px;font-size:11.5px;color:var(--text-2);background:var(--bg-card);border:1px solid var(--line);cursor:pointer;transition:all var(--d-fast);}
.sub-chip .chip:active{transform:scale(.95);}
.sub-chip .chip.on{color:var(--primary-dim);background:var(--primary-soft);border-color:var(--accent-line);font-weight:600;}
.mkt-sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 2px;margin:0;transition:box-shadow var(--d-fast);}
.mkt-sticky.is-stuck{box-shadow:0 8px 18px -14px rgba(22,22,22,.28);}
.svc-more{flex:none;font-size:11px;font-weight:600;color:var(--primary-dim);}


/* ===== 服务商卡片（信息分级：标题/机构口碑/价格/保障） ===== */
.svc-card{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--bg-card);margin-bottom:10px;box-shadow:var(--shadow-xs);transition:transform var(--d-fast),border-color var(--d-fast),box-shadow var(--d-fast);animation:svc-in .45s var(--e-out) both;}
@keyframes svc-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.svc-card:hover{transform:translateY(-1.5px);border-color:color-mix(in srgb,var(--primary) 42%,var(--line));box-shadow:0 10px 24px -12px rgba(22,22,22,.18);}
.svc-card:active{transform:scale(.98);border-color:var(--accent-line);}
.svc-card.svc-org{border-color:color-mix(in srgb,var(--primary) 30%,var(--line));}
.svc-top{display:flex;align-items:flex-start;gap:12px;}
.svc-meta{flex:1;min-width:0;}
.svc-name{font-size:15px;font-weight:700;color:var(--text-1);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.svc-orgline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:11px;color:var(--text-2);}
.svc-v{font-size:9px;font-weight:800;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#C9A961);border-radius:5px;padding:2px 6px;box-shadow:0 2px 6px rgba(201,169,97,.55);line-height:1.5;cursor:help;flex:none;}
.svc-co,.svc-cy{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);min-width:0;}
.svc-co{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;}
.svc-cy{flex:none;color:var(--text-3);}
.svc-co svg,.svc-cy svg{width:10px;height:10px;color:var(--success);stroke-width:2;flex:none;}
.svc-cy svg{color:var(--primary-dim);}
.svc-score{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-3);margin-top:6px;flex-wrap:wrap;}
.svc-score svg{width:10px;height:10px;color:var(--primary);fill:var(--primary);}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--line-strong);display:inline-block;}
.svc-agg{font-size:10.5px;font-weight:600;color:var(--success);white-space:nowrap;}
.svc-price{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:2px;}
.svc-price .mono{font-size:16px;font-weight:800;color:var(--primary-dim);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.2px;}
.svc-unit{font-size:10px;font-weight:400;color:var(--text-3);white-space:nowrap;}
.svc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.svc-dep{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);min-width:0;}
.svc-dep svg{width:11px;height:11px;color:var(--primary-dim);flex:none;}
.svc-cta{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--text-2);background:var(--bg-card-2);border:1px solid var(--line);border-radius:99px;padding:12px 20px;transition:all var(--d-fast);}
.svc-cta svg{width:11px;height:11px;}
.svc-cta.cta-org{color:var(--text-inv);background:linear-gradient(135deg,var(--primary),var(--primary-dim));border:none;box-shadow:0 6px 16px -5px rgba(201,169,97,.65);}
.svc-cta.cta-org:hover{box-shadow:0 8px 20px -5px rgba(201,169,97,.8);filter:brightness(1.05);}
.svc-cta.cta-org:active{transform:scale(.94);box-shadow:0 2px 8px -3px rgba(201,169,97,.5);}

/* ===== 空态（无搜索结果兜底） ===== */
.empty-card{text-align:center;padding:28px 18px;background:var(--bg-card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-xs);}
.e-ic{width:46px;height:46px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--bg-card-2);color:var(--text-3);}
.e-ic svg{width:22px;height:22px;}
.e-rec{display:flex;flex-direction:column;gap:6px;margin-top:14px;text-align:left;}
.e-rec-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg-card-2);cursor:pointer;transition:border-color var(--d-fast);}
.e-rec-item:active{border-color:var(--accent-line);}
.e-rec-av{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--primary-strong);background:linear-gradient(135deg,#2A313C,#161B23);}
.e-rec-t{flex:1;font-size:11.5px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.e-rec-go{color:var(--text-3);font-size:12px;}
.e-help{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11px;font-weight:600;color:var(--primary-dim);background:var(--primary-soft);border-radius:99px;padding:7px 14px;cursor:pointer;}
.e-help svg{width:12px;height:12px;}
.btn-pill{border-radius:99px;box-shadow:0 4px 12px -4px rgba(201,169,97,.5);}
.btn-pill:active{transform:scale(.96);}



@media (prefers-reduced-motion: reduce){.escrow-banner,.svc-card,.rh{animation:none;}}

/* 交叉导流：资源线入口 */
.cross-resource-row{display:flex;gap:10px;margin:0 0 16px;}
.cr-item{flex:1;min-width:0;text-decoration:none;background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;transition:transform .2s,border-color .2s;}
.cr-item:active{transform:scale(.97);}
.cr-item:hover{border-color:var(--primary);}
.cr-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
.cr-ic svg{width:19px;height:19px;}
.cr-t{font-size:13px;font-weight:700;color:var(--text-1);}
.cr-s{font-size:10.5px;color:var(--text-3);margin-top:2px;}

.svc-credit{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--primary-strong);background:rgba(201,169,97,.1);border:1px solid rgba(201,169,97,.3);border-radius:99px;padding:2px 8px;}

/* WP6 顺手办 */
.quick-tools{margin:0 0 14px;padding:0;animation:eb-in .45s var(--e-out) both;animation-delay:120ms;}
.qt-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;}
.qt-label svg{width:14px;height:14px;color:var(--primary-dim);}
.qt-row{display:flex;gap:6px;}
.qt-item{flex:1;min-width:0;text-align:center;cursor:pointer;padding:6px 4px;border-radius:10px;transition:background .2s;}
.qt-item:active{background:var(--bg-card-2);}
.qt-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;}
.qt-ic svg{width:16px;height:16px;}
.qt-t{font-size:11px;font-weight:600;color:var(--text-1);}
.qt-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;}
.qt-mask.show{opacity:1;pointer-events:auto;}
.qt-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg-card);border-radius:20px 20px 0 0;z-index:91;transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s;max-height:75vh;overflow-y:auto;padding:18px 20px 30px;}
.qt-sheet.show{transform:translateY(0);visibility:visible;}
.ns-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;}
.ns-mask.show{opacity:1;pointer-events:auto;}
.ns-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg-card);border-radius:20px 20px 0 0;z-index:91;transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s;max-height:82vh;overflow-y:auto;padding:8px 20px 30px;}
.ns-sheet.show{transform:translateY(0);visibility:visible;}
.ns-grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px;}
.ns-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ns-title{font-size:16px;font-weight:800;color:var(--text-1);}
.ns-close{width:32px;height:32px;border:none;background:var(--bg-card-2);border-radius:50%;font-size:14px;color:var(--text-3);cursor:pointer;flex:none;}
.ns-sub{font-size:11.5px;color:var(--text-3);margin:3px 0 14px;line-height:1.5;}
.ns-body .need-scenes{margin:0 0 12px;}
.qt-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.qt-sheet-title{font-size:16px;font-weight:800;color:var(--text-1);}
.qt-sheet-close{width:32px;height:32px;border:none;background:var(--bg-card-2);border-radius:50%;font-size:14px;color:var(--text-3);cursor:pointer;}
.qt-select{width:100%;height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13px;background:var(--bg-card);color:var(--text-1);}
.qt-input{width:100%;height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:11px;font-size:13px;background:var(--bg-card);color:var(--text-1);box-sizing:border-box;}
.qt-date{flex:1;height:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:11px;font-size:12px;background:var(--bg-card);color:var(--text-1);}
.qt-add{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.qt-btn{margin-top:12px;height:44px;font-size:14px;}
.qt-row-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--text-1);}
.qt-row-line input{width:18px;height:18px;accent-color:var(--primary);flex:none;}
.qt-done{color:var(--text-3);text-decoration:line-through;}
.qt-miss{margin-top:12px;padding:10px 12px;background:var(--accent-soft);border-radius:10px;font-size:11.5px;color:var(--ink-secondary);line-height:1.6;}
.qt-miss b{color:var(--primary-dim);}
.qt-ok{margin-top:12px;padding:10px 12px;background:var(--success-soft);border-radius:10px;font-size:12px;color:var(--success);}
.qt-none{padding:20px;text-align:center;color:var(--text-3);font-size:12px;}
.qt-rline{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);}
.qt-rmeta{flex:1;min-width:0;}
.qt-rname{font-size:13px;font-weight:600;color:var(--text-1);}
.qt-rdate{font-size:10.5px;color:var(--text-3);margin-top:1px;}
.qt-rstate{flex:none;font-size:10.5px;font-weight:700;white-space:nowrap;}
.qt-rdel{flex:none;border:none;background:transparent;color:var(--text-3);font-size:13px;cursor:pointer;padding:4px;}
.qt-prow{padding:10px 0;border-bottom:1px solid var(--line);}
.qt-phead{display:flex;align-items:center;gap:6px;}
.qt-pk{font-size:12px;font-weight:700;color:var(--primary);}
.qt-py{font-size:10px;color:var(--text-4);}
.qt-pv{font-size:12.5px;font-weight:600;color:var(--text-1);margin-top:2px;}
.qt-pt{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.6;}

/* ---- 筛选面板 ---- */
.filter-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.filter-mask.show{opacity:1;pointer-events:auto;}
.filter-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-height:75vh;display:flex;flex-direction:column;}
.filter-sheet.show{transform:translateY(0);}
.filter-grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:none;}
.filter-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;flex:none;}
.filter-title{font-size:16px;font-weight:700;color:var(--text-1);}
.filter-close{width:28px;height:28px;border-radius:50%;background:var(--bg-card-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:14px;cursor:pointer;border:none;}
.filter-body{flex:1;overflow-y:auto;padding:0 18px 16px;}
.filter-group{margin-bottom:18px;}
.filter-group-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px;letter-spacing:.3px;}
.filter-options{display:flex;flex-wrap:wrap;gap:8px;}
.filter-opt{padding:7px 14px;border-radius:999px;font-size:12px;color:var(--text-2);background:var(--bg-card-2);border:1px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500;}
.filter-opt:active{transform:scale(.95);}
.filter-opt.active{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(31,78,153,.25);}
.filter-foot{display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;background:var(--bg);}
.filter-reset{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg-card);color:var(--text-2);font-size:14px;font-weight:600;cursor:pointer;}
.filter-confirm{flex:2;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(31,78,153,.3);}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;line-height:1;}
</style>
</body>
</html>
