<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/agency/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">服务广场</div>
    <div class="nav-right"><span class="tag tag-primary" id="mode-tag" style="font-size:10px;">成熟期</span></div>
  </div>

  <div class="scroll" style="padding-top:10px;">
    <!-- 买方引导：本页为交易引导页；服务商经营入口仅在 个人中心·服务经营 -->
    <div class="role-hint" id="role-hint" style="display:none;"></div>

    <!-- 我的单（买方订单） -->
    <div class="my-bar">
      <div class="my-entry" onclick="location.href='order.html?mine=1'">
        <span class="me-ic me-gold"><svg class="ic"><use href="#i-doc"/></svg></span>
        <div class="me-meta"><span class="me-label">我的单</span><b class="me-num mono" id="my-buy">0</b></div>
        <svg class="me-chev" viewBox="0 0 24 24"><use href="#i-chev-r"/></svg>
      </div>
    </div>

    <!-- 平台担保横幅：托管流程可视化 -->
    <div class="escrow-banner">
      <span class="eb-glow" aria-hidden="true"></span>
      <div class="eb-head">
        <span class="eb-ic"><svg class="ic"><use href="#i-shield"/></svg></span>
        <div>
          <div class="fw-700 fs-15" style="color:#F4F2EE;">线上成交 · 资金托管</div>
          <div class="text-2 fs-11" style="color:rgba(244,242,238,.6);margin-top:3px;">持牌机构托管，未成交全额退款</div>
        </div>
        <span class="eb-badge">已核验</span>
      </div>
      <div class="eb-steps">
        <div class="eb-step on"><span class="eb-dot">1</span><span class="eb-t">在线预付</span></div>
        <span class="eb-line"></span>
        <div class="eb-step on"><span class="eb-dot">2</span><span class="eb-t">持牌托管</span></div>
        <span class="eb-line"></span>
        <div class="eb-step on"><span class="eb-dot">3</span><span class="eb-t">履约验收</span></div>
        <span class="eb-line"></span>
        <div class="eb-step"><span class="eb-dot">4</span><span class="eb-t">结算服务商</span></div>
      </div>
      <div class="eb-tags">
        <span class="tag tag-gold" style="font-size:10px;">资金托管</span>
        <span class="tag" style="font-size:10px;border-color:rgba(201,169,97,.35);color:var(--primary-strong);background:rgba(201,169,97,.08);">金V 认证中介</span>
      </div>
    </div>

    <!-- 服务市场：搜索 + 热门/历史 + 分类 + 服务列表 -->
    <div class="mkt-search"><svg class="ic"><use href="#i-search"/></svg><input id="mkt-q" class="input" placeholder="搜索服务 / 机构，如：资质升级、担保、造价"></div>
    <div class="hot-row" id="hot-row"></div>
    <div class="sub-chip" id="mkt-cats"></div>
    <div class="section-title"><div class="st-left">服务市场</div><span class="more" id="mkt-count">金V 已核验</span></div>
    <div id="svc-list"></div>

    <!-- 履约保障（买方可见）：里程碑 + 资金托管 -->
    <div class="section-title" style="margin-top:16px;"><div class="st-left">履约保障</div></div>
    <details class="guard-fold">
      <summary><span class="gf-ic"><svg class="ic"><use href="#i-check"/></svg></span><span>分期验收放款 · 大额订单里程碑</span><span class="gf-arrow"></span></summary>
      <div class="card rule-card" style="margin-top:10px;">
        <div class="rc-head"><span class="rc-ic rc-green"><svg class="ic"><use href="#i-check"/></svg></span><span>分期释放 · 验收放款</span></div>
        <div id="mile-list"></div>
      </div>
      <div class="card rule-card" style="margin-top:10px;">
        <div class="rc-head"><span class="rc-ic rc-gold"><svg class="ic"><use href="#i-shield"/></svg></span><span>资金托管 · 未成交退款</span></div>
        <div class="text-2 fs-12" style="line-height:1.8;">下单金额托管至持牌机构监管账户（非平台收入）；未成交 / 未使用权益全额退款，不结算、不产生费用。验收后按里程碑释放给服务商。</div>
      </div>
    </details>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js?v=p0fix"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script>
(function(){window.__ROOT__='../../';
function money(n){return '¥'+(Number(n||0)).toLocaleString('zh-CN');}
var cm=RULE('commission',MOCK.business.commission);

/* ---- 数据源：MOCK 机构服务（完整详情）+ 中介企业发布的供应（SupplyStore 同源） ---- */
var _BIZ_MAP={'材料':'material','设备':'equipment','劳务':'labor','项目合作':'cooperation','合作':'cooperation','中介服务':'agency','中介':'agency','资质招商':'franchise','建企买卖':'trade','招聘':'personnel','求职':'talent'};
/* 机构名：按 companyId 查 companies 表（MOCK 机构服务归属已核验企业） */
function companyOf(cid){
  if(!cid)return'';
  try{var c=(window.MOCK&&MOCK.companyById)?MOCK.companyById(cid):null;return (c&&(c.short||c.name))||'';}catch(e){}
  return'';
}
function cycleOf(h){
  if(!h)return'';
  var m=/[（(]?约?\s*(\d+(?:\.\d+)?)\s*[–\-~]?\s*(\d+(?:\.\d+)?)?\s*个月/.exec(String(h));
  return m?('约'+(m[2]?m[1]+'-'+m[2]:m[1])+'个月'):'';
}
function normAgency(s){
  var cid=s.companyId||'';
  return {
    id: s.id,
    title: s.title || s.name || '中介服务',
    sub: s.sub || s.subType || s.category || s.cat || '',
    rating: (typeof s.rating==='number')?s.rating:(s.score||0),
    orders: s.orders || 0,
    successRate: (typeof s.successRate==='number')?s.successRate:null,
    budget: s.budget || s.price || '',
    unit: s.unit || '',
    cats: s.cats || [s.subType || s.sub || s.category || '中介服务'],
    sellerId: s.sellerId || 'u2',
    isOrg: !!s.serveType,
    company: companyOf(cid) || s.company || '',
    cycle: cycleOf(s.handleCycle),
    caseCount: (s.cases&&s.cases.length)?s.cases.length:0,
    keyword: [s.title||'', s.sub||'', s.subType||'', s.category||'', s.cat||'', s.company||'', s.desc||'', s.serveType||'', s.targetQualLevel||'', (s.tags||[]).join(' ')].join(' ')
  };
}
function agencySource(){
  var out=[];
  var mocks=(window.MOCK&&MOCK.byBizType)?(MOCK.byBizType('agency')||[]):[];
  mocks.forEach(function(s){out.push(normAgency(s));});
  if(window.SupplyStore){
    SupplyStore.listActive().forEach(function(s){
      var bk=s.bizKey||_BIZ_MAP[s.cat]||'';
      if(bk==='agency'&&(s.dir||s.type)!=='demand'){out.push(normAgency(s));}
    });
  }
  var seen={},uniq=[];
  out.forEach(function(s){if(!seen[s.id]){seen[s.id]=1;uniq.push(s);}});
  return uniq;
}
window.SVCS=agencySource();

/* ---- 分类 chips ---- */
var CATS=[
  {id:'all',label:'全部',test:function(){return true;}},
  {id:'qual',label:'资质代办',test:function(s){return /资质|升级|分立/.test(s.keyword);}},
  {id:'guarantee',label:'工程担保',test:function(s){return /担保|保函/.test(s.keyword);}},
  {id:'cost',label:'造价咨询',test:function(s){return /造价|审核|咨询/.test(s.keyword);}},
  {id:'labor',label:'劳务派遣',test:function(s){return /劳务|派遣|人力/.test(s.keyword);}},
  {id:'corp',label:'企业服务',test:function(s){return /工商|注册|安许|税务|企业服务/.test(s.keyword);}}
];
var curCat='all',curQ='';
function renderCats(){
  document.getElementById('mkt-cats').innerHTML=CATS.map(function(c){
    return '<span class="chip'+(c.id===curCat?' on':'')+'" data-cat="'+c.id+'" onclick="window.pickCat(\''+c.id+'\')">'+c.label+'</span>';
  }).join('');
}
window.pickCat=function(id){curCat=id;renderCats();renderList();};

/* ---- 热门搜索 + 搜索历史（本地持久化） ---- */
var HOT_WORDS=['资质升级','工程担保','安许代办','造价审计','劳务派遣'];
var SQ_KEY='engchain-agency-sq';
function sqHistory(){try{return JSON.parse(localStorage.getItem(SQ_KEY)||'[]');}catch(e){return[];}}
function sqAdd(w){
  w=(w||'').trim();if(!w)return;
  var h=sqHistory().filter(function(x){return x!==w;});h.unshift(w);h=h.slice(0,5);
  try{localStorage.setItem(SQ_KEY,JSON.stringify(h));}catch(e){}
}
function renderHot(){
  var hist=sqHistory();
  var chips=HOT_WORDS.map(function(w){return '<span class="hot-chip" data-w="'+w+'">'+w+'</span>';}).join('');
  var histHtml=hist.length
    ? hist.map(function(w){return '<span class="hot-chip hot-hist" data-w="'+w+'">'+w+'<i class="hh-x" data-x="'+w+'">×</i></span>';}).join('')
    : '';
  var el=document.getElementById('hot-row');
  if(!el)return;
  el.innerHTML=(chips||histHtml)
    ? '<span class="hot-lab">'+(hist.length?'最近搜索':'热门')+'</span>'+chips+histHtml
    : '';
  el.querySelectorAll('.hot-chip[data-w]').forEach(function(c){
    c.addEventListener('click',function(ev){
      if(ev.target.classList.contains('hh-x'))return;
      var w=c.getAttribute('data-w');
      var q=document.getElementById('mkt-q');if(q)q.value=w;
      curQ=w;sqAdd(w);renderHot();renderList();
    });
  });
  el.querySelectorAll('.hh-x').forEach(function(x){
    x.addEventListener('click',function(ev){
      ev.stopPropagation();
      var w=x.getAttribute('data-x');
      try{localStorage.setItem(SQ_KEY,JSON.stringify(sqHistory().filter(function(y){return y!==w;})));}catch(e){}
      renderHot();
    });
  });
}

function renderList(){
  var list=SVCS.filter(function(s){
    var cat=CATS.filter(function(c){return c.id===curCat;})[0]||CATS[0];
    return cat.test(s)&&(!curQ||s.keyword.toLowerCase().indexOf(curQ.toLowerCase())>-1);
  });
  var cnt=document.getElementById('mkt-count');if(cnt)cnt.textContent=list.length+' 项服务';
  var acc=window.entryAccess?entryAccess():{statusId:'guest'};
  if(!list.length){
    /* C4 空态兜底：换词建议 + 热门推荐 + 平台兜底 */
    var recs=SVCS.slice(0,2);
    document.getElementById('svc-list').innerHTML=
      '<div class="empty-card">'+
        '<div class="e-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></div>'+
        '<div class="fw-700 fs-14" style="color:var(--text-1);">未找到匹配的服务</div>'+
        '<div class="text-3 fs-12" style="margin-top:5px;line-height:1.7;">试试更换关键词或分类，也可直接联系平台顾问帮您对接</div>'+
        (recs.length?'<div class="e-rec">'+recs.map(function(r){
          return '<div class="e-rec-item" onclick="location.href=\'../supply/detail.html?id='+r.id+(r.isOrg?'&from=market':'')+'\'">'+
            '<span class="e-rec-av">'+r.sub.charAt(0)+'</span><span class="e-rec-t">'+r.title+'</span><span class="e-rec-go">›</span></div>';
        }).join('')+'</div>':'')+
        '<div class="e-help" onclick="window.UI&&UI.toast(\'平台顾问将尽快与您联系\',\'ok\')"><svg class="ic"><use href="#i-chat"/></svg>需要帮助？联系平台顾问</div>'+
      '</div>';
    return;
  }
  document.getElementById('svc-list').innerHTML=list.map(function(s,i){
    var priceMain='按需报价',priceSub='';
    if(s.budget){
      var uParts=String(s.unit||'').split('·').map(function(x){return x.trim();}).filter(Boolean);
      priceMain=s.budget+(uParts[0]||'');
      priceSub=uParts.slice(1).join('·');
    }
    var stars=(typeof s.rating==='number'&&s.rating>0)?s.rating.toFixed(1):'—';
    var metaBits=[];
    metaBits.push('<svg class="ic"><use href="#i-star"/></svg>'+stars+' 分');
    if(s.successRate!=null)metaBits.push('成功率 '+s.successRate+'%');
    if(s.orders)metaBits.push(s.orders+' 成交');
    if(s.caseCount)metaBits.push(s.caseCount+' 案例');
    /* C3 评价回流：订单评价聚合并入口碑行 */
    var agg=null;
    try{if(window.SvcRatingStore)agg=SvcRatingStore.get(s.id);}catch(e){}
    var href='../supply/detail.html?id='+s.id+(s.isOrg?'&from=market':'');
    return '<div class="svc-card'+(s.isOrg?' svc-org':'')+'" style="animation-delay:'+(i*70)+'ms;" onclick="location.href=\''+href+'\'">'+
      '<div class="svc-top">'+
        '<div class="svc-meta">'+
          '<div class="svc-name">'+s.title+'</div>'+
          '<div class="svc-orgline">'+
            (s.isOrg?'<span class="svc-v" title="已核验中介企业 · 平台认证">金V</span>':'')+
            (s.company?'<span class="svc-co"><svg class="ic"><use href="#i-check"/></svg>'+s.company+'</span>':'')+
            (s.cycle?'<span class="svc-cy"><svg class="ic"><use href="#i-clock"/></svg>'+s.cycle+'</span>':'')+
          '</div>'+
          '<div class="svc-score">'+metaBits.join('<i class="dot-sep"></i>')+
            (agg?'<i class="dot-sep"></i><span class="svc-agg">好评 '+agg.count+' · '+agg.avg+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="svc-price"><span class="mono fw-700">'+priceMain+'</span>'+
          (priceSub?'<span class="svc-unit">'+priceSub+'</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="svc-tags">'+s.cats.slice(0,4).map(function(c){return '<span class="tag tag-gray">'+c+'</span>';}).join('')+'</div>'+
      '<div class="svc-foot">'+
        '<span class="svc-dep"><svg class="ic"><use href="#i-shield"/></svg>'+(s.isOrg?'资金托管 · 未成交退款':'平台对接 · 免费咨询')+'</span>'+
        '<span class="svc-cta'+(s.isOrg?' cta-org':'')+'">'+(s.isOrg?'在线下单':'免费咨询')+'<svg class="ic"><use href="#i-chev-r"/></svg></span>'+
      '</div>'+
    '</div>';
  }).join('');
}
window.renderList=renderList;

/* 搜索实时过滤 */
function bindSearch(){
  var q=document.getElementById('mkt-q');
  if(!q)return;
  q.addEventListener('input',function(){curQ=this.value.trim();renderList();});
  q.addEventListener('keydown',function(e){if(e.key==='Enter'){sqAdd(this.value);renderHot();}});
  q.addEventListener('blur',function(){if(this.value.trim()){sqAdd(this.value);renderHot();}});
}

/* C1 买方引导：本页统一为交易引导（服务商经营入口仅在 个人中心·服务经营） */
function renderRoleHint(){
  var el=document.getElementById('role-hint');if(!el)return;
  el.style.display='block';
  el.innerHTML='<div class="rh rh-buyer"><span class="rh-ic"><svg class="ic"><use href="#i-search"/></svg></span>'+
    '<div class="rh-meta"><b>找服务三步走</b><span>看口碑报价 → 在线下单 → 资金托管验收</span></div>'+
    '<span class="rh-go" onclick="location.href=\'order.html?mine=1\'">我的单 ›</span></div>';
}

/* 门控 + 入口 + 首次渲染 */
function render(){
  var mt=document.getElementById('mode-tag');
  if(window.ModeStore&&ModeStore.isBreakIn())mt.textContent='破冰期';else mt.textContent='成熟期';
  var me=DataBus.current(),uid=me?me.id:'';
  if(window.Mediation){
    document.getElementById('my-buy').textContent=Mediation.list({uid:uid,role:'buyer'}).length;
  }
  renderCats();renderList();renderHot();renderRoleHint();
}

/* 里程碑（买方可见履约保障；阈值/节点/自动确认天数取配置） */
document.getElementById('mile-list').innerHTML=
  '<div class="text-3 fs-12" style="padding-bottom:6px;">订单金额 ≥ '+money(cm.milestone.minAmount)+' 启用 '+cm.milestone.nodes.length+' 节点分期托管</div>'+
  cm.milestone.nodes.map(function(n,i){return '<div class="rc-row" style="gap:10px;"><span class="rc-idx '+(i===cm.milestone.nodes.length-1?'rc-idx-gold':'')+'">'+(i+1)+'</span><span class="fs-12 text-2" style="flex:1;">'+cm.milestone.labels[i]+'</span><span class="mono fw-700 fs-12">'+(n*100).toFixed(0)+'%</span></div>';}).join('')+
  '<div class="text-3 fs-11" style="padding-top:6px;line-height:1.7;">交付后 '+cm.milestone.autoConfirmDays+' 天买方未操作则系统自动确认；未成交全额退款。</div>';

render();
bindSearch();
window.addEventListener('engchain:mode', render);
window.addEventListener('engchain:store-change', render);
window.addEventListener('engchain:lead', function(){if(window.Mediation)render();});
})();
</script>
<style>
/* ===== 双入口卡片 ===== */
.my-bar{display:flex;gap:10px;margin-bottom:12px;}
.my-entry{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg-card);cursor:pointer;box-shadow:var(--shadow-xs);transition:transform var(--d-fast),border-color var(--d-fast);}
.my-entry:active{transform:scale(.97);border-color:var(--accent-line);}
.me-ic{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;}
.me-ic svg{width:16px;height:16px;stroke-width:1.8;}
.me-gold{background:var(--primary-soft);color:var(--primary-dim);}
.me-green{background:rgba(43,107,79,.10);color:var(--success);}
.me-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.me-label{font-size:11px;color:var(--text-3);}
.me-num{font-size:20px;font-weight:800;color:var(--text-1);font-family:var(--font-num);line-height:1;}
.me-chev{width:14px;height:14px;color:var(--text-3);flex:none;}

/* ===== 身份感知引导条（用户 vs 服务商） ===== */
.role-hint{margin-bottom:10px;}
.rh{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg-card);box-shadow:var(--shadow-xs);animation:eb-in .45s var(--e-out) both;}
.rh-ic{width:30px;height:30px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;}
.rh-ic svg{width:15px;height:15px;stroke-width:1.8;}
.rh-buyer .rh-ic{background:var(--primary-soft);color:var(--primary-dim);}
.rh-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.rh-meta b{font-size:12px;font-weight:700;color:var(--text-1);}
.rh-meta span{font-size:10.5px;color:var(--text-3);line-height:1.5;}
.rh-go{flex:none;font-size:11px;font-weight:600;color:var(--primary-dim);cursor:pointer;padding:6px 10px;border-radius:99px;background:var(--primary-soft);white-space:nowrap;}

/* ===== 热门搜索 / 搜索历史 ===== */
.hot-row{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.hot-row::-webkit-scrollbar{display:none;}
.hot-lab{flex:none;font-size:10px;font-weight:700;color:var(--text-3);margin-right:2px;}
.hot-chip{flex:none;font-size:10.5px;color:var(--text-2);background:var(--bg-card-2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;transition:all var(--d-fast);}
.hot-chip:active{transform:scale(.95);}
.hot-chip:hover{border-color:var(--accent-line);color:var(--primary-dim);}
.hot-chip.hot-hist{background:transparent;color:var(--text-3);}
.hh-x{font-style:normal;margin-left:4px;color:var(--text-3);opacity:.7;}

/* ===== 担保横幅（深色） ===== */
.escrow-banner{position:relative;overflow:hidden;border-radius:18px;padding:16px;margin-bottom:14px;
  background:radial-gradient(130% 120% at 86% -12%, rgba(238,214,151,.18) 0%, transparent 55%),linear-gradient(150deg,#252C35 0%,#151A22 46%,#0B0E13 100%);
  box-shadow:0 10px 26px rgba(22,22,22,.14);animation:eb-in .5s var(--e-out) both;}
@keyframes eb-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.eb-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 100% 0%, rgba(238,214,151,.10) 0%, transparent 55%);}
.eb-head{display:flex;align-items:center;gap:10px;position:relative;}
.eb-ic{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);box-shadow:0 5px 14px rgba(201,169,97,.35);}
.eb-ic svg{width:17px;height:17px;stroke-width:1.7;}
.eb-badge{margin-left:auto;font-size:9.5px;font-weight:700;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#C9A961);border-radius:6px;padding:3px 8px;box-shadow:0 2px 8px -3px rgba(201,169,97,.7);white-space:nowrap;}
.eb-steps{display:flex;align-items:flex-start;margin-top:16px;position:relative;}
.eb-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:64px;}
.eb-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#1A1F26;background:rgba(244,242,238,.85);box-shadow:0 2px 6px rgba(0,0,0,.3);}
.eb-step.on .eb-dot{background:linear-gradient(135deg,#F0E2BE,#C9A961);color:#2A1810;box-shadow:0 2px 8px rgba(201,169,97,.6);}
.eb-t{font-size:9.5px;color:rgba(244,242,238,.6);white-space:nowrap;}
.eb-step.on .eb-t{color:#F4F2EE;font-weight:600;}
.eb-line{flex:1;height:1.5px;background:rgba(244,242,238,.16);margin:10px 2px 0;border-radius:2px;position:relative;}
.eb-line::after{content:"";position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,#C9A961,#E8D5A3);opacity:.85;}
.eb-tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;}

/* ===== 市场搜索 + 分类 chips ===== */
.mkt-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg-card);margin-bottom:10px;}
.mkt-search .ic{width:15px;height:15px;color:var(--text-3);flex:none;}
.mkt-search .input{border:none;background:transparent;padding:0;font-size:13px;flex:1;min-width:0;box-shadow:none;}
.sub-chip{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.sub-chip::-webkit-scrollbar{display:none;}
.sub-chip .chip{flex:none;padding:6px 13px;border-radius:99px;font-size:11.5px;color:var(--text-2);background:var(--bg-card);border:1px solid var(--line);cursor:pointer;transition:all var(--d-fast);}
.sub-chip .chip:active{transform:scale(.95);}
.sub-chip .chip.on{color:var(--primary-dim);background:var(--primary-soft);border-color:var(--accent-line);font-weight:600;}
.svc-more{flex:none;font-size:11px;font-weight:600;color:var(--primary-dim);}
/* ===== 履约保障折叠 ===== */
.guard-fold{border:1px solid var(--line);border-radius:16px;background:var(--bg-card);box-shadow:var(--shadow-xs);}
.guard-fold summary{display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;list-style:none;font-size:12.5px;font-weight:600;color:var(--text-1);}
.guard-fold summary::-webkit-details-marker{display:none;}
.gf-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--primary-soft);color:var(--primary-dim);}
.gf-ic svg{width:13px;height:13px;stroke-width:1.9;}
.gf-arrow{width:8px;height:8px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);transform:rotate(45deg);margin-left:auto;transition:transform var(--d-fast);}
.guard-fold[open] .gf-arrow{transform:rotate(-135deg);}
.guard-fold .card{margin-bottom:0;}

/* ===== 服务商卡片（信息分级：标题/机构口碑/价格/保障） ===== */
.svc-card{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--bg-card);margin-bottom:10px;box-shadow:var(--shadow-xs);transition:transform var(--d-fast),border-color var(--d-fast),box-shadow var(--d-fast);animation:svc-in .45s var(--e-out) both;}
@keyframes svc-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.svc-card:hover{transform:translateY(-1.5px);border-color:color-mix(in srgb,var(--primary) 42%,var(--line));box-shadow:0 10px 24px -12px rgba(22,22,22,.18);}
.svc-card:active{transform:scale(.98);border-color:var(--accent-line);}
.svc-card.svc-org{border-color:color-mix(in srgb,var(--primary) 30%,var(--line));}
.svc-top{display:flex;align-items:flex-start;gap:12px;}
.svc-meta{flex:1;min-width:0;}
.svc-name{font-size:15px;font-weight:700;color:var(--text-1);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.svc-orgline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:11px;color:var(--text-2);}
.svc-v{font-size:9px;font-weight:800;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#C9A961);border-radius:5px;padding:2px 6px;box-shadow:0 2px 6px rgba(201,169,97,.55);line-height:1.5;cursor:help;flex:none;}
.svc-co,.svc-cy{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);min-width:0;}
.svc-co{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;}
.svc-cy{flex:none;color:var(--text-3);}
.svc-co svg,.svc-cy svg{width:10px;height:10px;color:var(--success);stroke-width:2;flex:none;}
.svc-cy svg{color:var(--primary-dim);}
.svc-score{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-3);margin-top:6px;flex-wrap:wrap;}
.svc-score svg{width:10px;height:10px;color:var(--primary);fill:var(--primary);}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--line-strong);display:inline-block;}
.svc-agg{font-size:10.5px;font-weight:600;color:var(--success);white-space:nowrap;}
.svc-price{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:2px;}
.svc-price .mono{font-size:16px;font-weight:800;color:var(--primary-dim);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.2px;}
.svc-unit{font-size:10px;font-weight:400;color:var(--text-3);white-space:nowrap;}
.svc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.svc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);}
.svc-dep{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);min-width:0;}
.svc-dep svg{width:11px;height:11px;color:var(--primary-dim);flex:none;}
.svc-cta{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--text-2);background:var(--bg-card-2);border:1px solid var(--line);border-radius:99px;padding:10px 20px;transition:all var(--d-fast);}
.svc-cta svg{width:11px;height:11px;}
.svc-cta.cta-org{color:var(--text-inv);background:linear-gradient(135deg,var(--primary),var(--primary-dim));border:none;box-shadow:0 6px 16px -5px rgba(201,169,97,.65);}
.svc-cta.cta-org:hover{box-shadow:0 8px 20px -5px rgba(201,169,97,.8);filter:brightness(1.05);}
.svc-cta.cta-org:active{transform:scale(.94);box-shadow:0 2px 8px -3px rgba(201,169,97,.5);}

/* ===== 空态（无搜索结果兜底） ===== */
.empty-card{text-align:center;padding:28px 18px;background:var(--bg-card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-xs);}
.e-ic{width:46px;height:46px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--bg-card-2);color:var(--text-3);}
.e-ic svg{width:22px;height:22px;}
.e-rec{display:flex;flex-direction:column;gap:6px;margin-top:14px;text-align:left;}
.e-rec-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg-card-2);cursor:pointer;transition:border-color var(--d-fast);}
.e-rec-item:active{border-color:var(--accent-line);}
.e-rec-av{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--primary-strong);background:linear-gradient(135deg,#2A313C,#161B23);}
.e-rec-t{flex:1;font-size:11.5px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.e-rec-go{color:var(--text-3);font-size:12px;}
.e-help{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11px;font-weight:600;color:var(--primary-dim);background:var(--primary-soft);border-radius:99px;padding:7px 14px;cursor:pointer;}
.e-help svg{width:12px;height:12px;}
.btn-pill{border-radius:99px;box-shadow:0 4px 12px -4px rgba(201,169,97,.5);}
.btn-pill:active{transform:scale(.96);}

/* ===== 交易保障规则卡 ===== */
.rule-card{padding:6px 14px 12px;}
.rc-head{display:flex;align-items:center;gap:8px;padding:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--text-1);}
.rc-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
.rc-ic svg{width:13px;height:13px;stroke-width:1.9;}
.rc-gold{background:var(--primary-soft);color:var(--primary-dim);}
.rc-green{background:rgba(43,107,79,.09);color:var(--success);}
.rc-purple{background:rgba(124,91,189,.09);color:var(--purple);}
.rc-red{background:rgba(190,61,52,.08);color:var(--danger);}
.rc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);}
.rc-idx{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-2);background:var(--bg-card-2);}
.rc-idx-gold{background:var(--primary-soft);color:var(--primary-dim);}

@media (prefers-reduced-motion: reduce){.escrow-banner,.svc-card,.rh{animation:none;}}
</style>
</body>
</html>
