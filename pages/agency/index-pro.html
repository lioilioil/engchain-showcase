<meta charset="UTF-8">

<title>服务广场 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
/* ============================================
   服务广场 · 深度优化版 (基于 V3.4 Ink & Gold 设计系统)
   参考发现页布局，提升信息层次与视觉品质
   ============================================ */

/* 页面头部品牌区 */
.agency-hero {
  padding: 8px 16px 20px;
  position: relative;
  overflow: hidden;
}

.agency-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
  pointer-events: none;
}

.eyebrow-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  position: relative;
}

.eyebrow-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--primary-dim);
  background: var(--primary-soft);
  padding: 4px 10px;
  border-radius: var(--r-full);
}

.eyebrow-badge .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--primary);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.hero-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--text-1);
  margin-bottom: 8px;
  position: relative;
}

.hero-title .gold {
  background: linear-gradient(135deg, var(--primary-strong), var(--primary-deep));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-desc {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-2);
  max-width: 300px;
  position: relative;
}

/* 数据统计条 */
.hero-stats {
  display: flex;
  margin: 16px 0 4px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
}

.hero-stat {
  flex: 1;
  text-align: center;
}

.hero-stat + .hero-stat {
  border-left: 1px solid var(--line);
}

.hero-stat-num {
  font-family: var(--font-num);
  font-size: 20px;
  font-weight: 700;
  color: var(--primary-dim);
  line-height: 1;
  margin-bottom: 4px;
}

.hero-stat-label {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.03em;
}

/* 一级分类 tabs */
.cat-tabs {
  display: flex;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg);
}

.cat-tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  flex: none;
  padding: 12px 14px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  border: none;
  background: none;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color var(--d-fast);
}

.cat-tab.active {
  color: var(--text-1);
  font-weight: 600;
}

.cat-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 14px;
  right: 14px;
  height: 2.5px;
  background: linear-gradient(90deg, var(--primary-strong), var(--primary-deep));
  border-radius: 2px;
}

/* 排序筛选行 */
.list-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 8px;
}

.list-count {
  font-size: 12px;
  color: var(--text-3);
}

.list-count b {
  color: var(--text-1);
  font-weight: 600;
  font-family: var(--font-num);
}

.toolbar-actions {
  display: flex;
  gap: 16px;
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-2);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 4px 0;
}

.tool-btn svg {
  width: 12px; height: 12px;
}

.tool-btn .badge {
  min-width: 16px;
  height: 16px;
  border-radius: var(--r-full);
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  padding: 0 4px;
  font-weight: 600;
}

/* 服务卡片 — 优化版 job-card */
.svc-card {
  display: block;
  margin: 0 16px 10px;
  text-decoration: none;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 16px;
  cursor: pointer;
  position: relative;
  transition: transform var(--d-fast), border-color var(--d-fast), box-shadow var(--d-fast);
  box-shadow: var(--shadow-xs);
  animation: fadeSlideIn 0.4s ease both;
}

.svc-card:active {
  transform: scale(0.988);
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 卡片顶部标签行 */
.svc-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.tag {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 3px 8px;
  border-radius: var(--r-xs);
}

.tag-purple { background: rgba(124,91,189,.12); color: var(--purple); }
.tag-gold { background: var(--primary-soft); color: var(--primary-dim); }
.tag-red { background: rgba(179,38,30,.1); color: var(--error); }

.match-pill {
  margin-left: auto;
  font-family: var(--font-num);
  font-size: 11px;
  font-weight: 600;
  color: var(--primary-dim);
  background: var(--primary-soft);
  padding: 3px 8px;
  border-radius: var(--r-full);
}

/* 卡片主体 */
.svc-body {
  display: flex;
  gap: 12px;
}

.svc-avatar {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: var(--r-m);
  background: linear-gradient(135deg, var(--primary-strong), var(--primary-deep));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
}

.svc-info {
  flex: 1;
  min-width: 0;
}

.svc-title {
  font-family: var(--font-display);
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.38;
  letter-spacing: -0.01em;
  color: var(--text-1);
  margin-bottom: 6px;
}

.svc-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 8px;
}

.svc-meta .dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--line-strong);
}

.svc-meta svg {
  width: 12px; height: 12px;
  opacity: 0.5;
}

/* 卡片底部价格行 */
.svc-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  margin-top: 12px;
  border-top: 1px solid var(--line-hairline);
}

.svc-price {
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 600;
  color: var(--primary-dim);
  white-space: nowrap;
  font-feature-settings: "tnum" 1;
}

.svc-price .unit {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 400;
  margin-left: 2px;
}

.svc-cta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary-dim);
}

.svc-cta svg {
  width: 12px; height: 12px;
  transition: transform var(--d-fast);
}

.svc-card:active .svc-cta svg {
  transform: translateX(2px);
}

/* 交叉导流区 */
.cross-section {
  margin: 20px 16px;
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
}

.cross-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cross-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.cross-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  background: var(--bg-card-2);
  border-radius: var(--r-m);
  text-decoration: none;
  color: var(--text-1);
  transition: background var(--d-fast);
}

.cross-item:active {
  background: var(--bg-inset);
}

.cross-icon {
  width: 32px; height: 32px;
  border-radius: var(--r-s);
  background: var(--primary-soft);
  color: var(--primary-dim);
  display: flex;
  align-items: center;
  justify-content: center;
}

.cross-icon svg {
  width: 16px; height: 16px;
}

.cross-name {
  font-size: 12px;
  font-weight: 600;
}

.cross-desc {
  font-size: 10px;
  color: var(--text-3);
}

/* 底部悬浮CTA */
.float-cta {
  position: absolute;
  bottom: 20px;
  left: 16px;
  right: 16px;
  z-index: 20;
  display: flex;
  gap: 10px;
}

.cta-main {
  flex: 1;
  height: 52px;
  border: none;
  border-radius: var(--r-m);
  background: linear-gradient(135deg, var(--action), var(--action-deep));
  color: #fff;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: var(--btn-lift);
  transition: transform var(--d-fast);
}

.cta-main:active {
  transform: scale(0.98);
}

.cta-main svg {
  width: 16px; height: 16px;
}

.cta-secondary {
  flex: 1;
  height: 52px;
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--bg-card);
  color: var(--text-1);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: var(--shadow-sm);
}

.cta-secondary svg {
  width: 16px; height: 16px;
}

/* 顶部导航 */
.page-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  min-height: 44px;
}

.topbar-back {
  width: 36px; height: 36px;
  border: none;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-1);
}

.topbar-back svg {
  width: 18px; height: 18px;
}

.topbar-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-1);
}

.topbar-right {
  width: 36px; height: 36px;
  border: none;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-1);
}

.topbar-right svg {
  width: 16px; height: 16px;
}

/* 空态 */
.empty-state {
  padding: 60px 24px;
  text-align: center;
}

.empty-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--bg-card-2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  color: var(--text-3);
}

.empty-icon svg {
  width: 28px; height: 28px;
}

.empty-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 6px;
}

.empty-desc {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.6;
}
</style>
</head>

<script>
var SERVICES = [
  { id: 1, title: '建筑资质三级升级二级', company: '中建信合咨询', rating: 4.9, price: '¥35,000', unit: '/项', isOrg: true, cat: 'qual', match: 96 },

  { id: 5, title: '安全生产许可证代办', company: '安捷安全咨询', rating: 4.9, price: '¥8,000', unit: '/项', isOrg: true, cat: 'corp', match: 94 },
  { id: 6, title: '建筑工程资质分立重组', company: '中企建筑咨询', rating: 4.8, price: '¥80,000', unit: '/项', isOrg: true, cat: 'qual', match: 90 },

var currentCat = 'all';

function renderList() {
  var list = SERVICES.filter(function(s) {
    return currentCat === 'all' || s.cat === currentCat;
  });

  document.getElementById('svcCount').textContent = list.length;

  var html = list.map(function(s, i) {
    var initial = s.company.charAt(0);
    return '<a class="svc-card" style="animation-delay:' + (i * 50) + 'ms" href="../supply/detail.html?id=' + s.id + '">' +
      '<div class="svc-tags">' +
        '<span class="tag tag-purple">服务</span>' +
        (s.isOrg ? '<span class="tag tag-gold">✓已认证</span>' : '') +
        (i < 3 ? '<span class="tag tag-red">热门</span>' : '') +
        '<span class="match-pill">' + s.match + '%匹配</span>' +
      '</div>' +
      '<div class="svc-body">' +
        '<div class="svc-avatar">' + initial + '</div>' +
        '<div class="svc-info">' +
          '<div class="svc-title">' + s.title + '</div>' +
          '<div class="svc-meta">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l6-3v16M9 21V5l9-2v18M3 21h18"/></svg>' +
            '<span>' + s.company + '</span>' +
            '<span class="dot"></span>' +
            '<span>★ ' + s.rating + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="svc-footer">' +
        '<div class="svc-price">' + s.price + (s.unit ? '<span class="unit">' + s.unit + '</span>' : '') + '</div>' +
        '<div class="svc-cta">查看详情 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>' +
      '</div>' +
    '</a>';
  }).join('');

  if (!list.length) {
    html = '<div class="empty-state">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>' +
      '<div class="empty-title">暂无相关服务</div>' +
      '<div class="empty-desc">试试其他分类，或联系平台顾问为您对接</div>' +
    '</div>';
  }

  document.getElementById('svcList').innerHTML = html;
}

document.querySelectorAll('.cat-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    currentCat = this.dataset.cat;
    renderList();
  });
});

renderList();
</script>

</body>
</html>
