<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/agency/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>联系服务商 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/iphone-frame.css">
<style>
  .up-card{background:var(--bg-card-2);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;margin-top:24px;}
  .up-ic{width:52px;height:52px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary-dim);}
  .up-ic svg{width:26px;height:26px;}
  .up-t{font-size:15px;font-weight:700;color:var(--text-1);line-height:1.5;}
  .up-s{font-size:12px;color:var(--text-2);line-height:1.8;margin-top:8px;}
  .up-steps{margin-top:16px;text-align:left;background:var(--bg-card-3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .up-step{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text-2);line-height:1.7;padding:3px 0;}
  .up-step b{color:var(--text-1);flex:none;}
  .up-note{margin-top:14px;font-size:11px;color:var(--text-3);line-height:1.7;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">联系服务商</div>
    <div class="nav-right"><span class="mo-link" onclick="location.href='index.html'">服务广场</span></div>
  </div>

  <div class="scroll" style="padding-top:8px;padding-bottom:calc(60px + env(safe-area-inset-bottom));">
    <div class="up-card">
      <div class="up-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <div class="up-t">中介服务已升级为「信息撮合模式」</div>
      <div class="up-s">平台不再承接资金托管与在线交易，只做认证核验、信息发布与联系方式解锁。正在为你跳转服务详情页，解锁后即可与服务商直接联系。</div>
      <div class="up-steps">
        <div class="up-step"><b>① 免费比价</b><span>认证等级、报价区间、评价案例全开放，无需付费</span></div>
        <div class="up-step"><b>② 积分解锁</b><span>消耗少量积分解锁完整联系方式（积分可免费获取）</span></div>
        <div class="up-step"><b>③ 线下沟通</b><span>沟通与成交由你和服务商自行完成，平台不介入</span></div>
      </div>
      <div style="margin-top:16px;"><button class="btn btn-primary btn-block" id="go-btn">立即查看服务详情</button></div>
      <div class="up-note" id="up-note"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var svcId=params.get('svcId');
  var demandId=params.get('demandId');
  var target=null;
  function findDemandSvc(did){
    if(!did||!window.DemandStore)return null;
    try{var d=DemandStore.byId(did);if(d&&d.svcId)return d.svcId;}catch(e){}
    return null;
  }
  if(svcId){target=svcId;}
  else if(demandId){var sid=findDemandSvc(demandId);if(sid)target=sid;}
  var note=document.getElementById('up-note');
  var btn=document.getElementById('go-btn');
  if(target){
    if(note)note.textContent='即将跳转：详情页解锁联系方式后与服务商直接沟通';
    if(btn)btn.addEventListener('click',function(){location.href='../supply/detail.html?id='+encodeURIComponent(target);});
    setTimeout(function(){location.href='../supply/detail.html?id='+encodeURIComponent(target);},2500);
  }else{
    if(note)note.textContent='未找到对应服务，请从服务广场重新选择。';
    if(btn)btn.addEventListener('click',function(){location.href='index.html';});
  }
})();
</script>
</body>
</html>
