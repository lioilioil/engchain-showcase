<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/geo/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>内容审计 · GEO 品牌雷达 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.audit-wrap { padding: 0 16px 40px; }
.ad-demo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:var(--r-full);}
.ad-nav-brand{font-size:11px;font-weight:700;color:var(--primary-dim);}

/* 品牌上下文条 */
.ad-context{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:0;}
.ad-context-chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 11px;}
.ad-ctx-ico{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(184,153,104,.35),inset 0 1px 0 rgba(255,255,255,.25);}
.ad-ctx-info{flex:1;min-width:0;}
.ad-ctx-name{font-size:12px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ad-ctx-meta{font-size:9.5px;color:var(--text-3);margin-top:1px;}

/* 概览 */
.ad-hero{margin:10px 0 0;padding:14px 14px 12px;border-radius:var(--r-xl);position:relative;overflow:hidden;background:radial-gradient(420px 190px at 90% -20%, rgba(184,153,104,.16), transparent 62%),radial-gradient(300px 150px at -8% 118%, rgba(184,153,104,.07), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.65);}
.ad-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(184,153,104,.12) 0%,transparent 70%);}
.ad-hero-title{font-size:12.5px;font-weight:700;color:var(--text-1);position:relative;z-index:1;}
.ad-hero-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;position:relative;z-index:1;}
.ad-hero-stats{display:flex;gap:10px;margin-top:12px;position:relative;z-index:1;}
.ad-hero-stat{flex:1;text-align:center;background:var(--bg-card-2);border:1px solid var(--line-hairline);border-radius:var(--r-m);padding:8px 4px;}
.ad-hero-num{font-family:var(--font-num);font-size:17px;font-weight:800;color:var(--text-1);}
.ad-hero-num.warn{color:var(--warning);}
.ad-hero-label{font-size:9px;color:var(--text-3);margin-top:2px;}

/* 区块 */
.ad-sec{margin-top:18px;}
.ad-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.ad-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.ad-sec-more{font-size:11px;font-weight:600;color:var(--text-3);cursor:pointer;}

/* 危机定位 */
.ad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.ad-crisis{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:11px;position:relative;overflow:hidden;box-shadow:var(--shadow-xs);transition:transform var(--d-fast) var(--e-standard),box-shadow var(--d-fast),border-color var(--d-fast);}
.ad-crisis::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.ad-crisis.sev-high::after{background:var(--error);}
.ad-crisis.sev-mid::after{background:var(--warning);}
.ad-crisis.sev-low::after{background:var(--info);}
.ad-crisis:hover{border-color:var(--accent-line);box-shadow:var(--shadow-card);transform:translateY(-1px);} .ad-crisis-name{font-size:12px;font-weight:700;color:var(--text-1);display:flex;align-items:center;justify-content:space-between;}
.ad-crisis-count{font-family:var(--font-num);font-size:13px;font-weight:800;}
.ad-crisis-sev{font-size:9px;font-weight:700;color:var(--text-3);margin-top:4px;}
.ad-crisis-sev.high{color:var(--error);}
.ad-crisis-sev.mid{color:var(--warning);}
.ad-crisis-sev.low{color:var(--info);}

/* 内容清单 */
.ad-content{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:0 13px;}
.ad-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.ad-row:last-child{border-bottom:none;}
.ad-score{flex:none;width:44px;text-align:center;}
.ad-score-ring{position:relative;width:44px;height:44px;margin:0 auto;}
.ad-score-ring svg{transform:rotate(-90deg);}
.ad-score-ring .track{stroke:var(--bg-card-2);}
.ad-score-ring .bar{stroke:var(--primary);stroke-linecap:round;}
.ad-score-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:13px;font-weight:800;color:var(--text-1);}
.ad-score-label{font-size:8px;color:var(--text-3);margin-top:2px;text-align:center;}
.ad-body{flex:1;min-width:0;}
.ad-title{font-size:12.5px;font-weight:700;color:var(--text-1);}
.ad-src{font-size:10px;color:var(--text-3);margin-top:2px;}
.ad-dims{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.ad-dim{font-size:9px;font-weight:600;padding:2px 7px;border-radius:var(--r-full);background:var(--bg-card-2);color:var(--text-3);}
.ad-issues{margin-top:7px;}
.ad-issue{display:flex;gap:6px;font-size:10.5px;color:var(--text-2);line-height:1.5;margin-top:3px;}
.ad-issue::before{content:'!';flex:none;width:14px;height:14px;border-radius:50%;background:var(--warning-soft);color:var(--warning);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}

/* 空态 */
.ad-empty{text-align:center;padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line-strong);border-radius:var(--r-l);}
.ad-empty-title{font-size:13.5px;font-weight:700;color:var(--text-1);}
.ad-empty-desc{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.6;}
.ad-empty-btn{margin-top:14px;height:40px;padding:0 22px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(184,153,104,.3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(184,153,104,.4);transition:transform var(--d-fast);}

/* 底部 CTA */
.ad-cta{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent);}
.ad-cta button{width:100%;max-width:420px;height:44px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(184,153,104,.3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(184,153,104,.4);transition:transform var(--d-fast);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt-txt{display:inline-flex;align-items:center;gap:2px;min-width:0;white-space:nowrap;}
.ad-cta button:active{transform:scale(.985);}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">内容审计</div>
    <div class="nav-right"><span class="ad-nav-brand" id="nav-brand"></span></div>
  </div>

  <div class="scroll">
    <div class="ad-context">
      <div class="ad-context-chip" onclick="location.href='brands.html'">
        <div class="ad-ctx-ico" id="ctx-ico">—</div>
        <div class="ad-ctx-info"><div class="ad-ctx-name" id="ctx-name"></div><div class="ad-ctx-meta" id="ctx-meta"></div></div>
      </div>
    </div>

  <div class="audit-wrap" id="ad-main"></div>
  </div>

  <div class="ad-cta" id="ad-cta"><button onclick="location.href='optimize.html'">查看优化方案 →</button></div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="geo-data.js"></script>
<script>
(function(){
  var D = window.GEO_DATA;

  function render(){
    var b = D.currentBrand();
    document.getElementById('nav-brand').textContent = b ? b.short : '';
    document.getElementById('ctx-ico').textContent = b ? b.short.charAt(0) : '+';
    document.getElementById('ctx-name').textContent = b ? b.name : '未选择品牌';
    document.getElementById('ctx-meta').textContent = b ? (b.industry + ' · ' + b.website) : '点击添加品牌';
    var main = document.getElementById('ad-main');
    if(!b){
      document.getElementById('ad-cta').style.display = 'none';
      main.innerHTML = '<div class="ad-sec"><div class="ad-empty">'+
        '<div class="ad-empty-title">暂无品牌内容审计</div>'+
        '<div class="ad-empty-desc">添加品牌后，系统将审计其官网 / 百科 / 平台内容<br>被 AI 引用的情况</div>'+
        '<button class="ad-empty-btn" onclick="location.href=\'brands.html\'">添加品牌</button></div></div>';
      return;
    }

    var contents = D.contentsFor(b);
    var avg = Math.round(contents.reduce(function(s,c){return s+c.score;},0)/contents.length*10)/10;
    var lowCount = contents.filter(function(c){return c.score<70;}).length;

    main.innerHTML =
      '<div class="ad-hero">'+
        '<div class="ad-hero-title">「'+b.short+'」内容被 AI 引用情况诊断</div>'+
        '<div class="ad-hero-sub">基于 '+contents.length+' 个内容载体 × 5 个可引用维度评分</div>'+
        '<div class="ad-hero-stats">'+
          '<div class="ad-hero-stat"><div class="ad-hero-num">'+avg+'</div><div class="ad-hero-label">平均内容分</div></div>'+
          '<div class="ad-hero-stat"><div class="ad-hero-num warn">'+lowCount+'</div><div class="ad-hero-label">偏低载体</div></div>'+
          '<div class="ad-hero-stat"><div class="ad-hero-num">'+contents.reduce(function(s,c){return s+c.issues.length;},0)+'</div><div class="ad-hero-label">待优化项</div></div>'+
        '</div>'+
      '</div>'+

      '<div class="ad-sec"><div class="ad-sec-title">问题定位 · 六大失语危机</div>'+
        '<div class="ad-grid">'+[
          {name:'查无此人',count:1,sev:'high',desc:'部分词下品牌未被提及'},
          {name:'信息过期',count:1,sev:'mid',desc:'百科/官网信息滞后'},
          {name:'排名靠后',count:1,sev:'mid',desc:'推荐位 < #3'},
          {name:'信息错误',count:0,sev:'low',desc:'暂无发现'},
          {name:'竞品更优',count:1,sev:'mid',desc:'核心词被反超'},
          {name:'负面覆盖',count:1,sev:'high',desc:'资金托管争议描述'}
        ].map(function(c){
          var sev = c.sev==='high'?'紧急':(c.sev==='mid'?'关注':'正常');
          return '<div class="ad-crisis sev-'+c.sev+'"><div class="ad-crisis-name">'+c.name+'<span class="ad-crisis-count">'+c.count+'</span></div>'+
            '<div class="ad-crisis-sev '+c.sev+'">'+sev+' · '+c.desc+'</div></div>';
        }).join('')+'</div>'+
      '</div>'+

      '<div class="ad-sec"><div class="ad-sec-title">内容载体审计（'+b.short+'）</div>'+
        '<div class="ad-content">'+contents.map(function(c){
          var circ = 2*Math.PI*18;
          var off = circ*(1-c.score/100);
          return '<div class="ad-row">'+
            '<div class="ad-score"><div class="ad-score-ring"><svg width="44" height="44" viewBox="0 0 44 44">'+
              '<circle class="track" cx="22" cy="22" r="18" fill="none" stroke-width="4"/>'+
              '<circle class="bar" cx="22" cy="22" r="18" fill="none" stroke-width="4" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/>'+
            '</svg><div class="ad-score-val">'+c.score+'</div></div>'+
            '<div class="ad-score-label">'+(c.score>=80?'优秀':c.score>=70?'一般':'偏低')+'</div></div>'+
            '<div class="ad-body">'+
              '<div class="ad-title">'+c.title+'</div>'+
              '<div class="ad-src">'+c.source+' · '+c.platform+'</div>'+
              '<div class="ad-dims">'+['citable','structured','authority','consistency','freshness'].map(function(k){
                return '<span class="ad-dim">'+({citable:'可引用',structured:'结构化',authority:'权威性',consistency:'一致性',freshness:'新鲜度'}[k])+' '+c.dims[k]+'</span>';
              }).join('')+'</div>'+
              '<div class="ad-issues">'+c.issues.map(function(i){return '<div class="ad-issue">'+i+'</div>';}).join('')+'</div>'+
            '</div>'+
          '</div>';
        }).join('')+'</div>'+
      '</div>';
  }

  render();
})();
</script>
</body>
</html>
