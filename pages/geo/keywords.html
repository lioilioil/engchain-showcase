<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/geo/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>关键词管理 · GEO 品牌雷达 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.kw-wrap { padding: 0 0 40px; }
.kw-demo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:var(--r-full);}
.kw-nav-brand{font-size:11px;font-weight:700;color:var(--primary-dim);}

/* 品牌上下文条 */
.kw-context{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:0;}
.kw-context-chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 11px;}
.kw-ctx-ico{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(184,153,104,.35),inset 0 1px 0 rgba(255,255,255,.25);}
.kw-ctx-info{flex:1;min-width:0;}
.kw-ctx-name{font-size:12px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kw-ctx-meta{font-size:9.5px;color:var(--text-3);margin-top:1px;}

/* 意图热度 Hero */
.kw-hero{margin:10px 0 0;padding:14px 14px 12px;border-radius:var(--r-xl);position:relative;overflow:hidden;background:radial-gradient(420px 190px at 90% -20%, rgba(184,153,104,.16), transparent 62%),radial-gradient(300px 150px at -8% 118%, rgba(184,153,104,.07), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.65);}
.kw-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(184,153,104,.12) 0%,transparent 70%);}
.kw-hero-title{font-size:12.5px;font-weight:700;color:var(--text-1);position:relative;z-index:1;}
.kw-hero-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;position:relative;z-index:1;line-height:1.5;}
.kw-hero-stats{display:flex;gap:10px;margin-top:12px;position:relative;z-index:1;}
.kw-hero-stat{flex:1;text-align:center;background:var(--bg-card-2);border:1px solid var(--line-hairline);border-radius:var(--r-m);padding:8px 4px;}
.kw-hero-num{font-family:var(--font-num);font-size:17px;font-weight:800;color:var(--text-1);}
.kw-hero-label{font-size:9px;color:var(--text-3);margin-top:2px;}

/* 区块 */
.kw-sec{margin-top:18px;}
.kw-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.kw-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.kw-count{font-size:10px;font-weight:600;color:var(--primary-dim);background:var(--primary-soft);padding:2px 8px;border-radius:var(--r-full);}

/* 我的关键词 */
.kw-my{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:0 13px;}
.kw-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.kw-row:last-child{border-bottom:none;}
.kw-row-info{flex:1;min-width:0;}
.kw-row-term{font-size:13.5px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:6px;}
.kw-heat-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);background:var(--primary-soft);color:var(--primary-dim);}
.kw-row-meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10.5px;color:var(--text-3);}
.kw-hit-bar{margin-top:7px;height:4px;border-radius:2px;background:var(--bg-card-2);overflow:hidden;}
.kw-hit-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));}
.kw-switch{flex:none;position:relative;width:38px;height:22px;border-radius:var(--r-full);background:var(--bg-card-2);border:1px solid var(--line);cursor:pointer;transition:all .2s;}
.kw-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;}
.kw-switch.on{background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);}
.kw-switch.on::after{left:18px;}

/* 词库 */
.kw-bank{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:0 13px;}
.kw-bank-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.kw-bank-row:last-child{border-bottom:none;}
.kw-bank-cat{flex:none;font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);background:var(--bg-card-2);color:var(--text-3);}
.kw-bank-rec{flex:none;font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);background:var(--primary-soft);color:var(--primary-dim);}
.kw-bank-info{flex:1;min-width:0;}
.kw-bank-term{font-size:13px;font-weight:600;color:var(--text-1);}
.kw-bank-note{font-size:10px;color:var(--text-3);margin-top:2px;}
.kw-bank-heat{flex:none;font-family:var(--font-num);font-size:13px;font-weight:800;color:var(--primary-dim);}
.kw-bank-add{flex:none;width:26px;height:26px;border-radius:50%;border:none;background:var(--primary-soft);color:var(--primary-dim);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.kw-bank-add.added{background:var(--bg-card-2);color:var(--text-3);}
.kw-bank-add:active{transform:scale(.9);}
.kw-empty{text-align:center;padding:24px 12px;font-size:12px;color:var(--text-3);}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">关键词管理</div>
    <div class="nav-right"><span class="kw-nav-brand" id="nav-brand"></span></div>
  </div>

  <div class="scroll">
    <!-- 品牌上下文 -->
    <div class="kw-context">
      <div class="kw-context-chip" onclick="location.href='brands.html'">
        <div class="kw-ctx-ico" id="ctx-ico">—</div>
        <div class="kw-ctx-info"><div class="kw-ctx-name" id="ctx-name"></div><div class="kw-ctx-meta" id="ctx-meta"></div></div>
      </div>
    </div>

  <div class="kw-wrap">

    <div class="kw-hero">
      <div class="kw-hero-title">AI 意图热度面板</div>
      <div class="kw-hero-sub">预估用户在 AI 引擎中提问该词的频率与商业价值，热度越高越值得优先占位</div>
      <div class="kw-hero-stats">
        <div class="kw-hero-stat"><div class="kw-hero-num" id="h-total">0</div><div class="kw-hero-label">已启用词</div></div>
        <div class="kw-hero-stat"><div class="kw-hero-num" id="h-hit">0</div><div class="kw-hero-label">平均命中率</div></div>
        <div class="kw-hero-stat"><div class="kw-hero-num" id="h-top">0</div><div class="kw-hero-label">热度 Top 词</div></div>
      </div>
    </div>

    <div class="kw-sec">
      <div class="kw-sec-title">我的关键词 <span class="kw-count" id="my-count">0</span></div>
      <div class="kw-my" id="my-list"></div>
    </div>

    <div class="kw-sec">
      <div class="kw-sec-title">行业词库（按品牌行业推荐） <span class="kw-count">点击 + 添加</span></div>
      <div class="kw-bank" id="bank-list"></div>
    </div>

  </div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="geo-data.js"></script>
<script>
(function(){
  var D = window.GEO_DATA;
  var brand = D.currentBrand();
  var myKeywords = brand ? brand.keywords.slice() : [];

  function renderContext(){
    if(!brand){ return; }
    document.getElementById('nav-brand').textContent = brand.short;
    document.getElementById('ctx-ico').textContent = brand.short.charAt(0);
    document.getElementById('ctx-name').textContent = brand.name;
    document.getElementById('ctx-meta').textContent = brand.industry + ' · 免费版上限 5 词';
  }

  function render(){
    if(!brand){
      document.getElementById('my-list').innerHTML = '<div class="kw-empty">请先添加品牌，再管理检测关键词</div>';
      document.getElementById('bank-list').innerHTML = '<div class="kw-empty">—</div>';
      return;
    }
    var enabled = myKeywords.filter(function(k){return k.enabled;});
    document.getElementById('h-total').textContent = enabled.length;
    document.getElementById('h-hit').textContent = enabled.length ? Math.round(enabled.reduce(function(s,k){return s+k.hitRate;},0)/enabled.length*100)+'%' : '--';
    document.getElementById('h-top').textContent = enabled.length ? enabled.reduce(function(a,b){return a.heat>b.heat?a:b;}).term : '--';

    var myBox = document.getElementById('my-list');
    document.getElementById('my-count').textContent = myKeywords.length + ' 词' + (myKeywords.length>=5?'（已满）':'');
    if(!myKeywords.length){
      myBox.innerHTML = '<div class="kw-empty">还没有关键词，从下方行业词库添加</div>';
    }else{
      myBox.innerHTML = myKeywords.map(function(k, i){
        var hit = Math.round(k.hitRate*100);
        return '<div class="kw-row">'+
          '<div class="kw-row-info">'+
            '<div class="kw-row-term">'+k.term+' <span class="kw-heat-chip">热度 '+k.heat+'</span></div>'+
            '<div class="kw-row-meta"><span>命中率 '+hit+'%</span><span>近 7 天 ↑'+(k.trend[k.trend.length-1]-k.trend[0])+'</span></div>'+
            '<div class="kw-hit-bar"><i style="width:'+hit+'%"></i></div>'+
          '</div>'+
          '<div class="kw-switch'+(k.enabled?' on':'')+'" data-i="'+i+'" title="启用/停用"></div>'+
        '</div>';
      }).join('');
    }

    var bankBox = document.getElementById('bank-list');
    var added = myKeywords.map(function(k){return k.term;});
    var list = D.KEYWORD_BANK.slice();
    list.sort(function(a,b){
      var ar = a.industry.indexOf(brand.industry)>=0 ? 0 : 1;
      var br = b.industry.indexOf(brand.industry)>=0 ? 0 : 1;
      return ar-br;
    });
    bankBox.innerHTML = list.map(function(k){
      var isAdded = added.indexOf(k.term)>=0;
      var rec = k.industry.indexOf(brand.industry)>=0;
      return '<div class="kw-bank-row">'+
        '<span class="kw-bank-cat">'+k.category+'</span>'+
        (rec?'<span class="kw-bank-rec">推荐</span>':'')+
        '<div class="kw-bank-info"><div class="kw-bank-term">'+k.term+'</div><div class="kw-bank-note">'+k.note+'</div></div>'+
        '<span class="kw-bank-heat">'+k.heat+'</span>'+
        '<button class="kw-bank-add'+(isAdded?' added':'')+'" data-term="'+k.term+'" data-type="'+k.type+'" data-heat="'+k.heat+'">'+(isAdded?'✓':'+')+'</button>'+
      '</div>';
    }).join('');
  }

  document.getElementById('my-list').addEventListener('click', function(e){
    var sw = e.target.closest('.kw-switch');
    if(!sw) return;
    var i = +sw.dataset.i;
    myKeywords[i].enabled = !myKeywords[i].enabled;
    UI.toast((myKeywords[i].enabled?'已启用':'已停用')+'「'+myKeywords[i].term+'」', myKeywords[i].enabled?'ok':'warn');
    render();
  });

  document.getElementById('bank-list').addEventListener('click', function(e){
    var btn = e.target.closest('.kw-bank-add');
    if(!btn) return;
    var term = btn.dataset.term, type = btn.dataset.type, heat = +btn.dataset.heat;
    var idx = myKeywords.findIndex(function(k){return k.term===term;});
    if(idx>=0){
      myKeywords.splice(idx,1);
      UI.toast('已移除「'+term+'」','warn');
    }else{
      if(myKeywords.length>=5){ UI.toast('免费版上限 5 个关键词，升级企业定制可解锁','warn'); return; }
      myKeywords.push({ id:'bk'+Date.now(), term:term, type:type, heat:heat, hitRate:0.5, enabled:true, trend:[48,49,49,50,50,50,50] });
      UI.toast('已添加「'+term+'」','ok');
    }
    render();
  });

  renderContext();
  render();
})();
</script>
</body>
</html>
