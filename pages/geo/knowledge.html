<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/geo/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>品牌知识库 · GEO 品牌雷达 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.kb-wrap { padding: 0 0 40px; }
.kb-demo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:var(--r-full);}
.kb-nav-brand{font-size:11px;font-weight:700;color:var(--primary-dim);}

/* 实体档案 */
.kb-entity{margin:10px 0 0;padding:14px;border-radius:var(--r-xl);position:relative;overflow:hidden;background:radial-gradient(420px 190px at 90% -20%, rgba(184,153,104,.16), transparent 62%),radial-gradient(300px 150px at -8% 118%, rgba(184,153,104,.07), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.65);}
.kb-entity::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(184,153,104,.14) 0%,transparent 70%);}
.kb-entity-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.kb-avatar{flex:none;width:40px;height:40px;border-radius:var(--r-m);background:linear-gradient(135deg,var(--primary),var(--primary-dim));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--text-inv);box-shadow:0 2px 8px rgba(184,153,104,.35),inset 0 1px 0 rgba(255,255,255,.25);}
.kb-entity-info{flex:1;min-width:0;}
.kb-entity-name{font-size:14.5px;font-weight:800;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kb-entity-meta{font-size:10px;color:var(--text-3);margin-top:3px;}
.kb-entity-desc{font-size:11px;line-height:1.6;color:var(--text-2);margin-top:10px;position:relative;z-index:1;background:var(--bg-card-2);border:1px solid var(--line-hairline);border-radius:var(--r-m);padding:8px 10px;}
.kb-entity-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1;}
.kb-tag{font-size:9.5px;font-weight:600;color:var(--text-2);background:var(--bg-card-2);border:1px solid var(--line-hairline);padding:3px 9px;border-radius:var(--r-full);}
.kb-tag.ok{background:var(--success-soft);color:var(--success);}

/* 区块 */
.kb-sec{margin-top:18px;}
.kb-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.kb-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.kb-sec-more{font-size:11px;font-weight:600;color:var(--text-3);cursor:pointer;}
.kb-health{display:flex;gap:10px;}
.kb-health-card{flex:1;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:center;}
.kb-health-num{font-family:var(--font-num);font-size:20px;font-weight:800;color:var(--text-1);}
.kb-health-num.up{color:var(--success);}
.kb-health-label{font-size:10px;color:var(--text-3);margin-top:3px;}
.kb-health-sub{font-size:9px;color:var(--text-3);margin-top:2px;}

.kb-dims{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px;margin-top:10px;}
.kb-d-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.kb-d-row:last-child{margin-bottom:0;}
.kb-d-name{flex:none;width:64px;font-size:11px;font-weight:600;color:var(--text-2);}
.kb-d-track{flex:1;height:8px;border-radius:var(--r-xs);background:var(--bg-card-2);overflow:hidden;}
.kb-d-track i{display:block;height:100%;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .5s var(--e-emph);}
.kb-d-val{flex:none;width:30px;text-align:right;font-family:var(--font-num);font-size:11.5px;font-weight:800;color:var(--text-1);}

/* 事实库 */
.kb-facts{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:0 13px;}
.kb-fact{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.kb-fact:last-child{border-bottom:none;}
.kb-fact-type{flex:none;width:52px;height:22px;border-radius:var(--r-s);background:var(--primary-soft);color:var(--primary-dim);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.kb-fact-type.sec{background:var(--info-soft);color:var(--info);}
.kb-fact-type.data{background:var(--warning-soft);color:var(--warning);}
.kb-fact-type.cert{background:var(--success-soft);color:var(--success);}
.kb-fact-body{flex:1;min-width:0;}
.kb-fact-text{font-size:12.5px;line-height:1.6;color:var(--text-1);}
.kb-fact-meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10px;color:var(--text-3);}
.kb-fact-status{font-size:9px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);}
.kb-fact-status.in{background:var(--success-soft);color:var(--success);}
.kb-fact-status.pending{background:var(--warning-soft);color:var(--warning);}

/* 空态 */
.kb-empty{text-align:center;padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line-strong);border-radius:var(--r-l);}
.kb-empty-title{font-size:13.5px;font-weight:700;color:var(--text-1);}
.kb-empty-desc{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.6;}
.kb-empty-btn{margin-top:14px;height:40px;padding:0 22px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(184,153,104,.3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(184,153,104,.4);transition:transform var(--d-fast);}

/* 提示 */
.kb-tip{display:flex;gap:8px;background:var(--info-soft);border:1px solid var(--info-soft);border-radius:var(--r-m);padding:11px 13px;font-size:11.5px;line-height:1.6;color:var(--text-2);}
.kb-tip svg{flex:none;width:15px;height:15px;color:var(--info);margin-top:1px;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">品牌知识库</div>
    <div class="nav-right"><span class="kb-nav-brand" id="nav-brand"></span></div>
  </div>

  <div class="scroll">
  <div class="kb-wrap" id="kb-main"></div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="geo-data.js"></script>
<script src="geo-tip.js"></script>
<script src="geo-nav.js"></script>
<script>
(function(){
  var D = window.GEO_DATA;

  function render(){
    var b = D.currentBrand();
    document.getElementById('nav-brand').textContent = b ? b.short : '';
    var main = document.getElementById('kb-main');
    if(!b){
      main.innerHTML = '<div class="kb-sec"><div class="kb-empty">'+
        '<div class="kb-empty-title">暂无品牌知识库</div>'+
        '<div class="kb-empty-desc">添加品牌并提交资料后，知识库将自动生成</div>'+
        '<button class="kb-empty-btn" onclick="location.href=\'brands.html\'">添加品牌</button>'+
      '</div></div>';
      return;
    }

    var facts = D.factsFor(b);
    var typeCls = { '品牌介绍':'', '核心优势':'sec', '官网':'', '资质':'cert', '数据':'data' };

    main.innerHTML =
      '<div class="kb-entity">'+
        '<div class="kb-entity-row">'+
          '<div class="kb-avatar">'+b.short.charAt(0)+'</div>'+
          '<div class="kb-entity-info">'+
            '<div class="kb-entity-name">'+b.name+'</div>'+
            '<div class="kb-entity-meta">别名：'+b.aliases.join(' / ')+' · '+b.website+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="kb-entity-desc">'+b.desc+'</div>'+
        '<div class="kb-entity-tags">'+
          '<span class="kb-tag ok">✓ 资料已提交</span><span class="kb-tag">行业：'+b.industry+'</span>'+
          (b.advantages.length ? b.advantages.map(function(a){return '<span class="kb-tag">'+a+'</span>';}).join('') : '')+
        '</div>'+
      '</div>'+

      '<div class="kb-sec"><div class="kb-sec-title">知识库健康度 <span class="kb-sec-more" onclick="window.GEO_NAV.openBrands()">切换品牌 ›</span></div>'+
        '<div class="kb-health">'+
          '<div class="kb-health-card"><div class="kb-health-num up">'+b.kbHealth+'</div><div class="kb-health-label">健康度</div><div class="kb-health-sub">↑ +'+Math.abs(b.kbHealthDelta)+' 较上周</div></div>'+
          '<div class="kb-health-card"><div class="kb-health-num">'+facts.length+'</div><div class="kb-health-label">事实条目</div><div class="kb-health-sub">'+facts.filter(function(f){return f.status==='收录';}).length+' 已收录</div></div>'+
          '<div class="kb-health-card"><div class="kb-health-num">'+b.engines.reduce(function(s,e){return s+e.citations;},0)+'</div><div class="kb-health-label">累计引用</div><div class="kb-health-sub">近 90 天</div></div>'+
        '</div>'+
        '<div class="kb-dims">'+[
          {name:'实体清晰度',v:88},{name:'事实覆盖',v:74},{name:'信源权威',v:85},{name:'信息一致性',v:78},{name:'内容新鲜度',v:70}
        ].map(function(d){
          return '<div class="kb-d-row"><span class="kb-d-name">'+d.name+'</span><div class="kb-d-track"><i style="width:'+d.v+'%"></i></div><span class="kb-d-val">'+d.v+'</span></div>';
        }).join('')+'</div>'+
      '</div>'+

      '<div class="kb-tip" style="margin-top:14px;">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>'+
        '<span>知识库由你提交的品牌资料自动生成：业务描述 → 品牌介绍，核心优势 → 差异化信息，官网 → 主信源。知识库越完整，AI 越可能引用「'+b.short+'」。</span>'+
      '</div>'+

      '<div class="kb-sec"><div class="kb-sec-title">事实库（'+b.short+'） <span class="kb-sec-more" onclick="location.href=\'optimize.html?focus=t1\'">去补全 ›</span></div>'+
        '<div class="kb-facts">'+facts.map(function(f){
          return '<div class="kb-fact">'+
            '<div class="kb-fact-type '+(typeCls[f.type]||'')+'">'+f.type+'</div>'+
            '<div class="kb-fact-body">'+
              '<div class="kb-fact-text">'+f.text+'</div>'+
              '<div class="kb-fact-meta"><span>来源：'+f.source+'</span>'+
              (f.status==='收录'
                ? '<span class="kb-fact-status in">已收录</span>'
                : '<span class="kb-fact-status pending" style="cursor:pointer;" onclick="location.href=\'optimize.html?focus=t1\'">待完善 · 去完善 ›</span>')+
              '</div>'+
            '</div>'+
          '</div>';
        }).join('')+'</div>'+
      '</div>';
  }

  render();
  /* 深链定位：?section=dims 滚到五维条；?section=health 滚到健康度 */
  (function () {
    var q = D.parseQuery();
    var el = null;
    if (q.section === 'dims') el = document.querySelector('.kb-dims');
    else if (q.section === 'health') el = document.querySelector('.kb-health');
    if (el) D.highlight(el);
  })();
})();
</script>
<script>GEO_NAV.mount('index');</script>
</body>
</html>
