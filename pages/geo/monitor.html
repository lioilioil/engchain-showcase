<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/geo/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>引擎监控 · GEO 品牌雷达 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.mn-wrap { padding: 0 0 40px; }
.mn-demo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:var(--r-full);}
.mn-nav-brand{font-size:11px;font-weight:700;color:var(--primary-dim);}

/* 品牌上下文条 */
.mn-context{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:0;}
.mn-context-chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 11px;}
.mn-ctx-ico{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(184,153,104,.35),inset 0 1px 0 rgba(255,255,255,.25);}
.mn-ctx-info{flex:1;min-width:0;}
.mn-ctx-name{font-size:12px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mn-ctx-meta{font-size:9.5px;color:var(--text-3);margin-top:1px;}
.mn-context .mn-sw-manage{flex:none;width:30px;height:30px;border-radius:var(--r-m);background:var(--bg-card);border:1px solid var(--line);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.mn-context .mn-sw-manage svg{width:14px;height:14px;}

/* 关键词 chips */
.mn-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.mn-chips::-webkit-scrollbar{display:none;}
.mn-chip{flex:none;padding:7px 13px;border-radius:var(--r-full);font-size:12px;font-weight:600;color:var(--text-3);background:var(--bg-card);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:all .2s;}
.mn-chip.active{color:var(--text-inv);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);border-color:transparent;box-shadow:0 3px 10px -3px rgba(184,153,104,.5),inset 0 1px 0 rgba(255,255,255,.3);}
.mn-chip:active{transform:scale(.96);}

/* 引擎 Tab */
.mn-etabs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none;}
.mn-etabs::-webkit-scrollbar{display:none;}
.mn-etab{flex:none;padding:6px 12px;border-radius:var(--r-m);font-size:11.5px;font-weight:700;color:var(--text-3);background:var(--bg-card);border:1px solid var(--line);cursor:pointer;transition:all .2s;}
.mn-etab.active{color:var(--primary-dim);background:var(--primary-soft);border-color:var(--accent-line);}
.mn-etab:active{transform:scale(.96);}

/* 问答卡片 */
.mn-qa{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);margin-top:12px;overflow:hidden;}
.mn-qa-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);}
.mn-qa-ico{flex:none;width:28px;height:28px;border-radius:var(--r-m);background:var(--primary-soft);color:var(--primary-dim);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.mn-qa-name{font-size:13px;font-weight:700;color:var(--text-1);}
.mn-qa-provider{font-size:10px;color:var(--text-3);margin-top:1px;}
.mn-qa-badge{flex:none;font-size:9px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);}
.mn-qa-badge.hit{background:var(--success-soft);color:var(--success);}
.mn-qa-badge.miss{background:var(--error-soft);color:var(--error);}
.mn-qa-q{padding:11px 13px 4px;font-size:10.5px;font-weight:600;color:var(--text-3);}
.mn-qa-q b{color:var(--primary-dim);}
.mn-qa-a{padding:2px 13px 12px;font-size:13px;line-height:1.75;color:var(--text-1);}
.mn-qa-a b{color:var(--primary);font-weight:800;}
.mn-qa-cites{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 12px;}
.mn-cite-chip{font-size:10px;font-weight:600;color:var(--text-3);background:var(--bg-card-2);padding:3px 9px;border-radius:var(--r-full);}

/* 引擎指标条 */
.mn-sec{margin-top:16px;}
.mn-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.mn-sec-fold{font-size:10.5px;font-weight:600;color:var(--primary-dim);cursor:pointer;background:var(--primary-soft);padding:3px 9px;border-radius:var(--r-full);}
.mn-sec-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.mn-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.mn-sec-more{font-size:11px;font-weight:600;color:var(--text-3);cursor:pointer;}
.mn-metrics{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px;}
.mn-m-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.mn-m-row:last-child{margin-bottom:0;}
.mn-m-name{flex:none;width:58px;font-size:11px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mn-m-track{flex:1;height:8px;border-radius:var(--r-xs);background:var(--bg-card-2);overflow:hidden;}
.mn-m-track i{display:block;height:100%;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .5s var(--e-emph);}
.mn-m-val{flex:none;width:52px;text-align:right;font-family:var(--font-num);font-size:11px;font-weight:700;color:var(--text-1);}
.mn-m-val .sub{font-size:8.5px;color:var(--text-3);font-weight:600;}

/* 采集状态 */
.mn-status{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;font-size:11.5px;color:var(--text-2);}.mn-status .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--primary-soft);border-top-color:var(--primary);animation:mspin .9s linear infinite;}
@keyframes mspin{to{transform:rotate(360deg)}}
.mn-status b{color:var(--text-1);}
.mn-status .ok{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--success);}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">引擎监控</div>
    <div class="nav-right"><span class="mn-nav-brand" id="nav-brand"></span></div>
  </div>

  <div class="scroll">
    <!-- 品牌上下文 -->
    <div class="mn-context">
      <div class="mn-context-chip" onclick="window.GEO_NAV.openBrands()">
        <div class="mn-ctx-ico" id="ctx-ico">—</div>
        <div class="mn-ctx-info"><div class="mn-ctx-name" id="ctx-name"></div><div class="mn-ctx-meta" id="ctx-meta"></div></div>
      </div>
      <div class="mn-sw-manage" onclick="window.GEO_NAV.openBrands()" title="品牌管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </div>
    </div>

    <!-- 关键词 chips -->
    <div class="mn-chips" id="kw-chips"></div>

    <div class="mn-wrap">
      <div class="mn-status" id="st-status" style="display:none;"><span class="spin"></span><span>正在采集 <b id="st-kw"></b> 在 <b id="st-eng"></b> 的回答…</span><span class="ok">模拟完成</span></div>

      <div class="mn-etabs" id="eng-tabs"></div>

      <div id="qa-box"></div>

      <div class="mn-sec">
        <div class="mn-sec-title">引擎可见度指标<span class="mn-sec-right"><span class="mn-sec-fold" onclick="window.mnToggle('body-metrics',this)">展开 ▾</span><span class="mn-sec-more" onclick="location.href='index.html'">驾驶舱 ›</span></span></div>
        <div class="mn-fold-body" id="body-metrics" style="display:none;"><div class="mn-metrics" id="metrics-box"></div></div>
      </div>

      <div class="mn-sec">
        <div class="mn-sec-title">引用来源<span class="mn-sec-right"><span class="mn-sec-fold" onclick="window.mnToggle('body-cites',this)">展开 ▾</span><span class="mn-sec-more" onclick="location.href='report.html?tab=1&focus=cites'">报告证据 ›</span></span></div>
        <div class="mn-fold-body" id="body-cites" style="display:none;"><div class="mn-metrics" id="cite-box"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="geo-data.js"></script>
<script src="geo-tip.js"></script>
<script src="geo-nav.js"></script>
<script>
(function(){
  var D = window.GEO_DATA;
  var brand = D.currentBrand();
  var enabled = brand ? brand.keywords.filter(function(k){return k.enabled;}) : [];
  var q = D.parseQuery();
  var curKw = 0, curEng = 0;
  var ENG_ORDER = ['doubao','deepseek','kimi','wenxin','tongyi','chatgpt','perplexity'];
  /* 深链定位：?engine=xxx&kw=yyy 自动切引擎 Tab 与关键词 chip */
  if (q.engine) {
    var ei = ENG_ORDER.indexOf(q.engine);
    if (ei >= 0) curEng = ei;
  }
  if (q.kw) {
    for (var ki = 0; ki < enabled.length; ki++) {
      if (enabled[ki].term === q.kw) { curKw = ki; break; }
    }
  }

  function renderContext(){
    if(!brand){ document.getElementById('nav-brand').textContent=''; document.getElementById('ctx-name').textContent='未选择品牌'; document.getElementById('ctx-meta').textContent='点击添加品牌'; document.getElementById('ctx-ico').textContent='+'; return; }
    document.getElementById('nav-brand').textContent = brand.short;
    document.getElementById('ctx-ico').textContent = brand.short.charAt(0);
    document.getElementById('ctx-name').textContent = brand.name;
    document.getElementById('ctx-meta').textContent = brand.industry + ' · ' + brand.website;
  }

  function renderChips(){
    document.getElementById('kw-chips').innerHTML = enabled.length ? enabled.map(function(k,i){
      return '<div class="mn-chip'+(i===curKw?' active':'')+'" data-i="'+i+'">'+k.term+'</div>';
    }).join('') : '<div class="mn-chip" style="color:var(--text-3);">暂无启用关键词</div>';
  }
  function renderTabs(){
    document.getElementById('eng-tabs').innerHTML = D.ENGINES.map(function(e,i){
      return '<div class="mn-etab'+(i===curEng?' active':'')+'" data-i="'+i+'">'+e.name+'</div>';
    }).join('');
  }

  function fill(tpl, b){ return tpl.replace('{brand}', b.name).replace('{brandShort}', b.short); }

  function renderQA(){
    var kw = enabled[curKw];
    var eng = D.ENGINES[curEng];
    document.getElementById('st-kw').textContent = kw ? kw.term : '—';
    document.getElementById('st-eng').textContent = eng.name;

    var box = document.getElementById('qa-box');
    if(!brand || !kw){
      box.innerHTML = '<div class="mn-qa"><div class="mn-qa-head"><div class="mn-qa-ico">!</div><div style="flex:1;min-width:0;"><div class="mn-qa-name">暂无检测数据</div></div></div><div class="mn-qa-a" style="color:var(--text-3);">请先添加品牌并启用关键词。</div></div>';
      return;
    }
    /* 按关键词类型取回答模板，渲染当前品牌名 */
    var tpl = D.ANSWER_TPL[kw.type] || D.ANSWER_TPL['default'];
    var item = tpl[eng.id];
    var hit = item.text.indexOf('<b>') >= 0;
    box.innerHTML =
      '<div class="mn-qa">'+
        '<div class="mn-qa-head">'+
          '<div class="mn-qa-ico">'+eng.name.charAt(0)+'</div>'+
          '<div style="flex:1;min-width:0;"><div class="mn-qa-name">'+eng.name+' 的回答</div><div class="mn-qa-provider">'+eng.provider+' · 模拟采集 '+eng.name+'</div></div>'+
          '<span class="mn-qa-badge '+(hit?'hit':'miss')+'">'+(hit?'✓ '+brand.short+' 被提及':'未提及')+'</span>'+
        '</div>'+
        '<div class="mn-qa-q">提问：<b>「'+kw.term+'」</b></div>'+
        '<div class="mn-qa-a">'+fill(item.text, brand)+'</div>'+
        (item.cited && item.cited.length ? '<div class="mn-qa-cites">'+item.cited.map(function(c){return '<span class="mn-cite-chip">引用 · '+fill(c,brand)+'</span>';}).join('')+'</div>' : '<div class="mn-qa-cites"><span class="mn-cite-chip" style="opacity:.6">未引用品牌来源</span></div>')+
      '</div>';
  }

  function renderMetrics(){
    var box = document.getElementById('metrics-box');
    box.innerHTML = D.ENGINES.map(function(e){
      var ep = brand ? (brand.engines.filter(function(x){return x.engineId===e.id;})[0]) : null;
      var rate = ep ? ep.rate : 0;
      var sub = ep ? ('推荐位 #'+ep.rank+' · 引用 '+ep.citations) : '未检测';
      return '<div class="mn-m-row"><span class="mn-m-name">'+e.name+'</span>'+
        '<div class="mn-m-track"><i style="width:'+rate+'%"></i></div>'+
        '<span class="mn-m-val">'+rate+'%<div class="sub">'+sub+'</div></span></div>';
    }).join('');
  }

  function renderCites(){
    var box = document.getElementById('cite-box');
    var cites = D.CITES_TPL.map(function(c){ return {name: c.name.replace('{brand}', brand ? brand.short : ''), n: c.n}; });
    var max = Math.max.apply(null, cites.map(function(c){return c.n;}));
    box.innerHTML = cites.map(function(c){
      return '<div class="mn-m-row"><span class="mn-m-name">'+c.name+'</span>'+
        '<div class="mn-m-track"><i style="width:'+(c.n/max*100)+'%"></i></div>'+
        '<span class="mn-m-val">'+c.n+'<div class="sub">次引用</div></span></div>';
    }).join('');
  }

  document.getElementById('kw-chips').addEventListener('click', function(e){
    var c = e.target.closest('.mn-chip');
    if(!c || !c.dataset.i) return;
    curKw = +c.dataset.i;
    flashStatus();
    renderChips(); renderQA();
  });
  document.getElementById('eng-tabs').addEventListener('click', function(e){
    var t = e.target.closest('.mn-etab');
    if(!t) return;
    curEng = +t.dataset.i;
    flashStatus();
    renderTabs(); renderQA();
  });

  /* P1-6 采集条去装饰：仅切换时闪现 1 秒骨架 */
  function flashStatus(){
    var st = document.getElementById('st-status');
    if (!st) return;
    st.style.display = '';
    clearTimeout(st._t);
    st._t = setTimeout(function(){ st.style.display = 'none'; }, 1000);
  }

  /* P1-4 底部两块折叠 */
  window.mnToggle = function(id, btn){
    var b = document.getElementById(id);
    if (!b) return;
    var show = b.style.display === 'none';
    b.style.display = show ? '' : 'none';
    if (btn) btn.textContent = show ? '收起 ▴' : '展开 ▾';
  };

  renderContext(); renderChips(); renderTabs(); renderQA(); renderMetrics(); renderCites();
})();
</script>
<script>GEO_NAV.mount('monitor');</script>
</body>
</html>
