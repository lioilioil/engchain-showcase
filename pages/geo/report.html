<title>品牌 GEO 报告 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.rp-wrap { padding: 0 0 40px; }
.rp-demo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:var(--r-full);}
.rp-nav-brand{font-size:11px;font-weight:700;color:var(--primary-dim);}

/* 报告头卡 */
.rp-head{margin:10px 0 0;padding:16px;border-radius:var(--r-xl);position:relative;overflow:hidden;background:radial-gradient(460px 210px at 90% -22%, rgba(184,153,104,.16), transparent 62%),radial-gradient(340px 170px at -8% 118%, rgba(184,153,104,.07), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.65);}
.rp-head::before{content:'';position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(184,153,104,.15) 0%,transparent 70%);}
.rp-head-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
.rp-logo{flex:none;width:46px;height:46px;border-radius:var(--r-l);background:linear-gradient(135deg,var(--primary),var(--primary-dim));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--text-inv);box-shadow:0 2px 8px rgba(184,153,104,.35),inset 0 1px 0 rgba(255,255,255,.25);}
.rp-head-info{flex:1;min-width:0;}
.rp-head-title{font-size:15px;font-weight:800;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rp-head-meta{font-size:10.5px;color:var(--text-3);margin-top:3px;}
.rp-head-score{text-align:center;flex:none;}
.rp-score-num{font-family:var(--font-num);font-size:30px;font-weight:800;line-height:1;color:var(--primary);}
.rp-score-label{font-size:9px;color:var(--text-3);margin-top:3px;}
.rp-head-desc{font-size:11px;line-height:1.6;color:var(--text-2);margin-top:12px;position:relative;z-index:1;background:var(--bg-card-2);border:1px solid var(--line-hairline);border-radius:var(--r-m);padding:9px 11px;}
.rp-head-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1;}
.rp-badge{font-size:9px;font-weight:600;padding:3px 9px;border-radius:var(--r-full);background:var(--primary-soft);color:var(--primary-dim);}

/* 报告 Tab */
.rp-tabs{display:flex;margin-top:12px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;overflow-x:auto;scrollbar-width:none;}
.rp-tabs::-webkit-scrollbar{display:none;}
.rp-tab{flex:1;min-width:64px;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);border-radius:var(--r-m);cursor:pointer;white-space:nowrap;transition:all .2s;}
.rp-tab.active{background:var(--bg);color:var(--text-1);box-shadow:0 1px 3px rgba(0,0,0,.06);}

/* 报告区块 */
.rp-panel{display:none;margin-top:14px;position:relative;}
.rp-panel.active{display:block;}
.rp-lock{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(255,255,255,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border-radius:var(--r-m);z-index:5;}
.rp-lock-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-card);padding:18px 16px;max-width:320px;width:100%;}
.rp-lock-title{font-size:13.5px;font-weight:800;color:var(--text-1);}
.rp-lock-desc{font-size:11px;color:var(--text-2);margin:6px 0 4px;}
.rp-lock-list{font-size:11px;line-height:1.8;color:var(--text-2);margin-bottom:14px;}
.rp-lock-note{font-size:10px;color:var(--text-3);text-align:center;margin-top:9px;}
.rp-sec{margin-bottom:14px;}
.rp-sec-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;}
.rp-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:11px;}
.rp-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.rp-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.rp-kpi{background:var(--bg-card-2);border-radius:var(--r-m);padding:10px;text-align:center;}
.rp-kpi-num{font-family:var(--font-num);font-size:18px;font-weight:800;color:var(--text-1);}
.rp-kpi-num.good{color:var(--success);}
.rp-kpi-num.warn{color:var(--warning);}
.rp-kpi-label{font-size:9.5px;color:var(--text-3);margin-top:3px;}

/* 横向条 */
.rp-bar-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.rp-bar-row:last-child{margin-bottom:0;}
.rp-bar-name{flex:none;width:66px;font-size:11px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rp-bar-track{flex:1;height:9px;border-radius:5px;background:var(--bg-card-2);overflow:hidden;}
.rp-bar-track i{display:block;height:100%;border-radius:5px;transition:width .5s var(--e-emph);}
.rp-bar-track.me i{background:linear-gradient(90deg,var(--primary),var(--primary-dim));}
.rp-bar-track.co i{background:linear-gradient(90deg,var(--purple),var(--purple));}
.rp-bar-val{flex:none;width:40px;text-align:right;font-family:var(--font-num);font-size:11px;font-weight:800;color:var(--text-1);}

/* 引擎表 */
.rp-table{width:100%;border-collapse:collapse;font-size:11px;}
.rp-table th{font-size:10px;font-weight:700;color:var(--text-3);text-align:left;padding:7px 6px;border-bottom:1px solid var(--line-strong);}
.rp-table td{padding:8px 6px;border-bottom:1px solid var(--line);color:var(--text-1);}
.rp-table tr:last-child td{border-bottom:none;}
.rp-table .st{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);}
.rp-table .st.hit{background:var(--success-soft);color:var(--success);}
.rp-table .st.part{background:var(--warning-soft);color:var(--warning);}
.rp-table .st.miss{background:var(--error-soft);color:var(--error);}

/* 问题定位 */
.rp-crisis{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.rp-crisis:last-child{border-bottom:none;}
.rp-crisis-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;}
.rp-crisis-dot.high{background:var(--error);box-shadow:0 0 6px var(--error-soft);}
.rp-crisis-dot.mid{background:var(--warning);}
.rp-crisis-body{flex:1;min-width:0;}
.rp-crisis-name{font-size:12.5px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:7px;}
.rp-crisis-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);}
.rp-crisis-tag.high{background:var(--error-soft);color:var(--error);}
.rp-crisis-tag.mid{background:var(--warning-soft);color:var(--warning);}
.rp-crisis-desc{font-size:11px;color:var(--text-2);margin-top:4px;line-height:1.55;}

/* 渠道矩阵 */
.rp-chan-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px;}
.rp-chan-row:last-child{border-bottom:none;}
.rp-chan-name{flex:none;width:58px;font-weight:700;color:var(--text-1);}
.rp-chan-pri{flex:none;font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);}
.rp-chan-pri.high{background:var(--error-soft);color:var(--error);}
.rp-chan-pri.mid{background:var(--warning-soft);color:var(--warning);}
.rp-chan-content{flex:1;min-width:0;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-chan-effect{flex:none;font-size:10px;color:var(--text-3);}

/* 阶段时间线 */
.rp-phase{position:relative;padding-left:22px;margin-bottom:14px;}
.rp-phase:last-child{margin-bottom:0;}
.rp-phase::before{content:'';position:absolute;left:6px;top:14px;bottom:-8px;width:2px;background:var(--line-strong);}
.rp-phase:last-child::before{display:none;}
.rp-phase-dot{position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;}
.rp-phase-dot::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--primary);}
.rp-phase-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-1);}
.rp-phase-goal{font-size:10px;color:var(--primary-dim);font-weight:600;margin-top:2px;}
.rp-phase-tasks{margin-top:7px;background:var(--bg-card-2);border-radius:var(--r-m);padding:9px 11px;}
.rp-phase-task{display:flex;gap:7px;font-size:11px;color:var(--text-2);line-height:1.55;margin-top:4px;}
.rp-phase-task:first-child{margin-top:0;}
.rp-phase-task::before{content:'☐';flex:none;color:var(--text-3);}

/* 内容清单 */
.rp-content{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);}
.rp-content:last-child{border-bottom:none;}
.rp-content-pri{flex:none;font-size:9px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);}
.rp-content-pri.high{background:var(--error-soft);color:var(--error);}
.rp-content-pri.mid{background:var(--warning-soft);color:var(--warning);}
.rp-content-pri.low{background:var(--info-soft);color:var(--info);}
.rp-content-body{flex:1;min-width:0;}
.rp-content-title{font-size:11.5px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-content-form{font-size:9.5px;color:var(--text-3);margin-top:2px;}

/* 证据卡 */
.rp-ev{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;margin-bottom:9px;}
.rp-ev-head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text-1);}
.rp-ev-ico{width:22px;height:22px;border-radius:var(--r-s);background:var(--primary-soft);color:var(--primary-dim);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.rp-ev-kw{font-size:9.5px;color:var(--text-3);margin-left:auto;}
.rp-ev-text{font-size:11.5px;line-height:1.7;color:var(--text-2);margin-top:8px;background:var(--bg-card-2);border-radius:var(--r-m);padding:9px 11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;}
.rp-ev-text.open{-webkit-line-clamp:unset;display:block;}
.rp-ev-text b{color:var(--primary);}
.rp-ev-time{font-size:9px;color:var(--text-3);margin-top:6px;}

/* 生成动画 */
.rp-gen-mask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:28px;}
.rp-gen-mask.show{display:flex;}
.rp-gen-card{width:100%;max-width:340px;background:var(--bg-card);border-radius:var(--r-xl);padding:22px 20px;box-shadow:var(--shadow-xl);border:1px solid var(--line);}
.rp-gen-title{font-size:14px;font-weight:800;color:var(--text-1);text-align:center;}
.rp-gen-sub{font-size:10.5px;color:var(--text-3);text-align:center;margin-top:4px;}
.rp-gen-steps{margin-top:16px;}
.rp-gen-step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12px;color:var(--text-3);}
.rp-gen-step .ic{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .3s;}
.rp-gen-step.doing .ic{border-color:var(--primary);border-top-color:transparent;animation:gspin .8s linear infinite;}
.rp-gen-step.done{color:var(--text-1);}
.rp-gen-step.done .ic{border-color:var(--success);background:var(--success);color:#fff;}
@keyframes gspin{to{transform:rotate(360deg)}}
.rp-gen-progress{margin-top:16px;height:5px;border-radius:3px;background:var(--bg-card-2);overflow:hidden;}
.rp-gen-progress i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .4s;}

/* 空态 */
.rp-empty{text-align:center;padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line-strong);border-radius:var(--r-l);margin-top:12px;}
.rp-empty-title{font-size:13.5px;font-weight:700;color:var(--text-1);}
.rp-empty-desc{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.6;}
.rp-empty-btn{margin-top:14px;height:40px;padding:0 22px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(184,153,104,.3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(184,153,104,.4);transition:transform var(--d-fast);}

/* 底部 CTA */
.rp-cta{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent);}
.rp-cta button{height:44px;min-width:0;padding:0 14px;border-radius:var(--r-m);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.bt-txt{display:inline-flex;align-items:center;gap:2px;min-width:0;white-space:nowrap;}
.btl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-cta .primary{flex:1 1 auto;min-width:0;max-width:none;border:none;background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);box-shadow:0 4px 14px rgba(184,153,104,.3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(184,153,104,.4);transition:transform var(--d-fast);}
.rp-cta .ghost{flex:0 0 auto;min-width:88px;width:auto;background:var(--bg-card);color:var(--text-1);border:1px solid var(--line-strong);box-shadow:var(--shadow-xs);}
.rp-cta button:active{transform:scale(.985);}
</style>
</head>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>

<script src="geo-nav.js"></script>
<script>
(function(){
  var D = window.GEO_DATA;

  function render(){
    var b = D.currentBrand();
    document.getElementById('nav-brand').textContent = b ? b.short : '';
    document.getElementById('cta-brand').textContent = b ? b.short : '品牌';
    var main = document.getElementById('rp-main');
    if(!b){
      document.getElementById('rp-cta').style.display = 'none';
      main.innerHTML = '<div class="rp-empty">'+
        '<div class="rp-empty-title">暂无检测品牌</div>'+
        '<div class="rp-empty-desc">添加品牌并提交基础信息后，<br>即可生成该品牌的 GEO 报告与优化方案</div>'+
        '<button class="rp-empty-btn" onclick="location.href=\'brands.html\'">添加品牌</button>'+
      '</div>';
      return;
    }

    var citations = b.engines.reduce(function(s,e){return s+e.citations;},0);
    var mention = Math.round(b.mentionRate*100);
    var leadGap = Math.round((b.sov - D.COMPETITORS[0].sov)*100);
    var cites = D.CITES_TPL.map(function(c){ return { name: c.name.replace('{brand}', b.short), n: c.n }; });
    var evidences = D.evidencesFor(b);
    var firstKw = b.keywords[0] ? b.keywords[0].term : '行业服务';

    main.innerHTML =
      '<div class="rp-head">'+
        '<div class="rp-head-row">'+
          '<div class="rp-logo">'+b.short.charAt(0)+'</div>'+
          '<div class="rp-head-info">'+
            '<div class="rp-head-title">'+b.name+' · 品牌 GEO 报告</div>'+
            '<div class="rp-head-meta">报告日期 2026-09-29 · 覆盖 7 引擎 · 检测关键词 '+b.keywords.length+' 词</div>'+
          '</div>'+
          '<div class="rp-head-score"><div class="rp-score-num">'+b.geoScore+'</div><div class="rp-score-label">GEO 综合分</div></div>'+
        '</div>'+
        '<div class="rp-head-desc">基于你提交的品牌资料（'+b.industry+' · '+b.website+'），综合 7 大 AI 引擎的提及、引用与推荐位评估：<b>「'+b.short+'」</b>当前处于中等偏上水平。核心问题集中在「'+firstKw+'」相关词的排名下滑与负面描述覆盖，建议优先执行知识库补全与核心渠道内容发布。</div>'+
        '<div class="rp-head-badges">'+
          '<span class="rp-badge">SOV '+(b.sov*100).toFixed(0)+'%</span><span class="rp-badge">提及率 '+mention+'%</span><span class="rp-badge">引用 '+citations+' 次</span><span class="rp-badge">领先竞品 +'+leadGap+'pp</span>'+
        '</div>'+
      '</div>'+

      '<div class="rp-tabs" id="rp-tabs">'+
        '<div class="rp-tab active" data-tab="1">你现在怎么样</div>'+
        '<div class="rp-tab" data-tab="2">问题在哪</div>'+
        '<div class="rp-tab" data-tab="3">去哪发内容</div>'+
        '<div class="rp-tab" data-tab="4">接下来怎么做</div>'+
        '<div class="rp-tab" data-tab="5">AI 真的这么说</div>'+
      '</div>'+

      '<div class="rp-panel active" id="tab-1">'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">核心指标</div>'+
          '<div class="rp-kpis">'+
            '<div class="rp-kpi"><div class="rp-kpi-num good">'+b.geoScore+'</div><div class="rp-kpi-label">GEO 综合分</div></div>'+
            '<div class="rp-kpi"><div class="rp-kpi-num good">'+(b.sov*100).toFixed(0)+'%</div><div class="rp-kpi-label">声量份额 SOV</div></div>'+
            '<div class="rp-kpi"><div class="rp-kpi-num">'+mention+'%</div><div class="rp-kpi-label">品牌提及率</div></div>'+
            '<div class="rp-kpi"><div class="rp-kpi-num good">+'+leadGap+'pp</div><div class="rp-kpi-label">领先竞品差距</div></div>'+
          '</div></div></div>'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">竞品 SOV 对比（行业对照）</div><div id="rp-sov"></div></div></div>'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">引擎收录与推荐位</div>'+
          '<table class="rp-table"><tr><th>引擎</th><th>提及率</th><th>收录</th><th>推荐位</th></tr><tbody id="rp-engines"></tbody></table>'+
        '</div></div>'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">引用来源 Top</div><div id="rp-cites"></div></div></div>'+
      '</div>'+

      '<div class="rp-panel" id="tab-2">'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">六大失语危机命中项</div><div id="rp-crisis"></div></div></div>'+
      '</div>'+

      '<div class="rp-panel" id="tab-3">'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">优化发布渠道矩阵（建议）</div><div id="rp-channels"></div></div></div>'+
      '</div>'+

      '<div class="rp-panel" id="tab-4">'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">分阶段发布方案（优化意见）</div><div id="rp-phases"></div></div></div>'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">内容发布清单</div><div id="rp-contents"></div></div></div>'+
      '</div>'+

      '<div class="rp-panel" id="tab-5">'+
        '<div class="rp-sec"><div class="rp-sec-card"><div class="rp-sec-title">AI 回答证据（模拟）</div><div id="rp-evidences"></div></div></div>'+
      '</div>';

    /* Tab 切换（抽成 activateTab 供深链复用） */
    window.activateTab = function(n){
      var tabs = document.querySelectorAll('.rp-tab');
      var panels = document.querySelectorAll('.rp-panel');
      if(!tabs.length || !panels.length) return;
      for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('active', i+1===n); }
      for(var j=0;j<panels.length;j++){ panels[j].classList.toggle('active', j+1===n); }
    };
    document.getElementById('rp-tabs').addEventListener('click', function(e){
      var t = e.target.closest('.rp-tab');
      if(!t) return;
      activateTab(parseInt(t.dataset.tab, 10));
    });

    /* SOV */
    var sovAll = [{name:b.short,v:b.sov,me:true}].concat(D.COMPETITORS.map(function(c){return {name:c.name,v:c.sov,me:false};}));
    sovAll.sort(function(x,y){return y.v-x.v;});
    var maxSov = Math.max.apply(null, sovAll.map(function(x){return x.v;})) || 1;
    document.getElementById('rp-sov').innerHTML = sovAll.map(function(s){
      return '<div class="rp-bar-row"><span class="rp-bar-name">'+s.name+'</span>'+
        '<div class="rp-bar-track"><i class="'+(s.me?'me':'co')+'" style="width:'+(s.v/maxSov*100)+'%"></i></div>'+
        '<span class="rp-bar-val">'+(s.v*100).toFixed(0)+'%</span></div>';
    }).join('');

    /* 引擎表 */
    document.getElementById('rp-engines').innerHTML = b.engines.map(function(e){
      var eng = D.ENGINES.filter(function(x){return x.id===e.engineId;})[0];
      var st = e.rate>=60 ? '<span class="st hit">已收录</span>' : e.rate>=45 ? '<span class="st part">部分</span>' : '<span class="st miss">较弱</span>';
      return '<tr><td>'+eng.name+'</td><td>'+e.rate+'%</td><td>'+st+'</td><td>#'+e.rank+'</td></tr>';
    }).join('');

    /* 引用来源 */
    var maxC = Math.max.apply(null, cites.map(function(c){return c.n;}));
    document.getElementById('rp-cites').innerHTML = cites.map(function(c){
      return '<div class="rp-bar-row"><span class="rp-bar-name">'+c.name+'</span>'+
        '<div class="rp-bar-track co"><i style="width:'+(c.n/maxC*100)+'%"></i></div>'+
        '<span class="rp-bar-val">'+c.n+' 次</span></div>';
    }).join('');

    /* 危机 */
    var crises = [
      {name:'查无此人', sev:'high', desc:'部分场景下「'+b.short+'」未进入 AI 推荐清单，如「劳务派遣公司推荐」等词。'},
      {name:'排名靠后', sev:'mid',  desc:'「'+firstKw+'」推荐位下滑至 #4，被「建企宝」反超。'},
      {name:'信息过期', sev:'mid',  desc:'百科词条与官网介绍信息滞后 3 个月以上。'},
      {name:'负面覆盖', sev:'high', desc:'资金托管场景出现「部分平台争议」相关描述，需权威对冲。'}
    ];
    document.getElementById('rp-crisis').innerHTML = crises.map(function(c){
      var tag = c.sev==='high'?'紧急':'关注';
      return '<div class="rp-crisis"><span class="rp-crisis-dot '+c.sev+'"></span>'+
        '<div class="rp-crisis-body"><div class="rp-crisis-name">'+c.name+'<span class="rp-crisis-tag '+c.sev+'">'+tag+'</span></div>'+
        '<div class="rp-crisis-desc">'+c.desc+'</div></div></div>';
    }).join('');

    /* 渠道 */
    document.getElementById('rp-channels').innerHTML = D.CHANNELS.map(function(ch){
      return '<div class="rp-chan-row"><span class="rp-chan-name">'+ch.name+'</span>'+
        '<span class="rp-chan-pri '+(ch.priority==='高'?'high':'mid')+'">'+ch.priority+'</span>'+
        '<span class="rp-chan-content">'+ch.content+'</span>'+
        '<span class="rp-chan-effect">'+ch.effect+'</span></div>';
    }).join('');

    /* 阶段 */
    document.getElementById('rp-phases').innerHTML = D.PUBLISH_PLAN.phases.map(function(p){
      return '<div class="rp-phase"><span class="rp-phase-dot"></span>'+
        '<div class="rp-phase-head">'+p.phase+'</div><div class="rp-phase-goal">'+p.goal+'</div>'+
        '<div class="rp-phase-tasks">'+p.tasks.map(function(t){return '<div class="rp-phase-task">'+t+'</div>';}).join('')+'</div></div>';
    }).join('');

    /* 内容清单 */
    document.getElementById('rp-contents').innerHTML = D.PUBLISH_PLAN.contents.map(function(c){
      return '<div class="rp-content"><span class="rp-content-pri '+c.priority.toLowerCase()+'">'+c.priority+'</span>'+
        '<div class="rp-content-body"><div class="rp-content-title">'+c.topic+'</div><div class="rp-content-form">'+c.channel+' · '+c.form+'</div></div></div>';
    }).join('');

    /* 证据 */
    document.getElementById('rp-evidences').innerHTML = evidences.map(function(e){
      return '<div class="rp-ev"><div class="rp-ev-head"><span class="rp-ev-ico">'+e.engine.charAt(0)+'</span>'+e.engine+'<span class="rp-ev-kw">'+e.keyword+'</span></div>'+
        '<div class="rp-ev-text">'+e.text+'</div><div class="rp-ev-time">模拟采集于 '+e.time+'</div></div>';
    }).join('');
  }

  /* 付费墙分层（P0-7）：Tab1 免费预览，Tab2-5 毛玻璃锁 */
  var paid = false;
  function applyPaywall(){
    if (paid) return;
    [2,3,4,5].forEach(function(n){
      var panel = document.getElementById('tab-'+n);
      if (!panel || panel.querySelector('.rp-lock')) return;
      var ov = document.createElement('div');
      ov.className = 'rp-lock';
      ov.innerHTML =
        '<div class="rp-lock-card">'+
          '<div class="rp-lock-title">报告后半段已加锁</div>'+
          '<div class="rp-lock-desc">解锁后可看到：</div>'+
          '<div class="rp-lock-list">'+
            '<div>② 问题在哪 —— 六大失语危机逐项定位</div>'+
            '<div>③ 去哪发内容 —— 8 大发布渠道优先级矩阵</div>'+
            '<div>④ 接下来怎么做 —— 分阶段发布方案 + 内容清单</div>'+
            '<div>⑤ AI 真的这么说 —— 7 引擎原始回答证据</div>'+
          '</div>'+
          '<button class="btn btn-primary btn-block" style="height:44px;" onclick="window.openGen()">生成完整报告 · ¥500</button>'+
          '<div class="rp-lock-note">按次付费 · 新品牌可先领 1 次体验券</div>'+
        '</div>';
      panel.appendChild(ov);
    });
  }
  function unlockPaywall(){
    paid = true;
    document.querySelectorAll('.rp-lock').forEach(function(x){
      x.style.transition='opacity .3s'; x.style.opacity='0';
      setTimeout(function(){ x.remove(); }, 320);
    });
  }

  /* 生成流程 */
  window.openGen = function(){
    var b = D.currentBrand();
    if(!b){ location.href='brands.html'; return; }
    var voucher = false;
    try { voucher = localStorage.getItem('engchain-geo-voucher') === '1'; } catch (e) {}
    var sh = UI.sheet();
    sh.setText('生成「' + b.short + '」GEO 报告');
    sh.html(
      '<div style="padding:2px 4px 6px;">'+
        '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;"><span style="font-family:var(--font-num);font-size:26px;font-weight:800;color:var(--primary);">'+(voucher ? '¥0' : '¥500')+'</span><span style="font-size:11px;color:var(--text-3);">'+(voucher ? '/ 次 · 体验券抵扣中' : '/ 次 · 基于「'+b.name+'」检测数据生成')+'</span></div>'+
        '<div style="font-size:12px;font-weight:700;color:var(--text-1);margin-bottom:7px;">报告包含：</div>'+
        '<div style="font-size:11.5px;color:var(--text-2);line-height:1.9;">① 你现在怎么样（SOV / 引擎收录 / 引用来源 / 竞品差距）<br>② 问题在哪（六大失语危机）<br>③ 去哪发内容（优化发布渠道建议）<br>④ 接下来怎么做（分阶段发布方案 + 内容清单）<br>⑤ AI 真的这么说（回答证据库）</div>'+
        '<div style="margin-top:12px;font-size:10px;color:var(--text-3);">演示环境：点击「确认生成」模拟支付与生成流程，不产生真实扣费。</div>'+
        '<button class="btn btn-primary btn-block" style="margin-top:18px;height:46px;" onclick="window.confirmGen()">'+(voucher ? '使用体验券生成（0 元）' : '确认生成')+'</button>'+
      '</div>'
    );
    sh.show();
  };

  window.confirmGen = function(){
    if (window.UI && UI.closeSheet) UI.closeSheet();
    startGen();
  };

  var GEN_STEPS = ['数据采集','现状诊断','渠道评估','方案生成'];
  function startGen(){
    var mask = document.getElementById('gen-mask');
    var sub = document.getElementById('gen-sub');
    var bar = document.getElementById('gen-bar');
    var steps = document.getElementById('gen-steps');
    mask.classList.add('show');
    steps.innerHTML = GEN_STEPS.map(function(s,i){
      return '<div class="rp-gen-step" id="gs-'+i+'"><span class="ic">'+(i+1)+'</span>'+s+'</div>';
    }).join('');
    var i = 0;
    var timer = setInterval(function(){
      if(i>0){ document.getElementById('gs-'+(i-1)).classList.remove('doing'); document.getElementById('gs-'+(i-1)).classList.add('done'); }
      if(i<GEN_STEPS.length){
        document.getElementById('gs-'+i).classList.add('doing');
        sub.textContent = GEN_STEPS[i];
        bar.style.width = ((i+1)/GEN_STEPS.length*100)+'%';
      }
      if(i>=GEN_STEPS.length){
        clearInterval(timer);
        sub.textContent = '生成完成';
        try {
          if (window.FileStore) {
            var b = D.currentBrand();
            FileStore.add({
              name: '「' + b.short + '」GEO 品牌报告.pdf',
              ext: 'PDF',
              size: (1.8 + Math.round(Math.random() * 14) / 10) + ' MB',
              source: 'GEO 品牌雷达',
              sourceKey: 'geo',
              time: Date.now(),
              timeText: '刚刚',
              href: '../geo/report.html',
              note: b.name + ' · GEO 综合分 ' + b.geoScore + ' · 覆盖 7 引擎 ' + b.keywords.length + ' 关键词',
              event: 'GEO 报告生成'
            });
          }
        } catch (e) {}
        setTimeout(function(){
          mask.classList.remove('show');
          UI.toast('报告已生成，可查看并分享','ok');
          unlockPaywall();
          activateTab(1);
          var head = document.querySelector('.rp-head');
          if (head) D.highlight(head);
        }, 500);
        return;
      }
      i++;
    }, 700);
  }

  render();
  /* 证据原文点击展开（P1-4） */
  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.rp-ev-text') : null;
    if (t) t.classList.toggle('open');
  });
  /* 深链定位（P0-4）：?tab=n 切 Tab；?focus=sov/cites 切 Tab1 滚到对应区块 */
  (function () {
    var q = D.parseQuery();
    if (q.tab) {
      var n = parseInt(q.tab, 10);
      if (n >= 1 && n <= 5) activateTab(n);
    }
    if (q.focus === 'sov' || q.focus === 'cites') {
      activateTab(1);
      var el = document.getElementById(q.focus === 'sov' ? 'rp-sov' : 'rp-cites');
      if (el) D.highlight(el);
    }
  })();
  applyPaywall();
})();
</script>
<script>GEO_NAV.mount(null);</script>
</body>
</html>
