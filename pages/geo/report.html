<style>
body { background: var(--bg); }
.navbar > *:not(.nav-back):not(.nav-title):not(.nav-right) { display: none !important; }
.navbar .nav-back ~ *:not(.nav-title):not(.nav-right) { display: none !important; }
.gv2-wrap { padding: 0 0 calc(48px + var(--sp-6) + var(--sp-8)); }

.gv2-brand-picker { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 14px; scrollbar-width: none; }
.gv2-brand-picker::-webkit-scrollbar { display: none; }
.gv2-bp-chip { flex: none; padding: 8px 16px; border-radius: var(--r-full); background: var(--bg-card); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; transition: all .15s ease; }
.gv2-bp-chip.active { background: var(--action); color: var(--on-action); border-color: transparent; box-shadow: inset 0 1px 0 rgba(176,138,60,.4), var(--btn-ring); }

.gv2-report-head { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px 18px; box-shadow: var(--shadow-float); margin-bottom: 18px; text-align: center; }
.gv2-report-score { font-family: var(--font-num); font-size: 56px; font-weight: 800; color: var(--text-1); line-height: 1; }
.gv2-report-label { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.gv2-report-brand { font-size: 14px; font-weight: 700; color: var(--text-1); margin-top: 14px; }

.gv2-stages { margin-bottom: 18px; }
.gv2-stage { display: flex; gap: 14px; padding: 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-l); margin-bottom: 10px; box-shadow: var(--shadow-xs); }
.gv2-stage.done { opacity: .75; }
.gv2-stage-ico { flex: none; width: 36px; height: 36px; border-radius: var(--r-m); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
.gv2-stage.done .gv2-stage-ico { background: var(--success-soft); color: var(--success); }
.gv2-stage.doing .gv2-stage-ico { background: var(--primary-soft); color: var(--primary-dim); }
.gv2-stage.pending .gv2-stage-ico { background: var(--bg-card-2); color: var(--text-3); }
.gv2-stage-body { flex: 1; min-width: 0; }
.gv2-stage-name { font-size: 13.5px; font-weight: 700; color: var(--text-1); }
.gv2-stage-desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
.gv2-stage-status { flex: none; align-self: flex-start; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-full); }
.gv2-stage-status.done { background: var(--success-soft); color: var(--success); }
.gv2-stage-status.doing { background: var(--primary-soft); color: var(--primary-dim); }
.gv2-stage-status.pending { background: var(--bg-card-2); color: var(--text-3); }

.gv2-sec-title { font-size: 14px; font-weight: 700; color: var(--text-1); margin-bottom: 10px; }
.gv2-sov-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; }
.gv2-sov-name { flex: none; width: 60px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.gv2-sov-track { flex: 1; height: 8px; border-radius: 4px; background: var(--bg-card-2); overflow: hidden; }
.gv2-sov-track i { display: block; height: 100%; border-radius: 4px; }
.gv2-sov-track.me i { background: var(--primary); }
.gv2-sov-track.co i { background: var(--purple); opacity: .5; }
.gv2-sov-val { flex: none; width: 38px; text-align: right; font-family: var(--font-num); font-size: 12px; font-weight: 700; color: var(--text-1); }

.gv2-buy-bar { position: absolute; left: var(--page-pad); right: var(--page-pad); bottom: calc(var(--sp-4) + env(safe-area-inset-bottom, 0px)); z-index: 50; padding: 0; }
.gv2-buy-bar__row { display: flex; align-items: center; gap: var(--sp-2); }
.gv2-btn-download { flex: 0 0 auto; height: 48px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--bg-card); color: var(--text-1); font-size: 13px; font-weight: 600; cursor: pointer; transition: filter var(--d-fast), transform var(--d-fast); }
.gv2-btn-download svg { width: 16px; height: 16px; flex: none; }
.gv2-btn-download:active { transform: scale(.98); filter: brightness(.96); }
.gv2-buy-btn { flex: 1 1 auto; min-width: 0; height: 48px; border: none; border-radius: var(--r-m); background: linear-gradient(180deg, var(--action) 0%, var(--action-deep) 100%); color: var(--on-action); font-size: 15px; font-weight: 700; letter-spacing: .01em; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(176,138,60,.55), var(--btn-ring), var(--btn-lift); transition: filter var(--d-fast), transform var(--d-fast); }
.gv2-buy-btn:active { filter: brightness(.94); transform: translateY(1px); }
.gv2-buy-btn.is-unlocked { background: color-mix(in srgb, var(--success) 16%, var(--bg-card)); color: var(--success); box-shadow: none; border: 1px solid color-mix(in srgb, var(--success) 30%, var(--line)); }

.gv2-anim { animation: gv2Rise .35s var(--e-emph) both; }
@keyframes gv2Rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .gv2-anim { animation: none !important; } }

/* —— GEO 报告支付收银台（单 sheet 四态） —— */
.geo-pay-order { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-card); padding: 2px 16px; margin-bottom: 18px; }
.geo-pay-order .row-mini { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.geo-pay-order .row-mini:last-child { border-bottom: none; }
.geo-pay-order .k { color: var(--text-2); flex: none; }
.geo-pay-order .v { font-weight: 600; text-align: right; }
.geo-pay-order .v.amount { font-family: var(--font-num); font-size: 18px; font-weight: 800; color: var(--primary-dim); }
.pay-method-label { font-size: 13px; font-weight: 600; color: var(--text-1); margin: 4px 0 10px; display: flex; align-items: center; gap: 6px; }
.pm-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 10px; border: 1.5px solid var(--line); border-radius: var(--r-m); background: var(--bg-card); cursor: pointer; transition: border-color var(--d-fast), background var(--d-fast); }
.pm-row:active { transform: scale(.99); }
.pm-row.on { border-color: var(--primary); background: var(--primary-soft); }
.pm-row .pm-icon { width: 38px; height: 38px; border-radius: 11px; flex: none; display: flex; align-items: center; justify-content: center; }
.pm-row .pm-icon svg { width: 19px; height: 19px; }
.pm-row .pm-body { flex: 1; min-width: 0; }
.pm-row .pm-name { font-size: 14px; font-weight: 600; color: var(--text-1); }
.pm-row .pm-desc { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.pm-row .pm-tag { font-size: 10px; font-weight: 600; color: var(--primary-dim); background: var(--primary-soft); padding: 2px 7px; border-radius: var(--r-full); flex: none; }
.pm-row .pm-check { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; transition: all var(--d-fast); }
.pm-check svg { width: 10px; height: 10px; display: none; }
.pm-row.on .pm-check { border-color: var(--primary); background: var(--primary); }
.pm-row.on .pm-check svg { display: block; stroke: #fff; stroke-width: 3; }
#geoAgree { margin: 14px 0 16px; }
#geoCta.btn-pay-disabled { pointer-events: auto; }
.geo-pay-processing { text-align: center; padding: 44px 0 28px; }
.geo-pay-processing .spinner { margin: 0 auto 16px; }
.geo-pay-processing .pp-text { font-size: 13px; color: var(--text-2); }
.geo-pay-processing .pp-sub { font-size: 11px; color: var(--text-3); margin-top: 6px; }
.recharge-success { text-align: center; padding: 10px 0; }
.rs-icon { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 14px; background: linear-gradient(135deg, #2E7D50, #4CAF7D); display: flex; align-items: center; justify-content: center; }
.rs-icon svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.5; fill: none; }
.rs-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
.rs-amount { font-size: 28px; font-weight: 800; color: var(--primary-dim); font-family: var(--font-num); margin-top: 12px; }
.rs-desc { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }
.geo-pay-fail { text-align: center; padding: 20px 0 8px; }
.gf-icon { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 14px; background: var(--error-soft); color: var(--error); display: flex; align-items: center; justify-content: center; }
.gf-icon svg { width: 26px; height: 26px; }
.gf-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
.gf-desc { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.6; padding: 0 12px; }
.gf-actions { display: flex; gap: 10px; margin-top: 20px; }
.gf-actions .btn { flex: 1; }
[data-theme="dark"] .pm-icon-alipay { color: var(--info) !important; }
[data-theme="dark"] .pm-icon-bank { color: var(--purple) !important; }
</style>

<script>
(function(){
  var D = window.GEO_DATA;
  var brands = D.getBrands();
  var q = new URLSearchParams(location.search);
  var curBrandId = q.get('brand') ? brands.find(function(b){return b.name===q.get('brand');})?.id : null;
  var b = curBrandId ? brands.find(function(x){return x.id===curBrandId;}) : D.currentBrand();
  window.__GEO_REPORT_BRAND__ = b.name;

  var stages = [
    { id:1, name:'数据采集与诊断', desc:'采集 7 大 AI 引擎对品牌的提及、引用、推荐位数据，评估当前 GEO 健康度', status:'done' },
    { id:2, name:'竞品差距分析', desc:'对比行业竞品在各引擎的表现，找出声量份额差距和薄弱环节', status:'done' },
    { id:3, name:'优化方案生成', desc:'针对差距生成具体的内容优化、知识库补充、引用源建设建议', status:'doing' },
    { id:4, name:'报告交付与跟踪', desc:'输出完整报告，设定优化目标，持续跟踪 GEO 分数变化', status:'pending' }
  ];

  var sovAll = [{name:b.short,v:b.sov,me:true}].concat(D.COMPETITORS.map(function(c){return {name:c.name,v:c.sov,me:false};}));
  sovAll.sort(function(x,y){return y.v-x.v;});
  var maxSov = Math.max.apply(null, sovAll.map(function(x){return x.v;})) || 1;

  document.getElementById('main').innerHTML =
    '<div class="gv2-brand-picker gv2-anim">' +
      brands.map(function(x){
        return '<div class="gv2-bp-chip'+(x.id===b.id?' active':'')+'" data-id="'+x.id+'">'+x.short+'</div>';
      }).join('') +
    '</div>' +
    '<div class="gv2-report-head gv2-anim" style="animation-delay:.05s">' +
      '<div class="gv2-report-score">'+b.geoScore+'</div>' +
      '<div class="gv2-report-label">GEO 综合分（满分 100）</div>' +
      '<div class="gv2-report-brand">'+b.name+'</div>' +
    '</div>' +
    '<div class="gv2-stages gv2-anim" style="animation-delay:.1s">' +
      stages.map(function(s,i){
        return '<div class="gv2-stage '+s.status+'" style="animation-delay:'+(0.1+i*0.05)+'s">' +
          '<div class="gv2-stage-ico">'+(s.status==='done'?'✓':s.id)+'</div>' +
          '<div class="gv2-stage-body"><div class="gv2-stage-name">'+s.name+'</div><div class="gv2-stage-desc">'+s.desc+'</div></div>' +
          '<span class="gv2-stage-status '+s.status+'">'+(s.status==='done'?'已完成':s.status==='doing'?'进行中':'待开始')+'</span>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="gv2-sec-title gv2-anim" style="animation-delay:.15s">声量份额 SOV 对比</div>' +
    sovAll.map(function(s){
      return '<div class="gv2-sov-row gv2-anim" style="animation-delay:.18s">' +
        '<span class="gv2-sov-name">'+s.name+'</span>' +
        '<div class="gv2-sov-track"><i class="'+(s.me?'me':'co')+'" style="width:'+(s.v/maxSov*100)+'%"></i></div>' +
        '<span class="gv2-sov-val">'+(s.v*100).toFixed(0)+'%</span>' +
      '</div>';
    }).join('');

  document.querySelectorAll('.gv2-bp-chip').forEach(function(el){
    el.onclick = function(){
      var id = this.dataset.id;
      location.href = 'report.html?brand=' + encodeURIComponent(brands.find(function(x){return x.id===id;}).name);
    };
  });
})();
</script>
<script>
(function(){
  var PAID_KEY = 'engchain-geo-report-paid';
  var PENDING_KEY = 'engchain-geo-report-pending';
  var AMOUNT = 500;
  var PM_LIST = ['wechat','alipay','bank'];

  var sh = null;
  var state = 'checkout';
  var pm = 'wechat';
  var agreed = false;
  var sessionOrder = null;
  var timer = null;
  var selfClosing = false;
  var dismissIv = null;
  var brandName = window.__GEO_REPORT_BRAND__ || '';

  function readPaid(){
    try {
      var raw = localStorage.getItem(PAID_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (o && o.orderNo && Number(o.amount) === AMOUNT) return o;
    } catch(e){}
    return null;
  }

  var buyBtn = document.getElementById('geoBuyBtn');
  if (readPaid() && buyBtn) {
    buyBtn.classList.add('is-unlocked');
    buyBtn.textContent = '已生成完整报告';
    buyBtn.onclick = function(){ UI.toast('完整报告已生成，可直接下载查看', 'ok'); };
  }

  function genOrderNo(){
    return 'GR' + Date.now().toString(36).toUpperCase() + String(Math.floor(Math.random()*9000)+1000);
  }
  function forcedResult(){
    var v = new URLSearchParams(location.search).get('payResult');
    return (v === 'success' || v === 'fail' || v === 'pending') ? v : null;
  }
  function randomResult(){
    var r = Math.random();
    return r < .7 ? 'success' : r < .85 ? 'fail' : 'pending';
  }
  function failReason(){
    var pool = [
      '银行返回交易超时，款项未扣除，请重试或更换支付方式。',
      '账户余额不足，款项未扣除，请更换支付方式后重试。',
      '银行卡信息校验异常，款项未扣除，请重试或更换支付方式。'
    ];
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function checkoutHtml(){
    return '' +
    '<div class="geo-pay-order">' +
      '<div class="row-mini"><span class="k">项目</span><span class="v">GEO 品牌完整报告（一次性交付）</span></div>' +
      '<div class="row-mini"><span class="k">应付金额</span><span class="v amount">' + UI.money(AMOUNT) + '</span></div>' +
    '</div>' +
    '<div class="pay-method-label">选择支付方式</div>' +
    '<div class="pm-row' + (pm==='wechat'?' on':'') + '" data-pm="wechat">' +
      '<span class="pm-icon" style="background:rgba(176,138,60,.16);color:var(--primary-dim);"><svg class="ic"><use href="#i-chat"/></svg></span>' +
      '<span class="pm-body"><div class="pm-name">微信支付</div><div class="pm-desc">推荐使用，实时到账</div></span>' +
      '<span class="pm-tag">推荐</span>' +
      '<span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></span>' +
    '</div>' +
    '<div class="pm-row' + (pm==='alipay'?' on':'') + '" data-pm="alipay">' +
      '<span class="pm-icon pm-icon-alipay" style="background:rgba(37,99,235,.14);color:#2563EB;"><svg class="ic"><use href="#i-card"/></svg></span>' +
      '<span class="pm-body"><div class="pm-name">支付宝</div><div class="pm-desc">支持余额、花呗、银行卡</div></span>' +
      '<span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></span>' +
    '</div>' +
    '<div class="pm-row' + (pm==='bank'?' on':'') + '" data-pm="bank">' +
      '<span class="pm-icon pm-icon-bank" style="background:rgba(124,91,189,.14);color:#7C5BBD;"><svg class="ic"><use href="#i-bank"/></svg></span>' +
      '<span class="pm-body"><div class="pm-name">银行卡</div><div class="pm-desc">储蓄卡 / 信用卡网银支付</div></span>' +
      '<span class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></span>' +
    '</div>' +
    '<label class="pay-agree' + (agreed?' on':'') + '" id="geoAgree">' +
      '<span class="pa-box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>' +
      '<span>我已阅读并同意<a href="../agreement/user.html#p-service">《用户服务协议》</a>，支付后解锁完整 GEO 报告。</span>' +
    '</label>' +
    '<button class="btn btn-primary btn-block btn-lg' + (agreed?'':' btn-pay-disabled') + '" id="geoCta">确认支付 ' + UI.money(AMOUNT) + '</button>';
  }
  function payingHtml(){
    return '<div class="geo-pay-processing">' +
      '<div class="spinner"></div>' +
      '<div class="pp-text">支付处理中，请稍候…</div>' +
      '<div class="pp-sub">请勿退出或重复点击</div>' +
    '</div>';
  }
  function successHtml(){
    return '<div class="recharge-success">' +
      '<div class="rs-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div class="rs-title">支付成功</div>' +
      '<div class="rs-amount">' + UI.money(AMOUNT) + '</div>' +
      '<div class="rs-desc">完整 GEO 报告已解锁，可随时下载查看</div>' +
      '<button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" onclick="payDone()">完成</button>' +
    '</div>';
  }
  function failHtml(text){
    return '<div class="geo-pay-fail">' +
      '<div class="gf-icon"><svg class="ic"><use href="#i-x"/></svg></div>' +
      '<div class="gf-title">支付失败</div>' +
      '<div class="gf-desc">' + text + '</div>' +
      '<div class="gf-actions">' +
        '<button class="btn btn-ghost" onclick="backToMethods()">更换支付方式</button>' +
        '<button class="btn btn-primary" onclick="retryPay()">重试</button>' +
      '</div>' +
    '</div>';
  }
  function pendingHtml(){
    return '<div class="geo-pay-processing" style="padding:36px 0 20px;">' +
      '<div class="spinner"></div>' +
      '<div class="pp-text">支付确认中，结果将自动同步</div>' +
      '<div class="pp-sub">银行渠道处理可能需要几分钟，请耐心等待</div>' +
      '<button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" onclick="queryPending()">我已完成支付，查询结果</button>' +
    '</div>';
  }

  function placeFoot(){
    if (!sh) return;
    var foot = sh.querySelector('.sheet-foot');
    var body = sh.body();
    if (!foot || !body) return;
    foot.innerHTML = '';
    var cta = body.querySelector('.btn-block');
    if (cta) {
      var grp = document.createElement('div');
      grp.className = 'sheet-foot-inner';
      grp.appendChild(cta);
      foot.appendChild(grp);
      foot.style.display = 'block';
      body.style.paddingBottom = 'calc(var(--sp-5) + 78px)';
    } else {
      foot.style.display = 'none';
      body.style.paddingBottom = '';
    }
  }

  function renderCheckout(useFoot){
    sh.html(checkoutHtml());
    if (useFoot) placeFoot();
    var rows = sh.body().querySelectorAll('.pm-row');
    rows.forEach(function(row){
      row.onclick = function(){
        rows.forEach(function(x){ x.classList.remove('on'); });
        row.classList.add('on');
        pm = row.dataset.pm;
      };
    });
    var agree = sh.body().querySelector('#geoAgree');
    agree.onclick = function(e){
      if (e.target.tagName === 'A') return;
      agreed = agree.classList.toggle('on');
      syncCta();
    };
    syncCta();
    sh.querySelector('#geoCta').onclick = confirmPay;
  }
  function syncCta(){
    var cta = sh.querySelector('#geoCta');
    if (cta) cta.classList.toggle('btn-pay-disabled', !agreed);
  }

  window.openPaySheet = function(){
    if (readPaid()) return;
    state = 'checkout'; pm = 'wechat'; agreed = false; sessionOrder = null;
    selfClosing = false;
    sh = UI.sheet();
    sh.setText('确认支付');
    sh.setClosable(true);
    renderCheckout(false);
    sh.show();
    watchDismiss();
  };

  function confirmPay(){
    if (!agreed) {
      UI.dialog({
        title: '确认协议',
        text: '请确认您已阅读并同意<a href="../agreement/user.html#p-service">《用户服务协议》</a>',
        ok: '确认并继续支付',
        cancel: '取消',
        onOk: function(){
          agreed = true;
          var ag = sh.body().querySelector('#geoAgree');
          if (ag) ag.classList.add('on');
          syncCta();
          doPay();
        }
      });
      return;
    }
    doPay();
  }

  function doPay(){
    state = 'paying';
    sessionOrder = { orderNo: genOrderNo(), method: pm, amount: AMOUNT, createdAt: Date.now() };
    sh.setClosable(false);
    sh.html(payingHtml());
    placeFoot();
    var delay = 1500 + Math.random()*1000;
    timer = setTimeout(function(){
      timer = null;
      if (!sh || !document.body.contains(sh) || !sh.classList.contains('show')) return;
      var status = forcedResult() || randomResult();
      var r;
      if (status === 'success') {
        r = { orderNo: sessionOrder.orderNo, method: sessionOrder.method, amount: AMOUNT, status: 'success', paidAt: new Date().toISOString() };
      } else if (status === 'pending') {
        r = { orderNo: sessionOrder.orderNo, method: sessionOrder.method, amount: AMOUNT, status: 'pending', paidAt: null };
      } else {
        r = { orderNo: sessionOrder.orderNo, method: sessionOrder.method, amount: AMOUNT, status: 'fail', reason: failReason(), paidAt: null };
      }
      handleResult(r);
    }, delay);
  }

  function isValidSuccess(r){
    return r && r.status === 'success' && Number(r.amount) === AMOUNT &&
      typeof r.orderNo === 'string' && r.orderNo && sessionOrder && r.orderNo === sessionOrder.orderNo &&
      PM_LIST.indexOf(r.method) > -1;
  }
  function handleResult(r){
    if (isValidSuccess(r)) { successBranch(r); return; }
    if (r && r.status === 'pending') { pendingBranch(r); return; }
    failBranch((r && r.reason) || failReason());
  }

  function successBranch(r){
    state = 'success';
    var rec = { orderNo: r.orderNo, amount: AMOUNT, method: r.method, paidAt: r.paidAt, brand: brandName };
    try { localStorage.setItem(PAID_KEY, JSON.stringify(rec)); } catch(e){}
    sh.setClosable(false);
    sh.html(successHtml());
    placeFoot();
    if (buyBtn) {
      buyBtn.classList.add('is-unlocked');
      buyBtn.textContent = '已生成完整报告';
      buyBtn.onclick = function(){ UI.toast('完整报告已生成，可直接下载查看', 'ok'); };
    }
  }
  window.payDone = function(){
    selfClosing = true;
    UI.closeSheet();
    cleanup();
  };

  function failBranch(reason){
    state = 'fail';
    sh.setClosable(true);
    sh.html(failHtml(reason));
    placeFoot();
  }
  window.backToMethods = function(){
    state = 'checkout';
    sh.setClosable(true);
    renderCheckout(true);
  };
  window.retryPay = function(){
    doPay();
  };

  function pendingBranch(r){
    state = 'pending';
    var rec = { orderNo: r.orderNo, method: r.method, amount: AMOUNT, status: 'pending', createdAt: Date.now() };
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(rec)); } catch(e){}
    sh.setClosable(true);
    sh.html(pendingHtml());
    placeFoot();
  }
  window.queryPending = function(){
    if (timer) { clearTimeout(timer); timer = null; }
    sh.setClosable(false);
    sh.html(payingHtml());
    placeFoot();
    timer = setTimeout(function(){
      timer = null;
      if (!sh || !document.body.contains(sh) || !sh.classList.contains('show')) return;
      var status = forcedResult() || (Math.random() < .7 ? 'success' : Math.random() < .6 ? 'fail' : 'pending');
      var r;
      if (status === 'success') {
        r = { orderNo: sessionOrder.orderNo, method: sessionOrder.method, amount: AMOUNT, status: 'success', paidAt: new Date().toISOString() };
      } else if (status === 'pending') {
        r = { orderNo: sessionOrder.orderNo, method: sessionOrder.method, amount: AMOUNT, status: 'pending', paidAt: null };
      } else {
        r = { orderNo: sessionOrder.orderNo, method: sessionOrder.method, amount: AMOUNT, status: 'fail', reason: failReason(), paidAt: null };
      }
      handleResult(r);
    }, 1500 + Math.random()*1000);
  };

  function watchDismiss(){
    selfClosing = false;
    var mo = new MutationObserver(function(){
      if (selfClosing || !sh) return;
      if (!sh.classList.contains('show')) onDismiss();
    });
    mo.observe(sh, { attributes: true, attributeFilter: ['class'] });
    dismissIv = setInterval(function(){
      if (!sh) { clearInterval(dismissIv); return; }
      if (!document.body.contains(sh)) onDismiss();
    }, 200);
    sh.__mo = mo;
  }
  function onDismiss(){
    if (state === 'checkout' || state === 'paying') {
      UI.toast('已取消支付', 'warn');
      if (timer) { clearTimeout(timer); timer = null; }
    }
    cleanup();
  }
  function cleanup(){
    if (dismissIv) { clearInterval(dismissIv); dismissIv = null; }
    if (sh && sh.__mo) { sh.__mo.disconnect(); sh.__mo = null; }
    sh = null;
    state = 'checkout';
  }
})();
</script>
<script>GEOV2.mount(null, {brandBar:false});</script>
</body>
