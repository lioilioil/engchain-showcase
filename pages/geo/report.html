<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/geo/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GEO 品牌报告 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.navbar > *:not(.nav-back):not(.nav-title):not(.nav-right) { display: none !important; }
.navbar .nav-back ~ *:not(.nav-title):not(.nav-right) { display: none !important; }
.gv2-wrap { padding: 0 0 140px; }

.gv2-brand-picker { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 14px; scrollbar-width: none; }
.gv2-brand-picker::-webkit-scrollbar { display: none; }
.gv2-bp-chip { flex: none; padding: 8px 16px; border-radius: var(--r-full); background: var(--bg-card); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; transition: all .15s ease; }
.gv2-bp-chip.active { background: var(--action); color: var(--on-action); border-color: transparent; box-shadow: inset 0 1px 0 rgba(176,138,60,.4), var(--btn-ring); }

.gv2-report-head { background: var(--bg-card); border: 1px solid var(--line); border-top: 2px solid var(--primary); border-radius: var(--r-xl); padding: 22px 18px; box-shadow: var(--shadow-float); margin-bottom: 18px; text-align: center; }
.gv2-report-score { font-family: var(--font-num); font-size: 56px; font-weight: 800; color: var(--text-1); line-height: 1; }
.gv2-report-label { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.gv2-report-brand { font-size: 14px; font-weight: 700; color: var(--text-1); margin-top: 14px; }

.gv2-stages { margin-bottom: 18px; }
.gv2-stage { display: flex; gap: 14px; padding: 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-l); margin-bottom: 10px; box-shadow: var(--shadow-xs); }
.gv2-stage.done { opacity: .75; }
.gv2-stage-ico { flex: none; width: 36px; height: 36px; border-radius: var(--r-m); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
.gv2-stage.done .gv2-stage-ico { background: var(--success-soft); color: var(--success); }
.gv2-stage.doing .gv2-stage-ico { background: var(--primary-soft); color: var(--primary-dim); }
.gv2-stage.pending .gv2-stage-ico { background: var(--bg-card-2); color: var(--text-3); }
.gv2-stage-body { flex: 1; min-width: 0; }
.gv2-stage-name { font-size: 13.5px; font-weight: 700; color: var(--text-1); }
.gv2-stage-desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
.gv2-stage-status { flex: none; align-self: flex-start; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-full); }
.gv2-stage-status.done { background: var(--success-soft); color: var(--success); }
.gv2-stage-status.doing { background: var(--primary-soft); color: var(--primary-dim); }
.gv2-stage-status.pending { background: var(--bg-card-2); color: var(--text-3); }

.gv2-sec-title { font-size: 14px; font-weight: 700; color: var(--text-1); margin-bottom: 10px; }
.gv2-sov-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; }
.gv2-sov-name { flex: none; width: 60px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.gv2-sov-track { flex: 1; height: 8px; border-radius: 4px; background: var(--bg-card-2); overflow: hidden; }
.gv2-sov-track i { display: block; height: 100%; border-radius: 4px; }
.gv2-sov-track.me i { background: var(--primary); }
.gv2-sov-track.co i { background: var(--purple); opacity: .5; }
.gv2-sov-val { flex: none; width: 38px; text-align: right; font-family: var(--font-num); font-size: 12px; font-weight: 700; color: var(--text-1); }

.gv2-buy-bar { position: absolute; left: 0; right: 0; bottom: 72px; z-index: 99; padding: 12px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.gv2-buy-btn { flex: 1; height: 48px; border: none; border-radius: var(--r-m); background: linear-gradient(180deg, var(--action) 0%, var(--action-deep) 100%); color: var(--on-action); font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px 0 rgba(176,138,60,.55), var(--btn-ring), var(--btn-lift); }

.gv2-anim { animation: gv2Rise .35s var(--e-emph) both; }
@keyframes gv2Rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">GEO 品牌报告</div>
    <div class="nav-right"></div>
  </div>
  <div class="scroll">
    <div class="gv2-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;padding:0 2px;">
        <a href="index.html" style="font-size:11px;font-weight:600;color:var(--text-3);text-decoration:none;">‹ 返回驾驶舱</a>
        <span style="font-size:11px;color:var(--text-3);">分阶段生成式报告</span>
      </div>
      <div id="main"></div>
    </div>
  </div>
  <div class="gv2-buy-bar gv2-anim" style="animation-delay:.2s">
    <div style="display:flex;gap:8px;">
      <button onclick="alert('演示环境：下载 PDF')" style="flex:0 0 auto;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg-card);color:var(--text-1);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载
      </button>
      <button class="gv2-buy-btn" onclick="alert('演示环境：报告生成')">生成完整报告 · ¥500</button>
    </div>
  </div>
</div>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="geo-data.js"></script>
<script src="geo-v2-nav.js"></script>
<script>
(function(){
  var D = window.GEO_DATA;
  var brands = D.getBrands();
  var q = new URLSearchParams(location.search);
  var curBrandId = q.get('brand') ? brands.find(function(b){return b.name===q.get('brand');})?.id : null;
  var b = curBrandId ? brands.find(function(x){return x.id===curBrandId;}) : D.currentBrand();

  var stages = [
    { id:1, name:'数据采集与诊断', desc:'采集 7 大 AI 引擎对品牌的提及、引用、推荐位数据，评估当前 GEO 健康度', status:'done' },
    { id:2, name:'竞品差距分析', desc:'对比行业竞品在各引擎的表现，找出声量份额差距和薄弱环节', status:'done' },
    { id:3, name:'优化方案生成', desc:'针对差距生成具体的内容优化、知识库补充、引用源建设建议', status:'doing' },
    { id:4, name:'报告交付与跟踪', desc:'输出完整报告，设定优化目标，持续跟踪 GEO 分数变化', status:'pending' }
  ];

  var sovAll = [{name:b.short,v:b.sov,me:true}].concat(D.COMPETITORS.map(function(c){return {name:c.name,v:c.sov,me:false};}));
  sovAll.sort(function(x,y){return y.v-x.v;});
  var maxSov = Math.max.apply(null, sovAll.map(function(x){return x.v;})) || 1;

  document.getElementById('main').innerHTML =
    '<div class="gv2-brand-picker gv2-anim">' +
      brands.map(function(x){
        return '<div class="gv2-bp-chip'+(x.id===b.id?' active':'')+'" data-id="'+x.id+'">'+x.short+'</div>';
      }).join('') +
    '</div>' +
    '<div class="gv2-report-head gv2-anim" style="animation-delay:.05s">' +
      '<div class="gv2-report-score">'+b.geoScore+'</div>' +
      '<div class="gv2-report-label">GEO 综合分（满分 100）</div>' +
      '<div class="gv2-report-brand">'+b.name+'</div>' +
    '</div>' +
    '<div class="gv2-stages gv2-anim" style="animation-delay:.1s">' +
      stages.map(function(s,i){
        return '<div class="gv2-stage '+s.status+'" style="animation-delay:'+(0.1+i*0.05)+'s">' +
          '<div class="gv2-stage-ico">'+(s.status==='done'?'✓':s.id)+'</div>' +
          '<div class="gv2-stage-body"><div class="gv2-stage-name">'+s.name+'</div><div class="gv2-stage-desc">'+s.desc+'</div></div>' +
          '<span class="gv2-stage-status '+s.status+'">'+(s.status==='done'?'已完成':s.status==='doing'?'进行中':'待开始')+'</span>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="gv2-sec-title gv2-anim" style="animation-delay:.15s">声量份额 SOV 对比</div>' +
    sovAll.map(function(s){
      return '<div class="gv2-sov-row gv2-anim" style="animation-delay:.18s">' +
        '<span class="gv2-sov-name">'+s.name+'</span>' +
        '<div class="gv2-sov-track"><i class="'+(s.me?'me':'co')+'" style="width:'+(s.v/maxSov*100)+'%"></i></div>' +
        '<span class="gv2-sov-val">'+(s.v*100).toFixed(0)+'%</span>' +
      '</div>';
    }).join('');

  document.querySelectorAll('.gv2-bp-chip').forEach(function(el){
    el.onclick = function(){
      var id = this.dataset.id;
      location.href = 'report.html?brand=' + encodeURIComponent(brands.find(function(x){return x.id===id;}).name);
    };
  });
})();
</script>
<script>GEOV2.mount(null, {brandBar:false});</script>
</body>
</html>
