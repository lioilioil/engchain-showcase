(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/geo/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();

<style>
body { background: var(--bg); }
.gv2-wrap { padding: 0 0 24px; }
.navbar > *:not(.nav-back):not(.nav-title):not(.nav-right) { display: none !important; }
.navbar .nav-back ~ *:not(.nav-title):not(.nav-right) { display: none !important; }

.gv2-hero { margin: 0 0 16px; padding: 22px 18px 18px; border-radius: var(--r-xl); background: var(--bg-card); border: 1px solid var(--line); border-top: 2px solid var(--primary); box-shadow: var(--shadow-float); }
.gv2-hero-status { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--text-3); }
.gv2-hero-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); animation: gv2pulse 2s ease-in-out infinite; }
@keyframes gv2pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.gv2-score-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
.gv2-ring { position: relative; flex: none; width: 96px; height: 96px; }
.gv2-ring svg { transform: rotate(-90deg); }
.gv2-ring .track { stroke: var(--bg-card-2); }
.gv2-ring .bar { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset .9s var(--e-emph); filter: drop-shadow(0 2px 4px rgba(176,138,60,.4)); }
.gv2-ring-val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gv2-ring-num { font-family: var(--font-num); font-size: 32px; font-weight: 800; line-height: 1; color: var(--text-1); }
.gv2-ring-label { font-size: 9px; color: var(--text-3); margin-top: 3px; letter-spacing: .04em; }

.gv2-metrics { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.gv2-metric-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.gv2-metric-value { font-family: var(--font-num); font-size: 18px; font-weight: 700; color: var(--text-1); margin-top: 2px; line-height: 1.2; }
.gv2-metric-value .unit { font-size: 11px; color: var(--text-3); font-weight: 500; }
.gv2-metric-value.up { color: var(--success); }
.gv2-metric-value.down { color: var(--error); }

.gv2-cta-row { display: flex; gap: 8px; margin-top: 20px; }
.gv2-cta { flex: 1 1 auto; min-width: 0; height: 46px; padding: 0 14px; border: none; border-radius: var(--r-m); font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: filter .15s ease, transform .15s ease; }
.gv2-cta:active { transform: translateY(1px); }
.gv2-cta.primary { background: linear-gradient(180deg, var(--action) 0%, var(--action-deep) 100%); color: var(--on-action); box-shadow: inset 0 1px 0 rgba(176,138,60,.55), var(--btn-ring), var(--btn-lift); }
.gv2-cta.primary:active { filter: brightness(.94); }
.gv2-cta.ghost { flex: 0 0 auto; min-width: 88px; background: var(--glass-bg); color: var(--text-1); border: 1px solid var(--glass-border); }
.gv2-cta svg { flex: none; width: 16px; height: 16px; }

.gv2-sec { margin: 0 0 18px; }
.gv2-sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.gv2-sec-title { font-size: 14px; font-weight: 700; color: var(--text-1); }
.gv2-sec-more { font-size: 11px; font-weight: 600; color: var(--primary-dim); cursor: pointer; text-decoration: none; }

.gv2-alert { display: flex; gap: 10px; background: var(--bg-card); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--r-m); padding: 12px 13px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow-xs); transition: transform .15s ease; }
.gv2-alert:active { transform: scale(.985); }
.gv2-alert.high { border-left-color: var(--error); }
.gv2-alert.mid { border-left-color: var(--warning-ink); }
.gv2-alert.low { border-left-color: var(--info); }
.gv2-alert-ico { flex: none; width: 32px; height: 32px; border-radius: var(--r-m); display: flex; align-items: center; justify-content: center; }
.gv2-alert-ico svg { width: 16px; height: 16px; }
.gv2-alert-ico.high { background: var(--error-soft); color: var(--error); }
.gv2-alert-ico.mid { background: var(--warning-soft); color: var(--warning-ink); }
.gv2-alert-ico.low { background: var(--info-soft); color: var(--info); }
.gv2-alert-body { flex: 1; min-width: 0; }
.gv2-alert-head { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--text-1); }
.gv2-alert-tag { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: var(--r-full); flex: none; }
.gv2-alert-tag.high { background: var(--error-soft); color: var(--error); }
.gv2-alert-tag.mid { background: var(--warning-soft); color: var(--warning-ink); }
.gv2-alert-tag.low { background: var(--info-soft); color: var(--info); }
.gv2-alert-text { font-size: 11.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
.gv2-alert-meta { font-size: 10px; color: var(--text-3); margin-top: 5px; }

.gv2-engines { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 4px 0; box-shadow: var(--shadow-xs); }
.gv2-engine-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; transition: background .15s ease; }
.gv2-engine-row:active { background: var(--bg-card-2); }
.gv2-engine-ico { flex: none; width: 26px; height: 26px; border-radius: var(--r-s); background: var(--bg-card-2); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
.gv2-engine-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: var(--text-1); }
.gv2-engine-bar { flex: none; width: 56px; height: 3px; border-radius: 2px; background: var(--bg-card-2); overflow: hidden; }
.gv2-engine-bar i { display: block; height: 100%; border-radius: 2px; background: var(--primary); transition: width .5s var(--e-emph); }
.gv2-engine-rate { flex: none; width: 34px; text-align: right; font-family: var(--font-num); font-size: 12px; font-weight: 700; color: var(--text-1); }

.gv2-onboard { margin: 0 0 18px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; box-shadow: var(--shadow-card); }
.gv2-onboard-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.gv2-onboard-title { font-size: 13.5px; font-weight: 800; color: var(--text-1); }
.gv2-onboard-progress { font-family: var(--font-num); font-size: 11px; font-weight: 800; color: var(--primary-dim); }
.gv2-onboard-bar { height: 3px; border-radius: 2px; background: var(--bg-card-2); overflow: hidden; margin-bottom: 16px; }
.gv2-onboard-bar i { display: block; height: 100%; border-radius: 2px; background: var(--primary); transition: width .3s; }

.gv2-step { display: flex; gap: 12px; cursor: pointer; position: relative; padding-bottom: 16px; }
.gv2-step:last-child { padding-bottom: 0; }
.gv2-step::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--bg-card-2); }
.gv2-step:last-child::before { display: none; }
.gv2-step.done::before { background: var(--success); }
.gv2-step-num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-card-2); color: var(--text-3); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; transition: all .2s ease; }
.gv2-step.done .gv2-step-num { background: var(--success); color: #fff; }
.gv2-step.current .gv2-step-num { background: var(--primary-soft); color: var(--primary-dim); box-shadow: 0 0 0 3px var(--primary-soft); }
.gv2-step-info { flex: 1; min-width: 0; padding-top: 2px; }
.gv2-step-name { font-size: 12.5px; font-weight: 700; color: var(--text-1); }
.gv2-step.done .gv2-step-name { color: var(--text-2); }
.gv2-step-desc { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
.gv2-step-go { flex: none; color: var(--text-4); font-size: 14px; padding-top: 4px; }

.gv2-empty { margin: 0; text-align: center; padding: 48px 24px; background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: var(--r-l); }
.gv2-empty-ico { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: var(--r-xl); background: var(--primary-soft); color: var(--primary-dim); display: flex; align-items: center; justify-content: center; }
.gv2-empty-ico svg { width: 28px; height: 28px; }
.gv2-empty-title { font-size: 14px; font-weight: 700; color: var(--text-1); }
.gv2-empty-desc { font-size: 11.5px; color: var(--text-3); margin-top: 6px; line-height: 1.6; }
.gv2-empty-btn { margin-top: 16px; height: 46px; padding: 0 24px; border: none; border-radius: var(--r-m); background: linear-gradient(180deg, var(--action) 0%, var(--action-deep) 100%); color: var(--on-action); font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px 0 rgba(176,138,60,.55), var(--btn-ring), var(--btn-lift); }

@keyframes gv2Rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.gv2-anim { animation: gv2Rise .4s var(--e-emph) both; }
@media (prefers-reduced-motion: reduce) { .gv2-anim { animation: none !important; } }
</style>
</head>

<script>
(function(){
  var D = window.GEO_DATA;
  var ON_KEY = 'engchain-geo-onboard';

  function render(){
    var cur = D.currentBrand();
    var main = document.getElementById('main');

    if (!cur) {
      main.innerHTML = '<div class="gv2-empty gv2-anim" style="animation-delay:.1s">' +
        '<div class="gv2-empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg></div>' +
        '<div class="gv2-empty-title">还没有检测品牌</div>' +
        '<div class="gv2-empty-desc">添加你的公司或关注的品牌，<br>提交基础信息后即可开始 AI 可见度检测</div>' +
        '<button class="gv2-empty-btn" onclick="location.href=\'brands.html\'">添加品牌，开始检测</button>' +
      '</div>';
      return;
    }

    var b = cur;
    var ringCirc = 2 * Math.PI * 42;
    var mention = Math.round(b.mentionRate * 100);
    var activeKws = b.keywords.filter(function(k){return k.enabled;});

    var allAlerts = D.ALERT_TPL.map(function(a, i){
      var o = JSON.parse(JSON.stringify(a));
      o.keyword = activeKws[i % activeKws.length] ? activeKws[i % activeKws.length].term : '行业服务';
      return o;
    });
    var sevOrder = { high: 0, mid: 1, low: 2 };
    var topAlerts = allAlerts.slice().sort(function(a,b){ return (sevOrder[a.severity]||3) - (sevOrder[b.severity]||3); }).slice(0, 2);

    var onb = {};
    try { onb = JSON.parse(localStorage.getItem(ON_KEY) || '{}'); } catch(e){}
    var onbDone = ['1','2','3'].filter(function(s){ return onb[s]; }).length;
    var ONB_STEPS = [
      { id:'1', name:'添加你的关键词', desc:'从行业词库挑选要检测的词', href:'keywords.html?focus=my' },
      { id:'2', name:'看 AI 怎么回答', desc:'查看 7 大引擎的提及与引用', href:'monitor.html' },
      { id:'3', name:'生成品牌 GEO 报告', desc:'¥500 一次性交付完整方案', href:'report.html' }
    ];
    var onboardHtml = onbDone < 3 ?
      '<div class="gv2-onboard gv2-anim" style="animation-delay:.35s">' +
        '<div class="gv2-onboard-head"><div class="gv2-onboard-title">3 步开始用 GEO</div><div class="gv2-onboard-progress">'+onbDone+'/3</div></div>' +
        '<div class="gv2-onboard-bar"><i style="width:'+(onbDone/3*100)+'%"></i></div>' +
        ONB_STEPS.map(function(s){
          var done = !!onb[s.id];
          var isCurrent = !done && (onbDone === parseInt(s.id)-1 || (onbDone===0 && s.id==='1'));
          return '<div class="gv2-step'+(done?' done':'')+(isCurrent?' current':'')+'" onclick="window.geoStep(\''+s.id+'\',\''+s.href+'\')">' +
            '<div class="gv2-step-num">'+(done?'✓':s.id)+'</div>' +
            '<div class="gv2-step-info"><div class="gv2-step-name">'+s.name+'</div><div class="gv2-step-desc">'+s.desc+'</div></div>' +
            '<span class="gv2-step-go">›</span>' +
          '</div>';
        }).join('') +
      '</div>' : '';

    main.innerHTML =
      '<div class="gv2-hero gv2-anim" style="animation-delay:.05s">' +
        '<div class="gv2-hero-status"><span class="dot"></span>「'+b.short+'」AI 搜索可见度 · 持续检测中</div>' +
        '<div class="gv2-score-row">' +
          '<div class="gv2-ring">' +
            '<svg width="96" height="96" viewBox="0 0 96 96">' +
              '<circle class="track" cx="48" cy="48" r="42" fill="none" stroke-width="6"/>' +
              '<circle class="bar" id="geo-ring" cx="48" cy="48" r="42" fill="none" stroke-width="6" stroke-dasharray="'+ringCirc+'" stroke-dashoffset="'+ringCirc+'"/>' +
            '</svg>' +
            '<div class="gv2-ring-val"><div class="gv2-ring-num" id="geo-score">'+b.geoScore+'</div><div class="gv2-ring-label">GEO 综合分</div></div>' +
          '</div>' +
          '<div class="gv2-metrics">' +
            '<div><div class="gv2-metric-label">品牌提及率</div><div class="gv2-metric-value">'+mention+'<span class="unit">%</span></div></div>' +
            '<div><div class="gv2-metric-label">声量份额 SOV</div><div class="gv2-metric-value">'+(b.sov*100).toFixed(0)+'<span class="unit">%</span></div></div>' +
            '<div><div class="gv2-metric-label">综合分环比</div><div class="gv2-metric-value '+(b.geoScoreDelta>=0?'up':'down')+'">'+(b.geoScoreDelta>=0?'↑ +':'↓ ')+Math.abs(b.geoScoreDelta)+'</div></div>' +
            '<div><div class="gv2-metric-label">知识库健康度</div><div class="gv2-metric-value">'+b.kbHealth+'<span class="unit">/100</span></div></div>' +
          '</div>' +
        '</div>' +
        '<div class="gv2-cta-row">' +
          '<button class="gv2-cta primary" onclick="location.href=\'report.html\'">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>' +
            '生成 GEO 报告 ¥500' +
          '</button>' +
          '<button class="gv2-cta ghost" onclick="location.href=\'pricing.html\'">权益说明</button>' +
        '</div>' +
      '</div>' +
      onboardHtml +
      '<div class="gv2-sec gv2-anim" style="animation-delay:.2s">' +
        '<div class="gv2-sec-head"><div class="gv2-sec-title">需要处理</div><a class="gv2-sec-more" href="audit.html?focus=alerts">全部 ›</a></div>' +
        topAlerts.map(function(a){
          var sevMap = { high:'紧急', mid:'关注', low:'提示' };
          var ico = a.severity==='high'
            ? '<path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="10"/>'
            : a.severity==='mid'
            ? '<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>'
            : '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>';
          var ENG_NAME2ID = {'豆包':'doubao','DeepSeek':'deepseek','Kimi':'kimi','文心一言':'wenxin','通义千问':'tongyi','ChatGPT':'chatgpt','Perplexity':'perplexity'};
          var href = a.action==='content' ? 'audit.html?focus=negative'
            : a.action==='audit' ? 'audit.html?focus=rank'
            : a.action==='knowledge' ? 'knowledge.html?section=dims'
            : 'monitor.html?engine='+(ENG_NAME2ID[a.engine]||'doubao')+'&kw='+encodeURIComponent(a.keyword||'行业服务');
          return '<div class="gv2-alert '+a.severity+'" onclick="location.href=\''+href+'\'">' +
            '<div class="gv2-alert-ico '+a.severity+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ico+'</svg></div>' +
            '<div class="gv2-alert-body">' +
              '<div class="gv2-alert-head">'+a.type+' <span class="gv2-alert-tag '+a.severity+'">'+sevMap[a.severity]+'</span></div>' +
              '<div class="gv2-alert-text">'+a.text.replace('{brand}',b.short).replace('{kw}',a.keyword)+'</div>' +
              '<div class="gv2-alert-meta">'+a.engine+' · '+a.keyword+' · '+a.time+'</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div class="gv2-sec gv2-anim" style="animation-delay:.28s">' +
        '<div class="gv2-sec-head"><div class="gv2-sec-title">7 大引擎提及率</div><a class="gv2-sec-more" href="monitor.html">详情 ›</a></div>' +
        '<div class="gv2-engines">' +
          b.engines.map(function(e){
            var eng = D.ENGINES.filter(function(x){ return x.id===e.engineId; })[0];
            return '<div class="gv2-engine-row" onclick="location.href=\'monitor.html?engine='+e.engineId+'\'">' +
              '<div class="gv2-engine-ico">'+eng.name.charAt(0)+'</div>' +
              '<div class="gv2-engine-name">'+eng.name+'</div>' +
              '<div class="gv2-engine-bar"><i style="width:'+e.rate+'%"></i></div>' +
              '<div class="gv2-engine-rate">'+e.rate+'%</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';

    var ring = document.getElementById('geo-ring');
    if (ring) requestAnimationFrame(function(){ ring.style.strokeDashoffset = ringCirc * (1 - b.geoScore / 100); });
    var scoreEl = document.getElementById('geo-score');
    if (scoreEl) {
      var target = b.geoScore, t0 = null;
      scoreEl.textContent = '0';
      function stepScore(ts){
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / 800);
        var eased = 1 - Math.pow(1 - p, 3);
        scoreEl.textContent = Math.round(target * eased);
        if (p < 1) requestAnimationFrame(stepScore);
      }
      requestAnimationFrame(stepScore);
    }
  }

  window.geoStep = function(id, href){
    var st = {};
    try { st = JSON.parse(localStorage.getItem(ON_KEY) || '{}'); } catch(e){}
    st[id] = 1;
    try { localStorage.setItem(ON_KEY, JSON.stringify(st)); } catch(e){}
    location.href = href;
  };

  render();
})();
</script>
<script>GEOV2.mount(null, {brandBar:false});</script>
</body>
</html>
