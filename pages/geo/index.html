<title>GEO 品牌雷达 · 驾驶舱 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.gd-wrap { padding: 0 0 40px; }

/* 品牌切换器 */
.gd-switch{display:flex;align-items:center;gap:8px;margin-top:10px;}
.gd-switch-scroll{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.gd-switch-scroll::-webkit-scrollbar{display:none;}
.gd-sw-brand{flex:none;max-width:150px;padding:8px 13px;border-radius:var(--r-full);background:var(--bg-card);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s;}
.gd-sw-brand.on{color:var(--text-inv);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);border-color:transparent;box-shadow:0 3px 10px -3px rgba(184,153,104,.5),inset 0 1px 0 rgba(255,255,255,.3);}
.gd-sw-manage{flex:none;width:32px;height:32px;border-radius:var(--r-m);background:var(--bg-card);border:1px solid var(--line);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.gd-sw-manage:active{transform:scale(.95);}
.gd-sw-manage svg{width:15px;height:15px;}

/* Hero —— 系统风格：明色卡 + 金色光晕 + 内高光 */
.gd-hero{margin:10px 0 0;padding:16px 16px 14px;border-radius:var(--r-xl);position:relative;overflow:hidden;background:radial-gradient(460px 210px at 90% -22%, rgba(184,153,104,.16), transparent 62%),radial-gradient(340px 170px at -8% 118%, rgba(184,153,104,.07), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.65);}
.gd-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(184,153,104,.12) 0%, transparent 70%);pointer-events:none;}
.gd-hero::after{content:'';position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle, rgba(184,153,104,.07) 0%, transparent 70%);pointer-events:none;}
.gd-hero-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-2);}
.gd-hero-top .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft);animation:gdp 2s ease-in-out infinite;}
@keyframes gdp{0%,100%{opacity:1}50%{opacity:.4}}
.gd-hero-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;}
.gd-brand-row{display:flex;align-items:center;gap:10px;margin-top:14px;position:relative;z-index:1;}
.gd-brand-avatar{flex:none;width:44px;height:44px;border-radius:var(--r-m);background:linear-gradient(135deg,var(--primary),var(--primary-dim));box-shadow:0 2px 8px rgba(184,153,104,.35),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:var(--text-inv);}
.gd-brand-info{flex:1;min-width:0;}
.gd-brand-name{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gd-brand-meta{font-size:10.5px;color:var(--text-3);margin-top:3px;}
.gd-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);background:var(--success-soft);color:var(--success);flex:none;}
.gd-score-row{display:flex;align-items:center;gap:14px;margin-top:16px;position:relative;z-index:1;padding:12px 12px;background:var(--bg-card-2);border:1px solid var(--line-hairline);border-radius:var(--r-m);}
.gd-ring{position:relative;flex:none;width:72px;height:72px;}
.gd-ring svg{transform:rotate(-90deg);}
.gd-ring .track{stroke:var(--line-strong);}
.gd-ring .bar{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .8s var(--e-emph);filter:drop-shadow(0 1px 2px rgba(184,153,104,.4));}
.gd-ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gd-ring-num{font-family:var(--font-num);font-size:20px;font-weight:800;line-height:1;}
.gd-ring-label{font-size:8px;color:var(--text-3);margin-top:2px;}
.gd-score-side{flex:1;}
.gd-score-line{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:6px;}
.gd-score-line b{font-family:var(--font-num);font-size:14px;color:var(--text-1);}
.gd-score-line .up{color:var(--success);font-size:11px;font-weight:600;}
.gd-hero-cta{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;}
.gd-cta{flex:1 1 auto;min-width:0;height:40px;padding:0 12px;border:none;border-radius:var(--r-m);font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform var(--d-fast) var(--e-standard),box-shadow var(--d-fast),filter var(--d-fast);}
.gd-cta:active{transform:scale(.98);}
.gd-cta.report{background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);box-shadow:0 4px 14px rgba(184,153,104,.30),0 1px 0 rgba(255,255,255,.35) inset,0 0 0 1px rgba(184,153,104,.4);}
.gd-cta.ghost{flex:0 0 auto;min-width:84px;background:var(--glass-bg);color:var(--text-1);border:1px solid var(--glass-border);box-shadow:var(--shadow-xs);}
.gd-cta svg{flex:none;width:15px;height:15px;}
.bt-txt{display:inline-flex;align-items:center;gap:2px;min-width:0;white-space:nowrap;}
.btl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Tab */
.gd-tabs{display:flex;margin:14px 0 0;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;}
.gd-tab{flex:1;padding:8px 0;text-align:center;font-size:12.5px;font-weight:600;color:var(--text-3);border-radius:var(--r-m);cursor:pointer;transition:all .2s;}
.gd-tab.active{background:var(--bg);color:var(--text-1);box-shadow:0 1px 3px rgba(0,0,0,.06);}

/* 区块 */
.gd-sec{margin-top:18px;}
.gd-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.gd-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.gd-sec-more{font-size:11px;font-weight:600;color:var(--text-3);cursor:pointer;}
.gd-sec-more:active{opacity:.6;}

/* 首屏渐进披露（P1-1）：区块默认折叠为预览行 */
.gd-onboard{background:linear-gradient(135deg,var(--bg-card),#faf6ee);border:1px solid var(--accent-line);border-radius:var(--r-l);padding:13px 14px;margin-top:14px;box-shadow:var(--shadow-card);}
.gd-onboard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.gd-onboard-title{font-size:13px;font-weight:800;color:var(--text-1);}
.gd-onboard-progress{font-family:var(--font-num);font-size:10.5px;font-weight:800;color:var(--primary-dim);}
.gd-onboard-bar{height:4px;border-radius:2px;background:var(--bg-card-2);overflow:hidden;margin-bottom:10px;}
.gd-onboard-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .3s;}
.gd-onboard-step{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r-m);cursor:pointer;transition:background var(--d-fast);}
.gd-onboard-step:hover{background:var(--bg-card-2);}
.gd-onboard-step.done{opacity:.55;}
.gd-onboard-num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dim);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.gd-onboard-step.done .gd-onboard-num{background:var(--success-soft);color:var(--success);}
.gd-onboard-info{flex:1;min-width:0;}
.gd-onboard-name{font-size:11.5px;font-weight:700;color:var(--text-1);}
.gd-onboard-desc{font-size:9.5px;color:var(--text-3);margin-top:1px;}
.gd-onboard-go{flex:none;color:var(--text-3);font-size:12px;}
.gd-fold-prev{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;box-shadow:var(--shadow-xs);}
.gd-fold-prev-row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text-2);line-height:1.5;}
.gd-fold-prev-row b{color:var(--text-1);}
.gd-fold-prev-row .spark{flex:none;width:76px;height:22px;}
.gd-fold-prev-meta{margin-left:auto;flex:none;font-size:9.5px;color:var(--text-3);}
.gd-fold-btn{margin-top:8px;width:100%;height:32px;border:1px dashed var(--line-strong);border-radius:var(--r-m);background:var(--bg-card);color:var(--text-2);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:border-color var(--d-fast),color var(--d-fast);}
.gd-fold-btn:hover{border-color:var(--accent-line);color:var(--primary-dim);}
.gd-fold-body{display:none;margin-top:0;}
.gd-fold.open .gd-fold-body{display:block;}
.gd-fold.open .gd-fold-prev{display:none;}
.gd-fold.open .gd-fold-btn{display:none;}

/* 引擎矩阵 */
.gd-eng-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.gd-eng{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 11px;cursor:pointer;transition:transform var(--d-fast) var(--e-standard),box-shadow var(--d-fast),border-color var(--d-fast);box-shadow:var(--shadow-xs);}
.gd-eng:hover{border-color:var(--accent-line);box-shadow:var(--shadow-card);transform:translateY(-1px);} .gd-eng:active{transform:scale(.97);}
.gd-eng-head{display:flex;align-items:center;gap:8px;}
.gd-eng-ico{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:var(--primary-soft);color:var(--primary-dim);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.gd-eng-name{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gd-eng-rate{font-family:var(--font-num);font-size:14px;font-weight:800;color:var(--text-1);}
.gd-eng-rate .unit{font-size:9px;color:var(--text-3);font-weight:600;}
.gd-eng-bar{margin-top:8px;height:4px;border-radius:2px;background:var(--bg-card-2);overflow:hidden;}
.gd-eng-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));}
.gd-eng-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:9.5px;color:var(--text-3);}

/* SOV */
.gd-sov{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 13px;}
.gd-sov-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.gd-sov-row:last-child{margin-bottom:0;}
.gd-sov-name{flex:none;width:52px;font-size:11px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gd-sov-track{flex:1;height:10px;border-radius:5px;background:var(--bg-card-2);overflow:hidden;}
.gd-sov-track i{display:block;height:100%;border-radius:5px;transition:width .5s var(--e-emph);}
.gd-sov-track.me i{background:linear-gradient(90deg,var(--primary),var(--primary-dim));}
.gd-sov-track.co i{background:linear-gradient(90deg,var(--purple),var(--purple));}
.gd-sov-val{flex:none;width:38px;text-align:right;font-family:var(--font-num);font-size:11.5px;font-weight:800;color:var(--text-1);}

/* 预警 */
.gd-alert{display:flex;gap:10px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px;margin-bottom:8px;cursor:pointer;}
.gd-alert:active{transform:scale(.985);}
.gd-alert-ico{flex:none;width:30px;height:30px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;}
.gd-alert-ico svg{width:15px;height:15px;}
.gd-alert-ico.high{background:var(--error-soft);color:var(--error);}
.gd-alert-ico.mid{background:var(--warning-soft);color:var(--warning);}
.gd-alert-ico.low{background:var(--info-soft);color:var(--info);}
.gd-alert-body{flex:1;min-width:0;}
.gd-alert-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-1);}
.gd-alert-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:var(--r-full);flex:none;}
.gd-alert-tag.high{background:var(--error-soft);color:var(--error);}
.gd-alert-tag.mid{background:var(--warning-soft);color:var(--warning);}
.gd-alert-tag.low{background:var(--info-soft);color:var(--info);}
.gd-alert-text{font-size:11px;color:var(--text-2);margin-top:3px;line-height:1.5;}
.gd-alert-meta{font-size:10px;color:var(--text-3);margin-top:4px;}

/* 空态 */
.gd-empty{text-align:center;padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line-strong);border-radius:var(--r-l);}
.gd-empty-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:var(--r-xl);background:var(--primary-soft);color:var(--primary-dim);display:flex;align-items:center;justify-content:center;}
.gd-empty-ico svg{width:26px;height:26px;}
.gd-empty-title{font-size:13.5px;font-weight:700;color:var(--text-1);}
.gd-empty-desc{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.6;}
.gd-empty-btn:active{transform:scale(.97);} .gd-empty-btn{margin-top:14px;height:40px;padding:0 22px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(184,153,104,.3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(184,153,104,.4);transition:transform var(--d-fast);}

/* 引用来源 */
.gd-cite{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
.gd-cite:last-child{border-bottom:none;}
.gd-cite-rank{flex:none;width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dim);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.gd-cite-name{flex:1;font-size:12px;font-weight:600;color:var(--text-1);}
.gd-cite-count{font-family:var(--font-num);font-size:11.5px;color:var(--text-3);}
</style>
</head>

<script>
(function(){
  var D = window.GEO_DATA;

  function renderSwitcher(cur){
    document.getElementById('nav-brand').textContent = cur ? cur.short : '';
    document.getElementById('sw-brands').innerHTML = D.getBrands().map(function(b){
      return '<div class="gd-sw-brand'+(cur&&cur.id===b.id?' on':'')+'" data-id="'+b.id+'">'+b.short+'</div>';
    }).join('');
  }

  document.getElementById('sw-brands').addEventListener('click', function(e){
    var chip = e.target.closest('.gd-sw-brand');
    if(!chip || chip.classList.contains('on')) return;
    D.switchBrand(chip.dataset.id);
    UI.toast('已切换至「' + D.currentBrand().short + '」','ok');
    render();
  });

  function render(){
    var cur = D.currentBrand();
    renderSwitcher(cur);

    var main = document.getElementById('main');
    if(!cur){
      main.innerHTML =
        '<div class="gd-sec"><div class="gd-empty">'+
          '<div class="gd-empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg></div>'+
          '<div class="gd-empty-title">还没有检测品牌</div>'+
          '<div class="gd-empty-desc">添加你的公司或关注的品牌，<br>提交基础信息后即可开始 AI 可见度检测</div>'+
          '<button class="gd-empty-btn" onclick="location.href=\'brands.html\'">添加品牌，开始检测</button>'+
        '</div></div>';
      return;
    }

    var b = cur;
    var ringCirc = 2*Math.PI*31;
    var mention = Math.round(b.mentionRate*100);
    var activeKws = b.keywords.filter(function(k){return k.enabled;});
    var alerts = D.ALERT_TPL.map(function(a, i){
      var o = JSON.parse(JSON.stringify(a));
      o.keyword = activeKws[i%activeKws.length] ? activeKws[i%activeKws.length].term : '行业服务';
      return o;
    });
    var cites = D.CITES_TPL.map(function(c){ return { name: c.name.replace('{brand}', b.short), n: c.n }; });

    /* 新手任务卡（P2-3）：3 步引导，完成打勾，全完成自动收起 */
    var ON_KEY = 'engchain-geo-onboard';
    var onb = {};
    try { onb = JSON.parse(localStorage.getItem(ON_KEY) || '{}'); } catch (e) {}
    var onbDone = ['1','2','3'].filter(function(s){ return onb[s]; }).length;
    var ONB_STEPS = [
      { id:'1', name:'添加你的关键词', desc:'从行业词库挑要检测的词', href:'keywords.html?focus=my' },
      { id:'2', name:'看 AI 怎么回答', desc:'查看 7 大引擎的提及与引用', href:'monitor.html' },
      { id:'3', name:'生成品牌 GEO 报告', desc:'¥500 一次性交付完整方案', href:'report.html' }
    ];
    var onboardHtml = onbDone < 3 ? '<div class="gd-onboard" id="gd-onboard">'+
      '<div class="gd-onboard-head"><div class="gd-onboard-title">3 步开始用 GEO</div><div class="gd-onboard-progress">'+onbDone+'/3</div></div>'+
      '<div class="gd-onboard-bar"><i style="width:'+(onbDone/3*100)+'%"></i></div>'+
      ONB_STEPS.map(function(s){
        var done = !!onb[s.id];
        return '<div class="gd-onboard-step'+(done?' done':'')+'" onclick="window.geoStep(\''+s.id+'\',\''+s.href+'\')">'+
          '<div class="gd-onboard-num">'+(done?'✓':s.id)+'</div>'+
          '<div class="gd-onboard-info"><div class="gd-onboard-name">'+s.name+'</div><div class="gd-onboard-desc">'+s.desc+'</div></div>'+
          '<span class="gd-onboard-go">›</span></div>';
      }).join('')+'</div>' : '';

    main.innerHTML =
      /* Hero */
      '<div class="gd-hero">'+
        '<div class="gd-hero-top"><span class="dot"></span>「'+b.short+'」AI 搜索可见度 · 持续检测中</div>'+
        '<div class="gd-hero-sub">基于你提交的品牌资料，在 7 大 AI 引擎追踪提及 / 引用 / 推荐位</div>'+
        '<div class="gd-brand-row">'+
          '<div class="gd-brand-avatar">'+b.short.charAt(0)+'</div>'+
          '<div class="gd-brand-info">'+
            '<div class="gd-brand-name">'+b.name+' <span class="gd-badge">✓ 检测中</span></div>'+
            '<div class="gd-brand-meta">'+b.website+' · '+b.industry+' · 别名 '+b.aliases.join(' / ')+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="gd-score-row">'+
          '<div class="gd-ring"><svg width="72" height="72" viewBox="0 0 72 72">'+
            '<circle class="track" cx="36" cy="36" r="31" fill="none" stroke-width="6"/>'+
            '<circle class="bar" id="geo-ring" cx="36" cy="36" r="31" fill="none" stroke-width="6" stroke-dasharray="'+ringCirc+'" stroke-dashoffset="'+ringCirc+'"/>'+
          '</svg><div class="gd-ring-val"><div class="gd-ring-num" id="geo-score">'+b.geoScore+'</div><div class="gd-ring-label">GEO 综合分</div></div></div>'+
          '<div class="gd-score-side">'+
            '<div class="gd-score-line"><span>品牌提及率</span><b>'+mention+'%</b></div>'+
            '<div class="gd-score-line"><span>声量份额 SOV</span><b>'+(b.sov*100).toFixed(0)+'%</b></div>'+
            '<div class="gd-score-line"><span>综合分环比</span><b class="up">'+(b.geoScoreDelta>=0?'↑ +':'↓ ')+Math.abs(b.geoScoreDelta)+'</b></div>'+
            '<div class="gd-score-line"><span>知识库健康度</span><b>'+b.kbHealth+'<span style="font-size:10px;color:var(--text-3)">/100</span></b></div>'+
          '</div>'+
        '</div>'+
        '<div class="gd-hero-cta">'+
          '<button class="gd-cta report" onclick="location.href=\'report.html\'">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>'+
            '<span class="bt-txt">生成「<span class="btl">'+b.short+'</span>」GEO 报告 ¥500</span>'+
          '</button>'+
          '<button class="gd-cta ghost" onclick="location.href=\'pricing.html\'"><span class="bt-txt">权益说明</span></button>'+
        '</div>'+
      '</div>'+

      onboardHtml +

      '<div class="gd-tabs">'+
        '<div class="gd-tab active" data-view="brand">看我的</div>'+
        '<div class="gd-tab" data-view="industry">看同行</div>'+
      '</div>'+

      '<div id="view-brand">'+
        '<div class="gd-sec"><div class="gd-sec-title">引擎矩阵 <span class="gd-sec-more" onclick="location.href=\'monitor.html\'">引擎监控 ›</span></div>'+
          '<div class="gd-fold" id="fold-eng">'+
            '<div class="gd-fold-prev" id="prev-eng"></div>'+
            '<div class="gd-fold-body"><div class="gd-eng-grid">'+b.engines.map(function(e){
              var eng = D.ENGINES.filter(function(x){return x.id===e.engineId;})[0];
              var kw0 = (activeKws[0]||{term:'行业服务'}).term;
              return '<div class="gd-eng" onclick="location.href=\'monitor.html?engine='+e.engineId+'&kw='+encodeURIComponent(kw0)+'\'">'+
                '<div class="gd-eng-head"><div class="gd-eng-ico">'+eng.name.charAt(0)+'</div><div class="gd-eng-name">'+eng.name+'</div>'+
                '<div class="gd-eng-rate">'+e.rate+'<span class="unit">%</span></div></div>'+
                '<div class="gd-eng-bar"><i style="width:'+e.rate+'%"></i></div>'+
                '<div class="gd-eng-meta"><span>推荐位 #'+e.rank+'</span><span>引用 '+e.citations+' 次</span></div>'+
              '</div>';
            }).join('')+'</div></div>'+
            '<button class="gd-fold-btn" onclick="window.toggleFold(\'fold-eng\')">展开完整视图 <span>▾</span></button>'+
          '</div></div>'+

        '<div class="gd-sec"><div class="gd-sec-title">品牌声量对比（SOV）<span class="gd-sec-more" onclick="location.href=\'report.html?tab=1&focus=sov\'">报告详情 ›</span></div>'+
          '<div class="gd-fold" id="fold-sov">'+
            '<div class="gd-fold-prev" id="prev-sov"></div>'+
            '<div class="gd-fold-body"><div class="gd-sov" id="sov-box"></div></div>'+
            '<button class="gd-fold-btn" onclick="window.toggleFold(\'fold-sov\')">展开完整视图 <span>▾</span></button>'+
          '</div></div>'+

        '<div class="gd-sec"><div class="gd-sec-title">预警与待办 <span class="gd-sec-more" onclick="location.href=\'audit.html?focus=alerts\'">全部 ›</span></div>'+
          '<div class="gd-fold" id="fold-alert">'+
            '<div class="gd-fold-prev" id="prev-alert"></div>'+
            '<div class="gd-fold-body"><div id="alert-box"></div></div>'+
            '<button class="gd-fold-btn" onclick="window.toggleFold(\'fold-alert\')">展开完整视图 <span>▾</span></button>'+
          '</div></div>'+
      '</div>'+

      '<div id="view-industry" style="display:none;">'+
        '<div class="gd-sec"><div class="gd-sec-title">AI 意图热度（'+b.short+' 关键词）<span class="gd-sec-more" onclick="location.href=\'keywords.html?focus=my\'">管理 ›</span></div>'+
          '<div class="gd-fold" id="fold-heat">'+
            '<div class="gd-fold-prev" id="prev-heat"></div>'+
            '<div class="gd-fold-body"><div class="gd-sov" id="heat-box"></div></div>'+
            '<button class="gd-fold-btn" onclick="window.toggleFold(\'fold-heat\')">展开完整视图 <span>▾</span></button>'+
          '</div></div>'+
        '<div class="gd-sec"><div class="gd-sec-title">引用来源 Top<span class="gd-sec-more" onclick="location.href=\'report.html?tab=1&focus=cites\'">报告 ›</span></div>'+
          '<div class="gd-fold" id="fold-cites">'+
            '<div class="gd-fold-prev" id="prev-cites"></div>'+
            '<div class="gd-fold-body"><div class="gd-sov" id="cite-box" style="padding-top:4px;"></div></div>'+
            '<button class="gd-fold-btn" onclick="window.toggleFold(\'fold-cites\')">展开完整视图 <span>▾</span></button>'+
          '</div></div>'+
        '<div class="gd-sec"><div class="gd-sec-title">知识库健康度<span class="gd-sec-more" onclick="location.href=\'knowledge.html?section=health\'">查看 ›</span></div>'+
          '<div class="gd-fold" id="fold-kb">'+
            '<div class="gd-fold-prev" id="prev-kb"></div>'+
            '<div class="gd-fold-body"><div class="gd-sov" id="kb-box"></div></div>'+
            '<button class="gd-fold-btn" onclick="window.toggleFold(\'fold-kb\')">展开完整视图 <span>▾</span></button>'+
          '</div></div>'+
      '</div>';

    /* 环形动画 */
    var ring = document.getElementById('geo-ring');
    if(ring) requestAnimationFrame(function(){ ring.style.strokeDashoffset = ringCirc*(1-b.geoScore/100); });

    /* SOV */
    var sovAll = [{name:b.short,v:b.sov,me:true}].concat(D.COMPETITORS.map(function(c){return {name:c.name,v:c.sov,me:false};}));
    sovAll.sort(function(x,y){return y.v-x.v;});
    var maxSov = Math.max.apply(null, sovAll.map(function(x){return x.v;})) || 1;
    document.getElementById('sov-box').innerHTML = sovAll.map(function(s){
      return '<div class="gd-sov-row"><span class="gd-sov-name">'+s.name+'</span>'+
        '<div class="gd-sov-track"><i class="'+(s.me?'me':'co')+'" style="width:'+(s.v/maxSov*100)+'%"></i></div>'+
        '<span class="gd-sov-val">'+(s.v*100).toFixed(0)+'%</span></div>';
    }).join('');

    /* 预警 */
    var sevMap = {high:'紧急',mid:'关注',low:'提示'};
    document.getElementById('alert-box').innerHTML = alerts.slice(0,3).map(function(a){
      var ico = a.severity==='high' ? '<path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="10"/>'
        : a.severity==='mid' ? '<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>'
        : '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>';
      var ENG_NAME2ID = {'豆包':'doubao','DeepSeek':'deepseek','Kimi':'kimi','文心一言':'wenxin','通义千问':'tongyi','ChatGPT':'chatgpt','Perplexity':'perplexity'};
      var href = a.action==='content' ? 'audit.html?focus=negative'
        : a.action==='audit' ? 'audit.html?focus=rank'
        : a.action==='knowledge' ? 'knowledge.html?section=dims'
        : 'monitor.html?engine='+(ENG_NAME2ID[a.engine]||'doubao')+'&kw='+encodeURIComponent(a.keyword||'行业服务');
      return '<div class="gd-alert" onclick="location.href=\''+href+'\'">'+
        '<div class="gd-alert-ico '+a.severity+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ico+'</svg></div>'+
        '<div class="gd-alert-body"><div class="gd-alert-head">'+a.type+' <span class="gd-alert-tag '+a.severity+'">'+sevMap[a.severity]+'</span></div>'+
        '<div class="gd-alert-text">'+a.text.replace('{brand}',b.short).replace('{kw}',a.keyword)+'</div>'+
        '<div class="gd-alert-meta">'+a.engine+' · '+a.keyword+' · '+a.time+'</div></div></div>';
    }).join('');

    /* 行业视角：意图热度 */
    var maxHeat = Math.max.apply(null, b.keywords.map(function(k){return k.heat;})) || 1;
    document.getElementById('heat-box').innerHTML = b.keywords.map(function(k){
      return '<div class="gd-sov-row"><span class="gd-sov-name">'+k.term+'</span>'+
        '<div class="gd-sov-track"><i class="co" style="width:'+(k.heat/maxHeat*100)+'%"></i></div>'+
        '<span class="gd-sov-val">'+k.heat+'</span></div>';
    }).join('');

    /* 引用来源 */
    document.getElementById('cite-box').innerHTML = cites.map(function(c,i){
      return '<div class="gd-cite"><span class="gd-cite-rank">'+(i+1)+'</span><span class="gd-cite-name">'+c.name+'</span><span class="gd-cite-count">被引用 '+c.n+' 次</span></div>';
    }).join('');

    /* 知识库健康度 */
    var kbDims = [{name:'实体清晰度',v:88},{name:'事实覆盖',v:74},{name:'信源权威',v:85},{name:'一致性',v:78},{name:'新鲜度',v:70}];
    document.getElementById('kb-box').innerHTML = kbDims.map(function(d){
      return '<div class="gd-sov-row"><span class="gd-sov-name">'+d.name+'</span>'+
        '<div class="gd-sov-track"><i class="co" style="width:'+d.v+'%"></i></div>'+
        '<span class="gd-sov-val">'+d.v+'</span></div>';
    }).join('');

    /* 首屏渐进披露：各区块预览行（P1-1） */
    function spark(arr){
      var w=76,h=22,min=Math.min.apply(null,arr),max=Math.max.apply(null,arr);
      var r=(max-min)||1;
      var pts=arr.map(function(v,i){return (i/(arr.length-1)*w).toFixed(1)+','+(h-((v-min)/r*(h-4)+2)).toFixed(1);}).join(' ');
      return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline fill="none" stroke="var(--primary-dim)" stroke-width="1.5" points="'+pts+'"/></svg>';
    }
    /* 引擎矩阵预览：7 引擎平均趋势 + 领先引擎 */
    (function(){
      var box = document.getElementById('prev-eng');
      if (!box || !b) return;
      var avg = D.ENGINES[0].trend.map(function(_,i){
        return Math.round(D.ENGINES.reduce(function(s,e){return s+e.trend[i];},0)/D.ENGINES.length);
      });
      var best = b.engines.slice().sort(function(x,y){return y.rate-x.rate;})[0];
      var bestName = D.ENGINES.filter(function(x){return x.id===best.engineId;})[0].name;
      box.innerHTML = '<div class="gd-fold-prev-row"><span>7 引擎平均<b> '+avg[avg.length-1]+'%</b></span><span class="spark">'+spark(avg)+'</span><span class="gd-fold-prev-meta">'+bestName+' 领先 · '+best.rate+'%</span></div>';
    })();
    /* SOV 预览 */
    (function(){
      var box = document.getElementById('prev-sov');
      if (!box || !b) return;
      var me = sovAll[0];
      var gap = Math.round((me.v - sovAll[1].v) * 100);
      box.innerHTML = '<div class="gd-fold-prev-row"><span>你<b> '+(me.v*100).toFixed(0)+'%</b>，'+(gap>=0?'领先':'落后')+'第 2 名 '+Math.abs(gap)+' 个百分点</span><span class="gd-fold-prev-meta">'+sovAll.length+' 个对象对比</span></div>';
    })();
    /* 预警预览：只露最严重 1 条（P1-3） */
    (function(){
      var box = document.getElementById('prev-alert');
      if (!box || !b) return;
      var order = {high:0, mid:1, low:2};
      var top = alerts.slice().sort(function(x,y){return (order[x.severity]||3)-(order[y.severity]||3);})[0];
      if (top) box.innerHTML = '<div class="gd-fold-prev-row"><span class="gd-alert-tag '+top.severity+'">'+(sevMap[top.severity])+'</span><b>'+top.type+'</b><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+top.text.replace('{brand}',b.short).replace('{kw}',top.keyword)+'</span></div>';
    })();
    /* 意图热度预览 */
    (function(){
      var box = document.getElementById('prev-heat');
      if (!box || !b || !b.keywords.length) return;
      var top = b.keywords.slice().sort(function(x,y){return y.heat-x.heat;})[0];
      box.innerHTML = '<div class="gd-fold-prev-row"><span>最热词<b>「'+top.term+'」</b> · 热度 '+top.heat+'</span><span class="gd-fold-prev-meta">'+b.keywords.length+' 词追踪中</span></div>';
    })();
    /* 引用来源预览 */
    (function(){
      var box = document.getElementById('prev-cites');
      if (!box || !cites.length) return;
      box.innerHTML = '<div class="gd-fold-prev-row"><span>Top1 来源<b> '+cites[0].name+'</b> · '+cites[0].n+' 次</span><span class="gd-fold-prev-meta">共 '+cites.length+' 个来源</span></div>';
    })();
    /* 知识库预览 */
    (function(){
      var box = document.getElementById('prev-kb');
      if (!box || !b) return;
      var top = kbDims.slice().sort(function(x,y){return y.v-x.v;})[0];
      box.innerHTML = '<div class="gd-fold-prev-row"><span>健康度<b> '+b.kbHealth+'</b>/100 · 最优维度「'+top.name+'」'+top.v+'</span><span class="gd-fold-prev-meta">较上周 ↑'+Math.abs(b.kbHealthDelta)+'</span></div>';
    })();

    /* Tab */
    document.querySelectorAll('.gd-tab').forEach(function(tab){
      tab.onclick = null;
      tab.addEventListener('click', function(){
        document.querySelectorAll('.gd-tab').forEach(function(t){t.classList.remove('active');});
        this.classList.add('active');
        var v = this.dataset.view;
        document.getElementById('view-brand').style.display = v==='brand' ? '' : 'none';
        document.getElementById('view-industry').style.display = v==='industry' ? '' : 'none';
      });
    });
  }

  /* 折叠展开（P1-1） */
  window.toggleFold = function(id){
    var f = document.getElementById(id);
    if (f) f.classList.toggle('open');
  };

  /* 新手任务卡点击：标记完成并跳转（P2-3） */
  window.geoStep = function(id, href){
    var st = {};
    try { st = JSON.parse(localStorage.getItem(ON_KEY) || '{}'); } catch (e) {}
    st[id] = 1;
    try { localStorage.setItem(ON_KEY, JSON.stringify(st)); } catch (e) {}
    location.href = href;
  };

  render();
})();
</script>
<script>GEO_NAV.mount('index');</script>
</body>
</html>
