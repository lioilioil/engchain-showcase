<style>
body { background: var(--bg); }
.br-wrap { padding: 0 0 40px; }

/* Hero */
.br-hero{margin:10px 0 0;padding:15px 15px 13px;border-radius:var(--r-xl);position:relative;overflow:hidden;background:radial-gradient(440px 200px at 90% -20%, rgba(176, 138, 60, .16), transparent 62%),radial-gradient(320px 160px at -8% 118%, rgba(176, 138, 60, .07), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.65);}
.br-hero::before{content:'';position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(176, 138, 60, .15) 0%,transparent 70%);}
.br-hero-title{font-size:14.5px;font-weight:800;color:var(--text-1);position:relative;z-index:1;}
.br-hero-sub{font-size:10.5px;color:var(--text-3);margin-top:4px;line-height:1.6;position:relative;z-index:1;}
.br-hero-steps{display:flex;gap:6px;margin-top:12px;position:relative;z-index:1;}
.br-hero-step{flex:1;text-align:center;font-size:9px;font-weight:600;color:var(--text-3);padding:5px 2px;border-radius:var(--r-s);background:var(--bg-card-2);border:1px solid var(--line-hairline);}

/* 区块 */
.br-sec{margin-top:18px;}
.br-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.br-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.br-sec-more{font-size:11px;font-weight:600;color:var(--text-3);cursor:pointer;}

/* 品牌卡 */
.br-card{display:flex;align-items:center;gap:11px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:13px;margin-bottom:10px;cursor:pointer;transition:transform var(--d-fast) var(--e-standard),box-shadow var(--d-fast),border-color var(--d-fast);box-shadow:var(--shadow-xs);position:relative;}
.br-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow-card);transform:translateY(-1px);} .br-card:active{transform:scale(.985);}
.br-card.active{border-color:var(--accent-line);box-shadow:var(--shadow-card),0 0 0 1px var(--accent-line) inset;}
.br-del{position:absolute;top:9px;right:9px;width:22px;height:22px;border:none;border-radius:50%;background:var(--bg-card-2);color:var(--text-3);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--d-fast) var(--e-standard);z-index:2;}
.br-del:hover{background:var(--error-soft);color:var(--error);}
.br-logo{flex:none;width:42px;height:42px;border-radius:var(--r-m);background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(176, 138, 60, .35),inset 0 1px 0 rgba(255,255,255,.25);}
.br-info{flex:1;min-width:0;}
.br-name{font-size:13.5px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
.br-meta{font-size:10px;color:var(--text-3);margin-top:3px;}
.br-score{text-align:center;flex:none;}
.br-score-num{font-family:var(--font-num);font-size:19px;font-weight:800;color:var(--primary-dim);}
.br-score-label{font-size:8.5px;color:var(--text-3);margin-top:1px;}
.br-current{display:inline-block;vertical-align:1px;margin-left:6px;font-size:8.5px;font-weight:800;color:var(--text-inv);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);padding:2px 8px;border-radius:var(--r-full);box-shadow:0 2px 6px rgba(176, 138, 60, .4),inset 0 1px 0 rgba(255,255,255,.3);}

/* 空态 */
.br-empty{text-align:center;padding:36px 20px;background:var(--bg-card);border:1px dashed var(--line-strong);border-radius:var(--r-l);}
.br-empty-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:var(--r-xl);background:var(--primary-soft);color:var(--primary-dim);display:flex;align-items:center;justify-content:center;}
.br-empty-ico svg{width:26px;height:26px;}
.br-empty-title{font-size:13.5px;font-weight:700;color:var(--text-1);}
.br-empty-desc{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.6;}

/* 添加 CTA */
.br-cta{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent);}
.br-cta button{width:100%;max-width:420px;height:44px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(176, 138, 60, .3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(176, 138, 60, .4);transition:transform var(--d-fast);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt-txt{display:inline-flex;align-items:center;gap:2px;min-width:0;white-space:nowrap;}
.br-cta button:active{transform:scale(.985);}

/* ---- 向导 sheet 内样式 ---- */
.wz-step{display:none;}
.wz-step.show{display:block;}
.wz-progress{display:flex;gap:5px;margin-bottom:14px;}
.wz-pseg{flex:1;height:4px;border-radius:2px;background:var(--bg-card-2);overflow:hidden;}
.wz-pseg i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .3s;}
.wz-pseg.on i{width:100%;}
.wz-label{font-size:12px;font-weight:700;color:var(--text-1);margin:14px 0 6px;}
.wz-label:first-of-type{margin-top:2px;}
.wz-required{color:var(--error);}
.wz-input{width:100%;height:42px;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--bg-card);color:var(--text-1);font-size:13px;padding:0 13px;outline:none;box-sizing:border-box;transition:border .2s;}
.wz-input:focus{border-color:var(--primary);}
.wz-textarea{height:74px;padding:10px 13px;resize:none;line-height:1.5;}
.wz-tip{font-size:10px;color:var(--text-3);margin-top:5px;line-height:1.5;}
.wz-chips{display:flex;flex-wrap:wrap;gap:8px;}
.wz-chip{font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:var(--r-full);background:var(--bg-card);border:1px solid var(--line-strong);color:var(--text-2);cursor:pointer;transition:all .15s;}
.wz-chip.on{background:var(--primary-soft);border-color:var(--accent-line);color:var(--primary-dim);}
.wz-chip .heat{font-size:9px;opacity:.7;margin-left:3px;}
.wz-custom{display:flex;gap:8px;margin-top:10px;}
.wz-custom input{flex:1;}
.wz-addbtn{flex:none;height:40px;padding:0 16px;border:none;border-radius:var(--r-m);background:var(--primary-soft);color:var(--primary-dim);font-size:13px;font-weight:700;cursor:pointer;}
.wz-summary{background:var(--bg-card-2);border-radius:var(--r-m);padding:12px;font-size:12px;line-height:1.9;color:var(--text-1);}
.wz-summary b{color:var(--primary-dim);}
.wz-nav{display:flex;gap:9px;margin-top:18px;}
.wz-nav button{height:44px;border-radius:var(--r-m);font-size:13.5px;font-weight:700;cursor:pointer;}
.wz-prev{flex:1;background:var(--bg-card);color:var(--text-1);border:1px solid var(--line-strong);}
.wz-next{flex:2;border:none;background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);box-shadow:0 3px 10px -3px rgba(176, 138, 60, .5),inset 0 1px 0 rgba(255,255,255,.3);transition:transform var(--d-fast);}
.wz-err{font-size:10.5px;color:var(--error);margin-top:6px;display:none;}

/* 检测动画 */
.br-gen-mask{position:fixed;inset:0;z-index:210;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:28px;}
.br-gen-mask.show{display:flex;}
.br-gen-card{width:100%;max-width:340px;background:var(--bg-card);border-radius:var(--r-xl);padding:22px 20px;box-shadow:var(--shadow-xl);border:1px solid var(--line);}
.br-gen-title{font-size:14px;font-weight:800;color:var(--text-1);text-align:center;}
.br-gen-sub{font-size:10.5px;color:var(--text-3);text-align:center;margin-top:4px;}
.br-gen-progress{margin-top:16px;height:5px;border-radius:3px;background:var(--bg-card-2);overflow:hidden;}
.br-gen-progress i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .4s;}
.br-gen-steps{margin-top:14px;}
.br-gen-step{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:11.5px;color:var(--text-3);}
.br-gen-step .ic{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);font-size:9px;display:flex;align-items:center;justify-content:center;transition:all .3s;}
.br-gen-step.done{color:var(--text-1);}
.br-gen-step.done .ic{border-color:var(--success);background:var(--success);color:#fff;}
</style>
</head>

<script src="../../js/common.js"></script>

<script>
(function(){
  var D = window.GEO_DATA;

  function render(){
    var list = D.getBrands();
    var cur = D.currentBrand();
    document.getElementById('br-count').textContent = list.length + ' 个';
    document.getElementById('br-empty-sec').style.display = list.length ? 'none' : '';
    document.getElementById('br-list').innerHTML = list.map(function(b){
      return '<div class="br-card'+(cur && cur.id===b.id?' active':'')+'" data-id="'+b.id+'">'+
        '<div class="br-logo">'+b.short.charAt(0)+'</div>'+
        '<div class="br-info">'+
          '<div class="br-name">'+b.name+(cur && cur.id===b.id ? '<span class="br-current">检测中</span>' : '')+'</div>'+
          '<div class="br-meta">'+b.industry+' · 关键词 '+b.keywords.length+' 词 · 创建 '+b.createdAt+'</div>'+
        '</div>'+
        '<div class="br-score"><div class="br-score-num">'+b.geoScore+'</div><div class="br-score-label">GEO 分</div></div>'+
        (b.id!=='b1' ? '<button class="br-del" data-del="'+b.id+'" title="删除品牌">×</button>' : '')+
      '</div>';
    }).join('');
  }

  document.getElementById('br-list').addEventListener('click', function(e){
    var del = e.target.closest('.br-del');
    if(del){
      e.stopPropagation();
      var bid = del.dataset.del;
      var b = D.getBrands().filter(function(x){ return x.id===bid; })[0];
      if(!b) return;
      UI.dialog({
        title: '删除品牌',
        text: '确定删除「' + b.short + '」吗？删除后将清空该品牌的检测数据，且不可恢复。',
        ok: '删除',
        cancel: '取消',
        onOk: function(){
          var r = D.deleteBrand(bid);
          if(r && r.ok){
            render();
            UI.toast('已删除「' + b.short + '」','ok');
          } else {
            UI.toast('示例品牌不可删除','warn');
          }
        }
      });
      return;
    }
    var card = e.target.closest('.br-card');
    if(!card) return;
    D.switchBrand(card.dataset.id);
    render();
    UI.toast('已切换至「' + D.currentBrand().short + '」','ok');
    setTimeout(function(){ location.href = 'index.html'; }, 600);
  });

  /* ================= 4 步添加向导 ================= */
  var W = {
    name:'', aliases:'', website:'', industry:'建筑咨询', desc:'', adv:'', kws:[],
    step: 1, maxStep: 4, sheet: null
  };

  function industries(){ return ['建筑咨询','建筑施工','人才服务','交易平台','其他']; }
  function recommended(industry){
    return D.KEYWORD_BANK.filter(function(k){
      return k.industry.indexOf(industry) >= 0;
    }).map(function(k){ return k.term; });
  }
  function typeOf(term){
    var k = D.KEYWORD_BANK.filter(function(x){ return x.term === term; })[0];
    return k ? k.type : 'default';
  }
  function heatOf(term){
    var k = D.KEYWORD_BANK.filter(function(x){ return x.term === term; })[0];
    return k ? k.heat : 60;
  }

  window.openWizard = function(){
    var sh = UI.sheet();
    sh.setClosable(false);
    sh.setText('添加品牌 · 提交基础信息');
    sh.html(
      '<div class="wz-wrap" style="padding:2px 2px 6px;">'+
        '<div class="wz-progress" id="wz-prog">'+[1,2,3,4].map(function(i){return '<div class="wz-pseg"><i></i></div>';}).join('')+'</div>'+
        '<div id="wz-body"></div>'+
        '<div class="wz-nav">'+
          '<button class="wz-prev" id="wz-prev" onclick="wzPrev()">上一步</button>'+
          '<button class="wz-next" id="wz-next" onclick="wzNext()">下一步</button>'+
        '</div>'+
      '</div>'
    );
    sh.show();
    W.sheet = sh;
    W.step = 1;
    W.kws = [];
    renderStep();
  };

  window.wzPrev = function(){ if(W.step>1){ W.step--; renderStep(); } };
  window.wzNext = function(){
    if(!validateStep()) return;
    if(W.step < W.maxStep){ W.step++; renderStep(); }
    else { submitBrand(); }
  };

  function validateStep(){
    if(W.step === 1){
      var n = document.getElementById('w-in-name').value.trim();
      var w = document.getElementById('w-in-web').value.trim();
      if(!n){ showErr('wz-err-1','请填写公司/品牌名称'); return false; }
      if(!w){ showErr('wz-err-1','请填写官网地址'); return false; }
      W.name = n;
      W.aliases = document.getElementById('w-in-aliases').value.trim();
      W.website = w;
      W.industry = document.querySelector('.wz-chip.ind.on') ? document.querySelector('.wz-chip.ind.on').dataset.v : W.industry;
      W.kws = [];
      return true;
    }
    if(W.step === 2){
      var d = document.getElementById('w-in-desc').value.trim();
      if(!d){ showErr('wz-err-2','请用一句话描述主营业务'); return false; }
      W.desc = d;
      W.adv = document.getElementById('w-in-adv').value.trim();
      return true;
    }
    if(W.step === 3){
      if(!W.kws.length){ showErr('wz-err-3','请至少选择 1 个检测关键词'); return false; }
      return true;
    }
    return true;
  }
  function showErr(id, msg){
    var el = document.getElementById(id);
    el.style.display = 'block';
    el.textContent = msg;
  }
  function hideErrs(){
    document.querySelectorAll('.wz-err').forEach(function(el){ el.style.display = 'none'; });
  }

  function renderStep(){
    hideErrs();
    /* 进度 */
    document.querySelectorAll('#wz-prog .wz-pseg').forEach(function(seg, i){
      seg.classList.toggle('on', i < W.step);
    });
    /* 按钮 */
    document.getElementById('wz-prev').style.visibility = W.step>1 ? 'visible' : 'hidden';
    document.getElementById('wz-next').textContent = W.step===W.maxStep ? '开始检测' : '下一步';

    var body = document.getElementById('wz-body');
    if(W.step === 1){
      body.innerHTML =
        '<div class="wz-step show">'+
          '<div class="wz-label">品牌基础信息 <span class="wz-required">*</span></div>'+
          '<input class="wz-input" id="w-in-name" placeholder="公司 / 品牌全称" value="'+W.name+'">'+
          '<div class="wz-tip">用于 AI 引擎检索与知识库实体构建</div>'+
          '<div class="wz-label">品牌别名</div>'+
          '<input class="wz-input" id="w-in-aliases" placeholder="简称 / 英文名，逗号分隔（如：恒筑，HENGZHU）" value="'+W.aliases+'">'+
          '<div class="wz-tip">别名用于监控品牌提及变体</div>'+
          '<div class="wz-label">官网地址 <span class="wz-required">*</span></div>'+
          '<input class="wz-input" id="w-in-web" placeholder="www.example.com" value="'+W.website+'">'+
          '<div class="wz-tip">官网是 AI 引用来源的主信源</div>'+
          '<div class="wz-label">所属行业 <span class="wz-required">*</span></div>'+
          '<div class="wz-chips">'+industries().map(function(i){
            return '<span class="wz-chip ind'+(W.industry===i?' on':'')+'" data-v="'+i+'">'+i+'</span>';
          }).join('')+'</div>'+
          '<div class="wz-tip">行业决定检测关键词推荐</div>'+
          '<div class="wz-err" id="wz-err-1"></div>'+
        '</div>';
      /* 行业 chip 事件 */
      body.querySelectorAll('.wz-chip.ind').forEach(function(ch){
        ch.addEventListener('click', function(){
          body.querySelectorAll('.wz-chip.ind').forEach(function(x){x.classList.remove('on');});
          this.classList.add('on');
          W.industry = this.dataset.v;
        });
      });
      /* 智能预填（P2-4）：官网失焦自动补 www. 前缀 */
      var webIn = document.getElementById('w-in-web');
      if (webIn) webIn.addEventListener('blur', function(){
        var v = webIn.value.trim();
        if (v && v.indexOf('://') < 0 && v.indexOf('www.') !== 0) webIn.value = 'www.' + v;
      });
    }
    else if(W.step === 2){
      body.innerHTML =
        '<div class="wz-step show">'+
          '<div class="wz-label">一句话业务描述 <span class="wz-required">*</span></div>'+
          '<textarea class="wz-input wz-textarea" id="w-in-desc" placeholder="例：主营建筑资质代办、工程咨询与劳务分包撮合服务">'+W.desc+'</textarea>'+
          '<div class="wz-tip">AI 引擎将以此描述理解品牌业务，自动生成品牌介绍事实</div>'+
          '<div class="wz-label">核心优势（选填）</div>'+
          '<textarea class="wz-input wz-textarea" id="w-in-adv" placeholder="例：本地化服务团队；资质办理全流程；平台级交易保障（分号分隔）">'+W.adv+'</textarea>'+
          '<div class="wz-tip">优势将进入品牌知识库，成为 AI 回答中的差异化信息</div>'+
          '<div class="wz-err" id="wz-err-2"></div>'+
        '</div>';
    }
    else if(W.step === 3){
      var rec = recommended(W.industry);
      /* 智能预填（P2-4）：首次进入自动预选本行业热度 Top1 词 */
      if (!W.kws.length) {
        var topRec = D.KEYWORD_BANK.filter(function(k){ return k.industry.indexOf(W.industry) >= 0; })
          .slice().sort(function(a,b){ return b.heat - a.heat; })[0];
        if (topRec) W.kws.push(topRec.term);
      }
      body.innerHTML =
        '<div class="wz-step show">'+
          '<div class="wz-label">检测关键词 <span class="wz-required">*</span>（已选 <span id="w-kw-count">'+W.kws.length+'</span>/5）</div>'+
          '<div class="wz-tip">按「'+W.industry+'」行业推荐，点击选择，免费版上限 5 词</div>'+
          '<div class="wz-chips" id="wz-rec">'+rec.map(function(t){
            return '<span class="wz-chip'+(W.kws.indexOf(t)>=0?' on':'')+'" data-t="'+t+'">'+t+'<span class="heat">热 '+heatOf(t)+'</span></span>';
          }).join('')+'</div>'+
          '<div class="wz-label" style="margin-top:12px;">自定义添加</div>'+
          '<div class="wz-custom">'+
            '<input class="wz-input" id="w-in-custom" placeholder="输入自定义关键词">'+
            '<button class="wz-addbtn" onclick="wzAddCustom()">添加</button>'+
          '</div>'+
          '<div class="wz-err" id="wz-err-3"></div>'+
        '</div>';
      body.querySelectorAll('#wz-rec .wz-chip').forEach(function(ch){
        ch.addEventListener('click', function(){
          var t = this.dataset.t;
          toggleKw(t);
          renderStep();
        });
      });
    }
    else if(W.step === 4){
      var advs = (W.adv || '').split(/[；;]/).map(function(s){return s.trim();}).filter(Boolean);
      body.innerHTML =
        '<div class="wz-step show">'+
          '<div class="wz-label">确认品牌资料</div>'+
          '<div class="wz-summary">'+
            '品牌：<b>'+W.name+'</b><br>'+
            '别名：<b>'+(W.aliases||'—')+'</b><br>'+
            '官网：<b>'+W.website+'</b><br>'+
            '行业：<b>'+W.industry+'</b><br>'+
            '业务：<b>'+W.desc+'</b><br>'+
            '优势：<b>'+(advs.length?advs.join('；'):'—')+'</b><br>'+
            '关键词：<b>'+W.kws.join('、')+'</b>'+
          '</div>'+
          '<div class="wz-tip" style="margin-top:10px;">确认后系统将：解析品牌资料 → 构建知识库 → 在 7 大 AI 引擎开始检测。演示环境不产生真实检测。</div>'+
          '<div class="wz-err" id="wz-err-4"></div>'+
        '</div>';
    }
  }

  function toggleKw(t){
    var i = W.kws.indexOf(t);
    if(i>=0){ W.kws.splice(i,1); }
    else if(W.kws.length>=5){ UI.toast('免费版上限 5 个关键词，升级企业定制可解锁更多','warn'); }
    else { W.kws.push(t); }
  }
  window.wzAddCustom = function(){
    var input = document.getElementById('w-in-custom');
    var t = (input.value||'').trim();
    if(!t) return;
    if(W.kws.indexOf(t)>=0){ UI.toast('该关键词已选择','warn'); return; }
    if(W.kws.length>=5){ UI.toast('免费版上限 5 个关键词','warn'); return; }
    W.kws.push(t);
    input.value = '';
    renderStep();
  };

  function submitBrand(){
    var advs = (W.adv || '').split(/[；;]/).map(function(s){return s.trim();}).filter(Boolean);
    var keywords = W.kws;
    /* 关闭向导 → 首次检测动画 */
    if(W.sheet && W.sheet.close) W.sheet.close();
    startGen(keywords, advs);
  }

  function startGen(keywords, advs){
    var mask = document.getElementById('gen-mask');
    var sub = document.getElementById('gen-sub');
    var bar = document.getElementById('gen-bar');
    var steps = document.getElementById('gen-steps');
    var list = ['解析品牌资料','构建知识库','检测 7 大 AI 引擎','生成驾驶舱'];
    mask.classList.add('show');
    steps.innerHTML = list.map(function(s,i){
      return '<div class="br-gen-step" id="gs-'+i+'"><span class="ic">✓</span>'+s+'</div>';
    }).join('');
    var i = 0;
    var timer = setInterval(function(){
      if(i>0){ document.getElementById('gs-'+(i-1)).classList.add('done'); }
      sub.textContent = list[i] || '完成';
      bar.style.width = ((i+1)/list.length*100)+'%';
      if(i>=list.length){
        clearInterval(timer);
        var info = {
          name: W.name, short: W.name.replace(/（.*?）|\(.*?\)|有限公司|有限责任公司/g,''),
          aliases: W.aliases, website: W.website, industry: W.industry,
          desc: W.desc, advantages: advs, keywords: keywords
        };
        var brand = D.addBrand(info);
        setTimeout(function(){
          mask.classList.remove('show');
          UI.toast('「' + brand.short + '」检测已开始','ok');
          setTimeout(function(){ location.href = 'index.html'; }, 500);
        }, 400);
        return;
      }
      i++;
    }, 600);
  }

  render();
})();
</script>
<script>GEO_NAV.mount('mine');</script>
</body>
</html>
