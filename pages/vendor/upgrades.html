<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>运营包 · 按身份匹配的经营方案 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* ============================================================
     运营包 v4 — 身份感知的四柱经营方案
     视觉：延续 V3.4「墨金」体系；页内仅新增布局与状态样式，
     所有颜色 / 圆角 / 阴影 / 动效均走全局令牌。
     ============================================================ */
  .ug-scroll{padding-top:10px;padding-bottom:36px;}

  /* ---- 页头：编辑感，非居中 ---- */
  .ops-intro{padding:6px 2px 18px;animation:ops-in .45s var(--e-out) both;}
  .ops-intro-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .ops-kicker{font-family:var(--font-num);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--primary-ink);}
  .ops-intro-id{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text-2);background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-full);padding:4px 10px;box-shadow:var(--shadow-xs);}
  .ops-intro-id .ic{width:13px;height:13px;color:var(--primary-ink);}
  .ops-intro h1{font-family:var(--font-display);font-size:clamp(26px,7.2vw,34px);line-height:1.08;letter-spacing:-.035em;font-weight:800;color:var(--text-1);}
  .ops-intro h1 em{font-style:normal;color:var(--primary-ink);}
  .ops-intro p{margin-top:10px;font-size:12px;line-height:1.6;color:var(--text-2);max-width:30ch;}
  .ops-intro p b{color:var(--text-1);font-weight:600;}

  /* ---- 主视觉深色卡：两种主题下都保持深墨金，与钱包黑卡同一语言 ---- */
  .ops-hero{position:relative;overflow:hidden;border-radius:var(--r-2xl);padding:18px 18px 16px;
    background:
      radial-gradient(130% 130% at 88% -16%, rgba(227,200,142,.24) 0%, transparent 52%),
      linear-gradient(148deg,#2A313A 0%,#171C24 46%,#0B0E13 100%);
    box-shadow:0 2px 4px rgba(10,10,10,.10),0 18px 44px -12px rgba(10,10,10,.48),inset 0 1px 0 rgba(255,255,255,.10);
    color:#F2F0EC;animation:ops-in .55s var(--e-out) both;}
  .ops-hero::after{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(244,231,200,.6),transparent);pointer-events:none;}
  .ops-hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 6% 116%,rgba(200,169,97,.16) 0%,transparent 60%);}
  .ops-hero-sheen{position:absolute;inset:-40%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(72deg,transparent 44%,rgba(255,244,220,.09) 50%,transparent 56%);animation:ops-sheen 8s cubic-bezier(.4,0,.2,1) infinite;}
  .ops-hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ops-idchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#F0E6CC;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-full);padding:4px 9px;}
  .ops-idchip .ic{width:12px;height:12px;color:#E3C88E;}
  .ops-hero-badge{font-size:10px;font-weight:800;letter-spacing:.05em;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#B08A3C);border-radius:var(--r-s);padding:3px 8px;border:1px solid rgba(255,255,255,.35);}
  .ops-hero-badge.ghost{color:#F0E6CC;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);}
  .ops-hero-title{position:relative;font-family:var(--font-display);font-size:27px;line-height:1.12;letter-spacing:-.03em;font-weight:800;margin-top:14px;color:#FFF8EA;}
  .ops-hero-title.sm{font-size:22px;}
  .ops-hero-sub{position:relative;font-size:11.5px;line-height:1.65;color:rgba(244,242,238,.67);margin-top:8px;max-width:31ch;}
  .ops-hero-plan{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;}
  .ops-hero-plan .ops-kicker{color:rgba(244,242,238,.5);}
  .ops-plan-title{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em;color:#F6E7C4;line-height:1.1;margin-top:3px;}
  .ops-plan-meta{font-size:11px;color:rgba(244,242,238,.62);margin-top:4px;}
  .ops-ring{--p:0;position:relative;width:64px;height:64px;flex:none;border-radius:50%;
    background:conic-gradient(#E3C88E calc(var(--p) * 1%), rgba(255,255,255,.13) 0);
    display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;}
  .ops-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#141820;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
  .ops-ring span{position:relative;text-align:center;line-height:1;}
  .ops-ring b{display:block;font-family:var(--font-num);font-size:20px;font-weight:800;color:#F6E7C4;}
  .ops-ring small{display:block;font-size:8.5px;color:rgba(244,242,238,.55);margin-top:3px;letter-spacing:.08em;}
  .ops-hero-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border:1px solid rgba(255,255,255,.10);border-radius:var(--r-m);overflow:hidden;background:rgba(255,255,255,.035);}
  .ops-hstat{padding:10px 10px 9px;border-right:1px solid rgba(255,255,255,.09);min-width:0;}
  .ops-hstat:last-child{border-right:none;}
  .ops-hstat b{display:block;font-family:var(--font-num);font-size:17px;font-weight:800;color:#F2F0EC;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .ops-hstat b small{font-size:9px;font-weight:500;color:rgba(244,242,238,.5);margin-left:2px;}
  .ops-hstat span{display:block;font-size:9.5px;color:rgba(244,242,238,.5);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-hero-foot{position:relative;display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.10);flex-wrap:wrap;}
  .ops-hero-foot .ops-auto{display:flex;align-items:center;gap:7px;margin-right:auto;font-size:10.5px;color:rgba(244,242,238,.6);}
  .ops-hero .switch{width:38px;height:23px;}
  .ops-hero .switch .track{background:rgba(255,255,255,.16);box-shadow:none;}
  .ops-hero .switch .thumb{width:17px;height:17px;top:3px;left:3px;background:#F4F2EE;}
  .ops-hero .switch input:checked + .track{background:#B08A3C;}
  .ops-hero .switch input:checked ~ .thumb{transform:translateX(15px);}
  .ops-hbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-full);font-size:11.5px;font-weight:700;color:#2A1810;background:linear-gradient(135deg,#F0E2BE,#C9A45C);border:1px solid rgba(255,255,255,.28);cursor:pointer;transition:transform var(--d-fast),filter var(--d-fast);}
  .ops-hbtn .ic{width:13px;height:13px;flex:none;}
  .ops-hbtn:active{transform:scale(.96);}
  .ops-hbtn.ghost{background:rgba(255,255,255,.07);color:#F2F0EC;border-color:rgba(255,255,255,.18);}
  .ops-hero-note{position:relative;margin-top:12px;font-size:10.5px;line-height:1.55;color:rgba(244,242,238,.55);display:flex;align-items:flex-start;gap:6px;}
  .ops-hero-note .ic{width:12px;height:12px;flex:none;margin-top:1px;color:#D2B169;}
  .ops-hero-note.paused{margin-top:10px;padding:7px 9px;border-radius:var(--r-s);color:#F3D9A8;background:rgba(180,110,30,.18);border:1px solid rgba(214,158,74,.32);}
  .ops-hero-note.paused .ic{color:#E8BE72;}
  .ops-hero-actions{position:relative;display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}

  /* ---- 需求诊断条 ---- */
  .ops-needs{margin-top:16px;}
  .ops-needs-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
  .ops-needs-head b{font-size:12px;font-weight:700;color:var(--text-1);}
  .ops-needs-head span{font-size:10px;color:var(--text-3);}
  .ops-needs-row{display:flex;gap:9px;overflow-x:auto;margin:0 calc(var(--page-pad) * -1);padding:0 var(--page-pad) 3px;scrollbar-width:none;}
  .ops-needs-row::-webkit-scrollbar{display:none;}
  .ops-need{flex:0 0 186px;text-align:left;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:12px;box-shadow:var(--shadow-card);cursor:pointer;transition:transform var(--d-fast),border-color var(--d-fast);}
  .ops-need:active{transform:scale(.98);}
  .ops-need:hover{border-color:var(--line-strong);}
  .ops-need-ic{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;margin-bottom:9px;}
  .ops-need-ic .ic{width:15px;height:15px;}
  .ops-need b{display:block;font-size:12px;font-weight:700;color:var(--text-1);line-height:1.35;}
  .ops-need p{font-size:10.5px;line-height:1.5;color:var(--text-3);margin-top:4px;}
  .ops-need .ops-need-go{display:inline-flex;align-items:center;gap:2px;margin-top:8px;font-size:10px;font-weight:600;color:var(--primary-ink);}
  .ops-need .ops-need-go .ic{width:11px;height:11px;}

  /* ---- 方案区 ---- */
  .ops-billing-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px;flex-wrap:wrap;}
  .ops-billing{display:inline-flex;background:var(--bg-card-2);border-radius:var(--r-full);padding:3px;gap:2px;}
  .ops-billing button{height:28px;padding:0 12px;border-radius:var(--r-full);font-size:11px;font-weight:600;color:var(--text-2);cursor:pointer;transition:background var(--d-fast),color var(--d-fast),box-shadow var(--d-fast);}
  .ops-billing button.on{background:var(--bg-card);color:var(--text-1);box-shadow:var(--shadow-sm);}
  .ops-billing button span{font-size:9px;color:var(--primary-ink);margin-left:3px;}
  .ops-billing-note{font-size:10px;color:var(--text-3);}
  .ops-gate-note{display:flex;align-items:flex-start;gap:8px;background:var(--primary-soft);border:1px solid var(--accent-line);border-radius:var(--r-m);padding:10px 12px;margin-bottom:12px;font-size:11px;line-height:1.55;color:var(--text-2);}
  .ops-gate-note .ic{width:14px;height:14px;flex:none;margin-top:1px;color:var(--primary-ink);}
  .ops-gate-note b{color:var(--text-1);}
  .ops-trial{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--primary-soft),transparent 75%);border:1px solid var(--accent-line);border-radius:var(--r-l);padding:12px 13px;margin-bottom:12px;}
  .ops-trial-ic{width:36px;height:36px;border-radius:50%;background:var(--bg-card);color:var(--primary-ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-xs);}
  .ops-trial-ic .ic{width:18px;height:18px;}
  .ops-trial-info{flex:1;min-width:0;}
  .ops-trial-info b{display:block;font-size:12.5px;color:var(--text-1);}
  .ops-trial-info p{font-size:10.5px;line-height:1.5;color:var(--text-3);margin-top:2px;}
  .ops-trial button{flex:none;height:32px;padding:0 12px;border-radius:var(--r-full);background:var(--action);color:var(--on-action);font-size:11px;font-weight:700;cursor:pointer;}
  .ops-promo{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--primary-ink);background:var(--primary-soft);border-radius:var(--r-s);padding:7px 10px;margin-bottom:12px;}
  .ops-promo .ic{width:12px;height:12px;}
  .ops-plan{position:relative;overflow:hidden;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:15px;box-shadow:var(--shadow-card);transition:border-color var(--d-fast),transform var(--d-fast);}
  .ops-plan + .ops-plan{margin-top:11px;}
  .ops-plan.reco{border-color:var(--accent-line);box-shadow:var(--shadow-float);}
  .ops-plan.reco::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);}
  .ops-plan.current{background:linear-gradient(160deg,var(--primary-soft),var(--bg-card) 55%);border-color:var(--accent-line);}
  .ops-plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .ops-plan-name{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.2;}
  .ops-plan-blurb{font-size:10.5px;line-height:1.5;color:var(--text-3);margin-top:3px;max-width:25ch;}
  .ops-plan-tag{flex:none;font-size:9.5px;font-weight:700;color:var(--primary-ink);background:var(--primary-soft);border:1px solid var(--accent-line);border-radius:var(--r-full);padding:3px 8px;white-space:nowrap;}
  .ops-plan.current .ops-plan-tag{color:var(--text-inv);background:var(--primary);border-color:var(--primary);}
  .ops-plan-price{display:flex;align-items:baseline;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .ops-price-main{font-family:var(--font-num);font-size:32px;font-weight:800;letter-spacing:-.04em;color:var(--primary-ink);line-height:1;}
  .ops-price-unit{font-size:10.5px;color:var(--text-3);}
  .ops-price-orig{font-size:11px;color:var(--text-4);text-decoration:line-through;margin-left:2px;}
  .ops-price-save{font-size:9.5px;font-weight:700;color:var(--error);background:rgba(179,38,30,.08);border-radius:var(--r-xs);padding:2px 5px;}
  .ops-price-note{width:100%;font-size:9.5px;color:var(--text-3);margin-top:4px;}
  .ops-plan-feats{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .ops-feat{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;line-height:1.45;color:var(--text-2);}
  .ops-feat .ic{width:13px;height:13px;flex:none;margin-top:1px;color:var(--success);}
  .ops-feat.locked .ic{color:var(--text-4);}
  .ops-feat b{font-weight:600;color:var(--text-1);}
  .ops-feat span{color:var(--text-3);}
  .ops-plan-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;}
  .ops-plan-meta span{font-size:9.5px;color:var(--text-3);background:var(--bg-inset);border-radius:var(--r-xs);padding:2px 6px;font-variant-numeric:tabular-nums;}
  .ops-plan-cta{margin-top:12px;}
  .ops-plan-cta .btn{height:42px;font-size:12.5px;}
  .ops-plan-cta .btn:disabled{background:var(--bg-inset);color:var(--text-3);box-shadow:none;opacity:1;}
  .ops-linkbtn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:38px;margin-top:10px;font-size:11px;font-weight:600;color:var(--primary-ink);cursor:pointer;}
  .ops-linkbtn .ic{width:12px;height:12px;}

  /* ---- 四柱 ---- */
  .ops-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:2px 0 11px;}
  .ops-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:var(--r-m);background:var(--bg-card);border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all var(--d-fast) var(--e-out);}
  .ops-tab .ic{width:16px;height:16px;color:var(--text-3);transition:color var(--d-fast);}
  .ops-tab.on{background:var(--action);border-color:var(--action);color:var(--on-action);box-shadow:var(--shadow-sm);}
  .ops-tab.on .ic{color:var(--on-action);}
  .ops-tab .ops-tab-dot{width:4px;height:4px;border-radius:50%;background:var(--primary);margin-top:-1px;}
  .ops-tab.on .ops-tab-dot{background:#E3C88E;}
  .ops-panel{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:15px;box-shadow:var(--shadow-card);animation:ops-in .35s var(--e-out) both;}
  .ops-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px;}
  .ops-panel-title{font-size:14px;font-weight:700;color:var(--text-1);}
  .ops-panel-sub{font-size:10.5px;line-height:1.5;color:var(--text-3);margin-top:3px;max-width:30ch;}
  .ops-pill{flex:none;font-size:9px;font-weight:700;letter-spacing:.04em;border-radius:var(--r-full);padding:3px 8px;background:var(--bg-inset);color:var(--text-3);}
  .ops-pill.on{background:var(--primary-soft);color:var(--primary-ink);border:1px solid var(--accent-line);}
  .ops-pill.warn{background:rgba(192,68,42,.10);color:var(--warning-ink);}
  .ops-meters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
  .ops-meter{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 9px 8px;min-width:0;}
  .ops-meter b{display:block;font-family:var(--font-num);font-size:17px;font-weight:800;color:var(--text-1);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .ops-meter b small{font-size:9px;font-weight:500;color:var(--text-3);}
  .ops-meter span{display:block;font-size:9px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-meter-bar{height:3px;border-radius:2px;background:var(--bg-inset);margin-top:5px;overflow:hidden;}
  .ops-meter-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary-strong));}
  .ops-feat-list{display:flex;flex-direction:column;gap:8px;}
  .ops-feat-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-m);}
  .ops-feat-item .ic{width:14px;height:14px;flex:none;margin-top:1px;color:var(--success);}
  .ops-feat-item.locked .ic{color:var(--text-4);}
  .ops-feat-item b{display:block;font-size:11px;font-weight:600;color:var(--text-1);line-height:1.35;}
  .ops-feat-item p{font-size:9.5px;line-height:1.45;color:var(--text-3);margin-top:2px;}
  .ops-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;}
  .ops-actions .btn{height:36px;font-size:11px;padding:0 12px;}
  .ops-actions .btn .ic{width:13px;height:13px;}
  .ops-panel-note{display:flex;align-items:flex-start;gap:7px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:10px;line-height:1.55;color:var(--text-3);}
  .ops-panel-note .ic{width:12px;height:12px;flex:none;margin-top:1px;color:var(--primary-ink);}
  .ops-panel-note b{color:var(--text-2);}

  /* ---- 推送 ---- */
  .ops-pushmock{display:flex;gap:9px;background:var(--bg-inset);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 11px;margin-bottom:12px;}
  .ops-pushmock-ic{width:30px;height:30px;border-radius:8px;background:var(--action);color:var(--on-action);display:grid;place-items:center;flex:none;font-size:9px;font-weight:800;letter-spacing:.02em;}
  .ops-pushmock-body{min-width:0;}
  .ops-pushmock-body b{display:block;font-size:11px;font-weight:600;color:var(--text-1);line-height:1.4;}
  .ops-pushmock-body p{font-size:10px;line-height:1.5;color:var(--text-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ops-pushmock-body span{display:block;font-size:8.5px;color:var(--text-3);margin-top:4px;}
  .ops-pref{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .ops-pref:first-child{padding-top:0;}
  .ops-pref:last-child{border-bottom:none;padding-bottom:0;}
  .ops-pref-l{min-width:0;}
  .ops-pref-l b{display:block;font-size:11.5px;font-weight:600;color:var(--text-1);}
  .ops-pref-l p{font-size:9.5px;line-height:1.45;color:var(--text-3);margin-top:2px;}
  .ops-pref-r{flex:none;display:flex;align-items:center;gap:6px;}
  .ops-mini-seg{display:flex;background:var(--bg-inset);border-radius:var(--r-full);padding:2px;gap:1px;}
  .ops-mini-seg button{height:25px;padding:0 8px;border-radius:var(--r-full);font-size:9.5px;font-weight:600;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
  .ops-mini-seg button.on{background:var(--bg-card);color:var(--text-1);box-shadow:var(--shadow-xs);}
  .ops-mini-seg button .ic{width:9px;height:9px;color:var(--text-4);}
  .ops-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .ops-chip{height:28px;padding:0 10px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--bg-elev);font-size:10px;font-weight:600;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all var(--d-fast);}
  .ops-chip.on{background:var(--primary-soft);border-color:var(--accent-line);color:var(--primary-ink);}
  .ops-chip .ic{width:10px;height:10px;}
  .ops-chip.locked{opacity:.55;}
  .ops-fieldrow{display:flex;align-items:center;gap:7px;margin-top:10px;}
  .ops-fieldrow label{font-size:10px;color:var(--text-3);flex:none;}
  .ops-fieldrow input[type="time"],.ops-fieldrow input[type="text"]{height:32px;padding:0 9px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg-elev);font-size:10.5px;color:var(--text-1);min-width:0;}
  .ops-fieldrow input[type="text"]{flex:1;}
  .ops-fieldrow .locked-ic{width:12px;height:12px;color:var(--text-4);}
  .ops-pushlog{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;}
  .ops-pushlog-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .ops-pushlog-head b{font-size:10.5px;color:var(--text-2);}
  .ops-pushlog-head span{font-size:9.5px;color:var(--text-3);}
  .ops-pushrow{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .ops-pushrow:last-child{border-bottom:none;padding-bottom:0;}
  .ops-pushrow-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none;margin-top:5px;}
  .ops-pushrow-dot.read{background:var(--text-4);}
  .ops-pushrow-body{min-width:0;flex:1;}
  .ops-pushrow-body b{display:block;font-size:10.5px;font-weight:600;color:var(--text-1);line-height:1.4;}
  .ops-pushrow-body p{font-size:9.5px;line-height:1.45;color:var(--text-3);margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .ops-pushrow-time{font-size:8.5px;color:var(--text-4);flex:none;}

  /* ---- 工具 ---- */
  .ops-tools-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:10px;color:var(--text-3);}
  .ops-tools-head b{color:var(--text-2);font-weight:600;}
  .ops-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ops-tool{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-m);padding:11px;cursor:pointer;transition:transform var(--d-fast),border-color var(--d-fast),background var(--d-fast);}
  .ops-tool:active{transform:scale(.98);}
  .ops-tool:hover{border-color:var(--line-strong);}
  .ops-tool.locked{background:var(--bg-inset);}
  .ops-tool-ic{width:32px;height:32px;border-radius:var(--r-s);background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;margin-bottom:8px;flex:none;}
  .ops-tool-ic .ic{width:16px;height:16px;}
  .ops-tool.locked .ops-tool-ic{background:var(--bg-card-2);color:var(--text-4);}
  .ops-tool b{font-size:11px;font-weight:600;color:var(--text-1);line-height:1.3;}
  .ops-tool p{font-size:9px;line-height:1.4;color:var(--text-3);margin-top:3px;}
  .ops-tool-state{position:absolute;top:8px;right:8px;font-size:8px;font-weight:700;border-radius:var(--r-full);padding:2px 5px;background:var(--primary-soft);color:var(--primary-ink);}
  .ops-tool.locked .ops-tool-state{background:var(--bg-card-2);color:var(--text-3);display:inline-flex;align-items:center;gap:2px;}
  .ops-tool-state .ic{width:8px;height:8px;}

  /* ---- 服务 ---- */
  .ops-manager{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--primary-soft),transparent 72%);border:1px solid var(--accent-line);border-radius:var(--r-m);padding:11px 12px;margin-bottom:12px;}
  .ops-manager-av{width:42px;height:42px;border-radius:50%;background:var(--action);color:var(--on-action);display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;box-shadow:var(--shadow-xs);}
  .ops-manager-info{flex:1;min-width:0;}
  .ops-manager-info b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-1);}
  .ops-manager-info b span{font-size:9px;font-weight:500;color:var(--text-3);background:var(--bg-card);border-radius:var(--r-xs);padding:1px 5px;}
  .ops-manager-info p{font-size:9.5px;color:var(--text-3);margin-top:3px;line-height:1.4;}
  .ops-manager-call{flex:none;height:30px;padding:0 9px;border-radius:var(--r-full);border:1px solid var(--accent-line);background:var(--bg-card);color:var(--primary-ink);font-size:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
  .ops-manager-call .ic{width:11px;height:11px;}
  .ops-chat{display:flex;flex-direction:column;gap:8px;max-height:235px;overflow-y:auto;padding:2px 0 6px;}
  .ops-msg{max-width:84%;padding:8px 10px;border-radius:11px;font-size:10.5px;line-height:1.55;position:relative;}
  .ops-msg.agent{align-self:flex-start;background:var(--bg-inset);color:var(--text-1);border-bottom-left-radius:4px;}
  .ops-msg.me{align-self:flex-end;background:var(--action);color:var(--on-action);border-bottom-right-radius:4px;}
  .ops-msg .ops-msg-name{display:block;font-size:8.5px;color:var(--text-3);margin-bottom:2px;}
  .ops-msg.me .ops-msg-name{color:rgba(255,255,255,.55);text-align:right;}
  .ops-msg-time{display:block;font-size:8px;opacity:.58;margin-top:3px;}
  .ops-chat-quick{display:flex;gap:5px;overflow-x:auto;padding:5px 0 7px;scrollbar-width:none;}
  .ops-chat-quick::-webkit-scrollbar{display:none;}
  .ops-chat-quick button{flex:none;height:26px;padding:0 9px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--bg-elev);font-size:9.5px;color:var(--text-2);cursor:pointer;}
  .ops-chat-input{display:flex;gap:6px;align-items:center;}
  .ops-chat-input input{flex:1;height:36px;padding:0 11px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--bg-elev);font-size:11px;color:var(--text-1);min-width:0;}
  .ops-chat-input button{flex:none;height:36px;padding:0 13px;border-radius:var(--r-full);background:var(--action);color:var(--on-action);font-size:10.5px;font-weight:700;cursor:pointer;}
  .ops-chat-tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .ops-chat-tools span{font-size:9px;color:var(--text-3);}
  .ops-chat-tools button{font-size:9.5px;font-weight:600;color:var(--primary-ink);display:inline-flex;align-items:center;gap:3px;cursor:pointer;}
  .ops-chat-tools .ic{width:11px;height:11px;}
  .ops-tickets{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .ops-tickets-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .ops-tickets-head b{font-size:11px;color:var(--text-1);}
  .ops-tickets-head button{font-size:10px;font-weight:600;color:var(--primary-ink);cursor:pointer;}
  .ops-ticket{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .ops-ticket:last-child{border-bottom:none;padding-bottom:0;}
  .ops-ticket-ic{width:28px;height:28px;border-radius:50%;background:var(--bg-inset);color:var(--text-3);display:grid;place-items:center;flex:none;}
  .ops-ticket-ic .ic{width:13px;height:13px;}
  .ops-ticket-body{flex:1;min-width:0;}
  .ops-ticket-body b{display:block;font-size:10.5px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-ticket-body p{font-size:9px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-ticket-status{flex:none;font-size:8.5px;font-weight:700;border-radius:var(--r-full);padding:2px 6px;background:var(--bg-inset);color:var(--text-3);}
  .ops-ticket-status.processing{background:var(--primary-soft);color:var(--primary-ink);}
  .ops-ticket-status.resolved{background:rgba(43,107,79,.10);color:var(--success);}
  .ops-empty{padding:20px 10px;text-align:center;font-size:10.5px;line-height:1.6;color:var(--text-3);}
  .ops-empty .ic{width:24px;height:24px;color:var(--text-4);margin:0 auto 7px;display:block;}

  /* ---- 加购 / 订单 ---- */
  .ops-addon{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 13px;box-shadow:var(--shadow-card);}
  .ops-addon + .ops-addon{margin-top:9px;}
  .ops-addon-ic{width:38px;height:38px;border-radius:var(--r-m);background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;flex:none;}
  .ops-addon-ic .ic{width:18px;height:18px;}
  .ops-addon-info{flex:1;min-width:0;}
  .ops-addon-info b{display:block;font-size:11.5px;font-weight:600;color:var(--text-1);}
  .ops-addon-info p{font-size:9.5px;line-height:1.45;color:var(--text-3);margin-top:2px;}
  .ops-addon-buy{flex:none;height:32px;padding:0 11px;border-radius:var(--r-full);background:var(--action);color:var(--on-action);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .ops-addon-buy:disabled{background:var(--bg-inset);color:var(--text-3);cursor:not-allowed;}
  .ops-addon-note{margin-top:10px;font-size:9.5px;line-height:1.5;color:var(--text-3);}
  .ops-order{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .ops-order:last-child{border-bottom:none;padding-bottom:0;}
  .ops-order-ic{width:30px;height:30px;border-radius:50%;background:var(--bg-inset);color:var(--text-2);display:grid;place-items:center;flex:none;}
  .ops-order-ic .ic{width:14px;height:14px;}
  .ops-order-body{flex:1;min-width:0;}
  .ops-order-body b{display:block;font-size:10.5px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-order-body p{font-size:9px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-order-right{flex:none;text-align:right;}
  .ops-order-right b{display:block;font-family:var(--font-num);font-size:11px;font-weight:700;color:var(--text-1);font-variant-numeric:tabular-nums;}
  .ops-order-right span{display:inline-block;font-size:8px;font-weight:600;color:var(--text-3);margin-top:3px;}
  .ops-order-right span.review{color:var(--warning-ink);}
  .ops-order-right span.paid{color:var(--success);}
  .ops-order-right span.trial{color:var(--primary-ink);}

  /* ---- FAQ / 信任 ---- */
  details.ops-faq{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 13px;margin:0 0 7px;box-shadow:var(--shadow-xs);}
  details.ops-faq summary{font-size:11.5px;font-weight:600;color:var(--text-1);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  details.ops-faq summary::after{content:'+';color:var(--text-3);font-size:14px;flex:none;}
  details.ops-faq[open] summary::after{content:'−';}
  details.ops-faq .ops-faq-a{font-size:10.5px;color:var(--text-2);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .ops-trust{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:20px 0 0;padding:15px 0 0;border-top:1px solid var(--line);}
  .ops-trust-item{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}
  .ops-trust-item .ic{width:15px;height:15px;color:var(--primary-ink);}
  .ops-trust-item span{font-size:8.5px;line-height:1.35;color:var(--text-3);}

  /* ---- 身份切换（内部预览） ---- */
  .ops-groupchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .ops-gchip{height:28px;padding:0 10px;border-radius:var(--r-full);border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:rgba(244,242,238,.7);font-size:10px;font-weight:600;cursor:pointer;transition:all var(--d-fast);}
  .ops-gchip.on{background:#F0E2BE;border-color:#F0E2BE;color:#2A1810;}

  /* ---- Sheet 内通用 ---- */
  .ops-sheet-kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11.5px;}
  .ops-sheet-kv:last-child{border-bottom:none;}
  .ops-sheet-kv span{color:var(--text-3);}
  .ops-sheet-kv b{color:var(--text-1);font-weight:600;text-align:right;}
  .ops-sheet-note{font-size:10px;line-height:1.6;color:var(--text-3);margin-top:10px;}
  .ops-divider{height:1px;background:var(--line);margin:11px 0;}
  .ops-sheet-plan{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--primary-soft);border:1px solid var(--accent-line);border-radius:var(--r-m);padding:11px 12px;margin-bottom:10px;}
  .ops-sheet-plan b{font-size:13px;color:var(--text-1);}
  .ops-sheet-plan span{font-size:10px;color:var(--text-3);display:block;margin-top:2px;}
  .ops-sheet-plan .price{font-family:var(--font-num);font-size:19px;font-weight:800;color:var(--primary-ink);}
  .ops-co-billing{display:flex;gap:6px;margin:10px 0;}
  .ops-co-billing button{flex:1;height:46px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--bg-elev);text-align:left;padding:0 11px;cursor:pointer;transition:all var(--d-fast);}
  .ops-co-billing button.on{border-color:var(--accent-line);background:var(--primary-soft);box-shadow:0 0 0 1px var(--accent-line) inset;}
  .ops-co-billing b{display:block;font-size:11px;color:var(--text-1);}
  .ops-co-billing span{display:block;font-size:9.5px;color:var(--text-3);margin-top:2px;}
  .ops-co-lines{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-m);padding:2px 11px;margin:10px 0;}
  .ops-co-lines .ops-sheet-kv b{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
  .ops-co-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 0 2px;}
  .ops-co-total span{font-size:11px;color:var(--text-2);}
  .ops-co-total b{font-family:var(--font-num);font-size:26px;font-weight:800;color:var(--primary-ink);letter-spacing:-.03em;}
  .ops-recharge{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .ops-recharge button{height:32px;padding:0 11px;border-radius:var(--r-full);border:1px solid var(--accent-line);background:var(--primary-soft);color:var(--primary-ink);font-size:10px;font-weight:600;cursor:pointer;}
  .ops-success{text-align:center;padding:8px 0 2px;}
  .ops-success-ic{width:52px;height:52px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;margin:0 auto 12px;}
  .ops-success-ic .ic{width:26px;height:26px;}
  .ops-success b{display:block;font-size:15px;color:var(--text-1);}
  .ops-success p{font-size:10.5px;line-height:1.6;color:var(--text-3);margin-top:6px;}
  .ops-cmp-wrap{overflow-x:auto;margin:0 -2px;}
  table.ops-cmp{border-collapse:collapse;width:100%;min-width:430px;font-size:10px;}
  table.ops-cmp th,table.ops-cmp td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;color:var(--text-2);}
  table.ops-cmp th:first-child,table.ops-cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--bg-elev);z-index:1;color:var(--text-3);}
  table.ops-cmp th{font-weight:700;color:var(--text-1);}
  table.ops-cmp th.reco{color:var(--primary-ink);}
  .ops-cmp-orig{display:block;font-size:8.5px;font-weight:500;color:var(--text-4);text-decoration:line-through;}
  table.ops-cmp tr:last-child td{border-bottom:none;}
  .ops-top-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .ops-top-item:last-child{border-bottom:none;padding-bottom:0;}
  .ops-top-item-body{flex:1;min-width:0;}
  .ops-top-item-body b{display:block;font-size:12px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ops-top-item-body p{font-size:9.5px;color:var(--text-3);margin-top:2px;}
  .ops-top-item .btn{height:30px;font-size:10px;padding:0 10px;flex:none;}
  .ops-ticket-msg{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;padding:2px 0 6px;}
  .ops-ticket-msg .ops-msg{max-width:88%;}
  .ops-ticket-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
  .ops-ticket-meta .tag{font-size:9px;}
  .ops-toolout{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-m);padding:11px;margin-top:10px;font-size:10.5px;line-height:1.7;color:var(--text-2);white-space:pre-wrap;}
  .ops-toolout b{color:var(--text-1);}
  .ops-toolout table{width:100%;border-collapse:collapse;margin-top:6px;font-size:10px;}
  .ops-toolout td,.ops-toolout th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;}
  .ops-toolout th{color:var(--text-3);font-weight:500;}
  .ops-policy{display:flex;flex-direction:column;gap:8px;margin-top:9px;}
  .ops-policy-item{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;}
  .ops-policy-item b{display:block;font-size:11px;color:var(--text-1);line-height:1.4;}
  .ops-policy-item p{font-size:9.5px;line-height:1.5;color:var(--text-3);margin-top:3px;}
  .ops-policy-item span{display:inline-block;font-size:8.5px;color:var(--primary-ink);margin-top:5px;}
  .ops-crm-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
  .ops-crm-row:last-child{border-bottom:none;}
  .ops-crm-row-body{flex:1;min-width:0;}
  .ops-crm-row-body b{display:block;font-size:10.5px;color:var(--text-1);}
  .ops-crm-row-body p{font-size:9px;color:var(--text-3);margin-top:2px;}
  .ops-crm-row .ops-chip{height:24px;font-size:9px;}

  /* ============================================================
     V2 · 信息层级 / 方案配置器 / 可读性（2026-11）
     目标：先讲清价值，再给价格；一个方案聚焦，而不是三张卡平铺。
     ============================================================ */

  /* ---- 区段标题：统一为「标题 + 一行说明」，去掉重复竖条 ---- */
  .ug-scroll .section-title{align-items:flex-end;margin-bottom:12px;}
  .ops-sec-head{min-width:0;}
  .ug-scroll .section-title .st-left{display:block;font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25;color:var(--text-1);}
  .ug-scroll .section-title .st-left::before{display:none;}
  .ug-scroll .section-title .more{font-size:10.5px;font-weight:600;color:var(--primary-ink);white-space:nowrap;padding-bottom:2px;}
  .ops-st-sub{margin-top:3px;font-size:10.5px;line-height:1.45;color:var(--text-3);}

  /* ---- 首屏推荐卡（未开通）：一个具体方案，而不是第二句大标题 ---- */
  .ops-rec-kicker{position:relative;display:flex;align-items:center;gap:8px;margin-top:14px;}
  .ops-rec-kicker .ops-kicker{color:rgba(244,242,238,.5);}
  .ops-rec-planchip{font-size:10px;font-weight:700;color:#F0E6CC;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-full);padding:2px 8px;}

<script>
(function () {
  window.__ROOT__ = '../../';
  var CFG = (window.MOCK && MOCK.business && MOCK.business.opsPackages) || {};
  var LEGACY = (window.MOCK && MOCK.business && MOCK.business.vendorCommerce && MOCK.business.vendorCommerce.vendorUpgrades) || {};
  var PILLARS = {

  };

  var STATUS = { paid: '已支付', trial: '体验中', refund_review: '退款审核中', refunded: '已退款' };
  var state = {

  };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return (window.UI && UI.esc) ? UI.esc(s == null ? '' : String(s)) : String(s == null ? '' : s); }
  function ic(name, cls) { return (window.UI && UI.icon) ? UI.icon(name, cls) : ''; }
  function num(n) { return Number(n || 0); }
  function money(n) {
    n = Math.round(num(n) * 100) / 100;
    return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: (n % 1 ? 2 : 0), maximumFractionDigits: 2 });
  }
  function dateStr(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
  }

  function baseGroup() { return OpsStore.group(); }

  /* ============================================================

  function renderHero() {
    var host = $('hero-slot');
    if (!host) return;
    var g = baseGroup();
    if (g === 'staff') { host.innerHTML = staffHero(); return; }
    if (g === 'guest' || g === 'registered') { host.innerHTML = gateHero(); return; }
    if (g === 'agent' && !OpsStore.current() && !state.agentTried) {
      state.agentTried = true;
      var ar = OpsStore.activateIncluded();
      if (ar && ar.error) toast(ar.error, 'err');

    var sub = OpsStore.current();
    if (sub) host.innerHTML = activeHero(sub);
    else host.innerHTML = emptyHero();

    try {
      var idy = (typeof deriveIdentity === 'function') ? deriveIdentity() : {};

    } catch (e) { return false; }
  }
  function heroTop(badge, ghost) {
    return '<div class="ops-hero-top">' +
      '<span class="ops-idchip">' + ic('user') + esc(gmeta().short || '身份') + '</span>' +
      '<span class="ops-hero-badge ' + (ghost ? 'ghost' : '') + '">' + esc(badge) + '</span>' +
      '</div>';

  function activeHero(sub) {
    var plan = OpsStore.activePlan() || samplePlan();
    var days = OpsStore.daysLeft(sub);
    var p = OpsStore.progress(sub);
    var top = OpsStore.topStats();
    var lead = OpsStore.leadRemaining();
    var ai = OpsStore.aiRemaining();
    var badge = sub.trial ? '体验中' : (sub.source === 'included' ? '随身份开通' : '生效中');
    var sourceNote = sub.trial ? '体验期内不自动续费，到期自动回到未开通状态。' :

    var stats = '<div class="ops-hero-stats">' +
      '<div class="ops-hstat"><b>' + top.available + '<small>/' + Math.max(num(plan.limits.topSlots), top.available) + '</small></b><span>置顶名额可用</span></div>' +
      '<div class="ops-hstat"><b>' + lead + '<small>条</small></b><span>精准线索余额</span></div>' +
      '<div class="ops-hstat"><b>' + (num(plan.limits.aiWords) ? ai : '—') + (num(plan.limits.aiWords) ? '<small>字</small>' : '') + '</b><span>AI 文案剩余</span></div>' +
      '</div>';
    var foot = '<div class="ops-hero-foot">' +
      '<span class="ops-auto">' + (sub.trial ? '不自动续费' :
        (sub.source === 'included' ? '随身份续期' :
          '<label class="switch" aria-label="自动续费"><input type="checkbox" data-act="toggle-auto"' + (sub.autoRenew ? ' checked' : '') + '><span class="track"></span><span class="thumb"></span></label> 自动续费')) + '</span>' +
      (sub.trial ?
        '<button class="ops-hbtn" data-act="convert">转为正式方案</button><button class="ops-hbtn ghost" data-act="go-publish">' + ic('edit') + '去发布</button>' :
        (sub.source === 'included' ?
          '<button class="ops-hbtn" data-act="scroll" data-val="pillars">查看权益</button>' :
          '<button class="ops-hbtn" data-act="go-publish">' + ic('edit') + '去发布</button><button class="ops-hbtn ghost" data-act="renew">续费</button>')) +
      '<button class="ops-hbtn ghost" data-act="manage">管理订阅</button>' +
      '</div>';
    return '<div class="ops-hero">' +
      '<span class="ops-hero-glow" aria-hidden="true"></span><span class="ops-hero-sheen" aria-hidden="true"></span>' +
      heroTop(badge, sub.trial) +
      '<div class="ops-hero-plan">' +
        '<div><span class="ops-kicker">当前运营包</span><div class="ops-plan-title">' + esc(plan.name) + '</div>' +
        '<div class="ops-plan-meta">' + esc(billingLabel(sub.billing)) + ' · ' + dateStr(sub.expireAt) + ' 到期</div></div>' +
        '<div class="ops-ring" style="--p:' + p + '"><span><b>' + days + '</b><small>DAYS LEFT</small></span></div>' +
      '</div>' + stats + foot +
      (agentPaused() ? '<div class="ops-hero-note paused">' + ic('lock') + '<span>代理账号已暂停：区域经营动作已锁定，运营包权益保留，恢复生效后自动解锁。</span></div>' : '') +
      '<div class="ops-hero-note">' + ic('info') + '<span>' + esc(sourceNote) + '</span></div>' +
      '</div>';
  }
  function emptyHero() {
    var m = gmeta();
    var rec = samplePlan();
    var trial = trialEligible();
    var lim = (rec && rec.limits) || {};
    var price = rec ? priceOf(rec, state.billing) : 0;
    var list = rec ? listPriceOf(rec, state.billing) : 0;
    var unit = state.billing === 'yearly' ? '/年' : '/月';
    var saved = list > price && !rec.included;
    var chips = [];
    function chip(v, label, suffix) { if (num(v) > 0) chips.push(label + ' ' + num(v) + (suffix || '')); }
    chip(lim.topSlots, '置顶', ' 个');
    chip(lim.leadCredits, '线索', ' 条');
    chip(lim.aiWords, 'AI', ' 字');
    chip((rec && rec.toolKeys || []).length, '工具', ' 项');
    var priceHtml = '';
    if (rec) {
      priceHtml = rec.included ? '<b>随身份</b>' :
        '<b>' + esc(money(price)) + '</b><i>' + unit + '</i>' +
        (saved ? '<s>' + esc(money(list)) + '</s><em>首开省 ' + esc(money(list - price)) + '</em>' : '');
    }
    return '<div class="ops-hero ops-hero--rec">' +
      '<span class="ops-hero-glow" aria-hidden="true"></span><span class="ops-hero-sheen" aria-hidden="true"></span>' +
      heroTop('身份匹配', true) +
      '<div class="ops-rec-kicker"><span class="ops-kicker">为你推荐</span>' +
        (rec ? '<span class="ops-rec-planchip">' + esc(rec.name) + '</span>' : '') + '</div>' +
      '<div class="ops-rec-title">' + esc(m.headline || '为你匹配一套经营方案') + '</div>' +
      '<div class="ops-rec-sub">' + esc(m.sub || '') + '</div>' +
      (rec ? '<div class="ops-rec-price">' + priceHtml +
        (state.billing === 'yearly' && price > 0 ? '<span class="ops-rec-per">折合 ' + esc(money(Math.round(price / 12))) + '/月，年付一次到账</span>' : '') +
        '</div>' : '') +
      (chips.length ? '<div class="ops-rec-chips">' + chips.slice(0, 4).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="ops-hero-actions">' +
        (trial ? '<button class="ops-hbtn" data-act="trial">' + ic('sparkle') + '领取 7 天体验</button>' : '') +
        '<button class="ops-hbtn' + (trial ? ' ghost' : '') + '" data-act="scroll" data-val="plans">' + (trial ? '查看全部方案' : '选择方案开通') + '</button>' +
      '</div>' +
      '<div class="ops-hero-note">' + ic('info') + '<span>' +
        (trial ? '体验不自动续费，结束前可随时转正式方案。' : '按月或按年开通，随时可升级；开通即生效，不支持退款。') +
      '</span></div>' +
      '</div>';
  }

      '<div class="ops-hero-sub">' + esc(m.sub || '') + '</div>' +
      '<div class="ops-hero-actions">' +
        '<button class="ops-hbtn" data-act="' + (guest ? 'go-login' : 'go-auth') + '">' + (guest ? '登录 / 注册' : '去完成实名') + '</button>' +
        '<button class="ops-hbtn ghost" data-act="scroll" data-val="plans">先看方案</button>' +
      '</div>' +
      '<div class="ops-hero-note">' + ic('shield') + '<span>' + (guest ? '登录后可保存身份与经营数据，并领取一次 7 天体验。' : '实名后可发布信息、领取体验并按个人身份匹配运营权益。') + '</span></div>' +

      '<div class="ops-hero-stats" style="margin-top:14px;">' +

        '<div class="ops-hstat"><b>' + tools.length + '<small>项</small></b><span>工具目录</span></div>' +

      '</div>' +
      '<div class="ops-hero-note">' + ic('info') + '<span>当前预览：' + esc(m.label || g) + ' · ' + esc(m.identityLabel || '') + '。所有价格与购买入口仅作展示。</span></div>' +
      '</div>';

  /* ============================================================

  function renderNeeds() {
    var host = $('needs-slot');
    if (!host) return;
    var needs = groupNeeds();
    if (!needs.length) { host.innerHTML = ''; return; }
    var active = !isStaff() && !!OpsStore.current();
    var rows = needs.map(function (n) {
      return '<button class="ops-need-row" data-act="need" data-val="' + esc(n.href || '') + '">' +

        '<span class="ops-need-txt"><b>' + esc(n.title) + '</b><p>' + esc(n.desc) + '</p></span>' +

    }).join('');

      (active ? '常用入口' : (isStaff() ? '该身份的典型需求' : '先解决这三件事')) + '</b><span>' + esc(groupLabel(eg())) + '</span></div>' +
      '<div class="ops-needs-list">' + rows + '</div></div>';
  }

  /* ============================================================
     方案
     ============================================================ */
  function renderPlans() {
    var host = $('plans-slot');
    if (!host) return;
    var g = eg();
    var plans = OpsStore.plansFor(g);
    var sub = isStaff() ? null : OpsStore.current();
    var promoOn = !isStaff() && !sub && CFG.promo && CFG.promo.enabled && OpsStore.promoAvailable();
    var sel = null;
    var i;
    for (i = 0; i < plans.length; i++) if (plans[i].key === state.planSel) sel = plans[i];
    if (!sel && sub) sel = planByKey(sub.planKey);
    if (!sel) for (i = 0; i < plans.length; i++) if (plans[i].recommended) { sel = plans[i]; break; }
    if (!sel) sel = plans[0] || null;
    state.planSel = sel ? sel.key : null;

    var html = '<div class="ops-billing-row"><div class="ops-billing" role="group" aria-label="计费周期">' +
      '<button class="' + (state.billing === 'monthly' ? 'on' : '') + '" data-act="billing" data-val="monthly">月付</button>' +
      '<button class="' + (state.billing === 'yearly' ? 'on' : '') + '" data-act="billing" data-val="yearly">年付<span>省 2 月</span></button>' +
      '</div><span class="ops-billing-note">' +
      (state.billing === 'yearly' ? '年付立省 2 个月，按年发放额度' : '按月开通，随时可升级') +
      (promoOn ? ' · 首开立减 ¥' + num(CFG.promo.discount) : '') +
      '</span></div>';

    if (isStaff()) {
      html += '<div class="ops-gate-note">' + ic('eye') + '<span>内部预览：当前展示 <b>' + esc(gmeta(g).label) + '</b> 的方案。切换页头身份可查看其他身份。购买、工单、推送设置为演示态，不写入真实账号。</span></div>';
    } else if (isGuest()) {
      html += '<div class="ops-gate-note">' + ic('lock') + '<span>' + gateText() + '</span></div>';
    } else if (isRegistered()) {
      html += '<div class="ops-gate-note">' + ic('shield') + '<span>' + gateText() + '</span></div>';
    }

    if (!plans.length) {
      html += '<div class="ops-empty">' + ic('lock') + '当前身份暂无可开通方案</div>';
      host.innerHTML = html;
      return;
    }

    html += '<div class="ops-plan-picker" role="tablist" aria-label="方案档位">' +
      plans.map(function (p) { return planOption(p, sub); }).join('') + '</div>';
    html += planDetail(sel, sub, g);
    html += '<button class="ops-linkbtn" data-act="compare">' + ic('grid') + '对比全部方案与额度</button>';
    host.innerHTML = html;
  }
  function planOption(plan, sub) {
    var isCur = !!(sub && sub.planKey === plan.key);
    var on = state.planSel === plan.key;
    var price = priceOf(plan, state.billing);
    var unit = state.billing === 'yearly' ? '/年' : '/月';
    var priceHtml = plan.included ?
      '<span class="ops-plan-opt-price" style="font-size:14px;">随身份</span>' :
      '<span class="ops-plan-opt-price">' + esc(money(price)) + '<i>' + unit + '</i></span>';
    var tag = isCur ? '当前方案' : (plan.recommended ? '最受欢迎' : '');
    return '<button type="button" role="tab" aria-selected="' + (on ? 'true' : 'false') + '" class="ops-plan-opt' + (on ? ' on' : '') + (isCur ? ' cur' : '') + (plan.recommended && !isCur ? ' reco' : '') + '" data-act="plan-sel" data-val="' + esc(plan.key) + '">' +
      '<b>' + esc(plan.name) + '</b>' + priceHtml +
      '<span class="ops-plan-opt-tag">' + esc(tag) + '</span></button>';
  }
  function planDetail(plan, sub, g) {
    if (!plan) return '';
    var isCur = !!(sub && sub.planKey === plan.key);
    var price = priceOf(plan, state.billing);
    var list = listPriceOf(plan, state.billing);
    var discounted = !plan.included && list > price;
    var unit = plan.included ? '' : billingUnit();
    var per = state.billing === 'yearly' && price > 0 ? ('折合 ' + money(Math.round(price / 12)) + '/月 · 年付一次到账') : '';
    var feats = [];
    ['publish', 'push', 'service'].forEach(function (p) {
      var arr = planFeatures(plan, p);
      if (arr[0]) feats.push(arr[0]);
    });
    var toolKeys = plan.toolKeys || [];
    var toolNames = toolKeys.map(function (k) {
      var t = (CFG.tools || {})[k];
      return (t && t.name) || k;
    });
    feats.splice(2, 0, {
      l: toolKeys.length + ' 项经营工具',
      d: toolNames.slice(0, 3).join('、') + (toolNames.length > 3 ? '等' : '')
    });
    var featHtml = feats.slice(0, 4).map(function (f) {
      return '<div class="ops-feat"><span>' + ic('check') + '</span><span><b>' + esc(f.l) + '</b>' + (f.d ? '<span> · ' + esc(f.d) + '</span>' : '') + '</span></div>';
    }).join('');
    var lim = plan.limits || {};
    var qs = [];
    function q(v, label, suffix) { if (num(v) > 0) qs.push({ v: num(v), l: label, s: suffix || '' }); }
    q(lim.topSlots, '置顶名额', ' 个');
    q(lim.leadCredits, '精准线索', ' 条');
    q(lim.aiWords, 'AI 文案', ' 字');
    q(toolKeys.length, '经营工具', ' 项');
    q(lim.esign, '电子签', ' 份');
    q(lim.seats, '坐席', ' 个');
    var quotaHtml = qs.length ? '<div class="ops-pd-quota">' + qs.slice(0, 4).map(function (x) {
      return '<div class="ops-pd-q"><b>' + x.v + '<small>' + x.s + '</small></b><span>' + esc(x.l) + '</span></div>';
    }).join('') + '</div>' : '';
    var tag = plan.tag || (plan.included ? '随身份开通' : (isCur ? '当前方案' : ''));
    var priceHtml = plan.included ? '<span class="ops-pd-main" style="font-size:24px;">随身份</span>' :
      '<span class="ops-pd-main">' + esc(money(price)) + '</span>' +
      (unit ? '<span class="ops-pd-unit">' + esc(unit) + '</span>' : '') +
      (discounted ? '<span class="ops-pd-orig">' + esc(money(list)) + '</span><span class="ops-pd-save">省 ' + esc(money(list - price)) + '</span>' : '') +
      (per ? '<span class="ops-pd-per">' + esc(per) + '</span>' : '');
    var risk = isStaff() ? '内部预览：价格与购买入口仅作展示。' :
      (gateKind() ? '登录并完成实名后可开通，额度支付后即时发放。' :
        '支付即生效 · 开通后不支持退款 · 随时升级，剩余价值可抵扣');
    var cta = planCta(plan, sub, g, price);
    var trialHtml = (!isStaff() && !sub && trialEligible() && !plan.included) ?
      '<button type="button" class="ops-pd-trial" data-act="trial">' + ic('sparkle') + '先领 7 天体验，再决定</button>' : '';
    return '<div class="ops-plan-detail">' +
      '<div class="ops-pd-top"><div><div class="ops-pd-name">' + esc(plan.name) + '</div>' +
      '<div class="ops-pd-blurb">' + esc(plan.blurb || '') + '</div></div>' +
      (tag ? '<span class="ops-pd-tag">' + esc(tag) + '</span>' : '') + '</div>' +
      '<div class="ops-pd-price">' + priceHtml + '</div>' +
      quotaHtml +
      '<div class="ops-pd-feats">' + featHtml + '</div>' +
      '<div class="ops-pd-cta">' + cta + '</div>' + trialHtml +
      '<div class="ops-pd-risk">' + ic('shield') + '<span>' + esc(risk) + '</span></div>' +
      '</div>';
  }
  function planCta(plan, sub, g, price) {
    if (isStaff()) return '<button class="btn btn-ghost btn-block" data-act="plan-detail" data-val="' + esc(plan.key) + '">预览方案详情</button>';
    if (isGuest()) return '<button class="btn btn-primary btn-block" data-act="go-login">登录后开通</button>';
    if (isRegistered()) return '<button class="btn btn-primary btn-block" data-act="go-auth">完成实名后开通</button>';
    if (plan.included) {
      if (sub && sub.planKey === plan.key) return '<button class="btn btn-ghost btn-block" disabled>已随身份开通</button>';
      return '<button class="btn btn-ghost btn-block" data-act="scroll" data-val="pillars">查看可用权益</button>';
    }
    if (sub) {
      if (sub.trial && sub.planKey !== plan.key) {
        return '<button class="btn btn-ghost btn-block" disabled>体验期结束后可升级</button>';
      }
      if (sub.planKey === plan.key) {
        if (sub.trial) return '<button class="btn btn-primary btn-block" data-act="convert">转为正式方案 · ' + money(price) + '</button>';
        return '<button class="btn btn-ghost btn-block" data-act="renew">续费当前方案</button>';
      }
      var cur = planByKey(sub.planKey);
      if (cur && num(plan.price) > num(cur.price)) {
        return '<button class="btn btn-primary btn-block" data-act="upgrade" data-val="' + esc(plan.key) + '">升级至该方案</button>';
      }
      return '<button class="btn btn-ghost btn-block" disabled>已包含在当前方案</button>';
    }
    return '<button class="btn btn-primary btn-block" data-act="checkout" data-val="' + esc(plan.key) + '">开通 · ' + money(price) + '</button>';
  }

  /* ============================================================
     四柱
     ============================================================ */
  function renderPillars() {

     ============================================================ */
  function renderAddons() {
    var host = $('addons-slot');
    if (!host) return;
    var avail = {};
    try {
      (UpgradeStore.listAvailable() || []).forEach(function (x) { if (x.available !== false) avail[x.key] = x; });
    } catch (e) {}
    var defs = [
      { key: 'topListing', name: '服务置顶', desc: '单条信息置顶 7 天 · 广场排序置前', icon: 'pin', cfg: LEGACY.topListing },
      { key: 'leadPack', name: '精准线索包', desc: '50 条精准询盘 · 工作台优先解锁', icon: 'briefcase', cfg: LEGACY.leadPack },
      { key: 'saasTools', name: '经营工具 30 天', desc: '数据看板 + 经营分析 · 与运营包额度合并', icon: 'tool', cfg: LEGACY.saasTools }
    ];
    /* 实名用户只看到本身份可购的道具；游客/未实名保留目录作为开通引导。
       没有任何可购项时不渲染这一节，避免出现整块买不了的按钮。 */
    var items = (isStaff() || gateKind()) ? defs : defs.filter(function (x) { return !!avail[x.key]; });
    var canShop = items.length > 0;
    var sec = $('addons');
    if (sec) sec.style.display = canShop ? '' : 'none';
    var moreLink = $('pillars-more');
    if (moreLink) moreLink.style.display = canShop ? '' : 'none';
    if (!canShop) { host.innerHTML = ''; return; }
    var html = items.map(function (x) {
      var c = x.cfg || {};
      var ok = !!avail[x.key];
      var price = addonPrice(c.price);
      var btn;
      if (isStaff()) btn = '<button class="ops-addon-buy" disabled>预览</button>';
      else if (isGuest()) btn = '<button class="ops-addon-buy" data-act="go-login">登录</button>';
      else if (isRegistered()) btn = '<button class="ops-addon-buy" data-act="go-auth">实名</button>';
      else if (!ok) btn = '<button class="ops-addon-buy" disabled>当前身份不可购</button>';
      else if (x.key === 'topListing') btn = '<button class="ops-addon-buy" data-act="top-pick">¥' + price + ' 置顶</button>';
      else btn = '<button class="ops-addon-buy" data-act="addon" data-val="' + x.key + '">¥' + price + ' 购买</button>';
      return '<div class="ops-addon"><span class="ops-addon-ic">' + ic(x.icon) + '</span>' +
        '<div class="ops-addon-info"><b>' + x.name + '</b><p>' + x.desc + '</p></div>' + btn + '</div>';
    }).join('');
    html += '<div class="ops-addon-note">加购额度与运营包额度合并计算，优先消耗先到期的额度。已购的置顶、线索不会因方案升级而重复发放。</div>';
    host.innerHTML = html;
  }

      '<div class="ops-sheet-kv"><span>精准线索</span><b>' + num(lim.leadCredits) + ' 条</b></div>' +
      '<div class="ops-sheet-kv"><span>AI 文案</span><b>' + num(lim.aiWords) + ' 字</b></div>' +

      '<div class="ops-sheet-note">方案价格为演示数据。实际开通以支付页金额为准，虚拟权益支付后即时生效。</div>' +
      (isStaff() ? '<button class="btn btn-ghost btn-block" style="margin-top:12px;" data-act="close-sheet">关闭预览</button>' :

          '<button class="btn btn-primary btn-block" style="margin-top:12px;" data-act="checkout" data-val="' + esc(plan.key) + '">' + (plan.included ? '查看权益' : '开通 · ' + money(priceOf(plan))) + '</button>')));

  function openCompareSheet() {
    var plans = OpsStore.plansFor(eg());
    if (!plans.length) return toast('暂无可对比方案', 'warn');
    var head = '<tr><th>权益 / 方案</th>' + plans.map(function (p) { return '<th class="' + (p.recommended ? 'reco' : '') + '">' + esc(p.name) + '</th>'; }).join('') + '</tr>';
    function row(label, fn) {
      return '<tr><td>' + label + '</td>' + plans.map(function (p) { return '<td>' + fn(p) + '</td>'; }).join('') + '</tr>';
    }
    /* 对比表必须和配置器同价：按当前可享折扣计算，原价仅作划线参考 */
    function cmpPrice(p, billing) {
      if (p.included) return '随身份';
      var eff = priceOf(p, billing), list = listPriceOf(p, billing);
      return money(eff) + (list > eff ? '<s class="ops-cmp-orig">' + money(list) + '</s>' : '');
    }
    var body = head +
      row('月付', function (p) { return cmpPrice(p, 'monthly'); }) +
      row('年付', function (p) { return cmpPrice(p, 'yearly'); }) +
      row('置顶名额', function (p) { return num(p.limits.topSlots) + ' 个'; }) +
      row('精准线索', function (p) { return num(p.limits.leadCredits) + ' 条'; }) +
      row('AI 文案', function (p) { return num(p.limits.aiWords) + ' 字'; }) +
      row('电子签', function (p) { return num(p.limits.esign) + ' 份'; }) +
      row('坐席', function (p) { return num(p.limits.seats) + ' 个'; }) +
      row('经营工具', function (p) { return (p.toolKeys || []).length + ' 项'; }) +
      row('专属顾问', function (p) { return hasFeature(p, 'service.manager') ? '有' : '—'; });
    openSheet('方案与权益对比', '<div class="ops-cmp-wrap"><table class="ops-cmp">' + body + '</table></div>' +
      '<div class="ops-sheet-note">点击方案卡可查看完整权益。年付价格按 10 个月计，另赠 2 个月。</div>' +
      '<button class="btn btn-ghost btn-block" style="margin-top:12px;" data-act="close-sheet">关闭</button>');
  }

  function openCheckoutSheet(key, mode) {
    var plan = planByKey(key);
    if (!plan) return toast('方案不存在', 'err');
    if (isStaff()) return openPlanSheet(key);
    if (gateKind()) return goGate();
    state.co = { key: key, mode: mode || 'subscribe' };
    state.coBilling = state.billing;
    state.coSheet = openSheet(mode === 'upgrade' ? '升级运营包' : (mode === 'convert' ? '体验转正式' : '确认开通'), '');
    paintCheckout();
  }
  function coNumbers() {
    if (!state.co) return null;
    var plan = planByKey(state.co.key);
    var billing = state.coBilling;
    var price, orig, discount = 0, credit = 0, pay;
    if (state.co.mode === 'upgrade') {
      var sub = OpsStore.current();
      if (!sub) return null;
      var cur = planByKey(sub.planKey);
      var newPrice = billing === 'yearly' ? num(plan.annualPrice || plan.price * 10) : num(plan.price);
      var left = sub.days ? Math.max(0, Math.min(1, (sub.expireAt - Date.now()) / (sub.days * 86400000))) : 0;
      credit = Math.round(num(sub.price) * left * 100) / 100;
      pay = Math.max(0, Math.round((newPrice - credit) * 100) / 100);
      price = newPrice; orig = cur ? num(cur.price) : 0; discount = 0;
    } else {
      orig = listPriceOf(plan, billing);
      price = priceOf(plan, billing);
      discount = Math.max(0, orig - price);
      pay = price;
    }
    return { plan: plan, billing: billing, orig: orig, price: price, discount: discount, credit: credit, pay: pay };
  }
  function paintCheckout() {
    var s = state.coSheet;
    if (!s || !state.co) return;
    var n = coNumbers();
    if (!n) return;
    var bal = BalanceStore.available();
    var short = Math.max(0, Math.round((n.pay - bal) * 100) / 100);
    var b = state.coBilling;
    var billingBtns = '<div class="ops-co-billing">' +
      '<button class="' + (b === 'monthly' ? 'on' : '') + '" data-act="co-billing" data-val="monthly"><b>月付</b><span>' + money(n.plan.included ? 0 : n.plan.price) + ' / 30 天</span></button>' +
      '<button class="' + (b === 'yearly' ? 'on' : '') + '" data-act="co-billing" data-val="yearly"><b>年付 <span style="color:var(--primary-ink);">省 2 月</span></b><span>' + money(n.plan.included ? 0 : (n.plan.annualPrice || n.plan.price * 10)) + ' / 365 天</span></button>' +
      '</div>';
    var lines = '<div class="ops-co-lines">' +
      '<div class="ops-sheet-kv"><span>方案</span><b>' + esc(n.plan.name) + ' · ' + billingLabel(b) + '</b></div>' +
      '<div class="ops-sheet-kv"><span>方案价</span><b>' + money(n.orig) + '</b></div>' +
      (n.discount > 0 ? '<div class="ops-sheet-kv"><span>首发立减</span><b style="color:var(--error);">- ' + money(n.discount) + '</b></div>' : '') +
      (n.credit > 0 ? '<div class="ops-sheet-kv"><span>原方案剩余价值抵扣</span><b style="color:var(--success);">- ' + money(n.credit) + '</b></div>' : '') +
      '<div class="ops-sheet-kv"><span>可用余额</span><b>' + money(bal) + '</b></div>' +
      '</div>';
    var recharge = short > 0 ? '<div class="ops-recharge"><span style="font-size:10px;color:var(--text-3);width:100%;">余额不足 ' + money(short) + '，可先充值（演示）：</span>' +
      '<button data-act="quick-recharge" data-val="100">+¥100</button><button data-act="quick-recharge" data-val="200">+¥200</button><button data-act="quick-recharge" data-val="500">+¥500</button></div>' : '';
    var payBtn = short > 0 ?
      '<button class="btn btn-primary btn-block" data-act="co-pay" style="margin-top:12px;">余额不足 · 充值后支付</button>' :
      '<button class="btn btn-primary btn-block" data-act="co-pay" style="margin-top:12px;">确认支付 ' + money(n.pay) + '</button>';
    s.html('<div class="ops-sheet-plan"><div><b>' + esc(n.plan.name) + '</b><span>' + esc(n.plan.blurb || '') + '</span></div><span class="price">' + (n.pay > 0 ? money(n.pay) : '免费') + '</span></div>' +
      billingBtns + lines +
      '<div class="ops-co-total"><span>应付金额</span><b>' + money(n.pay) + '</b></div>' + recharge +
      '<div class="ops-sheet-note">' + (state.co.mode === 'upgrade' ? '升级后剩余周期重新计算，原方案未使用的置顶与线索额度保留。' : '支付成功后立即生效；置顶与线索额度同步发放。开通即生效，不支持退款。') + '</div>' +
      payBtn);
  }
  function payCheckout() {
    if (!state.co) return;
    var n = coNumbers();
    if (!n) return;
    if (BalanceStore.available() < n.pay) { toast('余额不足，请先充值', 'err'); return; }
    var r;
    if (state.co.mode === 'upgrade') r = OpsStore.upgrade(state.co.key, state.coBilling);
    else if (state.co.mode === 'convert') r = OpsStore.convertTrial(state.coBilling);
    else r = OpsStore.subscribe(state.co.key, state.coBilling);
    if (r && r.error) { toast(r.error, 'err'); return; }
    var cur = OpsStore.current();
    if (cur) state.planSel = cur.planKey;
    if (state.coSheet) { try { state.coSheet.close(); } catch (e) {} state.coSheet = null; }
    renderAll();
    var title = state.co.mode === 'upgrade' ? '升级成功' : (state.co.mode === 'convert' ? '已转为正式方案' : '开通成功');
    openSheet(title, '<div class="ops-success"><div class="ops-success-ic">' + ic('check') + '</div><b>' + esc(n.plan.name) + ' 已生效</b>' +
      '<p>额度已发放到你的权益账户，可在「增强发布」中使用置顶名额，或在「经营工具」里直接开始工作。</p></div>' +
      '<button class="btn btn-primary btn-block" data-act="close-sheet">开始使用</button>');
  }

  function submitTicket() {
    var detail = ($('ops-ticket-detail') || {}).value || '';
    if (!detail.trim()) { toast('请填写详细描述', 'err'); return; }
    var subject = ($('ops-ticket-subject') || {}).value || '';
    var t = OpsStore.createTicket({
      subject: subject.trim() || (state.tkCat + '问题'),
      category: state.tkCat, priority: state.tkPriority, detail: detail.trim()
    });
    closeSheet();
    toast('工单已提交', 'ok');
    renderAll();
    setTimeout(function () { openTicketSheet(t.id); }, 300);
  }
  function paintTicket() {
    var s = state.ticketSheet;
    if (!s || !state.ticketId) return;
    var t = OpsStore.ticket(state.ticketId);
    if (!t) return;
    var msgs = t.messages.map(function (m) {
      return '<div class="ops-msg ' + (m.from === 'me' ? 'me' : 'agent') + '">' +
        (m.from === 'agent' ? '<span class="ops-msg-name">' + esc(m.name || '专属顾问') + '</span>' : '') +
        esc(m.text) + '<span class="ops-msg-time">' + dateTime(m.ts) + '</span></div>';
    }).join('');
    var resolved = t.status === 'resolved';
    s.html('<div class="ops-ticket-meta"><span class="tag tag-gray">' + esc(t.category) + '</span>' +
      '<span class="tag ' + (t.priority === 'urgent' ? 'tag-red' : (t.priority === 'high' ? 'tag-primary' : 'tag-gray')) + '">' + (t.priority === 'urgent' ? '紧急' : (t.priority === 'high' ? '高优先级' : '普通')) + '</span>' +
      '<span class="tag ' + (resolved ? 'tag-supply' : 'tag-primary') + '">' + (resolved ? '已解决' : '处理中') + '</span>' +
      '<span style="font-size:9px;color:var(--text-3);margin-left:auto;">' + esc(t.no) + '</span></div>' +
      '<div style="font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:8px;">' + esc(t.subject) + '</div>' +
      '<div class="ops-ticket-msg">' + msgs + '</div>' +
      (resolved ? '<button class="btn btn-ghost btn-block" style="margin-top:10px;" data-act="ticket-reopen">重新打开</button>' :
        '<div style="margin-top:10px;"><textarea class="textarea" id="ops-ticket-reply" placeholder="继续补充信息..."></textarea>' +
        '<div class="btn-row" style="margin-top:8px;"><button class="btn btn-primary btn-sm" data-act="ticket-reply">发送</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="ticket-resolve">标记解决</button></div></div>') +
      '<div class="ops-sheet-note">工单处理记录会保留在「专属服务」中，可随时追问。</div>');
  }
  function openTicketSheet(id) {
    state.ticketId = id;
    state.ticketSheet = openSheet('工单详情', '');
    paintTicket();
  }

  /* ============================================================
     推送操作
     ============================================================ */
  function prefsNow() { return OpsStore.pushPrefs(); }
  function savePrefs(patch) {
    var r = OpsStore.savePushPrefs(patch);
    if (r && r.error) toast(r.error, 'err');
    else renderPillars();
  }
  function maxCats(plan) {
    if (hasFeature(plan, 'push.custom')) return 99;
    if (hasFeature(plan, 'push.cats1')) return 1;
    return 2;
  }
  function syncAutoTimer() {
    var d = activeData();
    var prefs = OpsStore.pushPrefs();
    var on = d.active && !isStaff() && prefs.autoDemo && prefs.enabled;
    if (on && !state.autoTimer) {
      state.autoTimer = setInterval(function () {
        if (state.tab !== 'push') return;
        var cur = OpsStore.pushPrefs();
        if (!cur.enabled || !cur.autoDemo) return;
        var r = OpsStore.simulatePush();
        if (r && !r.error) {
          renderPillars();
          toast('收到一条系统推送', 'ok');
        }
      }, 20000);
    } else if (!on && state.autoTimer) {
      clearInterval(state.autoTimer);
      state.autoTimer = null;
    }
  }

  /* ============================================================
     渲染与事件
     ============================================================ */
  function renderSectionHeads() {
    var sub = isStaff() ? null : OpsStore.current();
    var pt = $('plans-title'), ps = $('plans-sub');
    if (pt) pt.textContent = sub ? '续费与升级' : '选择适合你的方案';
    if (ps) ps.textContent = sub ? '权益已生效，续费或升级到更高档位' : '月付灵活，年付省 2 个月';
    var lt = $('pillars-title'), ls = $('pillars-sub');
    if (lt) lt.textContent = sub ? '我的经营权益' : '你会得到什么';
    if (ls) ls.textContent = sub ? '发布、推送、工具与服务，点开即可使用' : '四类权益按身份组合，开通后立即可用';
  }
  function arrangeSections() {
    var plansSec = $('plans-sec'), ordersSec = $('orders-sec'), pillarsSec = $('pillars-sec');
    if (!plansSec || !ordersSec) return;
    var sub = isStaff() ? null : OpsStore.current();
    if (sub) {
      if (ordersSec.nextElementSibling !== plansSec) ordersSec.parentNode.insertBefore(plansSec, ordersSec.nextSibling);
    } else if (pillarsSec && pillarsSec.nextElementSibling !== plansSec) {
      pillarsSec.parentNode.insertBefore(plansSec, pillarsSec.nextSibling);
    }
  }
  function renderAll() {
    renderHero();
    renderIntro();
    renderSectionHeads();
    renderNeeds();
    renderPillars();
    renderPlans();
    renderAddons();
    renderOrders();
    renderFaq();
    arrangeSections();
  }

  function startTrial() {
    UI.dialog({
      title: '领取 7 天体验', text: '体验包含 1 个置顶名额、5 条线索与 15 次 AI 文案。体验期内不自动续费，每个身份限领一次。',
      ok: '立即领取', cancel: '再想想',
      onOk: function () {
        var r = OpsStore.startTrial();
        if (r && r.error) return toast(r.error, 'err');
        var cur = OpsStore.current();
        if (cur) state.planSel = cur.planKey;
        toast('7 天体验已开启', 'ok');
        renderAll();
        openSheet('体验已开启', '<div class="ops-success"><div class="ops-success-ic">' + ic('sparkle') + '</div><b>7 天体验已生效</b><p>核心权益已发放。体验结束前可随时转为正式方案，数据会保留。</p></div>' +
          '<button class="btn btn-primary btn-block" data-act="close-sheet">开始使用</button>');
      }
    });
  }
  function upgradeAuto() {
    var sub = OpsStore.current();
    if (!sub) return toast('暂无运营包', 'warn');
    var r = OpsStore.setAutoRenew(!sub.autoRenew);
    if (r && r.error) return toast(r.error, 'err');
    toast(sub.autoRenew ? '已关闭自动续费' : '已开启自动续费', 'ok');
    renderHero();
    paintManage();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var val = el.getAttribute('data-val') || '';
    if (!act) return;
    e.preventDefault();
    switch (act) {
      case 'billing': state.billing = val; renderPlans(); renderHero(); break;
      case 'plan-sel': state.planSel = val; renderPlans(); break;
      case 'tab': state.tab = val; renderPillars(); break;
      case 'scroll': {
        var map = { plans: 'plans-sec', pillars: 'pillars-sec', addons: 'addons', orders: 'orders-sec' };
        var sec = $(map[val] || val);
        if (sec && sec.scrollIntoView) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        break;
      }
      case 'need': if (val && val !== '#') location.href = val; break;
      case 'go': if (val) location.href = val; break;
      case 'go-login': location.href = '../auth/login.html'; break;
      case 'go-auth': location.href = '../profile/auth.html'; break;
      case 'go-publish': location.href = '../publish/index.html'; break;
      case 'trial': startTrial(); break;
      case 'plan-detail': openPlanSheet(val); break;
      case 'compare': openCompareSheet(); break;
      case 'checkout': openCheckoutSheet(val, 'subscribe'); break;
      case 'upgrade': openCheckoutSheet(val, 'upgrade'); break;
      case 'convert': openCheckoutSheet((OpsStore.current() || {}).planKey, 'convert'); break;
      case 'renew': openRenewSheet(); break;
      case 'manage': openManageSheet(); break;
      case 'all-orders': case 'order-list': openOrdersSheet(); break;
      case 'order': openOrderSheet(val); break;
      case 'refund': doRefund(val); break;
      case 'toggle-auto': upgradeAuto(); break;
      case 'co-billing': state.coBilling = val; paintCheckout(); break;
      case 'co-pay': payCheckout(); break;
      case 'quick-recharge': {
        BalanceStore.recharge(num(val), 'wechat', { remark: '演示充值 · 运营包' });
        toast('余额已充值 ' + money(val), 'ok');
        renderAll();
        if (state.coSheet) paintCheckout();
        break;
      }
      case 'do-renew': {
        var r = OpsStore.renew();
        if (r && r.error) return toast(r.error, 'err');
        toast('已续费，有效期顺延 ' + ((OpsStore.current() || {}).days || 30) + ' 天', 'ok');
        closeSheet();
        renderAll();
        break;
      }
      case 'addon': openAddonSheet(val); break;
      case 'do-addon': doAddon(val); break;
      case 'top-pick': openTopPickSheet(); break;
      case 'top-use': useTop(val, el.getAttribute('data-title') || ''); break;
      case 'tool': openTool(val); break;
      case 'close-sheet': closeSheet(); break;
      case 'kefu': if (window.openKefu) openKefu(); else toast('400-880-6688', 'ok'); break;
      case 'call': toast('演示环境不发起通话，专属热线：' + (val || '400-880-6688'), 'ok'); break;
      case 'chat-quick': doChat(val); break;
      case 'chat-send': {
        var inp = $('ops-chat-input');
        doChat(inp ? inp.value : '');
        break;
      }
      case 'chat-ticket': {
        var ct = OpsStore.chatToTicket();
        if (ct && ct.error) return toast(ct.error, 'warn');
        toast('已转为工单', 'ok');
        renderAll();
        if (ct.ticket) setTimeout(function () { openTicketSheet(ct.ticket.id); }, 300);
        break;
      }
      case 'ticket-new': openTicketCreateSheet(); break;
      case 'ticket': openTicketSheet(val); break;
      case 'ticket-submit': submitTicket(); break;
      case 'ticket-reply': {
        var ta = $('ops-ticket-reply');
        var rr = OpsStore.replyTicket(state.ticketId, ta ? ta.value : '');
        if (rr && rr.error) return toast(rr.error, 'err');
        paintTicket(); renderPillars();
        break;
      }
      case 'ticket-resolve': OpsStore.resolveTicket(state.ticketId); paintTicket(); renderPillars(); break;
      case 'ticket-reopen': OpsStore.reopenTicket(state.ticketId); paintTicket(); renderPillars(); break;
      case 'tk-cat': {
        state.tkCat = val;
        var box = el.parentNode;
        if (box) Array.prototype.forEach.call(box.querySelectorAll('[data-act="tk-cat"]'), function (b) { b.classList.toggle('on', b === el); });
        break;
      }
      case 'tk-pri': {
        state.tkPriority = val;
        var box2 = el.parentNode;
        if (box2) Array.prototype.forEach.call(box2.querySelectorAll('[data-act="tk-pri"]'), function (b) { b.classList.toggle('on', b === el); });
        break;
      }
      case 'staff-group': state.previewGroup = val; state.tab = 'publish'; renderAll(); break;
      case 'push-enabled': {
        if (isStaff()) return;
        savePrefs({ enabled: !prefsNow().enabled });
        break;
      }
      case 'push-freq': {
        if (isStaff()) return;
        var d0 = activeData();
        if (val === 'realtime' && !hasFeature(d0.plan, 'push.realtime')) return toast('实时推送需专业版及以上', 'warn');
        savePrefs({ frequency: val });
        toast(val === 'realtime' ? '已开启实时推送' : (val === 'daily' ? '已切换为每日摘要' : '已切换为每周摘要'), 'ok');
        break;
      }
      case 'push-channel': {
        if (isStaff()) return;
        var d1 = activeData();
        if (val === 'sms' && !hasFeature(d1.plan, 'push.sms')) return toast('短信通道需专业版及以上', 'warn');
        if (val === 'wechat' && !hasFeature(d1.plan, 'push.wechat')) return toast('微信通道需专业版及以上', 'warn');
        if (val === 'app') { toast('站内推送默认开启', 'ok'); return; }
        var p = prefsNow();
        var channels = Object.assign({}, p.channels);
        channels[val] = !channels[val];
        savePrefs({ channels: channels });
        toast((val === 'sms' ? '短信' : '微信') + (channels[val] ? '通道已开启' : '通道已关闭'), 'ok');
        break;
      }
      case 'push-cat': {
        if (isStaff()) return;
        var d2 = activeData();
        var p2 = prefsNow();
        var cats = p2.cats.slice();
        var idx = cats.indexOf(val);
        if (idx >= 0) cats.splice(idx, 1);
        else {
          var max = maxCats(d2.plan);
          if (cats.length >= max) return toast('当前方案最多订阅 ' + max + ' 个品类，升级可多选', 'warn');
          cats.push(val);
        }
        savePrefs({ cats: cats });
        break;
      }
      case 'push-auto': {
        if (isStaff()) return;
        var p3 = prefsNow();
        savePrefs({ autoDemo: !p3.autoDemo });
        toast(p3.autoDemo ? '已关闭自动演示' : '已开启自动演示，每 20 秒一条', 'ok');
        break;
      }
      case 'push-save': toast('推送偏好已保存', 'ok'); break;
      case 'push-read': {
        OpsStore.markPushRead(val);
        renderPillars();
        break;
      }
      case 'push-sim': {
        if (isStaff()) return toast('内部预览不实际发送', 'warn');
        if (!prefsNow().enabled) return toast('已关闭推送，请先开启接收', 'warn');
        var rp = OpsStore.simulatePush();
        if (rp && rp.error) return toast(rp.error, 'warn');
        renderPillars();
        toast('已模拟接收一条系统推送', 'ok');
        break;
      }
      case 'ai-gen': generateAi(); break;
      case 'copy-ai': {
        var txt = val;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () { toast('已复制', 'ok'); }, function () { toast('请长按选择复制', 'warn'); });
        } else toast('请长按选择复制', 'warn');
        break;
      }
      case 'quote-gen': generateQuote(); break;
      case 'crm-next': {
        var lead = LeadStore.byId(val);
        var curStatus = lead ? lead.status : demoLead.status[val];
        if (!curStatus) { toast('该线索已不在列表中', 'warn'); return; }
        var next = curStatus === 'new' ? 'contacted' : (curStatus === 'contacted' ? 'quoted' : 'done');
        if (lead) LeadStore.setStatus(val, next);
        else demoLead.status[val] = next;
        toast('已更新为' + ({ contacted: '已联系', quoted: '已报价', done: '已成交' }[next] || '已更新'), 'ok');
        if (state.toolSheet) state.toolSheet.html(crmBody(isStaff()));
        break;
      }
      case 'policy-cat': state.policyCat = val; if (state.toolSheet) state.toolSheet.html(policyBody()); break;
      case 'noop': break;
      default: break;
    }
  }, false);

  document.addEventListener('change', function (e) {
    var el = e.target.closest ? e.target.closest('[data-push-field]') : null;
    if (!el) return;
    var f = el.getAttribute('data-push-field');
    if (f === 'region') savePrefs({ region: el.value });
    else if (f === 'quietFrom') savePrefs({ quiet: { from: el.value } });
    else if (f === 'quietTo') savePrefs({ quiet: { to: el.value } });
  }, false);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target && e.target.id === 'ops-chat-input') {
      e.preventDefault();
      doChat(e.target.value);
    }
  }, false);

  function doChat(text) {
    if (!text || !String(text).trim()) { toast('请输入内容', 'warn'); return; }
    var r = OpsStore.sendChat(text);
    if (r && r.error) { toast(r.error, 'warn'); return; }
    var inp = $('ops-chat-input');
    if (inp) inp.value = '';
    state.chatScroll = true;
    renderPillars();
  }

  /* ---- 启动 ---- */
  renderAll();
  window.addEventListener('engchain:ops', renderAll);
  window.addEventListener('engchain:upgrades', renderAll);
  window.addEventListener('engchain:balance', function () { renderHero(); renderPlans(); if (state.coSheet) paintCheckout(); });
  window.addEventListener('beforeunload', function () { if (state.autoTimer) clearInterval(state.autoTimer); });
})();
</script>
</body>
</html>
