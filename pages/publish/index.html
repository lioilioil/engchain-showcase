<!DOCTYPE html>

<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/publish/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">

<title>信息工作台 · 工程链</title>

<style>
  .workbench-head { padding: 18px 16px 16px; background: linear-gradient(135deg, var(--bg-elev), var(--primary-soft)); border-bottom: 1px solid var(--line); }
  .workbench-kicker { color: var(--primary-dim); font: 600 11px var(--font-num); letter-spacing: .1em; text-transform: uppercase; }
  .workbench-title { margin-top: 5px; font-size: 25px; font-weight: 700; }
  .workbench-sub { margin-top: 5px; color: var(--text-2); font-size: 12px; }
  .wb-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .wb-action { display: flex; align-items: center; gap: 9px; min-height: 52px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-card); color: var(--text-1); text-decoration: none; box-shadow: var(--shadow-sm); transition: transform var(--d-fast), border-color var(--d-fast); }
  .wb-action:hover { transform: translateY(-1px); border-color: var(--primary); }
  .wb-action:active { transform: scale(.98); }
  .wb-action:focus-visible, .wb-link:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
  .wb-action svg { width: 20px; height: 20px; color: var(--primary-dim); }
  .wb-action strong { display: block; font-size: 13px; }
  .wb-action span { display: block; margin-top: 2px; color: var(--text-3); font-size: 10px; }
  .wb-section { margin: 16px 16px 0; }
  .wb-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .wb-section-title { font-size: 14px; font-weight: 700; }
  .wb-link { color: var(--primary-dim); font-size: 11px; text-decoration: none; }
  .wb-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--line); }
  .wb-stat { min-width: 0; padding: 12px 5px; text-align: center; background: var(--bg-card); }
  .wb-stat strong { display: block; color: var(--text-1); font: 700 20px var(--font-num); }
  .wb-stat span { display: block; margin-top: 3px; color: var(--text-3); font-size: 10px; white-space: nowrap; }
  .wb-task { display: flex; align-items: center; gap: 11px; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-card); text-decoration: none; color: var(--text-1); transition: transform var(--d-fast), border-color var(--d-fast); }
  .wb-task + .wb-task { margin-top: 8px; }
  .wb-task:hover { transform: translateY(-1px); border-color: var(--primary); }
  .wb-task svg { width: 19px; height: 19px; color: var(--primary-dim); }
  .wb-task-main { flex: 1; min-width: 0; }
  .wb-task-title { font-size: 13px; font-weight: 600; }
  .wb-task-sub { overflow: hidden; margin-top: 3px; color: var(--text-3); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .wb-task-count { color: var(--primary-dim); font: 700 16px var(--font-num); }
  .wb-empty { padding: 17px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); color: var(--text-3); font-size: 12px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .wb-action, .wb-task { transition: none; } }
</style>
</head>
<body data-tab="workbench">
<div class="phone">
  <!-- 身份门控：未登录 -->
  <div id="pub-gate-login" style="display:none;text-align:center;padding:60px 24px;">
    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
      <svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-user"/></svg>
    </div>
    <div class="fw-700" style="font-size:17px;margin-top:16px;">登录后使用信息工作台</div>
    <div class="text-3" style="font-size:12px;margin-top:8px;line-height:1.7;">登录后可发布供需信息、管理草稿与发布记录、查看对接进展。</div>
    <a href="../auth/login.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">立即登录</a>
  </div>

    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
      <svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-shield"/></svg>
    </div>
    <div class="fw-700" style="font-size:17px;margin-top:16px;">实名认证后可发布信息</div>
    <div class="text-3" style="font-size:12px;margin-top:8px;line-height:1.7;">完成实名认证后，即可发布供需信息并参与平台对接。</div>

      <div class="wb-actions">
        <a class="wb-action" href="editor.html?role=demand"><svg class="ic"><use href="#i-search"/></svg><div><strong>发布需求</strong><span>寻找供应与服务</span></div></a>

      <a class="wb-task" href="records.html"><svg class="ic"><use href="#i-doc"/></svg><div class="wb-task-main"><div class="wb-task-title">我的发布</div><div class="wb-task-sub">查看状态、匹配进展和咨询反馈</div></div><span class="wb-task-count" id="record-count">0</span><span class="text-3">›</span></a>
      <a class="wb-task" href="drafts.html"><svg class="ic"><use href="#i-edit"/></svg><div class="wb-task-main"><div class="wb-task-title">草稿箱</div><div class="wb-task-sub">继续完成尚未发布的信息</div></div><span class="wb-task-count" id="draft-count">0</span><span class="text-3">›</span></a>
      <a class="wb-task" href="unlocked.html"><svg class="ic"><use href="#i-lock"/></svg><div class="wb-task-main"><div class="wb-task-title">已解锁线索</div><div class="wb-task-sub">查看有效期、详情与关联订单</div></div><span class="wb-task-count" id="unlock-count">0</span><span class="text-3">›</span></a>
      <a class="wb-task" href="../favorite/index.html"><svg class="ic"><use href="#i-star"/></svg><div class="wb-task-main"><div class="wb-task-title">我的收藏</div><div class="wb-task-sub">收藏的职位 / 项目 / 供应</div></div><span class="wb-task-count" id="favorite-count">0</span><span class="text-3">›</span></a>
    </section>
    <section class="wb-section" aria-labelledby="wb-action-title">
      <div class="wb-section-head"><h2 class="wb-section-title" id="wb-action-title">待处理</h2><a class="wb-link" href="records.html">查看全部</a></div>
      <div id="wb-pending"></div>
    </section>
  </div>
  </div>
</div>

<script src="../../js/data.js"></script>

<script>
(function () {
  window.__ROOT__ = '../../';
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (st.loggedIn === false) {
      if (content) content.style.display = 'none';
      if (gateLogin) gateLogin.style.display = '';
      return false;
    }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) {
      if (content) content.style.display = 'none';
      if (gateReal) gateReal.style.display = '';
      return false;
    }
    return true;
  }
  if (!checkPublishAuth()) return;

  function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function unlockCount() { try { return Object.keys(JSON.parse(localStorage.getItem('engchain-unlocked') || '{}')).length; } catch (e) { return 0; } }
  function favoriteCount() { try { return (window.FavoriteStore && FavoriteStore.list) ? FavoriteStore.list().length : 0; } catch (e) { return 0; } }
  var s = PublishStore.stats();
  document.getElementById('record-count').textContent = s.records.length;
  document.getElementById('draft-count').textContent = s.drafts.length;
  document.getElementById('unlock-count').textContent = unlockCount();
  document.getElementById('favorite-count').textContent = favoriteCount();
  document.getElementById('wb-summary').innerHTML = [
    { n: s.active, l: '已发布' },
    { n: s.drafts.length, l: '草稿' },
    { n: s.matches, l: '新匹配' },
    { n: s.inquiries, l: '待咨询' }
  ].map(function (item) { return '<div class="wb-stat"><strong>' + item.n + '</strong><span>' + item.l + '</span></div>'; }).join('');
  var box = document.getElementById('wb-pending');
  if (s.pending.length) {
    box.innerHTML = s.pending.slice(0, 4).map(function (r) {
      var badge = r.inquiries > 0 ? r.inquiries : (PublishStore.STATUS[r.status] || r.status);
      return '<a class="wb-task" href="../supply/detail.html?id=' + encodeURIComponent(r.id || '') + '"><svg class="ic"><use href="#i-doc"/></svg>' +
        '<div class="wb-task-main"><div class="wb-task-title">' + esc(r.title) + '</div>' +
        '<div class="wb-task-sub">' + (r.inquiries > 0 ? '有 ' + r.inquiries + ' 条咨询待处理' : '审核中，等待平台确认') + '</div></div>' +
        '<span class="wb-task-count">' + esc(badge) + '</span><span class="text-3">›</span></a>';
    }).join('');
  } else {
    box.innerHTML = '<div class="wb-empty">暂无新的待处理事项</div>';
  }
})();
</script>
</body>
