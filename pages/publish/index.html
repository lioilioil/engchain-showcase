<script data-engchain-basefix="2">

function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

<title>信息工作台 · 工程链</title>

<style>
  /* 顶部头部 · 渐变毛玻璃 + 装饰光晕 */
  .workbench-head { position: relative; padding: 20px 16px 18px; background: linear-gradient(160deg, var(--primary-soft) 0%, var(--bg-elev) 55%, var(--bg-page) 100%); border-bottom: 1px solid var(--line); overflow: hidden; }
  .workbench-head::before { content: ''; position: absolute; top: -40px; right: -30px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); opacity: .12; pointer-events: none; }
  .workbench-head::after { content: ''; position: absolute; bottom: -50px; left: -20px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity: .08; pointer-events: none; }
  .workbench-kicker { position: relative; z-index: 1; color: var(--primary-dim); font: 600 10.5px var(--font-num); letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .workbench-kicker::before { content: ''; width: 16px; height: 1.5px; background: var(--primary-dim); border-radius: 1px; opacity: .6; }
  .workbench-title { position: relative; z-index: 1; margin-top: 8px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; background: linear-gradient(135deg, var(--text-1) 0%, var(--primary-dim) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .workbench-sub { position: relative; z-index: 1; margin-top: 6px; color: var(--text-2); font-size: 12px; line-height: 1.5; }
  /* 发布操作按钮 · 精致卡片 */
  .wb-actions { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .wb-action { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--bg-card); color: var(--text-1); text-decoration: none; box-shadow: var(--shadow-sm); transition: transform var(--d-fast) var(--e-standard), border-color var(--d-fast), box-shadow var(--d-fast); position: relative; overflow: hidden; }
  .wb-action::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0; transition: opacity var(--d-fast); }
  .wb-action:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-card); }
  .wb-action:hover::before { opacity: 1; }
  .wb-action:active { transform: scale(.98); }
  .wb-action:focus-visible, .wb-link:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
  .wb-action-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft)); }
  .wb-action-ic svg { width: 18px; height: 18px; color: var(--primary-dim); }
  .wb-action strong { display: block; font-size: 13.5px; font-weight: 700; }
  .wb-action span { display: block; margin-top: 2px; color: var(--text-3); font-size: 10px; }
  /* 区块标题 */
  .wb-section { margin: 18px 16px 0; }
  .wb-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .wb-section-title { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .wb-section-title::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, var(--primary), var(--accent)); }
  .wb-link { color: var(--primary-dim); font-size: 11px; text-decoration: none; display: flex; align-items: center; gap: 2px; font-weight: 500; }
  .wb-link::after { content: '›'; font-size: 13px; }
  /* 统计卡片 · 精致四宫格 */
  .wb-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .wb-stat { min-width: 0; padding: 14px 6px; text-align: center; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); position: relative; overflow: hidden; transition: transform var(--d-fast), border-color var(--d-fast); }
  .wb-stat:hover { transform: translateY(-1px); border-color: var(--primary); }
  .wb-stat::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 2px; border-radius: 0 0 2px 2px; background: var(--primary); opacity: .6; }
  .wb-stat:nth-child(2)::before { background: var(--accent); }
  .wb-stat:nth-child(3)::before { background: var(--success); }
  .wb-stat:nth-child(4)::before { background: var(--warning); }
  .wb-stat-ic { width: 22px; height: 22px; margin: 0 auto 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); }
  .wb-stat:nth-child(2) .wb-stat-ic { background: var(--accent-soft); }
  .wb-stat:nth-child(3) .wb-stat-ic { background: var(--success-soft); }
  .wb-stat:nth-child(4) .wb-stat-ic { background: var(--warning-soft); }
  .wb-stat-ic svg { width: 12px; height: 12px; color: var(--primary-dim); }
  .wb-stat:nth-child(2) .wb-stat-ic svg { color: var(--accent); }
  .wb-stat:nth-child(3) .wb-stat-ic svg { color: var(--success); }
  .wb-stat:nth-child(4) .wb-stat-ic svg { color: var(--warning); }
  .wb-stat strong { display: block; color: var(--text-1); font: 700 20px var(--font-num); line-height: 1; }
  .wb-stat span { display: block; margin-top: 5px; color: var(--text-3); font-size: 10px; white-space: nowrap; }
  /* 信息管理列表项 */
  .wb-task { display: flex; align-items: center; gap: 12px; padding: 14px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-card); text-decoration: none; color: var(--text-1); transition: transform var(--d-fast) var(--e-standard), border-color var(--d-fast), box-shadow var(--d-fast); position: relative; }
  .wb-task + .wb-task { margin-top: 8px; }
  .wb-task:hover { transform: translateX(3px); border-color: var(--primary); box-shadow: var(--shadow-sm); }
  .wb-task-ic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--primary-soft); }
  .wb-task:nth-child(2) .wb-task-ic { background: var(--accent-soft); }
  .wb-task:nth-child(3) .wb-task-ic { background: var(--success-soft); }
  .wb-task:nth-child(4) .wb-task-ic { background: var(--warning-soft); }
  .wb-task-ic svg { width: 18px; height: 18px; color: var(--primary-dim); }
  .wb-task:nth-child(2) .wb-task-ic svg { color: var(--accent); }
  .wb-task:nth-child(3) .wb-task-ic svg { color: var(--success); }
  .wb-task:nth-child(4) .wb-task-ic svg { color: var(--warning); }
  .wb-task-main { flex: 1; min-width: 0; }
  .wb-task-title { font-size: 13px; font-weight: 600; }
  .wb-task-sub { overflow: hidden; margin-top: 3px; color: var(--text-3); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .wb-task-count { color: var(--primary-dim); font: 700 15px var(--font-num); background: var(--primary-soft); padding: 3px 9px; border-radius: var(--r-full); min-width: 28px; text-align: center; }
  .wb-empty { padding: 24px 17px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); color: var(--text-3); font-size: 12px; text-align: center; background: var(--bg-card-2); }
  .wb-empty-ic { width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 50%; background: var(--bg-card); display: flex; align-items: center; justify-content: center; }
  .wb-empty-ic svg { width: 20px; height: 20px; color: var(--text-4); }
  @media (prefers-reduced-motion: reduce) { .wb-action, .wb-task, .wb-stat { transition: none; } }
</style>
</head>

<script>
(function () {
  window.__ROOT__ = '../../';
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (st.loggedIn === false) {
      if (content) content.style.display = 'none';
      if (gateLogin) gateLogin.style.display = '';
      return false;
    }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) {
      if (content) content.style.display = 'none';
      if (gateReal) gateReal.style.display = '';
      return false;
    }
    return true;
  }
  if (!checkPublishAuth()) return;

  /* 发布供应防呆：非入驻中介企业提示「中介服务需入驻」 */
  (function () {
    var isAgency = false;
    try { isAgency = !!(window.entryAccess && entryAccess().agency); } catch (e) {}
    if (isAgency) return;
    var btn = document.getElementById('wb-supply');
    if (!btn) return;
    var sub = btn.querySelector('span');
    if (sub) sub.innerHTML = '展示资源与能力 <em style="font-style:normal;color:var(--warning);font-size:9.5px;display:block;margin-top:1px;">中介服务需入驻中介企业</em>';
  })();

  function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function unlockCount() { try { return Object.keys(JSON.parse(localStorage.getItem('engchain-unlocked') || '{}')).length; } catch (e) { return 0; } }
  function favoriteCount() { try { return (window.FavoriteStore && FavoriteStore.list) ? FavoriteStore.list().length : 0; } catch (e) { return 0; } }
  var s = PublishStore.stats();
  document.getElementById('record-count').textContent = s.records.length;
  document.getElementById('draft-count').textContent = s.drafts.length;
  document.getElementById('unlock-count').textContent = unlockCount();
  document.getElementById('favorite-count').textContent = favoriteCount();
  document.getElementById('wb-summary').innerHTML = [
    { n: s.active, l: '已发布', ic: 'i-doc' },
    { n: s.drafts.length, l: '草稿', ic: 'i-edit' },
    { n: s.matches, l: '新匹配', ic: 'i-search' },
    { n: s.inquiries, l: '待咨询', ic: 'i-chat' }
  ].map(function (item) { return '<div class="wb-stat"><div class="wb-stat-ic"><svg class="ic"><use href="#' + item.ic + '"/></svg></div><strong>' + item.n + '</strong><span>' + item.l + '</span></div>'; }).join('');
  var box = document.getElementById('wb-pending');
  if (s.pending.length) {
    box.innerHTML = s.pending.slice(0, 4).map(function (r) {
      var badge = r.inquiries > 0 ? r.inquiries : (PublishStore.STATUS[r.status] || r.status);
      return '<a class="wb-task" href="../supply/detail.html?id=' + encodeURIComponent(r.id || '') + '"><div class="wb-task-ic"><svg class="ic"><use href="#i-doc"/></svg></div>' +
        '<div class="wb-task-main"><div class="wb-task-title">' + esc(r.title) + '</div>' +
        '<div class="wb-task-sub">' + (r.inquiries > 0 ? '有 ' + r.inquiries + ' 条咨询待处理' : '审核中，等待平台确认') + '</div></div>' +
        '<span class="wb-task-count">' + esc(badge) + '</span></a>';
    }).join('');
  } else {
    box.innerHTML = '<div class="wb-empty"><div class="wb-empty-ic"><svg class="ic"><use href="#i-check"/></svg></div>暂无新的待处理事项<br><span style="font-size:10px;color:var(--text-4);">所有事项均已处理完毕</span></div>';
  }
})();
</script>
