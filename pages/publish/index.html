<style>
  /* ================= 信息工作台 v3 · 主次分明的单页工作台 ================= */
  /* ---- 入场动效（stagger） ---- */
  @keyframes wb-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .wb-hero, .wb-sec { animation: wb-in .5s var(--e-standard) both; }
  .wb-sec:nth-of-type(2) { animation-delay: .07s; }
  .wb-sec:nth-of-type(3) { animation-delay: .13s; }
  .wb-sec:nth-of-type(4) { animation-delay: .19s; }
  @keyframes wb-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  .wb-primary { animation: wb-pop .55s var(--e-spring) .12s both; }

  /* ---- Hero：主行动 + 轻量次入口 ---- */
  .wb-hero { position: relative; padding: 22px 16px 20px; background: linear-gradient(165deg, var(--primary-soft) 0%, var(--bg-elev) 52%, var(--bg-page) 100%); border-bottom: 1px solid var(--line); overflow: hidden; }
  .wb-hero::before { content: ''; position: absolute; top: -46px; right: -26px; width: 168px; height: 168px; border-radius: 50%; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); opacity: .13; pointer-events: none; }
  .wb-hero::after { content: ''; position: absolute; bottom: -54px; left: -24px; width: 124px; height: 124px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity: .08; pointer-events: none; }
  .wb-kicker { position: relative; z-index: 1; color: var(--primary-dim); font: 600 10px var(--font-num); letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .wb-kicker::before { content: ''; width: 16px; height: 1.5px; background: var(--primary-dim); border-radius: 1px; opacity: .55; }
  .wb-title { position: relative; z-index: 1; margin-top: 8px; font-size: 24px; font-weight: 800; letter-spacing: -.01em; background: linear-gradient(135deg, var(--text-1) 0%, var(--primary-dim) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .wb-sub { position: relative; z-index: 1; margin-top: 5px; color: var(--text-2); font-size: 12px; line-height: 1.5; }

  /* 主行动按钮：唯一的大 CTA */
  .wb-primary { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; margin-top: 16px; height: 52px; padding: 0 18px; border-radius: 15px; text-decoration: none; background: linear-gradient(180deg, var(--primary-strong) 0%, var(--primary) 45%, var(--primary-dim) 100%); color: var(--text-inv); box-shadow: 0 8px 22px -6px rgba(184,153,104,.55), 0 1px 0 rgba(255,255,255,.35) inset, 0 0 0 1px rgba(184,153,104,.4); transition: transform var(--d-fast) var(--e-standard), box-shadow var(--d-fast), filter var(--d-fast); }
  .wb-primary:active { transform: scale(.975); box-shadow: 0 3px 10px -3px rgba(184,153,104,.5), 0 1px 0 rgba(255,255,255,.2) inset, 0 0 0 1px rgba(184,153,104,.5); }
  .wb-primary:hover { filter: brightness(1.04); box-shadow: 0 10px 26px -6px rgba(184,153,104,.62), 0 1px 0 rgba(255,255,255,.4) inset, 0 0 0 1px rgba(184,153,104,.5); }
  .wb-primary-ic { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; flex: none; }
  .wb-primary-ic svg { width: 16px; height: 16px; color: #fff; }
  .wb-primary b { flex: 1; font-size: 15.5px; font-weight: 700; letter-spacing: .01em; }
  .wb-primary-go { font-size: 19px; font-weight: 400; opacity: .85; }

  /* 次入口 chips：轻量、扁平，不与主 CTA 抢层级 */
  .wb-chips { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .wb-chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: var(--r-full); background: var(--bg-card); border: 1px solid var(--line); color: var(--text-1); text-decoration: none; font-size: 12px; font-weight: 600; transition: all var(--d-fast); box-shadow: var(--shadow-xs); }
  .wb-chip svg { width: 13px; height: 13px; color: var(--primary-dim); }
  .wb-chip:active { transform: scale(.95); }
  .wb-chip:hover { border-color: var(--primary); color: var(--primary-dim); }

  /* ---- 区块骨架 ---- */
  .wb-sec { margin: 18px 16px 0; }

  /* ---- 当前进展：一张大卡，主数据 + 迷你指标 ---- */
  .wb-advance { display: flex; align-items: stretch; border-radius: var(--r-l); overflow: hidden; background: var(--bg-card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
  .wb-adv-main { flex: 1.15; min-width: 0; padding: 16px 16px 14px; background: linear-gradient(150deg, var(--primary-soft) 0%, var(--bg-card) 78%); position: relative; overflow: hidden; }

  .wb-adv-mini b { font: 700 17px var(--font-num); color: var(--text-1); font-feature-settings: "tnum" 1; }

  /* ---- 管理工具：功能入口列表（一行一体，明确"去页面"） ---- */
  .wb-tools { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow-xs); }
  .wb-tool { display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-decoration: none; color: var(--text-1); transition: background var(--d-fast); position: relative; }
  .wb-tool + .wb-tool { border-top: 1px solid var(--line-hairline); }
  .wb-tool:active { background: var(--bg-card-2); }
  .wb-tool-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--primary-soft); color: var(--primary-dim); }
  .wb-tool:nth-child(2) .wb-tool-ic { background: var(--accent-soft); color: var(--accent); }
  .wb-tool:nth-child(3) .wb-tool-ic { background: var(--success-soft); color: var(--success); }
  .wb-tool:nth-child(4) .wb-tool-ic { background: var(--warning-soft); color: var(--warning); }
  .wb-tool:nth-child(5) .wb-tool-ic { background: rgba(139,92,246,.1); color: #8B5CF6; }
  .wb-tool-ic svg { width: 18px; height: 18px; }
  .wb-tool-main { flex: 1; min-width: 0; }
  .wb-tool-main b { display: block; font-size: 13.5px; font-weight: 600; }
  .wb-tool-main i { display: block; margin-top: 2px; color: var(--text-3); font-size: 11px; font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb-tool-count { flex: none; min-width: 26px; text-align: center; padding: 3px 8px; border-radius: var(--r-full); background: var(--bg-card-2); color: var(--text-2); font: 700 13px var(--font-num); }
  .wb-tool-count.has { background: var(--primary-soft); color: var(--primary-dim); }
  .wb-tool-arrow { flex: none; width: 13px; height: 13px; color: var(--text-4); transition: transform var(--d-fast); }
  .wb-tool:hover .wb-tool-arrow { transform: translateX(3px); color: var(--primary-dim); }

  /* ---- 待处理：内容富卡（与导航明确区分） ---- */
  .wb-item { display: block; padding: 13px 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-m); text-decoration: none; color: var(--text-1); box-shadow: var(--shadow-xs); transition: transform var(--d-fast) var(--e-standard), border-color var(--d-fast), box-shadow var(--d-fast); }
  .wb-item + .wb-item { margin-top: 8px; }
  .wb-item:hover { transform: translateY(-1px); border-color: var(--primary); box-shadow: var(--shadow-sm); }
  .wb-item:active { transform: scale(.985); }
  .wb-item-top { display: flex; align-items: flex-start; gap: 8px; }
  .wb-item-top b { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wb-item-badge { flex: none; padding: 3px 8px; border-radius: var(--r-full); font-size: 10px; font-weight: 600; white-space: nowrap; }
  .wb-item-badge.review { background: rgba(217,119,6,.1); color: var(--accent); }
  .wb-item-badge.ask { background: rgba(179,38,30,.1); color: var(--error); }
  .wb-item-sub { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb-item-sub svg { width: 11px; height: 11px; flex: none; opacity: .6; }

  .wb-empty { padding: 26px 17px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); color: var(--text-3); font-size: 12px; text-align: center; background: var(--bg-card-2); }

  .wb-empty-ic svg { width: 20px; height: 20px; color: var(--text-4); }

  @media (prefers-reduced-motion: reduce) {
    .wb-hero, .wb-sec, .wb-primary, .wb-tool, .wb-item, .wb-chip { animation: none !important; transition: none !important; }
  }
</style>

<script>
(function () {
  window.__ROOT__ = '../../';
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (!st.loggedIn) {
      if (window.GuestGate) { GuestGate.open({ mode:'replace', icon:'key', badge:'游客模式', title:'登录后使用信息工作台', note:'登录后可发布供需信息、管理草稿与发布记录、查看对接进展。', btnText:'立即登录', btnHref:'../auth/login.html' }); }
      return false;
    }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) {
      if (content) content.style.display = 'none';
      if (gateReal) gateReal.style.display = '';
      return false;
    }
    return true;
  }
  if (!checkPublishAuth()) return;

  function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function unlockCount() { try { return Object.keys(JSON.parse(localStorage.getItem('engchain-unlocked') || '{}')).length; } catch (e) { return 0; } }
  function favoriteCount() { try { return (window.FavoriteStore && FavoriteStore.list) ? FavoriteStore.list().length : 0; } catch (e) { return 0; } }

  /* 数字滚动动效（reduced-motion 时直接落值） */
  function countUp(el, target) {
    if (!el) return;
    target = Number(target) || 0;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = target; return; }
    var dur = 480, t0 = null;
    function frame(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* 发布入口身份化：主 CTA + 轻量 chips */
  (function renderActions() {
    var box = document.getElementById('wb-chips');
    var primary = document.getElementById('wb-primary-btn');
    if (!box) return;
    var acc = null;
    try { acc = window.entryAccess ? entryAccess() : null; } catch (e) { acc = null; }
    var per = acc && acc.identity ? acc.identity.personal : 'none';
    var ent = acc && acc.identity ? acc.identity.enterprise : 'none';
    var isEnt = ent === 'verified' || ent === 'resident';
    var isPro = per === 'professional';
    var isAgency = !!(acc && acc.agency);
    var chips = [];
    if (isEnt && !isAgency) chips.push({ href: 'editor.html?role=demand&cat=' + encodeURIComponent('招聘'), ic: 'i-user', t: '发布招聘' });
    if (isPro) chips.push({ href: 'editor.html?role=supply&cat=' + encodeURIComponent('求职'), ic: 'i-doc', t: '发布求职' });
    if (isAgency) chips.push({ href: '../agency/seller-board.html', ic: 'i-briefcase', t: '发布中介服务' });
    chips.push({ href: 'editor.html?role=supply', ic: 'i-upload', t: '发布供应' });
    box.innerHTML = chips.map(function (c) {
      return '<a class="wb-chip" href="' + c.href + '"><svg class="ic"><use href="#' + c.ic + '"/></svg>' + c.t + '</a>';
    }).join('');
    if (isAgency && primary) { primary.href = '../agency/seller-board.html'; primary.querySelector('b').textContent = '发布中介服务'; }
  })();

  /* 我的招聘任务卡：企业认证及以上显示（中介不发招聘），count=待处理投递 */
  (function () {
    var acc = null;
    try { acc = window.entryAccess ? entryAccess() : null; } catch (e) { acc = null; }
    var ent = acc && acc.identity ? acc.identity.enterprise : 'none';
    var isAgency = !!(acc && acc.agency);
    var t = document.getElementById('my-jobs-task');
    if (!t) return;
    if ((ent !== 'verified' && ent !== 'resident') || isAgency) { t.style.display = 'none'; return; }
    t.style.display = '';
    try {
      var m = window.DataBus && DataBus.current();
      var apps = (window.ApplyStore && m) ? ApplyStore.byPublisher(m.id) : [];
      var n = 0;
      apps.forEach(function (a) { if (a.status === 'pending') n++; });
      var c = document.getElementById('my-jobs-count');
      if (c) { c.textContent = n || '0'; if (n > 0) c.classList.add('has'); }
    } catch (e) {}
  })();
  window.addEventListener('engchain:apply', function () {
    var t = document.getElementById('my-jobs-task');
    if (t && t.style.display !== 'none') {
      try {
        var m = window.DataBus && DataBus.current();
        var apps = (window.ApplyStore && m) ? ApplyStore.byPublisher(m.id) : [];
        var n = 0;
        apps.forEach(function (a) { if (a.status === 'pending') n++; });
        var c = document.getElementById('my-jobs-count');
        if (c) { c.textContent = n || '0'; c.classList.toggle('has', n > 0); }
      } catch (e) {}
    }
  });

  var s = PublishStore.stats();
  function setCount(id, n, has) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = n;
    if (has) el.classList.add('has');
  }
  setCount('record-count', s.records.length, s.records.length > 0);
  setCount('draft-count', s.drafts.length, s.drafts.length > 0);
  setCount('unlock-count', unlockCount(), unlockCount() > 0);
  setCount('favorite-count', favoriteCount(), favoriteCount() > 0);

  /* 当前进展：大卡（主数据 + 迷你指标） */
  document.getElementById('wb-advance').innerHTML =
    '<div class="wb-adv-main">' +
      '<div class="wb-adv-label">已发布</div>' +
      '<div class="wb-adv-num" id="adv-num">0</div>' +
      '<div class="wb-adv-tip">' + (s.active > 0 ? '持续对接中，关注新的匹配与咨询' : '还没有已发布的信息，去发布第一条') + '</div>' +
    '</div>' +
    '<div class="wb-adv-mini">' +
      '<div><b id="mini-draft">0</b><span>草稿</span></div>' +
      '<div><b id="mini-match">0</b><span>新匹配</span></div>' +
      '<div><b id="mini-ask">0</b><span>待咨询</span></div>' +
    '</div>';
  countUp(document.getElementById('adv-num'), s.active);
  countUp(document.getElementById('mini-draft'), s.drafts.length);
  countUp(document.getElementById('mini-match'), s.matches);
  countUp(document.getElementById('mini-ask'), s.inquiries);

  /* 待处理：内容富卡（状态徽标 + 地点·时间） */
  var box = document.getElementById('wb-pending');
  if (s.pending.length) {
    box.innerHTML = s.pending.slice(0, 4).map(function (r) {
      var ask = (r.inquiries || 0) > 0;
      var badge = ask
        ? '<span class="wb-item-badge ask">' + r.inquiries + ' 条咨询</span>'
        : '<span class="wb-item-badge review">审核中</span>';
      var loc = r.location || '';
      var time = r.updatedAt || '';
      return '<a class="wb-item" href="../supply/detail.html?id=' + encodeURIComponent(r.id || '') + '">' +
        '<div class="wb-item-top"><b>' + esc(r.title) + '</b>' + badge + '</div>' +
        '<div class="wb-item-sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(loc) + '<span style="opacity:.5;flex:none;">·</span>' + esc(time) + '</div>' +
      '</a>';
    }).join('');
  } else {
    box.innerHTML = '<div class="wb-empty"><div class="wb-empty-ic"><svg class="ic"><use href="#i-check"/></svg></div>暂无新的待处理事项<br><span style="font-size:10px;color:var(--text-4);">所有事项均已处理完毕</span></div>';
  }
})();
</script>
<script src="../../js/liquid-dock.js"></script>
</body>
</html>
