<html lang="zh-CN">

function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一句话发布 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
.phone{--canvas:#F4F2EE;--world:#EFECE3;--panel:#FFFFFF;--line:rgba(38,30,18,.10);--line-strong:rgba(38,30,18,.16);--ink:#26201A;--ink-2:rgba(38,30,18,.66);--ink-3:rgba(38,30,18,.44);--gold:#B08A3C;--gold-hi:#B08A3C;--gold-deep:#7A5C1E;--gold-soft:rgba(138, 106, 40, .12);--green:#2B6B4F;--green-soft:rgba(43,107,79,.1);--blue:#2B6CB0;--blue-soft:rgba(43,108,176,.1);}
html[data-theme="dark"] .phone{--canvas:#14120F;--world:#1A1713;--panel:#211D18;--line:rgba(244,240,233,.12);--line-strong:rgba(244,240,233,.22);--ink:#F4F0E9;--ink-2:rgba(244,240,233,.72);--ink-3:rgba(244,240,233,.48);--gold-hi:#C9A45C;--gold:#C9A45C;--gold-deep:#8A6A28;--gold-soft: rgba(201, 164, 92, .16);--green:#6FB89A;--green-soft:rgba(111,184,154,.14);--blue:#7FA8D9;--blue-soft:rgba(127,168,217,.16);}
html,body{margin:0;height:100%;overflow:hidden;}
.phone{background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.cw{padding:calc(12px + env(safe-area-inset-top)) 14px 30px;}
.cw-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cw-back{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:600;text-decoration:none;}
.cw-back svg{width:13px;height:13px;}
.type-head{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px;}
.type-ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;}
.type-ic svg{width:19px;height:19px;}
.type-bd{flex:1;min-width:0;}
.type-bd b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;}
.type-bd span{display:block;margin-top:3px;font-size:11px;color:var(--ink-3);line-height:1.4;}
.type-tag{flex:none;font-size:10px;font-weight:700;color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:3px 9px;white-space:nowrap;}
.sec-title{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line);}
textarea.step-input{width:100%;box-sizing:border-box;min-height:96px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;line-height:1.6;resize:vertical;font-family:inherit;}
textarea.step-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft);}
.input-hint{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.5;}
.ai-panel{border:1px solid rgba(43,108,176,.25);border-radius:14px;background:var(--blue-soft);padding:12px;margin-top:10px;}
.ai-head{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:8px;}
.ai-head svg{width:13px;height:13px;}
.ai-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ai-tag{font-size:11px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
.ai-tag b{color:var(--blue);}
.ai-summary{font-size:12px;color:var(--ink-2);line-height:1.6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.ai-empty{font-size:12px;color:var(--ink-3);line-height:1.6;padding:8px 0;}
.match-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.match-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);}
.match-item:active{transform:scale(.98);}
.match-ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;}
.match-ic svg{width:15px;height:15px;}
.match-bd{flex:1;min-width:0;}
.match-bd b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-bd span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;}
.match-score{flex:none;font-size:11px;font-weight:700;color:var(--green);}
.file-zone{background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px;padding:12px;}
.file-row{display:flex;align-items:center;gap:10px;}
.file-row input{flex:1;min-width:0;}
.file-input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;font-family:inherit;}
.file-summary{width:100%;box-sizing:border-box;margin-top:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:12.5px;font-family:inherit;}
.file-note{font-size:10.5px;color:var(--ink-3);margin-top:7px;line-height:1.5;}
.file-added{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 11px;background:var(--green-soft);border:1px solid rgba(43,107,79,.2);border-radius:10px;font-size:12px;color:var(--green);}
.acct-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;}
.acct-ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.acct-bd{flex:1;min-width:0;}
.acct-bd b{display:block;font-size:13px;font-weight:700;}
.acct-bd span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;}
.acct-flag{flex:none;font-size:10px;font-weight:700;color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:3px 9px;}
.fixed-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--canvas);border-top:1px solid var(--line);display:flex;gap:10px;z-index:10;}
.fixed-bar .btn{flex:1;height:44px;border-radius:999px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
.btn-submit{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#fff;box-shadow:0 4px 14px -3px rgba(138,106,40,.4);}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;}
.btn-draft{background:var(--panel);border:1px solid var(--line) !important;color:var(--ink-2);}
.bottom-pad{height:74px;}
.success-page{display:none;position:fixed;inset:0;background:var(--canvas);z-index:20;overflow-y:auto;}
.success-page.show{display:block;}
.suc-inner{padding:calc(40px + env(safe-area-inset-top)) 20px 40px;text-align:center;}
.suc-ic{width:56px;height:56px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.suc-ic svg{width:28px;height:28px;}
.suc-title{font-size:18px;font-weight:700;font-family:"Noto Serif SC",serif;margin-bottom:6px;}
.suc-desc{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:6px;}
.suc-note{font-size:11px;color:var(--ink-3);line-height:1.5;margin-bottom:22px;}
.suc-btn{display:block;margin:0 auto 10px;width:100%;max-width:280px;height:44px;border-radius:999px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
.suc-btn-primary{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#fff;}
.suc-btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);}
</style>
</head>
<body>
<div class="phone">
  <div class="cw">
    <div class="cw-top">
      <a class="cw-back" href="choose.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>返回</a>
    </div>
    <div id="type-head"></div>
    <div class="sec-title">一句话描述</div>
    <textarea class="step-input" id="txt-desc" placeholder="例如：成都天府新区项目 急需C30商品混凝土3000方 预算30万 7天内到货"></textarea>
    <div class="input-hint">尽量说清：品类、地区、数量、预算、时间。AI 会自动结构化并匹配相关方。</div>
    <div class="sec-title">AI 分析预览</div>
    <div class="ai-panel" id="ai-panel">
      <div class="ai-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4c0 .6-.1 1.2-.3 1.7L20 12l-2 2-1.5-1.5c-.2.2-.4.3-.7.5L17 16l-3 1-1-2c-.3.1-.7.2-1 .2s-.7-.1-1-.2l-1 2-3-1 .3-3c-.3-.2-.5-.3-.7-.5L6 14 4 12l4.3-4.3A4 4 0 0 1 8 6a4 4 0 0 1 4-4z"/><circle cx="12" cy="6" r="1.2"/></svg>AI 已识别</div>
      <div class="ai-empty" id="ai-empty">输入一句话后，AI 将自动生成结构化标签与匹配推荐。</div>
      <div class="ai-tags" id="ai-tags" style="display:none;"></div>
      <div class="ai-summary" id="ai-summary" style="display:none;"></div>
      <div class="match-list" id="ai-matches" style="display:none;"></div>
    </div>
    <div class="sec-title">可选提交文件</div>
    <div class="file-zone">
      <div class="file-row">
        <input class="file-input" id="file-name" placeholder="文件名，如 采购清单.pdf">
      </div>
      <input class="file-summary" id="file-summary" placeholder="文件摘要（公开可见，完整文件解锁后查看）">
      <div class="file-note">文件名称与摘要公开可见；浏览方解锁后可查看/下载完整文件。</div>
      <div class="file-added" id="file-added" style="display:none;">✓ 文件已添加，发布后随信息展示</div>
    </div>
    <div class="sec-title">发布账号信息（简版）</div>
    <div class="acct-card">
      <div class="acct-ic" id="acct-ic">人</div>
      <div class="acct-bd"><b id="acct-name">—</b><span id="acct-flag">个人认证 · 实名用户</span></div>
      <span class="acct-flag">联系方式解锁可见</span>
    </div>
    <div class="bottom-pad"></div>
  </div>
  <div class="fixed-bar">
    <button class="btn btn-submit" id="btn-submit" disabled>发布需求</button>
  </div>
  <div class="success-page" id="success-page">
    <div class="suc-inner">
      <div class="suc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div>
      <div class="suc-title">发布成功，已即时上架</div>
      <div class="suc-desc" id="suc-desc">您的需求已即时上架，供需双方可立即看到。浏览方解锁后可查看联系方式与完整文件。</div>
      <div class="suc-note">AI 已为您匹配相关供应方，可在下方查看并联系。</div>
      <div class="match-list" id="suc-matches" style="text-align:left;margin-bottom:22px;"></div>
      <div class="suc-actions" id="suc-actions"></div>
    </div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/publish-types.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var typeKey = params.get('type') || 'material-demand';
  var TYPE = (window.PUBLISH_TYPES && PUBLISH_TYPES[typeKey]) || PUBLISH_TYPES['material-demand'];
  if (!TYPE || TYPE.detailLevel !== 'brief') { location.href = 'choose.html'; return; }
  if (!TYPE.hide && TYPE.detailLevel === 'detail') { location.href = 'editor.html?type=' + typeKey; return; }

  var st = (window.UI && UI.state) ? UI.state.get() : {};
  if (!st.loggedIn) { location.href = '../auth/login.html'; return; }
  var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
  if (!(auth.realname && auth.realname.ok)) { location.href = '../profile/auth-personal.html'; return; }

  /* ---- 品类配对关系（双向自动推荐）：16 类键与 js/publish-types.js 权威注册表同步维护 ---- */
  var PAIR = {
    'material-demand':'material-supply','material-supply':'material-demand',
    'labor-demand':'labor-supply','labor-supply':'labor-demand',
    'equipment-demand':'equipment-supply','equipment-supply':'equipment-demand',
    'transport-demand':'transport-supply','transport-supply':'transport-demand',
    'franchise-demand':'franchise-supply','franchise-supply':'franchise-demand',
    'trade-demand':'trade-supply','trade-supply':'trade-demand',
    'talent-supply':'personnel-demand','personnel-demand':'talent-supply',
    'agency-demand':'agency-supply','agency-supply':'agency-demand'
  };
  /* typeKey → bizKey（与 detail.js / list.html 口径一致） */
  var BIZ = {
    'material-demand':'material','material-supply':'material',
    'labor-demand':'labor','labor-supply':'labor',
    'equipment-demand':'equipment','equipment-supply':'equipment',
    'transport-demand':'transport','transport-supply':'transport',
    'franchise-demand':'franchise','franchise-supply':'franchise',
    'trade-demand':'trade','trade-supply':'trade',
    'talent-supply':'talent','personnel-demand':'personnel',
    'agency-demand':'agency','agency-supply':'agency'
  };
  var CAT_ICON = {
    '材料':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>',
    '劳务':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    '设备':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="3"/><path d="M13 22a9 9 0 1 1 8.5-11.7L22 11"/><path d="M17.5 6.5L22 2"/></svg>',
    '运输':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
    '资质招商':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>',
    '建企买卖':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    '招聘':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    '求职':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3V4a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v3H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/></svg>',
    '中介服务':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
  };
  function icon(k){ return CAT_ICON[k] || CAT_ICON['材料']; }

  /* ---- 顶部类型卡 ---- */
  var head = document.getElementById('type-head');
  head.innerHTML = '<div class="type-head"><span class="type-ic">' + icon(TYPE.cat) + '</span>'
    + '<div class="type-bd"><b>' + TYPE.label + '</b><span>' + TYPE.sub + '</span></div>'
    + '<span class="type-tag">即时上架</span></div>';

  /* ---- 当前账号（简版账号信息） ---- */
  function accountCard(){
    try {
      var acc0 = (window.entryAccess && entryAccess) ? entryAccess() : null;
      var idy = (acc0 && acc0.identity) ? acc0.identity : {};
      var nm = (st.user && st.user.name) || '实名用户';
      var flag = '';
      if (idy.enterprise === 'resident') flag = '企业入驻 · ' + ((idy.entryTypes||[]).indexOf('agency')>=0?'中介企业':'建筑企业');
      else if (idy.enterprise === 'verified') flag = '企业认证';
      else if (idy.personal === 'professional' || idy.personal === 'full') flag = '个人入驻 · ' + ((st.user && st.user.userType === 'jobseeker') ? '应聘类' : '标准类');
      else flag = '个人认证 · 实名用户';
      document.getElementById('acct-ic').textContent = (nm||'人').charAt(0);
      document.getElementById('acct-name').textContent = nm;
      document.getElementById('acct-flag').textContent = flag;
    } catch(e){}
  }
  accountCard();

  /* ---- AI 分析（规则模拟：品类/地区/数量/预算/时间） ---- */
  var REGIONS = ['北京','上海','广州','深圳','成都','重庆','西安','武汉','杭州','南京','苏州','郑州','长沙','昆明','贵阳','乌鲁木齐','兰州','西宁','银川','拉萨','四川','广东','江苏','浙江','湖北','陕西','云南','贵州','甘肃','新疆','青海','西藏','河北','河南','山东','山西','湖南','安徽','福建','江西','广西','海南','天津','重庆','辽宁','吉林','黑龙江','内蒙古','宁夏'];
  function analyze(text){
    var tags = [];
    tags.push({ k: '品类', v: TYPE.cat });
    var region = '';
    for (var i=0;i<REGIONS.length;i++){ if (text.indexOf(REGIONS[i]) >= 0) { region = REGIONS[i]; break; } }
    if (region) tags.push({ k: '地区', v: region });
    var mQ = text.match(/(\d+(?:\.\d+)?)\s*(方|吨|台|人|辆|车|米|㎡|m²|m3|m³|套|个|批)/);
    if (mQ) tags.push({ k: '数量', v: mQ[1] + mQ[2] });
    var mP = text.match(/(\d+(?:\.\d+)?)\s*万|(\d+(?:\.\d+)?)\s*[元块]/);
    if (mP) tags.push({ k: '预算', v: (mP[1]||mP[2]) + (mP[1] ? '万' : '元') });
    var mT = text.match(/(\d+)\s*天|(\d+)\s*日内|尽快|急/);
    if (mT) tags.push({ k: '时效', v: mT[1] ? mT[1] + '天' : (mT[0].indexOf('急')>=0 ? '紧急' : '尽快') });
    var summary = 'AI 判定为「' + TYPE.label + '」意向，' + (region ? '目标区域 ' + region + '，' : '') + '已自动匹配同品类' + (TYPE.cat==='求职'?'招聘方':'供应方') + '，解锁后可查看联系方式与完整文件。';
    return { tags: tags, summary: summary };
  }
  function matches(limit){
    var pair = PAIR[typeKey] || '';
    var biz = BIZ[pair] || '';
    var pool = [];
    try {
      var cat = (window.MOCK && MOCK.catalog) ? MOCK.catalog.slice() : [];
      pool = pool.concat(cat.filter(function(x){ return x.bizKey === biz || x.cat === (TYPE.cat==='求职'?'招聘':pairCat(pair)); }));
      if (window.SupplyStore) {
        var items = (SupplyStore.read().items || []);
        pool = pool.concat(items.filter(function(x){ return (x.bizKey === biz) && x.status === 'active'; }));
      }
    } catch(e){}
    var seen = {}, out = [];
    pool.forEach(function(x){
      if (seen[x.id]) return; seen[x.id] = 1;
      if (out.length >= limit) return;
      var t = x.title || x.name || '';
      if (!t) return;
      out.push({ id: x.id, title: t, bizKey: biz, meta: (x.location || x.city || '') + (x.price ? ' · ' + x.price : ''), match: 82 + (out.length % 3) * 5 });
    });
    return out;
  }
  function pairCat(pairType){
    var t = (window.PUBLISH_TYPES && PUBLISH_TYPES[pairType]);
    return t ? t.cat : '';
  }
  function matchItemHtml(m, clickable){
    var loc = 'pages/supply/detail.html?id=' + encodeURIComponent(m.id);
    var m2 = m;
    return '<a class="match-item" href="' + (clickable ? loc : 'javascript:;') + '">'
      + '<span class="match-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>'
      + '<span class="match-bd"><b>' + (m.title||'').substring(0,26) + '</b><span>' + (m.meta||'') + '</span></span>'
      + '<span class="match-score">' + (m.match||'') + '% 匹配</span></a>';
  }
  function renderAnalysis(){
    var txt = (document.getElementById('txt-desc').value || '').trim();
    var canPublish = txt.length >= 6;
    document.getElementById('btn-submit').disabled = !canPublish;
    var empty = document.getElementById('ai-empty');
    var tagsEl = document.getElementById('ai-tags');
    var sumEl = document.getElementById('ai-summary');
    var matchEl = document.getElementById('ai-matches');
    if (!txt) {
      empty.style.display = ''; tagsEl.style.display = 'none'; sumEl.style.display = 'none'; matchEl.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    var a = analyze(txt);
    tagsEl.style.display = ''; tagsEl.innerHTML = a.tags.map(function(t){ return '<span class="ai-tag">' + t.k + '：<b>' + t.v + '</b></span>'; }).join('');
    sumEl.style.display = ''; sumEl.textContent = a.summary;
    var ms = matches(3);
    if (ms.length) { matchEl.style.display = ''; matchEl.innerHTML = '<div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:6px;">AI 匹配推荐</div>' + ms.map(function(m){ return matchItemHtml(m, true); }).join(''); }
    else { matchEl.style.display = ''; matchEl.innerHTML = '<div class="ai-empty" style="padding:0;">暂未匹配到同品类活跃信息，发布后将持续为你推荐。</div>'; }
  }
  document.getElementById('txt-desc').addEventListener('input', renderAnalysis);
  document.getElementById('txt-desc').addEventListener('blur', function(){ if ((this.value||'').trim().length >= 6) renderAnalysis(); });

  /* ---- 文件（摘要公开，完整文件解锁） ---- */
  var file = null;
  document.getElementById('file-name').addEventListener('input', function(){
    var n = this.value.trim();
    var s = document.getElementById('file-summary').value.trim();
    var fe = document.getElementById('file-added');
    if (n) { file = { name: n, size: '附件', summary: s || '待补充摘要' }; fe.style.display = ''; fe.textContent = '✓ 文件已添加：' + n; }
    else { file = null; fe.style.display = 'none'; }
  });
  document.getElementById('file-summary').addEventListener('input', function(){
    if (file) { file.summary = this.value.trim() || '待补充摘要'; }
  });

  /* ---- 发布（简要类：即时上架 status=active） ---- */
  document.getElementById('btn-submit').addEventListener('click', function(){
    var txt = document.getElementById('txt-desc').value.trim();
    if (txt.length < 6) { UI.toast('请至少输入一句完整描述', 'warn'); return; }
    var a = analyze(txt);
    var ms = matches(5);
    var curUser = null;
    try { curUser = (window.DataBus && DataBus.current) ? DataBus.current() : null; } catch(e){}
    var payload = {
      title: txt.substring(0, 24),
      type: TYPE.role, cat: TYPE.cat, sub: '',
      desc: txt,
      location: (a.tags.filter(function(t){return t.k==='地区';})[0]||{}).v || '',
      city: (a.tags.filter(function(t){return t.k==='地区';})[0]||{}).v || '',
      price: (a.tags.filter(function(t){return t.k==='预算';})[0]||{}).v || '',
      dir: TYPE.role, amount: 0,
      publisher: curUser ? curUser.id : '', publisherName: curUser ? curUser.name : '',
      source: 'user_publish', bizKey: BIZ[typeKey] || 'material', detailLevel: 'brief',
      aiAnalysis: { text: txt, tags: a.tags, summary: a.summary, matchCount: ms.length },
      files: file ? [file] : [],
      match: ms.length ? Math.max(88, 80 + ms.length * 3) : 72,
      verified: false, status: 'active', tags: [], expireDays: 30, privacyContact: true
    };
    var saved;
    try { saved = DataBus.publishSupply ? DataBus.publishSupply(payload) : null; }
    catch(e){ saved = null; }
    if (!saved) { UI.toast('发布失败，请重试', 'err'); return; }
    /* 成功页：展示匹配结果 */
    var sucM = document.getElementById('suc-matches');
    if (ms.length) sucM.innerHTML = '<div style="font-size:11px;font-weight:700;color:var(--green);margin-bottom:6px;text-align:left;">AI 已匹配 ' + ms.length + ' 个相关' + (TYPE.cat==='求职'?'招聘':'供应') + '方</div>' + ms.map(function(m){ return matchItemHtml(m, true); }).join('');
    else sucM.innerHTML = '<div class="ai-empty" style="padding:0;text-align:left;">当前暂无同品类活跃信息，发布后平台将持续为您推荐。</div>';
    document.getElementById('suc-desc').textContent = '您的「' + TYPE.label + '」已即时上架，供需双方可立即看到。浏览方解锁后可查看联系方式与文件。';
    renderSucActions(typeKey);
    document.getElementById('success-page').classList.add('show');
  });
  /* 成功页操作按钮：按发布类型分支（收购→顾问闭环；找中介→供需池/服务广场双出口） */
  function renderSucActions(tk) {
    var box = document.getElementById('suc-actions');
    if (!box) return;
    var btns = [];
    if (tk === 'trade-demand') {
      btns.push('<button class="suc-btn suc-btn-primary" id="suc-advisor">提交给收购顾问</button>');
      btns.push('<button class="suc-btn suc-btn-ghost" id="suc-records">查看我的发布</button>');
      btns.push('<button class="suc-btn suc-btn-ghost" id="suc-home">返回首页</button>');
    } else if (tk === 'agency-demand') {
      btns.push('<button class="suc-btn suc-btn-primary" id="suc-pool">去发现页查看同类需求</button>');
      btns.push('<button class="suc-btn suc-btn-ghost" id="suc-plaza">回服务广场</button>');
      btns.push('<button class="suc-btn suc-btn-ghost" id="suc-home">返回首页</button>');
    } else {
      btns.push('<button class="suc-btn suc-btn-primary" id="suc-view">查看我的需求</button>');
      btns.push('<button class="suc-btn suc-btn-ghost" id="suc-home">返回首页</button>');
    }
    box.innerHTML = btns.join('');
    var bind = function (id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    bind('suc-view', function () { location.href = 'records.html'; });
    bind('suc-records', function () { location.href = 'records.html'; });
    bind('suc-pool', function () { location.href = '../supply/list.html?cat=' + encodeURIComponent('中介服务'); });
    bind('suc-plaza', function () { location.href = '../agency/index.html'; });
    bind('suc-advisor', function () { location.href = '../trade/index.html?openDelegate=1'; });
    bind('suc-home', function () { location.href = '../../home.html'; });
  }
})();
</script>
</body>
