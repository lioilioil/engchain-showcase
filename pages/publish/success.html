<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/publish/";var base;

<style>
  body{background:var(--bg)}
  #pub-content{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .succ-main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;padding:34px 20px 104px;text-align:center;}
  .succ-main::-webkit-scrollbar{width:0}
  /* 成功主视觉：外环光晕 + 内渐变圆 + 弹性入场 */
  .succ-hero{position:relative;width:96px;height:96px;flex:none;border-radius:50%;
    background:radial-gradient(circle at 32% 26%,var(--primary-soft-2),color-mix(in srgb,var(--primary-soft) 55%,var(--bg-card)));
    display:flex;align-items:center;justify-content:center;animation:succ-pop .5s cubic-bezier(.34,1.56,.64,1);}
  .succ-hero::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--primary) 42%,transparent);opacity:.75;}
  .succ-hero-core{width:58px;height:58px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);
    display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;
    box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary-dim) 55%,transparent);}
  @keyframes succ-pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){.succ-hero{animation:none;}}
  .succ-heading{font-size:22px;font-weight:700;color:var(--text-1);margin:24px 0 0;letter-spacing:.01em;}
  .succ-sub{font-size:13.5px;line-height:1.7;color:var(--text-2);margin:9px 0 0;max-width:26ch;}
  /* 信息卡 / 建议卡 */
  .succ-card{width:100%;margin-top:26px;padding:16px;border-radius:var(--r-m);}
  .succ-card+.succ-card{margin-top:12px;}
  .succ-track{height:7px;border-radius:999px;background:var(--bg-card-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(22,22,22,.06);}
  .succ-track>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .5s;}
  .succ-stat{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line);font-size:12px;}
  .succ-stat:first-of-type{border-top:0;}
  .succ-stat span:first-child{color:var(--text-3);}
  .succ-stat span:last-child{font-weight:700;font-variant-numeric:tabular-nums;}
  .succ-tips-title{font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:10px;text-align:left;}
  .succ-tip{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-2);line-height:1.65;text-align:left;}
  .succ-tip+.succ-tip{margin-top:9px;}
  .succ-tip svg{flex:none;width:14px;height:14px;margin-top:1px;color:var(--primary-dim);}
  .succ-backlink{display:inline-flex;align-items:center;gap:4px;margin-top:20px;font-size:12px;color:var(--text-3);text-decoration:none;-webkit-tap-highlight-color:transparent;}
  .succ-backlink:active{color:var(--primary-dim);}
  /* ══ 底部固定悬浮胶囊条：样式同「钱包·首页」.app-float-cta（液态玻璃，双主题自适应）══ */
  #pub-content .app-float-cta {
    position:absolute !important; left:50%; right:auto; transform:translateX(-50%);
    width:max-content; max-width:calc(100% - 32px);
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    z-index:55; height:52px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; padding:0 12px;
    background:
      linear-gradient(90deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.94) 6%, rgba(255,255,255,.88) 50%, rgba(255,255,255,.94) 94%, rgba(255,255,255,.78) 100%),
      linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(255,255,255,.84) 35%, rgba(255,255,255,.76) 65%, rgba(255,255,255,.90) 100%);
    -webkit-backdrop-filter:blur(32px) saturate(200%) brightness(1.08) contrast(1.02);
    backdrop-filter:blur(32px) saturate(200%) brightness(1.08) contrast(1.02);
    border:1px solid rgba(255,255,255,.88);
    box-shadow:
      0 16px 48px rgba(22,22,22,.20), 0 6px 20px rgba(22,22,22,.12), 0 2px 8px rgba(22,22,22,.07),
      inset 0 2px 3px rgba(255,255,255,.95), inset 0 -2px 3px rgba(255,255,255,.35),
      inset 2px 0 3px rgba(255,255,255,.30), inset -2px 0 3px rgba(255,255,255,.30),
      inset 0 0 0 1px rgba(255,255,255,.40);
    user-select:none; -webkit-user-select:none;
  }
  #pub-content .app-float-cta::before {
    content:''; position:absolute; inset:0; border-radius:inherit; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.70) 38%, rgba(255,255,255,.58) 62%, rgba(255,255,255,.74) 100%);
  }
  #pub-content .app-float-cta .afc-item {
    flex:1; min-width:0; height:100%; border:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--text-1); font-size:14px; font-weight:600; letter-spacing:.02em;
    transition:color .25s, font-weight .25s, transform .15s;
    font-family:var(--font-display); position:relative; z-index:2;
    text-shadow:0 1px 2px rgba(255,255,255,.65), 0 0 8px rgba(255,255,255,.35);
    text-decoration:none; padding:0 9px; white-space:nowrap;
  }
  #pub-content .app-float-cta .afc-item svg { width:18px; height:18px; stroke-width:2; flex:none; transition:stroke-width .2s, color .25s; }
  #pub-content .app-float-cta .afc-item:active { transform:scale(.94); }
  #pub-content .app-float-cta .afc-sep { flex:none; color:rgba(22,22,22,.28); font-size:12px; padding:0 2px; position:relative; z-index:2; }
  [data-theme="dark"] #pub-content .app-float-cta {
    background:linear-gradient(180deg, rgba(32,32,36,.94) 0%, rgba(28,28,30,.88) 40%, rgba(24,24,28,.82) 62%, rgba(30,30,34,.90) 100%);
    border-color:rgba(255,255,255,.16);
    box-shadow:
      0 16px 48px rgba(0,0,0,.55), 0 6px 20px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.22),
      inset 0 2px 3px rgba(255,255,255,.10), inset 0 -2px 3px rgba(255,255,255,.04),
      inset 0 0 0 1px rgba(255,255,255,.06);
  }
  [data-theme="dark"] #pub-content .app-float-cta::before {
    background:linear-gradient(180deg, rgba(22,22,26,.72) 0%, rgba(22,22,26,.60) 38%, rgba(22,22,26,.50) 62%, rgba(22,22,26,.66) 100%);
  }
  [data-theme="dark"] #pub-content .app-float-cta .afc-item { color:var(--text-1); text-shadow:0 1px 2px rgba(0,0,0,.55), 0 0 8px rgba(0,0,0,.30); }
  [data-theme="dark"] #pub-content .app-float-cta .afc-sep { color:rgba(242,240,236,.30); }
</style>

<body>
<div class="phone">
  <div id="pub-gate-login" style="display:none;text-align:center;padding:60px 24px;">
    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;"><svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-user"/></svg></div>
    <div class="fw-700" style="font-size:17px;margin-top:16px;">登录后查看发布结果</div>
    <div class="text-3" style="font-size:12px;margin-top:8px;line-height:1.7;">登录后可查看发布信息的审核状态与对接进展。</div>
    <a href="../auth/login.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">立即登录</a>
  </div>
  <div id="pub-gate-realname" style="display:none;text-align:center;padding:60px 24px;">
    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;"><svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-shield"/></svg></div>
    <div class="fw-700" style="font-size:17px;margin-top:16px;">实名认证后可发布信息</div>
    <div class="text-3" style="font-size:12px;margin-top:8px;line-height:1.7;">完成实名认证后，即可发布供需信息并参与平台对接。</div>
    <a href="../profile/auth-personal.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">前往实名认证</a>
  </div>
  <div id="pub-content">
    <main class="succ-main">
      <div class="succ-hero"><div class="succ-hero-core">✓</div></div>
      <h1 class="succ-heading">信息已提交</h1>
      <p class="succ-sub" id="succ-sub">信息已进入审核与匹配流程。你可以在信息工作台继续查看状态和对接反馈。</p>
      <div class="glass succ-card" style="text-align:left;font-size:12px;color:var(--text-2);">
        <div class="fb-between" style="margin-bottom:10px;"><span class="text-2 fs-12" id="succ-title">信息标题</span><span class="tag tag-primary" id="succ-status">审核中</span></div>
        <div class="succ-track"><div id="succ-bar" style="width:40%;"></div></div>
        <div class="text-3 fs-12" style="margin-top:10px;">有新的匹配或咨询时，消息会推送至你的会话。</div>
        <div style="margin-top:10px;" id="succ-stats"></div>
      </div>
      <div class="glass succ-card">
        <div class="succ-tips-title">提升曝光小建议</div>
        <div class="succ-tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>完善企业/个人主页信息，提升信任度与展示权重</div>
        <div class="succ-tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15.5 9.5 12 7l-3.5 2.5M8.5 14.5 12 17l3.5-2.5"/></svg>每日签到获取积分，免费额度用完后可解锁更多线索</div>
      </div>
      <a class="succ-backlink" href="index.html">返回信息工作台 <span aria-hidden="true">›</span></a>
    </main>
    <!-- 底部固定悬浮胶囊条：查看信息详情 / 查看我的发布（样式同「钱包·首页」.app-float-cta） -->
    <div class="app-float-cta" id="pub-cta">
      <a class="afc-item" id="succ-detail" href="records.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="afc-label">查看信息详情</span>
      </a>
      <span class="afc-sep" aria-hidden="true">|</span>
      <a class="afc-item" href="records.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="18" r="1.6"/></svg>
        <span class="afc-label">查看我的发布</span>
      </a>
    </div>
  </div>
</div>

<script>
(function () {
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (!st.loggedIn) { if (window.GuestGate) GuestGate.open({mode:'replace', icon:'check', badge:'游客模式', title:'登录后查看发布结果', note:'登录后可查看发布信息的审核状态与对接进展。', btnText:'立即登录', btnHref:'../auth/login.html'}); return false; }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) { if (content) content.style.display='none'; if (gateReal) gateReal.style.display=''; return false; }
    return true;
  }
  if (!checkPublishAuth()) return;
  window.__ROOT__ = '../../';
  var id = new URLSearchParams(location.search).get('id');
  var rec = id && window.PublishStore ? PublishStore.getRecordById(id) : null;
  var sub = document.getElementById('succ-sub'), title = document.getElementById('succ-title'), status = document.getElementById('succ-status'), bar = document.getElementById('succ-bar'), stats = document.getElementById('succ-stats');
  var statusTxt = rec ? (PublishStore.STATUS[rec.status] || rec.status) : '审核中';
  if (rec) {
    title.textContent = rec.title || '已发布信息';
    status.textContent = statusTxt;
    if (rec.category) title.textContent = rec.title + '（' + rec.category + (rec.subType ? '·' + rec.subType : '') + '）';
    var pct = rec.completion != null ? Math.round(rec.completion * 0.7 + 20) : (rec.matches ? Math.min(90, 30 + rec.matches * 10) : 50);
    pct = Math.max(20, Math.min(90, pct));
    bar.style.width = pct + '%';
    sub.textContent = (rec.role === 'supply' ? '供应信息已进入匹配流程' : '需求信息已进入匹配流程');
    stats.innerHTML =
      '<div class="succ-stat"><span>浏览</span><span style="font-weight:600">' + (rec.views || 0) + '</span></div>' +
      '<div class="succ-stat"><span>匹配</span><span style="font-weight:600">' + (rec.matches || 0) + '</span></div>' +
      '<div class="succ-stat"><span>咨询</span><span style="font-weight:600">' + (rec.inquiries || 0) + '</span></div>';
    document.getElementById('succ-detail').href = '../supply/detail.html?id=' + encodeURIComponent(rec.id || id);
  } else {
    bar.style.width = '40%';
    stats.innerHTML = '<div class="succ-stat"><span>状态</span><span style="font-weight:600">待生成</span></div>';
  }
})();
</script>
