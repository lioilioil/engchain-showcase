<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/publish/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>发布什么 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
.phone{--canvas:#F4F2EE;--world:#EFECE3;--panel:#FFFFFF;--line:rgba(38,30,18,.10);--line-strong:rgba(38,30,18,.16);--ink:#26201A;--ink-2:rgba(38,30,18,.66);--ink-3:rgba(38,30,18,.44);--gold:#B08A3C;--gold-hi:#B08A3C;--gold-deep:#7A5C1E;--gold-soft:rgba(138, 106, 40, .12);--green:#2B6B4F;--green-soft:rgba(43,107,79,.1);}
html[data-theme="dark"] .phone{--canvas:#14120F;--world:#1A1713;--panel:#211D18;--line:rgba(244,240,233,.12);--line-strong:rgba(244,240,233,.22);--ink:#F4F0E9;--ink-2:rgba(244,240,233,.72);--ink-3:rgba(244,240,233,.48);--gold-hi:#C9A45C;--gold:#C9A45C;--gold-deep:#8A6A28;--gold-soft: rgba(201, 164, 92, .16);--green:#6FB89A;--green-soft:rgba(111,184,154,.14);}
html,body{margin:0;height:100%;overflow:hidden;}
.phone{background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.cw{padding:calc(12px + env(safe-area-inset-top)) 14px 30px;}
.cw-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cw-back{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:600;text-decoration:none;}
.cw-back svg{width:13px;height:13px;}
.cw-title{margin:2px 0 2px;font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;letter-spacing:.02em;}
.cw-sub{font-size:12px;color:var(--ink-2);line-height:1.5;margin:0;}
/* 续发上次 */
.resume{display:flex;align-items:center;gap:10px;padding:9px 11px;margin:12px 0 4px;border-radius:12px;background:linear-gradient(135deg,var(--gold-soft),rgba(138, 106, 40, .04));border:1px solid rgba(138, 106, 40, .3);text-decoration:none;color:var(--ink);}
.resume-ic{flex:none;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;}
.resume-ic svg{width:15px;height:15px;}
.resume-bd{flex:1;min-width:0;}
.resume-bd b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.resume-bd span{font-size:10.5px;color:var(--ink-3);}
.resume-go{flex:none;font-size:11px;font-weight:700;color:var(--gold-deep);}
html[data-theme="dark"] .resume-go{color:var(--gold-hi);}

/* 方向宫格：2 列紧凑卡 */
.dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
.dir-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:12px 12px 11px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .15s;overflow:hidden;}
.dir-card:active{transform:scale(.97);}
.dir-card::after{content:"";position:absolute;right:-22px;top:-22px;width:80px;height:80px;border-radius:50%;opacity:.5;}
.dir-card.demand::after{background:radial-gradient(circle,var(--green-soft),transparent 70%);}
.dir-card.supply::after{background:radial-gradient(circle,var(--gold-soft),transparent 70%);}
.dir-ic{position:relative;z-index:1;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.dir-ic svg{width:19px;height:19px;}
.dir-ic.demand{background:var(--green-soft);color:var(--green);}
.dir-ic.supply{background:var(--gold-soft);color:var(--gold-deep);}
.dir-bd{position:relative;z-index:1;}
.dir-bd b{display:block;font-size:14px;font-weight:700;line-height:1.25;}
.dir-bd span{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3);line-height:1.45;}

/* 分类分组：一行一条紧凑列表 */
.pg{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.pg-h{display:flex;align-items:center;gap:8px;margin:0 2px 2px;}
.pg-ic{flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--gold-deep);background:var(--gold-soft);}
.pg-h b{font-size:13.5px;font-weight:700;letter-spacing:.01em;}
.pg-h span{font-size:10.5px;color:var(--ink-3);margin-left:2px;}
.type-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .12s;}
.type-row:active{transform:scale(.985);}
.tr-ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.tr-ic svg{width:15px;height:15px;}
.tr-ic.supply{background:var(--gold-soft);color:var(--gold-deep);}
.tr-ic.demand{background:var(--green-soft);color:var(--green);}
.tr-bd{flex:1;min-width:0;}
.tr-bd b{display:block;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tr-bd span{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tr-side{flex:none;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:999px;}
.tr-side.supply{color:var(--gold-deep);background:var(--gold-soft);}
.tr-side.demand{color:var(--green);background:var(--green-soft);}
.tr-arrow{flex:none;color:var(--ink-3);}
.tr-arrow svg{width:14px;height:14px;display:block;}
/* 权限外列项：灰度锁定 + 引导认证 */
.type-row.is-locked{opacity:.6;}
.type-row.is-locked .tr-bd b{color:var(--ink-3);}
.type-row.is-locked .tr-ic{background:var(--world);color:var(--ink-3);opacity:.75;}
.type-row.is-locked .tr-side.lock{color:#8A5A2A;background:rgba(138,90,42,.12);border:1px dashed rgba(138,90,42,.38);}
html[data-theme="dark"] .type-row.is-locked .tr-side.lock{color:#D7B774;background:rgba(215,183,116,.10);border-color:rgba(215,183,116,.32);}
.type-row.is-locked .tr-arrow{opacity:0;}

/* 游客 / 未实名引导条 */
.auth-tip{display:flex;flex-direction:column;gap:3px;margin:12px 0 2px;padding:10px 12px;border-radius:12px;background:rgba(138,106,40,.08);border:1px solid rgba(138,106,40,.28);}
.auth-tip b{font-size:12.5px;font-weight:700;color:var(--gold-deep);}
html[data-theme="dark"] .auth-tip b{color:var(--gold-hi);}
.auth-tip span{font-size:10.5px;color:var(--ink-2);line-height:1.5;}

.back-link{display:inline-flex;align-items:center;gap:5px;margin-top:16px;font-size:11.5px;color:var(--ink-3);text-decoration:none;}
</style>
</head>
<body>
<div class="phone">
  <div class="cw" id="cw">
    <div class="cw-top">
      <a class="cw-back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>返回</a>
    </div>
    <h1 class="cw-title">这次你想发布什么？</h1>
    <p class="cw-sub">先选方向，进去就是专属表单，不用再选品类。</p>
    <div id="resume-slot"></div>
    <div id="body"></div>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/publish-types.js"></script>
<script src="../../js/publish-workbench.js"></script>
<script>
(function(){
  var st = (window.UI && UI.state) ? UI.state.get() : {};
  var loggedIn = !!(st.loggedIn && st.status !== 'guest');
  var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
  var realname = !!(auth.realname && auth.realname.ok);
  /* 游客 / 未实名不再跳转：全量展示并灰度锁定，点击时按身份分级引导登录 / 实名 / 认证入驻 */

  var acc = null;
  try { acc = window.entryAccess ? entryAccess() : null; } catch(e){}

  var body = document.getElementById('body');

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function icon(name){
    var icons = {
      demand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
      supply:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>',
      arr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
    };
    return icons[name] || icons.arr;
  }

  /* 续发上次：从最近一条发布反推 type */
  (function renderResume(){
    var slot = document.getElementById('resume-slot');
    try {
      var items = (window.SupplyStore && SupplyStore.read) ? (SupplyStore.read().items || []) : [];
      if (!items.length) return;
      var rec = items[items.length - 1];
      var cat = rec.category || rec.cat || '';
      var roleSide = (rec.role === 'supply' || rec.dir === 'supply') ? 'supply' : 'demand';
      var hit = '';
      Object.keys(PUBLISH_TYPES).forEach(function(k){
        var t = PUBLISH_TYPES[k];
        if (t.cat === cat && t.role === roleSide) hit = k;
      });
      if (!hit) return;
      var a = document.createElement('a');
      a.className = 'resume';
      a.href = publishTypeHref(hit);
      a.innerHTML = '<span class="resume-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>'
        + '<div class="resume-bd"><b>' + (rec.title || '继续上次发布') + '</b><span>上次发过「' + (PUBLISH_TYPES[hit].guideLabel || PUBLISH_TYPES[hit].label) + '」，点此快速续发</span></div>'
        + '<span class="resume-go">续发 ›</span>';
      slot.appendChild(a);
    } catch(e){}
  })();

  /* 全量 16 类按业务分类分组列项（一行一条）：
     - 分类顺序与「发布助手·对话引导」一级分类一致（材料/设备/劳务/运输/建筑企业/人才/中介服务）
     - 全部行为描述均展示；当前身份不可发布的类型灰度锁定并标注所需认证，点击引导认证/入驻 */
  var GROUPS=[
    { name:'材料', keys:['material-supply','material-demand'] },
    { name:'设备', keys:['equipment-supply','equipment-demand'] },
    { name:'劳务', keys:['labor-supply','labor-demand'] },
    { name:'运输', keys:['transport-supply','transport-demand'] },
    { name:'建筑企业', keys:['franchise-supply','franchise-demand','trade-supply','trade-demand'] },
    { name:'人才', keys:['personnel-demand','talent-supply'] },
    { name:'中介服务', keys:['agency-supply','agency-demand'] }
  ];
  function lockReason(typeKey){
    var t=PUBLISH_TYPES[typeKey]; if(!t) return '需认证';
    if(!loggedIn) return '需登录';
    if(!realname) return '需实名';
    if(t.detailLevel==='detail') return '需企业认证';
    if(t.cat==='求职') return '需专业入驻';
    return '需认证';
  }
  function renderGroups(){
    var allowed={};
    try { (availableTypesByAccount(acc)||[]).forEach(function(k){ allowed[k]=true; }); } catch(e){}
    var html='';
    GROUPS.forEach(function(g){
      html+='<div class="pg"><div class="pg-h"><span class="pg-ic">'+esc(g.name.charAt(0))+'</span><b>'+esc(g.name)+'</b><span>'+g.keys.length+' 类</span></div>';
      g.keys.forEach(function(k){
        var t=PUBLISH_TYPES[k]; if(!t) return;
        var locked=!allowed[k];
        var side=t.role==='supply'?'supply':'demand';
        var badge=locked
          ? '<span class="tr-side lock">'+esc(lockReason(k))+'</span>'
          : '<span class="tr-side '+side+'">'+(side==='supply'?'供':'需')+'</span>';
        html+='<a class="type-row'+(locked?' is-locked':'')+'" data-key="'+esc(k)+'" href="'+(locked?'javascript:void(0)':publishTypeHref(k))+'">'
          +'<span class="tr-ic '+side+'">'+icon(side)+'</span>'
          +'<span class="tr-bd"><b>'+esc(t.guideLabel||t.label)+'</b><span>'+esc(t.guideSub||t.sub)+'</span></span>'
          +badge+'<span class="tr-arrow">'+icon('arr')+'</span></a>';
      });
      html+='</div>';
    });
    body.innerHTML=html;
    /* 锁定入口：提示所需认证并分级引导（未登录→登录 / 未实名→实名 / 已实名→企业认证或入驻），不进入编辑器 */
    body.addEventListener('click',function(ev){
      var row=ev.target.closest('.type-row.is-locked'); if(!row) return;
      ev.preventDefault();
      var k=row.getAttribute('data-key');
      if(window.UI&&UI.toast) UI.toast('「'+lockReason(k)+'」后方可发布','warn');
      setTimeout(function(){
        location.href = !loggedIn ? '../auth/login.html' : (!realname ? '../profile/auth-personal.html' : '../profile/auth.html');
      },420);
    });
  }

  /* 游客 / 未实名：顶部引导条，说明全量列表当前不可发布 */
  if(!loggedIn || !realname){
    var tip=document.createElement('div');
    tip.className='auth-tip';
    tip.innerHTML = !loggedIn
      ? '<b>登录后可发布</b><span>当前为游客浏览，全部类型暂不可发布，点击任意类型可先登录</span>'
      : '<b>完成实名认证后可发布</b><span>当前仅浏览，全部类型暂不可发布，点击任意类型可先实名</span>';
    document.getElementById('resume-slot').parentNode.insertBefore(tip, document.getElementById('body'));
  }

  renderGroups();
})();
</script>
</body>
</html>
