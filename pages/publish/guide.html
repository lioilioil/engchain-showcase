<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/publish/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F4F1EA" id="metaTheme">
<title>发布助手 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
/* ══════════════════════════════════════════════════════════════════
   发布助手 · 对话式发布引导（生产版，全屏 .phone）
   人格：暖纸 + 工程链金（供给/长期方）+ 墨绿（需求/一次性方）。
   签名动效：打字机逐字 + 三点输入指示 + 气泡/选项错峰上浮。
   主题：跟随全站 <html data-theme="dark">（localStorage: engchain-theme）。
   ══════════════════════════════════════════════════════════════════ */
:root{
  --canvas:var(--bg);
  --world:var(--bg-subtle);
  --surface:var(--bg-card);
  --surface-2:var(--bg-card-2);
  --ink:var(--text-1);
  --ink-2:var(--text-2);
  --ink-3:var(--text-3);
  --line:var(--line);
  --line-strong:var(--line-strong);
  --gold:var(--primary);
  --gold-hi:var(--primary-strong);
  --gold-deep:var(--primary-dim);
  --gold-ink:var(--text-inv);
  --gold-soft:var(--primary-soft);
  --gold-line:var(--accent-line);
  --green:var(--success);
  --green-hi:var(--success);
  --green-soft:var(--success-soft);
  --green-line:rgba(43,107,79,.26);
  --r-shell:24px; --r-card:15px; --r-bubble:18px; --r-ctrl:11px; --r-chip:999px;
  --glass:rgba(255,253,248,.66); --glass-line:rgba(255,255,255,.55);
  --shadow-pop:0 1px 1px rgba(74,58,32,.05),0 10px 24px -12px rgba(74,58,32,.20),0 26px 56px -30px rgba(74,58,32,.30);
  --shadow-card:0 1px 2px rgba(74,58,32,.05),0 6px 16px -10px rgba(74,58,32,.16);
  --ease:cubic-bezier(.22,.75,.3,1);
  --ease-spring:cubic-bezier(.24,1.05,.34,1);
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-serif:"Noto Serif SC","Songti SC",Georgia,serif;
}
html[data-theme="dark"]{
  --canvas:var(--bg);--world:var(--bg-alp);--surface:var(--bg-card);--surface-2:var(--bg-card-2);
  --ink:var(--text-1);--ink-2:var(--text-2);--ink-3:var(--text-3);
  --line:var(--line);--line-strong:var(--line-strong);
  --gold:var(--primary);--gold-hi:var(--primary-strong);--gold-deep:var(--primary-dim);--gold-ink:var(--on-action);
  --gold-soft:var(--primary-soft);--gold-line:var(--accent-line);
  --green:var(--success);--green-hi:var(--success);--green-soft:var(--success-soft);--green-line:rgba(82,183,136,.30);
  --glass:rgba(30,26,19,.62); --glass-line:rgba(255,255,255,.10);
  --shadow-pop:0 1px 1px rgba(0,0,0,.4),0 12px 28px -12px rgba(0,0,0,.6),0 30px 60px -30px rgba(0,0,0,.72);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 8px 18px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);overflow:hidden;font-family:var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
svg{display:block}
::selection{background:var(--gold-soft)}

/* ── 全屏容器：生产为整屏，无桌面手机壳 / 无机型状态栏 ── */
#app.phone{position:relative;z-index:1;width:100%;height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;background:var(--canvas);
  transition:background .4s var(--ease),color .4s var(--ease)}
#app.phone::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 30% at 50% -6%,rgba(176,138,60,.13),transparent 62%),
    radial-gradient(90% 20% at 88% 2%,rgba(43,107,79,.10),transparent 70%)}
html[data-theme="dark"] #app.phone::after{opacity:.7}
/* 页面自有布局元素提升层叠顺序。
   注意：必须排除 pura 注入的 nav.pura-sidebar —— 它在短屏下依赖 app.css 的
   position:absolute 悬浮于左侧，若被本条规则改为 relative 会占流把内容区整体下推 */
#app.phone>header,#app.phone>nav:not(.pura-sidebar),#app.phone>main{position:relative;z-index:1}
/* Pura X View 短屏（视口高≤720px，common.js 自动注入 .pura-sidebar）：
   恢复 app.css 定义的横向布局（侧边栏绝对定位、内容区 margin-left:56px），
   避免本页 flex-direction:column 将内容区纵向顶出视口 */
@media (max-height:720px){
  #app.phone.has-pura-sidebar{flex-direction:row}
}

/* ── 顶栏：navbar 规范（返回钮 demo 圆形玻璃 + 居中页面名，无右侧操作） ── */
.topbar{flex:none;position:relative;display:flex;align-items:center;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--canvas)}
.iconbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--glass-line);color:var(--ink-2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow-card)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:18px;height:18px}
.topbar .nav-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:60%;font-family:var(--font-serif);font-size:16.5px;font-weight:700;
  letter-spacing:.02em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 分类快捷标签条：当分类宫格滚出视口时在标题下方出现，单行横滑 ── */
.cat-strip{flex:none;display:none;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:7px 12px 9px;background:var(--canvas);border-bottom:1px solid var(--line)}
.cat-strip.on{display:flex}
.cat-strip::-webkit-scrollbar{display:none}
.cat-strip .cchip{flex:none;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--ink-2);
  padding:5px 13px;border-radius:var(--r-chip);background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-card);transition:transform .12s var(--ease),background .15s,border-color .15s,color .15s}
.cat-strip .cchip:active{transform:scale(.95);background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-deep)}
html[data-theme="dark"] .cat-strip .cchip:active{color:var(--gold-hi)}

/* ── 对话流 ── */
#flow{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:8px 16px 96px}
#flow::-webkit-scrollbar{display:none}

/* 消息行 */
.msg{display:flex;gap:8px;margin-top:12px;animation:rise .42s var(--ease-spring) both}
.msg .mava{position:relative;flex:none;width:28px;height:28px;border-radius:50%;margin-top:2px;
  display:grid;place-items:center;color:#fff;
  background:
    radial-gradient(120% 120% at 28% 20%,rgba(255,246,220,.95),rgba(255,246,220,0) 48%),
    linear-gradient(150deg,var(--gold-hi),var(--gold) 60%,var(--gold-deep));
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.45),
    inset 0 -2px 5px rgba(96,68,24,.30),
    0 3px 9px -2px rgba(176,138,60,.50)}
.msg .mava::after{content:"";position:absolute;inset:-1px;border-radius:50%;
  border:1px solid rgba(255,255,255,.30);pointer-events:none}
.msg .mava svg{width:15px;height:15px;filter:drop-shadow(0 1px 1px rgba(96,68,24,.20))}
.msg .mcol{min-width:0;flex:1}
.bubble{position:relative;display:inline-block;max-width:100%;padding:9px 14px;border-radius:var(--r-bubble);
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-size:15.5px;line-height:1.5;box-shadow:var(--shadow-card);border-top-left-radius:6px}
.bubble a{color:var(--gold-deep);font-weight:700;text-decoration:underline}
html[data-theme="dark"] .bubble a{color:var(--gold-hi)}
.bubble .cursor{display:inline-block;width:2px;height:15px;margin-left:2px;vertical-align:-2px;
  background:var(--gold);border-radius:1px;animation:blink .9s steps(1) infinite}
.msg.me{flex-direction:row-reverse}
.msg.me .uava{flex:none;width:28px;height:28px;border-radius:var(--r-chip);margin-top:2px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-3)}
.msg.me .uava svg{width:15px;height:15px}
.msg.me .mcol{display:flex;flex-direction:column;align-items:flex-end;flex:1}
.ububble{position:relative;display:inline-flex;align-items:center;gap:7px;max-width:100%;
  padding:10px 14px;border-radius:var(--r-bubble);border-top-right-radius:6px;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 70%);color:var(--gold-ink);
  font-size:14.5px;font-weight:600;line-height:1.5;box-shadow:0 6px 16px -8px rgba(124,93,32,.6)}
.ububble .tag-side{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:1.5px 5px;border-radius:5px;background:rgba(255,255,255,.22)}
.undo{margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:3px 4px;font-size:10.5px;
  color:var(--ink-3);font-weight:600;border-radius:7px}
.undo:active{color:var(--gold-deep)}
.undo svg{width:12px;height:12px}

/* 三点输入指示 */
.typing{display:inline-flex;align-items:center;gap:5px;padding:13px 16px;border-radius:var(--r-bubble);
  border-top-left-radius:6px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.45;animation:tb 1.15s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}

/* 选项：八大类 2 列宫格 */
.opts{margin-top:7px;max-width:100%}
.opts.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tile{position:relative;text-align:left;padding:9px 12px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;gap:5px;overflow:hidden;
  transition:transform .14s var(--ease),border-color .18s,box-shadow .18s;animation:rise .4s var(--ease-spring) both}
.tile:nth-child(1){animation-delay:.03s}.tile:nth-child(2){animation-delay:.08s}
.tile:nth-child(3){animation-delay:.13s}.tile:nth-child(4){animation-delay:.18s}
.tile:nth-child(5){animation-delay:.23s}.tile:nth-child(6){animation-delay:.28s}
.tile:nth-child(7){animation-delay:.33s}.tile:nth-child(8){animation-delay:.38s}
.tile:active{transform:scale(.965);border-color:var(--gold-line)}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle,var(--gold-soft),transparent 72%);opacity:.85}
.tile .tic{position:relative;z-index:1;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--gold-soft),var(--world));color:var(--gold-deep);box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="dark"] .tile .tic{color:var(--gold-hi)}
.tile .tic svg{width:17px;height:17px}
.tile b{position:relative;z-index:1;display:block;font-size:14.5px;font-weight:700;line-height:1.2}
.tile span{position:relative;z-index:1;display:block;font-size:10.5px;line-height:1.3;color:var(--ink-3)}

/* 选项：单列富卡 */
.opts.rows{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-radius:var(--r-card);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-card);
  transition:transform .14s var(--ease),border-color .18s;animation:rise .4s var(--ease-spring) both}
.opts.rows .opt:nth-child(1){animation-delay:.04s}.opts.rows .opt:nth-child(2){animation-delay:.1s}
.opts.rows .opt:nth-child(3){animation-delay:.16s}.opts.rows .opt:nth-child(4){animation-delay:.22s}
.opt:active{transform:scale(.98)}
.opt .oic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.opt .oic svg{width:22px;height:22px}
.opt.supply .oic{background:var(--gold-soft);color:var(--gold-deep)}
.opt.demand .oic{background:var(--green-soft);color:var(--green)}
.opt.action .oic{background:var(--world);color:var(--ink-2)}
html[data-theme="dark"] .opt.supply .oic{color:var(--gold-hi)}
.opt .obd{flex:1;min-width:0}
.opt .obd b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.opt .obd span{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);line-height:1.4}
.opt .oside{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:var(--r-chip)}
.opt.supply .oside{color:var(--gold-deep);background:var(--gold-soft)}
.opt.demand .oside{color:var(--green);background:var(--green-soft)}
html[data-theme="dark"] .opt.supply .oside{color:var(--gold-hi)}
html[data-theme="dark"] .opt.demand .oside{color:var(--green-hi)}
.opt.action .oside{display:none}

/* 锁定入口：当前身份不可发布的类型弱化展示，保留入口可见性并标注所需认证 */
.opt.is-locked{opacity:.62}
.opt.is-locked .obd b{color:var(--ink-3)}
.opt.is-locked .oic{color:var(--ink-3);opacity:.55}
.opt.is-locked .ogo{opacity:0}
.opt.supply.is-locked .oside,.opt.demand.is-locked .oside{color:var(--primary-dim);background:var(--primary-soft);border:1px dashed var(--accent-line)}
html[data-theme="dark"] .opt.supply.is-locked .oside,html[data-theme="dark"] .opt.demand.is-locked .oside{color:var(--primary-dim);background:var(--primary-soft);border-color:var(--accent-line)}
.tile.is-locked{opacity:.62}
.tile.is-locked .tic{color:var(--ink-3);opacity:.55}
.tile.is-locked b{color:var(--ink-3)}
.tile .lock-tag{position:absolute;right:8px;top:8px;z-index:2;font-size:9px;font-weight:700;letter-spacing:.02em;
  padding:2.5px 7px;border-radius:999px;color:var(--primary-dim);background:var(--bg-card);
  border:1px solid var(--accent-line);box-shadow:0 1px 4px rgba(74,58,32,.08)}
html[data-theme="dark"] .tile .lock-tag{color:var(--primary-dim);background:var(--bg-card);border-color:var(--accent-line)}
.opt .ogo{flex:none;color:var(--ink-3);margin-left:2px}
.opt .ogo svg{width:16px;height:16px}
.opt.supply:active{border-color:var(--gold-line)}
.opt.demand:active{border-color:var(--green-line)}

/* 确认卡（成功态） */
.confirm{margin-top:10px;border-radius:var(--r-card);padding:15px 15px 14px;
  background:linear-gradient(150deg,var(--success-soft),rgba(43,107,79,.03));
  border:1px solid var(--green-line);box-shadow:var(--shadow-card);animation:rise .42s var(--ease-spring) both}
.confirm .chd{display:flex;align-items:center;gap:10px}
.confirm .cic{flex:none;width:38px;height:38px;border-radius:var(--r-ctrl);display:grid;place-items:center;background:var(--green);color:#fff}
.confirm .cic svg{width:21px;height:21px}
.confirm b{font-size:14.5px;font-weight:700;line-height:1.35;color:var(--green)}
html[data-theme="dark"] .confirm b{color:var(--green-hi)}
.confirm p{margin:9px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.confirm .cbar{margin-top:12px;height:4px;border-radius:99px;background:var(--green-soft);overflow:hidden}
.confirm .cbar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--green-hi),var(--green));animation:load 5s var(--ease) infinite}
.confirm .cgo{margin-top:12px;width:100%;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--green);color:#fff;font-size:14.5px;font-weight:700}
.confirm .cgo:active{transform:scale(.98)}
.confirm .cgo svg{width:17px;height:17px}

/* ── 右下角固定悬浮：转人工客服（液态玻璃，样式对齐信息工作台 .wb-act） ── */
.fab-help{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;
  padding:0 20px;border-radius:999px;font-size:14.5px;font-weight:600;letter-spacing:.02em;
  color:#33260F;transition:transform .16s ease,box-shadow .16s ease;
  background:linear-gradient(180deg,rgba(255,253,248,.88),rgba(247,242,233,.62));
  -webkit-backdrop-filter:blur(32px) saturate(200%);backdrop-filter:blur(32px) saturate(200%);
  box-shadow:0 10px 28px -10px rgba(60,45,20,.28),inset 0 1px 0 rgba(255,255,255,.55)}
.fab-help svg{width:17px;height:17px;flex:none}
.fab-help:active{transform:scale(.96)}
html[data-theme="dark"] .fab-help{color:#FFF0CF;
  background:linear-gradient(180deg,rgba(26,23,19,.86),rgba(26,23,19,.56));
  box-shadow:0 10px 28px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}

/* ── 动效 ── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes tb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .msg,.tile,.opt,.confirm{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div id="app" class="phone">
  <header class="topbar">
    <button class="iconbtn" id="btnBack" type="button" aria-label="返回">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"/></svg>
    </button>
    <div class="nav-title">发布助手</div>
  </header>

  <nav class="cat-strip" id="catStrip" aria-label="发布分类快捷切换"></nav>

  <main id="flow"></main>
</div>

<!-- ══ 右下角固定悬浮：转人工客服（液态玻璃，样式对齐信息工作台 .wb-act） ══ -->
<a class="fab-help" href="javascript:void(0)" onclick="window.contactService&&contactService()" aria-label="转人工客服">
  <svg viewBox="0 0 256 256" fill="currentColor"><path d="M204.73,51.85A108.07,108.07,0,0,0,20,128v56a28,28,0,0,0,28,28H64a28,28,0,0,0,28-28V144a28,28,0,0,0-28-28H44.84A84.05,84.05,0,0,1,128,44h.64a83.7,83.7,0,0,1,82.52,72H192a28,28,0,0,0-28,28v40a28,28,0,0,0,28,28h19.6A20,20,0,0,1,192,228H136a12,12,0,0,0,0,24h56a44.05,44.05,0,0,0,44-44V128A107.34,107.34,0,0,0,204.73,51.85ZM64,140a4,4,0,0,1,4,4v40a4,4,0,0,1-4,4H48a4,4,0,0,1-4-4V140Zm124,44V144a4,4,0,0,1,4-4h20v48H192A4,4,0,0,1,188,184Z"/></svg>
  转人工客服
</a>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>

  function $(s,r){return (r||document).querySelector(s);}
  function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
  function svg(name,cls){return '<svg viewBox="0 0 256 256" fill="currentColor"'+(cls?' class="'+cls+'"':'')+'><path d="'+ICONS[name]+'"/></svg>';}
  function scrollBottom(){flowEl.scrollTop=flowEl.scrollHeight;}
  function follow(){if(engaged)scrollBottom();}
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

  function typeInto(node,text,speed){
    return new Promise(function(res){
      if(reduced){node.textContent=text;res();return;}
      var i=0;var cur=el('span','');var k=el('span','cursor');node.innerHTML='';node.appendChild(cur);node.appendChild(k);
      (function step(){if(i>=text.length){k.remove();res();return;}cur.textContent+=text[i++];follow();setTimeout(step,speed||16);})();
    });
  }

  function botRow(){var row=el('div','msg bot');row.appendChild(el('span','mava',svg('spark')));var col=el('div','mcol');row.appendChild(col);return {row:row,col:col};}
  function typingBubble(col){var t=el('div','typing','<i></i><i></i><i></i>');col.appendChild(t);follow();return t;}

  /* 二级选项完整展示 FLOW 配置的全部入口（详细类 + 简要类），不再按身份裁剪；
     对当前身份不可发布的类型标记 _locked，渲染时弱化并提示所需认证，点击引导认证 */
  function filterOpts(opts){
    return opts.map(function(o){
      if(!o.type) return o;
      var n=Object.assign({},o);
      n._locked=!allowed[o.type];
      return n;
    });
  }
  /* 锁定原因文案：详细类需企业认证；求职类需个人专业入驻 */
  function lockReason(typeKey){
    var t=(window.PUBLISH_TYPES&&PUBLISH_TYPES[typeKey])?PUBLISH_TYPES[typeKey]:null;
    if(!t) return '需认证';
    if(t.detailLevel==='detail') return '需企业认证';
    if(t.cat==='求职') return '需专业入驻';
    return '需认证';
  }

  function renderQuestion(qkey,q,opt){
    opt=opt||{};
    var p=(async function(){
      var opts=filterOpts(q.options);
      if(!opts.length){
        var empty=botRow();flowEl.appendChild(empty.row);
        empty.col.appendChild(el('div','bubble','当前身份暂无可发布的该类目，<a href="javascript:void(0)" onclick="openKefu&&openKefu()">联系客服</a> 了解认证后可发布的类型。'));
        scrollBottom();return;
      }
      var br=botRow();flowEl.appendChild(br.row);
      var bubble=el('div','bubble','');br.col.appendChild(bubble);
      if(!opt.instant&&!reduced){var tb=typingBubble(br.col);await sleep(430);tb.remove();}
      await typeInto(bubble,q.text);

      var wrap=el('div','opts '+(q.grid?'tiles':'rows'));
      if(q.grid){
        wrap.innerHTML=opts.map(function(o){
          return '<button type="button" class="tile'+(o._locked?' is-locked':'')+'" data-key="'+esc(o.key)+'">'
            +'<span class="tic">'+svg(CATICON[o.cat]||'lifebuoy')+'</span>'
            +'<span><b>'+esc(o.label)+'</b><span>'+esc(o.sub)+'</span></span>'
            +(o._locked?'<span class="lock-tag">'+esc(lockReason(o.type))+'</span>':'')+'</button>';
        }).join('');
      }else{
        wrap.innerHTML=opts.map(function(o){
          var side=o.side||'action';
          var icn=side==='supply'?'up':side==='demand'?'down':(o.action==='help'?'lifebuoy':'squaresfour');
          var badge=side==='supply'?'供':side==='demand'?'需':'';
          return '<button type="button" class="opt '+side+(o._locked?' is-locked':'')+'" data-key="'+esc(o.key)+'">'
            +'<span class="oic">'+svg(icn)+'</span>'
            +'<span class="obd"><b>'+esc(o.label)+'</b><span>'+(o.sub?esc(o.sub):'')+'</span></span>'
            +(o._locked?'<span class="oside lock">'+esc(lockReason(o.type))+'</span>':(badge?'<span class="oside">'+badge+'</span>':''))
            +'<span class="ogo">'+svg('go')+'</span></button>';
        }).join('');
      }
      wrap.addEventListener('click',function(ev){
        var btn=ev.target.closest('[data-key]');if(!btn)return;
        var o=null;opts.forEach(function(x){if(x.key===btn.dataset.key)o=x;});
        if(o)choose(o,qkey);
      });
      br.col.appendChild(wrap);
      follow();
    })();
    busy=p;return p;
  }

  function appendUser(o){
    var row=el('div','msg me');
    row.appendChild(el('span','uava',svg('user')));
    var col=el('div','mcol');
    var side=o.side==='supply'?'<span class="tag-side">供</span>':o.side==='demand'?'<span class="tag-side">需</span>':'';
    col.appendChild(el('div','ububble',side+esc(o.label)));
    var undo=el('button','undo',svg('undo')+'撤销上一步');
    undo.type='button';
    undo.onclick=function(){undoLast();};
    col.appendChild(undo);
    row.appendChild(col);
    flowEl.appendChild(row);
    follow();
  }

  function choose(o,qkey){
    /* 锁定入口：当前身份不可发布，提示所需认证并引导至认证中心，不进入编辑器 */
    if(o.type&&o._locked){
      if(window.UI&&UI.toast) UI.toast('「'+lockReason(o.type)+'」后方可发布','warn');
      setTimeout(function(){ location.href='../profile/auth.html'; },420);
      return;
    }
    busy=(async function(){
      await busy;
      if(goTimer){clearTimeout(goTimer);goTimer=null;}
      engaged=true;
      appendUser(o);
      stack.push({qkey:qkey,o:o,key:o.key});
      if(o.type){goConfirm(o);}
      else if(o.action==='help'){contactService();}
      else if(o.action==='choose'){
        /* 「查看全部类型」：原地弹出底部类型选择，不再跳转独立 choose.html */
        if(window.PublishTypeSheet){
          PublishTypeSheet.open({ title:'选择发布类型', sub:'选择一个类型，进入对应的发布表单' });
        } else {
          location.href = 'index.html';
        }
      }
      else if(o.next){await renderQuestion(o.next,FLOW[o.next],{});}
    })();
    return busy;
  }

  /* 确认卡：逐字文案 + 800ms 后打开真实发布页（与原生产页一致）；按钮可立即前往 */
  function goConfirm(o){
    var label=typeLabel(o.type);
    var href=typeHref(o.type);
    var br=botRow();flowEl.appendChild(br.row);
    var card=el('div','confirm');
    card.innerHTML='<div class="chd"><span class="cic">'+svg('seal')+'</span><b>好的，即将为你打开「'+esc(label)+'」发布页。</b></div>'
      +'<p>已按你的身份选好发布类型，进去直接填内容即可。</p>'
      +'<div class="cbar"><i></i></div>'
      +'<a class="cgo" href="'+esc(href)+'">进入发布页 '+svg('go')+'</a>';
    br.col.appendChild(card);
    follow();
    goTimer=setTimeout(function(){location.href=href;},5000);
  }

  function rebuildTo(idx){
    if(goTimer){clearTimeout(goTimer);goTimer=null;}
    stack=stack.slice(0,idx+1);
    if(!stack.length){engaged=false;flowEl.scrollTop=0;}
    flowEl.innerHTML='';
    if(!stack.length){renderQuestion('q1',FLOW.q1,{instant:true});syncStrip();}
    else{
      var last=stack[stack.length-1];
      engaged=true;
      if(last.o.next){renderQuestion(last.o.next,FLOW[last.o.next],{instant:true});}
      else if(last.o.type){goConfirm(last.o);}
      else{renderQuestion(last.qkey,FLOW[last.qkey],{instant:true});}
    }
  }
  function undoLast(){rebuildTo(stack.length-2);}

  /* ── 主题：跟随全站 <html data-theme> 与 engchain-theme（初始化由头部 data-theme-fix 完成） ── */
  var root=document.documentElement;
  function paintTheme(){
    var dark=root.getAttribute('data-theme')==='dark';
    var mt=document.getElementById('metaTheme');if(mt)mt.setAttribute('content',dark?'#16130E':'#F4F1EA');
  }
  function setTheme(t){root.setAttribute('data-theme',t);try{localStorage.setItem('engchain-theme',t);}catch(e){}paintTheme();}
  $('#btnBack').onclick=function(){history.back();};
  paintTheme();

  /* ── 分类快捷标签条：宫格滚出视口时在标题下方出现，单行横滑；点击直达对应分类供需 ── */
  var stripEl=$('#catStrip');
  function buildStrip(){
    stripEl.innerHTML=FLOW.q1.options.map(function(o){
      return '<button type="button" class="cchip" data-key="'+esc(o.key)+'">'+esc(o.label)+'</button>';
    }).join('');
    stripEl.querySelectorAll('.cchip').forEach(function(b){
      b.onclick=function(){
        if(goTimer){clearTimeout(goTimer);goTimer=null;}
        stack=[];engaged=false;
        flowEl.innerHTML='';
        renderQuestion('q1',FLOW.q1,{instant:true});
        var qk='q-'+b.dataset.key,q=FLOW[qk];
        if(q)renderQuestion(qk,q,{instant:true});
        setTimeout(syncStrip,160);
      };
    });
  }
  function syncStrip(){
    var tiles=flowEl.querySelector('.opts.tiles');
    var show=false;
    if(tiles){
      var tr=tiles.getBoundingClientRect(),fr=flowEl.getBoundingClientRect();
      if(tr.bottom<fr.top-8)show=true;
    }
    stripEl.classList.toggle('on',show);
  }
  flowEl.addEventListener('scroll',syncStrip);
  buildStrip();
  syncStrip();

  /* ── 上次发布快捷卡（重复发布者一键直达；新用户无记录则走对话） ──
     记录由 editor.html 提交成功时写入 localStorage『engchain-last-publish』 */
  var lastPub = null;
  try {
    var _lp = JSON.parse(localStorage.getItem('engchain-last-publish') || 'null');
    if (_lp && _lp.type && window.PUBLISH_TYPES && PUBLISH_TYPES[_lp.type]) lastPub = _lp;
  } catch (e) {}
  var fastMode = !!lastPub;
  if (lastPub) {
    var _lt = (window.PUBLISH_TYPES[lastPub.type] && window.PUBLISH_TYPES[lastPub.type].label) || lastPub.type;
    /* G-G1：统一走现有 publishTypeHref(type) 路由，detail→editor、brief→brief-editor，不在本页硬编码编辑器地址 */
    var _href = window.publishTypeHref ? publishTypeHref(lastPub.type) : 'guide.html';
    var _lrow = botRow(); flowEl.appendChild(_lrow.row);
    var _lcard = el('div', 'confirm lastpub-card');
    _lcard.innerHTML = '<div class="chd"><span class="cic">' + svg('seal') + '</span><b>上次发布：「' + esc(_lt) + '」</b></div>'
      + '<p>继续发布同一类型，可直接进入表单；想发别的类型，从下方对话重新选择。</p>'
      + '<div class="cbar"><i></i></div>'
      + '<a class="cgo" href="' + esc(_href) + '">再次发布 ' + svg('go') + '</a>';
    _lrow.col.appendChild(_lcard);
    follow();
  }

  renderQuestion('q1',FLOW.q1,{instant:reduced || fastMode});
})();
</script>
</body>
</html>
