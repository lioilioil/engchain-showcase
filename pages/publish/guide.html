<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/publish/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>发布助手 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
.phone{--canvas:#F4F2EE;--world:#EFECE3;--panel:#FFFFFF;--line:rgba(38,30,18,.10);--line-strong:rgba(38,30,18,.16);--ink:#26201A;--ink-2:rgba(38,30,18,.66);--ink-3:rgba(38,30,18,.44);--gold:#B08A3C;--gold-hi:#C9A45C;--gold-deep:#7A5C1E;--gold-soft:rgba(138,106,40,.12);--green:#2B6B4F;--green-soft:rgba(43,107,79,.1);}
html[data-theme="dark"] .phone{--canvas:#14120F;--world:#1A1713;--panel:#211D18;--line:rgba(244,240,233,.12);--line-strong:rgba(244,240,233,.22);--ink:#F4F0E9;--ink-2:rgba(244,240,233,.72);--ink-3:rgba(244,240,233,.48);--gold-hi:#C9A45C;--gold:#C9A45C;--gold-deep:#8A6A28;--gold-soft:rgba(201,164,92,.16);--green:#6FB89A;--green-soft:rgba(111,184,154,.14);}
html,body{margin:0;height:100%;overflow:hidden;}
.phone{background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
/* 顶栏 */
.g-top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);}
.g-back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;text-decoration:none;}
.g-back svg{width:14px;height:14px;}
.g-title{flex:1;font-family:"Noto Serif SC",serif;font-size:17px;font-weight:700;letter-spacing:.02em;}
.g-help{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 11px;border-radius:999px;background:var(--gold-soft);border:1px solid rgba(138,106,40,.3);color:var(--gold-deep);font-size:11.5px;font-weight:600;text-decoration:none;}
html[data-theme="dark"] .g-help{color:var(--gold-hi);}
.g-help svg{width:13px;height:13px;}
/* 对话区 */
.g-chat{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px;}
.g-bubble{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;}
.g-bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px;color:var(--ink);}
.g-user{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--gold-hi));color:#fff;border-top-right-radius:4px;font-weight:600;}
/* 选项组 */
.g-opts{display:flex;flex-direction:column;gap:8px;margin-top:2px;max-width:88%;align-self:flex-end;width:100%;}
.g-opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s;}
.g-opt:active{transform:scale(.97);border-color:var(--gold);}
.g-opt .o-ic{flex:none;width:32px;height:32px;border-radius:9px;background:var(--world);display:flex;align-items:center;justify-content:center;color:var(--gold-deep);}
html[data-theme="dark"] .g-opt .o-ic{color:var(--gold-hi);}
.g-opt .o-ic svg{width:17px;height:17px;}
.g-opt .o-bd{flex:1;min-width:0;}
.g-opt .o-bd b{display:block;font-size:13px;font-weight:700;}
.g-opt .o-bd span{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-3);line-height:1.4;font-weight:400;}
.g-opt .o-go{flex:none;font-size:13px;color:var(--ink-3);}
/* 撤销行 */
.g-undo{align-self:center;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-3);font-size:11px;cursor:pointer;}
.g-undo svg{width:11px;height:11px;}
/* 最近发布 */
.g-recent{flex:none;display:flex;flex-direction:column;gap:6px;padding:0 14px 2px;}
.g-recent-lb{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;}
.g-recent-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.g-recent-row::-webkit-scrollbar{display:none;}
.r-chip{flex:none;display:flex;align-items:center;gap:6px;max-width:190px;padding:7px 11px;border-radius:999px;background:linear-gradient(135deg,var(--gold-soft),rgba(138,106,40,.04));border:1px solid rgba(138,106,40,.3);color:var(--ink);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap;overflow:hidden;}
.r-chip svg{flex:none;width:11px;height:11px;color:var(--gold-deep);}
html[data-theme="dark"] .r-chip svg{color:var(--gold-hi);}
.r-chip b{overflow:hidden;text-overflow:ellipsis;}
/* 底部客服条 */
.g-foot{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.g-foot-note{flex:1;font-size:10.5px;color:var(--ink-3);line-height:1.5;}
.g-foot-btn{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:600;text-decoration:none;}
.g-foot-btn svg{width:14px;height:14px;}
/* 确认动效 */
.g-confirm{align-self:flex-start;max-width:88%;padding:10px 13px;border-radius:14px;background:var(--green-soft);border:1px solid rgba(43,107,79,.3);color:var(--green);font-size:13px;line-height:1.55;border-top-left-radius:4px;}
html[data-theme="dark"] .g-confirm{color:#6FB89A;}
</style>
</head>

  <div class="g-top">
    <a class="g-back" href="index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>

  </div>
</div>

<script>
(function(){
  var st = (window.UI && UI.state) ? UI.state.get() : {};
  if (!st.loggedIn) { location.href = '../auth/login.html'; return; }
  var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
  if (!(auth.realname && auth.realname.ok)) { location.href = '../profile/auth-personal.html'; return; }

  var acc = null, allowed = {};
  try {
    acc = window.entryAccess ? entryAccess() : null;
    var keys = window.availableTypesByAccount ? availableTypesByAccount(acc) : [];
    keys.forEach(function(k){ allowed[k] = true; });
  } catch(e){}

  /* ---- 对话流：首问 → 第 2 问 → 确认（仅单选；type 直链；其他→客服/全部类型） ---- */
  var ICONS = {
    material:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>',
    equipment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="3"/><path d="M13 22a9 9 0 1 1 8.5-11.7L22 11"/><path d="M17.5 6.5L22 2"/></svg>',
    labor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    transport:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
    firm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    talent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    agency:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    other:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>'
  };

  var FLOW = {
    q1: {
      text: '你好，欢迎使用工程链发布助手。你想发布哪方面的信息？',
      options: [
        { key:'material', label:'材料', sub:'材料供应 / 采购', ic:'material', next:'q-material' },
        { key:'equipment', label:'设备', sub:'设备租赁 / 买卖', ic:'equipment', next:'q-equipment' },
        { key:'labor', label:'劳务', sub:'班组接活 / 找工人', ic:'labor', next:'q-labor' },
        { key:'transport', label:'运输', sub:'运力供应 / 用车运输', ic:'transport', next:'q-transport' },
        { key:'firm', label:'建筑企业', sub:'招商加盟 / 转让收购', ic:'firm', next:'q-firm' },
        { key:'talent', label:'人才', sub:'企业招人 / 个人求职', ic:'talent', next:'q-talent' },
        { key:'agency', label:'中介服务', sub:'服务商接单 / 找中介', ic:'agency', next:'q-agency' },
        { key:'other', label:'其他', sub:'人工客服 / 全部类型', ic:'other', next:'q-other' }
      ]
    },
    'q-material': {
      text: '材料方面，你是供应方还是采购方？',
      options: [
        { key:'material-supply', label:'我有材料要卖', sub:'材料生产企业 / 经销商发布供应', type:'material-supply' },
        { key:'material-demand', label:'我要采购材料', sub:'项目采购询价，一句话发布', type:'material-demand' }
      ]
    },
    'q-equipment': {
      text: '设备方面，你是供应方还是需求方？',
      options: [
        { key:'equipment-supply', label:'我有设备可租可卖', sub:'租赁公司 / 机主发布供应', type:'equipment-supply' },
        { key:'equipment-demand', label:'我要租或买设备', sub:'项目急租 / 采购，一句话发布', type:'equipment-demand' }
      ]
    },
    'q-labor': {
      text: '劳务方面，你是供应方还是需求方？',
      options: [
        { key:'labor-supply', label:'我有班组要接活', sub:'劳务公司 / 班组长发布供应', type:'labor-supply' },
        { key:'labor-demand', label:'我要找工人干活', sub:'项目分包 / 找班组，一句话发布', type:'labor-demand' }
      ]
    },
    'q-transport': {
      text: '运输方面，你是供应方还是需求方？',
      options: [
        { key:'transport-supply', label:'我有车队运力', sub:'物流 / 运输公司发布供应', type:'transport-supply' },
        { key:'transport-demand', label:'我要用车运输', sub:'项目运输 / 租赁承包，一句话发布', type:'transport-demand' }
      ]
    },
    'q-firm': {
      text: '建筑企业方面，你需要做什么？',
      options: [
        { key:'franchise-supply', label:'我司招加盟 / 单项目合作', sub:'总公司招商，长期合作', type:'franchise-supply' },
        { key:'franchise-demand', label:'我想加盟或挂靠', sub:'加入总公司 / 单项目挂靠', type:'franchise-demand' },
        { key:'trade-supply', label:'我要转让公司', sub:'转让公司股权与资质', type:'trade-supply' },
        { key:'trade-demand', label:'我要收购公司', sub:'收购 / 控股建筑企业', type:'trade-demand' }
      ]
    },
    'q-talent': {
      text: '人才方面，你的身份是？',
      options: [
        { key:'personnel-demand', label:'企业方，我要招人', sub:'发布详细招聘岗位', type:'personnel-demand' },
        { key:'talent-supply', label:'个人，我要找工作', sub:'求职简历 / 求职意向', type:'talent-supply' }
      ]
    },
    'q-agency': {
      text: '中介服务方面，你的身份是？',
      options: [
        { key:'agency-supply', label:'我是服务商，提供服务', sub:'资质代办 / 咨询等中介服务', type:'agency-supply', viaSeller:true },
        { key:'agency-demand', label:'我要找中介办事', sub:'找中介代办 / 咨询服务', type:'agency-demand' }
      ]
    },
    'q-other': {
      text: '需要帮助吗？',
      options: [
        { key:'help', label:'转人工客服', sub:'专业顾问协助发布', action:'help' },
        { key:'all', label:'查看全部类型', sub:'直接选择全部发布类型', action:'choose' }
      ]
    }
  };

  var chat = document.getElementById('chat');
  var stack = []; /* 用户选择轨迹（含 key 与上一问） */

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function addBubble(cls, html){
    var d = document.createElement('div');
    d.className = cls;
    d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  /* 身份过滤：选项的 type 必须在该身份可发布集合内（纯后端身份门控的可视化一致） */
  function filterOpts(opts){
    return opts.filter(function(o){
      if (!o.type) return true; /* 动作类不过滤 */
      return !!allowed[o.type];
    });
  }

  function renderQuestion(qkey, q){
    var opts = filterOpts(q.options);
    if (!opts.length) {
      addBubble('g-bubble g-bot', '当前身份暂无可发布的该类目，<a href="../help/index.html" style="color:var(--gold-deep)">联系客服</a> 了解认证后可发布的类型。');
      return;
    }
    addBubble('g-bubble g-bot', esc(q.text));
    var wrap = document.createElement('div');
    wrap.className = 'g-opts';
    wrap.innerHTML = opts.map(function(o){
      return '<button type="button" class="g-opt" data-key="'+esc(o.key)+'">'
        + '<span class="o-ic">' + (ICONS[qkey] || ICONS.other) + '</span>'
        + '<span class="o-bd"><b>'+esc(o.label)+'</b>' + (o.sub?'<span>'+esc(o.sub)+'</span>':'') + '</span>'
        + '<span class="o-go">›</span></button>';
    }).join('');
    wrap.addEventListener('click', function(ev){
      var btn = ev.target.closest('.g-opt');
      if (!btn) return;
      var key = btn.dataset.key;
      var o = null;
      q.options.forEach(function(x){ if (x.key === key) o = x; });
      if (!o) return;
      addBubble('g-bubble g-user', esc(o.label));
      stack.push({ qkey: qkey, o: o, key: key });
      renderUndo();
      if (o.type) goConfirm(o);
      else if (o.action === 'help') location.href = '../help/index.html';
      else if (o.action === 'choose') location.href = 'choose.html';
      else if (o.next) renderQuestion(o.next, FLOW[o.next]);
    });
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function renderUndo(){
    var old = document.getElementById('g-undo');
    if (old) old.parentNode.removeChild(old);
    if (!stack.length) return;
    var u = document.createElement('button');
    u.type = 'button';
    u.id = 'g-undo';
    u.className = 'g-undo';
    u.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>撤销上一步';
    u.addEventListener('click', function(){
      var last = stack.pop();
      var bubbles = chat.querySelectorAll('.g-bubble,.g-opts');
      if (bubbles.length) for (var i = bubbles.length - 1; i >= 0; i--) {
        if (bubbles[i].classList.contains('g-user')) { bubbles[i].parentNode.removeChild(bubbles[i]); break; }
      }
      /* 移除对应问题气泡与选项组（用户气泡之前的一个 bot 气泡 + 紧随的选项组） */
      var all = chat.querySelectorAll('.g-bubble,.g-opts');
      var lastBot = null;
      for (var i = all.length - 1; i >= 0; i--) {
        if (all[i].classList.contains('g-bot') || all[i].classList.contains('g-confirm')) { lastBot = all[i]; break; }
      }
      if (lastBot) {
        var j = Array.prototype.indexOf.call(chat.children, lastBot);
        while (chat.children.length > j) chat.removeChild(chat.children[chat.children.length - 1]);
      }
      renderUndo();
      if (stack.length) {
        var prev = stack[stack.length - 1];
        if (prev.o.next) renderQuestion(prev.o.next, FLOW[prev.o.next]);
        else if (prev.qkey === 'q1') renderQuestion('q1', FLOW.q1);
        else renderQuestion(prev.qkey, FLOW[prev.qkey]);
      } else {
        renderQuestion('q1', FLOW.q1);
      }
    });
    chat.appendChild(u);
    chat.scrollTop = chat.scrollHeight;
  }

  function goConfirm(o){
    var t = PUBLISH_TYPES[o.type];
    var label = t ? t.label : o.label;
    addBubble('g-confirm', '好的，即将为你打开「' + esc(label) + '」发布页。');
    setTimeout(function(){
      location.href = publishTypeHref(o.type);
    }, 800);
  }

  /* 最近发布：最多 3 条，反推 typeKey 快速续发 */
  (function renderRecent(){
    var slot = document.getElementById('recent');
    try {
      var items = (window.SupplyStore && SupplyStore.read) ? (SupplyStore.read().items || []) : [];
      var chips = [];
      for (var i = items.length - 1; i >= 0 && chips.length < 3; i--) {
        var rec = items[i];
        var cat = rec.category || rec.cat || '';
        var roleSide = (rec.role === 'supply' || rec.dir === 'supply') ? 'supply' : 'demand';
        var hit = '';
        Object.keys(PUBLISH_TYPES).forEach(function(k){
          var t = PUBLISH_TYPES[k];
          if (t.cat === cat && t.role === roleSide) hit = k;
        });
        if (hit && allowed[hit]) chips.push({ hit: hit, title: rec.title || PUBLISH_TYPES[hit].label });
      }
      if (!chips.length) return;
      slot.innerHTML = '<div class="g-recent-lb">最近发布</div><div class="g-recent-row">' + chips.map(function(c){
        return '<a class="r-chip" href="'+publishTypeHref(c.hit)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><b>'+esc(c.title)+'</b></a>';
      }).join('') + '</div>';
    } catch(e){}
  })();

  renderQuestion('q1', FLOW.q1);
})();
</script>
</body>
