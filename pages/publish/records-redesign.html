  function cardHtml(r){
    var stClass = r.status || 'pending_review', g = statusGroup(r.status);
    var status = STATUS_LABEL[r.status] || r.status || '未知';
    var dir = r.dir==='supply' ? 'supply' : 'demand';
    var dirIcon = dir==='supply' ? '#i-upload' : '#i-search';
    var cat = r.cat || r.category || '';
    var amount = r.amount || (r.price ? (r.price + (r.unit ? ' '+r.unit : '')) : '');
    var qty = r.qty || '';
    var meta='<span class="meta-item"><svg class="ic"><use href="#i-pin"/></svg>'+esc(r.location||'未填城市')+'</span>'+
             '<span class="meta-item"><svg class="ic"><use href="#i-clock"/></svg>'+esc(fmtTime(r.ts||r.updatedAt))+'</span>';
    var money = (amount||qty) ? '<div class="record-amount">'+(amount?'<span class="amt"><svg class="ic"><use href="#i-wallet"/></svg>'+esc(amount)+'</span>':'')+(qty?'<span class="qty"><svg class="ic"><use href="#i-box"/></svg>'+esc(qty)+'</span>':'')+'</div>' : '';
    var desc = (r.desc||r.description) ? '<p class="record-desc">'+esc(r.desc||r.description)+'</p>' : '';
    var rej = r.rejectNote ? '<div class="record-reject"><svg class="ic"><use href="#i-info"/></svg><span><b>驳回原因：</b>'+esc(r.rejectNote)+'</span></div>' : '';
    var ac = actionsFor(r);
    function btn(b){ var ic = b.ic ? '<svg class="ic">'+IC[b.ic]+'</svg>' : ''; var pend = b.pending ? '<i class="sd" style="width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;animation:sdPulse 1.2s infinite;"></i>' : ''; return '<button class="'+b.cls+'" data-action="'+b.a+'" data-id="'+esc(r.id)+'">'+pend+b.t+ic+'</button>'; }
    return '<article class="record is-'+dir+' is-'+g+'">'+
      '<div class="record-hd">'+
        '<div class="cat-ic">'+catIcon(cat)+'</div>'+
        '<div class="record-main">'+
          '<div class="record-tags"><span class="dir-chip dir-'+dir+'"><svg class="ic" style="width:12px;height:12px"><use href="'+dirIcon+'"/></svg>'+DIR_LABEL[dir]+'</span><span class="cat-name">'+esc(cat||'未分类')+'</span></div>'+
          '<h3 class="record-title">'+esc(r.title)+'</h3>'+
        '</div>'+
        '<span class="record-status status-'+esc(stClass)+(g==='review'?' is-pending':'')+'"><i class="sd"></i>'+esc(status)+'</span>'+
      '</div>'+
      '<div class="record-meta">'+meta+'</div>'+
      money+desc+rej+
      '<div class="record-actions">'+btn(ac.l)+btn(ac.r)+'</div>'+
    '</article>';
  }
  function emptyHtml(){
    return '<div class="empty-state"><div class="empty-ic"><svg class="ic"><use href="#i-doc"/></svg><span class="empty-plus"><svg class="ic" style="width:12px;height:12px"><path d="M12 5v14M5 12h14"/></svg></span></div><div class="empty-title">还没有发布信息</div><div class="empty-desc">发布供需信息，让更多建筑企业与建筑人看到你的需求与资源</div><div class="empty-actions"><a class="empty-btn primary" href="editor-redesign.html?role=demand"><svg class="ic"><use href="#i-search"/></svg>发布需求</a><a class="empty-btn ghost" href="editor-redesign.html?role=supply"><svg class="ic"><use href="#i-upload"/></svg>发布供应</a></div></div>';
  }

  function update(id, patch){
    var st = SupplyStore.read();
    var it = st.items.filter(function(x){return x.id===id;})[0];
    if (!it) return false;
    Object.assign(it, patch);
    SupplyStore.write(st);
    return true;
  }

  function render(){
    var all = myPublishes();
    var rows = all.filter(function(r){
      if (dirFilter!=='all' && r.dir!==dirFilter) return false;
      if (statusFilter!=='all' && statusGroup(r.status)!==statusFilter) return false;
      return true;
    });
    var dirC={all:all.length,demand:0,supply:0};
    var stC={active:0,review:0,rejected:0,closed:0};
    all.forEach(function(r){ if(r.dir==='supply')dirC.supply++;else dirC.demand++; stC[statusGroup(r.status)]++; });
    document.getElementById('sum-all').textContent=all.length;
    document.getElementById('sum-active').textContent=stC.active;
    document.getElementById('sum-review').textContent=stC.review;
    document.getElementById('sum-reject').textContent=stC.rejected;
    document.querySelectorAll('#filters .seg-item').forEach(function(el){ var n=el.querySelector('.seg-n'); if(n)n.textContent=dirC[el.dataset.filter]||0; });
    document.querySelectorAll('#status-row .badge').forEach(function(b){ b.textContent=stC[b.dataset.sn]||0; });
    list.innerHTML = rows.length ? rows.map(cardHtml).join('') : emptyHtml();
  }

  document.querySelectorAll('#filters .seg-item').forEach(function(el){
    el.onclick=function(){ dirFilter=el.dataset.filter; document.querySelectorAll('#filters .seg-item').forEach(function(x){x.classList.remove('is-on');}); el.classList.add('is-on'); render(); };
  });
  document.querySelectorAll('#status-row .status-chip').forEach(function(el){
    el.onclick=function(){ statusFilter=el.dataset.status; document.querySelectorAll('#status-row .status-chip').forEach(function(x){x.classList.remove('is-on');}); el.classList.add('is-on'); render(); };
  });

  list.onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    var id=b.dataset.id, action=b.dataset.action, rec=myPublishes().filter(function(x){return x.id===id;})[0];
    if (action==='__none' || !rec) return;
    if (action==='detail'){ location.href='../supply/detail.html?id='+encodeURIComponent(id); return; }
    if (action==='edit'){ location.href='editor-redesign.html?record='+encodeURIComponent(id); return; }
    if (action==='share'){
      if (window.UI && UI.sheet){
        var sh=UI.sheet(); sh.setText('分享这条发布');
        var channels=['微信好友','朋友圈','复制链接','二维码'], glyphs=['\uD83D\uDCAC','\uD83C\uDF10','\uD83D\uDD17','\u25A6'];
        sh.html('<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:8px 4px;text-align:center;">'+
          channels.map(function(t,i){return '<div style="cursor:pointer;-webkit-tap-highlight-color:transparent;" data-share="'+i+'"><div style="width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dim);display:flex;align-items:center;justify-content:center;font-size:20px;">'+glyphs[i]+'</div><div style="font-size:11px;color:var(--text-2);">'+t+'</div></div>';}).join('')+'</div>');
        sh.body().onclick=function(ev){ var n=ev.target.closest('[data-share]'); if(!n)return; sh.close(); UI.toast('分享链接已复制（演示）','ok'); };
        sh.show();
      } else UI.toast('分享链接已复制（演示）','ok');
      return;
    }
    if (action==='manage'){
      var m=UI.sheet(); m.setText('管理这条发布');
      m.html('<div style="display:flex;flex-direction:column;">'+
        '<button class="btn btn-block" id="m-edit" style="margin-bottom:9px;">编辑信息</button>'+
        '<button class="btn btn-block" id="m-refresh" style="margin-bottom:9px;">刷新置顶 · 提升曝光</button>'+
        '<button class="btn btn-block" id="m-off" style="background:var(--bg-subtle);color:var(--text-2);">下架这条发布</button></div>');
      m.show();
      m.body().querySelector('#m-edit').onclick=function(){ m.close(); location.href='editor-redesign.html?record='+encodeURIComponent(id); };
      m.body().querySelector('#m-refresh').onclick=function(){ m.close(); UI.toast('已刷新置顶，曝光提升中（演示）','ok'); };
      m.body().querySelector('#m-off').onclick=function(){ m.close(); UI.dialog({title:'下架发布',text:'下架后其他用户将看不到这条信息，可随时重新上架。',ok:'确认下架',cancel:'取消',onOk:function(){ if(update(id,{status:'off'})){render();UI.toast('已下架','ok');} }}); };
      return;
    }
    if (action==='withdraw'){
      UI.dialog({title:'撤回审核',text:'撤回后这条信息将被下架，你可以修改后重新提交。',ok:'撤回编辑',cancel:'继续等待',onOk:function(){ if(update(id,{status:'off'})){render();UI.toast('已撤回，可继续编辑','ok');} }});
      return;
    }
    if (action==='republish'){
      UI.dialog({title:'重新上架',text:'将重新提交审核，通过后恢复展示。',ok:'重新提交',cancel:'取消',onOk:function(){ if(update(id,{status:'pending_review'})){render();UI.toast('已重新提交审核','ok');} }});
      return;
    }
  };

  window.addEventListener('engchain:supply', function(){ render(); });
  window.addEventListener('storage', function(e){ if(e.key==='engchain-supply') render(); });
  render();
})();
</script></body></html>
