<style>
  .editor-scroll { padding: 10px 16px 112px; }
  .editor-head { padding: 10px 0 14px; }
  .editor-kicker { color: var(--primary-dim); font: 600 11px var(--font-num); letter-spacing: .08em; }
  .editor-title { margin-top: 4px; font-size: 22px; font-weight: 700; }
  .editor-note { margin-top: 5px; color: var(--text-3); font-size: 12px; }
  .editor-type { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .editor-type button { min-height: 44px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-card); color: var(--text-2); cursor: pointer; }
  .editor-type button.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dim); font-weight: 600; }
  .editor-group { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
  .editor-group:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .editor-group-label { display: flex; align-items: center; gap: 6px; color: var(--text-1); font: 600 13px; margin-bottom: 2px; }
  .editor-group-label svg { width: 15px; height: 15px; color: var(--primary-dim); }
  .editor-group-sub { color: var(--text-3); font-size: 11px; margin-bottom: 4px; }
  .editor-field { margin-top: 13px; }
  .editor-field label { display: block; margin-bottom: 6px; color: var(--text-2); font-size: 12px; font-weight: 600; }
  .editor-field input, .editor-field textarea, .editor-field select { width: 100%; }
  .editor-field textarea { min-height: 88px; resize: vertical; }
  .editor-ai { display: flex; align-items: center; gap: 8px; padding: 9px 10px; margin: 12px 0 0; border: 1px solid var(--accent-line); border-radius: var(--r-m); background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft)); position: relative; overflow: hidden; }
  .editor-ai::before { content: ''; position: absolute; top: -20px; right: -10px; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); opacity: .15; }
  .editor-ai svg { width: 16px; height: 16px; color: var(--primary-dim); flex: none; position: relative; z-index: 1; }
  .editor-ai-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .editor-ai-title { font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .editor-ai-sub { margin-top: 1px; color: var(--text-3); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .editor-ai button { min-height: 28px; padding: 0 10px; font-size: 11px; flex: none; position: relative; z-index: 1; }
  .editor-agree { display: flex; gap: 8px; align-items: flex-start; padding: 12px; margin-top: 15px; border: 1px solid var(--line); border-radius: var(--r-m); color: var(--text-2); font-size: 11px; line-height: 1.6; }
  /* 快捷选项标签 */
  .quick-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .quick-tags span { padding: 4px 9px; border-radius: var(--r-full); background: var(--bg-card); border: 1px solid var(--line); color: var(--text-2); font-size: 10.5px; cursor: pointer; transition: all var(--d-fast); user-select: none; }
  .quick-tags span:hover { border-color: var(--primary); color: var(--primary-dim); background: var(--primary-soft); }
  .quick-tags span.active { border-color: var(--primary); color: var(--primary-dim); background: var(--primary-soft); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <!-- 身份门控：未登录 -->
  <div id="pub-gate-login" style="display:none;text-align:center;padding:60px 24px;">
    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
      <svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-user"/></svg>
    </div>
    <div class="fw-700" style="font-size:17px;margin-top:16px;">登录后发布信息</div>

    <a href="../auth/login.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">立即登录</a>
  </div>
  <!-- 身份门控：未实名 -->
  <div id="pub-gate-realname" style="display:none;text-align:center;padding:60px 24px;">
    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
      <svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-shield"/></svg>
    </div>
    <div class="fw-700" style="font-size:17px;margin-top:16px;">实名认证后可发布信息</div>
    <div class="text-3" style="font-size:12px;margin-top:8px;line-height:1.7;">完成实名认证后，即可发布供需信息并参与平台对接。</div>
    <a href="../profile/auth-personal.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">前往实名认证</a>
  </div>
  <div id="pub-content">
  <div class="navbar" style="height:50px;"><button class="nav-back" onclick="history.back()">‹</button><div class="nav-title" id="nav-title">编辑信息</div><div class="nav-right"></div></div>
  <main class="scroll editor-scroll">
    <header class="editor-head"><div class="editor-kicker">CREATE / UPDATE</div><h1 class="editor-title" id="editor-title">发布需求</h1><p class="editor-note">先保存也没关系，草稿会保留在信息工作台。</p></header>
    <div class="editor-type"><button type="button" data-role="demand">需求 · 找供应</button><button type="button" data-role="supply">供应 · 找需求</button></div>
    <div class="editor-ai"><svg class="ic"><use href="#i-sparkle"/></svg><div class="editor-ai-main"><div class="editor-ai-title">AI 智能补全</div><div class="editor-ai-sub">用一句话描述，自动整理标题和描述</div></div><button class="btn btn-primary" type="button" id="ai-fill">试用示例</button></div>
    <form id="editor-form">
      <section class="editor-group">
        <div class="editor-group-label"><svg class="ic"><use href="#i-doc"/></svg>基础信息</div>
        <div class="editor-field"><label for="f-title">标题 <span class="req">*</span></label><input class="input" id="f-title" required placeholder="例如：急需商品混凝土 C30/C40"></div>
        <div class="editor-field"><label for="f-category">品类</label><select class="input" id="f-category"><option>材料</option><option>劳务</option><option>设备</option><option>项目合作</option><option>中介服务</option></select>
          <div class="quick-tags" data-target="f-category"><span>材料</span><span>劳务</span><span>设备</span><span>项目合作</span></div></div>
        <div class="editor-field"><label for="f-sub">子类 / 品名</label><input class="input" id="f-sub" placeholder="例如：C30商品混凝土 / 盘扣脚手架"></div>
        <div class="editor-field"><label for="f-location">城市 · 区域</label><input class="input" id="f-location" placeholder="例如：成都市·天府新区"></div>
        <div class="editor-field"><label for="f-unit">计量单位</label><input class="input" id="f-unit" placeholder="例如：方 / 吨 / 米 / 天 / 人">
          <div class="quick-tags" data-target="f-unit"><span>方</span><span>吨</span><span>米</span><span>天</span><span>人</span><span>次</span></div></div>
        <div class="editor-field"><label for="f-qty">数量 / 规模</label><input class="input" id="f-qty" placeholder="例如：3000 方 / 500 吨"></div>
      </section>

      <section class="editor-group">
        <div class="editor-group-label"><svg class="ic"><use href="#i-tag"/></svg>交易与要求</div>
        <div class="editor-group-sub">价格、交付与资质要求，将作为详情页「关键参数」展示</div>
        <div class="editor-field"><label for="f-price" id="price-label">预算区间</label><input class="input" id="f-price" inputmode="decimal" placeholder="例如：450000 / 0.32/吨/天"></div>
        <div class="editor-field"><label for="f-spec">规格 / 参数</label><input class="input" id="f-spec" placeholder="例如：C30 泵送 坍落度180±30"></div>
        <div class="editor-field"><label for="f-delivery">交付 / 工期</label><input class="input" id="f-delivery" placeholder="例如：自签订起 30 天内分批交付"></div>
        <div class="editor-field"><label for="f-qual">资质要求</label><input class="input" id="f-qual" placeholder="例如：需三证合一阵营，安全生产许可证"></div>
        <div class="editor-field"><label for="f-tags">标签</label><input class="input" id="f-tags" placeholder="逗号分隔，例如：现货,国标,包配送"></div>
      </section>

      <section class="editor-group">
        <div class="editor-group-label"><svg class="ic"><use href="#i-edit"/></svg>详细描述</div>
        <div class="editor-field"><label for="f-desc">补充说明</label><textarea class="textarea" id="f-desc" placeholder="补充项目概况、要求、工期、资质等信息"></textarea></div>
      </section>

      <section class="editor-group">
        <div class="editor-group-label"><svg class="ic"><use href="#i-user"/></svg>联系与主体<span class="req">*</span></div>
        <div class="editor-group-sub">联系方式用于对接，详情页将对平台用户展示（可解锁）</div>
        <div class="editor-field"><label for="f-contact-name">联系人</label><input class="input" id="f-contact-name" placeholder="姓名"></div>
        <div class="editor-field"><label for="f-contact-phone">手机号</label><input class="input" id="f-contact-phone" inputmode="tel" placeholder="11 位手机号"></div>
        <div class="editor-field"><label for="f-contact-wechat">微信号</label><input class="input" id="f-contact-wechat" placeholder="微信 / 备用联系方式"></div>
        <div class="editor-field"><label for="f-company">发布主体</label><input class="input" id="f-company" placeholder="企业 / 团队名称"></div>
        <div class="editor-field"><label for="f-address">联系地址</label><input class="input" id="f-address" placeholder="用于线下面谈 / 配送"></div>
      </section>

      <div class="editor-agree"><input id="agree" type="checkbox"><label for="agree">我已阅读并同意<a href="../../pages/agreement/user.html" style="color:var(--primary);">《用户协议》</a>与<a href="../../pages/agreement/privacy.html" style="color:var(--primary);">《隐私政策》</a>，承诺信息真实有效。</label></div>
      <div class="fixed-cta" style="display:flex;gap:8px;"><button class="btn btn-ghost" type="button" id="save-draft" style="flex:1;">保存草稿</button><button class="btn btn-primary" type="submit" style="flex:1.45;">提交发布</button></div>

<script>
(function () {
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (st.loggedIn === false) {
      if (content) content.style.display = 'none';
      if (gateLogin) gateLogin.style.display = '';
      return false;
    }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) {
      if (content) content.style.display = 'none';
      if (gateReal) gateReal.style.display = '';
      return false;
    }
    return true;
  }
  if (!checkPublishAuth()) return;

  var params = new URLSearchParams(location.search), role = params.get('role') === 'supply' ? 'supply' : 'demand';
  var draftId = params.get('draft'), recordId = params.get('record'), buttons = document.querySelectorAll('.editor-type button');
  var fields = {
    title: document.getElementById('f-title'), category: document.getElementById('f-category'), sub: document.getElementById('f-sub'),
    location: document.getElementById('f-location'), unit: document.getElementById('f-unit'), qty: document.getElementById('f-qty'),
    price: document.getElementById('f-price'), spec: document.getElementById('f-spec'), delivery: document.getElementById('f-delivery'),
    qual: document.getElementById('f-qual'), tags: document.getElementById('f-tags'), desc: document.getElementById('f-desc'),
    contactName: document.getElementById('f-contact-name'), contactPhone: document.getElementById('f-contact-phone'), contactWechat: document.getElementById('f-contact-wechat'),
    company: document.getElementById('f-company'), address: document.getElementById('f-address')
  };
  function setRole(next) {
    role = next; buttons.forEach(function (button) { button.classList.toggle('active', button.dataset.role === role); });
    document.getElementById('editor-title').textContent = role === 'demand' ? '发布需求' : '发布供应';
    document.getElementById('price-label').textContent = role === 'demand' ? '预算区间' : '报价单价';
  }
  buttons.forEach(function (button) { button.addEventListener('click', function () { setRole(button.dataset.role); }); });

  /* 演示默认 + AI 补全示例（未编辑草稿/记录时预填一份示例信息便于直接查看） */
  function fillDemo() {
    var demand = role === 'demand';
    fields.title.value = demand ? '急需 C30 商品混凝土 3000 方 · 成都天府新区' : '供应盘扣式脚手架 西南地区现货 · 当日发运';
    fields.category.value = demand ? '材料' : '设备';
    fields.sub.value = demand ? 'C30 商品混凝土' : '盘扣脚手架 / 钢管租赁';
    fields.location.value = '成都市·天府新区';
    fields.unit.value = demand ? '方' : '吨/天';
    fields.qty.value = demand ? '3000 方' : '500 吨现货';
    fields.price.value = demand ? '1350000' : '0.32';
    fields.spec.value = demand ? 'C30 泵送 · 坍落度 180±30 · 连续浇筑' : '盘扣 Q355 · 镀锌 · 整套含配件';
    fields.delivery.value = demand ? '自签订起 30 天分 3 批到位' : '成都/重庆/贵阳仓库 · 24 小时内安排进场';
    fields.qual.value = demand ? '需三证合一阵营，近 3 年同类供应业绩' : '资质齐全，提供检测报告与合格证';
    fields.tags.value = demand ? '现货,国标,包配送' : '盘扣,现货,自营仓库';
    fields.desc.value = '信息由 AI 生成示例，请根据真实项目情况补充工期、数量、资质和交付要求。';
    fields.contactName.value = '陈建国';
    fields.contactPhone.value = '13800008866';
    fields.contactWechat.value = 'rj-engchain';
    fields.company.value = '四川省××建设有限公司';
    fields.address.value = '四川省天府新区成都直管区';
  }
  if (draftId) {
    var draft = PublishStore.get().drafts.find(function (item) { return item.id === draftId; });
    if (draft) {
      setRole(draft.role);
      fields.title.value = draft.title || ''; fields.category.value = draft.category || '材料'; fields.sub.value = draft.subType || '';
      fields.location.value = draft.location || ''; fields.unit.value = draft.unit || ''; fields.qty.value = draft.qty || '';
      fields.price.value = draft.price || ''; fields.spec.value = draft.spec || ''; fields.delivery.value = draft.delivery || '';
      fields.qual.value = draft.qualification || ''; fields.tags.value = (draft.tags || []).join(',');
      fields.desc.value = draft.description || '';
      var dc = draft.contact || {}; fields.contactName.value = dc.name || ''; fields.contactPhone.value = dc.phone || ''; fields.contactWechat.value = dc.wechat || '';
      fields.company.value = draft.company || ''; fields.address.value = draft.address || '';
    }
  }
  if (recordId) {
    var record = PublishStore.getRecordById(recordId);
    if (record) {
      setRole(record.role);
      fields.category.value = record.category || '材料';
      document.getElementById('editor-title').textContent = '编辑信息';
      document.getElementById('nav-title').textContent = '编辑信息';
      fields.title.value = record.title || ''; fields.sub.value = record.subType || '';
      fields.location.value = record.location || ''; fields.unit.value = record.unit || ''; fields.qty.value = record.qty || '';
      fields.price.value = record.price || ''; fields.spec.value = record.spec || ''; fields.delivery.value = record.delivery || '';
      fields.qual.value = record.qualification || ''; fields.tags.value = (record.tags || []).join(',');
      fields.desc.value = record.description || '';
      var rc = record.contact || {}; fields.contactName.value = rc.name || ''; fields.contactPhone.value = rc.phone || ''; fields.contactWechat.value = rc.wechat || '';
      fields.company.value = record.company || ''; fields.address.value = record.address || '';
    }
  }
  setRole(role);
  /* 快捷选项标签交互 */
  document.querySelectorAll('.quick-tags').forEach(function (tagGroup) {
    var targetId = tagGroup.dataset.target;
    var targetEl = document.getElementById(targetId);
    if (!targetEl) return;
    tagGroup.querySelectorAll('span').forEach(function (tag) {
      tag.addEventListener('click', function () {
        var val = tag.textContent.trim();
        if (targetEl.tagName === 'SELECT') {
          for (var i = 0; i < targetEl.options.length; i++) {
            if (targetEl.options[i].text === val) { targetEl.selectedIndex = i; break; }
          }
        } else {
          targetEl.value = val;
        }
        tagGroup.querySelectorAll('span').forEach(function (t) { t.classList.remove('active'); });
        tag.classList.add('active');
      });
    });
  });
  /* 无 draft/record 时预填示例 */
  if (!draftId && !recordId) fillDemo();
  document.getElementById('ai-fill').addEventListener('click', function () { fillDemo(); UI.toast('已填入示例，请确认后保存', 'ok'); });

  function collect() {
    return {
      role: role,
      title: fields.title.value.trim(),
      category: fields.category.value,
      subType: fields.sub.value.trim(),
      location: fields.location.value.trim(),
      unit: fields.unit.value.trim(),
      qty: fields.qty.value.trim(),
      price: fields.price.value.trim(),
      spec: fields.spec.value.trim(),
      delivery: fields.delivery.value.trim(),
      qualification: fields.qual.value.trim(),
      tags: fields.tags.value.split(/[,，、]/).map(function (x) { return x.trim(); }).filter(Boolean),
      description: fields.desc.value.trim(),
      contact: { name: fields.contactName.value.trim(), phone: fields.contactPhone.value.trim(), wechat: fields.contactWechat.value.trim() },
      company: fields.company.value.trim(),
      address: fields.address.value.trim()
    };
  }
  var CORE = ['title', 'category', 'location', 'price', 'description', 'subType', 'qty', 'spec', 'delivery', 'qualification', 'contact.name', 'contact.phone', 'company'];
  function completion(data) {
    var filled = 0;
    CORE.forEach(function (k) { var v = k.indexOf('.') > -1 ? data.contact[k.split('.')[1]] : data[k]; if (v) filled++; });
    return Math.min(100, Math.round(filled / CORE.length * 100));
  }
  function draftData() {
    var data = collect();
    data.completion = completion(data);
    if (!data.description) data.missing = '补充详细描述';
    else if (!data.title) data.missing = '补充标题';
    else data.missing = '暂无关键字段';
    if (draftId) data.id = draftId;
    return data;
  }
  document.getElementById('save-draft').addEventListener('click', function () { if (PublishStore.saveDraft(draftData())) UI.toast('草稿已保存', 'ok'); else UI.toast('草稿保存失败，请重试', 'err'); });
  /* 品类 → bizKey 映射（供 Cards.render / 搜索分发） */
  function catToBizKey(cat) {
    var m = { '材料':'material','设备':'equipment','劳务':'labor','项目合作':'cooperation','中介服务':'agency','中介':'agency','资质招商':'franchise','建企买卖':'trade','招聘':'personnel','求职':'talent' };
    return m[cat] || 'material';
  }
  document.getElementById('editor-form').addEventListener('submit', function (event) {
    event.preventDefault();
    if (!document.getElementById('agree').checked) { UI.toast('请先同意用户协议', 'warn'); return; }
    var data = collect();
    var curUser = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    var amount = data.price ? (data.price + (data.unit ? ' ' + data.unit : '')) : '';
    var payload = {
      title: data.title || '未命名信息',
      type: data.role, cat: data.category, sub: data.subType,
      budget: data.price, price: data.price,
      location: data.location, city: data.location,
      desc: data.description, contact: data.contact, company: data.company,
      /* 兼容供需列表/搜索渲染字段 */
      dir: data.role, amount: amount,
      publisher: curUser ? curUser.id : '', publisherName: curUser ? curUser.name : '',
      source: 'user_publish', bizKey: catToBizKey(data.category),
      unit: data.unit, qty: data.qty, spec: data.spec, delivery: data.delivery,
      qualification: data.qualification, tags: data.tags, address: data.address,
      match: 60, verified: false
    };
    var saved;
    if (recordId && window.SupplyStore && SupplyStore.byId(recordId)) {
      /* 编辑已有 SupplyStore 条目：更新字段，状态重置为待审核 */
      var s = SupplyStore.read();
      s.items.forEach(function (x) { if (x.id === recordId) Object.assign(x, payload, { status: 'pending_review', updatedAt: Date.now() }); });
      SupplyStore.write(s);
      saved = SupplyStore.byId(recordId);
      if (window.DataBus && DataBus.audit) DataBus.audit('编辑供需', '运营', '供需管理', saved.title + '（重新待审核）');
    } else {
      saved = DataBus.publishSupply(payload);
      if (saved && draftId) PublishStore.removeDraft(draftId);
    }
    if (!saved) { UI.toast('信息提交失败，请重试', 'err'); return; }
    UI.toast('已提交，待后台审核上架', 'ok');
    setTimeout(function () { location.href = 'records.html'; }, 800);
  });
})();
</script>
</body></html>
