<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>信息工作台 · Aurora Glass</title>
<style>
:root{
  --ink:#20243A; --ink2:#6B7190; --ink3:#9AA0BC;
  --indigo:#5B6CFF; --violet:#8B7BFF; --cyan:#56C8E8;
  --card:rgba(255,255,255,.72); --card-bd:rgba(255,255,255,.9);
  --r-xl:30px; --r-lg:24px; --r-md:18px;
  --sh-soft:0 18px 44px -20px rgba(80,90,200,.30);
  --sh-card:0 10px 30px -16px rgba(86,96,200,.26),inset 0 1px 0 rgba(255,255,255,.9);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;justify-content:center;font-family:var(--sans);
  background:#D7DEF5}
.phone{position:relative;width:390px;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;
  color:var(--ink);
  background:
    radial-gradient(120% 46% at 12% -4%,#D9E0FF 0%,transparent 52%),
    radial-gradient(110% 42% at 100% 4%,#E6D9FF 0%,transparent 50%),
    linear-gradient(180deg,#F3F6FF 0%,#EEF2FF 46%,#F4F7FF 100%)}
/* aurora blobs */
.blob{position:absolute;border-radius:50%;filter:blur(34px);opacity:.55;pointer-events:none;z-index:0}
.b1{width:230px;height:230px;background:radial-gradient(circle,#9DB0FF,transparent 70%);top:-60px;right:-70px}
.b2{width:200px;height:200px;background:radial-gradient(circle,#C6B3FF,transparent 70%);top:230px;left:-80px;opacity:.4}
.b3{width:180px;height:180px;background:radial-gradient(circle,#A6E4F2,transparent 70%);bottom:120px;right:-70px;opacity:.45}
@media(min-width:760px){body{padding:28px 0}.phone{min-height:0;height:844px;border-radius:44px;
  box-shadow:0 0 0 11px #1C2030,0 0 0 13px #3C4260,0 44px 100px rgba(60,70,150,.4)}}
.statusbar{position:relative;z-index:2;height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:14px;font-weight:600;flex:none}
.sb-r{display:flex;gap:6px}.sb-r i{width:18px;height:11px;background:var(--ink);border-radius:3px;opacity:.8}
.scroll{position:relative;z-index:2;flex:1;overflow-y:auto;scrollbar-width:none;
  padding:6px 20px calc(92px + env(safe-area-inset-bottom))}
.scroll::-webkit-scrollbar{display:none}

.glass{background:var(--card);border:1px solid var(--card-bd);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:var(--sh-card)}

/* header */
.hd{display:flex;align-items:center;gap:13px;padding:8px 2px 18px}
.av{width:48px;height:48px;border-radius:50%;flex:none;background:linear-gradient(135deg,#7C8BFF,#B69BFF);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:var(--sh-soft)}
.hd .g{flex:1}
.hd .k{font-size:12.5px;color:var(--ink2)}
.hd h1{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.bell{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:var(--indigo)}
.bell svg{width:21px;height:21px}

/* hero main-action card */
.hero{border-radius:var(--r-xl);padding:24px 22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#5B6CFF 0%,#7A6CFF 52%,#9B7BFF 100%);box-shadow:var(--sh-soft)}
.hero::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);top:-90px;right:-60px}
.hero::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,220,240,.4),transparent 70%);bottom:-80px;left:-40px}
.hero .ey{font-size:11px;font-weight:600;letter-spacing:.18em;opacity:.85;position:relative}
.hero h2{font-size:24px;font-weight:800;line-height:1.3;margin-top:10px;position:relative;letter-spacing:-.01em}
.hero p{font-size:12.5px;opacity:.88;margin-top:8px;line-height:1.5;position:relative}
.hero .cta{position:relative;margin-top:20px;display:flex;gap:11px}
.hero .cta button{border:0;height:50px;border-radius:999px;font-size:15px;font-weight:700;display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.hero .cta .main{flex:1.4;background:#fff;color:var(--indigo)}
.hero .cta .sub{flex:1;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.hero .cta svg{width:17px;height:17px}

/* round stat pills */
.stats{display:flex;gap:11px;margin-top:16px}
.stat{flex:1;border-radius:var(--r-lg);padding:16px 12px;text-align:center}
.stat .ic{width:38px;height:38px;border-radius:13px;margin:0 auto 9px;display:grid;place-items:center}
.stat .ic svg{width:19px;height:19px}
.stat b{font-family:var(--num);font-size:25px;font-weight:800;display:block;letter-spacing:-.02em;line-height:1}
.stat i{font-style:normal;font-size:11px;color:var(--ink2);margin-top:6px;display:block}
.ic.i1{background:#E7EBFF;color:var(--indigo)}
.ic.i2{background:#E9FBFF;color:#2AA7CC}
.ic.i3{background:#F1E9FF;color:#7A5BE0}

/* section */
.sh{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
.sh h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sh a{font-size:12px;color:var(--indigo);font-weight:600;text-decoration:none}
.todo{border-radius:var(--r-lg);padding:15px 15px;display:flex;gap:13px;align-items:center;margin-bottom:11px}
.todo .lead{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center}
.todo .lead svg{width:22px;height:22px}
.lead.l-ask{background:linear-gradient(135deg,#FF8A7A,#FF6B6B);color:#fff;box-shadow:0 10px 20px -10px rgba(255,107,107,.7)}
.lead.l-rev{background:linear-gradient(135deg,#FFC36B,#FFA94D);color:#fff;box-shadow:0 10px 20px -10px rgba(255,169,77,.7)}
.todo .tx{flex:1;min-width:0}
.todo .l1{display:flex;align-items:center;gap:8px}
.todo .l1 .cat{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.03em}
.todo .l1 .pill{margin-left:auto;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.pa{background:#FFE9E7;color:#F0503F}
.pill.pr{background:#FFF2E0;color:#E8902B}
.todo b{display:block;font-size:14px;font-weight:700;line-height:1.42;margin-top:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .m{font-size:11px;color:var(--ink3);margin-top:5px}
.todo .go{width:34px;height:34px;border-radius:50%;flex:none;background:#EEF0FF;color:var(--indigo);
  display:grid;place-items:center}
.todo .go svg{width:15px;height:15px}

.week{border-radius:var(--r-xl);padding:18px 20px;display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,rgba(139,123,255,.14),rgba(86,200,232,.14))}
.week .wbig{font-family:var(--num);font-size:40px;font-weight:800;line-height:1;
  background:linear-gradient(120deg,#5B6CFF,#9B7BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.week .wcap{flex:1}
.week .wcap b{font-size:13.5px;display:block}
.week .wcap i{font-style:normal;font-size:11px;color:var(--ink2);margin-top:3px;display:block}
.week .wd{display:flex;gap:4px}
.week .wd i{width:7px;border-radius:4px;background:#D6DBFF;height:22px}
.week .wd i.h{background:linear-gradient(#7A6CFF,#5B6CFF)}

/* floating tabbar */
.tabbar{position:absolute;left:16px;right:16px;bottom:16px;z-index:30;height:68px;border-radius:24px;
  display:flex;align-items:center;padding:0 12px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 44px -18px rgba(80,90,200,.4)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--ink3)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--indigo)}
.tabbar .pub{flex:0 0 auto}
.tabbar .pub .pd{width:54px;height:54px;border-radius:19px;margin-bottom:18px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(135deg,#5B6CFF,#9B7BFF);box-shadow:0 14px 26px -10px rgba(110,100,240,.8)}
.tabbar .pub .pd svg{width:25px;height:25px}
.tabbar .pub span{display:none}
</style></head>
<body>
<div class="phone">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="statusbar"><span>9:44</span><span class="sb-r"><i></i><i></i><i></i></span></div>
  <div class="scroll">
    <div class="hd">
      <div class="av">王</div>
      <div class="g"><div class="k">早上好，王工 👋</div><h1>今天有 4 件事等你</h1></div>
      <div class="bell glass"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M221.8,175.94C216.34,166.38,208,139,208,104a80,80,0,1,0-160,0c0,35.05-8.47,62.31-13.81,71.94A16,16,0,0,0,48,204H208A16,16,0,0,0,221.8,175.94Z"/></svg></div>
    </div>

    <div class="hero">
      <div class="ey">NEW POST</div>

        <button class="sub"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z"/></svg>供应</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat glass"><div class="ic i1"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34Z"/></svg></div><b>12</b><i>在架信息</i></div>
      <div class="stat glass"><div class="ic i2"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></div><b>6</b><i>新匹配</i></div>
      <div class="stat glass"><div class="ic i3"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80Z"/></svg></div><b>4</b><i>待咨询</i></div>
    </div>

    <div class="sh"><h2>待处理</h2><a href="javascript:void(0)">全部 ›</a></div>

    <div class="todo glass">
      <div class="lead l-ask"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34Z"/></svg></div>
      <div class="tx">
        <div class="l1"><span class="cat">工程需求</span><span class="pill pa">3 条咨询</span></div>
        <b>天府三街 5 万㎡商业综合体寻找一级总包</b>
        <div class="m">成都·高新区 · 匹配度 96%</div>
      </div>
      <div class="go"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg></div>
    </div>

    <div class="todo glass">
      <div class="lead l-rev"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,64a40,40,0,1,0,40,40A40,40,0,0,0,128,64Zm0-48a104,104,0,1,0,104,104A104,104,0,0,0,128,16Z" opacity=".001"/><path d="M216,56H176V48a24,24,0,0,0-24-24H104A24,24,0,0,0,80,48v8H40A16,16,0,0,0,24,72V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V72A16,16,0,0,0,216,56Z"/></svg></div>
      <div class="tx">
        <div class="l1"><span class="cat">建材供应</span><span class="pill pr">审核中</span></div>
        <b>常年供应 C30 商品混凝土日产 3000 方</b>
        <div class="m">成都·双流 · 约 2 小时完成</div>
      </div>
      <div class="go"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg></div>
    </div>

    <div class="week glass">
      <div class="wbig">28</div>
      <div class="wcap"><b>本周有效对接</b><i>12 新线索 · 3 达成意向</i></div>
      <div class="wd"><i style="height:16px"></i><i class="h" style="height:30px"></i><i style="height:20px"></i><i class="h" style="height:34px"></i><i style="height:24px"></i></div>
    </div>
  </div>

  <nav class="tabbar">
    <button class="on"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68Z"/></svg><span>工作台</span></button>
    <button class="pub"><span class="pd"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></span><span>发布</span></button>
    <button><svg viewBox="0 0 256 256" fill="currentColor"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/></svg><span>我的</span></button>
  </nav>
</div>
</body></html>
