<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信息工作台 · 四风格对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#0E1014;color:#EDEEF2;padding:48px 24px 80px}
.head{max-width:980px;margin:0 auto 44px;text-align:center}
.head .k{font-size:12px;letter-spacing:.28em;color:#C9A86A;text-transform:uppercase}
.head h1{font-size:30px;font-weight:800;margin-top:12px;letter-spacing:.01em}
.head p{font-size:14px;color:#9AA0AE;margin-top:12px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,390px);gap:56px 48px;justify-content:center;
  max-width:980px;margin:0 auto}
.cell{}
.cap{margin-bottom:16px}
.cap .no{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;margin-right:10px;vertical-align:3px}
.cap h2{display:inline;font-size:19px;font-weight:800}
.cap .tag{font-size:12px;margin-top:9px;color:#9AA0AE;line-height:1.6}
.device{width:390px;height:812px;border-radius:40px;overflow:hidden;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8);background:#000}
.device iframe{width:390px;height:844px;border:0;display:block}
.c1 .no{background:#EAF0FF;color:#2F6BFF}
.c2 .no{background:#111;color:#fff}
.c3 .no{background:linear-gradient(135deg,#5B6CFF,#9B7BFF);color:#fff}
.c4 .no{background:#0C2038;color:#5BD6E6;border:1px solid rgba(91,214,230,.5)}
@media(max-width:920px){.grid{grid-template-columns:390px;gap:48px}}
</style></head>
<body>
  <div class="head">
    <div class="k">Information Desk · Style Exploration</div>
    <h1>信息工作台 · 四种视觉方向</h1>
    <p>同一套业务数据，四种信息架构与视觉语言。每个画面可在框内独立滚动查看完整首屏与列表。</p>
  </div>
  <div class="grid">
    <div class="cell c1">
      <div class="cap"><span class="no">1</span><h2>Bento Grid 便当格</h2>
        <div class="tag">亮场 · 模块化数据网格 · 数据前置、高扫读，最贴近日常高效工作台</div></div>
      <div class="device"><iframe src="bento.html" title="Bento"></iframe></div>
    </div>
    <div class="cell c2">
      <div class="cap"><span class="no">2</span><h2>Swiss 瑞士编辑风</h2>
        <div class="tag">近白 · 强栅格发丝线 · 编号索引排版，冷静、专业、权威</div></div>
      <div class="device"><iframe src="swiss.html" title="Swiss"></iframe></div>
    </div>
    <div class="cell c3">
      <div class="cap"><span class="no">3</span><h2>Aurora 极光玻璃</h2>
        <div class="tag">亮场 · 柔和光晕 + 磨砂漂浮卡 · 单一主行动引导，年轻亲和</div></div>
      <div class="device"><iframe src="aurora.html" title="Aurora"></iframe></div>
    </div>
    <div class="cell c4">
      <div class="cap"><span class="no">4</span><h2>Blueprint 工程蓝图</h2>
        <div class="tag">暗场 · 坐标网格 + 线框仪表盘 + 节点时间线，行业专业叙事</div></div>
      <div class="device"><iframe src="blueprint.html" title="Blueprint"></iframe></div>
    </div>
  </div>
</body></html>
