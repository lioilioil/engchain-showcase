<html lang="zh-CN"><head>

<script data-engchain-basefix="2">

function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的发布 · 工程链</title><link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/guest-gate.css"><style>
  /* ===== 我的发布 · 重构稿（2026-09）=====
     滚动修复：.phone 为固定高度 flex 列，原先 #pub-content 包装层未参与
     flex 高度链，main.scroll 的 flex:1 无界可撑高，被 .phone overflow:hidden
     裁切导致无法滚动。补 #pub-content 的 flex 布局 + min-height:0 即修复。 */
  #pub-content { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
  #pub-content > .scroll { min-height:0; }

  .list-scroll { padding:0 16px calc(var(--sp-6) + 12px); }
  .list-head { padding:6px 0 14px; }
  
  .list-sub { color:var(--text-3); font-size:12px; line-height:1.5; }

  /* 汇总条：共 N 条 · 上架中 · 待审核（真实数据） */
  .list-summary { display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:12px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--bg-card); font-size:var(--fs-xs); color:var(--text-3); }
  .list-summary b { color:var(--text-1); font-weight:700; font-variant-numeric:tabular-nums; }
  .list-summary .sum-sep { width:3px; height:3px; border-radius:50%; background:var(--line-strong); }

  /* 筛选：吸顶 + 毛玻璃，计数徽标（背景随主题自适应，避免暗色下浅色条） */
  .filter-bar { position:sticky; top:0; z-index:6; margin:0 -16px 12px; padding:2px 16px 10px; background:color-mix(in srgb, var(--bg-card-2) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .seg .seg-item { display:flex; align-items:center; justify-content:center; gap:6px; }
  .seg-n { min-width:17px; height:17px; padding:0 5px; border-radius:var(--r-full); background:rgba(22,22,22,.06); color:var(--text-3); font-size:10px; font-weight:700; line-height:17px; text-align:center; }
  .seg-item.is-on .seg-n { background:var(--primary); color:#fff; }

  /* 记录卡片：方向徽标 + 标题 + 状态胶囊 → 元信息 → 价量高亮 → 描述 → 驳回 → 操作 */
  .record { padding:14px; margin-bottom:10px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--bg-card); box-shadow:var(--shadow-xs); transition:border-color var(--d-fast), transform var(--d-fast); }
  .record:active { transform:scale(.992); }
  .record-hd { display:flex; align-items:flex-start; gap:9px; }
  .dir-chip { flex:none; display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:var(--r-s); font-size:11px; font-weight:600; margin-top:1px; }
  .dir-chip .ic { width:13px; height:13px; }
  .dir-demand { background:var(--primary-soft); color:var(--primary-dim); }
  .dir-supply { background:var(--success-soft); color:var(--success); }
  .record-title { flex:1; min-width:0; font-size:var(--fs-md); font-weight:600; line-height:1.4; color:var(--text-1); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .record-status { flex:none; display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 8px; border-radius:var(--r-full); font-size:10px; font-weight:600; white-space:nowrap; margin-top:2px; }
  .record-status .sd { width:5px; height:5px; border-radius:50%; background:currentColor; }
  .status-active { background:var(--success-soft); color:var(--success); }
  .status-review, .status-pending_review { background:var(--primary-soft); color:var(--primary-dim); }
  .status-paused, .status-expired, .status-off { background:var(--bg-subtle); color:var(--text-3); }
  .status-rejected { background:var(--error-soft); color:var(--error); }
  .record-meta { display:flex; flex-wrap:wrap; gap:5px 12px; margin-top:10px; color:var(--text-3); font-size:var(--fs-xs); }
  .meta-item { display:inline-flex; align-items:center; gap:4px; }
  .meta-item .ic { width:12px; height:12px; opacity:.85; }
  .record-amount { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .amt { display:inline-flex; align-items:center; gap:5px; color:var(--primary-dim); font-weight:700; font-size:15px; }
  .amt .ic { width:14px; height:14px; }
  .qty { display:inline-flex; align-items:center; gap:5px; color:var(--text-2); font-size:var(--fs-sm); }
  .qty .ic { width:13px; height:13px; color:var(--text-3); }
  .record-desc { margin-top:9px; color:var(--text-2); font-size:var(--fs-sm); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .record-reject { margin-top:9px; display:flex; align-items:flex-start; gap:5px; padding:8px 10px; border-radius:var(--r-s); background:var(--error-soft); color:var(--error); font-size:var(--fs-xs); line-height:1.5; }
  .record-reject .ic { width:13px; height:13px; flex:none; margin-top:1px; }
  .record-actions { display:flex; gap:9px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .record-actions button { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:5px; height:36px; border-radius:var(--r-s); font-size:var(--fs-sm); font-weight:600; cursor:pointer; transition:background var(--d-fast), border-color var(--d-fast), color var(--d-fast); -webkit-user-select:none; user-select:none; }
  .record-actions button .ic { width:14px; height:14px; }
  .record-actions .act-edit { border:1px solid var(--line-strong); background:var(--bg-card); color:var(--text-2); }
  .record-actions .act-edit:active { background:var(--bg-alp); }
  .record-actions .act-detail { border:1px solid transparent; background:var(--primary-soft); color:var(--primary-dim); }
  .record-actions .act-detail:active { background:rgba(184,153,104,.18); }
  .nav-back:focus-visible, .icon-btn:focus-visible, .seg-item:focus-visible, .record-actions button:focus-visible, .empty-btn:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }

  /* 空状态 */
  .empty-state { padding:56px 24px 40px; text-align:center; }
  .empty-ic { position:relative; width:84px; height:84px; margin:0 auto 20px; border-radius:50%; background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft)); display:flex; align-items:center; justify-content:center; }
  .empty-ic::before { content:''; position:absolute; inset:-9px; border-radius:50%; border:1.5px dashed var(--line-strong); opacity:.8; }
  .empty-ic svg { width:38px; height:38px; color:var(--primary-dim); }
  .empty-plus { position:absolute; right:0; bottom:0; width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
  .empty-plus svg { width:12px; height:12px; color:#fff; }
  .empty-title { font-size:16px; font-weight:700; color:var(--text-1); margin-bottom:8px; }
  .empty-desc { font-size:var(--fs-sm); color:var(--text-3); line-height:1.7; margin:0 auto 26px; max-width:250px; }
  .empty-actions { display:flex; gap:10px; justify-content:center; }
  .empty-btn { display:inline-flex; align-items:center; gap:6px; padding:11px 20px; border-radius:var(--r-m); font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; transition:all var(--d-fast); border:none; }
  .empty-btn.primary { background:linear-gradient(135deg,var(--primary),var(--primary-dim)); color:#fff; box-shadow:0 4px 12px -2px var(--primary-dim); }
  .empty-btn.primary:active { transform:translateY(1px); box-shadow:0 2px 6px -2px var(--primary-dim); }
  .empty-btn.ghost { background:var(--bg-card); color:var(--text-2); border:1px solid var(--line); }
  .empty-btn.ghost:active { border-color:var(--primary); color:var(--primary-dim); }
  .empty-btn .ic { width:14px; height:14px; }

  /* 登录 / 实名门控 */
  .pub-gate { display:none; padding:64px 28px; text-align:center; }
  .gate-ic { width:76px; height:76px; margin:0 auto 18px; border-radius:50%; background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft)); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-xs); }
  .gate-ic svg { width:32px; height:32px; color:var(--primary-dim); }
  .gate-title { font-size:17px; font-weight:700; color:var(--text-1); }
  .gate-note { font-size:var(--fs-sm); color:var(--text-3); line-height:1.7; margin-top:8px; }
  .pub-gate .btn { margin-top:22px; }
  .gate-link { display:block; margin-top:14px; text-align:center; color:var(--primary-dim); font-size:var(--fs-sm); text-decoration:none; }
</style></head><body><div class="phone">
  <div id="pub-gate-login" class="pub-gate">
    <div class="gate-ic"><svg class="ic"><use href="#i-user"/></svg></div>
    <div class="gate-title">登录后查看发布记录</div>
    <div class="gate-note">登录后可管理已发布信息，查看浏览、匹配与咨询数据。</div>
    <a href="../auth/login.html" class="btn btn-primary btn-block btn-lg">立即登录</a>
  </div>
  <div id="pub-gate-realname" class="pub-gate">
    <div class="gate-ic"><svg class="ic"><use href="#i-shield"/></svg></div>
    <div class="gate-title">实名认证后可管理发布</div>
    <div class="gate-note">完成实名认证后，即可发布信息并查看对接进展。</div>
    <a href="../profile/auth-personal.html" class="btn btn-primary btn-block btn-lg">前往实名认证</a>
    <a href="../supply/list.html" class="gate-link">了解发布流程 · 看看平台示例 ›</a>
  </div>
  <div id="pub-content">
    <div class="navbar"><button class="nav-back" onclick="history.back()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><div class="nav-title">我的发布</div><div class="nav-right"><a href="editor.html?role=demand" class="icon-btn" id="plus-new" aria-label="新建信息"><svg class="ic" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg></a></div></div>
    <main class="scroll list-scroll">
      <header class="list-head"><div class="list-sub">管理发布状态与对接反馈</div></header>
      <div class="list-summary"><span>共 <b id="sum-all">0</b> 条</span><span class="sum-sep"></span><span>上架中 <b id="sum-active">0</b></span><span class="sum-sep"></span><span>待审核 <b id="sum-review">0</b></span></div>
      <div class="filter-bar"><div class="seg" id="filters"><span class="seg-item is-on" data-filter="all">全部<b class="seg-n">0</b></span><span class="seg-item" data-filter="demand">需求<b class="seg-n">0</b></span><span class="seg-item" data-filter="supply">供应<b class="seg-n">0</b></span></div></div>
      <div id="record-list" style="margin-top:14px"></div>
    </main>
  </div>
</div><script src="../../js/common.js"></script><script src="../../js/stores.js"></script><script src="../../js/databus.js"></script><script src="../../js/guest-gate.js"></script><script>
(function(){
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (!st.loggedIn) { if (window.GuestGate) GuestGate.open({mode:'replace', icon:'list', badge:'游客模式', title:'登录后查看发布记录', note:'登录后可管理已发布信息，查看浏览、匹配与咨询数据。', btnText:'立即登录', btnHref:'../auth/login.html'}); return false; }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) { if (content) content.style.display='none'; if (gateReal) gateReal.style.display='block'; return false; }
    return true;
  }
  if (!checkPublishAuth()) return;
  /* v2：新建信息按身份跳默认方向（专业个人默认发求职/供应侧，其余发需求侧） */
  try {
    var acc2 = window.entryAccess ? entryAccess() : null;
    var per2 = acc2 && acc2.identity ? acc2.identity.personal : 'none';
    var plus2 = document.getElementById('plus-new');
    if (plus2) plus2.href = per2 === 'professional' ? 'editor.html?role=supply' : 'editor.html?role=demand';
  } catch (e) {}
  var list=document.getElementById('record-list'), filter='all';
  var STATUS_LABEL = { pending_review:'待审核', active:'已上架', rejected:'已驳回', off:'已下架', review:'审核中', paused:'已暂停', expired:'已过期' };
  var DIR_LABEL = { demand:'需求', supply:'供应' };
  function esc(value){return String(value == null ? '' : value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  /* L1：从 SupplyStore 读取当前用户发布的供需（source=user_publish 或 migrated_publish） */
  function myPublishes() {
    if (!window.SupplyStore) return [];
    var cur = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    var uid = cur ? cur.id : '';
    return SupplyStore.read().items.filter(function (x) {
      return (x.source === 'user_publish' || x.source === 'migrated_publish') && x.publisher === uid;
    });
  }
  function fmtTime(ts) {
    if (!ts) return '';
    try { return new Date(ts).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }); } catch (e) { return ''; }
  }
  function counts() {
    var c = { all:0, demand:0, supply:0 };
    myPublishes().forEach(function (r) { c.all++; if (r.dir === 'supply') c.supply++; else c.demand++; });
    return c;
  }
  function cardHtml(r) {
    var status = STATUS_LABEL[r.status] || r.status || '未知';
    var stClass = r.status || 'pending_review';
    var dir = r.dir === 'supply' ? 'supply' : 'demand';
    var dirIcon = dir === 'supply' ? '#i-upload' : '#i-search';
    var amount = r.amount || (r.price ? (r.price + (r.unit ? ' ' + r.unit : '')) : '');
    var qty = r.qty || '';
    var meta = '';
    if (r.cat || r.category) meta += '<span class="meta-item"><svg class="ic"><use href="#i-tag"/></svg>' + esc(r.cat || r.category) + '</span>';
    if (r.location) meta += '<span class="meta-item"><svg class="ic"><use href="#i-pin"/></svg>' + esc(r.location) + '</span>';
    meta += '<span class="meta-item"><svg class="ic"><use href="#i-clock"/></svg>' + esc(fmtTime(r.ts || r.updatedAt)) + '</span>';
    var money = (amount || qty) ? '<div class="record-amount">' + (amount ? '<span class="amt"><svg class="ic"><use href="#i-wallet"/></svg>' + esc(amount) + '</span>' : '') + (qty ? '<span class="qty"><svg class="ic"><use href="#i-box"/></svg>' + esc(qty) + '</span>' : '') + '</div>' : '';
    var desc = (r.desc || r.description) ? '<p class="record-desc">' + esc(r.desc || r.description) + '</p>' : '';
    var rej = r.rejectNote ? '<div class="record-reject"><svg class="ic"><use href="#i-info"/></svg><span>驳回原因：' + esc(r.rejectNote) + '</span></div>' : '';
    return '<article class="record"><div class="record-hd"><span class="dir-chip dir-' + dir + '"><svg class="ic"><use href="' + dirIcon + '"/></svg>' + DIR_LABEL[dir] + '</span><h3 class="record-title">' + esc(r.title) + '</h3><span class="record-status status-' + esc(stClass) + '"><i class="sd"></i>' + esc(status) + '</span></div><div class="record-meta">' + meta + '</div>' + money + desc + rej + '<div class="record-actions"><button class="act-edit" data-action="edit" data-id="' + esc(r.id) + '"><svg class="ic"><use href="#i-edit"/></svg>编辑信息</button><button class="act-detail" data-action="detail" data-id="' + esc(r.id) + '">查看详情<svg class="ic"><use href="#i-chev-r"/></svg></button></div></article>';
  }
  function emptyHtml() {
    return '<div class="empty-state"><div class="empty-ic"><svg class="ic"><use href="#i-doc"/></svg><span class="empty-plus"><svg class="ic" style="width:12px;height:12px"><path d="M12 5v14M5 12h14"/></svg></span></div><div class="empty-title">还没有发布信息</div><div class="empty-desc">发布供需信息，让更多建筑企业与建筑人看到你的需求与资源</div><div class="empty-actions"><a class="empty-btn primary" href="editor.html?role=demand"><svg class="ic"><use href="#i-search"/></svg>发布需求</a><a class="empty-btn ghost" href="editor.html?role=supply"><svg class="ic"><use href="#i-upload"/></svg>发布供应</a></div></div>';
  }
  function render(){
    var all = myPublishes();
    var rows = all.filter(function (r) { return filter === 'all' || r.dir === filter; });
    var c = counts();
    /* 汇总条（全量口径） */
    var active = 0, review = 0;
    all.forEach(function (r) { if (r.status === 'active') active++; if (r.status === 'pending_review' || r.status === 'review') review++; });
    var elAll = document.getElementById('sum-all'), elAct = document.getElementById('sum-active'), elRev = document.getElementById('sum-review');
    if (elAll) elAll.textContent = c.all;
    if (elAct) elAct.textContent = active;
    if (elRev) elRev.textContent = review;
    /* 筛选计数 */
    document.querySelectorAll('#filters .seg-item').forEach(function (el) {
      var n = el.querySelector('.seg-n');
      if (n) n.textContent = c[el.dataset.filter] || 0;
    });
    list.innerHTML = rows.length ? rows.map(cardHtml).join('') : emptyHtml();
  }
  document.querySelectorAll('#filters .seg-item').forEach(function (el) { el.onclick = function () { filter = el.dataset.filter; document.querySelectorAll('#filters .seg-item').forEach(function (x) { x.classList.remove('is-on'); }); el.classList.add('is-on'); render(); }; });
  list.onclick = function (e) {
    var button = e.target.closest('button'); if (!button) return;
    var id = button.dataset.id, action = button.dataset.action;
    if (action === 'edit') location.href = 'editor.html?record=' + id;
    else if (action === 'detail' && id && id !== 'undefined') location.href = '../supply/detail.html?id=' + id;
  };
  /* 监听供需变更（后台审核后即时刷新状态） */
  window.addEventListener('engchain:supply', function () { render(); });
  window.addEventListener('storage', function (e) { if (e.key === 'engchain-supply') render(); });
  render();
})();
</script></body></html>
