  .empty-ic{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));display:flex;align-items:center;justify-content:center;position:relative}

</style></head><body><div class="phone">
  <div id="pub-gate-login" style="display:none;text-align:center;padding:60px 24px;">
    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;"><svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-user"/></svg></div>

    <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;"><svg class="ic" style="width:32px;height:32px;color:var(--primary-dim);"><use href="#i-shield"/></svg></div>

  <div class="navbar"><button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><div class="nav-title">已解锁线索</div><div class="nav-right"></div></div><main class="scroll unlock-scroll"><header class="unlock-head"><div class="unlock-sub" id="unlock-sub">这里管理你已经获得查看权限的信息</div></header><div id="lead-list"></div></main></div></div>
<script src="../../js/data.js"></script><script src="../../js/common.js"></script><script src="../../js/stores.js"></script><script src="../../js/databus.js"></script><script src="../../js/publish-workbench.js"></script>
<script src="../../js/guest-gate.js"></script>
<script>
(function(){
  /* ---- 身份门控 ---- */
  function checkPublishAuth() {
    var st = (window.UI && UI.state) ? UI.state.get() : {};
    var content = document.getElementById('pub-content');
    var gateLogin = document.getElementById('pub-gate-login');
    var gateReal = document.getElementById('pub-gate-realname');
    if (!st.loggedIn) { if (window.GuestGate) GuestGate.open({mode:'replace', icon:'shield', badge:'游客模式', title:'登录后查看已解锁线索', note:'登录后可管理已解锁的供需线索，查看联系方式与关联订单。', btnText:'立即登录', btnHref:'../auth/login.html'}); return false; }
    var auth = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
    if (!(auth.realname && auth.realname.ok)) { if (content) content.style.display='none'; if (gateReal) gateReal.style.display=''; return false; }
    return true;
  }
  if (!checkPublishAuth()) return;
  window.__ROOT__='../../';
  var KINDS = { material:'材料采购', equipment:'设备租赁', labor:'劳务用工', cooperation:'项目合作', franchise:'招商加盟', trade:'企业转让', agency:'中介服务', personnel:'企业招聘', talent:'人才线索', publish:'发布信息' };
  function esc(value){return String(value == null ? '' : value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function readUnlocks(){ try { return JSON.parse(localStorage.getItem('engchain-unlocked') || '{}'); } catch (e){ return {}; } }
  function resolve(bizKey, id){
    if (bizKey === 'publish') { var r = window.PublishStore && PublishStore.getRecordById(id); if (r) return { title: r.title, kind: KINDS.publish + ' · ' + (r.category || ''), link: '../supply/detail.html?id=' + encodeURIComponent(r.id || id) }; return null; }
    var listing = window.MOCK && MOCK.listingById(id);
    if (listing) return { title: listing.title || listing.name || '信息 #' + id, kind: KINDS[bizKey] || bizKey, link: '../supply/detail.html?id=' + encodeURIComponent(id) };
    var person = window.MOCK && MOCK.personById(id);
    if (person) return { title: person.name || '人才 ' + id, kind: KINDS.personnel || bizKey, link: '../personal/index.html?id=' + encodeURIComponent(id) };
    return null;
  }
  function fmtDate(t){ if (!t) return '已解锁'; var d = new Date(t); if (isNaN(d.getTime())) return '已解锁'; return '解锁于 ' + d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
  var box = document.getElementById('lead-list');
  var obj = readUnlocks(), keys = Object.keys(obj), leads = [];
  keys.forEach(function(key){
    var parts = key.split('_'); var bizKey = parts[0]; var id = parts.slice(1).join('_');
    var hit = resolve(bizKey, id); if (hit) leads.push({ id: key, bizKey: bizKey, t: (obj[key] && obj[key].t) || 0, title: hit.title, kind: hit.kind, link: hit.link });
  });
  leads.sort(function(a,b){ return b.t - a.t; });
  document.getElementById('unlock-sub').textContent = leads.length ? '共 ' + leads.length + ' 条已解锁线索' : '尚未解锁任何线索';
  box.innerHTML = leads.length ? leads.map(function(l){
    return '<div class="lead"><div class="lead-top"><div class="lead-name">'+esc(l.title)+'</div><span class="lead-kind">'+esc(l.kind)+'</span></div>'+
      '<div class="lead-meta"><span>'+esc(fmtDate(l.t))+'</span><span>有效</span></div>'+
      '<div class="lead-actions"><a href="'+esc(l.link)+'">查看详情</a><a href="../message/index.html">联系对方</a></div></div>';
  }).join('') : '<div class="empty-state"><div class="empty-ic"><svg class="ic"><use href="#i-eye"/></svg></div><div class="empty-title">暂无已解锁线索</div><div class="empty-desc">去发现页浏览供需信息，解锁感兴趣的线索后这里会展示联系方式与订单</div><div class="empty-actions"><a class="empty-btn primary" href="../supply/list.html">去发现解锁</a></div></div>';
})();
</script></body></html>
