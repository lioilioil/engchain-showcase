<link rel="stylesheet" href="../../css/app.css">
<style>
body { background: var(--bg); }
.op-wrap { padding: 0 0 108px; }
.op-demo{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:var(--r-full);}

/* geo-tip 术语图标尺寸兜底（geo-tip.js 在已读态不注入尺寸 CSS，避免图标膨胀） */
.geo-tip-term{display:inline-flex;align-items:center;margin-left:2px;color:var(--primary-dim);cursor:help;}
.geo-tip-term svg{width:11px;height:11px;flex:none;}

/* 入场动效 */
@keyframes op-rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.op-context,.op-progress,.op-sec{animation:op-rise .42s var(--e-standard) both;}
.op-sec:nth-of-type(1){animation-delay:.05s;}
.op-sec:nth-of-type(2){animation-delay:.12s;}
.op-sec:nth-of-type(3){animation-delay:.19s;}
.op-action{opacity:0;animation:op-rise .4s var(--e-standard) forwards;}
.op-action:nth-child(1){animation-delay:.10s;}
.op-action:nth-child(2){animation-delay:.16s;}
.op-action:nth-child(3){animation-delay:.22s;}
.op-action:nth-child(4){animation-delay:.28s;}
.op-ticket{opacity:0;animation:op-rise .38s var(--e-standard) forwards;}
.op-ticket:nth-child(1){animation-delay:.14s;}
.op-ticket:nth-child(2){animation-delay:.19s;}
.op-ticket:nth-child(3){animation-delay:.24s;}
.op-ticket:nth-child(4){animation-delay:.29s;}
.op-ticket:nth-child(5){animation-delay:.34s;}
.op-ticket:nth-child(6){animation-delay:.39s;}

/* 品牌上下文条 */
.op-context{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:0;}
.op-context-chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 11px;box-shadow:var(--shadow-xs);cursor:pointer;transition:transform var(--d-fast) var(--e-standard),box-shadow var(--d-fast),border-color var(--d-fast);}
.op-context-chip:active{transform:scale(.985);}
.op-ctx-ico{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:var(--primary-soft);color:var(--primary-dim);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.op-ctx-info{flex:1;min-width:0;}
.op-ctx-name{font-size:11.5px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.op-ctx-meta{font-size:9.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.op-ctx-sw{flex:none;font-size:10.5px;font-weight:700;color:var(--primary-dim);white-space:nowrap;}

/* 进度 */
.op-progress{display:flex;align-items:center;gap:12px;margin:10px 0 0;padding:13px;border-radius:var(--r-xl);background:radial-gradient(360px 160px at 90% -30%, rgba(176, 138, 60, .13), transparent 60%),var(--bg-card);border:1px solid var(--accent-line);box-shadow:var(--shadow-card);}
.op-ring{position:relative;flex:none;width:56px;height:56px;}
.op-ring svg{transform:rotate(-90deg);}
.op-ring .track{stroke:var(--bg-card-2);}
.op-ring .bar{stroke:var(--primary);stroke-linecap:round;filter:drop-shadow(0 1px 2px rgba(176, 138, 60, .4));transition:stroke-dashoffset .6s var(--e-standard);}
.op-ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.op-ring-num{font-family:var(--font-num);font-size:16px;font-weight:800;line-height:1;}
.op-ring-label{font-size:7.5px;color:var(--text-3);margin-top:1px;}
.op-progress-info{flex:1;}
.op-progress-title{font-size:13px;font-weight:700;color:var(--text-1);}
.op-progress-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.5;}
.op-progress-bar{margin-top:8px;height:5px;border-radius:3px;background:var(--bg-card-2);overflow:hidden;}
.op-progress-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--primary-dim));transition:width .5s;}

/* 区块 */
.op-sec{margin-top:18px;}
.op-sec-title{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--text-1);margin-bottom:10px;}
.op-sec-title::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(to bottom,var(--primary),var(--primary-dim));margin-right:7px;}
.op-sec-more{font-size:11px;font-weight:600;color:var(--text-3);cursor:pointer;}

/* 优先动作 */
.op-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.op-action{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 11px;box-shadow:var(--shadow-xs);transition:transform var(--d-fast) var(--e-standard),box-shadow var(--d-fast),border-color var(--d-fast);}
.op-action:hover{border-color:var(--accent-line);box-shadow:var(--shadow-card);transform:translateY(-1px);} .op-action-head{display:flex;align-items:center;gap:8px;}
.op-action-ico{flex:none;width:30px;height:30px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;}
.op-action-ico svg{width:15px;height:15px;}
.op-action-ico.high{background:var(--error-soft);color:var(--error);}
.op-action-ico.mid{background:var(--warning-soft);color:var(--warning);}
.op-action-ico.low{background:var(--info-soft);color:var(--info);}
.op-action-name{font-size:11.5px;font-weight:700;color:var(--text-1);line-height:1.35;}
.op-action-desc{font-size:10px;color:var(--text-2);margin-top:6px;line-height:1.5;}
.op-action-impact{margin-top:8px;font-size:9.5px;font-weight:700;color:var(--success);background:var(--success-soft);padding:3px 8px;border-radius:var(--r-full);display:inline-block;}

/* 工单 */
.op-ticket{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow-xs);transition:border-color var(--d-fast),box-shadow var(--d-fast);}
.op-ticket:hover{border-color:var(--accent-line);box-shadow:var(--shadow-card);} .op-ticket-head{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;}
.op-check{flex:none;width:22px;height:22px;border-radius:var(--r-s);border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;transition:all .2s;}
.op-ticket.done .op-check{background:var(--success);border-color:var(--success);}
.op-ticket-pri{flex:none;font-size:9px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);}
.op-ticket-pri.P0{background:var(--error-soft);color:var(--error);}
.op-ticket-pri.P1{background:var(--warning-soft);color:var(--warning);}
.op-ticket-pri.P2{background:var(--info-soft);color:var(--info);}
.op-ticket-title{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--text-1);}
.op-ticket-arrow{flex:none;color:var(--text-3);font-size:12px;transition:transform .25s;}
.op-ticket.open .op-ticket-arrow{transform:rotate(90deg);}
.op-ticket-body{display:none;padding:0 13px 12px;}
.op-ticket.open .op-ticket-body{display:block;}
.op-ticket-why{font-size:11px;line-height:1.6;color:var(--text-2);background:var(--bg-card-2);border-radius:var(--r-m);padding:9px 11px;}
.op-ticket-why b{color:var(--primary);}
.op-ticket-steps{margin-top:9px;}
.op-ticket-step{display:flex;gap:7px;font-size:11px;color:var(--text-2);line-height:1.55;margin-top:5px;}
.op-ticket-step::before{content:'→';flex:none;color:var(--primary-dim);font-weight:700;}
.op-ticket-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10px;color:var(--text-3);}
.op-ticket-meta .opt{font-weight:700;color:var(--primary-dim);}
.op-ticket-meta .days{font-weight:700;color:var(--warning);}

/* 阶段 */
.op-phase{position:relative;padding-left:22px;margin-bottom:14px;}
.op-phase:last-child{margin-bottom:0;}
.op-phase::before{content:'';position:absolute;left:6px;top:14px;bottom:-8px;width:2px;background:var(--line-strong);}
.op-phase:last-child::before{display:none;}
.op-phase-dot{position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;}
.op-phase-dot::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--primary);}
.op-phase-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-1);}
.op-phase-goal{font-size:10px;color:var(--primary-dim);font-weight:600;margin-top:2px;}
.op-phase-meta{font-size:10px;color:var(--text-3);margin-top:3px;}

/* 空态 */
.op-empty{text-align:center;padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line-strong);border-radius:var(--r-l);}
.op-empty-title{font-size:13.5px;font-weight:700;color:var(--text-1);}
.op-empty-desc{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.6;}
.op-empty-btn{margin-top:14px;height:40px;padding:0 22px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(176, 138, 60, .3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(176, 138, 60, .4);transition:transform var(--d-fast);}

/* 底部 CTA */
.op-cta{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent);}
.op-cta button{width:100%;max-width:420px;height:44px;border:none;border-radius:var(--r-m);background:linear-gradient(180deg,var(--primary-strong) 0%,var(--primary) 45%,var(--primary-dim) 100%);color:var(--text-inv);font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(176, 138, 60, .3),inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(176, 138, 60, .4);transition:transform var(--d-fast);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt-txt{display:inline-flex;align-items:center;gap:2px;min-width:0;white-space:nowrap;}
.btl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.op-cta button:active{transform:scale(.985);}
</style>
</head>

<script>
(function(){
  var D = window.GEO_DATA;
  var DONE_KEY = 'engchain-geo-tickets-';
  var doneSet = {};
  (function(){
    var b0 = D.currentBrand();
    if (b0) {
      try { doneSet = JSON.parse(localStorage.getItem(DONE_KEY + b0.id) || '{}') || {}; } catch (e) {}
    }
  })();
  function saveDone(){
    var b0 = D.currentBrand();
    if (!b0) return;
    try { localStorage.setItem(DONE_KEY + b0.id, JSON.stringify(doneSet)); } catch (e) {}
  }

  function render(){
    var b = D.currentBrand();
    document.getElementById('ctx-ico').textContent = b ? b.short.charAt(0) : '+';
    document.getElementById('ctx-name').textContent = b ? b.name : '未选择品牌';
    document.getElementById('ctx-meta').textContent = b ? (b.industry + ' · ' + b.website) : '点击添加品牌';
    var main = document.getElementById('op-main');
    if(!b){
      document.getElementById('op-cta').style.display = 'none';
      main.innerHTML = '<div class="op-sec"><div class="op-empty">'+
        '<div class="op-empty-title">暂无品牌优化方案</div>'+
        '<div class="op-empty-desc">添加品牌并生成报告后，<br>这里会给出针对该品牌的优先级动作与执行工单</div>'+
        '<button class="op-empty-btn" onclick="location.href=\'brands.html\'">添加品牌</button></div></div>';
      return;
    }

    var kws = b.keywords.filter(function(k){return k.enabled;});
    var topKw = kws[0] ? kws[0].term : '行业服务';
    var doneCount = Object.keys(doneSet).length;
    var total = 6;
    var pct = Math.round(doneCount/total*100);
    var ringCirc = 2*Math.PI*23;

    var actions = [
      {name:'知识库补全', sev:'high', icon:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>', desc:'补全「'+b.short+'」业务描述、资质与数据事实，提升被引用概率', impact:'预计 +8 综合分'},
      {name:'权威信源建设', sev:'high', icon:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13l1.5 9-5-3-5 3 1.5-9"/>', desc:'官网结构化 + 权威平台百科同步更新，解决信息过期', impact:'预计 +5 综合分'},
      {name:'内容矩阵发布', sev:'mid', icon:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', desc:'围绕「'+topKw+'」等 '+kws.length+' 词产出可引用内容并分发', impact:'预计 +6 综合分'},
      {name:'争议对冲', sev:'mid', icon:'<circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>', desc:'针对资金托管场景的争议描述发布权威澄清内容', impact:'风险控制'}
    ];
    var actionsHtml = actions.map(function(a){
      return '<div class="op-action"><div class="op-action-head"><div class="op-action-ico '+a.sev+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+a.icon+'</svg></div><div class="op-action-name">'+a.name+'</div></div>'+
        '<div class="op-action-desc">'+a.desc+'</div><div class="op-action-impact">'+a.impact+'</div></div>';
    }).join('');

    var tickets = [
      { id:'t1', pri:'P0', title:'上线「'+b.short+'」品牌知识页', why:'AI 回答主要参考「可被检索的品牌事实」，当前品牌页缺失或零散，导致「'+topKw+'」等 '+kws.length+' 个关键词在 3 个引擎未被提及。', steps:['整理品牌核心信息（业务 / 资质 / 数据 / 案例）','页面结构化：实体字段 + FAQ + 数据表','提交各平台收录（官网 / 百科 / 企业库）','验证被 7 引擎检索到'], opt:'知识库 + 官方内容', days:'约 7 天' },
      { id:'t2', pri:'P0', title:'官网信息结构化改造', why:'官网是 AI 引用主信源，但当前结构不利于解析，导致品牌信息在回答中「存在但未被引用」。', steps:['增加品牌实体信息（地址 / 资质 / 成立时间）','FAQ 区覆盖高频问题','数据与案例表格化','配置开放图谱（Open Graph / schema.org）'], opt:'官网 + 技术', days:'约 5 天' },
      { id:'t3', pri:'P1', title:'百科与权威平台同步更新', why:'「信息过期」危机命中：百科与企业库信息滞后，AI 引用旧数据会降低推荐置信度。', steps:['核对百科 / 企业库当前描述','提交最新业务与资质信息','持续维护，季度复核'], opt:'内容 + 运营', days:'约 3 天' },
      { id:'t4', pri:'P1', title:'围绕 '+kws.length+' 个核心词产出内容矩阵', why:'AI 回答偏好「结构化、有数据、有出处」的内容，当前可引用内容不足导致提及率仅 '+(Math.round(b.mentionRate*100))+'%。', steps:['按发布方案生成内容清单','优先高热度词（'+topKw+'）','多平台分发 + 互链'], opt:'内容 + 渠道', days:'持续 4 周' },
      { id:'t5', pri:'P2', title:'争议描述权威对冲', why:'资金托管场景出现「部分平台争议」描述，需权威信源对冲，避免负面被 AI 持续引用。', steps:['定位争议来源','发布资质与合规说明','权威媒体 / 官方渠道背书'], opt:'公关 + 内容', days:'约 14 天' },
      { id:'t6', pri:'P2', title:'数据追踪与月度复盘', why:'优化需要可量化的持续跟踪，避免动作失效。', steps:['每周查看驾驶舱 7 引擎指标','月度对比 SOV / 提及率','复盘渠道效果并调整'], opt:'运营', days:'持续' }
    ];

    var ticketMap = {
      t1:'', t2:'', t3:'', t4:'', t5:'', t6:''
    };
    var ticketsHtml = tickets.map(function(t){
      var done = doneSet[t.id] ? ' done' : '';
      var open = doneSet[t.id] ? '' : (t.pri === 'P0' ? ' open' : '');
      return '<div class="op-ticket'+done+open+'" data-id="'+t.id+'">'+
        '<div class="op-ticket-head" onclick="toggleOpen(\''+t.id+'\')">'+
          '<div class="op-check" onclick="event.stopPropagation();toggleDone(\''+t.id+'\')">'+(done?'✓':'')+'</div>'+
          '<span class="op-ticket-pri '+t.pri+'">'+t.pri+'</span>'+
          '<div class="op-ticket-title">'+t.title+'</div>'+
          '<span class="op-ticket-arrow">›</span>'+
        '</div>'+
        '<div class="op-ticket-body">'+
          '<div class="op-ticket-why"><b>为什么做：</b>'+t.why+'</div>'+
          '<div class="op-ticket-steps">'+t.steps.map(function(s){return '<div class="op-ticket-step">'+s+'</div>';}).join('')+'</div>'+
          '<div class="op-ticket-meta"><span class="opt">'+t.opt+'</span><span class="days">'+t.days+'</span></div>'+
        '</div></div>';
    }).join('');

    var phasesHtml = D.PUBLISH_PLAN.phases.map(function(p, i){
      return '<div class="op-phase"><span class="op-phase-dot"></span>'+
        '<div class="op-phase-head">'+p.phase+'</div>'+
        '<div class="op-phase-goal">'+p.goal+'</div>'+
        '<div class="op-phase-meta">'+(i===0?'已开始 · 预计 1-2 周':(i===1?'第 2 周启动':'第 4 周启动'))+'</div></div>';
    }).join('');

    main.innerHTML =
      '<div class="op-progress">'+
        '<div class="op-ring"><svg width="56" height="56" viewBox="0 0 56 56">'+
          '<circle class="track" cx="28" cy="28" r="23" fill="none" stroke-width="5"/>'+
          '<circle id="opRingBar" class="bar" cx="28" cy="28" r="23" fill="none" stroke-width="5" stroke-dasharray="'+ringCirc+'" stroke-dashoffset="'+ringCirc+'"/>'+
        '</svg><div class="op-ring-val"><div class="op-ring-num" id="opRingNum">0%</div><div class="op-ring-label">执行中</div></div></div>'+
        '<div class="op-progress-info"><div class="op-progress-title">「'+b.short+'」GEO 优化执行中</div>'+
        '<div class="op-progress-sub" id="opProgSub">已勾选 '+doneCount+'/'+total+' 项 · 点击工单查看步骤，勾选标记完成</div>'+
        '<div class="op-progress-bar"><i id="opProgBar" style="width:0%"></i></div></div>'+
      '</div>'+

      '<div class="op-sec"><div class="op-sec-title">本期优先动作（'+b.short+'）</div>'+
        '<div class="op-actions">'+actionsHtml+'</div>'+
      '</div>'+

      '<div class="op-sec"><div class="op-sec-title">执行工单 <span class="op-sec-more" id="opProgCount" onclick="UI.toast(\'已完成 '+doneCount+' 项，进度已自动保存\',\'ok\')">'+doneCount+'/'+total+' 项</span></div>'+
        ticketsHtml+
      '</div>'+

      '<div class="op-sec"><div class="op-sec-title">执行阶段（优化意见）</div>'+
        '<div class="op-progress" style="display:block;margin-top:0;animation-delay:.26s;">'+phasesHtml+'</div>'+
      '</div>';

    /* 进度环 / 条从 0 动画到目标值 */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var bar = document.getElementById('opRingBar');
        if (bar) bar.setAttribute('stroke-dashoffset', ringCirc*(1-pct/100));
        var num = document.getElementById('opRingNum');
        if (num) num.textContent = pct + '%';
        var ib = document.getElementById('opProgBar');
        if (ib) ib.style.width = pct + '%';
      });
    });
  }

  var total = 6;
  var ringCirc = 2*Math.PI*23;

  /* 展开 / 收起工单步骤 */
  window.toggleOpen = function(id){
    var el = document.querySelector('.op-ticket[data-id="'+id+'"]');
    if(!el) return;
    if(el.classList.contains('done')) return; /* 已完成工单不再展开 */
    el.classList.toggle('open');
  };

  /* 勾选完成 / 取消：只局部更新进度，不重建列表 */
  window.toggleDone = function(id){
    var el = document.querySelector('.op-ticket[data-id="'+id+'"]');
    if(!el) return;
    var nowDone;
    if(el.classList.contains('done')){ el.classList.remove('done'); delete doneSet[id]; nowDone=false; }
    else { el.classList.add('done'); el.classList.remove('open'); doneSet[id]=1; nowDone=true; UI.toast('已标记完成','ok'); }
    var chk = el.querySelector('.op-check');
    if(chk) chk.textContent = nowDone ? '✓' : '';
    saveDone();
    updateProgressUI();
  };

  function updateProgressUI(){
    var doneCount = Object.keys(doneSet).length;
    var pct = Math.round(doneCount/total*100);
    var ring = document.getElementById('opRingBar');
    if(ring) ring.setAttribute('stroke-dashoffset', ringCirc*(1-pct/100));
    var num = document.getElementById('opRingNum');
    if(num) num.textContent = pct + '%';
    var sub = document.getElementById('opProgSub');
    if(sub) sub.textContent = '已勾选 '+doneCount+'/'+total+' 项 · 点击工单查看步骤，勾选标记完成';
    var bar = document.getElementById('opProgBar');
    if(bar) bar.style.width = pct + '%';
    var cnt = document.getElementById('opProgCount');
    if(cnt){ cnt.textContent = doneCount+'/'+total+' 项'; cnt.onclick = function(){ UI.toast('已完成 '+doneCount+' 项，进度已自动保存','ok'); }; }
  }

  render();
  /* 深链定位：?focus=tX 展开对应工单并高亮滚动 */
  (function () {
    var q = D.parseQuery();
    if (q.focus && /^t[1-6]$/.test(q.focus)) {
      var el = document.querySelector('.op-ticket[data-id="' + q.focus + '"]');
      if (el) { el.classList.add('open'); D.highlight(el); }
    }
  })();
})();
</script>
<script>GEO_NAV.mount('optimize');</script>
</body>
</html>
