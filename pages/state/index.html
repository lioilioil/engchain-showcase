<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/state/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>状态页 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="location.href='../../home.html'">‹</button>
    <div class="nav-title">页面状态</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding:8px 16px;">
    <div class="section-title"><div class="st-left">业务状态演示（真实交互）</div></div>

    <div class="card" style="text-align:center;padding:24px;">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--primary-soft-2);display:flex;align-items:center;justify-content:center;margin:0 auto;"><span style="font-size:28px;color:var(--primary);">✓</span></div>
      <div class="fw-700 fs-15" style="margin-top:12px;">操作成功</div>
      <div class="text-3 fs-12" style="margin-top:4px;">发布、支付、入驻等成功态样式</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="UI.toast('成功态已展示','ok')">演示</button>
    </div>

    <div class="card" style="text-align:center;padding:24px;">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,159,10,.14);display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--warning);"><svg class="ic" style="width:28px;height:28px;stroke-width:1.5;"><use href="#i-clock"/></svg></div>
      <div class="fw-700 fs-15" style="margin-top:12px;">处理中</div>
      <div class="text-3 fs-12" style="margin-top:4px;">认证审核、提现打款等等待态样式</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="UI.toast('处理中','ok')">演示</button>
    </div>

    <div class="card" style="text-align:center;padding:24px;">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,59,48,.14);display:flex;align-items:center;justify-content:center;margin:0 auto;"><span style="font-size:28px;color:var(--error);">!</span></div>
      <div class="fw-700 fs-15" style="margin-top:12px;">操作失败</div>
      <div class="text-3 fs-12" style="margin-top:4px;">余额不足、审核驳回等失败/错误态样式</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="UI.toast('失败态','err')">演示</button>
    </div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script>window.__ROOT__='../../';</script>
</body>
</html>
