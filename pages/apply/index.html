<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/apply/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>二级合作申请 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M8%201.2%2013.2%203.3v4.1c0%203.1-2.2%205.5-5.2%206.4-3-.9-5.2-3.3-5.2-6.4V3.3L8%201.2Z%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.3%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%226.55%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3Cellipse%20cx%3D%229.45%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="../../css/state.css">
<link rel="stylesheet" href="../../css/liquid-dock.css">
<style>
  .ap-hero { padding: 6px 0 2px; }
  .ap-hero__t { font-size: 21px; font-weight: 700; letter-spacing: -.01em; font-family: var(--font-display); }
  .ap-hero__s { color: var(--text-2); font-size: var(--fs-sm); margin-top: 4px; }
  .ap-codebox { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--bg-card); border: 1.5px solid var(--line); border-radius: var(--r-m);
    padding: 10px 14px; margin: 14px 0 4px; box-shadow: var(--shadow-xs); }
  .ap-codebox__k { color: var(--text-2); font-size: var(--fs-sm); }
  .ap-codebox__v { font-family: var(--font-mono, ui-monospace, monospace); font-weight: 600; color: var(--primary); font-size: 15px; }
  .ap-tip { color: var(--text-3); font-size: 12px; margin: 2px 0 14px; }
  .ap-done { text-align: center; padding: 30px 0 8px; }
  .ap-done__t { font-size: 18px; font-weight: 700; margin-top: 10px; }
  .ap-done__s { color: var(--text-2); font-size: var(--fs-sm); margin-top: 6px; line-height: 1.7; }
</style>
</head>
<body data-tab="apply">
<div class="phone">
  <div class="page-header" style="padding-top:10px;">
    <div class="topbar">
      <div class="topbar-left"><div class="app-eyebrow">ENGCHAIN</div></div>
      <div class="topbar-title">二级合作申请</div>
      <div class="topbar-right"></div>
    </div>
  </div>

  <div class="scroll" style="padding-top:6px;">
    <div id="ap-form">
      <div class="ap-hero">
        <div class="ap-hero__t">申请成为二级合作企业</div>
        <div class="ap-hero__s">由省级总代招商码邀请，提交企业资料后进入省代审核；审核通过后签约并配置约定比例。</div>
      </div>

      <div class="ap-codebox">
        <span class="ap-codebox__k">招商码</span>
        <span class="ap-codebox__v" id="ap-code">—</span>
      </div>
      <div class="ap-tip">招商码用于核定邀请来源与归属关系，请勿修改。</div>

      <div class="field">
        <label class="field-label">企业名称 <span class="req">*</span></label>
        <input class="input" id="ap-name" type="text" placeholder="与营业执照一致" autocomplete="organization">
      </div>
      <div class="field">
        <label class="field-label">统一社会信用代码 <span class="req">*</span></label>
        <input class="input" id="ap-uscc" type="text" placeholder="18 位统一社会信用代码" autocomplete="off" maxlength="18">
      </div>
      <div class="field">
        <label class="field-label">联系人 <span class="req">*</span></label>
        <input class="input" id="ap-contact" type="text" placeholder="负责人姓名" autocomplete="name">
      </div>
      <div class="field">
        <label class="field-label">联系电话 <span class="req">*</span></label>
        <input class="input" id="ap-phone" type="tel" placeholder="手机号" autocomplete="tel" maxlength="11">
      </div>
      <div class="field">
        <label class="field-label">注册地址</label>
        <input class="input" id="ap-address" type="text" placeholder="注册地址（选填）" autocomplete="street-address">
      </div>
      <div class="field">
        <label class="field-label">期望约定比例</label>
        <input class="input" id="ap-ratio" type="number" min="0" max="50" step="1" placeholder="0–50（%），由省代最终核定">
      </div>
      <button type="button" class="btn btn-primary" id="ap-submit" style="width:100%;height:48px;margin-top:2px">提交申请</button>
    </div>

    <div id="ap-done" class="ap-done" style="display:none;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" style="margin:0 auto;display:block">
        <circle cx="12" cy="12" r="10" stroke="var(--success, #2E8B57)" stroke-width="1.5"/>
        <path d="M7.5 12.2l3 3 6-6.4" stroke="var(--success, #2E8B57)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="ap-done__t">申请已提交</div>
      <div class="ap-done__s">企业资料已进入省代审核。<br>审核结果将通过消息中心通知，请留意查收。</div>
      <button type="button" class="btn btn-primary" id="ap-back" style="width:100%;height:48px;margin-top:16px">返回消息中心</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var SUB_APPS_KEY = "engchain-sub-apps";
  var invite = "—";
  (function () {
    try {
      var q = location.search;
      var m = /[?&]invite=([^&]+)/.exec(q);
      if (m) invite = decodeURIComponent(m[1]);
    } catch (e) {}
    var codeEl = document.getElementById("ap-code");
    if (codeEl) codeEl.textContent = invite;
  })();

  function toast(msg, ok) {
    var t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:999;max-width:80%;";
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }

  function loadApps() {
    try { return JSON.parse(localStorage.getItem(SUB_APPS_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveApps(list) {
    try { localStorage.setItem(SUB_APPS_KEY, JSON.stringify(list)); } catch (e) {}
  }

  document.getElementById("ap-submit").addEventListener("click", function () {
    var name = (document.getElementById("ap-name").value || "").trim();
    var uscc = (document.getElementById("ap-uscc").value || "").trim();
    var contact = (document.getElementById("ap-contact").value || "").trim();
    var phone = (document.getElementById("ap-phone").value || "").trim();
    var address = (document.getElementById("ap-address").value || "").trim();
    var ratioRaw = document.getElementById("ap-ratio").value;
    /* 提交存小数（与工作台 subApps 种子 ratio 口径一致：0–0.5） */
    var ratio = ratioRaw === "" ? null : Math.max(0, Math.min(50, Math.round(Number(ratioRaw)))) / 100;

    if (!name) { toast("请填写企业名称"); return; }
    if (!/^[0-9A-Z]{18}$/.test(uscc.toUpperCase())) { toast("请填写 18 位统一社会信用代码"); return; }
    if (!contact) { toast("请填写联系人"); return; }
    if (!/^1\d{10}$/.test(phone)) { toast("请填写 11 位手机号"); return; }

    var now = new Date();
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    var app = {
      id: "app-apply-" + now.getTime(),
      name: name,
      uscc: uscc,
      contact: contact,
      phone: phone,
      address: address,
      ratio: ratio,
      agentCode: invite !== "—" ? invite : "",
      channel: "agent",
      status: "pending",
      source: "apply",
      submittedAt: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes())
    };
    var list = loadApps();
    list.push(app);
    saveApps(list);

    document.getElementById("ap-form").style.display = "none";
    document.getElementById("ap-done").style.display = "block";
  });

  document.getElementById("ap-back").addEventListener("click", function () {
    location.href = "../message/index.html";
  });
})();
</script>
</body>
</html>
