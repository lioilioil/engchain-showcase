(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/message/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>聊天 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* —— 聊天页专用样式（不影响 app.css 全局） —— */
  /* 头部触达 */
  .nav-back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:10px;margin:-10px 0;font-size:22px;line-height:1;}
  /* 标题行：单行「用户名称 + 企业简称」，禁止换行/多行。
     右簇仅一个「更多」44 图标钮，左簇为 返回|竖线|首页(约106px)，标题盒收窄到两侧簇之间，
     避免长名称视觉压到/拦截右簇点击；标题仅展示，不参与命中。 */
  .navbar .nav-title{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;line-height:1.2;
    max-width:min(68%,calc(100% - 168px));pointer-events:none;}
  .ct-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ct-co{flex:none;max-width:44%;display:none;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ct-co.on{display:inline-flex;}
  .ct-co::before{content:"";flex:none;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.65;}

  /* 设置备注弹层（沿用 app demo bottom-sheet：标签 + 输入框 + 主次按钮） */
  .rm-box{padding:2px 2px 4px;}
  .rm-lab{display:block;font-size:12px;color:var(--text-2);margin-bottom:8px;}
  .rm-input{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--bg-card);font-size:15px;color:var(--text-1);box-shadow:var(--shadow-xs);}
  .rm-input:focus{outline:none;border-color:var(--primary-dim);}
  .rm-hint{margin-top:9px;font-size:11px;color:var(--text-3);line-height:1.6;}
  .rm-actions{display:flex;gap:10px;margin-top:18px;}
  .rm-actions .btn{flex:1;}

  /* 会话上下文条：当前对接业务 */
  .ctx-bar{margin:0 16px 10px;padding:10px 12px;border-radius:14px;background:var(--bg-card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow-xs);}
  .ctx-bar:active{background:var(--bg-card-2);}
  .ctx-ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary-dim);}
  .ctx-ic svg{width:17px;height:17px;}
  .ctx-body{flex:1;min-width:0;}
  .ctx-title{font-size:12px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:6px;}
  .ctx-sub{font-size:10.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ctx-go{flex:none;color:var(--text-3);display:flex;align-items:center;}
  .ctx-go svg{width:14px;height:14px;}

  /* 消息时间线 */
  .mc-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #timeline{display:flex;flex-direction:column;gap:14px;padding:12px 16px 18px;min-height:100%;}
  .mc-day{display:flex;justify-content:center;}
  .mc-day span{padding:4px 12px;border-radius:999px;background:rgba(120,120,120,.08);color:var(--text-3);font-size:10px;letter-spacing:.05em;}

  /* 气泡行：头像 + 内容 */
  .mc-row{display:flex;gap:8px;align-items:flex-start;max-width:100%;}
  .mc-row.mine{flex-direction:row-reverse;}
  .mc-avatar{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8a7a5c,#6b5d44);}
  .mc-row.mine .mc-avatar{background:linear-gradient(135deg,var(--primary),var(--accent-pressed));color:var(--text-inv);}
  .mc-body{max-width:76%;display:flex;flex-direction:column;}
  .mc-row.mine .mc-body{align-items:flex-end;}
  .mc-sender{font-size:9.5px;color:var(--text-3);margin:0 4px 3px;}
  .mc-bubble{padding:10px 14px;border-radius:16px;font-size:var(--fs-md);line-height:1.55;word-break:break-word;}
  .mc-bubble.text{background:var(--bg-card-2);color:var(--text-1);border-bottom-left-radius:4px;box-shadow:var(--shadow-xs);}
  .mc-row.mine .mc-bubble.text{background:var(--primary);color:var(--text-inv);border-bottom-right-radius:4px;box-shadow:0 1px 2px rgba(201,169,97,.24);}
  .mc-meta{font-size:9.5px;color:var(--text-3);margin-top:4px;display:flex;align-items:center;gap:4px;}
  .mc-meta .mc-tick{color:var(--accent-pressed);}
  .mc-meta .mc-sending{color:var(--text-3);}

  /* 系统提示条（居中） */
  .mc-sys{display:flex;justify-content:center;}
  .mc-sys span{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dim);font-size:10px;line-height:1.5;text-align:center;}
  .mc-sys.warn span{background:rgba(217,119,6,.1);color:#b45309;}
  .mc-sys.ok span{background:rgba(22,163,74,.1);color:#15803d;}

  /* —— 富交互卡片 —— */
  .mc-card{width:min(272px,78vw);background:var(--bg-card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .mc-row.mine .mc-card{border-color:rgba(201,169,97,.28);}
  .mc-card-head{display:flex;align-items:center;gap:8px;padding:11px 12px 0;}
  .mc-card-ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary-dim);}
  .mc-card-ic svg{width:15px;height:15px;}
  .mc-card-title{font-size:12.5px;font-weight:700;color:var(--text-1);line-height:1.3;}
  .mc-card-sub{font-size:9.5px;color:var(--text-3);margin-top:1px;}
  .mc-card-desc{padding:8px 12px 0;font-size:11px;color:var(--text-2);line-height:1.55;}
  .mc-card-fields{margin:8px 12px 0;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px;}
  .mc-field{display:flex;align-items:baseline;gap:8px;font-size:10.5px;}
  .mc-field b{flex:none;width:52px;color:var(--text-3);font-weight:500;font-size:10px;}
  .mc-field span{flex:1;color:var(--text-1);font-weight:600;}
  .mc-field span.green{color:var(--primary-dim);}
  .mc-card-actions{display:flex;gap:8px;padding:11px 12px 12px;}
  .mc-btn{flex:1;height:32px;border-radius:10px;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all var(--d-fast) var(--e-standard);}
  .mc-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent-pressed));color:var(--text-inv);box-shadow:0 2px 8px rgba(201,169,97,.3);}
  .mc-btn.primary:active{transform:scale(.96);}
  .mc-btn.ghost{background:var(--bg-card-2);color:var(--text-2);border:1px solid var(--line);}
  .mc-btn.ghost:active{background:var(--bg-card);}
  .mc-btn:disabled{opacity:.55;pointer-events:none;}
  .mc-card-state{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 12px;background:rgba(22,163,74,.07);color:#15803d;font-size:10.5px;font-weight:600;}
  .mc-card-state.rejected{background:rgba(120,120,120,.07);color:var(--text-3);}
  .mc-card-state svg{width:12px;height:12px;}

  /* —— 企业名片卡（发名片：暗金档案式，数据来自认证档案+入驻档案） —— */
  .pc-card{width:min(284px,86vw);border-radius:16px;overflow:hidden;background:var(--bg-card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(33,28,18,.05),0 10px 24px -10px rgba(33,28,18,.12),0 26px 54px -26px rgba(33,28,18,.14);}
  .pc-head{position:relative;height:112px;overflow:hidden;background:#0B1120;}
  .pc-head img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;}
  .pc-head::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,11,20,.28) 0%,rgba(8,11,20,.46) 62%,rgba(8,11,20,.74) 100%);}
  .pc-head::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;z-index:3;background:linear-gradient(90deg,#E3C184,rgba(227,193,132,.34) 46%,rgba(227,193,132,.06));}
  .pc-in{position:absolute;inset:0;z-index:4;padding:14px 15px 12px;display:flex;flex-direction:column;justify-content:space-between;}
  .pc-top{display:flex;align-items:flex-start;gap:10px;}
  .pc-logo{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#E7C98B;background:rgba(253,250,242,.10);border:1px solid rgba(253,250,242,.22);}
  .pc-logo svg{width:19px;height:19px;}
  .pc-tit{flex:1;min-width:0;}
  .pc-name{font-size:15.5px;font-weight:800;color:#FDFAF2;letter-spacing:.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pc-badge{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:2px 8px;border-radius:999px;background:rgba(227,193,132,.16);border:1px solid rgba(227,193,132,.42);color:#EACB8E;font-size:9.5px;font-weight:700;letter-spacing:.06em;}
  .pc-badge svg{width:10px;height:10px;}
  .pc-legal{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(253,250,242,.8);}
  .pc-legal svg{width:11px;height:11px;color:#E7C98B;flex:none;}
  .pc-legal b{color:#FDFAF2;font-weight:600;}
  .pc-body{padding:12px 14px 13px;}
  .pc-holder{display:flex;align-items:center;gap:10px;}
  .pc-ava{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#FDFAF2;font-size:13.5px;font-weight:700;background:linear-gradient(135deg,#8A7A5C,#6B5D44);}
  .pc-who{flex:1;min-width:0;}
  .pc-person{font-size:13.5px;font-weight:700;color:var(--text-1);}
  .pc-person small{font-weight:500;color:var(--text-3);font-size:10.5px;margin-left:6px;}
  .pc-role{font-size:10.5px;color:var(--text-3);margin-top:1px;display:flex;align-items:center;gap:5px;}
  .pc-role svg{width:11px;height:11px;color:var(--primary-dim);flex:none;}
  .pc-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .pc-field{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .pc-field.full{grid-column:1/-1;}
  .pc-field .k{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--text-3);letter-spacing:.03em;}
  .pc-field .k svg{width:10px;height:10px;}
  .pc-field .v{font-size:12px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pc-field .v.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;line-height:1.5;}
  .pc-quals{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .pc-qual{display:inline-flex;align-items:center;gap:4px;padding:3.5px 9px;border-radius:7px;font-size:10px;font-weight:600;background:rgba(168,127,53,.11);color:#8A6727;border:1px solid rgba(168,127,53,.22);}
  .pc-qual svg{width:10px;height:10px;}
  .pc-foot{display:flex;align-items:center;gap:5px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:9px;color:var(--text-3);}
  .pc-foot .ok{color:#15803d;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
  .pc-foot .ok svg{width:9px;height:9px;}
  .pc-foot .sp{margin-left:auto;display:inline-flex;align-items:center;gap:3px;}
  .pc-foot .sp svg{width:9px;height:9px;color:var(--primary-dim);}
  .pc-actions{display:flex;gap:8px;margin-top:12px;}
  .pc-btn{flex:1;height:36px;border-radius:10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:transform var(--d-fast);}
  .pc-btn:active{transform:scale(.97);}
  .pc-btn svg{width:14px;height:14px;}
  .pc-btn.gold{background:linear-gradient(135deg,#B8924A,#96702E);color:#FDFAF2;box-shadow:0 3px 10px rgba(168,127,53,.30);}
  .pc-btn:disabled{opacity:.55;pointer-events:none;}

  /* 文件消息 */
  .mc-file{width:min(250px,74vw);background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-xs);}
  .mc-file-ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary-dim);}
  .mc-file-ic svg{width:16px;height:16px;}
  .mc-file-body{flex:1;min-width:0;}
  .mc-file-name{font-size:11.5px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-file-meta{font-size:9.5px;color:var(--text-3);margin-top:2px;}
  .mc-file-go{flex:none;color:var(--text-3);display:flex;align-items:center;}
  .mc-file-go svg{width:13px;height:13px;}

  /* ============ 对方用户信息卡（点头像弹出） ============ */
  @keyframes ucRise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .uc-wrap{padding:2px 16px calc(16px + env(safe-area-inset-bottom,0px));}
  .uc-wrap>*{animation:ucRise .42s cubic-bezier(.22,.61,.36,1) both;}
  .uc-wrap>*:nth-child(2){animation-delay:.05s;}.uc-wrap>*:nth-child(3){animation-delay:.1s;}.uc-wrap>*:nth-child(4){animation-delay:.15s;}.uc-wrap>*:nth-child(5){animation-delay:.2s;}
  /* 头部：一张承载真实背书的浅色身份卡（去掉无信息的空 banner 与头像负 margin 叠加） */
  .uc-head{position:relative;margin:2px 0 12px;text-align:center;padding:20px 16px 15px;border-radius:18px;border:1px solid color-mix(in srgb,var(--primary) 20%,transparent);
    background:linear-gradient(160deg,color-mix(in srgb,var(--primary) 15%,var(--bg-card)),color-mix(in srgb,var(--primary-dim) 6%,var(--bg-card)) 58%,var(--bg-card));}
  .uc-avatar{position:relative;margin:0 auto;width:66px;height:66px;border-radius:21px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:27px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -10px var(--primary-dim);}
  .uc-avatar .uc-v{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;color:var(--success);}
  .uc-avatar .uc-v svg{width:22px;height:22px;}
  .uc-name{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;font-size:19px;font-weight:700;color:var(--text-1);}
  .uc-name .uc-ver{flex:none;width:18px;height:18px;color:var(--success);}
  .uc-sub{margin-top:4px;font-size:12.5px;color:var(--text-3);line-height:1.6;}
  .uc-biz{margin-top:3px;font-size:11.5px;color:var(--text-3);line-height:1.55;}
  /* 信任指标条（详情页公开信息：信用/评价/从业/发布） */
  .uc-stats{display:flex;margin:13px -2px 0;padding:11px 0 0;border-top:1px solid color-mix(in srgb,var(--primary) 16%,transparent);}
  .uc-stat{flex:1;min-width:0;text-align:center;}
  .uc-stat + .uc-stat{border-left:1px solid var(--line);}
  .uc-stat .n{font-size:16px;font-weight:700;color:var(--primary);font-family:var(--font-num);line-height:1.1;}
  .uc-stat .n small{font-size:10.5px;font-weight:600;color:var(--primary-dim);margin-left:1px;}
  .uc-stat .l{font-size:10.5px;color:var(--text-3);margin-top:3px;}
  .uc-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  .uc-tags span{font-size:10.5px;font-weight:600;color:var(--primary-dim);background:var(--bg-card);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);padding:3px 10px;border-radius:var(--r-full);}
  /* 卡 */
  .uc-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-xs);overflow:hidden;}
  .uc-card + .uc-card{margin-top:12px;}
  .uc-row{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;}
  .uc-card .uc-row + .uc-row{border-top:1px solid var(--line);}
  .uc-row.is-static{cursor:default;}
  .uc-ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dim);display:flex;align-items:center;justify-content:center;}
  .uc-ic svg{width:17px;height:17px;stroke-width:1.8;}
  .uc-ic.green{background:var(--success-soft);color:var(--success);}
  .uc-rb{flex:1;min-width:0;}
  .uc-rl{font-size:11px;color:var(--text-3);}
  .uc-rv{font-size:14.5px;font-weight:600;color:var(--text-1);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .uc-rv.num{font-family:var(--font-num);letter-spacing:.02em;}
  .uc-rv.placeholder{font-weight:500;color:var(--text-4);}
  .uc-rt{flex:none;display:flex;align-items:center;gap:5px;color:var(--text-3);font-size:12px;}
  .uc-rt svg{width:15px;height:15px;}
  .uc-act{flex:none;width:34px;height:34px;border-radius:9px;background:var(--bg-card-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;}
  .uc-act svg{width:16px;height:16px;}
  /* 锁定态行内小锁（脱敏值清晰可读，仅以小锁标识不可操作） */
  .uc-rlock{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg-card-2);color:var(--text-3);display:flex;align-items:center;justify-content:center;}
  .uc-rlock svg{width:14px;height:14px;}
  /* 小节标题 */
  .uc-sec{font-size:12px;font-weight:600;color:var(--text-3);margin:16px 2px 0;display:flex;align-items:center;gap:8px;}
  .uc-sec::before{content:'';flex:none;width:3px;height:12px;border-radius:2px;background:var(--primary);}
  .uc-locknote{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--text-4);line-height:1.6;margin:7px 2px 8px;}
  .uc-locknote svg{flex:none;width:13px;height:13px;margin-top:1px;color:var(--primary-dim);}
  /* 供需小卡 */
  .uc-supply{padding:11px 14px;}
  .uc-sup-top{display:flex;align-items:center;gap:8px;}
  .uc-tag{flex:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .uc-tag.demand{background:color-mix(in srgb,#3b82f6 12%,transparent);color:#3b82f6;}
  .uc-tag.supply{background:var(--primary-soft);color:var(--primary-dim);}
  .uc-sup-title{font-size:13px;font-weight:600;color:var(--text-1);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .uc-sup-meta{font-size:11px;color:var(--text-3);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .uc-sup-meta .loc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}
  .uc-sup-meta .price{flex:none;color:var(--primary-dim);font-weight:600;font-family:var(--font-num);}

    if (e === 'jpg' || e === 'jpeg' || e === 'png' || e === 'gif' || e === 'webp' || e === 'bmp') return 'image';
    if (e === 'mp4' || e === 'mov' || e === 'avi' || e === 'mkv' || e === 'webm') return 'video';
    if (e === 'mp3' || e === 'wav' || e === 'm4a' || e === 'aac' || e === 'ogg' || e === 'flac') return 'mic';
    if (e === 'zip' || e === 'rar' || e === '7z') return 'clip';
    return 'file';

  function fmtDate(offsetDays) {
    var d = new Date(Date.now() + (offsetDays || 0) * 864e5);
    return d.getFullYear() + '-' + ((d.getMonth() + 1) < 10 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }
  function fmtTime(d) {
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  function fmtSize(n) {
    if (n == null || isNaN(n) || n < 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }

  function chatFileRecord(convId, name, ext, size, me, event) {
    if (!window.FileStore) return null;
    var s = FileStore.read();
    var hit = null;
    (s.items || []).forEach(function (x) {
      if (x.name === name && x.note && x.note.indexOf('会话·' + convId) === 0) hit = x;
    });
    if (hit) {
      hit.ext = ext || hit.ext; hit.size = size || hit.size;
      hit.source = me ? '会话消息·发送' : '会话消息·收到'; hit.sourceKey = 'chat';
      hit.note = '会话·' + convId; hit.time = Date.now();
      if (event) hit.event = event;
      FileStore.write(s);
      return hit;
    }
    return FileStore.add({ name: name, ext: ext || 'PDF', size: size || '', source: me ? '会话消息·发送' : '会话消息·收到', sourceKey: 'chat', note: '会话·' + convId, event: event || '' });

  /* ============ 发文件：来源 × 类型拆解 ============
     来源：本机存储（图片/文档/视频/语音）｜本 App 历史文件｜微信聊天记录（隐私引导）
     发送后统一落 FileStore（历史文件），消息气泡按类型渲染 */
  var _fileInput = null;
  function fileInputEl() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.id = 'chat-file-input';
    inp.multiple = true;
    inp.accept = 'image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar,.7z,.dwg,.xmind';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    return inp;
  }
  function pickLocalFiles() {
    if (!_fileInput) _fileInput = fileInputEl();
    _fileInput.onchange = function () {
      var files = Array.prototype.slice.call(_fileInput.files || []);
      if (!files.length) return;
      files.forEach(sendLocalFile);
      _fileInput.value = '';
    };
    _fileInput.click();
  }
  function sendLocalFile(file) {
    var name = file.name || '文件';
    var ext = (name.indexOf('.') > -1 ? name.split('.').pop() : 'file').toUpperCase();
    var size = fmtSize(file.size);
    var type = 'file';
    var previewable = false;
    if (/^image\//.test(file.type)) { type = 'image'; previewable = true; }
    else if (/^video\//.test(file.type)) { type = 'video'; previewable = true; }
    else if (/^audio\//.test(file.type)) { type = 'audio'; previewable = true; }
    /* 超大媒体（>12MB）不做内嵌预览，降级为文档卡发送，避免大 dataURL 造成卡顿 */
    var MEDIA_PREVIEW_LIMIT = 12 * 1024 * 1024;
    if (previewable && file.size > MEDIA_PREVIEW_LIMIT) {
      type = 'file';
      setTimeout(function () { UI.toast('「' + name + '」超过 12MB，已按文件形式发送（不内嵌预览）', 'info'); }, 400);
    }
    var msg = { me: true, type: type, name: name, ext: ext, size: size, t: fmtTime(new Date()), status: 'sending', _id: 'file-' + (_seq++), _ai: 0 };
    if (type === 'image' || type === 'video' || type === 'audio') {
      var reader = new FileReader();
      reader.onload = function (e) {
        msg.url = e.target.result;
        msg.status = 'read';
        render();
      };
      reader.readAsDataURL(file);
    } else {
      setTimeout(function () { msg.status = 'read'; render(); }, 400);
    }
    messages.push(msg);
    render();
    if (window.FileStore) {
      chatFileRecord(convId, name, ext, size, true);
    }
    UI.toast('已发送「' + name + '」', 'ok');
    setTimeout(function () {
      messages.push({ me: false, type: 'text', text: '收到您发送的文件，我先看一下再回复您。', t: '刚刚', _id: 'file-r-' + (_seq++) });
      render();
    }, 1200);
  }
  function sendHistoryFile(f) {
    var ext = f.ext || (f.name && f.name.indexOf('.') > -1 ? f.name.split('.').pop() : '') || 'PDF';
    messages.push({ me: true, type: 'file', name: f.name, ext: ext, size: f.size || '—', t: fmtTime(new Date()), status: 'read', _id: 'hf-' + (_seq++), _ai: 0 });

      '<div class="mc-pick">' +
        '<div class="mc-pick-item" id="f-local"><div class="mc-pick-ic tint-d"><svg class="ic"><use href="#i-folder"/></svg></div><div style="flex:1;min-width:0;"><div class="mc-pick-t">本机文件</div><div class="mc-pick-s">支持图片 / 文档 / 视频 / 语音</div></div>' + chevSvg() + '</div>' +
        '<div class="mc-pick-item" id="f-history"><div class="mc-pick-ic tint-a"><svg class="ic"><use href="#i-file"/></svg></div><div style="flex:1;min-width:0;"><div class="mc-pick-t">历史文件</div><div class="mc-pick-s">本 App 中生成 / 上传 / 接收过的文件</div></div>' + chevSvg() + '</div>' +
        '<div class="mc-pick-item" id="f-wechat"><div class="mc-pick-ic tint-b"><svg class="ic"><use href="#i-chat"/></svg></div><div style="flex:1;min-width:0;"><div class="mc-pick-t">微信聊天记录</div><div class="mc-pick-s">微信会话中的文件与图片</div></div>' + chevSvg() + '</div>' +
      '</div>'
    );
    sh.show();
    sh.body().addEventListener('click', function (e) {
      var row = e.target.closest('[id]');
      if (!row) return;
      if (row.id === 'f-local') { UI.closeSheet(); pickLocalFiles(); }
      else if (row.id === 'f-history') { UI.closeSheet(); openHistoryFiles(); }
      else if (row.id === 'f-wechat') { UI.closeSheet(); openWechatGuide(); }
    });
  };

  window.sendCard = function (kind) {
    document.getElementById('panel').classList.remove('show');
    document.getElementById('btn-attach').classList.remove('open');
    if (kind === 'contact') openCardSheet();
    else if (kind === 'quote') openQuoteSheet();
    else if (kind === 'appoint') openAppointSheet();
  };

  /* [FIX BM-039] 聊天内容正则扫描：发送前检测手机号/微信/QQ 等站外联系方式。
     优先调用领域层 JumpContract.scanMessage（如已就绪）；否则用本地正则兜底。
     命中时警告"检测到疑似联系方式，为保障交易安全，请通过平台沟通"，不强制拦截，但记录风控日志。 */
  function scanContact(text) {
    if (window.JumpContract && typeof JumpContract.scanMessage === 'function') {
      try { return JumpContract.scanMessage(text); } catch (e) {}
    }
    var hits = [];
    if (/(?:1[3-9]\d{9})/.test(text)) hits.push('手机号');
    if (/(?:微信|vx|VX|vX|wx|WX|weixin|WeChat|加微)/.test(text)) hits.push('微信号');
    if (/(?:QQ|qq|ＱＱ)/.test(text)) hits.push('QQ号');
    return hits.length ? { hit: true, types: hits } : { hit: false };
  }
  function riskLog(text, types) {
    try {
      var key = 'engchain-risk-logs';
      var arr = [];
      try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
      arr.unshift({ ts: Date.now(), text: text.slice(0, 80), types: types, scene: 'chat' });
      if (arr.length > 100) arr.length = 100;
      localStorage.setItem(key, JSON.stringify(arr));
    } catch (e) {}
  }

  /* 场景化模拟回复 */
  function autoReply(text) {
    if (convId === 'c1') {
      if (/报价/.test(text) && !/收到|确认/.test(text)) {
        setTimeout(function () {
          messages.push({ me: false, type: 'card', t: '刚刚', card: {
            kind: 'quote', title: '报价单 · C30 商品混凝土', sub: '四川中建××建设 → 需方', icon: 'doc',
            desc: '按 C30 含泵送报价，量大可议。',
            fields: [['单价', '¥468/m³'], ['含泵送', '含 37m 汽车泵'], ['税率', '13% 专票'], ['账期', '月结 30 天']],
            actions: [{ label: '确认报价', primary: true, act: 'confirm-quote' }, { label: '再议', ghost: true, act: 'reject-quote' }],
            state: 'pending' } });
          render();
        }, 1300);
        return;
      }
      if (/地址|位置/.test(text)) {
        setTimeout(function () { messages.push({ me: false, type: 'text', text: '收到，已记录项目地址，明天 9 点前回复排产计划。', t: '刚刚' }); render(); }, 1100);
        return;
      }
    }
    setTimeout(function () {
      var replies = [
        '收到，我这边核实一下尽快回复您。',
        '好的，相关信息已同步给业务负责人。',
        '了解，稍后给您详细答复。'
      ];
      messages.push({ me: false, type: 'text', text: replies[Math.floor(Math.random() * replies.length)], t: '刚刚' });
      render();
    }, 1100);
  }

  window.send = function (text) {
    var v = (text || input.value).trim();
    if (!v) return;
    /* [FIX BM-039] 发送前扫描站外联系方式 */
    var scan = scanContact(v);
    if (scan && scan.hit) {
      var types = (scan.types || []).join('/') || '联系方式';
      UI.toast('检测到疑似' + types + '，为保障交易安全，请通过平台沟通', 'warn');
      riskLog(v, scan.types || []);
    }
    var now = new Date();
    var hm = now.getHours() + ':' + now.getMinutes().toString().padStart(2, '0');
    var m = { me: true, type: 'text', text: v, t: hm, status: 'sending', _id: 'send-' + (_seq++), _ai: 0 };
    messages.push(m);
    input.value = '';
    onInput();
    render();
    setTimeout(function () { m.status = 'read'; render(); }, 600);
    autoReply(v);
  };

  /* 清除聊天记录 */
  window.clearChat = function () {
    var sh = UI.sheet();
    sh.setText('清除聊天记录');
    sh.html('<div style="font-size:12.5px;color:var(--text-2);line-height:1.7;padding:2px 0 14px;">将清空与「' + esc(conv.name) + '」的全部聊天记录，此操作不可恢复。</div>' +
      '<button type="button" class="btn btn-danger" style="width:100%;" onclick="UI.closeSheet();doClearChat()">确认清除</button>');
    sh.show();
  };
  window.doClearChat = function () {
    messages = [];
    _seq = 100;
    render();
    UI.toast('聊天记录已清除', 'ok');
  };

  /* 快捷回复（事件委托，避免内联引号转义问题） */
  var quickBox = document.getElementById('quick');
  quickBox.innerHTML = '<span class="cq-label"><svg class="ic"><use href="#i-sparkle"/></svg>智能建议</span>' +
    (QUICK[convId] || QUICK.c1).map(function (q) {
      return '<span class="cq-chip" data-q="' + esc(q) + '">' + esc(q) + '</span>';
    }).join('') +
    '<span class="cq-chip" id="quick-more"><svg class="ic" style="width:11px;height:11px;"><use href="#i-plus"/></svg>更多</span>';
  quickBox.addEventListener('click', function (e) {
    var chip = e.target.closest('.cq-chip');
    if (!chip) return;
    if (chip.id === 'quick-more') { togglePanel(); return; }
    var q = chip.getAttribute('data-q');
    if (q) send(q);
  });

  /* ============ 常用语入口（与常用语设置页同源：engchain-phrases） ============ */
  var PHRASES_KEY = 'engchain-phrases';
  function readPhrases() {
    try {
      var raw = localStorage.getItem(PHRASES_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.cats) && Array.isArray(d.items)) return d;
      }
    } catch (e) {}
    return null;
  }
  window.openPhrases = function () {
    var sh = UI.sheet();
    sh.setText('常用语');
    var cur = '全部';
    function bindLinks() {
      sh.body().querySelectorAll('a[data-goto="phrases"]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); location.href = 'phrases.html'; });
      });
    }
    function render() {
      var d = readPhrases();
      if (!d || !d.cats.length || !d.items.length) {
        sh.html('<div class="ps-empty">暂无常用语<br>可在「设置常用语」中按 一级分类 · 二级分类 · 内容 配置<br><a data-goto="phrases" style="color:var(--primary-dim);font-weight:700;text-decoration:none;">去设置常用语 ›</a></div>');
        bindLinks();
        return;
      }
      var cats = ['全部'].concat(d.cats.map(function (c) { return c.c1; }));
      var items = cur === '全部' ? d.items : d.items.filter(function (x) { return x.cat1 === cur; });
      sh.html(
        '<div class="ps-cats">' + cats.map(function (c) {
          return '<button type="button" class="ps-cat' + (c === cur ? ' active' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>';
        }).join('') + '</div>' +
        (items.length
          ? '<div class="ps-list">' + items.map(function (p) {
              return '<button type="button" class="ps-item" data-c="' + esc(p.content) + '"><span class="ps-tag">' + esc(p.cat1) + ' · ' + esc(p.cat2) + '</span><span class="ps-text">' + esc(p.content) + '</span><span class="ps-go"><svg class="ic"><use href="#i-chev-right"/></svg></span></button>';
            }).join('') + '</div>'
          : '<div class="ps-empty">该分类下暂无常用语</div>') +
        '<div class="ps-foot">点击常用语插入输入框，可编辑后发送 · <a data-goto="phrases">管理常用语 ›</a></div>'
      );
      sh.body().querySelectorAll('.ps-cat').forEach(function (b) {
        b.addEventListener('click', function () { cur = b.getAttribute('data-c'); render(); });
      });
      sh.body().querySelectorAll('.ps-item').forEach(function (it) {
        it.addEventListener('click', function () { insertPhrase(it.getAttribute('data-c')); });
      });
      bindLinks();
    }
    render();
    sh.show();
  };
  function insertPhrase(text) {
    if (!text) return;
    UI.closeSheet();
    var inp = document.getElementById('msg');
    if (!inp) return;
    var s0 = inp.selectionStart, s1 = inp.selectionEnd;
    inp.value = inp.value.slice(0, s0) + text + inp.value.slice(s1);
    inp.focus();
    var pos = s0 + text.length;
    try { inp.setSelectionRange(pos, pos); } catch (e) {}
    onInput();
    UI.toast('已插入，可编辑后发送', 'ok');
  }
})();
</script>
</body>
</html>
