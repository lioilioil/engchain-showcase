  .ctx-bar{margin:0 16px 10px;padding:10px 12px;border-radius:14px;background:var(--bg-card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow-xs);}

  .ctx-ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary-dim);}

  .mc-quick{display:flex;align-items:center;gap:8px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}

  .cc-attach:active{background:var(--bg-card-2);transform:scale(.94);}
  .cc-attach svg{width:18px;height:18px;stroke-width:1.7;}
  .cc-attach.open{background:var(--primary-soft);border-color:var(--accent-line);color:var(--primary-dim);}
  .cc-field{flex:1;display:flex;align-items:flex-end;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:21px;padding:4px 4px 4px 16px;transition:border-color var(--d-fast);}
  .cc-field:focus-within{border-color:var(--accent-line);}
  .cc-field input{flex:1;height:34px;border:0;outline:0;background:transparent;font-size:var(--fs-md);color:var(--text-1);min-width:0;}
  .cc-field input::placeholder{color:var(--text-3);}
  .cc-send{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--accent-pressed));color:var(--text-inv);cursor:pointer;transition:transform var(--d-fast),box-shadow var(--d-fast),opacity var(--d-fast);box-shadow:0 4px 12px rgba(201,169,97,.32);}

  .cc-send.disabled{opacity:.4;pointer-events:none;}

  /* 扩展面板（+ 弹出） */
  .mc-panel{display:none;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 4px 12px;border-top:1px solid var(--line);margin-top:10px;}

  .tint-a{background:var(--primary-soft);color:var(--primary-dim);}
  .tint-b{background:rgba(46,102,255,.1);color:#2e66ff;}
  .tint-c{background:rgba(139,123,181,.13);color:#8B7BB5;}
  .tint-d{background:rgba(217,119,6,.1);color:#d97706;}

  /* 回到底部 */
  .mc-back{position:absolute;right:16px;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:34px;height:34px;border-radius:50%;background:var(--bg-card);border:1px solid var(--line);box-shadow:var(--shadow-md);display:none;align-items:center;justify-content:center;color:var(--text-2);z-index:5;cursor:pointer;}

  .mc-count{position:absolute;right:52px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:9px;color:var(--text-3);pointer-events:none;}

  /* [FIX BM-039] 聊天内容正则扫描：发送前检测手机号/微信/QQ 等站外联系方式。
     优先调用领域层 JumpContract.scanMessage（如已就绪）；否则用本地正则兜底。
     命中时警告"检测到疑似联系方式，为保障交易安全，请通过平台沟通"，不强制拦截，但记录风控日志。 */
  function scanContact(text) {
    if (window.JumpContract && typeof JumpContract.scanMessage === 'function') {
      try { return JumpContract.scanMessage(text); } catch (e) {}
    }
    var hits = [];
    if (/(?:1[3-9]\d{9})/.test(text)) hits.push('手机号');
    if (/(?:微信|vx|VX|vX|wx|WX|weixin|WeChat|加微)/.test(text)) hits.push('微信号');
    if (/(?:QQ|qq|ＱＱ)/.test(text)) hits.push('QQ号');
    return hits.length ? { hit: true, types: hits } : { hit: false };
  }
  function riskLog(text, types) {
    try {
      var key = 'engchain-risk-logs';
      var arr = [];
      try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
      arr.unshift({ ts: Date.now(), text: text.slice(0, 80), types: types, scene: 'chat' });
      if (arr.length > 100) arr.length = 100;
      localStorage.setItem(key, JSON.stringify(arr));
    } catch (e) {}
  }

    }
    var now = new Date();
    var hm = now.getHours() + ':' + now.getMinutes().toString().padStart(2, '0');
    var m = { me: true, type: 'text', text: v, t: hm, status: 'sending', _id: 'send-' + (_seq++), _ai: 0 };
    messages.push(m);
    input.value = '';
    onInput();
    render();
    setTimeout(function () { m.status = 'read'; render(); }, 600);
    autoReply(v);
  };

  /* 清除聊天记录 */
  window.clearChat = function () {
    var sh = UI.sheet();
    sh.setText('清除聊天记录');
    sh.html('<div style="font-size:12.5px;color:var(--text-2);line-height:1.7;padding:2px 0 14px;">将清空与「' + esc(conv.name) + '」的全部聊天记录，此操作不可恢复。</div>' +
      '<button type="button" class="btn btn-danger" style="width:100%;" onclick="UI.closeSheet();doClearChat()">确认清除</button>');
    sh.show();
  };
  window.doClearChat = function () {
    messages = [];
    _seq = 100;
    render();
    UI.toast('聊天记录已清除', 'ok');
  };

  /* 快捷回复（事件委托，避免内联引号转义问题） */
  var quickBox = document.getElementById('quick');
  quickBox.innerHTML = '<span class="cq-label"><svg class="ic"><use href="#i-sparkle"/></svg>智能建议</span>' +
    (QUICK[convId] || QUICK.c1).map(function (q) {
      return '<span class="cq-chip" data-q="' + esc(q) + '">' + esc(q) + '</span>';
    }).join('') +
    '<span class="cq-chip" id="quick-more"><svg class="ic" style="width:11px;height:11px;"><use href="#i-plus"/></svg>更多</span>';
  quickBox.addEventListener('click', function (e) {
    var chip = e.target.closest('.cq-chip');
    if (!chip) return;
    if (chip.id === 'quick-more') { togglePanel(); return; }
    var q = chip.getAttribute('data-q');
    if (q) send(q);
  });
})();
</script>
</body>
</html>
