<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/message/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>投诉 / 举报 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* P1: enlarge back button touch target to 44px minimum */
  .nav-back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:10px;margin:-10px 0;font-size:22px;line-height:1;}
  .cmp-card{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;margin-bottom:14px;}
  .cmp-label{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin-bottom:10px;}
  .cmp-label b{color:var(--error);font-weight:700;}
  .cmp-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .cmp-chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-card-2);color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .cmp-chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);border-color:transparent;}
  .cmp-field{margin-top:16px;}
  .cmp-field input,.cmp-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg-card-2);color:var(--text-1);font-size:13.5px;font-family:inherit;padding:11px 12px;outline:none;transition:border-color .15s ease;}
  .cmp-field input:focus,.cmp-field textarea:focus{border-color:rgba(184,153,104,.55);}
  .cmp-field textarea{resize:none;line-height:1.6;}
  .cmp-count{text-align:right;font-size:10px;color:var(--text-3);margin-top:5px;font-family:var(--font-num);}
  .cmp-note{display:flex;align-items:flex-start;gap:8px;margin:4px 2px 18px;padding:11px 12px;border-radius:12px;background:rgba(184,153,104,.08);border:1px solid rgba(184,153,104,.25);font-size:11.5px;line-height:1.65;color:var(--text-2);}
  .cmp-note .ic{width:14px;height:14px;color:var(--primary-dim);flex:none;margin-top:1px;}
  .cmp-submit{width:100%;height:46px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px -6px var(--primary-dim);transition:transform .12s ease,opacity .12s ease;}
  .cmp-submit:active{transform:scale(.98);opacity:.92;}
  .cmp-sec-title{display:flex;align-items:center;gap:6px;margin:20px 4px 10px;font-size:12px;font-weight:800;color:var(--primary-dim);letter-spacing:.06em;}
  .cmp-sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
  .cmp-rec{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;}
  .cmp-rec-head{display:flex;align-items:center;gap:8px;}
  .cmp-rec-type{font-size:10px;font-weight:700;color:var(--primary-dim);background:rgba(184,153,104,.12);border:1px solid rgba(184,153,104,.3);padding:2px 8px;border-radius:999px;flex:none;}
  .cmp-rec-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;flex:none;}
  .cmp-rec-status.pending{color:#d97706;background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.3);}
  .cmp-rec-status.done{color:#2E9E5B;background:rgba(46,158,91,.1);border:1px solid rgba(46,158,91,.3);}
  .cmp-rec-time{font-size:10px;color:var(--text-3);margin-left:auto;flex:none;}
  .cmp-rec-desc{font-size:12.5px;line-height:1.6;color:var(--text-2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cmp-rec-target{font-size:10.5px;color:var(--text-3);margin-top:5px;}
  .cmp-empty{text-align:center;color:var(--text-3);font-size:12px;padding:34px 16px;line-height:1.7;}
  .cmp-steps{display:flex;gap:8px;margin:4px 2px 8px;padding:12px;border-radius:14px;background:var(--bg-card-2);border:1px solid var(--line);}
  .cmp-step{flex:1;text-align:center;}
  .cmp-step .st-num{width:22px;height:22px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);}
  .cmp-step .st-txt{font-size:10.5px;color:var(--text-2);line-height:1.4;}
</style></head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">投诉 / 举报</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:6px;">
    <div class="cmp-steps">
      <div class="cmp-step"><div class="st-num">1</div><div class="st-txt">选择举报类型</div></div>
      <div class="cmp-step"><div class="st-num">2</div><div class="st-txt">填写情况说明</div></div>
      <div class="cmp-step"><div class="st-num">3</div><div class="st-txt">平台核实处理</div></div>
    </div>

    <div class="cmp-card">
      <div class="cmp-label">举报类型 <b>*</b></div>
      <div class="cmp-chips" id="cmp-types"></div>

      <div class="cmp-field">
        <div class="cmp-label" style="margin-bottom:8px;">涉及对象 <span style="color:var(--text-4);font-weight:400;">（选填）</span></div>
        <input id="cmp-target" maxlength="30" placeholder="对方昵称 / 会话名称，如：李工">
      </div>

      <div class="cmp-field">
        <div class="cmp-label" style="margin-bottom:8px;">问题描述 <b>*</b></div>
        <textarea id="cmp-desc" maxlength="500" placeholder="请详细描述违规行为：发生时间、具体内容、造成的影响等"></textarea>
        <div class="cmp-count"><span id="cmp-desc-len">0</span>/500</div>
      </div>

      <div class="cmp-field">
        <div class="cmp-label" style="margin-bottom:8px;">补充说明 <span style="color:var(--text-4);font-weight:400;">（选填 · 可说明证据线索）</span></div>
        <textarea id="cmp-extra" maxlength="300" placeholder="如：截图、链接、转账记录等证据线索"></textarea>
        <div class="cmp-count"><span id="cmp-extra-len">0</span>/300</div>
      </div>

      <div class="cmp-field">
        <div class="cmp-label" style="margin-bottom:8px;">联系方式 <span style="color:var(--text-4);font-weight:400;">（选填 · 便于平台反馈处理结果）</span></div>
        <input id="cmp-contact" maxlength="30" placeholder="手机号 / 微信号">
      </div>
    </div>

    <div class="cmp-note"><svg class="ic"><use href="#i-info"/></svg><div>提交后平台将在 <b>1-3 个工作日</b>内核实处理并反馈结果。请如实举报，恶意举报、虚构事实者需承担相应责任。</div></div>

    <button type="button" class="cmp-submit" id="cmp-submit">提交投诉 / 举报</button>

    <div class="cmp-sec-title">我的投诉记录</div>
    <div id="cmp-list"></div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';
  var KEY = 'engchain-complaints';
  var TYPES = ['骚扰信息', '虚假宣传', '欺诈嫌疑', '垃圾广告', '人身攻击', '其他'];
  var selType = '';

  function readAll() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      }
    } catch (e) {}
    return [];
  }
  function saveAll(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  function fmtTime(ts) {
    var d = new Date(ts);
    function p2(n) { return n < 10 ? '0' + n : '' + n; }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  function renderTypes() {
    var box = document.getElementById('cmp-types');
    box.innerHTML = TYPES.map(function (t) {
      return '<button type="button" class="cmp-chip' + (selType === t ? ' active' : '') + '" data-t="' + t + '">' + t + '</button>';
    }).join('');
    box.onclick = function (e) {
      var c = e.target.closest('.cmp-chip'); if (!c) return;
      selType = c.getAttribute('data-t');
      var all = box.querySelectorAll('.cmp-chip');
      for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i] === c);
    };
  }

  function renderList() {
    var box = document.getElementById('cmp-list');
    var list = readAll();
    if (!list.length) {
      box.innerHTML = '<div class="cmp-empty">暂无投诉记录<br>提交的投诉与举报将在这里显示处理进度</div>';
      return;
    }
    list.sort(function (a, b) { return b.ts - a.ts; });
    box.innerHTML = list.map(function (r) {
      return '<div class="cmp-rec">' +
        '<div class="cmp-rec-head"><span class="cmp-rec-type">' + r.type + '</span>' +
        '<span class="cmp-rec-status ' + (r.status === '已处理' ? 'done' : 'pending') + '">' + r.status + '</span>' +
        '<span class="cmp-rec-time">' + fmtTime(r.ts) + '</span></div>' +
        '<div class="cmp-rec-desc">' + r.desc + '</div>' +
        (r.target ? '<div class="cmp-rec-target">涉及对象：' + r.target + '</div>' : '') +
        '</div>';
    }).join('');
  }

  function submit() {
    if (!selType) { UI.toast('请选择举报类型', 'err'); return; }
    var desc = document.getElementById('cmp-desc').value.trim();
    if (!desc) { UI.toast('请填写问题描述', 'err'); return; }
    if (desc.length < 10) { UI.toast('问题描述至少 10 个字', 'err'); return; }
    var list = readAll();
    list.push({
      id: 'cmp' + Date.now().toString(36),
      type: selType,
      target: document.getElementById('cmp-target').value.trim(),
      desc: desc,
      extra: document.getElementById('cmp-extra').value.trim(),
      contact: document.getElementById('cmp-contact').value.trim(),
      ts: Date.now(),
      status: '待处理'
    });
    saveAll(list);
    document.getElementById('cmp-desc').value = '';
    document.getElementById('cmp-extra').value = '';
    document.getElementById('cmp-target').value = '';
    document.getElementById('cmp-contact').value = '';
    document.getElementById('cmp-desc-len').textContent = '0';
    document.getElementById('cmp-extra-len').textContent = '0';
    renderList();
    UI.toast('已提交，平台将在 1-3 个工作日内核实', 'ok');
  }

  document.getElementById('cmp-submit').addEventListener('click', submit);
  document.getElementById('cmp-desc').addEventListener('input', function (e) { document.getElementById('cmp-desc-len').textContent = e.target.value.length; });
  document.getElementById('cmp-extra').addEventListener('input', function (e) { document.getElementById('cmp-extra-len').textContent = e.target.value.length; });

  renderTypes();
  renderList();
  window.addEventListener('storage', function (e) { if (e.key === KEY) renderList(); });
})();
</script>
</body>
</html>
