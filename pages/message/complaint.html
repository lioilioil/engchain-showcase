<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);

</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>投诉 / 举报 · 工程链</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23B89968'/%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' fill='none' stroke='%23282310' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/liquid-cta.css?v=20260928183624">
<style>
/* ============================================================
   投诉 / 举报 · V3.3 令牌化
   三视图 hash 路由：#/new 提交 ｜ #/list 记录 ｜ #/detail 详情
   闭环：待受理 → 处理中(补充材料) → 已反馈 → 评价完成 / 撤销 / 复查
   ============================================================ */
.cp-scroll{height:100%;overflow-y:auto;padding:10px var(--page-pad) calc(var(--actionbar-reserve) + 8px);}
/* 新建视图底部固定区（确认声明+提交按钮）更高，滚动预留相应加大；list/detail 无固定区保持原预留 */
#view-new{padding-bottom:calc(var(--actionbar-reserve) + 76px);}
.cp-view{display:none;animation:cp-in .22s var(--e-out);}
.cp-view.on{display:block;}
@keyframes cp-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* 导航右侧文字按钮已统一为共享 .nav-text-btn（由下方 JS 动态注入到 #cp-nav-right） */

/* ---- 顶部保障横幅 ---- */
.cp-assure{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-l);background:var(--primary-soft);border:1px solid var(--accent-line);margin-bottom:12px;}
.cp-assure .ai{flex:none;width:30px;height:30px;border-radius:var(--r-s);background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);display:flex;align-items:center;justify-content:center;}
.cp-assure .ai svg{width:16px;height:16px;}
.cp-assure .at{font-size:12px;font-weight:700;color:var(--text-1);line-height:1.4;}
.cp-assure .ad{font-size:10.5px;color:var(--text-3);line-height:1.5;margin-top:1px;}

/* ---- 卡片 / 标签 ---- */
.cp-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-xl);padding:15px 14px;margin-bottom:12px;box-shadow:var(--shadow-xs);}
.cp-label{display:flex;align-items:center;gap:6px;font-size:var(--fs-base);font-weight:600;color:var(--text-1);margin-bottom:11px;}
.cp-label svg{width:15px;height:15px;color:var(--primary-dim);flex:none;}
.cp-label .req{color:var(--error);font-weight:700;}
.cp-label .opt{font-size:var(--fs-xs);color:var(--text-3);font-weight:400;}

/* 类型九宫格 */
.cp-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cp-type{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:var(--r-m);background:var(--bg-card-2);border:1.5px solid transparent;cursor:pointer;transition:border-color var(--d-fast),background var(--d-fast),transform var(--d-fast);-webkit-tap-highlight-color:transparent;}
.cp-type svg{width:20px;height:20px;color:var(--text-3);transition:color var(--d-fast);}
.cp-type span{font-size:var(--fs-xs);color:var(--text-2);font-weight:500;text-align:center;line-height:1.3;transition:color var(--d-fast);}
.cp-type.active{background:var(--primary-soft);border-color:rgba(176, 138, 60, .45);}
.cp-type.active svg{color:var(--primary-dim);}
.cp-type.active span{color:var(--primary-dim);font-weight:700;}
.cp-type:active{transform:scale(.96);}

/* 输入 */
.cp-input,.cp-textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--bg);color:var(--text-1);font-size:13.5px;font-family:inherit;padding:11px 12px;outline:none;transition:border-color var(--d-fast),box-shadow var(--d-fast);}
.cp-input{height:44px;}
.cp-textarea{resize:none;line-height:1.65;}
.cp-input:focus,.cp-textarea:focus{border-color:var(--primary);box-shadow:var(--shadow-focus);}
.cp-input::placeholder,.cp-textarea::placeholder{color:var(--text-3);}
.cp-field + .cp-field{margin-top:14px;}
.cp-count{text-align:right;font-size:10.5px;color:var(--text-3);margin-top:5px;font-family:var(--font-num);}
.cp-source{display:inline-flex;align-items:center;gap:5px;margin-bottom:10px;padding:5px 10px;border-radius:var(--r-full);background:var(--info-soft);color:var(--info);font-size:11px;font-weight:600;}
.cp-source svg{width:12px;height:12px;}
.cp-source button{width:16px;height:16px;border:none;background:none;color:inherit;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;opacity:.7;}

/* 证据九宫格 */
.cp-shots{display:flex;gap:10px;flex-wrap:wrap;}
.cp-shot{width:80px;height:80px;border-radius:var(--r-m);overflow:hidden;position:relative;flex:none;}
.cp-shot-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed var(--line-strong);background:var(--bg-card-2);color:var(--text-3);cursor:pointer;transition:border-color var(--d-fast),transform var(--d-fast);width:80px;height:80px;}
.cp-shot-add svg{width:20px;height:20px;}
.cp-shot-add span{font-size:10px;}
.cp-shot-add:active{transform:scale(.96);border-color:var(--primary);}
.cp-shot-img{width:100%;height:100%;background:linear-gradient(135deg,#E8E3D8,#D8D0BE);display:flex;align-items:center;justify-content:center;color:rgba(90,78,54,.55);}
.cp-shot-img svg{width:24px;height:24px;}
[data-theme="dark"] .cp-shot-img{background:linear-gradient(135deg,#2C2C2E,#3A3A3C);color:rgba(255,255,255,.4);}
.cp-shot-del{position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:50%;background:rgba(20,18,15,.62);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;line-height:1;}

/* 承诺勾选 */
.cp-agree{display:flex;align-items:flex-start;gap:9px;margin:2px 2px 14px;font-size:11.5px;line-height:1.65;color:var(--text-2);cursor:pointer;}
.cp-agree input{position:absolute;opacity:0;width:0;height:0;}
.cp-agree .box{flex:none;width:17px;height:17px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--bg-card);display:flex;align-items:center;justify-content:center;transition:all var(--d-fast);}
.cp-agree .box svg{width:11px;height:11px;color:var(--text-inv);opacity:0;transform:scale(.5);transition:all var(--d-fast);}
.cp-agree input:checked + .box{background:var(--primary);border-color:var(--primary);}
.cp-agree input:checked + .box svg{opacity:1;transform:scale(1);}
.cp-agree b{color:var(--text-1);font-weight:600;}
/* 底部固定区（V3.3）：确认声明随提交按钮固定底部，纵向排列 + 渐变遮罩与滚动内容分隔 */
#cp-cta-bar{display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,var(--bg) 28%);padding-top:12px;}
#cp-cta-bar .cp-agree{margin:0 2px 12px;align-items:flex-start;}

/* 详情页底部固定操作栏（V3.4）：主行动按钮上浮固定，次级操作为安静链接，
   复用 .fixed-cta 定位与 [data-lg-cta="bar"] 玻璃体系（金主按钮 + 无背景链接），
   按状态由 renderDetailBar 动态渲染 */
#cp-cta-detail{display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,var(--bg) 26%);padding-top:12px;}
#cp-cta-detail .cp-dbar-link{display:flex;justify-content:center;padding:0 2px;}
#cp-cta-detail .cp-btn-danger,
#cp-cta-detail .cp-btn-link{border:none;background:none;width:auto;height:32px;padding:0 16px;border-radius:var(--r-full);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent;transition:opacity var(--d-fast);}
#cp-cta-detail .cp-btn-danger{color:var(--error);}
#cp-cta-detail .cp-btn-link{color:var(--primary-dim);}
#cp-cta-detail .cp-btn-danger:active,
#cp-cta-detail .cp-btn-link:active{opacity:.6;}
/* 详情正文滚动预留：主按钮 54 + 次级链接 32 + 遮罩/间距 ≈116px，补足避免末行被固定栏遮挡 */
#view-detail{padding-bottom:calc(var(--actionbar-reserve) + 48px);}

/* ---- 列表 ---- */
.cp-filter{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding:1px;}
.cp-filter::-webkit-scrollbar{display:none;}
.cp-fitem{flex:none;height:34px;padding:0 15px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--bg-card);color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--d-fast);display:inline-flex;align-items:center;gap:6px;}
.cp-fitem .n{font-family:var(--font-num);font-size:11.5px;opacity:.75;}
.cp-fitem.active{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);border-color:transparent;}
.cp-rec{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow-xs);cursor:pointer;transition:transform var(--d-fast);}
.cp-rec:active{transform:scale(.985);}
.cp-rec-head{display:flex;align-items:center;gap:8px;}
.cp-rec-kind{font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:var(--r-full);flex:none;background:var(--primary-soft);color:var(--primary-dim);border:1px solid var(--accent-line);}
.cp-rec-type{font-size:14px;font-weight:600;color:var(--text-1);flex:none;}
.cp-rec-time{font-size:12px;color:var(--text-4);margin-left:auto;flex:none;font-family:var(--font-num);}
.cp-rec-desc{font-size:14.5px;line-height:1.6;color:var(--text-2);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cp-rec-foot{display:flex;align-items:center;gap:8px;margin-top:10px;}
.cp-rec-code{font-size:12px;color:var(--text-4);font-family:var(--font-mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-rec-arrow{color:var(--text-4);flex:none;display:flex;}
.cp-rec-arrow svg{width:16px;height:16px;}
.cp-progress-hint{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 11px;border-radius:var(--r-s);font-size:12.5px;font-weight:600;line-height:1.45;}
.cp-progress-hint svg{width:14px;height:14px;flex:none;}
.cp-hint-processing{background:var(--primary-soft);color:var(--primary-dim);}
.cp-hint-replied{background:var(--info-soft);color:var(--info);}
.cp-hint-closed{background:var(--success-soft);color:var(--success);}
.cp-hint-revoked{background:var(--bg-card-2);color:var(--text-3);}

/* 状态徽章 */
.cp-badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:var(--r-full);flex:none;display:inline-flex;align-items:center;gap:4px;}
.cp-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
.cp-badge.received{color:var(--text-2);background:var(--bg-card-2);}
.cp-badge.processing{color:var(--warning);background:var(--warning-soft);}
.cp-badge.replied{color:var(--info);background:var(--info-soft);}
.cp-badge.closed{color:var(--success);background:var(--success-soft);}
.cp-badge.revoked{color:var(--text-3);background:var(--bg-card-2);}

/* ---- 详情：状态横幅 ---- */
.cp-hero{border-radius:var(--r-xl);padding:16px 15px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden;}
.cp-hero::after{content:"";position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:currentColor;opacity:.07;}
.cp-hero.received{background:var(--bg-card);color:var(--text-2);}
.cp-hero.processing{background:var(--primary-soft);color:var(--primary-dim);border-color:var(--accent-line);}
.cp-hero.replied{background:var(--info-soft);color:var(--info);border-color:rgba(37,99,235,.22);}
.cp-hero.closed{background:var(--success-soft);color:var(--success);border-color:rgba(43,107,79,.25);}
.cp-hero.revoked{background:var(--bg-card-2);color:var(--text-3);}
.cp-hero-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.cp-hero-ic{flex:none;width:34px;height:34px;border-radius:var(--r-m);background:currentColor;display:flex;align-items:center;justify-content:center;}
.cp-hero-ic svg{width:18px;height:18px;}
.cp-hero.received .cp-hero-ic{background:var(--bg-card-2);color:var(--text-2);}
.cp-hero.processing .cp-hero-ic{color:#FBFAF7;}
.cp-hero.replied .cp-hero-ic{color:#fff;}
.cp-hero.closed .cp-hero-ic{color:#fff;}
.cp-hero.revoked .cp-hero-ic{background:var(--bg-inset);color:var(--text-2);}
.cp-hero-status{font-size:15px;font-weight:800;color:var(--text-1);}
.cp-hero.replied .cp-hero-status,.cp-hero.closed .cp-hero-status,.cp-hero.processing .cp-hero-status{color:inherit;}
.cp-hero-sub{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.5;}
.cp-hero-code{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line-strong);font-size:10.5px;color:var(--text-3);display:flex;justify-content:space-between;gap:8px;position:relative;z-index:1;}
.cp-hero-code b{font-family:var(--font-mono);font-weight:700;color:var(--text-2);letter-spacing:.02em;}

/* 键值信息 */
.cp-kv{display:flex;font-size:12.5px;line-height:1.6;padding:7px 0;gap:12px;}
.cp-kv .k{flex:none;width:64px;color:var(--text-3);font-size:12px;}
.cp-kv .v{flex:1;color:var(--text-1);word-break:break-all;min-width:0;}
.cp-kv .v.muted{color:var(--text-4);}
.cp-desc-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--text-2);white-space:pre-wrap;word-break:break-all;}
.cp-evidence{display:flex;gap:8px;margin-top:10px;}

/* 平台反馈 */
.cp-result{border-radius:var(--r-l);border:1px solid var(--accent-line);background:var(--primary-soft);padding:13px 14px;}
.cp-result.replied{border-color:rgba(37,99,235,.22);background:var(--info-soft);}
.cp-result-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cp-result-verdict{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-full);background:var(--info);color:#fff;}
.cp-result-time{font-size:10.5px;color:var(--text-3);margin-left:auto;font-family:var(--font-num);}
.cp-result-text{font-size:12.5px;line-height:1.7;color:var(--text-1);white-space:pre-wrap;word-break:break-all;}

/* 评价 */
.cp-rate-stars{display:flex;gap:7px;margin:4px 0 12px;}
.cp-rate-stars button{border:none;background:none;padding:2px;cursor:pointer;color:var(--text-4);transition:color var(--d-fast),transform var(--d-fast);}
.cp-rate-stars button svg{width:27px;height:27px;fill:currentColor;stroke:currentColor;}
.cp-rate-stars button.on{color:var(--primary);}
.cp-rate-stars button:active{transform:scale(.88);}
.cp-rate-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.cp-rate-tag{height:30px;padding:0 13px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--bg-card-2);color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--d-fast);}
.cp-rate-tag.active{background:var(--primary-soft);border-color:rgba(176, 138, 60, .45);color:var(--primary-dim);}
.cp-rate-sum{font-size:12px;font-weight:700;color:var(--primary-dim);margin:-2px 0 10px;}
.cp-rated{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);}
.cp-rated .stars{color:var(--primary);display:flex;gap:2px;}
.cp-rated .stars svg{width:14px;height:14px;fill:currentColor;}

/* 操作区：详情页操作已上浮至底部固定栏 #cp-cta-detail（见上方 V3.4 样式） */
.cp-dev{text-align:center;margin-top:10px;}
.cp-dev button{border:none;background:none;font-size:10.5px;color:var(--text-4);padding:6px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

.cp-section-title{display:flex;align-items:center;gap:6px;margin:18px 2px 10px;font-size:12px;font-weight:800;color:var(--primary-dim);letter-spacing:.06em;}
.cp-section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
.cp-sec-link{margin:0 0 2px auto;font-size:11px;font-weight:600;color:var(--primary-dim);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:2px;letter-spacing:0;}
.cp-sec-link svg{width:12px;height:12px;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" id="cp-back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title" id="cp-title">投诉 / 举报</div>
    <div class="nav-right" id="cp-nav-right"></div>
  </div>

  <!-- ============ 视图 1：新建投诉 / 举报 ============ -->
  <main class="scroll cp-scroll" id="view-new">
    <div class="cp-view on">
      <div class="cp-assure">
        <div class="ai"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-shield"/></svg></div>
        <div>
          <div class="at">平台保密受理 · 全程可追踪</div>
          <div class="ad">1 个工作日内受理，1–3 个工作日反馈处理结果；受理进度与结果可在本页随时查看</div>
        </div>
      </div>

      <div class="seg" id="cp-kind" style="margin-bottom:12px;">
        <div class="seg-item active is-on" data-k="report">举报违规</div>
        <div class="seg-item" data-k="complaint">投诉纠纷</div>
      </div>

      <div class="cp-card">
        <div class="cp-label"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-flag"/></svg>请选择类型<span class="req">*</span></div>
        <div class="cp-types" id="cp-types"></div>
      </div>

      <div class="cp-card">
        <div id="cp-source-bar"></div>
        <div class="cp-field">
          <div class="cp-label" style="margin-bottom:8px;">涉及对象<span class="opt">选填 · 对方昵称 / 企业 / 会话名</span></div>
          <input class="cp-input" id="cp-target" maxlength="30" placeholder="如：李工 / XX建筑工程有限公司">
        </div>
        <div class="cp-field">
          <div class="cp-label" style="margin-bottom:8px;">关联订单 / 项目<span class="opt">选填</span></div>
          <input class="cp-input" id="cp-order" maxlength="40" placeholder="订单编号或项目名称，便于平台核查">
        </div>
        <div class="cp-field">
          <div class="cp-label" style="margin-bottom:8px;">问题描述<span class="req">*</span></div>
          <textarea class="cp-textarea" id="cp-desc" maxlength="500" rows="4" placeholder="请描述具体经过：发生时间、事件内容、涉及金额及造成的影响等（不少于 10 个字）"></textarea>
          <div class="cp-count"><span id="cp-desc-len">0</span>/500</div>
        </div>
        <div class="cp-field">
          <div class="cp-label" style="margin-bottom:8px;">补充说明<span class="opt">选填 · 证据线索</span></div>

<script src="../../js/common.js"></script>

(function () {

  /* ================= 存储与种子 ================= */
  function readAll() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr.map(migrate);
      }

  }
  function saveAll(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); }

  }
  /* 旧版两态数据迁移，并入新闭环 */
  function migrate(r) {
    if (r && r.stage && STAGE[r.stage]) return r;
    var now = Date.now();
    var stage = r && r.status === '已处理' ? 'replied' : 'received';
    var tl = [{ k: 'submit', ts: r && r.ts || now, title: '提交' + (r && r.type ? '（' + r.type + '）' : ''), desc: '投诉 / 举报已提交，等待平台受理' }];
    var rec = {
      id: r && r.id || ('cmp' + now.toString(36)),
      code: r && r.code || ('TS' + fmtCode(new Date(r && r.ts || now)) + '-OLD' + Math.random().toString(36).slice(2, 6).toUpperCase()),
      kind: 'complaint', type: r && r.type || '其他问题',
      target: r && r.target || '', order: '', desc: r && r.desc || '', extra: r && r.extra || '',
      contact: r && r.contact || '', shots: 0, source: '',
      ts: r && r.ts || now, stage: stage,
      timeline: tl, supplements: [], rating: null, reviewRequest: null, result: null
    };
    if (stage === 'replied') {
      rec.result = { verdict: '已处理', content: '该单据为历史记录，平台已处理完成。如对结果有疑问，可申请复查或补充新的证据。', ts: (r && r.ts || now) + 86400000 };
      rec.timeline.push({ k: 'reply', ts: rec.result.ts, title: '平台反馈', desc: '处理状态：已处理' });
    }
    return rec;
  }
  function seedOnce() {

      }

      var seeds = [
        {
          id: 'seed1', code: 'TS' + fmtCode(base) + '-6F2Q', kind: 'report', type: '恶意拖欠',
          target: '成都宏远建材经营部', order: 'EC202609250176 · C30 混凝土采购',
          desc: '9月25日供货的 C30 混凝土款项合计 ¥18,600，约定到货 7 日内结清，对方多次承诺还款但至今未付，并拒接电话。',
          extra: '有微信催款记录截图与供货签收单。', contact: '138****6021', shots: 2, source: '',
          ts: at(base, 10, 12), stage: 'processing',
          timeline: [
            { k: 'submit', ts: at(base, 10, 12), title: '提交举报', desc: '举报类型：恶意拖欠' },
            { k: 'accept', ts: at(base, 14, 30), title: '平台已受理', desc: '审核专员已受理，正在联系双方核实交易凭证' },
            { k: 'need', ts: now - 20 * 3600000, title: '请补充材料', desc: '平台：为加快核实，请补充供货签收单与双方对账单照片' }
          ],
          supplements: [], rating: null, reviewRequest: null, result: null, needInfo: true, seeded: true
        },

          target: '张工（居间顾问）', order: '',
          desc: '对接过程中对方言语敷衍，承诺的项目资料 3 天未提供，询问进度后被言语顶撞。',
          extra: '聊天记录已截图。', contact: '微信同号', shots: 1, source: '',
          ts: now - 5 * 86400000, stage: 'replied',

            { k: 'submit', ts: now - 5 * 86400000, title: '提交投诉', desc: '投诉类型：服务态度' },
            { k: 'accept', ts: now - 5 * 86400000 + 3 * 3600000, title: '平台已受理', desc: '审核专员已受理' },
            { k: 'reply', ts: now - 6 * 3600000, title: '平台反馈', desc: '经核实，对方服务规范执行不到位，已进行约谈与服务规范教育，并扣减其服务分 2 分。' }
          ],

        },
        {
          id: 'seed3', code: 'TS' + fmtCode(new Date(now - 9 * 86400000)) + '-2D8X', kind: 'report', type: '虚假信息',
          target: '某劳务分包（李队长）', order: '',
          desc: '发布的招工信息标注日结 320 元/天，到场后被要求先交 300 元伙食费，且工资变为月结。',
          extra: '', contact: '139****8877', shots: 1, source: '',
          ts: now - 9 * 86400000, stage: 'closed',
          timeline: [
            { k: 'submit', ts: now - 9 * 86400000, title: '提交举报', desc: '举报类型：虚假信息' },
            { k: 'accept', ts: now - 9 * 86400000 + 2 * 3600000, title: '平台已受理', desc: '审核专员已受理并开展核查' },
            { k: 'supplement', ts: now - 8 * 86400000, title: '补充材料', desc: '补充了招工页面截图 1 张' },
            { k: 'reply', ts: now - 8 * 86400000 + 6 * 3600000, title: '平台反馈', desc: '信息违规属实，相关内容已下架，账号被限制发布 7 天' },
            { k: 'rate', ts: now - 7 * 86400000, title: '评价完成', desc: '满意度：5 星 · 处理及时、结果公正' }
          ],
          supplements: [{ content: '招工页面截图 1 张，已显示日结宣传与收费要求不一致。', ts: now - 8 * 86400000 }],
          rating: { score: 5, tags: ['处理及时', '结果公正'], comment: '', ts: now - 7 * 86400000 },
          reviewRequest: null,
          result: { verdict: '违规属实 · 内容已下架', content: '经核查，该账号发布的招工信息与实际情况不符，并存在违规收费引导。平台已下架相关信息，并对账号处以限制发布 7 天的处罚。', ts: now - 8 * 86400000 + 6 * 3600000 }, seeded: true
        },
        {
          id: 'seed4', code: 'TS' + fmtCode(new Date(now - 3 * 3600000)) + '-7H5R', kind: 'report', type: '资质造假',
          target: '鑫达建筑劳务有限公司', order: '',
          desc: '对方主页展示的“施工劳务资质”疑似 PS 伪造，资质等级与住建部门公开查询结果不一致，请平台核验其资质真实性。',
          extra: '已在全国建筑市场监管平台查询，未检索到该资质编号。', contact: '微信同号', shots: 1, source: '',
          ts: now - 3 * 3600000, stage: 'received', needInfo: false,
          timeline: [
            { k: 'submit', ts: now - 3 * 3600000, title: '提交举报', desc: '举报类型：资质造假' }
          ],
          supplements: [], rating: null, reviewRequest: null, result: null, seeded: true
        },
        {
          id: 'seed5', code: 'TS' + fmtCode(new Date(now - 6 * 86400000)) + '-4B9W', kind: 'report', type: '垃圾广告',
          target: '陌生账号（建材推广）', order: '',
          desc: '对方在会话中反复发送无关建材促销广告与外链，疑似营销号，影响正常沟通。',
          extra: '', contact: '', shots: 0, source: '',
          ts: now - 6 * 86400000, stage: 'revoked', needInfo: false,
          timeline: [
            { k: 'submit', ts: now - 6 * 86400000, title: '提交举报', desc: '举报类型：垃圾广告' },
            { k: 'revoke', ts: now - 6 * 86400000 + 2 * 3600000, title: '已撤销', desc: '提交人主动撤销（对方已停止发送广告，双方自行解决）' }
          ],
          supplements: [], rating: null, reviewRequest: null, result: null, seeded: true
        }

      localStorage.setItem(SEED_FLAG, '1');

  }

  /* ================= 工具 ================= */
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtCode(d) { return '' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + p2(d.getHours()) + p2(d.getMinutes()); }
  function fmtFull(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function fmtMD(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getById(id) {
    var list = readAll();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function updateById(id, fn) {
    var list = readAll();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { fn(list[i]); break; }
    }
    saveAll(list);
  }
  function svgUse(name) {
    return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-' + name + '"/></svg>';
  }
  /* 带多行输入的确认弹窗（UI.dialog 关闭不可拦截，校验失败时重开并回填） */
  function promptDialog(cfg) {
    function open(val) {
      UI.dialog({
        title: cfg.title, ok: cfg.ok, cancel: '取消',
        text: '<div style="font-size:12.5px;color:var(--text-3);line-height:1.7;margin-bottom:8px;">' + cfg.tip + '</div>' +
          '<textarea id="cp-dlg-input" class="cp-textarea" maxlength="200" rows="3" placeholder="' + esc(cfg.placeholder) + '" style="width:100%;box-sizing:border-box;">' + esc(val) + '</textarea>',
        onOk: function () {
          var v = (document.getElementById('cp-dlg-input').value || '').trim();
          if (!v) { UI.toast(cfg.emptyWarn, 'warn'); setTimeout(function () { open(v); }, 0); return; }
          cfg.onOk(v);
        }
      });
      setTimeout(function () { var t = document.getElementById('cp-dlg-input'); if (t) t.focus(); }, 30);
    }
    open('');
  }

  /* ================= 路由 ================= */
  var views = { new: document.getElementById('view-new'), list: document.getElementById('view-list'), detail: document.getElementById('view-detail') };
  function route() {
    var h = location.hash || '#/new';
    var name = 'new', id = null;
    var m = h.match(/#\/(new|list|detail)/);
    if (m) name = m[1];
    if (name === 'detail') {
      id = new URLSearchParams(h.split('?')[1] || '').get('id');
      if (!id || !getById(id)) { location.hash = '#/list'; return; }
    }
    Object.keys(views).forEach(function (k) {
      views[k].style.display = k === name ? '' : 'none';
      var inner = views[k].querySelector('.cp-view');
      if (inner) inner.classList.toggle('on', k === name);
    });
    var title = document.getElementById('cp-title');
    var right = document.getElementById('cp-nav-right');
    var cta = document.getElementById('cp-cta-bar');
    var ctaDetail = document.getElementById('cp-cta-detail');
    right.innerHTML = '';
    if (name === 'new') {
      title.textContent = '投诉 / 举报';
      cta.style.display = '';
      ctaDetail.style.display = 'none';
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'nav-text-btn';
      b.innerHTML = '我的记录<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chev-r"/></svg>';
      b.onclick = function () { location.hash = '#/list'; };
      right.appendChild(b);
    } else if (name === 'list') {
      title.textContent = '我的投诉记录';
      cta.style.display = 'none';
      ctaDetail.style.display = 'none';
      renderList();
    } else {
      title.textContent = '投诉详情';
      cta.style.display = 'none';
      ctaDetail.style.display = '';
      renderDetail(id);
    }
    views[name].scrollTop = 0;
  }

  /* ================= 视图 1：表单 ================= */
  var kind = 'report';
  var selType = '';
  var shots = 0;
  var submitting = false;

  function renderTypes() {
    var box = document.getElementById('cp-types');
    box.innerHTML = TYPE_MAP[kind].map(function (it) {
      return '<button type="button" class="cp-type' + (selType === it.t ? ' active' : '') + '" data-t="' + it.t + '">' +
        svgUse(it.icon) + '<span>' + it.t + '</span></button>';
    }).join('');
  }
  function setKind(k) {
    kind = k;
    selType = '';
    document.querySelectorAll('#cp-kind .seg-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.k === k);
      el.classList.toggle('is-on', el.dataset.k === k);
    });
    document.getElementById('cp-submit').textContent = '提交' + KIND_LABEL[k];
    renderTypes();
  }
  function prefillFromQuery() {
    var q = new URLSearchParams(location.search);
    var target = q.get('target');
    var order = q.get('order');
    var from = q.get('from');
    if (target) document.getElementById('cp-target').value = target;
    if (order) document.getElementById('cp-order').value = order;
    var bar = document.getElementById('cp-source-bar');
    if (target && from === 'chat') {
      bar.innerHTML = '<span class="cp-source">' + svgUse('chat') + '来自会话：' + esc(target) +
        '<button type="button" id="cp-source-x" aria-label="移除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span>';
      document.getElementById('cp-source-x').onclick = function () {
        bar.innerHTML = '';
        document.getElementById('cp-target').value = '';
      };
    }
  }
  function recCardHTML(r) {
    var st = STAGE[r.stage] || STAGE.received;
    var hint = '';
    if (r.stage === 'received') hint = '<div class="cp-progress-hint cp-hint-processing">' + svgUse('clock') + '已提交，等待平台受理（1 个工作日内）</div>';
    else if (r.stage === 'processing' && r.needInfo) hint = '<div class="cp-progress-hint cp-hint-replied">' + svgUse('alert') + '平台请你补充材料，补充后将加快处理</div>';
    else if (r.stage === 'processing') hint = '<div class="cp-progress-hint cp-hint-processing">' + svgUse('clock') + '平台核查处理中，预计 1–3 个工作日反馈</div>';
    else if (r.stage === 'replied') hint = '<div class="cp-progress-hint cp-hint-replied">' + svgUse('bell') + '平台已反馈处理结果，请及时查看并评价</div>';
    else if (r.stage === 'closed') hint = '<div class="cp-progress-hint cp-hint-closed">' + svgUse('check') + '已完成，感谢你的反馈与监督</div>';
    else if (r.stage === 'revoked') hint = '<div class="cp-progress-hint cp-hint-revoked">' + svgUse('x') + '该单据已撤销</div>';
    return '<div class="cp-rec" data-id="' + r.id + '">' +
      '<div class="cp-rec-head"><span class="cp-rec-kind">' + KIND_LABEL[r.kind] + '</span>' +
      '<span class="cp-rec-type">' + esc(r.type) + '</span>' +
      '<span class="cp-badge ' + st.cls + '">' + st.label + '</span>' +
      '<span class="cp-rec-time">' + fmtMD(r.ts) + '</span></div>' +
      '<div class="cp-rec-desc">' + esc(r.desc) + '</div>' +
      hint +
      '<div class="cp-rec-foot"><span class="cp-rec-code">' + esc(r.code) + '</span>' +
      '<span class="cp-rec-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chev-r"/></svg></span></div></div>';
  }
  function bindRecCards(container) {
    if (container.__cpBound) return;
    container.__cpBound = true;
    container.addEventListener('click', function (e) {
      var card = e.target.closest('.cp-rec');
      if (card) location.hash = '#/detail?id=' + card.getAttribute('data-id');
    });
  }

  function bindForm() {
    document.querySelectorAll('#cp-kind .seg-item').forEach(function (el) {
      el.onclick = function () { setKind(el.dataset.k); };
    });
    document.getElementById('cp-types').addEventListener('click', function (e) {
      var c = e.target.closest('.cp-type');
      if (!c) return;
      selType = c.getAttribute('data-t');
      document.querySelectorAll('.cp-type').forEach(function (x) {
        x.classList.toggle('active', x === c);
      });
    });
    document.getElementById('cp-desc').addEventListener('input', function (e) {
      document.getElementById('cp-desc-len').textContent = e.target.value.length;
    });
    document.getElementById('cp-extra').addEventListener('input', function (e) {
      document.getElementById('cp-extra-len').textContent = e.target.value.length;
    });
    document.getElementById('cp-add-shot').addEventListener('click', function () {
      if (shots >= 3) { UI.toast('最多上传 3 张凭证', 'warn'); return; }
      shots++;
      var wrap = document.createElement('div');
      wrap.className = 'cp-shot';
      wrap.innerHTML = '<div class="cp-shot-img">' + svgUse('file') + '</div>' +
        '<button type="button" class="cp-shot-del" aria-label="删除凭证">×</button>';
      wrap.querySelector('.cp-shot-del').onclick = function () {
        wrap.remove(); shots--;
        document.getElementById('cp-add-shot').style.display = '';
      };
      var add = document.getElementById('cp-add-shot');
      add.parentNode.insertBefore(wrap, add);
      if (shots >= 3) add.style.display = 'none';
      UI.toast('凭证已添加（原型演示）', 'ok');
    });
    document.getElementById('cp-submit').addEventListener('click', submit);
  }

  function submit() {
    if (submitting) return;
    if (!selType) { UI.toast('请选择' + KIND_LABEL[kind] + '类型', 'err'); return; }
    var desc = document.getElementById('cp-desc').value.trim();
    if (!desc) { UI.toast('请填写问题描述', 'err'); document.getElementById('cp-desc').focus(); return; }
    if (desc.length < 10) { UI.toast('问题描述不少于 10 个字', 'err'); document.getElementById('cp-desc').focus(); return; }
    if (!document.getElementById('cp-agree').checked) { UI.toast('请先确认内容真实客观', 'warn'); return; }
    var target = document.getElementById('cp-target').value.trim();
    var order = document.getElementById('cp-order').value.trim();
    var extra = document.getElementById('cp-extra').value.trim();
    var contact = document.getElementById('cp-contact').value.trim();

    UI.dialog({
      title: '确认提交' + KIND_LABEL[kind],
      ok: '确认提交', cancel: '再想想',
      text: '<div style="font-size:13px;line-height:1.8;color:var(--text-2);padding:2px 0;">' +
        '<div><b style="color:var(--text-1)">类型：</b>' + esc(selType) + '</div>' +
        (target ? '<div><b style="color:var(--text-1)">涉及对象：</b>' + esc(target) + '</div>' : '') +
        '<div style="margin-top:6px;color:var(--text-3);font-size:12px;">提交后将生成受理编号，平台 1 个工作日内受理、1–3 个工作日反馈，可随时在记录中查看进度。</div></div>',
      onOk: doSubmit
    });

    function doSubmit() {
      submitting = true;
      var btn = document.getElementById('cp-submit');
      btn.disabled = true;
      btn.textContent = '提交中…';
      setTimeout(function () {
        var now = Date.now();
        var rec = {
          id: 'cmp' + now.toString(36) + Math.random().toString(36).slice(2, 5),
          code: 'TS' + fmtCode(new Date(now)) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(),
          kind: kind, type: selType, target: target, order: order, desc: desc, extra: extra,
          contact: contact, shots: shots, source: '',
          ts: now, stage: 'received', needInfo: false,
          timeline: [{ k: 'submit', ts: now, title: '提交' + KIND_LABEL[kind], desc: KIND_LABEL[kind] + '类型：' + selType }],
          supplements: [], rating: null, reviewRequest: null, result: null
        };
        var list = readAll();
        list.push(rec);
        saveAll(list);
        /* 重置表单 */
        ['cp-desc', 'cp-extra', 'cp-order', 'cp-contact'].forEach(function (i) { document.getElementById(i).value = ''; });
        document.getElementById('cp-desc-len').textContent = '0';
        document.getElementById('cp-extra-len').textContent = '0';
        document.getElementById('cp-agree').checked = false;
        document.querySelectorAll('#cp-shots .cp-shot').forEach(function (n) { n.remove(); });
        shots = 0;
        document.getElementById('cp-add-shot').style.display = '';
        submitting = false;
        btn.disabled = false;
        btn.textContent = '提交' + KIND_LABEL[kind];
        UI.toast('已受理，编号 ' + rec.code, 'ok');
        location.hash = '#/detail?id=' + rec.id;
      }, 600);
    }
  }

  /* ================= 视图 2：列表 ================= */
  var listFilter = 'all';
  function renderList() {
    var box = document.getElementById('cp-list-view');
    var all = readAll().sort(function (a, b) { return b.ts - a.ts; });
    function cnt(k) {
      if (k === 'all') return all.length;
      if (k === 'processing') return all.filter(function (r) { return r.stage === 'received' || r.stage === 'processing'; }).length;
      if (k === 'replied') return all.filter(function (r) { return r.stage === 'replied'; }).length;
      return all.filter(function (r) { return r.stage === 'closed' || r.stage === 'revoked'; }).length;
    }
    var html = '<div class="cp-filter">' + FILTERS.map(function (f) {
      return '<button type="button" class="cp-fitem' + (listFilter === f.k ? ' active' : '') + '" data-f="' + f.k + '">' +
        f.label + '<span class="n">' + cnt(f.k) + '</span></button>';
    }).join('') + '</div>';
    var list = all.filter(function (r) {
      if (listFilter === 'all') return true;
      if (listFilter === 'processing') return r.stage === 'received' || r.stage === 'processing';
      if (listFilter === 'replied') return r.stage === 'replied';
      return r.stage === 'closed' || r.stage === 'revoked';
    });
    if (!list.length) {
      html += '<div class="empty-state" style="padding-top:48px;">' +
        '<div class="e-icon">' + svgUse('shield') + '</div>' +
        '<div class="e-title">暂无相关记录</div>' +
        '<div class="e-desc">提交的投诉与举报，以及平台处理进度<br>都会在这里显示</div>' +
        '<button type="button" class="btn btn-primary btn-sm" style="margin-top:16px;min-width:140px;" id="cp-empty-new">去投诉 / 举报</button></div>';
    } else {
      html += list.map(recCardHTML).join('');
    }
    box.innerHTML = html;
    box.querySelectorAll('.cp-fitem').forEach(function (el) {
      el.onclick = function () { listFilter = el.getAttribute('data-f'); renderList(); };
    });
    var eb = document.getElementById('cp-empty-new');
    if (eb) eb.onclick = function () { location.hash = '#/new'; };
    bindRecCards(box);
  }

  /* ================= 视图 3：详情 ================= */
  function tlItemHTML(node, state) {
    return '<div class="tl-item ' + state + '"><div class="tl-dot"></div><div class="tl-content">' +
      '<div class="tl-top"><div class="tl-title">' + esc(node.title) + '</div>' +
      (node.ts ? '<div class="tl-time">' + fmtMD(node.ts) + '</div>' : '') + '</div>' +
      (node.desc ? '<div class="tl-desc">' + esc(node.desc) + '</div>' : '') + '</div></div>';
  }
  function renderDetail(id) {
    var r = getById(id);
    var box = document.getElementById('cp-detail-view');
    if (!r) {
      box.innerHTML = '';
      var bar0 = document.getElementById('cp-cta-detail');
      if (bar0) { bar0.innerHTML = ''; bar0.style.display = 'none'; }
      return;
    }
    var st = STAGE[r.stage];
    var heroIcon = r.stage === 'closed' ? 'check' : r.stage === 'revoked' ? 'x' : r.stage === 'replied' ? 'bell' : r.stage === 'processing' ? 'clock' : 'shield';
    var heroSub = {
      received: '单据已生成，平台将在 1 个工作日内受理，请耐心等待',
      processing: (r.needInfo ? '平台需要你补充相关材料，请按提示尽快提交' : '平台正在核查处理，预计 1–3 个工作日反馈结果'),
      replied: '处理结果已出，请查看反馈并对本次服务进行评价',
      closed: '本次投诉 / 举报已处理完成',
      revoked: '你已主动撤销该单据'
    }[r.stage];

    var h = '';
    /* 状态横幅 */
    h += '<div class="cp-hero ' + st.cls + '"><div class="cp-hero-top"><div class="cp-hero-ic">' + svgUse(heroIcon) + '</div>' +
      '<div><div class="cp-hero-status">' + st.label + '</div><div class="cp-hero-sub">' + heroSub + '</div></div></div>' +
      '<div class="cp-hero-code"><span>受理编号</span><b>' + esc(r.code) + '</b></div></div>';

    /* 单据内容 */
    h += '<div class="card" style="border-radius:var(--r-xl);">';
    h += '<div class="cp-kv"><div class="k">类型</div><div class="v"><span class="cp-rec-kind">' + KIND_LABEL[r.kind] + '</span> ' + esc(r.type) + '</div></div>';
    if (r.target) h += '<div class="cp-kv"><div class="k">涉及对象</div><div class="v">' + esc(r.target) + '</div></div>';
    if (r.order) h += '<div class="cp-kv"><div class="k">关联订单</div><div class="v">' + esc(r.order) + '</div></div>';
    if (r.contact) h += '<div class="cp-kv"><div class="k">联系方式</div><div class="v">' + esc(r.contact) + '</div></div>';
    h += '<div class="cp-desc-block">' + esc(r.desc) + '</div>';
    if (r.extra) h += '<div class="cp-desc-block" style="color:var(--text-3);"><span style="color:var(--text-3);">补充说明：</span>' + esc(r.extra) + '</div>';
    if (r.shots) {
      h += '<div class="cp-evidence">';
      for (var s = 0; s < r.shots; s++) h += '<div class="cp-shot"><div class="cp-shot-img">' + svgUse('file') + '</div></div>';
      h += '</div>';
    }
    h += '</div>';

    /* 平台反馈 */
    if (r.result) {
      h += '<div class="cp-section-title">平台反馈</div>';
      h += '<div class="cp-result replied"><div class="cp-result-top"><span class="cp-result-verdict">' + esc(r.result.verdict) + '</span>' +
        '<span class="cp-result-time">' + fmtFull(r.result.ts) + '</span></div>' +
        '<div class="cp-result-text">' + esc(r.result.content) + '</div></div>';
    }

    /* 评价区 */
    if (r.stage === 'replied' && !r.rating) h += rateFormHTML(r);
    if (r.rating) {
      var starIcons = '';
      for (var si = 1; si <= 5; si++) {
        starIcons += '<svg viewBox="0 0 24 24" style="opacity:' + (si <= r.rating.score ? '1' : '.25') + '"><use href="#i-star"/></svg>';
      }
      h += '<div class="cp-section-title">我的评价</div><div class="card" style="border-radius:var(--r-xl);"><div class="cp-rated">' +
        '<span class="stars">' + starIcons + '</span>' +
        '<b style="color:var(--text-1);">' + r.rating.score + ' 分</b>' +
        (r.rating.tags && r.rating.tags.length ? '<span style="color:var(--text-3);font-size:11px;">· ' + r.rating.tags.map(esc).join('、') + '</span>' : '') +
        '</div>';
      if (r.rating.comment) h += '<div class="cp-desc-block">' + esc(r.rating.comment) + '</div>';
      h += '</div>';
    }

    /* 复查记录 */
    if (r.reviewRequest) {
      h += '<div class="cp-section-title">复查申请</div><div class="card" style="border-radius:var(--r-xl);">' +
        '<div class="cp-desc-block" style="margin-top:0;padding-top:0;border-top:none;">' + esc(r.reviewRequest.content) + '</div>' +
        '<div class="text-3 fs-11" style="margin-top:6px;font-family:var(--font-num);">提交于 ' + fmtFull(r.reviewRequest.ts) + ' · 平台已重新受理</div></div>';
    }

    /* 处理进度 */
    h += '<div class="cp-section-title">处理进度</div><div class="card" style="border-radius:var(--r-xl);"><div class="timeline">';
    var tl = r.timeline.slice();
    if (r.stage === 'revoked') {
      /* 撤销：已发生节点全部 done */
      tl.forEach(function (n) { h += tlItemHTML(n, 'done'); });
    } else {
      tl.forEach(function (n, i) { h += tlItemHTML(n, i === tl.length - 1 ? 'current' : 'done'); });
      /* 未发生的未来节点 */
      if (r.stage === 'received') h += tlItemHTML({ title: '平台受理', desc: '1 个工作日内', ts: '' }, 'todo');
      if (r.stage === 'received' || r.stage === 'processing') {
        h += tlItemHTML({ title: '反馈处理结果', desc: '受理后 1–3 个工作日', ts: '' }, 'todo');
        h += tlItemHTML({ title: '评价并关闭', desc: '查看结果后对服务评价', ts: '' }, 'todo');
      }
      if (r.stage === 'replied') h += tlItemHTML({ title: '评价并关闭', desc: '查看结果后对服务评价', ts: '' }, 'todo');
    }
    h += '</div></div>';

    /* 原型演示推进 */
    if (r.stage !== 'closed' && r.stage !== 'revoked') {
      h += '<div class="cp-dev"><button type="button" id="cp-dev-step" title="原型演示：模拟平台推进处理流程">原型演示 · 模拟平台下一步</button></div>';
    }

    box.innerHTML = h;
    renderDetailBar(r);
    bindDetailActions(r);
  }

  /* 详情页底部固定操作栏：按状态渲染主行动按钮 + 次级链接，与内容区解耦、始终悬浮可见 */
  function renderDetailBar(r) {
    var bar = document.getElementById('cp-cta-detail');
    if (!bar) return;
    var h = '';
    if (r.stage === 'received' || r.stage === 'processing') {
      /* 主行动：补充材料；次级：撤销（危险操作降级为安静链接，避免误触） */
      h += '<button type="button" class="btn btn-primary btn-lg btn-block" id="cp-btn-supplement">补充材料 / 证据</button>' +
        '<div class="cp-dbar-link"><button type="button" class="cp-btn-danger" id="cp-btn-revoke">撤销本次' + KIND_LABEL[r.kind] + '</button></div>';
    } else if (r.stage === 'replied' && !r.rating) {
      /* 主行动：提交评价（按钮随表单上浮固定）；次级：申请复查 */
      h += '<button type="button" class="btn btn-primary btn-lg btn-block" id="cp-btn-rate">提交评价并关闭</button>' +
        '<div class="cp-dbar-link"><button type="button" class="cp-btn-link" id="cp-btn-review">对结果有异议 · 申请复查</button></div>';
    } else if (r.stage === 'revoked') {
      h += '<button type="button" class="btn btn-primary btn-lg btn-block" id="cp-btn-resubmit">重新提交</button>';
    }
    bar.innerHTML = h;
    bar.style.display = h ? '' : 'none';
  }

  function rateFormHTML(r) {
    var tags = RATE_TAGS.map(function (t) {
      return '<button type="button" class="cp-rate-tag" data-t="' + t + '">' + t + '</button>';
    }).join('');
    return '<div class="cp-section-title">服务评价</div><div class="card" style="border-radius:var(--r-xl);">' +
      '<div class="text-3 fs-12" style="margin-bottom:8px;">平台已反馈处理结果，本次服务你的满意度是？</div>' +
      '<div class="cp-rate-stars" id="cp-stars">' +
      [1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" data-n="' + n + '" aria-label="' + n + '星"><svg viewBox="0 0 24 24"><use href="#i-star"/></svg></button>';
      }).join('') + '</div>' +
      '<div class="cp-rate-sum" id="cp-rate-sum" style="display:none;"></div>' +
      '<div class="cp-rate-tags" id="cp-rate-tags">' + tags + '</div>' +
      '<textarea class="cp-textarea" id="cp-rate-comment" maxlength="200" rows="2" placeholder="补充评价（选填）"></textarea>' +
      '</div>';
  }

  var RATE_SUMS = ['很不满意', '不太满意', '一般', '比较满意', '非常满意'];
  function bindDetailActions(r) {
    /* 评分 */
    var stars = document.getElementById('cp-stars');
    var score = 0;
    var chosenTags = [];
    if (stars) {
      stars.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        score = parseInt(b.getAttribute('data-n'), 10);
        stars.querySelectorAll('button').forEach(function (x) {
          x.classList.toggle('on', parseInt(x.getAttribute('data-n'), 10) <= score);
        });
        var sum = document.getElementById('cp-rate-sum');
        sum.style.display = '';
        sum.textContent = RATE_SUMS[score - 1];
      });
    }
    var tagsBox = document.getElementById('cp-rate-tags');
    if (tagsBox) {
      tagsBox.addEventListener('click', function (e) {
        var b = e.target.closest('.cp-rate-tag');
        if (!b) return;
        var t = b.getAttribute('data-t');
        var i = chosenTags.indexOf(t);
        if (i >= 0) chosenTags.splice(i, 1); else chosenTags.push(t);
        b.classList.toggle('active');
      });
    }
    var btnRate = document.getElementById('cp-btn-rate');
    if (btnRate) {
      btnRate.onclick = function () {
        if (!score) { UI.toast('请先选择星级评分', 'warn'); return; }
        var comment = document.getElementById('cp-rate-comment').value.trim();
        updateById(r.id, function (rec) {
          rec.stage = 'closed';
          rec.rating = { score: score, tags: chosenTags, comment: comment, ts: Date.now() };
          rec.timeline.push({ k: 'rate', ts: Date.now(), title: '评价完成', desc: '满意度：' + score + ' 星' + (chosenTags.length ? ' · ' + chosenTags.join('、') : '') });
        });
        UI.toast('评价已提交，感谢你的监督', 'ok');
        renderDetail(r.id);
      };
    }
    /* 补充材料 */
    var btnSup = document.getElementById('cp-btn-supplement');
    if (btnSup) {
      btnSup.onclick = function () {
        promptDialog({
          title: '补充材料 / 证据', ok: '提交补充',
          tip: '请填写需要补充的情况说明，或说明已上传的凭证内容：',
          placeholder: '如：已上传对账单照片 1 张，显示对方已签收…',
          emptyWarn: '请填写补充内容',
          onOk: function (v) {
            updateById(r.id, function (rec) {
              rec.supplements.push({ content: v, ts: Date.now() });
              rec.needInfo = false;
              rec.timeline.push({ k: 'supplement', ts: Date.now(), title: '已补充材料', desc: v });
            });
            UI.toast('补充材料已提交', 'ok');
            renderDetail(r.id);
          }
        });
      };
    }
    /* 撤销 */
    var btnRev = document.getElementById('cp-btn-revoke');
    if (btnRev) {
      btnRev.onclick = function () {
        UI.dialog({
          title: '撤销' + KIND_LABEL[r.kind], ok: '确认撤销', cancel: '再想想',
          text: '<div style="font-size:13px;line-height:1.8;color:var(--text-2);padding:2px 0;">撤销后该单据将关闭，<b style="color:var(--error)">无法恢复</b>。如问题仍需处理，可之后重新提交。确认撤销吗？</div>',
          onOk: function () {
            updateById(r.id, function (rec) {
              rec.stage = 'revoked';
              rec.needInfo = false;
              rec.timeline.push({ k: 'revoke', ts: Date.now(), title: '已撤销', desc: '提交人主动撤销' });
            });
            UI.toast('已撤销该单据', 'ok');
            renderDetail(r.id);
          }
        });
      };
    }
    /* 复查 */
    var btnRev2 = document.getElementById('cp-btn-review');
    if (btnRev2) {
      btnRev2.onclick = function () {
        promptDialog({
          title: '申请复查', ok: '提交申请',
          tip: '对处理结果有异议可申请复查（每单限 1 次），请说明理由，平台将重新核查：',
          placeholder: '请说明不认可处理结果的具体理由…',
          emptyWarn: '请填写复查理由',
          onOk: function (v) {
            updateById(r.id, function (rec) {
              rec.reviewRequest = { content: v, ts: Date.now() };
              rec.stage = 'processing';
              rec.result = null;
              rec.timeline.push({ k: 'review-req', ts: Date.now(), title: '申请复查', desc: v });
            });
            UI.toast('复查申请已提交，平台将重新核查', 'ok');
            renderDetail(r.id);
          }
        });
      };
    }
    /* 重新提交 */
    var btnResub = document.getElementById('cp-btn-resubmit');
    if (btnResub) {
      btnResub.onclick = function () {
        document.getElementById('cp-target').value = r.target || '';
        document.getElementById('cp-order').value = r.order || '';
        document.getElementById('cp-desc').value = r.desc || '';
        document.getElementById('cp-desc-len').textContent = (r.desc || '').length;
        setKind(r.kind);
        selType = r.type;
        renderTypes();
        location.hash = '#/new';
        UI.toast('已带出原单据内容，请确认后提交', 'info');
      };
    }
    /* 原型演示推进 */
    var btnDev = document.getElementById('cp-dev-step');
    if (btnDev) {
      btnDev.onclick = function () { devAdvance(r); };
    }
  }

  /* 原型演示：模拟平台后台动作，推进闭环状态 */
  function devAdvance(r) {
    var now = Date.now();
    if (r.stage === 'received') {
      updateById(r.id, function (rec) {
        rec.stage = 'processing';
        rec.timeline.push({ k: 'accept', ts: now, title: '平台已受理', desc: '审核专员已受理，正在开展核查' });
      });
      UI.toast('（演示）平台已受理', 'ok');
    } else if (r.stage === 'processing') {
      if (r.reviewRequest) {
        /* 复查后重新反馈 */
        updateById(r.id, function (rec) {
          rec.stage = 'replied';
          rec.needInfo = false;
          rec.result = { verdict: '复查完成 · 结果更新', content: '针对你的复查理由，平台重新核查了全部材料与双方沟通记录。复查结论：维持原处置结果，并已追加对对方账号的关注名单，后续如有新问题可再次提交。', ts: now };
          rec.timeline.push({ k: 'reply', ts: now, title: '复查结果反馈', desc: '复查完成，结果已更新' });
        });
        UI.toast('（演示）复查结果已反馈', 'ok');
      } else if (!r.needInfo && (!r.supplements || r.supplements.length === 0)) {
        updateById(r.id, function (rec) {
          rec.needInfo = true;
          rec.timeline.push({ k: 'need', ts: now, title: '请补充材料', desc: '平台：为完成核实，请补充相关凭证或情况说明' });
        });
        UI.toast('（演示）平台请求补充材料', 'warn');
      } else {
        updateById(r.id, function (rec) {
          rec.stage = 'replied';
          rec.needInfo = false;
          rec.result = {
            verdict: '情况属实 · 已处置',
            content: '经平台核查，你反映的情况属实。已依据平台规则对相关账号采取处置措施，并将结果纳入其信用记录。如对结果有异议，可申请复查。',
            ts: now
          };
          rec.timeline.push({ k: 'reply', ts: now, title: '平台反馈', desc: '核查完成，处理结果已反馈' });
        });
        UI.toast('（演示）平台已反馈处理结果', 'ok');
      }
    } else if (r.stage === 'replied') {
      UI.toast('请提交评价，或申请复查', 'info');
    }
    renderDetail(r.id);
  }

  /* ================= 初始化 ================= */
  document.getElementById('cp-back').onclick = function () {
    if (/^#\/detail/.test(location.hash)) { location.hash = '#/list'; return; }
    if (location.hash === '#/list') { location.hash = '#/new'; return; }
    history.back();
  };

  seedOnce();
  setKind('report');
  prefillFromQuery();
  bindForm();
  window.addEventListener('hashchange', route);
  /* 多标签页数据同步 */
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    var h = location.hash || '#/new';
    if (h.indexOf('#/list') === 0) renderList();
    else if (h.indexOf('#/detail') === 0) {
      var mId = new URLSearchParams(h.split('?')[1] || '').get('id');
      if (mId) renderDetail(mId);
    }
  });
  if (!location.hash) { /* 默认表单视图 */ }
  route();
})();
</script>
