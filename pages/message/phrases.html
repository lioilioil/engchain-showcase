function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

<title>常用语 · 工程链</title>

<style>
  /* P1: enlarge back button touch target to 44px minimum */
  .nav-back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:10px;margin:-10px 0;font-size:22px;line-height:1;}
  .ph-hint{display:flex;align-items:flex-start;gap:8px;margin:14px 4px 12px;padding:10px 12px;border-radius:12px;background:rgba(184,153,104,.08);border:1px solid rgba(184,153,104,.25);font-size:11.5px;line-height:1.6;color:var(--text-2);}
  .ph-hint .ic{width:14px;height:14px;color:var(--primary-dim);flex:none;margin-top:1px;}
  .ph-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .ph-cats::-webkit-scrollbar{display:none;}
  /* 一级分类 = 标签语义：无边框浅底胶囊，选中为主色渐变；与操作按钮（有边框小圆角方块）明确分层 */
  .ph-cat{flex:none;height:30px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:var(--bg-card-2);color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
  .ph-cat.active{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);border-color:transparent;}
  .ph-cat-add{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px dashed var(--accent-line);background:var(--bg-card-2);color:var(--primary-dim);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1;}
  .ph-cat-add .ic{width:13px;height:13px;}
  .ph-empty{text-align:center;color:var(--text-3);font-size:12px;padding:52px 20px;line-height:1.7;}
  .ph-group{margin-bottom:16px;}
  .ph-group-head{display:flex;align-items:center;gap:8px;padding:12px 4px 8px;}
  .ph-group-head .pg-name{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:8px;}
  .pg-count{font-size:10px;font-weight:600;color:var(--text-3);background:var(--bg-card-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-family:var(--font-num);display:inline-flex;align-items:center;justify-content:center;line-height:1;height:18px;}
  /* 操作按钮 = 按钮语义：小圆角方块 + 实线边框 + 图标，与标签（无边框胶囊）形态区分 */
  .ph-op{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg-card);color:var(--text-2);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s ease;line-height:1;}
  .ph-op .ic{width:13px;height:13px;flex:none;}
  .ph-op:hover{border-color:var(--accent-line);color:var(--primary-dim);}
  .ph-op:active{transform:scale(.95);}
  .ph-op.danger{color:var(--error);border-color:rgba(179,38,30,.30);background:rgba(179,38,30,.06);}
  .ph-op.danger:hover{border-color:var(--error);background:rgba(179,38,30,.10);}
  .ph-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:4px 12px 8px;margin-bottom:12px;}
  .ph-sub-head{display:flex;align-items:center;gap:8px;padding:12px 0 4px;}
  .ph-sub-head .ps-name{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--primary-dim);display:flex;align-items:center;gap:6px;line-height:1;}
  .ph-sub-head .ps-name::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary-dim));}
  .ph-sub-empty{font-size:11px;color:var(--text-3);padding:8px 2px;}
  .ph-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .ph-item:last-child{border-bottom:none;}
  .ph-item .pi-text{flex:1;min-width:0;font-size:13px;line-height:1.6;color:var(--text-1);cursor:pointer;}
  .ph-item .pi-acts{flex:none;display:flex;gap:6px;}
  .ph-item .pi-act{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg-card);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s ease;}
  .ph-item .pi-act .ic{width:14px;height:14px;}
  .ph-item .pi-act:hover{border-color:var(--accent-line);color:var(--primary-dim);}
  .ph-item .pi-act:active{transform:scale(.92);}
  .ph-item .pi-act.del{color:var(--error);border-color:rgba(179,38,30,.26);background:rgba(179,38,30,.06);}
  .ph-item .pi-act.del:hover{background:rgba(179,38,30,.10);border-color:var(--error);}
  /* 常用语表单（sheet 内） */
  .pf-label{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin:16px 0 8px;}
  .pf-label:first-child{margin-top:2px;}
  .pf-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .pf-chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-card-2);color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
  .pf-chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);border-color:transparent;}
  .pf-chip.add{border-style:dashed;color:var(--primary-dim);display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1;}
  .pf-chip.add .ic{width:13px;height:13px;}
  .pf-field{margin-top:14px;}
  .pf-field input,.pf-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg-card);color:var(--text-1);font-size:13.5px;font-family:inherit;padding:11px 12px;outline:none;transition:border-color .15s ease;}
  .pf-field input:focus,.pf-field textarea:focus{border-color:rgba(184,153,104,.55);}
  .pf-field textarea{height:96px;resize:none;line-height:1.6;}
  .pf-count{text-align:right;font-size:10px;color:var(--text-3);margin-top:5px;font-family:var(--font-num);}
  .pf-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
  .pf-actions .btn{height:44px;border-radius:12px;font-size:14px;font-weight:600;}
  /* 置底提升后：按钮组占满整行并右对齐（取消居左、主操作最右），不受 sheet 均分规则影响 */
  .sheet .sheet-foot-inner .pf-actions{width:100%;margin-top:0;justify-content:flex-end;}
  .sheet .sheet-foot-inner .pf-actions .btn{flex:none !important;min-width:104px;}
</style></head>

<script>
(function () {
  window.__ROOT__ = '../../';
  var KEY = 'engchain-phrases';
  var curCat1 = '全部';

  /* 种子数据：一级分类 - 二级分类 - 内容 */
  var SEED = {
    cats: [
      { c1: '商务沟通', c2: ['开场白', '跟进'] },
      { c1: '报价谈判', c2: ['报价', '议价'] },
      { c1: '售后跟进', c2: ['回访', '投诉处理'] }
    ],
    items: [
      { id: 'sp1', cat1: '商务沟通', cat2: '开场白', content: '您好，我是××公司的××，看到您发布的××需求，想和您详细沟通一下。', ts: 0 },
      { id: 'sp2', cat1: '商务沟通', cat2: '跟进', content: '您好，上次沟通的××方案，请问您考虑得怎么样了？', ts: 0 },
      { id: 'sp3', cat1: '报价谈判', cat2: '报价', content: '这是我司针对该项目的报价单，请查收，价格可再谈。', ts: 0 },
      { id: 'sp4', cat1: '报价谈判', cat2: '议价', content: '目前该价格已是市场优惠价，若批量采购还有进一步空间。', ts: 0 },
      { id: 'sp5', cat1: '售后跟进', cat2: '回访', content: '您好，请问这批××使用情况如何？有任何问题随时联系我。', ts: 0 },
      { id: 'sp6', cat1: '售后跟进', cat2: '投诉处理', content: '非常抱歉给您带来不便，我们正在加急处理，稍后给您答复。', ts: 0 }
    ]
  };

  function readAll() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.cats) && Array.isArray(d.items)) return d;
      }
    } catch (e) {}
    try { localStorage.setItem(KEY, JSON.stringify(SEED)); } catch (e) {}
    return SEED;
  }
  function saveAll(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  function uid() { return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
  function cat1List(d) { return d.cats.map(function (c) { return c.c1; }); }
  function cat2List(d, c1) { for (var i = 0; i < d.cats.length; i++) if (d.cats[i].c1 === c1) return d.cats[i].c2; return []; }

  function renderCats(d) {
    var box = document.getElementById('ph-cats');
    var html = '<button type="button" class="ph-cat' + (curCat1 === '全部' ? ' active' : '') + '" data-c1="全部">全部</button>';
    d.cats.forEach(function (c) {
      html += '<button type="button" class="ph-cat' + (curCat1 === c.c1 ? ' active' : '') + '" data-c1="' + UI.esc(c.c1) + '">' + UI.esc(c.c1) + '</button>';
    });
    html += '<button type="button" class="ph-cat-add" id="ph-add-c1"><svg class="ic"><use href="#i-plus"/></svg>新增一级分类</button>';
    box.innerHTML = html;
    box.onclick = function (e) {
      var c = e.target.closest('.ph-cat'); if (c) { curCat1 = c.getAttribute('data-c1'); renderCats(d); renderList(d); return; }
      if (e.target.closest('#ph-add-c1')) { addCat1(d); return; }
    };
  }

  function renderList(d) {
    var box = document.getElementById('ph-list');
    var cats = d.cats.filter(function (c) { return curCat1 === '全部' || c.c1 === curCat1; });
    if (!cats.length) {
      box.innerHTML = '<div class="ph-empty">暂无常用语分类<br>点击「新增一级分类」开始创建</div>';
      return;
    }
    var total = d.items.length;
    box.innerHTML = cats.map(function (g) {
      var subHtml = g.c2.map(function (s) {
        var ps = d.items.filter(function (x) { return x.cat1 === g.c1 && x.cat2 === s; });
        var itemsHtml = ps.length ? ps.map(function (p) {
          return '<div class="ph-item" data-id="' + p.id + '">' +
            '<div class="pi-text" data-act="copy">' + UI.esc(p.content) + '</div>' +
            '<div class="pi-acts">' +
              '<button type="button" class="pi-act" data-act="edit" title="编辑"><svg class="ic"><use href="#i-edit"/></svg></button>' +
              '<button type="button" class="pi-act del" data-act="del-p" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>' +
            '</div></div>';
        }).join('') : '<div class="ph-sub-empty">该分类下暂无常用语</div>';
        return '<div class="ph-sub-head"><span class="ps-name">' + UI.esc(s) + '</span>' +
          '<button type="button" class="ph-op" data-act="add-p" data-c1="' + UI.esc(g.c1) + '" data-c2="' + UI.esc(s) + '"><svg class="ic"><use href="#i-plus"/></svg>添加常用语</button>' +
          '<button type="button" class="ph-op danger" data-act="del-c2" data-c1="' + UI.esc(g.c1) + '" data-c2="' + UI.esc(s) + '"><svg class="ic"><use href="#i-trash"/></svg>删除</button></div>' +
          itemsHtml;
      }).join('');
      var cnt = d.items.filter(function (x) { return x.cat1 === g.c1; }).length;
      return '<div class="ph-group">' +
        '<div class="ph-group-head"><span class="pg-name">' + UI.esc(g.c1) + '<span class="pg-count">' + cnt + '</span></span>' +
        '<button type="button" class="ph-op" data-act="add-c2" data-c1="' + UI.esc(g.c1) + '"><svg class="ic"><use href="#i-plus"/></svg>新增二级分类</button>' +
        '<button type="button" class="ph-op danger" data-act="del-c1" data-c1="' + UI.esc(g.c1) + '"><svg class="ic"><use href="#i-trash"/></svg>删除</button></div>' +
        '<div class="ph-card">' + subHtml + '</div></div>';
    }).join('') +
    (curCat1 !== '全部'
      ? '<div style="padding:4px 4px 24px;"><button type="button" class="btn btn-primary btn-block" id="ph-add-p-any"><svg class="ic" style="width:15px;height:15px;vertical-align:-2px;"><use href="#i-plus"/></svg>新增常用语</button></div>'
      : '<div style="padding:2px 4px 24px;font-size:10.5px;color:var(--text-3);">共 ' + total + ' 条常用语 · 点击内容可复制</div>');
    box.onclick = function (e) {
      var op = e.target.closest('[data-act]');
      if (!op) return;
      var act = op.getAttribute('data-act');
      var c1 = op.getAttribute('data-c1'), c2 = op.getAttribute('data-c2');
      var it = op.closest('.ph-item');
      var id = op.getAttribute('data-id') || (it ? it.getAttribute('data-id') : null);
      if (act === 'copy') { var txt = it ? it.querySelector('.pi-text').textContent.trim() : ''; if (txt) copyPhrase(txt); return; }
      if (act === 'add-c2') { addCat2(d, c1); return; }
      if (act === 'del-c1') { delCat1(d, c1); return; }
      if (act === 'del-c2') { delCat2(d, c1, c2); return; }
      if (act === 'add-p') { editPhrase(d, null, c1, c2); return; }
      if (act === 'edit') { editPhrase(d, id); return; }
      if (act === 'del-p') { delPhrase(d, id); return; }
      if (act === 'add-p-any') { editPhrase(d, null, curCat1 === '全部' ? null : curCat1); return; }
    };
  }

  function copyPhrase(text) {
    if (!text) return;
    var done = function () { UI.toast('已复制到剪贴板', 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    } catch (e) {}
  }

  /* 通用单输入 sheet：用于新增一级/二级分类 */
  function nameSheet(title, placeholder, onCommit) {
    var sh = UI.sheet();
    sh.setText(title);
    sh.html('<div class="pf-field"><input id="pf-name" maxlength="12" placeholder="' + placeholder + '"></div>' +
      '<div class="pf-actions"><button type="button" class="btn btn-ghost" id="pf-cancel">取消</button><button type="button" class="btn btn-primary" id="pf-ok">添加</button></div>');
    sh.show();
    var inp = sh.body().querySelector('#pf-name');
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 80);
    function commit() {
      var name = inp.value.trim();
      if (!name) { UI.toast('请输入分类名称', 'err'); return; }
      onCommit(name);
    }
    sh.body().querySelector('#pf-ok').addEventListener('click', commit);
    sh.body().querySelector('#pf-cancel').addEventListener('click', function () { UI.closeSheet(); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') commit(); });
  }
  function addCat1(d) {
    nameSheet('新增一级分类', '如：商务沟通', function (name) {
      if (cat1List(d).indexOf(name) >= 0) { UI.toast('该一级分类已存在', 'err'); return; }
      d.cats.push({ c1: name, c2: [] });
      saveAll(d); UI.closeSheet();
      curCat1 = name; renderCats(d); renderList(d);
      UI.toast('一级分类已添加', 'ok');
    });
  }
  function addCat2(d, c1) {
    nameSheet('新增二级分类 · ' + c1, '如：开场白', function (name) {
      if (cat2List(d, c1).indexOf(name) >= 0) { UI.toast('该二级分类已存在', 'err'); return; }
      for (var i = 0; i < d.cats.length; i++) if (d.cats[i].c1 === c1) { d.cats[i].c2.push(name); break; }
      saveAll(d); UI.closeSheet();
      renderCats(d); renderList(d);
      UI.toast('二级分类已添加', 'ok');
    });
  }

  function editPhrase(d, id, c1, c2) {
    var p = null;
    if (id) { for (var i = 0; i < d.items.length; i++) if (d.items[i].id === id) { p = d.items[i]; break; } }
    var editing = !!p;
    var selC1 = p ? p.cat1 : (c1 || (cat1List(d)[0] || ''));
    var selC2 = p ? p.cat2 : (c2 || '');
    var sh = UI.sheet();
    sh.setText(editing ? '编辑常用语' : '新增常用语');
    function renderForm() {
      var cats = cat1List(d); /* 实时计算，支持表单内新增分类后刷新 */
      var c2s = cat2List(d, selC1);
      var c2Html = c2s.length
        ? c2s.map(function (c) { return '<button type="button" class="pf-chip' + (c === selC2 ? ' active' : '') + '" data-v="' + UI.esc(c) + '">' + UI.esc(c) + '</button>'; }).join('')
        : '<span style="font-size:11px;color:var(--text-3);padding:6px 0;width:100%;">该分类下暂无二级分类，请先新增</span>';
      sh.body().innerHTML =
        '<div class="pf-label">一级分类</div><div class="pf-chips" id="pf-c1-chips">' +
        (cats.length ? cats.map(function (c) { return '<button type="button" class="pf-chip' + (c === selC1 ? ' active' : '') + '" data-v="' + UI.esc(c) + '">' + UI.esc(c) + '</button>'; }).join('') : '<span style="font-size:11px;color:var(--text-3);">暂无一级分类</span>') +
        '<button type="button" class="pf-chip add" id="pf-add-c1"><svg class="ic"><use href="#i-plus"/></svg>新增</button></div>' +
        '<div class="pf-label">二级分类</div><div class="pf-chips" id="pf-c2-chips">' + c2Html +
        '<button type="button" class="pf-chip add" id="pf-add-c2"><svg class="ic"><use href="#i-plus"/></svg>新增</button></div>' +
        '<div class="pf-field"><textarea id="pf-content" maxlength="120" placeholder="请输入常用语内容">' + UI.esc(p ? p.content : '') + '</textarea><div class="pf-count"><span id="pf-len">' + (p ? p.content.length : 0) + '</span>/120</div></div>' +
        '<div class="pf-actions"><button type="button" class="btn btn-ghost" id="pf-cancel">取消</button><button type="button" class="btn btn-primary" id="pf-ok">保存</button></div>';
      var ta = sh.body().querySelector('#pf-content');
      ta.addEventListener('input', function () { var n = sh.body().querySelector('#pf-len'); if (n) n.textContent = ta.value.length; });
      sh.body().querySelector('#pf-cancel').addEventListener('click', function () { UI.closeSheet(); });
      sh.body().querySelector('#pf-ok').addEventListener('click', commit);
      /* 一级分类切换（仅限一级 chips 容器内） */
      sh.body().querySelector('#pf-c1-chips').querySelectorAll('.pf-chip[data-v]').forEach(function (ch) {
        ch.addEventListener('click', function () {
          selC1 = ch.getAttribute('data-v');
          selC2 = cat2List(d, selC1)[0] || '';
          renderForm();
        });
      });
      /* 二级分类切换（只切选中态） */
      var c2box = sh.body().querySelector('#pf-c2-chips');
      c2box.querySelectorAll('.pf-chip[data-v]').forEach(function (ch) {
        ch.addEventListener('click', function () {
          selC2 = ch.getAttribute('data-v');
          c2box.querySelectorAll('.pf-chip[data-v]').forEach(function (x) { x.classList.remove('active'); });
          ch.classList.add('active');
        });
      });
      /* 表单内新增一级/二级分类：就地内联输入，避免弹窗叠加 */
      sh.body().querySelector('#pf-add-c1').addEventListener('click', function () {
        inlineAddCat('c1');
      });
      sh.body().querySelector('#pf-add-c2').addEventListener('click', function () {
        inlineAddCat('c2');
      });
    }
    function inlineAddCat(which) {
      var box = which === 'c1' ? sh.body().querySelector('#pf-c1-chips') : sh.body().querySelector('#pf-c2-chips');
      if (!box) return;
      if (box.querySelector('.pf-inline-add')) { var ex = box.querySelector('.pf-inline-add input'); if (ex) ex.focus(); return; }
      var row = document.createElement('div');
      row.className = 'pf-inline-add';
      row.style.cssText = 'display:flex;gap:8px;width:100%;margin-top:9px;';
      row.innerHTML = '<input maxlength="12" placeholder="请输入分类名称" style="flex:1;min-width:0;box-sizing:border-box;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg-card-2);color:var(--text-1);font-size:13px;padding:0 10px;outline:none;">' +
        '<button type="button" style="flex:none;height:34px;padding:0 14px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:12px;font-weight:700;cursor:pointer;">添加</button>';
      box.appendChild(row);
      var inp = row.querySelector('input');
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
      var btn = row.querySelector('button');
      function commit() {
        var name = inp.value.trim();
        if (!name) { UI.toast('请输入分类名称', 'err'); return; }
        if (which === 'c1') {
          if (cat1List(d).indexOf(name) >= 0) { UI.toast('该一级分类已存在', 'err'); return; }
          d.cats.push({ c1: name, c2: [] });
          saveAll(d);
          selC1 = name; selC2 = '';
        } else {
          if (cat2List(d, selC1).indexOf(name) >= 0) { UI.toast('该二级分类已存在', 'err'); return; }
          for (var i = 0; i < d.cats.length; i++) if (d.cats[i].c1 === selC1) { d.cats[i].c2.push(name); break; }
          saveAll(d);
          selC2 = name;
        }
        renderCats(d); renderList(d);
        renderForm();
      }
      btn.addEventListener('click', commit);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') commit(); });
    }
    function commit() {
      var content = sh.body().querySelector('#pf-content').value.trim();
      if (!content) { UI.toast('请输入常用语内容', 'err'); return; }
      if (!selC1) { UI.toast('请选择一级分类', 'err'); return; }
      if (!selC2) { UI.toast('请选择二级分类', 'err'); return; }
      if (editing) { p.cat1 = selC1; p.cat2 = selC2; p.content = content; }
      else { d.items.push({ id: uid(), cat1: selC1, cat2: selC2, content: content, ts: Date.now() }); }
      saveAll(d); UI.closeSheet();
      renderCats(d); renderList(d);
      UI.toast(editing ? '常用语已更新' : '常用语已添加', 'ok');
    }
    renderForm();
    sh.show();
    return sh;
  }

  function delCat1(d, c1) {
    UI.dialog({
      title: '删除一级分类',
      text: '确定删除「' + c1 + '」及其下全部二级分类与常用语吗？删除后不可恢复。',
      ok: '删除', cancel: '取消', danger: true,
      onOk: function () {
        for (var i = d.cats.length - 1; i >= 0; i--) if (d.cats[i].c1 === c1) d.cats.splice(i, 1);
        for (var j = d.items.length - 1; j >= 0; j--) if (d.items[j].cat1 === c1) d.items.splice(j, 1);
        saveAll(d);
        if (curCat1 === c1) curCat1 = '全部';
        renderCats(d); renderList(d);
        UI.toast('已删除', 'ok');
      }
    });
  }
  function delCat2(d, c1, c2) {
    UI.dialog({
      title: '删除二级分类',
      text: '确定删除「' + c1 + ' · ' + c2 + '」及其下全部常用语吗？删除后不可恢复。',
      ok: '删除', cancel: '取消', danger: true,
      onOk: function () {
        for (var i = d.cats.length - 1; i >= 0; i--) if (d.cats[i].c1 === c1) {
          var idx = d.cats[i].c2.indexOf(c2);
          if (idx >= 0) d.cats[i].c2.splice(idx, 1);
        }
        for (var j = d.items.length - 1; j >= 0; j--) if (d.items[j].cat1 === c1 && d.items[j].cat2 === c2) d.items.splice(j, 1);
        saveAll(d);
        renderCats(d); renderList(d);
        UI.toast('已删除', 'ok');
      }
    });
  }
  function delPhrase(d, id) {
    UI.dialog({
      title: '删除常用语',
      text: '确定删除这条常用语吗？',
      ok: '删除', cancel: '取消', danger: true,
      onOk: function () {
        for (var i = d.items.length - 1; i >= 0; i--) if (d.items[i].id === id) d.items.splice(i, 1);
        saveAll(d);
        renderCats(d); renderList(d);
        UI.toast('已删除', 'ok');
      }
    });
  }

  var d = readAll();
  renderCats(d);
  renderList(d);
  /* 跨页同步：常用语在其他页面修改后自动刷新 */
  window.addEventListener('storage', function (e) { if (e.key === KEY) { d = readAll(); renderCats(d); renderList(d); } });
})();
</script>
</body>
</html>
