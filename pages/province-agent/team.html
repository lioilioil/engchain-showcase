<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>公司团队管理 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/agent.css">
</head>
<body class="pa-page">
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">公司团队</div>
    <div class="nav-right"></div>
  </div>
  <div class="ag-wrap" id="ag-root"></div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script src="../../js/orgs.js"></script>
<script src="../../js/agent-store.js"></script>
<script src="../../js/agent-ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var q=new URLSearchParams(location.search);
  var orgId=q.get('org')||'';
  /* 未带 org 参数时，按当前账号归属记录解析，不硬编码示例组织 */
  if(!orgId && window.AgentStore && window.DataBus && DataBus.current){
    var me=DataBus.current().id;
    var pa=(AgentStore.listProvinces()||[]).filter(function(p){return p.uid===me;})[0];
    var sb=(AgentStore.listSubs()||[]).filter(function(s){return s.uid===me;})[0];
    orgId=(pa&&pa.orgId)||(sb&&sb.orgId)||'';
  }
  AgentUI.mountTeam('#ag-root', orgId);
});
</script>
</body>
</html>
