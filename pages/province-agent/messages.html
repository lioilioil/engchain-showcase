<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%231F2A44"/><path d="M12 12l8 8" stroke="%23B08A3C" stroke-width="2.4" stroke-linecap="round"/><circle cx="11.5" cy="11.5" r="4" fill="%23B08A3C"/><circle cx="20.5" cy="20.5" r="4" fill="%23B08A3C"/></svg>'>
<title>消息中心 · 工程链</title>
<!-- App demo 权威设计系统（令牌/外壳/navbar/seg）——壳层骨架，不含业务数据逻辑；会话/通知分页内容由消息线后续填充 -->
<link rel="stylesheet" href="../../css/app.css">
<style>/* S4-S2：消息中心壳层骨架（占位）。仅结构与 App 外壳语系，不接入任何数据。 */
.msg-shell{padding:0 0 40px}
.msg-tabs{display:flex;gap:8px;padding:10px 14px 0}
.msg-tab{flex:1;text-align:center;padding:9px 0;border-radius:13px;font-size:13px;font-weight:600;
  color:var(--text-2,#5a6472);background:var(--bg-2,#f2f0ea)}
.msg-tab.active{color:#fff;background:var(--primary,#1F2A44)}
.msg-pane{padding:16px 14px}
.msg-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 0;color:var(--text-3,#9aa2ad)}
.msg-empty svg{opacity:.6}
.msg-empty .t{font-size:13px;font-weight:600;color:var(--text-2,#5a6472)}
.msg-empty .s{font-size:12px}</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="agBack()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">消息中心</div>
    <div class="nav-right"></div>
  </div>
  <div class="msg-shell">
    <div class="msg-tabs" role="tablist">
      <button type="button" class="msg-tab active" data-tab="conv">会话</button>
      <button type="button" class="msg-tab" data-tab="notice">通知</button>
    </div>
    <div class="msg-pane" id="pane-conv">
      <div class="msg-empty">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
        <div class="t">暂无会话</div>
        <div class="s">会话列表将由消息线接入</div>
      </div>
    </div>
    <div class="msg-pane" id="pane-notice" hidden>
      <div class="msg-empty">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
        <div class="t">暂无通知</div>
        <div class="s">通知 / 待办条目将由消息线接入</div>
      </div>
    </div>
  </div>
</div>
<script>/* 深链返回兜底：无历史时回省代工作台（对齐 agBack 口径） */
function agBack(){ if (history.length>1){ history.back(); } else { location.href='index.html'; } }
/* 壳层 tab 占位切换（仅视觉，不接数据） */
document.querySelectorAll('.msg-tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.msg-tab').forEach(function(x){ x.classList.toggle('active', x===t); });
    document.getElementById('pane-conv').hidden = t.getAttribute('data-tab')!=='conv';
    document.getElementById('pane-notice').hidden = t.getAttribute('data-tab')!=='notice';
  });
});
</script>
</body>
</html>
