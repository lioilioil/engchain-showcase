      out.push({ kind: 'pa', cat: cat, catCls: catCls, id: id, title: title, body: body,
        time: fmtTs(ts), ts: tsNum(ts), unread: unreadOf(id),
        actions: [{ label: label, href: base + (hash || '#/home') }] });
    }
    if (!isSub) {
      (d.subApps || []).forEach(function (a) {
        if (a.status !== 'pending') return;
        push('pa-app-' + a.id, '代理', 'agent', '二级申请待初审：' + (a.entName || ''),
          '联系人 ' + (a.contact || '') + '（' + (a.phone || '') + '）· 约定比例 ' +
          (a.ratioToSub != null ? Math.round(a.ratioToSub * 100) + '%' : '') + ' · 申请于 ' + (a.createdAt || ''),
          a.createdAt, '#/invite', '去初审');
      });
      function regLayer(regs, layer) {
        (regs || []).forEach(function (r) {
          var amt = '¥' + (Number(r.amount) || 0).toLocaleString();
          if (r.status === 'pending_confirm') {
            push('pa-reg-' + r.id, '资金', 'fund', '收款待确认：' + amt,
              (layer === 1 ? '与平台' : '与二级企业') + '对账 · ' + (r.date || '') + ' 登记的付款待你确认',
              r.createdAt || r.date, '#/reconcile', '去确认');
          } else if (r.status === 'disputed') {
            push('pa-reg-' + r.id, '资金', 'fund', '对账异议待处理：' + amt,
              (layer === 1 ? '与平台' : '与二级企业') + '对账 · ' + (r.reason || '登记存在差异，待线下核实'),
              r.createdAt || r.date, '#/reconcile', '处理异议');
          }
        });
      }
      regLayer(d.payRegs1, 1);
      regLayer(d.payRegs2, 2);
    } else {
      (d.payRegs || []).forEach(function (r) {
        var amt = '¥' + (Number(r.amount) || 0).toLocaleString();
        if (r.status === 'pending_confirm') {
          push('pa-reg-' + r.id, '资金', 'fund', '收款待确认：' + amt,
            '省代转款 · ' + (r.date || '') + ' 登记，仅提醒，逾期不会自动确认到账',
            r.createdAt || r.date, '#/payments', '去确认');
        } else if (r.status === 'disputed') {
          push('pa-reg-' + r.id, '资金', 'fund', '对账异议待处理：' + amt,
            r.reason || '对账登记存在差异，待处理',
            r.createdAt || r.date, '#/payments', '处理异议');
        }
      });
      (d.alerts || []).forEach(function (a, i) {
        push('pa-subalert-' + i, '资金', 'fund', '待办提醒：' + (a.title || ''),
          a.desc || '', Date.now() - (i + 1) * 3600e3,
          (a.to && a.to.indexOf('#/') === 0) ? a.to : '#/home', '去处理');
      });
      if (d.agreement && d.agreement.state === 'pending_mine') {
        push('pa-agreement-pending', '代理', 'agent', 'O4 二级合作协议待签署',
          (d.agreement.code || '') + ' ' + (d.agreement.version || '') + ' · 待你签署后合作生效',
          Date.now(), '#/home', '去签署');
      }
    }
    return out.sort(function (a, b) { return b.ts - a.ts; });
  }

  /* ---------- 会话（与全局消息页同键 engchain-conversations；无则播种内建 demo 会话） ---------- */
  function loadConvs() {
    try {
      var raw = localStorage.getItem(CONV_KEY);
      if (raw) { var arr = JSON.parse(raw); if (arr && arr.length) return arr; }
    } catch (e) {}
    try { localStorage.setItem(CONV_KEY, JSON.stringify(DEMO_CONVS)); } catch (e) {}
    return DEMO_CONVS;
  }
  function persistConvs(convs) { try { localStorage.setItem(CONV_KEY, JSON.stringify(convs)); } catch (e) {} }

  /* ---------- 渲染 ---------- */
  var curTab = 'notice';
  function renderNotice() {
    var box = document.getElementById('pane-notice');
    var items = buildNoticeItems();
    var unreadN = items.filter(function (x) { return x.unread; }).length;
    var mn = document.getElementById('mt-notice');
    mn.textContent = unreadN; mn.hidden = !(unreadN > 0);
    var ra = document.getElementById('btn-readall');
    ra.hidden = !(unreadN > 0);
    if (!items.length) {
      box.innerHTML =
        '<div class="msg-empty">' +
          '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>' +
          '<div class="t">暂无通知</div>' +
          '<div class="s">待办 / 对账差异 / 协议等通知将自动汇总在这里</div>' +
        '</div>';
      return;
    }
    box.innerHTML = items.map(function (x) {
      return '<div class="d-item' + (x.unread ? '' : ' read') + '" data-id="' + esc(x.id) + '" data-kind="pa">' +
        (x.unread ? '<span class="d-dot"></span>' : '') +
        '<div class="d-head"><span class="d-cat ' + x.catCls + '">' + esc(x.cat) + '</span>' +
        '<span class="d-title">' + esc(x.title) + '</span>' +
        (x.time ? '<span class="d-time">' + esc(x.time) + '</span>' : '') + '</div>' +
        '<div class="d-body">' + esc(x.body) + '</div>' +
        '<div class="d-acts"><span class="d-btn">' + esc(x.actions[0].label || '查看') + ' ›</span></div>' +
      '</div>';
    }).join('');
    box.querySelectorAll('.d-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var it = buildNoticeItems().filter(function (y) { return y.id === id; })[0];
        if (!it) return;
        markRead(id);
        renderNotice(); renderConvBadgeOnly();
        /* 玻璃 bottom-sheet 预览（iframe 预览落点，§二）：先起预览，不整页跳转 */
        if (it.actions && it.actions.length && it.actions[0].href) {
          try { window.openPagePreview(it.actions[0].href, it.actions[0].label || '页面预览'); } catch (e) { location.href = it.actions[0].href; }
        }
      });
    });
  }
  function renderConvBadgeOnly() {
    var convs = loadConvs();
    var n = convs.reduce(function (a, c) { return a + (c.unread || 0); }, 0);
    var mn = document.getElementById('mt-conv');
    mn.textContent = n; mn.hidden = !(n > 0);
    return n;
  }
  function renderConv() {
    var convs = loadConvs();
    var n = renderConvBadgeOnly();
    var box = document.getElementById('pane-conv');
    if (!convs.length) {
      box.innerHTML =
        '<div class="msg-empty">' +
          '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>' +
          '<div class="t">暂无会话</div>' +
          '<div class="s">供需对接与客服会话将显示在这里</div>' +
        '</div>';
      return;
    }
    box.innerHTML = convs.map(function (c) {
      return '<a class="d-conv" data-id="' + esc(c.id) + '" href="../message/chat.html?id=' + esc(c.id) + '">' +
        '<div class="d-avatar">' + esc(c.avatar || (c.name || '?').slice(0, 1)) + '</div>' +
        '<div class="d-conv-b"><div class="d-conv-top"><span class="d-conv-name">' + esc(c.name) + '</span><span class="d-conv-time">' + esc(c.time || '') + '</span></div>' +
        '<div class="d-conv-last">' + esc(c.last || '') + '</div></div>' +
        '<span class="d-unread"' + ((c.unread > 0) ? '' : ' hidden') + '>' + (c.unread || 0) + '</span>' +
      '</a>';
    }).join('');
    /* 点击会话行：先清该会话未读，再整页跳会话页（与全局消息页一致，会话不预览） */
    box.querySelectorAll('.d-conv').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var id = a.getAttribute('data-id');
        var list = loadConvs().map(function (c) { if (String(c.id) === String(id)) c.unread = 0; return c; });
        persistConvs(list);
      });
    });
  }
  function render() { renderConv(); renderNotice(); }

  /* ---------- tab 切换 ---------- */
  document.querySelectorAll('.msg-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.msg-tab').forEach(function (x) { x.classList.toggle('active', x === t); });
      curTab = t.getAttribute('data-tab');
      document.getElementById('pane-conv').hidden = curTab !== 'conv';
      document.getElementById('pane-notice').hidden = curTab !== 'notice';
    });
  });
  /* 全部已读（通知待办一键已读，与全局消息页已读键共享） */
  document.getElementById('btn-readall').addEventListener('click', function () {
    buildNoticeItems().forEach(function (x) { if (x.unread) markRead(x.id); });
    renderNotice();
    try { UI.toast.ok('已全部标为已读'); } catch (e) {}
  });
  /* 初始进入「未读更多」的分页（与全局消息页 pickInitialTab 同思路；warmup 之后判定，冷启动也准确） */
  /* 深链返回兜底：无历史时回省代工作台（对齐 agBack 口径） */
  function agBack() { if (history.length > 1) { history.back(); } else { location.href = 'index.html'; } }
  window.agBack = agBack;

  /* ---------- 启动：warmup 播种 → 初始分页判定 → 渲染 ---------- */
  warmupV3State();
  (function () {
    var convU = loadConvs().reduce(function (a, c) { return a + (c.unread || 0); }, 0);
    var noticeU = buildNoticeItems().filter(function (x) { return x.unread; }).length;
    curTab = noticeU >= convU ? 'notice' : 'conv';
    document.querySelectorAll('.msg-tab').forEach(function (x) {
      x.classList.toggle('active', x.getAttribute('data-tab') === curTab);
    });
    document.getElementById('pane-conv').hidden = curTab !== 'conv';
    document.getElementById('pane-notice').hidden = curTab !== 'notice';
  })();
  render();
  /* 同源其他页签写 state（初审/确认后）→ 本页实时刷新 */
  window.addEventListener('storage', function (e) {
    if (e.key === V3_KEY || e.key === PA_READ_KEY || e.key === CONV_KEY) render();
  });
})();
</script>
</body>
</html>
