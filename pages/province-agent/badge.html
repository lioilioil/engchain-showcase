<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>徽章静态方案（仅样例·不改既有五档）· 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/agent.css">
<style>
  /* S2-3：本页为一次性徽章静态样例（AGENT_BADGE_SCHEME 仅样例可调），.bd-* 属一次性实验样式，保留于页内；正式组件规格见 agent.css .ag-emblem / .ag-profile-badge */
  .bd-wrap{padding:10px var(--page-pad) 120px;}
  .bd-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .bd-card h3{font-size:14px;margin-bottom:12px;}
  .bd-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .bd-row:last-child{border-bottom:0;}
  .bd-swatch{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;}
  .bd-round{border-radius:50%;}
  .bd-shield{clip-path:polygon(50% 0,100% 18%,100% 72%,50% 100%,0 72%,0 18%);border-radius:8px;}
  .bd-hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);}
  .bd-meta{flex:1;}
  .bd-meta small{display:block;color:var(--text-3);margin-top:3px;}
  .bd-note{font-size:11px;color:var(--text-3);line-height:1.8;margin-top:10px;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">徽章静态方案</div>
    <div class="nav-right"></div>
  </div>
  <div class="bd-wrap">

    <!-- M3-11 色值配置块（仅本页样例，可调；不写入/不改既有徽章组件） -->
    <script>
    window.AGENT_BADGE_SCHEME = {
      /* 现有五档（盘点输入清单，只读登记，不改动） */
      existing: [
        { id: 'guest',      label: '游客',     color: '#8A919C', shape: 'none',  note: '无徽标/灰字标识，未登录浏览' },
        { id: 'base',       label: '建筑base', color: '#2F6DB5', shape: 'round', note: '蓝V，建筑入驻企业' },
        { id: 'limited',    label: '中介limited', color: '#B08A3C', shape: 'round', note: '金V，中介服务企业' },
        { id: 'individualPartner', label: '个人合伙人', color: '#7A5EA8', shape: 'round', note: '金V紫，个人合伙人（新方案禁用此紫色）' },
        { id: 'platformOps',label: '平台运营', color: '#3A4656', shape: 'shield', note: '深灰盾，u10 周平台运营' }
      ],
      /* 新增两套静态样例：藏青/金棕稳重深色；二级同色系浅一档；明度+形状双编码；灰度可辨；禁用个人合伙人紫色 */
      proposals: [
        { id: 'provinceAgent', label: '省级总代', color: '#1E3A5F', accent: '#B08A3C', shape: 'shield',
          note: '藏青底+金棕描边，盾形；明度深一档，与建筑蓝V/金V区分' },
        { id: 'subAgent', label: '二级合作', color: '#4A6B8A', accent: '#C9A86A', shape: 'hex',
          note: '同藏青色系浅一档，六边形；形状与总代盾形区分，灰度下仍可辨' }
      ],
      rules: ['明度双编码：总代深、二级浅一档', '形状双编码：总代盾形/二级六边形', '禁用个人合伙人紫色 #7A5EA8', '灰度模式下靠明度+形状区分，不单靠颜色']
    };
    </script>

    <section class="bd-card">
      <h3>现有五档（盘点清单 · 只读，不改既有组件）</h3>
      <div id="bd-existing"></div>
    </section>

    <section class="bd-card">
      <h3>新增静态样例（总代 / 二级）</h3>
      <div id="bd-proposals"></div>
      <div class="bd-note" id="bd-rules"></div>
    </section>

    <div class="bd-note">本页仅为静态方案样例，不替换、不修改既有五档徽章组件；最终视觉以设计稿为准。</div>
  </div>
</div>
<script>
(function(){
  var S = window.AGENT_BADGE_SCHEME;
  function render(list, mount, shapeKey){
    var box = document.getElementById(mount);
    box.innerHTML = list.map(function(b){
      var shape = b.shape === 'shield' ? 'bd-shield' : b.shape === 'hex' ? 'bd-hex' : b.shape === 'round' ? 'bd-round' : '';
      var noneCls = b.shape === 'none' ? ' bd-swatch--none' : '';
      var bg = b.shape === 'none' ? 'transparent' : (b.accent ? 'linear-gradient(135deg,'+b.color+' 62%,'+b.accent+')' : b.color);
      return '<div class="bd-row"><div class="bd-swatch '+shape+noneCls+'" style="background:'+bg+'">'+(b.shape==='none'?'—':b.label.slice(0,2))+'</div>'
        + '<div class="bd-meta">'+b.label+'<small>'+b.note+'</small><small>色值 '+b.color+(b.accent?' / 描边 '+b.accent:'')+'</small></div></div>';
    }).join('');
  }
  render(S.existing, 'bd-existing');
  render(S.proposals, 'bd-proposals');
  document.getElementById('bd-rules').innerHTML = '编码规则：<br>· ' + S.rules.join('<br>· ');
})();
</script>
</body>
</html>
