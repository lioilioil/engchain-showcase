<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<title>授权徽章 · 工程链</title>
<!-- 视觉统一：App 权威设计系统 + v3 令牌/组件库；色板/形状为方案数据本身，原样保留 -->
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="v3/css/v3-tokens.css">
<link rel="stylesheet" href="v3/css/v3-base.css">
<link rel="stylesheet" href="v3/css/v3-components.css">
<link rel="stylesheet" href="v3/css/pages/v3-pages.css">
<style>
/* 本页为一次性徽章静态样例：.bd-* 仅描述徽章形状/色板（方案数据），外壳已全部走 v3 令牌 */
.bd-swatch{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11px;box-shadow:0 1px 2px rgba(22,22,22,.08),0 2px 6px rgba(22,22,22,.06)}
.bd-round{border-radius:50%}
.bd-shield{clip-path:polygon(50% 0,100% 18%,100% 72%,50% 100%,0 72%,0 18%);border-radius:8px}
.bd-hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
/* T1a 视觉精修（内容零删除，仅排版/对齐/层次/间距）：
   三级层次 = 样例标题(14/600) → 描述(12/ink-3) → 色值元信息(11/mono)；
   色值/描边抽离为独立元信息行，纵向对齐同一基线，不再夹在描述句中换行错位 */
.bd-row{align-items:flex-start;padding-top:14px;padding-bottom:14px}
.bd-row .bd-swatch{margin-top:3px}
.bd-row .v3-row__s{margin-top:4px;line-height:1.55}
.bd-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--v3-line)}
.bd-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--v3-ink-3)}
.bd-chip .bd-dot{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(22,22,22,.12)}
.bd-chip .num{font-size:11px;font-weight:600;color:var(--v3-ink-2);letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* 编码规则面板：金色勾标记 + 规则行（文案不变） */
.bd-rules{padding:12px 14px}
.bd-rules__hd{font-size:12px;font-weight:700;color:var(--v3-ink-2);margin-bottom:6px}
.bd-rule{display:flex;gap:8px;font-size:12px;color:var(--v3-ink-3);line-height:1.5;margin-top:5px}
.bd-rule::before{content:"";flex:none;width:5px;height:5px;border-radius:1px;background:var(--v3-gold);margin-top:7px}
/* 可优化说明（页脚免责短注）收进折叠，默认收起 */
.bd-legal{font-size:11.5px;color:var(--v3-ink-4);line-height:1.6}
.bd-legal summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--v3-ink-3)}
.bd-legal summary::-webkit-details-marker{display:none}
.bd-legal summary::after{content:"▾";font-size:10px;transition:transform .15s var(--v3-ease, ease)}
.bd-legal[open] summary::after{transform:rotate(180deg)}
.bd-legal__body{margin-top:6px}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="agBack()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">授权徽章</div>
    <div class="nav-right"></div>
  </div>

  <div id="ag-root" aria-live="polite">
    <div class="v3-page">

      <!-- M3-11 色值配置块（仅本页样例，可调；不写入/不改既有徽章组件） -->
      <script>
      window.AGENT_BADGE_SCHEME = {
        /* 现有五档（盘点输入清单，只读登记，不改动） */
        existing: [
          { id: 'guest',      label: '游客',     color: '#8A919C', shape: 'none',  note: '无徽标/灰字标识，未登录浏览' },
          { id: 'base',       label: '建筑base', color: '#2F6DB5', shape: 'round', note: '蓝V，建筑入驻企业' },
          { id: 'limited',    label: '中介limited', color: '#B08A3C', shape: 'round', note: '金V，中介服务企业' },
          { id: 'individualPartner', label: '个人合伙人', color: '#7A5EA8', shape: 'round', note: '金V紫，个人合伙人（新方案禁用此紫色）' },
          { id: 'platformOps',label: '平台运营', color: '#3A4656', shape: 'shield', note: '深灰盾，u10 周平台运营' }
        ],
        /* 新增两套静态样例：藏青/金棕稳重深色；二级同色系浅一档；明度+形状双编码；灰度可辨；禁用个人合伙人紫色 */
        proposals: [
          { id: 'provinceAgent', label: '省级总代', color: '#1E3A5F', accent: '#B08A3C', shape: 'shield',
            note: '藏青底+金棕描边，盾形；明度深一档，与建筑蓝V/金V区分' },
          { id: 'subAgent', label: '二级合作', color: '#4A6B8A', accent: '#C9A86A', shape: 'hex',
            note: '同藏青色系浅一档，六边形；形状与总代盾形区分，灰度下仍可辨' }
        ],
        rules: ['明度双编码：总代深、二级浅一档', '形状双编码：总代盾形/二级六边形', '禁用个人合伙人紫色 #7A5EA8', '灰度模式下靠明度+形状区分，不单靠颜色']
      };
      </script>

      <div class="v3-sec-title">现有五档 <span class="v3-badge v3-badge--neutral">盘点清单 · 只读</span></div>
      <section class="v3-list v3-mb12" id="bd-existing"></section>

      <div class="v3-sec-title">新增静态样例 <span class="v3-badge v3-badge--gold">总代 / 二级</span></div>
      <section class="v3-list v3-mb12" id="bd-proposals"></section>

      <div class="v3-readnote v3-rules bd-rules v3-mb12" id="bd-rules"></div>
      <details class="bd-legal v3-mb12">
        <summary>评审说明</summary>
        <div class="bd-legal__body">本页仅为静态方案样例，不替换、不修改既有五档徽章组件；最终视觉以设计稿为准。</div>
      </details>

      <div class="trust">润锦工程链 Engchain 3.0 · 徽章方案评审样例</div>
    </div>
  </div>
</div>
<script>
(function(){
  var S = window.AGENT_BADGE_SCHEME;
  function render(list, mount){
    var box = document.getElementById(mount);
    box.innerHTML = list.map(function(b){
      var shape = b.shape === 'shield' ? 'bd-shield' : b.shape === 'hex' ? 'bd-hex' : b.shape === 'round' ? 'bd-round' : '';
      var noneCls = b.shape === 'none' ? ' style="background:transparent;color:var(--v3-ink-4);border:1px dashed var(--v3-line-2)"' : '';
      var bg = b.shape === 'none' ? '' : ' style="background:' + (b.accent ? 'linear-gradient(135deg,'+b.color+' 62%,'+b.accent+')' : b.color) + '"';
      return '<div class="v3-row bd-row"><span class="bd-swatch ' + shape + '"' + (noneCls || bg) + '>' + (b.shape==='none'?'—':b.label.slice(0,2)) + '</span>'
        + '<span class="v3-row__main"><span class="v3-row__t">' + b.label + '</span>'
        + '<span class="v3-row__s">' + b.note + '</span>'
        + '<span class="bd-meta"><span class="bd-chip"><i class="bd-dot" style="background:' + b.color + '"></i>色值 <b class="num">' + b.color + '</b></span>'
        + (b.accent ? '<span class="bd-chip"><i class="bd-dot" style="background:' + b.accent + '"></i>描边 <b class="num">' + b.accent + '</b></span>' : '')
        + '</span></span></div>';
    }).join('');
  }
  render(S.existing, 'bd-existing');
  render(S.proposals, 'bd-proposals');
  document.getElementById('bd-rules').innerHTML = '<div class="bd-rules__hd">编码规则：</div>'
    + S.rules.map(function(r){ return '<div class="bd-rule">' + r + '</div>'; }).join('');
})();
</script>
<script>/* 深链返回兜底：无历史时回工作台 */
function agBack(){ if (history.length>1){ history.back(); } else { location.href='index.html'; } }</script>
</body>
</html>
