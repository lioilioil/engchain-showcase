<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<title>二级授权网络 · 工程链</title>
<!-- 视觉统一：App 权威设计系统（app.css V3.4 墨金双轨）+ v3 令牌/组件库；名额口径/台账聚合逻辑保真 -->
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="v3/css/v3-tokens.css">
<link rel="stylesheet" href="v3/css/v3-base.css">
<link rel="stylesheet" href="v3/css/v3-components.css">
<link rel="stylesheet" href="v3/css/pages/v3-pages.css">
<style>
/* 文字密度专项：长说明折叠 + 间隔号链拆标签（引用 v3 令牌） */
.ag-disc{border:1px solid var(--v3-line-2,var(--v3-line));border-radius:var(--v3-r-md);background:var(--v3-surface-2,var(--v3-surface));overflow:hidden;margin:0 0 12px}
.ag-disc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--v3-ink-2);cursor:default;-webkit-tap-highlight-color:transparent}
.ag-disc>summary::-webkit-details-marker{display:none}
.ag-disc>summary::after{content:none}
.ag-disc__bd{padding:0 13px 10px;font-size:11.5px;color:var(--v3-ink-3);line-height:1.65;border-top:1px dashed var(--v3-line)}
.ag-disc__bd{display:block !important}
.ag-tags{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center;vertical-align:middle}
.sub-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.sub-tags .v3-badge{font-size:10.5px}
.ag-disc--mini{margin:2px 0 0;border:none;background:transparent;border-radius:0;overflow:visible}
.ag-disc--mini>summary{padding:1px 0 0;gap:5px;font-size:11.5px;font-weight:500;color:var(--v3-ink-3)}
.ag-disc--mini .ag-disc__bd{padding:6px 0 1px;border-top:1px dashed var(--v3-line);font-size:11.5px;color:var(--v3-ink-3)}
.net-node .v3-row__t{align-items:flex-start;gap:8px}
.net-node .net-name{flex:1;min-width:0;line-height:1.45}
.net-node .v3-row__t>.v3-badge{flex:none;margin-top:1px}
.net-node .sub-tags{gap:6px;margin-top:5px}
.net-node .sub-tags .v3-badge{font-size:11px;padding:2px 8px}
.net-node .v3-row__amt{font-variant-numeric:tabular-nums}
.net-tree--on{position:relative;margin-top:2px}
.net-tree--on::before{content:"";position:absolute;left:33px;top:-12px;bottom:0;width:2px;background:var(--v3-gold-line);opacity:.55}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="agBack()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

  </div>
  <div id="ag-root" aria-live="polite"></div>
</div>
<script src="../../js/data.js"></script>

<script src="../../js/domain.js"></script>

<script>/* B5 preview 演示上下文注入：仅 ?demo=province 时生效（复用 DataBus.applyDemoScenario 真实播种 u11 四川总代）；无参数时保持原业务空态 */
(function () {
'use strict';
if (new URLSearchParams(location.search||'').get('demo') !== 'province') return;
try { if (window.DataBus && DataBus.applyDemoScenario) DataBus.applyDemoScenario('province_agent_active'); } catch(e){}
})();</script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('ag-root');
  var U = (window.DataBus && DataBus.current) ? DataBus.current().id : '';
  var Store = window.AgentStore, Ledger = window.AgentLedger, Rules = window.AgentRules, E = window.AgentEsign;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(n) { n = Number(n) || 0; return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(ts) { if (!ts) return '—'; var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function emptyState(title, note) {
    return '<div class="v3-empty"><div class="ic">⌁</div><div class="t">' + esc(title) + '</div><div class="d">' + esc(note) + '</div><a class="v3-btn v3-btn--ghost" href="index.html" style="margin:0 auto">返回工作台</a></div>';
  }

  /* 状态徽章：pending/approved/suspended/terminated/removed/rejected → v3-badge 七态 */
  var ST = {
    pending:    ['待审核', 'v3-badge--pending'],
    approved:   ['已开通', 'v3-badge--active'],
    suspended:  ['已暂停', 'v3-badge--suspended'],
    terminated: ['已终止', 'v3-badge--terminated'],
    removed:    ['已解除', 'v3-badge--sealed'],
    rejected:   ['已驳回', 'v3-badge--void']
  };
  function badge(st) { var t = ST[st] || [st, 'v3-badge--neutral']; return '<span class="v3-badge ' + t[1] + '">' + esc(t[0]) + '</span>'; }
  /* 总代根节点状态 pill（hero 玻璃态） */
  function rootPill(st) {
    var map = { active: ['已开通', '#7FD6A6'], suspended: ['已暂停', '#E8C46A'] };
    var t = map[st] || ['在册', '#7FD6A6'];
    return '<span class="v3-status-pill"><span class="d" style="background:' + t[1] + '"></span>' + t[0] + '</span>';
  }

  /* 协议状态：签约完成 / 待签 / 已拒签 / 未签约 */
  function protoState(sub) {
    if (!E) return '协议待发起';
    var c = E.contractById ? E.contractById(sub.id) : null;
    if (sub.signature && sub.signature.status === 'completed') return '已签 ' + esc(sub.signature.code || '');
    if (c && c.status === 'pending_mine') return '待二级签署';
    if (c && c.status === 'rejected') return '已拒签';
    return '协议待发起';
  }

  /* 单二级聚合：累计约定所得 / 最近消费（复用 AgentLedger 纯函数口径：settled 合格笔 × 总盘 × 约定比例） */
  function subAgg(sub, entries, cfg) {
    var mine = (entries || []).filter(function (e) {
      return e.line === 'subLedger' && e.frozenStatus === 'settled' && !e.refunded && e.subject === sub.uid
        && Ledger.isEligibleConsumption(e.type, cfg);
    });
    var gross = mine.reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
    var pool = Math.round(gross * cfg.grossShare * 100) / 100;
    var agreed = Math.round(pool * (Number(sub.ratioToSub) || 0) * 100) / 100;
    var last = mine.reduce(function (mx, e) { return Math.max(mx, Number(e.at) || 0); }, 0);
    return { gross: gross, pool: pool, agreed: agreed, lastAt: last, count: mine.length };
  }

  function render() {
    if (!Store) { root.innerHTML = '<div class="v3-page">' + emptyState('数据层未就绪', 'AgentStore 未加载。') + '</div>'; return; }
    var me = null;
    (Store.listProvinces() || []).forEach(function (p) { if (p.uid === U) me = p; });
    if (!me || (me.status !== 'active' && me.status !== 'suspended')) {
      root.innerHTML = '<div class="v3-page">' + emptyState('当前账号未开通省级总代', '网络视图仅对在册省级总代开放。') + '</div>';
      return;
    }
    var locked = me.status === 'suspended';
    var subs = (Store.listSubs() || []).filter(function (s) { return s.parentUid === me.uid; });
    var entries = Store.listLedger() || [];
    var MOCK = window.MOCK || {};
    var quotaCfg = (MOCK.business && MOCK.business.provinceAgentQuota) || {};
    var cap = Rules && Rules.quotaCapOf ? Rules.quotaCapOf(me.province, quotaCfg) : { ok: false };
    /* 名额占用与规则层复算一致（D7）：approved/pending/suspended 均占名额，removed/terminated/rejected 释放 */
    var used = Rules && Rules.countActiveSubAgents ? Rules.countActiveSubAgents(me.uid, subs)
      : subs.filter(function (s) { return s.status === 'approved' || s.status === 'pending' || s.status === 'suspended'; }).length;
    var capN = cap.quotaCap || 0;
    var pct = capN ? Math.min(100, Math.round(used / capN * 100)) : 0;

    /* 名额进度（v3-progress 金色条，满额转警示色） */
    var quotaHtml = '<section class="v3-card v3-mb12">'
      + '<div class="v3-card__hd"><span class="t">授权名额使用率</span><span class="v3-badge v3-badge--gold num">' + used + ' / ' + capN + '</span></div>'
      + '<div class="v3-progress v3-mb8"><i class="' + (pct >= 100 ? 'danger' : '') + '" style="width:' + pct + '%"></i></div>'
      + (pct >= 100
        ? '<div class="v3-readnote">该省二级名额已满，新申请将触发 E_QUOTA_EXCEEDED 拦截。</div>'
        : '<details class="ag-disc ag-disc--mini"><summary>名额口径</summary><div class="ag-disc__bd">仅计签约二级公司，成员不计入名额（D7）。</div></details>')
      + '</section>';

    /* 总代根节点（v3-hero 藏青身份面） */
    var rootNode = '<div class="v3-hero v3-mb12">'
      + '<div class="eyebrow">授权根节点 · 省级总代</div>'
      + '<div class="prov"><div class="name">' + esc(me.branchCompany && me.branchCompany.name || me.province + '总代') + '</div>'
      + rootPill(me.status) + '</div>'
      + '<div class="meta"><span>授权省<b>' + esc(me.province) + '</b></span>'
      + (me.orgId ? '<span>组织<b>' + esc(me.orgId) + '</b></span>' : '')
      + (locked ? '<span>状态<b style="color:var(--v3-warn)">锁定只读</b></span>' : '')
      + '</div></div>';

    /* 二级子节点（v3-row 列表式：avatar + 名称/徽章/协议 + 右侧累计金额） */
    var subNodes = subs.map(function (s) {
      var a = subAgg(s, entries, Ledger.DEFAULTS);
      var isSelf = s.appliedBy === 'self';
      var sline = '<span class="sub-tags"><span class="v3-badge v3-badge--neutral">比例 ' + Math.round((s.ratioToSub || 0) * 100) + '%</span><span class="v3-badge v3-badge--neutral">' + esc(protoState(s)) + '</span>'
        + (a.count ? '<span class="v3-badge v3-badge--neutral">近 ' + fmtDate(a.lastAt) + '</span>' : '<span class="v3-badge v3-badge--neutral">暂无合格消费</span>')
        + (isSelf ? '<span class="v3-badge v3-badge--neutral">招商码自助申请</span>' : '') + '</span>';
      return '<div class="v3-row net-node">'
        + '<span class="v3-avatar v3-avatar--sub">' + esc((s.company && s.company.shortName || s.company && s.company.name || '二').slice(0, 1)) + '</span>'
        + '<span class="v3-row__main">'
        + '<span class="v3-row__t"><span class="net-name">' + esc(s.company && s.company.name || s.id) + '</span>' + badge(s.status) + '</span>'
        + '<span class="v3-row__s">' + sline + '</span>'
        + '</span>'
        + '<span class="v3-row__right"><span class="v3-row__amt num">' + fmt(a.agreed) + '</span>'
        + '<span class="v3-xs v3-muted">累计约定所得</span></span>'
        + '</div>';
    }).join('');

    /* 状态流转时间线（合并全部二级最近事件，倒序取 8 条） */
    var tlEvents = [];
    subs.forEach(function (s) {
      (s.statusLog || []).forEach(function (l) {
        tlEvents.push({ at: l.at || 0, name: (s.company && s.company.name) || s.id, reason: l.reason || l.toStatus });
      });
    });
    tlEvents.sort(function (a, b) { return b.at - a.at; });
    var tlHtml = tlEvents.length
      ? '<div class="v3-timeline">' + tlEvents.slice(0, 8).map(function (e) {
          return '<div class="v3-tl"><div class="t">' + esc(e.name) + ' → ' + esc(e.reason) + '</div><div class="time">' + fmtDate(e.at) + '</div></div>';
        }).join('') + '</div>'
      : '<div class="v3-readnote">暂无状态流转记录。</div>';

    /* 分层声明（readnote 收敛为折叠披露） */
    var decl = '<details class="ag-disc" style="margin-bottom:12px"><summary>分层说明</summary><div class="ag-disc__bd">本页「二级授权网络」展示两层授权链（总代 → 二级公司）与分账数据；「公司团队」（<a href="team.html?org=' + esc(me.orgId || '') + '" style="text-decoration:underline">team.html</a>）展示公司内部三角色（负责人/管理员/成员），两视图入口并列、语义隔离，不混为一层。二级不可再发展下级（O4 第 2 条）。</div></details>';

    root.innerHTML = '<div class="v3-page">'
      + quotaHtml
      + rootNode
      + '<div class="net-tree' + (subs.length ? ' net-tree--on' : '') + '">'
      + '<div class="v3-sec-title">授权链 · 二级公司 <span class="v3-badge v3-badge--gold">' + subs.length + ' 家</span></div>'
      + (subs.length
        ? '<section class="v3-list v3-mb12">' + subNodes + '</section>'
        : '<div class="v3-empty" style="padding:34px 12px"><div class="ic">＋</div><div class="t">暂无二级公司</div><div class="d">通过「发起二级」或招商码企业自助申请接入。</div></div>')
      + '</div>'
      + '<div class="v3-sec-title">状态流转记录</div>'
      + '<section class="v3-card v3-mb12">' + tlHtml + '</section>'
      + decl
      + '<div class="v3-flex v3-gap2 v3-mb12">'
      + '<a class="v3-btn v3-btn--ghost v3-takeall" href="index.html">返回工作台</a>'
      + '<a class="v3-btn v3-btn--ghost v3-takeall" href="team.html?org=' + esc(me.orgId || '') + '">公司团队</a>'
      + '<a class="v3-btn v3-btn--ghost v3-takeall" href="tax-guide.html">规则与税务</a>'
      + '</div>'
      + '<div class="trust"><span class="ag-tags" style="justify-content:center;margin-bottom:6px"><span class="v3-badge">模拟测算</span><span class="v3-badge">非税务意见</span><span class="v3-badge">平台零支出、不付款、不开票</span><span class="v3-badge">二级不可再发展下级（O4 第 2 条）</span></span><br/>润锦工程链 Engchain 3.0</div>'
      + '</div>';
  }

  render();
})();
</script>
<script>/* 深链返回兜底：无历史时回工作台 */
function agBack(){ if (history.length>1){ history.back(); } else { location.href='index.html'; } }</script>
</body>
