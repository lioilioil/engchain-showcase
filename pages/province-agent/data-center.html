<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();

.ag-disc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--v3-ink-2);cursor:default;-webkit-tap-highlight-color:transparent}
.ag-disc>summary::-webkit-details-marker{display:none}

.ag-disc__bd{padding:0 13px 10px;font-size:11.5px;color:var(--v3-ink-3);line-height:1.65;border-top:1px dashed var(--v3-line)}

<script>/* B5 preview 演示上下文注入：仅 ?demo=province 时生效（复用 DataBus.applyDemoScenario 真实播种 u11 四川总代）；无参数时保持原业务空态 */

try { if (window.DataBus && DataBus.applyDemoScenario) DataBus.applyDemoScenario('province_agent_active'); } catch(e){}

<script>
(function () {
  'use strict';
  var root = document.getElementById('ag-root');
  var U = (window.DataBus && DataBus.current) ? DataBus.current().id : '';
  var Store = window.AgentStore, Insight = window.AgentInsight, Ledger = window.AgentLedger, E = window.AgentEsign;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(n) { n = Number(n) || 0; return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(ts) { if (!ts) return '—'; var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function download(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function emptyState(title, note, action) {
    return '<div class="v3-empty"><div class="ic">∅</div><div class="t">' + esc(title) + '</div><div class="d">' + esc(note) + '</div>' + (action || '<a class="v3-btn v3-btn--ghost" href="index.html" style="margin:0 auto">返回工作台</a>') + '</div>';
  }
  /* ---- 自绘 SVG 柱线图（近 N 月：柱=合格消费，线=约定所得；令牌色：金柱 + 绿线） ---- */
  function trendSvg(trend) {
    var W = 340, H = 150, padL = 34, padB = 22, padT = 12;
    var innerW = W - padL - 8, innerH = H - padT - padB;
    var maxV = Math.max.apply(null, trend.map(function (m) { return Math.max(m.gross, m.agreed); })) || 1;
    var bw = innerW / trend.length * 0.52;
    var xAt = function (i) { return padL + innerW / trend.length * (i + 0.5); };
    var yAt = function (v) { return padT + innerH - (v / maxV) * innerH; };
    var bars = trend.map(function (m, i) {
      var x = xAt(i) - bw / 2, y = yAt(m.gross), h = padT + innerH - y;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="2" fill="var(--v3-gold)" opacity=".82"/>';
    }).join('');
    var linePts = trend.map(function (m, i) { return xAt(i).toFixed(1) + ',' + yAt(m.agreed).toFixed(1); }).join(' ');
    var dots = trend.map(function (m, i) { return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(m.agreed).toFixed(1) + '" r="2.4" fill="var(--v3-success)"/>'; }).join('');
    var xl = trend.map(function (m, i) {
      var short = m.month.slice(5);
      return '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="8" fill="var(--v3-ink-3)">' + esc(short) + '</text>';
    }).join('');
    var gl = [0, 0.5, 1].map(function (f) {
      var y = padT + innerH - f * innerH;
      return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - 8) + '" y2="' + y.toFixed(1) + '" stroke="var(--v3-line-2)" stroke-width="1" stroke-dasharray="3 3" opacity=".4"/>'
        + '<text x="' + (padL - 4) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="8" fill="var(--v3-ink-3)">' + Math.round(maxV * f) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;">' + gl + bars + '<polyline points="' + linePts + '" fill="none" stroke="var(--v3-success)" stroke-width="1.6" stroke-linejoin="round"/>' + dots + xl + '</svg>'
      + '<details class="ag-disc v3-mt8"><summary>图表图例与数据源</summary><div class="ag-disc__bd">柱：合格消费；线：约定所得（近 ' + trend.length + ' 个月，数据源 = 台账 entries）。</div></details>';
  }

  /* ---- 月度对账单（复用 monthStatement + Ledger.toCsv；v3-table 横向滚动） ---- */
  function renderStatement(entries, month, cfg) {
    var st = Insight.monthStatement(entries, month, cfg);
    var rows = '<tr><th>分区</th><th>合格消费</th><th>总盘(×50%)</th><th>约定所得</th><th>自留/自身</th><th>笔数</th></tr>'
      + '<tr><td>二级线 subLedger</td><td class="num">' + fmt(st.subLedger.settledGross) + '</td><td class="num">' + fmt(st.subLedger.pool) + '</td><td class="num"><b>' + fmt(st.subLedger.agreed) + '</b></td><td class="num">' + fmt(st.subLedger.retained) + '</td><td class="num">' + st.subLedger.count + '</td></tr>'
      + '<tr><td>自身线 selfLedger</td><td class="num">' + fmt(st.selfLedger.settledBase) + '</td><td>—</td><td class="num"><b>' + fmt(st.selfLedger.amount) + '</b></td><td>自身 ×10%</td><td class="num">' + st.selfLedger.count + '</td></tr>';
    var taxRows = st.taxes.length ? '<tr><th colspan="3">税列（方案A 预扣）</th><td colspan="3" class="num">' + st.taxes.map(function (t) { return esc(t.scheme || 'labor') + ' 率 ' + (Number(t.rate) * 100) + '% · 预扣 ' + fmt(t.tax) + ' · 税后 ' + fmt(t.net); }).join('；') + '</td></tr>' : '';
    return '<div class="v3-table-wrap"><table class="v3-table"><tbody>' + rows + taxRows + '</tbody></table></div>'
      + '<div class="v3-legal v3-mt8">对账单合计：约定所得 ' + fmt(st.subLedger.agreed) + ' · 自留 ' + fmt(st.subLedger.retained) + ' · 自身线 ' + fmt(st.selfLedger.amount) + ' · 税列合计 ' + fmt(st.taxTotal) + '</div>';
  }

  /* ================= 总代视角 ================= */
  function renderProvince(me) {
    var subs = (Store.listSubs() || []).filter(function (s) { return s.parentUid === me.uid; });
    var entries = Store.listLedger() || [];
    var MOCK = window.MOCK || {};
    var quotaCfg = (MOCK.business && MOCK.business.provinceAgentQuota) || {};
    var ratioUsed = (subs[0] && subs[0].ratioToSub) || 0;
    var cfg = { _ratio: ratioUsed };
    var trend = Insight.monthlyTrend(entries, cfg, { months: 12 });
    var rank = Insight.subRank(entries, subs, cfg);
    var rs = Insight.refundStats(entries);

    /* 近 12 月有数据的月份集合（对账单月份选择） */
    var months = [];
    (entries || []).forEach(function (e) { if (e.month && months.indexOf(e.month) < 0) months.push(e.month); });
    months.sort().reverse();
    var curMonth = months[0] || Ledger.monthKey(Date.now());

    /* 比例变更历史：全部二级 ratioLog 合并时间轴 */
    var ratioEvents = [];
    subs.forEach(function (s) {
      (s.ratioLog || []).forEach(function (r) {
        ratioEvents.push({ at: r.at || 0, name: (s.company && s.company.name) || s.id, ratio: Number(r.ratio) || 0, reason: r.reason || '比例变更' });
      });
    });
    ratioEvents.sort(function (a, b) { return b.at - a.at; });

    var ratioHtml = ratioEvents.length
      ? '<div class="v3-timeline">' + ratioEvents.slice(0, 8).map(function (r) {
          return '<div class="v3-tl"><div class="t">' + esc(r.name) + ' → <b class="num">' + Math.round(r.ratio * 100) + '%</b></div><div class="time">' + fmtDate(r.at) + '</div><div class="d">' + esc(r.reason) + '</div></div>';
        }).join('') + '</div>'
      : '<div class="v3-readnote">暂无比例变更记录。</div>';

    var rankHtml = rank.length
      ? rank.map(function (r, i) {
          return '<div class="v3-row"><span class="v3-avatar">' + (i + 1) + '</span><span class="v3-row__main"><span class="v3-row__t">' + esc(r.name) + '</span><span class="v3-row__s">' + Math.round(r.ratioToSub * 100) + '% · ' + fmt(r.gross) + ' 合格消费（' + r.count + ' 笔）</span></span><span class="v3-row__right"><span class="v3-row__amt num">' + fmt(r.agreed) + '</span></span></div>';
        }).join('')
      : '<div class="v3-empty" style="padding:26px 12px"><div class="t">暂无二级合作方数据</div><div class="d">开通二级后，贡献排行将展示在这里。</div></div>';

    /* 本月 / 累计切换：本月=最后一月；累计=近 N 月合计（同一趋势数组，不新造计算） */
    var isCum = false;
    function keyBlock() {
      var last = trend[trend.length - 1];
      var sums = trend.reduce(function (a, m) {
        a.gross += m.gross; a.agreed += m.agreed; a.retained += m.retained; a.selfAmount += m.selfAmount;
        return a;
      }, { gross: 0, agreed: 0, retained: 0, selfAmount: 0 });
      var k = isCum ? sums : last;
      return '<div class="v3-earn">'
        + '<div class="seg"><button type="button" class="' + (!isCum ? 'on' : '') + '" id="ag-seg-month">本月</button><button type="button" class="' + (isCum ? 'on' : '') + '" id="ag-seg-cum">累计</button></div>'
        + '<div class="big num">' + fmt(k.agreed) + '</div>'
        + '<div class="sub">约定所得（' + (isCum ? '累计' : '本月') + '）</div>'
        + '<div class="rows">'
        + '<div class="v3-dline"><span class="k">合格消费（' + (isCum ? '累计' : '本月') + '）</span><span class="v num">' + fmt(k.gross) + '</span></div>'
        + '<div class="v3-dline"><span class="k">自留（' + (isCum ? '累计' : '本月') + '）</span><span class="v num">' + fmt(k.retained) + '</span></div>'
        + '<div class="v3-dline"><span class="k">自身线 ×10%</span><span class="v num">' + fmt(k.selfAmount) + '</span></div>'
        + '</div></div>';
    }

    var stmtSelect = '<select class="v3-select" style="flex:1;min-width:0;" id="ag-month-select">' + months.map(function (m) { return '<option value="' + esc(m) + '"' + (m === curMonth ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select>';

    root.innerHTML = '<div class="v3-page">'
      + '<section class="v3-card v3-mb12">'
      + '<div class="v3-card__hd"><span class="t">经营数据中心</span><span class="v3-badge v3-badge--gold">省级总代 · ' + esc(me.province) + '</span></div>'
      + '<details class="ag-disc"><summary>代理主体与口径说明</summary><div class="ag-disc__bd">' + esc(me.branchCompany && me.branchCompany.name || '—') + '；全部口径复用台账纯函数复算；平台零支出、不付款、不开票。</div></details>'
      + '<div id="ag-key-block">' + keyBlock() + '</div></section>'

      + '<section class="v3-card v3-mb12">'
      + '<div class="v3-card__hd"><span class="t">月度趋势</span><span class="v3-badge v3-badge--neutral">近 12 月</span></div>'
      + trendSvg(trend) + '</section>'

      + '<div class="v3-sec-title">二级贡献排行</div>'
      + '<section class="v3-list v3-mb12">' + rankHtml + '</section>'

      + '<div class="v3-sec-title">比例变更历史 <span class="v3-badge v3-badge--gold">ratioLog 留痕</span></div>'
      + '<section class="v3-card v3-mb12">' + ratioHtml + '</section>'

      + '<div class="v3-sec-title">退款 / 冲减统计</div>'
      + '<section class="v3-card v3-mb12">'
      + '<div class="v3-dline"><span class="k">退款笔数（含冻结期剔除）</span><span class="v num">' + rs.refunded + ' 笔 · ' + fmt(rs.refundAmount) + '</span></div>'
      + '<div class="v3-dline"><span class="k">特殊冲减（clawbackRef）</span><span class="v num">' + rs.clawed + ' 笔 · ' + fmt(rs.clawedAmount) + '</span></div>'
      + '<div class="v3-dline"><span class="k">红字冲减（redOffset）</span><span class="v num">' + rs.redOffset + ' 笔 · ' + fmt(rs.redOffsetAmount) + '</span></div>'
      + '<div class="v3-readnote v3-mt8">冻结期退款直接剔除（不计入基数）；出冻结按「当月红字→次月」规则冲减，两线独立不交叉。</div></section>'

      + '<div class="v3-sec-title">月度对账单</div>'
      + '<section class="v3-card v3-mb12"><div class="v3-flex v3-gap2 v3-mb10">' + stmtSelect
      + '<button type="button" class="v3-btn v3-btn--ghost v3-btn--sm" id="ag-stmt-print" style="flex:none" ' + (me.status === 'suspended' ? 'disabled' : '') + '>打印</button>'
      + '<button type="button" class="v3-btn v3-btn--ghost v3-btn--sm" id="ag-stmt-csv" style="flex:none" ' + (me.status === 'suspended' ? 'disabled' : '') + '>CSV</button></div>'
      + '<div id="ag-stmt-body">' + renderStatement(entries, curMonth, cfg) + '</div></section>'

      + '<div class="v3-flex v3-gap2 v3-mb12">'
      + '<a class="v3-btn v3-btn--ghost v3-takeall" href="index.html">返回工作台</a>'
      + '<a class="v3-btn v3-btn--ghost v3-takeall" href="network.html">授权网络</a>'
      + '</div>'

      + '<div class="trust">润锦工程链 Engchain 3.0</div>'
      + '</div>';

    /* 对账单月份切换 / 打印 / 下载 / 本月累计切换 */
    var sel = root.querySelector('#ag-month-select');
    var stmtBody = root.querySelector('#ag-stmt-body');
    if (sel) sel.onchange = function () { stmtBody.innerHTML = renderStatement(entries, sel.value, cfg); };
    var mBtn = root.querySelector('#ag-seg-month'), cBtn = root.querySelector('#ag-seg-cum'), keyBlockEl = root.querySelector('#ag-key-block');
    function refreshSeg() {
      if (mBtn) mBtn.className = isCum ? '' : 'on';
      if (cBtn) cBtn.className = isCum ? 'on' : '';
      if (keyBlockEl) keyBlockEl.innerHTML = keyBlock();
    }
    if (mBtn) mBtn.onclick = function () { isCum = false; refreshSeg(); };
    if (cBtn) cBtn.onclick = function () { isCum = true; refreshSeg(); };
    var pBtn = root.querySelector('#ag-stmt-print');
    if (pBtn) pBtn.onclick = function () { window.print(); };
    var csvBtn = root.querySelector('#ag-stmt-csv');
    if (csvBtn) csvBtn.onclick = function () {
      var csvText = Ledger.toCsv(entries, sel ? sel.value : curMonth);
      download('agent-statement-' + (sel ? sel.value : curMonth) + '.csv', '\ufeff' + csvText);
    };
  }

  /* ================= 二级视角 ================= */
  function renderSub(rec) {
    var entries = (Store.listLedger() || []).filter(function (e) { return e.subject === rec.uid; });
    var cfg = { _ratio: Number(rec.ratioToSub) || 0 };
    var trend = Insight.monthlyTrend(entries, cfg, { months: 12 });
    var due = Insight.frozenDue(entries, cfg);

    /* 消费构成：合格 settled / 不计入（recharge 等）/ 冻结中 */
    var eligibleTypes = Ledger && Ledger.DEFAULTS && Ledger.DEFAULTS.eligibleTypes
      ? Ledger.DEFAULTS.eligibleTypes : ['order_paid_net', 'points_unlock_paid', 'value_added_paid'];
    var quals = 0, others = 0, frozen = 0;
    entries.forEach(function (e) {
      var amt = Number(e.amount) || 0;
      if (e.line !== 'subLedger') return;
      if (e.frozenStatus === 'frozen' && !e.refunded) { frozen += amt; return; }
      if (e.frozenStatus === 'settled' && !e.refunded && eligibleTypes.indexOf(e.type) >= 0) { quals += amt; return; }
      others += amt;
    });

    var dueHtml = due.length
      ? '<div class="v3-timeline">' + due.map(function (e) { return '<div class="v3-tl"><div class="t num">' + fmt(e.amount) + ' · ' + esc(e.orderNo || e.serialNo) + '</div><div class="time">' + fmtDate(e.at) + '</div><div class="d">冻结到期将结算</div></div>'; }).join('') + '</div>'
      : '<div class="v3-readnote">无已到期冻结笔（T+7 内仍冻结中）。</div>';

    root.innerHTML = '<div class="v3-page">'
      + '<section class="v3-card v3-mb12">'
      + '<div class="v3-card__hd"><span class="t">我的数据中心</span><span class="v3-badge v3-badge--neutral">二级 · ' + esc(rec.province || '') + '</span></div>'
      + '<div class="v3-readnote v3-mb10">' + esc(rec.company && rec.company.name || '—') + ' · 约定 ' + Math.round((rec.ratioToSub || 0) * 100) + '% · 仅见本人约定所得</div>'
      + '<div class="v3-earn">'
      + '<div class="big num">' + fmt(trend[trend.length - 1].agreed) + '</div>'
      + '<div class="sub">本月约定所得</div>'
      + '<div class="rows"><div class="v3-dline"><span class="k">本月合格消费</span><span class="v num">' + fmt(trend[trend.length - 1].gross) + '</span></div></div>'
      + '</div></section>'

      + '<section class="v3-card v3-mb12">'
      + '<div class="v3-card__hd"><span class="t">本人约定所得月度趋势</span><span class="v3-badge v3-badge--neutral">近 12 月</span></div>'
      + trendSvg(trend) + '</section>'

      + '<div class="v3-sec-title">本人消费构成</div>'
      + '<section class="v3-card v3-mb12">'
      + '<div class="v3-dline"><span class="k">合格消费（计入基数）</span><span class="v num">' + fmt(quals) + '</span></div>'
      + '<div class="v3-dline"><span class="k">不计入（充值/非合格）</span><span class="v num">' + fmt(others) + '</span></div>'
      + '<div class="v3-dline"><span class="k">冻结中（T+7 未到期）</span><span class="v num">' + fmt(frozen) + '</span></div></section>'

      + '<div class="v3-sec-title">冻结到期列表</div>'
      + '<section class="v3-card v3-mb12">' + dueHtml + '</section>'

      + '<div class="v3-flex v3-gap2 v3-mb12">'
      + '<a class="v3-btn v3-btn--ghost v3-takeall" href="sub.html">返回二级工作台</a></div>'

      + '<div class="trust">润锦工程链 Engchain 3.0</div>'
      + '</div>';
  }

  function render() {
    if (!Store || !Insight || !Ledger) { root.innerHTML = '<div class="v3-page">' + emptyState('数据层未就绪', 'AgentStore/AgentInsight/AgentLedger 未加载。') + '</div>'; return; }
    var me = null;
    (Store.listProvinces() || []).forEach(function (p) { if (p.uid === U) me = p; });
    if (me) { renderProvince(me); return; }
    var subRec = null;
    (Store.listSubs() || []).forEach(function (s) { if (s.uid === U && (s.status === 'approved' || s.status === 'suspended')) subRec = s; });
    if (subRec) { renderSub(subRec); return; }
    root.innerHTML = '<div class="v3-page">' + emptyState('无经营数据权限', '数据中心仅对在册省级总代 / 已开通二级开放。') + '</div>';
  }

  render();
})();
</script>
<script>/* 深链返回兜底：无历史时回工作台 */
function agBack(){ if (history.length>1){ history.back(); } else { location.href='index.html'; } }</script>
</body>
