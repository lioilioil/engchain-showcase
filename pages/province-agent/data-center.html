<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>经营数据中心 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/agent.css">
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">经营数据中心</div>
    <div class="nav-right"></div>
  </div>
  <div class="ag-wrap" id="ag-root"></div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script src="../../js/orgs.js"></script>
<script src="../../js/agent-rules.js"></script>
<script src="../../js/agent-store.js"></script>
<script src="../../js/agent-ledger.js"></script>
<script src="../../js/agent-insight.js"></script>
<script src="../../js/agent-esign.js"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('ag-root');
  var U = (window.DataBus && DataBus.current) ? DataBus.current().id : '';
  var Store = window.AgentStore, Insight = window.AgentInsight, Ledger = window.AgentLedger, E = window.AgentEsign;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(n) { n = Number(n) || 0; return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(ts) { if (!ts) return '—'; var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function download(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function emptyState(title, note) { return '<div class="ag-empty"><div class="ag-empty__title">' + esc(title) + '</div><div class="ag-empty__note">' + esc(note) + '</div></div>'; }
  function calcTag() { return '<span class="ag-sig">模拟测算 · 非税务意见</span>'; }

  /* ---- 自绘 SVG 柱线图（近 N 月：柱=合格消费，线=约定所得；无外部依赖） ---- */
  function trendSvg(trend) {
    var W = 340, H = 150, padL = 34, padB = 22, padT = 12;
    var innerW = W - padL - 8, innerH = H - padT - padB;
    var maxV = Math.max.apply(null, trend.map(function (m) { return Math.max(m.gross, m.agreed); })) || 1;
    var bw = innerW / trend.length * 0.52;
    var xAt = function (i) { return padL + innerW / trend.length * (i + 0.5); };
    var yAt = function (v) { return padT + innerH - (v / maxV) * innerH; };
    var bars = trend.map(function (m, i) {
      var x = xAt(i) - bw / 2, y = yAt(m.gross), h = padT + innerH - y;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="2" fill="var(--ag-province-gold, #c7a55a)" opacity=".82"/>';
    }).join('');
    var linePts = trend.map(function (m, i) { return xAt(i).toFixed(1) + ',' + yAt(m.agreed).toFixed(1); }).join(' ');
    var dots = trend.map(function (m, i) { return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(m.agreed).toFixed(1) + '" r="2.4" fill="#2f9e44"/>'; }).join('');
    var xl = trend.map(function (m, i) {
      var short = m.month.slice(5);
      return '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="8" fill="var(--text-3)">' + esc(short) + '</text>';
    }).join('');
    var gl = [0, 0.5, 1].map(function (f) {
      var y = padT + innerH - f * innerH;
      return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - 8) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3" opacity=".4"/>'
        + '<text x="' + (padL - 4) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="8" fill="var(--text-3)">' + Math.round(maxV * f) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;">' + gl + bars + '<polyline points="' + linePts + '" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-linejoin="round"/>' + dots + xl + '</svg>'
      + '<div class="ag-meta">柱：合格消费 · 线：约定所得（近 ' + trend.length + ' 个月，数据源 = 台账 entries）</div>';
  }

  /* ---- 月度对账单（复用 monthStatement + Ledger.toCsv） ---- */
  function renderStatement(entries, month, cfg) {
    var st = Insight.monthStatement(entries, month, cfg);
    var rows = '<tr><th>分区</th><th>合格消费</th><th>总盘(×50%)</th><th>约定所得</th><th>自留/自身</th><th>笔数</th></tr>'
      + '<tr><td>二级线 subLedger</td><td>' + fmt(st.subLedger.settledGross) + '</td><td>' + fmt(st.subLedger.pool) + '</td><td>' + fmt(st.subLedger.agreed) + '</td><td>' + fmt(st.subLedger.retained) + '</td><td>' + st.subLedger.count + '</td></tr>'
      + '<tr><td>自身线 selfLedger</td><td>' + fmt(st.selfLedger.settledBase) + '</td><td>—</td><td>' + fmt(st.selfLedger.amount) + '</td><td>自身 ×10%</td><td>' + st.selfLedger.count + '</td></tr>';
    var taxRows = st.taxes.length ? '<tr><th colspan="3">税列（方案A 预扣，模拟）</th><td colspan="3">' + st.taxes.map(function (t) { return esc(t.scheme || 'labor') + ' 率 ' + (Number(t.rate) * 100) + '% · 预扣 ' + fmt(t.tax) + ' · 税后 ' + fmt(t.net); }).join('；') + '</td></tr>' : '';
    return '<table class="ag-ledger-table"><tbody>' + rows + taxRows + '</tbody></table>'
      + '<div class="ag-meta">对账单合计：约定所得 ' + fmt(st.subLedger.agreed) + ' · 自留 ' + fmt(st.subLedger.retained) + ' · 自身线 ' + fmt(st.selfLedger.amount) + ' · 税列合计 ' + fmt(st.taxTotal) + '</div>';
  }

  /* ================= 总代视角 ================= */
  function renderProvince(me) {
    var subs = (Store.listSubs() || []).filter(function (s) { return s.parentUid === me.uid; });
    var entries = Store.listLedger() || [];
    var MOCK = window.MOCK || {};
    var quotaCfg = (MOCK.business && MOCK.business.provinceAgentQuota) || {};
    var ratioUsed = (subs[0] && subs[0].ratioToSub) || 0;
    var cfg = { _ratio: ratioUsed };
    var trend = Insight.monthlyTrend(entries, cfg, { months: 12 });
    var rank = Insight.subRank(entries, subs, cfg);
    var rs = Insight.refundStats(entries);

    /* 近 12 月有数据的月份集合（对账单月份选择） */
    var months = [];
    (entries || []).forEach(function (e) { if (e.month && months.indexOf(e.month) < 0) months.push(e.month); });
    months.sort().reverse();
    var curMonth = months[0] || Ledger.monthKey(Date.now());

    /* 比例变更历史：全部二级 ratioLog 合并时间轴 */
    var ratioEvents = [];
    subs.forEach(function (s) {
      (s.ratioLog || []).forEach(function (r) {
        ratioEvents.push({ at: r.at || 0, name: (s.company && s.company.name) || s.id, ratio: Number(r.ratio) || 0, reason: r.reason || '比例变更' });
      });
    });
    ratioEvents.sort(function (a, b) { return b.at - a.at; });

    var ratioHtml = ratioEvents.length
      ? '<div class="ag-timeline">' + ratioEvents.slice(0, 8).map(function (r) {
          return '<div class="ag-timeline__item"><div class="ag-timeline__dot"></div><div class="ag-timeline__body"><b>' + esc(r.name) + ' → ' + Math.round(r.ratio * 100) + '%</b><div class="ag-meta">' + fmtDate(r.at) + ' · ' + esc(r.reason) + '</div></div></div>';
        }).join('') + '</div>'
      : '<div class="ag-note">暂无比例变更记录。</div>';

    var rankHtml = rank.length
      ? rank.map(function (r, i) {
          return '<div class="ag-rank-row"><span class="ag-rank__no">' + (i + 1) + '</span><div class="ag-rank__main"><b>' + esc(r.name) + '</b><div class="ag-meta">' + Math.round(r.ratioToSub * 100) + '% · ' + fmt(r.gross) + ' 合格消费（' + r.count + ' 笔）</div></div><b class="ag-rank__val">' + fmt(r.agreed) + '</b></div>';
        }).join('')
      : '<div class="ag-note">暂无二级合作方数据。</div>';

    /* 本月 / 累计切换：本月=最后一月；累计=近 N 月合计（同一趋势数组，不新造计算） */
    var isCum = false;
    function keyBlock() {
      var last = trend[trend.length - 1];
      var sums = trend.reduce(function (a, m) {
        a.gross += m.gross; a.agreed += m.agreed; a.retained += m.retained; a.selfAmount += m.selfAmount;
        return a;
      }, { gross: 0, agreed: 0, retained: 0, selfAmount: 0 });
      var k = isCum ? sums : last;
      return '<div class="ag-amount-block">'
        + '<div class="ag-amount-row"><span>约定所得（' + (isCum ? '累计' : '本月') + '）</span><b>' + fmt(k.agreed) + '</b></div>'
        + '<div class="ag-amount-row"><span>合格消费（' + (isCum ? '累计' : '本月') + '）</span><b>' + fmt(k.gross) + '</b></div>'
        + '<div class="ag-amount-row"><span>自留（' + (isCum ? '累计' : '本月') + '）</span><b>' + fmt(k.retained) + '</b></div>'
        + '<div class="ag-amount-row"><span>自身线 ×10%</span><b>' + fmt(k.selfAmount) + '</b></div></div>';
    }

    var stmtSelect = '<select class="ag-input ag-month-select" style="max-width:180px;">' + months.map(function (m) { return '<option value="' + esc(m) + '"' + (m === curMonth ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select>';

    root.innerHTML = '<div class="ag-wrap">'
      + '<section class="ag-card"><h3>经营数据中心 <span class="ag-chip ag-chip--pa">省级总代 · ' + esc(me.province) + '</span></h3>'
      + '<div class="ag-note">' + esc(me.branchCompany && me.branchCompany.name || '—') + ' · 全部口径复用台账纯函数复算，' + calcTag() + '</div>'
      + '<div class="ag-seg ag-amount-seg"><button class="' + (!isCum ? 'on' : '') + '" id="ag-seg-month">本月</button><button class="' + (isCum ? 'on' : '') + '" id="ag-seg-cum">累计</button></div>'
      + '<div id="ag-key-block">' + keyBlock() + '</div>'
      + '</section>'

      + '<section class="ag-card"><h3>月度趋势（近 12 月）</h3>' + trendSvg(trend) + '</section>'

      + '<section class="ag-card"><h3>二级贡献排行</h3>' + rankHtml + '</section>'

      + '<section class="ag-card"><h3>比例变更历史（ratioLog 时间轴）</h3>' + ratioHtml + '</section>'

      + '<section class="ag-card"><h3>退款 / 冲减统计</h3>'
      + '<div class="ag-amount-block"><div class="ag-amount-row"><span>退款笔数（含冻结期剔除）</span><b>' + rs.refunded + ' 笔 · ' + fmt(rs.refundAmount) + '</b></div>'
      + '<div class="ag-amount-row"><span>特殊冲减（clawbackRef）</span><b>' + rs.clawed + ' 笔 · ' + fmt(rs.clawedAmount) + '</b></div>'
      + '<div class="ag-amount-row"><span>红字冲减（redOffset）</span><b>' + rs.redOffset + ' 笔 · ' + fmt(rs.redOffsetAmount) + '</b></div></div>'
      + '<div class="ag-note">冻结期退款直接剔除（不计入基数）；出冻结按「当月红字→次月」规则冲减，两线独立不交叉。</div></section>'

      + '<section class="ag-card"><h3>月度对账单</h3><div class="ag-actions" style="gap:8px;align-items:center;">' + stmtSelect
      + '<button class="ag-btn ag-btn--ghost ag-btn--sm" id="ag-stmt-print" ' + (me.status === 'suspended' ? 'disabled' : '') + '>打印</button>'
      + '<button class="ag-btn ag-btn--ghost ag-btn--sm" id="ag-stmt-csv" ' + (me.status === 'suspended' ? 'disabled' : '') + '>下载 CSV</button></div>'
      + '<div id="ag-stmt-body">' + renderStatement(entries, curMonth, cfg) + '</div>'
      + '<div class="ag-disc">对账单首行免责：' + calcTag() + '，非实际代扣金额。</div></section>'

      + '<div class="ag-card"><div class="ag-actions ag-actions--edit">'
      + '<a class="ag-btn ag-btn--ghost ag-btn--sm" href="index.html">返回工作台</a>'
      + '<a class="ag-btn ag-btn--ghost ag-btn--sm" href="network.html">授权网络</a>'
      + '</div></div></div>';

    /* 对账单月份切换 / 打印 / 下载 / 本月累计切换 */
    var sel = root.querySelector('.ag-month-select');
    var stmtBody = root.querySelector('#ag-stmt-body');
    if (sel) sel.onchange = function () { stmtBody.innerHTML = renderStatement(entries, sel.value, cfg); };
    var mBtn = root.querySelector('#ag-seg-month'), cBtn = root.querySelector('#ag-seg-cum'), keyBlockEl = root.querySelector('#ag-key-block');
    function refreshSeg() {
      if (mBtn) mBtn.className = isCum ? '' : 'on';
      if (cBtn) cBtn.className = isCum ? 'on' : '';
      if (keyBlockEl) keyBlockEl.innerHTML = keyBlock();
    }
    if (mBtn) mBtn.onclick = function () { isCum = false; refreshSeg(); };
    if (cBtn) cBtn.onclick = function () { isCum = true; refreshSeg(); };
    var pBtn = root.querySelector('#ag-stmt-print');
    if (pBtn) pBtn.onclick = function () { window.print(); };
    var cBtn = root.querySelector('#ag-stmt-csv');
    if (cBtn) cBtn.onclick = function () {
      var csvText = Ledger.toCsv(entries, sel ? sel.value : curMonth);
      download('agent-statement-' + (sel ? sel.value : curMonth) + '.csv', '\ufeff' + csvText);
    };
  }

  /* ================= 二级视角 ================= */
  function renderSub(rec) {
    var entries = (Store.listLedger() || []).filter(function (e) { return e.subject === rec.uid; });
    var cfg = { _ratio: Number(rec.ratioToSub) || 0 };
    var trend = Insight.monthlyTrend(entries, cfg, { months: 12 });
    var due = Insight.frozenDue(entries, cfg);

    /* 消费构成：合格 settled / 不计入（recharge 等）/ 冻结中 */
    var eligibleTypes = Ledger && Ledger.DEFAULTS && Ledger.DEFAULTS.eligibleTypes
      ? Ledger.DEFAULTS.eligibleTypes : ['order_paid_net', 'points_unlock_paid', 'value_added_paid'];
    var quals = 0, others = 0, frozen = 0;
    entries.forEach(function (e) {
      var amt = Number(e.amount) || 0;
      if (e.line !== 'subLedger') return;
      if (e.frozenStatus === 'frozen' && !e.refunded) { frozen += amt; return; }
      if (e.frozenStatus === 'settled' && !e.refunded && eligibleTypes.indexOf(e.type) >= 0) { quals += amt; return; }
      others += amt;
    });

    var dueHtml = due.length
      ? due.map(function (e) { return '<div class="ag-timeline__item"><div class="ag-timeline__dot"></div><div class="ag-timeline__body"><b>' + fmt(e.amount) + ' · ' + esc(e.orderNo || e.serialNo) + '</b><div class="ag-meta">' + fmtDate(e.at) + ' · 冻结到期将结算</div></div></div>'; }).join('')
      : '<div class="ag-note">无已到期冻结笔（T+7 内仍冻结中）。</div>';

    root.innerHTML = '<div class="ag-wrap">'
      + '<section class="ag-card"><h3>我的数据中心 <span class="ag-chip ag-chip--sub">二级 · ' + esc(rec.province || '') + '</span></h3>'
      + '<div class="ag-note">' + esc(rec.company && rec.company.name || '—') + ' · 约定 ' + Math.round((rec.ratioToSub || 0) * 100) + '% · 仅见本人约定所得，' + calcTag() + '</div>'
      + '<div class="ag-amount-block"><div class="ag-amount-row"><span>本月约定所得</span><b>' + fmt(trend[trend.length - 1].agreed) + '</b></div>'
      + '<div class="ag-amount-row"><span>本月合格消费</span><b>' + fmt(trend[trend.length - 1].gross) + '</b></div></div></section>'

      + '<section class="ag-card"><h3>本人约定所得月度趋势（近 12 月）</h3>' + trendSvg(trend) + '</section>'

      + '<section class="ag-card"><h3>本人消费构成</h3>'
      + '<div class="ag-amount-block"><div class="ag-amount-row"><span>合格消费（计入基数）</span><b>' + fmt(quals) + '</b></div>'
      + '<div class="ag-amount-row"><span>不计入（充值/非合格）</span><b>' + fmt(others) + '</b></div>'
      + '<div class="ag-amount-row"><span>冻结中（T+7 未到期）</span><b>' + fmt(frozen) + '</b></div></div></section>'

      + '<section class="ag-card"><h3>冻结到期列表</h3>' + dueHtml + '</section>'

      + '<div class="ag-card"><div class="ag-actions ag-actions--edit">'
      + '<a class="ag-btn ag-btn--ghost ag-btn--sm" href="sub.html">返回二级工作台</a>'
      + '</div></div></div>';
  }

  function render() {
    if (!Store || !Insight || !Ledger) { root.innerHTML = emptyState('数据层未就绪', 'AgentStore/AgentInsight/AgentLedger 未加载。'); return; }
    var me = null;
    (Store.listProvinces() || []).forEach(function (p) { if (p.uid === U) me = p; });
    if (me) { renderProvince(me); return; }
    var subRec = null;
    (Store.listSubs() || []).forEach(function (s) { if (s.uid === U && (s.status === 'approved' || s.status === 'suspended')) subRec = s; });
    if (subRec) { renderSub(subRec); return; }
    root.innerHTML = emptyState('无经营数据权限', '数据中心仅对在册省级总代 / 已开通二级开放。');
  }

  render();
})();
</script>
</body>
</html>
