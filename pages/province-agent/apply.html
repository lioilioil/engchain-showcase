<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/province-agent/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>二级合作申请 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../../css/agent.css">
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="agBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">二级合作申请</div>
    <div class="nav-right"></div>
  </div>
  <div class="ag-wrap" id="ap-root">
    <div class="ag-card">
      <h3>二级合作申请通道</h3>
      <p class="ag-note">本页面承载「招商码 → 企业自助申请」双轨链路的申请入口（T2 阶段建设）。当前展示申请流程与所需材料，正式提交表单由 T2 阶段提供。</p>
      <div class="ag-sub-card" id="ap-invite">
        <div class="ag-sub-card__top">
          <span class="ag-prov">邀请招商码</span>
          <span class="ag-badge ag-chip--pa" id="ap-code">—</span>
        </div>
        <div class="ag-note">来自总代招商物料 · 招商关系与分销邀请完全隔离，不触发任何分销返佣</div>
      </div>
      <div class="ag-sub-card">
        <div class="ag-sub-card__top"><span class="ag-prov">申请流程</span></div>
        <div class="ag-note" style="white-space:pre-line;">1. 企业主体核验（营业执照 / uscc / 法人）
2. 总代初审（同省绑定 / 名额校验）
3. 平台终审（企业资质复核）
4. 签署 O4 合作协议（先签后开）
5. 开通合作测算视图</div>
      </div>
      <div class="ag-note">申请主体须为同省企业；自然人不可登记二级；一企一号（uscc）唯一绑定；不发展下级。</div>
    </div>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script src="../../js/orgs.js"></script>
<script src="../../js/agent-rules.js"></script>
<script src="../../js/agent-store.js"></script>
<script src="../../js/agent-referral.js"></script>
<script>
function agBack(){ if(history.length>1){history.back();} else {location.href='recruit.html';} }
document.addEventListener('DOMContentLoaded',function(){
  var q={};location.search.replace(/[?&]([^=&]+)=([^&]*)/g,function(_,k,v){q[decodeURIComponent(k)]=decodeURIComponent(v);});
  var invite=q.invite||'';
  var el=document.getElementById('ap-code');
  if(invite){ el.textContent=invite; }
  else{ el.textContent='—'; el.parentNode.querySelector('.ag-prov').textContent='未携带招商码'; }
  if(window.AgentReferral && invite){ AgentReferral.log('apply_page_view',{code:invite}); }
});
</script>
</body>
</html>
