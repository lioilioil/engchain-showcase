<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/order/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的订单 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M8%201.2%2013.2%203.3v4.1c0%203.1-2.2%205.5-5.2%206.4-3-.9-5.2-3.3-5.2-6.4V3.3L8%201.2Z%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.3%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%226.55%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3Cellipse%20cx%3D%229.45%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="../../css/state.css">
<style>
/* 状态chips样式 */
/* [FIX] 头部两行（seg 分类 + 状态 chips）禁止被 .phone 纵向 flex 挤压：
   .scroll 已改为 flex:1 1 0 填满剩余空间，此处再兜底保护，防止内容超限时标签被压扁裁字 */
.seg, .status-chips { flex-shrink: 0; }
.filter-chip {
  flex-shrink: 0;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  color: var(--text-2);
  background: var(--bg-card-2);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  font-weight: 500;
}
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active {
  background: var(--primary-soft);
  color: var(--primary-dim);
  border-color: var(--accent-line);
  font-weight: 600;
}
/* 骨架屏由 state.css 的 S0 .sk-list/.sk-card/.sk-line 提供（shimmer）；此处仅定义空态墨色主 CTA */
.es-cta { background: linear-gradient(180deg, var(--action), var(--action-deep)); color: var(--on-action); box-shadow: var(--btn-lift); }
.es-cta:active { transform: scale(.98); }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="nav-title">我的订单</div>
    <div class="nav-right"></div>
  </div>

  <div class="seg" style="margin:12px 14px 8px;">
    <span class="seg-item is-on" data-tab="all">全部</span>
    <span class="seg-item" data-tab="normal">普通订单</span>
  </div>

  <!-- 状态筛选 chips（E3-15） -->
  <div class="status-chips" style="display:flex;gap:6px;overflow-x:auto;margin:0 14px 12px;padding:0 2px;">
    <span class="filter-chip active" data-sf="all">全部</span>
    <span class="filter-chip" data-sf="pending">待支付</span>
    <span class="filter-chip" data-sf="serving">进行中</span>
    <span class="filter-chip" data-sf="await">待验收</span>
    <span class="filter-chip" data-sf="settled">已完成</span>
    <span class="filter-chip" data-sf="refunded">已退款</span>
  </div>

  <div class="scroll" style="padding-top:4px; display:flex; flex-direction:column; flex:1 1 0; min-height:0; padding-bottom:20px;">
    <div id="order-list"></div>
    <div id="order-empty" style="display:none;text-align:center;padding:48px 20px;color:var(--text-3);font-size:13px;">
      <div style="width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-dim)" stroke-width="1.6" style="width:30px;height:30px;"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      </div>
      <div id="order-empty-text">暂无订单</div><br><span style="font-size:11px;">去供需大厅发现商机</span>
    </div>

    <!-- 申诉退款：始终固定在页面底部 -->
    <div style="margin-top:auto; text-align:center; padding:20px 0 8px;">
      <a href="../refund/appeal.html" style="color:var(--text-3);font-size:12px;">申诉退款 · 订单 / 余额 7 天无理由</a>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script>
(function(){
  window.__ROOT__='../../';
  /* 统一状态映射：普通订单 + 中介托管 */
  var STATUS_MAP = {
    pending:      { label: '待支付', cls: 'tag-warning' },
    serving:      { label: '服务中', cls: 'tag-warning' },
    await_accept: { label: '待验收', cls: 'tag-gold' },
    await_confirm:{ label: '待验收', cls: 'tag-gold' },
    settled:      { label: '已完成', cls: 'tag-success' },
    cancelled:    { label: '已取消', cls: 'tag-gray' },
    refunded:     { label: '已退款', cls: 'tag-gray' },
    partial_refund:{ label: '部分退款', cls: 'tag-gray' },
    escrowed:     { label: '已托管', cls: 'tag-primary' },
    disputed:     { label: '纠纷中', cls: 'tag-danger' },
    draft:        { label: '待支付', cls: 'tag-warning' }
  };
  var TYPE_MAP = { supply: '供方承接', need: '需求匹配', agency: '中介撮合', transfer: '建企买卖', qual: '资质招商' };
  var currentTab = 'all';
  /* P1-5 解析 ?tab= 参数并同步 seg 激活态 */
  var _tp = new URLSearchParams(location.search).get('tab');
  if (_tp === 'normal' || _tp === 'mediation') currentTab = _tp;
  document.querySelectorAll('.seg-item').forEach(function(x){ x.classList.toggle('is-on', x.getAttribute('data-tab')===currentTab); });
/* 状态 chips 分组（E3-15） */
  var STATUS_GROUPS = {
    pending:   ['pending', 'draft'],
    serving:   ['serving', 'escrowed', 'disputed'],/* P2-12 纠纷中归入服务中 */
    await:     ['await_accept', 'await_confirm'],
    settled:   ['settled'],
    refunded:  ['refunded', 'partial_refund']/* P3-17 取消单从退款分组移出，仅在“全部”可见 */
  };
  var statusFilter = 'all';
function currentUser() {
    try { return (window.DataBus && DataBus.current) ? DataBus.current() : null; } catch (e) { return null; }
  }

  /* 空状态插画 */
  function emptyIcon() {
    return '<div style="width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-dim)" stroke-width="1.6" style="width:30px;height:30px;"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></div>';
  }

  /* 读取普通订单（engchain-orders），过滤当前用户 */
  function getNormalOrders() {
    var orders = [];
    try { orders = (window.DataBus && DataBus.orders) ? DataBus.orders() : JSON.parse(localStorage.getItem('engchain-orders')||'[]'); } catch (e) {}
    var cu = currentUser();
    var uid = cu ? (cu.id || '') : '';
    var acct = cu ? (cu.account || '') : '';
    return orders.filter(function (o) { return o.owner === uid || o.counterpartyId === uid; }).map(function (o) {
      return {
        kind: 'normal', id: o.id, title: o.title || '', type: TYPE_MAP[o.type] || o.type, rawType: o.type,
        counterparty: o.counterparty || '', amount: o.amount, status: o.status,
        ts: o.ts ? new Date(String(o.ts).replace(/-/g,'/')).getTime() : (o.updatedAt || 0),
        detailUrl: 'detail.html?id=' + o.id
      };
    });
  }

  /* [PHASE 0] 中介托管已下线：平台不再承接中介交易资金，订单中心不展示托管单 */
  function getMediationOrders() { return []; }

  /* [PERF] 防抖工具 */
  function debounce(fn, wait) {
    var t;
    return function () {
      var ctx = this, args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  /* [PERF] 订单数据缓存 */
  var _orderCache = null;
  function invalidateCache() { _orderCache = null; }

  function render() {
    var list = document.getElementById('order-list');
    var empty = document.getElementById('order-empty');
    try {
    var acct = currentUser();
    if (!acct) {
      list.innerHTML = '';
      empty.style.display = 'block';
      empty.innerHTML = '<div class="empty-state"><div class="e-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:40px;height:40px;color:var(--text-3);"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></div>' +
        '<div class="e-title">登录后查看订单</div><div class="e-desc">登录后可查看你的全部订单与对接进展</div>' +
        '<div class="es-actions"><a href="../auth/login.html" class="btn es-cta es-action">去登录</a></div></div>';
      return;
    }
    /* [PERF] 使用缓存：首次读取后缓存，事件触发时清除缓存重新读取 */
    if (!_orderCache) {
      var _all = [];
      try {
        if (currentTab === 'all' || currentTab === 'normal') _all = _all.concat(getNormalOrders());
      } catch (e) { console.warn('订单数据读取失败:', e); }
      _orderCache = _all;
    }
    var all = (_orderCache || []).slice();
    /* 按时间倒序 */
    all.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
/* 状态 chips 筛选（E3-15，跨 tab 生效） */
    if (statusFilter !== 'all') {
      var grp = STATUS_GROUPS[statusFilter] || [];
      all = all.filter(function (o) { return grp.indexOf(o.status) > -1; });
    }
    if (!all.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
      var tip = currentTab === 'normal' ? '暂无普通订单' : '暂无订单';
      empty.innerHTML = '<div class="empty-state"><div class="e-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:40px;height:40px;color:var(--text-3);"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></div>' +
        '<div class="e-title">' + tip + '</div><div class="e-desc">去供需大厅发现商机，成交后订单会展示在这里</div>' +
        '<div class="es-actions"><a href="../supply/list.html" class="btn es-cta es-action">去供需大厅</a>' +
        '<a href="../publish/index.html" class="btn btn-ghost es-action">去发布</a></div></div>';
      return;
    }
    empty.style.display = 'none';
    list.innerHTML = all.map(function (o) {
      var st = STATUS_MAP[o.status] || { label: '未知', cls: 'tag-gray' };/* P3-16 未知状态中性灰色兜底 */
      var amt = o.amount ? UI.money(o.amount) : '面议';
      var escrowBadge = o.kind === 'mediation' ? '<span class="tag tag-gold" style="margin-left:6px;font-size:10px;">托管</span>' : '';
      return '<div class="card" style="margin-bottom:10px;cursor:pointer;" onclick="location.href=\'' + o.detailUrl + '\'">' +
        '<div class="fb-between"><span class="text-3 fs-12">订单号 ' + o.id + '</span><span class="tag ' + st.cls + '">' + st.label + '</span></div>' +
        '<div class="fw-600 fs-14" style="margin-top:8px;">' + (o.title || '') + escrowBadge + '</div>' +
        '<div class="text-3 fs-12 mt-1">' + o.type + ' · ' + (o.counterparty || '') + '</div>' +
        '<div class="fb-between" style="margin-top:10px;"><span class="mono fw-700">' + amt + '</span>' +
        '<span class="link-green fs-12">查看 ›</span></div>' +
        '</div>';
    }).join('');
    } catch (e) {
      console.error('order render error:', e);
      if (list) list.innerHTML = '<div class="st-error"><div class="st-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:24px;height:24px;"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div><div class="st-title">加载失败</div><div class="st-desc">网络好像开小差了，请重试</div><div class="st-actions"><button class="btn btn-ghost es-action" onclick="location.reload()">重试</button></div></div>';
      if (empty) empty.style.display = 'none';
    }
  }

  /* [PERF] 防抖版render（在render函数定义之后声明） */
  var scheduleRender = debounce(render, 100);

  document.querySelectorAll('.seg-item').forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll('.seg-item').forEach(function(x){x.classList.remove('is-on')});
      el.classList.add('is-on');
      currentTab = el.getAttribute('data-tab');
      invalidateCache();
      scheduleRender();
    };
  });

  /* 状态 chips 点击（E3-15） */
  document.querySelectorAll('.status-chips .filter-chip').forEach(function (el) {
    el.onclick = function () {
      document.querySelectorAll('.status-chips .filter-chip').forEach(function (x) { x.classList.remove('active'); });
      el.classList.add('active');
      statusFilter = el.getAttribute('data-sf');
      scheduleRender();
    };
  });

  /* [FIX] 首次加载骨架屏：数据未就绪时显示 3-4 行灰色脉冲卡片 */
  function showSkeleton() {
    var list = document.getElementById('order-list');
    if (!list) return;
    var sk = '<div class="sk-list" aria-hidden="true">';
    for (var i = 0; i < 3; i++) {
      sk += '<div class="sk-card"><div class="sk-line w70"></div><div class="sk-line w95"></div><div class="sk-line w45"></div></div>';
    }
    list.innerHTML = sk + '</div>';
  }
  /* [PERF] 只监听订单相关事件 */
  window.addEventListener('engchain:orders', function () { invalidateCache(); scheduleRender(); });
  window.addEventListener('engchain:mediation', function () { invalidateCache(); scheduleRender(); });
  /* [PERF] 立即渲染：不等待350ms */
  showSkeleton();
  scheduleRender();
})();
</script>
<script>window.__SWIPE_ZONES__=window.__SWIPE_ZONES__||[];window.__SWIPE_ZONES__.push({trigger:'.scroll',consumers:[{type:'scroll',el:'.status-chips'}]});</script>
</body>
</html>
