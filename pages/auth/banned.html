<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/auth/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>账号已封禁 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <div class="nav-title">账号状态</div>
    <div class="nav-right"></div>
  </div>
  <div class="scroll" style="padding-top:8px;padding-bottom:40px;">
    <!-- 封禁状态头部 -->
    <div class="card" style="text-align:center;padding:32px 20px;margin:0 12px;">
      <div style="width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:rgba(220,53,69,.1);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#dc3545" stroke-width="1.8" style="width:36px;height:36px;"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
      </div>
      <div style="font-size:20px;font-weight:800;color:var(--text-1);">账号已被封禁</div>
      <div style="font-size:13px;color:var(--text-3);margin-top:8px;line-height:1.6;" id="ban-reason">因违反平台规则，账号已被限制使用</div>
      <span class="tag" style="margin-top:14px;background:rgba(220,53,69,.12);color:#dc3545;">已封禁</span>
    </div>

    <!-- 封禁详情 -->
    <div class="section-title" style="margin-top:20px;"><div class="st-left">封禁详情</div></div>
    <div class="group">
      <div class="row"><span class="label text-2">封禁时间</span><span class="value" id="ban-time">—</span></div>
      <div class="row"><span class="label text-2">封禁类型</span><span class="value">永久封禁</span></div>
      <div class="row"><span class="label text-2">资金状态</span><span class="value" style="color:#dc3545;font-weight:600;">已冻结</span></div>
      <div class="row"><span class="label text-2">可用功能</span><span class="value">仅申诉与客服</span></div>
    </div>

    <!-- 申诉入口 -->
    <div class="section-title" style="margin-top:20px;"><div class="st-left">申诉渠道</div></div>
    <div class="card" style="margin:0 12px;">
      <div style="font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:14px;">
        如您认为封禁有误，可通过以下渠道提交申诉。我们将在 <b>3 个工作日</b>内回复处理结果。
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" onclick="submitAppeal()" style="width:100%;">提交申诉</button>
        <button class="btn btn-ghost" onclick="contactService()" style="width:100%;">联系客服</button>
      </div>
    </div>

    <!-- 客服联系方式 -->
    <div class="section-title" style="margin-top:20px;"><div class="st-left">客服联系方式</div></div>
    <div class="group">
      <div class="row"><span class="label text-2">客服热线</span><span class="value mono">400-888-6688</span></div>
      <div class="row"><span class="label text-2">服务时间</span><span class="value">工作日 9:00-18:00</span></div>
      <div class="row"><span class="label text-2">申诉邮箱</span><span class="value mono">appeal@engchain.cn</span></div>
    </div>

    <!-- 平台规则 -->
    <div style="padding:16px 20px;text-align:center;">
      <a href="../agreement/user.html" style="font-size:11px;color:var(--text-3);text-decoration:underline;">查看《平台用户规则》</a>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
window.__ROOT__='../../';

function getBanInfo() {
  try {
    var u = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    if (u && u.banned) {
      document.getElementById('ban-reason').textContent = u.banReason || '因违反平台规则，账号已被限制使用';
      document.getElementById('ban-time').textContent = u.banAt ? new Date(u.banAt).toLocaleString('zh-CN') : '—';
    }
  } catch (e) {}
}

function submitAppeal() {
  UI.dialog({
    title: '提交申诉',
    text: '请通过邮件向 appeal@engchain.cn 提交申诉材料，包括：账号信息、封禁异议说明、相关证明材料。我们将在3个工作日内回复。',
    ok: '我知道了',
    cancel: '复制邮箱',
    onCancel: function () {
      try { navigator.clipboard.writeText('appeal@engchain.cn'); UI.toast('邮箱已复制', 'ok'); } catch (e) { UI.toast('appeal@engchain.cn', 'ok'); }
    }
  });
}

function contactService() {
  UI.dialog({
    title: '联系客服',
    text: '客服热线：400-888-6688<br>服务时间：工作日 9:00-18:00<br>申诉邮箱：appeal@engchain.cn',
    ok: '我知道了'
  });
}

getBanInfo();
</script>
</body>
</html>
