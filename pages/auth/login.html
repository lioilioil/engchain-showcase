<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/auth/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="auth-bg"></div>
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-logo">链</div>
      <div class="auth-title">工程链 ENGCHAIN</div>
      <div class="auth-sub">供需匹配 · AI 赋能</div>
    </div>

    <div class="auth-hist" id="auth-hist" style="display:none;">
      <div class="hist-title">最近登录 · 点击一键切换</div>
      <div class="hist-list" id="hist-list"></div>
    </div>

    <div class="auth-form">
      <div class="f-tabs"><span class="ft is-on" data-mode="sms">验证码登录</span><span class="ft" data-mode="pwd">密码登录</span></div>

      <div class="field"><label class="field-label">手机号</label><input class="input" id="phone" placeholder="请输入手机号" maxlength="11" value="13800008866"></div>
      <div class="field" id="field-code"><label class="field-label">验证码</label>
        <div class="f-flex" style="gap:10px;"><input class="input" id="code" placeholder="请输入验证码" maxlength="6" value="123456"><button class="btn btn-ghost" style="white-space:nowrap;flex:none;" onclick="sendCode()">获取验证码</button></div>
      </div>
      <div class="field" id="field-pwd" style="display:none;"><label class="field-label">密码</label>
        <div style="position:relative;"><input class="input" id="password" type="password" placeholder="请输入密码" style="width:100%;padding-right:46px;" value="engchain123"><button type="button" id="pwd-toggle" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:16px;padding:10px 8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;" onclick="togglePwd()">👁</button></div>
      </div>

      <div class="f-flex" style="align-items:center;gap:6px;margin:12px 0 20px;">
        <input type="checkbox" id="agree" checked style="width:16px;height:16px;">
        <label for="agree" class="text-3 fs-12">已阅读并同意 <a href="../agreement/user.html" class="link-green">《用户协议》</a> 与 <a href="../agreement/privacy.html" class="link-green">《隐私政策》</a></label>
      </div>

      <button class="btn btn-primary btn-block btn-lg" onclick="login()">登录 / 注册</button>
      <p class="auth-lock"><svg class="ic" style="width:13px;height:13px;vertical-align:-2px;margin-right:3px;color:var(--success);"><use href="#i-lock"/></svg>信息加密传输 · 安全登录</p>
    </div>
  </div>
</div>

<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function(){window.__ROOT__='../../';
document.querySelectorAll('.ft').forEach(function(el){el.onclick=function(){document.querySelectorAll('.ft').forEach(function(x){x.classList.remove('is-on')});el.classList.add('is-on');var mode=el.getAttribute('data-mode');var fc=document.getElementById('field-code');var fp=document.getElementById('field-pwd');if(mode==='pwd'){if(fc)fc.style.display='none';if(fp)fp.style.display='';}else{if(fc)fc.style.display='';if(fp)fp.style.display='none';}};});
window.sendCode=function(){UI.toast('验证码已发送','ok');};
window.togglePwd=function(){var p=document.getElementById('password');var b=document.getElementById('pwd-toggle');if(!p)return;p.type=p.type==='password'?'text':'password';if(b)b.textContent=p.type==='password'?'👁':'🙈';};

/* ---- 历史登录渲染：读取用户表 + 登录历史 → 一键切换 ---- */
function renderHist(){
  if(!window.DataBus) return;
  var hist=DataBus.history(), users=DataBus.users(), i, list=[];
  for(i=0;i<hist.length;i++){for(var j=0;j<users.length;j++){if(users[j].id===hist[i]){list.push(users[j]);break;}}}
  var cur=DataBus.current();
  if(!list.length) return;
  document.getElementById('auth-hist').style.display='';
  document.getElementById('hist-list').innerHTML=list.map(function(u){
    var on=(cur&&cur.id===u.id)?' on':'';
    return '<button type="button" class="hist-item'+on+'" data-id="'+u.id+'">'+
      '<span class="hi-av">'+u.avatar+'</span>'+
      '<span class="hi-m"><span class="hi-n">'+u.name+'</span><span class="hi-c">'+(u.company||u.tag)+'</span></span>'+
      '<span class="hi-tag">'+u.tag+'</span></button>';
  }).join('');
}
document.getElementById('hist-list').addEventListener('click',function(e){
  var b=e.target.closest('.hist-item'); if(!b) return;
  if(!document.getElementById('agree').checked){UI.toast('请先同意用户协议','warn');return;}
  var u=DataBus.login(b.dataset.id);
  if(u){if(u.banned){UI.toast('该账号已被封禁','err');setTimeout(function(){location.href='banned.html';},800);}else{UI.toast('已切换账号：'+u.name,'ok');setTimeout(function(){location.href='../../home.html';},800);}}
  else UI.toast('账号不存在','err');
});
window.login=function(){if(!document.getElementById('agree').checked){UI.toast('请先同意用户协议','warn');return;}
  var phone=document.getElementById('phone').value.trim();var st=UI.state.get();
  try{UI.state.set({loggedIn:true,account:phone||st.account||'demo@engchain.cn',status:'registered',member:false});}catch(e){}
  if(window.DataBus) DataBus.audit('登录','账号',phone||'新账号','手动登录（注册会员演示）');
  UI.toast('登录成功','ok');setTimeout(function(){location.href='../../home.html';},800);};
renderHist();
})();
</script>
<style>.auth-bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(201,169,97,.14),transparent 60%),var(--bg);pointer-events:none}.auth-wrap{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:32px 16px}.auth-brand{text-align:center;margin-bottom:34px}.auth-logo{width:64px;height:64px;border-radius:19px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(201,169,97,.28),0 1px 0 rgba(255,255,255,.5) inset}.auth-title{font-weight:700;font-size:18px;letter-spacing:.02em}.auth-sub{font-size:12px;color:var(--text-3);margin-top:4px}.auth-form{background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow-card)}.f-tabs{display:flex;gap:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}.ft{padding-bottom:10px;font-size:15px;color:var(--text-3);position:relative}.ft.is-on{color:var(--text-1);font-weight:600}.ft.is-on::after{content:'';position:absolute;left:50%;translate:-50%;bottom:-1px;width:40px;height:2px;background:var(--primary)}.auth-lock{text-align:center;font-size:11px;color:var(--text-3);margin-top:18px}
.auth-hist{margin:0 0 14px}.hist-title{font-size:12px;color:var(--text-3);margin-bottom:9px;letter-spacing:.03em}.hist-list{display:flex;flex-direction:column;gap:7px}.hist-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;background:var(--bg-card);border:1px solid var(--line);border-radius:14px;text-align:left;cursor:pointer}.hist-item.on{border-color:var(--primary);background:linear-gradient(135deg,rgba(201,169,97,.10),transparent 65%)}.hi-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}.hi-m{flex:1;min-width:0;display:flex;flex-direction:column}.hi-n{font-size:13.5px;font-weight:600;color:var(--text-1)}.hi-c{font-size:10.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hi-tag{flex:none;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(201,169,97,.14);color:var(--primary-dim);font-weight:600;white-space:nowrap}</style>
</body>
</html>
