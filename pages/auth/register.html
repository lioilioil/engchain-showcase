<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/auth/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>注册 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  .field-err{min-height:0;font-size:12px;color:var(--danger,#e8564f);margin-top:4px;line-height:1.4;display:none;}
  .field.has-error .input{border-color:var(--danger,#e8564f);}
  .pwd-wrap{position:relative;}
  .pwd-wrap .input{padding-right:56px;}
  .pwd-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text-3);font-size:12px;cursor:pointer;padding:8px 4px;line-height:1;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">注册</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding:8px 16px;">
    <div style="text-align:center;padding:10px 0 20px;">
      <div class="fw-700 fs-title">创建工程链账号</div>
      <div class="text-3 fs-12" style="margin-top:4px;">一分钟注册，开启供需匹配</div>
    </div>

    <div class="field"><label class="field-label">手机号</label><input class="input" id="phone" inputmode="numeric" placeholder="请输入手机号" maxlength="11" value="13800008866"><div class="field-err" id="err-phone"></div></div>
    <div class="field"><label class="field-label">验证码</label>
      <div class="f-flex" style="gap:10px;"><input class="input" id="sms" inputmode="numeric" placeholder="请输入验证码" maxlength="6" value="123456"><button class="btn btn-ghost" type="button" style="white-space:nowrap;flex:none;" onclick="sendSms(this)">获取验证码</button></div>
      <div class="field-err" id="err-sms"></div>
    </div>
    <div class="field"><label class="field-label">设置密码</label>
      <div class="pwd-wrap"><input class="input" id="pwd" type="password" placeholder="6-20位，含字母和数字" value="abc123456"><button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示密码">显示</button></div>
      <div class="field-err" id="err-pwd"></div>
    </div>
    <div class="field"><label class="field-label">邀请码（选填）</label><input class="input" id="invite" placeholder="填写好友邀请码，双方各得积分"></div>
    <div class="field"><label class="field-label">你的身份</label>
      <div style="font-size:12px;color:var(--text-2);line-height:1.7;margin-top:2px;">供需一体账号：注册后既是需方也是供方，可随时发布需求或供应，无需切换身份。</div>
    </div>

    <div class="f-flex" style="align-items:center;gap:6px;margin:12px 0 18px;">
      <input type="checkbox" id="agree" checked style="width:16px;height:16px;">
      <label for="agree" class="text-3 fs-12">已阅读并同意 <a href="../agreement/user.html" class="link-green">《用户协议》</a> 与 <a href="../agreement/privacy.html" class="link-green">《隐私政策》</a></label>
    </div>

    <button class="btn btn-primary btn-block btn-lg" onclick="reg()">注册</button>
    <div class="text-3 fs-12" style="text-align:center;margin-top:16px;">已有账号？<a href="login.html" class="link-green fw-600">去登录</a></div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script>
(function(){window.__ROOT__='../../';
/* 海报/链接带来的邀请码自动回填 */
try{var qs=new URLSearchParams(location.search);var ic=qs.get('invite');if(ic){var inp=document.getElementById('invite');inp.value=ic.toUpperCase();}}catch(e){}

/* ---- P0 表单校验：字段级错误提示 ---- */
function setErr(field,msg){
  var box=document.getElementById('err-'+field);
  var input=document.getElementById(field);
  if(box){box.textContent=msg||'';box.style.display=msg?'block':'none';}
  if(input&&input.closest('.field'))input.closest('.field').classList.toggle('has-error',!!msg);
}
function valPhone(){var v=document.getElementById('phone').value.trim();
  if(!v){setErr('phone','请输入手机号');return null;}
  if(!/^1[3-9]\d{9}$/.test(v)){setErr('phone','手机号格式不正确，需11位大陆手机号');return null;}
  setErr('phone','');return v;}
function valSms(){var v=document.getElementById('sms').value.trim();
  if(!v){setErr('sms','请输入短信验证码');return null;}
  if(!/^\d{6}$/.test(v)){setErr('sms','验证码为6位数字');return null;}
  setErr('sms','');return v;}
function valPwd(){var v=document.getElementById('pwd').value;
  if(!v){setErr('pwd','请设置密码');return null;}
  if(v.length<6||v.length>20){setErr('pwd','密码长度需为6-20位');return null;}
  if(!(/[A-Za-z]/.test(v)&&/\d/.test(v))){setErr('pwd','密码需同时包含字母和数字');return null;}
  setErr('pwd','');return v;}

/* 输入时即时清除该字段错误 */
[['phone',valPhone],['sms',valSms],['pwd',valPwd]].forEach(function(p){
  var el=document.getElementById(p[0]);
  if(el)el.addEventListener('input',function(){p[1]();});
});

/* 密码显隐切换（UX-150） */
(function(){
  var pwd=document.getElementById('pwd'),tg=document.getElementById('pwdToggle');
  if(tg)tg.addEventListener('click',function(){
    var show=pwd.type==='password';pwd.type=show?'text':'password';tg.textContent=show?'隐藏':'显示';
  });
})();

/* 获取验证码：倒计时（仅前端演示，不发请求） */
window.sendSms=function(btn){
  var v=valPhone();if(!v)return;
  var s=60;btn.disabled=true;var old=btn.textContent;
  var t=setInterval(function(){btn.textContent=s+'s 后重发';if(--s<0){clearInterval(t);btn.disabled=false;btn.textContent=old;}},1000);
  UI.toast('验证码已发送至 '+v,'ok');
};

window.reg=function(){
  var phone=valPhone();var sms=valSms();var pwd=valPwd();
  var agree=document.getElementById('agree');
  if(!agree.checked){UI.toast('请先阅读并同意用户协议与隐私政策','warn');return;}
  if(!phone||!sms||!pwd)return;   /* 任一字段不通过：不弹成功 toast，聚焦首个错误 */
  var st=UI.state.get();
  /* 新账号落用户表并登录，保证后续邀请关系/返佣挂到稳定 uid */
  var nu=null;
  try{nu=Domain.provisionUser(phone||st.account||('demo'+Date.now()));DataBus.login(nu.id);}catch(e){}
  var uid=nu?nu.id:'';
  try{UI.state.set({loggedIn:true,account:phone||st.account||'demo@engchain.cn'});}catch(e){}
  /* 注册礼 +50（claim 防重）；填写邀请码：①建立 L1/L2 分销关系 ②双方积分奖励 */
  try{
    var cfg=(MOCK.business.credits&&MOCK.business.credits.rewards)||{};
    CreditStore.claim('register', cfg.register||50, '注册礼');
    /* D5：破冰期注册赠送 +3 条免费解锁额度（动态叠加在 freeQuota.monthly 之上），发系统消息提示 */
    if(window.ModeStore&&ModeStore.isBreakIn()&&window.DataBus&&DataBus.publishMessage){
      var bonus=((MOCK.business.breakin||{}).registerBonus)||3;
      DataBus.publishMessage({type:'活动',title:'破冰期注册福利',body:'注册即赠 '+bonus+' 条免费解锁额度（本月共 '+(5+bonus)+' 条），可在供需详情页免费查看完整联系方式。',target:'全部用户'});
    }
    var code=document.getElementById('invite').value.trim();
    if(code&&window.Referral){
      var rb=Referral.bind(code,uid,'register');
      if(rb.error){UI.toast('邀请码未生效：'+rb.error,'warn');}
      else{try{CreditStore.inviteReward(code);}catch(e){}}
    }
  }catch(e){}
  UI.toast('注册成功','ok');setTimeout(function(){location.href='../../home.html';},800);};
})();
</script>
</body>
</html>
