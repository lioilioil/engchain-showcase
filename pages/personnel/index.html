  /* ===== 渲染筛选面板 ===== */
  function renderFilterPanel() {
    var dims = FILTER_DIMS[currentTab];
    var body = document.getElementById('filterBody');
    body.innerHTML = dims.map(function (dim) {
      var tags = dim.options.map(function (opt) {
        var selected = tempFilters[dim.key] === opt;
        var disabled = '';
        if (dim.key === 'certLevel' || dim.key === 'certMajor') {
          var selType = tempFilters.certType;
          if (selType && CERT_CONFIG[selType]) {
            var applicable = dim.key === 'certLevel' ? CERT_CONFIG[selType].levels : CERT_CONFIG[selType].majors;
            if (applicable.indexOf(opt) === -1) disabled = ' disabled';
          }
        }
        return '<div class="fs-tag' + (selected ? ' selected' : '') + disabled + '" data-key="' + dim.key + '" data-val="' + opt + '">' + opt + '</div>';
      }).join('');
      return '<div class="fs-group"><div class="fs-group-title">' + dim.label + '</div><div class="fs-tags">' + tags + '</div></div>';
    }).join('');
    body.querySelectorAll('.fs-tag').forEach(function (el) {
      el.addEventListener('click', function () {
        if (el.classList.contains('disabled')) return;
        var key = el.dataset.key;
        var val = el.dataset.val;
        if (tempFilters[key] === val) delete tempFilters[key];
        else tempFilters[key] = val;
        /* 切换证书类型时，自动清理不适用的等级/专业筛选 */
        if (key === 'certType' && tempFilters.certType) {
          var cfg = CERT_CONFIG[tempFilters.certType];
          if (cfg) {
            if (tempFilters.certLevel && cfg.levels.indexOf(tempFilters.certLevel) === -1) delete tempFilters.certLevel;
            if (tempFilters.certMajor && cfg.majors.indexOf(tempFilters.certMajor) === -1) delete tempFilters.certMajor;
          }
        }
        renderFilterPanel();
      });
    });
    /* 更新已选条件预览 */
    var selectedArea = document.getElementById('filterSelected');
    var selectedTags = document.getElementById('filterSelectedTags');
    var selectedKeys = Object.keys(tempFilters);
    if (selectedKeys.length === 0) {
      selectedArea.style.display = 'none';
    } else {
      selectedArea.style.display = 'flex';
      selectedTags.innerHTML = selectedKeys.map(function (k) {
        var dim = dims.find(function (d) { return d.key === k; });
        var label = dim ? dim.label : k;
        var val = tempFilters[k];
        return '<span class="fsl-tag" data-key="' + k + '">' + label + '：' + val + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>';
      }).join('');
      selectedTags.querySelectorAll('.fsl-tag').forEach(function (tag) {
        tag.addEventListener('click', function () {
          var k = tag.dataset.key;
          delete tempFilters[k];
          renderFilterPanel();
        });
      });
    }
  }

  var scrollEl = document.querySelector('.scroll');

  function checkSticky() {
    if (!stickyBar || !scrollEl) return;
    var sr = scrollEl.getBoundingClientRect();
    var br = stickyBar.getBoundingClientRect();
    if (br.top <= sr.top + 2) stickyBar.classList.add('is-stuck');
    else stickyBar.classList.remove('is-stuck');
  }
  if (scrollEl) scrollEl.addEventListener('scroll', checkSticky);
  window.addEventListener('resize', checkSticky);
  /* 兜底：轮询检测（部分环境 scroll 事件/rAF 不可靠） */
  setInterval(checkSticky, 150);
  setTimeout(checkSticky, 100);

  /* ===== 统一滚动到吸顶栏 ===== */
  function scrollToSticky() {
    if (scrollEl && stickyBar) {
      var barRect = stickyBar.getBoundingClientRect();
      var scrollRect = scrollEl.getBoundingClientRect();
      scrollEl.scrollBy({ top: barRect.top - scrollRect.top, behavior: 'smooth' });
      setTimeout(checkSticky, 300);
    }
  }

  /* ===== 最小高度保障 ===== */
  function ensureMinScrollHeight() {
    var spacer = document.getElementById('listSpacer');
    if (!spacer || !stickyBar || !scrollEl) return;
    var barTop = stickyBar.offsetTop;
    var barH = stickyBar.offsetHeight;
    spacer.style.minHeight = '0';
    var needed = barTop + barH + scrollEl.clientHeight;
    var current = scrollEl.scrollHeight;
    if (current < needed) spacer.style.minHeight = (needed - current + 30) + 'px';
    else spacer.style.minHeight = '0';
  }

    /* 预填姓名和电话 */

    try{
      var auth = window.AuthStore ? AuthStore.read() : {};
      if(auth.realname && auth.realname.name) preName = auth.realname.name;
      if(auth.realname && auth.realname.mobile) prePhone = auth.realname.mobile;
      if(auth.personalEntry && auth.personalEntry.profile && auth.personalEntry.profile.basic){
        if(auth.personalEntry.profile.basic.mobile) prePhone = auth.personalEntry.profile.basic.mobile;
      }
    }catch(e){}
    var sh = UI.sheet();
    sh.setText('投递简历 · ' + (jobTitle||'').substring(0,20));
    sh.html('<div style="padding:6px 2px 14px;">'+
      '<div style="font-size:12px;color:var(--text-2);margin-bottom:12px;">投递后企业将在24小时内查看，感兴趣后平台为您对接联系方式</div>'+
      '<input id="lp-name" placeholder="姓名 *" class="sheet-input" value="'+escHtml(preName)+'">'+
      '<input id="lp-phone" placeholder="联系电话 *" class="sheet-input" style="margin-top:10px;" value="'+escHtml(prePhone)+'">'+
      '<textarea id="lp-msg" rows="3" placeholder="自我介绍（选填）" class="sheet-textarea" style="margin-top:10px;"></textarea>'+
      '<div style="padding:8px 10px;background:rgba(43,107,79,.06);border:1px solid rgba(43,107,79,.15);border-radius:8px;margin-top:10px;"><div style="font-size:10.5px;color:var(--text-2);line-height:1.5;"><b style="color:var(--success);">隐私保护：</b>您的联系方式仅在企业确认感兴趣后由平台对接</div></div>'+
      '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="confirmListApply(\''+jobId+'\',\''+escHtml(jobTitle)+'\',\''+escHtml(company)+'\')">提交投递</button>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="UI.closeSheet()">取消</button></div>');
    sh.show();
  }
  function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  window.confirmListApply = function(jobId, jobTitle, company){
    var name = (document.getElementById('lp-name')||{}).value.trim();
    var phone = (document.getElementById('lp-phone')||{}).value.trim();
    var msg = (document.getElementById('lp-msg')||{}).value.trim();
    if(!name){ UI.toast('请输入姓名','warn'); return; }
    if(!phone || !/^1\d{10}$/.test(phone)){ UI.toast('请输入正确的手机号','warn'); return; }
    try{
      if(window.ApplyStore){
        ApplyStore.add({
          jobId: jobId, jobTitle: jobTitle, company: company,
          resumeSnapshot: { name: name, phone: phone },
          applyMsg: msg, status: 'pending'
        });
      }
    }catch(e){ console.warn('apply error', e); }
    UI.closeSheet();
    UI.toast('投递成功，企业将尽快与您联系','ok');
    /* 更新当前卡片按钮状态 */
    var cards = document.querySelectorAll('#fullList .job-card');
    cards.forEach(function(card){
      var href = card.getAttribute('href') || '';
      var id = href.indexOf('id=') > -1 ? href.split('id=')[1] : '';
      if(id === jobId){
        var btn = card.querySelector('.card-deliver-btn');
        if(btn){ btn.textContent = '已投递'; btn.style.opacity = '0.6'; btn.style.cursor = 'default'; btn.onclick = null; }
      }
    });
  };
  /* E2-11：按身份动态切换引导 CTA（未注册→去登录 / 已注册未实名→去实名 / 其余→去完善简历） */
  var deliverCtaHref = '../profile/auth-qualification.html?mode=edit';
  function setupDeliverCta(result){
    var btn = document.getElementById('deliverGoEdit');
    var loggedIn = false;
    try { var me = window.DataBus && DataBus.current(); loggedIn = !!(me && me.id); } catch(e){}
    var rnOk = false;
    try { var rn = window.AuthStore ? AuthStore.read().realname : null; rnOk = !!(rn && rn.ok); } catch(e){}
    var label, href;
    if(!loggedIn){ label='去登录'; href='../auth/login.html'; }
    else if(!rnOk){ label='去实名'; href='../profile/auth-personal.html'; }
    else { label='去完善简历'; href='../profile/auth-qualification.html?mode=edit'; }
    deliverCtaHref = href;
    if(btn) btn.textContent = label;
  }
  function openDeliverModal(){
    document.getElementById('deliverMask').classList.add('show');
    document.getElementById('deliverModal').classList.add('show');
  }
  function closeDeliverModal(){
    document.getElementById('deliverMask').classList.remove('show');
    document.getElementById('deliverModal').classList.remove('show');
  }
  document.getElementById('deliverMask').addEventListener('click', closeDeliverModal);
  document.getElementById('deliverCancel').addEventListener('click', closeDeliverModal);
  document.getElementById('deliverGoEdit').addEventListener('click', function(){
    closeDeliverModal();
    location.href = deliverCtaHref;
  });
  /* ESC键关闭 */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' || e.keyCode === 27){
      if(document.getElementById('deliverModal').classList.contains('show')){
        closeDeliverModal();
      }
    }
  });

  /* v3.1: 向渲染后的job-card注入投递按钮 */
  function injectDeliverButtons(){
    if(currentTab !== 'enterprise') return;
    var cards = document.querySelectorAll('#fullList .job-card');
    cards.forEach(function(card){
      if(card.querySelector('.card-deliver-btn')) return;
      var href = card.getAttribute('href') || '';
      var id = href.indexOf('id=') > -1 ? href.split('id=')[1] : '';
      var btn = document.createElement('button');
      btn.className = 'card-deliver-btn';
      /* 阶段三：已投递的岗位显示已投递状态 */
      var applied = window.ApplyStore && ApplyStore.hasApplied(id);
      if(applied){
        btn.textContent = '已投递';
        btn.style.opacity = '0.6';
        btn.style.cursor = 'default';
      } else {
        btn.textContent = '投递简历';
        btn.setAttribute('data-id', id);
        btn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          checkAndDeliver(id);
        };
      }
      card.appendChild(btn);
    });
  }

  /* ===== 初始化 ===== */
  if (currentTab === 'talent') {
    document.querySelectorAll('#tabBar .tab-item').forEach(function (x) { x.classList.toggle('active', x.dataset.tab === 'talent'); });
    var _lt = document.getElementById('listTitle'); if (_lt) _lt.textContent = '全部持证人才';
    var _dt = document.getElementById('delegateTitle'); if (_dt) _dt.textContent = '找不到合适的岗位？委托顾问匹配';
    var _dd = document.getElementById('delegateDesc'); if (_dd) _dd.textContent = '人才免费委托，平台匹配合适企业';
  }
  renderCatBar();
  renderSortTabs();
  renderHot();
  renderList();
  /* E2-12：完成实名/入驻后，投递按钮状态即时刷新 */
  window.addEventListener('engchain:auth', function(){ injectDeliverButtons(); });
  window.addEventListener('engchain:entry', function(){ injectDeliverButtons(); });
})();
</script>
</body>
</html>
