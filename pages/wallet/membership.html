<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>年度会员 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* [FEAT 9.2-1] 年度解锁会员订阅页 */
  .mem-hero {
    margin: 12px 14px;
    padding: 22px 18px 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2A2318 0%, #3D3220 45%, #4A3A22 100%);
    position: relative; overflow: hidden;
    box-shadow: 0 8px 24px rgba(42,35,24,.25);
  }
  .mem-hero::after {
    content:''; position:absolute; top:-50px; right:-50px; width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, rgba(212,175,55,.2) 0%, transparent 70%);
  }
  .mem-tag { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px;
    background: rgba(212,175,55,.18); color:#E8C97A; font-size:11px; font-weight:600; }
  .mem-name { font-size:20px; font-weight:800; color:#F0D9A0; margin-top:10px; }
  .mem-price { margin-top:8px; display:flex; align-items:baseline; gap:6px; }
  .mem-price .cur { font-size:15px; color:#C9B27E; font-weight:600; }
  .mem-price .num { font-size:38px; font-weight:800; color:#F0D9A0; font-family:var(--font-num); letter-spacing:-.02em; }
  .mem-price .cycle { font-size:12px; color:rgba(255,255,255,.5); }
  .mem-expire { margin-top:12px; font-size:12px; color:rgba(255,255,255,.65); position:relative; z-index:1; }
  .mem-expire b { color:#F0D9A0; font-weight:600; }

  .mem-sec { margin: 0 14px 14px; }
  .mem-sec-title { font-size:13px; font-weight:700; color:var(--text-1); margin:0 2px 8px; display:flex; align-items:center; gap:6px; }
  .mem-sec-title::before { content:''; width:3px; height:13px; border-radius:2px; background:var(--primary); }
  .mem-card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .mem-benefit { display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .mem-benefit:last-child { border-bottom:none; }
  .mem-benefit-ic { width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
    background:rgba(212,175,55,.12); color:var(--primary-dim); }
  .mem-benefit-ic svg { width:17px; height:17px; }
  .mem-benefit-name { font-size:13.5px; font-weight:600; color:var(--text-1); }
  .mem-benefit-desc { font-size:11px; color:var(--text-3); margin-top:2px; }
  .mem-note { font-size:11px; color:var(--text-3); line-height:1.7; padding:13px 14px; }
  .mem-note b { color:var(--text-1); font-weight:600; }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">年度解锁会员</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:12px;padding-bottom:120px;">
    <!-- 会员 Hero -->
    <div class="mem-hero">
      <span class="mem-tag">★ 年度会员</span>
      <div class="mem-name" id="mem-name">年度解锁会员</div>
      <div class="mem-price">
        <span class="cur">¥</span><span class="num" id="mem-price">999</span><span class="cycle">/ 年</span>
      </div>
      <div class="mem-expire" id="mem-expire"></div>
    </div>

    <!-- 会员权益 -->
    <div class="mem-sec">
      <div class="mem-sec-title">会员专属权益</div>
      <div class="mem-card" id="mem-benefits"></div>
    </div>

    <!-- 开通说明 -->
    <div class="mem-sec">
      <div class="mem-sec-title">开通说明</div>
      <div class="mem-card">
        <div class="mem-note">
          <b>付费方式：</b>从钱包可用余额扣减，即时生效。<br>
          <b>有效期：</b>自支付成功之日起 365 天，到期前续费在原到期日上顺延一年。<br>
          <b>折扣说明：</b>会员期内解锁信息积分折扣自动提升至 0.5x，与入驻折扣叠加取最优。<br>
          <b>退款：</b>开通后 7 天内未使用会员权益可申请全额退款，详见会员协议。
        </div>
      </div>
    </div>
  </div>

  <!-- 底部固定按钮 -->
  <div class="fixed-cta">
    <button class="btn btn-primary btn-block btn-lg" id="mem-cta" onclick="doSubscribe()">立即开通</button>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
(function(){
window.__ROOT__='../../';
/* [FEAT 9.2-1] 年度解锁会员：展示权益/价格，购买走 BalanceStore.consume + MemberStore.subscribe */
var cfg = (MOCK.business.membership && MOCK.business.membership.membershipAnnual) || {
  price: 999, cycle: 'year', label: '年度解锁会员',
  benefits: ['全部详情免费解锁', '积分折扣提升至0.5x', '专属标识', '优先客服']
};

function fmtDate(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function render() {
  document.getElementById('mem-name').textContent = cfg.label || '年度解锁会员';
  document.getElementById('mem-price').textContent = cfg.price;
  /* 权益列表 */
  var icons = ['i-eye', 'i-tag', 'i-award', 'i-chat'];
  var benefits = cfg.benefits || [];
  document.getElementById('mem-benefits').innerHTML = benefits.map(function (b, i) {
    var parts = b.split('，');
    var name = b, desc = '';
    var idx = b.indexOf('：');
    if (idx > 0) { name = b.slice(0, idx); desc = b.slice(idx + 1); }
    else if (parts.length > 1) { name = parts[0]; desc = parts.slice(1).join('，'); }
    return '<div class="mem-benefit">' +
      '<div class="mem-benefit-ic"><svg class="ic"><use href="#' + (icons[i % icons.length]) + '"/></svg></div>' +
      '<div><div class="mem-benefit-name">' + name + '</div>' +
      (desc ? '<div class="mem-benefit-desc">' + desc + '</div>' : '') + '</div>' +
    '</div>';
  }).join('');
  /* 状态 */
  var active = MemberStore.isActive();
  var s = MemberStore.read();
  var expireEl = document.getElementById('mem-expire');
  var cta = document.getElementById('mem-cta');
  if (active) {
    expireEl.innerHTML = '会员生效中 · 到期时间 <b>' + fmtDate(s.expireAt) + '</b>';
    cta.textContent = '立即续费（再享一年）';
  } else if (s.expireAt) {
    expireEl.innerHTML = '会员已过期（' + fmtDate(s.expireAt) + '），续费后恢复权益';
    cta.textContent = '续费 ¥' + cfg.price + ' · 再享一年';
  } else {
    expireEl.innerHTML = '开通后立即生效 · 有效期 365 天';
    cta.textContent = '立即开通 ¥' + cfg.price + '/年';
  }
}

window.doSubscribe = function () {
  var price = Math.round((cfg.price || 999) * 100) / 100;
  if (BalanceStore.available() < price) {
    UI.dialog({
      title: '余额不足',
      text: '开通年度会员需 <b>¥' + price.toLocaleString() + '</b>，当前可用余额 <b>¥' + BalanceStore.available().toLocaleString() + '</b>。请先充值。',
      ok: '去充值', cancel: '再想想',
      onOk: function () { location.href = 'recharge.html'; }
    });
    return;
  }
  UI.dialog({
    title: MemberStore.isActive() ? '续费年度会员' : '开通年度解锁会员',
    text: '将从可用余额扣减 <b>¥' + price.toLocaleString() + '</b>' + (MemberStore.isActive() ? '，有效期在原到期日上顺延一年。' : '，开通后全部详情免费解锁，积分折扣提升至 0.5x。'),
    ok: '确认支付', cancel: '再想想',
    onOk: function () {
      var r = MemberStore.subscribe('annual');
      if (r && r.ok) {
        UI.toast('会员开通成功 · 到期 ' + fmtDate(r.expireAt), 'ok');
        render();
      } else {
        UI.toast('开通失败，请稍后重试', 'warn');
      }
    }
  });
};

render();
window.addEventListener('engchain:member', render);
window.addEventListener('engchain:balance', render);
})();
</script>
</body>
</html>
