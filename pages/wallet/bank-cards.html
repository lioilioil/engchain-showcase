<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>银行卡管理 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  .bc-card { border:1px solid var(--line); border-radius:14px; background:var(--bg-card); padding:14px 16px; margin-bottom:10px; position:relative; }
  .bc-card.is-default { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset; }
  .bc-bank { font-size:15px; font-weight:700; color:var(--text-1); }
  .bc-no { font-family:var(--font-num); font-size:13px; color:var(--text-2); letter-spacing:.08em; margin-top:4px; }
  .bc-meta { font-size:11px; color:var(--text-3); margin-top:6px; }
  .bc-actions { display:flex; gap:8px; margin-top:10px; }
  .bc-tag { position:absolute; top:12px; right:14px; font-size:10px; font-weight:700; color:var(--primary-dim); background:var(--primary-soft); padding:2px 8px; border-radius:99px; }
  .bc-empty { text-align:center; padding:40px 20px; color:var(--text-3); }
</style>
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">银行卡管理</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:10px;">
    <div id="bc-list"></div>

    <div class="section-title" style="margin-top:18px;"><div class="st-left">添加银行卡</div></div>
    <div class="card" style="padding:16px 14px;">
      <div class="field"><label class="field-label">开户银行 <span class="req">*</span></label>
        <input class="input" id="bc-bank" placeholder="如：中国建设银行">
      </div>
      <div class="field"><label class="field-label">银行卡号 <span class="req">*</span></label>
        <input class="input" id="bc-no" placeholder="请输入卡号" inputmode="numeric">
      </div>
      <div class="field"><label class="field-label">持卡人 <span class="req">*</span></label>
        <input class="input" id="bc-holder" placeholder="与开户一致的姓名">
      </div>
      <div class="field"><label class="field-label">预留手机号 <span class="req">*</span></label>
        <input class="input" id="bc-phone" placeholder="银行预留手机号" inputmode="tel">
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="bc-add" style="margin-top:6px;">添加银行卡</button>
    </div>
    <div style="height:40px;"></div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';
  var KEY = 'engchain-bank-cards';
  function load() { try { var a = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function save(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
  function mask(no) { var s = String(no || '').replace(/\s/g, ''); return s.length > 4 ? s.slice(-4) : s; }
  function fmtNo(no) { var s = String(no || '').replace(/\s/g, ''); return s.replace(/(\d{4})(?=\d)/g, '$1 '); }

  function render() {
    var list = load();
    var box = document.getElementById('bc-list');
    if (!list.length) {
      box.innerHTML = '<div class="bc-empty"><svg class="ic" style="width:44px;height:44px;color:var(--text-3);opacity:.5;margin-bottom:10px;"><use href="#i-bank"/></svg>' +
        '<div class="fs-13" style="margin-bottom:4px;">暂未绑定银行卡</div>' +
        '<div class="fs-11">添加后可用于提现到账</div></div>';
      return;
    }
    box.innerHTML = list.map(function (c) {
      return '<div class="bc-card' + (c.isDefault ? ' is-default' : '') + '">' +
        (c.isDefault ? '<span class="bc-tag">默认卡</span>' : '') +
        '<div class="bc-bank">' + esc(c.bank) + '</div>' +
        '<div class="bc-no">**** **** **** ' + esc(mask(c.cardNo)) + '</div>' +
        '<div class="bc-meta">' + esc(c.holder || '') + ' · 尾号 ' + esc(mask(c.cardNo)) + '</div>' +
        '<div class="bc-actions">' +
          (c.isDefault ? '' : '<button class="tx-btn tx-btn--primary" onclick="setDefault(\'' + c.id + '\')">设为默认</button>') +
          '<button class="tx-btn" style="color:var(--danger);" onclick="removeCard(\'' + c.id + '\')">删除</button>' +
        '</div></div>';
    }).join('');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  window.setDefault = function (id) {
    var a = load();
    a.forEach(function (c) { c.isDefault = (c.id === id); });
    save(a); render(); UI.toast('已设为默认银行卡', 'ok');
  };
  window.removeCard = function (id) {
    UI.dialog({
      title: '删除银行卡', text: '确定删除该银行卡吗？', ok: '删除', cancel: '取消', danger: true,
      onOk: function () {
        var a = load().filter(function (c) { return c.id !== id; });
        if (a.length && !a.some(function (c) { return c.isDefault; })) a[0].isDefault = true;
        save(a); render(); UI.toast('已删除', 'ok');
      }
    });
  };

  document.getElementById('bc-add').onclick = function () {
    var bank = document.getElementById('bc-bank').value.trim();
    var no = document.getElementById('bc-no').value.replace(/\s/g, '');
    var holder = document.getElementById('bc-holder').value.trim();
    var phone = document.getElementById('bc-phone').value.trim();
    if (!bank) { UI.toast('请填写开户银行', 'warn'); return; }
    if (!/^\d{12,25}$/.test(no)) { UI.toast('请填写正确的银行卡号（12-25 位数字）', 'warn'); return; }
    if (!holder) { UI.toast('请填写持卡人姓名', 'warn'); return; }
    if (!/^\d{11}$/.test(phone)) { UI.toast('请填写正确的 11 位手机号', 'warn'); return; }
    var a = load();
    var card = { id: 'BC' + Date.now(), bank: bank, cardNo: no, holder: holder, phone: phone, isDefault: a.length === 0 };
    a.push(card);
    save(a);
    ['bc-bank','bc-no','bc-holder','bc-phone'].forEach(function (id) { document.getElementById(id).value = ''; });
    render(); UI.toast('银行卡添加成功', 'ok');
  };

  render();
})();
</script>
</body>
</html>
