<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>解锁记录 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  .ur-page { background: var(--bg); min-height: 100vh; }
  .ur-stats { display: flex; margin: 12px 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px 4px; }
  .ur-stat { flex: 1; text-align: center; }
  .ur-stat + .ur-stat { border-left: 1px solid var(--line); }
  .ur-stat-val { font-family: var(--font-num); font-size: 18px; font-weight: 700; color: var(--text-1); }
  .ur-stat-val.gold { color: var(--primary-dim); }
  .ur-stat-val.green { color: var(--success); }
  .ur-stat-label { font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .ur-card { margin: 0 14px 10px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .ur-card:active { transform: scale(.985); }
  .ur-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .ur-card-title { font-size: 14px; font-weight: 600; color: var(--text-1); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ur-card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); margin-bottom: 8px; flex-wrap: wrap; }
  .ur-card-foot { display: flex; align-items: center; justify-content: space-between; }
  .ur-contact { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .ur-contact svg { width: 13px; height: 13px; color: var(--text-3); }
  .ur-amount { font-family: var(--font-num); font-weight: 700; font-size: 14px; }
  .ur-amount.credit { color: var(--danger); }
  .ur-amount.free { color: var(--primary-dim); }
  .ur-empty { text-align: center; padding: 60px 20px; color: var(--text-3); }
  .ur-empty svg { width: 48px; height: 48px; color: var(--line-strong); margin-bottom: 12px; }
</style>
</head>
<body>
<div class="phone">
  <div class="ur-page">
    <div class="navbar" style="height:50px;">
      <button class="nav-back" onclick="history.back()">‹</button>
      <div class="nav-title">解锁记录</div>
      <div class="nav-right"></div>
    </div>

    <div class="ur-stats">
      <div class="ur-stat"><div class="ur-stat-val" id="stat-total">0</div><div class="ur-stat-label">累计解锁</div></div>
      <div class="ur-stat"><div class="ur-stat-val gold" id="stat-credit">0</div><div class="ur-stat-label">积分消耗</div></div>
      <div class="ur-stat"><div class="ur-stat-val green" id="stat-free">0</div><div class="ur-stat-label">免费解锁</div></div>
    </div>

    <div class="seg" style="margin:0 14px 10px;">
      <span class="seg-item is-on" data-filter="all">全部</span>
      <span class="seg-item" data-filter="credit">积分解锁</span>
      <span class="seg-item" data-filter="free">免费解锁</span>
    </div>

    <div class="scroll" style="padding-bottom:100px;">
      <div id="ur-list"></div>
      <div class="ur-empty" id="ur-empty" style="display:none;">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-eye"/></svg>
        <div style="font-size:14px;margin-bottom:4px;">暂无解锁记录</div>
        <div style="font-size:11px;">去供需大厅发现商机，解锁详情对接资源</div>
        <a href="../supply/list.html" class="btn btn-primary btn-sm" style="margin-top:12px;">去发现</a>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
(function(){
  window.__ROOT__='../../';

  /* 模拟解锁记录数据（实际应从CreditStore.unlockLogs读取） */
  var UNLOCK_LOGS = [
    { id:'UL001', title:'成都地区C30混凝土供应', cat:'建材', dir:'供应', method:'credit', cost:10, time:'2026-09-04 14:32', contact:'张经理 138****8888', supplyId:'S001' },
    { id:'UL002', title:'高新区写字楼装修劳务班组', cat:'劳务', dir:'需求', method:'free', cost:0, time:'2026-09-03 10:15', contact:'李工 139****6666', supplyId:'S002' },
    { id:'UL003', title:'塔吊租赁（6012型）', cat:'设备', dir:'需求', method:'credit', cost:10, time:'2026-08-28 11:20', contact:'王总 137****2222', supplyId:'S003' },
    { id:'UL004', title:'建筑工程总承包资质转让', cat:'资质', dir:'供应', method:'credit', cost:30, time:'2026-08-25 16:45', contact:'陈经理 136****9999', supplyId:'S004' },
    { id:'UL005', title:'双流区钢结构加工厂合作', cat:'建材', dir:'需求', method:'free', cost:0, time:'2026-08-20 09:30', contact:'刘厂 135****1111', supplyId:'S005' },
    { id:'UL006', title:'市政道路工程运输车队', cat:'运输', dir:'供应', method:'credit', cost:10, time:'2026-08-15 14:00', contact:'赵队 133****3333', supplyId:'S006' }
  ];

  var currentFilter = 'all';

  function render() {
    var list = document.getElementById('ur-list');
    var empty = document.getElementById('ur-empty');
    var filtered = UNLOCK_LOGS.filter(function(r){
      if(currentFilter==='all') return true;
      return r.method === currentFilter;
    });

    /* 统计 */
    var total = UNLOCK_LOGS.length;
    var creditCost = UNLOCK_LOGS.reduce(function(s,r){ return s + (r.method==='credit'?r.cost:0); }, 0);
    var freeCount = UNLOCK_LOGS.filter(function(r){ return r.method==='free'; }).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-credit').textContent = creditCost + ' 分';
    document.getElementById('stat-free').textContent = freeCount;

    if(!filtered.length){
      list.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    list.innerHTML = filtered.map(function(r){
      var methodTag = r.method==='credit'
        ? '<span class="tag tag-danger" style="font-size:10px;">积分 -'+r.cost+'分</span>'
        : '<span class="tag tag-gold" style="font-size:10px;">免费</span>';
      var amtClass = r.method==='credit' ? 'credit' : 'free';
      var amtText = r.method==='credit' ? '-'+r.cost+' 分' : '免费';
      return '<div class="ur-card" onclick="location.href=\'../supply/detail.html?id='+r.supplyId+'\'">' +
        '<div class="ur-card-top">' +
          '<span class="tag '+(r.dir==='供应'?'tag-supply':'tag-demand')+'" style="font-size:10px;">'+r.dir+'</span>' +
          '<span class="tag tag-gray" style="font-size:10px;">'+r.cat+'</span>' +
          methodTag +
        '</div>' +
        '<div class="ur-card-title">'+r.title+'</div>' +
        '<div class="ur-card-meta"><span>'+r.time+'</span></div>' +
        '<div class="ur-card-foot">' +
          '<div class="ur-contact"><svg class="ic"><use href="#i-user"/></svg>'+r.contact+'</div>' +
          '<span class="ur-amount '+amtClass+'">'+amtText+'</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.querySelectorAll('.seg-item').forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll('.seg-item').forEach(function(x){x.classList.remove('is-on')});
      el.classList.add('is-on');
      currentFilter = el.getAttribute('data-filter');
      render();
    };
  });

  render();
})();
</script>
</body>
</html>
