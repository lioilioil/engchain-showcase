<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>解锁记录 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M8%201.2%2013.2%203.3v4.1c0%203.1-2.2%205.5-5.2%206.4-3-.9-5.2-3.3-5.2-6.4V3.3L8%201.2Z%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.3%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%226.55%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3Cellipse%20cx%3D%229.45%22%20cy%3D%228%22%20rx%3D%221.55%22%20ry%3D%221.05%22%20stroke%3D%22%23B08A3C%22%20stroke-width%3D%221.1%22%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="../../css/state.css">
<style>
  .ur-page { background: var(--bg); min-height: 100vh; }
  .ur-stats { display: flex; margin: 16px 16px 12px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 4px; box-shadow: var(--shadow-card); }
  .ur-stat { flex: 1; text-align: center; }
  .ur-stat + .ur-stat { border-left: 1px solid var(--line); }
  .ur-stat-val { font-family: var(--font-num); font-size: 20px; font-weight: 800; color: var(--text-1); }
  .ur-stat-val.gold { color: var(--primary-dim); }
  .ur-stat-val.green { color: var(--success); }
  .ur-stat-label { font-size: 11px; color: var(--text-3); margin-top: 4px; }
  .seg { margin: 0 16px 12px; }
  .ur-card { margin: 0 16px 10px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; box-shadow: var(--shadow-card); transition: transform .15s, box-shadow .15s; }
  .ur-card:active { transform: scale(.985); }
  .ur-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .ur-card-title { font-size: var(--fs-md); font-weight: 600; color: var(--text-1); flex: 1 1 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ur-card-meta { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--text-3); margin-bottom: 10px; flex-wrap: wrap; }
  .ur-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ur-contact { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); min-width: 0; }
  .ur-contact svg { width: 13px; height: 13px; color: var(--text-3); flex: none; }
  .ur-amount { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-md); flex: none; }
  .ur-amount.credit { color: var(--error); }
  .ur-amount.free { color: var(--success); }
  .ur-cost { display:inline-flex; align-items:center; padding:2px 8px; border-radius:var(--r-full); font-size:10.5px; font-weight:600; line-height:1.5; color:var(--text-2); background:var(--bg-card-2); border:1px solid var(--line); white-space:nowrap; }
  .ur-cta { display: inline-block; margin-top: 16px; padding: 11px 28px; border: none; border-radius: var(--r-full); background: linear-gradient(180deg, var(--action), var(--action-deep)); color: var(--on-action); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div class="phone">
  <div class="ur-page">
    <div class="navbar">
      <button class="nav-back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="nav-title">解锁记录</div>
      <div class="nav-right"></div>
    </div>

    <div class="ur-stats">
      <div class="ur-stat"><div class="ur-stat-val" id="stat-total">0</div><div class="ur-stat-label">累计解锁</div></div>
      <div class="ur-stat"><div class="ur-stat-val gold" id="stat-credit">0</div><div class="ur-stat-label">积分消耗</div></div>
      <div class="ur-stat"><div class="ur-stat-val green" id="stat-free">0</div><div class="ur-stat-label">免费解锁</div></div>
    </div>

    <div class="seg" style="margin:0 14px 10px;">
      <span class="seg-item is-on" data-filter="all">全部</span>
      <span class="seg-item" data-filter="credit">积分解锁</span>
      <span class="seg-item" data-filter="free">免费解锁</span>
    </div>

    <div class="scroll" style="padding-bottom:100px;">
      <div id="ur-list"></div>
      <div class="empty-state" id="ur-empty" style="display:none;">
        <div class="e-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="e-title">暂无解锁记录</div>
        <div class="e-desc">去供需大厅发现商机，解锁详情对接资源</div>
        <div class="es-actions"><a class="ur-cta" href="../supply/list.html">去发现</a></div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function(){
  window.__ROOT__='../../';

  /* [FIX BM-020] 解锁记录改为从 CreditStore.logs 读取真实 type='unlock' 记录，
     不再使用写死的 6 条假数据（成本 10/30 分）。真实成本从 logs.credits 绝对值读取（98/29/49/39 等）。
     免费解锁走 CreditStore.freeSpend（不计积分），这里仅展示积分解锁记录；无记录时显示空状态。 */
  function loadUnlockLogs() {
    var logs = (CreditStore.read().logs) || [];
    return logs.filter(function(l){ return l && l.type === 'unlock'; }).map(function(l, i){
      var cost = Math.abs(Number(l.credits) || 0);
      var d = new Date(l.ts || Date.now());
      var pad = function(n){ return ('0' + n).slice(-2); };
      var timeStr = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      return {
        id: l.id || ('UL' + i),
        title: l.reason || '解锁供需详情',
        cat: l.cat || '解锁',
        dir: l.dir || '供应',
        method: cost > 0 ? 'credit' : 'free',
        cost: cost,
        time: timeStr,
        ts: l.ts || 0,
        contact: l.contact || '',
        supplyId: l.supplyId || l.bizId || ''
      };
    });
  }

  var currentFilter = 'all';
  var UNLOCK_LOGS = [];

  function render() {
    UNLOCK_LOGS = loadUnlockLogs();
    var list = document.getElementById('ur-list');
    var empty = document.getElementById('ur-empty');
    var filtered = UNLOCK_LOGS.filter(function(r){
      if(currentFilter==='all') return true;
      return r.method === currentFilter;
    });

    /* 统计：基于真实积分解锁记录 */
    var total = UNLOCK_LOGS.length;
    var creditCost = UNLOCK_LOGS.reduce(function(s,r){ return s + (r.method==='credit'?r.cost:0); }, 0);
    var freeCount = UNLOCK_LOGS.filter(function(r){ return r.method==='free'; }).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-credit').textContent = creditCost + ' 分';
    document.getElementById('stat-free').textContent = freeCount;

    if(!filtered.length){
      list.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    list.innerHTML = filtered.map(function(r){
      var methodTag = r.method==='credit'
        ? '<span class="ur-cost">积分 -'+r.cost+'分</span>'
        : '<span class="badge b-match">免费</span>';
      var amtClass = r.method==='credit' ? 'credit' : 'free';
      var amtText = r.method==='credit' ? '-'+r.cost+' 分' : '免费';
      var contactHtml = r.contact
        ? '<div class="ur-contact"><svg class="ic"><use href="#i-user"/></svg>'+r.contact+'</div>'
        : '<div class="ur-contact" style="color:var(--text-3);">信息已解锁</div>';
      var detailHref = r.supplyId
        ? ('../supply/detail.html?id=' + r.supplyId)
        : 'javascript:void(0);';
      return '<div class="ur-card" onclick="location.href=\''+detailHref+'\'">' +
        '<div class="ur-card-top">' +
          '<span class="badge '+(r.dir==='需求'?'b-demand':'b-supply')+'">'+r.dir+'</span>' +
          '<span class="badge b-brief">'+r.cat+'</span>' +
          methodTag +
        '</div>' +
        '<div class="ur-card-title">'+r.title+'</div>' +
        '<div class="ur-card-meta"><span>'+r.time+'</span></div>' +
        '<div class="ur-card-foot">' +
          contactHtml +
          '<span class="ur-amount '+amtClass+'">'+amtText+'</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.querySelectorAll('.seg-item').forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll('.seg-item').forEach(function(x){x.classList.remove('is-on')});
      el.classList.add('is-on');
      currentFilter = el.getAttribute('data-filter');
      render();
    };
  });

  /* 积分账户变化时刷新 */
  window.addEventListener('engchain:credits', render);
  render();
})();
</script>
</body>
</html>
