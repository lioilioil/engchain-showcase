<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>积分商城 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  .cm-page { background: var(--bg); min-height: 100vh; }
  .cm-balance-bar { display: flex; align-items: center; justify-content: space-between; margin: 12px 14px; padding: 14px 16px; background: linear-gradient(135deg, #1A2E28, #0F201B); border-radius: 14px; color: #E8D5A3; }
  .cm-balance-label { font-size: 11px; opacity: .7; }
  .cm-balance-val { font-family: var(--font-num); font-size: 24px; font-weight: 800; margin-top: 2px; }
  .cm-balance-val small { font-size: 12px; font-weight: 500; opacity: .7; }
  .cm-recharge-btn { padding: 8px 14px; background: rgba(232,213,163,.15); border: 1px solid rgba(232,213,163,.3); color: #E8D5A3; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .cm-tabs { display: flex; margin: 0 14px 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 3px; }
  .cm-tab { flex: 1; text-align: center; padding: 8px 0; font-size: 12px; font-weight: 600; color: var(--text-3); border-radius: 9px; cursor: pointer; transition: all .2s; }
  .cm-tab.on { background: var(--bg-card); color: var(--text-1); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .cm-cat-seg { display: flex; gap: 6px; margin: 0 14px 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .cm-cat-seg::-webkit-scrollbar { display: none; }
  .cm-cat-chip { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; color: var(--text-2); background: var(--bg-card); border: 1px solid var(--line); cursor: pointer; transition: all .15s; }
  .cm-cat-chip.on { background: rgba(201,169,97,.12); color: var(--primary-dim); border-color: rgba(201,169,97,.3); font-weight: 600; }
  .cm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 14px; }
  .cm-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .cm-card:active { transform: scale(.97); }
  .cm-card-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .cm-card-ic svg { width: 22px; height: 22px; }
  .cm-card-name { font-size: 13px; font-weight: 600; color: var(--text-1); line-height: 1.4; margin-bottom: 3px; }
  .cm-card-desc { font-size: 10px; color: var(--text-3); line-height: 1.4; margin-bottom: 8px; flex: 1; }
  .cm-card-foot { display: flex; align-items: center; justify-content: space-between; }
  .cm-card-price { font-family: var(--font-num); font-size: 15px; font-weight: 700; color: var(--primary-dim); }
  .cm-card-price small { font-size: 9px; font-weight: 400; color: var(--text-3); }
  .cm-card-original { font-size: 9px; color: var(--text-4); text-decoration: line-through; margin-left: 4px; }
  .cm-exchange-btn { padding: 5px 10px; background: var(--primary); color: var(--text-inv); border-radius: 8px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }
  .cm-exchange-btn:disabled { background: var(--bg-inset); color: var(--text-4); cursor: not-allowed; }
  .cm-hot-tag { position: absolute; top: 8px; right: 8px; font-size: 9px; padding: 2px 6px; border-radius: 20px; background: rgba(234,102,104,.12); color: var(--danger); font-weight: 600; }
  .cm-card { position: relative; }
  .cm-record-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .cm-record-row:last-child { border-bottom: none; }
  .cm-record-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cm-record-ic svg { width: 18px; height: 18px; }
  .cm-record-main { flex: 1; min-width: 0; }
  .cm-record-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .cm-record-time { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .cm-record-cost { font-family: var(--font-num); font-size: 13px; font-weight: 700; color: var(--danger); flex-shrink: 0; }
  .cm-record-status { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(82,196,26,.1); color: var(--success); font-weight: 600; flex-shrink: 0; margin-top: 4px; }
  .cm-empty { text-align: center; padding: 50px 20px; color: var(--text-3); }
  .cm-empty svg { width: 44px; height: 44px; color: var(--line-strong); margin-bottom: 10px; }
</style>
</head>
<body>
<div class="phone">
  <div class="cm-page">
    <div class="navbar" style="height:50px;">
      <button class="nav-back" onclick="history.back()">‹</button>
      <div class="nav-title">积分商城</div>
      <div class="nav-right"></div>
    </div>

    <div class="scroll" style="padding-bottom:100px;">
      <!-- 积分余额 -->
      <div class="cm-balance-bar">
        <div>
          <div class="cm-balance-label">我的积分</div>
          <div class="cm-balance-val" id="cm-balance">0<small> 分</small></div>
        </div>
        <button class="cm-recharge-btn" onclick="location.href='credits.html'">充值积分</button>
      </div>

      <!-- 主tab：兑换商品 / 兑换记录 -->
      <div class="cm-tabs">
        <div class="cm-tab on" data-tab="goods">兑换商品</div>
        <div class="cm-tab" data-tab="records">兑换记录</div>
      </div>

      <!-- 兑换商品面板 -->
      <div id="panel-goods">
        <!-- 分类筛选 -->
        <div class="cm-cat-seg" id="cm-cats">
          <span class="cm-cat-chip on" data-cat="all">全部</span>
          <span class="cm-cat-chip" data-cat="unlock">解锁包</span>
          <span class="cm-cat-chip" data-cat="member">会员权益</span>
          <span class="cm-cat-chip" data-cat="service">服务权益</span>
          <span class="cm-cat-chip" data-cat="data">资料包</span>
        </div>
        <!-- 商品网格 -->
        <div class="cm-grid" id="cm-grid"></div>
      </div>

      <!-- 兑换记录面板 -->
      <div id="panel-records" style="display:none;">
        <div class="card" style="margin:0 14px;" id="cm-records"></div>
        <div class="cm-empty" id="cm-records-empty" style="display:none;">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-tag"/></svg>
          <div style="font-size:13px;">暂无兑换记录</div>
          <div style="font-size:11px;margin-top:4px;">去兑换商品，享受平台权益</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
(function(){
  window.__ROOT__='../../';

  /* 商品数据 */
  var GOODS = [
    { id:'G001', cat:'unlock', name:'供需详情解锁包', desc:'10条供需详情解锁，有效期30天', price:80, original:100, icon:'eye', icBg:'rgba(82,183,136,.14)', icColor:'var(--success)', hot:true },
    { id:'G002', cat:'unlock', name:'供需详情解锁包', desc:'30条供需详情解锁，有效期90天', price:210, original:300, icon:'eye', icBg:'rgba(82,183,136,.14)', icColor:'var(--success)', hot:true },
    { id:'G003', cat:'member', name:'高级会员月卡', desc:'专属标识+优先展示+客服优先+解锁8折', price:500, original:0, icon:'award', icBg:'rgba(201,169,97,.14)', icColor:'var(--primary-dim)' },
    { id:'G004', cat:'service', name:'发票免费额度', desc:'5张发票免服务费，有效期90天', price:200, original:0, icon:'doc', icBg:'rgba(37,99,235,.12)', icColor:'#2563EB' },
    { id:'G005', cat:'service', name:'供需信息优先展示', desc:'发布的供需信息优先展示7天', price:300, original:0, icon:'bolt', icBg:'rgba(245,158,11,.12)', icColor:'#F59E0B' },
    { id:'G006', cat:'service', name:'专属客服服务', desc:'1对1专属客服，30天内优先响应', price:400, original:0, icon:'headset', icBg:'rgba(124,91,189,.12)', icColor:'#7C5BBD' },
    { id:'G007', cat:'data', name:'工程行业资料包', desc:'含合同模板/施工规范/资质标准合集', price:150, original:0, icon:'folder', icBg:'rgba(82,183,136,.12)', icColor:'var(--success)' },
    { id:'G008', cat:'service', name:'企业认证加急审核', desc:'企业认证审核加急，24小时内完成', price:250, original:0, icon:'shield', icBg:'rgba(37,99,235,.12)', icColor:'#2563EB' }
  ];

  /* 兑换记录（模拟） */
  var RECORDS = [
    { id:'R001', name:'供需详情解锁包（10条）', time:'2026-09-01 14:30', cost:80, status:'已发放', icon:'eye', icBg:'rgba(82,183,136,.14)', icColor:'var(--success)' },
    { id:'R002', name:'工程行业资料包', time:'2026-08-20 10:15', cost:150, status:'已发放', icon:'folder', icBg:'rgba(82,183,136,.12)', icColor:'var(--success)' }
  ];

  var currentCat = 'all';
  var currentTab = 'goods';
  var userBalance = 0;

  function renderBalance() {
    try {
      var c = CreditStore.read();
      userBalance = c.balance || 0;
      document.getElementById('cm-balance').innerHTML = userBalance.toLocaleString() + '<small> 分</small>';
    } catch(e) {}
  }

  function renderGoods() {
    var grid = document.getElementById('cm-grid');
    var filtered = GOODS.filter(function(g){ return currentCat==='all' || g.cat===currentCat; });
    grid.innerHTML = filtered.map(function(g){
      var canAfford = userBalance >= g.price;
      var originalHtml = g.original ? '<span class="cm-card-original">'+g.original+'分</span>' : '';
      var hotHtml = g.hot ? '<span class="cm-hot-tag">热门</span>' : '';
      return '<div class="cm-card" onclick="exchangeGoods(\''+g.id+'\')">' +
        hotHtml +
        '<div class="cm-card-ic" style="background:'+g.icBg+';color:'+g.icColor+';"><svg class="ic"><use href="#i-'+g.icon+'"/></svg></div>' +
        '<div class="cm-card-name">'+g.name+'</div>' +
        '<div class="cm-card-desc">'+g.desc+'</div>' +
        '<div class="cm-card-foot">' +
          '<div><span class="cm-card-price">'+g.price+'<small>分</small></span>'+originalHtml+'</div>' +
          '<button class="cm-exchange-btn" '+(canAfford?'':'disabled')+'>'+(canAfford?'兑换':'积分不足')+'</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderRecords() {
    var box = document.getElementById('cm-records');
    var empty = document.getElementById('cm-records-empty');
    if(!RECORDS.length){
      box.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    box.innerHTML = RECORDS.map(function(r){
      return '<div class="cm-record-row">' +
        '<div class="cm-record-ic" style="background:'+r.icBg+';color:'+r.icColor+';"><svg class="ic"><use href="#i-'+r.icon+'"/></svg></div>' +
        '<div class="cm-record-main">' +
          '<div class="cm-record-name">'+r.name+'</div>' +
          '<div class="cm-record-time">'+r.time+'</div>' +
          '<span class="cm-record-status">'+r.status+'</span>' +
        '</div>' +
        '<div class="cm-record-cost">-'+r.cost+'分</div>' +
      '</div>';
    }).join('');
  }

  window.exchangeGoods = function(id) {
    var g = GOODS.find(function(x){ return x.id===id; });
    if(!g) return;
    if(userBalance < g.price){ UI.toast('积分不足，请先充值','err'); return; }
    UI.dialog({
      title: '确认兑换',
      text: '消耗 <b style="color:var(--primary-dim)">'+g.price+' 积分</b> 兑换「'+g.name+'」？',
      ok: '确认兑换',
      cancel: '取消',
      onOk: function(){
        /* [FIX BM-019] 积分消耗统一走 CreditStore.consume(cost, reason, meta)，
           不再裸写 CreditStore.balance 或直写 localStorage；consume 返回 null 表示余额不足 */
        var res = CreditStore.consume(g.price, '商城兑换 · ' + g.name, {
          type:'unlock',
          reason: '商城兑换 · ' + g.name,
          goodsId: g.id,
          goodsName: g.name,
          status: 'success'
        });
        if (res === null) {
          UI.toast('积分不足，兑换失败', 'err');
          return;
        }
        /* 添加兑换记录 */
        RECORDS.unshift({ id:'R'+Date.now(), name:g.name, time:new Date().toLocaleString('zh-CN'), cost:g.price, status:'已发放', icon:g.icon, icBg:g.icBg, icColor:g.icColor });
        renderBalance();
        renderGoods();
        UI.toast('兑换成功，权益已发放','ok');
      }
    });
  };

  /* tab切换 */
  document.querySelectorAll('.cm-tab').forEach(function(t){
    t.onclick = function(){
      document.querySelectorAll('.cm-tab').forEach(function(x){x.classList.remove('on')});
      t.classList.add('on');
      currentTab = t.getAttribute('data-tab');
      document.getElementById('panel-goods').style.display = currentTab==='goods' ? '' : 'none';
      document.getElementById('panel-records').style.display = currentTab==='records' ? '' : 'none';
      if(currentTab==='records') renderRecords();
    };
  });

  /* 分类筛选 */
  document.querySelectorAll('.cm-cat-chip').forEach(function(c){
    c.onclick = function(){
      document.querySelectorAll('.cm-cat-chip').forEach(function(x){x.classList.remove('on')});
      c.classList.add('on');
      currentCat = c.getAttribute('data-cat');
      renderGoods();
    };
  });

  renderBalance();
  renderGoods();
})();
</script>
</body>
</html>
