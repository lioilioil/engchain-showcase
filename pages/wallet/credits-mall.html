<style>
  .cm-page{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .cm-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--page-pad) 120px;-webkit-overflow-scrolling:touch;}

  /* ===== ① 余额 Hero ===== */
  .cm-hero{position:relative;margin-top:6px;padding:20px 18px 18px;border-radius:22px;overflow:hidden;
    background:radial-gradient(120% 140% at 88% -20%, rgba(238,214,151,.28) 0%, transparent 55%),
               radial-gradient(80% 80% at 10% 120%, rgba(82,183,136,.18) 0%, transparent 60%),
               linear-gradient(155deg, #1F332C 0%, #0F201B 50%, #07110E 100%);
    border:1px solid rgba(240,226,190,.22);color:#E3C88E;
    box-shadow:0 14px 36px -16px rgba(7,17,14,.6), 0 1px 0 rgba(255,235,190,.18) inset;}
  .cm-hero::before{content:'';position:absolute;left:16px;right:16px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(244,231,200,.6),transparent);}
  .cm-hero-orb{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,213,163,.22),transparent 70%);pointer-events:none;}
  .cm-hero-coin{position:absolute;right:24px;bottom:18px;width:54px;height:54px;
    background:radial-gradient(circle at 30% 30%, #F4E0A8, #B08A3C 60%, #8A6F3A);
    border-radius:50%;box-shadow:0 6px 16px -4px rgba(176, 138, 60, .5), 0 0 0 3px rgba(244,224,168,.25) inset;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#5C4416;
    animation:coinFloat 3.6s ease-in-out infinite;}
  @keyframes coinFloat{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-6px) rotate(4deg);}}
  .cm-hero-label{font-size:11px;opacity:.72;letter-spacing:.5px;}
  .cm-hero-num{font-family:var(--font-num);font-size:38px;font-weight:800;line-height:1.05;margin-top:4px;
    text-shadow:0 2px 12px rgba(232,213,163,.25);}
  .cm-hero-num small{font-size:14px;font-weight:500;opacity:.7;margin-left:4px;}
  .cm-hero-meta{display:flex;gap:14px;margin-top:12px;font-size:10.5px;opacity:.8;}
  .cm-hero-meta b{font-family:var(--font-num);font-weight:700;}
  .cm-hero-actions{display:flex;gap:8px;margin-top:14px;}
  .cm-hero-btn{flex:1;padding:9px 0;border-radius:11px;font-size:12px;font-weight:700;text-align:center;
    cursor:pointer;border:none;transition:transform .15s,filter .15s;}
  .cm-hero-btn:active{transform:scale(.97);}
  .cm-hero-btn.primary{background:linear-gradient(180deg,#F4E0A8,#D4B878);color:#3A2A08;
    box-shadow:0 4px 14px -4px rgba(232,213,163,.5);}
  .cm-hero-btn.ghost{background:rgba(232,213,163,.12);color:#E3C88E;border:1px solid rgba(232,213,163,.28);}

  /* ===== ② 营销活动条 ===== */
  .cm-promo{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .cm-promo::-webkit-scrollbar{display:none;}
  .cm-promo-card{flex-shrink:0;min-width:150px;padding:11px 13px;border-radius:14px;position:relative;overflow:hidden;
    background:var(--bg-card);border:1px solid var(--line);box-shadow:var(--shadow-card);cursor:pointer;
    transition:transform .15s;}
  .cm-promo-card:active{transform:scale(.97);}
  .cm-promo-card .pp-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:6px;}
  .cm-promo-card.hot .pp-tag{background:rgba(234,102,104,.12);color:var(--danger);}
  .cm-promo-card.new .pp-tag{background:rgba(82,183,136,.14);color:var(--success);}
  .cm-promo-card.sign .pp-tag{background:rgba(176, 138, 60, .14);color:var(--primary-dim);}
  .cm-promo-title{font-size:12.5px;font-weight:700;color:var(--text-1);line-height:1.35;}
  .cm-promo-sub{font-size:10px;color:var(--text-3);margin-top:3px;}
  .cm-promo-count{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;

  /* ===== ③ Tabs ===== */
  .cm-tabs{display:flex;margin-top:14px;background:var(--bg-inset);border-radius:12px;padding:3px;position:relative;}
  .cm-tab{flex:1;text-align:center;padding:8px 0;font-size:12.5px;font-weight:600;color:var(--text-3);
    border-radius:9px;cursor:pointer;transition:color .2s;position:relative;z-index:1;}
  .cm-tab.on{color:var(--text-1);}
  .cm-tab-ind{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);background:var(--bg-card);
    border-radius:9px;box-shadow:var(--shadow-sm);transition:transform .28s var(--e-out);z-index:0;}

  /* ===== ④ 分类 ===== */
  .cm-cats{display:flex;gap:7px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .cm-cats::-webkit-scrollbar{display:none;}
  .cm-cat{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:11.5px;font-weight:500;
    color:var(--text-2);background:var(--bg-card);border:1px solid var(--line);cursor:pointer;transition:all .18s;}
  .cm-cat.on{background:var(--primary);color:var(--text-inv);border-color:var(--primary);font-weight:700;
    box-shadow:0 3px 10px -3px rgba(176, 138, 60, .5);}

  /* ===== ⑤ 商品网格 ===== */
  .cm-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px;}
  .cm-card{position:relative;background:var(--bg-card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);
    transition:transform .18s var(--e-out), box-shadow .18s;animation:cardIn .45s var(--e-out) backwards;}
  .cm-card:active{transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .cm-card-art{height:92px;display:flex;align-items:center;justify-content:center;position:relative;
    background:linear-gradient(135deg, var(--art-a), var(--art-b));}
  .cm-card-art::after{content:'';position:absolute;inset:0;
    background:radial-gradient(80% 80% at 50% 0%, rgba(255,255,255,.18), transparent 60%);}
  .cm-card-art svg{width:42px;height:42px;color:var(--art-c);position:relative;z-index:1;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.15));}
  .cm-card-badge{position:absolute;left:8px;top:8px;font-size:9px;font-weight:700;padding:3px 7px;
    border-radius:6px;z-index:2;backdrop-filter:blur(4px);}
  .cm-card-badge.hot{background:rgba(234,102,104,.92);color:#fff;}
  .cm-card-badge.save{background:rgba(43,107,79,.92);color:#fff;}
  .cm-card-badge.new{background:rgba(37,99,235,.92);color:#fff;}
  .cm-card-body{padding:10px 11px 11px;}
  .cm-card-name{font-size:13px;font-weight:700;color:var(--text-1);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .cm-card-desc{font-size:10.5px;color:var(--text-3);line-height:1.45;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px;}
  .cm-card-stock{margin-top:7px;height:3px;border-radius:2px;background:var(--bg-inset);overflow:hidden;}
  .cm-card-stock i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#E67E22,#F5A623);
    transition:width .6s var(--e-out);}
  .cm-card-stock-txt{font-size:9.5px;color:var(--text-3);margin-top:3px;}
  .cm-card-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;}
  .cm-card-price{font-family:var(--font-num);font-size:18px;font-weight:800;color:var(--primary-dim);line-height:1;}
  .cm-card-price small{font-size:10px;font-weight:500;color:var(--text-3);}
  .cm-card-orig{font-size:10px;color:var(--text-4);text-decoration:line-through;margin-left:3px;}
  .cm-card-btn{padding:6px 12px;border-radius:9px;font-size:11px;font-weight:700;border:none;cursor:pointer;
    transition:transform .15s,filter .15s;}
  .cm-card-btn:active{transform:scale(.94);}
  .cm-card-btn.can{background:var(--primary);color:var(--text-inv);
    box-shadow:0 3px 10px -3px rgba(176, 138, 60, .55);}
  .cm-card-btn.cant{background:var(--bg-inset);color:var(--text-3);}

  /* ===== ⑥ 记录 ===== */
  .cm-rec-group{margin-top:6px;}
  .cm-rec-date{font-size:11px;font-weight:600;color:var(--text-3);padding:14px 4px 8px;}
  .cm-rec-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:var(--shadow-card);}
  .cm-rec-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line-hairline);}
  .cm-rec-row:last-child{border-bottom:none;}
  .cm-rec-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cm-rec-ic svg{width:19px;height:19px;}
  .cm-rec-main{flex:1;min-width:0;}
  .cm-rec-name{font-size:13px;font-weight:600;color:var(--text-1);}
  .cm-rec-time{font-size:10.5px;color:var(--text-3);margin-top:2px;}
  .cm-rec-tag{display:inline-block;font-size:9px;font-weight:600;padding:1px 7px;border-radius:10px;
    background:rgba(43,107,79,.1);color:var(--success);margin-top:4px;}
  .cm-rec-cost{font-family:var(--font-num);font-size:14px;font-weight:700;color:var(--danger);flex-shrink:0;}

  .cm-empty{text-align:center;padding:60px 20px;color:var(--text-3);}
  .cm-empty svg{width:48px;height:48px;color:var(--line-strong);margin-bottom:12px;}
  .cm-empty-title{font-size:14px;font-weight:600;color:var(--text-2);}
  .cm-empty-sub{font-size:11.5px;margin-top:4px;}

  /* ===== ⑦ 底部固定栏 ===== */
  .cm-paybar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60;
    width:100%;max-width:430px;background:var(--bg-card);border-top:1px solid var(--line);
    padding:10px var(--page-pad) calc(10px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 20px -10px rgba(0,0,0,.12);
    display:flex;align-items:center;gap:12px;}
  .cm-pb-info{flex:1;min-width:0;}
  .cm-pb-label{font-size:10px;color:var(--text-3);}
  .cm-pb-num{font-family:var(--font-num);font-size:20px;font-weight:800;color:var(--primary-dim);line-height:1.1;}
  .cm-pb-num small{font-size:11px;font-weight:500;color:var(--text-3);}
  .cm-pb-btn{padding:11px 20px;border-radius:11px;background:var(--primary);color:var(--text-inv);
    font-size:13px;font-weight:700;border:none;cursor:pointer;flex-shrink:0;
    box-shadow:0 4px 14px -4px rgba(176, 138, 60, .5);transition:transform .15s;}
  .cm-pb-btn:active{transform:scale(.96);}

  /* ===== ⑧ 兑换成功弹层 ===== */
  .cm-success{text-align:center;padding:14px 10px 6px;}
  .cs-ring{width:76px;height:76px;margin:0 auto 16px;position:relative;}
  .cs-ring svg{width:100%;height:100%;}
  .cs-ring circle{fill:none;stroke-width:3;}
  .cs-ring .bg{stroke:var(--bg-inset);}
  .cs-ring .fg{stroke:var(--success);stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;
    animation:ringDraw .6s var(--e-out) forwards;}
  @keyframes ringDraw{to{stroke-dashoffset:0;}}
  .cs-check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .cs-check svg{width:32px;height:32px;stroke:var(--success);stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;
    animation:checkDraw .4s .5s var(--e-out) forwards;}
  @keyframes checkDraw{to{stroke-dashoffset:0;}}
  .cs-title{font-size:18px;font-weight:800;color:var(--text-1);}
  .cs-desc{font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.6;}
  .cs-amount{font-family:var(--font-num);font-size:32px;font-weight:800;color:var(--primary-dim);margin-top:14px;}

  /* 入场 */
  .cm-hero,.cm-promo,.cm-tabs,.cm-cats,.cm-grid,.cm-rec-group{animation:fadeUp .5s var(--e-out) backwards;}
  .cm-promo{animation-delay:.05s;}
  .cm-tabs{animation-delay:.1s;}
  .cm-cats{animation-delay:.15s;}
  .cm-grid{animation-delay:.2s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  @media(max-width:375px){
    .cm-hero-num{font-size:32px;}
    .cm-card-art{height:80px;}
    .cm-card-art svg{width:36px;height:36px;}
  }
</style>

  /* 兑换记录（模拟） */
  var RECORDS = [
    { id:'R001', name:'供需详情解锁包（10条）', time:'2026-09-01 14:30', cost:80, status:'已发放', icon:'eye', artA:'#E8F5EE', artB:'#C8E6D4', artC:'#2B6B4F' },
    { id:'R002', name:'工程行业资料包', time:'2026-08-20 10:15', cost:150, status:'已发放', icon:'folder', artA:'#DFF0E8', artB:'#B8DCC8', artC:'#2B7D50' }
  ];

  var currentCat = 'all';
  var currentTab = 'goods';
  var userBalance = 0;

  /* 数字滚动动画 */
  function countUp(el, target, duration){
    var start = 0;
    var t0 = performance.now();
    function tick(now){
      var p = Math.min((now - t0) / duration, 1);
      var ease = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(start + (target - start) * ease).toLocaleString();
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderBalance(animate){
    try {
      var c = CreditStore.read();
      userBalance = c.balance || 0;
      var balEl = document.getElementById('cm-balance');
      var pbEl = document.getElementById('pb-balance');
      if(animate){
        countUp(balEl, userBalance, 600);
        countUp(pbEl, userBalance, 600);
      } else {
        balEl.textContent = userBalance.toLocaleString();
        pbEl.textContent = userBalance.toLocaleString();
      }
      document.getElementById('cm-unlock').textContent = Math.floor(userBalance / 10);
      /* 本月已兑 */
      var now = new Date(); var ym = now.getFullYear() + '-' + (now.getMonth()+1);
      var monthCount = RECORDS.filter(function(r){ return r.time && r.time.indexOf(ym) === 0; }).length;
      document.getElementById('cm-month').textContent = monthCount;
    } catch(e) {}
  }

  function renderGoods(){
    var grid = document.getElementById('cm-grid');
    var filtered = GOODS.filter(function(g){ return currentCat==='all' || g.cat===currentCat; });
    if(!filtered.length){
      grid.innerHTML = '<div class="cm-empty" style="grid-column:1/-1;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><div class="cm-empty-title">该分类暂无商品</div></div>';
      return;
    }
    grid.innerHTML = filtered.map(function(g, i){
      var canAfford = userBalance >= g.price;
      var badges = '';
      if(g.hot) badges += '<span class="cm-card-badge hot">热门</span>';
      if(g.isNew) badges += '<span class="cm-card-badge new">新品</span>';
      if(g.save) badges += '<span class="cm-card-badge save">省'+g.save+'%</span>';
      var origHtml = g.original ? '<span class="cm-card-orig">'+g.original+'</span>' : '';
      var stockPct = Math.max(5, Math.min(100, g.stock));
      var stockTxt = g.stock < 40 ? '仅剩 '+g.stock+'% · 已抢'+g.sold+'件' : '已抢'+g.sold+'件';
      return '<div class="cm-card" data-id="'+g.id+'" style="animation-delay:'+(i*40)+'ms">'+
        badges +
        '<div class="cm-card-art" style="--art-a:'+g.artA+';--art-b:'+g.artB+';--art-c:'+g.artC+';">'+
          '<svg class="ic"><use href="#i-'+g.icon+'"/></svg>'+
        '</div>'+
        '<div class="cm-card-body">'+
          '<div class="cm-card-name">'+g.name+'</div>'+
          '<div class="cm-card-desc">'+g.desc+'</div>'+
          '<div class="cm-card-stock"><i style="width:'+stockPct+'%"></i></div>'+
          '<div class="cm-card-stock-txt">'+stockTxt+'</div>'+
          '<div class="cm-card-foot">'+
            '<div><span class="cm-card-price">'+g.price+'<small>分</small></span>'+origHtml+'</div>'+
            '<button class="cm-card-btn '+(canAfford?'can':'cant')+'" onclick="event.stopPropagation();exchangeGoods(\''+g.id+'\')">'+(canAfford?'兑换':'不足')+'</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  function renderRecords(){
    var box = document.getElementById('cm-records');
    var empty = document.getElementById('cm-records-empty');
    if(!RECORDS.length){
      box.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    /* 按日期分组 */
    var groups = {};
    RECORDS.forEach(function(r){
      var d = (r.time || '').slice(0,10);
      if(!groups[d]) groups[d] = [];
      groups[d].push(r);
    });
    var html = '';
    Object.keys(groups).forEach(function(date){
      html += '<div class="cm-rec-group"><div class="cm-rec-date">'+date+'</div><div class="cm-rec-card">';
      groups[date].forEach(function(r){
        html += '<div class="cm-rec-row">'+
          '<div class="cm-rec-ic" style="background:linear-gradient(135deg,'+r.artA+','+r.artB+');color:'+r.artC+';"><svg class="ic"><use href="#i-'+r.icon+'"/></svg></div>'+
          '<div class="cm-rec-main">'+
            '<div class="cm-rec-name">'+r.name+'</div>'+
            '<div class="cm-rec-time">'+(r.time||'').slice(11)+'</div>'+
            '<span class="cm-rec-tag">'+r.status+'</span>'+
          '</div>'+
          '<div class="cm-rec-cost">-'+r.cost+'</div>'+
        '</div>';
      });
      html += '</div></div>';
    });
    box.innerHTML = html;
  }

  window.exchangeGoods = function(id){
    var g = GOODS.find(function(x){ return x.id===id; });
    if(!g) return;
    if(userBalance < g.price){ UI.toast('积分不足，先去充值吧','warn'); return; }
    UI.dialog({
      title: '确认兑换',
      text: '消耗 <b style="color:var(--primary-dim)">'+g.price+' 积分</b> 兑换「'+g.name+'」？',
      ok: '确认兑换',
      cancel: '再想想',
      onOk: function(){
        var res = CreditStore.consume(g.price, '商城兑换 · ' + g.name, {
          type:'unlock', reason: '商城兑换 · ' + g.name,
          goodsId: g.id, goodsName: g.name, status: 'success'
        });
        if(res === null){ UI.toast('积分不足，兑换失败','err'); return; }
        /* 真发权益：根据商品 id 写入对应 Store，不再是空兑换 */
        try { applyBenefit(g); } catch(e){ console.warn('benefit apply failed', e); }
        RECORDS.unshift({
          id:'R'+Date.now(), name:g.name, time:new Date().toLocaleString('zh-CN'),
          cost:g.price, status:'已发放', icon:g.icon,
          artA:g.artA, artB:g.artB, artC:g.artC
        });
        renderBalance(true);
        renderGoods();
        showSuccess(g);
      }
    });
  };

  /* 根据商品 ID 把权益写进对应 Store（demo 闭环：积分扣了，权益真到账） */
  function applyBenefit(g){
    var now = Date.now();
    var D = 86400000;
    if (g.id === 'G001' || g.id === 'G002') {
      /* 解锁包：往 UpgradeStore 追加 unlock 次数 */
      var cnt = g.id === 'G001' ? 10 : 30;
      if (window.UpgradeStore) {
        var us = UpgradeStore.read();
        us.items.unshift({ id:'UG'+now, type:'unlock', targetId:'', startedAt:now, expireAt: now + (g.id==='G001'?30:90)*D, count: cnt, used:0, status:'active', purchasedAt:now });
        UpgradeStore.write(us);
      }
    } else if (g.id === 'G003') {
      /* 高级会员月卡：置会员状态 30 天 */
      if (window.MemberStore) {
        var ms = MemberStore.read();
        var base = (ms.active && ms.expireAt > now) ? ms.expireAt : now;
        ms.active = true; ms.type = 'monthly';
        if (!ms.startedAt) ms.startedAt = now;
        ms.expireAt = base + 30 * D;
        MemberStore.write(ms);
      }
    } else if (g.id === 'G005') {
      /* 优先展示 7 天：往 UpgradeStore 追加 topListing 次数 */
      if (window.UpgradeStore) {
        var us2 = UpgradeStore.read();
        us2.items.unshift({ id:'UG'+now, type:'topListing', targetId:'', startedAt:now, expireAt: now + 7*D, count:1, used:0, status:'active', purchasedAt:now });
        UpgradeStore.write(us2);
      }
    }
    /* G004/G006/G007/G008 为服务类（发票额度/专属客服/资料包/认证加急），demo 阶段仅记 RECORDS */
  }

  /* 兑换成功动画 */
  function showSuccess(g){
    var sh = UI.sheet();
    sh.setClosable(true);
    sh.html(
      '<div class="cm-success">'+
        '<div class="cs-ring">'+
          '<svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="35"/><circle class="fg" cx="40" cy="40" r="35"/></svg>'+
          '<div class="cs-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>'+
        '</div>'+
        '<div class="cs-title">兑换成功</div>'+
        '<div class="cs-desc">「'+g.name+'」已发放至账户<br>可在「我的-权益」中查看</div>'+
        '<div class="cs-amount">-'+g.price+' 积分</div>'+
        '<button class="btn btn-primary btn-block btn-lg" style="margin-top:18px;" onclick="UI.closeSheet()">完成</button>'+
      '</div>'
    ).show();
  }

  /* Tab 切换（带滑动指示器） */
  var tabInd = document.getElementById('cm-tab-ind');
  function moveInd(tab){
    var idx = tab.getAttribute('data-tab') === 'records' ? 1 : 0;
    tabInd.style.transform = 'translateX(' + (idx * 100) + '%)';
  }
  document.querySelectorAll('.cm-tab').forEach(function(t){
    t.onclick = function(){
      document.querySelectorAll('.cm-tab').forEach(function(x){x.classList.remove('on')});
      t.classList.add('on');
      moveInd(t);
      currentTab = t.getAttribute('data-tab');
      document.getElementById('panel-goods').style.display = currentTab==='goods' ? '' : 'none';
      document.getElementById('panel-records').style.display = currentTab==='records' ? '' : 'none';
      if(currentTab==='records') renderRecords();
    };
  });

  /* 分类筛选 */
  document.querySelectorAll('.cm-cat').forEach(function(c){
    c.onclick = function(){
      document.querySelectorAll('.cm-cat').forEach(function(x){x.classList.remove('on')});
      c.classList.add('on');
      currentCat = c.getAttribute('data-cat');
      renderGoods();
    };
  });

  /* 数据变化监听 */
  window.addEventListener('engchain:credits', function(){ renderBalance(true); renderGoods(); });

  renderBalance(true);
  renderGoods();
})();
</script>
</body>
</html>
