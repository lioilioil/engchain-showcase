<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>发票管理 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">发票管理</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:8px;">
    <div class="group">
      <div class="row" id="btn-apply"><span class="row-icon" style="background:var(--primary-soft);color:var(--primary)">＋</span><span class="label">申请开票</span><span class="arrow">›</span></div>
      <div class="row" onclick="UI.toast('已催开票，财务将加急处理','ok')"><span class="row-icon" style="background:rgba(255,214,10,.16)"><svg class="ic"><use href="#i-clock"/></svg></span><span class="label">催开票</span><span class="arrow">›</span></div>
      <div class="row" onclick="location.href='invoice-info.html'"><span class="row-icon" style="background:var(--primary-soft);color:var(--primary)"><svg class="ic"><use href="#i-edit"/></svg></span><span class="label">开票信息管理</span><span class="value" id="title-count">0 个抬头</span><span class="arrow">›</span></div>
    </div>

    <!-- 申请开票表单（默认隐藏，点击展开） -->
    <div class="card" id="apply-form" style="display:none;margin:10px 14px;">
      <div class="fw-600 fs-14" style="margin-bottom:10px;">申请开票</div>
      <div class="field"><label class="field-label">发票抬头 <span class="req">*</span></label>
        <select class="input" id="f-title"></select>
      </div>
      <div class="field"><label class="field-label">发票类型</label>
        <div class="seg" id="f-type-seg">
          <span class="seg-item is-on" data-t="增值税普通发票">增值税普通发票</span>
          <span class="seg-item" data-t="增值税专用发票">增值税专用发票</span>
        </div>
      </div>
      <div class="field"><label class="field-label">开票金额（元） <span class="req">*</span></label>
        <input class="input" id="f-amount" type="number" placeholder="请输入开票金额" value="">
      </div>
      <div class="field"><label class="field-label">关联订单</label>
        <select class="input" id="f-order"><option value="">不关联订单</option></select>
      </div>
      <div class="field"><label class="field-label">接收邮箱 <span class="req">*</span></label>
        <input class="input" id="f-email" type="email" placeholder="电子发票将发送至该邮箱">
      </div>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="cancelApply()">取消</button>
        <button class="btn btn-primary" style="flex:1.6;" onclick="submitApply()">提交申请</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:18px;"><div class="st-left">开票记录</div><span class="more" onclick="location.href='invoice-record.html'">全部 ›</span></div>
    <div id="inv-list"></div>
    <div id="inv-empty" style="display:none;text-align:center;padding:30px 20px;color:var(--text-3);font-size:13px;">暂无开票记录</div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script src="../../js/domain.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';
  var TITLE_KEY = 'engchain-invoice-titles';
  var invType = '增值税普通发票';

  function loadTitles() {
    try { return JSON.parse(localStorage.getItem(TITLE_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveTitles(arr) {
    try { localStorage.setItem(TITLE_KEY, JSON.stringify(arr)); } catch (e) {}
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function money(n) { return '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    function p(x) { return ('0' + x).slice(-2); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  var ST_MAP = {
    pending:  { label: '待审核', cls: 'tag-warning' },
    issued:   { label: '已开票', cls: 'tag-success' },
    rejected: { label: '已驳回', cls: 'tag-gray' }
  };

  function renderTitleSelect() {
    var titles = loadTitles();
    document.getElementById('title-count').textContent = titles.length + ' 个抬头';
    var sel = document.getElementById('f-title');
    if (!titles.length) {
      sel.innerHTML = '<option value="">请先在「开票信息管理」添加抬头</option>';
    } else {
      sel.innerHTML = titles.map(function (t, i) {
        return '<option value="' + i + '">' + esc(t.name) + '</option>';
      }).join('');
    }
    /* 预填邮箱 */
    var def = titles.filter(function (t) { return t.isDefault; })[0] || titles[0];
    if (def && def.email) document.getElementById('f-email').value = def.email;
  }

  function renderOrderSelect() {
    var sel = document.getElementById('f-order');
    var orders = [];
    try { orders = (window.DataBus && DataBus.orders) ? DataBus.orders() : []; } catch (e) {}
    var me = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    var uid = me ? me.id : '';
    var acct = '';
    try { var st = UI.state.get(); if (st) acct = st.account || ''; } catch (e) {}
    var mine = orders.filter(function (o) { return o.owner === uid || o.counterparty === acct; });
    sel.innerHTML = '<option value="">不关联订单</option>' + mine.slice(0, 20).map(function (o) {
      return '<option value="' + o.id + '">' + o.id + ' · ' + esc(o.title || '').slice(0, 20) + '</option>';
    }).join('');
  }

  function renderList() {
    var list = [];
    try { list = (window.DataBus && DataBus.invoiceList) ? DataBus.invoiceList() : ((window.DataBus && DataBus.invoices) ? DataBus.invoices() : []); } catch (e) {}
    var me = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    var uid = me ? me.id : '';
    /* 过滤当前用户的发票（如有 uid 字段） */
    var mine = list.filter(function (x) { return !x.uid || x.uid === uid; });
    var recent = mine.slice(0, 5);
    var el = document.getElementById('inv-list');
    var empty = document.getElementById('inv-empty');
    if (!recent.length) {
      el.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    el.innerHTML = recent.map(function (x) {
      var st = ST_MAP[x.status] || ST_MAP.pending;
      var date = x.ts ? fmtDate(x.ts) : (x.applyAt || '');
      return '<div class="card" onclick="location.href=\'invoice-record.html\'">' +
        '<div class="fb-between" style="margin-bottom:8px;"><span class="text-3 fs-11">' + date + '</span><span class="tag ' + st.cls + '">' + st.label + '</span></div>' +
        '<div class="fw-600 fs-14">' + esc(x.title || '') + ' · ' + esc(x.type || '增值税普通发票') + '</div>' +
        '<div class="text-2 fs-12 mt-1">' + money(x.amount) + (x.orderId ? ' · 订单 ' + x.orderId : '') + '</div>' +
        (x.status === 'rejected' && x.rejectNote ? '<div class="text-3 fs-11 mt-1" style="color:var(--danger);">驳回原因：' + esc(x.rejectNote) + '</div>' : '') +
        (x.status === 'issued' ? '<div class="mt-2 fb-between"><span class="text-3 fs-11">发票号 ' + esc(x.invoiceNo || '') + '</span><span class="link-green fs-12">查看/下载 ›</span></div>' : '') +
        '</div>';
    }).join('');
  }

  function render() {
    renderTitleSelect();
    renderOrderSelect();
    renderList();
  }

  /* 申请开票展开/收起 */
  document.getElementById('btn-apply').onclick = function () {
    var form = document.getElementById('apply-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
    if (form.style.display === 'block') {
      renderTitleSelect();
      renderOrderSelect();
    }
  };

  /* 发票类型切换 */
  document.querySelectorAll('#f-type-seg .seg-item').forEach(function (el) {
    el.onclick = function () {
      document.querySelectorAll('#f-type-seg .seg-item').forEach(function (x) { x.classList.remove('is-on'); });
      el.classList.add('is-on');
      invType = el.getAttribute('data-t');
    };
  });

  window.cancelApply = function () {
    document.getElementById('apply-form').style.display = 'none';
  };

  window.submitApply = function () {
    var titles = loadTitles();
    var titleIdx = document.getElementById('f-title').value;
    var title = titles[titleIdx];
    if (!title) { UI.toast('请先添加发票抬头', 'warn'); return; }
    var amount = parseFloat(document.getElementById('f-amount').value);
    if (!amount || amount <= 0) { UI.toast('请输入有效的开票金额', 'warn'); return; }
    var email = document.getElementById('f-email').value.trim();
    if (!email) { UI.toast('请填写接收邮箱', 'warn'); return; }
    var orderId = document.getElementById('f-order').value;
    var payload = {
      title: title.name,
      tax: title.tax || '',
      type: invType,
      amount: amount,
      email: email,
      orderId: orderId || '',
      address: title.address || '',
      phone: title.phone || '',
      bank: title.bank || '',
      bankAccount: title.bankAccount || ''
    };
    var item = DataBus.invoiceApply(payload);
    if (item && !item.error) {
      UI.toast('开票申请已提交，待审核', 'ok');
      document.getElementById('apply-form').style.display = 'none';
      document.getElementById('f-amount').value = '';
      render();
    } else {
      UI.toast((item && item.error) || '提交失败', 'warn');
    }
  };

  window.addEventListener('engchain:invoice', render);
  window.addEventListener('engchain:store-change', render);
  render();
})();
</script>
</body>
</html>
