<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>对公支付 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">对公支付</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:8px;">
    <div class="ai-folder" style="margin-bottom:16px;">
      <div class="af-title" style="font-size:14px;display:flex;align-items:center;gap:6px;"><svg class="ic" style="width:15px;height:15px;color:var(--primary);"><use href="#i-briefcase"/></svg> 企业转账指引</div>
      <div class="af-sub">通过公对公转账至平台收款账户，上传凭证后由财务审核，<span class="green">24 小时内</span>入账。</div>
    </div>

    <div class="card" style="margin-top:12px;">
      <div class="fb-between" style="margin-bottom:10px;">
        <div class="fw-600 fs-14">平台收款账户</div>
        <button class="btn btn-ghost btn-sm" style="padding:4px 10px;font-size:11px;" onclick="copyAll()">一键复制全部</button>
      </div>
      <div class="row-mini"><span class="k">收款户名</span><span class="v"><span>四川成链信息科技有限公司</span><button class="cp-btn" onclick="cp('四川成链信息科技有限公司','户名')">复制</button></span></div>
      <div class="row-mini"><span class="k">开户银行</span><span class="v"><span>中国建设银行成都高新支行</span><button class="cp-btn" onclick="cp('中国建设银行成都高新支行','开户行')">复制</button></span></div>
      <div class="row-mini"><span class="k">收款账号</span><span class="v mono"><span>5100 0000 0000 0000 0000</span><button class="cp-btn" onclick="cp('51000000000000000000','账号')">复制</button></span></div>
    </div>

    <div class="field" style="margin-top:14px;">
      <label class="field-label">转账金额</label>
      <div class="unit-input"><input class="input" placeholder="0.00" inputmode="decimal"><span class="unit">¥</span></div>
    </div>
    <div class="field">
      <label class="field-label">上传付款凭证</label>
      <div style="padding:22px 12px;text-align:center;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg-card);color:var(--text-2);cursor:pointer;" onclick="upload()">
        <div style="margin-bottom:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);"><svg class="ic" style="width:26px;height:26px;"><use href="#i-clip"/></svg></div>
        <div style="font-size:13px;">点击上传转账回单 / 截图</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:4px;">支持 jpg · png · pdf</div>
      </div>
    </div>
  </div>

  <div class="fixed-cta"><button class="btn btn-primary btn-block btn-lg" onclick="submitPay()">提交审核</button></div>
</div>

<script src="../../js/common.js"></script>
<script>
(function () {
  window.__ROOT__ = '../../';
  window.upload = function () {
    UI.dialog({ title: '上传凭证', text: '可从相册选择或拍照上传转账回单，确保信息清晰可辨。', ok: '去相册', cancel: '取消', onOk: function () { UI.toast('已附凭证', 'ok'); } });
  };
  window.cp=function(txt,label){
    function ok(){UI.toast(label+'已复制','ok');}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok).catch(function(){fallback();});}
    else{fallback();}
    function fallback(){
      var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);
    }
  };
  window.copyAll=function(){
    window.cp('收款户名：四川成链信息科技有限公司\n开户银行：中国建设银行成都高新支行\n收款账号：51000000000000000000','收款信息');
  };
  window.submitPay = function () {
    UI.dialog({ title: '提交审核', text: '提交后将由财务核验，预计 <b style="color:var(--primary)">24 小时内</b> 完成入账。', ok: '提交', cancel: '再等等', onOk: function () { UI.toast('已提交，等待入账', 'ok'); setTimeout(function(){history.back()},900); } });
  };
})();
</script>
<style>.row-mini{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.row-mini:last-child{border-bottom:none}.row-mini .k{color:var(--text-2)}.row-mini .v{font-weight:600;text-align:right;display:flex;align-items:center;gap:8px}.cp-btn{font-size:11px;color:var(--primary);border:1px solid rgba(201,169,97,.4);background:var(--primary-soft);border-radius:6px;padding:2px 8px;cursor:pointer;flex:none;line-height:1.4}.cp-btn:active{transform:scale(.94)}</style>
</body>
</html>
