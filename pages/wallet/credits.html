function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;

<style>
  /* 积分余额 Hero 卡片 */
  .credits-hero {
    margin: 0 16px 14px;
    padding: 20px 18px 16px;
    border-radius: 18px;

    position: relative;

    box-shadow: 0 8px 24px rgba(7,17,14,.45);
  }
  .credits-hero::before {

    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(82,183,136,.22) 0%, transparent 70%);
  }
  .credits-hero::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -20px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(82,183,136,.12) 0%, transparent 70%);
  }
  .ch-label { font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: .04em; }
  .ch-balance { font-size: 36px; font-weight: 800; color: #DCC9A0; font-family: var(--font-num); margin-top: 4px; letter-spacing: -.02em; }
  .ch-balance .unit { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.5); margin-left: 4px; }

  .ch-disc { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: rgba(212,175,55,.18); color: #E8C97A; font-size: 11px; font-weight: 600; }
  .ch-free { font-size: 11px; color: rgba(255,255,255,.5); }
  .ch-free b { color: #F0D9A0; font-weight: 600; }
  .ch-progress { height: 4px; border-radius: 999px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; position: relative; z-index: 1; }
  .ch-progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #D4AF37, #F0D9A0); transition: width .4s ease; }

  /* 积分包卡片 */
  .pack-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }
  .pack-card {
    padding: 14px 8px 12px;
    border-radius: 14px;

    border: 1.5px solid var(--line);

    transition: all .2s ease;

  }
  .pack-card:active { transform: scale(.97); }

  .pack-card .pk-price { font-size: 18px; font-weight: 700; color: var(--text-1); font-family: var(--font-num); }
  .pack-card .pk-credits { font-size: 14px; font-weight: 700; color: var(--primary); margin-top: 2px; }
  .pack-card .pk-gain { font-size: 10px; color: var(--success); margin-top: 3px; font-weight: 600; }
  .pack-card .pk-gain.empty { visibility: hidden; }
  .pack-card .pk-check {
    position: absolute; top: -1px; right: -1px;
    width: 20px; height: 20px;
    background: var(--primary);

    align-items: center;

  }
  .pack-card.selected .pk-check { display: flex; }
  .pack-card .pk-check svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3; fill: none; }

  /* 支付方式 */
  .pay-methods { padding: 0 16px; margin-top: 14px; }
  .pm-label { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 10px; }
  .pm-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--bg-card);
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .2s ease;
  }
  .pm-item:active { transform: scale(.99); }
  .pm-item.selected { border-color: var(--primary); background: var(--primary-soft); }
  .pm-item .pm-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }

  .pm-item .pm-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; transition: all .2s; }
  .pm-item.selected .pm-radio { border-color: var(--primary); }

  /* 积分明细 */
  .log-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-hairline);
  }
  .log-item:last-child { border-bottom: none; }
  .log-icon {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex: none;

  .log-amount { text-align: right; flex: none; }

  .log-amount .la-num.income { color: #2E7D50; }

  /* 充值成功弹窗 */
  .recharge-success { text-align: center; padding: 10px 0; }

  .rs-icon svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.5; fill: none; }
  .rs-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
  .rs-desc { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }
  .rs-amount { font-size: 28px; font-weight: 800; color: var(--primary); font-family: var(--font-num); margin-top: 12px; }

  /* [FEAT 9.2-2] 积分有效期说明条 */
  .ttl-notice {
    margin: 0 16px 4px; padding: 10px 14px; border-radius: 12px;
    background: rgba(230,160,34,.08); border: 1px solid rgba(230,160,34,.2);
    display: flex; align-items: flex-start; gap: 9px;
  }
  .ttl-notice svg { width: 15px; height: 15px; color: #E6A022; flex: none; margin-top: 1px; }
  .ttl-notice .tn-text { font-size: 11.5px; color: var(--text-2); line-height: 1.6; }
  .ttl-notice .tn-text b { color: #E6A022; font-weight: 600; }

  /* [FEAT 9.2-3] 批量充值 */
  .batch-box { margin: 14px 16px 0; }
  .batch-input-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg-card);
  }
  .batch-input-row input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 18px; font-weight: 700; font-family: var(--font-num); color: var(--text-1);
  }
  .batch-input-row .batch-unit { font-size: 12px; color: var(--text-3); }
  .batch-tier-row { display: flex; gap: 6px; margin-top: 10px; }
  .batch-tier {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-card);
  }
  .batch-tier .bt-discount { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .batch-tier .bt-min { font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .batch-tier.on { border-color: var(--primary); background: var(--primary-soft); }
  .batch-tier.on .bt-discount { color: var(--primary-dim); }
  .batch-summary {
    margin-top: 10px; padding: 12px 14px; border-radius: 12px;
    background: var(--bg-card); border: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .batch-summary .bs-label { font-size: 12px; color: var(--text-3); }
  .batch-summary .bs-price { font-size: 20px; font-weight: 800; color: var(--text-1); font-family: var(--font-num); }
  .batch-summary .bs-price .old { font-size: 12px; color: var(--text-3); text-decoration: line-through; font-weight: 400; margin-right: 5px; }
  .batch-summary .bs-save { font-size: 11px; color: var(--success); font-weight: 600; }

  /* 空状态 */
  .empty-logs { padding: 40px 20px; text-align: center; }
  .empty-logs .el-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--bg-card-2); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .empty-logs .el-icon svg { width: 24px; height: 24px; color: var(--text-3); }

</style>

          <div class="bs-label" id="batch-tier-label">选择档位后自动计价</div>

  <!-- 底部固定充值按钮 -->

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
(function(){
window.__ROOT__='../../';

/* ---- 数据初始化 ---- */
var packs = (MOCK.business.credits && MOCK.business.credits.packages) || [
  { id:'single', price:98, credits:98 },
  { id:'pack10', price:580, credits:1000 },
  { id:'pack30', price:1280, credits:3000 }
];
var monthly = (MOCK.business.credits && MOCK.business.credits.freeQuota && MOCK.business.credits.freeQuota.monthly) || 5;
if(window.ModeStore && ModeStore.isBreakIn()) monthly += ((MOCK.business.breakin || {}).registerBonus) || 0;

var selectedPack = 1;
var selectedPay = 'balance';

/* ---- 支付方式定义 ---- */
var payMethods = [
  { id:'balance', name:'余额支付', desc:'可用余额 ¥' + (BalanceStore.read().balance || 0).toFixed(2), icon:'i-wallet', color:'#2E7D50' },
  { id:'wechat', name:'微信支付', desc:'推荐使用', icon:'i-chat', color:'#07C160' },
  { id:'alipay', name:'支付宝', desc:'安全便捷', icon:'i-box', color:'#1677FF' }
];

/* ---- 渲染积分包 ---- */
function renderPacks() {
  var box = document.getElementById('pack-list');
  box.innerHTML = packs.map(function(p, i) {
    var perPoint = p.price / p.credits;                                  // 每分折算价格
    var savePct = Math.round((1 - p.price / p.credits) * 100);           // 相对单价节省比例
    var gain = savePct > 0 ? '折合 ¥' + perPoint.toFixed(2) + '/分 · 省' + savePct + '%' : '';
    var selected = i === selectedPack;
    var rec = (i === 1) ? '<div style="position:absolute;top:6px;left:6px;font-size:9px;font-weight:700;color:#fff;background:var(--primary);padding:1px 6px;border-radius:99px;">推荐</div>' : '';
    return '<div class="pack-card' + (selected ? ' selected' : '') + '" onclick="selectPack(' + i + ')">' +
      rec +
      '<div class="pk-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div class="pk-price">¥' + p.price + '</div>' +
      '<div class="pk-credits">' + p.credits + ' 积分</div>' +
      '<div class="pk-gain' + (gain ? '' : ' empty') + '">' + (gain || 'placeholder') + '</div>' +
    '</div>';
  }).join('');
}
window.selectPack = function(i) { selectedPack = i; renderPacks(); updateCTA(); };

/* ---- 渲染支付方式 ---- */
function renderPayMethods() {
  var box = document.getElementById('pm-list');
  var bal = BalanceStore.read().balance || 0;
  payMethods[0].desc = '可用余额 ¥' + bal.toFixed(2);
  box.innerHTML = payMethods.map(function(pm) {
    var selected = pm.id === selectedPay;
    return '<div class="pm-item' + (selected ? ' selected' : '') + '" onclick="selectPay(\'' + pm.id + '\')">' +
      '<div class="pm-icon" style="background:' + pm.color + '15;color:' + pm.color + ';">' +
        '<svg class="ic"><use href="#' + pm.icon + '"/></svg>' +
      '</div>' +
      '<div class="pm-body"><div class="pm-name">' + pm.name + '</div><div class="pm-desc">' + pm.desc + '</div></div>' +
      '<div class="pm-radio"></div>' +
    '</div>';
  }).join('');
}
window.selectPay = function(id) { selectedPay = id; renderPayMethods(); updateCTA(); };

/* ---- 更新底部按钮状态 ---- */
function updateCTA() {
  var btn = document.getElementById('cta');
  var p = packs[selectedPack];
  /* [FIX BM-018] 余额支付用 BalanceStore.available() 排除冻结资金，不得用 raw balance */
  var avail = BalanceStore.available();
  if (selectedPay === 'balance' && avail < p.price) {
    btn.textContent = '余额不足，去充值';
    btn.style.opacity = '.7';
  } else if (selectedPay === 'wechat' || selectedPay === 'alipay') {
    /* [FIX BM-017] 非余额通道明确标注"原型模拟支付" */
    btn.textContent = '模拟支付 ¥' + p.price + ' · ' + p.credits + '积分';
    btn.style.opacity = '1';
  } else {
    btn.textContent = '确认充值 ¥' + p.price + ' · ' + p.credits + '积分';
    btn.style.opacity = '1';
  }
}

/* ---- 执行充值 ---- */
window.doRecharge = function() {
  var p = packs[selectedPack];
  /* [FIX BM-033] 风控封禁用户前台拦截：被封禁则禁止充值/购积分 */
  try {
    var _curU = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    if (_curU && _curU.banned) {
      UI.toast('账号已被封禁，无法执行此操作', 'warn');
      return;
    }
  } catch (e) {}

  /* [FIX BM-018] 用 BalanceStore.available() 校验可用余额（排除冻结资金），不得用 raw balance */
  var avail = BalanceStore.available();
  if (selectedPay === 'balance') {
    if (avail < p.price) {
      UI.toast('可用余额不足，请先充值余额或选择其他支付方式', 'warn');
      return;
    }
    /* 余额支付：经 BalanceStore 统一方法扣减（read→修改→write，Math.round 规整 + logs 记录 type=buy_credits） */
    var bs = BalanceStore.read();
    bs.balance = Math.round((bs.balance - p.price) * 100) / 100;
    bs.logs.unshift({ type:'buy_credits', amount:-p.price, method:'balance',
      reason:'购买积分包 · ' + p.credits + '积分', ts:Date.now(), status:'success' });
    BalanceStore.write(bs);
  } else {
    /* E2-11 微信/支付宝为外部支付通道：钱包余额不变，仅写 recharge_sim 流水标记，
       人民币侧由对应支付渠道实际扣款（原型不真实动账）。 */
    var method = selectedPay === 'wechat' ? 'wechat' : 'alipay';
    var payName = method === 'wechat' ? '微信支付' : '支付宝';
    var bs2 = BalanceStore.read();
    bs2.logs.unshift({
      type:'recharge_sim', amount:0, method: method,
      reason:'模拟支付(' + payName + ') 购买积分包 · 钱包余额不变',
      ts:Date.now(), status:'success', simulated: true
    });
    BalanceStore.write(bs2);
    UI.toast('模拟支付 ¥' + p.price + '（' + payName + '）已完成，钱包余额不变', 'ok');
  }
  /* 积分到账：统一走 CreditStore.add */
  var srcName = selectedPay === 'balance' ? '余额支付' : (selectedPay === 'wechat' ? '微信支付(模拟)' : '支付宝(模拟)');
  CreditStore.add(p.credits, '购买积分包', {
    type:'recharge',
    source: srcName,
    orderId: 'CR' + Date.now(),
    status:'success',
    fromUser: '平台'
  });
  /* 显示成功弹窗 */
  showRechargeSuccess(p);
  render();
  renderPayMethods();
  updateCTA();
};

/* ---- [FEAT 9.2-2] 积分有效期：即将过期提示 ---- */
function renderTtl() {
  var soon = CreditStore.expiringSoon ? CreditStore.expiringSoon(30) : 0;
  var el = document.getElementById('ttl-soon');
  if (el) el.textContent = soon > 0 ? ('未来 30 天将有 <b>' + soon.toLocaleString() + '</b> 积分到期，建议尽快使用。') : '';
}

/* ---- [FEAT 9.2-3] 批量充值折扣梯度 ----
   基准单价取现有最高档积分包的单价（尊享包 1280元/3000积分），批量数量命中档位后按折扣计价 */
var bdCfg = (MOCK.business.credits && MOCK.business.credits.batchDiscount) || { enabled: false, minAmount: 1000, tiers: [] };
function batchBaseRate() {
  var pk = packs[packs.length - 1] || { price: 1280, credits: 3000 };
  return pk.price / pk.credits;
}
function batchTierOf(amount) {
  if (!bdCfg.enabled) return { discount: 1, label: '', min: 0 };
  var best = { discount: 1, label: '', min: 0 };
  (bdCfg.tiers || []).forEach(function (t) {
    if (amount >= t.min && t.discount < best.discount) best = t;
  });
  return best;
}
function renderBatchTiers() {
  var box = document.getElementById('batch-tiers');
  if (!box || !bdCfg.enabled) { if (box) box.innerHTML = ''; return; }
  box.innerHTML = (bdCfg.tiers || []).map(function (t) {
    return '<div class="batch-tier" data-min="' + t.min + '">' +
      '<div class="bt-discount">' + t.label + '</div><div class="bt-min">≥' + t.min + ' 积分</div></div>';
  }).join('');
}
function batchRecalc() {
  var raw = parseInt(document.getElementById('batch-amount').value, 10) || 0;
  var min = bdCfg.minAmount || 1000;
  var tier = batchTierOf(raw);
  var priceEl = document.getElementById('batch-price');
  var labelEl = document.getElementById('batch-tier-label');
  var saveEl = document.getElementById('batch-save');
  document.querySelectorAll('.batch-tier').forEach(function (el) {
    el.classList.toggle('on', raw >= parseInt(el.getAttribute('data-min'), 10));
  });
  if (raw < min) {
    priceEl.innerHTML = '<span style="font-size:13px;color:var(--text-3);font-weight:400;">满 ' + min + ' 积分享折扣</span>';
    labelEl.textContent = '批量充值';
    saveEl.textContent = '';
    return;
  }
  var base = Math.round(raw * batchBaseRate() * 100) / 100;
  var finalPrice = Math.round(raw * batchBaseRate() * tier.discount * 100) / 100;
  priceEl.innerHTML = (tier.discount < 1 ? '<span class="old">¥' + base.toFixed(2) + '</span>' : '') + '¥' + finalPrice.toFixed(2);
  labelEl.textContent = tier.discount < 1 ? '批量充值 · ' + tier.label : '批量充值';
  saveEl.textContent = tier.discount < 1 ? '已省 ¥' + (base - finalPrice).toFixed(2) : '';
  return { amount: raw, price: finalPrice, base: base, tier: tier };
}
window.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'batch-amount') batchRecalc();
});
window.doBatchRecharge = function () {
  var info = batchRecalc();
  if (!info) { UI.toast('请输入不低于 ' + (bdCfg.minAmount || 1000) + ' 的积分数量', 'warn'); return; }
  /* [FIX BM-018] 用 BalanceStore.available() 校验可用余额 */
  var avail = BalanceStore.available();
  if (selectedPay === 'balance' && avail < info.price) {
    UI.toast('可用余额不足，请先充值余额或选择其他支付方式', 'warn'); return;
  }
  var bs = BalanceStore.read();
  bs.balance = Math.round((bs.balance - info.price) * 100) / 100;
  bs.logs.unshift({ type:'buy_credits', amount:-info.price, method: selectedPay,
    reason:'批量充值 · ' + info.amount + ' 积分（' + (info.tier.label || '原价') + '）', ts:Date.now(), status:'success' });
  BalanceStore.write(bs);
  CreditStore.add(info.amount, '批量充值', {
    type:'recharge', source:'批量充值',
    orderId:'BR' + Date.now(), status:'success', fromUser:'平台',
    discount: info.tier.discount, batch:true
  });
  UI.toast('批量充值成功 · +' + info.amount + ' 积分', 'ok');
  render();
};

/* ---- 渲染主数据 ---- */
function render() {
  var c = CreditStore.read();
  document.getElementById('bal-num').textContent = c.balance.toLocaleString();

  /* 折扣标签 */
  var entry = EntryStore.read();
  var disc = window.creditDiscount ? creditDiscount() : 1;
  var discTag = document.getElementById('disc-tag');
  if (entry.type && entry.active) {
    var t = MOCK.entryTypeById(entry.type);
    discTag.textContent = (t ? t.label : '入驻') + ' · ' + Math.round(disc * 10) + ' 折';
  } else if (window.deriveIdentity && deriveIdentity().partner) {
    discTag.textContent = '个人合伙人 · 8 折';
  } else {
    discTag.textContent = '入驻享折扣';
  }

  /* 免费额度 */
  var used = CreditStore.freeUsed();
  var remain = Math.max(monthly - used, 0);
  document.getElementById('free-remain').textContent = remain;
  document.getElementById('free-bar').style.width = Math.min(used / monthly * 100, 100) + '%';

  /* 积分明细 */
  renderLogs(c.logs || []);
  renderTtl(); /* [FEAT 9.2-2] 即将过期提示 */
}

/* ---- 积分明细类型配置 ---- */
var logTypeConfig = {
  recharge: { icon:'i-wallet', label:'充值' },
  unlock: { icon:'i-eye', label:'解锁' },
  bonus: { icon:'i-star', label:'奖励' },
  refund: { icon:'i-rotate', label:'退款' },
  transfer: { icon:'i-share', label:'转出' },
  credits_expired: { icon:'i-clock', label:'过期' } /* [FEAT 9.2-2] 积分到期清零流水 */
};

/* ---- 渲染积分明细 ---- */
function renderLogs(logs) {
  var box = document.getElementById('log-list');
  var countEl = document.getElementById('log-count');
  countEl.textContent = logs.length ? '共 ' + logs.length + ' 条' : '';

  if (!logs.length) {
    box.innerHTML = '<div class="empty-logs">' +
      '<div class="el-icon"><svg class="ic"><use href="#i-doc"/></svg></div>' +
      '<div class="el-title">暂无积分记录</div>' +
      '<div class="el-desc">充值或解锁后将在此显示明细</div>' +
    '</div>';
    return;
  }

  box.innerHTML = logs.slice(0, 20).map(function(l) {
    var cfg = logTypeConfig[l.type] || logTypeConfig.unlock;
    var isIncome = l.credits >= 0;
    var d = new Date(l.ts);
    var ds = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var counterparty = l.toUser ? ('→ ' + l.toUser) : (l.fromUser ? ('← ' + l.fromUser) : '');
    var source = l.source || (l.type === 'recharge' ? '平台充值' : (l.type === 'bonus' ? '任务奖励' : '平台'));
    var statusText = l.status === 'pending' ? '处理中' : (l.status === 'failed' ? '失败' : '成功');
    var statusClass = l.status || 'success';

    return '<div class="log-item">' +
      '<div class="log-icon type-' + l.type + '"><svg class="ic"><use href="#' + cfg.icon + '"/></svg></div>' +
      '<div class="log-body">' +
        '<div class="log-title">' + cfg.label + ' · ' + l.reason +
          (counterparty ? '<span class="log-counterparty">' + counterparty + '</span>' : '') +
        '</div>' +
        '<div class="log-meta">' +
          '<span>' + ds + '</span>' +
          '<span class="log-source">' + source + '</span>' +
          (l.orderId ? '<span>单号 ' + l.orderId + '</span>' : '') +
          '<span class="log-status ' + statusClass + '">' + statusText + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="log-amount">' +
        '<div class="la-num ' + (isIncome ? 'income' : 'expense') + '">' + (isIncome ? '+' : '') + l.credits + '</div>' +
        '<div class="la-label">积分</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ---- 获取积分任务区（保持原有功能） ---- */
window.addEventListener('engchain:credits', render);
window.addEventListener('engchain:mode', render);
window.addEventListener('engchain:store-change', render);

var RW = (MOCK.business.credits && MOCK.business.credits.rewards) || {};
function renderTasks() {
  var box = document.getElementById('task-wrap');
  if (!box) return;
  var st = (window.UI && UI.state) ? UI.state.get() : {};
  if (st.loggedIn === false) {
    box.innerHTML = '<div class="section-title" style="margin-top:18px;"><div class="st-left">获取积分</div></div>' +
      '<div class="card" style="margin:0 16px;padding:16px;text-align:center;"><div class="fw-600 fs-14">登录后获取积分</div>' +
      '<div class="text-3 fs-12" style="margin-top:6px;line-height:1.7;">签到、实名认证、企业入驻、邀请好友均可获取积分</div>' +
      '<a href="../auth/login.html" class="btn btn-primary" style="margin-top:12px;display:inline-flex;">去登录</a></div>';
    return;
  }
  var a = AuthStore.read();
  var e = EntryStore.read();
  var ci = CheckinStore.read();
  var checked = CheckinStore.checkedToday();
  var realDone = !!(a.realname && a.realname.ok);
  var entryDone = !!(e.type && e.active);
  var realClaimed = CreditStore.claimed('realname');
  var entryClaimed = CreditStore.claimed('entry');
  var cards = [
    { icon:'i-clock', name:'每日签到', rw:'+' + ((RW.checkin) || 10), state: checked ? '已签到' : '签到', desc: checked ? ('今日已签 · 连续 ' + ci.count + ' 天') : ('签到得积分，连续 ' + (RW.checkinStreakDays || 7) + ' 天额外 +' + (RW.checkinStreak || 50)), tap: checked ? null : 'checkin' },
    { icon:'i-user', name:'实名认证', rw:'+' + ((RW.realname) || 100), state: realClaimed ? '已完成' : (realDone ? '领取' : '去认证'), desc: realClaimed ? '已获得实名奖励' : (realDone ? '认证已完成，领取奖励' : '完成实名认证，免费领积分'), tap: realClaimed ? null : (realDone ? 'claimReal' : '../profile/auth-personal.html') },
    { icon:'i-bank', name:'企业入驻', rw:'+' + ((RW.entry) || 500), state: entryClaimed ? '已完成' : (entryDone ? '领取' : '去入驻'), desc: entryClaimed ? '已获得入驻奖励' : (entryDone ? '入驻已生效，领取奖励' : '入驻企业专享奖励'), tap: entryClaimed ? null : (entryDone ? 'claimEntry' : '../profile/entry.html') },
    { icon:'i-chat', name:'邀请好友', rw:'+' + ((RW.invite) || 50), state:'复制邀请码', desc:'好友注册填写您的邀请码，双方各得积分', tap:'copyInvite' }
  ];
  var h = '<div class="section-title" style="margin-top:18px;"><div class="st-left">获取积分</div></div>';
  h += '<div style="padding:0 16px;">' + cards.map(function(c) {
    var btn;
    if (c.tap === null) { btn = '<span class="text-3 fs-12" style="flex:none;">' + c.state + '</span>'; }
    else if (c.state === '去认证' || c.state === '去入驻') { btn = '<a class="btn btn-primary" style="padding:6px 14px;font-size:12px;flex:none;display:inline-flex;" href="' + c.tap + '">' + c.state + '</a>'; }
    else { btn = '<button class="btn btn-primary" style="padding:6px 14px;font-size:12px;flex:none;" onclick="taskTap(\'' + c.tap + '\')">' + c.state + '</button>'; }
    return '<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;">' +
      '<span class="tx-ic" style="flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--bg-card-2);color:var(--primary);"><svg class="ic" style="width:19px;height:19px;"><use href="#' + c.icon + '"/></svg></span>' +
      '<div style="flex:1;min-width:0;"><div class="fw-600 fs-13">' + c.name + ' <span style="color:var(--primary);font-size:11px;">' + c.rw + '</span></div>' +
      '<div class="text-3 fs-11" style="margin-top:2px;">' + c.desc + '</div></div>' + btn + '</div>';
  }).join('') + '</div>';
  box.innerHTML = h;
}
window.taskTap = function(t) {
  if (t === 'checkin') { var r = CheckinStore.checkin(); if (r.ok) { UI.toast('签到成功 +' + r.credits + ' 分', 'ok'); } else { UI.toast('今日已签到', 'warn'); } }
  else if (t === 'claimReal') { if (CreditStore.claim('realname', null, '实名认证奖励')) { UI.toast('领取成功', 'ok'); } else { UI.toast('已领取过', 'warn'); } }
  else if (t === 'claimEntry') { if (CreditStore.claim('entry', null, '企业入驻奖励')) { UI.toast('领取成功', 'ok'); } else { UI.toast('已领取过', 'warn'); } }
  else if (t === 'copyInvite') {
    var acct = ((window.UI && UI.state) ? UI.state.get() : {}).account || 'demo@engchain.cn';
    function done() { UI.toast('邀请码已复制', 'ok'); }
    function fb() { var ta = document.createElement('textarea'); ta.value = acct; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done(); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(acct).then(done, fb); } else { fb(); }
  }
  setTimeout(function() { renderTasks(); render(); }, 400);
};

renderPacks();
renderPayMethods();
renderTasks();
render();
renderBatchTiers(); /* [FEAT 9.2-3] */
updateCTA();

})();
