<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/wallet/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的积分 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">我的积分</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll" style="padding-top:8px;">
    <!-- 余额卡片 -->
    <div class="ai-folder" style="margin-bottom:14px;">
      <div class="fb-between">
        <div><div class="af-sub">当前积分余额</div><div class="fw-700" style="font-size:26px;color:var(--primary);font-family:var(--font-num);" id="bal-num">0</div></div>
        <span class="tag tag-primary" id="disc-tag">无折扣</span>
      </div>
      <div class="text-3 fs-12" style="margin-top:8px;">实名及以上用户每月享 <b id="free-monthly">5</b> 条免费解锁；入驻会员解锁享积分折扣</div>
    </div>

    <!-- 获取积分任务区（v1.3） -->
    <div id="task-wrap"></div>

    <!-- 免费额度 -->
    <div class="card" style="margin-bottom:14px;">
      <div class="fb-between" style="margin-bottom:8px;"><span class="fw-600 fs-14">本月免费额度</span><span class="text-2 fs-12" id="free-txt"></span></div>
      <div style="height:6px;border-radius:999px;background:var(--bg-card-2);overflow:hidden;"><div style="height:100%;width:0%;border-radius:999px;background:var(--primary);transition:width .4s;" id="free-bar"></div></div>
    </div>

    <!-- 充值三档 -->
    <div class="section-title"><div class="st-left">充值积分</div><span class="more" id="recharge-note">¥1 ≈ 1 积分起</span></div>
    <div id="pack-list" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
    <div class="text-3 fs-12" style="margin-top:8px;color:var(--text-3);">充值积分用于解锁供需详情；建企转让按 ¥5,000 可退保证金（不走积分）。</div>

    <!-- 消费记录 -->
    <div class="section-title" style="margin-top:18px;"><div class="st-left">积分明细</div></div>
    <div id="log-list"></div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script>
(function(){window.__ROOT__='../../';
var packs=(MOCK.business.credits&&MOCK.business.credits.packages)||[{id:'single',price:98,credits:98},{id:'pack10',price:580,credits:1000},{id:'pack30',price:1280,credits:3000}];
var monthly=(MOCK.business.credits&&MOCK.business.credits.freeQuota&&MOCK.business.credits.freeQuota.monthly)||5;
if(window.ModeStore&&ModeStore.isBreakIn())monthly+=((MOCK.business.breakin||{}).registerBonus)||0;
document.getElementById('free-monthly').textContent=monthly;
var entry=EntryStore.read();
var disc=window.creditDiscount?creditDiscount():1;
var discTag=document.getElementById('disc-tag');
if(entry.type&&entry.active){
  var t=MOCK.entryTypeById(entry.type);
  discTag.textContent=(t?t.label:'入驻')+' · '+Math.round(disc*10)+' 折';
}else{discTag.textContent='入驻享折扣';}

function render(){
  var c=CreditStore.read();
  document.getElementById('bal-num').textContent=c.balance.toLocaleString();
  var used=CreditStore.freeUsed();
  var remain=Math.max(monthly-used,0);
  document.getElementById('free-txt').textContent='已用 '+used+' / 共 '+monthly+' 条 · 剩 '+remain+' 条';
  document.getElementById('free-bar').style.width=Math.min(used/monthly*100,100)+'%';
  var logs=c.logs||[];
  var box=document.getElementById('log-list');
  if(!logs.length){box.innerHTML='<div class="card"><div class="text-3 fs-12">暂无积分记录</div></div>';return;}
  box.innerHTML=logs.slice(0,12).map(function(l){
    var d=new Date(l.ts);var ds=(d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    var sign=l.credits>=0?'+':'';
    var col=l.credits>=0?'var(--success)':'var(--text-1)';
    return '<div class="card" style="margin-bottom:8px;"><div class="fb-between"><div><div class="fw-600 fs-13">'+l.reason+'</div><div class="text-3 fs-11 mt-1">'+ds+' · '+(l.type==='recharge'?'充值':'解锁')+'</div></div><span class="mono fw-700" style="color:'+col+';">'+sign+l.credits+'</span></div></div>';
  }).join('');
}
render();

/* ---- 获取积分任务区（v1.3：签到/实名/入驻/邀请） ---- */
window.addEventListener('engchain:credits', render);
window.addEventListener('engchain:mode', render);
window.addEventListener('engchain:store-change', render);
var RW = (MOCK.business.credits && MOCK.business.credits.rewards) || {};
function renderTasks(){
  var box=document.getElementById('task-wrap');
  if(!box)return;
  var st=(window.UI&&UI.state)?UI.state.get():{};
  if(st.loggedIn===false){
    box.innerHTML='<div class="section-title" style="margin-top:18px;"><div class="st-left">获取积分</div></div>'+
      '<div class="card" style="padding:16px;text-align:center;"><div class="fw-600 fs-14">登录后获取积分</div>'+
      '<div class="text-3 fs-12" style="margin-top:6px;line-height:1.7;">签到、实名认证、企业入驻、邀请好友均可获取积分</div>'+
      '<a href="../auth/login.html" class="btn btn-primary" style="margin-top:12px;display:inline-flex;">去登录</a></div>';
    return;
  }
  var a=AuthStore.read();
  var e=EntryStore.read();
  var ci=CheckinStore.read();
  var checked=CheckinStore.checkedToday();
  var realDone=!!(a.realname&&a.realname.ok);
  var entryDone=!!(e.type&&e.active);
  var realClaimed=CreditStore.claimed('realname');
  var entryClaimed=CreditStore.claimed('entry');
  var cards=[
    { icon:'i-clock', name:'每日签到', rw:'+'+((RW.checkin)||10), state: checked?'已签到':'签到', desc: checked?('今日已签 · 连续 '+ci.count+' 天'):('签到得积分，连续 '+(RW.checkinStreakDays||7)+' 天额外 +'+(RW.checkinStreak||50)), tap: checked?null:'checkin' },
    { icon:'i-user', name:'实名认证', rw:'+'+((RW.realname)||100), state: realClaimed?'已完成':(realDone?'领取':'去认证'), desc: realClaimed?'已获得实名奖励':(realDone?'认证已完成，领取奖励':'完成实名认证，免费领积分'), tap: realClaimed?null:(realDone?'claimReal':'../profile/auth-personal.html') },
    { icon:'i-bank', name:'企业入驻', rw:'+'+((RW.entry)||500), state: entryClaimed?'已完成':(entryDone?'领取':'去入驻'), desc: entryClaimed?'已获得入驻奖励':(entryDone?'入驻已生效，领取奖励':'入驻企业专享奖励'), tap: entryClaimed?null:(entryDone?'claimEntry':'../profile/entry.html') },
    { icon:'i-chat', name:'邀请好友', rw:'+'+((RW.invite)||50), state:'复制邀请码', desc:'好友注册填写您的邀请码，双方各得积分', tap:'copyInvite' }
  ];
  var h='<div class="section-title" style="margin-top:18px;"><div class="st-left">获取积分</div></div>';
  h+=cards.map(function(c){
    var btn;
    if(c.tap===null){btn='<span class="text-3 fs-12" style="flex:none;">'+c.state+'</span>';}
    else if(c.state==='去认证'||c.state==='去入驻'){btn='<a class="btn btn-primary" style="padding:6px 14px;font-size:12px;flex:none;display:inline-flex;" href="'+c.tap+'">'+c.state+'</a>';}
    else{btn='<button class="btn btn-primary" style="padding:6px 14px;font-size:12px;flex:none;" onclick="taskTap(\''+c.tap+'\')">'+c.state+'</button>';}
    return '<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;">'+
      '<span class="tx-ic" style="flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--bg-card-2);color:var(--primary);"><svg class="ic" style="width:19px;height:19px;"><use href="#'+c.icon+'"/></svg></span>'+
      '<div style="flex:1;min-width:0;"><div class="fw-600 fs-13">'+c.name+' <span style="color:var(--primary);font-size:11px;">'+c.rw+'</span></div>'+
      '<div class="text-3 fs-11" style="margin-top:2px;">'+c.desc+'</div></div>'+btn+'</div>';
  }).join('');
  box.innerHTML=h;
}
window.taskTap=function(t){
  if(t==='checkin'){var r=CheckinStore.checkin();if(r.ok){UI.toast('签到成功 +'+r.credits+' 分','ok');}else{UI.toast('今日已签到','warn');}}
  else if(t==='claimReal'){if(CreditStore.claim('realname',null,'实名认证奖励')){UI.toast('领取成功','ok');}else{UI.toast('已领取过','warn');}}
  else if(t==='claimEntry'){if(CreditStore.claim('entry',null,'企业入驻奖励')){UI.toast('领取成功','ok');}else{UI.toast('已领取过','warn');}}
  else if(t==='copyInvite'){
    var acct=((window.UI&&UI.state)?UI.state.get():{}).account||'demo@engchain.cn';
    function done(){UI.toast('邀请码已复制','ok');}
    function fb(){var ta=document.createElement('textarea');ta.value=acct;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(acct).then(done,fb);}else{fb();}
  }
  setTimeout(function(){renderTasks();render();},400);
};
renderTasks();

var plist=document.getElementById('pack-list');
plist.innerHTML=packs.map(function(p,i){
  var gain=p.price>=580?'多送'+((p.credits-p.price)/p.price*100).toFixed(0)+'%':'';
  return '<div class="card" style="padding:12px 8px;text-align:center;cursor:pointer;" onclick="recharge('+i+')">'+
    '<div class="mono fw-700" style="font-size:16px;color:var(--text-1);">¥'+p.price+'</div>'+
    '<div class="fw-600" style="font-size:13px;color:var(--primary);margin-top:2px;">'+p.credits+' 积分</div>'+
    (gain?'<div class="text-3" style="font-size:10px;margin-top:2px;">'+gain+'</div>':'<div class="text-3" style="font-size:10px;margin-top:2px;">&nbsp;</div>')+
    '<div class="btn btn-primary" style="margin-top:8px;padding:5px 0;font-size:11px;width:100%;">充值</div>'+
  '</div>';
}).join('');
window.packs=packs;
window.recharge=function(i){
  var p=window.packs[i];
  var sh=UI.sheet(); sh.setText('充值确认'); sh.html(
    '<div style="text-align:center;padding:6px 0 2px;">'+
      '<div style="font-size:13px;color:var(--text-2);">支付 ¥'+p.price+'</div>'+
      '<div class="mono fw-700" style="font-size:22px;color:var(--primary);margin-top:6px;">'+p.credits+' 积分</div>'+
      '<div style="font-size:11px;color:var(--text-3);margin-top:6px;">模拟支付 · 到账即时可用 · 积分有效期 1 年</div>'+
    '</div>'+
    '<button class="btn btn-primary btn-block btn-lg" style="margin-top:16px;" onclick="__doRecharge('+i+')">确认支付 ¥'+p.price+'</button>'+
    '<button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="UI.closeSheet()">取消</button>'
  ).show();
};
window.__doRecharge=function(i){
  var p=window.packs[i];
  CreditStore.add(p.credits,'充值 ¥'+p.price);
  UI.closeSheet();
  UI.toast('充值成功 · 到账 '+p.credits+' 积分','ok');
  setTimeout(function(){render();},500);
};
})();
</script>
</body>
</html>
