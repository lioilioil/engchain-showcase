(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}

<title>积分充值 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  .cr-scroll{padding:12px var(--page-pad) 120px;}

  /* ===== ① 轻量价值概览条 ===== */
  .cr-overview{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    background:var(--bg-card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;
    box-shadow:var(--shadow-xs);}
  .ov-left{display:flex;align-items:center;gap:10px;}
  .ov-ic{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dim);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .ov-ic svg{width:18px;height:18px;}
  .ov-balance{font-size:20px;font-weight:800;color:var(--text-1);font-family:var(--font-num);line-height:1;}
  .ov-balance .unit{font-size:11px;color:var(--text-3);font-weight:500;margin-left:3px;}
  .ov-benefit{font-size:10.5px;color:var(--text-3);margin-top:3px;}
  .ov-free{text-align:right;}
  .ov-free-label{font-size:10.5px;color:var(--text-3);}
  .ov-free-num{font-size:14px;font-weight:700;color:var(--primary-dim);font-family:var(--font-num);margin-top:1px;}

  /* ===== ② 金额选择区 ===== */
  .cr-section{margin-bottom:18px;}
  .sec-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
  .sec-bar{width:3px;height:13px;background:var(--primary);border-radius:2px;}
  .sec-title{font-size:14px;font-weight:700;color:var(--text-1);}
  .sec-hint{margin-left:auto;font-size:11px;color:var(--text-3);}

  .pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pack-card{padding:14px 6px 12px;border-radius:14px;background:var(--bg-card);
    border:1.5px solid var(--line);text-align:center;cursor:pointer;transition:all .2s;position:relative;}
  .pack-card:active{transform:scale(.97);}
  .pack-card.selected{border-color:var(--primary);background:var(--primary-soft);
    box-shadow:0 4px 14px rgba(184,153,104,.18);}
  .pk-tag{position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:#fff;
    font-size:9px;font-weight:700;padding:2px 10px;border-radius:0 0 8px 8px;}
  .pk-price{font-size:19px;font-weight:800;color:var(--text-1);font-family:var(--font-num);margin-top:6px;}
  .pk-credits{font-size:13px;font-weight:700;color:var(--primary-dim);margin-top:2px;}
  .pk-save{font-size:10px;color:var(--success);margin-top:4px;font-weight:600;}
  .pk-save.empty{visibility:hidden;}
  .pk-check{position:absolute;top:6px;right:6px;width:18px;height:18px;background:var(--primary);
    border-radius:50%;display:none;align-items:center;justify-content:center;}
  .pack-card.selected .pk-check{display:flex;}
  .pk-check svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none;}

  /* 批量输入区 */
  .batch-box{margin-top:10px;padding:13px 14px;background:var(--bg-card);
    border:1px solid var(--line);border-radius:14px;}
  .batch-head{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .batch-head svg{width:14px;height:14px;color:var(--primary-dim);}
  .batch-head-text{font-size:12.5px;font-weight:600;color:var(--text-2);}
  .batch-input-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--bg);}
  .batch-input-row input{flex:1;border:none;outline:none;background:transparent;
    font-size:17px;font-weight:700;font-family:var(--font-num);color:var(--text-1);}
  .batch-unit{font-size:12px;color:var(--text-3);}
  .batch-tiers{display:flex;gap:6px;margin-top:8px;}
  .batch-tier{flex:1;text-align:center;padding:6px 4px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg-card);}
  .batch-tier .bt-label{font-size:12px;font-weight:700;color:var(--text-2);}
  .batch-tier .bt-min{font-size:9.5px;color:var(--text-3);margin-top:1px;}
  .batch-tier.on{border-color:var(--primary);background:var(--primary-soft);}
  .batch-tier.on .bt-label{color:var(--primary-dim);}
  .batch-summary{margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
  .bs-info .bs-label{font-size:11.5px;color:var(--text-3);}
  .bs-info .bs-price{font-size:19px;font-weight:800;color:var(--text-1);font-family:var(--font-num);margin-top:1px;}
  .bs-info .bs-price .old{font-size:12px;color:var(--text-3);text-decoration:line-through;font-weight:400;margin-right:5px;}
  .bs-save{font-size:11px;color:var(--success);font-weight:600;text-align:right;}

  /* ===== ③ 支付方式 ===== */
  .pay-list{display:flex;flex-direction:column;gap:8px;}
  .pm-item{display:flex;align-items:center;gap:12px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:12px;background:var(--bg-card);cursor:pointer;transition:all .2s;}
  .pm-item:active{transform:scale(.99);}
  .pm-item.selected{border-color:var(--primary);background:var(--primary-soft);}
  .pm-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .pm-icon svg{width:18px;height:18px;}
  .pm-body{flex:1;min-width:0;}
  .pm-name{font-size:14px;font-weight:600;color:var(--text-1);}
  .pm-desc{font-size:11px;color:var(--text-3);margin-top:1px;}
  .pm-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .pm-item.selected .pm-radio{border-color:var(--primary);}
  .pm-item.selected .pm-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--primary);}

  /* ===== ④ 免费获取积分 ===== */
  .task-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .task-card{display:flex;align-items:center;gap:10px;padding:11px 12px;
    background:var(--bg-card);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;}
  .task-card:active{transform:scale(.97);}
  .task-ic{width:32px;height:32px;border-radius:9px;background:var(--bg-card-2);color:var(--primary-dim);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .task-ic svg{width:16px;height:16px;}
  .task-body{flex:1;min-width:0;}
  .task-name{font-size:12.5px;font-weight:600;color:var(--text-1);}
  .task-reward{font-size:11px;color:var(--success);font-weight:600;}
  .task-btn{font-size:11px;font-weight:600;color:var(--primary-dim);flex:none;}

  /* ===== ⑤ 积分明细 ===== */
  .log-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .log-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-hairline);}
  .log-item:last-child{border-bottom:none;}
  .log-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .log-icon svg{width:17px;height:17px;}
  .log-icon.type-recharge{background:rgba(46,125,80,.1);color:#2E7D50;}
  .log-icon.type-unlock{background:rgba(184,153,104,.1);color:#B89968;}
  .log-icon.type-bonus{background:rgba(230,126,34,.1);color:#E67E22;}
  .log-icon.type-refund{background:rgba(52,152,219,.1);color:#3498DB;}
  .log-icon.type-transfer{background:rgba(155,89,182,.1);color:#9B59B6;}
  .log-body{flex:1;min-width:0;}
  .log-title{font-size:13px;font-weight:600;color:var(--text-1);}
  .log-meta{font-size:10.5px;color:var(--text-3);margin-top:2px;}
  .log-amount{text-align:right;flex:none;}
  .log-num{font-size:14.5px;font-weight:700;font-family:var(--font-num);}
  .log-num.income{color:#2E7D50;}
  .log-num.expense{color:var(--text-1);}
  .log-label{font-size:9.5px;color:var(--text-3);margin-top:1px;}

  .empty-logs{padding:36px 20px;text-align:center;}
  .empty-ic{width:44px;height:44px;border-radius:12px;background:var(--bg-card-2);
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .empty-ic svg{width:22px;height:22px;color:var(--text-3);}
  .empty-title{font-size:13px;font-weight:600;color:var(--text-2);}
  .empty-desc{font-size:11.5px;color:var(--text-3);margin-top:3px;}

  /* ===== ⑥ 底部信任区 ===== */
  .trust-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
  .trust-item{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-3);}
  .trust-item svg{width:12px;height:12px;}

  /* 充值成功弹窗 */
  .recharge-success{text-align:center;padding:10px 0;}
  .rs-icon{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2E7D50,#4CAF7D);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .rs-icon svg{width:28px;height:28px;stroke:#fff;stroke-width:2.5;fill:none;}
  .rs-title{font-size:17px;font-weight:700;color:var(--text-1);}
  .rs-desc{font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.6;}
  .rs-amount{font-size:28px;font-weight:800;color:var(--primary-dim);font-family:var(--font-num);margin-top:12px;}

  /* 375px适配 */
  @media(max-width:375px){
    .pack-grid{gap:8px;}
    .pack-card{padding:12px 4px 10px;}
    .pk-price{font-size:17px;}
    .task-grid{gap:6px;}
    .task-card{padding:10px;}
  }
</style>
</head>

<script>
(function(){
window.__ROOT__='../../';

/* ---- 数据初始化 ---- */
var packs = (MOCK.business.credits && MOCK.business.credits.packages) || [
  { id:'single', price:98, credits:98 },
  { id:'pack10', price:580, credits:1000, best:true },
  { id:'pack30', price:1280, credits:3000 }
];
var monthly = (MOCK.business.credits && MOCK.business.credits.freeQuota && MOCK.business.credits.freeQuota.monthly) || 5;
if(window.ModeStore && ModeStore.isBreakIn()) monthly += ((MOCK.business.breakin || {}).registerBonus) || 0;

var selectedPack = 1; /* 默认选中中间最划算档 */
var selectedPay = 'balance';
var useBatch = false; /* 是否使用自定义批量 */
var batchInfo = null; /* 批量计算结果 */

/* ---- 支付方式定义 ---- */
var payMethods = [
  { id:'balance', name:'余额支付', desc:'可用余额 ¥' + (BalanceStore.read().balance || 0).toFixed(2), icon:'i-wallet', color:'#2E7D50' },
  { id:'wechat', name:'微信支付', desc:'推荐使用', icon:'i-chat', color:'#07C160' },
  { id:'alipay', name:'支付宝', desc:'安全便捷', icon:'i-box', color:'#1677FF' }
];

/* ---- 渲染积分包 ---- */
function renderPacks() {
  var box = document.getElementById('pack-list');
  box.innerHTML = packs.map(function(p, i) {
    var perPoint = p.price / p.credits;
    var savePct = Math.round((1 - p.price / p.credits) * 100);
    var gain = savePct > 0 ? '省' + savePct + '%' : '';
    var selected = i === selectedPack && !useBatch;
    var tag = p.best ? '<div class="pk-tag">最划算</div>' : '';
    return '<div class="pack-card' + (selected ? ' selected' : '') + '" onclick="selectPack(' + i + ')">' +
      tag +
      '<div class="pk-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div class="pk-price">¥' + p.price + '</div>' +
      '<div class="pk-credits">' + p.credits + ' 积分</div>' +
      '<div class="pk-save' + (gain ? '' : ' empty') + '">' + (gain || '原价') + '</div>' +
    '</div>';
  }).join('');
}
window.selectPack = function(i) {
  selectedPack = i;
  useBatch = false;
  renderPacks();
  updateCTA();
};

/* ---- 批量充值逻辑 ---- */
var bdCfg = (MOCK.business.credits && MOCK.business.credits.batchDiscount) || { enabled: false, minAmount: 1000, tiers: [] };
function batchBaseRate() {
  var pk = packs[packs.length - 1] || { price: 1280, credits: 3000 };
  return pk.price / pk.credits;
}
function batchTierOf(amount) {
  if (!bdCfg.enabled) return { discount: 1, label: '', min: 0 };
  var best = { discount: 1, label: '', min: 0 };
  (bdCfg.tiers || []).forEach(function(t) {
    if (amount >= t.min && t.discount < best.discount) best = t;
  });
  return best;
}
function renderBatchTiers() {
  var box = document.getElementById('batch-tiers');
  if (!box || !bdCfg.enabled) { if (box) box.innerHTML = ''; return; }
  box.innerHTML = (bdCfg.tiers || []).map(function(t) {
    return '<div class="batch-tier" data-min="' + t.min + '">' +
      '<div class="bt-label">' + t.label + '</div><div class="bt-min">≥' + t.min + '</div></div>';
  }).join('');
}
window.batchRecalc = function() {
  var raw = parseInt(document.getElementById('batch-amount').value, 10) || 0;
  var min = bdCfg.minAmount || 1000;
  var tier = batchTierOf(raw);
  var priceEl = document.getElementById('batch-price');
  var labelEl = document.getElementById('batch-tier-label');
  var saveEl = document.getElementById('batch-save');

  document.querySelectorAll('.batch-tier').forEach(function(el) {
    el.classList.toggle('on', raw >= parseInt(el.getAttribute('data-min'), 10));
  });

  if (raw <= 0) {
    batchInfo = null;
    priceEl.innerHTML = '¥0';
    labelEl.textContent = '输入数量自动计价';
    saveEl.textContent = '';
    useBatch = false;
    renderPacks();
    updateCTA();
    return;
  }

  if (raw < min) {
    batchInfo = null;
    priceEl.innerHTML = '<span style="font-size:13px;color:var(--text-3);font-weight:400;">满' + min + '积分享折扣</span>';
    labelEl.textContent = '批量充值';
    saveEl.textContent = '';
    useBatch = false;
    renderPacks();
    updateCTA();
    return;
  }

  var base = Math.round(raw * batchBaseRate() * 100) / 100;
  var finalPrice = Math.round(raw * batchBaseRate() * tier.discount * 100) / 100;
  priceEl.innerHTML = (tier.discount < 1 ? '<span class="old">¥' + base.toFixed(2) + '</span>' : '') + '¥' + finalPrice.toFixed(2);
  labelEl.textContent = tier.discount < 1 ? '批量充值 · ' + tier.label : '批量充值';
  saveEl.textContent = tier.discount < 1 ? '已省 ¥' + (base - finalPrice).toFixed(2) : '';

  batchInfo = { amount: raw, price: finalPrice, base: base, tier: tier };
  useBatch = true;
  renderPacks();
  updateCTA();
};
document.getElementById('batch-amount').addEventListener('input', window.batchRecalc);

/* ---- 渲染支付方式 ---- */
function renderPayMethods() {
  var box = document.getElementById('pm-list');
  var bal = BalanceStore.read().balance || 0;
  payMethods[0].desc = '可用余额 ¥' + bal.toFixed(2);
  box.innerHTML = payMethods.map(function(pm) {
    var selected = pm.id === selectedPay;
    return '<div class="pm-item' + (selected ? ' selected' : '') + '" onclick="selectPay(\'' + pm.id + '\')">' +
      '<div class="pm-icon" style="background:' + pm.color + '15;color:' + pm.color + ';">' +
        '<svg class="ic"><use href="#' + pm.icon + '"/></svg>' +
      '</div>' +
      '<div class="pm-body"><div class="pm-name">' + pm.name + '</div><div class="pm-desc">' + pm.desc + '</div></div>' +
      '<div class="pm-radio"></div>' +
    '</div>';
  }).join('');
}
window.selectPay = function(id) { selectedPay = id; renderPayMethods(); updateCTA(); };

/* ---- 更新底部按钮 ---- */
function getCurrentOrder() {
  if (useBatch && batchInfo) {
    return { price: batchInfo.price, credits: batchInfo.amount, type: 'batch' };
  }
  var p = packs[selectedPack];
  return { price: p.price, credits: p.credits, type: 'pack' };
}
function updateCTA() {
  var btn = document.getElementById('cta');
  var order = getCurrentOrder();
  var avail = BalanceStore.available();

  if (selectedPay === 'balance' && avail < order.price) {
    btn.textContent = '余额不足，去充值';
    btn.style.opacity = '.7';
    btn.onclick = function() { location.href = 'index.html'; };
  } else if (selectedPay === 'wechat' || selectedPay === 'alipay') {
    btn.textContent = '模拟支付 ¥' + order.price + ' · ' + order.credits + '积分';
    btn.style.opacity = '1';
    btn.onclick = doRecharge;
  } else {
    btn.textContent = '立即充值 ¥' + order.price + ' · 得' + order.credits + '积分';
    btn.style.opacity = '1';
    btn.onclick = doRecharge;
  }
}

/* 协议勾选 */
(function(){var r=document.getElementById('agreeRow');if(r)r.addEventListener('click',function(e){if(e.target.tagName==='A')return;this.classList.toggle('on');});})();

/* ---- 执行充值 ---- */
window.doRecharge = function() {
  var row = document.getElementById('agreeRow');
  if (row && !row.classList.contains('on')) {
    UI.dialog({ title: '确认协议', text: '请确认您已阅读并同意<a href="../agreement/user.html#credits">《积分充值协议》</a>', ok: '确认并继续支付', cancel: '取消', onOk: function () {
      row.classList.add('on'); window.doRecharge();
    }});
    return;
  }

  try {
    var _curU = (window.DataBus && DataBus.current) ? DataBus.current() : null;
    if (_curU && _curU.banned) { UI.toast('账号已被封禁，无法执行此操作', 'warn'); return; }
  } catch (e) {}

  var order = getCurrentOrder();
  var avail = BalanceStore.available();

  if (selectedPay === 'balance') {
    if (avail < order.price) { UI.toast('可用余额不足，请先充值余额或选择其他支付方式', 'warn'); return; }
    var bs = BalanceStore.read();
    bs.balance = Math.round((bs.balance - order.price) * 100) / 100;
    bs.logs.unshift({ type:'buy_credits', amount:-order.price, method:'balance',
      reason: order.type === 'batch' ? '批量充值 · ' + order.credits + '积分' : '购买积分包 · ' + order.credits + '积分',
      ts:Date.now(), status:'success' });
    BalanceStore.write(bs);
  } else {
    var method = selectedPay === 'wechat' ? 'wechat' : 'alipay';
    var payName = method === 'wechat' ? '微信支付' : '支付宝';
    var bs2 = BalanceStore.read();
    bs2.logs.unshift({ type:'recharge_sim', amount:0, method:method,
      reason:'模拟支付(' + payName + ') 购买积分 · 钱包余额不变', ts:Date.now(), status:'success', simulated:true });
    BalanceStore.write(bs2);
  }

  var srcName = selectedPay === 'balance' ? '余额支付' : (selectedPay === 'wechat' ? '微信支付(模拟)' : '支付宝(模拟)');
  CreditStore.add(order.credits, order.type === 'batch' ? '批量充值' : '购买积分包', {
    type:'recharge', source:srcName, orderId:(order.type==='batch'?'BR':'CR') + Date.now(),
    status:'success', fromUser:'平台'
  });

  showRechargeSuccess(order);
  render();
  renderPayMethods();
  updateCTA();
};

/* ---- 充值成功弹窗 ---- */
function showRechargeSuccess(order) {
  var sh = UI.sheet();
  sh.setClosable(false);
  sh.html(
    '<div class="recharge-success">' +
      '<div class="rs-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div class="rs-title">充值成功</div>' +
      '<div class="rs-desc">' + order.credits + ' 积分已到账，可用于解锁供需详情、联系洽谈等</div>' +
      '<div class="rs-amount">+' + order.credits + ' 积分</div>' +
      '<button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" onclick="UI.closeSheet()">完成</button>' +
    '</div>'
  ).show();
}

/* ---- 渲染主数据 ---- */
function render() {
  var c = CreditStore.read();
  document.getElementById('bal-num').textContent = c.balance.toLocaleString();
  document.getElementById('unlock-count').textContent = Math.floor(c.balance / 100);

  var used = CreditStore.freeUsed();
  var remain = Math.max(monthly - used, 0);
  document.getElementById('free-remain').textContent = remain;

  renderLogs(c.logs || []);
  renderTasks();
}

/* ---- 积分明细 ---- */
var logTypeConfig = {
  recharge:{icon:'i-wallet',label:'充值'}, unlock:{icon:'i-eye',label:'解锁'},
  bonus:{icon:'i-star',label:'奖励'}, refund:{icon:'i-rotate',label:'退款'},
  transfer:{icon:'i-share',label:'转出'}, credits_expired:{icon:'i-clock',label:'过期'}
};
function renderLogs(logs) {
  var box = document.getElementById('log-list');
  var countEl = document.getElementById('log-count');
  countEl.textContent = logs.length ? '共' + logs.length + '条' : '';
  if (!logs.length) {
    box.innerHTML = '<div class="empty-logs">' +
      '<div class="empty-ic"><svg class="ic"><use href="#i-doc"/></svg></div>' +
      '<div class="empty-title">暂无积分记录</div>' +
      '<div class="empty-desc">充值或解锁后将在此显示明细</div>' +
    '</div>';
    return;
  }
  box.innerHTML = logs.slice(0, 20).map(function(l) {
    var cfg = logTypeConfig[l.type] || logTypeConfig.unlock;
    var isIncome = l.credits >= 0;
    var d = new Date(l.ts);
    var ds = (d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    return '<div class="log-item">' +
      '<div class="log-icon type-'+l.type+'"><svg class="ic"><use href="#'+cfg.icon+'"/></svg></div>' +
      '<div class="log-body"><div class="log-title">'+cfg.label+' · '+l.reason+'</div><div class="log-meta">'+ds+'</div></div>' +
      '<div class="log-amount"><div class="log-num '+(isIncome?'income':'expense')+'">'+(isIncome?'+':'')+l.credits+'</div><div class="log-label">积分</div></div>' +
    '</div>';
  }).join('');
}

/* ---- 免费获取积分任务 ---- */
var RW = (MOCK.business.credits && MOCK.business.credits.rewards) || {};
function renderTasks() {
  var box = document.getElementById('task-grid');
  if (!box) return;
  var st = (window.UI && UI.state) ? UI.state.get() : {};
  if (st.loggedIn === false) {
    box.innerHTML = '<div class="task-card" onclick="location.href=\'../auth/login.html\'">' +
      '<div class="task-ic"><svg class="ic"><use href="#i-user"/></svg></div>' +
      '<div class="task-body"><div class="task-name">登录领积分</div><div class="task-reward">登录即得奖励</div></div>' +
      '<div class="task-btn">去登录 ›</div></div>';
    return;
  }
  var a = AuthStore.read(), e = EntryStore.read(), ci = CheckinStore.read();
  var checked = CheckinStore.checkedToday();
  var realDone = !!(a.realname && a.realname.ok);
  var entryDone = !!(e.type && e.active);
  var realClaimed = CreditStore.claimed('realname');
  var entryClaimed = CreditStore.claimed('entry');

  var tasks = [
    { icon:'i-clock', name:'每日签到', reward:'+'+((RW.checkin)||10)+'分',
      btn: checked ? '已签到' : '去签到', tap: checked ? null : 'checkin' },
    { icon:'i-user', name:'实名认证', reward:'+'+((RW.realname)||100)+'分',
      btn: realClaimed ? '已领取' : (realDone ? '去领取' : '去认证'),
      tap: realClaimed ? null : (realDone ? 'claimReal' : '../profile/auth-personal.html') },
    { icon:'i-bank', name:'企业入驻', reward:'+'+((RW.entry)||500)+'分',
      btn: entryClaimed ? '已领取' : (entryDone ? '去领取' : '去入驻'),
      tap: entryClaimed ? null : (entryDone ? 'claimEntry' : '../profile/entry.html') },
    { icon:'i-chat', name:'邀请好友', reward:'+'+((RW.invite)||50)+'分',
      btn:'复制邀请码', tap:'copyInvite' }
  ];

  box.innerHTML = tasks.map(function(t) {
    return '<div class="task-card" onclick="taskTap(\''+(t.tap||'')+'\')">' +
      '<div class="task-ic"><svg class="ic"><use href="#'+t.icon+'"/></svg></div>' +
      '<div class="task-body"><div class="task-name">'+t.name+'</div><div class="task-reward">'+t.reward+'</div></div>' +
      '<div class="task-btn">'+t.btn+'</div></div>';
  }).join('');
}
window.taskTap = function(t) {
  if (!t) return;
  if (t === 'checkin') { var r = CheckinStore.checkin(); UI.toast(r.ok ? '签到成功 +'+r.credits+'分' : '今日已签到', r.ok?'ok':'warn'); }
  else if (t === 'claimReal') { UI.toast(CreditStore.claim('realname', null, '实名认证奖励') ? '领取成功' : '已领取过', 'ok'); }
  else if (t === 'claimEntry') { UI.toast(CreditStore.claim('entry', null, '企业入驻奖励') ? '领取成功' : '已领取过', 'ok'); }
  else if (t === 'copyInvite') {
    var acct = ((window.UI && UI.state) ? UI.state.get() : {}).account || 'demo@engchain.cn';
    var ta = document.createElement('textarea'); ta.value = acct; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(ta);
    UI.toast('邀请码已复制', 'ok');
  } else if (t.indexOf('../') === 0) { location.href = t; return; }
  setTimeout(function(){ render(); renderTasks(); }, 400);
};

/* ---- 事件监听 ---- */
window.addEventListener('engchain:credits', render);
window.addEventListener('engchain:mode', render);
window.addEventListener('engchain:store-change', render);

/* ---- 初始化 ---- */
renderPacks();
renderPayMethods();
renderTasks();
render();
renderBatchTiers();
updateCTA();

/* 入场动效 */
document.querySelectorAll('.cr-overview,.cr-section,.trust-bar').forEach(function(el,i){
  if(!el)return; el.style.opacity='0'; el.style.transform='translateY(10px)';
  setTimeout(function(){ el.style.transition='all .4s var(--e-out)'; el.style.opacity='1'; el.style.transform='none'; },60*i);
});

})();
</script>
</body>
