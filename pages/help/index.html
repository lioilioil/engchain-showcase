<style>
/* ============================================================
   帮助中心 · V3.3 设计系统重设计
   视觉规则：整行卡片统一 16px 边距并铺满一行（与 .job-card 对齐）；
   全部使用设计令牌，明/暗双主题完整。
   ============================================================ */

/* ---- 吸顶搜索行（仅搜索框悬浮固定顶部；分类按钮已改为正常流两行网格，不吸顶） ---- */
.help-sticky-top{position:sticky;top:0;z-index:20;background:var(--bg);}

/* ---- 搜索区（令牌化） ---- */
.help-search-wrap{padding:10px 16px 6px;}
.help-search-box{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1.5px solid var(--line);border-radius:var(--r-m);padding:0 14px;height:44px;box-shadow:var(--shadow-xs);transition:border-color .2s,box-shadow .2s;}
.help-search-box.focus{border-color:var(--primary);box-shadow:var(--shadow-focus);}
.help-search-box svg{width:17px;height:17px;color:var(--text-3);flex:none;}
.help-search-box input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text-1);height:100%;}
.help-search-box input::placeholder{color:var(--text-3);}
.help-search-clear{display:none;width:20px;height:20px;border-radius:50%;background:var(--text-3);color:var(--bg);align-items:center;justify-content:center;font-size:12px;line-height:1;cursor:pointer;flex:none;border:none;padding:0;}
.help-search-clear.show{display:flex;}
.help-search-result{font-size:12px;color:var(--primary-dim);margin-top:4px;padding-left:2px;min-height:0;line-height:1.4;transition:opacity .2s;}

/* ---- 分类网格（两行四列展开，icon在上文字在下，仅icon有背景，整体无包裹背景，不吸顶） ---- */
.help-cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px;padding:4px 16px 14px;}
.help-cat-grid-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:4px 2px;border-radius:12px;transition:transform .15s;-webkit-tap-highlight-color:transparent;}
.help-cat-grid-item:active{transform:scale(.94);}
.help-cat-grid-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-dim);transition:background .15s,color .15s;}
.help-cat-grid-icon svg{width:19px;height:19px;}
.help-cat-grid-name{font-size:11px;color:var(--text-2);font-weight:500;line-height:1.2;text-align:center;}
.help-cat-grid-item.active .help-cat-grid-icon{background:var(--primary);color:var(--text-inv);}
.help-cat-grid-item.active .help-cat-grid-name{color:var(--primary-dim);font-weight:700;}

/* ---- 区块标题（金色竖条 + 主副题） ---- */
.help-section-title{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;}
.help-section-title .st-text{font-size:var(--fs-md);font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:8px;letter-spacing:.01em;}
.help-section-title .st-text::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary);}
.help-section-title .st-sub{font-size:var(--fs-xs);color:var(--text-3);}

/* ---- 热门问题：整行满宽卡片（358px，符合历史视觉规则，不再 240px 横滑） ---- */
.help-hot-list{padding:2px 16px 4px;}
.help-hot-card{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform .15s,box-shadow .15s;margin-bottom:8px;}
.help-hot-card:active{transform:scale(.985);box-shadow:var(--shadow-sm);}
.help-hot-body{flex:1;min-width:0;}
.help-hot-title-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.help-hot-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--error);background:rgba(179,38,30,.08);padding:2px 8px;border-radius:20px;flex:none;}
.help-hot-tag svg{width:11px;height:11px;}
.help-hot-q{font-size:13.5px;font-weight:600;color:var(--text-1);line-height:1.4;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.help-hot-a{font-size:11.5px;color:var(--text-3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.help-hot-arrow{width:16px;height:16px;color:var(--text-3);flex:none;}

/* ---- FAQ 手风琴（令牌化） ---- */
.help-faq-section{margin:0 16px 8px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-sm);}
.help-faq-section.hidden{display:none;}
.help-faq-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.help-faq-head-icon{width:32px;height:32px;border-radius:var(--r-m);background:var(--primary-soft);color:var(--primary-dim);display:flex;align-items:center;justify-content:center;flex:none;}
.help-faq-head-icon svg{width:17px;height:17px;}
.help-faq-head-text{flex:1;font-size:14.5px;font-weight:600;color:var(--text-1);}
.help-faq-head-count{font-size:11px;color:var(--text-3);background:var(--bg-card-2);padding:2px 8px;border-radius:20px;}
.help-faq-head-arrow{width:18px;height:18px;color:var(--text-3);transition:transform .25s;flex:none;}
.help-faq-section.open .help-faq-head-arrow{transform:rotate(90deg);}
.help-faq-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.help-faq-section.open .help-faq-body{max-height:5000px;}

.help-faq-item{border-bottom:1px solid var(--line);}
.help-faq-item:last-child{border-bottom:none;}
.help-faq-q{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;min-height:40px;}
.help-faq-q:active{background:var(--bg-card-2);}
.help-faq-q-text{flex:1;font-size:13.5px;color:var(--text-1);line-height:1.5;font-weight:500;}
.help-faq-q-arrow{width:16px;height:16px;color:var(--text-3);flex:none;margin-top:2px;transition:transform .25s;}
.help-faq-item.open .help-faq-q-arrow{transform:rotate(180deg);}
.help-faq-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 16px;}
.help-faq-item.open .help-faq-detail{max-height:3000px;padding:0 16px 16px;}
.help-faq-detail-inner{background:var(--bg-card-2);border-radius:var(--r-m);padding:14px;}
.help-faq-steps{margin:0 0 12px;padding:0;list-style:none;}
.help-faq-steps li{position:relative;padding:4px 0 4px 28px;font-size:13px;color:var(--text-2);line-height:1.7;}
.help-faq-steps li::before{content:attr(data-n);position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--text-inv);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.help-faq-desc{font-size:13px;color:var(--text-2);line-height:1.8;margin-bottom:12px;}
.help-faq-links{display:flex;flex-wrap:wrap;gap:8px;}
.help-faq-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--primary-dim);background:var(--primary-soft);padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:500;}
.help-faq-link svg{width:12px;height:12px;}
.help-faq-tip{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;background:var(--warning-soft);border-radius:var(--r-m);}
.help-faq-tip svg{width:15px;height:15px;color:var(--warning);flex:none;margin-top:1px;}
.help-faq-tip span{font-size:12px;color:var(--warning);line-height:1.6;}

/* ---- 底部客服（令牌化） ---- */
.help-bottom{margin:6px 16px 20px;}
.help-service-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 14px;text-align:center;box-shadow:var(--shadow-sm);}
.help-service-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dim));display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--text-inv);}
.help-service-icon svg{width:22px;height:22px;}
.help-service-title{font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:2px;}
.help-service-phone{font-size:18px;font-weight:800;color:var(--primary-dim);font-family:var(--font-num);margin:4px 0 2px;letter-spacing:.01em;}
.help-service-time{font-size:11px;color:var(--text-3);margin-bottom:12px;}
.help-service-btns{display:flex;gap:8px;}
.help-service-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:40px;border-radius:var(--r-m);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:transform .15s,opacity .15s;}
.help-service-btn:active{transform:scale(.98);opacity:.85;}
.help-service-btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--text-inv);box-shadow:0 4px 14px rgba(201,169,97,.25),inset 0 1px 0 rgba(255,255,255,.18);}
.help-service-btn.ghost{background:var(--bg-card-2);color:var(--text-1);border:1px solid var(--line);}
.help-service-btn svg{width:17px;height:17px;}

.help-about-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);margin-top:8px;cursor:pointer;min-height:40px;box-shadow:var(--shadow-xs);transition:background .15s;}
.help-about-row:active{background:var(--bg-card-2);}
.help-about-left{display:flex;align-items:center;gap:10px;}
.help-about-left svg{width:18px;height:18px;color:var(--text-3);}
.help-about-left span{font-size:13.5px;color:var(--text-1);}
.help-about-ver{font-size:12px;color:var(--text-3);}

/* ---- 搜索高亮 / 空态 ---- */
.help-faq-item.search-hit{background:var(--primary-soft);}
.help-no-result{display:none;text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px;}
.help-no-result.show{display:block;}
.help-no-result svg{width:48px;height:48px;color:var(--line-strong);margin-bottom:12px;}

/* 确保无横向滚动 */
.phone{overflow-x:hidden;}
.scroll{overflow-x:hidden;}
</style>
</head>

<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">帮助中心</div>
    <div class="nav-right"></div>
  </div>

  <div class="scroll no-pad" id="helpScroll" style="padding-bottom:108px;">
    <!-- 吸顶搜索行（仅搜索框固定顶部） -->
    <div class="help-sticky-top">
      <!-- 搜索区 -->
      <div class="help-search-wrap">
        <div class="help-search-box" id="searchBox">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input type="text" id="helpSearchInput" placeholder="搜索问题，如：如何实名认证" autocomplete="off">
          <button class="help-search-clear" id="searchClear" aria-label="清空">×</button>
        </div>
        <div class="help-search-result" id="searchResult"></div>
      </div>
    </div>

    <!-- 分类网格：两行四列展开，icon在上文字在下，仅icon有背景，不吸顶 -->
    <div class="help-cat-grid" id="catGrid"></div>

    <!-- 热门问题（整行满宽卡片） -->
    <div class="help-section-title">
      <span class="st-text">热门问题</span>
      <span class="st-sub">高频咨询</span>
    </div>
    <div class="help-hot-list" id="hotScroll"></div>

    <!-- 全部分类FAQ -->
    <div class="help-section-title">
      <span class="st-text">全部问题</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="st-sub" id="faqCountLabel"></span>
        <span class="st-sub" id="faqToggleAll" style="cursor:pointer;color:var(--primary-dim);font-weight:600;" onclick="toggleAllFAQ()">展开全部</span>
      </span>
    </div>
    <div id="faqContainer"></div>

    <!-- 无搜索结果 -->
    <div class="help-no-result" id="noResult">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-help"/></svg>
      <div>未找到相关问题</div>
      <div style="font-size:11px;margin-top:4px;">试试其他关键词，或联系在线客服</div>
    </div>

    <!-- 底部客服入口 -->
    <div class="help-bottom">
      <div class="help-service-card">
        <div class="help-service-icon">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-headset"/></svg>
        </div>
        <div class="help-service-title">需要更多帮助？</div>
        <div class="help-service-phone">400-000-0000</div>
        <div class="help-service-time">工作日 09:00 – 21:00</div>
        <div class="help-service-btns">
          <button class="help-service-btn primary" onclick="UI.toast('已接入在线客服','ok')">
            <svg class="ic" viewBox="0 0 24 24"><use href="#i-chat"/></svg>在线客服
          </button>
          <button class="help-service-btn ghost" id="feedbackBtn">
            <svg class="ic" viewBox="0 0 24 24"><use href="#i-feedback"/></svg>意见反馈
          </button>
        </div>
      </div>
      <div class="help-about-row" id="aboutRow">
        <div class="help-about-left">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-info"/></svg>
          <span>关于工程链</span>
        </div>
        <span class="help-about-ver">V3.3.0</span>
      </div>
    </div>
  </div>
</div>

  /* ===== 渲染FAQ ===== */
  function renderFAQ(){
    var container = document.getElementById('faqContainer');
    var html = '';
    var total = 0;
    CATEGORIES.forEach(function(cat){
      total += cat.items.length;
      html += '<div class="help-faq-section" data-cat="'+cat.id+'">' +
        '<div class="help-faq-head">' +
          '<div class="help-faq-head-icon"><svg class="ic" viewBox="0 0 24 24"><use href="#i-'+cat.icon+'"/></svg></div>' +
          '<span class="help-faq-head-text">'+cat.name+'</span>' +
          '<span class="help-faq-head-count">'+cat.items.length+'题</span>' +
          '<svg class="ic help-faq-head-arrow" viewBox="0 0 24 24"><use href="#i-chev-r"/></svg>' +
        '</div>' +
        '<div class="help-faq-body">';
      cat.items.forEach(function(item, idx){
        html += '<div class="help-faq-item" data-q="'+item.q.replace(/"/g,'&quot;')+'">' +
          '<div class="help-faq-q">' +
            '<span class="help-faq-q-text">'+item.q+'</span>' +
            '<svg class="ic help-faq-q-arrow" viewBox="0 0 24 24"><use href="#i-chev-r"/></svg>' +
          '</div>' +
          '<div class="help-faq-detail"><div class="help-faq-detail-inner">';
        if(item.desc){
          html += '<div class="help-faq-desc">'+item.desc+'</div>';
        }
        if(item.steps){
          html += '<ol class="help-faq-steps">';
          item.steps.forEach(function(s, si){
            html += '<li data-n="'+(si+1)+'">'+s+'</li>';
          });
          html += '</ol>';
        }
        if(item.links){
          html += '<div class="help-faq-links">';
          item.links.forEach(function(l){
            html += '<a class="help-faq-link" href="'+l.href+'">'+l.text+'<svg class="ic" viewBox="0 0 24 24"><use href="#i-external"/></svg></a>';
          });
          html += '</div>';
        }
        if(item.tip){
          html += '<div class="help-faq-tip"><svg class="ic" viewBox="0 0 24 24"><use href="#i-info"/></svg><span>'+item.tip+'</span></div>';
        }
        html += '</div></div></div>';
      });
      html += '</div></div>';
    });
    container.innerHTML = html;
    document.getElementById('faqCountLabel').textContent = '共'+total+'个问题';
    return total;
  }

  function doSearch(keyword){
    keyword = (keyword || '').trim().toLowerCase();
    var sections = document.querySelectorAll('.help-faq-section');
    var totalHit = 0;

    if(!keyword){
      // 恢复全部
      sections.forEach(function(sec){
        sec.classList.remove('hidden');
        sec.classList.remove('open');
        var items = sec.querySelectorAll('.help-faq-item');
        items.forEach(function(it){
          it.classList.remove('open','search-hit');
          it.style.display = '';
        });
      });
      searchResult.textContent = '';
      noResult.classList.remove('show');
      return;
    }

    sections.forEach(function(sec){
      var items = sec.querySelectorAll('.help-faq-item');
      var catHit = 0;
      var catName = sec.querySelector('.help-faq-head-text').textContent.toLowerCase();
      items.forEach(function(it){
        var q = (it.getAttribute('data-q') || '').toLowerCase();
        var hit = q.indexOf(keyword) > -1 || catName.indexOf(keyword) > -1;
        if(hit){
          it.style.display = '';
          it.classList.add('search-hit');
          catHit++;
          totalHit++;
        } else {
          it.style.display = 'none';
          it.classList.remove('open','search-hit');
        }
      });
      if(catHit > 0){
        sec.classList.remove('hidden');
        sec.classList.add('open');
      } else {
        sec.classList.add('hidden');
        sec.classList.remove('open');
      }
    });

    if(totalHit > 0){
      searchResult.textContent = '找到 '+totalHit+' 个相关问题';
      noResult.classList.remove('show');
    } else {
      searchResult.textContent = '未找到相关问题';
      noResult.classList.add('show');
    }
  }

  searchInput.addEventListener('focus', function(){ searchBox.classList.add('focus'); });
  searchInput.addEventListener('blur', function(){ searchBox.classList.remove('focus'); });
  searchInput.addEventListener('input', function(){
    var val = this.value;
    if(val){ searchClear.classList.add('show'); } else { searchClear.classList.remove('show'); }
    doSearch(val);
  });
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    searchClear.classList.remove('show');
    doSearch('');
    searchInput.focus();
  });

  /* ===== 展开/收起全部 ===== */
  window.toggleAllFAQ = function(){
    var sections = document.querySelectorAll('.help-faq-section:not(.hidden)');
    var allOpen = true;
    sections.forEach(function(s){ if(!s.classList.contains('open')) allOpen = false; });
    sections.forEach(function(s){
      if(allOpen){ s.classList.remove('open'); }
      else { s.classList.add('open'); }
    });
    document.getElementById('faqToggleAll').textContent = allOpen ? '展开全部' : '收起全部';
  };

  /* ===== 手风琴交互 ===== */
  var faqContainer = document.getElementById('faqContainer');

  // 分类展开/收起
  faqContainer.addEventListener('click', function(e){
    var head = e.target.closest('.help-faq-head');
    if(head){
      var section = head.parentElement;
      section.classList.toggle('open');
      return;
    }
    // 问题展开/收起（同一分类下只展开一个）
    var q = e.target.closest('.help-faq-q');
    if(q){
      var item = q.parentElement;
      var section = item.closest('.help-faq-section');
      var wasOpen = item.classList.contains('open');
      // 关闭同分类下所有
      section.querySelectorAll('.help-faq-item.open').forEach(function(it){
        it.classList.remove('open');
      });
      if(!wasOpen){
        item.classList.add('open');
      }
    }
  });

  /* ===== 分类点击滚动（滚动偏移随吸顶搜索行高度自适应） ===== */
  var catGrid = document.getElementById('catGrid');
  catGrid.addEventListener('click', function(e){
    var catItem = e.target.closest('.help-cat-grid-item');
    if(!catItem) return;
    var catId = catItem.getAttribute('data-cat');
    var target = document.querySelector('.help-faq-section[data-cat="'+catId+'"]');
    if(target){
      // 高亮分类
      document.querySelectorAll('.help-cat-grid-item').forEach(function(c){ c.classList.remove('active'); });
      catItem.classList.add('active');
      // 展开该分类
      target.classList.add('open');
      // 平滑滚动（以吸顶搜索行底边为基准，用 rect 差值定位，适配状态栏/导航栏高度）
      var scrollEl = document.getElementById('helpScroll');
      var sticky = document.querySelector('.help-sticky-top');
      var delta = target.getBoundingClientRect().top - sticky.getBoundingClientRect().bottom - 10;
      scrollEl.scrollTo({top: Math.max(0, scrollEl.scrollTop + delta), behavior: 'smooth'});
      // 3秒后取消高亮
      setTimeout(function(){ catItem.classList.remove('active'); }, 3000);
    }
  });

  /* ===== 热门问题点击 ===== */
  document.getElementById('hotScroll').addEventListener('click', function(e){
    var card = e.target.closest('.help-hot-card');
    if(!card) return;
    var catId = card.getAttribute('data-cat');
    var index = parseInt(card.getAttribute('data-index'), 10);
    var section = document.querySelector('.help-faq-section[data-cat="'+catId+'"]');
    if(section){
      section.classList.add('open');
      var items = section.querySelectorAll('.help-faq-item');
      if(items[index]){
        items[index].classList.add('open');
        var scrollEl = document.getElementById('helpScroll');
        var sticky = document.querySelector('.help-sticky-top');
        var delta = items[index].getBoundingClientRect().top - sticky.getBoundingClientRect().bottom - 20;
        scrollEl.scrollTo({top: Math.max(0, scrollEl.scrollTop + delta), behavior: 'smooth'});
      }
    }
  });

  /* ===== 意见反馈 ===== */
  document.getElementById('feedbackBtn').addEventListener('click', function(){
    var s = UI.sheet();
    s.setText('意见反馈');
    s.html(
      '<div style="padding:6px 0 14px;">' +
        '<div style="font-size:13px;color:var(--text-2);margin-bottom:10px;">您的反馈是我们进步的动力</div>' +
        '<textarea id="fbText" placeholder="请描述您的建议或遇到的问题..." style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;min-height:100px;resize:none;outline:none;font-family:inherit;"></textarea>' +
        '<button class="btn btn-primary btn-block" style="margin-top:14px;height:44px;font-size:14px;font-weight:600;" onclick="UI.toast(\'反馈已提交，感谢您的支持\',\'ok\');this.closest(\'.sheet\').querySelector(\'.sheet-close\').click();">提交反馈</button>' +
      '</div>'
    );
    s.show();
  });

  /* ===== 关于工程链 ===== */
  document.getElementById('aboutRow').addEventListener('click', function(){
    UI.dialog({
      title:'关于工程链',
      text:'<div style="text-align:center;padding:6px 0;">' +
        '<div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:var(--text-inv);"><svg style="width:30px;height:30px;" viewBox="0 0 24 24"><use href="#i-buil"/></svg></div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--text-1);margin-bottom:4px;">工程链 ENGCHAIN</div>' +
        '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">版本 V3.3.0</div>' +
        '<div style="font-size:13px;color:var(--text-2);line-height:1.8;">建筑行业供需一站式匹配平台<br>连接供方与需方，让交易更高效</div>' +
      '</div>',
      ok:'知道了',
      cancel:''
    });
  });

  /* ===== 初始化 ===== */
  renderCatGrid();
  renderHotQuestions();
  var total = renderFAQ();

  // 默认展开第一个分类，避免页面空旷
  var firstSection = document.querySelector('.help-faq-section');
  if(firstSection) firstSection.classList.add('open');

  // 渲染底部tabbar
  var phone = document.querySelector('.phone');
  if(phone && !phone.querySelector('.app-tabbar')){
    phone.insertAdjacentHTML('beforeend', UI.tabbar('me', window.__ROOT__));
    UI.ensureThinkingOrb(function () { window.ThinkingOrb.initAll(); });
  }

  // 暴露总数供验证
  window.__HELP_FAQ_TOTAL__ = total;
})();
</script>
</body>
</html>
