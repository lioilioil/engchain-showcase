<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="pages/industry/";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>行业资讯 · 工程链</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
  .sub-card{margin:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));border-radius:14px;padding:18px;color:#fff;}
  .sub-title{font-size:16px;font-weight:700;}
  .sub-price{font-size:28px;font-weight:800;margin:8px 0 4px;}
  .sub-price small{font-size:13px;font-weight:400;opacity:0.9;}
  .sub-benefits{font-size:12px;opacity:0.9;line-height:1.8;}
  .sub-btns{display:flex;gap:8px;margin-top:14px;}
  .sub-btn{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;}
  .sub-btn-solid{background:#fff;color:var(--primary);}
  .sub-btn-outline{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);}
  .cat-tabs{display:flex;gap:6px;padding:12px 12px 0;overflow-x:auto;}
  .cat-tab{flex-shrink:0;padding:6px 14px;border-radius:999px;font-size:13px;background:var(--bg-card);color:var(--text-2);cursor:pointer;border:1px solid var(--line);}
  .cat-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .report-item{margin:10px 12px;padding:14px;background:var(--bg-card);border-radius:12px;cursor:pointer;}
  .report-cat{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:var(--primary-pale);color:var(--primary-dim);margin-bottom:6px;}
  .report-title{font-size:15px;font-weight:700;line-height:1.4;}
  .report-summary{font-size:12px;color:var(--text-2);line-height:1.6;margin-top:6px;}
  .report-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-3);}
  .report-lock{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#fff3e0;color:#e65100;margin-left:6px;}
  .report-free{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#e8f5e9;color:#2e7d32;margin-left:6px;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar" style="height:50px;">
    <button class="nav-back" onclick="history.back()">‹</button>
    <div class="nav-title">行业资讯</div>
    <div class="nav-right" style="width:32px;"></div>
  </div>
  <div class="scroll" style="padding-bottom:24px;">
    <!-- [FEAT 9.2-5] 订阅卡片 -->
    <div class="sub-card" id="sub-card"></div>
    <!-- 分类标签 -->
    <div class="cat-tabs" id="cat-tabs"></div>
    <!-- 报告列表 -->
    <div id="report-list"></div>
  </div>
</div>
<!-- 报告详情弹窗 -->
<div id="report-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:none;">
  <div style="position:absolute;bottom:0;left:0;right:0;max-height:80vh;background:var(--bg);border-radius:16px 16px 0 0;padding:20px;overflow-y:auto;" id="report-detail"></div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function(){
  window.__ROOT__='../../';
  var cfg = (MOCK.business.industryReport) || { categories: [], subscription: {monthly:29, yearly:299} };
  var curCat = '全部';
  /* 渲染订阅卡片 */
  function renderSubCard(){
    var subbed = ReportStore.isSubscribed();
    var el = document.getElementById('sub-card');
    if (subbed) {
      var s = ReportStore.read();
      var d = new Date(s.expireAt);
      el.innerHTML = '<div class="sub-title">已订阅数据报告</div>' +
        '<div class="sub-price" style="font-size:18px;">有效期至 '+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'</div>' +
        '<div class="sub-benefits">您可查看全部行业报告，免费更新</div>';
    } else {
      el.innerHTML = '<div class="sub-title">行业数据报告订阅</div>' +
        '<div class="sub-price">¥'+cfg.subscription.monthly+'<small>/月</small> 或 ¥'+cfg.subscription.yearly+'<small>/年</small></div>' +
        '<div class="sub-benefits">· 每周行业深度报告 · 建材价格走势 · 政策法规解读 · 市场分析数据</div>' +
        '<div class="sub-btns">'+
        '<button class="sub-btn sub-btn-solid" onclick="window.__doSub(\'monthly\')">月付 ¥'+cfg.subscription.monthly+'</button>'+
        '<button class="sub-btn sub-btn-outline" onclick="window.__doSub(\'yearly\')">年付 ¥'+cfg.subscription.yearly+'</button>'+
        '</div>';
    }
  }
  /* 渲染分类 */
  function renderCats(){
    var cats = ['全部'].concat(cfg.categories || []);
    document.getElementById('cat-tabs').innerHTML = cats.map(function(c){
      return '<div class="cat-tab'+(c===curCat?' active':'')+'" data-cat="'+c+'">'+c+'</div>';
    }).join('');
    document.querySelectorAll('.cat-tab').forEach(function(tab){
      tab.onclick = function(){ curCat = tab.dataset.cat; renderCats(); renderList(); };
    });
  }
  /* 渲染报告列表 */
  function renderList(){
    var reports = ReportStore.list(curCat);
    var subbed = ReportStore.isSubscribed();
    var html = reports.map(function(r){
      var canRead = r.isFree || subbed;
      var badge = r.isFree ? '<span class="report-free">免费</span>' : (subbed ? '' : '<span class="report-lock">付费</span>');
      return '<div class="report-item" onclick="window.__openReport(\''+r.id+'\')">'+
        '<span class="report-cat">'+r.category+'</span>'+badge+
        '<div class="report-title">'+r.title+'</div>'+
        '<div class="report-summary">'+r.summary+'</div>'+
        '<div class="report-meta"><span>'+r.date+'</span><span>'+(canRead?'查看详情 ›':'订阅后查看 ›')+'</span></div>'+
      '</div>';
    }).join('');
    document.getElementById('report-list').innerHTML = html || '<div style="text-align:center;color:var(--text-3);padding:40px 0;">暂无报告</div>';
  }
  /* 打开报告详情 */
  window.__openReport = function(id){
    var r = (MOCK.reports||[]).filter(function(x){return x.id===id;})[0];
    if(!r) return;
    var subbed = ReportStore.isSubscribed();
    if(!r.isFree && !subbed){ UI.toast('该报告需订阅后查看','warn'); return; }
    ReportStore.read(id);
    var modal = document.getElementById('report-modal');
    var detail = document.getElementById('report-detail');
    detail.innerHTML = '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">'+r.title+'</div>'+
      '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">'+r.category+' · '+r.date+'</div>'+
      '<div style="font-size:14px;line-height:1.8;color:var(--text-1);">'+r.content+'</div>'+
      '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="document.getElementById(\'report-modal\').style.display=\'none\'">关闭</button>';
    modal.style.display = 'block';
  };
  /* 订阅 */
  window.__doSub = function(cycle){
    var r = ReportStore.subscribe(cycle);
    if(r && r.error){ UI.toast(r.error,'warn'); return; }
    UI.toast('订阅成功，可查看全部报告','ok');
    renderSubCard();
  };
  /* 点击遮罩关闭 */
  document.getElementById('report-modal').addEventListener('click', function(e){
    if(e.target === this) this.style.display = 'none';
  });
  renderSubCard();
  renderCats();
  renderList();
})();
</script>
</body>
</html>
