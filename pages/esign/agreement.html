<script>
(function () {
  var pr = (window.MOCK && MOCK.business && MOCK.business.esign) || { provider: 'e签宝', validYears: 2, refundUnit: 10, signValidDays: 7, packages: [] };
  var priceLine = pr.packages.map(function (p) { return p.name + ' ' + ES.money(p.price) + '（' + p.times + ' 次）'; }).join('，');
  document.getElementById('ag').innerHTML =
    '<div class="es-muted" style="font-size:11px;">本协议为演示版本，最后更新：2026-09-26</div>' +
    '<h2>一、服务说明</h2>' +
    '<p>工程链平台为您提供电子签约技术服务，包括合同文件上传或模板生成、签署通道、数字证书、实名认证与时间戳存证。本服务底层电子签名与存证能力由合作方 <b>' + ES.esc(pr.provider) + '</b> 提供。</p>' +
    '<h2>二、平台角色与免责声明</h2>' +
    '<div class="ag-highlight">1. 本平台仅提供电子签约技术服务，<b>不是合同任何一方当事人</b>。<br>' +
    '2. 合同范本仅为通用参考文本，不构成法律意见；合同内容由您自行拟定、自行审核，使用前建议咨询专业律师。<br>' +

    '4. 平台不介入合同履行、违约、争议解决等任何合同事项。</div>' +
    '<h2>三、实名认证与签署效力</h2>' +
    '<p>1. 您应使用本人/本企业真实信息完成实名认证，并妥善保管账号；通过实名认证后完成的电子签名/电子印章，与手写签名或实体盖章具有同等法律效力。</p>' +
    '<p>2. 发起后签署链接有效期为 <b>' + pr.signValidDays + ' 天</b>，逾期未完成签署的合同自动失效。</p>' +
    '<h2>四、数据与隐私</h2>' +
    '<p>1. 合同原件、数字证书与实名认证信息由 ' + ES.esc(pr.provider) + ' 存储和处理；本平台仅保存合同元数据（主体名称、状态、时间、存证编号）用于业务展示。</p>' +
    '<p>2. 合同内容仅签署双方可见，平台不向无关第三方提供合同内容查看入口。</p>' +
    '<h2>五、计费与退款</h2>' +
    '<p>1. 电子签按次计费，当前套餐：' + ES.esc(priceLine) + '；次数自购买起 <b>' + pr.validYears + ' 年</b>内有效。</p>' +
    '<p>2. 每次发起合同消耗 1 次签署次数；对方签署前撤回的，次数原路退回。</p>' +
    '<p>3. 未使用次数支持退款：退款金额 = 实付金额 − 已用次数 × ' + ES.money(pr.refundUnit) + '；退款额 ≤ 0 时不予退款，提交后由平台在 1–7 个工作日内审核。</p>' +
    '<h2>六、存证说明</h2>' +
