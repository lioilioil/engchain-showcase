<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body{margin:0;background:#e8e8e8}
  .wrap{position:relative;width:200px;height:200px;margin:40px;background:#fff;border:1px solid #ccc}
  .box{position:absolute;left:20px;top:20px;width:80px;height:80px;
    clip-path:path('M10 10 C30 5 50 5 70 10 C60 30 60 50 70 70 C50 75 30 75 10 70 C20 50 20 30 10 10 Z');
    background:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,.2));
    transform:translateY(30px);
    filter:blur(6px);
    opacity:.9}
  .ref{position:absolute;left:20px;top:20px;width:80px;height:80px;background:#c0392b}
</style>
</head>
<body>
<h1>clip-path + filter + transform 渲染顺序测试</h1>
<div class="wrap"><div class="box"></div><div class="ref"></div></div>
<p>红色是参考块（原位置），黑色模糊形状应下移 30px 显示在白色容器内。</p>
</body>
</html>
