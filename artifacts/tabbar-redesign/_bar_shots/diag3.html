<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;background:#111;height:100%;font:12px monospace}
  .row{position:relative;margin:26px 0 0 20px;width:220px;height:60px;background:#333;border-radius:12px}
  .liq{position:absolute;z-index:1;top:5px;left:10px;width:34px;height:37px;will-change:left,top}
  .liq i{position:absolute;inset:0;display:block}
  .shadow{clip-path:path('M5 6 C9.5 4 12.5 3.5 17 3.5 C21.5 3.5 24.5 4 29 6 C25 13 25 24 29 31 C24.5 33.5 21.5 34 17 34 C12.5 34 9.5 33.5 5 31 C9 24 9 13 5 6 Z');
    transform:translateY(4px) scaleY(1.08);filter:blur(4px);opacity:1;background:rgba(0,0,0,.8)}
  .bg{background:rgba(255,255,255,.15)}
  .plain{position:absolute;top:5px;left:10px;width:34px;height:37px;background:rgba(0,0,0,.8);transform:translateY(4px) scaleY(1.08)}
  pre{position:fixed;left:8px;top:6px;color:#9a9;white-space:pre;background:#000;padding:6px;z-index:9}
</style>
</head>
<body>
<pre id="o">...</pre>
<!-- 1: 嵌套+will-change -->
<div class="row"><span class="liq"><i class="shadow"></i><i class="bg"></i></span></div>
<!-- 2: 嵌套无 will-change -->
<div class="row"><span class="liq" style="will-change:auto"><i class="shadow"></i><i class="bg"></i></span></div>
<!-- 3: 无嵌套独立元素 -->
<div class="row"><i class="shadow" style="position:absolute;top:5px;left:10px;width:34px;height:37px"></i></div>
<!-- 4: 纯 div 独立 -->
<div class="row"><div class="shadow" style="position:absolute;top:5px;left:10px;width:34px;height:37px"></div></div>
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var out = [];
    document.querySelectorAll('.shadow,.plain').forEach(function(el){
      var cs = getComputedStyle(el);
      var r = el.getBoundingClientRect();
      out.push((el.tagName) + ' transform=' + cs.transform + ' rectH=' + r.height.toFixed(1) + ' y=' + r.y.toFixed(1) + ' filter=' + cs.filter);
    });
    document.getElementById('o').textContent = out.join('\n');
  }, 200);
});
</script>
</body>
</html>
