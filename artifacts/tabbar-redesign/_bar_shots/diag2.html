<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;background:#111;height:100%;font:12px monospace}
  .row{position:relative;margin:30px 0 0 30px;width:200px;height:50px;background:#333;border-radius:12px}
  .t{position:absolute;left:10px;top:6px;width:34px;height:37px;background:rgba(0,0,0,.8)}
  .a{transform:translateY(4px) scaleY(1.08)}
  .b{clip-path:path('M5 6 C9.5 4 12.5 3.5 17 3.5 C21.5 3.5 24.5 4 29 6 C25 13 25 24 29 31 C24.5 33.5 21.5 34 17 34 C12.5 34 9.5 33.5 5 31 C9 24 9 13 5 6 Z');transform:translateY(4px) scaleY(1.08)}
  .c{clip-path:path('M5 6 C9.5 4 12.5 3.5 17 3.5 C21.5 3.5 24.5 4 29 6 C25 13 25 24 29 31 C24.5 33.5 21.5 34 17 34 C12.5 34 9.5 33.5 5 31 C9 24 9 13 5 6 Z');transform:translateY(4px) scaleY(1.08);filter:blur(4px)}
  .d{transform:translateY(4px) scale(1.08,1.08)}
  pre{position:fixed;left:10px;top:10px;color:#9a9;white-space:pre;background:#000;padding:8px;z-index:9}
</style>
</head>
<body>
<pre id="o">...</pre>
<div class="row"><div class="t a"></div></div>
<div class="row"><div class="t b"></div></div>
<div class="row"><div class="t c"></div></div>
<div class="row"><div class="t d"></div></div>
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var out = [];
    document.querySelectorAll('.a,.b,.c,.d').forEach(function(el){
      var cs = getComputedStyle(el);
      var r = el.getBoundingClientRect();
      out.push(el.className.split(' ')[1] + ' transform=' + cs.transform + ' rectH=' + r.height.toFixed(1) + ' rectY=' + r.y.toFixed(1));
    });
    document.getElementById('o').textContent = out.join('\n');
  }, 200);
});
</script>
</body>
</html>
