<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;background:#0e0e0e;height:100%}
  .wrap{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:220px;height:60px;background:linear-gradient(180deg,rgba(40,40,46,.9),rgba(30,30,36,.78));border-radius:20px;border:1px solid rgba(255,255,255,.18)}
  .liq{position:absolute;z-index:1;top:5px;left:10px;width:34px;height:37px;will-change:left,top}
  .liq i{position:absolute;inset:0;display:block}
  .liq-shadow{z-index:0;clip-path:path('M5 6 C9.5 4 12.5 3.5 17 3.5 C21.5 3.5 24.5 4 29 6 C25 13 25 24 29 31 C24.5 33.5 21.5 34 17 34 C12.5 34 9.5 33.5 5 31 C9 24 9 13 5 6 Z');
    background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.28) 70%,rgba(0,0,0,.46));
    transform:translateY(4px) scaleY(1.08);filter:blur(4px);opacity:1}
  .liq-bg{z-index:1;clip-path:path('M5 6 C9.5 4 12.5 3.5 17 3.5 C21.5 3.5 24.5 4 29 6 C25 13 25 24 29 31 C24.5 33.5 21.5 34 17 34 C12.5 34 9.5 33.5 5 31 C9 24 9 13 5 6 Z');
    background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 40%,rgba(255,255,255,.09) 76%,rgba(255,255,255,.15));
    -webkit-backdrop-filter:blur(16px) saturate(180%) brightness(1.06);
    backdrop-filter:blur(16px) saturate(180%) brightness(1.06)}
  #diag{position:fixed;left:10px;top:140px;color:#9a9;font:12px monospace;white-space:pre;background:#111;padding:10px;border:1px solid #333;z-index:99}
</style>
</head>
<body>
<div class="wrap">
  <span class="liq"><i class="liq-shadow"></i><i class="liq-bg"></i></span>
</div>
<pre id="diag">loading...</pre>
<script>
  window.addEventListener('load', function(){
    setTimeout(function(){
      var s = document.querySelector('.liq-shadow');
      var bg = document.querySelector('.liq-bg');
      var b = s.getBoundingClientRect();
      var bb = bg.getBoundingClientRect();
      var cs = getComputedStyle(s);
      var out = '';
      out += 'shadow rect: ' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + ' ' + b.width.toFixed(1) + 'x' + b.height.toFixed(1) + '\n';
      out += 'bg    rect: ' + bb.x.toFixed(1) + ',' + bb.y.toFixed(1) + ' ' + bb.width.toFixed(1) + 'x' + bb.height.toFixed(1) + '\n';
      out += 'display=' + cs.display + ' visibility=' + cs.visibility + ' opacity=' + cs.opacity + '\n';
      out += 'clip=' + cs.clipPath.slice(0,30) + '\n';
      out += 'transform=' + cs.transform + '\n';
      out += 'filter=' + cs.filter + '\n';
      out += 'zIndex=' + cs.zIndex + ' position=' + cs.position + '\n';
      document.getElementById('diag').textContent = out;
    }, 300);
  });
</script>
</body>
</html>
