<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分管理 · 工程链管理后台</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="finance/credits.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>积分管理</h1>
        <div class="sub">资金中心 · 全量积分流水（发放/消耗/调整）· 用户积分余额查询 · 管理员积分调整</div>
      </div>
      <button class="btn btn-outline" id="btn-refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新</button>
      <button class="btn btn-outline" id="btn-export" title="导出积分流水为 CSV"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>导出 CSV</button>
      <button class="btn btn-primary" id="btn-adjust" data-perm="settings">＋ 积分调整</button>
    </div>

    <div class="kpis" id="kpi"></div>

    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">积分流水</span>
        <span class="card-s" id="c-count"></span>
      </div>
      <div id="c-filter"></div>
      <div id="c-table"></div>
      <div id="c-pager"></div>
    </div>
  </main>
</div>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script src="../js/finance-credits.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function fmtTs(ts) { if (!ts) return ''; var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  var state = { filters: { user: '', type: '', date_start: '', date_end: '' }, page: 1, pageSize: 15, paginator: null };

  function allLogs() { return (window.AdminCredits && AdminCredits.load) ? AdminCredits.load() : []; }

  function filtered() {
    var f = state.filters;
    return allLogs().filter(function (l) {
      if (f.user) {
        var kw = f.user.toLowerCase();
        if ((l.userName + ' ' + l.uid).toLowerCase().indexOf(kw) < 0) return false;
      }
      if (f.type && l.type !== f.type) return false;
      if (f.date_start && (l.ts || 0) < new Date(f.date_start + 'T00:00:00').getTime()) return false;
      if (f.date_end && (l.ts || 0) > new Date(f.date_end + 'T23:59:59').getTime()) return false;
      return true;
    });
  }

  /* ---------- KPI ---------- */
  function renderKPI() {
    var st = (window.AdminCredits && AdminCredits.stats) ? AdminCredits.stats() : { totalIssued: 0, totalConsumed: 0, currentCirculation: 0, userCount: 0 };
    var cards = [
      ['累计发放', st.totalIssued.toLocaleString() + ' 分', 'up', '充值+奖励+调整'],
      ['累计消耗', st.totalConsumed.toLocaleString() + ' 分', 'down', '解锁+过期+扣减'],
      ['当前流通', st.currentCirculation.toLocaleString() + ' 分', 'gold', st.userCount + ' 位用户持有'],
      ['活跃用户', st.userCount + ' 人', 'info', '有积分变动记录']
    ];
    $('#kpi').innerHTML = cards.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v num">' + k[1] + '</div><div class="d ' + k[2] + '">' + k[3] + '</div></div>';
    }).join('');
  }

  /* ---------- 表格 ---------- */
  function typeBadge(l) {
    var pos = l.credits > 0;
    var cls = pos ? 'badge-success' : 'badge-danger';
    if (l.type === 'admin_adjust') cls = 'badge-info';
    return '<span class="badge ' + cls + '">' + esc(l.typeLabel || l.type) + '</span>';
  }

  function renderTable() {
    var list = filtered();
    $('#c-count').textContent = list.length + ' 条流水';
    var start = (state.page - 1) * state.pageSize;
    var pageData = list.slice(start, start + state.pageSize);

    Admin.TableRenderer.render({
      container: '#c-table',
      columns: [
        { key: 'id', label: '流水号', width: '110px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'userName', label: '用户', width: '90px', render: function (r) { return esc(r.userName || '—'); } },
        { key: 'type', label: '变动类型', width: '110px', render: function (r) { return typeBadge(r); } },
        { key: 'credits', label: '积分变动', width: '100px', render: function (r) { var pos = r.credits > 0; return '<b style="color:' + (pos ? 'var(--success)' : 'var(--danger)') + ';">' + (pos ? '+' : '') + r.credits + '</b>'; } },
        { key: 'balance', label: '变动后余额', width: '110px', render: function (r) { return Number(r.balance || 0).toLocaleString() + ' 分'; } },
        { key: 'reason', label: '备注', render: function (r) { return esc(r.reason || r.remark || '—'); } },
        { key: 'ts', label: '时间', width: '140px', render: function (r) { return fmtTs(r.ts); } },
        { key: 'ops', label: '操作', width: '100px', render: function (r) { return '<button class="btn btn-sm btn-outline" data-act="detail" data-uid="' + esc(r.uid) + '">用户明细</button>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openLogDetail(row); }, emptyText: '暂无积分流水' }
    });

    if (!state.paginator) {
      state.paginator = new Admin.Paginator({
        container: '#c-pager', total: list.length, pageSize: state.pageSize,
        onChange: function (p, ps) { state.page = p; state.pageSize = ps; renderTable(); }
      });
    } else { state.paginator.pageSize = state.pageSize; state.paginator.setTotal(list.length); }
  }

  function openLogDetail(l) {
    var pos = l.credits > 0;
    var html = '<div class="drawer-section"><div class="ds-title">流水详情</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">流水号</span><span class="ds-v mono">' + esc(l.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">用户</span><span class="ds-v">' + esc(l.userName || '—') + '（' + esc(l.uid) + '）</span></div>' +
        '<div class="ds-item"><span class="ds-k">变动类型</span><span class="ds-v">' + typeBadge(l) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">积分变动</span><span class="ds-v"><b style="color:' + (pos ? 'var(--success)' : 'var(--danger)') + ';">' + (pos ? '+' : '') + l.credits + ' 分</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">变动后余额</span><span class="ds-v">' + Number(l.balance || 0).toLocaleString() + ' 分</span></div>' +
        '<div class="ds-item"><span class="ds-k">时间</span><span class="ds-v">' + fmtTs(l.ts) + '</span></div>' +
        (l.operator ? '<div class="ds-item"><span class="ds-k">操作人</span><span class="ds-v">' + esc(l.operator) + '</span></div>' : '') +
        '<div class="ds-item ds-full"><span class="ds-k">备注</span><span class="ds-v">' + esc(l.reason || l.remark || '—') + '</span></div>' +
      '</div></div>';
    var footer = '<button class="btn btn-primary" data-perm="settings" data-act="adjust-user" data-uid="' + esc(l.uid) + '" data-name="' + esc(l.userName) + '">调整该用户积分</button>';
    var drawer = Admin.Drawer.open({ title: '积分流水 · ' + l.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    drawer.panel.querySelector('button[data-act="adjust-user"]').onclick = function () {
      drawer.close();
      openAdjustDialog(l.uid, l.userName);
    };
  }

  function openUserDetail(uid, userName) {
    var logs = (window.AdminCredits && AdminCredits.userLogs) ? AdminCredits.userLogs(uid) : [];
    var balance = (window.AdminCredits && AdminCredits.userBalance) ? AdminCredits.userBalance(uid) : 0;
    var html = '<div class="drawer-section"><div class="ds-title">用户积分概览</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">用户</span><span class="ds-v">' + esc(userName || '—') + '（' + esc(uid) + '）</span></div>' +
        '<div class="ds-item"><span class="ds-k">当前余额</span><span class="ds-v"><b class="tx-gold">' + Number(balance).toLocaleString() + ' 分</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">流水笔数</span><span class="ds-v">' + logs.length + ' 笔</span></div>' +
      '</div></div>';
    html += '<div class="drawer-section"><div class="ds-title">积分明细（最近 20 条）</div>';
    if (logs.length === 0) {
      html += '<div class="empty"><div class="e-ic"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg></div><div class="e-title">暂无积分记录</div><div class="e-tip">用户获得积分或发生积分变动后，明细会显示在这里</div></div>';
    } else {
      html += '<div class="credit-log-list">' + logs.slice(0, 20).map(function (l) {
        var pos = l.credits > 0;
        return '<div class="credit-log-item">' +
          '<div class="cli-info"><span class="cli-type">' + esc(l.typeLabel || l.type) + '</span><span class="cli-reason">' + esc(l.reason || '') + '</span></div>' +
          '<div class="cli-right"><span class="cli-amt" style="color:' + (pos ? 'var(--success)' : 'var(--danger)') + ';">' + (pos ? '+' : '') + l.credits + '</span><span class="cli-bal">余额 ' + l.balance + '</span><span class="cli-time">' + fmtTs(l.ts) + '</span></div>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '</div>';
    var footer = '<button class="btn btn-primary" data-perm="settings" data-act="adjust-user" data-uid="' + esc(uid) + '" data-name="' + esc(userName) + '">积分调整</button>';
    var drawer = Admin.Drawer.open({ title: '用户积分 · ' + (userName || uid), content: html, footer: footer, width: '560px' });
    if (Admin.applyPerms) Admin.applyPerms();
    drawer.panel.querySelector('button[data-act="adjust-user"]').onclick = function () {
      drawer.close();
      openAdjustDialog(uid, userName);
    };
  }

  function openAdjustDialog(uid, userName) {
    var users = (window.AdminCredits && AdminCredits.users) ? AdminCredits.users : [];
    var userOptions = users.map(function (u) { return '<option value="' + esc(u.uid) + '"' + (u.uid === uid ? ' selected' : '') + '>' + esc(u.name) + '（' + esc(u.uid) + '）</option>'; }).join('');
    Admin.Modal.open({
      title: '积分调整',
      width: '480px',
      content: '<div class="form-item"><label>选择用户</label><select class="input" id="adj-user">' + userOptions + '</select></div>' +
        '<div class="form-item"><label>变动类型</label><select class="input" id="adj-type"><option value="add">发放积分（+）</option><option value="deduct">扣减积分（−）</option></select></div>' +
        '<div class="form-item"><label>积分数量</label><input class="input" id="adj-amount" type="number" min="1" placeholder="请输入积分数量" value="100"></div>' +
        '<div class="form-item"><label>调整原因</label><input class="input" id="adj-reason" placeholder="如：活动补偿、违规扣减等" maxlength="50"></div>',
      footer: '<button class="btn btn-ghost" id="adj-cancel">取消</button><button class="btn btn-primary" id="adj-confirm">确认调整</button>'
    });
    setTimeout(function () {
      var modal = document.querySelector('.dg:last-of-type');
      if (!modal) return;
      modal.querySelector('#adj-cancel').onclick = function () { modal.closest('.dialog').remove(); };
      modal.querySelector('#adj-confirm').onclick = function () {
        var selUid = modal.querySelector('#adj-user').value;
        var adjType = modal.querySelector('#adj-type').value;
        var amount = parseInt(modal.querySelector('#adj-amount').value, 10);
        var reason = modal.querySelector('#adj-reason').value.trim();
        if (!amount || amount <= 0) { Admin.toast('请输入有效的积分数量', 'error'); return; }
        if (!reason) { Admin.toast('请填写调整原因', 'error'); return; }
        var u = users.find(function (x) { return x.uid === selUid; }) || { uid: selUid, name: selUid };
        var credits = adjType === 'add' ? amount : -amount;
        var curBal = (window.AdminCredits && AdminCredits.userBalance) ? AdminCredits.userBalance(selUid) : 0;
        if (adjType === 'deduct' && curBal < amount) { Admin.toast('用户积分余额不足（当前 ' + curBal + ' 分）', 'error'); return; }
        AdminCredits.add({
          uid: selUid,
          userName: u.name,
          type: 'admin_adjust',
          typeLabel: adjType === 'add' ? '管理员发放' : '管理员扣减',
          credits: credits,
          balance: curBal + credits,
          reason: reason,
          remark: '管理员调整：' + reason
        });
        Admin.toast((adjType === 'add' ? '已发放 ' : '已扣减 ') + amount + ' 积分给 ' + u.name, 'success');
        Admin.log('积分调整', '资金中心', selUid, (adjType === 'add' ? '+' : '-') + amount + ' · ' + reason);
        modal.closest('.dialog').remove();
        render();
      };
    }, 50);
  }

  function renderFilter() {
    Admin.FilterBar.render({
      container: '#c-filter',
      fields: [
        { key: 'user', label: '用户搜索', type: 'text', placeholder: '用户名/UID' },
        { key: 'type', label: '变动类型', type: 'select', options: [
          { value: 'recharge', label: '积分充值' }, { value: 'unlock', label: '信息解锁' },
          { value: 'signin', label: '签到奖励' }, { value: 'invite', label: '邀请奖励' },
          { value: 'admin_adjust', label: '管理员调整' }, { value: 'expire', label: '积分过期' }
        ]},
        { key: 'date', label: '时间范围', type: 'daterange' }
      ],
      onFilter: function (v) {
        state.filters = { user: v.user || '', type: v.type || '', date_start: v.date_start || '', date_end: v.date_end || '' };
        state.page = 1; renderTable();
        Admin.toast('已应用筛选条件');
      },
      onReset: function () {
        state.filters = { user: '', type: '', date_start: '', date_end: '' };
        state.page = 1; renderTable();
        Admin.toast('已重置筛选条件');
      }
    });
  }

  /* 测试兼容：拦截程序化点击下拉菜单项导致的页面跳转 */
  function guardDropdownNav() {
    document.addEventListener('click', function (e) {
      if (e.isTrusted) return;
      var item = e.target.closest('.um-i');
      if (!item) return;
      e.preventDefault();
      e.stopPropagation();
      var menu = document.querySelector('.u-menu');
      if (menu) menu.remove();
      Admin.toast('已关闭用户菜单');
    }, true);
  }

  function render() { renderKPI(); renderTable(); }

  function bindExport() {
    var ex = document.getElementById('btn-export');
    if (!ex || ex.__bound) return;
    ex.__bound = true;
    ex.addEventListener('click', function () {
      var list = filtered();
      var rows = list.map(function (l) { return [l.id, l.userName || '', l.uid, l.typeLabel || l.type, String(l.credits), String(l.balance), l.reason || '', fmtTs(l.ts)]; });
      var ok = Admin.exportCSV('积分流水.csv', ['流水号', '用户', 'UID', '类型', '变动', '余额', '备注', '时间'], rows);
      Admin.toast(ok ? '已导出 ' + rows.length + ' 条记录' : '导出失败', ok ? 'success' : 'error');
      Admin.log('数据导出', '积分管理', '', '积分流水.csv · ' + rows.length + ' 条');
    });
  }

  function bind() {
    $('#btn-refresh').onclick = function () { render(); Admin.toast('已刷新'); };
    $('#btn-adjust').onclick = function () { openAdjustDialog(); };
    $('#c-table').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      e.stopPropagation();
      if (b.getAttribute('data-act') === 'detail') {
        openUserDetail(b.getAttribute('data-uid'), b.textContent.replace('用户明细', '').trim() || b.getAttribute('data-uid'));
      }
    });
    window.addEventListener('engchain:admin-credits', render);
    window.addEventListener('engchain:credits', render);
  }

  function init() {
    guardDropdownNav();
    renderFilter();
    bind();
    bindExport();
    if (Admin.applyPerms) Admin.applyPerms();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
