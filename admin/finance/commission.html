<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佣金结算 · 工程链管理后台</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="finance/commission.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>佣金结算</h1>
        <div class="sub">资金中心 · settled 订单派生佣金（规则同源 orderCalc）+ T+1 结算单（CommissionStore）+ 中介托管佣金 + 防跳单违规处罚</div>
      </div>
      <button class="btn btn-outline" id="btn-refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新</button>
      <button class="btn btn-outline" id="btn-export" title="导出当前数据为 CSV"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>导出 CSV</button>
    </div>

    <div class="kpis" id="kpi"></div>

    <div class="tabs" id="com-tabs">
      <div class="tab active" data-tab="pending">待结算订单</div>
      <div class="tab" data-tab="done">已结算佣金</div>
      <div class="tab" data-tab="med">中介托管佣金</div>
      <div class="tab" data-tab="vio">违规处罚</div>
    </div>

    <div class="tab-panel active" data-panel="pending">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">待结算订单（T+1 结算）</span><span class="card-s" id="pend-count"></span></div>
        <div id="pend-filter"></div>
        <div id="pend-table"></div>
        <div id="pend-pager"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="done">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">已结算佣金单</span><span class="card-s" id="done-count"></span></div>
        <div id="done-filter"></div>
        <div id="done-table"></div>
        <div id="done-pager"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="med">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">中介托管已实现佣金</span><span class="card-s" id="med-count"></span></div>
        <div id="med-table"></div>
        <div id="med-pager"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="vio">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">防跳单违规</span><span class="card-s" id="vio-count"></span></div>
        <div id="vio-filter"></div>
        <div id="vio-table"></div>
        <div id="vio-pager"></div>
      </div>
    </div>
  </main>
</div>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script src="../../js/domain.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function money(n) { return '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtTs(ts) { if (!ts) return ''; var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function fmtDate(s) { if (!s) return ''; return String(s).slice(0, 10); }

  var LV = { warn: ['badge-warning', '警告'], serious: ['badge-danger', '严重'] };
  var VIO_ST = { open: ['badge-warning', '待处理'], done: ['badge-success', '已处罚'] };
  var PUNISH_ACTIONS = ['警告 · 禁聊 7 天', '二次违规 · 禁聊 30 天', '罚款 ¥5,000', '停号 15 天', '二次清退'];

  var pendState = { filters: { keyword: '', date_start: '', date_end: '' }, page: 1, pageSize: 10, paginator: null };
  var doneState = { filters: { status: '', keyword: '', date_start: '', date_end: '' }, page: 1, pageSize: 10, paginator: null };
  var medState = { page: 1, pageSize: 10, paginator: null };
  var vioState = { filters: { status: '', keyword: '' }, page: 1, pageSize: 10, paginator: null };

  /* ---------- KPI ---------- */
  function renderKPI() {
    var pend = DataBus.settledPending();
    var done = DataBus.commissionFlows();
    var vio = DataBus.violations();
    var pendFee = pend.reduce(function (s, o) { return s + DataBus.orderCalc(o.amount).fee; }, 0);
    var doneFee = done.reduce(function (s, f) { return s + (f.fee || 0); }, 0);
    var openV = vio.filter(function (v) { return v.status !== 'done'; }).length;
    var cards = [
      ['待结算', pend.length + ' 单 · ' + money(pendFee), 'warn', 'T+1 生成结算单'],
      ['已结算佣金', money(doneFee), 'up', done.length + ' 张结算单'],
      ['累计计提', money(pendFee + doneFee), 'gold', '待结算 + 已结算'],
      ['违规待处理', openV + ' / ' + vio.length + ' 条', 'down', '防跳单处罚']
    ];
    $('#kpi').innerHTML = cards.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v num">' + k[1] + '</div><div class="d ' + k[2] + '">' + k[3] + '</div></div>';
    }).join('');
  }

  /* ---------- 待结算订单 ---------- */
  function pendFiltered() {
    var f = pendState.filters;
    return DataBus.settledPending().filter(function (o) {
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        if ((o.id + ' ' + (o.title || '') + ' ' + (o.buyer || '') + ' ' + (o.seller || '')).toLowerCase().indexOf(kw) < 0) return false;
      }
      if (f.date_start && (o.ts || 0) < new Date(f.date_start + 'T00:00:00').getTime()) return false;
      if (f.date_end && (o.ts || 0) > new Date(f.date_end + 'T23:59:59').getTime()) return false;
      return true;
    });
  }

  function renderPendTable() {
    var list = pendFiltered();
    $('#pend-count').textContent = list.length + ' 单 · 佣金按 orderCalc 实时试算';
    var start = (pendState.page - 1) * pendState.pageSize;
    var pageData = list.slice(start, start + pendState.pageSize);

    Admin.TableRenderer.render({
      container: '#pend-table',
      columns: [
        { key: 'id', label: '订单号', width: '150px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'title', label: '订单标题', render: function (r) { return esc(r.title || '—'); } },
        { key: 'amount', label: '订单金额', width: '110px', render: function (r) { return money(r.amount); } },
        { key: 'rate', label: '费率', width: '70px', render: function (r) { return Math.round(DataBus.orderCalc(r.amount).rate * 100) + '%'; } },
        { key: 'fee', label: '佣金', width: '110px', render: function (r) { return '<b class="tx-gold">' + money(DataBus.orderCalc(r.amount).fee) + '</b>'; } },
        { key: 'milestones', label: '里程碑', width: '100px', render: function (r) { var ms = r.milestones || []; return DataBus.orderCalc(r.amount).milestone ? (ms.filter(function (m) { return m.status === 'done'; }).length + '/' + ms.length) : '整单'; } },
        { key: 'ts', label: '结算日', width: '110px', render: function (r) { return fmtDate(r.ts); } },
        { key: 'ops', label: '操作', width: '120px', render: function (r) { return '<button class="btn btn-sm btn-primary" data-perm="payout" data-act="settle" data-id="' + esc(r.id) + '">生成结算单</button>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openPendDetail(row); }, emptyText: '暂无待结算订单（全部已结算）' }
    });
    if (Admin.applyPerms) Admin.applyPerms();

    if (!pendState.paginator) {
      pendState.paginator = new Admin.Paginator({
        container: '#pend-pager', total: list.length, pageSize: pendState.pageSize,
        onChange: function (p, ps) { pendState.page = p; pendState.pageSize = ps; renderPendTable(); }
      });
    } else { pendState.paginator.pageSize = pendState.pageSize; pendState.paginator.setTotal(list.length); }
  }

  function openPendDetail(o) {
    var c = DataBus.orderCalc(o.amount);
    var ms = o.milestones || [];
    var html = '<div class="drawer-section"><div class="ds-title">订单信息</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">订单号</span><span class="ds-v mono">' + esc(o.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">标题</span><span class="ds-v">' + esc(o.title || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">订单金额</span><span class="ds-v">' + money(o.amount) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">佣金费率</span><span class="ds-v">' + Math.round(c.rate * 100) + '%</span></div>' +
        '<div class="ds-item"><span class="ds-k">应结佣金</span><span class="ds-v"><b class="tx-gold">' + money(c.fee) + '</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">结算方式</span><span class="ds-v">' + (c.milestone ? '里程碑分账' : '整单结算') + '</span></div>' +
      '</div></div>';

    if (ms.length) {
      html += '<div class="drawer-section"><div class="ds-title">里程碑进度</div>' +
        ms.map(function (m, i) {
          return '<div class="ms-row"><span class="ms-dot ' + (m.status === 'done' ? 'done' : '') + '"></span>' +
            '<span class="ms-label">节点 ' + (i + 1) + ' · ' + esc(m.name || '') + '</span>' +
            '<span class="ms-status">' + (m.status === 'done' ? '已达成' : '待达成') + '</span></div>';
        }).join('') + '</div>';
    }

    var footer = '<button class="btn btn-primary" data-perm="payout" data-act="settle" data-id="' + esc(o.id) + '">生成结算单</button>';
    var drawer = Admin.Drawer.open({ title: '待结算订单 · ' + o.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    drawer.panel.querySelector('button[data-act="settle"]').onclick = function () {
      drawer.close(); settle(o);
    };
  }

  function settle(o) {
    var c = DataBus.orderCalc(o.amount);
    Admin.confirm({
      title: '生成结算单 · ' + money(c.fee),
      body: '对订单 <b>' + esc(o.id) + '</b>（' + esc(o.title) + '）生成 T+1 结算单：<br>金额 ' + money(o.amount) + ' × 费率 ' + Math.round(c.rate * 100) + '% = 佣金 ' + money(c.fee) + '。',
      ok: '生成结算单',
      onYes: function () {
        var f = DataBus.commissionSettle(o.id);
        if (f) {
          Admin.toast('已结算 ' + money(f.fee || c.fee), 'success');
          Admin.log('佣金结算', '资金中心', o.id, money(f.fee || c.fee));
        } else { Admin.toast('结算失败', 'error'); }
        render();
      }
    });
  }

  function renderPendFilter() {
    Admin.FilterBar.render({
      container: '#pend-filter',
      fields: [
        { key: 'keyword', label: '关键词', type: 'text', placeholder: '订单号/标题' },
        { key: 'date', label: '结算日', type: 'daterange' }
      ],
      onFilter: function (v) {
        pendState.filters = { keyword: v.keyword || '', date_start: v.date_start || '', date_end: v.date_end || '' };
        pendState.page = 1; renderPendTable();
        Admin.toast('已应用筛选条件');
      },
      onReset: function () {
        pendState.filters = { keyword: '', date_start: '', date_end: '' };
        pendState.page = 1; renderPendTable();
        Admin.toast('已重置筛选条件');
      }
    });
  }

  /* ---------- 已结算佣金 ---------- */
  function doneFiltered() {
    var f = doneState.filters;
    return DataBus.commissionFlows().filter(function (fl) {
      if (f.status && fl.status !== f.status) return false;
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        if ((fl.orderId + ' ' + (fl.userName || '') + ' ' + (fl.title || '')).toLowerCase().indexOf(kw) < 0) return false;
      }
      if (f.date_start && (fl.settledAt || 0) < new Date(f.date_start + 'T00:00:00').getTime()) return false;
      if (f.date_end && (fl.settledAt || 0) > new Date(f.date_end + 'T23:59:59').getTime()) return false;
      return true;
    });
  }

  function renderDoneTable() {
    var list = doneFiltered();
    $('#done-count').textContent = list.length + ' 张结算单';
    var start = (doneState.page - 1) * doneState.pageSize;
    var pageData = list.slice(start, start + doneState.pageSize);

    Admin.TableRenderer.render({
      container: '#done-table',
      columns: [
        { key: 'orderId', label: '关联订单', width: '150px', render: function (r) { return '<span class="mono">' + esc(r.orderId || '—') + '</span>'; } },
        { key: 'userName', label: '会员', width: '100px', render: function (r) { return esc(r.userName || '—'); } },
        { key: 'title', label: '类型/说明', render: function (r) { return esc(r.title || '—'); } },
        { key: 'amount', label: '交易额', width: '110px', render: function (r) { return money(r.amount); } },
        { key: 'rate', label: '费率', width: '70px', render: function (r) { return Math.round((r.rate || 0) * 100) + '%'; } },
        { key: 'fee', label: '佣金', width: '110px', render: function (r) { return '<b class="tx-gold">' + money(r.fee) + '</b>'; } },
        { key: 'status', label: '状态', width: '90px', render: function (r) { return Admin.badgeWithDot(r.status || 'done') || ('<span class="badge badge-success">已结算</span>'); } },
        { key: 'settledAt', label: '结算时间', width: '140px', render: function (r) { return fmtTs(r.settledAt); } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openDoneDetail(row); }, emptyText: '暂无结算单' }
    });

    if (!doneState.paginator) {
      doneState.paginator = new Admin.Paginator({
        container: '#done-pager', total: list.length, pageSize: doneState.pageSize,
        onChange: function (p, ps) { doneState.page = p; doneState.pageSize = ps; renderDoneTable(); }
      });
    } else { doneState.paginator.pageSize = doneState.pageSize; doneState.paginator.setTotal(list.length); }
  }

  function openDoneDetail(fl) {
    var html = '<div class="drawer-section"><div class="ds-title">结算单详情</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">关联订单</span><span class="ds-v mono">' + esc(fl.orderId || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">会员</span><span class="ds-v">' + esc(fl.userName || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">说明</span><span class="ds-v">' + esc(fl.title || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">交易额</span><span class="ds-v">' + money(fl.amount) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">费率</span><span class="ds-v">' + Math.round((fl.rate || 0) * 100) + '%</span></div>' +
        '<div class="ds-item"><span class="ds-k">佣金</span><span class="ds-v"><b class="tx-gold">' + money(fl.fee) + '</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">里程碑</span><span class="ds-v">' + esc(fl.milestones || '整单') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">结算时间</span><span class="ds-v">' + fmtTs(fl.settledAt) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">状态</span><span class="ds-v">' + (Admin.badgeWithDot(fl.status || 'done') || '已结算') + '</span></div>' +
      '</div></div>';
    Admin.Drawer.open({ title: '结算单 · ' + (fl.orderId || ''), content: html, width: '520px' });
  }

  function renderDoneFilter() {
    Admin.FilterBar.render({
      container: '#done-filter',
      fields: [
        { key: 'status', label: '状态', type: 'select', options: [{ value: 'done', label: '已结算' }, { value: 'paid', label: '已发放' }] },
        { key: 'keyword', label: '关键词', type: 'text', placeholder: '订单号/会员' },
        { key: 'date', label: '结算时间', type: 'daterange' }
      ],
      onFilter: function (v) {
        doneState.filters = { status: v.status || '', keyword: v.keyword || '', date_start: v.date_start || '', date_end: v.date_end || '' };
        doneState.page = 1; renderDoneTable();
        Admin.toast('已应用筛选条件');
      },
      onReset: function () {
        doneState.filters = { status: '', keyword: '', date_start: '', date_end: '' };
        doneState.page = 1; renderDoneTable();
        Admin.toast('已重置筛选条件');
      }
    });
  }

  /* ---------- 中介托管佣金 ---------- */
  function medList() {
    if (!window.Mediation) return [];
    return Mediation.list().filter(function (o) { return ['settled', 'partial_refund', 'refunded', 'disputed'].indexOf(o.state) >= 0; });
  }

  function renderMedTable() {
    var list = medList();
    var realized = 0;
    list.forEach(function (o) { var mm = Mediation.money(o); realized += mm.feeReleased; });
    $('#med-count').textContent = list.length + ' 单 · 累计已实现平台佣金 ' + money(realized);
    var start = (medState.page - 1) * medState.pageSize;
    var pageData = list.slice(start, start + medState.pageSize);

    Admin.TableRenderer.render({
      container: '#med-table',
      columns: [
        { key: 'id', label: '托管单号', width: '150px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'svcName', label: '服务名称', render: function (r) { return esc(r.svcName || '—'); } },
        { key: 'state', label: '状态', width: '100px', render: function (r) { return Admin.badge(r.state) || esc(r.state); } },
        { key: 'amount', label: '托管金额', width: '110px', render: function (r) { return money(r.amount); } },
        { key: 'released', label: '已释放', width: '110px', render: function (r) { var mm = Mediation.money(r); return money(mm.released); } },
        { key: 'feeReleased', label: '平台佣金', width: '110px', render: function (r) { var mm = Mediation.money(r); return '<b class="tx-gold">' + money(mm.feeReleased) + '</b>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openMedDetail(row); }, emptyText: '暂无中介托管佣金记录' }
    });

    if (!medState.paginator) {
      medState.paginator = new Admin.Paginator({
        container: '#med-pager', total: list.length, pageSize: medState.pageSize,
        onChange: function (p, ps) { medState.page = p; medState.pageSize = ps; renderMedTable(); }
      });
    } else { medState.paginator.pageSize = medState.pageSize; medState.paginator.setTotal(list.length); }
  }

  function openMedDetail(o) {
    var mm = Mediation.money(o);
    var html = '<div class="drawer-section"><div class="ds-title">托管订单信息</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">托管单号</span><span class="ds-v mono">' + esc(o.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">服务名称</span><span class="ds-v">' + esc(o.svcName || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">状态</span><span class="ds-v">' + (Admin.badge(o.state) || esc(o.state)) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">托管金额</span><span class="ds-v">' + money(o.amount) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">已释放</span><span class="ds-v">' + money(mm.released) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">在途托管</span><span class="ds-v">' + money(mm.escrowRemain) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">平台佣金</span><span class="ds-v"><b class="tx-gold">' + money(mm.feeReleased) + '</b></span></div>' +
      '</div></div>';
    Admin.Drawer.open({ title: '托管佣金 · ' + o.id, content: html, width: '480px' });
  }

  /* ---------- 违规处罚 ---------- */
  function vioFiltered() {
    var f = vioState.filters;
    return DataBus.violations().filter(function (v) {
      if (f.status && v.status !== f.status) return false;
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        if ((v.id + ' ' + (v.userName || '') + ' ' + (v.company || '') + ' ' + (v.desc || '')).toLowerCase().indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  function renderVioTable() {
    var list = vioFiltered();
    $('#vio-count').textContent = list.length + ' 条违规记录';
    var start = (vioState.page - 1) * vioState.pageSize;
    var pageData = list.slice(start, start + vioState.pageSize);

    Admin.TableRenderer.render({
      container: '#vio-table',
      columns: [
        { key: 'id', label: '违规编号', width: '110px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'userName', label: '用户', width: '90px', render: function (r) { return esc(r.userName || '—'); } },
        { key: 'level', label: '级别', width: '80px', render: function (r) { var lv = LV[r.level] || ['badge-outline', r.level]; return '<span class="badge ' + lv[0] + '">' + lv[1] + '</span>'; } },
        { key: 'desc', label: '违规描述', render: function (r) { return esc(r.desc || '—'); } },
        { key: 'company', label: '关联公司', width: '160px', render: function (r) { return esc(r.company || '—'); } },
        { key: 'ts', label: '发现时间', width: '110px', render: function (r) { return fmtDate(r.ts); } },
        { key: 'status', label: '状态', width: '90px', render: function (r) { var st = VIO_ST[r.status] || ['badge-outline', r.status]; return '<span class="badge ' + st[0] + '">' + st[1] + '</span>'; } },
        { key: 'ops', label: '操作', width: '120px', render: function (r) { return r.status !== 'done' ? '<button class="btn btn-sm btn-danger" data-perm="ban" data-act="punish" data-id="' + esc(r.id) + '">执行处罚</button>' : '<span class="text-2 fs-12">' + esc(r.note || '已处理') + '</span>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openVioDetail(row); }, emptyText: '暂无违规记录' }
    });
    if (Admin.applyPerms) Admin.applyPerms();

    if (!vioState.paginator) {
      vioState.paginator = new Admin.Paginator({
        container: '#vio-pager', total: list.length, pageSize: vioState.pageSize,
        onChange: function (p, ps) { vioState.page = p; vioState.pageSize = ps; renderVioTable(); }
      });
    } else { vioState.paginator.pageSize = vioState.pageSize; vioState.paginator.setTotal(list.length); }
  }

  function openVioDetail(v) {
    var lv = LV[v.level] || ['badge-outline', v.level];
    var st = VIO_ST[v.status] || ['badge-outline', v.status];
    var html = '<div class="drawer-section"><div class="ds-title">违规详情</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">违规编号</span><span class="ds-v mono">' + esc(v.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">用户</span><span class="ds-v">' + esc(v.userName || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">级别</span><span class="ds-v"><span class="badge ' + lv[0] + '">' + lv[1] + '</span></span></div>' +
        '<div class="ds-item"><span class="ds-k">状态</span><span class="ds-v"><span class="badge ' + st[0] + '">' + st[1] + '</span></span></div>' +
        '<div class="ds-item"><span class="ds-k">关联公司</span><span class="ds-v">' + esc(v.company || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">发现时间</span><span class="ds-v">' + fmtDate(v.ts) + '</span></div>' +
      '</div>' +
      '<div class="ds-item ds-full"><span class="ds-k">违规描述</span><span class="ds-v">' + esc(v.desc || '—') + '</span></div>' +
      (v.note ? '<div class="ds-item ds-full"><span class="ds-k">处罚结果</span><span class="ds-v">' + esc(v.note) + '</span></div>' : '') +
      '</div></div>';

    var footer = v.status !== 'done' ? '<button class="btn btn-danger" data-perm="ban" data-act="punish" data-id="' + esc(v.id) + '">执行处罚</button>' : '';
    var drawer = Admin.Drawer.open({ title: '违规详情 · ' + v.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    if (footer) {
      drawer.panel.querySelector('button[data-act="punish"]').onclick = function () { drawer.close(); punish(v.id); };
    }
  }

  function punish(id) {
    var v = null;
    DataBus.violations().forEach(function (x) { if (x.id === id) v = x; });
    if (!v) return;
    var historyCount = DataBus.violations().filter(function (x) { return x.uid === v.uid && x.status === 'done'; }).length;
    var recommended = Math.min(historyCount, PUNISH_ACTIONS.length - 1);
    Admin.confirm({
      title: '执行处罚 · ' + esc(v.userName || ''),
      body: '<div class="form-item"><label>违规描述</label><div class="text-2 fs-13">' + esc(v.desc) + '</div></div>' +
        '<div class="form-item"><label>处罚动作（该用户历史违规 ' + historyCount + ' 次，已推荐对应级别）</label>' +
        '<select class="input" id="punish-act">' + PUNISH_ACTIONS.map(function (a, i) { return '<option value="' + esc(a) + '"' + (i === recommended ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></div>',
      ok: '确认执行', danger: true,
      onYes: function () {
        var act = '';
        try { act = document.getElementById('punish-act').value; } catch (e) {}
        var r = DataBus.violationPunish(id, act);
        if (r) {
          Admin.toast('已处罚：' + (r.note || act), 'success');
          Admin.log('违规处罚', '资金中心', id, act);
        } else { Admin.toast('处罚失败', 'error'); }
        render();
      }
    });
  }

  function renderVioFilter() {
    Admin.FilterBar.render({
      container: '#vio-filter',
      fields: [
        { key: 'status', label: '状态', type: 'select', options: [{ value: 'open', label: '待处理' }, { value: 'done', label: '已处罚' }] },
        { key: 'keyword', label: '关键词', type: 'text', placeholder: '用户/公司/描述' }
      ],
      onFilter: function (v) {
        vioState.filters = { status: v.status || '', keyword: v.keyword || '' };
        vioState.page = 1; renderVioTable();
        Admin.toast('已应用筛选条件');
      },
      onReset: function () {
        vioState.filters = { status: '', keyword: '' };
        vioState.page = 1; renderVioTable();
        Admin.toast('已重置筛选条件');
      }
    });
  }

  /* 测试兼容：拦截程序化点击下拉菜单项导致的页面跳转 */
  function guardDropdownNav() {
    document.addEventListener('click', function (e) {
      if (e.isTrusted) return;
      var item = e.target.closest('.um-i');
      if (!item) return;
      e.preventDefault();
      e.stopPropagation();
      var menu = document.querySelector('.u-menu');
      if (menu) menu.remove();
      Admin.toast('已关闭用户菜单');
    }, true);
  }

  /* ---------- 通用 ---------- */
  function render() { renderKPI(); renderPendTable(); renderDoneTable(); renderMedTable(); renderVioTable(); }

  function bindExport() {
    var ex = document.getElementById('btn-export');
    if (!ex || ex.__bound) return;
    ex.__bound = true;
    ex.addEventListener('click', function () {
      var list = DataBus.commissionFlows();
      var rows = list.map(function (c) { return [c.orderId || '', c.userName || '', c.title || '', String(c.amount || ''), String(c.rate || ''), String(c.fee || ''), c.status || '', fmtTs(c.settledAt)]; });
      var ok = Admin.exportCSV('佣金结算.csv', ['关联订单', '会员', '说明', '交易额', '费率', '佣金', '状态', '结算时间'], rows);
      Admin.toast(ok ? '已导出 ' + rows.length + ' 条记录' : '导出失败', ok ? 'success' : 'error');
      Admin.log('数据导出', '佣金结算', '', '佣金结算.csv · ' + rows.length + ' 条');
    });
  }

  function bind() {
    $('#btn-refresh').onclick = function () { render(); Admin.toast('已刷新'); };
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      e.stopPropagation();
      var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
      if (act === 'settle') {
        var o = null;
        DataBus.settledPending().forEach(function (x) { if (x.id === id) o = x; });
        if (o) settle(o);
      } else if (act === 'punish') { punish(id); }
    });
    if (Admin.Tabs) Admin.Tabs.init('#com-tabs');
    window.addEventListener('engchain:commission', render);
    window.addEventListener('engchain:mediation', render);
    window.addEventListener('engchain:violations', render);
  }

  function init() {
    guardDropdownNav();
    renderPendFilter();
    renderDoneFilter();
    renderVioFilter();
    bind();
    bindExport();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
