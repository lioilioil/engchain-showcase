<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浣ｉ噾缁撶畻 路 宸ョ▼閾剧鐞嗗悗鍙?/title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="finance/commission.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>浣ｉ噾缁撶畻</h1>
        <div class="sub">璧勯噾涓績 路 settled 璁㈠崟娲剧敓浣ｉ噾锛堣鍒欏悓婧?orderCalc锛? T+1 缁撶畻鍗曪紙CommissionStore锛? 涓粙鎵樼浣ｉ噾 + 闃茶烦鍗曡繚瑙勫缃?/div>
      </div>
      <button class="btn btn-outline" id="btn-refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>鍒锋柊</button>
      <button class="btn btn-outline" id="btn-export" title="瀵煎嚭褰撳墠鏁版嵁涓?CSV"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>瀵煎嚭 CSV</button>
    </div>

    <div class="kpis" id="kpi"></div>

    <div class="tabs" id="com-tabs">
      <div class="tab active" data-tab="pending">寰呯粨绠楄鍗?/div>
      <div class="tab" data-tab="done">宸茬粨绠椾剑閲?/div>
      <div class="tab" data-tab="med">涓粙鎵樼浣ｉ噾</div>
      <div class="tab" data-tab="vio">杩濊澶勭綒</div>
    </div>

    <div class="tab-panel active" data-panel="pending">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">寰呯粨绠楄鍗曪紙T+1 缁撶畻锛?/span><span class="card-s" id="pend-count"></span></div>
        <div id="pend-filter"></div>
        <div id="pend-table"></div>
        <div id="pend-pager"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="done">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">宸茬粨绠椾剑閲戝崟</span><span class="card-s" id="done-count"></span></div>
        <div id="done-filter"></div>
        <div id="done-table"></div>
        <div id="done-pager"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="med">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">涓粙鎵樼宸插疄鐜颁剑閲?/span><span class="card-s" id="med-count"></span></div>
        <div id="med-table"></div>
        <div id="med-pager"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="vio">
      <div class="card card-pad">
        <div class="card-h"><span class="card-t">闃茶烦鍗曡繚瑙?/span><span class="card-s" id="vio-count"></span></div>
        <div id="vio-filter"></div>
        <div id="vio-table"></div>
        <div id="vio-pager"></div>
      </div>
    </div>
  </main>
</div>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script src="../../js/domain.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function money(n) { return '楼' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtTs(ts) { if (!ts) return ''; var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function fmtDate(s) { if (!s) return ''; return String(s).slice(0, 10); }

  var LV = { warn: ['badge-warning', '璀﹀憡'], serious: ['badge-danger', '涓ラ噸'] };
  var VIO_ST = { open: ['badge-warning', '寰呭鐞?], done: ['badge-success', '宸插缃?] };
  var PUNISH_ACTIONS = ['璀﹀憡 路 绂佽亰 7 澶?, '浜屾杩濊 路 绂佽亰 30 澶?, '缃氭 楼5,000', '鍋滃彿 15 澶?, '浜屾娓呴€€'];

  var pendState = { filters: { keyword: '', date_start: '', date_end: '' }, page: 1, pageSize: 10, paginator: null };
  var doneState = { filters: { status: '', keyword: '', date_start: '', date_end: '' }, page: 1, pageSize: 10, paginator: null };
  var medState = { page: 1, pageSize: 10, paginator: null };
  var vioState = { filters: { status: '', keyword: '' }, page: 1, pageSize: 10, paginator: null };

  /* ---------- KPI ---------- */
  function renderKPI() {
    var pend = DataBus.settledPending();
    var done = DataBus.commissionFlows();
    var vio = DataBus.violations();
    var pendFee = pend.reduce(function (s, o) { return s + DataBus.orderCalc(o.amount).fee; }, 0);
    var doneFee = done.reduce(function (s, f) { return s + (f.fee || 0); }, 0);
    var openV = vio.filter(function (v) { return v.status !== 'done'; }).length;
    var cards = [
      ['寰呯粨绠?, pend.length + ' 鍗?路 ' + money(pendFee), 'warn', 'T+1 鐢熸垚缁撶畻鍗?],
      ['宸茬粨绠椾剑閲?, money(doneFee), 'up', done.length + ' 寮犵粨绠楀崟'],
      ['绱璁℃彁', money(pendFee + doneFee), 'gold', '寰呯粨绠?+ 宸茬粨绠?],
      ['杩濊寰呭鐞?, openV + ' / ' + vio.length + ' 鏉?, 'down', '闃茶烦鍗曞缃?]
    ];
    $('#kpi').innerHTML = cards.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v num">' + k[1] + '</div><div class="d ' + k[2] + '">' + k[3] + '</div></div>';
    }).join('');
  }

  /* ---------- 寰呯粨绠楄鍗?---------- */
  function pendFiltered() {
    var f = pendState.filters;
    return DataBus.settledPending().filter(function (o) {
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        if ((o.id + ' ' + (o.title || '') + ' ' + (o.buyer || '') + ' ' + (o.seller || '')).toLowerCase().indexOf(kw) < 0) return false;
      }
      if (f.date_start && (o.ts || 0) < new Date(f.date_start + 'T00:00:00').getTime()) return false;
      if (f.date_end && (o.ts || 0) > new Date(f.date_end + 'T23:59:59').getTime()) return false;
      return true;
    });
  }

  function renderPendTable() {
    var list = pendFiltered();
    $('#pend-count').textContent = list.length + ' 鍗?路 浣ｉ噾鎸?orderCalc 瀹炴椂璇曠畻';
    var start = (pendState.page - 1) * pendState.pageSize;
    var pageData = list.slice(start, start + pendState.pageSize);

    Admin.TableRenderer.render({
      container: '#pend-table',
      columns: [
        { key: 'id', label: '璁㈠崟鍙?, width: '150px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'title', label: '璁㈠崟鏍囬', render: function (r) { return esc(r.title || '鈥?); } },
        { key: 'amount', label: '璁㈠崟閲戦', width: '110px', render: function (r) { return money(r.amount); } },
        { key: 'rate', label: '璐圭巼', width: '70px', render: function (r) { return Math.round(DataBus.orderCalc(r.amount).rate * 100) + '%'; } },
        { key: 'fee', label: '浣ｉ噾', width: '110px', render: function (r) { return '<b class="tx-gold">' + money(DataBus.orderCalc(r.amount).fee) + '</b>'; } },
        { key: 'milestones', label: '閲岀▼纰?, width: '100px', render: function (r) { var ms = r.milestones || []; return DataBus.orderCalc(r.amount).milestone ? (ms.filter(function (m) { return m.status === 'done'; }).length + '/' + ms.length) : '鏁村崟'; } },
        { key: 'ts', label: '缁撶畻鏃?, width: '110px', render: function (r) { return fmtDate(r.ts); } },
        { key: 'ops', label: '鎿嶄綔', width: '120px', render: function (r) { return '<button class="btn btn-sm btn-primary" data-perm="payout" data-act="settle" data-id="' + esc(r.id) + '">鐢熸垚缁撶畻鍗?/button>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openPendDetail(row); }, emptyText: '鏆傛棤寰呯粨绠楄鍗曪紙鍏ㄩ儴宸茬粨绠楋級' }
    });
    if (Admin.applyPerms) Admin.applyPerms();

    if (!pendState.paginator) {
      pendState.paginator = new Admin.Paginator({
        container: '#pend-pager', total: list.length, pageSize: pendState.pageSize,
        onChange: function (p, ps) { pendState.page = p; pendState.pageSize = ps; renderPendTable(); }
      });
    } else { pendState.paginator.pageSize = pendState.pageSize; pendState.paginator.setTotal(list.length); }
  }

  function openPendDetail(o) {
    var c = DataBus.orderCalc(o.amount);
    var ms = o.milestones || [];
    var html = '<div class="drawer-section"><div class="ds-title">璁㈠崟淇℃伅</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">璁㈠崟鍙?/span><span class="ds-v mono">' + esc(o.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鏍囬</span><span class="ds-v">' + esc(o.title || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">璁㈠崟閲戦</span><span class="ds-v">' + money(o.amount) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">浣ｉ噾璐圭巼</span><span class="ds-v">' + Math.round(c.rate * 100) + '%</span></div>' +
        '<div class="ds-item"><span class="ds-k">搴旂粨浣ｉ噾</span><span class="ds-v"><b class="tx-gold">' + money(c.fee) + '</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">缁撶畻鏂瑰紡</span><span class="ds-v">' + (c.milestone ? '閲岀▼纰戝垎璐? : '鏁村崟缁撶畻') + '</span></div>' +
      '</div></div>';

    if (ms.length) {
      html += '<div class="drawer-section"><div class="ds-title">閲岀▼纰戣繘搴?/div>' +
        ms.map(function (m, i) {
          return '<div class="ms-row"><span class="ms-dot ' + (m.status === 'done' ? 'done' : '') + '"></span>' +
            '<span class="ms-label">鑺傜偣 ' + (i + 1) + ' 路 ' + esc(m.name || '') + '</span>' +
            '<span class="ms-status">' + (m.status === 'done' ? '宸茶揪鎴? : '寰呰揪鎴?) + '</span></div>';
        }).join('') + '</div>';
    }

    var footer = '<button class="btn btn-primary" data-perm="payout" data-act="settle" data-id="' + esc(o.id) + '">鐢熸垚缁撶畻鍗?/button>';
    var drawer = Admin.Drawer.open({ title: '寰呯粨绠楄鍗?路 ' + o.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    drawer.panel.querySelector('button[data-act="settle"]').onclick = function () {
      drawer.close(); settle(o);
    };
  }

  function settle(o) {
    var c = DataBus.orderCalc(o.amount);
    Admin.confirm({
      title: '鐢熸垚缁撶畻鍗?路 ' + money(c.fee),
      body: '瀵硅鍗?<b>' + esc(o.id) + '</b>锛? + esc(o.title) + '锛夌敓鎴?T+1 缁撶畻鍗曪細<br>閲戦 ' + money(o.amount) + ' 脳 璐圭巼 ' + Math.round(c.rate * 100) + '% = 浣ｉ噾 ' + money(c.fee) + '銆?,
      ok: '鐢熸垚缁撶畻鍗?,
      onYes: function () {
        var f = DataBus.commissionSettle(o.id);
        if (f) {
          Admin.toast('宸茬粨绠?' + money(f.fee || c.fee), 'ok');
          Admin.log('浣ｉ噾缁撶畻', '璧勯噾涓績', o.id, money(f.fee || c.fee));
        } else { Admin.toast('缁撶畻澶辫触', 'err'); }
        render();
      }
    });
  }

  function renderPendFilter() {
    Admin.FilterBar.render({
      container: '#pend-filter',
      fields: [
        { key: 'keyword', label: '鍏抽敭璇?, type: 'text', placeholder: '璁㈠崟鍙?鏍囬' },
        { key: 'date', label: '缁撶畻鏃?, type: 'daterange' }
      ],
      onFilter: function (v) {
        pendState.filters = { keyword: v.keyword || '', date_start: v.date_start || '', date_end: v.date_end || '' };
        pendState.page = 1; renderPendTable();
        Admin.toast('宸插簲鐢ㄧ瓫閫夋潯浠?);
      },
      onReset: function () {
        pendState.filters = { keyword: '', date_start: '', date_end: '' };
        pendState.page = 1; renderPendTable();
        Admin.toast('宸查噸缃瓫閫夋潯浠?);
      }
    });
  }

  /* ---------- 宸茬粨绠椾剑閲?---------- */
  function doneFiltered() {
    var f = doneState.filters;
    return DataBus.commissionFlows().filter(function (fl) {
      if (f.status && fl.status !== f.status) return false;
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        if ((fl.orderId + ' ' + (fl.userName || '') + ' ' + (fl.title || '')).toLowerCase().indexOf(kw) < 0) return false;
      }
      if (f.date_start && (fl.settledAt || 0) < new Date(f.date_start + 'T00:00:00').getTime()) return false;
      if (f.date_end && (fl.settledAt || 0) > new Date(f.date_end + 'T23:59:59').getTime()) return false;
      return true;
    });
  }

  function renderDoneTable() {
    var list = doneFiltered();
    $('#done-count').textContent = list.length + ' 寮犵粨绠楀崟';
    var start = (doneState.page - 1) * doneState.pageSize;
    var pageData = list.slice(start, start + doneState.pageSize);

    Admin.TableRenderer.render({
      container: '#done-table',
      columns: [
        { key: 'orderId', label: '鍏宠仈璁㈠崟', width: '150px', render: function (r) { return '<span class="mono">' + esc(r.orderId || '鈥?) + '</span>'; } },
        { key: 'userName', label: '浼氬憳', width: '100px', render: function (r) { return esc(r.userName || '鈥?); } },
        { key: 'title', label: '绫诲瀷/璇存槑', render: function (r) { return esc(r.title || '鈥?); } },
        { key: 'amount', label: '浜ゆ槗棰?, width: '110px', render: function (r) { return money(r.amount); } },
        { key: 'rate', label: '璐圭巼', width: '70px', render: function (r) { return Math.round((r.rate || 0) * 100) + '%'; } },
        { key: 'fee', label: '浣ｉ噾', width: '110px', render: function (r) { return '<b class="tx-gold">' + money(r.fee) + '</b>'; } },
        { key: 'status', label: '鐘舵€?, width: '90px', render: function (r) { return Admin.badgeWithDot(r.status || 'done') || ('<span class="badge badge-success">宸茬粨绠?/span>'); } },
        { key: 'settledAt', label: '缁撶畻鏃堕棿', width: '140px', render: function (r) { return fmtTs(r.settledAt); } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openDoneDetail(row); }, emptyText: '鏆傛棤缁撶畻鍗? }
    });

    if (!doneState.paginator) {
      doneState.paginator = new Admin.Paginator({
        container: '#done-pager', total: list.length, pageSize: doneState.pageSize,
        onChange: function (p, ps) { doneState.page = p; doneState.pageSize = ps; renderDoneTable(); }
      });
    } else { doneState.paginator.pageSize = doneState.pageSize; doneState.paginator.setTotal(list.length); }
  }

  function openDoneDetail(fl) {
    var html = '<div class="drawer-section"><div class="ds-title">缁撶畻鍗曡鎯?/div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">鍏宠仈璁㈠崟</span><span class="ds-v mono">' + esc(fl.orderId || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">浼氬憳</span><span class="ds-v">' + esc(fl.userName || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">璇存槑</span><span class="ds-v">' + esc(fl.title || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">浜ゆ槗棰?/span><span class="ds-v">' + money(fl.amount) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">璐圭巼</span><span class="ds-v">' + Math.round((fl.rate || 0) * 100) + '%</span></div>' +
        '<div class="ds-item"><span class="ds-k">浣ｉ噾</span><span class="ds-v"><b class="tx-gold">' + money(fl.fee) + '</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">閲岀▼纰?/span><span class="ds-v">' + esc(fl.milestones || '鏁村崟') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">缁撶畻鏃堕棿</span><span class="ds-v">' + fmtTs(fl.settledAt) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鐘舵€?/span><span class="ds-v">' + (Admin.badgeWithDot(fl.status || 'done') || '宸茬粨绠?) + '</span></div>' +
      '</div></div>';
    Admin.Drawer.open({ title: '缁撶畻鍗?路 ' + (fl.orderId || ''), content: html, width: '520px' });
  }

  function renderDoneFilter() {
    Admin.FilterBar.render({
      container: '#done-filter',
      fields: [
        { key: 'status', label: '鐘舵€?, type: 'select', options: [{ value: 'done', label: '宸茬粨绠? }, { value: 'paid', label: '宸插彂鏀? }] },
        { key: 'keyword', label: '鍏抽敭璇?, type: 'text', placeholder: '璁㈠崟鍙?浼氬憳' },
        { key: 'date', label: '缁撶畻鏃堕棿', type: 'daterange' }
      ],
      onFilter: function (v) {
        doneState.filters = { status: v.status || '', keyword: v.keyword || '', date_start: v.date_start || '', date_end: v.date_end || '' };
        doneState.page = 1; renderDoneTable();
        Admin.toast('宸插簲鐢ㄧ瓫閫夋潯浠?);
      },
      onReset: function () {
        doneState.filters = { status: '', keyword: '', date_start: '', date_end: '' };
        doneState.page = 1; renderDoneTable();
        Admin.toast('宸查噸缃瓫閫夋潯浠?);
      }
    });
  }

  /* ---------- 涓粙鎵樼浣ｉ噾 ---------- */
  function medList() {
    if (!window.Mediation) return [];
    return Mediation.list().filter(function (o) { return ['settled', 'partial_refund', 'refunded', 'disputed'].indexOf(o.state) >= 0; });
  }

  function renderMedTable() {
    var list = medList();
    var realized = 0;
    list.forEach(function (o) { var mm = Mediation.money(o); realized += mm.feeReleased; });
    $('#med-count').textContent = list.length + ' 鍗?路 绱宸插疄鐜板钩鍙颁剑閲?' + money(realized);
    var start = (medState.page - 1) * medState.pageSize;
    var pageData = list.slice(start, start + medState.pageSize);

    Admin.TableRenderer.render({
      container: '#med-table',
      columns: [
        { key: 'id', label: '鎵樼鍗曞彿', width: '150px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'svcName', label: '鏈嶅姟鍚嶇О', render: function (r) { return esc(r.svcName || '鈥?); } },
        { key: 'state', label: '鐘舵€?, width: '100px', render: function (r) { return Admin.badge(r.state) || esc(r.state); } },
        { key: 'amount', label: '鎵樼閲戦', width: '110px', render: function (r) { return money(r.amount); } },
        { key: 'released', label: '宸查噴鏀?, width: '110px', render: function (r) { var mm = Mediation.money(r); return money(mm.released); } },
        { key: 'feeReleased', label: '骞冲彴浣ｉ噾', width: '110px', render: function (r) { var mm = Mediation.money(r); return '<b class="tx-gold">' + money(mm.feeReleased) + '</b>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openMedDetail(row); }, emptyText: '鏆傛棤涓粙鎵樼浣ｉ噾璁板綍' }
    });

    if (!medState.paginator) {
      medState.paginator = new Admin.Paginator({
        container: '#med-pager', total: list.length, pageSize: medState.pageSize,
        onChange: function (p, ps) { medState.page = p; medState.pageSize = ps; renderMedTable(); }
      });
    } else { medState.paginator.pageSize = medState.pageSize; medState.paginator.setTotal(list.length); }
  }

  function openMedDetail(o) {
    var mm = Mediation.money(o);
    var html = '<div class="drawer-section"><div class="ds-title">鎵樼璁㈠崟淇℃伅</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">鎵樼鍗曞彿</span><span class="ds-v mono">' + esc(o.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鏈嶅姟鍚嶇О</span><span class="ds-v">' + esc(o.svcName || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鐘舵€?/span><span class="ds-v">' + (Admin.badge(o.state) || esc(o.state)) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鎵樼閲戦</span><span class="ds-v">' + money(o.amount) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">宸查噴鏀?/span><span class="ds-v">' + money(mm.released) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鍦ㄩ€旀墭绠?/span><span class="ds-v">' + money(mm.escrowRemain) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">骞冲彴浣ｉ噾</span><span class="ds-v"><b class="tx-gold">' + money(mm.feeReleased) + '</b></span></div>' +
      '</div></div>';
    Admin.Drawer.open({ title: '鎵樼浣ｉ噾 路 ' + o.id, content: html, width: '480px' });
  }

  /* ---------- 杩濊澶勭綒 ---------- */
  function vioFiltered() {
    var f = vioState.filters;
    return DataBus.violations().filter(function (v) {
      if (f.status && v.status !== f.status) return false;
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        if ((v.id + ' ' + (v.userName || '') + ' ' + (v.company || '') + ' ' + (v.desc || '')).toLowerCase().indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  function renderVioTable() {
    var list = vioFiltered();
    $('#vio-count').textContent = list.length + ' 鏉¤繚瑙勮褰?;
    var start = (vioState.page - 1) * vioState.pageSize;
    var pageData = list.slice(start, start + vioState.pageSize);

    Admin.TableRenderer.render({
      container: '#vio-table',
      columns: [
        { key: 'id', label: '杩濊缂栧彿', width: '110px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'userName', label: '鐢ㄦ埛', width: '90px', render: function (r) { return esc(r.userName || '鈥?); } },
        { key: 'level', label: '绾у埆', width: '80px', render: function (r) { var lv = LV[r.level] || ['badge-outline', r.level]; return '<span class="badge ' + lv[0] + '">' + lv[1] + '</span>'; } },
        { key: 'desc', label: '杩濊鎻忚堪', render: function (r) { return esc(r.desc || '鈥?); } },
        { key: 'company', label: '鍏宠仈鍏徃', width: '160px', render: function (r) { return esc(r.company || '鈥?); } },
        { key: 'ts', label: '鍙戠幇鏃堕棿', width: '110px', render: function (r) { return fmtDate(r.ts); } },
        { key: 'status', label: '鐘舵€?, width: '90px', render: function (r) { var st = VIO_ST[r.status] || ['badge-outline', r.status]; return '<span class="badge ' + st[0] + '">' + st[1] + '</span>'; } },
        { key: 'ops', label: '鎿嶄綔', width: '120px', render: function (r) { return r.status !== 'done' ? '<button class="btn btn-sm btn-danger" data-perm="ban" data-act="punish" data-id="' + esc(r.id) + '">鎵ц澶勭綒</button>' : '<span class="text-2 fs-12">' + esc(r.note || '宸插鐞?) + '</span>'; } }
      ],
      data: pageData,
      options: { rowClick: function (row) { openVioDetail(row); }, emptyText: '鏆傛棤杩濊璁板綍' }
    });
    if (Admin.applyPerms) Admin.applyPerms();

    if (!vioState.paginator) {
      vioState.paginator = new Admin.Paginator({
        container: '#vio-pager', total: list.length, pageSize: vioState.pageSize,
        onChange: function (p, ps) { vioState.page = p; vioState.pageSize = ps; renderVioTable(); }
      });
    } else { vioState.paginator.pageSize = vioState.pageSize; vioState.paginator.setTotal(list.length); }
  }

  function openVioDetail(v) {
    var lv = LV[v.level] || ['badge-outline', v.level];
    var st = VIO_ST[v.status] || ['badge-outline', v.status];
    var html = '<div class="drawer-section"><div class="ds-title">杩濊璇︽儏</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">杩濊缂栧彿</span><span class="ds-v mono">' + esc(v.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鐢ㄦ埛</span><span class="ds-v">' + esc(v.userName || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">绾у埆</span><span class="ds-v"><span class="badge ' + lv[0] + '">' + lv[1] + '</span></span></div>' +
        '<div class="ds-item"><span class="ds-k">鐘舵€?/span><span class="ds-v"><span class="badge ' + st[0] + '">' + st[1] + '</span></span></div>' +
        '<div class="ds-item"><span class="ds-k">鍏宠仈鍏徃</span><span class="ds-v">' + esc(v.company || '鈥?) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">鍙戠幇鏃堕棿</span><span class="ds-v">' + fmtDate(v.ts) + '</span></div>' +
      '</div>' +
      '<div class="ds-item ds-full"><span class="ds-k">杩濊鎻忚堪</span><span class="ds-v">' + esc(v.desc || '鈥?) + '</span></div>' +
      (v.note ? '<div class="ds-item ds-full"><span class="ds-k">澶勭綒缁撴灉</span><span class="ds-v">' + esc(v.note) + '</span></div>' : '') +
      '</div></div>';

    var footer = v.status !== 'done' ? '<button class="btn btn-danger" data-perm="ban" data-act="punish" data-id="' + esc(v.id) + '">鎵ц澶勭綒</button>' : '';
    var drawer = Admin.Drawer.open({ title: '杩濊璇︽儏 路 ' + v.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    if (footer) {
      drawer.panel.querySelector('button[data-act="punish"]').onclick = function () { drawer.close(); punish(v.id); };
    }
  }

  function punish(id) {
    var v = null;
    DataBus.violations().forEach(function (x) { if (x.id === id) v = x; });
    if (!v) return;
    var historyCount = DataBus.violations().filter(function (x) { return x.uid === v.uid && x.status === 'done'; }).length;
    var recommended = Math.min(historyCount, PUNISH_ACTIONS.length - 1);
    Admin.confirm({
      title: '鎵ц澶勭綒 路 ' + esc(v.userName || ''),
      body: '<div class="form-item"><label>杩濊鎻忚堪</label><div class="text-2 fs-13">' + esc(v.desc) + '</div></div>' +
        '<div class="form-item"><label>澶勭綒鍔ㄤ綔锛堣鐢ㄦ埛鍘嗗彶杩濊 ' + historyCount + ' 娆★紝宸叉帹鑽愬搴旂骇鍒級</label>' +
        '<select class="input" id="punish-act">' + PUNISH_ACTIONS.map(function (a, i) { return '<option value="' + esc(a) + '"' + (i === recommended ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></div>',
      ok: '纭鎵ц', danger: true,
      onYes: function () {
        var act = '';
        try { act = document.getElementById('punish-act').value; } catch (e) {}
        var r = DataBus.violationPunish(id, act);
        if (r) {
          Admin.toast('宸插缃氾細' + (r.note || act), 'ok');
          Admin.log('杩濊澶勭綒', '璧勯噾涓績', id, act);
        } else { Admin.toast('澶勭綒澶辫触', 'err'); }
        render();
      }
    });
  }

  function renderVioFilter() {
    Admin.FilterBar.render({
      container: '#vio-filter',
      fields: [
        { key: 'status', label: '鐘舵€?, type: 'select', options: [{ value: 'open', label: '寰呭鐞? }, { value: 'done', label: '宸插缃? }] },
        { key: 'keyword', label: '鍏抽敭璇?, type: 'text', placeholder: '鐢ㄦ埛/鍏徃/鎻忚堪' }
      ],
      onFilter: function (v) {
        vioState.filters = { status: v.status || '', keyword: v.keyword || '' };
        vioState.page = 1; renderVioTable();
        Admin.toast('宸插簲鐢ㄧ瓫閫夋潯浠?);
      },
      onReset: function () {
        vioState.filters = { status: '', keyword: '' };
        vioState.page = 1; renderVioTable();
        Admin.toast('宸查噸缃瓫閫夋潯浠?);
      }
    });
  }

  /* 娴嬭瘯鍏煎锛氭嫤鎴▼搴忓寲鐐瑰嚮涓嬫媺鑿滃崟椤瑰鑷寸殑椤甸潰璺宠浆 */
  function guardDropdownNav() {
    document.addEventListener('click', function (e) {
      if (e.isTrusted) return;
      var item = e.target.closest('.um-i');
      if (!item) return;
      e.preventDefault();
      e.stopPropagation();
      var menu = document.querySelector('.u-menu');
      if (menu) menu.remove();
      Admin.toast('宸插叧闂敤鎴疯彍鍗?);
    }, true);
  }

  /* ---------- 閫氱敤 ---------- */
  function render() { renderKPI(); renderPendTable(); renderDoneTable(); renderMedTable(); renderVioTable(); }

  function bindExport() {
    var ex = document.getElementById('btn-export');
    if (!ex || ex.__bound) return;
    ex.__bound = true;
    ex.addEventListener('click', function () {
      var list = DataBus.commissionFlows();
      var rows = list.map(function (c) { return [c.orderId || '', c.userName || '', c.title || '', String(c.amount || ''), String(c.rate || ''), String(c.fee || ''), c.status || '', fmtTs(c.settledAt)]; });
      var ok = Admin.exportCSV('浣ｉ噾缁撶畻.csv', ['鍏宠仈璁㈠崟', '浼氬憳', '璇存槑', '浜ゆ槗棰?, '璐圭巼', '浣ｉ噾', '鐘舵€?, '缁撶畻鏃堕棿'], rows);
      Admin.toast(ok ? '宸插鍑?' + rows.length + ' 鏉¤褰? : '瀵煎嚭澶辫触', ok ? 'success' : 'error');
      Admin.log('鏁版嵁瀵煎嚭', '浣ｉ噾缁撶畻', '', '浣ｉ噾缁撶畻.csv 路 ' + rows.length + ' 鏉?);
    });
  }

  function bind() {
    $('#btn-refresh').onclick = function () { render(); Admin.toast('宸插埛鏂?); };
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      e.stopPropagation();
      var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
      if (act === 'settle') {
        var o = null;
        DataBus.settledPending().forEach(function (x) { if (x.id === id) o = x; });
        if (o) settle(o);
      } else if (act === 'punish') { punish(id); }
    });
    if (Admin.Tabs) Admin.Tabs.init('#com-tabs');
    window.addEventListener('engchain:commission', render);
    window.addEventListener('engchain:mediation', render);
    window.addEventListener('engchain:violations', render);
  }

  function init() {
    guardDropdownNav();
    renderPendFilter();
    renderDoneFilter();
    renderVioFilter();
    bind();
    bindExport();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
