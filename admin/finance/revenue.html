<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收入看板 · 工程链管理后台</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="finance/revenue.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>收入看板</h1>
        <div class="sub">资金中心 · 平台收入结构与趋势（RevenueStore）· 含认证 / 入驻 / 解锁 / 积分 / 佣金 / 增值 / API</div>
      </div>
      <button class="btn btn-outline" id="btn-refresh">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        刷新
      </button>
    </div>

    <!-- 总收入 KPI -->
    <div class="kpis" id="kpi"></div>

    <!-- 各收入流卡片 -->
    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">各收入流明细</span>
        <span class="card-s">按收入类型拆分累计金额与占比</span>
      </div>
      <div class="stream-grid" id="stream-grid"></div>
    </div>

    <!-- 收入结构占比 -->
    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">收入结构占比</span>
        <span class="card-s">各收入类型占总收入比例</span>
      </div>
      <div id="pie-chart"></div>
    </div>

    <!-- 月度趋势 -->
    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">近 6 个月收入趋势</span>
        <span class="card-s">按月汇总平台总收入</span>
      </div>
      <div class="bars" id="trend-chart"></div>
    </div>

    <!-- 路线图 -->
    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">收入结构规划路线图</span>
        <span class="card-s">分阶段重点收入流与目标占比</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>阶段</th><th>时间</th><th>重点收入流</th><th>目标占比</th></tr></thead>
          <tbody>
            <tr><td><span class="badge badge-info">P1 短期</span></td><td>1-3 月</td><td>R1 认证费 / R2 入驻费</td><td>60%+</td></tr>
            <tr><td><span class="badge badge-warning">P2 中期</span></td><td>3-6 月</td><td>R3 解锁 / R4 积分 / R5 佣金</td><td>50%+</td></tr>
            <tr><td><span class="badge badge-success">P3 长期</span></td><td>6-12 月</td><td>R6 增值 / R7 API</td><td>30%+</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/stores.js"></script>
<script src="../../js/databus.js"></script>
<script>
(function(){
  var money = Admin.fmt || function(n){ return '¥' + Number(n||0).toLocaleString(); };
  var data = RevenueStore.generate();
  var streams = RevenueStore.byStream();
  var trend = RevenueStore.trend();
  var colors = ['var(--primary)','var(--info)','var(--success)','var(--warning)','var(--gold)','var(--danger)','var(--muted-foreground)','var(--border)'];

  /* KPI 卡：总收入 + 各流数量 */
  document.getElementById('kpi').innerHTML = [
    { label: '平台累计总收入', v: money(data.total||0), d: '含 7 类收入流', cls: 'up' },
    { label: '收入流数量', v: streams.length, d: '认证/入驻/解锁/积分/佣金/增值/API', cls: 'info' },
    { label: '月度均值', v: money(trend.length ? trend.reduce(function(s,t){return s+t.total;},0)/trend.length : 0), d: '近 6 个月平均', cls: 'warn' },
    { label: '月度峰值', v: money(trend.length ? Math.max.apply(null, trend.map(function(t){return t.total;})) : 0), d: '近 6 个月最高月', cls: 'gold' }
  ].map(function(k){
    return '<div class="kpi"><div class="k">'+k.label+'</div><div class="v num">'+k.v+'</div><div class="d '+k.cls+'">'+k.d+'</div></div>';
  }).join('');

  /* 收入流卡片：grid 4 列 */
  document.getElementById('stream-grid').innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">' +
    streams.map(function(s,i){
      return '<div style="background:var(--muted);border-radius:var(--radius-md);padding:14px;">' +
        '<div style="font-size:12px;color:var(--muted-foreground);">'+s.label+'</div>' +
        '<div style="font-size:20px;font-weight:700;margin:6px 0;color:var(--foreground);" class="num">¥'+Number(s.amount||0).toLocaleString()+'</div>' +
        '<div style="font-size:11px;color:var(--muted-foreground);">占比 '+s.pct+'%</div>' +
        '</div>';
    }).join('') + '</div>';

  /* 收入结构占比（条形图） */
  document.getElementById('pie-chart').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:10px;">' +
    streams.map(function(s,i){
      var color = colors[i % colors.length];
      return '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div style="width:80px;font-size:13px;color:var(--foreground);">'+s.label+'</div>' +
        '<div style="flex:1;height:20px;background:var(--muted);border-radius:var(--radius-sm);overflow:hidden;">' +
        '<div style="height:100%;width:'+Math.max(s.pct,1)+'%;background:'+color+';border-radius:var(--radius-sm);transition:width var(--duration-normal) var(--ease-out);"></div>' +
        '</div>' +
        '<div style="width:50px;text-align:right;font-size:13px;font-weight:600;" class="num">'+s.pct+'%</div>' +
        '</div>';
    }).join('') + '</div>';

  /* 月度趋势柱状图 */
  var maxAmt = trend.length ? Math.max.apply(null, trend.map(function(t){return t.total;})) : 1;
  document.getElementById('trend-chart').innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:16px;height:160px;padding:0 8px;">' +
    trend.map(function(t){
      var h = Math.round((t.total/maxAmt)*130);
      return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;">' +
        '<div style="font-size:12px;font-weight:600;margin-bottom:4px;" class="num">'+(t.total/10000).toFixed(1)+'万</div>' +
        '<div style="width:100%;max-width:36px;height:130px;display:flex;align-items:flex-end;">' +
        '<div style="width:100%;height:'+h+'px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--primary);animation:col-rise var(--duration-normal) var(--ease-out) backwards;"></div>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--muted-foreground);margin-top:6px;">'+t.month+'</div>' +
        '</div>';
    }).join('') + '</div>';

  /* 刷新按钮 */
  document.getElementById('btn-refresh').onclick = function(){
    Admin.toast('收入数据已刷新', 'ok');
  };
})();
</script>
</body>
</html>
