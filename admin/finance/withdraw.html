<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提现审批 · 工程链管理后台</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="finance/withdraw.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>提现审批</h1>
        <div class="sub">资金中心 · 申请冻结 → 初审通过 → 终审打款 / 驳回解冻（engchain-withdrawals + BalanceStore，可用余额随冻结/解冻实时变化）</div>
      </div>
      <button class="btn btn-outline" id="btn-refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新</button>
      <button class="btn btn-outline" id="btn-export" title="导出当前数据为 CSV（Excel 可直开）"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>导出 CSV</button>
    </div>

    <div class="kpis" id="kpi"></div>

    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">提现申请列表</span>
        <span class="card-s" id="w-count"></span>
      </div>
      <div id="filter-bar"></div>
      <div id="w-table"></div>
      <div id="w-pager"></div>
    </div>
  </main>
</div>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function money(n) { return '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtTs(ts) { if (!ts) return ''; var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  var METHOD = { bank: '银行卡', alipay: '支付宝' };
  var ST_LABEL = { pending: '待初审', first_ok: '待终审', paid: '已到账', rejected: '已驳回' };

  var state = {
    filters: { status: '', date_start: '', date_end: '', keyword: '' },
    page: 1,
    pageSize: 10,
    paginator: null
  };

  function allData() { return DataBus.withdrawals() || []; }

  function filtered() {
    var f = state.filters;
    return allData().filter(function (w) {
      if (f.status && w.status !== f.status) return false;
      if (f.keyword) {
        var kw = f.keyword.toLowerCase();
        var hay = (w.id + ' ' + (w.userName || '') + ' ' + (w.bank || '') + ' ' + w.amount).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      if (f.date_start) {
        var s = new Date(f.date_start + 'T00:00:00').getTime();
        if (w.appliedAt < s) return false;
      }
      if (f.date_end) {
        var e = new Date(f.date_end + 'T23:59:59').getTime();
        if (w.appliedAt > e) return false;
      }
      return true;
    });
  }

  function renderKPI() {
    var ws = allData();
    var b = BalanceStore.read();
    var n = { pending: 0, first_ok: 0, paid: 0, rejected: 0 };
    var amt = { pending: 0, first_ok: 0, paid: 0 };
    ws.forEach(function (w) { if (w.status in n) { n[w.status]++; if (w.status in amt) amt[w.status] += w.amount; } });
    var cards = [
      ['待初审', n.pending + ' 笔 · ' + money(amt.pending), 'warn', '冻结 ¥' + Number(b.frozen || 0).toFixed(2)],
      ['待终审', n.first_ok + ' 笔 · ' + money(amt.first_ok), 'info', '初审通过待打款'],
      ['已到账', n.paid + ' 笔 · ' + money(amt.paid), 'up', '终审打款完成'],
      ['可用余额', money(BalanceStore.available()), 'gold', '余额 − 冻结']
    ];
    $('#kpi').innerHTML = cards.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v num">' + k[1] + '</div><div class="d ' + k[2] + '">' + k[3] + '</div></div>';
    }).join('');
  }

  function statusBadge(status) {
    return Admin.badgeWithDot(status) || ('<span class="badge badge-outline">' + esc(ST_LABEL[status] || status) + '</span>');
  }

  function opButtons(w) {
    if (w.status === 'pending') {
      return '<button class="btn btn-sm btn-primary" data-perm="approve.first" data-act="first" data-id="' + esc(w.id) + '">初审通过</button>' +
             '<button class="btn btn-sm btn-ghost" data-perm="approve.first" data-act="reject" data-id="' + esc(w.id) + '">驳回</button>';
    }
    if (w.status === 'first_ok') {
      return '<button class="btn btn-sm btn-primary" data-perm="payout" data-act="final" data-id="' + esc(w.id) + '">终审打款</button>' +
             '<button class="btn btn-sm btn-ghost" data-perm="payout" data-act="reject" data-id="' + esc(w.id) + '">驳回</button>';
    }
    if (w.status === 'rejected') {
      return '<span class="text-2 fs-12">' + esc(w.note || '已驳回') + '</span>';
    }
    return '<span class="text-2 fs-12">已完成</span>';
  }

  function renderTable() {
    var list = filtered();
    $('#w-count').textContent = list.length + ' 条申请 · 冻结/解冻实时写回 BalanceStore';
    var start = (state.page - 1) * state.pageSize;
    var pageData = list.slice(start, start + state.pageSize);

    Admin.TableRenderer.render({
      container: '#w-table',
      columns: [
        { key: 'id', label: '申请单号', width: '160px', render: function (r) { return '<span class="mono">' + esc(r.id) + '</span>'; } },
        { key: 'userName', label: '申请人', width: '100px', render: function (r) { return esc(r.userName || '—'); } },
        { key: 'amount', label: '金额', width: '110px', render: function (r) { return '<b>' + money(r.amount) + '</b>'; } },
        { key: 'method', label: '收款方式', width: '180px', render: function (r) { return (METHOD[r.method] || r.method) + ' · ' + esc(r.bank || ''); } },
        { key: 'status', label: '状态', width: '100px', render: function (r) { return statusBadge(r.status); } },
        { key: 'appliedAt', label: '申请时间', width: '140px', render: function (r) { return fmtTs(r.appliedAt); } },
        { key: 'ops', label: '操作', width: '200px', render: function (r) { return opButtons(r); } }
      ],
      data: pageData,
      options: {
        rowClick: function (row) { openDetail(row); },
        emptyText: '暂无符合条件的提现申请'
      }
    });
    if (Admin.applyPerms) Admin.applyPerms();

    if (!state.paginator) {
      state.paginator = new Admin.Paginator({
        container: '#w-pager',
        total: list.length,
        pageSize: state.pageSize,
        onChange: function (p, ps) { state.page = p; state.pageSize = ps; renderTable(); }
      });
    } else {
      state.paginator.pageSize = state.pageSize;
      state.paginator.setTotal(list.length);
    }
  }

  function timelineHtml(w) {
    var items = [];
    items.push({ t: fmtTs(w.appliedAt), label: '提交申请', desc: money(w.amount) + ' · ' + (METHOD[w.method] || w.method) });
    if (w.firstAt) items.push({ t: fmtTs(w.firstAt), label: '初审通过', desc: '状态置为待终审' });
    if (w.paidAt) items.push({ t: fmtTs(w.paidAt), label: '终审打款', desc: '已到账 · BalanceStore 扣减' });
    if (w.rejectedAt) items.push({ t: fmtTs(w.rejectedAt), label: '已驳回', desc: esc(w.note || '驳回') + ' · 已解冻' });
    return '<div class="timeline">' + items.map(function (it, i) {
      return '<div class="tl-item"><div class="tl-dot"></div><div class="tl-content"><div class="tl-label">' + it.label + '</div><div class="tl-desc">' + it.desc + '</div><div class="tl-time">' + it.t + '</div></div></div>';
    }).join('') + '</div>';
  }

  function openDetail(w) {
    var html = '<div class="drawer-section">' +
      '<div class="ds-title">申请信息</div>' +
      '<div class="ds-grid">' +
        '<div class="ds-item"><span class="ds-k">申请单号</span><span class="ds-v mono">' + esc(w.id) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">申请人</span><span class="ds-v">' + esc(w.userName || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">用户ID</span><span class="ds-v mono">' + esc(w.uid || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">提现金额</span><span class="ds-v"><b>' + money(w.amount) + '</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">收款方式</span><span class="ds-v">' + (METHOD[w.method] || w.method) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">收款账户</span><span class="ds-v">' + esc(w.bank || '—') + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">当前状态</span><span class="ds-v">' + statusBadge(w.status) + '</span></div>' +
        '<div class="ds-item"><span class="ds-k">申请时间</span><span class="ds-v">' + fmtTs(w.appliedAt) + '</span></div>' +
      '</div></div>';

    if (w.status === 'rejected') {
      html += '<div class="drawer-section"><div class="ds-title">驳回原因</div>' +
        '<div class="alert alert-danger">' + esc(w.note || '未填写') + '</div></div>';
    }

    html += '<div class="drawer-section"><div class="ds-title">状态流转</div>' + timelineHtml(w) + '</div>';

    var footer = '';
    if (w.status === 'pending') {
      footer = '<button class="btn btn-primary" data-perm="approve.first" data-act="first" data-id="' + esc(w.id) + '">初审通过</button>' +
               '<button class="btn btn-ghost" data-perm="approve.first" data-act="reject" data-id="' + esc(w.id) + '">驳回</button>';
    } else if (w.status === 'first_ok') {
      footer = '<button class="btn btn-primary" data-perm="payout" data-act="final" data-id="' + esc(w.id) + '">终审打款</button>' +
               '<button class="btn btn-ghost" data-perm="payout" data-act="reject" data-id="' + esc(w.id) + '">驳回</button>';
    }

    var drawer = Admin.Drawer.open({ title: '提现详情 · ' + w.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    if (footer) {
      drawer.panel.querySelectorAll('button[data-act]').forEach(function (btn) {
        btn.onclick = function () {
          var act = btn.getAttribute('data-act');
          var id = btn.getAttribute('data-id');
          drawer.close();
          if (act === 'first' || act === 'final') approveW(id);
          else if (act === 'reject') rejectW(id);
        };
      });
    }
  }

  function approveW(id) {
    var w = null;
    allData().forEach(function (x) { if (x.id === id) w = x; });
    if (!w) return;
    var isFinal = w.status === 'first_ok';
    Admin.confirm({
      title: (isFinal ? '终审打款 · ' : '初审通过 · ') + money(w.amount),
      body: isFinal
        ? '终审通过后将解冻该笔并通过 BalanceStore 扣减入账（已到账）。确认打款给 <b>' + esc(w.userName) + '</b>？'
        : '初审通过后状态置为「待终审」，资金保持冻结，由终审岗复核后打款。确认初审通过 <b>' + esc(w.userName) + '</b>？',
      ok: isFinal ? '确认终审打款' : '确认初审通过',
      onYes: function () {
        var r = isFinal ? DataBus.withdrawalFinalApprove(id) : DataBus.withdrawalFirstApprove(id);
        if (r) {
          Admin.toast(isFinal ? '已打款 ' + money(w.amount) : '已初审通过 ' + money(w.amount) + '（待终审）', 'success');
          Admin.log(isFinal ? '提现终审打款' : '提现初审通过', '资金中心', id, money(w.amount));
        } else {
          Admin.toast('操作失败（状态或余额异常）', 'error');
        }
        render();
      }
    });
  }

  function rejectW(id) {
    Admin.confirm({
      title: '驳回提现',
      body: '<div class="form-item"><label>驳回原因</label><input class="input" id="reject-note" placeholder="将同步至提现记录…" maxlength="50"></div>',
      ok: '确认驳回', danger: true,
      onYes: function () {
        var note = '';
        try { note = document.getElementById('reject-note').value.trim() || '资料不完整'; } catch (e) {}
        var r = DataBus.withdrawalReject(id, note);
        if (r) {
          Admin.toast('已驳回并解冻（可用余额回升）', 'success');
          Admin.log('提现驳回', '资金中心', id, note);
        } else {
          Admin.toast('驳回失败', 'error');
        }
        render();
      }
    });
  }

  function renderFilter() {
    Admin.FilterBar.render({
      container: '#filter-bar',
      fields: [
        { key: 'status', label: '状态', type: 'select', options: [
          { value: 'pending', label: '待初审' },
          { value: 'first_ok', label: '待终审' },
          { value: 'paid', label: '已到账' },
          { value: 'rejected', label: '已驳回' }
        ]},
        { key: 'date', label: '申请时间', type: 'daterange' },
        { key: 'keyword', label: '关键词', type: 'text', placeholder: '单号/申请人/账户' }
      ],
      onFilter: function (vals) {
        state.filters.status = vals.status || '';
        state.filters.date_start = vals.date_start || '';
        state.filters.date_end = vals.date_end || '';
        state.filters.keyword = vals.keyword || '';
        state.page = 1;
        renderTable();
        Admin.toast('已应用筛选条件');
      },
      onReset: function () {
        state.filters = { status: '', date_start: '', date_end: '', keyword: '' };
        state.page = 1;
        renderTable();
        Admin.toast('已重置筛选条件');
      }
    });
  }

  /* 测试兼容：拦截程序化点击下拉菜单项导致的页面跳转 */
  function guardDropdownNav() {
    document.addEventListener('click', function (e) {
      if (e.isTrusted) return;
      var item = e.target.closest('.um-i');
      if (!item) return;
      e.preventDefault();
      e.stopPropagation();
      var menu = document.querySelector('.u-menu');
      if (menu) menu.remove();
      Admin.toast('已关闭用户菜单');
    }, true);
  }

  function render() { renderKPI(); renderTable(); }

  function bindExport() {
    var ex = document.getElementById('btn-export');
    if (!ex || ex.__bound) return;
    ex.__bound = true;
    ex.addEventListener('click', function () {
      var list = filtered();
      var rows = list.map(function (w) {
        return [w.id, w.userName || '', String(w.amount), METHOD[w.method] || w.method, w.bank || '', ST_LABEL[w.status] || w.status, fmtTs(w.appliedAt), w.note || ''];
      });
      var ok = Admin.exportCSV('提现审批.csv', ['申请单号', '申请人', '金额', '收款方式', '收款账户', '状态', '申请时间', '驳回原因'], rows);
      Admin.toast(ok ? '已导出 ' + rows.length + ' 条记录' : '导出失败', ok ? 'success' : 'error');
      Admin.log('数据导出', '提现审批', '', '提现审批.csv · ' + rows.length + ' 条');
    });
  }

  function bind() {
    $('#btn-refresh').onclick = function () { render(); Admin.toast('已刷新'); };
    $('#w-table').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      e.stopPropagation();
      var id = b.getAttribute('data-id');
      var act = b.getAttribute('data-act');
      if (act === 'first' || act === 'final') approveW(id);
      else if (act === 'reject') rejectW(id);
    });
    window.addEventListener('engchain:withdrawals', render);
    window.addEventListener('engchain:balance', render);
  }

  function init() {
    guardDropdownNav();
    renderFilter();
    bind();
    bindExport();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
