<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息中心 · 工程链管理后台</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="operations/messages.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>消息中心</h1>
        <div class="sub">运营中心 · 系统公告 / 消息发布（发布写回 DataBus，App 消息入口可监听同步）</div>
      </div>
      <button class="btn btn-primary" id="btn-publish">+ 发布新消息</button>
      <button class="btn btn-outline" id="btn-refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新</button>
      <button class="btn btn-outline" id="btn-export" title="导出当前筛选结果为 CSV"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>导出 CSV</button>
    </div>

    <div class="kpis" id="kpi"></div>

    <div class="card card-pad">
      <div id="filter-bar"></div>
      <div id="table-container"></div>
      <div id="pager-container"></div>
    </div>
  </main>
</div>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script>
(function () {
  'use strict';
  var MSG_KEY = 'engchain-messages';
  var READ_KEY = 'engchain-msg-read';
  var TYPES = ['公告', '系统', '活动', '风控'];
  var TARGETS = ['全部用户', '入驻企业', '认证企业', '中介企业', '个人认证'];
  var page = 1, pageSize = 10, fType = '', fRead = '', fQ = '', fDateStart = '', fDateEnd = '';
  var paginator = null, tableInst = null;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function fmtDate(ts) {
    if (!ts) return '';
    if (typeof ts === 'number') return new Date(ts).toISOString().slice(0, 10);
    return String(ts).slice(0, 10);
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  /* 已读状态本地追踪 */
  function getReadSet() {
    try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch (e) { return new Set(); }
  }
  function setRead(id) {
    var s = getReadSet(); s.add(id);
    try { localStorage.setItem(READ_KEY, JSON.stringify(Array.from(s))); } catch (e) {}
  }
  function isRead(id) { return getReadSet().has(id); }

  /* 消息列表（含本地删除） */
  function getDeletedSet() {
    try { return new Set(JSON.parse(localStorage.getItem('engchain-msg-deleted') || '[]')); } catch (e) { return new Set(); }
  }
  function list() {
    var deleted = getDeletedSet();
    var a = (window.DataBus && DataBus.messages) ? DataBus.messages() : [];
    return a.filter(function (m) { return !deleted.has(m.id); });
  }
  var _deleteLock = false;
  function deleteMessage(id) {
    /* 防重入：admin.js confirm doYes 对非 Promise onYes 双重调用，加锁屏蔽第二次（避免双重 toast） */
    if (_deleteLock) return;
    _deleteLock = true;
    var s = getDeletedSet(); s.add(id);
    try { localStorage.setItem('engchain-msg-deleted', JSON.stringify(Array.from(s))); } catch (e) {}
    window.dispatchEvent(new CustomEvent('engchain:messages', { detail: { id: id, action: 'delete' } }));
    setTimeout(function () { _deleteLock = false; }, 300);
  }

  function filtered() {
    var a = list(), q = fQ.trim().toLowerCase();
    return a.filter(function (m) {
      if (fType && m.type !== fType) return false;
      if (fRead === 'read' && !isRead(m.id)) return false;
      if (fRead === 'unread' && isRead(m.id)) return false;
      if (fDateStart && fmtDate(m.ts) < fDateStart) return false;
      if (fDateEnd && fmtDate(m.ts) > fDateEnd) return false;
      if (q && (m.id + m.title + m.body + m.target).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function msgTypeBadge(t) {
    var m = { '公告': 'badge-gold', '系统': 'badge-info', '活动': 'badge-success', '风控': 'badge-danger' };
    return '<span class="badge ' + (m[t] || 'badge-outline') + '">' + esc(t) + '</span>';
  }

  function renderKPI(all) {
    var today = todayStr();
    var todayCount = 0, unread = 0, announce = 0;
    all.forEach(function (m) {
      if (fmtDate(m.ts) === today) todayCount++;
      if (!isRead(m.id)) unread++;
      if (m.type === '公告') announce++;
    });
    var cards = [
      ['总消息', all.length, 'info', '全部类型合计'],
      ['今日发送', todayCount, 'up', '今日发布消息数'],
      ['未读', unread, 'warn', '管理员未查看'],
      ['系统公告', announce, 'gold', '公告类型消息']
    ];
    $('#kpi').innerHTML = cards.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v num">' + k[1] + '</div><div class="d ' + k[2] + '">' + k[3] + '</div></div>';
    }).join('');
  }

  function opButtons(m) {
    var ops = [];
    if (!isRead(m.id)) ops.push('<button class="btn btn-sm btn-outline" data-act="read" data-id="' + m.id + '">标记已读</button>');
    ops.push('<button class="btn btn-sm btn-ghost" data-act="detail" data-id="' + m.id + '">查看</button>');
    ops.push('<button class="btn btn-sm btn-destructive" data-perm="approve.first" data-act="delete" data-id="' + m.id + '">删除</button>');
    return ops.join('');
  }

  function renderTable() {
    var all = list(), rows = filtered();
    renderKPI(all);

    var totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    if (page > totalPages) page = totalPages;
    var seg = rows.slice((page - 1) * pageSize, page * pageSize);

    var columns = [
      { key: 'id', label: '消息ID', width: '110px', render: function (r) { return '<span class="num">' + esc(r.id) + '</span>'; } },
      { key: 'title', label: '标题', render: function (r) {
          var dot = !isRead(r.id) ? '<span class="status-dot warn ml-6"></span>' : '';
          return '<div class="cell-main">' + esc(r.title) + dot + '</div><div class="cell-sub">' + esc(r.body ? r.body.slice(0, 40) + (r.body.length > 40 ? '…' : '') : '') + '</div>';
        } },
      { key: 'type', label: '类型', width: '70px', render: function (r) { return msgTypeBadge(r.type); } },
      { key: 'target', label: '接收对象', width: '100px', render: function (r) { return esc(r.target); } },
      { key: 'read', label: '已读', width: '70px', render: function (r) { return isRead(r.id) ? '<span class="badge badge-success">已读</span>' : '<span class="badge badge-warning">未读</span>'; } },
      { key: 'ts', label: '发送时间', width: '100px', render: function (r) { return fmtDate(r.ts); } },
      { key: 'ops', label: '操作', width: '200px', render: function (r) { return '<div class="ops">' + opButtons(r) + '</div>'; } }
    ];

    tableInst = Admin.TableRenderer.render({
      container: '#table-container',
      columns: columns,
      data: seg,
      options: {
        selectable: true,
        emptyText: '暂无消息',
        loading: false
      }
    });

    if (!paginator) {
      paginator = new Admin.Paginator({
        container: '#pager-container',
        total: rows.length,
        pageSize: pageSize,
        pageSizeOptions: [10, 20, 50],
        onChange: function (p, sz) { page = p; pageSize = sz; renderTable(); }
      });
    } else {
      paginator.pageSize = pageSize;
      paginator.current = page;
      paginator.setTotal(rows.length);
    }
    if (Admin.applyPerms) Admin.applyPerms();
  }

  function render() { renderTable(); }

  /* ---- 详情抽屉 ---- */
  function openDetail(id) {
    var m = null;
    list().forEach(function (x) { if (x.id === id) m = x; });
    if (!m) { Admin.toast('未找到消息'); return; }
    setRead(id);

    var html = '<div class="drawer-section"><div class="ds-title">消息详情</div><div class="ds-grid">';
    html += '<div class="ds-item"><span class="ds-k">消息ID</span><span class="ds-v">' + esc(m.id) + '</span></div>';
    html += '<div class="ds-item"><span class="ds-k">类型</span><span class="ds-v">' + msgTypeBadge(m.type) + '</span></div>';
    html += '<div class="ds-item"><span class="ds-k">接收对象</span><span class="ds-v">' + esc(m.target) + '</span></div>';
    html += '<div class="ds-item"><span class="ds-k">发送时间</span><span class="ds-v">' + fmtDate(m.ts) + '</span></div>';
    html += '<div class="ds-item ds-full"><span class="ds-k">标题</span><span class="ds-v">' + esc(m.title) + '</span></div>';
    html += '</div></div>';
    html += '<div class="drawer-section"><div class="ds-title">消息正文</div><div class="ds-desc">' + esc(m.body) + '</div></div>';
    html += '<div class="drawer-section"><div class="ds-title">阅读统计</div><div class="ds-grid">';
    html += '<div class="ds-item"><span class="ds-k">目标用户数</span><span class="ds-v num">—</span></div>';
    html += '<div class="ds-item"><span class="ds-k">已读数</span><span class="ds-v num">—</span></div>';
    html += '<div class="ds-item"><span class="ds-k">未读数</span><span class="ds-v num">—</span></div>';
    html += '<div class="ds-item"><span class="ds-k">管理员查看</span><span class="ds-v"><span class="badge badge-success">已查看</span></span></div>';
    html += '</div></div>';

    var footer = '<div class="drawer-footer-actions"><button class="btn btn-destructive" data-perm="approve.first" id="df-delete">删除消息</button><button class="btn btn-primary" id="df-close">关闭</button></div>';
    var drawer = Admin.Drawer.open({ title: '消息详情 · ' + m.id, content: html, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    setTimeout(function () {
      var bp = drawer.panel;
      var cl = function (id, fn) { var b = bp.querySelector('#' + id); if (b) b.onclick = fn; };
      cl('df-close', function () { drawer.close(); render(); });
      cl('df-delete', function () {
        drawer.close();
        Admin.confirm({ title: '删除消息 · ' + id, body: '确认删除该消息？删除后不可恢复。', ok: '确认删除', danger: true, onYes: function () {
          deleteMessage(id);
          Admin.toast('消息已删除');
          Admin.log('删除消息', '消息中心', id, m.title);
          render();
        }});
      });
    }, 50);
  }

  /* ---- 发布消息 Modal ---- */
  function openPublishModal() {
    var typeOpts = TYPES.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
    var targetOpts = TARGETS.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
    var content = '<div class="form-grid">' +
      '<div class="form-item"><label>消息类型</label><select class="select" id="pm-type">' + typeOpts + '</select></div>' +
      '<div class="form-item"><label>接收对象</label><select class="select" id="pm-target">' + targetOpts + '</select></div>' +
      '<div class="form-item full"><label>标题</label><input class="input" id="pm-title" placeholder="消息标题…" maxlength="40"></div>' +
      '<div class="form-item full"><label>内容</label><textarea class="input" id="pm-body" placeholder="消息正文…" maxlength="500" rows="4"></textarea></div>' +
      '<div class="form-item full form-hint" id="pm-count">0/500</div>' +
      '</div>';
    var footer = '<div class="dg-f-actions"><button class="btn btn-outline" id="pm-cancel">取消</button><button class="btn btn-primary" id="pm-ok">发布消息</button></div>';
    var modal = Admin.Modal.open({ title: '发布新消息', content: content, footer: footer, width: '520px' });
    setTimeout(function () {
      var bp = modal.dialog;
      var cl = function (id, fn) { var b = bp.querySelector('#' + id); if (b) b.onclick = fn; };
      var bodyInp = bp.querySelector('#pm-body');
      var cnt = bp.querySelector('#pm-count');
      if (bodyInp && cnt) bodyInp.oninput = function () { cnt.textContent = bodyInp.value.length + '/500'; };
      cl('pm-cancel', function () { modal.close(); });
      cl('pm-ok', function () {
        var title = bp.querySelector('#pm-title').value.trim();
        var body = bp.querySelector('#pm-body').value.trim();
        if (!title || !body) { Admin.toast('请填写标题与内容'); return; }
        var m = DataBus.publishMessage({
          type: bp.querySelector('#pm-type').value,
          target: bp.querySelector('#pm-target').value,
          title: title, body: body
        });
        modal.close();
        Admin.toast('已发布：' + m.id);
        Admin.log('发布消息', '消息中心', m.id, title);
        render();
      });
    }, 50);
  }

  /* ---- 筛选栏 ---- */
  function initFilterBar() {
    Admin.FilterBar.render({
      container: '#filter-bar',
      fields: [
        { key: 'type', label: '消息类型', type: 'select', options: TYPES },
        { key: 'read', label: '已读状态', type: 'select', options: [
          { value: 'read', label: '已读' }, { value: 'unread', label: '未读' }
        ] },
        { key: 'date', label: '发送时间', type: 'daterange' },
        { key: 'q', label: '关键词', type: 'text', placeholder: '搜索标题 / 内容 / ID' }
      ],
      onFilter: function (vals) {
        fType = vals.type || ''; fRead = vals.read || ''; fQ = vals.q || '';
        fDateStart = vals.date_start || ''; fDateEnd = vals.date_end || '';
        page = 1; render();
      },
      onReset: function () {
        fType = ''; fRead = ''; fQ = ''; fDateStart = ''; fDateEnd = ''; page = 1; render();
      }
    });
  }

  function bind() {
    /* 行点击打开详情（排除按钮/复选框/输入框） */
    var tc = $('#table-container');
    if (tc && !tc.__bound) {
      tc.__bound = true;
      tc.addEventListener('click', function (e) {
        if (e.target.closest('button') || e.target.closest('.checkbox') || e.target.closest('input')) return;
        var tr = e.target.closest('tr[data-row-id]');
        if (tr) openDetail(tr.getAttribute('data-row-id'));
      });
    }

    $('#btn-publish').onclick = function () { openPublishModal(); };
    $('#btn-refresh').onclick = function () { render(); Admin.toast('已刷新（实时读取 DataBus）'); };

    /* 表格操作按钮（事件委托） */
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]'); if (!b) return;
      var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
      if (!window.Admin) return;
      if (act === 'detail') { openDetail(id); }
      else if (act === 'read') {
        setRead(id);
        Admin.toast('已标记为已读');
        Admin.log('标记已读', '消息中心', id, '');
        render();
      } else if (act === 'delete') {
        Admin.confirm({ title: '删除消息 · ' + id, body: '确认删除该消息？删除后不可恢复。', ok: '确认删除', danger: true, onYes: function () {
          deleteMessage(id);
          Admin.toast('消息已删除');
          Admin.log('删除消息', '消息中心', id, '');
          render();
        }});
      }
    });

    /* 导出 */
    var ex = $('#btn-export');
    if (ex && !ex.__bound) {
      ex.__bound = true;
      ex.onclick = function () {
        var rows = filtered().map(function (m) {
          return [m.id, m.type || '', m.title || '', m.target || '', m.body || '', fmtDate(m.ts), isRead(m.id) ? '已读' : '未读'];
        });
        var ok = Admin.exportCSV('消息中心.csv', ['消息ID', '类型', '标题', '接收对象', '内容', '发送时间', '已读状态'], rows);
        Admin.toast(ok ? '已导出 ' + rows.length + ' 条记录' : '导出失败', ok ? 'success' : 'danger');
        Admin.log('数据导出', '消息中心', '', '消息中心.csv · ' + rows.length + ' 条');
      };
    }

    /* 事件监听 */
    window.addEventListener('engchain:messages', function () { render(); });
    window.addEventListener('storage', function (e) {
      if (e.key === MSG_KEY || e.key === READ_KEY) render();
    });
  }

  function init() { initFilterBar(); bind(); render(); }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
