<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子合同 · 工程链管理后�?/title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="esign/contracts.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>电子合同</h1>
        <div class="sub">电子签 · 全平台电子合同台账（状态 / 多方签署进度 / 司法存证）· 风控作废留痕</div>
      </div>
      <div class="ph-actions">
        <button class="btn btn-outline" id="btn-refresh">刷新</button>
        <button class="btn btn-outline" id="btn-export" title="导出合同台账 CSV">导出 CSV</button>
      </div>
    </div>
    <div class="kpis" id="kpi"></div>
    <div class="card card-pad">
      <div class="card-h"><span class="card-t">合同台账</span><span class="card-s" id="c-count"></span></div>
      <div id="c-filter"></div>
      <div id="c-table"></div>
      <div id="c-pager"></div>
    </div>
  </main>
</div>
<script>window.__ROOT__ = "../../";</script>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function money(n) { return '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function dts(ts) { if (!ts) return '�?; var d = new Date(ts); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2) + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }

  var ALLOWED = ['ops', 'risk', 'super'];
  function role() { try { return localStorage.getItem('engchain-role') || 'super'; } catch (e) { return 'super'; } }
  if (ALLOWED.indexOf(role()) < 0) {
    document.addEventListener('DOMContentLoaded', function () {
      var m = document.querySelector('.main'); if (m) m.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;text-align:center;"><div style="font-size:18px;font-weight:700;margin-bottom:8px;">当前角色无权访问「电子合同�?/div><div class="sub">合同监管仅对运营 / 风控 / 超管开放，请在右上角切换身份�?/div></div>';
    });
    return;
  }

  var STATUS = { pending_mine:['badge-warning','待发起方签署'], signing:['badge-info','签署�?],
    completed:['badge-success','已完�?], rejected:['badge-danger','已拒�?], expired:['badge-outline','已逾期'],
    withdrawn:['badge-outline','已撤�?], voided:['badge-danger','已作�?] };

  var state = { filters:{ kw:'', status:'' }, page:1, pageSize:12, paginator:null };
  function rows() { try { return EsignStore.adminListContracts(); } catch (e) { return []; } }
  function filtered() {
    var f = state.filters;
    return rows().filter(function (r) {
      if (f.status && r.status !== f.status) return false;
      if (f.kw) { var k = f.kw.toLowerCase(); if ((r.title + r.code + (r.ownerCompany||'') + (r.ownerName||'') + r.id).toLowerCase().indexOf(k) < 0) return false; }
      return true;
    });
  }
  function badge(s) { var m = STATUS[s] || ['badge-outline', s || '�?]; return '<span class="badge ' + m[0] + '">' + m[1] + '</span>'; }
  function signedCount(r) { return (r.parties || []).filter(function (p) { return p.status === 'signed'; }).length; }

  function renderKPI() {
    var all = rows();
    var k = [
      ['合同总数', all.length + ' �?, 'info', '全部状�?],
      ['签署�?, all.filter(function(r){return r.status==='pending_mine'||r.status==='signing';}).length + ' �?, 'gold', '待发起方或对方签�?],
      ['已完�?, all.filter(function(r){return r.status==='completed';}).length + ' �?, 'up', '已生成司法存�?],
      ['异常终�?, all.filter(function(r){return ['rejected','expired','voided','withdrawn'].indexOf(r.status)>=0;}).length + ' �?, 'down', '拒签/逾期/作废/撤回']
    ];
    $('#kpi').innerHTML = k.map(function (x) {
      return '<div class="kpi"><div class="k">'+x[0]+'</div><div class="v num">'+x[1]+'</div><div class="d '+x[2]+'">'+x[3]+'</div></div>';
    }).join('');
  }

  function renderTable() {
    var list = filtered();
    $('#c-count').textContent = list.length + ' 条合�?;
    var start = (state.page - 1) * state.pageSize;
    Admin.TableRenderer.render({
      container: '#c-table',
      columns: [
        { key:'code', label:'合同�?, width:'150px', render:function(r){ return '<span class="mono">'+esc(r.code)+'</span>'; } },
        { key:'title', label:'合同名称', render:function(r){ return '<b>'+esc(r.title)+'</b><div class="sub" style="font-size:11px;">'+esc(r.ownerCompany||r.ownerName||r.uid)+'</div>'; } },
        { key:'amount', label:'金额', width:'110px', render:function(r){ return r.amount>0 ? '<span class="mono">'+money(r.amount)+'</span>' : '<span class="sub">无金�?/span>'; } },
        { key:'parties', label:'签署进度', width:'120px', render:function(r){ return signedCount(r) + '/' + (r.parties||[]).length + ' �?· ' + (r.signOrder==='sequential'?'顺序':'无序'); } },
        { key:'status', label:'状�?, width:'110px', render:function(r){ return badge(r.status); } },
        { key:'deadline', label:'签署截止', width:'140px', render:function(r){ return dts(r.deadline); } },
        { key:'sentAt', label:'发起时间', width:'140px', render:function(r){ return dts(r.sentAt||r.createdAt); } },
        { key:'ops', label:'操作', width:'90px', render:function(){ return '<button class="btn btn-sm btn-outline" data-act="detail">详情</button>'; } }
      ],
      data: list.slice(start, start + state.pageSize),
      options: { rowClick:function(r){ openDetail(r); }, emptyText:'暂无电子合同' }
    });
    if (!state.paginator) {
      state.paginator = new Admin.Paginator({ container:'#c-pager', total:list.length, pageSize:state.pageSize,
        onChange:function(p,ps){ state.page=p; state.pageSize=ps; renderTable(); } });
    } else { state.paginator.pageSize = state.pageSize; state.paginator.setTotal(list.length); }
  }

  function partiesHtml(r) {
    return (r.parties || []).map(function (p) {
      var st = { signed:['已签','var(--success)'], pending:['待签','var(--warning)'], rejected:['拒签','var(--danger)'] }[p.status] || [p.status,'var(--muted-foreground)'];
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);">' +
        '<span>'+esc(p.company||p.name)+' <span class="sub">'+esc(p.role)+(p.ownerUid?' · 平台用户':' · 外部签署�?)+'</span></span>' +
        '<b style="color:'+st[1]+'">'+st[0]+(p.signedAt?' · '+dts(p.signedAt):'')+'</b></div>';
    }).join('');
  }
  function openDetail(r) {
    var canVoid = (r.status==='pending_mine' || r.status==='signing' || r.status==='rejected' || r.status==='expired');
    var html =
      '<div class="drawer-section"><div class="ds-grid">' +
        '<div class="ds-item ds-full"><span class="ds-k">合同名称</span><span class="ds-v"><b>'+esc(r.title)+'</b></span></div>' +
        '<div class="ds-item"><span class="ds-k">合同�?/span><span class="ds-v mono">'+esc(r.code)+'</span></div>' +
        '<div class="ds-item"><span class="ds-k">状�?/span><span class="ds-v">'+badge(r.status)+'</span></div>' +
        '<div class="ds-item"><span class="ds-k">金额</span><span class="ds-v">'+(r.amount>0?money(r.amount):'无金�?)+'</span></div>' +
        '<div class="ds-item"><span class="ds-k">发起�?/span><span class="ds-v">'+esc(r.ownerCompany||r.ownerName)+'�?+esc(r.uid)+'�?/span></div>' +
        '<div class="ds-item"><span class="ds-k">发起时间</span><span class="ds-v">'+dts(r.sentAt||r.createdAt)+'</span></div>' +
        '<div class="ds-item"><span class="ds-k">签署截止</span><span class="ds-v">'+dts(r.deadline)+'</span></div>' +
        '<div class="ds-item"><span class="ds-k">完成时间</span><span class="ds-v">'+dts(r.completedAt)+'</span></div>' +
        (r.rejectReason ? '<div class="ds-item ds-full"><span class="ds-k">备注/原因</span><span class="ds-v">'+esc(r.rejectReason)+'</span></div>' : '') +
      '</div></div>' +
      '<div class="drawer-section"><div class="ds-title">签署方进�?/div>'+partiesHtml(r)+'</div>' +
      (r.evidence ? '<div class="drawer-section"><div class="ds-title">司法存证</div>' +
        '<div class="ds-item"><span class="ds-k">存证机构</span><span class="ds-v">'+esc(r.evidence.provider)+'</span></div>' +
        '<div class="ds-item"><span class="ds-k">存证编号</span><span class="ds-v mono">'+esc(r.evidence.certNo)+'</span></div>' +
        '<div class="ds-item ds-full"><span class="ds-k">文件哈希</span><span class="ds-v mono" style="word-break:break-all;">'+esc(r.evidence.hash)+'</span></div></div>' : '');
    var footer = canVoid ? '<button class="btn btn-danger" data-perm="approve.final" data-act="void">风控作废（退�?1 次）</button>' : '';
    var drawer = Admin.Drawer.open({ title:'电子合同 · '+r.code, content:html, footer:footer, width:'560px' });
    if (Admin.applyPerms) Admin.applyPerms();
    var vb = drawer.panel.querySelector('[data-act="void"]');
    if (vb) vb.onclick = function () {
      var m = Admin.Modal.open({ title:'确认作废该合同？', width:'440px',
        content:'<div class="form-item"><label>作废原因（将留痕并通知发起方）</label><input class="input" id="vd-note" maxlength="50" placeholder="如：合同要素异常 / 风控拦截"></div>' +
          '<div class="sub">作废为不可逆操作；若合同已计次，将向发起方退回 1 次签署次数。</div>',
        footer:'<button class="btn btn-ghost" id="vd-cancel">取消</button><button class="btn btn-danger" id="vd-ok">确认作废</button>' });
      setTimeout(function () {
        var modal = document.querySelector('.modal-dialog:last-of-type'); if (!modal) return;
        modal.querySelector('#vd-cancel').onclick = function () { m.close(); };
        modal.querySelector('#vd-ok').onclick = function () {
          var note = modal.querySelector('#vd-note').value.trim() || '平台风控作废';
          var rr = EsignStore.voidContract(r.id, note);
          m.close();
          if (rr && rr.ok) { Admin.toast('已作废并退回 1 次签署次数', 'ok'); Admin.log('电子合同作废','电子签',r.code,note); drawer.close(); render(); }
          else Admin.toast((rr && rr.error) || '作废失败', 'err');
        };
      }, 50);
    };
  }

  function renderFilter() {
    Admin.FilterBar.render({ container:'#c-filter',
      fields: [
        { key:'kw', label:'搜索', type:'text', placeholder:'合同�?合同�?发起�? },
        { key:'status', label:'状�?, type:'select', options:[
          { value:'', label:'全部状�? },
          { value:'pending_mine', label:'待发起方签署' }, { value:'signing', label:'签署�? },
          { value:'completed', label:'已完�? }, { value:'rejected', label:'已拒�? },
          { value:'expired', label:'已逾期' }, { value:'withdrawn', label:'已撤�? }, { value:'voided', label:'已作�? } ] }
      ],
      onFilter:function(v){ state.filters={ kw:v.kw||'', status:v.status||'' }; state.page=1; renderTable(); },
      onReset:function(){ state.filters={ kw:'', status:'' }; state.page=1; renderTable(); }
    });
  }
  function render(){ renderKPI(); renderTable(); }

  function init() {
    renderFilter();
    $('#btn-refresh').onclick = function(){ render(); Admin.toast('已刷�?); };
    $('#btn-export').onclick = function(){
      var list = filtered();
      var rows2 = list.map(function(r){ return [r.code,r.title,r.ownerCompany||r.ownerName||'', r.amount>0?String(r.amount):'无金�?,
        signedCount(r)+'/'+(r.parties||[]).length, (STATUS[r.status]||['',r.status])[1], dts(r.deadline), dts(r.sentAt||r.createdAt)]; });
      var ok = Admin.exportCSV('电子合同台账.csv', ['合同�?,'合同名称','发起�?,'金额','签署进度','状�?,'签署截止','发起时间'], rows2);
      Admin.toast(ok?'已导�?'+rows2.length+' �?:'导出失败', ok?'ok':'error');
      Admin.log('数据导出','电子合同','','电子合同台账.csv · '+rows2.length+' �?);
    };
    if (Admin.applyPerms) Admin.applyPerms();
    render();
  }
  document.addEventListener('DOMContentLoaded', init);
  window.addEventListener('engchain:esign', render);
})();
</script>
</body>
</html>
