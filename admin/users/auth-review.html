<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-theme-fix="1">(function(){try{var t=localStorage.getItem('engchain-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认证审核 · 工程链管理后台</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/admin.js" defer></script>
</head>
<body data-page="users/auth-review.html">
<header class="topbar"></header>
<div class="layout">
  <aside class="sidenav"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>认证审核</h1>
        <div class="sub">用户与认证中心 · 四类认证审批（实名 / 企业 / 个人资质 / 资金账户）· 通过写回用户表 + AuthStore 快照，驳回两端同步</div>
      </div>
      <button class="btn btn-outline" id="btn-refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>刷新</button>
      <button class="btn btn-outline" id="btn-export" title="导出当前筛选结果为 CSV"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>导出 CSV</button>
    </div>

    <div class="kpis" id="kpi"></div>

    <div class="card" id="batch-bar" style="margin-bottom:12px;display:none;">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span style="font-size:13px;font-weight:600;">批量操作</span>
        <span id="batch-count" style="font-size:12px;color:var(--text-muted);">已选 0 项</span>
        <button class="btn btn-sm btn-primary" id="btn-batch-approve" data-perm="approve.first">批量通过</button>
        <button class="btn btn-sm btn-ghost" id="btn-batch-reject" data-perm="approve.first">批量驳回</button>
        <span style="flex:1;"></span>
        <span id="queue-progress" style="font-size:11px;color:var(--text-muted);"></span>
      </div>
    </div>

    <div class="card card-pad">
      <div class="card-h">
        <span class="card-t">认证审核列表</span>
        <span class="card-s" id="count"></span>
      </div>
      <div id="filter-bar"></div>
      <div id="table-wrap"></div>
      <div id="pager-wrap"></div>
    </div>

    <div class="card card-pad" id="ent-change-card">
      <div class="card-h">
        <span class="card-t">企业留档变更审核</span>
        <span class="card-s" id="ent-change-count"></span>
        <button class="btn btn-sm btn-outline" id="btn-ent-mock" title="预置一条日常变更待审核用于演示">注入日常变更</button>
        <button class="btn btn-sm btn-outline" id="btn-ent-mock-annual" title="预置一条年度复核待审核用于演示" style="margin-left:8px;">注入年度复核</button>
        <button class="btn btn-sm btn-outline" id="btn-ent-mock-legal" title="预置一条法人变更待审核用于演示" style="margin-left:8px;">注入法人变更</button>
      </div>
      <div id="ent-pending-wrap"></div>
      <div class="sec-title-sm" style="margin-top:18px;margin-bottom:8px;">已处理记录</div>
      <div id="ent-history-wrap"></div>
    </div>
  </main>
</div>
<script src="../../js/data.js" defer></script>
<script src="../../js/common.js" defer></script>
<script src="../../js/stores.js" defer></script>
<script src="../../js/databus.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var TYPE = { realname: '实名认证', enterprise: '企业认证', personalQual: '个人资质', partner: '个人合伙人', payment: '资金账户' };
  var TYPE_ICON = { realname: '个人', enterprise: '企业', personalQual: '专业', partner: '合伙', payment: '资金' };
  var PAGE_SIZE = 10;
  var page = 1;
  var filters = { type: 'realname', scope: 'pending', keyword: '' };
  var paginator = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function fmtTime(ts) {
    try { var d = new Date(ts); var p = function (n) { return n < 10 ? '0' + n : n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); } catch (e) { return '-'; }
  }
  function fmtDate(ts) { try { return new Date(ts).toISOString().slice(0, 10); } catch (e) { return ''; } }

  function users() { return (window.DataBus && DataBus.users) ? DataBus.users() : []; }

  function authField(type) {
    if (type === 'personalQual') return 'personalQual';
    return type;
  }

  /* 个人入驻记录：personalEntry 优先（v3.0），与 stores.deriveIdentityStates 同口径 */
  function peOf(u) {
    var a = u.auth || {};
    return a.personalEntry || a.personalQual || a.qual || { ok: false, status: '' };
  }

  function pendingOf(type) {
    return users().filter(function (u) {
      if (u.status === 'guest') return false;
      var a = u.auth || {};
      if (type === 'payment') return !(a.payment && a.payment.ok);
      /* [Bug B] 实名为二要素+活体自动核验，业务上不进入人工待审队列，恒为空，
         避免把"从未实名 / 已驳回"用户都计入待审；其余认证仅统计真正 status='pending' 的申请。 */
      if (type === 'realname') return false;
      if (type === 'personalQual') return peOf(u).status === 'pending';
      if (type === 'partner') return !!(a.partner && a.partner.status === 'pending');
      if (type === 'enterprise') return !!(a.enterprise && a.enterprise.status === 'pending');
      return false;
    });
  }

  function approvedOf(type) {
    return users().filter(function (u) {
      if (u.status === 'guest') return false;
      var a = u.auth || {};
      if (type === 'payment') return !!(a.payment && a.payment.ok);
      if (type === 'realname') return !!(a.realname && a.realname.ok);
      if (type === 'personalQual') return !!peOf(u).ok;
      if (type === 'partner') return !!(a.partner && a.partner.ok);
      if (type === 'enterprise') return !!(a.enterprise && a.enterprise.ok);
      return false;
    });
  }

  function doneList() {
    var a = [];
    try { a = JSON.parse(localStorage.getItem('engchain-audit') || '[]'); } catch (e) {}
    return a.filter(function (x) {
      return (x.action === '认证通过' || x.action === '认证驳回') && x.module === '认证审核';
    });
  }

  function filteredList() {
    if (filters.scope === 'pending') {
      var list = pendingOf(filters.type);
      if (filters.keyword) {
        var q = filters.keyword.toLowerCase();
        list = list.filter(function (u) { return (u.name + u.company + u.account).toLowerCase().indexOf(q) >= 0; });
      }
      return list;
    } else {
      var dl = doneList();
      if (filters.keyword) {
        var q2 = filters.keyword.toLowerCase();
        dl = dl.filter(function (x) { return (x.target + x.extra + x.operator).toLowerCase().indexOf(q2) >= 0; });
      }
      return dl;
    }
  }

  function renderKPI() {
    var types = ['realname', 'enterprise', 'personalQual', 'partner', 'payment'];
    var pendingTotal = types.reduce(function (s, t) { return s + pendingOf(t).length; }, 0);
    var approvedTotal = types.reduce(function (s, t) { return s + approvedOf(t).length; }, 0);
    var allDone = doneList();
    var rejectedTotal = allDone.filter(function (x) { return x.action === '认证驳回'; }).length;
    var today = fmtDate(Date.now());
    var todayNew = allDone.filter(function (x) { return fmtDate(x.ts) === today; }).length;
    var cards = [
      ['待审核', pendingTotal, 'warn', '五类认证待审合计'],
      ['已通过', approvedTotal, 'up', '认证通过用户数'],
      ['已驳回', rejectedTotal, 'down', '历史驳回记录'],
      ['今日新增', todayNew, 'gold', '今日处理记录']
    ];
    $('#kpi').innerHTML = cards.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v num">' + k[1] + '</div><div class="d ' + (k[2] === 'gold' ? 'gold' : k[2] === 'down' ? 'down' : k[2] === 'warn' ? 'warn' : 'up') + '">' + k[3] + '</div></div>';
    }).join('');
  }

  function renderFilterBar() {
    Admin.FilterBar.render({
      container: '#filter-bar',
      fields: [
        { key: 'type', label: '认证类型', type: 'select', options: [
          { value: 'realname', label: '实名认证' },
          { value: 'enterprise', label: '企业认证' },
          { value: 'personalQual', label: '个人资质' },
          { value: 'partner', label: '个人合伙人' },
          { value: 'payment', label: '资金账户' }
        ]},
        { key: 'scope', label: '处理范围', type: 'select', options: [
          { value: 'pending', label: '待审核' },
          { value: 'done', label: '已处理' }
        ]},
        { key: 'keyword', label: '关键词', type: 'text', placeholder: '姓名 / 公司 / 账号' }
      ],
      onFilter: function (vals) {
        filters.type = vals.type || 'realname';
        filters.scope = vals.scope || 'pending';
        filters.keyword = vals.keyword || '';
        page = 1; renderTable();
        Admin.toast('查询完成，共 ' + filteredList().length + ' 条待审');
      },
      onReset: function () {
        filters = { type: 'realname', scope: 'pending', keyword: '' };
        page = 1; renderTable();
        Admin.toast('已重置筛选条件');
      }
    });
  }

  function statusBadge(st) {
    var m = { pending: ['badge-warning', '待审核'], approved: ['badge-success', '已通过'], rejected: ['badge-danger', '已驳回'] };
    var v = m[st] || ['badge-outline', st];
    return '<span class="badge ' + v[0] + '">' + v[1] + '</span>';
  }

  function renderTable() {
    var list = filteredList();
    $('#count').textContent = (filters.scope === 'pending' ? '待审核 ' : '已处理 ') + list.length + ' 条 · ' + TYPE[filters.type];
    var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    var seg = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    if (filters.scope === 'pending') {
      Admin.TableRenderer.render({
        container: '#table-wrap',
        columns: [
          { key: 'user', label: '用户', width: '180px', render: function (row) {
            return '<div class="fl-row-sm">' +
              '<span class="u-av av-md">' + esc(row.avatar || row.name.charAt(0)) + '</span>' +
              '<div><div class="tx-semibold">' + esc(row.name) + '</div>' +
              '<div class="tx-muted-xs">' + esc(row.company || row.account || '-') + '</div></div></div>';
          }},
          { key: 'type', label: '认证类型', width: '110px', render: function () { return '<span class="badge badge-primary">' + TYPE[filters.type] + '</span>'; } },
          { key: 'submitTime', label: '提交时间', width: '140px', render: function (row) {
            var a = row.auth || {};
            var f = authField(filters.type);
            var ts = (a[f] && (a[f].submittedAt || a[f].ts)) || row.createdAt || Date.now();
            return '<span class="tx-muted-sm">' + fmtTime(ts) + '</span>';
          }},
          { key: 'status', label: '状态', width: '90px', render: function () { return statusBadge('pending'); } },
          { key: 'ops', label: '操作', width: '160px', render: function (row) {
            return '<button class="btn btn-sm btn-primary" data-perm="approve.first" data-act="approve" data-id="' + row.id + '">通过</button>' +
              '<button class="btn btn-sm btn-ghost" data-perm="approve.first" data-act="reject" data-id="' + row.id + '">驳回</button>';
          }}
        ],
        data: seg,
        options: {
          rowClick: function (row) { openDetail(row); },
          emptyText: '暂无该类型待审项'
        }
      });
    } else {
      Admin.TableRenderer.render({
        container: '#table-wrap',
        columns: [
          { key: 'target', label: '用户', width: '150px', render: function (row) { return esc(row.target || '-'); } },
          { key: 'action', label: '处理结果', width: '100px', render: function (row) {
            return row.action === '认证通过' ? '<span class="badge badge-success">已通过</span>' : '<span class="badge badge-danger">已驳回</span>';
          }},
          { key: 'extra', label: '认证类型 / 说明', render: function (row) { return '<span class="tx-muted-sm">' + esc(row.extra || '-') + '</span>'; } },
          { key: 'operator', label: '操作人', width: '100px', render: function (row) { return esc(row.operator || '-'); } },
          { key: 'ts', label: '处理时间', width: '140px', render: function (row) { return '<span class="tx-muted-sm">' + fmtTime(row.ts) + '</span>'; } }
        ],
        data: seg,
        options: { emptyText: '暂无处理记录' }
      });
    }

    if (!paginator) {
      paginator = new Admin.Paginator({
        container: '#pager-wrap', total: list.length, pageSize: PAGE_SIZE,
        onChange: function (p, ps) { page = p; PAGE_SIZE = ps; renderTable(); }
      });
    } else { paginator.setTotal(list.length); }
    if (Admin.applyPerms) Admin.applyPerms();
  }

  function openDetail(u) {
    var a = u.auth || {};
    var f = authField(filters.type);
    var authData = a[f] || {};
    var qualList = '-';
    if (filters.type === 'personalQual') {
      var pq = a.personalQual || a.qual || { list: [] };
      qualList = (pq.list && pq.list.length) ? pq.list.join('、') : '未提交资质清单';
    }
    var body = '<div class="profile-head">' +
      '<span class="u-av av-lg">' + esc(u.avatar || u.name.charAt(0)) + '</span>' +
      '<div><div class="tx-title">' + esc(u.name) + statusBadge('pending') + '</div>' +
      '<div class="tx-sub">' + esc(u.account) + (u.company ? ' · ' + esc(u.company) : '') + '</div></div></div>' +

      '<div class="sec-title-sm">认证信息 · ' + TYPE[filters.type] + '</div>' +
      '<div class="ud-grid">' +
      '<div class="dg"><div class="k">认证类型</div><div class="v">' + TYPE[filters.type] + '（' + TYPE_ICON[filters.type] + '）</div></div>' +
      '<div class="dg"><div class="k">提交时间</div><div class="v">' + fmtTime(authData.submittedAt || authData.ts || u.createdAt || Date.now()) + '</div></div>' +
      (filters.type === 'enterprise' ? '<div class="dg"><div class="k">企业名称</div><div class="v">' + esc(u.company || '-') + '</div></div>' : '') +
      (filters.type === 'enterprise' ? '<div class="dg"><div class="k">统一社会信用代码</div><div class="v">' + esc(authData.license || '待核验') + '</div></div>' : '') +
      (filters.type === 'personalQual' ? '<div class="dg"><div class="k">资质清单</div><div class="v tx-regular">' + esc(qualList) + '</div></div>' : '') +
      (filters.type === 'partner' ? '<div class="dg"><div class="k">合作渠道</div><div class="v tx-regular">' + esc((authData.channel || []).join('、') || '-') + '</div></div>'
        + '<div class="dg"><div class="k">合作意向</div><div class="v">' + esc(authData.intent || '-') + '</div></div>'
        + '<div class="dg"><div class="k">自我介绍</div><div class="v tx-regular">' + esc(authData.intro || '-') + '</div></div>'
        + '<div class="dg"><div class="k">相关经验</div><div class="v tx-regular">' + esc(authData.experience || '-') + '</div></div>' : '') +
      (filters.type === 'payment' ? '<div class="dg"><div class="k">钱包余额</div><div class="v">¥' + (u.balance ? u.balance.balance : 0) + '</div></div>' : '') +
      (filters.type === 'realname' ? '<div class="dg"><div class="k">实名状态</div><div class="v">' + (a.realname && a.realname.ok ? '已认证' : '待审核') + '</div></div>' : '') +
      '</div>' +

      '<div class="sec-title">关联认证进度</div>' +
      '<div class="chain-grid">' +
      '<div class="cg ' + (a.realname && a.realname.ok ? 'ok' : 'no') + '"><div class="ck">实名</div><div class="cv">' + (a.realname && a.realname.ok ? '✓ 已认证' : '待认证') + '</div></div>' +
      '<div class="cg ' + (a.enterprise && a.enterprise.ok ? 'ok' : 'no') + '"><div class="ck">企业</div><div class="cv">' + (a.enterprise && a.enterprise.ok ? '✓ 已认证' : '待认证') + '</div></div>' +
      '<div class="cg ' + ((a.personalQual && a.personalQual.ok) || (a.qual && a.qual.ok) ? 'ok' : 'no') + '"><div class="ck">资质</div><div class="cv">' + (((a.personalQual && a.personalQual.ok) || (a.qual && a.qual.ok)) ? '✓ 已认证' : '待认证') + '</div></div>' +
      '<div class="cg ' + (a.payment && a.payment.ok ? 'ok' : 'no') + '"><div class="ck">资金</div><div class="cv">' + (a.payment && a.payment.ok ? '✓ 已核验' : '待核验') + '</div></div>' +
      '</div>';

    var footer = '<button class="btn btn-primary" data-perm="approve.first" id="d-approve">通过</button><button class="btn btn-ghost" data-perm="approve.first" id="d-reject">驳回</button>';
    var drawer = Admin.Drawer.open({ title: '认证详情 · ' + u.name, content: body, footer: footer, width: '520px' });
    if (Admin.applyPerms) Admin.applyPerms();
    var fb = drawer.panel.querySelector('.drawer-footer');
    if (fb) {
      fb.querySelector('#d-approve').onclick = function () { drawer.close(); approveDialog(u); };
      fb.querySelector('#d-reject').onclick = function () { drawer.close(); rejectDialog(u); };
    }
  }

  function approveDialog(u) {
    Admin.confirm({
      title: '通过' + TYPE[filters.type] + ' · ' + u.name,
      body: '<div class="ud-grid">' +
        '<div class="dg"><div class="k">用户</div><div class="v">' + esc(u.name) + (u.company ? ' · ' + esc(u.company) : '') + '</div></div>' +
        '<div class="dg"><div class="k">认证类型</div><div class="v">' + TYPE[filters.type] + '</div></div>' +
        '</div><div class="calc-tip mt-10">通过后将写回用户表 auth 字段 + AuthStore 快照同步；App 端认证状态即时更新，对应权益（入驻/分销/中介）自动开放。</div>',
      ok: '确认通过',
      onYes: function () {
        var r = DataBus.authApprove(u.id, filters.type);
        if (!r) { Admin.toast('操作失败'); return; }
        Admin.toast('[' + TYPE[filters.type] + '] 已通过：' + r.name);
        renderKPI(); renderTable();
      }
    });
  }

  function rejectDialog(u) {
    Admin.confirm({
      title: '驳回' + TYPE[filters.type] + ' · ' + u.name,
      body: '<div class="form-item"><label>驳回原因</label><input class="input" id="reject-note" placeholder="请输入驳回原因（将同步至 App 认证结果页）…" maxlength="100"></div>',
      ok: '确认驳回', danger: true,
      onYes: function () {
        var note = '';
        try { note = document.getElementById('reject-note').value.trim(); } catch (e) {}
        if (!note) { Admin.toast('请填写驳回原因'); return; }
        var r = DataBus.authReject(u.id, filters.type, note);
        if (!r) { Admin.toast('操作失败'); return; }
        Admin.toast('已驳回：' + r.name);
        renderKPI(); renderTable();
      }
    });
  }

  function doExport() {
    var list = filteredList();
    var rows;
    if (filters.scope === 'pending') {
      rows = list.map(function (u) {
        return [u.name, u.company || '', u.account || '', TYPE[filters.type], '待审核', fmtTime((u.auth && u.auth[authField(filters.type)] && u.auth[authField(filters.type)].ts) || '')];
      });
    } else {
      rows = list.map(function (x) { return [x.target || '', x.action || '', x.extra || '', x.operator || '', fmtTime(x.ts)]; });
    }
    var headers = filters.scope === 'pending'
      ? ['姓名', '公司', '账号', '认证类型', '状态', '提交时间']
      : ['用户', '处理结果', '说明', '操作人', '处理时间'];
    var ok = Admin.exportCSV('认证审核.csv', headers, rows);
    Admin.toast(ok ? '已导出 ' + rows.length + ' 条记录' : '导出失败', ok ? 'success' : 'danger');
    if (ok) Admin.log('数据导出', '认证审核', '', '认证审核.csv · ' + rows.length + ' 条');
  }

  /* ========== 企业留档变更审核（pendingChanges） ========== */
  var ENT_FIELDS = { co: '企业名称', code: '统一社会信用代码', legal: '法定代表人', shortName: '企业简称', registeredAddress: '注册地址' };
  var B_FIELDS = ['co', 'code', 'legal', 'shortName', 'registeredAddress'];

  function entUserLabel() {
    try {
      var s = AuthStore.read();
      var rn = s.realname || {};
      if (rn.name) return rn.name + (rn.mobile ? '（' + rn.mobile + '）' : '');
    } catch (e) {}
    try { if (window.DataBus && DataBus.currentUser) return DataBus.currentUser.name || DataBus.currentUser.account; } catch (e) {}
    return '当前登录用户';
  }

  function entRowsFor(pc, annual) {
    var cur = {};
    try { cur = AuthStore.read().enterprise || {}; } catch (e) {}
    var rows = [];
    B_FIELDS.forEach(function (f) {
      var nv = pc[f] || '';
      var ov = cur[f] || '';
      if (annual) {
        rows.push({ field: f, label: ENT_FIELDS[f], oldV: ov, newV: nv || ov, unchanged: !nv || nv === ov });
      } else if (nv && nv !== ov) {
        rows.push({ field: f, label: ENT_FIELDS[f], oldV: ov, newV: nv, unchanged: false });
      }
    });
    return rows;
  }

  function entFilesHtml(pc) {
    return (pc.files || []).map(function (f, i) {
      var nm = (typeof f === 'string') ? f : (f.name || f.url || ('附件' + (i + 1)));
      return '<span class="badge badge-outline" style="margin-right:6px;">' + esc(nm) + '</span>';
    }).join('') || '<span class="tx-muted-sm">无</span>';
  }

  function entCardHtml(pc, annual) {
    var cur = {};
    try { cur = AuthStore.read().enterprise || {}; } catch (e) {}
    var rows = entRowsFor(pc, annual);
    var rowsHtml = rows.map(function (r) {
      var newCell = r.unchanged
        ? '<span class="tx-muted-sm">维持原值</span>'
        : '<span style="font-weight:600;color:var(--primary);">' + esc(r.newV) + '</span>';
      return '<tr>' +
        '<td style="padding:6px 12px;color:var(--text-muted);">' + esc(r.label) + '</td>' +
        '<td style="padding:6px 12px;">' + esc(r.oldV || '（空）') + '</td>' +
        '<td style="padding:6px 12px;color:var(--text-muted);">→</td>' +
        '<td style="padding:6px 12px;">' + newCell + '</td>' +
      '</tr>';
    }).join('');
    var legalChanged = !!(pc.legal && pc.legal !== (cur.legal || ''));
    var headBadges;
    if (annual) {
      headBadges = '<span class="badge badge-warning">待审核</span><span class="badge" style="background:var(--warning-dim);color:var(--warning);">年度复核</span>';
      if (legalChanged) headBadges += '<span class="badge badge-danger">法人变更</span>';
    } else if (legalChanged) {
      headBadges = '<span class="badge badge-warning">待审核</span><span class="badge badge-danger">法人变更·严格核验</span>';
    } else {
      headBadges = '<span class="badge badge-warning">待审核</span>';
    }
    var lastReview = '';
    if (annual) {
      var la = 0;
      try { la = (AuthStore.read().enterprise || {}).lastReviewAt || 0; } catch (e) {}
      if (la) lastReview = '<span class="tx-muted-sm">上次复核 ' + fmtTime(la) + '</span>';
    }
    var borderColor = annual ? 'var(--warning)' : (legalChanged ? 'var(--danger)' : 'var(--border)');
    var legalPrompt = (legalChanged && !annual)
      ? '<div style="margin:0 0 12px;padding:8px 10px;background:var(--danger-dim);border-radius:6px;color:var(--danger);font-size:12px;">请审核员核验法人变更佐证材料（变更核准通知书/股东会决议等）</div>'
      : '';
    return '<div style="border:1px solid ' + borderColor + ';border-radius:8px;padding:14px;margin-bottom:10px;">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
        headBadges +
        '<span class="tx-semibold">' + esc(entUserLabel()) + '</span>' +
        '<span class="tx-muted-sm">' + (annual ? '企业年度认证复核申请' : '企业留档字段变更申请') + '</span>' +
        lastReview +
        '<span style="flex:1;"></span>' +
        '<span class="tx-muted-sm">提交时间 ' + fmtTime(pc.submittedAt) + '</span>' +
      '</div>' +
      '<table style="width:100%;border-collapse:collapse;margin-bottom:10px;"><tbody>' + rowsHtml + '</tbody></table>' +
      '<div style="margin-bottom:8px;"><span class="tx-muted-sm">变更原因：</span>' + esc(pc.reason || '（未填写）') + '</div>' +
      '<div style="margin-bottom:12px;"><span class="tx-muted-sm">佐证材料：</span>' + entFilesHtml(pc) + '</div>' +
      legalPrompt +
      '<div style="text-align:right;">' +
        '<button class="btn btn-sm btn-primary" data-entact="approve">通过</button> ' +
        '<button class="btn btn-sm btn-ghost" data-entact="reject">驳回</button>' +
      '</div>' +
    '</div>';
  }

  function renderEntPending() {
    var wrap = $('#ent-pending-wrap');
    var count = $('#ent-change-count');
    var pc = null;
    try { pc = AuthStore.getPendingEnterpriseChange(); } catch (e) {}
    if (!wrap) return;
    var isPending = !!(pc && pc.status === 'pending');
    var annual = isPending && pc.reviewType === 'annual';
    if (count) count.textContent = '待审核 ' + (isPending ? 1 : 0) + ' 条';
    var html = '';
    html += '<div class="sec-title-sm" style="margin:4px 0 8px;">日常变更审核</div>';
    if (isPending && !annual) html += entCardHtml(pc, false);
    else html += '<div class="tx-muted-sm" style="padding:8px 0 16px;">暂无日常变更待审核</div>';
    html += '<div class="sec-title-sm" style="margin:4px 0 8px;">年度认证复核</div>';
    if (isPending && annual) html += entCardHtml(pc, true);
    else html += '<div class="tx-muted-sm" style="padding:8px 0;">暂无年度认证复核待审</div>';
    wrap.innerHTML = html;
  }

  function renderEntHistory() {
    var wrap = $('#ent-history-wrap');
    if (!wrap) return;
    var hist = [];
    var rejected = null;
    try {
      var s = AuthStore.read();
      hist = (s.enterprise && s.enterprise.changeHistory) || [];
      var pc = AuthStore.getPendingEnterpriseChange();
      if (pc && pc.status === 'rejected') rejected = pc;
    } catch (e) {}
    var html = '';
    if (hist.length) {
      var rows = hist.slice().reverse().slice(0, 10).map(function (h) {
        var typeBadge = h.reviewType === 'annual'
          ? '<span class="badge" style="background:var(--warning-dim);color:var(--warning);">年度复核</span>'
          : '<span class="badge badge-outline">日常变更</span>';
        if (h.field === 'legal') typeBadge += ' <span class="badge badge-danger" style="margin-left:4px;">法人</span>';
        return '<tr>' +
          '<td style="padding:6px 12px;">' + esc(ENT_FIELDS[h.field] || h.field) + '</td>' +
          '<td style="padding:6px 12px;">' + typeBadge + '</td>' +
          '<td style="padding:6px 12px;color:var(--text-muted);">' + esc(h.oldValue || '（空）') + '</td>' +
          '<td style="padding:6px 12px;color:var(--text-muted);">→</td>' +
          '<td style="padding:6px 12px;font-weight:600;">' + esc(h.newValue) + '</td>' +
          '<td style="padding:6px 12px;color:var(--text-muted);">' + fmtTime(h.approvedAt || h.changedAt) + '</td>' +
          '<td style="padding:6px 12px;color:var(--text-muted);">' + esc(h.operator || '-') + '</td>' +
        '</tr>';
      }).join('');
      html += '<div style="margin-bottom:6px;" class="tx-semibold">已通过（' + hist.length + '）</div>' +
        '<table style="width:100%;border-collapse:collapse;margin-bottom:14px;"><thead><tr style="color:var(--text-muted);font-size:12px;">' +
        '<th style="text-align:left;padding:4px 12px;">字段</th><th style="text-align:left;padding:4px 12px;">类型</th><th style="text-align:left;padding:4px 12px;">旧值</th><th style="width:20px;"></th><th style="text-align:left;padding:4px 12px;">新值</th><th style="text-align:left;padding:4px 12px;">审核时间</th><th style="text-align:left;padding:4px 12px;">操作人</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    } else {
      html += '<div class="tx-muted-sm" style="margin-bottom:14px;">暂无已通过的变更记录</div>';
    }
    if (rejected) {
      var rAnnual = rejected.reviewType === 'annual';
      var rRows = entRowsFor(rejected, rAnnual);
      var rHtml = rRows.map(function (r) {
        return '<tr>' +
          '<td style="padding:6px 12px;color:var(--text-muted);">' + esc(r.label) + '</td>' +
          '<td style="padding:6px 12px;">' + esc(r.oldV || '（空）') + '</td>' +
          '<td style="padding:6px 12px;color:var(--text-muted);">→</td>' +
          '<td style="padding:6px 12px;text-decoration:line-through;color:var(--text-muted);">' + esc(r.newV) + '</td>' +
        '</tr>';
      }).join('');
      var rTypeBadge = rAnnual ? '<span class="badge" style="background:var(--warning-dim);color:var(--warning);">年度复核</span> ' : '';
      html += '<div style="margin-bottom:6px;" class="tx-semibold"><span class="badge badge-danger">已驳回</span> ' + rTypeBadge + '最近一次驳回申请</div>' +
        '<table style="width:100%;border-collapse:collapse;margin-bottom:8px;"><tbody>' + rHtml + '</tbody></table>' +
        '<div class="tx-muted-sm" style="margin-bottom:6px;">提交时间：' + fmtTime(rejected.submittedAt) + '</div>' +
        '<div style="margin-bottom:14px;"><span class="tx-muted-sm">驳回原因：</span><span style="color:var(--danger);">' + esc(rejected.rejectReason || '（未填写）') + '</span></div>';
    } else {
      html += '<div class="tx-muted-sm">暂无已驳回的变更记录</div>';
    }
    wrap.innerHTML = html;
  }

  function renderEntChange() { renderEntPending(); renderEntHistory(); }

  function entApprove() {
    var pc = null;
    try { pc = AuthStore.getPendingEnterpriseChange(); } catch (e) {}
    var annual = !!(pc && pc.reviewType === 'annual');
    Admin.confirm({
      title: annual ? '通过企业年度认证复核' : '通过企业留档变更',
      body: '<div class="calc-tip mt-10">' + (annual
        ? '通过后将确认本年度企业资质并重置下次复核周期（1年）；B类全字段写入正式企业信息。'
        : '通过后新值将写入正式企业字段，旧值进入变更历史；App 端企业信息即时更新。') + '</div>',
      ok: '确认通过',
      onYes: function () {
        var legalChg = !!(pc && pc.legal && pc.legal !== ((AuthStore.read().enterprise || {}).legal || ''));
        try { AuthStore.approveEnterpriseChange('admin'); } catch (e) {}
        var msg = '已通过，企业信息已更新';
        if (annual) {
          var due = 0;
          try { due = (AuthStore.read().enterprise || {}).reviewDueAt || 0; } catch (e) {}
          msg = '年度复核已通过，企业信息已更新，下次复核：' + fmtDate(due);
        }
        if (legalChg) msg += '；法人变更已生效';
        Admin.toast(msg);
        renderEntChange(); renderKPI();
      }
    });
  }

  function entReject() {
    var pc = null;
    try { pc = AuthStore.getPendingEnterpriseChange(); } catch (e) {}
    var annual = !!(pc && pc.reviewType === 'annual');
    Admin.confirm({
      title: annual ? '驳回企业年度认证复核' : '驳回企业留档变更',
      body: '<div class="form-item"><label>驳回原因</label><input class="input" id="ent-reject-note" placeholder="请输入驳回原因（必填，将同步至用户端）…" maxlength="100"></div>',
      ok: '确认驳回', danger: true,
      onYes: function () {
        var note = '';
        try { note = document.getElementById('ent-reject-note').value.trim(); } catch (e) {}
        if (!note) { Admin.toast('请填写驳回原因'); return; }
        try { AuthStore.rejectEnterpriseChange(note, 'admin'); } catch (e) {}
        Admin.toast(annual ? '年度复核已驳回' : '已驳回');
        renderEntChange(); renderKPI();
      }
    });
  }

  function entMock() {
    var s = AuthStore.read();
    if (!s.enterprise) s.enterprise = {};
    s.enterprise.ok = true;
    if (!s.enterprise.co) s.enterprise.co = '旧公司';
    if (!s.enterprise.code) s.enterprise.code = '91510100OLD';
    s.enterprise.pendingChanges = {
      co: '新公司', code: '91510100NEW', legal: '', shortName: '', registeredAddress: '',
      reason: '公司更名', files: [], submittedAt: Date.now(),
      status: 'pending', rejectReason: '', reviewType: 'daily'
    };
    AuthStore.write(s);
    Admin.toast('已注入日常变更待审核数据');
    renderEntChange(); renderKPI();
  }

  function entMockAnnual() {
    var s = AuthStore.read();
    if (!s.enterprise) s.enterprise = {};
    s.enterprise.ok = true;
    s.enterprise.co = '旧公司';
    s.enterprise.code = '91510100OLD';
    s.enterprise.legal = '张旧法人';
    s.enterprise.shortName = '旧简称';
    s.enterprise.registeredAddress = '成都市旧地址';
    s.enterprise.lastReviewAt = Date.now() - 400 * 864e5;
    s.enterprise.annualStatus = 'under_review';
    s.enterprise.pendingChanges = {
      co: '年审新公司', code: '91510100NEW', legal: '李新法人', shortName: '年审新简称',
      registeredAddress: '成都市高新区新地址',
      reason: '年度资质复核', files: [], submittedAt: Date.now(),
      status: 'pending', rejectReason: '', reviewType: 'annual'
    };
    AuthStore.write(s);
    Admin.toast('已注入年度复核待审数据');
    renderEntChange(); renderKPI();
  }

  function entMockLegal() {
    var s = AuthStore.read();
    if (!s.enterprise) s.enterprise = {};
    s.enterprise.ok = true;
    if (!s.enterprise.legal) s.enterprise.legal = '旧法人';
    s.enterprise.pendingChanges = {
      co: '', code: '', legal: '新法人', shortName: '', registeredAddress: '',
      reason: '法人变更', files: ['变更核准通知书.pdf', '股东会决议.pdf'], submittedAt: Date.now(),
      status: 'pending', rejectReason: '', reviewType: 'daily'
    };
    AuthStore.write(s);
    Admin.toast('已注入法人变更待审核数据');
    renderEntChange(); renderKPI();
  }

  function bind() {
    $('#btn-refresh').onclick = function () { renderKPI(); renderTable(); renderEntChange(); Admin.toast('已刷新'); };
    $('#btn-export').onclick = doExport;
    var em = $('#btn-ent-mock');
    if (em) em.onclick = entMock;
    var ea = $('#btn-ent-mock-annual');
    if (ea) ea.onclick = entMockAnnual;
    var el = $('#btn-ent-mock-legal');
    if (el) el.onclick = entMockLegal;
    document.addEventListener('click', function (e) {
      var eb = e.target.closest('[data-entact]');
      if (eb) {
        if (eb.getAttribute('data-entact') === 'approve') entApprove();
        else if (eb.getAttribute('data-entact') === 'reject') entReject();
        return;
      }
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      var id = b.getAttribute('data-id');
      var u = null;
      users().forEach(function (x) { if (x.id === id) u = x; });
      if (!u) return;
      if (b.getAttribute('data-act') === 'approve') approveDialog(u);
      else if (b.getAttribute('data-act') === 'reject') rejectDialog(u);
    });
    window.addEventListener('engchain:auth', function () { renderKPI(); renderTable(); renderEntChange(); updateQueueProgress(); });
    /* [Bug D] App/调试面板在其它文档提交后，已打开的后台列表自动刷新（storage 仅跨文档触发） */
    window.addEventListener('storage', function (e) {
      if (e && e.key === 'engchain-users') {
        if (window.DataBus && DataBus.invalidateCache) DataBus.invalidateCache();
        renderKPI(); renderTable(); renderEntChange(); updateQueueProgress();
      }
    });
    var ba=document.getElementById('btn-batch-approve');
    if(ba)ba.onclick=function(){
      var ids=[];document.querySelectorAll('.row-chk:checked').forEach(function(c){ids.push(c.getAttribute('data-id'));});
      if(!ids.length){Admin.toast('请先选择待审核项');return;}
      Admin.confirm({title:'批量通过',body:'确认通过选中的 '+ids.length+' 项认证申请？',ok:'确认通过',onYes:function(){
        ids.forEach(function(id){var u=null;users().forEach(function(x){if(x.id===id)u=x;});if(u)DataBus.authApprove(u.id,filters.type);});
        Admin.toast('已批量通过 '+ids.length+' 项');renderKPI();renderTable();updateQueueProgress();
      }});
    };
    var br=document.getElementById('btn-batch-reject');
    if(br)br.onclick=function(){
      var ids=[];document.querySelectorAll('.row-chk:checked').forEach(function(c){ids.push(c.getAttribute('data-id'));});
      if(!ids.length){Admin.toast('请先选择待审核项');return;}
      Admin.confirm({title:'批量驳回',body:'确认驳回选中的 '+ids.length+' 项认证申请？',ok:'确认驳回',danger:true,onYes:function(){
        ids.forEach(function(id){var u=null;users().forEach(function(x){if(x.id===id)u=x;});if(u)DataBus.authReject(u.id,filters.type,'批量驳回');});
        Admin.toast('已批量驳回 '+ids.length+' 项');renderKPI();renderTable();updateQueueProgress();
      }});
    };
  }

  window.toggleAll=function(cb){document.querySelectorAll('.row-chk').forEach(function(c){c.checked=cb.checked;});updateBatchBar();};
  window.updateBatchBar=function(){
    var checked=document.querySelectorAll('.row-chk:checked');
    var bar=document.getElementById('batch-bar');
    var cnt=document.getElementById('batch-count');
    if(bar)bar.style.display=checked.length?'':'none';
    if(cnt)cnt.textContent='已选 '+checked.length+' 项';
  };
  function updateQueueProgress(){
    var types=['realname','enterprise','personalQual','partner','payment'];
    var pending=types.reduce(function(s,t){return s+pendingOf(t).length;},0);
    var done=doneList();
    var today=new Date().toISOString().slice(0,10);
    var todayDone=done.filter(function(x){return fmtDate(x.ts)===today;}).length;
    var el=document.getElementById('queue-progress');
    if(el)el.textContent='待审 '+pending+' · 今日已审 '+todayDone;
  }
  function render() { renderKPI(); renderFilterBar(); renderTable(); renderEntChange(); updateQueueProgress(); }
  function init() { bind(); render(); }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
