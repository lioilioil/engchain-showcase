<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engchain 工作台</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('engchain-console-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (t === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- 旧 DataBus 数据层（桥接用，dev server 通过 /_legacy/ 暴露 ../js/） -->
  <script src="/_legacy/js/data.js" defer></script>
  <script src="/_legacy/js/common.js" defer></script>
  <script src="/_legacy/js/domain.js" defer></script>
  <script src="/_legacy/js/stores.js" defer></script>
  <script src="/_legacy/js/databus.js" defer></script>
  <script src="/_legacy/admin/js/finance-credits.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
