<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script data-engchain-basefix="2">
(function(){
function rm(){var a=document.querySelectorAll('base');for(var i=0;i<a.length;i++){if(!a[i].dataset.ef){a[i].parentNode.removeChild(a[i]);}}}
var p=location.pathname,m=/^(\/app\/[^/]+)/.exec(p),pf=m?m[1]:"";var dir="";var base;
if(pf){base=pf+"/"+dir;}else{var q=p.indexOf("?")>-1?p.slice(0,p.indexOf("?")):p;base=q.slice(0,q.lastIndexOf("/")+1);}
rm();var b=document.createElement("base");b.href=base;b.setAttribute("data-ef","1");document.head.insertBefore(b,document.head.firstChild);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>工程链 ENGCHAIN · 认证引导</title>
<link rel="stylesheet" href="css/app.css">
<style>
/* 认证引导广告页：游客全屏广告入场前保持黑底，避免白屏闪烁 */
html, body { background: #000; }
</style>
</head>
<body>
<script src="js/common.js"></script>
<script src="pages/guide/popup.js"></script>
<script>
/* 认证引导广告页：
   - 本次需弹广告 → 全屏广告展示，关闭（游客 × / 用户 × / 稍后再说 / 点遮罩）后直接进入新首页 home.html；
   - 本次无需弹广告（已看过 / 已注册且已看过）→ 直接进入 home.html；
   - 广告内「立即注册 / 去登录 / 立即前往 / 福利项」等导航按钮保持原跳转，不拦截。
   旧版首页内容已从本页移除，本页不再展示任何首页内容。 */
(function () {
  window.__ROOT__ = '';

  /* 注入灵动岛（全屏广告页无 .phone 容器，需手动固定定位） */
  (function injectDynamicIsland() {
    if (document.querySelector('.dynamic-island')) return;
    var di = document.createElement('div');
    di.className = 'dynamic-island';
    di.style.cssText = 'position:fixed;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:999px;z-index:100001;pointer-events:none;';
    document.body.appendChild(di);
  })();

  function gotoHome() {
    try { location.replace('home.html'); } catch (e) { location.href = 'home.html'; }
  }

  if (window.GuidePopup) {
    if (typeof GuidePopup.willShow === 'function' && !GuidePopup.willShow()) {
      gotoHome();
      return;
    }
    GuidePopup.init({ onClose: gotoHome });
  } else {
    // popup.js 加载失败时兜底：不让用户停留在空白页
    gotoHome();
  }
})();
</script>
</body>
</html>
