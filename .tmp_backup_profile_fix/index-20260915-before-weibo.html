/* ═══════════════════════════════════════════════════════════════
   我的 · 个人工作台 V10.0
   Bento Grid × Liquid Glass 2.0 × Spatial Depth
   设计参考：Apple visionOS / Linear / Stripe / Vercel
   视觉核心：暖米白 + 古铜金 + 液态玻璃 + 空间层次
   ═══════════════════════════════════════════════════════════════ */

/* ---------- 设计令牌 ---------- */
:root {
  --me-radius-lg: 22px;
  --me-radius-md: 16px;
  --me-radius-sm: 12px;
  --me-gap: 12px;
  --me-pad: 18px;

  --me-gold: #C9A961;
  --me-gold-deep: #A98A47;
  --me-gold-light: #E8D9B5;
  --me-gold-pale: #F5EDD8;

  --me-text: #2A2722;
  --me-text-2: #6B6358;
  --me-text-3: #9A9185;
  --me-text-4: #C4BCB0;

  --me-bg: #F2EFE8;
  --me-bg-2: #EDE9E0;
  --me-card: rgba(255,255,255,0.72);
  --me-card-solid: #FFFFFF;
  --me-border: rgba(201,169,97,0.18);
  --me-border-strong: rgba(201,169,97,0.35);

  --me-shadow-1: 0 1px 2px rgba(42,39,34,0.04), 0 2px 8px rgba(42,39,34,0.03);
  --me-shadow-2: 0 2px 4px rgba(42,39,34,0.04), 0 8px 24px rgba(42,39,34,0.06);
  --me-shadow-3: 0 4px 12px rgba(42,39,34,0.06), 0 16px 40px rgba(42,39,34,0.08);

  --me-green: #5B9A6F;
  --me-red: #D4655A;
  --me-blue: #5B8AB5;
  --me-orange: #D4945A;
  --me-purple: #8B7BB5;

  --me-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --me-text: #F0EBE0;
  --me-text-2: #B0A898;
  --me-text-3: #7A7265;
  --me-text-4: #524C42;

  --me-bg: #0E0D0B;
  --me-bg-2: #161411;
  --me-card: rgba(32,30,27,0.7);
  --me-card-solid: #1E1C19;
  --me-border: rgba(201,169,97,0.12);
  --me-border-strong: rgba(201,169,97,0.28);

  --me-gold: #D4B876;
  --me-gold-deep: #B89A5A;
  --me-gold-light: #8A7548;
  --me-gold-pale: #3A3325;

  --me-shadow-1: 0 1px 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.15);
  --me-shadow-2: 0 2px 4px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.2);
  --me-shadow-3: 0 4px 12px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.25);
}

/* ---------- 页面基底 ---------- */
html, body { margin: 0; padding: 0; background: var(--me-bg); }
.phone { background: var(--me-bg); }
.profile-page {
  min-height: 100%;
  background: var(--me-bg);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 100px;
}

/* 背景氛围光 */
.profile-page::before {
  content: '';
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  height: 320px;
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
[data-theme="dark"] .profile-page::before {
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.12) 0%, transparent 70%);
}

.profile-content {
  position: relative;
  z-index: 1;
  padding: 0 16px;
}


/* ---------- Liquid Glass 卡片基础 ---------- */
.glass {
  position: relative;
  background: var(--me-card);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-radius: var(--me-radius-lg);
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-2);
  overflow: hidden;
  transition: transform 0.3s var(--me-ease), box-shadow 0.3s var(--me-ease);
}
.glass:hover {
  box-shadow: var(--me-shadow-3);
}
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 40%, transparent 60%, rgba(201,169,97,0.1) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
[data-theme="dark"] .glass::before {
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 40%, transparent 60%, rgba(201,169,97,0.08) 100%);
}

/* 噪点纹理叠加 */
.glass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0.03;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}







/* ---------- 最近浏览 ---------- */
.history-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.history-scroll::-webkit-scrollbar { display: none; }

.history-card {
  flex-shrink: 0;
  width: 148px;
  border-radius: var(--me-radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s var(--me-ease);
  background: var(--me-card-solid);
  border: 1px solid var(--me-border);
  box-shadow: var(--me-shadow-1);
}
.history-card:hover { transform: translateY(-2px); box-shadow: var(--me-shadow-2); }

.history-img {
  height: 80px;
  background: linear-gradient(135deg, var(--me-gold-pale), var(--me-bg-2));
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--me-gold-deep);
}
.history-img svg { width: 32px; height: 32px; opacity: 0.5; }

.history-tag {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.history-tag.hot { background: rgba(212,101,90,0.15); color: var(--me-red); }
.history-tag.new { background: rgba(91,154,111,0.15); color: var(--me-green); }

.history-body { padding: 10px 12px; }

.history-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--me-text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-loc {
  font-size: 10.5px;
  color: var(--me-text-3);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}
.history-loc svg { width: 10px; height: 10px; }

.history-price {
  font-size: 14px;
  font-weight: 700;
  color: var(--me-gold-deep);
}
.history-price .unit { font-size: 10px; font-weight: 500; color: var(--me-text-3); }





/* ---------- 双线身份 / 入驻徽标 / 横幅（E1-12/E1-15/E1-17/E1-19/E2） ---------- */

.entry-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .3px; margin-left: 6px;
}
.entry-badge.blueV { background: rgba(91,138,181,.14); color: #3E6A9C; border: 1px solid rgba(91,138,181,.3); }
.entry-badge.goldV { background: linear-gradient(135deg, rgba(201,169,97,.22), rgba(201,169,97,.1)); color: var(--me-gold-deep); border: 1px solid var(--me-border-strong); box-shadow: 0 0 0 1px rgba(201,169,97,.12); }
.entry-badge.exclusive { background: linear-gradient(135deg, #F5EDD8, #E8D9B5); color: #8A6A2E; border: 1px solid var(--me-gold-light); }
.entry-badge.banned { background: rgba(212,101,90,.14); color: var(--me-red); border: 1px solid rgba(212,101,90,.35); }
[data-theme="dark"] .entry-badge.blueV { color: #7AAAD5; }


.pf-banner { border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pf-banner .pb-body { flex: 1; min-width: 0; }
.pf-banner .pb-title { font-size: 13px; font-weight: 700; }
.pf-banner .pb-sub { font-size: 11px; margin-top: 2px; line-height: 1.45; }
.pf-banner .pb-cta { flex: none; }
.pf-banner.review { background: linear-gradient(135deg, rgba(212,148,90,.14), rgba(212,148,90,.04)); border: 1px solid rgba(212,148,90,.3); }
.pf-banner.review .pb-title { color: #B58040; }
.pf-banner.review .pb-sub { color: var(--me-text-2); }
.pf-banner.breakin { background: linear-gradient(135deg, #8A6A2E 0%, #C9A961 60%, #E8D9B5 100%); color: #fff; border: none; box-shadow: 0 4px 14px rgba(201,169,97,.3); cursor: pointer; }
.pf-banner.breakin .pb-sub { color: rgba(255,255,255,.85); }
.pf-banner.guide { background: var(--me-card); border: 1px dashed var(--me-border-strong); }

/* ---------- 页脚 ---------- */
.me-footer {
  text-align: center;
  padding: 28px 16px 8px;
  color: var(--me-text-4);
  font-size: 10.5px;
  line-height: 1.8;
}

/* ═══════════════════════════════════════════════════════════════
   V11.0 创新视觉重构 — 数字身份通行证
   设计概念：沉浸式Hero × 不对称Bento × 分层功能网格
   色彩体系：暖米白 + 古铜金 + 液态玻璃（保留原色系）
   ═══════════════════════════════════════════════════════════════ */

/* ---------- 页面基底优化 ---------- */
.profile-page { padding-bottom: 120px; }
.profile-content { padding: 0 14px; }

.me-hero-id-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255,255,255,.04);
  border-radius: 10px;
  border: 1px solid rgba(201,169,97,.12);
}
.me-hero-id-label {
  font-size: 10.5px;
  font-weight: 600;
  color: rgba(245,240,230,.5);
  width: 44px;
  flex: none;
}
.me-hero-id-value {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: rgba(245,240,230,.85);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}



/* 暗色主题适配已在:root中定义 */

/* ══════════ V12.0 浅色卡片化布局 · 专业视觉优化版 ══════════ */

/* ── CSS变量：古铜金5级色阶 ── */
:root {
  --v12-gold-50: #FAF6EE;
  --v12-gold-100: #F0E6D2;
  --v12-gold-200: #E8D9B5;
  --v12-gold-300: #D4B87A;
  --v12-gold-400: #C9A961;
  --v12-gold-500: #A98A47;
  --v12-gold-600: #8A6E35;
  --v12-text-1: #3A3226;
  --v12-text-2: #5A4E3A;
  --v12-text-3: #8A7E6A;
  --v12-text-4: #A99880;
  --v12-border: #EDE5D5;
  --v12-bg: #F5F1E8;
  --v12-shadow-1: 0 1px 3px rgba(180,160,120,.06), 0 1px 2px rgba(180,160,120,.04);
  --v12-shadow-2: 0 4px 12px rgba(180,160,120,.08), 0 2px 4px rgba(180,160,120,.06);
  --v12-shadow-3: 0 8px 24px rgba(180,160,120,.12), 0 4px 8px rgba(180,160,120,.08);
  --v12-gold-glow: 0 0 20px rgba(201,169,97,.25);
}

/* 页面背景 */
.profile-page { background: var(--v12-bg); }
.profile-content { padding: 0 12px 20px; }

/* ── 头区：暖米白→浅金渐变 + 网格纹理 + 多层光晕 ── */
.v12-header {
  background:
    linear-gradient(160deg, #FAF6EE 0%, #F0E6D2 55%, #E8D9B5 100%);
  margin: 0 -12px 12px;
  padding: 22px 16px 20px;
  position: relative;
  overflow: hidden;
}
/* 网格纹理底层 */
.v12-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,169,97,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,97,.06) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  opacity: .6;
}
/* 右上角金色光晕 */
.v12-header::after {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(201,169,97,.22) 0%, rgba(201,169,97,.08) 40%, transparent 70%);
  pointer-events: none;
}
/* 左下角装饰光晕 */
.v12-header-inner { position: relative; z-index: 1; }
.v12-header-inner::before {
  content: '';
  position: absolute;
  bottom: -40px; left: -30px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(212,184,122,.15) 0%, transparent 65%);
  pointer-events: none;
}

/* 顶部行：头像+信息+设置 */
.v12-header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
/* 头像：渐变边框 + 发光效果 */
.v12-avatar {
  flex: none;
  width: 58px; height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #E8D9B5, #C9A961);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 2px 12px rgba(201,169,97,.35),
    0 0 0 2px rgba(255,255,255,.7),
    0 0 0 4px rgba(201,169,97,.15);
  position: relative;
}
.v12-avatar::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,.4), transparent 50%);
  pointer-events: none;
}
.v12-user-info { flex: 1; min-width: 0; }
.v12-username-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.v12-username {
  font-size: 18px;
  font-weight: 800;
  color: var(--v12-text-1);
  letter-spacing: .2px;
  line-height: 1.2;
}
.v12-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.v12-usersub {
  font-size: 11.5px;
  color: var(--v12-text-3);
  margin-top: 4px;
  line-height: 1.5;
  font-weight: 500;
}
/* 设置按钮：毛玻璃 + hover旋转 */
.v12-settings-btn {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--v12-text-3);
  cursor: pointer;
  transition: all .3s cubic-bezier(.22,1,.36,1);
  border: 1px solid rgba(255,255,255,.6);
}
.v12-settings-btn:hover {
  background: rgba(255,255,255,.85);
  transform: rotate(30deg);
  box-shadow: var(--v12-gold-glow);
}
.v12-settings-btn svg { width: 16px; height: 16px; }

/* 等级进度条 */
.v12-level-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.v12-level-label, .v12-level-next {
  flex: none;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--v12-gold-500);
  letter-spacing: .5px;
}
.v12-level-bar {
  flex: 1;
  height: 6px;
  background: rgba(201,169,97,.15);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.v12-level-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--v12-gold-300), var(--v12-gold-400));
  border-radius: 999px;
  transition: width .8s cubic-bezier(.22,1,.36,1);
  position: relative;
}
.v12-level-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  animation: v12Shimmer 2s infinite;
}
@keyframes v12Shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* 双线身份 */
.v12-dualline {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.v12-dualline .me-hero-id-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.v12-dualline .me-hero-id-label {
  flex: none;
  width: 42px;
  font-size: 10px;
  font-weight: 800;
  color: var(--v12-text-4);
  letter-spacing: .8px;
  text-transform: uppercase;
}
.v12-dualline .me-hero-id-value {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--v12-text-2);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* 通用白色卡片：3级阴影 + hover上浮 */
.v12-card {
  background: #fff;
  border-radius: 16px;
  padding: 16px 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--v12-shadow-2);
  transition: all .3s cubic-bezier(.22,1,.36,1);
  position: relative;
  overflow: hidden;
}
.v12-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,169,97,.2), transparent);
}
.v12-card:hover {
  box-shadow: var(--v12-shadow-3);
  transform: translateY(-1px);
}
.v12-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.v12-card-title {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--v12-text-1);
  letter-spacing: .2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.v12-card-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: linear-gradient(180deg, var(--v12-gold-300), var(--v12-gold-500));
  border-radius: 2px;
}
.v12-card-more {
  font-size: 11.5px;
  color: var(--v12-text-4);
  cursor: pointer;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 2px;
  transition: all .2s;
}
.v12-card-more:hover {
  color: var(--v12-gold-500);
  gap: 4px;
}
.v12-card-more svg {
  width: 12px; height: 12px;
  transition: transform .2s;
}
.v12-card-more:hover svg { transform: translateX(2px); }

/* 订单状态 */
.v12-order-states {
  display: flex;
  justify-content: space-between;
}
.v12-order-states .order-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  cursor: pointer;
  padding: 6px 0;
  border-radius: 10px;
  transition: all .2s;
}
.v12-order-states .order-item:hover {
  background: rgba(201,169,97,.06);
}
.v12-order-states .order-icon {
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--v12-gold-400);
  background: linear-gradient(135deg, rgba(201,169,97,.12), rgba(201,169,97,.06));
  border-radius: 10px;
  position: relative;
}
.v12-order-states .order-icon svg { width: 18px; height: 18px; }
.v12-order-states .order-label {
  font-size: 10.5px;
  color: var(--v12-text-2);
  font-weight: 600;
}
.v12-order-states .order-badge {
  position: absolute;
  top: -4px; right: -4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  background: linear-gradient(135deg, #E06050, #D4554A);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(212,85,74,.4);
  border: 1.5px solid #fff;
}

/* 钱包行 */
.v12-wallet-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  padding: 4px 0;
}
.v12-wallet-left { flex: 1; min-width: 0; }
.v12-wallet-label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--v12-text-3);
  font-weight: 600;
  margin-bottom: 6px;
}
.v12-wallet-balance {
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.v12-wallet-cur {
  font-size: 13px;
  font-weight: 800;
  color: var(--v12-gold-500);
}
.v12-wallet-num {
  font-size: 24px;
  font-weight: 800;
  color: var(--v12-text-1);
  letter-spacing: -.8px;
  font-variant-numeric: tabular-nums;
}
.v12-wallet-actions {
  display: flex;
  gap: 8px;
  flex: none;
}
/* 按钮：渐变 + hover上浮 + 阴影加深 */
.v12-btn {
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all .25s cubic-bezier(.22,1,.36,1);
  border: none;
  position: relative;
  overflow: hidden;
}
.v12-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.25), transparent 50%);
  pointer-events: none;
}
.v12-btn:active { transform: scale(.96); }
.v12-btn-primary {
  background: linear-gradient(135deg, var(--v12-gold-300), var(--v12-gold-400));
  color: #fff;
  box-shadow: 0 3px 10px rgba(201,169,97,.35);
}
.v12-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 16px rgba(201,169,97,.45);
}
.v12-btn-ghost {
  background: rgba(201,169,97,.08);
  color: var(--v12-gold-500);
  border: 1px solid rgba(201,169,97,.25);
}
.v12-btn-ghost:hover {
  background: rgba(201,169,97,.14);
  border-color: rgba(201,169,97,.4);
}

/* 分割线 */
.v12-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--v12-border), transparent);
  margin: 14px 0;
}

/* KPI行 */
.v12-kpi-row {
  display: flex;
  justify-content: space-between;
}
.v12-kpi-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  position: relative;
  padding: 6px 0;
  border-radius: 10px;
  transition: all .2s;
}
.v12-kpi-item:hover {
  background: rgba(201,169,97,.05);
}
.v12-kpi-item + .v12-kpi-item::before {
  content: '';
  position: absolute;
  left: 0; top: 20%;
  height: 60%;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--v12-border), transparent);
}
.v12-kpi-num {
  font-size: 18px;
  font-weight: 800;
  color: var(--v12-text-1);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.v12-kpi-label {
  font-size: 10.5px;
  color: var(--v12-text-3);
  font-weight: 600;
}

/* 诚信分：紧凑胶囊（并入等级行，压缩头部高度） */
.v12-credit-chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 8px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(201,169,97,.14), rgba(201,169,97,.06));
  border: 1px solid rgba(201,169,97,.22);
}
.v12-chip-score {
  font-size: 12px;
  font-weight: 800;
  color: var(--v12-gold-500);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.3px;
}
.v12-chip-level {
  font-size: 9.5px;
  font-weight: 800;
  color: var(--v12-gold-500);
  padding: 2px 6px;
  border-radius: 999px;
  background: rgba(201,169,97,.12);
  border: 1px solid rgba(201,169,97,.18);
}
/* 权益 pills（明亮/暗色双主题） */
.id-pills-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px 2px; }
.id-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  background: rgba(255,255,255,.62);
  color: var(--v12-text-2);
  border: 1px solid rgba(201,169,97,.22);
}
.id-pill.locked { opacity: .55; }
/* 入驻到期提醒（双主题） */
.pf-banner.renew { background: linear-gradient(135deg, rgba(212,184,122,.16), rgba(212,184,122,.05)); border: 1px solid rgba(212,184,122,.35); }
.renew-ic { flex: none; width: 34px; height: 34px; border-radius: 50%; background: rgba(201,169,97,.18); display: flex; align-items: center; justify-content: center; color: #B58040; }
.renew-title { color: #8A6E35; }
.renew-cta { font-size: 11.5px; font-weight: 700; color: #8A6E35; cursor: pointer; }

/* 工具网格：图标渐变背景容器 + 5色循环 */
.v12-tool-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 8px;
}
.v12-tool-grid .tool-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  position: relative;
  padding: 4px 0;
  border-radius: 12px;
  transition: all .2s;
}
.v12-tool-grid .tool-item:hover {
  background: rgba(201,169,97,.05);
  transform: translateY(-1px);
}
.v12-tool-grid .tool-icon {
  width: 38px; height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}
.v12-tool-grid .tool-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.3), transparent 50%);
  pointer-events: none;
}
.v12-tool-grid .tool-icon svg { width: 20px; height: 20px; position: relative; z-index: 1; }
/* 5色循环 */
.v12-tool-grid .tool-item:nth-child(5n+1) .tool-icon { background: linear-gradient(135deg, rgba(201,169,97,.18), rgba(201,169,97,.08)); color: #A98A47; }
.v12-tool-grid .tool-item:nth-child(5n+2) .tool-icon { background: linear-gradient(135deg, rgba(76,175,120,.16), rgba(76,175,120,.06)); color: #3D8B5E; }
.v12-tool-grid .tool-item:nth-child(5n+3) .tool-icon { background: linear-gradient(135deg, rgba(66,133,244,.16), rgba(66,133,244,.06)); color: #3B6FD4; }
.v12-tool-grid .tool-item:nth-child(5n+4) .tool-icon { background: linear-gradient(135deg, rgba(212,85,74,.14), rgba(212,85,74,.06)); color: #C04A3E; }
.v12-tool-grid .tool-item:nth-child(5n+5) .tool-icon { background: linear-gradient(135deg, rgba(230,150,60,.16), rgba(230,150,60,.06)); color: #B87333; }
.v12-tool-grid .tool-label {
  font-size: 10.5px;
  color: var(--v12-text-2);
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
}
.v12-tool-grid .tool-badge {
  position: absolute;
  top: 0; right: 50%;
  transform: translateX(14px);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  background: linear-gradient(135deg, #E06050, #D4554A);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(212,85,74,.4);
  border: 1.5px solid #fff;
  z-index: 2;
}

/* 最近浏览滚动 */
.v12-history-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.v12-history-scroll::-webkit-scrollbar { display: none; }

/* 入场动画：精致交错 */
@keyframes v12FadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
.v12-anim {
  animation: v12FadeUp .6s cubic-bezier(.22,1,.36,1) both;
}
.v12-anim.d1 { animation-delay: .04s; }
.v12-anim.d2 { animation-delay: .09s; }
.v12-anim.d3 { animation-delay: .14s; }
.v12-anim.d4 { animation-delay: .19s; }
.v12-anim.d5 { animation-delay: .24s; }
.v12-anim.d6 { animation-delay: .29s; }

/* 暗色主题适配 */
[data-theme="dark"] {
  --v12-bg: #1A1814;
  --v12-text-1: #F0E8D8;
  --v12-text-2: #D4C8B0;
  --v12-text-3: #8A7E6A;

}
[data-theme="dark"] .profile-page { background: var(--v12-bg); }

}
[data-theme="dark"] .v12-username { color: var(--v12-text-1); }
[data-theme="dark"] .v12-usersub { color: var(--v12-text-3); }
[data-theme="dark"] .v12-settings-btn {

}
[data-theme="dark"] .v12-settings-btn:hover { background: rgba(255,255,255,.14); }
[data-theme="dark"] .v12-credit-chip {

}
[data-theme="dark"] .v12-chip-score,
[data-theme="dark"] .v12-chip-level { color: #D4B876; }
[data-theme="dark"] .v12-chip-level { background: rgba(201,169,97,.14); border-color: rgba(201,169,97,.22); }
[data-theme="dark"] .id-pill { background: rgba(255,255,255,.06); color: rgba(245,240,230,.72); border-color: rgba(201,169,97,.15); }
[data-theme="dark"] .renew-ic { color: #D4B876; }
[data-theme="dark"] .renew-title,

}

}

</style>

      }
    } catch (e) {}
    animateNum('pf-kpi-fav', fav);
    animateNum('pf-kpi-pub', pub);
    animateNum('pf-kpi-deal', deal);
    animateNum('pf-kpi-follow', follow);
  }

  function animateNum(id, target) {
    var el = document.getElementById(id);
    if (!el) return;
    var start = 0, dur = 600, t0 = null;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(start + (target - start) * eased);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

      { href:'../personnel/index.html', ic:'i-user', cls:'ic-green', title:'人才市场' }
    ];

    /* 权限解锁条件（单一来源 entryAccess：分销=入驻/个人合伙人；服务经营=中介入驻） */
    var acc = window.entryAccess ? entryAccess() : { dist: false, agency: false };
    var distUnlocked = acc.dist;
    var agencyUnlocked = acc.agency;

    q.innerHTML = items.map(function (it) {
      var unlocked = it.unlockKey === 'dist' ? distUnlocked : agencyUnlocked;
      var isLocked = it.lock && !unlocked;
      /* E1-02 游客点击任意受限功能 → 登录引导 sheet（原无反应） */
      var click = guest
        ? 'onclick="requireLoginSheet(\'登录后解锁「' + it.title + '」\')"'
        : (isLocked ? 'onclick="quickLocked(\'' + it.unlockKey + '\')"' : 'onclick="location.href=\'' + it.href + '\'"');
      var iconSvg = it.ic === 'i-rotate'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l2.5 2.5"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#' + it.ic + '"/></svg>';
      var lockStyle = isLocked ? 'opacity:.5;filter:grayscale(.5);' : '';
      return '<div class="tool-item" ' + click + ' style="' + lockStyle + '">' +
        '<div class="tool-icon" style="position:relative;">' + iconSvg +
          (it.badge ? '<span class="tool-badge">' + it.badge + '</span>' : '') +
        '</div>' +
        '<span class="tool-label">' + it.title + '</span>' +
      '</div>';
    }).join('');
  }

  /* ---------- E1-02 游客点击受限功能 → 登录引导 sheet（而非无反应/toast） ---------- */
  function isGuestNow() {
    try { return !UI.state.get().loggedIn; } catch (e) { return true; }
  }
  window.isGuestNow = isGuestNow;
  window.requireLoginSheet = function (tip) {
    var txt = tip || '登录后解锁全部功能';
    if (!window.UI || !UI.sheet) { location.href = '../auth/login.html'; return; }
    var sh = UI.sheet();
    sh.setText('登录/注册');
    sh.html(
      '<div style="padding:6px 4px 4px;text-align:center;">' +
        '<div style="font-size:34px;margin-bottom:10px;">🔐</div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--text-1);margin-bottom:6px;">登录后解锁全部功能</div>' +
        '<div style="font-size:12.5px;color:var(--text-3);line-height:1.6;margin-bottom:18px;">' + txt + '</div>' +
        '<button type="button" id="pf-login-cta" style="width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:#fff;font-size:15px;font-weight:700;cursor:pointer;">立即登录</button>' +
      '</div>'
    );
    sh.show();
    var cta = document.getElementById('pf-login-cta');
    if (cta) cta.addEventListener('click', function () { location.href = '../auth/login.html'; });
  };
  /* E1-02 钱包充值/提现：游客 → 登录引导；已登录 → 钱包页 */
  window.pfWalletAction = function (action) {
    if (isGuestNow()) { window.requireLoginSheet('充值、提现、解锁入驻等资金与交易功能均需先登录账号'); return; }
    if (action === 'view') location.href = '../wallet/index.html';
    else location.href = '../wallet/index.html?action=' + action;
  };

  /* ---------- 锁定入口点击引导（分销/服务经营/简历投递） ---------- */
  window.quickLocked = function (key) {
    var cfg = {
      dist: { title: '分销中心 · 未开通', text: '完成<b>企业入驻</b>（建筑/中介/合伙人三选一）或申请<b>个人合伙人</b>后开通分销返佣。', href: 'auth-prep.html?type=center' },
      agency: { title: '服务经营 · 未开通', text: '完成「<b>中介服务企业</b>」入驻后开通服务经营工作台：<br>服务橱窗、在线接单、托管结算、履约保证金。', href: 'entry.html' },
      resume: { title: '简历投递 · 未开通', text: '完成<b>个人入驻</b>（专业资质认证）后开通简历投递与人才展示。', href: 'auth-prep.html?type=center' }
    };
    var c = cfg[key] || { title: '功能未开通', text: '前往认证中心查看开通条件', href: 'auth-prep.html?type=center' };
    if (window.UI && UI.dialog) UI.dialog({ title: c.title, text: c.text, ok: '去开通', cancel: '取消', onOk: function () { location.href = c.href; } });
    else location.href = c.href;
  };

  /* ---------- 渲染：最近浏览 ---------- */
  function renderHistory() {
    /* 从 ViewHistory 读取最近4条真实浏览记录（仅1个月内） */
    var items = [];
    try { items = window.ViewHistory ? ViewHistory.recent(4) : []; } catch (e) { items = []; }

    var el1 = document.getElementById('pf-history');
    if (!el1) return;

    if (items.length === 0) {
      el1.innerHTML =
        '<div style="padding:20px 12px;text-align:center;color:var(--me-text-3);font-size:12.5px;">' +
          '暂无浏览记录，<span onclick="location.href=\'../supply/list.html\'" style="color:var(--me-gold-deep);cursor:pointer;font-weight:600;">去发现</span>' +
        '</div>';
      return;
    }

    /* 分类图标映射 */
    var ICONS = {
      cooperation: 'i-box', material: 'i-box', equipment: 'i-tool',
      labor: 'i-scaffold', agency: 'i-doc'
    };

    var html = items.map(function (it) {
      var icon = ICONS[it.bizKey] || 'i-doc';
      var price = it.price || '面议';
      return '<div class="history-card" onclick="location.href=\'../supply/detail.html?id=' + encodeURIComponent(it.id) + '\'">' +
        '<div class="history-img">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#' + icon + '"/></svg>' +
        '</div>' +
        '<div class="history-body">' +
          '<div class="history-name">' + (it.title || '未命名条目') + '</div>' +
          '<div class="history-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + (it.city || '未知地区') + '</div>' +
          '<div class="history-price">' + price + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el1.innerHTML = html;
  }

  /* ---------- KPI 跳转 ---------- */
  function pfKpiJump(type) {
    var map = { fav:'../favorite/index.html', pub:'../publish/records.html', deal:'../order/index.html', follow:'../distribution/index.html' };
    if (map[type]) location.href = map[type];
  }
  window.pfKpiJump = pfKpiJump;

  function openMember() {
    var st; try { st = UI.state.get(); } catch (e) { st = {}; }
    if (!st.loggedIn) {
      /* 游客：跳转登录页 */
      location.href = '../auth/login.html';
    } else {
      /* 已登录未认证：跳转认证引导页 */
      location.href = 'auth-prep.html?type=center';
    }
  }
  window.openMember = openMember;


  /* [FEAT 9.2-2] 渲染诚信分 */
  /* ---------- 渲染：等级进度条 ---------- */
  function renderLevelProgress() {
    try {
      var idy = currentIdentity();
      var cfg = ID_CFG[idy.primary] || ID_CFG.registered;
      var st = {}; try { st = UI.state.get(); } catch (e) {}
      var isGuest = !st.loggedIn || idy.primary === 'guest';
      var elNum = document.getElementById('pf-level-num');
      var elFill = document.getElementById('pf-level-fill');
      var elNext = document.getElementById('pf-level-next');
      var elBar = elFill ? elFill.parentElement : null;   /* .v12-level-bar */
      /* P3-3 游客态：不再显示 Lv.0，改为「未登录」并隐藏下一级与进度条 */
      if (isGuest) {
        if (elNum && elNum.parentElement) elNum.parentElement.textContent = '未登录';
        if (elNext && elNext.parentElement) elNext.parentElement.style.display = 'none';
        if (elBar) elBar.style.display = 'none';
        return;
      }
      var level = cfg.level || 1;
      var nextLevel = Math.min(level + 1, 5);
      var pct = (level / 5) * 100;
      if (elNum) elNum.textContent = level;
      if (elFill) elFill.style.width = pct + '%';
      if (elNext) elNext.textContent = nextLevel;
    } catch (e) {}
  }

  function renderCreditScore() {
    try {
      var me = DataBus.current(); var uid = me ? me.id : '';
      var info = window.svcCreditOf ? svcCreditOf(uid) : { score: 80, level: '新入驻' };
      var score = info.score || 80;
      var csCfg = (MOCK.business.creditScore) || { thresholds: {}, levels: [] };
      var levelLabel = '观察', levelColor = 'gray';
      (csCfg.levels || []).forEach(function (lv) {
        if (score >= lv.min) { levelLabel = lv.label; levelColor = lv.color; }
      });
      var elScore = document.getElementById('cs-score');
      var elLevel = document.getElementById('cs-level');
      if (elScore) elScore.textContent = score;
      if (elLevel) {
        elLevel.textContent = levelLabel;
        /* 暗色主题下提升徽章文字亮度，保证可读性 */
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var c = levelColor === 'gold' ? (dark ? '#D4B876' : '#C9A961')
              : levelColor === 'silver' ? (dark ? '#B0A898' : '#8A8A8A')
              : levelColor === 'bronze' ? (dark ? '#C08A4E' : '#B87333')
              : (dark ? '#8A7E6A' : '#9A9185');
        elLevel.style.color = c;
      }
    } catch (e) {}
  }
  /* [FEAT 9.2-2] 入驻年度订阅到期提醒 */
  function renderEntryRenew() {
    try {
      if (window.EntryStore && EntryStore.needRenew && EntryStore.needRenew()) {
        var banner = document.getElementById('entry-renew-banner');
        if (banner) {
          var s = EntryStore.read();
          var daysLeft = Math.ceil((s.expireAt - Date.now()) / 864e5);
          var desc = document.getElementById('entry-renew-desc');
          if (desc) desc.textContent = '剩余 ' + daysLeft + ' 天到期，续费后可继续享受全部权益';
          banner.style.display = '';
        }
      }
    } catch(e) {}
  }
  window.__renewEntry = function() {
    try {
      var s = EntryStore.read();
      var t = MOCK.entryTypeById(s.type);
      var price = (t && t.yearly) ? t.yearly.price : 0;
      var r = EntryStore.renew(price);
      if (r && r.error) { UI.toast(r.error, 'warn'); return; }
      UI.toast('续费成功，入驻有效期延长一年', 'ok');
      setTimeout(function(){ location.reload(); }, 1000);
    } catch(e) { UI.toast('续费失败: ' + e.message, 'warn'); }
  };

  /* ---------- 初始化 ---------- */
  var _pfInited = false;
  function init() {
    renderHeader();
    renderDualLine();        /* E1-12 双线身份 + 入驻徽标（先用 innerHTML 渲染双线） */
    renderIdentity();        /* 再追加权益 pills 与徽章，避免被 renderDualLine 的 innerHTML 整体覆盖 */
    renderEntryBanner();     /* E1-19 入驻审核中横幅 */
    renderBreakinBanner();   /* E2 破冰期建筑入驻横幅 */
    renderBannedBanner();    /* E3-17 封禁横幅 */
    renderCreditGuide();     /* E2 诚信分游客引导 */
    renderKPI();
    renderWallet();
    renderOrderStates();
    renderQuick();
    renderHistory();
    renderCreditScore();
    renderLevelProgress();
    renderEntryRenew(); /* [FEAT 9.2-2] */
    renderFooterUid();  /* P3-2 页脚 UID 动态化 */
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* E1-11 身份/入驻/存储变化后重新渲染整个页面（认证/入驻返回自动刷新） */
  window.addEventListener('engchain:auth', init);
  window.addEventListener('engchain:entry', init);
  window.addEventListener('engchain:store-change', init);
  window.addEventListener('engchain:state', init);
  window.addEventListener('storage', function (e) {
    if (e.key && e.key.indexOf('engchain-') === 0) init();
  });
})();
</script>
</body>
</html>
