<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按钮样式集 · 明暗双模式</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* ============ 演示容器 ============ */
  .demo-section {
    min-height: 50vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px 20px;
  }

  .section-label {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .row {
    display: flex;
    gap: 80px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .item-label {
    font-size: 12px;
    opacity: 0.45;
    letter-spacing: 1px;
    font-family: "SF Mono", Consolas, monospace;
  }

  /* ================================================
     按钮 1: btn-gold-glow（金色发光）
     ================================================ */
  .btn-gold-glow {
    position: relative;
    display: inline-block;
  }

  .btn-gold-glow__halo {
    position: absolute;
    left: 50%;
    pointer-events: none;
    filter: blur(14px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 0;
  }

  .btn-gold-glow__button {
    position: relative;
    z-index: 1;
    padding: 16px 56px;
    font-size: 16px;
    letter-spacing: 5px;
    text-indent: 5px;
    border-radius: 14px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .demo-section--dark {
    background: #0d0d0d;
  }
  .demo-section--dark .section-label { color: #ffd7a0; }
  .demo-section--dark .item-label { color: #aaa; }

  .btn-gold-glow--dark .btn-gold-glow__halo {
    top: 55%;
    transform: translate(-50%, -50%);
    width: 170%;
    height: 200%;
    background: radial-gradient(
      ellipse 55% 60% at 50% 45%,
      rgba(255, 240, 210, 0.5) 0%,
      rgba(253, 196, 142, 0.35) 20%,
      rgba(224, 155, 113, 0.25) 40%,
      rgba(169, 113, 84, 0.15) 60%,
      rgba(74, 43, 30, 0.06) 80%,
      transparent 100%
    );
  }
  .btn-gold-glow--dark .btn-gold-glow__button {
    font-weight: 400;
    color: #FFFBF2;
    background: linear-gradient(180deg, #1a1512 0%, #141110 50%, #0f0d0c 100%);
    border: 1px solid rgba(255, 200, 140, 0.08);
    box-shadow:
      inset 0 1px 1px rgba(255, 220, 180, 0.05),
      inset 0 -1px 2px rgba(0, 0, 0, 0.6),
      inset 0 0 20px rgba(169, 113, 84, 0.06),
      0 2px 8px rgba(0, 0, 0, 0.5);
    text-shadow:
      0 0 8px rgba(255, 245, 220, 0.6),
      0 0 20px rgba(255, 210, 150, 0.35),
      0 0 40px rgba(224, 155, 113, 0.2);
  }
  .btn-gold-glow--dark:hover .btn-gold-glow__halo {
    transform: translate(-50%, -50%) scale(1.1);
    opacity: 1.15;
  }
  .btn-gold-glow--dark:hover .btn-gold-glow__button {
    border-color: rgba(255, 200, 140, 0.18);
  }
  .btn-gold-glow--dark:active .btn-gold-glow__button {
    transform: translateY(1px);
  }

  .demo-section--light {
    background: #f0f0f0;
  }
  .demo-section--light .section-label { color: #555; }
  .demo-section--light .item-label { color: #666; }

  .btn-gold-glow--light .btn-gold-glow__halo {
    top: 50%;
    transform: translate(-50%, -50%);
    width: 160%;
    height: 180%;
    background: radial-gradient(
      ellipse 55% 55% at 50% 50%,
      rgba(255, 200, 120, 0.35) 0%,
      rgba(230, 160, 80, 0.2) 30%,
      rgba(200, 130, 60, 0.08) 60%,
      transparent 100%
    );
  }
  .btn-gold-glow--light .btn-gold-glow__button {
    font-weight: 500;
    color: #6b3f14;
    background: linear-gradient(180deg, #fffaf0 0%, #fdf2dc 100%);
    border: 1px solid rgba(180, 120, 50, 0.2);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      0 2px 8px rgba(180, 120, 50, 0.08);
  }
  .btn-gold-glow--light:hover .btn-gold-glow__halo {
    transform: translate(-50%, -50%) scale(1.08);
    opacity: 1.15;
  }
  .btn-gold-glow--light:active .btn-gold-glow__button {
    transform: translateY(1px);
  }

  /* ================================================
     按钮 2: btn-liquid-glass（液态玻璃 · 翡翠绿）
     ================================================ */
  .btn-liquid-glass {
    position: relative;
    display: inline-block;
  }

  .btn-liquid-glass__button {
    position: relative;
    padding: 16px 56px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 5px;
    text-indent: 5px;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    outline: none;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  .btn-liquid-glass__button::before {
    content: '';
    position: absolute;
    left: 4%;
    right: 4%;
    top: 2px;
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(200, 255, 220, 0.8) 20%,
      rgba(220, 255, 230, 0.9) 50%,
      rgba(200, 255, 220, 0.8) 80%,
      transparent 100%
    );
    border-radius: 50%;
    pointer-events: none;
  }

  .btn-liquid-glass__button::after {
    content: '';
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 10%;
    height: 30%;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(180, 255, 210, 0.35) 30%,
      rgba(200, 255, 220, 0.5) 50%,
      rgba(180, 255, 210, 0.3) 75%,
      transparent 100%
    );
    border-radius: 50%;
    pointer-events: none;
  }

  .btn-liquid-glass--dark .btn-liquid-glass__button {
    background: linear-gradient(
      180deg,
      #0a4a24 0%,
      #0d6b32 15%,
      #108240 35%,
      #18a055 55%,
      #22d080 72%,
      #4de8a0 82%,
      #28b068 92%,
      #1a7a42 100%
    );
    box-shadow:
      inset 0 2px 3px rgba(0, 30, 15, 0.4),
      inset 1px 0 1px rgba(255, 255, 255, 0.1),
      inset -1px 0 1px rgba(0, 30, 15, 0.2),
      inset 0 -3px 6px rgba(0, 40, 20, 0.35),
      0 10px 32px rgba(5, 80, 40, 0.45),
      0 3px 10px rgba(0, 0, 0, 0.4);
    text-shadow: 0 1px 3px rgba(0, 50, 25, 0.5);
  }
  .btn-liquid-glass--dark:hover .btn-liquid-glass__button {
    transform: translateY(-2px);
  }
  .btn-liquid-glass--dark:active .btn-liquid-glass__button {
    transform: translateY(2px);
  }

  .btn-liquid-glass--light .btn-liquid-glass__button {
    background: linear-gradient(
      180deg,
      #0d6b35 0%,
      #128a45 18%,
      #18a858 38%,
      #22c870 58%,
      #3de895 75%,
      #70f0b8 85%,
      #28b868 95%,
      #188045 100%
    );
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.25),
      inset 1px 0 1px rgba(255, 255, 255, 0.15),
      inset -1px 0 1px rgba(0, 50, 25, 0.15),
      inset 0 -3px 6px rgba(0, 50, 25, 0.25),
      0 12px 36px rgba(10, 140, 70, 0.35),
      0 4px 10px rgba(0, 0, 0, 0.1);
    text-shadow: 0 1px 2px rgba(0, 70, 35, 0.4);
  }
  .btn-liquid-glass--light:hover .btn-liquid-glass__button {
    transform: translateY(-2px);
  }
  .btn-liquid-glass--light:active .btn-liquid-glass__button {
    transform: translateY(2px);
  }

  /* ================================================
     按钮 3: btn-neu（新拟态 / Neumorphism）
     深灰按钮 · 凸起/凹陷双状态
     ================================================ */
  .btn-neu {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .btn-neu__button {
    position: relative;
    padding: 16px 56px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 5px;
    text-indent: 5px;
    color: #e8e8e8;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    outline: none;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 电话图标 */
  .btn-neu__icon {
    width: 18px;
    height: 18px;
    opacity: 0.9;
  }

  /* ---- 凸起状态（默认 / 点击前） ---- */
  .btn-neu--raised .btn-neu__button {
    background: linear-gradient(
      180deg,
      #3a3a3a 0%,
      #525252 30%,
      #4e4e4e 70%,
      #484848 100%
    );
    /* 外部投影：新拟态核心 */
    box-shadow:
      /* 上方浅阴影（光源从上方来） */
      -6px -6px 12px rgba(255, 255, 255, 0.7),
      6px 6px 16px rgba(0, 0, 0, 0.15),
      /* 下方更深的投影 */
      8px 10px 20px rgba(0, 0, 0, 0.12),
      /* 顶部内侧微亮边 */
      inset 0 1px 1px rgba(255, 255, 255, 0.08);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  .btn-neu--raised:hover .btn-neu__button {
    box-shadow:
      -6px -6px 12px rgba(255, 255, 255, 0.8),
      6px 6px 16px rgba(0, 0, 0, 0.18),
      10px 14px 24px rgba(0, 0, 0, 0.15),
      inset 0 1px 1px rgba(255, 255, 255, 0.1);
  }

  /* ---- 凹陷状态（点击后 / active） ---- */
  .btn-neu--inset .btn-neu__button {
    background: linear-gradient(
      180deg,
      #383838 0%,
      #454545 30%,
      #484848 70%,
      #404040 100%
    );
    /* 内阴影：凹陷效果 */
    box-shadow:
      /* 顶部内侧暗 */
      inset 4px 4px 10px rgba(0, 0, 0, 0.35),
      /* 底部内侧微亮 */
      inset -3px -3px 8px rgba(255, 255, 255, 0.05),
      /* 外部投影减弱 */
      2px 2px 8px rgba(0, 0, 0, 0.08);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  /* ================================================
     按钮 4: btn-neon（橙红霓虹发光）
     底部发光 · 点击前/后双状态
     ================================================ */
  .btn-neon {
    position: relative;
    display: inline-block;
  }

  .btn-neon__button {
    position: relative;
    padding: 16px 56px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 5px;
    text-indent: 5px;
    color: #ffffff;
    border: 2px solid;
    border-radius: 14px;
    cursor: pointer;
    outline: none;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ---- 点击前（默认 / 未激活） ---- */
  .btn-neon--default .btn-neon__button {
    color: #666;
    background: linear-gradient(
      180deg,
      #1a0a05 0%,
      #120804 50%,
      #0d0603 100%
    );
    border-color: #3a1a0a;
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, 0.5),
      inset 0 -1px 1px rgba(255, 100, 0, 0.05);
    text-shadow: none;
  }

  /* ---- 点击后（激活 / 发光） ---- */
  .btn-neon--active .btn-neon__button {
    color: #FFF7DA;
    /* 垂直渐变：上深下亮，底部最亮 */
    background: linear-gradient(
      180deg,
      #6c2d12 0%,
      #4b1c09 30%,
      #3a1508 50%,
      #5a2008 70%,
      #a02f10 88%,
      #f06800 100%
    );
    /* 边框：底部亮，顶部稍暗 */
    border-color: #c4310a;
    /* 多层阴影：内发光 + 底部外光晕 */
    box-shadow:
      /* 底部内发光（玻璃厚度） */
      inset 0 -2px 8px rgba(255, 120, 0, 0.4),
      /* 顶部内侧暗边 */
      inset 0 2px 4px rgba(0, 0, 0, 0.4),
      /* 底部外光晕投影 */
      0 8px 32px rgba(230, 70, 0, 0.4),
      0 4px 12px rgba(230, 70, 0, 0.2),
      /* 边框发光 */
      0 0 20px rgba(230, 80, 0, 0.3);
    /* 文字发光 */
    text-shadow:
      0 0 10px rgba(255, 200, 100, 0.6),
      0 0 24px rgba(255, 150, 50, 0.4);
  }
</style>
</head>
<body>

  <!-- ============ 暗色模式 ============ -->
  <section class="demo-section demo-section--dark">
    <div class="section-label">暗色模式 / Dark</div>
    <div class="row">
      <div class="item">
        <div class="btn-gold-glow btn-gold-glow--dark">
          <div class="btn-gold-glow__halo"></div>
          <button class="btn-gold-glow__button">提交</button>
        </div>
        <div class="item-label">btn-gold-glow--dark</div>
      </div>
      <div class="item">
        <div class="btn-liquid-glass btn-liquid-glass--dark">
          <button class="btn-liquid-glass__button">提交</button>
        </div>
        <div class="item-label">btn-liquid-glass--dark</div>
      </div>
      <div class="item">
        <div class="btn-neon btn-neon--default">
          <button class="btn-neon__button">提交</button>
        </div>
        <div class="item-label">btn-neon--default</div>
      </div>
      <div class="item">
        <div class="btn-neon btn-neon--active">
          <button class="btn-neon__button">提交</button>
        </div>
        <div class="item-label">btn-neon--active</div>
      </div>
    </div>
  </section>

  <!-- ============ 明亮模式 ============ -->
  <section class="demo-section demo-section--light">
    <div class="section-label">明亮模式 / Light</div>
    <div class="row">
      <div class="item">
        <div class="btn-gold-glow btn-gold-glow--light">
          <div class="btn-gold-glow__halo"></div>
          <button class="btn-gold-glow__button">提交</button>
        </div>
        <div class="item-label">btn-gold-glow--light</div>
      </div>
      <div class="item">
        <div class="btn-liquid-glass btn-liquid-glass--light">
          <button class="btn-liquid-glass__button">提交</button>
        </div>
        <div class="item-label">btn-liquid-glass--light</div>
      </div>
      <div class="item">
        <!-- 凸起状态 -->
        <div class="btn-neu btn-neu--raised">
          <button class="btn-neu__button">
            提交
            <svg class="btn-neu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </button>
        </div>
        <div class="item-label">btn-neu--raised</div>
      </div>
      <div class="item">
        <!-- 凹陷状态 -->
        <div class="btn-neu btn-neu--inset">
          <button class="btn-neu__button">
            提交
            <svg class="btn-neu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </button>
        </div>
        <div class="item-label">btn-neu--inset</div>
      </div>
    </div>
  </section>

</body>
</html>
