<style>
/* 灵动岛「待执行信息提醒」live 组件接管顶部硬件后，隐藏 common.js 注入的静态占位灵动岛：
   iPhone 由组件自绘可 morph 的黑岛；Pura 等打孔机型 idle 只透出设备外壳自带的前置打孔。
   标记类用独立名 di-alert-on，避免与组件内部 .di-live 内容层类名冲突。 */
body.di-alert-on .dynamic-island { display: none !important; }
</style>
<script>
/* 正版接入：以「灵动岛 / 打孔」待执行信息提醒，替换原 PendingAlerts 顶部下拉横幅。
   · 机型：优先读 preview 外壳持久化 engchain-shell；缺省按视口高度判定（与 common.js Pura 布局同口径 <=720）。
   · Pura 等打孔机型：前置镜头由 preview 设备外壳 .pura-cam 提供，组件用 externalAnchor 不自绘镜头，
     idle 整条提醒卡隐藏、只透出外壳打孔，避免「双镜头」。
   · 对既有业务暴露 window.PendingAlerts（add/remove/clear/dismissAll/getActive），Delegates 等调用方零改动。
   · 外壳在 iPhone/Pura 间移动同一 iframe（不重载、只 resize），故跨 720 阈值时销毁重建并自动重放未处理事项。 */
(function () {
  function currentModel() {
    var shell = '';
    try { shell = localStorage.getItem('engchain-shell') || ''; } catch (e) {}
    if (shell === 'pura' || shell === 'iphone') return shell;
    return window.innerHeight <= 720 ? 'pura' : 'iphone';
  }
  var holder = { island: null, items: [] };   /* 尚未处理的提醒原始对象（含按钮回调），按 id 去重 */
  function upsert(a) {
    if (!a || a.id == null) { holder.items.push(a); return; }
    for (var i = 0; i < holder.items.length; i++) {
      if (holder.items[i] && holder.items[i].id === a.id) { holder.items[i] = a; return; }
    }
    holder.items.push(a);
  }
  function drop(id) { holder.items = holder.items.filter(function (a) { return a && a.id !== id; }); }
  function mount() {
    if (!window.DynamicIsland) return;
    if (holder.island) { try { holder.island.destroy(); } catch (e) {} holder.island = null; }
    var model = currentModel();
    holder.island = window.DynamicIsland.create(document.body, {
      model: model,
      externalAnchor: model === 'pura',
      /* ✕ 关闭等组件内部移除路径也同步清掉 holder 缓存，杜绝切机型重建后已处理事项复活 */
      onRemove: function (id) { drop(id); },
      onClear: function () { holder.items = []; }
    });
    document.body.classList.add('di-alert-on');
    holder.items.forEach(function (a) { holder.island.add(a); });
  }
  /* 兼容旧组件契约：业务侧（Delegates.maybeShowOrderPopup 等）无需改动 */
  window.PendingAlerts = {
    add: function (a) { upsert(a); if (holder.island) return holder.island.add(a); },
    remove: function (id) { drop(id); if (holder.island) return holder.island.remove(id); },
    clear: function () { holder.items = []; if (holder.island) return holder.island.clear(); },
    dismissAll: function () { holder.items = []; if (holder.island) return holder.island.clear(); },
    getActive: function () {
      return holder.island ? holder.island.getActive()
                           : holder.items.map(function (a) { return a && a.id; });
    }
  };
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
  /* 跨 720 阈值（外壳切换）才重建；普通尺寸波动不触发 */
  var rzTimer = null, lastModel = currentModel();
  window.addEventListener('resize', function () {
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function () {
      var m = currentModel();
      if (m !== lastModel) { lastModel = m; mount(); }
    }, 180);
  });
})();
</script>

  var acTimer = null;
  function initInfeedCarousel() {
    var track = document.getElementById('ac-track');
    var dots = document.getElementById('ac-dots');
    if (!track || !dots) return;
    clearInterval(acTimer);

  /* ---- 重点项目 / 共创 轮播：自动 + 指示点 + 触摸拖动 ---- */

    var dn = hdots.querySelectorAll('.hc-dot');

    var sx = 0, ddx = 0, dragging = false;
    htrack.addEventListener('touchstart', function (e) { dragging = true; sx = e.touches[0].clientX; ddx = 0; clearInterval(htimer); htrack.style.transition = 'none'; }, { passive: true });
    htrack.addEventListener('touchmove', function (e) { if (!dragging) return; ddx = e.touches[0].clientX - sx; htrack.style.transform = 'translateX(calc(-' + hi * 100 + '% + ' + ddx + 'px))'; }, { passive: true });
    function endDrag() {

    }
    htrack.addEventListener('touchend', endDrag);
    htrack.addEventListener('touchcancel', endDrag);

  /* ---- 定位：仅显示城市名（不显示区县）；未获取城市时显示「设置城市」文字链接 ---- */
  (function () {
    var loc = document.getElementById('app-location');

    if (!loc || !locText) return;

    /* 把任意地域字符串规整为「城市名」：去分隔符 / 省市后缀 / 区县，无法识别则返回空 */
    function cityOnly(raw) {
      if (!raw) return '';
      var s = String(raw).trim();
      if (!s) return '';
      var lookup = (window.UI && UI.cityLookup) ? UI.cityLookup : null;
      if (lookup) {
        /* 取命中最长的已知城市（如「成都市 · 高新区 / 四川省成都市 / 成都高新区」→ 成都） */
        var best = '', bl = 0;
        Object.keys(lookup).forEach(function (c) {
          if (c.length > bl && s.indexOf(c) > -1) { best = c; bl = c.length; }
        });
        if (best) return best;
        /* 直辖市：北京 / 上海 / 天津 / 重庆（含或不含「市」） */
        var k = s.replace(/\s+/g, '');
        if (k === '北京市' || k === '北京') return '北京';
        if (k === '上海市' || k === '上海') return '上海';
        if (k === '天津市' || k === '天津') return '天津';
        if (k === '重庆市' || k === '重庆') return '重庆';
      }
      return '';
    }

    /* 城市来源优先级：本地保存 → 已认证地域兜底；两者都取城市名 */
    function resolveCity() {
      try { var s = localStorage.getItem('engchain-city') || ''; if (s) return cityOnly(s); } catch (e) {}
      try {
        var au = (window.AuthStore && AuthStore.read) ? AuthStore.read() : {};
        var en = au.enterprise || {};
        var basic = (au.personalEntry && au.personalEntry.profile && au.personalEntry.profile.basic) || {};
        var region = en.region || basic.location || '';
        if (region) return cityOnly(region);
      } catch (e) {}
      return '';
    }

    function renderLocation() {
      var city = resolveCity();
      if (city) {
        /* 旧数据迁移：把可能含区县的旧值规整为城市名后写回，保持存储口径统一 */
        try { localStorage.setItem('engchain-city', city); } catch (e) {}
        locText.textContent = city;
        loc.classList.add('set');
        loc.classList.remove('loc-empty');
        loc.setAttribute('aria-label', '切换城市，当前：' + city);

        locText.textContent = '设置城市';

        loc.classList.add('loc-empty');
        loc.setAttribute('aria-label', '设置城市');

  var FLOW_KEYS = {

  function mergedCatalog() {
    /* [观察项-1] 优先走 DataBus.getListing（MOCK ∪ SupplyStore.active ∪ 本人 pending ∪ PublishStore 正式项，去重）；
       未挂 databus 时回退本地合并，保证降级可用。默认视角 active，不并入他人 pending。 */
    try {
      if (window.DataBus && DataBus.getListing) return DataBus.getListing({});

    try { if (window.PublishStore && PublishStore.list) published = PublishStore.list() || []; } catch (e) {}
    var seen = {}, out = [];

  /* 键可命中 bizKey 或 typeKey（D 层归一后记录带 typeKey），兼容旧键 */

    var all = mergedCatalog();
    if (key === 'all') return all.filter(function (x) { return FLOW_KEYS[flow].indexOf(x.bizKey) >= 0 || FLOW_KEYS[flow].indexOf(x.typeKey) >= 0; });

      '<div class="e-title">该分类下暂无供需信息</div>' +
      '<div class="e-desc">换个分类看看，或发布一条供需让需求方找到你</div>' +
      '<div class="es-actions">' + hook + '</div>' +
      '<div class="es-note">' + perk + '</div>' +
    '</div>';
  }

  /* [V-P1-03] 运输（车队/运力）从 Cards 分流，首页自建运输轨，确保供应/需求两态运输卡稳定上首页 */
  function isTransport(x) { return x.bizKey === 'transport' || /^transport-/.test(x.typeKey || ''); }
  function escT(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function transportRailHtml(list) {
    if (!list || !list.length) return '';
    var rows = list.map(function (x) {
      var isD = x.role === 'demand' || x.dir === 'demand' || x.typeKey === 'transport-demand';
      /* S0 方向徽章：需求 b-demand（蓝）/ 供应 b-supply（墨），片A state.css 提供权威配色 */
      var badge = isD
        ? '<span class="trp-badge b-demand">需求</span>'
        : '<span class="trp-badge b-supply">供应</span>';
      var price = isD ? (x.budget || '面议') : (x.price || '面议');
      var loc = x.location || x.city || '';
      var tk = x.typeKey || (isD ? 'transport-demand' : 'transport-supply');
      return '<a href="pages/supply/detail.html?id=' + encodeURIComponent(x.id) + '&typeKey=' + escT(tk) + '" class="trp-card">'
        + '<div class="trp-top">' + badge + '<span class="trp-sub">运输·' + escT(x.sub || x.subCate || '整车货运') + '</span></div>'
        + '<div class="trp-title">' + escT(x.title || '') + '</div>'
        + '<div class="trp-bottom">'
        + '<span class="trp-price">' + escT(price) + '</span>'
        + (loc ? '<span class="trp-loc"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.2-7-11a7 7 0 1 1 14 0c0 5.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>' + escT(loc) + '</span>' : '')
        + '</div></a>';
    }).join('');
    return '<div class="trp-rail"><div class="trp-rail-title">车队运力 · 整车货运</div>' + rows + '</div>';
  }
  /* 首页专属卡片重排（仅作用于 #tab-list，不改共享模板 common.js）：
     ① 发布方公司名 .jc-company 从价格行移到城市 meta 行右侧；
     ② 价格 .jc-price 移到底部 CTA 行左侧，并删除「联系方式查看详情后可见」说明。
     幂等：重复渲染后节点已在目标位置，重复移动无副作用。 */
  function homeRelayout() {
    tabList.querySelectorAll('a.job-card').forEach(function (card) {
      var footRow = card.querySelector('.sc-foot-row');
      var company = footRow ? footRow.querySelector(':scope > .jc-company') : null;
      var price = footRow ? footRow.querySelector(':scope > .jc-price') : null;
      /* meta 行：招商/买卖卡在 .sc-main 内，招聘/人才卡为卡片直接子级，两种都命中 */
      var meta = card.querySelector('.sc-main .jc-meta') || card.querySelector(':scope > .jc-meta');
      // ① 公司名 → 城市 meta 行右侧
      if (company && meta) meta.appendChild(company);
      // ② 价格 → 底部 CTA 行左侧，删除说明文字
      var foot = card.querySelector('.sc-card-foot');
      if (foot) {
        var hint = foot.querySelector('.sc-foot-hint');
        var cta = foot.querySelector('.sc-foot-cta');
        if (price && price.textContent.trim()) {
          if (hint) hint.remove();
          if (cta) foot.insertBefore(price, cta);
          else foot.appendChild(price);
        }
      }
      // ③ 价格/公司都移走后，移除空的价格行
      if (footRow && !footRow.textContent.trim()) footRow.remove();
    });
  }
  function renderList() {
    var all = listFor(currentFlow, currentSub);
    var trans = all.filter(isTransport);
    var others = all.filter(function (x) { return !isTransport(x); });
    var html = window.Cards.render(others);
    if (!html) html = renderEmptyState();
    html += transportRailHtml(trans);
    tabList.innerHTML = html;
    homeRelayout();
    injectInfeedCarousel();
  }
  /* 查看全部：供需→发现页；资源→对应专门页（资质招商/建企买卖/人员招聘/持证人才） */
  function updateMoreLink() {
    if (currentFlow === 'resource') {
      /* 资源"全部"：首页已内联完整展示，隐藏查看全部 */
      if (currentSub === 'all') { subMore.style.display = 'none'; return; }
      subMore.style.display = '';
      var R = {
        franchise: 'pages/franchise/index.html',
        trade: 'pages/trade/index.html',
        personnel: 'pages/personnel/index.html',
        talent: 'pages/personnel/index.html?tab=talent',
        'franchise-demand': 'pages/franchise/index.html?demand=1',
        'trade-demand': 'pages/trade/index.html?demand=1'
      };
      subMore.href = R[currentSub] || '';
      return;
    }
    subMore.style.display = '';
    if (currentSub === 'all') {
      /* 供需"全部"：首页已内联完整展示，隐藏查看全部（与资源一致） */
      subMore.style.display = 'none';
      return;
    }
    subMore.href = 'pages/supply/list.html';
  }
  function moveInd(item) {
    var sr = subScroll.getBoundingClientRect(), ir = item.getBoundingClientRect();
    var x = Math.round(ir.left - sr.left + subScroll.scrollLeft);
    var w = Math.round(ir.width);
    subInd.style.transform = 'translateX(' + x + 'px)';
    subInd.style.width = w + 'px';
  }
  function renderSubs(flow) {
    currentFlow = flow; currentSub = 'all';
    subScroll.innerHTML = SUBTABS[flow].map(function (t) {
      var n = countFor(flow, t.key);
      return '<button type="button" class="sub-item' + (t.key === 'all' ? ' active' : '') + '" data-key="' + t.key + '"><span class="sub-label">' + t.label + '</span><span class="sub-cnt">' + n + '</span></button>';
    }).join('');
    subScroll.appendChild(subInd);
    subScroll.scrollLeft = 0;
    var first = subScroll.querySelector('.sub-item');
    if (first) moveInd(first);
    renderList();
    updateMoreLink();
  }
  subScroll.addEventListener('click', function (e) {
    var btn = e.target.closest('.sub-item');
    if (!btn) return;
    currentSub = btn.dataset.key;
    subScroll.querySelectorAll('.sub-item').forEach(function (x) { x.classList.toggle('active', x === btn); });
    moveInd(btn);
    renderList();
    updateMoreLink();
    /* 手动滚动 sub-scroll，使选中项水平居中；避免 scrollIntoView 递归滚动外层 .scroll 导致整页左移 */
    var targetLeft = btn.offsetLeft - (subScroll.clientWidth - btn.offsetWidth) / 2;
    var maxLeft = Math.max(0, subScroll.scrollWidth - subScroll.clientWidth);
    subScroll.scrollTo({ left: Math.max(0, Math.min(targetLeft, maxLeft)), behavior: 'smooth' });
  });
  segItems.forEach(function (it) { it.addEventListener('click', function () { segItems.forEach(function (x) { x.classList.toggle('active', x === it); }); renderSubs(it.dataset.flow); }); });
  /* 手势优先级：在 #tab-list 上左右滑 → 先滚二级分类条 → 到头切 资源/供需 → 再到头切主页面 */
  function switchFlow(f){ segItems.forEach(function(x){ x.classList.toggle('active', x.dataset.flow===f); }); renderSubs(f); }
  window.__SWIPE_ZONES__ = window.__SWIPE_ZONES__ || [];
  window.__SWIPE_ZONES__.push({
    trigger: '#tab-list',
    consumers: [
      { type: 'scroll', el: '#sub-scroll' },
      { type: 'seg',
        canNext: function () { return currentFlow === 'resource'; },
        next:    function () { switchFlow('match'); },
        canPrev: function () { return currentFlow === 'match'; },
        prev:    function () { switchFlow('resource'); } }
    ]
  });
  renderSubs('resource');
})();
</script>
<script src="js/wonder-engine.js"></script>
<script src="js/wonder-popup.js"></script>
<script src="js/wonder-bootstrap.js"></script>
</body>
